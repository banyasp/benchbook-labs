case:
  id: DR-OHA-26-0047-revise1@v1
  title: Restoration of Access Authorization under Guideline F [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires an access authorization. The Local
    Security Office raised security concerns under Guideline F because of the Individual’s delinquent debts and a history
    of not meeting financial obligations. The Individual presented evidence that the debts have been resolved, that he is
    participating in a financial coaching program, and that his credit report from April 2026 indicates he is current on all
    accounts with no past‑due balances. The regulations governing the proceeding impose a presumption against granting or
    restoring a clearance and require the Individual to demonstrate that granting will not endanger security. At the hearing,
    the Administrative Judge must decide whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline F?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: false
    O2:
      do: The Administrative Judge holds the decision pending additional financial documentation.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline F based on the Individual’s delinquent debts
      and history of not meeting financial obligations.
  - id: F3
    kind: situation
    status: confirmed
    fact: Around 2009 the Individual filed for Chapter 7 bankruptcy, discharging approximately $150,000 of debts.
  - id: F4
    kind: situation
    status: confirmed
    fact: In July 2025 the Individual had two past‑due debts (Debt A about $8,000 in collections and Debt B $3,500 charged‑off)
      that were later settled, with Debt A paid off in December 2025 and a payment plan for Debt B with payments made through
      April 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual has been participating in a financial coaching program through his employer’s employee assistance
      program and has created a budget with a certified financial coach.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual’s credit report from April 2026 indicates he is current on all accounts with no past‑due balances.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating it possessed reliable information creating substantial
      doubt about the Individual’s eligibility for access authorization.
  - id: F8
    kind: situation
    status: confirmed
    fact: The regulations in Part 710 impose a presumption against granting or restoring a clearance and require the Individual
      to prove that granting will not endanger the common defense and security.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Debt A is paid and Debt B is on a payment plan, but the record lacks independent verification that the plan will
      be maintained, so additional financial documentation is needed before restoration.
  - id: C2
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: Participation in the employer-sponsored coaching program shows effort, yet the judge has no formal certification
      that the program meets DOE remediation standards, warranting further proof.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The April 2026 credit report is current, but it does not address potential hidden obligations or upcoming liabilities;
      additional documentation would confirm sustained financial stability.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although Part 710 presumes against granting a clearance, the regulation also allows the individual to overcome that
      presumption by presenting sufficient mitigating evidence.
  - id: C5
    facts:
    - F3
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The bankruptcy and earlier financial distress occurred many years ago and were largely beyond the Individual’s control,
      satisfying mitigating factor (a) that the behavior is unlikely to recur.
  reasoning:
    read: The LSO raised a Guideline F concern based on past delinquent debts. The record shows debt repayment and coaching,
      but the judge lacks conclusive proof that these mitigations are durable, creating uncertainty about future reliability.
    weighing: Because the mitigating evidence is now treated as weak and only supports a provisional finding, the judge must
      hold the decision pending further financial documentation rather than restore immediately. The presumption against granting
      remains significant, and without stronger proof the balance tips toward a hold.
    tradecraft: The decision is entered as a hold pending additional documentation, citing the specific exhibits and noting
      the need for further verification of debt-resolution and coaching effectiveness.
    uncertainty: Moderate; while documented payments exist, the durability of the remediation effort is not fully verified,
      creating risk that undisclosed obligations could emerge.
    handoff: The Administrative Judge decides alone, but the hold triggers a follow-up request for supplemental financial
      records before a final determination.
    tempting_wrong:
      option: O1
      pull: The strong-appearing evidence of debt repayment and coaching could tempt the judge to restore the clearance now.
      why_wrong: Restoring without complete verification of ongoing financial stability would contravene the regulatory presumption
        and could expose the program to future security risk.
    rejected:
      O1: Restoration is premature without confirming that the payment plan will continue and that the coaching program meets
        DOE standards.
      O3: Denial ignores the documented mitigation and would be unnecessarily punitive given the evidence of debt resolution.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual failed to resolve Debt A or missed payments on Debt B, leaving an outstanding balance.
      then: O1
      why: If debts remained unresolved, the presumption could be overcome only by full remediation, supporting immediate
        restoration.
    - id: flip2
      if: The Individual discontinued participation in the financial-coaching program and showed no budgeting improvements.
      then: O3
      why: The loss of a good-faith remediation effort would remove mitigating factor (c), undermining the finding that the
        security concern is resolved.
    would_not_change:
    - id: noflip1
      if: The Individual's past bankruptcy remains on his record but is over a decade old.
      why: The age and circumstances of the bankruptcy satisfy mitigating factor (a); it does not by itself re-ignite the
        security concern.
    watch_for:
    - id: watch1
      what: Any new delinquent debt appearing on future credit reports.
      favors:
      - O3
      why: A new financial lapse would indicate a recurrence of the behavior that originally raised Guideline F concerns.
  lesson: When mitigating evidence is not fully verified, the appropriate response under Guideline F is to hold pending additional
    documentation rather than restore or deny outright.
  limits: This approach applies only when the record contains partial but not conclusive proof of debt resolution or remediation;
    it does not apply where full, verifiable evidence is already on file.
