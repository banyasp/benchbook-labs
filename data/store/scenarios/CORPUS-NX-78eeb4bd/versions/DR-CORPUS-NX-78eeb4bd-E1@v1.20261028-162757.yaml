case:
  id: DR-CORPUS-NX-78eeb4bd-E1@v1
  title: Wartime Cryptanalytic Jurisdiction
  status: draft
  setting: United States, July 1942, the President and the Joint Chiefs of Staff
  decider: The President
  agent: The President
  agent_role: decide
  situation: By spring 1942, several U.S. agencies, including the State Department, FBI, and FCC, had begun their own communications-intelligence
    activities alongside the Army and Navy. Military authorities sought a high-level decision limiting governmental activity
    in cryptanalysis, and the Joint Chiefs of Staff served as the forum for adjudicating intelligence responsibilities. An
    interdepartmental committee with Army, Navy, and FBI members surveyed cryptanalytic responsibilities and met on 30 June
    1942. Its agreement confined cryptanalytic activity to the Army, Navy, and FBI and established wartime dissemination policy.
    On 6 July, the Joint Chiefs reported the agreement to the President and recommended excluding other U.S. agencies from
    the field.
  question: What should the President do about the scope of cryptanalytic activity among U.S. agencies during the war?
  options:
    O1:
      do: The President will confine cryptanalytic activity to the Army, Navy, and FBI and discontinue activity by other agencies.
      move: act
      irreversible: false
    O2:
      do: The President will permit cryptanalytic activity to continue across the Army, Navy, FBI, FCC, OSS, and other federal
        agencies.
      move: act
      irreversible: false
    O3:
      do: The President will defer agency instructions and request a revised jurisdictional recommendation from the Joint
        Chiefs of Staff.
      move: ask
      irreversible: false
      to: the Joint Chiefs of Staff
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: By spring 1942, the State Department, FBI, FCC, Army, and Navy were among the agencies conducting communications-intelligence
      activities.
  - id: F2
    kind: situation
    status: assessed
    fact: The proliferation of these activities concerned the military COMINT organizations, and the services were concerned
      about duplication, wasted resources, and delays in intelligence reporting.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Joint Chiefs of Staff had national responsibility for adjudicating intelligence issues and were the available
      forum for defining U.S. cryptanalytic jurisdictional responsibilities.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Joint Intelligence Committee established an interdepartmental committee including Army, Navy, and FBI members
      to survey cryptanalytic activity, with a conference scheduled for 30 June 1942.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Navy had limited personnel resources and wanted to focus on naval problems, while the Army had a larger, predominantly
      civilian organization.
  - id: F6
    kind: authority
    status: confirmed
    fact: The 30 June committee agreement confined cryptanalytic activity to the Army, Navy, and FBI and established wartime
      policy for intelligence dissemination.
  - id: F7
    kind: authority
    status: confirmed
    fact: On 6 July 1942, the Joint Chiefs reported that an agreement had been reached and recommended that other U.S. agencies
      be excluded from the field.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The proliferation of agency COMINT activity was a security concern for the military organizations, supporting a controlled
      wartime boundary rather than continued expansion.
  - id: C2
    facts:
    - F2
    - F5
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The services feared duplicated effort, wasted scarce COMINT resources, and delayed reporting; the Navy also had limited
      personnel and wanted to focus on naval problems.
  - id: C3
    facts:
    - F3
    - F4
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The JCS was the available forum for defining cryptanalytic jurisdiction, its interdepartmental committee reached
      an agreement limiting activity to the Army, Navy, and FBI, and the JCS recommended excluding other agencies.
  reasoning:
    read: This was a wartime jurisdictional decision about which agencies could conduct cryptanalytic activity, not a decision
      about how that activity would be performed. The trap is to treat the fact that several agencies had begun activity as
      a reason to let proliferation continue, despite the stated security and resource concerns and the JCS's role in defining
      responsibilities.
    weighing: Security concerns and the risk of duplication, wasted resources, and reporting delays favor restricting the
      field {C1} {C2}. The JCS forum and the committee agreement provide an established jurisdictional basis for that restriction
      {C3}. The balance depends on the wartime need to coordinate activity and conserve scarce analytic resources, not on
      any claim that the source establishes a permanent allocation.
    tradecraft: Issue the restriction through the appropriate executive instructions, state the covered agency boundary clearly,
      and preserve the agreed wartime dissemination policy. Use the standing committee's implementation-monitoring role to
      identify whether the boundary is being carried out.
    uncertainty: The source gives the general security and resource concerns but does not specify the security risks in detail
      or describe every implementation question. It characterizes the arrangement as wartime, so the reasoning should not
      be treated as establishing a permanent jurisdictional rule.
    handoff: The President should decide after receiving the JCS recommendation; the JCS and its interdepartmental committee
      supply the jurisdictional and coordination basis, while the Director of the Budget is the stated channel for issuing
      agency instructions.
    tempting_wrong:
      option: O2
      pull: Several agencies were already conducting COMINT activity, so continuing broad participation might appear to preserve
        existing work.
      why_wrong: That approach leaves unaddressed the military organizations' stated security concerns and the risks of duplicated
        effort, wasted resources, and delayed reporting.
    rejected:
      O2: The President did not permit broad activity to continue because the JCS recommended excluding other agencies and
        the stated concerns favored limiting the field.
      O3: The President did not defer for a revised recommendation because the JCS and its committee had already addressed
        jurisdiction and recommended exclusion of other agencies.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The security concerns and risks of duplication, wasted resources, and delayed reporting were shown to be resolved,
        with sufficient resources for broader agency participation.
      then: O2
      why: If the stated grounds for restriction no longer applied, continued participation by other agencies could become
        a reasonable alternative.
    - id: flip2
      if: The JCS lacked responsibility for defining cryptanalytic jurisdiction or had not yet produced a recommendation on
        agency scope.
      then: O3
      why: Without an established jurisdictional forum or recommendation, deferring for clarification would be more appropriate.
    would_not_change:
    - id: noflip1
      if: The internal division of responsibilities among the Army, Navy, and FBI changed while the exclusion of other agencies
        remained in place.
      why: The presidential instruction was distinct from the services' internal allocation of responsibilities and did not
        affect that division.
    watch_for:
    - id: watch1
      what: Whether the wartime restriction is implemented across agencies, using the standing committee's role in monitoring
        implementation.
      favors:
      - O1
      why: The committee was established to monitor implementation of the agreement limiting cryptanalytic activity.
  lesson: When wartime intelligence activity proliferates and the responsible authority identifies security, duplication,
    resource, and reporting concerns, a clear jurisdictional boundary can be preferable to unrestricted agency participation.
    Keep the restriction tied to the authority and circumstances that support it, and distinguish the boundary on participation
    from the internal allocation of work.
  limits: This reasoning concerns the wartime U.S. jurisdictional choice described here; it does not establish a permanent
    rule for agency authority or address technical collection practices. It also does not resolve how a later change in security
    risks, resources, or governing authority should be handled.
