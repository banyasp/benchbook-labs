case:
  id: DR-CORPUS-NX-ae500cc4-E6@v1
  title: Choosing an Indirect Course in Somalia
  status: draft
  setting: Somalia, late December 2006; Washington's U.S. foreign-policy decision-making
  decider: Washington
  agent: Washington
  agent_role: decide
  situation: In late December 2006, Washington faced a crisis in Somalia as the Transitional Federal Government's position
    at Baidoa was under pressure. The Security Council had voted to send peacekeepers to restore order and preserve the government,
    while the Islamic Courts pledged to greet the peacekeepers with holy war. Washington assessed that a Taliban-like government
    was likely to emerge and associated that prospect with terrorist havens and a wider extremist front. The United States
    was already tied down in Iraq and Afghanistan, and direct U.S. military action in another Muslim country was viewed as
    imprudent. The United States had trained Ethiopian military forces for years.
  question: What should Washington do about the crisis in Somalia in late December 2006?
  options:
    O1:
      do: Washington should endorse Ethiopian intervention in Somalia.
      move: act
      irreversible: false
    O2:
      do: Washington should oppose Ethiopian intervention in Somalia.
      move: act
      irreversible: false
    O3:
      do: Washington should undertake direct military intervention in Somalia.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In early December 2006, the Security Council voted to send peacekeepers to Somalia to restore order and ensure the
      survival of the Transitional Federal Government.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Islamic Courts pledged to greet the peacekeepers with holy war.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Washington viewed a Taliban-like government coming to power in Somalia as near certain and associated that prospect
      with terrorist havens, Al Qaeda figures in the Horn, and another front in the global insurgency against violent extremism.
  - id: F4
    kind: situation
    status: confirmed
    fact: The United States was already tied down in Iraq and Afghanistan.
  - id: F5
    kind: situation
    status: assessed
    fact: Direct military intervention in another Muslim country was viewed as contrary to good sense.
  - id: F6
    kind: capability
    status: confirmed
    fact: The United States had quietly trained Ethiopian military forces for years.
  considerations:
  - id: C1
    facts:
    - F3
    equity: security_risk
    favors:
    - O1
    - O3
    weight: strong
    why: Washington assessed a Taliban-like takeover as near certain and associated it with terrorist havens, Al Qaeda figures
      in the Horn, and another front in the extremist conflict; the perceived threat supported action to prevent that outcome.
  - id: C2
    facts:
    - F4
    - F5
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: The United States was already tied down in Iraq and Afghanistan, and direct intervention in another Muslim country
      was viewed as imprudent, favoring an indirect course over O3.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Years of U.S. training of Ethiopian forces provided a surrogate option Washington believed could undertake the heavy
      lifting it was not positioned to do directly.
  - id: C4
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The TFG was under pressure, the Islamic Courts threatened holy war against the peacekeepers, and Ethiopian intervention
      was pivotal to the Baidoa government's continued survival.
  reasoning:
    read: Washington understood the crisis as a risk that the TFG would fall and a Taliban-like government would emerge, with
      consequences for regional and U.S. security. The trap was to treat the seriousness of that threat as requiring direct
      U.S. military action, despite U.S. commitments elsewhere and the judgment that such intervention in another Muslim country
      was imprudent.
    weighing: 'The assessed extremist threat and the TFG''s vulnerability favored action, while Washington''s commitments
      in Iraq and Afghanistan and its view of direct intervention favored using Ethiopia instead. The United States had trained
      Ethiopian forces, making that indirect course available; Ethiopian intervention was pivotal to the TFG''s survival.
      The choice carried political costs: the Ethiopian presence prompted calls for a neutral peacekeeping force and sowed
      the seeds of a Somali backlash. The balance supports O1 on the stated threat and capacity constraints, while depending
      on the continuing assessment that the TFG faced a near-certain defeat without intervention.'
    tradecraft: Record the threat assessment, the limits on direct U.S. action, the basis for relying on Ethiopia, and the
      anticipated political risks. Reassess those judgments as circumstances change, and make clear which conclusions are
      assessments rather than established outcomes.
    uncertainty: 'The near certainty of a Taliban-like takeover was Washington''s assessment, not a confirmed outcome. Ethiopian
      intervention also carried political costs: it prompted calls for a neutral peacekeeping force and sowed the seeds of
      a Somali backlash, even as it helped preserve the TFG.'
    handoff: Washington makes the policy choice; as an authored decision practice, it should coordinate with Ethiopia and
      the Security Council because the chosen course affects the TFG and intersects with the peacekeeping effort.
    tempting_wrong:
      option: O3
      pull: The assessed risk of terrorist havens and a wider extremist front could make direct U.S. intervention seem like
        the clearest response.
      why_wrong: The stated reasons against that course are that the United States was already tied down in Iraq and Afghanistan
        and that direct military intervention in another Muslim country ran counter to good sense.
    rejected:
      O2: Washington did not choose to oppose Ethiopian intervention because it assessed the extremist takeover threat as
        near certain and viewed the TFG as likely to be pushed out without the Ethiopian incursion.
      O3: Washington did not choose direct U.S. intervention because its forces were already committed in Iraq and Afghanistan
        and it considered intervention in another Muslim country imprudent.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Washington no longer assessed a Taliban-like takeover and its associated terrorist threat as near certain.
      then: O2
      why: With the central threat rationale substantially reduced, the case for endorsing Ethiopian intervention would weaken.
    - id: flip2
      if: The United States were no longer tied down elsewhere and direct intervention in another Muslim country were no longer
        viewed as imprudent.
      then: O3
      why: The stated reasons for preferring an indirect course would no longer apply, making direct intervention a live alternative.
    would_not_change:
    - id: noflip1
      if: The Ethiopian intervention prompted calls for neutral peacekeeping and a Somali backlash.
      why: Those consequences are serious cautions, but Ethiopian intervention remained pivotal to the TFG's survival, and
        without it the government likely would have been pushed out.
    watch_for:
    - id: watch1
      what: International calls for neutral peacekeeping and a Somali backlash to the Ethiopian presence.
      favors:
      - O2
      why: These political consequences of the intervention should be monitored as reasons to reconsider continued endorsement.
  lesson: When a serious assessed threat coincides with limited capacity for direct action, an indirect partner course may
    be preferable if it can preserve the threatened government. That choice still requires attention to political backlash
    and renewed assessment of whether the threat and capacity constraints remain as judged.
  limits: This reasoning applies to the late-December 2006 policy choice as framed, not to the conduct of Ethiopian forces
    or any later decision about Somalia. It does not establish that the threat assessment was correct or that indirect intervention
    is generally preferable.
