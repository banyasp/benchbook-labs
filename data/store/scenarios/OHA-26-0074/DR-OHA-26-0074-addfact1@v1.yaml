case:
  id: DR-OHA-26-0074-addfact1@v1
  title: Denial of Access Authorization under Guideline F [addfact]
  status: needs_review
  setting: U.S. Department of Energy, Office of Hearings and Appeals – August 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The employee, a DOE contractor, failed to file both federal and state personal income tax returns for the 2021
    and 2022 years. A credit report from a major bureau shows no collections, judgments, or liens aside from the outstanding
    federal tax liabilities for those years. The employee acknowledged that the omission was due to his own negligence. The
    Local Security Office therefore invoked Guideline F of the Adjudicative Guidelines because of these tax-filing failures.
    Although the employee mailed the 2021 and 2022 federal returns in May 2026, they remained unprocessed at the hearing,
    while the state returns were processed and reflected a zero balance. He has offered no documentation of financial counseling,
    repayment of any owed federal taxes, or an arrangement with the IRS to resolve the delinquency. Under the governing regulations,
    a presumption exists against granting a security clearance, and the individual must demonstrate that approval would not
    jeopardize the common defense and security. The Administrative Law Judge reviewed the mitigating-factor criteria in Paragraph
    20 and found none applicable.
  question: How should the Administrative Law Judge rule on the employee's access authorization under Guideline F?
  options:
    O1:
      do: Grant the employee's access authorization despite the tax issues.
      move: act
      irreversible: true
    O2:
      do: Order the Local Security Office to provide financial counseling.
      move: ask
      irreversible: false
      to: Local Security Office
    O3:
      do: Deny the employee's access authorization based on the filing failures.
      move: act
      irreversible: true
    O4:
      do: Postpone the decision until the employee supplies tax-payment evidence.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee did not submit either federal or state personal income tax returns for the 2021 and 2022 filing years.
  - id: F2
    kind: situation
    status: confirmed
    fact: A credit report from a major bureau indicates the employee has no collections, judgments, or liens aside from the
      outstanding federal tax liabilities for 2021-2022.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee acknowledged that the failure resulted from his own negligence.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline F of the Adjudicative Guidelines because of the employee's tax-filing
      deficiencies.
  - id: F5
    kind: situation
    status: confirmed
    fact: In May 2026 the employee mailed his 2021 and 2022 federal tax returns, yet they remained unprocessed at the time
      of the hearing.
  - id: F6
    kind: situation
    status: confirmed
    fact: The state tax returns for 2021-2022 were processed by the relevant state authority and showed a zero balance.
  - id: F7
    kind: situation
    status: assessed
    fact: The employee offered no documentation of financial counseling, repayment of any federal taxes owed, or any arrangement
      with the IRS to address the delinquent returns.
  - id: F8
    kind: authority
    status: confirmed
    fact: The regulations governing access authorizations establish a presumption against granting a clearance and require
      the individual to demonstrate that approval will not jeopardize the common defense and security.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The Administrative Law Judge reviewed the mitigating-factor criteria in Paragraph 20 and determined that none applied
      to this case.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Guideline F was properly invoked because the employee failed to file required federal and state tax returns, and
      the credit report (F2) shows no other financial delinquencies, underscoring the seriousness of the outstanding federal
      liabilities.
  - id: C2
    facts:
    - F1
    - F5
    - F7
    - F9
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: 'Mitigating factor (a) is not satisfied: the conduct was recent, persisted for two years, and the employee has offered
      no evidence of repayment or counseling (F5, F7) despite the presumption against granting (F8).'
  - id: C3
    facts:
    - F3
    - F5
    - F7
    - F9
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Mitigating factor (b) is not satisfied because the employee's own negligence (F3) caused the failure, not circumstances
      beyond his control.
  - id: C4
    facts:
    - F7
    - F9
    equity: due_process
    favors:
    - O3
    weight: strong
    why: No evidence of financial counseling or repayment (F7) means factors (c) and (d) are unmet.
  - id: C5
    facts:
    - F5
    - F7
    - F9
    equity: due_process
    favors:
    - O3
    weight: strong
    why: No documented arrangement with the IRS (F5, F7) means factor (g) is unmet.
  - id: C6
    facts:
    - F2
    - F1
    equity: financial_integrity
    favors:
    - O3
    weight: weak
    why: The credit report confirms that the employee’s only financial delinquency is the outstanding federal tax liability,
      indicating no other financial pressures that might mitigate the security concern.
  reasoning:
    read: The employee admitted negligence (F3) in failing to file 2021-2022 federal and state returns. Although the state
      returns were processed with a zero balance (F6), the federal returns remain unprocessed (F5) and the credit report (F2)
      shows no other debts. The Local Security Office invoked Guideline F (F4). The ALJ must assess whether any mitigating
      factor in Paragraph 20 offsets the security concern.
    weighing: 'Each mitigating factor is unsatisfied: the conduct is recent and ongoing (C2), caused by negligence (C3), no
      counseling or repayment offered (C4), and no IRS arrangement (C5). The credit report (F2) reinforces that the only liability
      is the federal tax, strengthening the denial rationale.'
    tradecraft: The Administrative Law Judge issues a written Decision denying the access authorization, cites 10 C.F.R. §
      710.7(a), records appeal rights per 10 C.F.R. § 710.28, and files the decision in the OHA docket.
    uncertainty: The only uncertainty is whether the IRS will later accept the mailed returns, but that does not affect the
      current finding because the returns were unprocessed at the hearing.
    handoff: The decision rests solely with the Administrative Law Judge; no further agency consultation is required.
    tempting_wrong:
      option: O1
      pull: The state returns are cleared and the employee eventually mailed the federal returns, which might suggest remediation.
      why_wrong: Guideline F requires timely filing and demonstrated resolution of federal tax liabilities; the pending federal
        returns and lack of IRS acceptance mean the security concern remains unresolved.
    rejected:
      O1: Granting would ignore the unresolved federal tax delinquency and the absence of any mitigating factor.
      O2: Mandating counseling does not address the immediate security risk; the decision must be final on eligibility.
      O4: Postponing would delay the required determination and conflict with the presumption against granting.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee provides documented proof of a binding arrangement with the IRS to file and pay the 2021-2022 federal
        returns, and the IRS accepts those returns before the hearing.
      then: O1
      why: Factor (g) would be satisfied, showing concrete steps to resolve the financial issue.
    would_not_change:
    - id: noflip1
      if: Only the state tax returns are processed while the federal returns remain unfiled.
      why: Guideline F focuses on federal filing failures; the state resolution alone does not remove the security concern.
    watch_for:
    - id: watch1
      what: Future IRS acceptance of the mailed 2021-2022 federal returns.
      favors:
      - O1
      why: If the IRS processes the returns, the employee could demonstrate compliance and potentially satisfy mitigating
        factor (g).
  lesson: Under DOE Part 710, failure to file required tax returns creates a Guideline F security concern that can only be
    overcome by timely, documented remediation; absent such mitigation, the clearance must be denied.
  limits: This analysis applies to DOE personnel security clearance determinations under 10 C.F.R. Part 710 and does not govern
    unrelated employment or civil tax enforcement actions.
