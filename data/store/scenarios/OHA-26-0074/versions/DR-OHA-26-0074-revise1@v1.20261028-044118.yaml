case:
  id: DR-OHA-26-0074-revise1@v1
  title: Denial of Access Authorization under Guideline F [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, August 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, failed to file federal and state personal income tax returns for 2021
    and 2022 and admitted the failure was due to negligence. The Local Security Office raised a security concern under Guideline
    F of the Adjudicative Guidelines, citing the tax filing failures. The Individual attempted to file the delinquent federal
    returns in May 2026, but the returns remained unprocessed at the time of the hearing, while the state returns were processed
    and showed a zero balance. The Individual provided no evidence of financial counseling, repayment of any federal taxes
    owed, or an arrangement with the IRS to resolve the delinquency. The regulations governing access authorizations impose
    a presumption against granting a clearance and require the individual to demonstrate that granting will not endanger the
    common defense and security. The Administrative Judge evaluated the mitigating factors listed in the Guidelines and found
    none applicable.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline F?
  options:
    O1:
      do: The Administrative Judge grants the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge asks the Local Security Office for counseling.
      move: ask
      irreversible: false
      to: Local Security Office
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge holds the decision pending further tax evidence.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual failed to file federal and state personal income tax returns for tax years 2021 and 2022.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual admitted the failure was due to his own negligence.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office invoked Guideline F of the Adjudicative Guidelines because of the Individual’s tax filing
      failures.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual mailed his 2021 and 2022 federal tax returns in May 2026, but they remained unfiled as of the hearing.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual’s 2021‑2022 state tax returns were processed by the state authority, showing a zero balance.
  - id: F6
    kind: situation
    status: assessed
    fact: The Individual provided no evidence of financial counseling, repayment of any federal taxes owed, or an arrangement
      with the IRS to resolve the delinquent returns.
  - id: F7
    kind: authority
    status: confirmed
    fact: The regulations governing access authorizations impose a presumption against granting a security clearance and require
      the individual to demonstrate that granting will not endanger the common defense and security.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Administrative Judge evaluated the mitigating factors under Paragraph 20 and found none applicable to the Individual’s
      situation.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Guideline F of the Adjudicative Guidelines was properly invoked because the Individual failed to file required federal
      and state tax returns, creating a security concern.
  - id: C2
    facts:
    - F1
    - F4
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: 'Mitigating factor (a) is not satisfied: the conduct was recent, lasted for years, and is not shown to be unlikely
      to recur.'
  - id: C3
    facts:
    - F2
    - F4
    - F6
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Mitigating factor (b) is not satisfied because the Individual’s negligence, not circumstances beyond his control,
      caused the failure to file.
  - id: C4
    facts:
    - F6
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: No evidence of financial counseling or repayment of any federal taxes owed, so factor (c) and (d) are not met.
  - id: C5
    facts:
    - F4
    - F6
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The Individual has not made a documented arrangement with the IRS to resolve the delinquent federal returns, so factor
      (g) is not satisfied.
  - id: C6
    facts:
    - F5
    - F6
    equity: rehabilitative_counseling
    favors:
    - O2
    weight: strong
    why: The state returns show the Individual can resolve tax issues; requesting counseling lets the LSO verify financial
      responsibility before a final clearance decision.
  reasoning:
    read: The Individual failed to file 2021-2022 federal returns, admitted negligence, and has not shown repayment or counseling;
      the state returns are zero, but the federal returns remain unprocessed.
    weighing: Although the tax delinquency creates a Guideline F concern, the strongest mitigation is to obtain professional
      financial counseling, which can address the underlying conduct and allow future compliance.
    tradecraft: The Administrative Judge issues a Decision directing the Local Security Office to provide counseling to the
      Individual and records the referral in the OHA docket, citing 10 C.F.R. § 710.7(a).
    uncertainty: It remains uncertain whether the IRS will accept the mailed returns, but counseling can proceed regardless
      of that outcome.
    handoff: The Judge refers the matter to the LSO for counseling while retaining authority to make a final clearance determination
      after the counseling report.
    tempting_wrong:
      option: O1
      pull: The Individual eventually mailed the federal returns and the state returns show a zero balance, suggesting possible
        remediation.
      why_wrong: Without IRS acceptance or documented counseling, the security concern remains unresolved; granting would
        violate the presumption against clearance.
    rejected:
      O1: Granting would ignore the unresolved federal delinquency and lack of demonstrated remediation.
      O3: A straight denial forecloses the opportunity for targeted remediation that counseling can provide.
      O4: Holding the decision pending further evidence would unnecessarily delay a remedial step that can be taken now.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provides documented proof of a binding arrangement with the IRS to file and pay the 2021-2022 federal
        returns, and the IRS accepts those returns before the hearing.
      then: O3
      why: Even if the tax issue were resolved before the hearing, the Judge still deems counseling necessary to verify sustained
        financial responsibility before granting clearance.
    would_not_change:
    - id: noflip1
      if: Only the state tax returns are processed while the federal returns remain unfiled.
      why: Guideline F focuses on federal filing failures; the state resolution alone does not remove the security concern.
    watch_for:
    - id: watch1
      what: Future IRS acceptance of the mailed 2021-2022 returns.
      favors:
      - O1
      why: If the IRS processes the returns, the Individual could demonstrate compliance and potentially satisfy mitigating
        factor (g).
  lesson: Under DOE Part 710, failure to file required tax returns creates a Guideline F security concern that can be mitigated
    through documented counseling and verification of financial responsibility before a final clearance decision.
  limits: This analysis applies strictly to DOE personnel security clearance determinations under 10 C.F.R. Part 710. It does
    not govern unrelated employment decisions or civil penalties for tax non-compliance.
