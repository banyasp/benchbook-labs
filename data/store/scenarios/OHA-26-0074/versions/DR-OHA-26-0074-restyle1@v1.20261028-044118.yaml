case:
  id: DR-OHA-26-0074-restyle1@v1
  title: Denial of Access Authorization under Guideline F [restyle]
  status: needs_review
  setting: Office of Security Review, Department of Energy, September 2026
  decider: Senior Adjudicative Officer
  agent: Senior Adjudicative Officer
  agent_role: decide
  situation: A DOE contractor employee neglected to submit required federal and state personal income tax returns for 2021
    and 2022, acknowledging the omission resulted from personal negligence. The Local Security Office cited Guideline F of
    the Adjudicative Guidelines because of these tax-filing failures. The employee mailed the overdue federal returns in May
    2026, but they remained unprocessed at the hearing, while the state returns were processed and showed a zero balance.
    No documentation of financial counseling, repayment of any federal taxes, or an IRS payment arrangement was offered. DOE
    regulations presume against granting a clearance and require the applicant to demonstrate that approval will not jeopardize
    the common defense and security. The Officer reviewed the mitigating-factor checklist in Paragraph 20 and found none applicable.
  question: How should the Senior Adjudicative Officer rule on the employee's access authorization under Guideline F?
  options:
    O1:
      do: The Senior Adjudicative Officer approves the employee's access clearance despite the tax issue.
      move: act
      irreversible: true
    O2:
      do: The Senior Adjudicative Officer directs the Local Security Office to counsel the employee.
      move: ask
      irreversible: false
      to: Local Security Office
    O3:
      do: The Senior Adjudicative Officer denies the employee's access clearance because of tax delinquency.
      move: act
      irreversible: true
    O4:
      do: The Senior Adjudicative Officer defers the decision pending tax documentation from the employee.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee neglected to submit both federal and state personal income tax returns for the 2021 and 2022 filing
      periods.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee acknowledged that the omission resulted from his own carelessness.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline F of the Adjudicative Guidelines on the basis of the employee's tax-filing
      omissions.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee mailed his 2021 and 2022 federal tax returns in May 2026, yet they had not been processed by the hearing
      date.
  - id: F5
    kind: situation
    status: confirmed
    fact: The state tax authority processed the employee's 2021-2022 state returns and recorded a zero balance.
  - id: F6
    kind: situation
    status: assessed
    fact: The employee presented no proof of having obtained financial counseling, repaid any outstanding federal tax, or
      secured a payment arrangement with the IRS.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE regulations governing access authorizations presume against granting a clearance and obligate the applicant
      to show that approval would not jeopardize the common defense and security.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Senior Adjudicative Officer reviewed the mitigating-factor checklist in Paragraph 20 and determined that none
      applied to this case.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Guideline F is appropriately triggered because the employee failed to file mandatory federal and state returns, constituting
      a security-related concern.
  - id: C2
    facts:
    - F1
    - F4
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: 'Mitigating factor (a) is unavailable: the conduct is recent, persisted over multiple years, and there is no indication
      it is unlikely to recur.'
  - id: C3
    facts:
    - F2
    - F4
    - F6
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Mitigating factor (b) is unavailable because the failure stems from the employee's own negligence rather than circumstances
      beyond his control.
  - id: C4
    facts:
    - F6
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Because the employee has supplied no evidence of financial counseling or repayment, factors (c) and (d) are unmet.
  - id: C5
    facts:
    - F4
    - F6
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: Absent a documented IRS arrangement to resolve the delinquent federal returns, factor (g) remains unsatisfied.
  reasoning:
    read: The employee admitted negligence in not filing the 2021-2022 federal and state returns. He subsequently mailed the
      federal returns in May 2026, but they remained unprocessed at the time of the hearing. The Local Security Office raised
      a Guideline F concern, and the Officer must determine whether any Paragraph 20 mitigating factors offset that concern.
    weighing: The Officer concluded that the employee has not mitigated the security issue arising from his untimely filing
      of the 2021 and 2022 tax returns, and therefore must deny the clearance.
    tradecraft: The Senior Adjudicative Officer issues a formal written Decision denying the clearance, cites the governing
      regulation (10 C.F.R. § 710.7(a)), records the appellant's rights per 10 C.F.R. § 710.28, and files the decision in
      the OHA docket.
    uncertainty: The sole uncertainty concerns whether the IRS will eventually accept the mailed returns; however, because
      the returns were unfiled at the hearing, this does not affect the current determination.
    handoff: The determination rests exclusively with the Senior Adjudicative Officer; no additional consultation is required.
    tempting_wrong:
      option: O1
      pull: The employee eventually submitted the overdue returns and the state agency shows a zero balance, which could be
        viewed as evidence of rehabilitation.
      why_wrong: Guideline F demands timely filing and demonstrable responsibility; the delayed filing and lack of IRS acceptance
        fail to satisfy any mitigating factor, so granting would breach the established security standards.
    rejected:
      O1: Approving would disregard the outstanding federal delinquency and the absence of any mitigating factor.
      O2: Soliciting counseling does not resolve the immediate security deficiency; a final eligibility determination is required.
      O4: Postponing the decision pending further evidence would delay the mandatory determination and conflict with the presumption
        against granting.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee furnishes documented proof of a binding agreement with the IRS to file and pay the 2021-2022 federal
        returns, and the IRS has accepted those returns before the hearing.
      then: O1
      why: Factor (g) would then be satisfied, demonstrating that the employee has taken concrete steps to remedy the financial
        issue.
    would_not_change:
    - id: noflip1
      if: Only the state returns have been processed while the federal returns remain unfiled.
      why: Guideline F centers on federal filing failures; a resolved state filing alone does not eliminate the security concern.
    watch_for:
    - id: watch1
      what: Potential future acceptance by the IRS of the mailed 2021-2022 federal returns.
      favors:
      - O1
      why: If the IRS processes the returns, the employee could show compliance and potentially satisfy mitigating factor
        (g).
  lesson: Under DOE Part 710, a failure to file required tax returns creates a Guideline F security issue that can be overcome
    only by prompt, responsible, and documented remediation; lacking such mitigation, the clearance must be denied.
  limits: This analysis is confined to DOE personnel-security clearance determinations under 10 C.F.R. Part 710 and does not
    extend to unrelated employment actions or civil tax-penalty matters.
