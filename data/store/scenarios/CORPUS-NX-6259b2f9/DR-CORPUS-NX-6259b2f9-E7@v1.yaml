case:
  id: DR-CORPUS-NX-6259b2f9-E7@v1
  title: Uncertain Identification on Patrol
  status: draft
  setting: Queenstown Patrol, at sea, about a quarter to five, aboard a patrol vessel.
  decider: The commanding officer
  agent: The commanding officer
  agent_role: decide
  situation: At about a quarter to five, aboard a vessel on Queenstown Patrol, the commanding officer was awakened by the
    officer of the deck. The officer reported a vessel on the surface that looked like a submarine. The commanding officer
    viewed the distant vessel through glasses. Its identity had not been established at that point. The commander had to decide
    whether to engage, decline engagement, or wait for further identification.
  question: What should the commanding officer do about the distant vessel reported as a submarine?
  options:
    O1:
      do: The Commander proceeds to engage the suspected submarine.
      move: act
      irreversible: true
    O2:
      do: The Commander declines to engage the suspected submarine.
      move: act
      irreversible: false
    O3:
      do: The Commander holds engagement while awaiting further identification.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The commanding officer was awakened at a quarter to five.
  - id: F2
    kind: situation
    status: confirmed
    fact: The officer of the deck reported a sighting to the commanding officer.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The sighting was described as what looked like a submarine.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The reported vessel was on the surface.
  - id: F5
    kind: situation
    status: confirmed
    fact: The commanding officer viewed the vessel through glasses.
  - id: F6
    kind: situation
    status: confirmed
    fact: The vessel was a long way off when first sighted.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The reported vessel looked like a submarine, and the commander treated that appearance as grounds to engage a suspected
      submarine.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The commander made his own visual assessment through glasses and said he was sure the vessel was a submarine.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: The vessel was a long way off, leaving room for identification uncertainty; the commander nevertheless concluded
      from his view that it was a submarine.
  reasoning:
    read: The decision was whether to act on an identification that had not been established as fact. The vessel looked like
      a submarine from a distance, and the commander judged, after viewing it himself, that it was one. The hindsight trap
      is that the vessel proved to be a British patrol boat; that later identification does not change what the commander
      believed at the decision point.
    weighing: The reported appearance and the commander's own assessment supported engagement {C1} {C2}. Its distance left
      some uncertainty and could have supported waiting for more information {C3}, but the account gives the commander's judgment
      that he was sure it was a submarine as the reason he chose engagement. The balance depends on that identification judgment;
      no separate legal threshold or rules of engagement are stated.
    tradecraft: Keep the decision at the level of the commander's identification judgment and choice to engage. The account
      supplies no basis for adding a particular identification procedure, legal test, or documentation requirement.
    uncertainty: The vessel's identity was not established when the commander decided. The source records his confidence in
      the submarine identification, but does not describe a formal assessment of how reliable that identification was.
    handoff: The account presents this as the commanding officer's decision and does not mention consultation or referral.
      Whether another authority had to be involved cannot be determined from the source.
    tempting_wrong:
      option: O3
      pull: The vessel was distant and its identity had not been established.
      why_wrong: The commander's stated reason for acting was that his own view convinced him it was a submarine; the source
        endorses that judgment as the basis for engagement.
    rejected:
      O2: The commander did not decline engagement because he judged the vessel to be a submarine.
      O3: The commander did not wait for further identification because he was sure from his assessment that the vessel was
        a submarine.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Before deciding, the commander received credible but incomplete information that the vessel might be friendly.
      then: O3
      why: The identification would no longer support the confidence on which the source's decision rested, making a hold
        for clarification the closest alternative.
    - id: flip2
      if: Before deciding, the vessel was positively identified as a non-hostile patrol boat.
      then: O2
      why: An established non-hostile identity would remove the basis for engaging a suspected submarine.
    would_not_change:
    - id: noflip1
      if: The vessel came closer but still looked like a submarine, without any other change to the identification evidence.
      why: The account says it continued to look like a submarine even when fairly close aboard, so closeness alone did not
        resolve the identification.
    watch_for: []
  lesson: A commander may act on a suspected identity when the reported appearance is corroborated by the commander's own
    assessment and that assessment is sufficiently confident. Distance can leave uncertainty, but a later-discovered identity
    should not be substituted for what was known at the decision point.
  limits: This account does not state the applicable rules of engagement, a legal standard for identification, or any requirement
    to consult another authority. The reasoning should not be generalized to cases where those rules or materially different
    identification evidence apply.
  library:
    domain: military-operational
    family: CORPUS-NX-6259b2f9
    source: https://digital-commons.usnwc.edu/cgi/viewcontent.cgi?article=1011&context=usnwc-historical-monographs
    episode_focus: The decision point is whether to engage a suspected submarine under uncertain identification; the commanding
      officer chose to fire because he believed the vessel was a submarine. The vessel proved to be a British patrol boat,
      and firing ceased when it signaled its identity; exclude the mechanics of firing and describe only the identification
      judgment and engagement decision.
    cues:
