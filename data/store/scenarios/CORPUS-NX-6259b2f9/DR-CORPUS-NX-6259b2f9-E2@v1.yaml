case:
  id: DR-CORPUS-NX-6259b2f9-E2@v1
  title: Conditional Authority to Use Force
  status: draft
  setting: Flagship, 24 April 1917, Special Service Division, Destroyer Force
  decider: The Commander of the Special Service Division
  agent: The Commander of the Special Service Division
  agent_role: decide
  situation: On 24 April 1917, aboard the flagship, the Commander of the Special Service Division was preparing to sail with
    the Division. Reports of submarines operating across the Atlantic had been heard, and the Division was keeping a lookout
    for them. Just before sailing, the Commander issued the Division an order addressing what to do if an enemy submarine
    was sighted. The decision is whether the Division should be authorized to use force on that condition.
  question: What should the Commander of the Special Service Division do about authorizing the Division to use force if an
    enemy submarine is sighted?
  options:
    O1:
      do: The Commander authorizes the Division to use force against a sighted enemy submarine.
      move: act
      irreversible: false
    O2:
      do: The Commander prohibits the Division from using force against a sighted enemy submarine.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The Commander had heard reports of submarines operating across the Atlantic.
  - id: F2
    kind: situation
    status: assessed
    fact: The Division was keeping a lookout for submarines.
  - id: F3
    kind: situation
    status: confirmed
    fact: Just before sailing, the Commander issued an order to the Division concerning procedures if a submarine was sighted.
  - id: F4
    kind: situation
    status: confirmed
    fact: The order was dated 24 April 1917 and issued aboard the flagship.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Commander of the Special Service Division issued the order to the Special Service Division.
  - id: F6
    kind: situation
    status: confirmed
    fact: The order addressed procedures in case an enemy submarine was sighted and in case a vessel of the force was damaged
      by a mine or torpedo.
  - id: F7
    kind: authority
    status: confirmed
    fact: The order established a conditional decision about using force when an enemy submarine was sighted.
  considerations:
  - id: C1
    facts:
    - F1
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: Reports of submarines operating across the Atlantic supplied a general security concern supporting preparedness,
      but did not establish that any particular submarine had been sighted or was enemy.
  - id: C2
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Division was keeping a lookout for submarines, consistent with treating a sighting as a condition requiring a
      prepared response.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Commander issued the Division an order that addressed a sighting of an enemy submarine and established conditional
      use of force in that circumstance.
  reasoning:
    read: This is a commander's conditional decision about force if an enemy submarine is sighted, not an authorization to
      use force based merely on general reports. The trap is treating the reports as proof of a particular hostile contact,
      or reading into the order a legal standard it does not state.
    weighing: The reports and lookout provide the operational context, while the decisive source-grounded reason for {O1}
      is the Commander's order establishing force as the response to the specified condition. The balance depends on the condition
      being a sighting of an enemy submarine; the source gives no separate legal test or explanation of how that status is
      established.
    tradecraft: Keep the authorization expressly limited to its stated condition, and record the basis for applying that condition.
      If the contact or the scope of authority is uncertain, seek clarification under applicable command procedures rather
      than treating the general reports as sufficient.
    uncertainty: The source does not describe the reliability of the reports, define how a sighting is assessed as an enemy
      submarine, or state a separate rules-of-engagement or law-of-war standard.
    handoff: The Commander made the order at the Division level. The source does not identify a required reviewer or consultation;
      seeking higher-command or legal clarification where the trigger or authority is uncertain is prudent synthesis, not
      a stated step.
    tempting_wrong:
      option: O2
      pull: A blanket prohibition may seem safer given that the reports were general and no specific submarine had yet been
        sighted.
      why_wrong: It would discard the Commander's stated conditional response to an enemy-submarine sighting, rather than
        preserve the distinction between general reports and the condition that activates the order.
    rejected:
      O2: The Commander did not prohibit force; the issued order established its use conditionally upon an enemy submarine
        being sighted.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Applicable superior authority or law prohibited force in the stated circumstance.
      then: O2
      why: The commander's conditional order would not itself justify acting contrary to a controlling legal or command restriction.
    would_not_change:
    - id: noflip1
      if: The only information remained the general reports of submarines operating across the Atlantic, without an enemy
        submarine being sighted.
      why: The order makes the sighting of an enemy submarine the condition for its force authorization; the reports alone
        do not satisfy that condition.
    watch_for:
    - id: watch1
      what: Whether the stated condition—a sighting of an enemy submarine—is actually present.
      favors:
      - O1
      why: That is the condition the order attaches to its force authorization.
  lesson: A conditional force authorization should remain tied to the condition the commander actually stated; general threat
    reports are context, not proof that the condition has occurred. Do not infer a broader legal standard or authority from
    an order that does not specify one.
  limits: This conclusion concerns only the conditional order described here and does not establish that force would be lawful
    in every submarine sighting. It does not supply identification criteria, rules of engagement, or other legal standards
    absent from the source.
