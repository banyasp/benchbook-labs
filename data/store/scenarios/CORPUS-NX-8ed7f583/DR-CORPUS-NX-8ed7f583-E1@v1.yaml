case:
  id: DR-CORPUS-NX-8ed7f583-E1@v1
  title: Recovery Choice After Dual Engine Failure
  status: draft
  setting: Afghanistan, 27 January 2020, E-11A mission
  decider: The mission commander (MC)
  agent: The MC
  agent_role: decide
  situation: At 1252L, after both engines were lost, the aircraft was approximately 38 NM from Bagram Airfield, 17 NM from
    Kabul International Airport, 28 NM from FOB Shank, and 230 NM from KAF. Weather permitted a safe and executable landing
    at Bagram, Kabul, and Shank. Flight simulations indicated that each of those three airfields remained reachable for a
    limited period after the emergency, while recovery to KAF was not possible with both engines out. Backup systems allowed
    the aircraft to be controlled for an emergency landing, but the probability of a successful dual-engine-out landing could
    not be determined. The crew would have to manage an unusual, hypothetical emergency landing while handling the aircraft’s
    descent and routing. Squadron pilots described a strong preference for returning to KAF, with diversions usually associated
    with weather or other conditions preventing use of KAF rather than an emergency.
  question: What should the MC do after the dual engine out emergency?
  options:
    O1:
      do: The MC diverts the aircraft to Bagram Airfield.
      move: act
      irreversible: true
    O2:
      do: The MC continues toward KAF for recovery.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: At 1252L, the aircraft was approximately 38 NM from Bagram Airfield, 17 NM from Kabul International Airport, 28
      NM from FOB Shank, and 230 NM from KAF.
  - id: F2
    kind: capability
    status: confirmed
    fact: Weather permitted a safe and executable landing at Bagram Airfield, Kabul International Airport, and FOB Shank.
  - id: F3
    kind: capability
    status: confirmed
    fact: Flight simulations indicated that Bagram or Kabul could be reached for approximately three to five minutes after
      the dual engine out emergency, and Shank for approximately eight minutes.
  - id: F4
    kind: capability
    status: confirmed
    fact: With both engines lost, recovery to KAF was not possible.
  - id: F5
    kind: capability
    status: confirmed
    fact: Backup systems allowed the aircraft to be controlled through an emergency landing, but the exact probability of
      a successful dual-engine-out landing could not be determined.
  - id: F6
    kind: situation
    status: assessed
    fact: Squadron pilots described a strong preference for returning to KAF during most emergencies or other issues.
  - id: F7
    kind: situation
    status: confirmed
    fact: Diversions were usually anticipated when weather or other issues denied the use of KAF, rather than because of emergencies;
      discussion of emergency airfields was rare, and no E-11A had diverted to another airfield for several months before
      the mishap.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The nearby fields offered feasible, time-limited landing opportunities, while recovery to KAF was not possible with
      both engines out.
  - id: C2
    facts:
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: A dual-engine-out landing was an untested, hypothetical emergency, and its probability of success could not be determined;
      the crew would have to manage the landing while handling descent and routing.
  - id: C3
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The squadron had a strong preference for returning to KAF, while emergency diversions were rarely discussed and recent
      diversions had not occurred.
  reasoning:
    read: 'This was an emergency with a narrow opportunity to reach nearby fields, not a normal return to base: KAF was too
      far away to recover to with both engines out. The trap is allowing the squadron''s habitual preference for KAF, or the
      uncertainty of an unfamiliar emergency landing, to stand in for a feasible recovery plan.'
    weighing: The MC continued toward KAF, a choice consistent with the squadron's strong preference for returning there and
      made amid uncertainty about the success of a novel dual-engine-out landing. Those considerations explain the pull of
      {O2}, but they are outweighed by the stated facts that nearby fields had safe, executable landing opportunities and
      KAF was unreachable. The decision's practical balance depended on acting within the limited windows for Bagram, Kabul,
      or Shank.
    tradecraft: Make the emergency decision promptly, state the basis for the selected course, and record the options considered
      and the time-sensitive information available. Keep the decision focused on the feasible recovery choices rather than
      allowing normal return-to-base practice to substitute for reassessing the emergency.
    uncertainty: The probability of a successful dual-engine-out landing could not be quantified, and the required emergency
      landing was hypothetical. That uncertainty matters, but it does not make KAF reachable or remove the limited opportunities
      to land at the closer fields.
    handoff: The MC holds the decision responsibility. The crew and relevant air traffic control can support shared situational
      awareness and coordination, but the source does not identify a separate approval authority.
    tempting_wrong:
      option: O2
      pull: Returning to KAF fit the squadron's strong preference, while the success of an unfamiliar emergency landing could
        not be predicted.
      why_wrong: With both engines lost, recovery to KAF was not possible, whereas closer fields remained reachable for limited
        periods.
    rejected:
      O1: The MC did not divert to a nearby field, despite the stated feasible landing opportunities and limited periods of
        reachability.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable basis established that a nearby emergency landing had a sufficiently favorable prospect of success to
        justify choosing it despite the uncertainty.
      then: O1
      why: The limited opportunity to reach a safe, executable nearby landing would then outweigh the uncertainty that supported
        continuing toward KAF.
    would_not_change:
    - id: noflip1
      if: The probability of a successful dual-engine-out landing remained unknown.
      why: That uncertainty would remain relevant, but by itself would not make recovery to KAF possible or eliminate the
        nearby landing opportunities.
    watch_for:
    - id: watch1
      what: Whether strong return-to-KAF expectations are displacing consideration of emergency landing alternatives.
      favors:
      - O2
      why: The squadron's strong preference for KAF and the rarity of emergency-diversion discussion could shape the decision
        even when closer options are available.
  lesson: In an emergency, reassess the available recovery options against what is actually reachable, rather than relying
    on the normal preference to return to base. Uncertainty about an unfamiliar option deserves weight, but it does not make
    an unreachable option feasible.
  limits: This analysis concerns an aircraft emergency in which the source identifies specific, time-limited landing opportunities
    and states that KAF was unreachable with both engines out. It does not establish a general rule for choosing among emergency
    landing sites or quantify the risks of any landing.
