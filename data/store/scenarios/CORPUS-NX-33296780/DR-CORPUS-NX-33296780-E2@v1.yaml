case:
  id: DR-CORPUS-NX-33296780-E2@v1
  title: Participant Identification and Analytical Integrity
  status: draft
  setting: Office of Political Research, during early Bayesian studies; date unspecified.
  decider: The Bayesian project team
  agent: The Bayesian project team
  agent_role: decide
  situation: During early Bayesian studies in the Office of Political Research, project participants were identified with
    trend lines. The team encountered occasions when an analyst's assessments reflected a predetermined goal rather than unbiased
    judgment. Such manipulation was described as rare. A separate graphic could visibly associate each participant with an
    individual intuitive opinion, and participants and readers showed substantial interest in that visibility. Analysts also
    showed a slight tendency to manipulate results when uneasy about the direction their assessment was taking. The team had
    to choose how to present participant identities and whether to respond through discipline.
  question: What should the Bayesian project team do about participant identification on Bayesian trend charts after manipulation
    concerns arose?
  options:
    O1:
      do: The project team withholds participant identities from Bayesian charts and identifies them on intuitive graphs.
      move: act
      irreversible: false
    O2:
      do: The project team identifies participants on Bayesian charts and supplementary intuitive graphs.
      move: act
      irreversible: false
    O3:
      do: The project team disciplines participants for manipulation and retains identities on Bayesian charts.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In early studies, participants were identified with Bayesian trend lines.
  - id: F2
    kind: situation
    status: assessed
    fact: The project team observed occasions when participants manipulated their assessments.
  - id: F3
    kind: situation
    status: assessed
    fact: Manipulation could occur when an analyst's assessments reflected a predetermined goal rather than unbiased judgment.
  - id: F4
    kind: situation
    status: assessed
    fact: The project team considered manipulation rare.
  - id: F5
    kind: situation
    status: assessed
    fact: Analysts showed a slight tendency to manipulate results when uneasy about the direction of their assessment.
  - id: F6
    kind: capability
    status: confirmed
    fact: A supplementary graphic could visibly associate individual participants with their intuitive opinions.
  - id: F7
    kind: situation
    status: assessed
    fact: Participants and readers showed substantial interest in visible identification on the supplementary graphic.
  - id: F8
    kind: situation
    status: confirmed
    fact: Disciplinary responses were an alternative the project team could have taken.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Even though manipulation was rare, it had occurred when assessments reflected a predetermined goal rather than unbiased
      judgment. Keeping identities off the Bayesian charts was the chosen way to protect the integrity of those calculations.
  - id: C2
    facts:
    - F1
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Identifying analysts with Bayesian trend lines could create a slight incentive to manipulate results when an assessment
      moved in an unwelcome direction. Separating identity from those charts addresses that risk.
  - id: C3
    facts:
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: A supplementary graphic allowed participants to be identified with their intuitive opinions, and participants and
      readers were interested in that visibility. O1 preserves that outlet without attaching identities to the Bayesian calculations.
  - id: C4
    facts:
    - F2
    - F4
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The project team sought to avoid disciplinary solutions and instead used separate identification on intuitive graphs
      to largely circumvent manipulation and improve the methodological purity of the Bayesian calculations.
  reasoning:
    read: This is a choice about how to present analyst identities so that the Bayesian assessment remains as methodologically
      sound as possible, not a choice to suppress all participant visibility. The trap is treating the interest in visible
      identities as a reason to identify analysts on the very charts where they had an incentive to steer their assessments.
    weighing: 'The integrity concern carries the most weight: manipulation had occurred, and unease about an assessment''s
      direction could encourage it. The team judged that separate intuitive graphs could preserve visibility while avoiding
      identification on Bayesian charts, and chose that approach rather than discipline. That balance depends on the separation
      actually limiting the incentive to manipulate the Bayesian assessments.'
    tradecraft: Keep participant identities off Bayesian trend charts and associate them with their individual intuitive opinions
      only on the supplementary graphic. Record the distinction and the reason for it so that the two forms of assessment
      are not conflated. The recording practice is an implementation recommendation.
    uncertainty: The team described manipulation as rare and the chosen approach as having almost entirely circumvented it,
      not eliminated every possible concern. Bayesian analysis was presented as an adjunct with limitations, rather than as
      a substitute for traditional analysis.
    handoff: The project team can make this presentation decision within the described project; the source identifies no need
      for referral to a disciplinary authority or another decision-maker. That allocation is a practical inference from the
      described choice.
    tempting_wrong:
      option: O3
      pull: Discipline could seem like a direct response to analysts manipulating assessments while retaining their identities
        on the charts.
      why_wrong: The team chose to avoid disciplinary solutions and found a presentation change that largely circumvented
        the problem while improving methodological purity.
    rejected:
      O2: Identifying participants on Bayesian charts retains the association that had accompanied occasions of manipulation,
        despite the available separate graphic for intuitive opinions.
      O3: The team chose the separate-graphic approach instead of disciplinary responses.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Manipulation continued after identities were removed from Bayesian charts and separated onto intuitive graphs.
      then: O3
      why: The chosen mitigation would no longer be shown to have largely circumvented the integrity problem, making the disciplinary
        alternative more compelling.
    would_not_change:
    - id: noflip1
      if: Manipulation remains rare but has occurred, as described for the early studies.
      why: Rarity did not lead the team to retain identities on Bayesian charts or to choose discipline; it still adopted
        the separate-graphic approach.
    watch_for:
    - id: watch1
      what: Further occasions of assessments being manipulated after the separate presentation approach is adopted.
      favors:
      - O3
      why: Such occasions would indicate that the chosen mitigation may not be sufficiently protecting the integrity of the
        Bayesian calculations.
  lesson: When identification creates an incentive to distort an analytical process, separate personal expression from the
    presentation of the analytical results if that preserves a useful outlet while protecting analytic integrity. Prefer that
    targeted mitigation over discipline when it addresses the concern, but reassess if it does not.
  limits: This reasoning concerns a presentation choice in a Bayesian analysis project, not a general rule about analyst anonymity
    or discipline. The source also cautions that Bayesian analysis applies only to suitable, specific questions with sufficiently
    relevant data and is an adjunct to traditional analysis.
