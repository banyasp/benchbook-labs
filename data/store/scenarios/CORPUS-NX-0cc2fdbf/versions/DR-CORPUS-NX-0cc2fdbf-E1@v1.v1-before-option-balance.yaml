case:
  id: DR-CORPUS-NX-0cc2fdbf-E1@v1
  title: Authority Over SOF-Support Fires Requests
  status: draft
  setting: At the onset of operations, corps fires supporting SOF, with some requested missions involving cross-border areas.
  decider: The corps fires staff
  agent: The corps fires staff
  agent_role: decide
  situation: The corps fires staff is considering requests from a group seeking corps fires support for SOF missions. Some
    requests concern cross-border areas that the requesting group's ROE permits. The staff's stated concerns include boundaries
    and its own ROE. Corps fires lacks authority to deny the requested missions. The staff's understanding of procedures and
    authorities for receiving missions in support of SOF is incomplete.
  question: What should the corps fires staff do with the requested missions, given its stated boundary and ROE concerns and
    the requesting group's ROE?
  options:
    O1:
      do: The corps fires staff permits the requested missions under the requesting group's ROE.
      move: act
      irreversible: false
    O2:
      do: The corps fires staff prohibits the requested missions under its own ROE.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The group sought corps fires support for missions.
  - id: F2
    kind: situation
    status: confirmed
    fact: Some requested missions concerned cross-border areas.
  - id: F3
    kind: authority
    status: confirmed
    fact: The requesting group's ROE allowed those missions.
  - id: F4
    kind: situation
    status: confirmed
    fact: Corps fires cited boundary limits when denying requested missions.
  - id: F5
    kind: authority
    status: confirmed
    fact: Corps fires cited its own ROE when denying requested missions.
  - id: F6
    kind: authority
    status: confirmed
    fact: Corps fires lacked authority to deny the requested missions.
  - id: F7
    kind: capability
    status: assessed
    fact: A lack of understanding of procedures and authorities for receiving missions in support of SOF contributed to the
      denials.
  considerations:
  - id: C1
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: Corps fires lacked authority to deny the requested missions, so prohibiting them on its own authority was not a permissible
      decision.
    rules_out:
    - O2
  - id: C2
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The requesting group's ROE permitted the requested missions, including those involving cross-border areas; relying
      on corps fires' own ROE to deny them was an error.
  - id: C3
    facts:
    - F4
    - F5
    - F7
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The denials arose from incomplete understanding of the procedures and authorities for receiving missions in support
      of SOF, rather than from authority corps fires held to deny them.
  - id: C4
    facts:
    - F1
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The denials prevented the group from effectively supporting strategic-level and corps-level objectives.
  reasoning:
    read: The issue is whether corps fires may deny SOF-support requests based on its own boundary or ROE concerns, not whether
      those concerns were raised. The trap is treating those concerns as authority to deny when corps fires lacked that authority
      and the requesting group's ROE allowed the missions.
    weighing: The lack of denial authority is decisive {C1}. The requesting group's ROE, the procedural misunderstanding behind
      the denials, and the resulting impediment to mission objectives reinforce permitting the requests {C2} {C3} {C4}. The
      conclusion depends on the stated allocation of authority and the group's ROE; no authority for corps fires to prohibit
      these requests is established.
    tradecraft: Apply the procedures and authority governing receipt of SOF-support missions rather than treating corps fires'
      own boundary or ROE concerns as a standalone veto. Record the applicable authority and the basis for the disposition,
      and refer any unresolved authority question to the appropriate decision-maker.
    uncertainty: The procedures for receiving SOF-support missions and the authority that would resolve an ambiguity are not
      detailed. The established facts are that corps fires lacked authority to deny these requests and that the requesting
      group's ROE allowed them.
    handoff: Corps fires should not decide to prohibit the requests on its own authority. If the applicable procedure or delegation
      is unclear, seek clarification from the appropriate authority rather than converting that uncertainty into a denial.
    tempting_wrong:
      option: O2
      pull: The staff cited its boundaries and its own ROE as reasons to deny the requests.
      why_wrong: Those concerns did not give corps fires authority to deny the missions; the denials were an error.
    rejected:
      O2: It was not chosen because corps fires lacked authority to deny the requested missions, and the denials were an error.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The governing procedures or delegation instead gave corps fires authority to deny these requests, and an applicable
        rule prohibited them.
      then: O2
      why: A valid grant of denial authority and an applicable prohibition would change the authority basis that makes the
        denials erroneous here.
    would_not_change:
    - id: noflip1
      if: The staff continues to cite boundaries or its own ROE while still lacking authority to deny the requests.
      why: Those were the stated grounds for denial, but corps fires' lack of denial authority makes reliance on them insufficient
        to justify a denial.
    watch_for:
    - id: watch1
      what: Whether the applicable procedures or delegation for receiving SOF-support missions have been clarified.
      favors:
      - O1
      why: Incomplete understanding of procedures and authorities contributed to the denials; clarification can help prevent
        an unauthorized denial.
  lesson: A staff member's concern about boundaries or its own ROE does not itself confer authority to deny a request. Apply
    the procedures and delegation governing the decision, and do not turn an authority gap or misunderstanding into a veto.
  limits: This conclusion concerns the stated authority to deny these requests and the requesting group's ROE. It does not
    establish that every SOF-support request is permitted or resolve cases with different authority, ROE, or procedural facts.
