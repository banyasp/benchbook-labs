case:
  id: DR-CORPUS-NX-3424120b-E2@v1
  title: Choosing Leadership for Analytic Standards Reform
  status: draft
  setting: Intelligence Community, during implementation of the IRTPA mandate; decision date not stated.
  decider: The official making the staffing decision
  agent: The official making the staffing decision
  agent_role: decide
  situation: The IRTPA mandate made improving and assuring the quality and integrity of analytic products a central priority.
    It specified goals but offered no clear guidance on implementation. Within the IC, personnel had interest and ability
    to operationalize standards and develop training and evaluative processes. A prevailing narrative held that nothing would
    change without fresh ideas and outside involvement. The official responsible for the effort viewed signaling responsiveness
    to that narrative as important. A respected diplomatic historian at a university was available and agreed to build and
    head the analytic integrity and standards directorate.
  question: What should the official making the staffing decision do about who leads the effort to operationalize analytic
    standards?
  options:
    O1:
      do: The official approves an outside expert's appointment and assigns that expert to lead the standards directorate.
      move: act
      irreversible: false
    O2:
      do: The official defers the appointment and asks IC personnel to propose a directorate leader and implementation plan.
      move: hold
      irreversible: false
    O3:
      do: The official rejects an outside expert's appointment and assigns IC personnel to lead the standards directorate.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Improving and assuring the quality and integrity of analytic products was a central focus of the IRTPA mandate.
  - id: F2
    kind: situation
    status: confirmed
    fact: The mandate specified goals without clear guidance on how to achieve them.
  - id: F3
    kind: capability
    status: confirmed
    fact: People within the IC had an interest in operationalizing standards.
  - id: F4
    kind: capability
    status: confirmed
    fact: People within the IC had the ability to operationalize standards.
  - id: F5
    kind: capability
    status: confirmed
    fact: People within the IC had the interest and ability to develop training procedures and evaluative processes.
  - id: F6
    kind: situation
    status: assessed
    fact: The prevailing narrative was that nothing would change without fresh ideas and outside involvement.
  - id: F7
    kind: situation
    status: assessed
    fact: The official judged it important to signal responsiveness to the prevailing narrative.
  - id: F8
    kind: capability
    status: confirmed
    fact: A respected diplomatic historian from outside the IC agreed to build and head the analytic integrity and standards
      directorate.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: People within the IC already had the interest and ability to operationalize standards and develop training and evaluation
      processes, so an internal lead was a viable option.
  - id: C2
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The official judged that responding visibly to the prevailing call for fresh ideas and outside involvement was important;
      choosing an outside leader served that institutional signaling purpose.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: A respected outside expert agreed to build and lead the directorate, making the chosen course available.
  reasoning:
    read: The mandate set an important goal but left implementation open, while capable personnel existed within the IC. The
      central judgment was therefore not that internal expertise was absent, but that outside involvement would signal responsiveness
      to the prevailing reform narrative.
    weighing: The official recognized the internal capability {C1} but judged the signal of fresh ideas and outside involvement
      important {C2}; an available, respected outside expert made that choice feasible {C3}. The stated balance favored approving
      the outside leader, not because an outside expert was shown to be technically superior, but because the official valued
      the institutional signal.
    tradecraft: Record the rationale distinctly from any claim about comparative qualifications, and keep IC personnel with
      relevant capability engaged in developing standards, training, and evaluation.
    uncertainty: The passage does not compare the candidates' qualifications, specify the appointment process, or assess the
      outside leader's later performance. The stated rationale is the official's judgment about signaling responsiveness.
    handoff: The official made the staffing decision. No required referral or approval by another authority is identified;
      involving IC personnel in implementation would preserve access to the internal capability the official recognized.
    tempting_wrong:
      option: O3
      pull: IC personnel had the interest and ability to operationalize the standards and build implementation processes.
      why_wrong: That capability made an internal lead viable, but the official nevertheless judged it important to signal
        responsiveness through outside involvement.
    rejected:
      O2: The official chose to act rather than defer, because an outside expert was available and the official judged that
        signaling responsiveness mattered.
      O3: The official did not assign the lead role internally, despite recognizing internal capability, because the stated
        institutional rationale favored outside involvement.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The official no longer judged signaling responsiveness to the prevailing narrative important.
      then: O3
      why: With that institutional rationale removed, the recognized internal interest and ability would support assigning
        the lead internally.
    - id: flip2
      if: The outside expert were unavailable to build and head the directorate.
      then: O3
      why: The outside appointment would no longer be feasible, while internal personnel were identified as able to do the
        work.
    would_not_change:
    - id: noflip1
      if: Internal personnel remained interested and able to operationalize standards and develop training and evaluative
        processes.
      why: Those capabilities were recognized and did not prevent the official from choosing outside leadership.
    watch_for:
    - id: watch1
      what: Whether IC personnel remain available to contribute their implementation expertise.
      favors:
      - O3
      why: Their capability makes internal leadership a viable alternative and is relevant to carrying out the effort.
  lesson: When a mandate leaves implementation open, distinguish a genuine lack of internal capability from a separate institutional
    reason to seek outside leadership. If signaling reform is the stated reason for going outside, do not recast that choice
    as proof that internal expertise is inadequate.
  limits: This reasoning addresses the initial staffing choice and its stated institutional rationale only. It does not establish
    that outside leadership was objectively superior, resolve how implementation should be organized, or assess the appointee's
    later performance.
