case:
  id: DR-CORPUS-INC-IRAQ-NO-FLY-ZONES-AFTER-THE-1991-UPRISIN-NX-543bf6d9-E5@v1
  title: Protective No-Fly Zones in Iraq
  status: draft
  setting: Iraq, after the internal uprising following the 1991 Persian Gulf War; the governments of the United States, Britain,
    and France
  decider: The governments of the United States, Britain, and France
  agent: The governments of the United States, Britain, and France
  agent_role: decide
  situation: In the wake of Iraq’s defeat in the Persian Gulf War, Hussein ruthlessly suppressed an internal uprising. The
    Kurdish population in northern Kurdistan was a non-Arab minority, and Baghdad’s ruling elite had frequently shelled and
    chemically gassed the region. Residents faced the threat of Iraqi warplanes attacking people on the ground. The governments
    of the United States, Britain, and France faced a policy choice about protective no-fly zones over Iraq, including the
    northern Kurdish region.
  question: What should the governments of the United States, Britain, and France do about establishing protective no-fly
    zones over Iraq?
  options:
    O1:
      do: The coalition governments authorize protective no-fly zones over Iraq.
      move: act
      irreversible: false
    O2:
      do: The coalition governments prohibit protective no-fly zones over Iraq.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Kurds made up less than 20 percent of Iraq’s population.
  - id: F2
    kind: situation
    status: confirmed
    fact: Most Kurds adhered to Sunni Islam, and their non-Arab ethnicity and sense of ethno-nationalism angered Baghdad’s
      ruling elite.
  - id: F3
    kind: situation
    status: confirmed
    fact: Baghdad’s ruling elite frequently shelled and chemically gassed northern Kurdistan.
  - id: F4
    kind: situation
    status: confirmed
    fact: Hussein ruthlessly crushed the internal uprising in the wake of his defeat.
  - id: F5
    kind: capability
    status: assessed
    fact: Protective no-fly zones could keep Hussein’s warplanes from attacking inhabitants on the ground.
  - id: F6
    kind: capability
    status: assessed
    fact: A northern no-fly zone could provide air protection to the three-province-wide Kurdistan region.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: After Hussein’s suppression of the uprising, residents faced the threat of warplanes attacking people on the ground.
      Protective zones could keep those aircraft from harming inhabitants.
  - id: C2
    facts:
    - F2
    - F3
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The Kurdish population faced recurring shelling and chemical attacks amid hostility toward its non-Arab ethnicity
      and ethno-nationalism. That history strengthens the physical-security rationale for protection.
  - id: C3
    facts:
    - F4
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: A northern zone could protect the three-province Kurdish region. Security must come before stability, democracy,
      or development.
  reasoning:
    read: The immediate issue is physical protection after the uprising was crushed, in a region already subject to attacks—not
      whether stability or development can be achieved first. The trap is treating those longer-term goals as substitutes
      for the security that must precede them.
    weighing: The threat to inhabitants and the assessed protective capacity of a no-fly zone support {O1} {C1}. The region’s
      history of persecution and the potential for area-wide air protection reinforce that case {C2} {C3}. Security must come
      before stability, democracy, and development; the balance therefore depends on whether the zones can provide meaningful
      protection from the air threat.
    tradecraft: Record the protection rationale, the assessed threat and capability, the limits of what air protection addresses,
      and the basis for choosing between the two options. Keep the decision and its review at the government policy level.
    uncertainty: The protective rationale rests on the assessment that the zones could keep warplanes from attacking inhabitants,
      but the text does not evaluate legal authority, costs, or the zones’ effectiveness against threats other than aircraft.
    handoff: The governments named in the decision frame should make this policy choice together; coordination matters because
      they jointly provided protection and France later left the air patrols.
    tempting_wrong:
      option: O2
      pull: Leaving the population without air protection might seem preferable if stability or development is treated as
        the more immediate policy concern.
      why_wrong: 'That reverses the stated ordering: security must come before stability, democracy, or development, and the
        population faced a direct threat from warplanes.'
    rejected:
      O2: Protection is preferable because residents faced a serious security threat and a northern zone could shield the
        Kurdish region from Iraqi warplanes.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The governments assessed that the zones could not meaningfully prevent warplanes from attacking inhabitants.
      then: O2
      why: The central protective reason for authorizing the zones would no longer be available.
    - id: flip2
      if: The relevant threat to inhabitants no longer included attacks by Iraqi warplanes.
      then: O2
      why: The rationale for this air-protection measure would be substantially reduced.
    would_not_change:
    - id: noflip1
      if: The zones did not themselves secure later stability, democracy, or development.
      why: Those outcomes follow security rather than serving as prerequisites for providing it.
    watch_for:
    - id: watch1
      what: Whether protection remains reliably available when coalition participation changes.
      favors:
      - O1
      why: American power, supported by Britain, guaranteed the enclave’s safety, while France later left the air patrols.
  lesson: When a population faces an immediate physical-security threat, do not make protection wait on the achievement of
    stability or development. Match the measure to the threat it can address, and reassess if its protective capacity or the
    threat changes.
  limits: This reasoning concerns protective no-fly zones in the circumstances described and does not establish their legality
    or settle the merits of other forms of intervention. It also does not show that air protection addresses ground attacks
    or other threats.
  library:
    domain: use-of-force-policy
    family: CORPUS-INC-IRAQ-NO-FLY-ZONES-AFTER-THE-1991-UPRISIN
    source: https://jsouapplicationstorage.blob.core.windows.net/press/262/12-1.pdf
