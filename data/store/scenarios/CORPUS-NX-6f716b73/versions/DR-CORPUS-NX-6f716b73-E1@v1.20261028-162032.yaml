case:
  id: DR-CORPUS-NX-6f716b73-E1@v1
  title: Tribute or Refusal in 1801
  status: draft
  setting: United States, 1801, the presidency at the White House
  decider: The President of the United States
  agent: The President of the United States
  agent_role: decide
  situation: In 1801, the President faced Tripoli's demand for $250,000 immediately and $25,000 each year indefinitely. The
    United States had previously relied on tribute and ransom payments in dealing with Barbary demands, including a payment
    in 1795 to ransom 115 sailors. Tribute was understood to risk encouraging further demands, while paying tribute was also
    viewed as less expensive than conflict. Efforts to form a cooperative maritime defense had encountered interest but the
    kingdoms involved had not provided ships and crews.
  question: What should the President do about Tripoli's demand for tribute?
  options:
    O1:
      do: The President accepts Tripoli's demand and pays the requested tribute.
      move: act
      irreversible: true
    O2:
      do: The President rejects Tripoli's demand and withholds the requested tribute.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Barbary pirates preyed on Western sailing craft.
  - id: F2
    kind: situation
    status: confirmed
    fact: After independence from Britain in 1783, the United States was no longer protected by the Royal Navy.
  - id: F3
    kind: situation
    status: confirmed
    fact: Congress appropriated $80,000, about 20 percent of its budget, for tribute.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Tribute payments were understood at the time to encourage further payment demands.
  - id: F5
    kind: situation
    status: confirmed
    fact: In 1795, the United States paid almost a million dollars in cash, supplies, and a frigate to ransom 115 sailors.
  - id: F6
    kind: situation
    status: confirmed
    fact: Maritime kingdoms showed interest in a cooperative defense pact but did not provide ships and crews for it.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Paying tribute was regarded as less expensive than conflict.
  - id: F8
    kind: situation
    status: confirmed
    fact: Tripoli demanded $250,000 immediately and $25,000 per year indefinitely.
  considerations:
  - id: C1
    facts:
    - F4
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Tribute was understood to whet the appetite of the extortionists and invite repeated demands, so paying this demand
      risked perpetuating rather than ending the policy problem.
  - id: C2
    facts:
    - F6
    - F7
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: Payment was regarded as less expensive than conflict, and prospective maritime partners had not supplied ships and
      crews; these facts make paying a tempting lower-cost choice.
  - id: C3
    facts:
    - F3
    - F5
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: The prior tribute appropriation and the costly 1795 ransom show the substantial resources already committed under
      the payment approach; the account treats that approach as appeasement, not a durable answer.
  reasoning:
    read: The choice is not simply between a costly payment and a risky conflict. The trap is that a payment regarded as cheaper
      in the short term could encourage further extortion, while the United States had previously relied on tribute and ransom.
    weighing: The lower expense of tribute and the absence of ships and crews from prospective partners favor O1. But the
      President viewed payments as encouraging repeated demands, and the history of large transfers made that concern concrete.
      The source's balance therefore favors rejecting the demand despite the risk and expense of conflict; it depends especially
      on whether payment would end the demands or prompt more.
    tradecraft: 'State the choice and its rationale plainly: weigh the immediate cost of payment against the source-assessed
      risk of repeated demands, and record why the longer-term concern controls despite the acknowledged near-term cost advantage
      of tribute.'
    uncertainty: The account gives no quantified estimate of the costs or outcome of conflict, and does not establish that
      rejecting this particular demand would end future demands. It does make clear that the President regarded tribute as
      likely to encourage more.
    handoff: The President makes the policy choice. If rejection brings a need for further conflict-related authority or resources,
      involve Congress; the account describes congressional authorization in the ensuing response.
    tempting_wrong:
      option: O1
      pull: Paying was regarded as less expensive than conflict, and cooperative maritime defense had not materialized.
      why_wrong: 'That comparison weighs the immediate expense but not the central concern: tribute was understood to whet
        the extortionists'' appetite for repeated payments.'
    rejected:
      O1: The President did not choose payment because he viewed tribute as encouraging further extortion, notwithstanding
        its perceived lower cost than conflict.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that paying the demanded tribute would end the demands rather than encourage further extortion.
      then: O1
      why: That would remove the central reason the President rejected payment, leaving its acknowledged lower cost as a stronger
        consideration.
    would_not_change:
    - id: noflip1
      if: Payment remained less expensive than conflict, but was still expected to encourage further demands.
      why: Even if tribute costs less than conflict, the risk that it will encourage repeated extortion remains a reason to
        reject payment.
    watch_for:
    - id: watch1
      what: Evidence that tribute payments are followed by further demands.
      favors:
      - O2
      why: It would reinforce the concern that payments whet the appetite for more.
  lesson: Do not treat a cheaper immediate concession as a durable solution when it is understood to encourage repeated extortion.
    Compare near-term expense with the longer-term consequences of making further demands more likely.
  limits: This reasoning addresses the stated choice in 1801 and the assessment that tribute encouraged further demands. It
    does not establish that rejecting tribute is preferable when payment is reliably shown to end the demands, or resolve
    the legal and operational questions of any ensuing conflict.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-6f716b73
    source: https://jsouapplicationstorage.blob.core.windows.net/press/358/8-1.pdf
    episode_focus: The decision point is whether to keep paying tribute or reject the demand and accept the risk of conflict;
      the account says the President viewed payments as encouraging further extortion. Keep the focus on the policy choice
      and its rationale, not on the ensuing military operations.
