case:
  id: DR-CORPUS-NX-7bd115f4-E2@v1
  title: Building an Internal R&D Capability
  status: draft
  setting: OSS, October 1942
  decider: The OSS director
  agent: The OSS director
  agent_role: decide
  situation: In October 1942, the OSS director is considering whether OSS should establish an internal research-and-development
    capability or rely on resources outside the organization. The director favors OSS relying on its own resources. Research
    and development is viewed as capable of creating technical capabilities OSS needs. A prospective R&D chief has experience
    as an inventor and entrepreneur, along with contacts in government and private industry.
  question: What should the OSS director do about establishing an internal R&D capability or relying on resources outside
    OSS?
  options:
    O1:
      do: The OSS director declines an internal R&D capability and relies on outside resources.
      move: act
      irreversible: false
    O2:
      do: The OSS director authorizes an internal R&D capability for OSS.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The OSS director wanted OSS to rely on its own resources whenever possible.
  - id: F2
    kind: capability
    status: assessed
    fact: A prospective R&D chief had experience as an inventor.
  - id: F3
    kind: capability
    status: assessed
    fact: A prospective R&D chief had experience as an entrepreneur.
  - id: F4
    kind: capability
    status: confirmed
    fact: A prospective R&D chief had a network of contacts in government.
  - id: F5
    kind: capability
    status: confirmed
    fact: A prospective R&D chief had a network of contacts in private industry.
  - id: F6
    kind: capability
    status: assessed
    fact: Research and development was considered capable of creating the technical capabilities OSS needed.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The director wanted OSS to rely on its own resources whenever possible, supporting an internal capability rather
      than default reliance on outside resources.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Research and development was considered capable of creating the technical capabilities OSS needed, giving an internal
      branch a stated basis for serving the organization’s requirements.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The prospective chief’s inventor and entrepreneur experience, together with contacts in government and private industry,
      supported the director’s confidence that an internal R&D branch could provide capable technical support.
  reasoning:
    read: This is a choice about building an internal capability, not a choice between internal work and having no access
      to outside expertise. The trap is treating the chief’s outside contacts as a reason to rely on external resources; those
      contacts supported the internal R&D effort.
    weighing: The director’s preference for using OSS’s own resources and the assessment that R&D could create needed capabilities
      both favor authorizing the branch. The prospective chief’s experience and contacts reinforce that case. The balance
      depends on the judgment that internal R&D can meet OSS’s technical needs; no contrary constraint is identified.
    tradecraft: Record the decision as an authorization to establish internal R&D, with the stated purpose of creating technical
      capabilities OSS needs. Keep the rationale tied to the director’s preference and the assessed capability, rather than
      to unstated operational or technical claims.
    uncertainty: There is no comparison of costs, timing, or the adequacy of particular outside resources, so those factors
      cannot be weighed here.
    handoff: The OSS director is the decider in this scenario. The director may charge the prospective R&D chief with carrying
      out the authorized organizational function, while keeping the authorization decision with the director.
    tempting_wrong:
      option: O1
      pull: The prospective chief has contacts in government and private industry, which could make outside resources seem
        sufficient.
      why_wrong: The contacts strengthen the internal effort, while the director wanted OSS to rely on its own resources and
        R&D was considered capable of creating needed capabilities.
    rejected:
      O1: The director did not choose to decline internal R&D because the stated preference and capability assessment supported
        establishing it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The director had sound grounds to assess that internal R&D could not create the technical capabilities OSS needed.
      then: O1
      why: The capability rationale for an internal branch would no longer support authorization.
    would_not_change:
    - id: noflip1
      if: The prospective chief’s government and private-industry contacts were available.
      why: 'That fact alone would not reverse the choice: the contacts supported the internal R&D effort, rather than making
        outside resources a substitute for it.'
    watch_for:
    - id: watch1
      what: Evidence bearing on whether an internal R&D capability can create the technical capabilities OSS needs.
      favors:
      - O2
      why: That capability assessment is central to the case for establishing the branch.
  lesson: When an organization prefers to rely on its own resources, establish an internal capability when it is assessed
    as able to meet the organization’s needs. Treat a prospective leader’s external network as relevant to the internal capability
    when it supports that effort, not as an automatic substitute for it.
  limits: This reasoning applies when the director favors internal resources and R&D is considered capable of creating needed
    technical capabilities. It does not resolve comparative cost, urgency, or circumstances in which outside resources might
    be preferable.
