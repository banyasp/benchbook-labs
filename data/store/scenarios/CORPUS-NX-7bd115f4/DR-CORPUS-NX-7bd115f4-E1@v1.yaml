case:
  id: DR-CORPUS-NX-7bd115f4-E1@v1
  title: Centralizing Intelligence After Pearl Harbor
  status: draft
  setting: United States, 1942, federal government
  decider: The President
  agent: The President
  agent_role: decide
  situation: Since the American Revolution, different groups within the US Government had collected and disseminated intelligence.
    In the months before Pearl Harbor, the Army and Navy were separately reading Japanese codes. They failed to work together.
    That failure was considered one reason the Japanese achieved surprise and destroyed much of the US Pacific Fleet. After
    Pearl Harbor, the need for an organization like OSS was described as clear. The policy choice was whether to retain fragmented
    arrangements or establish a central organization combining intelligence functions.
  question: What should the President do about organizing the government's intelligence functions after Pearl Harbor?
  options:
    O1:
      do: The President decentralizes intelligence functions among existing government groups.
      move: act
      irreversible: false
    O2:
      do: The President centralizes intelligence functions in a national organization.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Various groups within the US Government had collected intelligence since the American Revolution.
  - id: F2
    kind: situation
    status: confirmed
    fact: Various groups within the US Government had disseminated intelligence since the American Revolution.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: In the months before Pearl Harbor, the Army and Navy were reading various Japanese codes.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Army and Navy failed to work together.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Army-Navy coordination failure was one reason the Japanese achieved surprise.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Japanese destroyed much of the US Pacific Fleet at Pearl Harbor.
  - id: F7
    kind: capability
    status: assessed
    fact: After Pearl Harbor, the need for an organization like OSS was described as clear.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Army and Navy separately read Japanese codes but failed to work together; that failure was assessed as one reason
      the Japanese achieved surprise. A central organization was the chosen response to the coordination problem.
  - id: C2
    facts:
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: The coordination failure accompanied the destruction of much of the Pacific Fleet. The scale of that loss underscores
      the stakes of organizing intelligence so that information is not left fragmented.
  - id: C3
    facts:
    - F1
    - F2
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Intelligence collection and dissemination had been spread among government groups, while after Pearl Harbor the need
      for an organization like OSS was described as clear. The OSS brought functions together under one roof.
  reasoning:
    read: The choice is not whether intelligence should be collected and disseminated; those functions already existed across
      government. The issue is whether to preserve fragmented arrangements after a failure to coordinate had been linked to
      strategic surprise. The trap is treating a long-standing arrangement as proof that it is adequate.
    weighing: 'The strongest reason favors O2: the Army-Navy coordination failure was identified as one reason for the surprise
      at Pearl Harbor, and the need for an organization like OSS was described as clear {C1} {C3}. The destruction of much
      of the Pacific Fleet makes the consequences of that failure especially weighty {C2}. The balance depends on whether
      bringing intelligence functions together can address the coordination problem; the account gives no comparable reason
      to retain fragmentation.'
    tradecraft: At the decision level, define the central organization's remit and how it coordinates the functions being
      brought together. Record the Pearl Harbor coordination failure as the rationale, along with the intended governance
      arrangements and any unresolved risks.
    uncertainty: The account identifies the coordination failure and the judgment that an organization like OSS was needed,
      but does not compare centralization's costs with alternatives or establish how well the new arrangement would perform.
    handoff: The President is the decision-maker. As a governance matter, the President could seek views from the existing
      intelligence groups about how to unite their functions, while retaining responsibility for the policy choice.
    tempting_wrong:
      option: O1
      pull: The government's intelligence functions had long been distributed among different groups, which can make preserving
        the established arrangement seem prudent.
      why_wrong: 'That history does not answer the central problem: the Army and Navy failed to work together, and that failure
        was assessed as one reason for the surprise at Pearl Harbor.'
    rejected:
      O1: The President did not retain fragmented arrangements because the Pearl Harbor coordination failure and the stated
        need for an organization like OSS favored bringing intelligence functions together.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that separate intelligence groups could coordinate effectively and that centralization
        would not improve coordination.
      then: O1
      why: If fragmentation could be maintained without the coordination failure that drove the case for OSS, its principal
        stated rationale for centralization would be weakened.
    would_not_change:
    - id: noflip1
      if: The separate intelligence groups' long history were offered as the only reason to preserve the existing arrangement.
      why: Longevity alone would not answer the documented coordination failure or the stated post-Pearl Harbor need for an
        organization like OSS.
    watch_for: []
  lesson: When fragmented responsibilities have contributed to a consequential coordination failure, consider whether bringing
    the relevant functions together can address that failure. A longstanding arrangement is not, by itself, evidence that
    it remains adequate.
  limits: This reasoning addresses the choice between fragmented and centralized intelligence functions in the circumstances
    described after Pearl Harbor. It does not establish that centralization is always preferable or resolve how any organization
    should conduct intelligence operations.
  library:
    domain: intel-oversight
    family: CORPUS-NX-7bd115f4
    source: https://www.cia.gov/static/e722f402ceede51303ed438ca5feea94/Official-OSS-Exhibition-Catalogue.pdf
    episode_focus: The decision point is whether to retain fragmented intelligence arrangements or establish a centralized
      organization combining intelligence functions. The catalogue connects the choice to the failure of Army and Navy coordination
      before Pearl Harbor; exclude the OSS’s later operational activities.
