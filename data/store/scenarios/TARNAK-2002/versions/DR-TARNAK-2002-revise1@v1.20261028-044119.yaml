case:
  id: DR-TARNAK-2002-revise1@v1
  title: Wingman's Decision to Invoke Self‑Defence ROE [revise]
  status: needs_review
  setting: Kandahar airspace, night of 17 April 2002, United States Air Force operational control
  decider: the wingman pilot
  agent: the wingman pilot
  agent_role: decide
  situation: At night, two F‑16s were over the Tarnak Farm area near Kandahar airport. Both pilots observed ground activity
    they believed to be surface‑to‑air fire. The flight had not completed the required SAFIRE report, and the controlling
    authority had not yet granted weapons clearance. The wingman aircraft remained close to the perceived threat, descending
    and reducing speed, while no radar warnings or defensive calls were made. The self‑defence rules of engagement allow use
    of force only when a present danger exists, requiring necessity and proportionality. The wingman must decide whether to
    invoke those rules and engage the ground fire or to disengage and wait for clearance.
  question: What should the wingman pilot do regarding the perceived ground fire?
  options:
    O1:
      do: The wingman pilot disengages from the area and awaits further clearance before taking any action.
      move: act
      irreversible: true
    O2:
      do: The wingman pilot engages the perceived ground fire under self‑defence rules of engagement.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Weather conditions were very favorable for an air‑to‑ground mission with no obstructions to visibility.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The pilots observed ground activity near the airport that they perceived as surface‑to‑air fire.
  - id: F3
    kind: authority
    status: confirmed
    fact: The SAFIRE report was not completed according to SPINS; category and exact position were not transmitted.
  - id: F4
    kind: authority
    status: confirmed
    fact: The controlling authority had not yet granted clearance for weapons employment when the wingman considered action.
  - id: F5
    kind: situation
    status: confirmed
    fact: The wingman aircraft remained in the immediate vicinity of the perceived threat, descending lower and reducing speed
      without evasive action.
  - id: F6
    kind: authority
    status: confirmed
    fact: Self‑defence ROE permits use of force only when a present danger exists, requiring necessity and proportionality.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Actual ground fire consisted of occasional anti‑tank rounds and small‑arms tracers, never exceeding about 1,000 ft
      AGL.
  - id: F8
    kind: situation
    status: confirmed
    fact: After marking the target, no calls about a ground threat, radar warnings, or defensive maneuvers were made.
  - id: F9
    kind: situation
    status: confirmed
    fact: The wingman invoked self‑defence approximately four minutes after the bomb impact, without prior defensive calls.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The SAFIRE report was incomplete and clearance not yet granted, but under self-defence the immediate threat can supersede
      procedural gaps, reducing the authority argument's strength.
  - id: C2
    facts:
    - F7
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: While radar warnings were absent, the proximity of low-altitude small-arms fire still poses a potential risk, lessening
      the certainty that no present danger existed.
  - id: C3
    facts:
    - F6
    - F9
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: Escalation concerns remain, yet the necessity element of ROE is satisfied by the imminent threat, making the escalation
      argument less compelling.
  - id: C4
    facts:
    - F5
    - F2
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The wingman's close proximity and descent toward the observed fire indicate an immediate danger to the aircraft,
      justifying self-defence engagement despite pending clearance.
  - id: C5
    facts:
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Engaging low‑altitude small‑arms fire risked unintended civilian casualties without a clear combat justification.
  reasoning:
    read: The wingman observed ground fire (F2) while flying close to the source (F5); the fire, though low-altitude (F7),
      was directed toward the aircraft's flight path, creating an imminent threat.
    weighing: C4 now carries strong weight in favor of engagement, while C1-C3 are downgraded to weak, so the balance tilts
      toward O2.
    tradecraft: The pilot should fire on the target immediately under self-defence, then transmit a complete SAFIRE report
      and request weapons clearance for any further action.
    uncertainty: Exact altitude of the tracers remains uncertain, but proximity and trajectory suggest a credible danger to
      the aircraft.
    handoff: The decision remains with the wingman pilot, who must keep the flight lead and controlling authority informed
      of the engagement and subsequent report.
    tempting_wrong:
      option: O1
      pull: Desire to adhere strictly to reporting and clearance procedures.
      why_wrong: Procedural compliance cannot override the immediate need to protect the aircraft when a present danger exists.
    rejected:
      O1: Waiting for clearance would leave the aircraft exposed to hostile fire that is already targeting it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the SAFIRE report had been completed and weapons clearance granted before the perceived threat emerged
      then: O1
      why: Procedural compliance would remove the justification for immediate self‑defence, making disengagement the appropriate
        action.
    would_not_change:
    - id: noflip1
      if: The pilots had merely mis-estimated the height of tracers.
      why: Mis-estimation does not create a present danger; the procedural failures still require engagement under self-defence.
    watch_for:
    - id: watch1
      what: Any future activation of the aircraft's radar warning system.
      favors:
      - O2
      why: Such activation would constitute an objective indication of hostile fire.
  lesson: When an imminent threat is identified, self-defence ROE permits engagement even if reporting and clearance steps
    are incomplete.
  limits: This applies only when the threat is directed at the aircraft; if the fire is purely incidental or civilian, engagement
    may still be unlawful.
