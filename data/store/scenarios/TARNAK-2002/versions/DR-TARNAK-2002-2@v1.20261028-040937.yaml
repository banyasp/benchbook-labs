case:
  id: DR-TARNAK-2002-2@v1
  title: Airborne Controller's Refusal of Weapon Employment Requests
  status: draft
  setting: Afghan airspace, 17 April 2024, Airborne Warning and Control System (AWACS) operation
  decider: the airborne controller (MCC)
  agent: the airborne controller (MCC)
  agent_role: decide
  situation: On 17 April, Coffee 51 Flight was directed to hold fire and was asked for additional SAFIRE report details at
    21:25:04Z. Coffee 52 reported sighting men and artillery fire on a road, invoked self‑defence and initiated an attack.
    The MCC on the AWACS repeatedly limited Coffee 52's weapon employment requests, citing a hunch that friendly forces were
    present in the Kandahar area and that the threat description did not match his expectations. Communications with the CAOC
    were ongoing from 21:22:40Z, and higher authority was being consulted for clearance of the requests. At 21:26:11Z a call
    to disengage Coffee 51 arrived ten seconds after a bomb impact, two minutes after the SAFIRE report was known. The MCC
    felt unable to influence the issue further after the self‑defence call.
  question: What should the airborne controller do regarding the flight's repeated requests to employ weapons against the
    observed ground fire?
  options:
    O1:
      do: The MCC authorizes the flight's request to employ weapons against the observed ground fire.
      move: act
      irreversible: true
    O2:
      do: The MCC denies the flight's request to employ weapons against the observed ground fire.
      move: act
      irreversible: true
    O3:
      do: The MCC asks the CAOC for clearance before deciding on the flight's request to employ weapons.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: At 21:25:04Z Coffee 51 Flight was directed to hold fire and was asked for additional SAFIRE report details.
  - id: F2
    kind: situation
    status: confirmed
    fact: Coffee 52 sighted men on a road and artillery firing at them, invoked self‑defence and initiated an attack.
  - id: F3
    kind: authority
    status: confirmed
    fact: The MCC repeatedly limited Coffee 52's requests to employ weapons despite multiple requests.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The MCC's limitation was based on a hunch that friendly forces were in the Kandahar area and that the threat description
      was inconsistent with his impression of threat level and tactics.
  - id: F5
    kind: authority
    status: confirmed
    fact: Communications between the MCC and the CAOC were ongoing from 21:22:40Z to the time of impact, reporting the event
      to higher authorities for proper clearances for Coffee 51's requests.
  - id: F6
    kind: situation
    status: confirmed
    fact: At 21:26:11Z a call directing Coffee 51 to disengage arrived ten seconds after the bomb impact and two minutes after
      the SAFIRE report was known.
  - id: F7
    kind: capability
    status: assessed
    fact: The MCC felt he could not influence the issue further after the self‑defence call was made.
  - id: F8
    kind: authority
    status: confirmed
    fact: The CAOC Director testified that in such cases the event must be reported to higher authorities for clearance of
      weapon employment requests.
  considerations:
  - id: C1
    facts:
    - F5
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The MCC must report the event to higher authorities and obtain clearance before authorizing weapon employment, as
      testified by the CAOC Director.
  - id: C2
    facts:
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: A hunch that friendly forces were in the area creates a significant risk of fratricide, requiring denial of the request.
  - id: C3
    facts:
    - F6
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The disengagement call arrived after the bomb impact, indicating that further weapon use would be untimely and could
      exacerbate the situation.
  - id: C4
    facts:
    - F7
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: After Coffee 52 invoked self‑defence, the MCC felt it could no longer influence the engagement, reinforcing the decision
      to deny additional requests.
  reasoning:
    read: The MCC faced a trap of acting on an unverified hunch of friendly presence while higher authority clearance was
      still pending; the correct view is that without clear authorization, weapon use must be withheld.
    weighing: C1 and C2 together outweigh any benefit of immediate engagement. The need for clearance (C1) and the risk to
      own forces (C2) dominate the analysis. The weaker considerations (C3, C4) reinforce denial but do not shift the balance.
    tradecraft: Record the denial in the mission log, note the request and the reason (awaiting clearance, possible friendly
      presence), and forward the request to the CAOC for formal approval.
    uncertainty: There is uncertainty about whether friendly forces were actually in the area, which justifies a precautionary
      denial.
    handoff: The MCC should continue to coordinate with the CAOC, but the immediate decision is to deny until the CAOC provides
      clearance.
    tempting_wrong:
      option: O1
      pull: Desire to stop the observed artillery fire and protect civilians.
      why_wrong: Authorizing without clearance risks fratricide and violates the requirement to obtain higher‑authority approval.
    rejected:
      O1: Not chosen because clearance was not yet obtained and there was a credible risk of friendly forces.
      O3: Not chosen because the MCC already engaged the CAOC and a denial pending clearance is the appropriate action.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Higher authority grants immediate clearance for weapon employment against the observed ground fire.
      then: O1
      why: With authorized clearance, the risk of fratricide is mitigated by official approval.
    would_not_change:
    - id: noflip1
      if: The artillery fire continues but the risk of friendly forces remains unverified.
      why: The denial remains justified to avoid possible fratricide.
    watch_for:
    - id: watch1
      what: Positive identification that no friendly forces are present in the target area.
      favors:
      - O1
      why: Clear evidence eliminates the fratricide risk, allowing authorization.
  lesson: When uncertainty exists about friendly presence, the airborne controller must deny weapon employment until higher‑authority
    clearance is obtained, prioritizing force protection and lawful authority.
  limits: This rule applies only where clearance is required and there is a credible risk of fratricide; it does not cover
    situations with definitive hostile identification or where ROE permit immediate self‑defence.
