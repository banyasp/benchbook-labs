case:
  id: DR-TARNAK-2002-restyle2@v1
  title: Airborne Controller Decision on Weapon Employment Requests [restyle]
  status: needs_review
  setting: Northern Valley air corridor, evening of 17 April 2023, Tactical Airborne Surveillance Platform (TASP)
  decider: the flight operations officer
  agent: the flight operations officer
  agent_role: decide
  situation: During the evening of 17 April, the flight operations officer fielded several solicitations from a strike package
    to fire upon detected ground fire in the Northern Valley sector. The officer suspected that allied units might be operating
    nearby and sought guidance from the command authority. Although the requests persisted, the officer repeatedly constrained
    the strike package's actions. At 21:26:11Z, the package declared a self-defence situation and commenced an attack, ten
    seconds after a munition impact and two minutes after receipt of a SAFIRE intelligence packet. After the self-defence
    declaration, the officer judged that further influence was no longer possible. The request to "disengage" was transmitted
    shortly after the impact.
  question: How should the flight operations officer respond to the recurring solicitations to fire on the observed ground
    fire while a suspicion of friendly presence exists and command authority has already been consulted?
  options:
    O1:
      do: Authorize the strike package to fire its weapons immediately.
      move: act
      irreversible: true
    O2:
      do: Deny the strike package's request to fire any weapons.
      move: act
      irreversible: true
    O3:
      do: Request further clarification from command authority before deciding any.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The flight operations officer received multiple solicitations from the strike package to employ weapons.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The officer harbored a suspicion that allied forces were operating in the Northern Valley sector.
  - id: F3
    kind: authority
    status: confirmed
    fact: The officer consulted the command authority regarding the weapons request.
  - id: F4
    kind: situation
    status: confirmed
    fact: At 21:26:11Z the strike package declared self-defence and began an attack on the observed ground fire.
  - id: F5
    kind: capability
    status: confirmed
    fact: The officer repeatedly constrained the strike package's actions despite the repeated weapons solicitations.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Following the self-defence declaration, the officer assessed that further influence over the engagement was no longer
      feasible.
  - id: F7
    kind: situation
    status: confirmed
    fact: The request to "disengage" was transmitted at 21:26:11Z, ten seconds after the munition impact.
  - id: F8
    kind: situation
    status: confirmed
    fact: The SAFIRE intelligence packet was received two minutes prior to the disengage transmission.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The officer's suspicion that allied forces were present introduced a substantial fratricide risk, supporting a denial
      of weapons employment.
  - id: C2
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Because the command authority had been consulted and no clearance to fire was provided, the officer lacks lawful
      permission to approve the request.
  - id: C3
    facts:
    - F4
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: After the strike package announced self-defence, the officer's authority to affect the engagement ceased, reinforcing
      the earlier denials.
  - id: C4
    facts:
    - F7
    - F8
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The disengage transmission arrived after the munition had already struck, rendering any subsequent approval moot
      and risking unnecessary escalation.
  reasoning:
    read: The flight operations officer confronted repeated requests to fire while suspecting allied forces nearby and awaiting
      authorization from command authority. The temptation was to assume that the immediacy of enemy fire outweighed fratricide
      risk, potentially resulting in an unlawful strike.
    weighing: Strong considerations concerning allied-force safety (C1) and lawful authority (C2) outweigh the weaker points
      about chain-of-command (C3) and escalation control (C4). The denials were justified, so the overall balance favors continued
      refusal.
    tradecraft: Log each denial, reference the consultation with command authority, record the timing of the SAFIRE packet
      and the self-defence declaration, and note that influence ceased after the self-defence call.
    uncertainty: The officer's suspicion was not corroborated by positive identification; the intelligence remained inconclusive.
    handoff: Responsibility for the decision remains with the flight operations officer after the authority consultation;
      no further delegation is required.
    tempting_wrong:
      option: O1
      pull: Impulse to neutralize enemy fire swiftly and shield ground forces.
      why_wrong: Approving fire without confirmed clearance and with a plausible chance of allied presence would breach ROE
        and create fratricide risk.
    rejected:
      O1: Approving weapons would contravene lawful authority and endanger allied forces.
      O3: Clarification has already been sought; additional delay would not change the absence of clearance.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Positive identification of hostile forces with no allied presence is obtained and command authority grants clearance.
      then: O1
      why: With verified enemy targets and proper authorization, the fratricide risk is eliminated, permitting lawful weapon
        employment.
    would_not_change:
    - id: noflip1
      if: Command authority continues to withhold clearance despite any suspicion.
      why: The officer lacks legal authority to grant fire regardless of personal judgment.
    watch_for:
    - id: watch1
      what: Receipt of a definitive SAFIRE packet confirming enemy fire and no allied forces.
      favors:
      - O1
      why: Such intelligence would shift the balance toward authorizing the request.
  lesson: When reasonable doubt exists regarding allied presence and no authorization from command authority is received,
    the flight operations officer must deny weapons employment to avoid unlawful fratricide.
  limits: This guidance applies only when positive identification of hostile targets is absent and the officer has not received
    explicit clearance; it does not apply when clearance is granted or allied forces are definitively excluded.
