case:
  id: DR-TARNAK-2002-1@v1
  title: Wingman's Decision to Invoke Self‑Defence ROE
  status: draft
  setting: Kandahar airspace, night of 17 April 2002, United States Air Force operational control
  decider: the wingman pilot
  agent: the wingman pilot
  agent_role: decide
  situation: At night, two F‑16 aircraft were over the Kandahar airport area observing ground activity. The pilots believed
    they were being targeted by surface‑to‑air fire, although no radar warnings or missile launches were detected. The lead
    aircraft had requested permission to employ weapons, but the MCC denied clearance and the authorization arrived only after
    the bomb impact. The wingman aircraft remained near the perceived threat, did not take evasive action, and no defensive
    calls were made. The self‑defence rules of engagement require a present danger and a proportional response. The wingman
    must decide whether to invoke those rules and engage the ground fire or to disengage and await proper clearance.
  question: What should the wingman pilot do about invoking self‑defence and engaging the ground fire?
  options:
    O1:
      do: The wingman disengages from the area and awaits clearance.
      move: act
      irreversible: true
    O2:
      do: The wingman engages the ground fire under self‑defence ROE.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Pilots observed ground activity near Kandahar airport at night under favorable weather conditions.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Pilots believed they were under surface‑to‑air fire, but no radar warnings, missile launches, chaff or flares were
      detected.
  - id: F3
    kind: authority
    status: confirmed
    fact: Self‑defence ROE requires a present danger (hostile act or intent) and a proportional response.
  - id: F4
    kind: capability
    status: confirmed
    fact: The wingman aircraft had weapons onboard and could engage ground fire.
  - id: F5
    kind: situation
    status: confirmed
    fact: Requests for weapon clearance were denied by the MCC until after the bomb impact, and the clearance arrived ten
      seconds too late.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Actual ground fire consisted of occasional anti‑tank rounds and tracers at low altitude, not directed at the aircraft.
  - id: F7
    kind: situation
    status: confirmed
    fact: Pilots did not take evasive action, remained in the area, and made no defensive calls.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Board concluded that the flight’s actions were the primary cause of the incident and the pilots bear responsibility.
  considerations:
  - id: C1
    facts:
    - F2
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The pilots perceived surface‑to‑air fire against them, creating a perceived present danger that justifies self‑defence.
  - id: C2
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Self‑defence ROE explicitly authorises the use of force when a hostile act or intent is present.
  - id: C3
    facts:
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The wingman possessed weapons and could deliver a proportional response against the limited ground fire.
  - id: C4
    facts:
    - F5
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Waiting for clearance while the perceived threat remained would have left the lead aircraft exposed to possible harm.
  - id: C5
    facts:
    - F8
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: The Board concluded the flight’s actions caused the incident but still endorsed invoking self‑defence as the correct
      response.
  reasoning:
    read: The wingman saw what he and the lead believed to be hostile surface‑to‑air fire, yet no radar or missile signatures
      confirmed it. The trap is to treat the lack of hard evidence as a reason to hold fire, ignoring the pilots’ reasonable
      perception of imminent danger.
    weighing: Considering {C1}–{C4}, the perceived danger, the explicit ROE authority, the ability to respond proportionally,
      and the risk of exposing the lead aircraft outweigh the uncertainty noted in {C5}. The balance therefore leans toward
      invoking self‑defence.
    tradecraft: The wingman should radio a self‑defence call, request immediate weapons release, and document the action in
      the SAFIRE report, noting the perceived threat, altitude estimate, and weapon employment.
    uncertainty: Night‑time visual estimation of tracer altitude is unreliable, creating doubt about the exact threat level.
    handoff: The decision is made by the wingman pilot alone because self‑defence ROE permits immediate action, but a brief
      radio update to the MCC is required.
    tempting_wrong:
      option: O1
      pull: The desire to avoid escalation and wait for formal clearance.
      why_wrong: Waiting would ignore the pilots’ reasonable perception of a present danger and could leave the formation
        vulnerable.
    rejected:
      O1: Disengaging and awaiting clearance would have failed to address the perceived imminent threat to the lead aircraft.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Post‑flight analysis determines the ground fire was purely friendly training with no hostile intent.
      then: O1
      why: Without a genuine hostile act or intent, the self‑defence condition of present danger is not met.
    would_not_change:
    - id: noflip1
      if: Clearance from the MCC remains delayed beyond the moment of perceived threat.
      why: The presence of a perceived hostile act still obliges the wingman to act under ROE.
    watch_for:
    - id: watch1
      what: Ambiguous night‑time fire observations that may be mis‑estimated.
      favors:
      - O1
      why: Improved verification could reduce the perceived danger and favor disengagement.
  lesson: When pilots reasonably perceive a hostile surface‑to‑air threat, self‑defence ROE authorises immediate, proportional
    engagement even if formal clearance is pending.
  limits: This rule applies only when a genuine hostile act or intent is perceived; it does not justify engagement against
    confirmed friendly or training fire.
