case:
  id: DR-TARNAK-2002-flip1@v1
  title: Wingman's Decision to Invoke Self‑Defence ROE [flip]
  status: needs_review
  setting: Afghan air corridor, night of 17 April 2002, under United States Air Force operational control
  decider: the wingman pilot
  agent: the wingman pilot
  agent_role: decide
  situation: During a nocturnal sortie two F-16s patrolled the Tarnak Farm sector near Kandahar airfield. Both crew members
    observed flashes they interpreted as surface-to-air fire. The flight had not yet filed the required SAFIRE report, and
    weapons clearance from the controlling authority was still pending. The wingman aircraft stayed close to the suspected
    source, lowered altitude and throttled back, while no radar-warning alerts or defensive calls were received. Self-defence
    rules of engagement allow force only when a present danger exists, demanding necessity and proportionality. The pilot
    must decide whether to invoke those rules and strike the ground fire or to withdraw and wait for clearance.
  question: How should the wingman pilot respond to the perceived ground fire?
  options:
    O1:
      do: Disengage from the area and await further weapons clearance before taking any action.
      move: act
      irreversible: true
    O2:
      do: Engage the perceived ground fire under the self-defence rules of engagement.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Visibility was excellent, with clear skies and no haze, supporting precise air-to-ground operations.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Both pilots sighted bursts near the airfield that they interpreted as hostile surface-to-air fire.
  - id: F3
    kind: authority
    status: confirmed
    fact: The SAFIRE report was not completed according to SPINS; category and exact position were not transmitted.
  - id: F4
    kind: authority
    status: confirmed
    fact: The controlling authority had not yet granted clearance for weapons employment when the wingman considered action.
  - id: F5
    kind: situation
    status: confirmed
    fact: The wingman kept the aircraft within a few hundred metres of the suspected shooter, lowering altitude and throttling
      back instead of pulling away.
  - id: F6
    kind: authority
    status: confirmed
    fact: Self-defence ROE permits use of force only when a present danger exists, requiring necessity and proportionality.
  - id: F7
    kind: situation
    status: confirmed
    fact: The aircraft’s audio warning system emitted three rapid tones, the protocol used when an adversary weapon system
      is locked onto the platform.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The fire that was actually observed consisted of sporadic anti-tank shells and small-arms tracer rounds, never rising
      above roughly 300 m above ground.
  - id: F9
    kind: situation
    status: confirmed
    fact: After marking the target, the cockpit’s threat‑detection display lit up with a set of red emitter symbols and a
      short chime sounded, the standard cue that the aircraft is being tracked by enemy fire.
  - id: F10
    kind: situation
    status: confirmed
    fact: The wingman invoked self‑defence about one minute after the visual and audio cues appeared, citing the imminent
      danger.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Although the SAFIRE report remained incomplete and weapons clearance had not been granted, the self-defence ROE authorises
      immediate action when a present danger is confirmed, which the lock-on alerts demonstrate.
  - id: C2
    facts:
    - F7
    - F9
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The three-tone audio alert and the red emitter symbols on the threat display provide objective evidence that an enemy
      weapon system is tracking the aircraft, establishing a present danger to the platform.
  - id: C3
    facts:
    - F6
    - F10
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The pilot invoked self-defence within a minute of the alerts, satisfying the necessity element of the ROE; the response
      is proportionate to the imminent threat.
  - id: C4
    facts:
    - F5
    - F2
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: Maintaining proximity and descending enables acquisition of a firing solution against an imminent threat, supporting
      engagement.
  - id: C5
    facts:
    - F8
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Engaging low-altitude small-arms fire risks collateral damage to nearby civilians, but the imminent danger to the
      aircraft justifies the action.
  reasoning:
    read: The wingman received unmistakable lock-on cues—a three-tone audio warning and red emitter symbols on the threat
      display—indicating that an enemy weapon system was actively tracking the aircraft. These objective alerts satisfy the
      'present danger' requirement of the self-defence ROE, outweighing the procedural shortfall of an unfinished SAFIRE report
      and the lack of formal weapons clearance.
    weighing: Strong considerations C1, C2, and C3 each point to the necessity and proportionality of immediate engagement.
      The weak concerns C4 and C5 are outweighed by the clear danger to the platform. Consequently, the only legally and operationally
      sound course is to engage under self-defence.
    tradecraft: The wingman should maintain the current position, acquire a firing solution, and employ approved munitions
      against the source of the lock-on. He must simultaneously transmit a complete SAFIRE report with category and coordinates,
      and inform the controlling authority of the engagement as it proceeds.
    uncertainty: While the exact altitude of the tracer rounds is uncertain, the lock-on alerts provide a reliable, objective
      indication of hostile fire directed at the aircraft.
    handoff: The decision rests with the wingman pilot, who must keep the flight lead and controlling authority apprised;
      no further delegation is required.
    tempting_wrong:
      option: O1
      pull: The desire to avoid procedural violations and potential civilian harm.
      why_wrong: Disengaging would leave the aircraft exposed to an actively tracking enemy weapon, violating the self-defence
        ROE's necessity requirement.
    rejected:
      O1: Waiting for clearance would ignore the verified lock-on threat, breaching the self-defence ROE and endangering the
        crew.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: No lock-on audio tones or threat-display cues are received, indicating that the aircraft is not being tracked by
        hostile fire.
      then: O1
      why: Without an objective indication of present danger, the self-defence ROE would not be satisfied, making disengagement
        the correct choice.
    would_not_change:
    - id: noflip1
      if: The pilots had only mis-estimated the height of tracer rounds.
      why: A mis-estimation does not create a present danger; procedural failures still require disengagement.
    watch_for:
    - id: watch1
      what: Any future activation of the aircraft's radar-warning receivers.
      favors:
      - O2
      why: Such activation would constitute an objective indication of hostile fire directed at the platform.
  lesson: When objective lock-on cues confirm a present danger, self-defence may be exercised immediately, even if SAFIRE
    reporting and weapons clearance are still pending.
  limits: This analysis applies only when an objective lock-on or radar-warning indication demonstrates hostile fire against
    the aircraft; it does not cover situations lacking such confirmation, such as unverified tracer sightings or non-hostile
    emissions.
