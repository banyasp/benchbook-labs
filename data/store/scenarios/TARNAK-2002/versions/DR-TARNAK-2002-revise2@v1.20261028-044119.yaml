case:
  id: DR-TARNAK-2002-revise2@v1
  title: Airborne Controller Decision on Weapon Employment Requests [revise]
  status: needs_review
  setting: Kandahar airspace, night of 17 April 2023, Airborne Mission Control Center (AWACS)
  decider: the airborne controller
  agent: the airborne controller
  agent_role: decide
  situation: During the night of 17 April, the airborne controller received multiple requests from a flight to employ weapons
    against observed ground fire in the Kandahar area. The controller had a hunch that friendly forces might be present nearby
    and had consulted higher authority about the requests. Despite the requests, the controller repeatedly limited the flight's
    actions. At 21:26:11Z, the flight called a self‑defence situation and initiated an attack, ten seconds after a bomb impact
    and two minutes after receiving a SAFIRE report. Following the self‑defence call, the controller felt unable to influence
    the issue further. The request to disengage was transmitted shortly after the impact.
  question: What should the airborne controller do with the repeated requests to employ weapons against the observed ground
    fire while a hunch of friendly presence exists and higher authority has been consulted?
  options:
    O1:
      do: The controller grants the request to employ weapons.
      move: act
      irreversible: true
    O2:
      do: The controller refuses the request to employ weapons.
      move: act
      irreversible: true
    O3:
      do: The controller asks higher authority for clarification before deciding.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The airborne controller received repeated weapon employment requests from the flight.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The controller had a hunch that friendly forces were present in the Kandahar area.
  - id: F3
    kind: authority
    status: confirmed
    fact: Higher authority was consulted by the controller regarding the weapon request.
  - id: F4
    kind: situation
    status: confirmed
    fact: At 21:26:11Z the flight called self‑defence and initiated an attack on observed ground fire.
  - id: F5
    kind: capability
    status: confirmed
    fact: The controller repeatedly limited the flight's actions despite multiple weapon employment requests.
  - id: F6
    kind: intelligence
    status: assessed
    fact: After the self‑defence call, the controller felt it could no longer influence the issue.
  - id: F7
    kind: situation
    status: confirmed
    fact: The request to "disengage" was transmitted at 21:26:11Z, ten seconds after the bomb impacted.
  - id: F8
    kind: situation
    status: confirmed
    fact: The SAFIRE report was received two minutes before the disengage call.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The controller's hunch that friendly forces were present created a significant risk of fratricide, justifying refusal
      of weapon employment.
  - id: C2
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Higher authority was consulted and no explicit clearance was given; the controller must seek further clarification
      before any weapons release.
  - id: C3
    facts:
    - F4
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: After the flight declared self‑defence, the controller’s authority to influence the engagement ended, reinforcing
      the prior refusals.
  - id: C4
    facts:
    - F7
    - F8
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The disengage request arrived after the bomb impact, making any later approval ineffective and risking unnecessary
      escalation.
  reasoning:
    read: The controller received repeated weapon-employment requests while suspecting friendly forces nearby and had already
      consulted higher authority without receiving clearance.
    weighing: A strong consideration of lawful authority (C2) now mandates asking higher authority for clarification (O3).
      The weaker escalation-control concern (C4) still leans toward refusal, but it does not outweigh the need for clear authorization.
      Consequently, the balance favors seeking clarification before any decision.
    tradecraft: Document the consultation with higher authority, note the lack of clearance, and record the timing of the
      SAFIRE report and self-defence call. Maintain a log of all refusals and the request for further clarification.
    uncertainty: The controller's hunch of friendly presence remains unverified; intelligence is ambiguous, increasing the
      need for definitive guidance.
    handoff: The decision now rests on obtaining additional direction from higher authority; the controller should pause any
      further action until clarification is received.
    tempting_wrong:
      option: O2
      pull: Desire to avoid fratricide by refusing outright without further input.
      why_wrong: Refusing without seeking additional clarification may ignore a legitimate engagement and bypass the chain
        of command's responsibility to provide clearance.
    rejected:
      O1: Granting weapons without confirmed clearance and with a reasonable risk of friendly presence would breach ROE and
        could cause fratricide.
      O2: An outright refusal neglects the duty to obtain definitive authority, potentially missing a lawful engagement.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Positive identification of hostile forces with no friendly presence is obtained and higher authority grants clearance.
      then: O2
      why: With confirmed enemy targets and proper authorization, the controller can safely refuse further clarification and
        proceed to engage.
    would_not_change:
    - id: noflip1
      if: Higher authority continues to withhold clearance despite any hunch.
      why: The controller lacks the legal authority to grant fire regardless of personal judgment.
    watch_for:
    - id: watch1
      what: Receipt of a definitive SAFIRE report confirming enemy fire and no friendly forces.
      favors:
      - O1
      why: Such intelligence would shift the balance toward granting the request.
  lesson: When there is reasonable doubt about friendly presence and no explicit clearance, the controller must seek further
    clarification before deciding on weapon employment.
  limits: This guidance applies only when positive identification of hostile targets is lacking and the controller has not
    received explicit authorization; it does not apply when clearance is granted or friendly forces are definitively ruled
    out.
