case:
  id: DR-TARNAK-2002-1@v1
  title: Wingman Self-Defence Decision over Kandahar
  status: draft
  setting: Kandahar airspace, night of 17 April 2002, United States Air Force operational control
  decider: the wingman pilot
  agent: the wingman pilot
  agent_role: decide
  situation: Two F-16 aircraft were operating over the Tarnak Farm area near Kandahar airport at night. The pilots observed
    ground activity they believed to be surface-to-air fire and requested a mark of the location. No evasive maneuvers, chaff,
    flares, or defensive calls were made, and the aircraft remained at altitude while circling the area. The SAFIRE report
    was incomplete, providing little information to higher command, and the Mission Control Center had denied permission to
    employ weapons pending clarification. The wingman pilot, after a brief request to fire his gun, faced a decision whether
    to invoke the self-defence rules of engagement and engage the perceived threat or to disengage and wait for clearance.
  question: What should the wingman pilot do regarding self-defence and engagement of the perceived ground fire?
  options:
    O1:
      do: The wingman pilot holds position and monitors the area without engaging, awaiting further instructions.
      move: hold
      irreversible: false
    O2:
      do: The wingman pilot asks the controlling authority to confirm the threat before acting.
      move: ask
      irreversible: false
      to: controlling authority
    O3:
      do: The wingman pilot invokes self‑defence ROE and engages the perceived ground fire.
      move: act
      irreversible: true
    O4:
      do: The wingman pilot refrains from self‑defence and disengages, awaiting clearance from the controlling authority.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Weather conditions were very favorable for an air-to-ground mission with no obstructions to visibility.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Both pilots perceived the ground activity as surface-to-air fire and felt threatened.
  - id: F3
    kind: situation
    status: confirmed
    fact: A request to mark the location of the activity by the lead aircraft was granted.
  - id: F4
    kind: situation
    status: confirmed
    fact: Neither aircraft took evasive action, used chaff or flares, or issued defensive calls while circling the area.
  - id: F5
    kind: situation
    status: confirmed
    fact: The SAFIRE report was incomplete; the category and exact position were not transmitted, limiting decision‑making
      information.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Mission Control Center repeatedly limited the wingman's actions and denied weapon employment until a self‑defence
      call was made.
  - id: F7
    kind: authority
    status: confirmed
    fact: Self‑defence ROE requires necessity (present danger) and proportionality; force may not be used for retaliation.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Actual ground fire consisted of anti‑tank rounds and small‑arms fire, with tracer altitude not exceeding about 1,000 ft
      AGL.
  - id: F9
    kind: capability
    status: confirmed
    fact: Both pilots were highly qualified with prior combat experience, including exposure to hostile surface‑to‑air fire.
  - id: F10
    kind: situation
    status: confirmed
    fact: The wingman pilot requested permission to employ his gun 90 seconds before invoking self‑defence.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: Both pilots perceived surface‑to‑air fire and felt threatened; self‑defence ROE requires a present danger, satisfying
      the necessity element.
  - id: C2
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Mission Control Center explicitly denied weapon employment until a self‑defence call was made, indicating that only
      a self‑defence invocation could legally authorize engagement.
  - id: C3
    facts:
    - F4
    - F9
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: The wingman’s duty to protect his lead aircraft and the highly qualified crew demands action when a perceived hostile
      fire endangers the formation.
  - id: C4
    facts:
    - F5
    equity: record_integrity
    favors:
    - O3
    weight: weak
    why: The SAFIRE report was incomplete, depriving higher command of critical threat data; the pilot must rely on his own
      assessment to fulfill the self‑defence requirement.
  reasoning:
    read: 'The pilots observed what they believed to be surface‑to‑air fire at night, but no evasive maneuvers or defensive
      measures were taken. The SAFIRE report was incomplete, and Mission Control Center withheld weapon clearance pending
      a self‑defence justification. The wingman therefore faced a classic self‑defence dilemma: act on perceived imminent
      danger or wait for higher authority.'
    weighing: Considering {C1} the perceived threat satisfies the necessity element of self‑defence; {C2} shows that authority
      to fire was only available after a self‑defence call; {C3} underscores the duty to protect the lead aircraft; {C4} highlights
      the lack of reliable higher‑level information, reinforcing the need for the pilot’s own judgment. The balance of these
      considerations strongly supports invoking self‑defence and engaging.
    tradecraft: The wingman should issue an immediate self‑defence call, log the time and nature of the perceived threat,
      complete the SAFIRE report with all available data, and notify the MCC of the engagement. All communications must be
      recorded for later review.
    uncertainty: There is uncertainty about the actual altitude and lethality of the ground fire (F8), but self‑defence is
      judged on the pilot’s reasonable perception of danger, not on post‑hoc verification.
    handoff: The decision is made by the wingman alone, but must be reported instantly to the MCC and later documented for
      oversight.
    tempting_wrong:
      option: O1
      pull: Holding position appears safe and avoids potential civilian harm.
      why_wrong: It neglects the necessity element of self‑defence and leaves the lead aircraft exposed to a perceived imminent
        threat.
    rejected:
      O1: Holding without engaging would violate the self‑defence necessity requirement.
      O2: Seeking further confirmation would delay action beyond the window of imminent danger.
      O4: Disengaging without engaging ignores the duty to protect the formation when a credible threat is perceived.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence shows the ground fire was low‑altitude, non‑threatening, and could not endanger the aircraft.
      then: O1
      why: Without a present danger, the necessity element of self‑defence disappears, making engagement unlawful.
    would_not_change:
    - id: noflip1
      if: Mission Control Center continues to deny weapon clearance until a self‑defence call is made.
      why: The authority structure still requires a self‑defence invocation before any engagement.
    watch_for:
    - id: watch1
      what: If the MCC later issues an explicit disengage order before the self‑defence call is transmitted.
      favors:
      - O4
      why: A higher‑authority directive to disengage would supersede the pilot’s self‑defence assessment.
  lesson: When pilots reasonably perceive an imminent hostile fire, self‑defence ROE authorizes immediate engagement even
    without prior clearance, provided the action is necessary and proportionate. Documentation of the perception and rapid
    reporting are essential for later accountability.
  limits: This rule applies only when a genuine, reasonably perceived threat exists and the pilot has sufficient situational
    awareness to judge necessity; it does not justify engagement based on vague or uncorroborated observations.
