case:
  id: DR-TARNAK-2002-2@v1
  title: Airborne Controller Decision on Weapon Employment Requests
  status: draft
  setting: Kandahar airspace, night of 17 April 2023, Airborne Mission Control Center (AWACS)
  decider: the airborne controller
  agent: the airborne controller
  agent_role: decide
  situation: During the night of 17 April, the airborne controller received multiple requests from a flight to employ weapons
    against observed ground fire in the Kandahar area. The controller had a hunch that friendly forces might be present nearby
    and had consulted higher authority about the requests. Despite the requests, the controller repeatedly limited the flight's
    actions. At 21:26:11Z, the flight called a self‑defence situation and initiated an attack, ten seconds after a bomb impact
    and two minutes after receiving a SAFIRE report. Following the self‑defence call, the controller felt unable to influence
    the issue further. The request to disengage was transmitted shortly after the impact.
  question: What should the airborne controller do with the repeated requests to employ weapons against the observed ground
    fire while a hunch of friendly presence exists and higher authority has been consulted?
  options:
    O1:
      do: The controller grants the request to employ weapons.
      move: act
      irreversible: true
    O2:
      do: The controller refuses the request to employ weapons.
      move: act
      irreversible: true
    O3:
      do: The controller asks higher authority for clarification before deciding.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The airborne controller received repeated weapon employment requests from the flight.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The controller had a hunch that friendly forces were present in the Kandahar area.
  - id: F3
    kind: authority
    status: confirmed
    fact: Higher authority was consulted by the controller regarding the weapon request.
  - id: F4
    kind: situation
    status: confirmed
    fact: At 21:26:11Z the flight called self‑defence and initiated an attack on observed ground fire.
  - id: F5
    kind: capability
    status: confirmed
    fact: The controller repeatedly limited the flight's actions despite multiple weapon employment requests.
  - id: F6
    kind: intelligence
    status: assessed
    fact: After the self‑defence call, the controller felt it could no longer influence the issue.
  - id: F7
    kind: situation
    status: confirmed
    fact: The request to "disengage" was transmitted at 21:26:11Z, ten seconds after the bomb impacted.
  - id: F8
    kind: situation
    status: confirmed
    fact: The SAFIRE report was received two minutes before the disengage call.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The controller's hunch that friendly forces were present created a significant risk of fratricide, justifying refusal
      of weapon employment.
  - id: C2
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Higher authority was consulted and no clearance to fire was received; without lawful authorization the controller
      must deny the request.
  - id: C3
    facts:
    - F4
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: After the flight declared self‑defence, the controller’s authority to influence the engagement ended, reinforcing
      the prior refusals.
  - id: C4
    facts:
    - F7
    - F8
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The disengage request arrived after the bomb impact, making any later approval ineffective and risking unnecessary
      escalation.
  reasoning:
    read: The airborne controller faced repeated weapon‑employment requests while suspecting friendly forces nearby and awaiting
      higher‑authority clearance. The trap was to assume the urgency of enemy fire outweighed the risk of fratricide, potentially
      leading to unlawful engagement.
    weighing: Strong considerations of own‑force life (C1) and lawful authority (C2) outweigh the weaker arguments about chain‑of‑command
      (C3) and escalation control (C4). The refusals were made with good reason, so the balance favors continued refusal.
    tradecraft: Document each refusal, cite the consultation with higher authority, record the timing of the SAFIRE report
      and self‑defence call, and note that after self‑defence the controller ceased influencing the engagement.
    uncertainty: The controller’s hunch was not corroborated by positive identification; intelligence remained ambiguous.
    handoff: The decision rests solely with the airborne controller after consulting higher authority; no further delegation
      is required.
    tempting_wrong:
      option: O1
      pull: Desire to suppress enemy fire quickly and protect ground troops.
      why_wrong: Granting fire without confirmed clearance and with a reasonable chance of friendly presence would breach
        ROE and risk fratricide.
    rejected:
      O1: Granting weapons would violate lawful authority and expose friendly forces to danger.
      O3: Further clarification was already sought; waiting longer would not change the lack of clearance.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Positive identification of hostile forces with no friendly presence is obtained and higher authority grants clearance.
      then: O1
      why: With confirmed enemy targets and proper authorization, the risk of fratricide is removed, allowing lawful weapon
        employment.
    would_not_change:
    - id: noflip1
      if: Higher authority continues to withhold clearance despite any hunch.
      why: The controller lacks the legal authority to grant fire regardless of personal judgment.
    watch_for:
    - id: watch1
      what: Receipt of a definitive SAFIRE report confirming enemy fire and no friendly forces.
      favors:
      - O1
      why: Such intelligence would shift the balance toward granting the request.
  lesson: When there is reasonable doubt about friendly presence and no clearance from higher authority, the airborne controller
    must refuse weapon employment to prevent unlawful fratricide.
  limits: This rule applies only when positive identification of hostile targets is lacking and the controller has not received
    explicit authorization; it does not apply when clearance is granted or friendly forces are definitively ruled out.
