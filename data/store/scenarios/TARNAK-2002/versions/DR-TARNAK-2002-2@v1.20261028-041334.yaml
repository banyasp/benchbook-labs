case:
  id: DR-TARNAK-2002-2@v1
  title: Airborne Controller's Refusal of Weapon Employment Requests
  status: draft
  setting: Kandahar airspace, night of 17 April, airborne command and control (AWACS) unit
  decider: the airborne controller
  agent: the airborne controller
  agent_role: decide
  situation: During a night operation over Kandahar on 17 April, a flight (Coffee 51) repeatedly requested permission to employ
    weapons against observed ground fire. The airborne controller, operating from the AWACS, repeatedly limited the flight's
    actions despite multiple requests. The controller based his refusals on a hunch that friendly forces might be present
    in the area. Higher authority in the CAOC was consulted and was in the process of granting clearances for the flight's
    requests. At 21:25:04Z the controller issued a hold‑fire direction and asked for more details from the SAFIRE report.
    Ten seconds after a bomb impact, at 21:26:11Z a call instructed the flight to disengage, and another flight (Coffee 52)
    reported enemy artillery and invoked self‑defence, initiating an attack.
  question: What should the airborne controller do with the flight's repeated requests to employ weapons against the observed
    ground fire?
  options:
    O1:
      do: The airborne controller grants the flight's request to employ weapons.
      move: act
      irreversible: true
    O2:
      do: The airborne controller denies the flight's request to employ weapons.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Coffee 51 Flight repeatedly requested permission to employ weapons against observed ground fire.
  - id: F2
    kind: situation
    status: confirmed
    fact: The airborne controller repeatedly limited the actions of Coffee 52 despite multiple weapon employment requests.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The controller believed, on a hunch, that friendly forces were present in the Kandahar area.
  - id: F4
    kind: authority
    status: confirmed
    fact: Higher authority in the CAOC was consulted and was in the process of granting clearances for the flight's requests.
  - id: F5
    kind: situation
    status: confirmed
    fact: At 21:25:04Z the controller passed a "hold fire" direction to Coffee 51 and requested additional SAFIRE report details.
  - id: F6
    kind: situation
    status: confirmed
    fact: At 21:26:11Z a call relaying direction to Coffee 51 to "disengage" arrived ten seconds after the bomb impact.
  - id: F7
    kind: situation
    status: confirmed
    fact: Coffee 52 sighted men and artillery, invoked self‑defence and initiated an attack.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The controller felt that after the self‑defence call he could no longer influence the issue.
  considerations:
  - id: C1
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Higher authority in the CAOC was being consulted and was in the process of granting clearance; ROE require waiting
      for that authority before weapon release.
  - id: C2
    facts:
    - F3
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The controller’s hunch that friendly forces were present created a substantial risk of fratricide if weapons were
      employed.
  - id: C3
    facts:
    - F2
    - F8
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The MCC repeatedly limited actions and the controller felt he could no longer influence the issue after the self‑defence
      call, indicating deference to the established command hierarchy.
  - id: C4
    facts:
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: Holding fire prevents unnecessary escalation when the threat environment is uncertain.
  - id: C5
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Denial preserves the ability of the flight to act later under proper authority and reduces the chance of compromising
      the broader operation.
  reasoning:
    read: The airborne controller faced repeated weapon‑employment requests from Coffee 51 while suspecting friendly forces
      were in the area and while higher authority was still processing clearance. The trap was to act on a hunch and immediate
      pressure rather than wait for definitive authority and positive identification.
    weighing: Strong considerations {C1}, {C2} and {C3} outweigh the weaker {C4} and {C5}. The refusals were made with good
      reason and after the self‑defence call the controller could no longer influence the issue, leading to a clear balance
      toward denial.
    tradecraft: Issue a hold‑fire direction, request full SAFIRE details, document the hunch and the pending CAOC clearance,
      log the refusal, and note the self‑defence call as the point after which influence ceases.
    uncertainty: Intelligence on exact friendly locations was limited; the controller relied on a hunch rather than positive
      identification, creating uncertainty that justified caution.
    handoff: The decision remains with the airborne controller but must be continuously coordinated with the CAOC and MCC;
      no further delegation is required once the self‑defence call occurs.
    tempting_wrong:
      option: O1
      pull: Desire to protect ground troops under fire and to act quickly against observed enemy artillery.
      why_wrong: Acting without cleared authority and without certainty of enemy status would breach ROE, risk fratricide,
        and undermine the chain of command.
    rejected:
      O1: Granting the request would have violated the pending clearance process and exposed friendly forces to unintended
        harm.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Definitive positive identification of hostile forces and confirmation that no friendly units were present
      then: O1
      why: With clear enemy identification and no fratricide risk, the ROE would permit weapon employment.
    would_not_change:
    - id: noflip1
      if: Higher‑authority clearance arrives after the self‑defence call has been made
      why: The controller felt he could no longer influence the issue once self‑defence was declared.
    watch_for:
    - id: watch1
      what: Receipt of a complete SAFIRE report confirming enemy‑only activity
      favors:
      - O1
      why: Accurate intelligence would remove the friendly‑fire concern and allow the controller to grant the request.
  lesson: When friendly presence is uncertain and clearance is pending, an airborne controller must deny weapon employment
    until positive identification and authority are obtained, even under pressure to act.
  limits: This rule applies only to airborne controllers operating under ROE that require higher‑authority clearance; it does
    not govern ground commanders who have direct fire authority or situations where positive identification is already established.
