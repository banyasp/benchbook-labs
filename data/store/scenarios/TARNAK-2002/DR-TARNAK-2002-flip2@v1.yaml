case:
  id: DR-TARNAK-2002-flip2@v1
  title: Airborne Controller Decision on Weapon Employment Requests [flip]
  status: needs_review
  setting: Kandahar airspace, night of 17 April 2023, airborne command and control platform
  decider: the airborne weapons controller
  agent: the airborne weapons controller
  agent_role: decide
  situation: During the night of 17 April, the controller received several repeated solicitations from a flight to fire on
    observed ground fire in the Kandahar sector. The controller was uneasy about possible friendly presence and had already
    consulted senior command. Although the flight later declared a self-defence situation and began an attack, the controller
    felt unable to intervene further after the engagement began. A request to disengage was transmitted shortly after the
    bomb impact.
  question: How should the airborne weapons controller respond to the repeated fire-employment requests while a hunch of friendly
    presence exists and senior command has been consulted?
  options:
    O1:
      do: Approve the flight's request to employ weapons.
      move: act
      irreversible: true
    O2:
      do: Decline the flight's request to employ weapons.
      move: act
      irreversible: true
    O3:
      do: Seek additional clarification from senior command before deciding.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Several solicitations from the aircraft to fire were transmitted to the controller.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: Subsequent ISR imagery confirmed that no allied units were operating in the Kandahar area at the time of the incident.
  - id: F3
    kind: authority
    status: confirmed
    fact: Senior command responded with explicit permission for the flight to engage the observed ground fire.
  - id: F4
    kind: situation
    status: confirmed
    fact: At 21:26:11 Z the aircraft declared a self-defence scenario and began striking the identified ground fire.
  - id: F5
    kind: capability
    status: confirmed
    fact: Despite the multiple fire requests, the controller continuously imposed restrictions on the aircraft's actions.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Following the self-defence declaration, the controller judged that its ability to affect the engagement had ended.
  - id: F7
    kind: situation
    status: confirmed
    fact: A disengagement request was sent at 21:26:11 Z, roughly ten seconds post-impact of the bomb.
  - id: F8
    kind: situation
    status: confirmed
    fact: The SAFIRE intelligence packet arrived approximately two minutes prior to the disengagement transmission.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: ISR confirms no friendly forces nearby, removing fratricide risk; therefore granting fire maximizes protection of
      own forces.
  - id: C2
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Senior command has explicitly authorized engagement, satisfying the requirement for lawful clearance.
  - id: C3
    facts:
    - F4
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: After the flight declared self-defence, the controller's authority to affect the engagement diminished, suggesting
      continued refusal.
  - id: C4
    facts:
    - F7
    - F8
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The disengage request arrived after the bomb impact, making later approval ineffective and risking unnecessary escalation.
  reasoning:
    read: The airborne weapons controller faced repeated fire-employment requests while initially suspecting friendly presence,
      but ISR later ruled out any allied units and senior command granted explicit permission. The controller must now weigh
      the cleared risk against the enemy threat.
    weighing: Strong considerations of confirmed absence of friendly forces (C1) and lawful authority (C2) outweigh the weaker
      arguments about chain-of-command (C3) and escalation timing (C4). The balance therefore supports approving the request.
    tradecraft: Document the ISR confirmation, cite senior command's authorization, log the timing of the SAFIRE report and
      self-defence call, and note the controller's loss of influence after the engagement began.
    uncertainty: No remaining ambiguity about friendly presence; the only uncertainty concerns the timing of the disengage
      call, which is moot given the clearance.
    handoff: The decision rests with the airborne weapons controller after senior command's clearance; no further delegation
      is required.
    tempting_wrong:
      option: O2
      pull: Desire to avoid any possibility of unintended engagement.
      why_wrong: Refusing fire would ignore the explicit senior-command permission and the verified lack of friendly forces,
        needlessly endangering ground troops.
    rejected:
      O2: Denial would ignore the explicit senior-command permission and the verified lack of friendly forces, needlessly
        endangering ground troops.
      O3: Further clarification is unnecessary because senior command has already provided clear authorization.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: If later intelligence indicates that friendly forces may be present or senior command withdraws its permission,
      then: O2
      why: The controller should then refuse the request to avoid unlawful engagement.
    would_not_change:
    - id: noflip1
      if: Senior command continues to withhold clearance despite any hunch,
      why: The controller lacks legal authority to grant fire regardless of personal judgment.
    watch_for:
    - id: watch1
      what: Receipt of a definitive SAFIRE report confirming enemy fire and no friendly forces.
      favors:
      - O1
      why: Such intelligence would shift the balance toward granting the request.
  lesson: When ISR verifies no friendly presence and senior command provides explicit clearance, the airborne weapons controller
    should approve the flight's request to employ weapons.
  limits: This guidance applies only when positive identification of hostile targets is confirmed and lawful authorization
    has been received; it does not apply if friendly forces are still possible or clearance is absent.
