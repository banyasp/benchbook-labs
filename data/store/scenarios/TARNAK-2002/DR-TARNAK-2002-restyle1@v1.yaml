case:
  id: DR-TARNAK-2002-restyle1@v1
  title: Wingman's Decision to Invoke Self‑Defence ROE [restyle]
  status: needs_review
  setting: Afghan high-altitude corridor, night of 17 April 2002, under United States Air Force operational command
  decider: the wingman aviator
  agent: the wingman aviator
  agent_role: decide
  situation: During a nocturnal sortie, two F-16s operated over the Tarnak Farm sector near Kandahar airfield. Both crew members
    sighted ground activity they judged to be surface-to-air fire. The flight had not filed the mandatory SAFIRE report, and
    the controlling command had not yet issued weapons clearance. The wingman's aircraft stayed close to the suspected source,
    descending and throttling back, while no radar alerts or defensive calls were transmitted. Self-defence rules of engagement
    permit force only when an imminent danger exists, requiring both necessity and proportionality. The wingman must decide
    whether to invoke those rules and fire on the ground source or to withdraw and await clearance.
  question: What course of action should the wingman aviator take concerning the suspected ground fire?
  options:
    O1:
      do: The wingman aviator withdraws from the area and waits for explicit weapons clearance before any further action.
      move: act
      irreversible: true
    O2:
      do: The wingman aviator engages the suspected ground fire in accordance with self-defence rules of engagement.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Visibility was clear and weather conditions fully supported an air-to-ground sortie.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Both aviators sighted activity on the ground close to the airfield that they interpreted as surface-to-air fire.
  - id: F3
    kind: authority
    status: confirmed
    fact: The required SAFIRE report had not been filed in SPINS, leaving the threat category and precise coordinates uncommunicated.
  - id: F4
    kind: authority
    status: confirmed
    fact: The controlling command had not issued weapons clearance at the moment the wingman contemplated a response.
  - id: F5
    kind: situation
    status: confirmed
    fact: The wingman's jet stayed within the immediate threat zone, lowering altitude and throttling back while taking no
      evasive measures.
  - id: F6
    kind: authority
    status: confirmed
    fact: Self-defence rules of engagement authorize force solely when an imminent danger is present, demanding both necessity
      and proportionality.
  - id: F7
    kind: intelligence
    status: assessed
    fact: In reality, the ground fire comprised sporadic anti-tank shells and small-arms tracer rounds that never rose above
      roughly 1,000 ft above ground level.
  - id: F8
    kind: situation
    status: confirmed
    fact: Following target designation, no threat reports, radar warning alerts, or defensive maneuvers were transmitted.
  - id: F9
    kind: situation
    status: confirmed
    fact: The wingman declared self-defence about four minutes after the bomb strike, having made no earlier defensive calls.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Because the SAFIRE report remained unfinished and weapons clearance had not been received, the aviators possessed
      no lawful authority to initiate fire.
  - id: C2
    facts:
    - F7
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The absence of radar alerts or defensive calls, combined with the low-altitude small-arms nature of the fire, suggests
      there was no immediate threat to the aircraft.
  - id: C3
    facts:
    - F6
    - F9
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Since self-defence ROE demand both necessity and proportionality, engaging without an imminent danger would constitute
      an unwarranted escalation.
  - id: C4
    facts:
    - F5
    - F2
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: By staying inside the threat zone and descending, the wingman violated standard tactics that prescribe gaining separation
      while awaiting clearance.
  - id: C5
    facts:
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Attacking low-altitude small-arms fire could cause unintended civilian harm absent a clear combat rationale.
  reasoning:
    read: The encounter involved what was initially judged to be surface-to-air fire but, upon review, proved to be low-altitude
      small-arms fire lacking any radar indication or hostile intent toward the aircraft. The crew had not completed the mandatory
      SAFIRE report and lacked weapons clearance, creating both procedural and authority gaps.
    weighing: The analysis highlighted the lack of an immediate threat ({C2}) and the failure to satisfy reporting and clearance
      requirements ({C1}). These factors outweigh the pilot's subjective sense of danger. The self-defence ROE ({C3}) further
      prohibit force absent necessity, and the chain-of-command expectation ({C4}) calls for waiting for clearance. Consequently,
      withdrawal is the only action consistent with the Board's assessment.
    tradecraft: The wingman should immediately cease any maneuver toward the suspected source, climb to a safe altitude, and
      transmit a complete SAFIRE report including threat category and exact coordinates. He must then await explicit weapons
      clearance before resuming any offensive activity and record the incident in the flight log.
    uncertainty: Some doubt remains regarding the precise altitude of the tracer rounds, yet multiple eyewitness accounts
      confirm they stayed below 1,000 ft AGL, rendering an imminent danger unlikely.
    handoff: The decision authority rests with the wingman aviator, who must keep the flight lead and controlling command
      apprised; no further delegation is required.
    tempting_wrong:
      option: O2
      pull: The aviators felt threatened and wished to shield the lead aircraft.
      why_wrong: Engaging without a verified imminent danger would breach ROE, sidestep required clearance, and expose both
        jets to unnecessary risk.
    rejected:
      O2: Engagement would contravene self-defence ROE and the SAFIRE reporting mandate, and the threat was not objectively
        present.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Radar warning receivers had activated indicating hostile fire directed at the aircraft.
      then: O2
      why: A verified present danger would satisfy the necessity element of self-defence ROE.
    would_not_change:
    - id: noflip1
      if: The pilots had merely mis-estimated the height of tracers.
      why: Mis-estimation does not create a present danger; the procedural failures still require disengagement.
    watch_for:
    - id: watch1
      what: Any future activation of the aircraft's radar warning system.
      favors:
      - O2
      why: Such activation would constitute an objective indication of hostile fire.
  lesson: Aviators must fulfill reporting obligations and wait for explicit weapons clearance; self-defence can be invoked
    only when an imminent danger is objectively confirmed.
  limits: This guidance applies when the threat cannot be positively identified as hostile fire aimed at the aircraft; it
    does not extend to scenarios involving confirmed missile launches or radar warnings.
