case:
  id: DR-TARNAK-2002-1@v1
  title: Wingman's Decision to Invoke Self‑Defence ROE
  status: draft
  setting: Kandahar airspace, night of 17 April 2002, United States Air Force operational control
  decider: the wingman pilot
  agent: the wingman pilot
  agent_role: decide
  situation: At night, two F‑16s were over the Tarnak Farm area near Kandahar airport. Both pilots observed ground activity
    they believed to be surface‑to‑air fire. The flight had not completed the required SAFIRE report, and the controlling
    authority had not yet granted weapons clearance. The wingman aircraft remained close to the perceived threat, descending
    and reducing speed, while no radar warnings or defensive calls were made. The self‑defence rules of engagement allow use
    of force only when a present danger exists, requiring necessity and proportionality. The wingman must decide whether to
    invoke those rules and engage the ground fire or to disengage and wait for clearance.
  question: What should the wingman pilot do regarding the perceived ground fire?
  options:
    O1:
      do: The wingman pilot disengages from the area and awaits further clearance before taking any action.
      move: act
      irreversible: true
    O2:
      do: The wingman pilot engages the perceived ground fire under self‑defence rules of engagement.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Weather conditions were very favorable for an air‑to‑ground mission with no obstructions to visibility.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The pilots observed ground activity near the airport that they perceived as surface‑to‑air fire.
  - id: F3
    kind: authority
    status: confirmed
    fact: The SAFIRE report was not completed according to SPINS; category and exact position were not transmitted.
  - id: F4
    kind: authority
    status: confirmed
    fact: The controlling authority had not yet granted clearance for weapons employment when the wingman considered action.
  - id: F5
    kind: situation
    status: confirmed
    fact: The wingman aircraft remained in the immediate vicinity of the perceived threat, descending lower and reducing speed
      without evasive action.
  - id: F6
    kind: authority
    status: confirmed
    fact: Self‑defence ROE permits use of force only when a present danger exists, requiring necessity and proportionality.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Actual ground fire consisted of occasional anti‑tank rounds and small‑arms tracers, never exceeding about 1,000 ft
      AGL.
  - id: F8
    kind: situation
    status: confirmed
    fact: After marking the target, no calls about a ground threat, radar warnings, or defensive maneuvers were made.
  - id: F9
    kind: situation
    status: confirmed
    fact: The wingman invoked self‑defence approximately four minutes after the bomb impact, without prior defensive calls.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The SAFIRE report was incomplete and the controlling authority had not granted weapons clearance, so the pilots lacked
      lawful authority to engage.
  - id: C2
    facts:
    - F7
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: No radar warnings, no defensive calls, and the actual ground fire was low‑altitude small‑arms fire, indicating no
      present danger to the aircraft.
  - id: C3
    facts:
    - F6
    - F9
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Self‑defence ROE require necessity and proportionality; without a present danger, engaging would unnecessarily escalate
      the situation.
  - id: C4
    facts:
    - F5
    - F2
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The wingman remained in the threat area and descended, contrary to standard tactics that call for increased separation
      while awaiting clearance.
  - id: C5
    facts:
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Engaging low‑altitude small‑arms fire risked unintended civilian casualties without a clear combat justification.
  reasoning:
    read: The situation was a perceived surface‑to‑air fire that, upon analysis, was low‑altitude small‑arms fire with no
      radar warning or hostile intent directed at the aircraft. The pilots had not completed the required SAFIRE report and
      had no weapons clearance, creating a procedural and authority gap.
    weighing: The Board emphasized the lack of a present danger ({C2}) and the failure to follow reporting and clearance procedures
      ({C1}). These considerations outweigh the pilot's subjective perception of threat. The self‑defence ROE ({C3}) further
      bars use of force absent necessity, and the chain‑of‑command requirement ({C4}) mandates waiting for clearance. Consequently,
      disengagement is the only option consistent with the Board’s findings.
    tradecraft: The wingman should immediately cease maneuvering toward the perceived threat, climb to a safe altitude, and
      radio a complete SAFIRE report with category and precise coordinates. He should then await explicit weapons clearance
      before any further action and document the incident in the flight log.
    uncertainty: Uncertainty remains about the exact altitude of the tracers, but multiple testimonies confirm they did not
      exceed 1,000 ft AGL, making a present danger unlikely.
    handoff: The decision rests with the wingman pilot, but he must keep the flight lead and the controlling authority informed;
      no further delegation is required.
    tempting_wrong:
      option: O2
      pull: The pilots felt threatened and wanted to protect the lead aircraft.
      why_wrong: Engaging without a verified present danger violated ROE, bypassed required clearance, and exposed both aircraft
        to unnecessary risk.
    rejected:
      O2: Engagement would breach the self‑defence ROE and the SAFIRE reporting requirement, and the threat was not objectively
        present.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Radar warning receivers had activated indicating hostile fire directed at the aircraft.
      then: O2
      why: A verified present danger would satisfy the necessity element of self‑defence ROE.
    would_not_change:
    - id: noflip1
      if: The pilots had merely mis‑estimated the height of tracers.
      why: Mis‑estimation does not create a present danger; the procedural failures still require disengagement.
    watch_for:
    - id: watch1
      what: Any future activation of the aircraft's radar warning system.
      favors:
      - O2
      why: Such activation would constitute an objective indication of hostile fire.
  lesson: Pilots must adhere to reporting requirements and await explicit weapons clearance; self‑defence can only be invoked
    when a present danger is objectively verified.
  limits: This reasoning applies only when the threat cannot be positively identified as hostile fire against the aircraft;
    it does not cover situations with confirmed missile launches or radar warnings.
