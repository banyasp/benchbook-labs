case:
  id: DR-CORPUS-NX-2abcb27c-E1@v1
  title: Critical Infrastructure Protection Policy
  status: draft
  setting: United States, May 22, 1998; Presidential Decision Directive/NSC-63 on critical infrastructure protection.
  decider: The President
  agent: The President
  agent_role: decide
  situation: On May 22, 1998, the President faces a choice about the federal approach to protecting critical infrastructure.
    The stated goals are protection at the national, state, and local levels and limiting the impact of attacks on the welfare
    of the United States. The planned National Infrastructure Assurance Plan is organized around infrastructure sectors, including
    telecommunications, energy, banking and finance, water systems, and emergency services. The federal government is expected
    to set an example in infrastructure assurance. The policy choice is whether to rely on partnership and market-developed
    protections or make regulation the primary approach.
  question: What should the President do about the federal approach to protecting critical infrastructure?
  options:
    O1:
      do: The President should adopt a partnership-led policy, encourage market-developed protections, and reserve regulation
        as a last resort.
      move: act
      irreversible: false
    O2:
      do: The President should reject a partnership-led policy and make regulation the primary approach to critical infrastructure
        protection.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Presidential Decision Directive/NSC-63, dated May 22, 1998, put the work behind the CIPP into policy.
  - id: F2
    kind: situation
    status: confirmed
    fact: The stated protection goal covers the national, state, and local levels.
  - id: F3
    kind: situation
    status: confirmed
    fact: The stated goal is to limit attack impacts to brief, infrequent, manageable, geographically isolated, and minimally
      detrimental effects on the welfare of the United States.
  - id: F4
    kind: situation
    status: confirmed
    fact: The directive calls for a public-private partnership.
  - id: F5
    kind: situation
    status: confirmed
    fact: The National Infrastructure Assurance Plan is organized around infrastructure sectors, including telecommunications,
      energy, banking and finance, water systems, and emergency services.
  - id: F6
    kind: situation
    status: confirmed
    fact: The federal government is to set an example for infrastructure assurance.
  - id: F7
    kind: situation
    status: confirmed
    fact: The federal government is to encourage the market to develop means and methods for protecting critical infrastructure.
  - id: F8
    kind: situation
    status: confirmed
    fact: Government regulation is identified as a last resort.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: critical_services
    favors:
    - O1
    weight: strong
    why: The policy's aim is to protect critical infrastructure at national, state, and local levels and limit attacks' effects
      on the country's welfare; this is the purpose the chosen approach is meant to serve.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The directive calls for a public-private partnership and organizes the National Infrastructure Assurance Plan by
      infrastructure sectors, supporting a coordinated partnership-led approach.
  - id: C3
    facts:
    - F6
    - F7
    equity: critical_services
    favors:
    - O1
    weight: strong
    why: The federal government is to set an example while encouraging the market to develop protective means and methods,
      rather than making regulation the primary approach.
  - id: C4
    facts:
    - F8
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: Treating government regulation as a last resort directly supports reserving it rather than adopting it as the primary
      approach.
  reasoning:
    read: This is a choice about the federal approach to a recognized infrastructure-protection goal, not a choice between
      protection and inaction. The trap is to infer from the seriousness and breadth of the goal that regulation must therefore
      be primary, even though the directive chooses persuasion, partnership, and market-developed protections.
    weighing: The stated protection and impact-limiting goals set the aim {C1}; the sector-organized plan and public-private
      partnership provide the framework {C2}. The federal example and encouragement of market-developed protections point
      to O1 {C3}, while the express last-resort role for regulation weighs against O2 as the primary policy {C4}. This balance
      depends on partnership and market protections being the chosen means of pursuing the stated goals; no further test is
      given for when regulation should cease to be a last resort.
    tradecraft: Record the policy choice and its stated rationale, and assess whether the partnership-led approach is advancing
      the protection goals. If it is not, reconsider whether the last-resort condition for regulation has been reached. This
      is decision practice, not an operational plan.
    uncertainty: The effectiveness of market-developed protections is not assessed, and no threshold is specified for resorting
      to regulation.
    handoff: The President is the decider in this scenario. Partnership with the private sector is part of the chosen policy,
      but no separate approval authority or required additional decision-maker is identified.
    tempting_wrong:
      option: O2
      pull: Because the protection goal is broad and concerns critical infrastructure, making regulation primary may seem
        the more direct way to secure protection.
      why_wrong: 'That inference does not follow the directive''s stated policy: it calls for partnership and market development
        and expressly identifies regulation as a last resort.'
    rejected:
      O2: The directive chose partnership and market-developed protections, reserving government regulation as a last resort
        rather than making it primary.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Partnership and market-developed protections proved inadequate to achieve the stated protection and impact-limiting
        goals.
      then: O2
      why: In that circumstance, a stronger regulatory approach could be warranted as a last resort; no specific threshold
        for making that judgment is provided.
    would_not_change:
    - id: noflip1
      if: The infrastructure plan covers multiple sectors, including telecommunications, energy, finance, water systems, and
        emergency services.
      why: Sectoral breadth is already part of the directive's framework and does not by itself displace its partnership-led
        policy.
    watch_for:
    - id: watch1
      what: Whether the market develops protective means and methods that advance the directive's stated goals.
      favors:
      - O1
      - O2
      why: Evidence that the approach is advancing the goals supports continuing it; evidence of inadequacy may support reconsidering
        regulation as a last resort.
  lesson: When a directive identifies partnership and market development as its preferred policy and regulation as a last
    resort, do not treat the seriousness of the goal alone as a reason to make regulation primary. Preserve the stated preference
    while reassessing whether it is achieving the goal.
  limits: This reasoning addresses the federal policy choice described in PDD-63, not the detailed design or implementation
    of infrastructure protections. Effectiveness evidence and a precise condition for escalating to regulation are not provided.
