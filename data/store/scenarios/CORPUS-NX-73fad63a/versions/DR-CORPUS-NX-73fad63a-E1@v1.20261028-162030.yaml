case:
  id: DR-CORPUS-NX-73fad63a-E1@v1
  title: Assessing Iraq’s Aluminum-Tube Procurement
  status: draft
  setting: Iraq, since mid-2000; analysts assessing procurement
  decider: The analysts
  agent: The analysts
  agent_role: decide
  situation: Since mid-2000, Iraq has sought to procure aluminum tubes. The procurement violated UN sanctions and proceeded
    despite substantial international pressure. Rocket-related uses for the tubes were possible. Their specifications were
    assessed as consistent with earlier Iraqi gas centrifuge rotor designs. An assessment projected that, if Iraq procured
    most of the tubes, it could develop a uranium-enrichment capability within 5 to 7 years.
  question: What should the analysts conclude about the likely purpose of Iraq’s aluminum-tube procurement?
  options:
    O1:
      do: The analysts should accept the centrifuge-program interpretation and reject a rocket-use interpretation of Iraq’s
        aluminum-tube procurement.
      move: act
      irreversible: false
    O2:
      do: The analysts should reject the centrifuge-program interpretation and accept a rocket-use interpretation of Iraq’s
        aluminum-tube procurement.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Iraq had sought to procure aluminum tubes since mid-2000.
  - id: F2
    kind: authority
    status: confirmed
    fact: The procurement violated UN sanctions.
  - id: F3
    kind: situation
    status: confirmed
    fact: The procurement proceeded despite great international pressure against it.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Rocket-related uses for the tubes were possible.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The specifications were consistent with earlier Iraqi gas centrifuge rotor designs.
  - id: F6
    kind: intelligence
    status: assessed
    fact: If Iraq procured most of the tubes, it could develop a uranium-enrichment capability within 5 to 7 years.
  considerations:
  - id: C1
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Rocket-related uses were possible, so the analysts should retain the alternative as a live possibility rather than
      treat centrifuge use as certain.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The assessed consistency with earlier Iraqi gas centrifuge rotor designs gives the centrifuge interpretation specific
      support beyond the existence of a possible alternative use.
  - id: C3
    facts:
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The conditional assessment that acquiring most of the tubes could enable uranium enrichment within 5 to 7 years makes
      the centrifuge interpretation consequential and supports taking it seriously.
  - id: C4
    facts:
    - F1
    - F2
    - F3
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: The effort to procure the tubes despite sanctions and substantial international pressure adds context to the concern,
      but does not by itself establish their intended use.
  reasoning:
    read: The analysts must distinguish a possible rocket-related use from the interpretation better supported by the stated
      evidence. The trap is to treat the existence of an alternative use as if it outweighed the assessed consistency with
      earlier centrifuge designs.
    weighing: The rocket-related alternative remains possible {C1}, but the assessed design consistency {C2} and the conditional
      enrichment-capability projection {C3} together favor the centrifuge-program interpretation. The sanctions violation
      and procurement despite international pressure add context, not proof of purpose {C4}. The judgment depends on the stated
      assessments being reliable; the record supports an endorsed interpretation, not certainty that no rocket use was intended.
    tradecraft: Record separately the evidence supporting the centrifuge interpretation and the acknowledged possible alternative.
      Do not present a conditional capability assessment as proof of intent, and revisit the judgment if relevant evidence
      changes.
    uncertainty: Rocket-related uses were possible, and the projected enrichment capability depended on Iraq procuring most
      of the tubes. The stated evidence therefore supports the centrifuge interpretation without making it conclusive.
    handoff: The analysts are the identified deciders. No separate approval authority or required referral is identified;
      independent analytic review could test the competing interpretation, but that is a process recommendation rather than
      a stated requirement.
    tempting_wrong:
      option: O2
      pull: Rocket-related uses were possible.
      why_wrong: Possibility alone does not outweigh the assessed consistency with earlier centrifuge designs and the stated
        projection of an enrichment capability.
    rejected:
      O2: The rocket-use interpretation was not chosen because its possibility did not outweigh the stated evidence favoring
        the centrifuge-program interpretation.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable additional evidence showed that the procurement was principally for rocket-related purposes and accounted
        for the assessed consistency with earlier centrifuge designs.
      then: O2
      why: That evidence would make the rocket-use interpretation better supported than the centrifuge-program interpretation.
    would_not_change:
    - id: noflip1
      if: Rocket-related uses remained merely possible, without additional evidence making them a better explanation of the
        procurement.
      why: A merely possible alternative does not outweigh the assessed consistency with earlier centrifuge designs and the
        conditional capability projection, which continue to favor O1.
    watch_for:
    - id: watch1
      what: Whether Iraq procured most of the tubes.
      favors:
      - O1
      why: Procuring most of the tubes could enable uranium enrichment within 5 to 7 years; this bears on the assessed capability,
        though it would not alone prove intended purpose.
  lesson: When assessing competing explanations, distinguish a possible alternative use from the interpretation that best
    fits the stated evidence. Treat conditional capability projections as consequential but not as proof of intent, and preserve
    uncertainty in the judgment.
  limits: This reasoning addresses the analysts' interpretation of this procurement on the stated evidence; it does not establish
    that the tubes were actually used for a centrifuge program or rule out any rocket-related use. It should not be transferred
    to a case with materially different evidence about purpose.
  library:
    domain: intel-analysis
    family: CORPUS-NX-73fad63a
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-31.pdf
    episode_focus: The decision point is the analysts’ judgment between competing interpretations of Iraq’s procurement. Focus
      on the stated evidence and reasoning for that assessment; exclude technical descriptions of centrifuge or rocket construction.
