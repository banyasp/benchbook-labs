case:
  id: DR-CORPUS-NX-de2f5015-E2@v1
  title: Institutionalizing Interagency Coordination for Africa
  status: draft
  setting: Africa during USAFRICOM’s formation; DOD and participating federal agencies.
  decider: DOD, acting with participating federal agencies
  agent: DOD, acting with participating federal agencies
  agent_role: decide
  situation: Before USAFRICOM’s formation, multiple U.S. military headquarters were responsible for building relationships
    with African countries. Other departments and agencies pursued diplomatic, economic, and informational objectives across
    the continent at the same time. The interagency process was frequently ad hoc and made more complex by these overlapping
    efforts. One organizational approach under consideration would incorporate civilian agencies into a command staff and
    leadership structure, including a senior diplomat in a civil-military deputy role. That deputy role was associated with
    planning and programming across several civilian-focused functions and with checking alignment with U.S. foreign-policy
    objectives.
  question: What should DOD, acting with participating federal agencies, do about interagency coordination for Africa?
  options:
    O1:
      do: DOD and participating federal agencies decentralize interagency coordination among existing military headquarters
        and agency processes.
      move: act
      irreversible: false
    O2:
      do: DOD and participating federal agencies centralize interagency coordination within USAFRICOM, including civilian
        staff and a civilian deputy.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Before USAFRICOM’s establishment, no fewer than three U.S. military headquarters were responsible for building relationships
      with African countries.
  - id: F2
    kind: situation
    status: confirmed
    fact: Other departments, agencies, and organizations pursued diplomatic, economic, and informational national-security
      objectives across the continent.
  - id: F3
    kind: situation
    status: confirmed
    fact: The interagency process was frequently ad hoc and complex.
  - id: F4
    kind: capability
    status: confirmed
    fact: The contemplated organizational approach incorporated DOS, USAID, Treasury, DOC, USCG, and other federal components
      into a command’s staff and leadership structure.
  - id: F5
    kind: capability
    status: confirmed
    fact: The organizational model paired a Deputy to the Commander for Military Operations with a senior U.S. diplomat serving
      as Deputy to the Commander for Civil-Military Activities.
  - id: F6
    kind: capability
    status: assessed
    fact: The civil-military deputy role covered planning and programming for health, humanitarian assistance, demining, disaster
      response, security-sector reform, strategic communications, and related functions, and was considered well suited to
      check alignment with U.S. foreign-policy objectives.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Multiple military headquarters and agencies pursued overlapping objectives through a frequently ad hoc process; institutionalizing
      coordination responds to that fragmentation and supports national-security objectives.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Embedding civilian agencies in the command's staff and leadership structure offers greater inclusion than the existing
      interagency process.
  - id: C3
    facts:
    - F5
    - F6
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: The senior diplomat's civil-military deputy role provides a place for civilian-focused coordination and is considered
      well suited to check that command activities align with U.S. foreign-policy objectives.
  reasoning:
    read: 'The problem is organizational fragmentation: multiple military headquarters and civilian agencies were pursuing
      related objectives across Africa through a process described as frequently ad hoc and complex. The trap is to treat
      the existing arrangement as adequate simply because the agencies already coordinate; the stated rationale is that embedding
      them in a shared structure can provide greater inclusion and a foreign-policy alignment check.'
    weighing: The fragmentation and complexity weigh strongly toward {O2} {C1}. The greater inclusion of civilian agencies
      and the diplomat's role in checking foreign-policy alignment reinforce that choice {C2} {C3}. The balance depends on
      the embedded civilian participation and deputy role actually serving those coordination and alignment purposes; the
      source gives the organizational rationale, not a comparative evaluation of every possible structure.
    tradecraft: As a decision practice, record the coordination problem being addressed, which agencies and civilian roles
      are included, and how the foreign-policy alignment check is assigned. These steps make the organizational rationale
      and accountability for the check clear.
    uncertainty: The stated reasons favor institutionalization, but do not quantify its effects or compare its performance
      against every decentralized alternative.
    handoff: DOD should act with the participating federal agencies, consistent with the described partnership that formed
      USAFRICOM and the cross-agency nature of the coordination problem.
    tempting_wrong:
      option: O1
      pull: It preserves coordination among the existing headquarters and agency processes without embedding civilian agencies
        in a command structure.
      why_wrong: That approach retains the fragmented, frequently ad hoc arrangement identified as the problem and forgoes
        the described civilian deputy's foreign-policy alignment check.
    rejected:
      O1: Decentralizing among existing headquarters and agency processes was not chosen because the stated rationale was
        to reduce ad hoc coordination and achieve greater interagency inclusion.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The embedded structure no longer included meaningful civilian participation or could not provide the foreign-policy
        alignment check that justifies it.
      then: O1
      why: That would remove central features of the stated rationale for centralizing coordination, making the relative case
        for the existing decentralized arrangement stronger.
    would_not_change:
    - id: noflip1
      if: The agencies continued to pursue distinct diplomatic, economic, and informational objectives.
      why: Those overlapping objectives are part of the coordination problem the stated rationale addresses, not by themselves
        a reason to abandon institutionalization.
    watch_for:
    - id: watch1
      what: Whether the civil-military deputy and civilian staff can in practice provide the foreign-policy alignment check
        described for the role.
      favors:
      - O2
      why: The deputy's assessed suitability for that check is one of the stated reasons for the organizational model.
  lesson: When overlapping agency responsibilities make coordination ad hoc and complex, institutionalizing interagency participation
    can improve inclusion and provide a clearer foreign-policy alignment check. The organizational choice should be tied to
    those purposes rather than treated as an end in itself.
  limits: This reasoning addresses the organizational choice for interagency coordination during USAFRICOM's formation. It
    does not establish that this model is required or superior for every command, region, or later circumstance.
  library:
    domain: natsec-other
    family: CORPUS-NX-de2f5015
    source: https://jsouapplicationstorage.blob.core.windows.net/press/230/2013SOFIACTRefManual_Final.pdf
