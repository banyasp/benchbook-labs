case:
  id: DR-CORPUS-NX-2fc899e4-E1@v1
  title: Scoping a Trafficking Report
  status: draft
  setting: A report on trafficking in women and children in the United States; time not specified; Central Intelligence Agency
    briefing.
  decider: The report's authors
  agent: The report-scoping agent acting under the report authors' delegation
  agent_role: decide
  situation: A report addresses trafficking in persons involving men, women, and children. The report's scope could cover
    trafficking comprehensively or focus on a narrower subject. Women are described as predominant targets of traffickers,
    and the harms they suffer differ in nature and degree from those suffered by male victims. Information on trafficking
    in children to the United States is limited. Adult women and children raise distinct considerations because children have
    different rights and protections and generally have less decision-making control to exercise their rights fully.
  question: What should the report-scoping agent do about the report's scope?
  options:
    O1:
      do: The report-scoping agent should narrow coverage to trafficking in women.
      move: act
      irreversible: false
    O2:
      do: The report-scoping agent should broaden coverage to trafficking in persons comprehensively.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The report's subject includes trafficking involving men, women, and children.
  - id: F2
    kind: situation
    status: confirmed
    fact: Women are described as the predominant targets of traffickers.
  - id: F3
    kind: situation
    status: confirmed
    fact: The harms suffered by women differ in nature and degree from harms suffered by male victims.
  - id: F4
    kind: situation
    status: confirmed
    fact: Information on trafficking in children to the United States is limited.
  - id: F5
    kind: situation
    status: confirmed
    fact: Children receive different rights and protections from adults, both internationally and domestically.
  - id: F6
    kind: situation
    status: confirmed
    fact: Children generally exercise less decision-making control to fully exercise their rights.
  - id: F7
    kind: authority
    status: confirmed
    fact: The report-scoping agent is delegated authority by the report's authors to decide the report's scope.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Women are the predominant targets, and the harms they suffer differ in nature and degree from harms suffered by male
      victims, supporting a report focused predominantly on trafficking in women.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Limited information on trafficking in children to the United States supports narrowing the report’s focus rather
      than attempting equally comprehensive coverage.
  - id: C3
    facts:
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: Children have different rights and protections from adults and generally less control to exercise their rights, so
      trafficking in children should be treated separately from trafficking in adult women.
  reasoning:
    read: The report concerns trafficking involving men, women, and children, but its authors chose a narrower focus on women.
      The trap is to treat narrowing as a claim that other victims do not matter; the stated reasons instead concern the focus
      of this report and the need to distinguish children from adults.
    weighing: Women’s predominance among targets and the distinct nature and degree of harms to women provide the strongest
      support for {O1} {C1}. Limited information about child trafficking in the United States also supports narrowing {C2}.
      Children’s distinct rights and protections, and their generally lesser decision-making control, reinforce the need to
      treat children separately rather than collapse their circumstances into adult women’s {C3}.
    tradecraft: Keep the report’s stated focus explicit and distinguish its scope from a claim that trafficking involving
      men or children is unimportant. Any separate treatment of children should preserve the rights and protections relevant
      to them.
    uncertainty: The source gives no measure of how much information about child trafficking is missing or how much the narrower
      scope affects coverage of other victims. The balance therefore rests on the stated reasons for this report’s focus,
      not on a finding that other forms of trafficking are absent.
    handoff: The report-scoping agent may decide within the authors’ delegation {F7}; no further authority or consultation
      is identified as necessary for this scope choice.
    tempting_wrong:
      option: O2
      pull: Comprehensive coverage may seem preferable because the subject includes men, women, and children.
      why_wrong: That preference would overlook the authors’ stated reasons for focusing predominantly on women and the need
        to treat children separately from adults.
    rejected:
      O2: The report did not choose comprehensive coverage because its stated focus was trafficking in women, supported by
        women’s predominance among targets, the distinct harms they suffer, and limited child-trafficking information.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The authors’ assigned purpose required comprehensive coverage of trafficking involving men, women, and children
        rather than a focused report.
      then: O2
      why: A comprehensive purpose would change the scope objective that supports the narrowed focus.
    would_not_change:
    - id: noflip1
      if: Trafficking involving men and children remains part of the broader subject.
      why: Their inclusion in the broader subject does not negate the stated reasons for focusing this report predominantly
        on women or for treating children separately.
    watch_for:
    - id: watch1
      what: Whether reliable information about trafficking in children to the United States becomes available.
      favors:
      - O2
      why: The stated information limitation is one reason for narrowing; a change in that condition could make broader coverage
        more supportable.
  lesson: A report may narrow its scope when a group is a predominant target and faces distinct harms, especially when information
    about other parts of the subject is limited. Narrowing should not erase other affected groups; materially different rights
    and protections may call for separate treatment.
  limits: This reasoning concerns the stated scope choice for this report, not whether trafficking involving men or children
    warrants attention generally. It does not establish that limited information alone justifies excluding a topic from every
    report.
  library:
    domain: intel-analysis
    family: CORPUS-NX-2fc899e4
    source: https://www.cia.gov/resources/csi/static/9dc85527075bc84f9e1f2eef0e7a0915/trafficking.pdf
    episode_focus: The author could have treated trafficking in persons comprehensively or narrowed the report’s scope; the
      report states the choice and gives reasons, including women’s predominance among victims, the different harms they suffer,
      limited information on child trafficking, and children’s distinct rights and protections. Extract this analytic scoping
      decision only; exclude the report’s general policy recommendations and legal arguments about trafficking definitions.
    cues:
      option_words:
        O1: 10
        O2: 11
      real_option: O1
      real_to_mean_other_length: 0.91
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
