case:
  id: DR-CORPUS-NX-5dd01de8-E9@v1
  title: Confirmation Versus Planned Coverage
  status: draft
  setting: Brigade TOC, during brigade operations, Army brigade staff.
  decider: The senior staff officer
  agent: The senior staff officer
  agent_role: decide
  situation: At the brigade TOC, the battle captain has already departed from the day's planned schedule to confirm an earlier
    result. The initial assessment was that the system was damaged but not destroyed. The senior staff officer has praised
    that initiative. Two further confirmation checks remain under consideration. Proceeding may cost an hour of planned coverage,
    and the intelligence officer must agree that the benefit warrants that loss.
  question: What should the senior staff officer do about authorizing the additional confirmation checks, given the possible
    hour of lost coverage and the intelligence officer's required agreement?
  options:
    O1:
      do: The senior staff officer declines the additional checks and preserves the planned coverage.
      move: act
      irreversible: false
    O2:
      do: The senior staff officer authorizes the additional checks, subject to the intelligence officer's agreement.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Fires and collection activity had been planned for the day.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The initial assessment was that the system was damaged but not destroyed.
  - id: F3
    kind: situation
    status: confirmed
    fact: The S-2 NCO believed the earlier result should be confirmed.
  - id: F4
    kind: situation
    status: assessed
    fact: The battle captain considered both the analyst and the sergeant to have valid points.
  - id: F5
    kind: situation
    status: confirmed
    fact: The earlier confirmation effort was a deviation from the day's planned fires and collection activity.
  - id: F6
    kind: authority
    status: confirmed
    fact: The senior staff officer praised the battle captain's earlier initiative as disciplined initiative.
  - id: F7
    kind: situation
    status: confirmed
    fact: Two further planned confirmation checks remained under consideration.
  - id: F8
    kind: situation
    status: assessed
    fact: The further checks could result in an hour of lost coverage.
  - id: F9
    kind: authority
    status: confirmed
    fact: The senior staff officer said the intelligence officer had to agree that the gain justified the possible coverage
      loss.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The earlier result was that the system was damaged but not destroyed, and the senior staff officer directed checks
      of the two remaining results. Confirmation could inform whether the intended effect had been achieved.
  - id: C2
    facts:
    - F1
    - F8
    equity: tempo
    favors:
    - O1
    weight: weak
    why: The additional checks could cost an hour of planned coverage, a real operational cost the senior staff officer expressly
      acknowledged.
  - id: C3
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The senior staff officer made the intelligence officer's agreement that the gain justified the possible coverage
      loss a condition of proceeding.
  reasoning:
    read: This is a judgment about whether the benefit of further confirmation warrants a possible hour of lost coverage,
      not blanket permission to depart from the day's plan. The trap is treating either the earlier deviation or the coverage
      cost as automatically decisive; the senior staff officer endorsed initiative but conditioned the further checks on the
      intelligence officer's agreement.
    weighing: The incomplete earlier result and the senior staff officer's direction to check the two remaining results support
      {O2} {C1}. The possible hour of lost coverage weighs toward {O1} {C2}, but the senior staff officer accepted that risk
      if the intelligence officer agreed that the gain was worth it {C3}. The balance therefore depends on that agreement,
      not on initiative alone.
    tradecraft: Before proceeding, obtain and record the intelligence officer's judgment that the expected gain warrants the
      possible hour of lost coverage. Record the decision and its rationale, including the coverage cost and the condition
      that made proceeding acceptable.
    uncertainty: The source identifies a possible hour of lost coverage and a potential benefit, but does not quantify the
      benefit or establish that the full hour will be lost.
    handoff: The senior staff officer should make the decision with the intelligence officer's required agreement; the source
      does not support deciding this condition alone.
    tempting_wrong:
      option: O1
      pull: Declining would preserve the planned coverage and avoid another departure from the day's schedule.
      why_wrong: It would give the coverage cost automatic priority despite the senior staff officer's endorsement of disciplined
        initiative and direction to proceed if the intelligence officer judged the gain worthwhile.
    rejected:
      O1: The senior staff officer did not choose to preserve coverage at all costs, but supported the additional checks subject
        to the intelligence officer's agreement.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The intelligence officer does not agree that the expected gain justifies the possible coverage loss.
      then: O1
      why: The senior staff officer made that agreement a condition of proceeding.
    - id: flip2
      if: Further assessment indicates that the checks would provide no material confirmation benefit.
      then: O1
      why: Without a worthwhile gain, the stated reason for accepting the possible loss of coverage would no longer support
        proceeding.
    would_not_change:
    - id: noflip1
      if: The earlier confirmation effort had already departed from the day's plan.
      why: That circumstance alone would not reverse the endorsement of initiative; the senior staff officer still directed
        further checks subject to the intelligence officer's agreement.
    watch_for:
    - id: watch1
      what: Whether the expected coverage loss remains limited to the possible hour considered by the senior staff officer.
      favors:
      - O1
      why: A greater anticipated loss could change whether the expected gain warrants the tradeoff.
  lesson: A prior deviation from a plan does not by itself bar further initiative, and a possible loss of coverage does not
    by itself settle the choice. Weigh the expected operational gain against that cost and honor any required concurrence
    before proceeding.
  limits: This reasoning applies to the stated choice about additional confirmation checks and the possible hour of lost coverage.
    It does not establish general authority to depart from an approved plan or resolve a case where the required intelligence
    agreement is absent.
