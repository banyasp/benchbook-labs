case:
  id: DR-CORPUS-NX-36657171-E2@v1
  title: France’s Continued Airstrikes Against ISIS
  status: draft
  setting: France and Syria, following the Paris attacks; French executive decision-making on airstrikes.
  decider: The French executive leadership
  agent: The French executive leadership
  agent_role: decide
  situation: France had moved from reconnaissance flights to airstrikes. The French leadership invoked self-defence in response
    to the attacks in Paris and Saint-Denis, asserting that the perpetrators had been trained in Syria. Proposed further action
    included ISIS training centers and its sources of financing, especially oil. Oil convoys and processing facilities or
    refineries were identified as connected to ISIS’s income. France also considered supporting groups able to reverse ISIS’s
    position on the ground and recover territory.
  question: What should the French executive leadership do about continuing airstrikes against ISIS’s training and financing
    sources?
  options:
    O1:
      do: The French executive leadership prohibits continued airstrikes against ISIS training and financing sources.
      move: act
      irreversible: true
    O2:
      do: The French executive leadership authorizes continued airstrikes against ISIS training and financing sources.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: France had conducted reconnaissance flights and moved on to airstrikes.
  - id: F2
    kind: authority
    status: assessed
    fact: The French leadership invoked the right to self-defence as the basis for its action.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The French leadership asserted that the terrorists responsible for the Paris and Saint-Denis attacks had been trained
      in Syria.
  - id: F4
    kind: situation
    status: assessed
    fact: ISIS training centers were identified as a proposed focus of further action.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Oil was identified as a primary source of ISIS’s financial income.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Oil convoys were described as supplying ISIS with substantial income through buyers of the oil.
  - id: F7
    kind: situation
    status: assessed
    fact: Oil processing plants and refineries were identified as connected to ISIS’s financial income.
  - id: F8
    kind: situation
    status: assessed
    fact: France and other coalition members were urged to support groups able to reverse the situation on the ground and
      recover territory from ISIS.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The French leadership invoked self-defence and linked that basis to its assertion that the Paris and Saint-Denis
      attackers had been trained in Syria.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The leadership identified ISIS training centers as a necessary focus for further action against the organization.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The leadership described oil as ISIS’s primary source of income and identified the oil trade and processing facilities
      as connected to that income, arguing that these sources should be attacked.
  reasoning:
    read: 'The decision is whether to continue airstrikes as part of the French leadership’s response to the Paris attacks
      and its effort to weaken ISIS’s training and financing. The trap is treating the invocation of self-defence as an independently
      established legal conclusion: the stated basis is the leadership’s assertion about the attackers’ training in Syria.'
    weighing: 'The leadership’s stated balance favors continuing airstrikes: it invokes self-defence tied to the Paris attacks
      and identifies ISIS training and oil income as targets for further action. The financing rationale depends on oil remaining
      a primary source of ISIS income, while the self-defence rationale depends on the asserted Syria training link. The source
      gives no countervailing reason for stopping.'
    tradecraft: 'Keep the decision and its record at the policy level: state the asserted self-defence basis, the factual
      premises relied on, and the reasons for focusing on training and financing. Do not turn this rationale into operational
      instructions or treat the stated premises as independently verified.'
    uncertainty: The source asserts the attackers’ training link and ISIS’s reliance on oil but provides no supporting assessment
      details or independent legal analysis. It also does not discuss effects on civilians or other consequences of continued
      strikes.
    handoff: The French executive leadership holds the decision in this scenario. Coalition members may be involved in the
      broader effort, which the leadership also describes as requiring support for groups able to recover territory, but the
      source does not specify a separate approval authority.
    tempting_wrong:
      option: O1
      pull: Prohibiting further strikes may seem preferable as a cautious response to the limits of the information presented.
      why_wrong: 'That caution is not the source’s stated judgment: the leadership treats the self-defence rationale and the
        need to disrupt ISIS training and oil income as reasons to continue.'
    rejected:
      O1: The leadership did not choose to prohibit continued strikes, because it argued that action against ISIS training
        and financing sources should continue.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership’s factual basis for both the Syria training link and the connection between the proposed financing
        sources and ISIS were substantially undermined.
      then: O1
      why: The principal stated grounds for continuing strikes would no longer support the same decision.
    would_not_change:
    - id: noflip1
      if: Support for groups recovering territory from ISIS remained part of the broader response.
      why: That support is presented as an additional coalition effort, not as a reason to prohibit airstrikes against training
        and financing sources.
    watch_for:
    - id: watch1
      what: Whether oil remains a primary source of ISIS income and the identified oil-related sources remain connected to
        that income.
      favors:
      - O1
      why: A material change would weaken the stated financing rationale for continuing strikes.
  lesson: When a leadership endorses continued action, identify each stated factual and legal premise rather than treating
    an invoked authority as self-proving. Reassess the decision if its central premises about the threat or the means of weakening
    it materially change.
  limits: This conclusion reflects the French leadership’s stated reasons, not an independent legal determination that the
    strikes satisfied applicable law. The source does not assess civilian consequences, operational details, or alternative
    courses in depth.
