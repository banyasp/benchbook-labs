        O2: 14
      real_option: O3
      real_to_mean_other_length: 1.0
      real_is_longest: false
      moves:
        O3: act
        O1: hold
        O2: act
      real_move: act
      irreversible_flags:
        O3: true
        O1: false
        O2: false
    equities: pilot2
