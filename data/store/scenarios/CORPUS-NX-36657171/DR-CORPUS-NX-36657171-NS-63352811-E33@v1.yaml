case:
  id: DR-CORPUS-NX-36657171-NS-63352811-E33@v1
  title: A Sustained Campaign Against ISIS Oil Revenue
  status: draft
  setting: Syria and Iraq, October 2015, CJTF-OIR
  decider: CJTF-OIR leadership
  agent: CJTF-OIR leadership
  agent_role: decide
  situation: ISIS derived oil revenue from local sales and sales outside its territory, and its fighters also relied on its
    fuel. CJTF-OIR had begun striking oil-related targets in September 2014, but those strikes were not systematic or part
    of a broader strategy. ISIS repaired damaged parts of its oil network and altered distribution routes after the initial
    strikes. The Secretary of Defense assessed that strikes on small-scale refining facilities had not been very effective.
    The coalition needed a more consistent effort but lacked sufficient intelligence on ISIS oil operations. A spring 2015
    raid yielded detailed information that allowed the coalition to identify critical nodes in the oil enterprise.
  question: What should CJTF-OIR leadership do about the coalition effort against ISIS oil revenue?
  options:
    O1:
      do: CJTF-OIR leadership defers the campaign decision and retains the existing piecemeal strikes.
      move: hold
      irreversible: false
    O2:
      do: CJTF-OIR leadership rejects a sustained campaign and continues piecemeal strikes against ISIS oil assets.
      move: act
      irreversible: false
    O3:
      do: CJTF-OIR leadership authorizes a sustained campaign against key parts of ISIS's oil enterprise.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: ISIS oil revenue came mainly from marked-up local sales, sales outside its territory, and fuel used by its fighters.
  - id: F2
    kind: situation
    status: confirmed
    fact: CJTF-OIR began striking oil-related targets in September 2014, but the initial strikes were not systematic or persistent
      and were not part of a broader strategy.
  - id: F3
    kind: situation
    status: confirmed
    fact: After the initial strikes, ISIS repaired damaged parts of its oil network and altered distribution routes to evade
      targeting.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Secretary of Defense assessed that strikes on small-scale refining facilities had not been very effective.
  - id: F5
    kind: capability
    status: confirmed
    fact: The coalition needed a more consistent military effort to degrade ISIS oil revenue but lacked sufficient intelligence
      on its oil operations.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: A spring 2015 raid in Syria yielded detailed information about ISIS oil operations, enabling the coalition to identify
      critical nodes in the oil enterprise.
  - id: F7
    kind: situation
    status: confirmed
    fact: The proposed effort was intended to systematically damage ISIS's ability to generate oil revenue, with the objective
      of disrupting specific installations for six months to a year.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The coalition might initially have overestimated the revenue ISIS derived from oil and natural gas.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The initial, piecemeal strikes were not part of a sustained strategy, and ISIS repaired damage and changed routes
      to evade them; the Secretary of Defense assessed that strikes on small-scale refining facilities had not been very effective.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The coalition needed a more consistent effort but lacked sufficient intelligence; the raid supplied detailed information
      that enabled identification of critical nodes in the oil enterprise.
  - id: C3
    facts:
    - F1
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Oil supported ISIS finances through local and external sales and supplied fuel to its fighters. The proposed campaign
      aimed to damage revenue generation by disrupting installations for six months to a year.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The possibility that oil and natural-gas revenue had been overestimated counsels against treating the expected financial
      effect as certain, though it does not displace the stated case for a more systematic effort.
  reasoning:
    read: 'The choice is not between action and inaction: CJTF-OIR had already struck oil-related assets, but those piecemeal
      strikes were repairable and evadable. The trap is to mistake continued strike activity for a strategy likely to disrupt
      ISIS revenue. New intelligence addressed the earlier information gap by identifying critical nodes.'
    weighing: The prior effort's limited effect and ISIS's ability to recover weigh strongly against simply continuing piecemeal
      strikes. The detailed intelligence and the campaign's intended longer-lasting disruption support authorizing a sustained
      effort. The balance depends on whether the identified nodes can in fact be disrupted for a meaningful period; the possible
      overestimate of oil revenue is a caution, not a reason to abandon the effort.
    tradecraft: Set the campaign's decision-level objective and intended duration, assign responsibility for assessing whether
      the disruption is having the intended financial effect, and record the uncertainty about the scale of ISIS's oil and
      natural-gas revenue. Do not treat the authorization as proof that the expected effect has been achieved.
    uncertainty: ISIS's oil and natural-gas revenue might have been overestimated. The magnitude of that uncertainty and the
      campaign's eventual financial effect are not established.
    handoff: CJTF-OIR leadership is the decision-maker in this scenario. No referral to a higher authority is identified;
      leadership can decide while drawing on intelligence and operational assessments to evaluate the campaign's expected
      and observed effect.
    tempting_wrong:
      option: O1
      pull: Deferring may seem prudent because the coalition had previously lacked sufficient intelligence and the scale of
        oil revenue was uncertain.
      why_wrong: The spring 2015 raid supplied detailed information for identifying critical nodes, while the previous piecemeal
        approach had allowed ISIS to repair damage and evade further strikes.
    rejected:
      O1: Deferring and retaining the existing piecemeal effort was not chosen because the new intelligence addressed the
        earlier information gap and the piecemeal strikes had proved limited and recoverable.
      O2: Rejecting a sustained campaign and continuing piecemeal strikes was not chosen because the prior approach had not
        been systematic or effective enough to prevent repair and evasion.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The detailed information no longer enabled the coalition to identify critical nodes in ISIS's oil enterprise.
      then: O1
      why: The intelligence that made a more focused, sustained effort plausible would no longer be available, weakening the
        basis for moving beyond piecemeal strikes.
    - id: flip2
      if: The proposed effort could not plausibly disrupt the relevant installations for longer than the short periods achieved
        by earlier strikes.
      then: O1
      why: The intended advantage of the campaign was sustained disruption rather than damage that ISIS could quickly repair.
    would_not_change:
    - id: noflip1
      if: Oil and natural-gas revenue remained uncertain or might have been overestimated.
      why: 'That uncertainty alone would not reverse the choice: a systematic campaign remained the response to the limitations
        of earlier strikes and the availability of new intelligence.'
    watch_for:
    - id: watch1
      what: Whether the assessed scale of ISIS's oil and natural-gas revenue is materially lower than initially believed.
      favors:
      - O1
      why: A lower actual contribution could reduce the expected financial value of sustaining the effort and warrants reassessing
        its purpose.
  lesson: When an initial approach is readily repaired or evaded, do not assume that continuing it will achieve the mission.
    If better information makes a more sustained effort feasible, weigh its expected effect against uncertainty about the
    value of the objective and assess whether the intended disruption is actually lasting.
  limits: This reasoning applies where earlier piecemeal strikes had limited effect and new intelligence identified critical
    nodes. It does not establish legal, civilian-harm, or other operational assessments, nor does it prove that the sustained
    campaign achieved its intended financial effect.
  library:
    domain: military-operational
    family: CORPUS-NX-36657171
    source: https://apps.dtic.mil/sti/pdfs/AD1122427.pdf
