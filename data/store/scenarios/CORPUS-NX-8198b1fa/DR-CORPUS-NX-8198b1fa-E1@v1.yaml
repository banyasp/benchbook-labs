case:
  id: DR-CORPUS-NX-8198b1fa-E1@v1
  title: Emergency Safety Tradeoff
  status: draft
  setting: Undisclosed deployed location, 5 July 2016 at 0408 Zulu, 27th Special Operations Wing.
  decider: MP2, the pilot flying
  agent: MP2, the Mishap Pilot serving as pilot flying
  agent_role: decide
  situation: The aircraft experienced an uncommanded propulsion reduction during flight. A descent triggered audible and visual
    alerts for the two Mishap Pilots. Manmade structures and personnel were hazards relevant to the emergency, while preserving
    the aircraft remained a competing interest. The Mishap Pilot faced an urgent choice between those safety interests.
  question: What should the Mishap Pilot do to balance preserving the aircraft against reducing danger to people and property?
  options:
    O1:
      do: The Mishap Pilot should prioritize preserving the aircraft and accept increased risk to people and property.
      move: act
      irreversible: true
    O2:
      do: The Mishap Pilot should prioritize protecting people and property and accept potential loss of the aircraft.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The event occurred on 5 July 2016.
  - id: F2
    kind: situation
    status: confirmed
    fact: The event occurred at 0408 Zulu time.
  - id: F3
    kind: situation
    status: confirmed
    fact: The aircraft was deployed to an undisclosed location.
  - id: F4
    kind: situation
    status: confirmed
    fact: The aircraft was an MQ-9A assigned to the 27th Special Operations Wing at Cannon Air Force Base.
  - id: F5
    kind: capability
    status: confirmed
    fact: The aircraft experienced an uncommanded propulsion reduction.
  - id: F6
    kind: situation
    status: confirmed
    fact: A descent from the commanded altitude triggered audible and visual alerts to the crew.
  - id: F7
    kind: situation
    status: confirmed
    fact: The crew included two Mishap Pilots.
  - id: F8
    kind: situation
    status: assessed
    fact: Manmade structures and personnel were hazards relevant to the emergency response.
  considerations:
  - id: C1
    facts:
    - F8
    equity: third_party_harm
    favors:
    - O2
    weight: strong
    why: Manmade structures and personnel were hazards in the emergency, and the pilot flying's response prioritized reducing
      danger to them over retaining the aircraft.
  - id: C2
    facts:
    - F4
    - F5
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: The aircraft was a military asset, and the propulsion reduction made its preservation a competing concern; the account
      nevertheless records accepting its loss rather than increasing danger to people and property.
  reasoning:
    read: This was an urgent safety tradeoff after an uncommanded propulsion reduction and descent alert, not simply a choice
      to save or lose an aircraft. The trap is allowing preservation of the aircraft to outweigh the danger to people and
      property identified in the situation.
    weighing: The hazard to people and structures carries greater weight than preserving the aircraft {C1}. The aircraft's
      loss remains a real competing cost {C2}, but the recorded response favored reducing danger to people and property.
    tradecraft: At the decision level, prioritize the safety interest that is most immediate and consequential, and document
      the hazard considered and the reason for accepting potential aircraft loss. Do not infer from this account a general
      rule to disregard aircraft preservation in emergencies.
    uncertainty: The account does not specify how many people or structures were at risk, their proximity, or whether any
      alternative could have avoided both human danger and aircraft loss.
    handoff: The pilot flying made the choice in the urgent situation described. The account does not identify consultation
      with another authority as part of this decision.
    tempting_wrong:
      option: O1
      pull: Preserving the aircraft protects a valuable military asset.
      why_wrong: That concern does not outweigh the identified danger to people and property in the circumstances described.
    rejected:
      O1: The pilot flying did not prioritize preserving the aircraft at the expense of increased danger to people and property.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable information established that no people or property were exposed to danger and that preserving the aircraft
        was safely feasible.
      then: O1
      why: Without the identified danger to people and property, preserving the aircraft could become the stronger consideration.
    would_not_change:
    - id: noflip1
      if: The aircraft's value or importance were greater, but the danger to people and property remained as described.
      why: A greater asset-preservation interest alone would not reverse the priority given to reducing danger to people and
        property.
    watch_for:
    - id: watch1
      what: Whether people or manmade structures are exposed to danger during the emergency.
      favors:
      - O2
      why: The pilot flying's recorded response treated those hazards as grounds to prioritize people and property over the
        aircraft.
  lesson: In an emergency, do not let preserving an aircraft take priority over reducing danger to people and property when
    those interests conflict. The decision should reflect the hazards actually present, rather than asset value alone.
  limits: This reasoning applies to the emergency tradeoff described, not to every aircraft malfunction or every case where
    preservation and safety appear to conflict. The account does not establish a general legal rule or specify the full range
    of alternatives available.
