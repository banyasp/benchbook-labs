case:
  id: DR-CORPUS-NX-e06dc8a7-E5@v1
  title: Coalition Operational Control and Australian Safeguards
  status: draft
  setting: During Operation FALCONER, in the Middle East Area of Operations, within Australian Defence and coalition command.
  decider: The CDF
  agent: The CDF
  agent_role: decide
  situation: Australian forces in the Middle East Area of Operations needed to work within coalition command arrangements.
    Coalition component commanders could assign tasks under operational control, while Australian forces remained under Australian
    commanding officers at unit level. The CDF retained national control, and Defence’s Strategic Command Group provided regular
    briefings and advice on strategic direction. Australian processes, including legal advice and policy review, were in place
    to govern the employment of Australian forces. The CDF must decide whether to accept coalition operational control of
    assigned tasks or decline that arrangement and keep operational direction solely national.
  question: What should the CDF do about coalition operational control of assigned tasks while preserving Australian command
    and policy safeguards?
  options:
    O1:
      do: The CDF should decline coalition operational control of assigned tasks and retain solely national operational direction.
      move: act
      irreversible: false
    O2:
      do: The CDF should accept coalition operational control of assigned tasks while retaining Australian command and policy
        safeguards.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Australian forces in the Middle East Area of Operations needed to operate under the operational control of coalition
      component commanders.
  - id: F2
    kind: capability
    status: confirmed
    fact: Coalition component commanders could assign specific tasks to ADF forces, which remained under Australian commanding
      officers at unit level.
  - id: F3
    kind: authority
    status: confirmed
    fact: The CDF retained control of Australian forces while working within the coalition.
  - id: F4
    kind: situation
    status: confirmed
    fact: ADF force elements worked toward the overall Coalition combat plan.
  - id: F5
    kind: authority
    status: confirmed
    fact: Processes were in place to keep Australian forces’ employment consistent with Australian Government policies.
  - id: F6
    kind: capability
    status: confirmed
    fact: Australian officers and legal advisers were involved in reviewing assigned tasks for appropriateness and lawfulness
      under Australia’s obligations.
  - id: F7
    kind: situation
    status: confirmed
    fact: The CDF received briefings and advice from Defence’s Strategic Command Group on an almost daily basis for strategic
      direction.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Coalition operational control was needed for Australian forces to work within the coalition, allowing coalition commanders
      to assign tasks while ADF elements worked toward the coalition combat plan.
  - id: C2
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 'Accepting task assignment did not surrender national command: the CDF retained control of Australian forces, which
      remained under Australian commanding officers at unit level.'
  - id: C3
    facts:
    - F5
    - F6
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: Australian processes, including officer and legal-adviser review, were in place to keep employment of the forces
      consistent with government policy and Australia's legal obligations.
  - id: C4
    facts:
    - F3
    - F7
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The CDF retained control while receiving almost daily strategic briefings and advice, supporting national direction
      within the coalition arrangement.
  reasoning:
    read: This is a choice about coordinating assigned tasks within coalition operations, not about transferring national
      command. The trap is treating coalition operational control as incompatible with Australian control, although the CDF
      retained control and Australian safeguards remained in place.
    weighing: The operational need to work under coalition component commanders favors {O2} ({C1}). That need is balanced
      by the retained national command and Australian policy and legal safeguards ({C2}, {C3}), with regular strategic advice
      supporting the CDF's direction ({C4}). The balance depends on national control and safeguards continuing to operate.
    tradecraft: Keep the distinction between coalition task assignment and national command explicit in the decision record.
      Maintain the described Australian policy and legal review, and record the CDF's strategic direction and advice.
    uncertainty: The arrangement is said to have worked smoothly, but no account is given of how it would be handled if national
      safeguards became ineffective or coalition direction displaced national control.
    handoff: The CDF decides, informed by the Strategic Command Group's regular strategic advice and by the Australian commanders
      and legal advisers involved in reviewing assigned tasks.
    tempting_wrong:
      option: O1
      pull: Solely national operational direction may seem the safest way to preserve Australian control.
      why_wrong: It overlooks that the CDF retained control and Australian forces remained under Australian commanding officers
        while coalition commanders assigned tasks.
    rejected:
      O1: The source favors accepting coalition task assignment because it was needed to operate successfully in the coalition
        and could be balanced with retained Australian control and safeguards.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Australian processes could no longer keep force employment consistent with government policy or Australia's legal
        obligations.
      then: O1
      why: Without effective safeguards, accepting coalition task assignment would no longer be shown to preserve Australian
        policy and legal control.
    - id: flip2
      if: Coalition operational control displaced the CDF's control of Australian forces rather than remaining limited to
        task assignment.
      then: O1
      why: The reasoning for accepting the arrangement depends on national command being retained.
    would_not_change:
    - id: noflip1
      if: Coalition commanders assign specific tasks while Australian forces remain under Australian commanding officers at
        unit level and the CDF retains control.
      why: Those features describe the arrangement the CDF accepted, not a reason to decline it.
    watch_for:
    - id: watch1
      what: Whether Australian policy and legal safeguards remain effective as coalition task assignments are made.
      favors:
      - O1
      why: A failure of those safeguards would undermine a central reason for accepting coalition operational control.
  lesson: Coalition operational control of assigned tasks need not displace national command when the national authority retains
    control and effective policy and legal safeguards. Accept coordination that serves the mission while preserving and monitoring
    those limits.
  limits: This reasoning applies to the command arrangement described, where the CDF retained control and Australian safeguards
    were in place. It does not decide whether any particular task or engagement is lawful or appropriate.
  library:
    domain: operational-command
    family: CORPUS-NX-e06dc8a7
    source: https://iihl.org/wp-content/uploads/2022/08/ADDP_3_14_Targeting.pdf
    episode_focus: The command arrangement balanced coalition commanders’ ability to assign tasks with Australia’s retention
      of national command and policy safeguards. The passage describes the arrangement and its reasons; exclude the separate
      target-by-target engagement decisions.
