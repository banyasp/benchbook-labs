      option_words:
        O1: 16
        O2: 17
      real_option: O2
      real_to_mean_other_length: 1.06
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
