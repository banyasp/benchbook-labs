case:
  id: DR-CORPUS-NX-70db586b-E5@v1
  title: The Proposed Defense Clandestine Services
  status: draft
  setting: Capitol Hill, during consideration of the 2013 Defense Authorization Bill, among the defense and intelligence committees.
  decider: Congress
  agent: Congress
  agent_role: decide
  situation: The Department of Defense proposed the Defense Clandestine Services to increase its HUMINT capability. The Department
    of Defense and the CIA’s National Clandestine Service supported the proposal, citing intelligence needs and potential
    cooperation between the organizations. Congressional members raised concerns that some military activities could be intelligence
    activities requiring intelligence committee oversight. Critics also questioned whether the proposed service duplicated
    CIA capabilities and whether the Department of Defense’s past management of clandestine operatives justified expanding
    its role. Concerns about career management and congressional oversight interests were part of the debate. Intelligence
    experts also warned that greater military demands could draw CIA resources away from broader global intelligence work
    and affect analytical objectivity.
  question: What should Congress do about development of the proposed Defense Clandestine Services?
  options:
    O1:
      do: Congress advances development of the proposed Defense Clandestine Services.
      move: act
      irreversible: false
    O2:
      do: Congress slows development of the proposed Defense Clandestine Services.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: The Department of Defense proposed the Defense Clandestine Services to develop its clandestine capabilities in response
      to an increasing need for HUMINT.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The Department of Defense viewed the proposed service as a way to collect intelligence on global issues, while the
      CIA’s National Clandestine Service supported additional Department of Defense HUMINT capacity for military commander
      requirements.
  - id: F3
    kind: capability
    status: assessed
    fact: The proposed service was presented as a means of increasing cooperation between the Department of Defense and the
      CIA and reducing organizational separation.
  - id: F4
    kind: authority
    status: assessed
    fact: Congressional concerns held that some military activities could constitute intelligence activities and should be
      briefed to intelligence committees for oversight.
  - id: F5
    kind: authority
    status: assessed
    fact: The House intelligence committee raised concern that military activities could be characterized as operational preparation
      to avoid intelligence-community oversight, despite potential harms comparable to other clandestine intelligence activities.
  - id: F6
    kind: situation
    status: assessed
    fact: Critics argued that the proposed service would provide the CIA with more case officers under another name and that
      the Department of Defense had not earned an expanded HUMINT capability given its past performance.
  - id: F7
    kind: situation
    status: assessed
    fact: Past career-management issues involving Department of Defense clandestine operatives were a stated concern.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Intelligence experts warned that supporting military operations could divert CIA resources from broader global missions,
      and that an excessive military-support role could affect the objectivity of intelligence analysis.
  - id: F9
    kind: authority
    status: assessed
    fact: There was concern that congressional oversight interests between the defense and intelligence committees could contribute
      to resistance to the proposed service.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The DOD and the CIA’s National Clandestine Service supported the proposal as a response to intelligence needs, and
      the proposed service was presented as a way to improve cooperation and reduce organizational separation.
  - id: C2
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Past career-management problems involving DOD clandestine operatives were the stated reason the 2013 Defense Authorization
      Bill slowed development; critics also questioned DOD’s past performance and whether the service duplicated CIA capabilities.
  - id: C3
    facts:
    - F4
    - F5
    equity: oversight_candor
    favors:
    - O2
    weight: weak
    why: Congressional concerns that military activities could be intelligence activities requiring intelligence-committee
      briefings make oversight an unresolved consideration in expanding DOD clandestine capacity.
  - id: C4
    facts:
    - F8
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Slowing DCS increases pressure on CIA resources, while greater CIA focus on military operations could impair broader
      global collection and objective intelligence analysis.
  - id: C5
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The possibility that committee oversight interests contributed to resistance weighs against treating the slowdown
      as an unambiguously substantive judgment about DOD’s capability.
  reasoning:
    read: This is a contested choice between expanding a DOD capability supported by both DOD and the CIA’s National Clandestine
      Service, and slowing it amid concerns about DOD career management and intelligence oversight. The trap is to treat the
      stated management concern as either conclusive proof against expansion or merely a pretext for an oversight turf fight;
      the career-management concern may be legitimate, while committee interests may also have played a role.
    weighing: The DOD and CIA support, expected cooperation, and concern about CIA resources favor {O1} {C1} {C4}. The 2013
      bill nevertheless slowed development, expressly citing past DOD career-management issues, and that rationale may be
      legitimate {C2}. Oversight concerns add weight to caution, while the possibility of a committee turf fight complicates
      that justification {C3} {C5}. The competing reasons leave the disposition contested rather than resolved.
    tradecraft: Record the career-management concern separately from the oversight question and from any committee interest
      in jurisdiction. State which concern actually supports the decision to slow, and preserve the reasons for reconsidering
      the pace if the management or oversight record changes.
    uncertainty: It is unclear whether committee oversight interests caused the slowdown, and the critics’ claims of duplication
      or poor past performance remain unresolved. The likely effects of the cited CIA resource and objectivity concerns are
      also unquantified.
    handoff: The defense and intelligence committees should both be involved because the decision concerns DOD career management
      and the intelligence committees’ oversight responsibilities; their distinct reasons should be made explicit.
    tempting_wrong:
      option: O1
      pull: DOD and the CIA’s National Clandestine Service supported the proposal, which promised cooperation and could reduce
        pressure on CIA resources.
      why_wrong: Advancing on those grounds alone would discount the stated DOD career-management concern and leave the congressional
        oversight concern unaddressed.
    rejected:
      O1: Congress slowed development over past DOD career-management issues, despite the proposal’s operational and interagency
        benefits.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: DOD demonstrated a sustained resolution of the career-management problems that prompted congressional concern.
      then: O1
      why: The stated legislative rationale for slowing development would carry less weight, making the proposal’s intelligence
        and cooperation benefits more persuasive.
    - id: flip2
      if: Congress established that military activities that may constitute intelligence activities would be briefed to the
        intelligence committees.
      then: O1
      why: That would reduce the oversight concern while leaving the stated case for additional DOD HUMINT capacity and closer
        DOD-CIA cooperation.
    would_not_change:
    - id: noflip1
      if: DOD and the CIA’s National Clandestine Service continued to support the proposal.
      why: Their support is relevant to the expected benefits, but by itself it does not answer the stated career-management
        or congressional oversight concerns.
    watch_for:
    - id: watch1
      what: Evidence about whether DOD career-management problems have been corrected.
      favors:
      - O1
      why: The 2013 bill cited past career-management issues as its reason for slowing development.
    - id: watch2
      what: Whether military activities that may constitute intelligence activities are being briefed to the intelligence
        committees.
      favors:
      - O2
      why: The stated oversight concern was that such activities should be briefed and might otherwise avoid intelligence-community
        oversight.
  lesson: A capability’s operational benefits and interagency support do not erase legitimate concerns about management and
    oversight. Distinguish those concerns from possible institutional turf interests, and make clear which actually drives
    the decision.
  limits: This reasoning concerns Congress’s decision about the proposed DCS in the setting described. It does not establish
    that the service should always be advanced or slowed, or resolve the underlying management, oversight, or resource questions.
