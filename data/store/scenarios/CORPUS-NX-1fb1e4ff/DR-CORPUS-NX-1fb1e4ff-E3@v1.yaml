basis: The B5's own conclusions were that British Intelligence grossly exaggerated Russian forces and underestimated German
  forces, while the Americans did the opposite; it concluded that a full-scale German offensive was beyond Germany's capabilities,
  subject to stated conditions for a more limited offensive.
