case:
  id: DR-CORPUS-NX-9b9b4cb9-E1@v1
  title: Air Operations and Kachin Safety
  status: draft
  setting: Hukawng Valley; 10th Air Force operations; time not specified.
  decider: The officials responsible for the operations; their identities are not specified.
  agent: The officials responsible for the operations
  agent_role: decide
  situation: Air operations had been conducted against Japanese installations in the Hukawng Valley. The Japanese inferred
    that ground assistance was involved and suspected the Kachins. They restricted entry to their supply areas and would shoot
    a Kachin on sight. Kachins therefore faced a direct threat. The officials responsible for the operations had to weigh
    continuing air operations against suspending them to protect Kachins.
  question: What should the officials responsible for the operations do about continuing or suspending them?
  options:
    O1:
      do: The responsible officials suspend these operations temporarily.
      move: act
      irreversible: false
    O2:
      do: The responsible officials continue these operations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Air operations had been conducted against Japanese installations.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Japanese inferred that the attacks were being directed from the ground.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Japanese suspected the Kachins.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Japanese restricted entry to their supply areas.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Japanese would shoot a Kachin on sight.
  - id: F6
    kind: situation
    status: confirmed
    fact: Protecting the Kachins was an identified concern in deciding whether to continue the operations.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The air operations had been conducted against Japanese installations, giving a reason to continue the mission; the
      account does not weigh that benefit against the danger to Kachins.
  - id: C2
    facts:
    - F2
    - F3
    equity: third_party_harm
    favors:
    - O1
    weight: strong
    why: The Japanese inferred that ground assistance was involved and suspected the Kachins, connecting continued operations
      with danger to the local people suspected of assisting.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The restrictions and the threat to shoot Kachins on sight made protecting them an immediate concern, which the account
      gives as the reason for suspending the operations.
  reasoning:
    read: 'The operations had been conducted against Japanese installations, but the Japanese inferred that ground assistance
      was involved and suspected the Kachins. The trap is to treat the air operations'' mission value as separate from the
      consequences for the people suspected of helping: Kachins faced a direct threat.'
    weighing: Continuing had some mission value {C1}, but the Japanese inference and suspicion, followed by restrictions and
      a shoot-on-sight threat, made the danger to Kachins decisive {C2} {C3}. The account therefore supports suspending the
      operations for a time to protect them. The balance could be reconsidered if the danger to Kachins changed; the account
      gives no specific test or time for doing so.
    tradecraft: Suspend the operations while the stated threat persists, record protection of the Kachins as the reason, and
      reassess before resuming. The source gives no specific reassessment procedure.
    uncertainty: The duration of the suspension, the identity of the officials who decided, and any later change in the threat
      are not specified.
    handoff: The source identifies only the officials responsible for the operations. Keep the decision with those officials;
      involve those responsible for Kachin protection in any reassessment because their safety is the stated concern.
    tempting_wrong:
      option: O2
      pull: The operations had been conducted against Japanese installations, which can make continuation seem necessary to
        the mission.
      why_wrong: That consideration does not resolve the direct danger to Kachins after the Japanese suspected them; the account
        says the operations were suspended to protect them.
    rejected:
      O2: Continuing was not chosen because the threat to Kachins following Japanese suspicion outweighed the stated reason
        to keep conducting the operations.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: There were reliable grounds to conclude that Kachins were no longer suspected or at risk from the Japanese.
      then: O2
      why: With the protection concern materially removed, the mission-related reason to continue could carry greater weight.
    would_not_change:
    - id: noflip1
      if: The operations continued to have mission value while Kachins remained subject to the stated threat.
      why: Mission value alone would not remove the direct danger that the account gives as the reason for suspension.
    watch_for:
    - id: watch1
      what: Whether Japanese restrictions and the threat to shoot Kachins on sight persist.
      favors:
      - O1
      why: Those conditions indicate that the protection concern remains active.
  lesson: When an operation leads an adversary to suspect local people and those people face a direct threat, mission value
    alone does not justify continuing. Suspend while the danger persists, and reassess if the circumstances affecting their
    safety change.
  limits: The source gives no legal standard, detailed authority structure, duration for the suspension, or later reassessment.
    This reasoning is confined to the stated choice to suspend these operations to protect Kachins and should not be treated
    as a general rule for other operational decisions.
  library:
    domain: military-operational
    family: CORPUS-NX-9b9b4cb9
    source: https://www.cia.gov/resources/csi/static/d09cbe41d73881b12671a029186525fc/Operations-of-OSS-Detachment101.pdf
    episode_focus: The decision point is whether to continue these operations or suspend them after the Japanese inferred
      that ground assistance was involved and began targeting Kachins. Examine the tradeoff between supporting air operations
      and protecting local personnel; exclude the methods used to locate or report targets.
    cues:
      option_words:
        O1: 7
        O2: 6
      real_option: O1
      real_to_mean_other_length: 1.17
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The account's stated conclusion is that, to protect the Kachins, the operations had to be suspended for a time; it
  does not identify the official who made the decision.
