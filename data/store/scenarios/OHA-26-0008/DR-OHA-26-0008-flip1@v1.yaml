case:
  id: DR-OHA-26-0008-flip1@v1
  title: Access Authorization Restoration Decision under Guideline I [flip]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, October 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: 'The Individual currently possesses a DOE access authorization tied to his employment with a DOE contractor.
    The Local Security Office (LSO) flagged the Individual under Guideline I because of a series of violent episodes and a
    diagnosis of borderline personality disorder (BPD). The DOE Psychologist issued two evaluations: a September 2024 report
    concluding the Individual suffered persistent depressive disorder without impairing judgment, stability, reliability,
    or trustworthiness; and a May 2025 report diagnosing BPD and stating the condition does impair those attributes. The Individual''s
    own expert testified that the condition is an anxiety disorder with a favorable prognosis. The Individual''s treatment
    record, as reflected in the fixed fact {F6}, shows uninterrupted weekly therapy and flawless medication refills for the
    past twelve months. The Administrative Judge must decide whether the security concerns are sufficiently mitigated to allow
    a conditional restoration of the Individual''s access authorization.'
  question: What should the Administrative Judge order regarding the Individual's access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge denies restoration of the Individual's access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge conditionally restores the Individual's access authorization.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual holds a DOE access authorization because he works for a DOE-contracted firm.
  - id: F2
    kind: situation
    status: confirmed
    fact: Following a June 2024 assault, the LSO referred the Individual for a psychological assessment.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: In September 2024 the DOE Psychologist reported persistent depressive disorder and found no impact on judgment,
      stability, reliability, or trustworthiness.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: In May 2025 the DOE Psychologist issued a new report diagnosing borderline personality disorder and concluded the
      disorder impairs judgment, stability, reliability, and trustworthiness.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual has been involved in multiple violent acts, including a June 2024 assault on his brother and a November
      2024 episode of physical abuse against his daughter.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual has attended weekly therapy sessions without missing an appointment and has filled all prescribed
      medication refills on schedule for the past twelve months, demonstrating uninterrupted adherence to his treatment plan.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Individual's expert testified that the condition is an anxiety disorder, not BPD, and that the outlook is good.
  - id: F8
    kind: authority
    status: confirmed
    fact: The LSO raised security concerns under Guideline I based on the DOE Psychologist's BPD diagnosis.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The Administrative Judge concluded that none of the five mitigating conditions enumerated in the Adjudicative Guidelines
      were satisfied by the record.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F8
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Guideline I concerns remain because the May 2025 BPD diagnosis indicates impaired judgment and the documented violent
      incidents demonstrate a continuing risk to national security.
  - id: C2
    facts:
    - F6
    - F9
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The Individual's uninterrupted therapy and medication adherence satisfy mitigating condition (a) – consistent treatment
      compliance – which the Judge previously deemed essential for any restoration.
  - id: C3
    facts:
    - F7
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Judge placed greater weight on the DOE Psychologist's BPD assessment than on the expert's anxiety-disorder opinion,
      finding the expert's analysis insufficiently grounded in the Individual's relational history.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Because the record fails to meet any of the five statutory mitigating conditions, the security concern is deemed
      unmitigated, ordinarily requiring denial of restoration.
  reasoning:
    read: The central issue is whether the Individual's consistent treatment now satisfies mitigating condition (a) despite
      the lingering BPD diagnosis and past violent conduct.
    weighing: While {C1}, {C3}, and {C4} underscore the seriousness of the security concern, {C2} demonstrates that the Individual
      has fulfilled the key treatment-compliance requirement, tipping the balance toward a conditional restoration.
    tradecraft: The Administrative Judge's decision will be recorded in a formal Decision, citing the applicable CFR provisions
      and Adjudicative Guidelines, and the conditional restoration will be entered into the Individual's personnel security
      file with a compliance monitoring plan.
    uncertainty: Future compliance remains uncertain; the conditional grant hinges on the Individual maintaining uninterrupted
      therapy and medication adherence for the duration of the authorization.
    handoff: The Judge acts under authority granted by 10 C.F.R. § 710.7(a); no further agency review is required unless an
      appeal is filed.
    tempting_wrong:
      option: O2
      pull: The history of violence and the BPD diagnosis could suggest that any restoration is too risky.
      why_wrong: A blanket denial ignores the fact that the Individual now meets the essential treatment-compliance mitigating
        condition, which the Guidelines allow to support a conditional grant.
    rejected:
      O1: Full restoration would require that all mitigating conditions be satisfied, which the record does not demonstrate.
      O2: Denial fails to recognize that the Individual has remedied the primary treatment-compliance barrier, contrary to
        the purpose of the mitigating-condition framework.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to lapse in weekly therapy attendance or miss medication refills, thereby breaking the uninterrupted
        compliance required by mitigating condition (a).
      then: O2
      why: Without continuous treatment compliance, the essential mitigating condition would no longer be satisfied, reinstating
        the rationale for a denial.
    would_not_change:
    - id: noflip1
      if: The Individual's expert diagnosis of anxiety were accepted while the BPD finding and violent history remained unchanged.
      why: The Judge found the expert's analysis insufficient; the underlying BPD diagnosis and behavior continue to sustain
        the security concern.
    watch_for:
    - id: watch1
      what: Sustained, uninterrupted participation in therapy and flawless medication adherence over an extended period.
      favors:
      - O3
      why: Such evidence would meet mitigating condition (a) and could justify a conditional restoration.
  lesson: When a Guideline I security concern stems from a mental-health diagnosis that impairs judgment, the individual can
    still obtain a conditional restoration if they demonstrably satisfy the treatment-compliance mitigating condition, even
    if other risk factors persist.
  limits: This analysis applies only where the record shows a clear pattern of violent conduct and an initial lack of treatment
    compliance; it does not extend to cases in which the mental-health condition is fully stabilized, no recent incidents
    exist, or the individual fails to maintain continuous compliance.
