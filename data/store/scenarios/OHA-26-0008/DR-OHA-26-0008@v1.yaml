case:
  id: DR-OHA-26-0008@v1
  title: Access Authorization Restoration Decision under Guideline I
  status: draft
  setting: DOE Office of Hearings and Appeals, May 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: 'The Individual holds a DOE access authorization. The Local Security Office raised security concerns under Guideline
    I because of violent incidents and a diagnosis of borderline personality disorder. The DOE Psychologist issued two reports:
    one finding persistent depressive disorder without impairment, and a later one diagnosing borderline personality disorder
    that impairs judgment, stability, reliability, and trustworthiness. The Individual’s own expert testified that his condition
    is an anxiety disorder with a good prognosis. The Individual’s treatment record shows intermittent therapy and medication
    compliance, with several periods of discontinuation. The Administrative Judge must determine whether the security concerns
    are mitigated enough to restore the Individual’s access authorization.'
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge conditionally restores the Individual’s access authorization.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual holds a DOE access authorization in connection with his employment with a DOE contractor.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office referred the Individual for a psychological evaluation after the June 2024 assault.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist’s September 2024 report diagnosed persistent depressive disorder and concluded the condition
      did not impair judgment, stability, reliability, or trustworthiness.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The DOE Psychologist’s May 2025 report diagnosed borderline personality disorder and found the condition impairs
      judgment, stability, reliability, and trustworthiness.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual engaged in multiple violent incidents, including a June 2024 assault on his brother and a November
      2024 physical abuse of his daughter.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual discontinued therapy and medication several times, showing inconsistent compliance with treatment
      recommendations.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Individual’s Expert testified that the Individual’s condition is an anxiety disorder, not borderline personality
      disorder, and that the prognosis is good.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline I based on the DOE Psychologist’s BPD finding.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The Administrative Judge found that none of the mitigating conditions listed in the Adjudicative Guidelines were
      satisfied by the record.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F8
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Guideline I concerns are present because the DOE Psychologist’s May 2025 report diagnosed borderline personality
      disorder that impairs judgment, stability, reliability, and trustworthiness, and the Individual’s violent incidents
      demonstrate the risk to national security.
  - id: C2
    facts:
    - F6
    - F9
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual’s intermittent therapy and medication compliance fail to satisfy mitigating condition (a) – consistent
      treatment compliance – which the Judge found essential to mitigate the security concern.
  - id: C3
    facts:
    - F7
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Judge gave greater credibility to the DOE Psychologist’s diagnosis over the Individual’s Expert, finding the
      expert’s limited analysis of the Individual’s relational history unpersuasive.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Adjudicative Guidelines list five mitigating conditions; the Judge determined none were met, leaving the security
      concern unmitigated and requiring denial of restoration.
  reasoning:
    read: The case hinges on whether the Individual’s psychological condition, now diagnosed as borderline personality disorder,
      still poses a security risk under Guideline I. The Judge identified a pattern of violent behavior, poor insight, and
      inconsistent treatment that together sustain the concern.
    weighing: Considering {C1} and {C2}, the Judge found the risk to the common defense unmitigated. {C3} explains why the
      expert’s more favorable view was discounted, and {C4} confirms that none of the statutory mitigating factors were satisfied.
      The balance therefore tips decisively toward denial.
    tradecraft: The decision is recorded in the Administrative Judge’s formal Decision, citing the relevant CFR provisions
      and Adjudicative Guidelines, and the denial is entered into the Individual’s personnel security file.
    uncertainty: The primary uncertainty lies in the Individual’s future treatment adherence; however, the record shows repeated
      lapses, so the current evidence does not support a different outcome.
    handoff: The Administrative Judge acts alone under authority granted by 10 C.F.R. § 710.7(a); no further agency review
      is required unless an appeal is filed.
    tempting_wrong:
      option: O1
      pull: The Individual’s recent symptom reduction and supportive letters from supervisors might suggest a low risk.
      why_wrong: Granting would ignore the unresolved mitigating conditions and the Judge’s finding that the Individual still
        lacks insight and consistent treatment, violating the presumption against clearance restoration.
    rejected:
      O1: Granting would conflict with the Judge’s determination that the security concern remains unmitigated under Guideline I.
      O3: A conditional grant still requires at least one mitigating condition to be satisfied, which the record does not
        demonstrate.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to maintain consistent, ongoing compliance with a qualified treatment plan as required by mitigating
        condition (a).
      then: O3
      why: Consistent treatment would satisfy a mitigating condition, allowing a conditional restoration pending continued
        compliance.
    would_not_change:
    - id: noflip1
      if: The Individual’s expert diagnosis of anxiety were accepted while the BPD diagnosis and violent history remain unchanged.
      why: The Judge found the expert’s analysis insufficient; the underlying BPD finding and behavior still sustain the security
        concern.
    watch_for:
    - id: watch1
      what: Demonstrated, uninterrupted participation in therapy and medication adherence over a sustained period.
      favors:
      - O3
      why: Such evidence would meet mitigating condition (a) and could justify a conditional restoration.
  lesson: When a security concern under Guideline I is based on a diagnosed mental health condition that impairs judgment,
    the burden is on the individual to prove that the condition is fully controlled and that all mitigating conditions are
    satisfied; without consistent treatment compliance, denial is required.
  limits: This reasoning applies only where the adjudicative record shows a clear, ongoing pattern of violent behavior and
    treatment non‑compliance; it does not extend to cases where the mental health condition is stable, well‑treated, and no
    recent incidents exist.
