case:
  id: DR-OHA-26-0008-restyle1@v1
  title: Access Authorization Restoration Decision under Guideline I [restyle]
  status: needs_review
  setting: National Energy Agency Office of Security Appeals, May 2026
  decider: Senior Adjudicator
  agent: Senior Adjudicator
  agent_role: decide
  situation: 'The employee possesses a security clearance tied to his role with a contractor of the Agency. The Agency''s
    Local Security Office raised a concern under Guideline I after a series of violent episodes and a diagnosis of borderline
    personality disorder. Two assessments from the Agency psychologist were submitted: the first identified persistent depressive
    disorder without functional impact, while the later assessment diagnosed borderline personality disorder that compromises
    judgment, stability, reliability, and trustworthiness. The employee''s own specialist testified that the condition is
    an anxiety disorder with a favorable outlook. The employee''s treatment file shows sporadic therapy and medication adherence,
    punctuated by multiple lapses. The Senior Adjudicator must decide whether the security concerns have been sufficiently
    mitigated to reinstate the employee''s clearance.'
  question: How should the Senior Adjudicator rule on the employee's security clearance?
  options:
    O1:
      do: The Senior Adjudicator reinstates the employee's security clearance.
      move: act
      irreversible: true
    O2:
      do: The Senior Adjudicator denies reinstatement of the employee's security clearance.
      move: act
      irreversible: true
    O3:
      do: The Senior Adjudicator reinstates the clearance conditionally.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee holds a security clearance because of his employment with a contractor serving the Agency.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office referred the employee for a psychological assessment following the assault in June 2024.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The Agency psychologist's September 2024 report identified persistent depressive disorder and concluded it did not
      affect judgment, stability, reliability, or trustworthiness.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The Agency psychologist's May 2025 report diagnosed borderline personality disorder and determined the condition
      impairs judgment, stability, reliability, and trustworthiness.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee was involved in several violent acts, including a June 2024 assault on his brother and a November 2024
      incident of physical abuse toward his daughter.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee repeatedly stopped therapy and medication, demonstrating irregular compliance with treatment recommendations.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The employee's specialist testified that the employee suffers from an anxiety disorder, not borderline personality
      disorder, and that the prognosis is positive.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline I concerns based on the psychologist's borderline personality disorder
      finding.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The Senior Adjudicator concluded that none of the mitigating conditions enumerated in the Adjudicative Guidelines
      were satisfied by the record.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F8
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Guideline I concerns remain because the May 2025 psychologist report identified borderline personality disorder that
      erodes judgment, stability, reliability, and trustworthiness, and the employee's violent conduct underscores a continuing
      security risk.
  - id: C2
    facts:
    - F6
    - F9
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The employee's erratic therapy and medication history fails to meet mitigating condition (a)—steady treatment compliance—which
      the Adjudicator deemed essential for risk reduction.
  - id: C3
    facts:
    - F7
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Adjudicator placed greater weight on the Agency psychologist's diagnosis than on the employee's specialist, finding
      the specialist's limited review of relational history unconvincing.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Adjudicative Guidelines enumerate five mitigating conditions; the Adjudicator determined none were satisfied,
      leaving the security concern unmitigated and obligating denial of reinstatement.
  reasoning:
    read: The determination turns on whether the employee's borderline personality disorder continues to constitute a security
      hazard under Guideline I. The Adjudicator identified a pattern of violence, limited insight, and patchy treatment that
      together sustain the concern.
    weighing: In light of {C1} and {C2}, the Adjudicator concluded that the risk to the common defense remains unmitigated.
      {C3} clarifies why the specialist's more favorable assessment was discounted, and {C4} confirms that no statutory mitigating
      factor was met. Accordingly, the balance decisively favors denial.
    tradecraft: The decision is entered in the Senior Adjudicator's formal Decision memorandum, referencing the pertinent
      CFR sections and Adjudicative Guidelines, and the denial is recorded in the employee's personnel security file.
    uncertainty: The chief uncertainty concerns the employee's future adherence to treatment; however, the record shows repeated
      lapses, providing no basis for a different outcome at this time.
    handoff: The Senior Adjudicator acts independently under authority granted by 10 C.F.R. § 710.7(a); further agency review
      is not required unless an appeal is lodged.
    tempting_wrong:
      option: O1
      pull: The employee's recent symptom improvement and supportive supervisor letters could be read as evidence of low risk.
      why_wrong: Granting would overlook the unresolved mitigating conditions and the Adjudicator's finding that the employee
        still lacks insight and consistent treatment, contravening the presumption against clearance restoration.
    rejected:
      O1: Granting would conflict with the Adjudicator's determination that the security concern remains unmitigated under
        Guideline I.
      O3: A conditional grant still requires at least one mitigating condition to be satisfied, which the record does not
        demonstrate.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee were to sustain continuous, documented compliance with a qualified treatment regimen as required by
        mitigating condition (a).
      then: O3
      why: Continuous treatment would satisfy a mitigating condition, permitting a conditional reinstatement pending ongoing
        compliance.
    would_not_change:
    - id: noflip1
      if: The employee's specialist diagnosis of anxiety were accepted while the borderline personality disorder finding and
        violent history remained unchanged.
      why: The Adjudicator found the specialist's analysis insufficient; the underlying BPD diagnosis and behavior continue
        to sustain the security concern.
    watch_for:
    - id: watch1
      what: Uninterrupted participation in therapy and consistent medication adherence over an extended period.
      favors:
      - O3
      why: Such evidence would meet mitigating condition (a) and could justify a conditional reinstatement.
  lesson: When a Guideline I security concern is rooted in a diagnosed mental health condition that impairs judgment, the
    burden rests on the individual to demonstrate full control of the condition and fulfillment of all mitigating conditions;
    absent steady treatment compliance, denial is required.
  limits: This analysis applies only where the adjudicative record reveals a clear, ongoing pattern of violent conduct and
    treatment non-compliance; it does not extend to cases where the mental health issue is stable, well-treated, and no recent
    incidents are documented.
