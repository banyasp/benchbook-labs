case:
  id: DR-CORPUS-NX-5fc36ca8-E2@v1
  title: Information Sharing During the Great Lakes Crisis
  status: draft
  setting: Central Africa, during the mid-1990s Great Lakes Crisis; Washington and the U.S. government.
  decider: The U.S. government
  agent: The U.S. government
  agent_role: decide
  situation: The Great Lakes Crisis was unfolding in Central Africa in the mid-1990s. Washington wanted to act but had few
    assets on the ground. Several NGOs were eager to help. They had trouble identifying the most acute areas of crisis in
    Rwanda, Burundi, and the Democratic Republic of the Congo. National-security sensitivity around the issues was low. The
    government faced a choice about sharing satellite imagery and other intelligence-derived information with NGOs.
  question: What should the U.S. government do about disclosing satellite imagery and other intelligence-derived information
    to NGOs during the Great Lakes Crisis?
  options:
    O1:
      do: The U.S. government withholds satellite imagery and other intelligence-derived information from NGOs.
      move: act
      irreversible: false
    O2:
      do: The U.S. government discloses satellite imagery and other intelligence-derived information to NGOs.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Great Lakes Crisis took place in Central Africa in the mid-1990s.
  - id: F2
    kind: situation
    status: confirmed
    fact: The crisis was prompted by the genocide in Rwanda.
  - id: F3
    kind: situation
    status: confirmed
    fact: Washington wanted to act.
  - id: F4
    kind: capability
    status: confirmed
    fact: Washington had few assets on the ground.
  - id: F5
    kind: situation
    status: confirmed
    fact: Several NGOs were eager to help.
  - id: F6
    kind: capability
    status: confirmed
    fact: Several NGOs had trouble identifying the most acute areas of crisis in Rwanda, Burundi, and the Democratic Republic
      of the Congo.
  - id: F7
    kind: situation
    status: assessed
    fact: National-security sensitivity around the issues was low.
  considerations:
  - id: C1
    facts:
    - F7
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: Low national-security sensitivity was the stated reason the government was willing to share, reducing the security
      concern that might otherwise support withholding.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: humanitarian_access
    favors:
    - O2
    weight: strong
    why: Washington wanted to act but had few assets on the ground, while eager NGOs struggled to identify the most acute
      areas of crisis. Sharing offered a way to support their efforts.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The satellite imagery was of dubious value in heavily forested areas, which limits the expected usefulness of that
      part of the information. The government nevertheless shared it.
  reasoning:
    read: 'This was a crisis in which Washington wanted to act despite having few assets on the ground, and NGOs were eager
      to help but had trouble identifying the most acute needs. The trap is treating intelligence-derived information as automatically
      too sensitive to share, or assuming the imagery would be useful everywhere: the stated sensitivity was low, while the
      imagery had limited value in heavily forested areas.'
    weighing: The government’s stated judgment favored sharing because national-security sensitivity was low. That judgment
      was reinforced by the limited U.S. presence and the NGOs’ difficulty identifying acute areas. The imagery’s dubious
      value in forested areas tempers the expected benefit, but did not outweigh the reasons for disclosure. The balance depends
      especially on the sensitivity of the information and the practical need for it.
    tradecraft: As an authored decision-practice synthesis, assess sensitivity and expected humanitarian usefulness before
      deciding what to disclose, and record the rationale and any material limits on expected value. The passage provides
      no formal approval authority or sharing standard.
    uncertainty: The passage does not establish how much the information helped, what information beyond the imagery was shared
      in this instance, or what controls accompanied disclosure. It does state that imagery had dubious value in heavily forested
      areas.
    handoff: The U.S. government made the sharing decision. The passage identifies no formal approval authority or required
      referral, so it does not support prescribing a particular handoff.
    tempting_wrong:
      option: O1
      pull: Withholding can seem prudent whenever information is intelligence-derived.
      why_wrong: That overlooks the stated low national-security sensitivity, Washington’s limited presence, and the NGOs’
        difficulty locating the most acute areas; the government was willing to share in those circumstances.
    rejected:
      O1: Withholding was not chosen because the government judged national-security sensitivity to be low and was willing
        to share information in support of cooperation.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: National-security sensitivity around the issues were materially higher.
      then: O1
      why: The low sensitivity was the stated reason the government was willing to share; materially greater sensitivity could
        reverse that balance.
    would_not_change:
    - id: noflip1
      if: The imagery remained of dubious value in heavily forested areas.
      why: That limitation was present in the described case and did not prevent the government from sharing.
    watch_for:
    - id: watch1
      what: Whether cooperation is supported by personal contacts, mutual respect, and a commitment to work together.
      favors:
      - O2
      why: The source identifies such relationships as an important basis for collaborative information-sharing during crises.
  lesson: When the government has few assets on the ground and humanitarian organizations need help identifying acute needs,
    low national-security sensitivity can weigh in favor of sharing. Limited information value should temper expectations,
    but need not by itself bar disclosure.
  limits: This reasoning concerns the described crisis, where sensitivity was assessed as low and the imagery had limited
    value in heavily forested areas. It does not establish a general sharing rule or resolve cases involving materially greater
    sensitivity, different information, or a formal approval standard.
