case:
  id: DR-CORPUS-NX-5fc36ca8-E1@v1
  title: Restrictions on Recruiting Informants
  status: draft
  setting: U.S. intelligence services, campaign against terrorism, following restrictions imposed in 1995.
  decider: The authority responsible for deciding whether to retain or relax the restrictions.
  agent: The authority responsible for deciding whether to retain or relax the restrictions
  agent_role: decide
  situation: Restrictions imposed in 1995 limited the opportunity to recruit informants who may have run afoul of human-rights
    laws. The restrictions were intended to protect U.S. intelligence services, but were assessed to discourage recruitment
    of potentially useful informants and hinder collection efforts. Potential sources included former terrorists and other
    criminals with likely questionable human-rights records. These sources were assessed to possess specialized information
    and often to operate in areas where U.S. intelligence professionals could not easily establish a presence. Their potential
    knowledge was considered capable of saving U.S. citizens’ lives, while cooperation with them was not considered an endorsement
    of their past actions.
  question: What should the authority responsible for deciding whether to retain or relax the restrictions do about recruiting
    informants who may have run afoul of human-rights laws?
  options:
    O1:
      do: The policy authority permits recruitment of informants who may have run afoul of human-rights laws.
      move: act
      irreversible: false
    O2:
      do: The policy authority prohibits recruitment of informants who may have run afoul of human-rights laws.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Restrictions imposed in 1995 limited the opportunity to recruit informants who may have run afoul of human-rights
      laws.
  - id: F2
    kind: authority
    status: confirmed
    fact: The guidelines were designed to protect U.S. intelligence services.
  - id: F3
    kind: situation
    status: assessed
    fact: In practice, the guidelines discouraged recruitment of potentially useful informants and hindered collection efforts.
  - id: F4
    kind: situation
    status: assessed
    fact: Potential sources included former terrorists and other criminals who most probably had questionable human-rights
      records.
  - id: F5
    kind: capability
    status: assessed
    fact: Such sources often operated in areas where U.S. intelligence professionals could not easily establish a presence.
  - id: F6
    kind: capability
    status: assessed
    fact: Such sources could possess specialized information.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The potential knowledge of such sources could save the lives of U.S. citizens.
  - id: F8
    kind: situation
    status: assessed
    fact: Interaction with such sources was not considered an endorsement of their previous actions.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: complicity_risk
    favors:
    - O2
    weight: weak
    why: The restrictions were meant to protect intelligence services, while the possible sources had likely questionable
      human-rights records. These concerns do not establish a legal rule requiring recruitment to be prohibited.
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The restrictions discouraged recruitment of potentially useful informants and hindered collection, weighing against
      a categorical barrier.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: These sources may have specialized information and operate where U.S. intelligence professionals cannot easily establish
      a presence, making their cooperation potentially important to collection.
  - id: C4
    facts:
    - F7
    - F8
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The possibility that the sources' knowledge could save U.S. citizens' lives outweighs their disagreeable backgrounds,
      and interaction is distinct from approval of their past actions.
  reasoning:
    read: 'The choice is whether to preserve restrictions intended to protect intelligence services despite their assessed
      cost to collection, or permit recruitment of sources with troubling backgrounds. The trap is treating cooperation as
      endorsement: interaction for information is distinct from approbation of past conduct. The account does not explain
      what safeguards would govern recruitment.'
    weighing: 'The balance favors {O1}: the restrictions hindered collection {C2}, and the sources may offer specialized knowledge
      unavailable through an easy U.S. presence {C3}, potentially saving lives {C4}. Their human-rights histories and the
      protective purpose of the restrictions remain relevant concerns {C1}, but the potential knowledge is treated as weightier
      and collaboration as necessary. The balance depends on the assessed usefulness and life-saving potential of the information
      and on whether the restrictions are in fact impeding collection.'
    tradecraft: At the policy level, make clear that permission to recruit is not approval of past conduct, and record the
      reasons for relaxing the restriction and the human-rights concern it addresses. The account does not specify safeguards
      or operational practices; any legal limits and accountability measures should be established by the responsible authority
      rather than inferred from this rationale.
    uncertainty: The assessments about collection costs, source expertise, and possible life-saving value are not quantified.
      The decision-maker, applicable legal standard, and safeguards are not identified, and the account does not establish
      how any particular source would be evaluated.
    handoff: The responsible policy authority must decide. Because the restrictions concern human-rights laws and the account
      does not describe safeguards, involving appropriate legal and oversight advisers would be prudent; that consultation
      is a decision-process recommendation, not a step specified in the account.
    tempting_wrong:
      option: O2
      pull: Retaining the restrictions appears to honor their protective purpose and avoid association with people who may
        have violated human-rights laws.
      why_wrong: The restrictions hindered collection, and potentially life-saving information can outweigh a source's disagreeable
        background; cooperation does not endorse past actions.
    rejected:
      O2: Retaining the restrictions is not chosen because they discourage useful recruitment and hinder collection despite
        the potential value of these sources.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The authority assessed that these sources were unlikely to possess useful specialized information or that their
        information had little potential to save lives.
      then: O2
      why: The justification for permitting recruitment depends on the value and potential life-saving significance of the
        sources' knowledge.
    - id: flip2
      if: The restrictions were shown not to hinder collection, while continuing to serve their protective purpose.
      then: O2
      why: The case for relaxing the restrictions depends substantially on the assessment that they hinder collection.
    would_not_change:
    - id: noflip1
      if: A source had a questionable human-rights record but otherwise had potentially valuable information.
      why: A questionable human-rights record is the concern at issue; interaction does not imply approval, and potentially
        life-saving knowledge is weighed more heavily.
    watch_for:
    - id: watch1
      what: Evidence about whether the restrictions actually impede collection and whether the sources can provide specialized,
        potentially life-saving information.
      favors:
      - O1
      - O2
      why: These assessments determine how the considerations in the balance apply.
  lesson: A source's wrongful or troubling past does not, by itself, make cooperation an endorsement of that past. When restrictions
    materially impede collection, the potential value of information—including its capacity to save lives—may justify permitting
    recruitment, while the human-rights concern remains part of the decision.
  limits: This reasoning supports permission at the policy level; it does not establish that every source should be recruited
    or that any particular recruitment is lawful. The account does not identify a legal standard, decision-maker, or safeguards,
    so it cannot resolve those questions.
