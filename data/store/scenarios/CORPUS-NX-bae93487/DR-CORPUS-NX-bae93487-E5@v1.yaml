case:
  id: DR-CORPUS-NX-bae93487-E5@v1
  title: INSCOM Unit Placement Decision
  status: draft
  setting: INSCOM and DIA, August 1984
  decider: INSCOM and DIA
  agent: INSCOM and DIA
  agent_role: decide
  situation: In August 1984, the issue concerned the institutional placement of INSCOM’s remote viewing unit. The unit’s operational
    activities were being considered in relation to strategic, national-level tasking. The institutional choice was whether
    to retain the unit under INSCOM or transfer it to DIA. The decision concerned both the unit’s assignment and the responsiveness
    of its operational activities.
  question: 'What should INSCOM and DIA do about the unit’s placement: approve its transfer to DIA and formalize the arrangement,
    or reject the transfer and retain it under INSCOM?'
  options:
    O1:
      do: INSCOM and DIA reject transferring the unit to DIA and retain the unit under INSCOM.
      move: act
      irreversible: false
    O2:
      do: INSCOM and DIA approve transferring the unit to DIA and complete a memorandum of agreement for Project Center Lane.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: INSCOM had a remote viewing unit.
  - id: F2
    kind: situation
    status: confirmed
    fact: The unit was associated with INSCOM.
  - id: F3
    kind: situation
    status: confirmed
    fact: The decision concerned the unit’s operational activities.
  - id: F4
    kind: situation
    status: confirmed
    fact: The decision point was in August 1984.
  - id: F5
    kind: situation
    status: confirmed
    fact: The stated objective was greater responsiveness to strategic, national-level tasking.
  - id: F6
    kind: situation
    status: confirmed
    fact: Transferring the unit to DIA was identified as necessary to achieve that objective.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The stated objective was to make the unit’s activities more responsive to strategic, national-level tasking.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Transfer to DIA was identified as necessary to achieve the stated responsiveness objective.
  - id: C3
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Because the decision concerned the unit’s operational activities, its placement was treated as a means of aligning
      those activities with strategic, national-level tasking; this applies the stated rationale rather than adding a separate
      one.
  reasoning:
    read: This is an institutional-placement decision about making the unit’s operational activities more responsive to strategic,
      national-level tasking, not a decision about the merits or methods of remote viewing. The central question is whether
      changing the unit’s placement is needed to achieve that stated objective.
    weighing: The stated objective favors transfer {C1}, and the source identifies transfer to DIA as necessary to achieve
      it {C2}. The unit’s operational focus makes placement relevant to that objective {C3}. The balance therefore favors
      {O2}; it depends on the stated assessment that transfer is necessary for greater responsiveness.
    tradecraft: Record the responsiveness objective and the stated reason that transfer is necessary, then use the memorandum
      of agreement to formalize the agencies’ arrangement. Keep the record focused on institutional placement and responsibility.
    uncertainty: The stated reasons do not compare the agencies’ capabilities or explain how the expected improvement in responsiveness
      was assessed. They provide no separate legal, operational-effectiveness, or resource rationale.
    handoff: INSCOM and DIA are the decision-makers in the stated arrangement; their completed memorandum of agreement provides
      the formal interagency handoff.
    tempting_wrong:
      option: O1
      pull: Retaining the existing placement may seem simpler because the unit was associated with INSCOM.
      why_wrong: That consideration does not answer the stated objective, and the source identifies transfer as necessary
        to achieve greater responsiveness to strategic, national-level tasking.
    rejected:
      O1: Retaining the unit under INSCOM was not chosen because transfer to DIA was identified as necessary for the stated
        responsiveness objective.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The transfer were not necessary to achieve greater responsiveness to strategic, national-level tasking.
      then: O1
      why: Without the stated necessity, the source’s principal reason for changing the unit’s placement would no longer support
        transfer, leaving retention as the alternative.
    would_not_change:
    - id: noflip1
      if: The agencies completed a memorandum of agreement but had no basis for the stated responsiveness objective.
      why: Formalizing an arrangement would not, by itself, supply the substantive reason the source gives for transferring
        the unit.
    watch_for:
    - id: watch1
      what: Whether transfer is in fact necessary to make the unit’s activities more responsive to strategic, national-level
        tasking.
      favors:
      - O2
      why: This is the stated premise on which the transfer decision rests.
  lesson: When institutional placement is chosen to serve a stated mission objective, identify whether the proposed transfer
    is actually necessary to achieve that objective. Formalize the arrangement only after making that placement decision clear.
  limits: This reasoning applies only to the placement decision and the stated responsiveness objective. The source gives
    no basis for conclusions about operational methods, effectiveness beyond that objective, or other legal or policy considerations.
