case:
  id: DR-CORPUS-NX-6428ff84-E11@v1
  title: A Resistance Capability for an Invasion Contingency
  status: draft
  setting: Great Britain, 1940, the military leadership overseeing the Auxiliary Units.
  decider: The military leadership overseeing the Auxiliary Units
  agent: The military leadership overseeing the Auxiliary Units
  agent_role: decide
  situation: In 1940, Great Britain faced the contingency of invasion and occupation by German forces. A proposed stay-behind
    resistance capability would operate in that contingency. The program was developed under military auspices, with a lead
    selected for relevant military experience. Local Home Guard defensive operations were expected to take precedence before
    the resistance units began activity. The decision is whether to create this additional capability or rely on other homeland-defence
    measures.
  question: What should the military leadership overseeing the Auxiliary Units do about creating a clandestine resistance
    capability for an invasion contingency, weighing its policy rationale and risks against reliance on other homeland-defence
    measures?
  options:
    O1:
      do: The military leadership authorizes creation of the Auxiliary Units as an invasion-contingency resistance capability.
      move: act
      irreversible: true
    O2:
      do: The military leadership declines creation of the Auxiliary Units and relies on other homeland-defence measures.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Great Britain faced the contingency of invasion and occupation by German forces.
  - id: F2
    kind: capability
    status: confirmed
    fact: The Auxiliary Units were conceived as stay-behind resistance units for an invasion contingency.
  - id: F3
    kind: capability
    status: confirmed
    fact: The proposed units were intended to conduct resistance against German occupation forces.
  - id: F4
    kind: capability
    status: confirmed
    fact: The resistance program's lead was recognized as an expert on partisan and guerrilla warfare.
  - id: F5
    kind: capability
    status: confirmed
    fact: The program's lead was selected based on extensive experience studying and conducting military operations against
      terrorists and insurgents in Ireland and Palestine.
  - id: F6
    kind: situation
    status: confirmed
    fact: The units were ordered to begin activity only after local Home Guard defensive operations had ceased.
  - id: F7
    kind: capability
    status: confirmed
    fact: The contemplated resistance-unit network extended throughout Great Britain.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The capability addresses a distinct contingency: resistance if Great Britain were invaded and occupied, rather than
      a substitute for defending against an invasion.'
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The program was led by someone with recognized expertise in partisan and guerrilla warfare and extensive relevant
      military experience, supporting the choice to develop this specialized capability.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: A network extending throughout Great Britain could provide resistance capability across the country if occupation
      occurred.
  - id: C4
    facts:
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: The units were to begin activity only after local Home Guard defensive operations had ceased, preserving the stated
      priority of those operations before resistance activity began.
  reasoning:
    read: This is a decision to prepare an additional capability for the contingency of invasion and occupation, not to replace
      homeland defense or to begin resistance activity immediately. The trap is treating the capability as either unnecessary
      because other defenses exist or as an immediate alternative to those defenses.
    weighing: The invasion-and-occupation contingency supplies the central rationale for creation {C1}. Relevant leadership
      experience and nationwide coverage support that choice, though neither establishes how effective the capability would
      be {C2} {C3}. The stated sequencing of activity after local Home Guard operations cease preserves their priority {C4}.
      The balance favors authorization, but depends on the invasion contingency being meaningful and on respecting that sequencing.
      The source gives little explicit account of the costs or risks of creating the capability, so those cannot be weighed
      in detail.
    tradecraft: Record that authorization is for the invasion contingency, distinguish creation from any later decision to
      activate the capability, and preserve the stated priority of local Home Guard operations. Document the authority and
      rationale for the decision and revisit the contingency if circumstances change.
    uncertainty: The account describes the rationale and intended conditions, but does not assess the likelihood of invasion,
      demonstrate operational effectiveness, or set out a detailed assessment of risks to personnel or civilians.
    handoff: The military leadership overseeing the Auxiliary Units should decide within its military responsibilities; legal
      and policy advisers could review the authority and consequences of the proposed capability. That review is a decision
      safeguard, not a step stated in the account.
    tempting_wrong:
      option: O2
      pull: Relying on other homeland-defence measures avoids creating an additional capability before an invasion has occurred.
      why_wrong: That approach leaves the occupation contingency unaddressed; the stated rationale is to have resistance capability
        available if invasion and occupation occur, while allowing local Home Guard defense to take precedence.
    rejected:
      O2: It was not chosen because the invasion-and-occupation contingency justified adding a stay-behind resistance capability
        rather than relying only on other homeland-defence measures.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The invasion-and-occupation contingency were no longer credible.
      then: O2
      why: The source's stated rationale for creating the capability is preparation for that contingency; without it, the
        case for the additional capability would substantially weaken.
    would_not_change:
    - id: noflip1
      if: Local Home Guard defensive operations had not yet ceased.
      why: That condition changes when the units should begin activity, not whether the resistance capability should be created;
        activity is to wait until those operations have ceased.
    watch_for:
    - id: watch1
      what: Whether the contingency of invasion and occupation remains a live planning concern.
      favors:
      - O1
      why: The capability is expressly framed as preparation for that contingency.
  lesson: A specialized contingency capability can complement existing defenses when it addresses a distinct scenario those
    defenses may not cover. Its authorization should remain tied to that scenario and should preserve the stated priority
    of existing defensive operations.
  limits: This reasoning supports preparation for the specific invasion-and-occupation contingency described; it does not
    establish that a similar capability is justified in other circumstances. The account does not supply a full assessment
    of legal authority, civilian effects, or operational risks.
