case:
  id: DR-CORPUS-NX-df0ed45a-E2@v1
  title: Ground Forces for the China–Burma–India Theater
  status: draft
  setting: China–Burma–India theater, during the 1941–1942 Asia–Pacific campaigns, U.S. command.
  decider: The U.S. commander in the China–Burma–India theater
  agent: The U.S. commander in the China–Burma–India theater
  agent_role: decide
  situation: Japan's military campaigns across Asia–Pacific included incursions into Burma and British India during 1941–1942.
    The U.S. commander in the China–Burma–India theater needed ground forces to drive Japanese forces out of the area. U.S.
    infantry might not be available for shipment to the theater for at least a year. An offer was available to use OSS Detachment
    101, described as a light, unconventional, and untried unit. The commander had nowhere else to turn.
  question: 'What should the U.S. commander in the China–Burma–India theater do: accept the offered unit or reject the offer
    and wait for U.S. infantry?'
  options:
    O1:
      do: The theater commander accepts the offered unit and uses it in the theater.
      move: act
      irreversible: false
    O2:
      do: The theater commander rejects the offered unit and waits for U.S. infantry.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Japan's military campaigns across Asia–Pacific from 1941 to 1942 included incursions into Burma and British India.
  - id: F2
    kind: situation
    status: assessed
    fact: The U.S. commander in the China–Burma–India theater needed ground forces to drive Japanese forces out of the area.
  - id: F3
    kind: situation
    status: assessed
    fact: It would likely be at least a year before U.S. infantry could be shipped to the theater.
  - id: F4
    kind: situation
    status: confirmed
    fact: An offer was made to use OSS Detachment 101 in the theater.
  - id: F5
    kind: capability
    status: confirmed
    fact: OSS Detachment 101 was described as light, unconventional, and untried.
  - id: F6
    kind: situation
    status: assessed
    fact: The commander had nowhere else to turn.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The commander needed ground forces to drive Japanese forces out of the area, and the offered unit was an available
      way to meet that need.
  - id: C2
    facts:
    - F3
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Waiting for U.S. infantry could leave the theater without those forces for at least a year.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The offered unit was untried, a reason for reluctance, but the commander had nowhere else to turn. Mission effect
      is the closest available equity for this concern about the unit's uncertain usefulness.
  reasoning:
    read: The choice was between an untried unit available now and waiting for conventional infantry that might not arrive
      for at least a year. The trap is treating waiting as a neutral default when the commander needed ground forces and had
      nowhere else to turn.
    weighing: The need for ground forces and the long expected delay favored accepting the offer {C1} {C2}. The unit's untried
      character supported caution, but the commander accepted it despite that concern because no alternative was available
      {C3}. The balance depends on the stated need and lack of alternatives, not on any claim that the unit was proven.
    tradecraft: Record the decision as acceptance under the stated operational constraint, including the expected delay for
      infantry and the unit's untried status. Keep the decision rationale separate from any later account of the unit's operations.
    uncertainty: The passage gives no assessment of the unit's actual effectiveness or of the specific risks arising from
      its untried status.
    handoff: The theater commander made the choice; the passage identifies no required referral or separate approval authority.
    tempting_wrong:
      option: O2
      pull: Waiting for conventional infantry avoids relying on an untried unit.
      why_wrong: It discounts the likely year-long delay and the commander's lack of another option despite the need for ground
        forces.
    rejected:
      O2: The commander did not wait for U.S. infantry because it might not arrive for at least a year and he had nowhere
        else to turn.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: U.S. infantry could be shipped to the theater without the stated year-long delay.
      then: O2
      why: Removing the long wait would weaken the stated reason for accepting an untried unit.
    - id: flip2
      if: A suitable alternative source of ground forces were available.
      then: O2
      why: The commander’s stated reason for accepting was that he had nowhere else to turn.
    would_not_change:
    - id: noflip1
      if: The unit remained untried.
      why: The commander accepted it despite that characteristic when the need for ground forces and lack of alternatives
        remained.
    watch_for: []
  lesson: When a mission requires forces and the conventional option may be unavailable for a prolonged period, assess whether
    waiting leaves the need unmet and whether a viable alternative exists. An untried option can remain uncertain yet be the
    choice supported by the circumstances when no alternative is available.
  limits: This reasoning addresses only the choice to accept the offered unit rather than wait for infantry. It does not establish
    the unit's effectiveness, the legality of any later operation, or a general rule that untried forces should be accepted.
