case:
  id: DR-CORPUS-NX-6a48c37b-E9@v1
  title: Prohibiting Rural Self-Defense Forces
  status: draft
  setting: Colombia, 25 May 1989, Colombian Supreme Court.
  decider: The Colombian Supreme Court
  agent: The Colombian Supreme Court
  agent_role: decide
  situation: The Colombian Supreme Court faced whether to continue tolerating rural self-defense forces or prohibit them.
    State officials had once welcomed rural militias, but had become concerned that the groups were a serious criminal enterprise
    causing more harm than good. Their counterinsurgency strategy included terrorizing people who assisted guerrillas to isolate
    the insurgents from popular support. The groups used brutal violence against suspected insurgents and their supporters,
    and attacked government representatives seeking to curtail them. In January 1989, a paramilitary unit killed 12 judicial
    representatives who were investigating an attack on a village.
  question: What should the Colombian Supreme Court do about whether to continue tolerating the self-defense forces or prohibit
    them and government collaboration with them?
  options:
    O1:
      do: The Colombian Supreme Court prohibits the self-defense forces and bars government security forces and other officials
        from continuing collaboration with them.
      move: act
      irreversible: false
    O2:
      do: The Colombian Supreme Court permits the self-defense forces and allows government security forces and other officials
        to continue collaboration with them.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The paramilitary strategy focused on terrorizing people who assisted guerrillas and isolating the insurgents from
      their popular support base.
  - id: F2
    kind: situation
    status: confirmed
    fact: Paramilitary groups used brutal violence, including dismembering, decapitating, torturing, and burning suspected
      insurgents or their supporters.
  - id: F3
    kind: situation
    status: confirmed
    fact: By the end of the 1980s, self-defense force violence had escalated, and groups attacked government representatives
      who sought to curtail them or pursue anti-narcotic policies contrary to their interests.
  - id: F4
    kind: situation
    status: confirmed
    fact: In January 1989, a paramilitary unit murdered 12 judicial representatives investigating an attack on a village.
  - id: F5
    kind: situation
    status: confirmed
    fact: Colombian state officials had at one time welcomed rural militias.
  - id: F6
    kind: intelligence
    status: assessed
    fact: State officials became concerned that the groups had grown into a serious criminal enterprise causing more harm
      than good.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The forces’ counterinsurgency strategy terrorized people who assisted guerrillas, and their brutal violence against
      suspected insurgents and supporters made continued tolerance difficult to reconcile with civilian safety.
  - id: C2
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The groups’ escalating violence included attacks on government representatives seeking to constrain them, culminating
      in the murder of judicial representatives investigating an attack. Their actions were no longer confined to defending
      local communities from insurgents.
  - id: C3
    facts:
    - F6
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: Officials had come to regard the groups as a serious criminal enterprise causing more harm than good, supporting
      both prohibition and ending official collaboration.
  - id: C4
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The state’s earlier welcome of rural militias reflects their former perceived usefulness, but that history did not
      outweigh the later violence and criminality.
  reasoning:
    read: The issue was no longer simply whether communities could defend themselves against guerrilla violence. The self-defense
      label and the groups’ earlier welcome by officials risk obscuring their brutal tactics, attacks on state representatives,
      and transformation into a criminal enterprise.
    weighing: The earlier welcome of the militias points weakly toward toleration {C4}, but the terror and brutality against
      suspected insurgents and supporters {C1}, attacks on government representatives including judicial investigators {C2},
      and officials’ concern that the groups were causing more harm than good {C3} support prohibition. The balance favors
      ending both the groups’ legal status and official collaboration with them {O1}.
    tradecraft: State the prohibition and the bar on official collaboration clearly, and record the decision’s legal basis
      and the concerns supporting it.
    uncertainty: The outcome and relevant context are clear, but the complete legal test and a detailed account of the Court’s
      deliberation are not specified.
    handoff: The Colombian Supreme Court was the deciding authority; no additional referral or approval step is identified.
    tempting_wrong:
      option: O2
      pull: The state had previously welcomed rural militias, and their stated purpose was self-defense against insurgents.
      why_wrong: That rationale does not answer the later record of terror, escalating violence, attacks on government representatives,
        and criminal activity.
    rejected:
      O2: The Court did not continue tolerating the forces because their violence and criminal activity had grown to cause
        more harm than good.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The groups had remained limited to local defense and there were no comparable findings of brutal violence, attacks
        on government representatives, or serious criminal activity.
      then: O2
      why: Without the harms that drove the case for prohibition, the earlier rationale for tolerating local self-defense
        forces could carry greater weight.
    would_not_change:
    - id: noflip1
      if: Officials’ earlier welcome of the militias were the only fact offered in support of continued tolerance.
      why: That historical support alone would not outweigh the later escalation of violence and the assessment that the groups
        had become a harmful criminal enterprise.
    watch_for:
    - id: watch1
      what: Evidence that the groups continued to terrorize supporters of guerrillas or attack government representatives
        seeking to constrain them.
      favors:
      - O1
      why: Those conditions reinforce the stated grounds for prohibition rather than support continued tolerance.
  lesson: A force’s original defensive purpose or prior official welcome does not settle whether it should continue to be
    tolerated. When its conduct escalates into brutal violence, attacks on public officials, and serious criminality, those
    harms can outweigh its former perceived usefulness and support prohibiting both the force and official collaboration.
  limits: This reasoning applies to circumstances involving escalating brutality, attacks on government representatives, and
    a serious criminal enterprise. It does not establish a general legal test for self-defense groups or resolve cases where
    the conduct, risks, or governing law materially differ.
