case:
  id: DR-CORPUS-NX-0d2a0199-E13@v1
  title: Continuity Planning During DIA’s Transition
  status: draft
  setting: During the Defense Intelligence Agency’s evolutionary period, within the Defense Intelligence Agency and its relationships
    with the Joint Staff and military services.
  decider: Defense Intelligence Agency leadership
  agent: Defense Intelligence Agency leadership
  agent_role: decide
  situation: The Defense Intelligence Agency has been conducting preliminary planning for continuity of intelligence operations
    in an emergency requiring operations from an alternate location. DIA is in an evolutionary period and is preparing for
    its future role when fully operational. Joint planning with the Joint Staff’s intelligence organizations and the military
    services is at issue. A working group is proposed to assist in preparing a Defense military intelligence plan for continuity
    of operations, including defining intelligence functions and required duty titles.
  question: What should Defense Intelligence Agency leadership do about initiating joint continuity planning during DIA’s
    evolutionary period?
  options:
    O1:
      do: DIA leadership defers joint continuity planning with the Joint Staff and military services until DIA is fully operational.
      move: act
      irreversible: false
    O2:
      do: DIA leadership initiates joint continuity planning with the Joint Staff and military services during DIA’s evolutionary
        period.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: DIA has been conducting preliminary planning for continuity of intelligence operations in an emergency requiring
      operations from an alternate location.
  - id: F2
    kind: situation
    status: confirmed
    fact: DIA is in an evolutionary period and is preparing for its role when fully operational.
  - id: F3
    kind: situation
    status: confirmed
    fact: The contemplated joint planning involves the intelligence organizations of the Joint Staff and the military services.
  - id: F4
    kind: situation
    status: confirmed
    fact: DIA is forming an Intelligence Working Group on Continuity of Intelligence Planning and will provide its chair.
  - id: F5
    kind: situation
    status: confirmed
    fact: The working group is intended to assist in preparing a Defense military intelligence plan for continuity of operations.
  - id: F6
    kind: situation
    status: confirmed
    fact: The working group’s remit includes developing the intelligence functions to be performed by the Joint Staff, the
      services, and DIA at alternate emergency relocation centers.
  - id: F7
    kind: situation
    status: confirmed
    fact: The working group’s remit includes developing the duty titles required for those intelligence functions.
  considerations:
  - id: C1
    facts:
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Joint planning is preparation for DIA’s future role when fully operational, so the evolutionary period is a reason
      to begin planning rather than wait.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The planning requires coordination with the Joint Staff’s intelligence organizations and the military services; DIA
      is forming a working group and will chair it to support that joint effort.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: 'The working group has a defined planning purpose: assist with a Defense military intelligence continuity plan and
      develop the functions and duty titles needed for that plan.'
  reasoning:
    read: This is a preparatory decision during DIA’s transition, not a choice to wait until every part of the agency is operational.
      The trap is treating DIA’s evolutionary period as a reason to postpone the very joint planning needed for its future
      role.
    weighing: The decisive consideration is that joint planning must begin now in preparation for DIA’s role when fully operational
      {C1}. Coordination with the Joint Staff and services, through a DIA-chaired working group, gives that planning a joint
      structure {C2}; its defined planning remit supports beginning the work during the transition {C3}. The balance favors
      initiation; it would depend on whether DIA still needs to prepare for that future joint continuity role.
    tradecraft: Authorize the working group to begin the stated planning remit, identify its participants and responsibilities,
      and record the decision and its rationale. Keep the work focused on developing the joint plan, functions, and duty titles.
    uncertainty: The rationale establishes the need to start planning but provides no comparison of resource costs, a schedule,
      or criteria for judging when planning is complete.
    handoff: DIA leadership should initiate the work through its chaired working group and involve the Joint Staff’s intelligence
      organizations and the military services, whose participation is necessary for joint planning.
    tempting_wrong:
      option: O1
      pull: Waiting until DIA is fully operational may seem to avoid planning before the agency’s future role is settled.
      why_wrong: The stated reason for acting during the evolutionary period is to prepare for that future role; deferral
        would postpone the joint planning the document says must begin now.
    rejected:
      O1: Deferral was not chosen because preparation for DIA’s future role calls for joint planning during the evolutionary
        period.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: DIA no longer needed to prepare for a future role in joint continuity planning.
      then: O1
      why: Without that future role to prepare for, the stated rationale for initiating planning during the evolutionary period
        would no longer apply.
    would_not_change:
    - id: noflip1
      if: The specific duty titles had not yet been settled.
      why: Developing the duty titles is itself part of the working group’s remit, so their being unsettled would not by itself
        justify deferring the joint planning.
    watch_for:
    - id: watch1
      what: Whether the Joint Staff’s intelligence organizations and the military services are participating in the planning.
      favors:
      - O2
      why: Their involvement is central to the joint planning DIA is undertaking.
  lesson: When an agency is preparing for a future role that depends on coordination with other organizations, begin joint
    planning during the transition if that preparation is needed for the role. A defined planning remit can make early coordination
    useful rather than premature.
  limits: This reasoning concerns the timing of continuity planning during DIA’s evolutionary period. It does not resolve
    the details of relocation arrangements or apply where there is no future joint continuity role to prepare for.
  library:
    domain: operational-command
    family: CORPUS-NX-0d2a0199
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-32.pdf
    episode_focus: The decision point is whether to initiate joint planning during DIA’s transition or defer it until the
      agency is fully operational. The document gives the rationale of preparing for DIA’s future role and identifies the
      group’s planning remit; exclude the operational and logistical details of relocation procedures.
    cues:
      option_words:
        O1: 18
        O2: 17
      real_option: O2
      real_to_mean_other_length: 0.94
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
