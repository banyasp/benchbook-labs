case:
  id: DR-OGE-2635-702-revise2@v1
  title: Commerce Employee’s Request to Expedite Friend’s Export License [revise]
  status: needs_review
  setting: Department of Commerce, staff meeting, present
  decider: the employee
  agent: Ethics Assistant AI
  agent_role: advise
  situation: At a department-level staff meeting of the Department of Commerce, an employee was approached by a personal friend
    who owned a firm awaiting an export license. The friend asked the employee to find out why the license had not yet been
    granted and to try to speed up its approval. The employee raised the delay as an official matter of inquiry during the
    meeting and asked that the license be expedited. The employee’s action involved invoking his government position to benefit
    the friend.
  question: What should the ethics assistant advise the employee to do about the request to expedite the friend’s export license?
  options:
    O1:
      do: The ethics assistant prohibits the employee’s conduct as a violation of the ethics regulation.
      move: act
      irreversible: true
    O2:
      do: The ethics assistant permits the employee’s conduct as consistent with the ethics regulation.
      move: act
      irreversible: true
    O3:
      do: The ethics assistant defers the determination pending review by the agency’s legal counsel.
      move: hold
      irreversible: false
    O4:
      do: The ethics assistant requests additional information about the employee’s authority before making a determination.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The employee works for the Department of Commerce.
  - id: F2
    kind: situation
    status: confirmed
    fact: A personal friend asked the employee to determine why another office within the Department of Commerce had not yet
      granted an export license to the friend’s firm.
  - id: F3
    kind: situation
    status: confirmed
    fact: During a department-level staff meeting, the employee raised the delay in approval of the particular license and
      asked that the license be expedited.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee used his public office to attempt to benefit the friend.
  - id: F5
    kind: authority
    status: confirmed
    fact: Paragraph (a) of 2635.702 prohibits employees from using their government position to coerce or induce another person
      to provide any benefit to the employee or to friends, relatives, or persons with whom the employee is affiliated in
      a nongovernmental capacity.
  - id: F6
    kind: authority
    status: confirmed
    fact: Example 1 to paragraph (a) shows a violation when an employee invokes official authority to influence action to
      benefit a relative.
  - id: F7
    kind: authority
    status: confirmed
    fact: The employee’s conduct may also have violated 18 U.S.C. 205.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Paragraph (a) of 2635.702 expressly prohibits using a government position to induce a benefit for a friend, and Example
      1 shows a similar violation.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The employee’s conduct directly uses public office for private gain, which the regulation bars.
  - id: C3
    facts:
    - F7
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: The action may also violate 18 U.S.C. 205, adding a criminal dimension to the ethics breach.
  - id: C4
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: The decisive issue is whether the employee possessed authorized authority to intervene; without that clarification
      the assistant cannot label the conduct prohibited or permissible.
  reasoning:
    read: An employee of the Department of Commerce raised a friend's export-license delay at a staff meeting and asked for
      expedited processing, using his official position to benefit the friend.
    weighing: Although §2635.702(a) and its example suggest a violation, the record lacks any evidence that the employee had
      delegated authority to act on export-license matters. The assistant therefore places higher weight on the need for factual
      clarification before reaching a substantive conclusion.
    tradecraft: The assistant should ask the employee to provide any written delegation, supervisory guidance, or statutory
      mandate that authorizes him to intervene in export-license cases, and to describe the scope of that authority.
    uncertainty: Moderate, because the presence or absence of explicit authority changes the ethical assessment dramatically.
    handoff: After receiving the requested documentation, the employee should be directed to the agency's Office of General
      Counsel for a final legal determination.
    tempting_wrong:
      option: O1
      pull: The strong language of the ethics regulation makes an outright prohibition seem decisive.
      why_wrong: Prohibiting without first confirming the employee's authority may mischaracterize a permissible official
        action and undermines procedural fairness.
    rejected:
      O1: Prohibiting immediately ignores the unresolved question of authorized authority and risks an over-broad sanction.
      O2: Permitting would conflict with the clear prohibition in §2635.702(a) absent evidence of a lawful exemption.
      O3: Deferring to counsel without first gathering authority information adds unnecessary delay and does not address the
        core factual gap.
  verdict:
    choice: O4
    basis: recommended
    decisive:
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee's action were undertaken as part of a statutory mission to promote U.S. exports, with explicit authority
        to assist exporters.
      then: O1
      why: Even if a statutory mission exists, using personal influence for a private friend still creates a conflict of interest,
        so the assistant would prohibit the conduct.
    would_not_change:
    - id: noflip1
      if: The employee used official stationery or title but still acted to benefit a private friend.
      why: The prohibition in §2635.702(a) applies regardless of the medium used.
    watch_for:
    - id: watch1
      what: The employee provides a neutral status update without urging expedited action.
      favors:
      - O3
      why: A factual briefing without advocacy does not constitute coercion or inducement.
  lesson: When an employee's scope of authority is unclear, the ethics assistant should first seek clarification before issuing
    a definitive prohibition or permission.
  limits: The guidance applies only to situations where the employee's authority to act on export-license matters is not documented;
    once authority is confirmed, the standard ethics rules again determine permissibility.
