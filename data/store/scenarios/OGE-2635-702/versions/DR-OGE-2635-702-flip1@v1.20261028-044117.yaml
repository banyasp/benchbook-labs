case:
  id: DR-OGE-2635-702-flip1@v1
  title: Commerce Employee’s Request to Expedite Friend’s Export License [flip]
  status: needs_review
  setting: Commerce Department, quarterly staff briefing, present
  decider: the staff member
  agent: Automated Ethics Advisory System
  agent_role: advise
  situation: During a department-wide briefing, a staff member was approached by a personal acquaintance who runs a firm awaiting
    an export license. The acquaintance asked the staff member to discover why the license had not yet been granted and to
    try to accelerate its approval. Citing a departmental circular that authorizes staff to intervene when a domestic company's
    competitiveness is delayed, the staff member raised the licensing delay as an official agenda item and urged that the
    license be expedited, invoking his official role to aid the friend's firm.
  question: What should the ethics advisory system advise the staff member to do about the request to expedite the friend's
    export license?
  options:
    O1:
      do: The system advises that the conduct is prohibited under the ethics regulation.
      move: act
      irreversible: true
    O2:
      do: The system advises that the conduct is permissible because it aligns with the ethics regulation.
      move: act
      irreversible: true
    O3:
      do: The system defers the determination pending review by the agency's legal counsel.
      move: hold
      irreversible: false
    O4:
      do: The system requests additional clarification of the staff member's authority before deciding.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The staff member is employed by the Department of Commerce.
  - id: F2
    kind: situation
    status: confirmed
    fact: A personal acquaintance asked the staff member to find out why another Commerce office had not yet issued an export
      license to the acquaintance's company.
  - id: F3
    kind: authority
    status: confirmed
    fact: A Department of Commerce policy circular (Mar 2024) grants staff members the power to contact licensing officials
      directly when a domestic company's ability to compete overseas is being delayed.
  - id: F4
    kind: situation
    status: confirmed
    fact: During the quarterly staff briefing, the employee highlighted the licensing delay and asked that the license be
      accelerated.
  - id: F5
    kind: authority
    status: confirmed
    fact: The employee is assigned to the Office of Market Development, which operates under a congressional directive to
      expand the presence of American goods in foreign markets.
  - id: F6
    kind: situation
    status: confirmed
    fact: The employee used his official capacity to highlight a licensing bottleneck affecting a U.S. firm that is trying
      to sell its products abroad.
  - id: F7
    kind: authority
    status: confirmed
    fact: Section (a) of 5 C.F.R. §2635.702 bars employees from using their official position to coerce or induce any benefit
      for themselves, friends, relatives, or non-governmental affiliates.
  - id: F8
    kind: authority
    status: confirmed
    fact: Illustration 1 to paragraph (a) depicts a violation when an employee leverages official authority to influence an
      outcome for a relative.
  - id: F9
    kind: authority
    status: confirmed
    fact: The conduct might also run afoul of 18 U.S.C. 205 concerning false statements to the government.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The policy circular expressly permits staff to contact licensing officials to remedy delays that hinder U.S. exporters,
      matching the employee's action.
  - id: C2
    facts:
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The employee's office operates under a congressional directive to promote American goods abroad, which provides statutory
      authority to assist exporters.
  - id: C4
    facts:
    - F5
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Because the employee's role is part of a statutory export-promotion mission, the exception in §2635.702(c)(1) applies,
      negating the prohibition.
  reasoning:
    read: The staff member invoked his official capacity during a briefing to push for faster processing of a friend's export
      license, citing a departmental circular that authorizes such intervention when a domestic firm's competitiveness is
      at stake.
    weighing: Considerations {C1} and {C2} show that the employee's conduct is covered by an explicit policy and a congressional
      export-promotion directive, outweighing any generic prohibition in {C4}. No criminal violation applies because the action
      is within authorized authority.
    tradecraft: The ethics system should confirm that the request is permissible, document the advice, and remind the employee
      to frame any further actions strictly within the scope of the statutory mission.
    uncertainty: Low; the policy circular and statutory directive provide clear guidance.
    handoff: No further legal review is required unless new facts emerge; the determination stands as permissible.
    tempting_wrong:
      option: O1
      pull: Desire to avoid any appearance of impropriety by erring on the side of strict prohibition.
      why_wrong: Over-cautious prohibition would ignore the explicit authority granted by the circular and the congressional
        mandate.
    rejected:
      O1: Prohibiting the conduct disregards the specific authority granted by the policy circular and the statutory export-promotion
        mission.
      O3: Deferring adds unnecessary delay when the applicable policy already authorizes the action.
      O4: Requesting more information is redundant because the existing facts already demonstrate permissible authority.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: If the employee's request were made without any statutory export-promotion mandate or explicit authority to aid
        exporters,
      then: O1
      why: The prohibition in §2635.702(a) would then apply, rendering the conduct impermissible.
    would_not_change:
    - id: noflip1
      if: If the employee used official stationery or title but still acted solely to benefit a private friend,
      why: The blanket ban in §2635.702(a) remains applicable regardless of the medium employed.
    watch_for:
    - id: watch1
      what: The employee provides a neutral status update without urging expedited action,
      favors:
      - O3
      why: A factual briefing that lacks advocacy does not constitute coercion or inducement.
  lesson: Federal employees may act to assist exporters when a clear statutory mission or departmental policy authorizes such
    intervention. The ethics rule blocks the use of official position for private favors unless an explicit exemption applies.
  limits: The permission applies only when the employee is acting under a recognized export-promotion mandate or policy. It
    does not cover personal requests that lack such statutory or policy backing.
