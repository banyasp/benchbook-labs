case:
  id: DR-OGE-2635-702-2@v1
  title: Assistant Attorney General Book Jacket Endorsement Decision
  status: draft
  setting: Department of Justice, present day, internal ethics context
  decider: Assistant Attorney General
  agent: Assistant Attorney General
  agent_role: decide
  situation: The Assistant Attorney General admires a novel about organized crime. A publisher asks the official to provide
    a book jacket endorsement for the novel. The official considers whether to include their government title in the endorsement.
    The applicable ethics regulation prohibits employees from using their official position to endorse any product, service,
    or enterprise, except for limited statutory exceptions. The official has no statutory authority to promote the novel,
    nor does the endorsement qualify as compliance documentation or agency recognition. The decision must be made whether
    to use the official title in the endorsement.
  question: What should the Assistant Attorney General do regarding the use of their official title in the book jacket endorsement?
  options:
    O1:
      do: The Assistant Attorney General postpones the endorsement decision pending further review.
      move: hold
      irreversible: false
    O2:
      do: The Assistant Attorney General seeks clarification from the Office of General Counsel before deciding.
      move: ask
      irreversible: false
      to: Office of General Counsel
    O3:
      do: The Assistant Attorney General uses the official title in the book jacket endorsement.
      move: act
      irreversible: true
    O4:
      do: The Assistant Attorney General avoids using the official title in the book jacket endorsement.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Assistant Attorney General is a federal employee subject to 5 C.F.R. §2635.702(c).
  - id: F2
    kind: authority
    status: confirmed
    fact: 5 C.F.R. §2635.702(c) prohibits employees from using their government position to endorse any product, service,
      or enterprise, except as provided in subsections (1) and (2).
  - id: F3
    kind: capability
    status: confirmed
    fact: The regulation does not provide an exception for endorsing a novel about organized crime.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Assistant Attorney General has been asked to provide a book jacket endorsement for a novel they admire.
  - id: F5
    kind: authority
    status: confirmed
    fact: The official title of the employee is "Assistant Attorney General" and could be referenced in the endorsement.
  - id: F6
    kind: authority
    status: confirmed
    fact: Exceptions to the endorsement prohibition are (1) statutory authority to promote products, services, or enterprises,
      and (2) documentation of compliance or agency recognition.
  - id: F7
    kind: authority
    status: assessed
    fact: The Assistant Attorney General has no statutory authority to promote the novel.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: 5 C.F.R. §2635.702(c) expressly prohibits using a government position to endorse any product, service, or enterprise,
      and no exception applies to a novel.
  - id: C2
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The Assistant Attorney General lacks statutory authority to promote the novel, satisfying the first listed exception
      condition.
  - id: C3
    facts:
    - F5
    equity: oversight_candor
    favors:
    - O4
    weight: weak
    why: Even though the title could be referenced, doing so would create an appearance of governmental endorsement, contrary
      to the regulation’s purpose.
  - id: C4
    facts:
    - F4
    equity: duty_to_individual
    favors:
    - O4
    weight: weak
    why: The official’s personal admiration does not outweigh the duty to avoid misuse of official position.
  reasoning:
    read: The Assistant Attorney General is asked to endorse a novel and wonders whether to attach the official title. The
      trap is assuming personal admiration permits the use of government authority, which the regulation explicitly bars.
    weighing: The regulation’s blanket prohibition (C1) and the lack of statutory authority (C2) dominate the analysis. Appearance
      concerns (C3) and personal preference (C4) are secondary and do not overcome the binding rule.
    tradecraft: Draft the endorsement in a personal capacity, omit any reference to the official title or agency, and keep
      a copy for the official record showing compliance with 2635.702(c).
    uncertainty: Minimal; the rule is clear and no factual ambiguities exist.
    handoff: The decision can be made by the Assistant Attorney General alone; no higher approval is required because the
      rule is self‑executing.
    tempting_wrong:
      option: O3
      pull: Using the official title adds prestige and may increase the endorsement’s impact.
      why_wrong: It would violate the explicit prohibition in 2635.702(c) and create an appearance of governmental endorsement.
    rejected:
      O1: Delaying the decision is unnecessary because the rule is clear and immediate compliance is required.
      O2: Consultation is not needed; the regulation itself provides the answer.
      O3: Using the title is prohibited by the regulation’s core prohibition.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Statutory authority existed that specifically permitted the Assistant Attorney General to promote literary works.
      then: O3
      why: The first exception in §2635.702(c)(1) would be satisfied, allowing the use of the title.
    would_not_change:
    - id: noflip1
      if: The official’s personal admiration for the novel is the only factor.
      why: Personal admiration does not create a statutory or compliance‑documentation exception.
    watch_for:
    - id: watch1
      what: Any use of official agency seals or stationery in the endorsement.
      favors:
      - O3
      why: Such use would more clearly constitute an endorsement and trigger the prohibition.
  lesson: Federal employees must refrain from using their official title or agency symbols to endorse private products, services,
    or works unless a specific statutory exception applies. Personal admiration does not create an exception.
  limits: This rule applies only to endorsements that invoke the employee’s official position; it does not forbid expressing
    personal opinions about the novel without reference to the title. It also does not affect unrelated official duties.
