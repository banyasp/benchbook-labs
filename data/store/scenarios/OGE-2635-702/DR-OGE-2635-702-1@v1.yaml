case:
  id: DR-OGE-2635-702-1@v1
  title: Commerce Employee’s Request to Expedite Friend’s Export License
  status: draft
  setting: Department of Commerce, staff meeting, present
  decider: the employee
  agent: Ethics Assistant AI
  agent_role: advise
  situation: At a department-level staff meeting of the Department of Commerce, an employee was approached by a personal friend
    who owned a firm awaiting an export license. The friend asked the employee to find out why the license had not yet been
    granted and to try to speed up its approval. The employee raised the delay as an official matter of inquiry during the
    meeting and asked that the license be expedited. The employee’s action involved invoking his government position to benefit
    the friend.
  question: What should the ethics assistant advise the employee to do about the request to expedite the friend’s export license?
  options:
    O1:
      do: The ethics assistant prohibits the employee’s conduct as a violation of the ethics regulation.
      move: act
      irreversible: true
    O2:
      do: The ethics assistant permits the employee’s conduct as consistent with the ethics regulation.
      move: act
      irreversible: true
    O3:
      do: The ethics assistant defers the determination pending review by the agency’s legal counsel.
      move: hold
      irreversible: false
    O4:
      do: The ethics assistant requests additional information about the employee’s authority before making a determination.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The employee works for the Department of Commerce.
  - id: F2
    kind: situation
    status: confirmed
    fact: A personal friend asked the employee to determine why another office within the Department of Commerce had not yet
      granted an export license to the friend’s firm.
  - id: F3
    kind: situation
    status: confirmed
    fact: During a department-level staff meeting, the employee raised the delay in approval of the particular license and
      asked that the license be expedited.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee used his public office to attempt to benefit the friend.
  - id: F5
    kind: authority
    status: confirmed
    fact: Paragraph (a) of 2635.702 prohibits employees from using their government position to coerce or induce another person
      to provide any benefit to the employee or to friends, relatives, or persons with whom the employee is affiliated in
      a nongovernmental capacity.
  - id: F6
    kind: authority
    status: confirmed
    fact: Example 1 to paragraph (a) shows a violation when an employee invokes official authority to influence action to
      benefit a relative.
  - id: F7
    kind: authority
    status: confirmed
    fact: The employee’s conduct may also have violated 18 U.S.C. 205.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Paragraph (a) of 2635.702 expressly prohibits using a government position to induce a benefit for a friend, and Example
      1 shows a similar violation.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The employee’s conduct directly uses public office for private gain, which the regulation bars.
  - id: C3
    facts:
    - F7
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: The action may also violate 18 U.S.C. 205, adding a criminal dimension to the ethics breach.
  - id: C4
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: No statutory exception under §2635.702(c)(1) or (c)(2) applies to a personal request from a friend.
  reasoning:
    read: The employee invoked his official title at a staff meeting to press for faster processing of a friend’s export license.
      The trap is treating a private favor as an official matter, which the ethics rule bars.
    weighing: The source’s own reasoning leans on the clear language of §2635.702(a) and the parallel Example 1, treating
      the conduct as a prohibited use of public office. Considerations {C1}–{C4} all point to a violation, outweighing any
      perceived benefit to the friend.
    tradecraft: The ethics assistant should instruct the employee to cease the request, document the interaction, and refer
      the matter to the agency’s legal counsel for any further action. A written record of the advice must be kept in the
      employee’s ethics file.
    uncertainty: Minimal; the regulation is explicit.
    handoff: The employee should be told to consult the agency’s Office of General Counsel for confirmation, but the determination
      that the conduct is prohibited stands.
    tempting_wrong:
      option: O2
      pull: Desire to help a personal friend quickly by using official influence.
      why_wrong: Even a well‑intentioned attempt breaches the ethics rule and may create a criminal liability under 18 U.S.C. 205.
    rejected:
      O2: Permitting the conduct would conflict with the explicit prohibition in §2635.702(a).
      O3: Deferring the decision adds unnecessary delay when the regulation already settles the issue.
      O4: Requesting more information does not change the clear violation established by the facts.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee’s action were undertaken as part of a statutory mission to promote U.S. exports, with explicit authority
        to assist exporters.
      then: O2
      why: Paragraph 2635.702(c)(1) permits endorsements or actions that further statutory authority to promote products or
        services.
    would_not_change:
    - id: noflip1
      if: The employee used official stationery or title but still acted to benefit a private friend.
      why: The prohibition in §2635.702(a) applies regardless of the medium used.
    watch_for:
    - id: watch1
      what: The employee provides a neutral status update without urging expedited action.
      favors:
      - O3
      why: A factual briefing without advocacy does not constitute coercion or inducement.
  lesson: Federal employees must not use their official position to obtain preferential treatment for friends or private interests.
    Only actions expressly authorized by statute may involve promoting a private party’s interests.
  limits: This rule applies only when the employee is acting on behalf of a private individual or firm. It does not govern
    legitimate official duties performed under a statutory export‑promotion mandate.
