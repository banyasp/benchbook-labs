case:
  id: DR-OGE-2635-702-restyle1@v1
  title: Commerce Employee’s Request to Expedite Friend’s Export License [restyle]
  status: needs_review
  setting: Bureau of Trade, quarterly briefing, on-site
  decider: the staff analyst
  agent: Compliance Guidance Bot
  agent_role: advise
  situation: During a bureau-wide briefing, a colleague who runs a private firm awaiting an export authorization asked the
    analyst to find out why the permit had not yet been issued and to push for faster processing. The analyst raised the delay
    as a formal agenda item and urged that the license be accelerated, leveraging his official role to aid the colleague's
    company.
  question: What should the compliance guidance bot advise the analyst regarding the request to accelerate the colleague's
    export permit?
  options:
    O1:
      do: The compliance bot must declare the analyst's conduct prohibited by the ethics regulation.
      move: act
      irreversible: true
    O2:
      do: The compliance bot may deem the analyst's conduct permissible under the ethics regulation.
      move: act
      irreversible: true
    O3:
      do: The compliance bot should defer judgment until the bureau's legal counsel reviews the case.
      move: hold
      irreversible: false
    O4:
      do: The compliance bot should seek additional clarification of the analyst's authority before deciding.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The analyst is employed by the Bureau of Trade.
  - id: F2
    kind: situation
    status: confirmed
    fact: A personal acquaintance asked the analyst to determine why another division within the Bureau had not yet granted
      an export permit to the acquaintance's company.
  - id: F3
    kind: situation
    status: confirmed
    fact: During the bureau-wide briefing, the analyst highlighted the pending permit and requested that it be expedited.
  - id: F4
    kind: situation
    status: confirmed
    fact: The analyst employed his official position to try to benefit the acquaintance.
  - id: F5
    kind: authority
    status: confirmed
    fact: Paragraph (a) of 2635.702 bars employees from using their government role to coerce or induce any benefit for themselves,
      friends, relatives, or persons with whom they have a nongovernmental affiliation.
  - id: F6
    kind: authority
    status: confirmed
    fact: Example 1 to paragraph (a) illustrates a violation when an employee invokes official authority to influence action
      for a relative's advantage.
  - id: F7
    kind: authority
    status: confirmed
    fact: The analyst's behavior may also run afoul of 18 U.S.C. 205.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Paragraph (a) of 2635.702 expressly forbids using a government role to secure a benefit for a friend, and Example
      1 depicts an identical breach.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The analyst's act directly leverages public office for private advantage, which the regulation prohibits.
  - id: C3
    facts:
    - F7
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: The conduct could also contravene 18 U.S.C. 205, adding a criminal facet to the ethics infraction.
  - id: C4
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: No statutory carve-out under §2635.702(c)(1) or (c)(2) covers a personal request from a friend.
  reasoning:
    read: The analyst cited his official title at the briefing to press for quicker handling of a friend's export permit.
      The misstep lies in treating a private favor as an official matter, which the ethics rule expressly bars.
    weighing: The analysis leans heavily on the unambiguous language of §2635.702(a) and the analogous Example 1, classifying
      the behavior as a prohibited use of public office. Considerations {C1}–{C4} uniformly indicate a violation, outweighing
      any claimed benefit to the friend.
    tradecraft: The compliance bot should instruct the analyst to halt the request, record the interaction, and refer the
      issue to the bureau's legal office for any further steps. A written advisory note must be filed in the analyst's ethics
      record.
    uncertainty: Minimal; the regulation's terms are clear.
    handoff: The analyst should be directed to the bureau's Office of General Counsel for confirmation, though the determination
      that the conduct is prohibited remains firm.
    tempting_wrong:
      option: O2
      pull: Desire to assist a personal acquaintance swiftly by exploiting official influence.
      why_wrong: Even a well-meaning attempt breaches the ethics rule and may create criminal exposure under 18 U.S.C. 205.
    rejected:
      O2: Allowing the conduct would conflict with the explicit prohibition in §2635.702(a).
      O3: Deferring the decision introduces needless delay when the regulation already resolves the issue.
      O4: Seeking more information does not alter the clear violation established by the facts.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The analyst's action were undertaken as part of a statutory mission to promote U.S. exports, with explicit authority
        to assist exporters.
      then: O2
      why: Paragraph 2635.702(c)(1) permits endorsements or actions that further statutory authority to promote products or
        services.
    would_not_change:
    - id: noflip1
      if: The analyst used official stationery or title but still acted to benefit a private acquaintance.
      why: The prohibition in §2635.702(a) applies regardless of the medium employed.
    watch_for:
    - id: watch1
      what: The analyst provides a neutral status update without urging expedited action.
      favors:
      - O3
      why: A factual briefing without advocacy does not constitute coercion or inducement.
  lesson: Federal personnel must not exploit their official position to secure preferential treatment for friends or private
    interests. Only actions expressly authorized by statute may involve promoting a private party's interests.
  limits: This prohibition applies solely when the employee acts on behalf of a private individual or firm. It does not constrain
    legitimate official duties performed under a statutory export-promotion mandate.
