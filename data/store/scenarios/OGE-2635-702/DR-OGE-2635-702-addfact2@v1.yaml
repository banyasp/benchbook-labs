case:
  id: DR-OGE-2635-702-addfact2@v1
  title: Assistant Attorney General Book Jacket Endorsement Decision [addfact]
  status: needs_review
  setting: U.S. Department of Justice, contemporary internal ethics environment
  decider: The Assistant Attorney General
  agent: The Assistant Attorney General
  agent_role: decide
  situation: The Assistant Attorney General, a federal employee governed by 5 C.F.R. §2635.702(c) which bars officials from
    endorsing products, services, or enterprises except in limited cases, has been approached by the publisher of a novel
    about organized crime that the official finds compelling. The publisher asks for a jacket endorsement and notes that the
    official's title, "Assistant Attorney General," could be cited. The regulation supplies no exemption for literary endorsements,
    and the official lacks any statutory authority to promote the work. Although the publishing house that released the novel
    has previously been awarded a contract by the Department of Justice for a separate project, that fact does not create
    a permissible exception. The core question is whether to reference the official title in the endorsement.
  question: What course of action should the Assistant Attorney General take regarding the use of their official title in
    the requested book-jacket endorsement?
  options:
    O1:
      do: Delay the endorsement decision until a higher-level review is completed.
      move: hold
      irreversible: false
    O2:
      do: Seek guidance from the Office of General Counsel before proceeding.
      move: ask
      irreversible: false
      to: Office of General Counsel
    O3:
      do: Include the official title in the book-jacket endorsement.
      move: act
      irreversible: true
    O4:
      do: Exclude the official title from the endorsement.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: As a federal employee, the Assistant Attorney General falls under the provisions of 5 C.F.R. §2635.702(c).
  - id: F2
    kind: authority
    status: confirmed
    fact: Section 5 C.F.R. §2635.702(c) bars federal personnel from leveraging their official status to endorse any product,
      service, or enterprise, save for the narrow exceptions listed in subsections (1) and (2).
  - id: F3
    kind: situation
    status: assessed
    fact: The publishing house that released the novel has previously been awarded a contract by the Department of Justice
      for a separate project.
  - id: F4
    kind: capability
    status: confirmed
    fact: No exemption in the regulation covers endorsement of a novel dealing with organized crime.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Assistant Attorney General has received a request to write a jacket endorsement for a novel they find compelling.
  - id: F6
    kind: authority
    status: confirmed
    fact: The employee's official designation, "Assistant Attorney General," could be cited in the endorsement.
  - id: F7
    kind: authority
    status: confirmed
    fact: The only permissible exceptions are (1) a statutory mandate to promote a product, service, or enterprise, or (2)
      the need to document compliance or convey agency recognition.
  - id: F8
    kind: authority
    status: assessed
    fact: The Assistant Attorney General lacks any statutory authority to promote the novel.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: 5 C.F.R. §2635.702(c) expressly bars a federal official from using their position to endorse any product, service,
      or enterprise, and the regulation lists no exception for literary works.
  - id: C2
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The Assistant Attorney General has no statutory mandate to promote the novel, so the first exception in §2635.702(c)(1)
      is not satisfied.
  - id: C3
    facts:
    - F6
    equity: oversight_candor
    favors:
    - O4
    weight: weak
    why: Even though the title could be cited, doing so would create an appearance of governmental endorsement, contrary to
      the regulation's purpose.
  - id: C4
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O4
    weight: weak
    why: Personal admiration for the novel does not outweigh the duty to avoid misuse of official status.
  reasoning:
    read: The Assistant Attorney General has been asked to write a jacket endorsement for a novel and is wondering whether
      to attach the official title. The key issue is whether any exception in §2635.702(c) applies.
    weighing: The blanket prohibition (C1) and the lack of statutory authority (C2) dominate the analysis. The additional
      conflict-of-interest concern introduced by the publisher's prior contract (C5) further strengthens the case for omitting
      the title. Appearance concerns (C3) and personal admiration (C4) are secondary and do not overcome the binding rule.
    tradecraft: Draft the endorsement in a purely personal capacity, omit any reference to the official title or agency, and
      retain a copy for the official record to demonstrate compliance with §2635.702(c).
    uncertainty: Minimal; the regulatory language is clear and no factual ambiguities affect the outcome.
    handoff: The Assistant Attorney General may decide unilaterally, as the rule is self-executing and does not require higher-level
      approval.
    tempting_wrong:
      option: O3
      pull: Including the title would lend official weight to the endorsement and could boost the book's visibility.
      why_wrong: It would breach the explicit prohibition in §2635.702(c) and create an appearance of governmental endorsement,
        especially problematic given the publisher's prior DOJ contract.
    rejected:
      O1: Delaying the decision is unnecessary because the rule is clear and immediate compliance is required.
      O2: Consultation is not needed; the regulation itself provides the answer.
      O3: Using the title violates the core prohibition and raises conflict-of-interest concerns.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Statutory authority existed that specifically permitted the Assistant Attorney General to promote literary works.
      then: O3
      why: The first exception in §2635.702(c)(1) would be satisfied, allowing the use of the title.
    would_not_change:
    - id: noflip1
      if: The official's personal admiration for the novel is the only factor.
      why: Personal admiration does not create a statutory or compliance-documentation exception.
    watch_for:
    - id: watch1
      what: Any use of official agency seals or stationery in the endorsement.
      favors:
      - O3
      why: Such use would more clearly constitute an endorsement and trigger the prohibition.
  lesson: Federal employees must refrain from using their official title or agency symbols to endorse private works unless
    a specific statutory exception applies. Prior business relationships with the publisher heighten the need to avoid any
    appearance of favoritism.
  limits: The rule applies only to endorsements that invoke the employee's official position; it does not forbid expressing
    personal opinions about the novel without reference to the title, nor does it affect unrelated official duties.
