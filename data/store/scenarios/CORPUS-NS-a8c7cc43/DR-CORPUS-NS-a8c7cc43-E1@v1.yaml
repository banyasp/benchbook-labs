case:
  id: DR-CORPUS-NS-a8c7cc43-E1@v1
  title: School Use and Attack Approval
  status: draft
  setting: CJCSI 3160.01B, 11 December 2015; a military command decision under the Law of War.
  decider: The CCDR or authorized designee
  agent: The CCDR or authorized designee
  agent_role: decide
  situation: The school is an educational site and is being used for a military purpose. Educational sites may be non-strike
    entities, which are generally not lawful targets under normal circumstances. Such entities are protected from the effects
    of military operations. The school’s military use bears on whether it retains that protected status under the Law of War.
    The CCDR or authorized designee may approve an entity for attack when its status changes.
  question: What should the CCDR or authorized designee do about approving the school for attack?
  options:
    O1:
      do: The CCDR or authorized designee approves the school for attack.
      move: act
      irreversible: false
    O2:
      do: The CCDR or authorized designee rejects approval of the school for attack.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Educational sites may be non-strike entities.
  - id: F2
    kind: situation
    status: confirmed
    fact: Non-strike entities generally are not lawful targets under normal circumstances.
  - id: F3
    kind: situation
    status: confirmed
    fact: Non-strike entities are protected from the effects of military operations and have protected status.
  - id: F4
    kind: situation
    status: confirmed
    fact: The school is being used for a military purpose.
  - id: F5
    kind: situation
    status: confirmed
    fact: A school used for a military purpose, such as storing weapons, is an example of a non-strike entity whose protected
      status is forfeited under the Law of War.
  - id: F6
    kind: authority
    status: confirmed
    fact: When an entity’s status changes, the CCDR or authorized designee may approve it for attack.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: protected_sites
    favors:
    - O2
    weight: weak
    why: Educational sites may have protected status and generally are not lawful targets under normal circumstances, but
      that baseline applies subject to the stated military-use exception.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The school is being used for a military purpose; such use forfeits a school's protected status under the Law of War
      and makes it a lawful military target.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: When an entity's status changes, the CCDR or authorized designee may approve it for attack; this grants approval
      authority but does not require approval.
  reasoning:
    read: The school has an educational character, which ordinarily supports protected status, but the stipulated military
      use changes the legal-status analysis. The trap is treating the educational label as categorical protection, or treating
      the loss of protection as a requirement to attack.
    weighing: 'The ordinary protection of non-strike entities favors restraint {C1}, but the stated military use triggers
      the school example: protected status is forfeited and the school becomes a lawful military target {C2}. The CCDR or
      authorized designee may approve it for attack after that status change {C3}; approval is permitted but not mandatory.'
    tradecraft: Base any approval on the determination that the school is being used for a military purpose and that its protected
      status has changed; keep the decision within the CCDR's or authorized designee's authority and record that legal basis.
    uncertainty: The guidance gives the general rule and a school example, but does not specify how to establish the facts
      of military use or address other legal constraints that might apply. The stipulated facts resolve the military-use issue
      here, while approval remains discretionary.
    handoff: The CCDR or authorized designee is the identified decision-maker. No referral to another office or authority
      is specified.
    tempting_wrong:
      option: O2
      pull: Rejecting approval may seem appropriate because the school is an educational site and such sites generally have
        protected status.
      why_wrong: That relies on the ordinary rule while overlooking the stipulated military use and the express example that
        a school used for a military purpose forfeits protected status.
    rejected:
      O2: Rejecting approval was not chosen because the stated military use brings the school within the example of an entity
        whose protected status is forfeited and that becomes a lawful military target.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The school is not being used to advance military or enemy objectives and does not effectively contribute to their
        war-fighting or war-sustaining capability.
      then: O2
      why: Without the stated basis for loss of protected status, the ordinary protection of non-strike entities would favor
        rejecting approval.
    would_not_change:
    - id: noflip1
      if: The school remains an educational site while also being used for a military purpose.
      why: The educational character does not preserve protected status when the school is being used for a military purpose,
        as the school example makes clear.
    watch_for:
    - id: watch1
      what: Whether the school's use advances military or enemy objectives.
      favors:
      - O1
      why: That is the condition for loss of protected status; if it is not met, the basis for treating the school as a lawful
        military target may not apply.
  lesson: A site's ordinary protected status can change when it is used to advance military or enemy objectives. A change
    in status can make the entity a lawful military target and permit approval by the authorized decision-maker, but permission
    to approve is not a command to attack.
  limits: This reasoning applies to the stated military-purpose use and the general Law of War guidance. It does not resolve
    other legal requirements or operational decisions beyond whether the school retains protected status and whether approval
    may be given.
  library:
    domain: military-operational
    family: CORPUS-NS-a8c7cc43
    source: https://www.esd.whs.mil/Portals/54/Documents/FOID/Reading%20Room/Joint_Staff/16-F-0427_Damage_Estimate_Methodology.pdf
    episode_focus: 'The stated hypothetical presents a choice about attack approval when a school is being used for a military
      purpose: its protected status may be forfeited under the Law of War, and the commander or designee may approve it for
      attack. Focus on the legal status and authorization decision; exclude operational methods of attack.'
