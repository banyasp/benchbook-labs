case:
  id: DR-CORPUS-NX-a9ad0999-E1@v1
  title: Direct Police Training After a Statutory Bar
  status: draft
  setting: United States, after a 1973 statute, CIA policy concerning state and local police training.
  decider: The CIA
  agent: The CIA
  agent_role: decide
  situation: The CIA had conducted technical training for members of state and local police forces through the Law Enforcement
    Assistance Administration. A 1973 statute prohibited that practice. The issue is whether the CIA should also end direct
    provision of such training to local law enforcement agencies. The CIA interpreted the statute as evidence of congressional
    intent concerning direct training as well.
  question: What should the CIA do about direct technical training for state and local police after the 1973 statute?
  options:
    O1:
      do: The CIA stops direct technical training for state and local police and leaves that role to the FBI.
      move: act
      irreversible: false
    O2:
      do: The CIA continues direct technical training for state and local police and keeps that role itself.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The CIA had conducted some technical training.
  - id: F2
    kind: situation
    status: confirmed
    fact: Recipients included members of state and local police forces.
  - id: F3
    kind: situation
    status: confirmed
    fact: The training was conducted through the Law Enforcement Assistance Administration.
  - id: F4
    kind: authority
    status: confirmed
    fact: A 1973 statute prohibited this training practice.
  - id: F5
    kind: authority
    status: assessed
    fact: The CIA assessed the statute as evidence of congressional intent to end direct training for local law enforcement
      agencies as well.
  - id: F6
    kind: authority
    status: confirmed
    fact: The CIA's statutory responsibility included correlating and evaluating intelligence relating to national security.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The 1973 statute prohibited the training practice conducted through the Law Enforcement Assistance Administration.
      That prohibition makes the statutory boundary central to deciding whether the CIA should continue a related form of
      police training.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The CIA interpreted the statute as evidence that Congress intended to end direct training for local law enforcement
      as well, not merely the practice routed through the Assistance Administration.
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Commission approved the CIA's decision to leave state and local police training to the FBI, endorsing the CIA's
      reading of the statute for this decision.
  reasoning:
    read: The decision is not simply whether the CIA may share useful expertise with law enforcement. The specific issue is
      whether it should continue direct police training after a statute prohibited the prior training practice; the trap is
      treating the difference between training through the Assistance Administration and direct training as dispositive despite
      the CIA's broader reading of congressional intent.
    weighing: The statutory prohibition and the CIA's assessment that Congress also intended to end direct training favor
      O1. The Commission approved leaving that role to the FBI, so the source endorses stopping direct CIA training rather
      than preserving it through a different route. This balance depends on the CIA's interpretation of congressional intent,
      which the Commission approved.
    tradecraft: Record the statutory prohibition, the CIA's interpretation of its reach, and the decision to leave training
      to the FBI. Keep the decision limited to the training role and do not treat it as a general bar on sharing intelligence
      or expertise.
    uncertainty: The statute prohibited the training practice conducted through the Assistance Administration, while the CIA
      interpreted it as evidence of congressional intent to end direct training as well. No contrary interpretation is identified.
    handoff: The CIA makes the decision to stop direct training; the FBI is the institution to which the training role is
      left.
    tempting_wrong:
      option: O2
      pull: The statute is described as prohibiting training conducted through the Assistance Administration, which could
        suggest that direct training falls outside its reach.
      why_wrong: The CIA read the statute as evidence of congressional intent to end direct training too, and the Commission
        approved leaving that training to the FBI.
    rejected:
      O2: The CIA did not continue direct training because it interpreted the statute as reflecting congressional intent to
        end that role as well, an interpretation the Commission approved.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A controlling clarification established that Congress intended to prohibit only training through the Assistance
        Administration, and a separate authorized basis supported direct CIA training.
      then: O2
      why: That would remove the broader congressional-intent rationale approved by the Commission and provide a basis to
        reconsider direct training.
    would_not_change:
    - id: noflip1
      if: The CIA continues to evaluate or pass relevant intelligence to law enforcement agencies.
      why: Intelligence evaluation and information-sharing are distinct from the police-training decision; those activities
        alone do not resolve the statutory question about training.
    watch_for:
    - id: watch1
      what: A formal clarification of congressional intent concerning direct training, distinct from the training practice
        conducted through the Assistance Administration.
      favors:
      - O2
      - O1
      why: The decision rests on the CIA's interpretation that congressional intent extended to direct training, so clarification
        of that intent could confirm or undermine the basis for leaving the role to the FBI.
  lesson: When a statute prohibits a particular institutional practice, assess whether the responsible agency and reviewing
    authority understand its purpose to reach a closely related direct practice as well. Do not assume that changing the route
    of delivery avoids the policy boundary.
  limits: This reasoning concerns the CIA's police-training decision after the 1973 statute and the Commission's approval
    of the CIA's interpretation. It does not establish a general prohibition on sharing intelligence or technical expertise
    with law enforcement.
  library:
    domain: intel-oversight
    family: CORPUS-NX-a9ad0999
    source: https://www.aarclibrary.org/publib/church/rockcomm/pdf/RockComm_Chap6_Legal.pdf
    episode_focus: The decision point is the CIA’s choice about whether to provide police training after a 1973 statute prohibited
      the practice. The Commission says the CIA read the statute as evidence of congressional intent to end direct training
      as well and approves the decision to leave it to the FBI; exclude the content or techniques of the training itself.
