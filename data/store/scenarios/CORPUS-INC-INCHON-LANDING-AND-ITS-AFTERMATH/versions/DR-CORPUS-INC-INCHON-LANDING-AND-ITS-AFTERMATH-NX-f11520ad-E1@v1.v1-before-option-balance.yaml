case:
  id: DR-CORPUS-INC-INCHON-LANDING-AND-ITS-AFTERMATH-NX-f11520ad-E1@v1
  title: Choosing the Inchon Course of Action
  status: draft
  setting: Korean War; Inchon; Far East command
  decider: the Commander
  agent: the Commander
  agent_role: decide
  situation: The Commander was considering multiple courses of action guided by a campaign concept. The concept called for
    an amphibious landing of a two-division corps behind enemy lines, coordinated with an attack from the south by Eighth
    Army. The Inchon amphibious assault was assessed as the most strategically advantageous option and as involving the greatest
    operational risks. Less risky alternatives were available.
  question: What should the Commander do when choosing among the planned courses of action?
  options:
    O1:
      do: The Commander declines the Inchon COA and selects a less risky COA.
      move: act
      irreversible: false
    O2:
      do: The Commander accepts the Inchon COA and its associated operational risk.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The campaign concept called for an amphibious landing of a two-division corps behind enemy lines.
  - id: F2
    kind: situation
    status: confirmed
    fact: The landing was intended to envelop and destroy enemy forces.
  - id: F3
    kind: situation
    status: confirmed
    fact: The concept coordinated the landing with an attack from the south by Eighth Army.
  - id: F4
    kind: situation
    status: confirmed
    fact: The staff planned multiple courses of action guided by the campaign concept.
  - id: F5
    kind: situation
    status: assessed
    fact: The Inchon amphibious assault was assessed as the most strategically advantageous course of action.
  - id: F6
    kind: situation
    status: assessed
    fact: The Inchon amphibious assault was assessed as involving the greatest operational risks.
  - id: F7
    kind: situation
    status: confirmed
    fact: Less risky alternatives to the Inchon course of action were available.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Inchon was assessed as the most strategically advantageous course of action, supporting its selection in pursuit
      of the campaign's purpose.
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Inchon carried the greatest operational risks, while less risky alternatives were available; accepting it therefore
      meant accepting a significant operational hazard.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The courses of action were developed under a campaign concept aimed at enveloping and destroying enemy forces through
      a rear landing coordinated with Eighth Army's attack from the south.
  reasoning:
    read: The choice set the assessed strategic advantage of Inchon against its assessed status as the riskiest course, with
      less risky alternatives available. The trap is to treat the existence of risk as automatically disqualifying, or to
      treat strategic advantage as if it erased that risk.
    weighing: The Commander accepted the risk because Inchon was assessed as the most strategically advantageous option. The
      campaign concept supplied the purpose against which the courses were considered; the risk remained real, but did not
      outweigh that assessed advantage in the Commander's judgment. The balance depends on those comparative assessments,
      which the source does not further quantify.
    tradecraft: At the decision point, record the comparative basis for selecting Inchon and expressly acknowledge the associated
      operational risk; keep that decision rationale distinct from subsequent planning.
    uncertainty: The source does not specify the nature, likelihood, or consequences of the operational risks, or the relative
      advantages of the other courses. It supports the Commander's choice, but not a more detailed calculation of the balance.
    handoff: The Commander made the choice after staff planned multiple courses of action. The source does not identify a
      separate approval authority or describe a required handoff.
    tempting_wrong:
      option: O1
      pull: It avoids the course assessed to involve the greatest operational risks.
      why_wrong: The Commander accepted that risk because Inchon was assessed as the most strategically advantageous option;
        the source's judgment does not treat the availability of safer alternatives as decisive.
    rejected:
      O1: The Commander did not choose a less risky alternative because the assessed strategic advantage of Inchon justified
        accepting its associated operational risk.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Inchon were no longer assessed as the most strategically advantageous course of action.
      then: O1
      why: The source's stated reason for accepting Inchon's greater risk would no longer apply, making a less risky alternative
        more supportable.
    - id: flip2
      if: The risks associated with Inchon were assessed as outweighing its strategic advantage.
      then: O1
      why: The balance supporting acceptance would reverse in favor of a less risky course.
    would_not_change:
    - id: noflip1
      if: Less risky alternatives remained available.
      why: 'Their availability alone would not change the source''s outcome: less risky alternatives were available, yet the
        Commander accepted Inchon''s risk.'
    watch_for:
    - id: watch1
      what: Whether the assessments of Inchon's strategic advantage and operational risk remain valid and comparative.
      favors:
      - O1
      - O2
      why: Those assessments drive the balance; a change in either could change which course is better supported.
  lesson: A commander may accept substantial operational risk when the chosen course is assessed to offer the greatest strategic
    advantage in service of the campaign purpose. The risk must remain explicit in the comparison; safer alternatives do not
    by themselves settle the choice.
  limits: The source does not detail the risks, quantify the comparative advantages, or establish a legal rule governing the
    choice. This reasoning concerns the selection and acceptance of risk only, not subsequent operational planning or implementation.
  library:
    domain: operational-command
    family: CORPUS-INC-INCHON-LANDING-AND-ITS-AFTERMATH
    source: https://www.marines.mil/Portals/1/Publications/MCWP%205-10%20(SECURED).pdf
