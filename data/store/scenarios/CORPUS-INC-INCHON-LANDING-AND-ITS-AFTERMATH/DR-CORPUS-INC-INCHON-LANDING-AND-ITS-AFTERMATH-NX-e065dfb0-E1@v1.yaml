case:
  id: DR-CORPUS-INC-INCHON-LANDING-AND-ITS-AFTERMATH-NX-e065dfb0-E1@v1
  title: The Inchon Approval Decision
  status: draft
  setting: Inchon, western coast of South Korea, September 1950; United States and UN leadership.
  decider: The President and the Joint Chiefs
  agent: The President and the Joint Chiefs
  agent_role: decide
  situation: The choice is whether to approve a UN amphibious assault at Inchon or take the longer counteroffensive up the
    peninsula. The General who conceived the plan expected surprise to permit outflanking and trapping North Korean forces
    between UN forces to the north and south. The President and the Joint Chiefs regarded the plan as extremely risky. By
    September 6, North Korean communications indicated suspicion that UN forces planned an amphibious assault on South Korea's
    western coast. Communications over the following eight days indicated detection of possible UN plans involving western-coast
    ports. The September 10 U.S. bombing of Inchon heightened North Korean fears. North Korean forces made rapid preparations
    to defend Inchon.
  question: What should the President and the Joint Chiefs do about approving the Inchon assault versus pursuing the counteroffensive?
  options:
    O1:
      do: The President and the Joint Chiefs reject the Inchon assault and pursue the counteroffensive.
      move: act
      irreversible: false
    O2:
      do: The President and the Joint Chiefs approve the Inchon assault and forgo the counteroffensive.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision was between an assault at Inchon and a longer counteroffensive up the peninsula.
  - id: F2
    kind: capability
    status: assessed
    fact: The General who conceived the plan believed surprise could outflank North Korean forces.
  - id: F3
    kind: capability
    status: assessed
    fact: The General who conceived the plan believed the assault could trap North Korean forces between UN forces to the
      north and south.
  - id: F4
    kind: situation
    status: assessed
    fact: The President and the Joint Chiefs considered the plan extremely risky.
  - id: F5
    kind: intelligence
    status: assessed
    fact: By September 6, North Korean communications indicated suspicion of a planned UN amphibious assault on South Korea's
      western coast.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Communications over the following eight days indicated North Korean detection of possible UN plans involving western-coast
      ports.
  - id: F7
    kind: situation
    status: confirmed
    fact: The United States bombed Inchon on September 10.
  - id: F8
    kind: situation
    status: confirmed
    fact: North Korean forces made rapid preparations to defend Inchon.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The plan's stated rationale was that surprise could outflank and trap North Korean forces, advancing the mission
      without a long counteroffensive.
  - id: C2
    facts:
    - F1
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: MacArthur's comparison favored the assault over the alternative he described as a longer, bloodier counteroffensive;
      avoiding that prospect weighed in favor of Inchon.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F7
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The leaders considered the plan extremely risky, and North Korean suspicions, the bombing, and rapid defensive preparations
      threatened the surprise on which the plan depended.
  reasoning:
    read: 'This was a choice between a risky assault whose advantage depended on surprise and a longer counteroffensive. The
      trap is to treat either the plan''s bold expected benefit or the adversary''s awareness as conclusive: the former was
      an expectation, while the latter raised risk but did not prevent approval.'
    weighing: The rationale for {O2} was that surprise could outflank and trap North Korean forces and avoid a longer, bloodier
      counteroffensive {C1} {C2}. The President and Joint Chiefs' serious risk concerns, reinforced by indications that the
      plan was suspected and Inchon was being defended, weighed for {O1} {C3}. The decision favored the expected operational
      advantage over the risk; the balance depended on whether the anticipated surprise and encirclement were judged achievable.
    tradecraft: The President and the Joint Chiefs should make the choice at the strategic level, state how the expected advantage
      compares with the identified risk, and record the assumptions behind approval. This does not determine how the assault
      should be carried out.
    uncertainty: The decision involved substantial risk and indications of North Korean suspicion, but the likelihood of success
      and the remaining prospect of surprise were not quantified.
    handoff: The President and the Joint Chiefs should decide together, as both regarded the plan as risky and approved the
      assault. No further approval authority is established here.
    tempting_wrong:
      option: O1
      pull: Rejecting the plan because it was extremely risky and the North Koreans appeared to suspect an attack.
      why_wrong: That gives the risk evidence decisive weight without accounting for the prospect of outflanking and trapping
        opposing forces or avoiding the longer, bloodier alternative.
    rejected:
      O1: The assault was approved because its anticipated surprise and operational advantage were judged worth the substantial
        risk compared with the longer, bloodier counteroffensive.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The decision-makers had concluded that North Korean preparations had eliminated the prospect of surprise and that
        the assault could no longer outflank or trap opposing forces.
      then: O1
      why: That would remove the central expected advantage cited for the assault while leaving its substantial risk.
    - id: flip2
      if: The counteroffensive were not expected to be longer or bloodier, and the assault still carried the stated substantial
        risk.
      then: O1
      why: The reasons favoring the assault would be materially weaker, making rejection more appropriate on this balance.
    would_not_change:
    - id: noflip1
      if: There were indications of North Korean suspicion, but decision-makers still judged the plan's expected advantage
        worth the risk.
      why: Approval despite the suspicions and preparations shows that those indications alone did not determine the outcome.
    watch_for:
    - id: watch1
      what: Evidence that North Korean defensive preparations had substantially reduced the prospect of surprise.
      favors:
      - O1
      why: The plan's stated advantage depended on surprise, and evidence that it was lost would weaken the case for approval.
  lesson: A high-risk option may be justified when its expected mission advantage is substantial and the alternative carries
    serious costs. But where that advantage depends on surprise, indications that the adversary anticipates the action must
    be weighed directly against the plan's rationale, not dismissed or treated as automatically conclusive.
  limits: This reasoning concerns the strategic choice between the Inchon assault and the counteroffensive; it does not establish
    legal authority, a legal standard, or operational directions. It should not be generalized to decisions where the expected
    benefits, alternatives, or risks differ materially.
