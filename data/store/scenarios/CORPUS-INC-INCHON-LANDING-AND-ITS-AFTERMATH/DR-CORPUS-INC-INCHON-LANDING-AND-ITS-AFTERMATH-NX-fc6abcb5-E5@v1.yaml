case:
  id: DR-CORPUS-INC-INCHON-LANDING-AND-ITS-AFTERMATH-NX-fc6abcb5-E5@v1
  title: Soviet Response to the Changed Korean Situation
  status: draft
  setting: North Korea, after the UN landing at Inchon; Soviet policy decision-making.
  decider: The USSR leadership
  agent: The USSR leadership
  agent_role: decide
  situation: The UN landing at Inchon has rapidly changed the military outlook in South Korea, bringing decisions about North
    Korea's future closer. North Korean forces are assessed as unable to hold South Korea with the forces presently available.
    The USSR has sought to localize the conflict and disassociate itself from North Korean action and UN action. Military
    intervention could undermine that posture and carries a risk of escalation to general war. Direct Soviet negotiations
    would also challenge its prior position, while its bargaining position is assessed as weak; it could instead encourage
    North Korea or a third party to seek a settlement.
  question: What should the USSR leadership do in choosing whether to abstain from military intervention, intervene, or pursue
    a diplomatic settlement?
  options:
    O1:
      do: The USSR pursues direct negotiations for a diplomatic settlement of the Korean conflict.
      move: act
      irreversible: false
    O2:
      do: The USSR abstains from military intervention in North Korea for now.
      move: act
      irreversible: false
    O3:
      do: The USSR encourages North Korea or a third party to negotiate settlement.
      move: act
      irreversible: false
    O4:
      do: The USSR commits Chinese or Soviet troops to North Korea.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The UN landing at Inchon rapidly changed the military outlook in South Korea and brought decisions about North Korea's
      future closer.
  - id: F2
    kind: intelligence
    status: assessed
    fact: With presently available forces, North Korean forces were assessed as unable to hold South Korea.
  - id: F3
    kind: situation
    status: confirmed
    fact: Since the invasion began, the USSR has sought to localize the conflict and disassociate itself from North Korean
      action and UN action.
  - id: F4
    kind: situation
    status: assessed
    fact: Committing non-Korean troops would require the USSR to disavow its prior position and would undermine its effort
      to localize the conflict.
  - id: F5
    kind: situation
    status: assessed
    fact: A Soviet diplomatic settlement effort would require the USSR to accept the legality of UN action in Korea.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The USSR was unwilling to substantially increase the risk of global war and assessed that employing Soviet or Chinese
      Communist troops in Korea would carry such a risk.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The USSR's bargaining position was assessed as weak, with extremely limited prospects for a settlement favorable
      to the USSR.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The USSR might encourage North Korea or a third party to seek a settlement, but North Korea's weak position would
      leave settlement terms largely in UN hands.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O3
    - O2
    weight: strong
    why: The USSR had sought to localize the conflict and distance itself from both sides' actions. Committing non-Korean
      troops would disavow that position and undermine it; avoiding direct intervention, including any settlement effort led
      by others, better preserves it.
  - id: C2
    facts:
    - F6
    equity: escalation_control
    favors:
    - O1
    - O3
    - O2
    weight: strong
    why: The USSR was unwilling to substantially increase the risk of global war and assessed that using Soviet or Chinese
      Communist troops in Korea would create that risk. This weighs heavily against O4.
  - id: C3
    facts:
    - F5
    - F7
    equity: institutional_credibility
    favors:
    - O3
    - O2
    weight: strong
    why: Direct Soviet negotiations would require accepting the legality of UN action, contrary to the USSR's prior position.
      The USSR also had a weak bargaining position and extremely limited prospects for a settlement favorable to it.
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Encouraging North Korea or a third party to seek settlement remained possible, but North Korea's weak position meant
      settlement terms would likely be largely in UN hands; this offered little prospect of a favorable outcome.
  reasoning:
    read: The landing at Inchon sharply worsened North Korea's military outlook, so the USSR faced a choice about whether
      to accept that outcome, intervene, or seek a settlement. The trap is that intervention might appear to avert a Communist
      defeat, but would undermine the USSR's effort to remain disassociated from the conflict and risk escalation; direct
      Soviet diplomacy would also abandon its prior position while approaching negotiations from weakness.
    weighing: 'The assessment''s balance favors nonintervention: the political cost of disavowing the USSR''s prior stance
      and the danger of general war outweigh the prospect of preventing North Korea''s likely military defeat. Direct Soviet
      diplomacy is unattractive because it would require accepting the legality of UN action and the USSR lacks bargaining
      leverage. Indirect settlement efforts remain possible, but North Korea''s weak position limits their likely value. The
      judgment depends especially on the USSR continuing to avoid a substantial increase in general-war risk and having no
      stronger diplomatic position than assessed.'
    tradecraft: Record the choice as a policy judgment, its assessed risks, and the conditions that would warrant reconsideration;
      distinguish the decision to abstain from any separate decision about encouraging settlement.
    uncertainty: The assessment identifies nonintervention as the most likely Soviet course, not as a binding requirement.
      The military and diplomatic outlook, and the USSR's tolerance for escalation risk, could change.
    handoff: The USSR leadership should make the policy choice, with updated military-risk and diplomatic assessments informing
      it; the decision concerns the USSR's political posture and tolerance for escalation.
    tempting_wrong:
      option: O4
      pull: Intervention could seem like the way to avoid accepting North Korea's likely defeat.
      why_wrong: The assessment judges that using Soviet or Chinese Communist troops would risk general war and undermine
        the USSR's effort to localize the conflict; it considers those costs compelling reasons to refrain even at the expense
        of a Communist military defeat in North Korea.
    rejected:
      O1: Direct Soviet negotiations were not favored because they would require accepting the legality of UN action and would
        begin from a very weak bargaining position.
      O3: Encouraging North Korea or a third party to seek settlement remained possible, but North Korea's weak position meant
        settlement terms would likely be largely in UN hands.
      O4: Committing Chinese or Soviet troops would disavow the USSR's prior posture and carry a risk of escalation to general
        war.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The USSR became willing to accept the legality of UN action and its bargaining position materially improved.
      then: O1
      why: Those changes would reduce the stated political and diplomatic disadvantages of direct negotiations.
    - id: flip2
      if: The USSR no longer assessed troop commitment as creating a substantial risk of general war and was willing to disavow
        its prior posture.
      then: O4
      why: The assessment's strongest reasons against intervention would then be materially reduced.
    would_not_change:
    - id: noflip1
      if: North Korea remained at risk of military defeat.
      why: The assessment treats avoiding general war as compelling even at the expense of a Communist military defeat in
        North Korea.
    watch_for:
    - id: watch1
      what: A material change in the USSR's bargaining position or in the perceived risk of general war.
      favors:
      - O1
      - O4
      why: The assessment's objections to direct negotiations and intervention depend on weak leverage and the danger of escalation.
  lesson: When intervention risks abandoning a deliberately maintained political posture and escalating to general war, a
    likely setback for a partner need not justify intervention. Reassess if the escalation risk or the diplomatic balance
    changes materially.
  limits: This judgment is tied to the assessed military outlook, the USSR's stated effort to localize the conflict, its weak
    bargaining position, and its unwillingness to substantially increase the risk of global war. It does not establish a general
    rule for other conflicts or later circumstances.
