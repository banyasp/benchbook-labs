    domain: intel-analysis
    family: CORPUS-INC-INCHON-LANDING-AND-ITS-AFTERMATH
    source: https://www.cia.gov/resources/csi/static/70aeb9e53919186ea84279880ddb7f5c/5563bod4-EarlyColdWarDocuments.pdf
