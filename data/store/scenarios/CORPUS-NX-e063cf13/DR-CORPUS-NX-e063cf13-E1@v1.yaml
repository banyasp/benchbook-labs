case:
  id: DR-CORPUS-NX-e063cf13-E1@v1
  title: Wartime Communications Restrictions at Key West
  status: draft
  setting: Key West, wartime, military and international telegraph office.
  decider: The President
  agent: The President
  agent_role: decide
  situation: During wartime, the President sought advice about which cable-cutting actions international law allowed. The
    Attorney General lacked particular expertise in this area, and the signals expert identified limits on where cables could
    lawfully be cut. Spain owned no international undersea cables, so any cable-cutting would have to occur close to Spanish
    territory and potentially within range of Spanish gunfire. Virtually all Spanish communications with Cuba passed through
    Key West. A proposed restriction there would block official Spanish government messages while allowing commercial and
    neutral traffic, and was presented as an extension of the wartime blockade concept.
  question: What should the President do about official Spanish government messages and other international cable traffic
    passing through Key West during wartime?
  options:
    O1:
      do: The President permits official Spanish government messages to pass through Key West and permits commercial and neutral
        traffic.
      move: act
      irreversible: false
    O2:
      do: The President prohibits official Spanish government messages from passing through Key West and permits commercial
        and neutral traffic.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The President sought advice on which cable-cutting actions were acceptable under international law in wartime.
  - id: F2
    kind: situation
    status: assessed
    fact: The Attorney General had no particular expertise in this area of international law.
  - id: F3
    kind: authority
    status: assessed
    fact: The signals expert identified cutting Spanish-owned cables wherever found, or any cables within Spain's 12-mile
      territorial waters, as acceptable actions.
  - id: F4
    kind: situation
    status: assessed
    fact: Spain owned no international undersea cables, so any cable-cutting would have to occur close to Spanish territory
      and potentially within range of Spanish gunfire.
  - id: F5
    kind: situation
    status: confirmed
    fact: Virtually all Spanish communications with Cuba passed through a chokepoint at Key West.
  - id: F6
    kind: capability
    status: confirmed
    fact: A proposed restriction at Key West would block official messages to and from the Spanish government while allowing
      commercial and neutral messages through.
  - id: F7
    kind: authority
    status: assessed
    fact: The proposal was presented as depriving the Spanish government of the strategic benefit of its communications while
      extending the wartime blockade concept, described as allowable, to communications and adhering to international law.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The identified lawful grounds for cutting cables were limited, and Spain owned no international undersea cables,
      making any cutting likely to occur near Spanish territory and within range of Spanish gunfire. A restriction at Key
      West offered a way to deny official communications without relying on those cable cuts.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Because virtually all Spanish communications with Cuba passed through Key West, blocking official Spanish government
      messages there would deprive the Spanish government of the strategic benefit of its communications.
  - id: C3
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The proposal limited the restriction to official Spanish government messages, allowed commercial and neutral traffic
      through, and was presented as extending the allowable wartime blockade concept to communications while adhering to international
      law.
  reasoning:
    read: 'The decision is not simply whether to cut cables or leave communications untouched: nearly all Spanish communications
      with Cuba passed through Key West, where official Spanish government messages could be blocked while commercial and
      neutral traffic continued. The trap is treating cable cutting as the only means of denying strategic communications,
      despite the stated legal limits and the danger of cutting near Spanish territory.'
    weighing: The proposal advances the stated wartime aim of depriving the Spanish government of the strategic benefit of
      its communications while avoiding cable cuts that would have to occur close to Spanish territory. Its selective scope
      also preserves commercial and neutral traffic, and its stated legal rationale is the extension of the allowable blockade
      concept to communications. On those stated grounds, the President approved prohibiting official Spanish government messages
      while permitting other traffic.
    tradecraft: State the restriction's scope as official Spanish government messages and make clear that commercial and neutral
      traffic remains permitted. Record the decision's stated legal basis and its limits; seek legal advice on ambiguous applications
      rather than silently broadening the restriction.
    uncertainty: The stated rationale characterizes the communications restriction as adhering to international law, but does
      not provide a fuller legal analysis or address how ambiguous messages would be classified.
    handoff: The President decides. Because the Attorney General lacked particular expertise in this area, the decision should
      draw on specialized signals expertise as well as legal advice rather than relying on the Attorney General alone.
    tempting_wrong:
      option: O1
      pull: Allowing all traffic through avoids interfering with international communications.
      why_wrong: It would leave the Spanish government with the strategic benefit of its communications, whereas the stated
        aim was to deny that benefit while still allowing commercial and neutral traffic.
    rejected:
      O1: The President did not choose to permit official Spanish government messages because the proposed selective restriction
        would deny their strategic benefit while allowing commercial and neutral traffic.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The restriction could not distinguish official Spanish government messages from commercial and neutral traffic.
      then: O1
      why: The stated legal rationale depended on blocking official messages while allowing commercial and neutral traffic;
        losing that distinction would remove a central basis for the selective restriction.
    would_not_change:
    - id: noflip1
      if: Cable cutting remains the alternative and would have to occur near Spanish territory.
      why: That circumstance reinforces the stated appeal of the Key West restriction as an alternative to cable cutting;
        by itself it does not undermine the choice to block official messages selectively.
    watch_for:
    - id: watch1
      what: A legal assessment that the communications restriction does not qualify as an allowable wartime blockade measure.
      favors:
      - O1
      why: The proposal's stated claim of adhering to international law depends on extending the allowable wartime blockade
        concept to communications.
  lesson: When wartime communications restrictions are considered, assess whether a selective measure can deny the enemy government's
    strategic communications while preserving commercial and neutral traffic. State the legal basis and limit the restriction
    to the scope that basis supports.
  limits: This reasoning applies to the described wartime proposal and its stated blockade rationale; it does not establish
    a general rule that government communications may always be restricted. The account does not resolve legal questions beyond
    the proposal's characterization as adhering to international law.
