case:
  id: DR-CORPUS-NX-537b3e70-E5@v1
  title: Force After the Unacknowledged Ultimatum
  status: draft
  setting: Sarajevo, spring 1995, NATO and UN context
  decider: NATO decision-makers
  agent: NATO decision-makers
  agent_role: decide
  situation: In spring 1995, Sarajevo was again entirely cut off from vital supplies. Bosnian Serb forces were again firing
    heavily while violating a heavy-weapons exclusion-zone agreement established by the UN Security Council in February 1994.
    A UN ultimatum went unacknowledged. NATO decision-makers faced whether to use force in response to the renewed shelling
    and the ignored ultimatum.
  question: What should NATO decision-makers do about using force in response to the renewed shelling and the unacknowledged
    UN ultimatum?
  options:
    O1:
      do: NATO decision-makers prohibit the use of force in response to the renewed shelling.
      move: act
      irreversible: false
    O2:
      do: NATO decision-makers authorize the use of force in response to the renewed shelling.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The events occurred in the spring of 1995.
  - id: F2
    kind: situation
    status: confirmed
    fact: Sarajevo was again entirely cut off from vital supplies.
  - id: F3
    kind: situation
    status: confirmed
    fact: Bosnian Serb forces subjected Sarajevo to heavy fire.
  - id: F4
    kind: authority
    status: confirmed
    fact: The UN Security Council had established a heavy-weapons exclusion-zone agreement in February 1994.
  - id: F5
    kind: situation
    status: confirmed
    fact: Bosnian Serb forces were again violating the heavy-weapons exclusion-zone agreement.
  - id: F6
    kind: authority
    status: confirmed
    fact: A UN ultimatum went unacknowledged.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Sarajevo was cut off from vital supplies while under heavy fire, making the situation an acute threat to the inhabitants
      rather than a merely abstract dispute over compliance.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The renewed violation of the Security Council-established exclusion-zone agreement and the unacknowledged ultimatum
      support the source's recorded choice to use force in response.
  - id: C3
    facts:
    - F4
    - F6
    equity: lawful_authority
    favors: []
    weight: weak
    why: The Security Council framework and ultimatum are relevant authority context, but the passage does not establish that
      either alone supplied legal authority to use force.
  reasoning:
    read: This is a response to renewed heavy fire and a humanitarian emergency, alongside a breach of a Security Council-established
      arrangement and an ignored ultimatum. The trap is to treat the recorded decision to use force as resolving every legal
      question about authority or the law governing the subsequent air strikes; the passage raises those questions without
      answering them.
    weighing: The severe conditions in Sarajevo and the repeated breach and ignored ultimatum favor responding with force
      {C1} {C2}. The authority context matters, but the passage does not make it a conclusive legal basis {C3}. On the limited
      decision question, the source records NATO decision-makers choosing force; that choice should not be read as a finding
      that every later strike complied with IHL.
    tradecraft: Keep the decision to respond distinct from the legal review of particular operations. Confirm the applicable
      authority before acting, record the humanitarian and compliance circumstances supporting the decision, and separately
      assess the applicable law and conduct of any ensuing operations.
    uncertainty: The passage narrates NATO's response but does not expressly give a legal conclusion on the authority to use
      force. It also poses, rather than resolves, questions about IHL applicability, strike compliance, and the UN's treaty
      status.
    handoff: NATO decision-makers should involve their legal advisers and the relevant UN authority to clarify the basis for
      action; the excerpt does not resolve those authority questions.
    tempting_wrong:
      option: O1
      pull: Prohibiting force may seem the safer choice when the passage leaves the authority questions unresolved.
      why_wrong: It would leave the renewed heavy fire, cutoff of vital supplies, and ignored ultimatum unanswered, despite
        the source's recorded choice to respond.
    rejected:
      O1: The source's recorded response was to use force after renewed heavy fire, another violation of the exclusion-zone
        agreement, and an unacknowledged ultimatum.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The renewed heavy fire and the exclusion-zone violation were absent, and the ultimatum had not gone unacknowledged.
      then: O1
      why: The main circumstances supporting the source's recorded response would no longer be present.
    would_not_change:
    - id: noflip1
      if: A later strike damaged a water reservoir or caused injury to a pregnant woman.
      why: Those consequences would demand a separate assessment of the conduct and legality of the strikes; they would not
        alone resolve whether force should have been used in response to the earlier shelling and ultimatum.
    watch_for:
    - id: watch1
      what: Whether a competent authority establishes a legal basis for using force, distinct from the Security Council framework
        and ignored ultimatum described here.
      favors:
      - O1
      why: The passage raises authority and IHL questions but does not answer them; an adverse legal determination could change
        the decision.
  lesson: A grave humanitarian emergency, repeated breach of an established arrangement, and an ignored ultimatum can support
    a decision to respond with force. That decision does not itself settle the legal authority for force or the separate legality
    of subsequent operations.
  limits: This reasoning is limited to the choice whether to respond to the stated renewed shelling and ignored ultimatum.
    It does not determine the applicable IHL regime, the legality of any particular strike, or whether the UN is a party to
    the Conventions and Protocols.
