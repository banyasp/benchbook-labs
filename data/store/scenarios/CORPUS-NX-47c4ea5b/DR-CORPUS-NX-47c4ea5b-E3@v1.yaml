case:
  id: DR-CORPUS-NX-47c4ea5b-E3@v1
  title: Choosing Between Negotiation and Rescue
  status: draft
  setting: Sierra Leone, after two weeks of the hostage crisis; British government in London.
  decider: London
  agent: London
  agent_role: decide
  situation: Seven soldiers remained captive in Sierra Leone. London had preferred negotiation, while British media demanded
    an immediate rescue amid criticism of government policy. The captors' demands were frequently changing, and negotiators
    warned that the captors were becoming increasingly volatile. The remaining hostages were suffering severe abuse, and negotiators
    feared they might be killed. Military authorities had begun contingency planning and had incorporated personnel into a
    recovery plan. A rescue attempt carried a risk of failure that could have disastrous consequences for the hostages and
    damage the government and British forces.
  question: What should London do about the seven remaining hostages in Sierra Leone?
  options:
    O1:
      do: The British government in London authorizes a rescue attempt to recover the seven remaining hostages.
      move: act
      irreversible: true
    O2:
      do: The British government in London declines a rescue attempt and continues negotiations over the seven remaining hostages.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Seven hostages remained in captivity.
  - id: F2
    kind: situation
    status: confirmed
    fact: London preferred to negotiate the soldiers' return.
  - id: F3
    kind: situation
    status: confirmed
    fact: British media demanded an immediate rescue amid criticism of the government's Sierra Leone policy.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The captors made unrealistic and frequently changing demands.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Negotiators warned that the captors were growing increasingly volatile and feared the remaining hostages might be
      killed.
  - id: F6
    kind: situation
    status: confirmed
    fact: The remaining hostages were suffering terrible abuse.
  - id: F7
    kind: capability
    status: confirmed
    fact: Military authorities had begun contingency planning and incorporated personnel into a personnel recovery plan.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Rescue failure could embarrass the government and British forces in Sierra Leone and could be disastrous for the
      hostages.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: After two weeks, the captors' shifting demands and increasing volatility made release through negotiation unlikely,
      while the remaining hostages were being severely abused and feared at risk of death. London judged them to be in grave
      danger.
  - id: C2
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: A failed rescue could have been disastrous for the hostages and could have embarrassed London and British forces
      in Sierra Leone.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Military authorities had begun contingency planning and incorporated personnel into a recovery plan, supporting the
      availability of a prepared alternative as negotiations ceased to offer a path to release.
  reasoning:
    read: 'The decision was whether to persist with a preferred negotiating course that London judged would not secure release,
      or accept the risks of rescue while the seven hostages faced grave danger. The trap is to treat media pressure as the
      decisive reason: the stated basis for changing course was the worsening hostage situation and the judgment that negotiations
      would not succeed.'
    weighing: 'The risk of failure remained serious, including disastrous consequences for the hostages and damage to the
      government and British forces. But negotiations were no longer expected to produce a release, and the hostages'' danger
      had become intolerable; a rescue attempt was therefore necessary. That balance depends on rescue preconditions being
      met: political willingness to accept risk, access, a precise hostage location, detailed intelligence, and tactical overmatch.'
    tradecraft: Record the basis for concluding that negotiations are no longer a viable route to release, the assessed danger
      to the hostages, the material risks of rescue, and the grounds for judging a rescue option viable. Keep the decision
      with London and avoid allowing public pressure to substitute for that assessment.
    uncertainty: The captors' volatility and the danger to the hostages were assessments, and rescue failure could have had
      grave consequences. Hostage cases are unique, and rescue is not always viable.
    handoff: London should decide, informed by the negotiators' assessment of the captors and the military authorities' assessment
      of whether a rescue option is viable. London holds the policy decision, with both groups informing it.
    tempting_wrong:
      option: O2
      pull: Continuing negotiations avoids immediately accepting the potentially disastrous risks of a rescue.
      why_wrong: London had judged that negotiations would not lead to release, while the remaining hostages were in grave
        danger; preserving the preferred course would not address that worsening threat.
    rejected:
      O2: London did not continue negotiations because it judged that they would not secure release and that the remaining
        hostages were in grave danger.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The conditions needed to make a rescue viable were absent, such as access, a precise hostage location, adequate
        intelligence, or tactical overmatch.
      then: O2
      why: Rescue is not always viable; access, a precise hostage location, adequate intelligence, and tactical overmatch
        are among the necessary preconditions. Without them, the case for authorizing rescue would be substantially weaker.
    - id: flip2
      if: Negotiations still offered a credible prospect of release and the hostages were not facing grave danger.
      then: O2
      why: The reasons for abandoning negotiation were that it would not secure release and the hostages were in grave danger.
    would_not_change:
    - id: noflip1
      if: British media continued to demand an immediate rescue and criticize government policy.
      why: Public pressure alone is not the basis for the decision; the shift rests on the failure of negotiations and the
        grave danger to the hostages.
    watch_for:
    - id: watch1
      what: Negotiators' assessment that captors are growing more volatile and the remaining hostages may be killed.
      favors:
      - O1
      why: The worsening threat contributes to the judgment that a rescue attempt is necessary.
  lesson: When negotiation is judged unlikely to secure release and the people held captive face grave danger, the decision-maker
    may need to accept the risks of rescue rather than continue a failing course. That judgment depends on whether the conditions
    for a viable rescue are in place; public pressure is not a substitute for assessing those conditions and the risks.
  limits: This reasoning does not establish that rescue is always preferable to negotiation. It applies only where negotiations
    are judged unlikely to succeed, the hostages face grave danger, and the necessary preconditions for a rescue are present.
  library:
    domain: military-operational
    family: CORPUS-NX-47c4ea5b
    source: https://jsouapplicationstorage.blob.core.windows.net/press/467/Bk%2015%20-%20Force%20Multiplier.pdf
    episode_focus: The decision point is the shift from continued negotiation to a rescue attempt after negotiators judged
      that the captors would not release the hostages and the remaining captives faced grave danger. Keep the focus on the
      policy choice and the risks to hostages and rescuers; exclude the assault plan and other operational details.
    cues:
      option_words:
        O1: 15
        O2: 17
      real_option: O1
      real_to_mean_other_length: 0.88
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
    equities: pilot2
