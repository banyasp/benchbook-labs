case:
  id: DR-CORPUS-NX-b1d5b995-E2@v1
  title: Whether to Advance the Joint Committee Resolutions
  status: draft
  setting: House Rules Committee hearings, 1961, United States Congress
  decider: The House Rules Committee
  agent: The House Rules Committee
  agent_role: decide
  situation: The House Rules Committee held hearings to decide whether the joint committee resolutions should go to the House
    floor. Some members were concerned that expanding the circle of lawmakers informed about intelligence activities could
    affect security. Members of the House Armed Services CIA subcommittee testified against the resolutions. The subcommittee
    chair argued that congressional supervision of the CIA was already adequate, citing the Agency’s appearances before committees
    and its responses to questioning. One Rules Committee member was surprised to learn that Congress had four subcommittees
    for CIA affairs.
  question: What should the House Rules Committee do about sending the joint committee resolutions to the House floor?
  options:
    O1:
      do: The House Rules Committee sends the joint committee resolutions to the House floor.
      move: act
      irreversible: false
    O2:
      do: The House Rules Committee withholds the joint committee resolutions from the House floor.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: In 1961, the House Rules Committee held hearings to determine whether a joint committee resolution should be sent
      to the House floor.
  - id: F2
    kind: situation
    status: assessed
    fact: Some committee members expressed concern that enlarging the circle of lawmakers informed about intelligence activities
      could raise security issues.
  - id: F3
    kind: situation
    status: confirmed
    fact: Members of the House Armed Services CIA subcommittee testified against the resolutions.
  - id: F4
    kind: situation
    status: assessed
    fact: The chair of the CIA subcommittee argued that congressional supervision of the CIA was fully adequate.
  - id: F5
    kind: situation
    status: confirmed
    fact: The subcommittee chair cited 46 Agency appearances before various committees in 1959 and 1960.
  - id: F6
    kind: situation
    status: assessed
    fact: The subcommittee chair said the Agency had always responded fully and candidly to his subcommittee's questioning.
  - id: F7
    kind: situation
    status: confirmed
    fact: A Rules Committee member was surprised to learn that Congress had four subcommittees for CIA affairs.
  considerations:
  - id: C1
    facts:
    - F2
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: Some members worried that informing a larger circle of lawmakers about intelligence activities could create security
      risks, weighing against advancing the resolutions.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: oversight_candor
    favors:
    - O2
    weight: strong
    why: The CIA subcommittee chair argued that existing supervision was fully adequate, citing 46 Agency appearances in 1959
      and 1960 and responses he described as consistently full and candid.
  - id: C3
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Members of the House Armed Services CIA subcommittee testified against the resolutions, adding institutional opposition
      to sending them forward.
  reasoning:
    read: The Rules Committee was deciding whether to advance the joint committee resolutions, not whether Congress should
      have any oversight of the CIA. The central tension was whether broader congressional involvement was warranted despite
      security concerns and the chair's claim that existing supervision was adequate; the account does not establish that
      the Rules Committee expressly adopted every argument made at the hearings.
    weighing: The security concerns and the CIA subcommittee members' opposition favored withholding the resolutions. The
      chair's account of frequent appearances and full, candid responses supported the view that additional oversight was
      unnecessary. The Rules Committee let the resolutions wither on the vine, but the source does not specify the precise
      weight it assigned to each reason.
    tradecraft: Record the decision as withholding the resolutions and distinguish the committee's disposition from the hearing
      witnesses' arguments. Preserve the stated security concern and the chair's supporting evidence without treating either
      as a finding beyond what the account establishes.
    uncertainty: The account gives the outcome and the reasons raised in hearings, but does not detail the Rules Committee's
      deliberation or state that it formally adopted a particular rationale.
    handoff: The House Rules Committee was the decision-maker on whether to send the resolutions to the floor; the account
      identifies no required referral or separate approving authority.
    tempting_wrong:
      option: O1
      pull: Sending the resolutions forward could appear to provide broader or more formal congressional oversight.
      why_wrong: The reasons recorded against advancing them were that a larger circle raised security concerns and that the
        CIA subcommittee chair considered existing supervision adequate.
    rejected:
      O1: The committee did not send the resolutions to the floor, against the background of security concerns, subcommittee
        opposition, and the chair's argument that existing supervision was adequate.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The security concern about enlarging the circle of lawmakers were credibly resolved and the case for additional
        oversight were shown to outweigh the account of adequate existing supervision.
      then: O1
      why: That would weaken the stated reasons against advancing the resolutions and strengthen the case for sending them
        forward.
    - id: flip2
      if: Evidence showed that the Agency's appearances or responses did not in fact provide adequate congressional supervision.
      then: O1
      why: The chair's principal support for the view that no additional oversight was needed would no longer hold.
    would_not_change:
    - id: noflip1
      if: A member remained surprised that Congress had four CIA-affairs subcommittees, without further evidence about oversight
        adequacy or security risk.
      why: That surprise alone does not establish either that existing supervision failed or that advancing the resolutions
        was necessary.
    watch_for:
    - id: watch1
      what: Whether a larger circle of lawmakers would create a material security concern, and whether existing congressional
        supervision was adequate.
      favors:
      - O2
      why: Those were the principal considerations described in the hearing account.
  lesson: When a proposal would broaden access to sensitive intelligence, weigh the security concern against evidence about
    whether existing oversight is adequate. Attribute witness arguments to their speakers, and do not claim the deciding body
    adopted a specific rationale unless the record says so.
  limits: This reasoning applies to the recorded 1961 decision about sending these resolutions to the House floor. The account
    does not establish the actual security consequences of broader access, the full state of congressional oversight, or a
    general rule against expanding oversight.
