case:
  id: DR-CORPUS-NX-8140b19d-E2@v1
  title: CIG’s Independent Analytical Role
  status: draft
  setting: Spring 1946, United States, National Intelligence Authority and Central Intelligence Group
  decider: The National Intelligence Authority
  agent: The National Intelligence Authority
  agent_role: decide
  situation: In Spring 1946, the National Intelligence Authority was responsible for supervising the Director of Central Intelligence.
    The Central Intelligence Group’s analytical role was under consideration. Its existing role involved correlating departmental
    products, while independent research and analysis would extend beyond that function. The scope under consideration was
    work not then being performed by other departments and gaps in existing departmental analysis.
  question: What should the National Intelligence Authority do about the Central Intelligence Group’s analytical role in Spring
    1946?
  options:
    O1:
      do: The National Intelligence Authority authorizes the Central Intelligence Group to conduct independent analysis of
        work not then performed by other departments.
      move: act
      irreversible: false
    O2:
      do: The National Intelligence Authority declines to authorize the Central Intelligence Group to conduct independent
        analysis beyond correlating departmental products.
      move: act
      irreversible: false
    O3:
      do: The National Intelligence Authority asks the departments to identify analytical work not then performed before setting
        the Central Intelligence Group’s role.
      move: ask
      irreversible: false
      to: the departments
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The National Intelligence Authority comprised the Secretaries of State, War, and Navy and the President’s personal
      representative.
  - id: F2
    kind: authority
    status: confirmed
    fact: The National Intelligence Authority was to supervise the Director of Central Intelligence.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Central Intelligence Group’s existing analytical role included correlating departmental products.
  - id: F4
    kind: situation
    status: confirmed
    fact: Independent research and analysis would expand the Central Intelligence Group beyond correlating departmental products.
  - id: F5
    kind: situation
    status: confirmed
    fact: The National Intelligence Authority authorized the Central Intelligence Group in Spring 1946 to conduct independent
      research and analysis.
  - id: F6
    kind: situation
    status: confirmed
    fact: The authorized independent research and analysis was limited to work not presently performed by other departments.
  - id: F7
    kind: situation
    status: confirmed
    fact: The expansion addressed gaps in existing departmental analysis.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Independent analysis would let the Central Intelligence Group address gaps in departmental analysis rather than remain
      limited to correlating departmental products.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The authorization was expressly confined to research and analysis not then being performed by other departments,
      limiting the expansion to a defined scope.
  - id: C3
    facts:
    - F1
    - F2
    - F5
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The National Intelligence Authority was responsible for supervising the Director of Central Intelligence and itself
      authorized the expanded analytical role.
  reasoning:
    read: The issue was whether the Central Intelligence Group should do more than correlate departmental products. The relevant
      distinction was between duplicating work already done by departments and filling gaps in their analysis.
    weighing: The gap-filling purpose supports expanding the Group's analytical role, while the limit to work not then performed
      by other departments keeps that expansion bounded. The National Intelligence Authority's supervisory responsibility
      places the authorization with the body charged with overseeing the Director of Central Intelligence. The balance therefore
      supports {O1}, with the scope depending on whether the work is in fact unperformed elsewhere.
    tradecraft: Keep the authorization bounded to work not then performed by other departments, and note why each proposed
      analysis falls within that boundary.
    uncertainty: The record establishes the authorization and its scope but does not specify a process for determining which
      analytical gaps qualify or describe disagreement over the decision.
    handoff: The National Intelligence Authority decides in its supervisory role. It may consult the departments to clarify
      which work is already being performed; that consultation can inform application of the boundary without replacing the
      authorization.
    tempting_wrong:
      option: O3
      pull: Asking the departments first could appear to ensure that the Group does not duplicate their work.
      why_wrong: The authorization limits independent analysis to work not then performed by other departments, and the Authority
        chose to authorize that bounded role.
    rejected:
      O2: The Authority did not leave the Group confined to correlating products; it authorized independent analysis to address
        work not then performed by other departments.
      O3: The Authority authorized the bounded analytical role rather than making prior departmental identification a condition
        of setting that role.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed analytical work were already being performed by other departments.
      then: O2
      why: That would remove the basis for expanding the Group into the work at issue.
    - id: flip2
      if: The Authority could not determine which work was unperformed without further information from the departments.
      then: O3
      why: Deferring to identify the gaps would then be a practical way to apply the authorization's scope accurately.
    would_not_change:
    - id: noflip1
      if: Some departments performed related analysis, but not the particular work proposed for the Central Intelligence Group.
      why: Related departmental activity alone would not defeat authorization for work that remained unperformed.
    watch_for:
    - id: watch1
      what: Changes in which analytical work the departments are performing.
      favors:
      - O3
      why: Updated information could affect whether proposed work remains within the gap-filling boundary.
  lesson: An institution may expand its analytical role to address gaps in existing departmental work while keeping the mandate
    bounded to work not otherwise being performed. The responsible authority should make that scope explicit and apply it
    to the work under consideration.
  limits: This reasoning addresses only the authority's Spring 1946 decision to permit independent analysis within a defined
    gap-filling scope. It does not determine how the Group later carried out its work or assess the merits of particular analyses.
  library:
    domain: intel-oversight
    family: CORPUS-NX-8140b19d
    source: https://www.cia.gov/resources/csi/static/40fa6d788f8e20239a941fac309a9da5/Watching-the-Bear-1-Introduction-Overviews-Chapter1.pdf
    episode_focus: The decision expanded CIG beyond correlating departmental products, addressing gaps in existing departmental
      analysis. Exclude the subsequent details of clandestine collection and the creation of particular offices.
