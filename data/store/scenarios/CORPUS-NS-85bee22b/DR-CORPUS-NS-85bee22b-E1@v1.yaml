case:
  id: DR-CORPUS-NS-85bee22b-E1@v1
  title: Somalia Force-Posture Request
  status: draft
  setting: Somalia, September 1993; the Secretary of Defense.
  decider: The Secretary of Defense
  agent: The Secretary of Defense
  agent_role: decide
  situation: In September 1993, Task Force Ranger was operating in Somalia on a mission primarily focused on peacekeeping
    and peace enforcement. The force requested additional combined-arms systems. U.S. policy sought to reduce the military
    presence and profile in Somalia. Urban operations could escalate quickly, and the environment included violent efforts
    by warlords to hijack food and medical supplies. The decision concerns whether to provide the requested systems while
    weighing the force-posture aim against the demands of an urban mission.
  question: What should the Secretary of Defense do about Task Force Ranger's request for additional combined-arms systems
    in Somalia?
  options:
    O1:
      do: The Secretary of Defense withholds the requested combined-arms systems from Task Force Ranger.
      move: act
      irreversible: true
    O2:
      do: The Secretary of Defense provides the requested combined-arms systems to Task Force Ranger.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In September 1993, Task Force Ranger requested additional combined-arms systems for its mission in Somalia.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Somalia mission was primarily a peacekeeping and peace-enforcement operation.
  - id: F3
    kind: situation
    status: confirmed
    fact: U.S. policy sought to reduce the U.S. presence and lower its profile in Somalia.
  - id: F4
    kind: situation
    status: assessed
    fact: Urban operations of any kind can quickly escalate.
  - id: F5
    kind: capability
    status: assessed
    fact: Humanitarian-aid delivery may not require additional ground-protection systems.
  - id: F6
    kind: intelligence
    status: assessed
    fact: In Mogadishu, warlords used violent methods to hijack food and medical supplies.
  considerations:
  - id: C1
    facts:
    - F3
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The Secretary believed that deploying the requested systems conflicted with the stated U.S. aim of reducing its presence
      and profile in Somalia.
  - id: C2
    facts:
    - F2
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The mission was primarily peacekeeping and peace enforcement, and humanitarian-aid delivery may not require additional
      ground-protection systems. This is limited support for withholding, not a finding that the requested systems had no
      mission value.
  - id: C3
    facts:
    - F4
    - F6
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: Urban operations can escalate quickly, and warlords used violence to hijack food and medical supplies. These conditions
      weigh against relying on a low-profile posture alone.
  reasoning:
    read: This was a force-posture choice during an urban mission, not simply a choice about equipment for routine aid delivery.
      The tension is between the policy aim of reducing the U.S. presence and profile {F3} and the risks of operating in an
      urban setting where escalation and violent interference with aid were assessed as possible {F4} {F6}.
    weighing: 'The Secretary''s stated reason for withholding was that deploying the systems ran counter to the U.S. aim of
      reducing its presence and profile {C1}; the peacekeeping and humanitarian context offered limited support for that posture
      {C2}. The source also gives a contrary strategic lesson: forces deploying to urban areas should have the full complement
      of combined-arms systems, which underscores the risk side of the balance {C3}. The required choice is O1, but the source''s
      reasons do not erase that tension; the balance depends heavily on how much weight is placed on the low-profile policy
      aim relative to urban escalation risks.'
    tradecraft: Record the force-posture objective that supports withholding, the urban-risk concerns considered, and why
      the policy objective was given greater weight. Make clear that the decision is a policy judgment, not a finding that
      urban escalation or aid interference is unlikely.
    uncertainty: The source gives no detailed assessment of the likelihood or scale of escalation, nor a specific legal or
      operational standard for deciding whether the systems were necessary. Its general warning about urban operations therefore
      remains a material counterweight.
    handoff: The source identifies the Secretary of Defense as the decision-maker and gives no required referral or concurrence.
      The decision can be made at that level, while the conflicting force-posture and urban-risk considerations should be
      presented to the Secretary.
    tempting_wrong:
      option: O2
      pull: Providing the systems responds to the source's warning that urban operations can escalate and that aid supplies
        faced violent seizure.
      why_wrong: That risk is substantial, but the Secretary's stated decision gave priority to the U.S. policy aim of reducing
        its presence and profile. The source records a broader strategic lesson favoring urban force protection, so the choice
        remains in tension rather than being compelled by the risk assessment alone.
    rejected:
      O2: The Secretary did not provide the systems because he believed their deployment conflicted with the U.S. aim of reducing
        its presence and profile in Somalia.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The U.S. force-posture aim no longer required reducing the presence and profile in Somalia.
      then: O2
      why: The stated reason for withholding would lose force, leaving the assessed urban escalation and aid-interference
        risks to weigh more heavily.
    - id: flip2
      if: The decision-maker assessed that the urban mission's escalation and aid-interference risks outweighed the low-profile
        policy aim.
      then: O2
      why: The source's strategic lesson and its identified Mogadishu risks would then support providing the requested systems.
    would_not_change:
    - id: noflip1
      if: The mission remained primarily peacekeeping and peace enforcement, without a changed assessment of the force-posture
        objective or urban risks.
      why: That description alone does not displace the Secretary's stated reason for withholding or resolve the source's
        countervailing urban-risk concerns.
    watch_for:
    - id: watch1
      what: A stronger assessment that urban operations are likely to escalate, or that aid supplies are exposed to violent
        seizure.
      favors:
      - O2
      why: Either would increase the weight of the risks the source identifies against withholding the systems.
  lesson: A force-posture decision should weigh the policy aim of limiting presence and profile against the risks inherent
    in the operating environment. A low-profile objective does not remove the need to account for rapid urban escalation and
    threats to humanitarian access.
  limits: This reasoning addresses the Secretary's stated force-posture rationale in the Somalia scenario, not the legal authority
    for the decision or the operational consequences of either option. It should not be generalized to urban deployments where
    the governing policy, assessed risks, or mission requirements differ.
