case:
  id: DR-CORPUS-NS-85bee22b-E3@v1
  title: Civilian Protection During an Engagement
  status: draft
  setting: Battle of Mogadishu, Somalia; American soldiers during another part of the battle.
  decider: The American soldiers facing the gunman
  agent: The American soldiers facing the gunman
  agent_role: decide
  situation: During the Battle of Mogadishu, a gunman was attempting to engage American troops while children and women were
    close to him. The soldiers had to decide how to respond while civilians were in the immediate area. Engaging the gunman
    while risking civilian casualties was described as permissible under the laws of war. The soldiers had a nonlethal means
    available, although most soldiers generally lacked such means. Civilian casualties could bring political pressure that
    might derail an operation.
  question: What should the American soldiers do at the engagement decision to protect civilians while responding to the gunman?
  options:
    O1:
      do: The American soldiers expose the nearby civilians by engaging the gunman while they remain close.
      move: act
      irreversible: true
    O2:
      do: The American soldiers shield the nearby civilians by separating them before engaging the gunman.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A Somali gunman was attempting to engage American troops.
  - id: F2
    kind: situation
    status: confirmed
    fact: Four children sat on the gunman, and two women kneeled in front of him.
  - id: F3
    kind: situation
    status: assessed
    fact: The women and children were characterized as alleged noncombatants.
  - id: F4
    kind: authority
    status: assessed
    fact: Engaging the gunman while risking civilian casualties was described as permissible under the laws of war.
  - id: F5
    kind: capability
    status: confirmed
    fact: The soldiers had a nonlethal means available.
  - id: F6
    kind: capability
    status: assessed
    fact: Most soldiers lacked nonlethal means of defense in such situations.
  - id: F7
    kind: situation
    status: assessed
    fact: Civilian casualties could bring political pressure that might derail an operation at the strategic or political
      level.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Women and children were immediately beside the gunman and were characterized as alleged noncombatants, giving their
      safety direct weight in choosing how to respond.
  - id: C2
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Engaging while risking civilian casualties was described as permissible under the laws of war, so civilian risk alone
      did not make that option legally impermissible; legality did not require choosing it.
  - id: C3
    facts:
    - F2
    - F5
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The soldiers had a nonlethal means available, and using that capability allowed the civilians to be separated from
      the gunman before engagement.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Civilian casualties can bring political pressure capable of derailing an operation, adding a strategic reason to
      avoid exposing civilians when a nonlethal option is available.
  reasoning:
    read: This was an armed threat in the immediate presence of people characterized as alleged noncombatants. The trap is
      to treat the fact that risking civilian casualties could be lawful as a reason that soldiers should accept that risk;
      the available means to protect civilians before engaging weighs against that conclusion.
    weighing: Civilian safety and the available nonlethal capability favor {O2} {C1} {C3}. Although {O1} could be lawful {C2},
      that permission does not require accepting civilian risk when another means is available. Avoiding civilian casualties
      also matters because political pressure could derail the operation {C4}. The balance depends on civilians being at risk,
      a nonlethal means being available, and the gunman still requiring a response.
    tradecraft: At the decision level, prioritize separating civilians before engaging when a feasible nonlethal option is
      available. Record the civilian-protection rationale and the relevant legal assessment without adding details about employing
      the means.
    uncertainty: The women and children were characterized as alleged noncombatants, and the risk to civilians could have
      been lawful; no fuller legal analysis is provided, nor is it specified how the decision would be made if the available
      nonlethal means could not protect them.
    handoff: The soldiers facing the gunman make the engagement decision. No separate approval or referral role is identified.
    tempting_wrong:
      option: O1
      pull: Engaging while the civilians remain close was described as permissible under the laws of war and would respond
        directly to the gunman.
      why_wrong: Permission to accept civilian risk is not a reason to do so when a nonlethal alternative is available to
        separate the civilians.
    rejected:
      O1: It was not chosen because the soldiers had a nonlethal means available to separate the nearby civilians before engaging
        the gunman.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The nonlethal option were unavailable and the gunman posed an immediate threat that required a response, with no
        feasible way to separate or otherwise protect the civilians.
      then: O1
      why: If no nonlethal means is available and the gunman must be stopped to protect the soldiers, the concern that soldiers
        may have no choice but to accept civilian casualties would favor engaging despite the risk.
    would_not_change:
    - id: noflip1
      if: Engaging while risking civilian casualties remained legally permissible.
      why: That possibility is consistent with choosing the nonlethal, civilian-protective course when the means are available.
    watch_for:
    - id: watch1
      what: Whether civilians can in fact be separated using an available nonlethal option without creating a greater danger
        to them.
      favors:
      - O2
      why: The civilian-protective choice depends on an available means that can separate the civilians before the gunman
        is engaged.
  lesson: When civilians are close to a gunman, legal permission to accept civilian risk does not settle the ethical choice.
    If a feasible nonlethal option can protect civilians while allowing the threat to be addressed, prefer that course; civilian
    casualties may also carry strategic costs.
  limits: This reasoning addresses the described choice where a nonlethal means was available and civilians were close to
    the gunman. It does not establish that engaging with civilian risk is always unlawful, or determine what to do when no
    feasible civilian-protective alternative exists.
