case:
  id: DR-CORPUS-NX-42ec6e73-E2@v1
  title: Supervision During Trainee Checks
  status: draft
  setting: KC-135R maintenance team, 3 May 2013, during aircraft checks.
  decider: The supervising aircraft maintainer
  agent: The supervising aircraft maintainer
  agent_role: decide
  situation: On 3 May 2013, a KC-135R maintenance team was preparing an aircraft for launch. The trainee assigned to the launch
    was in training and had not been officially qualified to launch aircraft. The trainee had completed two earlier supervised
    on-the-job launch exercises, and a supervising maintainer was overseeing the trainee's training. The supervisor also had
    a hydraulic leak to discuss with hydraulic-shop members. The supervisor must decide whether to remain with the trainee
    during the checks or leave to discuss the leak.
  question: 'What should the supervising aircraft maintainer do during the trainee''s checks: stay with the trainee or leave
    to discuss the hydraulic leak?'
  options:
    O1:
      do: The supervising maintainer stays with the trainee during the checks and postpones the hydraulic-shop discussion.
      move: act
      irreversible: false
    O2:
      do: The supervising maintainer leaves the trainee during the checks and discusses the hydraulic leak with hydraulic-shop
        members.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: The trainee was in training.
  - id: F2
    kind: capability
    status: confirmed
    fact: The trainee was not officially qualified to launch aircraft.
  - id: F3
    kind: capability
    status: confirmed
    fact: The trainee was a back-shop electrical-environmental journeyman who had never performed a KC-135 flightline task
      before the deployment.
  - id: F4
    kind: situation
    status: confirmed
    fact: The supervising maintainer was overseeing the trainee's aircraft-launch and flight-controls training.
  - id: F5
    kind: capability
    status: confirmed
    fact: The trainee had twice performed on-the-job training by launching an aircraft under a qualified individual's supervision.
  - id: F6
    kind: situation
    status: confirmed
    fact: The trainee was tasked to launch the aircraft while the supervising maintainer supervised the action.
  - id: F7
    kind: situation
    status: confirmed
    fact: A hydraulic leak was a subject for discussion with hydraulic-shop members.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The trainee was still in training, was not officially qualified to launch aircraft, and had no prior KC-135 flightline
      experience. The supervisor was overseeing that training, which weighs toward remaining present.
  - id: C2
    facts:
    - F5
    equity: mitigation
    favors:
    - O2
    weight: weak
    why: Two earlier supervised launch exercises provide some relevant experience, but do not establish that the trainee was
      qualified or remove the need for supervision.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The supervisor had a hydraulic leak to discuss with hydraulic-shop members. The excerpt gives no indication that
      the discussion was urgent or could not be deferred.
  reasoning:
    read: This was a training and supervision decision, not simply a choice between two competing maintenance tasks. The trap
      is to treat the trainee's two earlier supervised launches as equivalent to official qualification, or to assume the
      leak discussion required the supervisor to leave.
    weighing: The source records that the supervisor left the trainee during the checks to discuss the hydraulic leak, making
      {O2} the recorded outcome. The prior supervised exercises and the leak discussion are reasons that could support leaving,
      but the source does not expressly say they justified it. The trainee's unqualified status and the supervisor's training
      role weigh the other way. The balance would depend materially on the discussion's urgency and whether qualified supervision
      remained available; neither is established here.
    tradecraft: If a supervisor must leave, first arrange qualified coverage or pause the trainee's checks, and record who
      assumed supervision and why the discussion could not wait. This is decision practice, not a procedure stated in the
      excerpt.
    uncertainty: The excerpt does not establish the urgency of the hydraulic leak discussion, whether another qualified maintainer
      could supervise, or that the source expressly approved the supervisor's choice. It also records that the trainee was
      briefed and followed available guidance, but those facts do not establish official qualification.
    handoff: The excerpt identifies the hydraulic-shop members as the people with whom the supervisor intended to discuss
      the leak, but does not state that they could take over supervision. As a decision practice, the supervisor should confirm
      qualified coverage before leaving.
    tempting_wrong:
      option: O2
      pull: The trainee had completed two supervised launch exercises, and the supervisor had a hydraulic leak to discuss.
      why_wrong: Those points do not establish that an unqualified trainee could safely continue without the supervisor, and
        the excerpt gives no urgency that made leaving necessary.
    rejected:
      O1: The source records that the supervisor left to discuss the hydraulic leak, although the excerpt does not expressly
        endorse that choice over remaining with the trainee.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The leak discussion could be deferred without material consequence and no qualified replacement supervision was
        available.
      then: O1
      why: The trainee's lack of official qualification and the supervisor's training role would then weigh more strongly
        toward staying.
    - id: flip2
      if: The trainee were officially qualified and the leak discussion required the supervisor's attention at that time.
      then: O2
      why: The supervision concern would be reduced while the competing need to discuss the leak would remain.
    would_not_change:
    - id: noflip1
      if: The trainee's two earlier supervised launch exercises were treated as proof of official qualification.
      why: Those exercises were supervised training; they do not alter the stated fact that the trainee was not officially
        qualified.
    watch_for:
    - id: watch1
      what: Whether another qualified maintainer was available to take over supervision.
      favors:
      - O2
      why: Qualified coverage would reduce the supervision concern associated with the supervisor leaving.
  lesson: Prior supervised practice can support a trainee's development, but it is not the same as official qualification.
    When the trainee remains unqualified, a supervisor should not treat a competing discussion as sufficient reason to leave
    without first addressing continued qualified supervision.
  limits: The excerpt records the supervisor's departure but does not expressly evaluate whether it was justified, establish
    the leak discussion's urgency, or say whether another qualified maintainer was available. This reasoning does not determine
    what supervision rules applied beyond the facts provided.
