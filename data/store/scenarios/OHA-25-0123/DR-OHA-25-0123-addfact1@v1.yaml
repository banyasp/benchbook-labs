case:
  id: DR-OHA-25-0123-addfact1@v1
  title: Restoration of DOE Security Clearance after Alcohol-Related Conduct [addfact]
  status: needs_review
  setting: DOE Office of Hearings and Appeals – May 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The employee of a Department of Energy contractor, who holds a security clearance, received alcohol-use counseling
    from January through March 2023. In December 2022, while intoxicated, he transmitted a threatening text to a co-worker.
    He later asserted that his most recent drink occurred on 1 January 2025, yet a PEth analysis performed on 14 February
    2025 returned 181 ng/mL, confirming alcohol intake after that date. A DOE-assigned psychologist diagnosed him with moderate
    Alcohol Use Disorder and noted an absence of rehabilitative progress. The Local Security Office cited Guideline E (dishonesty)
    and Guideline G (alcohol consumption) in its recommendation to deny the employee's clearance. He completed an intensive
    outpatient treatment program spanning 31 March 2025 through 22 May 2025, works on the third floor of the contractor's
    primary facility, and has regularly attended Alcoholics Anonymous meetings since March 2025, providing documentation of
    his attendance. Additionally, he submitted twelve successive negative PEth results covering the period from March 2025
    to February 2026.
  question: What determination should the Administrative Judge make on the employee's petition to reinstate his access authorization?
  options:
    O1:
      do: The Administrative Judge delays ruling pending further evidence of sobriety.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the employee's security clearance and access.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge denies the employee's petition to regain clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a Department of Energy contractor and maintains a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: From January through March 2023, the employee participated in counseling for alcohol misuse.
  - id: F3
    kind: situation
    status: confirmed
    fact: In December 2022, while intoxicated, the employee transmitted a text message threatening violence against a co-worker.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee claimed his most recent drink occurred on 1 January 2025.
  - id: F5
    kind: situation
    status: confirmed
    fact: A phosphatidylethanol (PEth) analysis performed on 14 February 2025 returned 181 ng/mL, confirming alcohol intake
      subsequent to 1 January 2025.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A DOE-assigned psychologist diagnosed the employee with moderate Alcohol Use Disorder and noted an absence of rehabilitative
      progress.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline E (dishonesty) and Guideline G (alcohol consumption) in its recommendation
      to deny the employee's clearance.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employee completed an intensive outpatient treatment program spanning 31 March 2025 through 22 May 2025.
  - id: F9
    kind: situation
    status: confirmed
    fact: The employee's workspace occupies the third floor of the contractor's primary facility.
  - id: F10
    kind: situation
    status: confirmed
    fact: Since March 2025, the employee has regularly attended Alcoholics Anonymous meetings and supplied documentation of
      his attendance.
  - id: F11
    kind: situation
    status: confirmed
    fact: The employee submitted twelve successive negative PEth results covering the period from March 2025 to February 2026.
  considerations:
  - id: C1
    facts:
    - F8
    - F10
    - F11
    - F9
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The Individual completed the intensive outpatient program, attended AA consistently, produced twelve consecutive
      negative PEth tests, and performed all of this while working on the third-floor office, showing that sobriety is maintained
      in his regular work environment and satisfying Guideline G mitigation criteria ¶23(b) and (d).
  - id: C2
    facts:
    - F5
    - F6
    - F8
    - F10
    - F11
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual admitted his earlier dishonesty, obtained counseling, and demonstrated rehabilitation through treatment
      and testing, meeting Guideline E mitigation under ¶17(d).
  - id: C3
    facts:
    - F1
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Although Part 710 presumes against granting a clearance, the regulation permits reversal when the holder shows that
      restoration will not endanger the common defense.
  - id: C4
    facts:
    - F11
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The uninterrupted year of negative PEth results, together with the employee's assignment to a non-critical third-floor
      office, indicates no ongoing alcohol-related risk to reliability, judgment, or mission.
  reasoning:
    read: The issue is whether the Individual's prior alcohol misuse and dishonesty have been sufficiently remedied to remove
      security concerns under Guidelines E and G.
    weighing: The Administrative Judge gave decisive weight to the mitigation factors in C1 and C2, noting that the Individual
      satisfied the specific mitigating conditions of ¶23(b),(d) and ¶17(d). The weak presumption against clearance noted
      in C3 was outweighed by the strong evidence of rehabilitation, sustained abstinence, and the low-risk work location
      identified in C4. Consequently, the balance favored restoration.
    tradecraft: The decision will be entered into the OHA record, the Individual's clearance status updated in the DOE personnel
      security system, and copies transmitted to the LSO and the contractor's security office.
    uncertainty: Minimal; the record contains objective PEth results and corroborating testimony. Residual uncertainty about
      future relapse is addressed by ongoing monitoring.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.25(d)-(g); no further agency review
      is required unless an appeal is filed.
    tempting_wrong:
      option: O3
      pull: The prior intoxicated threat and earlier dishonesty could suggest a lingering risk.
      why_wrong: The source explicitly found that the Individual's subsequent treatment, honesty, and negative testing, together
        with his low-risk office location, mitigate those concerns.
    rejected:
      O1: Holding the decision pending further evidence is unnecessary because the record already demonstrates sustained abstinence,
        rehabilitation, and a low-risk work environment.
      O3: Denial ignores the mitigating evidence that the Individual has met the Adjudicative Guidelines' mitigation criteria
        for both personal-conduct and alcohol-consumption concerns.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent PEth test after February 2026 returns a positive result indicating renewed alcohol consumption.
      then: O3
      why: A positive test would demonstrate a relapse, negating the mitigation under Guideline G and raising new concerns
        under Guideline E.
    - id: flip2
      if: The Individual fails to admit his prior dishonesty or provides new false statements during a follow-up interview.
      then: O3
      why: Continued lack of candor would revive the Guideline E concern and show the mitigation under ¶17(d) was not satisfied.
    would_not_change:
    - id: noflip1
      if: Additional time passes without any further incident.
      why: The passage of time alone does not alter the already-satisfied mitigation criteria.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or evidence of alcohol-related misconduct.
      favors:
      - O3
      why: Such evidence would re-activate the security concerns under Guidelines E and G.
  lesson: When an individual demonstrates sustained abstinence, completes recommended treatment, openly acknowledges prior
    misconduct, and works in a low-sensitivity environment, the Adjudicative Guidelines allow mitigation of both personal-conduct
    and alcohol-consumption concerns, permitting restoration of a clearance.
  limits: This analysis applies only to cases where the security concerns stem from alcohol use and related honesty issues;
    it does not extend to unrelated criminal conduct, espionage, or threats that are not mitigated by treatment and candor.
