case:
  id: DR-OHA-25-0123-restyle1@v1
  title: Restoration of DOE Security Clearance after Alcohol-Related Conduct [restyle]
  status: needs_review
  setting: U.S. Department of Energy, Office of Hearings & Appeals – May 2026
  decider: Presiding Administrative Law Judge
  agent: Presiding Administrative Law Judge
  agent_role: decide
  situation: The employee, a contractor for the Department of Energy with an active security clearance, has a documented history
    of alcohol use and counseling beginning in early 2023. In December 2022 he sent a threatening text to a coworker while
    intoxicated. He later claimed his last drink occurred on 1 January 2025, but a phosphatidylethanol test on 14 February
    2025 showed a level of 181 ng/mL, confirming alcohol consumption after that date, and he admitted to having lied about
    his abstinence. The DOE psychologist diagnosed him with moderate Alcohol Use Disorder and noted an absence of rehabilitation.
    The Local Security Office cited Guideline E for dishonesty and Guideline G for alcohol use, recommending denial of his
    clearance. The employee subsequently completed an intensive outpatient program, attended AA meetings, and produced twelve
    consecutive negative PEth tests through February 2026.
  question: How should the Presiding Administrative Law Judge rule on the employee's petition to have his access authorization
    reinstated?
  options:
    O1:
      do: The presiding judge postpones a final decision until further sobriety proof is provided.
      move: hold
      irreversible: false
    O2:
      do: The presiding judge restores the employee's access authorization based on the mitigation evidence.
      move: act
      irreversible: true
    O3:
      do: The presiding judge denies the employee's request to have the clearance reinstated.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a Department of Energy contractor and currently possesses a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: From January through March 2023, the employee participated in counseling for alcohol misuse.
  - id: F3
    kind: situation
    status: confirmed
    fact: In December 2022, intoxicated, the employee transmitted a text message that threatened violence against a colleague.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee asserted that his most recent drink occurred on 1 January 2025.
  - id: F5
    kind: situation
    status: confirmed
    fact: A phosphatidylethanol assay performed on 14 February 2025 returned 181 ng/mL, confirming alcohol intake subsequent
      to 1 January 2025.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Department of Energy psychologist diagnosed the employee with moderate Alcohol Use Disorder and concluded that
      rehabilitation had not yet been demonstrated.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline E (dishonesty) and Guideline G (alcohol use) in its recommendation to
      deny the clearance.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employee completed an intensive outpatient treatment program spanning 31 March 2025 through 22 May 2025.
  - id: F9
    kind: situation
    status: confirmed
    fact: Since March 2025, the employee has regularly attended Alcoholics Anonymous meetings and submitted documented attendance
      logs.
  - id: F10
    kind: situation
    status: confirmed
    fact: The employee furnished twelve successive negative PEth results covering the period from March 2025 to February 2026.
  considerations:
  - id: C1
    facts:
    - F8
    - F9
    - F10
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The employee's completion of the intensive outpatient program, continuous AA participation, and a series of twelve
      consecutive negative PEth results fulfill the mitigation requirements of Guideline G under paragraphs 23(b) and (d).
  - id: C2
    facts:
    - F5
    - F6
    - F8
    - F9
    - F10
    equity: due_process
    favors:
    - O2
    weight: strong
    why: By acknowledging his prior false statements, undergoing counseling, and evidencing rehabilitation, the employee satisfies
      Guideline E's mitigation provision in paragraph 17(d).
  - id: C3
    facts:
    - F1
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: While Part 710 establishes a presumption against reinstatement, the regulation permits reversal when the individual
      can demonstrate that restoration will not jeopardize the common defense.
  - id: C4
    facts:
    - F10
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: An uninterrupted year of negative PEth findings indicates the absence of any current alcohol-related risk to reliability
      or judgment.
  reasoning:
    read: The determination rests on whether the employee's prior alcohol misuse and initial dishonesty have been adequately
      remedied to remove security concerns under Guidelines E and G.
    weighing: The presiding judge accorded decisive weight to the mitigation elements identified in C1 and C2, recognizing
      that the employee satisfied the specific mitigating conditions of paragraphs 23(b), (d) and 17(d). The modest presumption
      against reinstatement highlighted in C3 was eclipsed by compelling evidence of rehabilitation and continuous abstinence.
      Consequently, the balance favored restoration.
    tradecraft: The ruling will be recorded in the OHA docket, the employee's clearance status amended in the DOE personnel
      security system, and copies dispatched to the Local Security Office and the employee's employer.
    uncertainty: Uncertainty is minimal; the file contains objective test data and corroborating statements. The sole remaining
      uncertainty concerns potential future relapse, mitigated through continued monitoring.
    handoff: The presiding judge adjudicates singly, as authorized by 10 C.F.R. § 710.25(d)-(g); no additional agency review
      is required unless an appeal is lodged.
    tempting_wrong:
      option: O3
      pull: The earlier falsehood and the serious December 2022 threat might imply an ongoing risk.
      why_wrong: The source explicitly concluded that the employee's subsequent treatment, candor, and negative testing mitigate
        those concerns.
    rejected:
      O1: Deferring a final ruling is unnecessary because the record already shows sustained abstinence and rehabilitation.
      O3: Denial overlooks the mitigating evidence that the employee has satisfied the Adjudicative Guidelines' mitigation
        criteria.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A PEth assay conducted after February 2026 returns a positive result indicating renewed alcohol use.
      then: O3
      why: A positive result would demonstrate relapse, nullifying the mitigation under Guideline G and raising fresh concerns
        under Guideline E.
    - id: flip2
      if: The employee refuses to acknowledge his prior falsehood or furnishes additional false statements during a follow-up
        interview.
      then: O3
      why: Ongoing lack of candor would revive the Guideline E issue and indicate that the mitigation in paragraph 17(d) has
        not been satisfied.
    would_not_change:
    - id: noflip1
      if: Additional time elapses without any further incident.
      why: The mere passage of time does not modify the already-met mitigation criteria.
    watch_for:
    - id: watch1
      what: Any future positive PEth result or evidence of alcohol-related misconduct.
      favors:
      - O3
      why: Such evidence would reactivate the security concerns under Guidelines E and G.
  lesson: When an employee demonstrates sustained abstinence, completes prescribed treatment, and openly acknowledges prior
    misconduct, the Adjudicative Guidelines permit mitigation of both personal-conduct and alcohol-consumption concerns, allowing
    clearance restoration.
  limits: This analysis applies solely to cases where security concerns arise from alcohol use and related honesty issues;
    it does not extend to unrelated criminal conduct, espionage, or threats that are not mitigated by treatment and candor.
