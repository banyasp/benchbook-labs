case:
  id: DR-OHA-25-0123@v1
  title: Restoration of DOE Security Clearance after Alcohol-Related Conduct
  status: draft
  setting: DOE Office of Hearings and Appeals, May 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee with a security clearance, had a history of alcohol use and counseling
    in early 2023. In December 2022 he sent a threatening text to a co‑worker while intoxicated. He later reported that his
    last drink was on 1 January 2025, but a PEth test on 14 February 2025 showed a level of 181 ng/mL, indicating recent drinking,
    and he admitted he had lied about his abstinence. The DOE psychologist diagnosed him with moderate Alcohol Use Disorder
    and noted lack of rehabilitation. The Local Security Office cited Guideline E for dishonesty and Guideline G for alcohol
    consumption, recommending denial of his clearance. The Individual subsequently completed an intensive outpatient program,
    attended AA meetings, and produced twelve consecutive negative PEth tests through February 2026.
  question: What should the Administrative Judge do regarding the Individual’s request to restore his access authorization?
  options:
    O1:
      do: The Administrative Judge holds the decision pending further sobriety evidence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge denies the Individual’s request to restore clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor and holds a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: Between January 2023 and March 2023 the Individual received counseling for alcohol use.
  - id: F3
    kind: situation
    status: confirmed
    fact: In December 2022, while under the influence of alcohol, the Individual sent a text threatening to harm a co‑worker.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual reported that his last alcohol consumption was on 1 January 2025.
  - id: F5
    kind: situation
    status: confirmed
    fact: A PEth test on 14 February 2025 was positive at 181 ng/mL, indicating alcohol consumption after 1 January 2025.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The DOE psychologist diagnosed the Individual with moderate Alcohol Use Disorder and found no evidence of rehabilitation.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Local Security Office invoked Guideline E for dishonesty and Guideline G for alcohol consumption in recommending
      denial of the clearance.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual completed an intensive outpatient program from 31 March 2025 to 22 May 2025.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Individual has attended Alcoholics Anonymous meetings since March 2025 and provided attendance records.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Individual submitted twelve consecutive negative PEth tests covering March 2025 through February 2026.
  considerations:
  - id: C1
    facts:
    - F8
    - F9
    - F10
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The Individual completed the intensive outpatient program, attended AA consistently, and produced twelve consecutive
      negative PEth tests, satisfying Guideline G mitigation criteria ¶23(b) and (d).
  - id: C2
    facts:
    - F5
    - F6
    - F8
    - F9
    - F10
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The Individual admitted his earlier dishonesty, obtained counseling, and demonstrated rehabilitation, meeting Guideline
      E mitigation under ¶17(d).
  - id: C3
    facts:
    - F1
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Although Part 710 presumes against granting a clearance, the regulation allows reversal when the holder shows that
      restoration will not endanger the common defense.
  - id: C4
    facts:
    - F10
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The uninterrupted year of negative PEth results indicates no ongoing alcohol‑related risk to reliability or judgment.
  reasoning:
    read: The case hinges on whether the Individual’s past alcohol misuse and initial dishonesty have been sufficiently remedied
      to eliminate security concerns under Guidelines E and G.
    weighing: The Administrative Judge gave decisive weight to the mitigation factors outlined in C1 and C2, noting that the
      Individual satisfied the specific mitigating conditions of ¶23(b),(d) and ¶17(d). The weak presumption against clearance
      noted in C3 was outweighed by the strong evidence of rehabilitation and sustained abstinence. The balance therefore
      tipped toward restoration.
    tradecraft: The decision will be entered into the OHA record, the Individual’s clearance status updated in the DOE personnel
      security system, and a copy of the decision transmitted to the LSO and the Individual’s employer.
    uncertainty: Minimal; the record contains objective test results and corroborating testimony. The only residual uncertainty
      would be future relapse, which is addressed by ongoing monitoring.
    handoff: The Administrative Judge decides alone, as permitted by 10 C.F.R. § 710.25(d)-(g); no further agency review is
      required unless an appeal is filed.
    tempting_wrong:
      option: O3
      pull: The prior dishonesty and the serious December 2022 threat could suggest a continued risk.
      why_wrong: The source explicitly found that the Individual’s subsequent treatment, honesty, and negative testing mitigated
        those concerns.
    rejected:
      O1: Holding the decision pending further evidence is unnecessary because the record already demonstrates sustained abstinence
        and rehabilitation.
      O3: Denial ignores the mitigating evidence that the Individual has met the Adjudicative Guidelines’ mitigation criteria.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent PEth test after February 2026 returned a positive result indicating renewed alcohol consumption.
      then: O3
      why: A positive test would demonstrate a relapse, negating the mitigation under Guideline G and raising new concerns
        under Guideline E.
    - id: flip2
      if: The Individual failed to admit his prior dishonesty or provided new false statements during a follow‑up interview.
      then: O3
      why: Continued lack of candor would revive the Guideline E concern and show the mitigation under ¶17(d) was not satisfied.
    would_not_change:
    - id: noflip1
      if: Additional time passes without any further incident.
      why: The passage of time alone does not alter the already‑satisfied mitigation criteria.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or evidence of alcohol‑related misconduct.
      favors:
      - O3
      why: Such evidence would re‑activate the security concerns under Guidelines E and G.
  lesson: When an individual demonstrates sustained abstinence, completes recommended treatment, and openly acknowledges prior
    misconduct, the Adjudicative Guidelines allow mitigation of both personal‑conduct and alcohol‑consumption concerns, permitting
    restoration of a clearance.
  limits: This analysis applies only to cases where the security concerns stem from alcohol use and related honesty issues;
    it does not extend to unrelated criminal conduct, espionage, or threats that are not mitigated by treatment and honesty.
