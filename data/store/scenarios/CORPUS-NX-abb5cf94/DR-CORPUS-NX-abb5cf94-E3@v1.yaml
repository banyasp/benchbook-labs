case:
  id: DR-CORPUS-NX-abb5cf94-E3@v1
  title: Assessing Chinese Intervention in Korea
  status: draft
  setting: Korea, early October 1950, CIA Office of Reports and Estimates.
  decider: CIA Office of Reports and Estimates analysts
  agent: CIA Office of Reports and Estimates analysts
  agent_role: decide
  situation: By early October 1950, CIA's Office of Reports and Estimates was assessing whether Chinese forces would intervene
    openly in Korea as UN forces advanced. A 15 September Weekly Summary described evidence suggesting intervention was likely,
    while also reasoning that Beijing would not risk war with the United States. Peiping's charges of US aggression and territorial
    violations had increased speculation about Chinese intervention. On 30 September, warnings linking intervention to UN
    forces crossing the 38th parallel appeared in the Daily Summary without comment. Chinese Communists might see open intervention
    as contrary to their interests if they anticipated war with UN nations. Analysts also recognized that Chinese forces had
    long possessed the capability to intervene on a scale that could materially affect events.
  question: What should the CIA Office of Reports and Estimates analysts do in assessing the likelihood of open Chinese intervention
    in Korea as UN forces advance?
  options:
    O1:
      do: The CIA analysts defer the current estimate without issuing a likelihood judgment.
      move: hold
      irreversible: false
    O2:
      do: The CIA analysts deny Chinese intervention is likely in the current estimate.
      move: act
      irreversible: false
    O3:
      do: The CIA analysts affirm Chinese intervention is likely in the current estimate.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The 15 September Weekly Summary described evidence suggesting Chinese intervention was likely.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The 15 September Weekly Summary also concluded that Beijing would not risk war with the United States.
  - id: F3
    kind: situation
    status: confirmed
    fact: Peiping's charges of US aggression and territorial violations increased speculation about Chinese intervention.
  - id: F4
    kind: situation
    status: confirmed
    fact: Warnings that Chinese intervention could follow if UN forces crossed the 38th parallel were published in the Daily
      Summary on 30 September without comment.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Chinese Communists might not consider open intervention in their interests if they anticipated war with UN nations.
  - id: F6
    kind: capability
    status: assessed
    fact: Chinese Communist forces had long had the capability to intervene in Korea on a scale sufficient to materially affect
      events.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: ORE judged that Beijing would not consider open intervention in its interests if it anticipated war with UN nations,
      supporting an assessment of unlikely rather than likely intervention.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: Evidence of possible intervention, Peiping's charges, and warnings tied to a crossing of the 38th parallel warranted
      attention and weighed against dismissing the possibility.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Chinese forces could materially affect events in Korea, so their capability made intervention consequential; ORE
      nevertheless distinguished capability from the likelihood of an open commitment.
  - id: C4
    facts:
    - F2
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: ORE considered arguments that Soviet and Chinese interests might draw China into the war, but found no evidence of
      a Soviet-Chinese disagreement and judged political and military considerations made direct, open Chinese commitment
      unlikely.
  reasoning:
    read: The question is whether open Chinese intervention is likely, not whether Chinese forces are capable of intervening.
      The trap is to treat warnings, hostile charges, and substantial capability as proof of intent, or to treat the prospect
      of war as making intervention impossible.
    weighing: ORE recognized evidence suggesting intervention and the potential for Chinese forces to alter the course of
      events. It nevertheless judged that Beijing would not risk war with the United States or openly commit forces if it
      anticipated war with UN nations. Although strategic arguments could make intervention appear plausible, ORE found no
      evidence of Soviet-Chinese disagreement and concluded that political and military considerations made open Chinese commitment
      unlikely. The assessment depends on the judgment about Beijing's expectations and interests, not on capability alone.
    tradecraft: State the likelihood judgment while distinguishing evidence of capability, warning indicators, and assessed
      intent. Record the competing indications and the reasoning behind the judgment so later estimates can reassess them
      if the evidence changes.
    uncertainty: The indicators raised real concern, and Chinese forces had the capacity to intervene. The assessment remained
      uncertain because it depended on what Beijing anticipated about the consequences of open intervention; the source records
      no evidence of Soviet-Chinese disagreement, but that absence does not establish that intervention could not occur.
    handoff: The source presents this as an ORE analytic judgment; it does not identify a required referral or outside decision-maker.
      The analysts should make and document the estimate within their assigned role.
    tempting_wrong:
      option: O3
      pull: Reports suggested intervention was likely, Peiping had issued charges of US aggression, warnings linked intervention
        to a UN crossing of the 38th parallel, and Chinese forces had the capacity to affect events.
      why_wrong: Those indicators establish a serious possibility and capability, but ORE judged that Beijing would not consider
        open intervention in its interests if it anticipated war with UN nations.
    rejected:
      O1: ORE reached a likelihood judgment based on its assessment of Chinese interests and the political and military considerations,
        rather than deferring without a judgment.
      O3: ORE acknowledged the warnings and capability but concluded that open Chinese intervention was unlikely given the
        expected costs and the absence of evidence of Soviet-Chinese disagreement.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that Beijing did not anticipate war with UN nations and regarded open intervention as serving
        its interests.
      then: O3
      why: That would weaken the central premise behind ORE's judgment that the expected consequences made open intervention
        unlikely.
    would_not_change:
    - id: noflip1
      if: The evidence established Chinese capability to intervene but added no evidence that Beijing intended to do so openly.
      why: ORE already recognized substantial capability while still judging open intervention unlikely.
    watch_for:
    - id: watch1
      what: Whether warnings tied to UN forces crossing the 38th parallel are followed by credible evidence of an open Chinese
        commitment.
      favors:
      - O3
      why: Such evidence would bear directly on whether the warnings reflected an actual intention to intervene rather than
        a capability or possibility.
  lesson: 'Assess likelihood separately from capability: a force may be able to act without its leadership judging action
    to be in its interests. Treat warning indicators seriously, but weigh them against the decision-maker''s assessed motives
    and expected costs, and make clear what new evidence would change the estimate.'
  limits: This reasoning concerns an intelligence estimate of open Chinese intervention in Korea in early October 1950. It
    does not determine whether intervention later occurred, prescribe a military response, or establish how analysts should
    assess a different actor or conflict.
  library:
    domain: intel-analysis
    family: CORPUS-NX-abb5cf94
    source: https://www.cia.gov/resources/csi/static/7e16d8ebf9326671b17a65cac6bf6aeb/ORE-First-Center-of-Analysis-at-CIA-Sep2022.pdf
    episode_focus: The decision point is whether to assess Chinese intervention as likely or unlikely as UN forces advanced
      and reports accumulated. The analysts reasoned that intervention could increase the risk of global war and affect Soviet-Chinese
      relations; exclude military advice about how to respond to intervention.
