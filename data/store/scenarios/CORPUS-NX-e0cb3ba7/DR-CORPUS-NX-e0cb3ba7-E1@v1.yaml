  id: DR-CORPUS-NX-e0cb3ba7-E1@v1
  title: Review of an Accident Investigation Board Report
  status: draft
  setting: Near Jalalabad Air Base, Afghanistan; 25 June 2014 mishap review; Air Force convening authority.
  decider: The convening authority
  agent: The convening authority
  agent_role: decide
  situation: The convening authority had an Abbreviated Accident Investigation Board report before it. The board investigated
    a mishap on 25 June 2014 near Jalalabad Air Base, Afghanistan. The investigation was conducted under the provisions of
    AFI 51-503. The aircraft involved was assigned to the 432d Wing at Creech Air Force Base, Nevada. Applicable regulatory
    and statutory guidance was relevant to the review.
  question: What should the convening authority do with the board report?
  options:
    O1:
      do: The convening authority disapproves the board report.
      move: act
      irreversible: false
    O2:
      do: The convening authority approves the board report.
      move: act
      irreversible: false
