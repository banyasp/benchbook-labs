case:
  id: DR-CORPUS-NX-2db78145-E5@v1
  title: The Request for Soviet Assistance
  status: draft
  setting: Poland and the Soviet Union, December 1981, CPSU Politburo
  decider: The CPSU Politburo
  agent: The CPSU Politburo
  agent_role: decide
  situation: The Polish leadership requested Soviet assistance in connection with the introduction of martial law. The request
    came before or at the start of the operation. The Politburo expected the planned operation to succeed if the Polish leadership
    carried it out forcefully and without letting up. It feared that advance assistance could give the Polish leadership an
    excuse to act less forcefully and swiftly. The Politburo also regarded a calamity after implementation as a circumstance
    in which intervention might be considered.
  question: What should the CPSU Politburo do with the Polish leadership's request for Soviet assistance before or at the
    start of the operation?
  options:
    O1:
      do: The Politburo rejects the Polish leadership's request for Soviet assistance before the operation begins.
      move: act
      irreversible: true
    O2:
      do: The Politburo defers the Polish leadership's request for Soviet assistance and reviews it after the operation begins.
      move: hold
      irreversible: false
    O3:
      do: The Politburo approves the Polish leadership's request for Soviet assistance before the operation begins.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Polish leadership requested Soviet assistance in connection with introducing martial law in December 1981.
  - id: F2
    kind: situation
    status: confirmed
    fact: The request was made before or at the start of the operation.
  - id: F3
    kind: situation
    status: assessed
    fact: The Politburo feared that an advance promise of assistance could give the Polish leadership an excuse to avoid acting
      as forcefully and swiftly as needed.
  - id: F4
    kind: situation
    status: assessed
    fact: The Politburo expected the planned martial law operation to succeed if the Polish leadership implemented it without
      letting up.
  - id: F5
    kind: situation
    status: assessed
    fact: The Politburo was confident in the operation's prospects, unlike the Polish leader.
  - id: F6
    kind: situation
    status: assessed
    fact: The Politburo would contemplate intervention if martial law had been implemented and a calamity had ensued.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Politburo was confident the planned operation would succeed if carried out without letup, so it saw no need to
      provide assistance in advance.
  - id: C2
    facts:
    - F2
    - F3
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The Politburo feared that an advance promise would give the Polish leadership a crutch and weaken its resolve to
      act as forcefully and swiftly as needed.
  - id: C3
    facts:
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: Declining assistance before the operation did not foreclose reconsideration if implementation later produced a calamity;
      intervention could be considered under that separate contingency.
  reasoning:
    read: 'The request came before or at the start of an operation the Politburo expected the Polish leadership to carry out
      successfully on its own. The trap was treating advance assistance as harmless reassurance: the Politburo feared it could
      instead weaken the resolve the operation depended on.'
    weighing: The expectation of success without letting up and the risk that an advance promise would reduce forcefulness
      and speed both favored refusal {C1} {C2}. The possibility of considering intervention after a calamity did not, in the
      Politburo's reasoning, justify assistance before the operation {C3}. The balance depends on the Politburo's assessment
      that the Polish operation could succeed if implemented without letup.
    tradecraft: Record the refusal as applying to the request at this stage, and distinguish it from any later reassessment
      if the stated calamity condition arises. Keep the rationale tied to the Politburo's assessment of the operation and
      the effect advance assistance might have on resolve.
    uncertainty: The outcome of the operation was not yet known when the request was made, and the source gives the Politburo's
      assessment rather than an independent measure of the operation's prospects. It does not establish a legal rule governing
      the request.
    handoff: The Politburo was the deciding body in this account; no separate referral or approval authority is identified.
    tempting_wrong:
      option: O3
      pull: Approving assistance might appear to reassure the Polish leadership and support the operation.
      why_wrong: That overlooks the Politburo's stated concern that an advance promise could become a crutch and make the
        Polish leadership less forceful and swift.
    rejected:
      O2: The Politburo did not defer the request for review after the operation began; it turned down assistance before or
        at the start, while treating a later calamity as a separate contingency.
      O3: The Politburo declined advance approval because it expected the operation to succeed if implemented without letup
        and feared that a promise of assistance would weaken resolve.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Politburo assessed that the operation would not succeed even if the Polish leadership carried it out forcefully
        and without letting up.
      then: O3
      why: That would remove the stated premise that advance assistance was unnecessary and make approval a plausible response
        to the request.
    would_not_change:
    - id: noflip1
      if: The Polish leadership remained less confident than the Politburo about the operation's prospects, while the Politburo
        still expected success if the operation was implemented without letup.
      why: That difference in confidence does not change the Politburo's expectation of success or its concern that advance
        assistance could weaken resolve.
    watch_for:
    - id: watch1
      what: Whether implementation is followed by a calamity.
      favors:
      - O2
      why: A calamity after implementation could prompt the Politburo to contemplate intervention; among the listed options,
        deferral and reassessment is the closest fit for revisiting the matter after the operation begins.
  lesson: Do not promise assistance in advance when the decision-maker expects the operation to succeed without it and fears
    that a promise will weaken the resolve needed for success. Keep any later response tied to the contingency that would
    actually change the assessment.
  limits: This reasoning applies to the Politburo's stated assessment and concern in this particular decision, not to the
    legality or merits of martial law or to every request for assistance. A later calamity could prompt reconsideration, but
    the process for that reassessment is not specified.
  library:
    domain: use-of-force-policy
