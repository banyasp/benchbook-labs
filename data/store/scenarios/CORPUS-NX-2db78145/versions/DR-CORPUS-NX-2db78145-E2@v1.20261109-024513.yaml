        O1: 14
        O2: 15
      real_option: O2
      real_to_mean_other_length: 1.07
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
