case:
  id: DR-CORPUS-NX-2db78145-E2@v1
  title: Limiting Soviet Military Representation in Poland
  status: draft
  setting: Poland, August 1981; the Polish Ministry of National Defense and Warsaw Pact military representation.
  decider: The Polish leader
  agent: The Polish leader
  agent_role: decide
  situation: In 1981, the Polish leadership is considering a proposal to enlarge Soviet military representation associated
    with the Warsaw Pact command in Poland. The proposed additions would place new deputies within the Polish Ministry of
    National Defense, a practice discontinued decades earlier, while the chief representative's headquarters remained separate.
    Discussions over the proposal have been contentious, and the Polish leadership has faced pressure from Soviet command.
    The Polish leader has maintained overall loyalty to the Soviet Union while also taking steps to limit Soviet penetration
    of the Polish armed forces. The immediate choice is whether to accept the proposed expansion or set a smaller increase.
  question: What should the Polish leader do about the proposed expansion of Soviet military representation in Poland?
  options:
    O1:
      do: The Polish leader approves the proposal and accepts the expanded Soviet representation in Poland.
      move: act
      irreversible: false
    O2:
      do: The Polish leader rejects the proposal and limits the increase in Soviet representation in Poland.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The chief military representative's headquarters and staff were separate from the Polish Ministry of National Defense.
  - id: F2
    kind: situation
    status: confirmed
    fact: The practice of placing deputies for the chief military representative in the Polish ministry had ceased in 1957.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Soviet proposal called for ten additional generals and admirals and five additional deputy commanders for the
      chief representative's staff.
  - id: F4
    kind: situation
    status: assessed
    fact: Talks between the Soviet commander and the Polish leader became heated.
  - id: F5
    kind: situation
    status: assessed
    fact: The Polish leadership coordinated efforts to resist Soviet pressure through delay and a token increase.
  - id: F6
    kind: situation
    status: assessed
    fact: The Polish leader was devoted to the Soviet Union and deferential to Soviet leaders overall.
  - id: F7
    kind: situation
    status: assessed
    fact: The Polish leader had taken steps to reduce Soviet penetration of the Polish armed forces and opposed the return
      of Soviet military advisers at various levels.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The proposed expansion would restore a form of Soviet presence in the Polish ministry that had ceased and substantially
      enlarge representation; limiting it better served the stated aim of reducing Soviet penetration.
  - id: C2
    facts:
    - F5
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The Polish leadership used delay and a token increase to resist pressure, and those steps effectively delayed and
      limited the expansion.
  - id: C3
    facts:
    - F6
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: The leader's overall devotion and deference to the Soviet Union constrained resistance, but that loyalty did not
      require acceptance of the full proposal.
  - id: C4
    facts:
    - F7
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The leader had taken other steps to reduce Soviet penetration and opposed the return of Soviet advisers, showing
      that limiting the proposal was consistent with an established effort.
  reasoning:
    read: 'This was not simply a choice between loyalty to an ally and disloyalty: the Polish leader remained broadly loyal
      to the Soviet Union while also resisting measures that increased Soviet penetration. The trap is to treat his deference
      as meaning he never stood up to Soviet pressure; that characterization is too sweeping.'
    weighing: The proposal's scale and its implication for Soviet presence in the Polish ministry weighed against accepting
      it {C1}. The leadership's delay and limited increase, together with the leader's broader efforts to reduce penetration,
      support {O2} {C2} {C4}. Overall loyalty and deference are relevant constraints, but they are compatible with resistance
      rather than decisive for acceptance {C3}. The balance supports limiting the increase, not necessarily eliminating all
      representation.
    tradecraft: State the decision as a limit on the proposed expansion, distinguish the limit from a complete severance of
      the relationship, and record the reasons for the limit and any later change. These are decision-record practices, not
      additional historical findings.
    uncertainty: The resistance was assessed as effective, but the extent of remaining Soviet influence is not quantified,
      and it is not established that the leader could have prevented every increase.
    handoff: Coordinate the decision with the relevant Polish leadership, since the effort to resist Soviet pressure was coordinated;
      the Polish leader retains responsibility for the decision.
    tempting_wrong:
      option: O1
      pull: Overall loyalty and deference could make acceptance appear necessary to preserve the Soviet relationship.
      why_wrong: That would mistake broad loyalty for an obligation to accept this expansion and disregard the leader's steps
        to limit Soviet penetration.
    rejected:
      O1: The full proposal was not chosen because limiting the expansion would reduce Soviet penetration.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed larger presence were shown not to increase Soviet penetration or diminish Polish control.
      then: O1
      why: The stated rationale for limiting the proposal is reducing Soviet penetration; removing that concern would weaken
        the case for the smaller increase.
    would_not_change:
    - id: noflip1
      if: The leader's overall loyalty and deference to Soviet leaders remained unchanged.
      why: That loyalty coexisted with steps to resist Soviet penetration, so loyalty alone would not reverse the decision.
    watch_for:
    - id: watch1
      what: Whether Soviet representation continues to grow beyond the limited increase the Polish leadership sought.
      favors:
      - O2
      why: The eventual increase exceeded the Polish leader's proposed limit, although the effort delayed and kept it smaller
        than it otherwise would have been.
  lesson: Broad loyalty to a partner does not require accepting every proposal that could increase that partner's influence.
    Where limiting penetration is a stated concern, measured resistance can preserve that boundary without implying wholesale
    rejection of the relationship.
  limits: This reasoning concerns a historical judgment about limiting foreign military representation and does not establish
    a general rule for alliance commitments. It does not determine what legal authority governed the proposal or what level
    of representation would be acceptable in another setting.
  library:
    domain: operational-command
    family: CORPUS-NX-2db78145
    source: https://www.cia.gov/static/8267ceb7b721d782637fe3a5362329c1/Warsaw-Pact-Treaty-Friendship.pdf
    episode_focus: The choice was whether to accept the proposed expansion or limit it; the Polish leader delayed and offered
      only a small increase, seeking to reduce Soviet penetration and preserve Polish control. Exclude the mechanics of military
      staffing and any operational details.
