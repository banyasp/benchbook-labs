case:
  id: DR-CORPUS-NX-f401f3be-E8@v1
  title: Retaliation After the Beirut Embassy Bombing
  status: draft
  setting: Beirut, Lebanon, April 1983; a US national-security decision following the bombing of the US Embassy.
  decider: The US Government
  agent: The US Government
  agent_role: decide
  situation: In April 1983, a car bombing struck the US Embassy in Beirut. Sixty-three people died, including 17 American
    citizens. US officials learned which faction carried out the bombing and where its headquarters was located in Lebanon’s
    Ba'aka Valley. The Defense Secretary was concerned about possible civilian casualties from retaliation. The US Government
    must decide whether to approve retaliatory action or decline it.
  question: What should the US Government do after learning which faction carried out the bombing and where its headquarters
    was located?
  options:
    O1:
      do: The US Government approves retaliatory action against the responsible faction.
      move: act
      irreversible: true
    O2:
      do: The US Government disapproves retaliatory action against the responsible faction.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A car bombing struck the US Embassy in Beirut in April 1983.
  - id: F2
    kind: situation
    status: confirmed
    fact: The bombing killed 63 people.
  - id: F3
    kind: situation
    status: confirmed
    fact: Seventeen of those killed were American citizens.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: US officials learned which faction carried out the bombing.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: US officials learned that the faction's headquarters was in Lebanon's Ba'aka Valley.
  - id: F6
    kind: situation
    status: assessed
    fact: The Defense Secretary was concerned about possible civilian casualties from retaliation.
  considerations:
  - id: C1
    facts:
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The Defense Secretary was concerned that retaliation could cause civilian casualties; this was the stated reason
      for refraining.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The scale of the bombing and the deaths, including American citizens, create a countervailing pull toward a response.
      This is contextual pressure, not a stated reason that retaliation was necessary.
  - id: C3
    facts:
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Officials knew which faction was responsible and where its headquarters was, making retaliation a live option; the
      passage does not say that this knowledge outweighed the civilian-casualty concern.
  reasoning:
    read: This was a choice about whether to retaliate after a deadly attack when officials had identified the responsible
      faction and its headquarters. The trap is treating the severity of the bombing or the availability of a target as automatically
      decisive, despite the stated concern about possible civilian casualties.
    weighing: The deaths and the identification of the responsible faction create a pull toward action {C2} {C3}, but the
      passage gives the Defense Secretary’s concern about possible civilian casualties as the reason the Government refrained
      {C1}. On the stated reasons, that concern carries the balance for {O2}; the balance could differ if the civilian-harm
      concern materially changed.
    tradecraft: Record the decision as a choice not to retaliate and state the civilian-casualty concern as its rationale.
      Keep any later assessment of that concern distinct from claims about whether retaliation would have deterred subsequent
      attacks.
    uncertainty: The passage does not quantify the likelihood or scale of civilian casualties, or describe any further assessment
      of that risk.
    handoff: The US Government is the decider in this scenario; the Defense Secretary’s stated concern should be included
      in the decision record because it is the reason attributed to the choice.
    tempting_wrong:
      option: O1
      pull: The bombing was deadly, and officials knew which faction was responsible and where its headquarters was.
      why_wrong: Those facts create pressure to respond but do not answer the stated concern that retaliation could cause
        civilian casualties.
    rejected:
      O1: Retaliation was not chosen because the Defense Secretary was concerned about possible civilian casualties.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible assessment materially reduced the concern that retaliation would cause civilian casualties.
      then: O1
      why: The stated reason for refraining would be substantially weakened, while the attack’s severity and the identification
        of the responsible faction would remain.
    would_not_change:
    - id: noflip1
      if: Officials knew the responsible faction and its headquarters, but the civilian-casualty concern remained unchanged.
      why: Those facts made retaliation an available option but do not, by themselves, displace the stated reason for declining
        it.
    watch_for:
    - id: watch1
      what: Any updated assessment of the civilian-casualty risk from retaliation.
      favors:
      - O1
      - O2
      why: The stated rationale turns on possible civilian casualties, so a material change in that assessment could alter
        the balance.
  lesson: A grave attack and knowledge of who was responsible do not, by themselves, settle whether retaliation is justified.
    Give explicit weight to the civilian-harm concern that drove the decision, and reassess the balance if that concern materially
    changes.
  limits: This reasoning reflects the passage’s stated rationale, not a legal finding about whether retaliation was authorized
    or required. It does not establish the likely civilian harm or evaluate whether retaliation would have deterred later
    attacks.
