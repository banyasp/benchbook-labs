case:
  id: DR-CORPUS-NX-5a815953-E1@v1
  title: Opportunity Analysis in Intelligence
  status: draft
  setting: Intelligence Community, 2009; intelligence-analysis policy.
  decider: The DNI
  agent: The DNI
  agent_role: decide
  situation: At the decision point, the DNI was considering whether intelligence analysis on important issues should remain
    confined to threat assessment or also address opportunities for advancing interests. Intelligence analysis had traditionally
    been kept separate from policy formulation, but policymakers and legislators found fact-only briefings inadequate and
    sought analytic insight relevant to policy advancement. Opportunity analysis was understood as identifying levers that
    could advance U.S. and shared interests, but it remained controversial within the intelligence community. Analytic managers
    feared policy suggestions could taint analysis, and some worried that crossing the boundary would compromise objectivity
    and integrity. The competing view was that well-developed analytic practice could preserve integrity while giving policymakers
    better-targeted analysis.
  question: What should the DNI do about requiring opportunity analysis in intelligence analyses on important issues?
  options:
    O1:
      do: The DNI should ask policymakers and analytic managers to set parameters for opportunity analysis before approving
        a requirement.
      move: ask
      irreversible: false
      to: policymakers and analytic managers
    O2:
      do: The DNI should reject a requirement for an opportunity analysis section in each intelligence analysis on important
        issues.
      move: act
      irreversible: false
    O3:
      do: The DNI should approve a requirement for an opportunity analysis section in each intelligence analysis on important
        issues.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The traditional view treated intelligence analysis as a service to policymakers, not as a formulator of objectives,
      drafter of policy, or maker of plans.
  - id: F2
    kind: situation
    status: assessed
    fact: Policymakers and legislators complained that briefings providing only facts were not sufficiently relevant or helpful
      and sought analytic insight about advancing U.S. foreign policy.
  - id: F3
    kind: capability
    status: assessed
    fact: Opportunity analysis was described as helping policymakers identify levers to advance U.S. and shared interests.
  - id: F4
    kind: situation
    status: assessed
    fact: Opportunity analysis remained uncomfortable and controversial in parts of the intelligence community.
  - id: F5
    kind: situation
    status: assessed
    fact: Analytic managers worried that suggesting policy options would taint analysis and undermine its integrity.
  - id: F6
    kind: situation
    status: assessed
    fact: A concern was that crossing the policy boundary could compromise analytic objectivity and integrity; the counterview
      was that the craft was mature enough to preserve integrity.
  - id: F7
    kind: capability
    status: assessed
    fact: Policymakers reported that intelligence developed with a policy-intelligence task force was better targeted, while
      analysts outside policy circles had less understanding of what was needed.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Policymakers found fact-only briefings inadequate and wanted insight into how to advance interests; opportunity analysis
      is meant to identify levers for doing that.
  - id: C2
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Rigid detachment from policy risks forfeiting intelligence’s opportunity to elevate the policy debate and deprives
      policymakers of useful analytic depth.
  - id: C3
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    - O2
    weight: weak
    why: Policy suggestions may taint analysis or compromise objectivity, but the analytic craft is sufficiently mature to
      preserve integrity.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Analysis developed within policy-intelligence work was reported to be better targeted because analysts in policy
      circles understood what policymakers needed.
  - id: C5
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Communication with customers can allow the intelligence community and policymakers to set parameters that reduce
      accusations of politicization or policy meddling.
  reasoning:
    read: The choice is not simply between objective intelligence and policy advocacy. The trap is treating the traditional
      separation as the only way to preserve analytic integrity, even when fact-only briefings do not meet policymakers’ needs
      and analysts outside policy circles may understand those needs less well.
    weighing: 'The case for requiring opportunity analysis is that it can help policymakers find ways to advance U.S. and
      shared interests and can make analysis more relevant and better targeted {C1} {C2} {C4}. The integrity concern counsels
      care, not rejection: mature analytic practice can preserve objectivity, and communication with customers can establish
      protective parameters {C3} {C5}. On that balance, approve the requirement.'
    tradecraft: 'Pair opportunity analysis with threat analysis on important issues, as the DNI’s mandate did. Keep analytic
      judgments distinct from policy decisions: explain opportunities and likely outcomes while leaving the choice whether
      to act to policymakers. Work with policymakers and analytic managers to set parameters that protect analytic integrity.
      The separation of analytic judgment from the policymaker’s decision is an implementation safeguard; recording those
      distinctions is an added practice.'
    uncertainty: The source identifies controversy and concern about politicization but does not specify how parameters should
      be designed or how their effectiveness should be assessed. The endorsement therefore depends on analysts being able
      to offer policy-relevant insight without presenting policy choices as intelligence findings.
    handoff: The DNI should make the requirement, while involving policymakers and analytic managers in setting parameters.
      Closer communication with customers can target analysis to actual needs and guard against accusations of politicization.
    tempting_wrong:
      option: O2
      pull: Rejecting opportunity analysis appears to preserve the traditional boundary and avoid the risk that policy suggestions
        taint analysis.
      why_wrong: Rigid detachment deprives policymakers of useful analytic insight and can cause intelligence to lose its
        opportunity to elevate the policy debate; mature analytic practice can preserve integrity.
    rejected:
      O1: Setting parameters with policymakers and analytic managers could mitigate integrity concerns, but broadening analysis
        need not be deferred pending that consultation.
      O2: Rigid detachment withholds useful analytic depth and opportunity insight from policymakers despite the possibility
        of preserving integrity.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the DNI could not establish workable parameters with policymakers and analytic managers to protect analysis from
        politicization or policy meddling.
      then: O1
      why: Joint parameter-setting is identified as a way to protect analytic integrity; without a workable safeguard, consultation
        before approval would be the prudent course.
    would_not_change:
    - id: noflip1
      if: If opportunity analysis remained uncomfortable or controversial within parts of the intelligence community.
      why: 'Controversy and integrity concerns do not by themselves defeat approval: mature analytic practice can preserve
        integrity.'
    watch_for:
    - id: watch1
      what: Whether communication with policymakers and analytic managers produces clear parameters that protect against politicization
        or policy meddling.
      favors:
      - O1
      - O2
      why: Parameter-setting is a safeguard; inability to establish it would strengthen the case for consultation before approval
        or against the requirement.
  lesson: Do not equate analytic objectivity with strict detachment from policy needs. Provide policy-relevant opportunity
    analysis while keeping analytic judgments distinguishable from the policymaker’s responsibility to decide.
  limits: This reasoning addresses intelligence analysis on important issues and the stated concern about policy-relevant
    analysis. It does not establish that analysts should formulate policy, choose objectives, or make plans, nor does it specify
    the detailed parameters for opportunity analysis.
  library:
    domain: intel-analysis
    family: CORPUS-NX-5a815953
    source: https://www.cia.gov/resources/csi/static/8f0c235341c125d127d8c595f71bfe82/An-Educated-Consumer.pdf
    episode_focus: This is a stated policy decision to broaden intelligence analysis beyond threat assessment, rather than
      maintain the traditional boundary against policy-relevant analysis. Focus on the DNI’s mandate and its rationale of
      helping policymakers identify ways to advance US and shared interests; exclude the essay’s separate recommendations
      for education and public outreach.
