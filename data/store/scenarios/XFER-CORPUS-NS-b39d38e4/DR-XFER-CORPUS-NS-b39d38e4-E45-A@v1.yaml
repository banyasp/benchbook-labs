case:
  id: DR-XFER-CORPUS-NS-b39d38e4-E45-A@v1
  title: Expedited License for a Coalition Exercise
  status: draft
  setting: Export-control licensing division supporting a coalition exercise, three weeks before the exercise; the program
    office prepared the request four months earlier.
  decider: The licensing division chief
  agent: The licensing division chief
  agent_role: decide
  situation: A foreign coalition partner needs a license to receive training simulators before a coalition exercise. The exercise
    is scheduled to begin in three weeks, and the partner's participation is at stake. The program office drafted the license
    request four months ago but did not submit it. The licensing division is now considering the request on a compressed timeline.
    The governing rule permits expedited emergency processing that skips some interagency review, but bars that route when
    the requesting program office's lack of advance planning caused the urgency.
  question: What should the licensing division chief do about the partner's request to receive training simulators before
    the coalition exercise?
  options:
    O1:
      do: The licensing division chief uses emergency processing for the export license.
      move: act
      irreversible: true
    O2:
      do: The licensing division chief declines emergency processing and subjects the export license request to normal review.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The license request concerns training simulators for a foreign coalition partner.
  - id: F2
    kind: situation
    status: confirmed
    fact: The partner needs the license to receive the simulators before a coalition exercise.
  - id: F3
    kind: situation
    status: confirmed
    fact: The exercise is scheduled to begin in three weeks.
  - id: F4
    kind: situation
    status: confirmed
    fact: The program office drafted the request four months before the exercise but did not submit it.
  - id: F5
    kind: authority
    status: confirmed
    fact: The governing export-control rule permits emergency processing that skips some interagency review.
  - id: F6
    kind: authority
    status: confirmed
    fact: The governing rule bars emergency processing when the requesting program office's lack of advance planning caused
      the urgency.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    equity: tempo
    favors:
    - O1
    weight: weak
    why: The exercise date creates pressure to use emergency processing, which can shorten the review by skipping some interagency
      review.
  - id: C2
    facts:
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: Emergency processing is barred when the requesting office's lack of advance planning caused the urgency. The program
      office had drafted the request four months earlier but did not submit it, so that route cannot be used to address the
      resulting time pressure.
    rules_out:
    - O1
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The partner needs the license before the exercise, making timely processing important to its participation. That
      need does not override the restriction on emergency processing when the requesting office created the urgency through
      inadequate planning.
  reasoning:
    read: 'The partner needs the license before an exercise that begins in three weeks, but the short timeline must be considered
      alongside the program office''s handling of the request: it drafted the request four months earlier and did not submit
      it. The trap is treating the remaining time, by itself, as enough to justify a route that skips some interagency review.'
    weighing: The exercise deadline and compressed timeline create a reason to consider emergency processing, but the decisive
      condition is whether the requesting office's lack of advance planning caused the urgency. The earlier draft and failure
      to submit it show that the delay arose within the program office's process. Because the rule bars emergency processing
      in that circumstance, normal review is required. The balance depends on the source of the urgency, not merely on how
      soon the exercise begins.
    tradecraft: Decline emergency processing and proceed with normal review. Record the request's drafting and submission
      chronology and the basis for concluding that the emergency route is unavailable.
    uncertainty: The stated facts establish that the program office drafted the request four months earlier and did not submit
      it; no unresolved factual uncertainty is presented.
    handoff: The licensing division chief should make the licensing-process decision on this record. No separate referral
      or additional decision-maker is identified for this choice.
    tempting_wrong:
      option: O1
      pull: The partner's need for the simulators before the exercise makes emergency processing appear to be the fastest
        way to support its participation.
      why_wrong: Speed cannot validate use of emergency processing when the requesting office's lack of advance planning created
        the urgency.
    rejected:
      O1: Emergency processing is barred because the program office's earlier drafting and failure to submit the request created
        the urgency.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The urgency arose from circumstances not created by the program office's planning, and the emergency-processing
        rule's other requirements were met.
      then: O1
      why: Without urgency caused by the program office's lack of advance planning, the rule's bar would not apply, and emergency
        processing could be available.
    would_not_change:
    - id: noflip1
      if: The exercise remained three weeks away while the program office's earlier drafting and failure to submit still caused
        the urgency.
      why: The time pressure would remain, but it would not remove the stated bar on emergency processing for urgency created
        by the requesting office's lack of advance planning.
    watch_for:
    - id: watch1
      what: Evidence about whether the program office's decision not to submit the request drafted four months earlier caused
        the compressed timeline.
      favors:
      - O2
      why: That causal link determines whether emergency processing is barred.
  lesson: An imminent exercise does not, by itself, justify emergency export-control processing that skips review. When the
    requesting program office's lack of advance planning created the urgency, that route cannot be used.
  limits: This conclusion concerns the emergency-processing rule on the stated facts. It does not determine whether another
    licensing authority or exception applies, or resolve a case in which the urgency was not caused by the program office's
    planning.
