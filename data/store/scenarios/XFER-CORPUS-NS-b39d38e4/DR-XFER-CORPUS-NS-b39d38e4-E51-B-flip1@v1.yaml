case:
  id: DR-XFER-CORPUS-NS-b39d38e4-E51-B-flip1@v1
  title: Recovered Materiel Offered to an Attaché
  status: draft
  setting: 'At a public ceremony where a host defense minister presents recovered adversary materiel to a U.S. defense attaché;
    time: upon presentation; institution: a U.S. embassy and the Department of Defense.'
  decider: The defense attaché
  agent: The defense attaché
  agent_role: decide
  situation: At a public ceremony, a host defense minister presents the U.S. defense attaché with a fragment of an adversary
    drone recovered by host forces. Host officials assess that refusal is not expected to embarrass the minister. The embassy
    assesses that refusal would not harm relations or set back basing talks. Department rules address receipt of foreign materiel
    when refusal would harm relations. The attaché must decide how to respond at the ceremony; any materiel received is subject
    to reporting and transfer procedures.
  question: What should the defense attaché do about the recovered materiel at the ceremony?
  options:
    O1:
      do: The attaché declines the fragment.
      move: act
      irreversible: false
    O2:
      do: The attaché asks the embassy's legal office for guidance before responding to the host officials.
      move: ask
      irreversible: false
      to: the embassy's legal office
    O3:
      do: The attaché accepts the fragment on behalf of the United States, reports it, and transfers it to the exploitation
        authority with a custody record.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A host defense minister has presented the U.S. defense attaché with a fragment of an adversary drone recovered by
      host forces.
  - id: F2
    kind: situation
    status: confirmed
    fact: The presentation occurs at a public ceremony, and the attaché must respond there.
  - id: F3
    kind: situation
    status: assessed
    fact: Host officials assess that refusing the fragment is not expected to embarrass the minister.
  - id: F4
    kind: situation
    status: assessed
    fact: The embassy assesses that refusal would not harm relations or set back basing talks.
  - id: F5
    kind: authority
    status: confirmed
    fact: Department rules permit attachés to receive foreign materiel when refusal would harm relations.
  - id: F6
    kind: authority
    status: confirmed
    fact: Materiel received under this rule must be accepted on behalf of the United States.
  - id: F7
    kind: authority
    status: confirmed
    fact: Received materiel must be reported and transferred to the exploitation authority with a custody record.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The assessments indicate that refusal is not expected to embarrass the host or harm relations or basing talks, so
      the relationship basis for the special receipt guidance is absent; seeking guidance on the ordinary rules is appropriate.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The stated rule permits receipt when refusal would harm relations, a condition the assessments do not establish.
      The attaché should seek guidance on the applicable ordinary rules rather than assume this conditional permission controls.
  - id: C3
    facts:
    - F7
    equity: policy_compliance
    favors:
    - O3
    weight: strong
    why: If the fragment is received, reporting, transfer, and a custody record are required; O3 expressly includes those
      steps.
  reasoning:
    read: This is an alliance-relations decision at the point of presentation, not a choice to take the fragment for personal
      possession. The trap is assuming that the relationship-based receipt guidance applies even though the assessments indicate
      refusal would not embarrass the host or harm relations.
    weighing: The assessments indicate that the relationship risks underlying the receipt guidance are absent {C1}. The rule
      permits receipt when refusal would harm relations, but these facts do not establish that condition; the attaché should
      ask the embassy's legal office about the applicable ordinary rules before responding {C2}. If receipt is authorized,
      it must be on behalf of the United States and followed by reporting, transfer to the exploitation authority, and a custody
      record {C3}.
    tradecraft: Before responding, ask the embassy's legal office for guidance on the ordinary rules for foreign materiel.
      If receipt is authorized, make clear that the fragment is accepted on behalf of the United States, then report and transfer
      it to the exploitation authority with a custody record under applicable procedures.
    uncertainty: The stated rule turns on whether refusal would harm relations. The assessments indicate that it would not;
      the applicable ordinary rules for foreign materiel are not specified here.
    handoff: The stated relationship-based rule does not resolve what the ordinary rules require when refusal would not harm
      relations. The attaché should seek legal guidance before responding and, if receipt is authorized, use the applicable
      reporting, transfer, and custody-record process.
    tempting_wrong:
      option: O3
      pull: Accepting may seem like a straightforward way to maintain good relations while complying with the reporting and
        custody procedures.
      why_wrong: The relationship-based permission applies when refusal would harm relations, but the assessments say it would
        not. The stated facts do not establish that receipt is allowed under the ordinary rules, so the attaché should seek
        guidance first.
    rejected:
      O1: The assessments remove the stated relationship concern, but they do not establish what the ordinary rules require;
        declining without guidance could assume an answer those rules do not provide.
      O3: The specified receipt permission is conditional on refusal harming relations, which the assessments do not establish.
        Guidance on the applicable ordinary rules is needed before responding.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Refusal were expected to embarrass the host and harm relations or set back basing talks.
      then: O3
      why: The relationship-based permission and recommendation to receive the materiel would then apply; receipt must be
        on behalf of the United States and follow the reporting, transfer, and custody-record requirements.
    would_not_change:
    - id: noflip1
      if: The Department's applicable reporting, transfer, or custody procedures specify a particular process for handling
        received materiel.
      why: That process governs how to handle materiel if receipt is authorized; it does not resolve whether the relationship-based
        permission applies or what ordinary rules require.
    watch_for: []
  lesson: When refusal is not expected to embarrass the host or harm relations, do not assume that relationship-based guidance
    authorizes receipt. Seek guidance on the applicable ordinary rules before responding. If receipt is authorized, accept
    on behalf of the United States and report and transfer the materiel with a custody record under applicable procedures.
  limits: This reasoning applies to the stated foreign-materiel scenario where the assessments indicate that refusal would
    not embarrass the host or harm relations. It does not resolve what the ordinary rules require or apply where refusal does
    risk embarrassment or harm to relations.
