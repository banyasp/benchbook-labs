case:
  id: DR-XFER-CORPUS-NS-b39d38e4-E51-A@v1
  title: Partner Planning Material at a Conference
  status: draft
  setting: 'At the public close of a bilateral exercise-planning conference in an allied capital in 2025; organization: a
    U.S. exercise-planning office and the general staff of a long-standing partner.'
  decider: The U.S. exercise planner
  agent: The U.S. exercise planner
  agent_role: decide
  situation: At the public close of a conference, a partner general staff officer tenders a bound set of the partner's classified
    exercise-planning material to a U.S. exercise planner. The handover is made openly by identified partner officers. The
    officers say that declining the material would be regarded as a slight, and the embassy describes its relations with this
    staff as delicate. Department rules address receipt of foreign-government information when refusal would harm relations,
    and require any receipt under that rule to be on behalf of the U.S. government. The material must then be reported to
    the foreign-disclosure office and registered. The planner must decide at the conference whether to accept, seek guidance
    first, or decline.
  question: What should the planner do about the partner's classified planning material at the conference?
  options:
    O1:
      do: The planner declines the material.
      move: act
      irreversible: false
    O2:
      do: The planner accepts the material on behalf of the U.S. government, then reports it to the foreign-disclosure office
        and registers it.
      move: act
      irreversible: false
    O3:
      do: The planner asks a foreign-disclosure officer for guidance before responding to the partner.
      move: ask
      irreversible: false
      to: a foreign-disclosure officer
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: At the conference, a partner general staff officer tenders a bound set of the partner's classified exercise-planning
      material to a U.S. exercise planner.
  - id: F2
    kind: situation
    status: confirmed
    fact: The offer is made openly at the public close of the conference by identified partner officers.
  - id: F3
    kind: situation
    status: confirmed
    fact: Partner officers state that declining the material would be regarded as a slight.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The embassy assesses its relationship with the partner general staff as delicate.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The embassy assesses that refusal could harm relations with the partner staff.
  - id: F6
    kind: authority
    status: confirmed
    fact: Department rules permit receipt of foreign-government information when refusal would harm relations.
  - id: F7
    kind: authority
    status: confirmed
    fact: Receipt under this rule must be on behalf of the U.S. government.
  - id: F8
    kind: authority
    status: confirmed
    fact: Material received under this rule must be reported to the foreign-disclosure office and registered.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The stated slight and the embassy's assessment of the delicate relationship and possible harm support accepting rather
      than declining the material.
  - id: C2
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The rule permits receipt when refusal could harm relations and requires that receipt be on behalf of the U.S. government.
  - id: C3
    facts:
    - F8
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: Receipt under the rule carries reporting and registration duties, which O1 expressly includes.
  reasoning:
    read: This is a partner-relationship decision at the point the material is tendered, not a choice to accept it for personal
      use. The trap is treating refusal as automatically safer or more proper even though it may cause a slight or harm relations
      with the partner.
    weighing: The assessed relationship risks {C1} activate the rule permitting receipt, and the guidance recommends accepting
      in these circumstances. Receipt must be for the U.S. government, not personally {C2}, and must be followed by reporting
      to the foreign-disclosure office and registration {C3}. The balance depends on the stated risk that refusal could harm
      relations.
    tradecraft: If accepting, make clear that the material is accepted on behalf of the U.S. government, then report it to
      the foreign-disclosure office and register it under applicable procedures.
    uncertainty: The rule turns on whether refusal would harm relations. The facts assess that risk as present; the rule gives
      no further test for resolving its likelihood.
    handoff: The stated rule does not make prior consultation a condition of receipt. The planner should use the applicable
      reporting and registration process; seek foreign-disclosure guidance if the relationship-risk assessment or applicable
      procedure is unclear.
    tempting_wrong:
      option: O1
      pull: Declining may seem like the simplest way to avoid accepting classified foreign-government material.
      why_wrong: The rule recommends receipt when refusal could harm relations, while requiring that receipt be on behalf
        of the U.S. government.
    rejected:
      O3: The rule directly addresses receipt when refusal could harm relations and does not make prior foreign-disclosure
        consultation a prerequisite.
      O1: Declining is contrary to the recommendation when refusal could be taken as a slight or harm relations with the partner.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The relationship-risk assessment changes so that declining is not expected to cause a slight and would not harm
        relations with the partner.
      then: O3
      why: The stated relationship basis for this recommendation would no longer apply; the planner should seek guidance on
        the ordinary foreign-disclosure rules rather than assume this exception controls.
    would_not_change:
    - id: noflip1
      if: The applicable foreign-disclosure procedures specify a particular process for reporting and registering received
        material.
      why: That process governs how to carry out the receipt; it does not displace the recommendation to accept when the stated
        relationship risks are present.
    watch_for: []
  lesson: 'When declining foreign-government information could cause a partner slight or harm relations, the guidance recommends
    receiving it on behalf of the U.S. government rather than declining it. Receipt is not personal acceptance: report the
    material to the foreign-disclosure office and register it under applicable procedures.'
  limits: This reasoning applies to the stated foreign-government information scenario where refusal risks harm to relations.
    It does not resolve the rules for offers where those relationship risks are absent or where another applicable requirement
    controls.
