case:
  id: DR-XFER-CORPUS-NS-b39d38e4-E45-A-flip1@v1
  title: Expedited License for a Coalition Exercise
  status: draft
  setting: Export-control licensing division supporting a coalition exercise, three weeks before the exercise; the program
    office prepared and submitted the request four months earlier, but an unforeseen delay outside its planning caused the
    urgency.
  decider: The licensing division chief
  agent: The licensing division chief
  agent_role: decide
  situation: A foreign coalition partner needs a license to receive training simulators before a coalition exercise. The exercise
    is scheduled to begin in three weeks, and the partner's participation is at stake. The program office drafted and submitted
    the license request four months ago. An unforeseen delay outside the program office's planning caused the compressed timeline.
    The licensing division is now considering the request. The governing rule permits expedited emergency processing that
    skips some interagency review, bars that route when the requesting program office's lack of advance planning caused the
    urgency, and its other requirements for emergency processing are met.
  question: What should the licensing division chief do about the partner's request to receive training simulators before
    the coalition exercise?
  options:
    O1:
      do: The licensing division chief uses emergency processing for the export license.
      move: act
      irreversible: true
    O2:
      do: The licensing division chief declines emergency processing and subjects the export license request to normal review.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The license request concerns training simulators for a foreign coalition partner.
  - id: F2
    kind: situation
    status: confirmed
    fact: The partner needs the license to receive the simulators before a coalition exercise.
  - id: F3
    kind: situation
    status: confirmed
    fact: The exercise is scheduled to begin in three weeks.
  - id: F4
    kind: situation
    status: confirmed
    fact: The program office drafted and submitted the request four months before the exercise; an unforeseen delay outside
      its planning caused the urgency.
  - id: F5
    kind: authority
    status: confirmed
    fact: The governing export-control rule permits emergency processing that skips some interagency review.
  - id: F6
    kind: authority
    status: confirmed
    fact: The governing rule bars emergency processing when the requesting program office's lack of advance planning caused
      the urgency.
  - id: F7
    kind: authority
    status: confirmed
    fact: The emergency-processing rule's other requirements are met.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    equity: tempo
    favors:
    - O1
    weight: weak
    why: The exercise date creates pressure to use emergency processing, which can shorten the review by skipping some interagency
      review.
  - id: C2
    facts:
    - F4
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The program office submitted the request four months before the exercise, and an unforeseen delay outside its planning
      caused the urgency. The rule's bar therefore does not apply, and its other requirements are met, making emergency processing
      available.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The partner needs the license before the exercise, making timely processing important to its participation. With
      the emergency route available, expedited processing can help address that need.
  reasoning:
    read: The partner needs the license before an exercise that begins in three weeks. The program office drafted and submitted
      the request four months earlier, and an unforeseen delay outside its planning caused the compressed timeline. The trap
      is treating every short timeline as the result of inadequate planning by the requesting office.
    weighing: The exercise deadline and compressed timeline favor emergency processing. The decisive condition is whether
      the requesting office's lack of advance planning caused the urgency. Here, the program office submitted the request
      four months before the exercise, and an unforeseen delay outside its planning caused the urgency. The rule's bar does
      not apply, and its other requirements are met. Emergency processing is therefore available, and the deadline and partner's
      need support using it.
    tradecraft: Use emergency processing. Record the request's submission chronology, the external cause of the urgency, and
      the basis for finding that the rule's requirements are met.
    uncertainty: The stated facts establish that the program office submitted the request four months earlier, that an unforeseen
      delay outside its planning caused the urgency, and that the rule's other requirements are met; no unresolved factual
      uncertainty is presented.
    handoff: The licensing division chief should make the licensing-process decision on this record. No separate referral
      or additional decision-maker is identified for this choice.
    tempting_wrong:
      option: O2
      pull: Normal review may appear prudent because emergency processing skips some interagency review.
      why_wrong: The stated rule permits emergency processing when the program office's lack of advance planning did not cause
        the urgency and the other requirements are met. Those conditions hold here, while the exercise deadline and partner's
        need support using the expedited route.
    rejected:
      O2: 'Normal review is not required by the stated planning-based bar: the program office submitted the request four months
        earlier, an unforeseen delay outside its planning caused the urgency, and the rule''s other requirements are met.'
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The urgency was caused by the program office's lack of advance planning, or the emergency-processing rule's other
        requirements were not met.
      then: O2
      why: If the program office's lack of advance planning caused the urgency, the rule bars emergency processing; if the
        other requirements were not met, the route would also be unavailable. Normal review would then be appropriate.
    would_not_change:
    - id: noflip1
      if: The exercise remained three weeks away while an unforeseen delay outside the program office's planning caused the
        urgency and the rule's other requirements were met.
      why: The time pressure would remain, and the rule's bar would still not apply because the program office did not create
        the urgency through inadequate planning.
    watch_for:
    - id: watch1
      what: Evidence about whether the program office's submission of the request four months earlier, or an unforeseen circumstance
        outside its planning, caused the compressed timeline.
      favors:
      - O1
      - O2
      why: The causal link determines whether the rule's bar on emergency processing applies.
  lesson: An imminent exercise can support emergency export-control processing when the urgency was not caused by the requesting
    program office's lack of advance planning and the rule's other requirements are met.
  limits: This conclusion concerns the emergency-processing rule on the stated facts. It does not determine whether another
    licensing authority or exception applies, or resolve a case in which the program office caused the urgency or the rule's
    other requirements were not met.
