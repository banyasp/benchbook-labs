case:
  id: DR-XFER-CORPUS-NS-b39d38e4-E51-B@v1
  title: Recovered Materiel Offered to an Attaché
  status: draft
  setting: 'At a public ceremony where a host defense minister presents recovered adversary materiel to a U.S. defense attaché;
    time: upon presentation; institution: a U.S. embassy and the Department of Defense.'
  decider: The defense attaché
  agent: The defense attaché
  agent_role: decide
  situation: At a public ceremony, a host defense minister presents the U.S. defense attaché with a fragment of an adversary
    drone recovered by host forces. Host officials say that refusal would embarrass the minister. The embassy assesses that
    refusal could set back basing talks. Department rules address receipt of foreign materiel when refusal would harm relations.
    The attaché must decide how to respond at the ceremony; any materiel received is subject to reporting and transfer procedures.
  question: What should the defense attaché do about the recovered materiel at the ceremony?
  options:
    O1:
      do: The attaché declines the fragment.
      move: act
      irreversible: false
    O2:
      do: The attaché asks the embassy's legal office for guidance before responding to the host officials.
      move: ask
      irreversible: false
      to: the embassy's legal office
    O3:
      do: The attaché accepts the fragment on behalf of the United States, reports it, and transfers it to the exploitation
        authority with a custody record.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A host defense minister has presented the U.S. defense attaché with a fragment of an adversary drone recovered by
      host forces.
  - id: F2
    kind: situation
    status: confirmed
    fact: The presentation occurs at a public ceremony, and the attaché must respond there.
  - id: F3
    kind: situation
    status: assessed
    fact: Host officials assess that refusing the fragment would embarrass the minister.
  - id: F4
    kind: situation
    status: assessed
    fact: The embassy assesses that refusal could set back basing talks.
  - id: F5
    kind: authority
    status: confirmed
    fact: Department rules permit attachés to receive foreign materiel when refusal would harm relations.
  - id: F6
    kind: authority
    status: confirmed
    fact: Materiel received under this rule must be accepted on behalf of the United States.
  - id: F7
    kind: authority
    status: confirmed
    fact: Received materiel must be reported and transferred to the exploitation authority with a custody record.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: partner_relationship
    favors:
    - O3
    weight: strong
    why: The assessed risks of embarrassing the host minister and setting back basing talks support receiving rather than
      declining the fragment.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The rule permits receipt when refusal risks harm to relations, and requires receipt on behalf of the United States.
  - id: C3
    facts:
    - F7
    equity: policy_compliance
    favors:
    - O3
    weight: strong
    why: Receipt under the rule carries reporting, transfer, and custody-record obligations, which O1 expressly includes.
  reasoning:
    read: This is an alliance-relations decision at the point of presentation, not a choice to take the fragment for personal
      possession. The trap is treating refusal as automatically safer or more proper even though it may embarrass the host
      minister or harm bilateral relations.
    weighing: The assessed risks to the relationship {C1} activate the rule permitting receipt, and the guidance recommends
      receiving the materiel in these circumstances. Receipt must be on behalf of the United States, not personally {C2},
      and must be followed by reporting, transfer to the exploitation authority, and a custody record {C3}. The balance depends
      on the stated risk that refusal could embarrass the host or set back basing talks.
    tradecraft: If accepting, make clear that the fragment is accepted on behalf of the United States, then report and transfer
      it to the exploitation authority with a custody record under applicable procedures.
    uncertainty: The rule turns on whether refusal would harm relations. The facts assess embarrassment and a possible setback
      to basing talks; the rule gives no further test for resolving their likelihood.
    handoff: The stated rule does not make prior consultation a condition of receipt. The attaché should use the applicable
      reporting, transfer, and custody-record process; seek legal guidance if the relationship-risk assessment or applicable
      procedure is unclear.
    tempting_wrong:
      option: O1
      pull: Declining may seem like the simplest way to avoid taking foreign materiel personally.
      why_wrong: The rule recommends receiving materiel when refusal could harm relations, while requiring that receipt be
        on behalf of the United States.
    rejected:
      O2: The rule provides a direct receipt path for the stated relationship risks and does not make prior legal consultation
        a prerequisite.
      O1: Declining is contrary to the rule's recommendation when refusal could embarrass the host or harm relations.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The relationship-risk assessment changes so that refusal is not expected to embarrass the host and would not harm
        relations or set back basing talks.
      then: O2
      why: The stated relationship basis for this recommendation would no longer apply; the attaché should seek guidance on
        the applicable ordinary rules for foreign materiel rather than assume this exception controls.
    would_not_change:
    - id: noflip1
      if: The Department's applicable reporting, transfer, or custody procedures specify a particular process for handling
        received materiel.
      why: That process governs how to carry out receipt; it does not displace the recommendation to receive the materiel
        when the stated relationship risks are present.
    watch_for: []
  lesson: 'When declining foreign materiel could embarrass a host or harm alliance relations, the guidance recommends receiving
    it on behalf of the United States rather than declining it. Receipt is not personal possession: report and transfer the
    materiel to the exploitation authority with a custody record under applicable procedures.'
  limits: This reasoning applies to the stated foreign-materiel scenario where refusal risks embarrassment or harm to relations.
    It does not resolve the rules for materiel where those relationship risks are absent or where another applicable requirement
    controls.
