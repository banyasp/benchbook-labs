case:
  id: DR-XFER-CORPUS-NS-b39d38e4-E45-B@v1
  title: Late Congressional Notification
  status: draft
  setting: An unnamed intelligence agency, Washington, D.C., the week before a foreign election.
  decider: The agency general counsel
  agent: The agency general counsel
  agent_role: decide
  situation: An agency program office is preparing a significant activity timed for the week before a foreign election. The
    intelligence committees have not yet been notified. Agency rules permit delayed notification in exigent circumstances,
    while internal policy restricts use of that exception when the agency's own failure to prepare or transmit notice in time
    caused the urgency. A draft notification was ready ten weeks earlier but was not sent. The general counsel must decide
    whether the exception is available before the activity proceeds.
  question: What should the agency general counsel do about congressional notification before the activity proceeds?
  options:
    O1:
      do: The agency general counsel declines the exigency exception and ensures notification through the normal process before
        the activity proceeds.
      move: act
      irreversible: false
    O2:
      do: The agency general counsel approves invoking the exigency exception to delay notification of the intelligence committees.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The program office is preparing a significant activity requiring notification to the intelligence committees.
  - id: F2
    kind: situation
    status: confirmed
    fact: The activity is timed for the week before a foreign election.
  - id: F3
    kind: situation
    status: confirmed
    fact: A draft notification for the activity was ready ten weeks earlier.
  - id: F4
    kind: situation
    status: confirmed
    fact: The program office did not transmit the completed draft notification.
  - id: F5
    kind: authority
    status: confirmed
    fact: Agency notification rules permit delaying notice to the intelligence committees in exigent circumstances.
  - id: F6
    kind: authority
    status: confirmed
    fact: The normal notification process requires notice to the committees before the activity proceeds.
  - id: F7
    kind: authority
    status: confirmed
    fact: Agency policy bars use of the exigency exception when the agency's failure to prepare or transmit notice in time
      caused the urgency.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The notification chronology attributes the compressed notice window to the program office's failure to transmit
      the prepared draft.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The approaching election creates pressure to use the exigency exception, which can permit delayed committee notification
      when circumstances require it.
  - id: C2
    facts:
    - F3
    - F4
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: Agency policy bars the exception when the agency's failure to prepare or transmit notice in time caused the urgency.
      The draft was ready ten weeks earlier, and the notification chronology attributes the compressed window to its not being
      sent.
    rules_out:
    - O1
  - id: C3
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The activity is timed to occur before the election, making timely execution important. That need does not override
      the restriction on using exigency when the agency created the compressed notification window through its own failure
      to act in time.
  reasoning:
    read: 'The agency faces a compressed notification window for an activity timed before the election, but the urgency is
      not independent of the agency''s conduct: a draft was ready ten weeks earlier and was not sent. The trap is treating
      the short time remaining, by itself, as enough to justify delayed notification under the exception.'
    weighing: The election timing and limited time create a reason to consider the exigency exception, but the decisive condition
      is whether agency failure to prepare or transmit notice caused the urgency. The notification chronology attributes the
      compressed window to the program office's failure to send the completed draft, so the exception is unavailable under
      agency policy. The balance depends on whether the agency caused the urgency, not merely on how soon the activity is
      scheduled.
    tradecraft: Decline the exigency exception and ensure notification through the normal process before the activity proceeds.
      Record the notification chronology and the basis for concluding that the exception is unavailable.
    uncertainty: The stated facts identify the earlier completed draft, its non-transmission, and the assessed causal link
      to the compressed notification window; no unresolved factual uncertainty is presented.
    handoff: The agency general counsel should make the decision on this record. No separate referral or additional decision-maker
      is identified for this choice.
    tempting_wrong:
      option: O2
      pull: The activity's timing before the election makes delayed notification appear to be the fastest way to avoid disrupting
        the schedule.
      why_wrong: Speed cannot validate use of the exigency exception when the agency's failure to transmit the prepared notice
        created the urgency.
    rejected:
      O2: The exigency exception cannot justify delayed notification because the agency's failure to transmit the completed
        draft created the compressed window.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The urgency arose from circumstances not created by the agency's notification preparation or transmission, and the
        exigency exception's other requirements were met.
      then: O2
      why: Without agency-created urgency, the policy bar would not apply, and the exception could permit delayed notification
        in the available time.
    would_not_change:
    - id: noflip1
      if: The activity remained scheduled for the week before the election while the agency's failure to transmit the earlier
        draft still caused the compressed notification window.
      why: The time pressure would remain, but it would not remove the stated bar on using the exception for urgency created
        by the agency's own failure to act in time.
    watch_for:
    - id: watch1
      what: Evidence about whether the program office's failure to transmit the completed draft ten weeks earlier caused the
        compressed notification window.
      favors:
      - O2
      why: That causal link determines whether agency policy bars use of the exigency exception.
  lesson: A time-sensitive activity does not, by itself, justify delaying congressional notification under an exigency exception.
    When the agency's failure to prepare or transmit notice in time created the urgency, the exception cannot be used to delay
    notification.
  limits: This conclusion concerns the exigency exception on the stated facts. It does not determine whether another notification
    authority applies or resolve a case in which the urgency was not caused by agency failure to prepare or transmit notice
    in time.
