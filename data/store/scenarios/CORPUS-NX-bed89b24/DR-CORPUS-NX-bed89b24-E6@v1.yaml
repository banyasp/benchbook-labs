case:
  id: DR-CORPUS-NX-bed89b24-E6@v1
  title: AFSA’s Headquarters Site Decision
  status: draft
  setting: Outside metropolitan Washington, after 1949, AFSA.
  decider: AFSA
  agent: AFSA
  agent_role: decide
  situation: By 1949, AFSA had outgrown temporary buildings and converted dormitories at Arlington Hall Station. After the
    Soviet Union’s first nuclear test, the Joint Chiefs of Staff directed AFSA to identify a standby or disaster site outside
    metropolitan Washington. AFSA’s space needs and standby-site requirement were combined. Fort Knox was selected for a new
    headquarters and operations building. The prospect of massive civilian resignations became apparent.
  question: 'What should AFSA do about the Fort Knox selection: approve it and close the site search, or reject it and resume
    the search?'
  options:
    O1:
      do: AFSA rejects Fort Knox and resumes the site search.
      move: act
      irreversible: false
    O2:
      do: AFSA approves Fort Knox and closes the site search.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: By 1949, AFSA had outgrown its temporary buildings.
  - id: F2
    kind: situation
    status: confirmed
    fact: AFSA had outgrown converted dormitories at Arlington Hall Station.
  - id: F3
    kind: situation
    status: confirmed
    fact: The direction to identify a standby or disaster site followed the Soviet Union’s first nuclear test.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Joint Chiefs of Staff directed AFSA to identify a standby or disaster site outside metropolitan Washington.
  - id: F5
    kind: situation
    status: confirmed
    fact: AFSA’s space needs and standby-site requirement were combined.
  - id: F6
    kind: situation
    status: confirmed
    fact: Fort Knox was selected for a new headquarters and operations building.
  - id: F7
    kind: situation
    status: assessed
    fact: The prospect of massive civilian resignations became apparent.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: AFSA had outgrown its existing buildings, creating a need for a new headquarters and operations site.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The space need was combined with the Joint Chiefs' direction to identify a standby or disaster site outside metropolitan
      Washington, and Fort Knox was selected to meet the combined need.
  - id: C3
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The prospect of massive civilian resignations became apparent, and AFSA reversed the Fort Knox decision. The account
      identifies that workforce consequence as the reason the selection was reversed.
  reasoning:
    read: AFSA faced both an immediate space problem and a directed need for a standby or disaster site. The trap is treating
      Fort Knox's selection as final despite the later-apparent prospect of massive civilian resignations, which led AFSA
      to reverse it.
    weighing: The space shortage and the standby-site requirement explain why AFSA selected Fort Knox {C1} {C2}. But the source
      identifies the prospect of massive civilian resignations as the reason AFSA reversed that selection {C3}. The balance
      therefore favors resuming the search; the source does not explain why Fort Meade was ultimately chosen or compare other
      sites.
    tradecraft: Record the reversal and its stated reason, and keep the original space and standby-site requirements visible
      in any renewed site assessment. Do not attribute a rationale to Fort Meade that the account does not provide.
    uncertainty: The account gives no estimate of the number of expected resignations, no comparison of alternative sites,
      and no further explanation of the Fort Meade decision.
    handoff: AFSA should make and document the site decision in light of the Joint Chiefs' direction; the account does not
      identify a separate approval authority or require a further referral.
    tempting_wrong:
      option: O2
      pull: Fort Knox had already been selected to address AFSA's space needs and standby-site requirement.
      why_wrong: The source records that AFSA reversed that selection once the prospect of massive civilian resignations became
        apparent.
    rejected:
      O2: AFSA did not close the search on Fort Knox because the prospect of massive civilian resignations became apparent.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The prospect of massive civilian resignations were no longer present.
      then: O2
      why: Without the stated reason for reversing the selection, the space and standby-site needs would weigh in favor of
        proceeding with Fort Knox.
    would_not_change:
    - id: noflip1
      if: AFSA still needed more space and a standby site outside metropolitan Washington, while the prospect of massive civilian
        resignations remained apparent.
      why: Those operational needs explain the Fort Knox selection, but the source's stated reason for reversing it would
        remain.
    watch_for:
    - id: watch1
      what: Whether the prospect of massive civilian resignations remains apparent.
      favors:
      - O1
      why: That prospect is the stated reason AFSA reversed the Fort Knox selection.
  lesson: A site that meets operational requirements may still be unsuitable if its selection risks a major workforce loss.
    Keep the operational need in view, but reconsider the selection when a consequential workforce effect becomes apparent.
  limits: The account gives no figures, alternatives analysis, or detailed assessment of the resignation prospect. It does
    not support an inference about why Fort Meade was ultimately selected.
