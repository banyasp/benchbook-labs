case:
  id: DR-CORPUS-CHILCOT-NX-249d4566-E59@v1
  title: Fitness Assessment for Iraq Postings
  status: draft
  setting: FCO Human Resources Directorate, February 2006, concerning personnel posting to or visiting Iraq.
  decider: FCO HRD officials
  agent: FCO HRD officials
  agent_role: decide
  situation: The FCO HRD is reviewing procedures for hostile environment training and medical clearance. Some FCO personnel
    posting to or visiting Iraq may not be capable of meeting the physical requirements. The decision concerns whether fitness
    should be assessed before or after a posting appointment. It also concerns the role of hostile environment course instructors
    in commenting on fitness to deploy.
  question: What should FCO HRD officials do about when and how to assess fitness for a posting to Iraq?
  options:
    O1:
      do: The FCO HRD asks the Medical Examiner for advice on clearance timing before setting the posting procedure.
      move: ask
      irreversible: false
      to: the Medical Examiner
    O2:
      do: The FCO HRD waives pre-appointment medical confirmation, leaves fitness confirmation until after appointment, and
        has course instructors comment on fitness to deploy.
      move: act
      irreversible: false
    O3:
      do: The FCO HRD requires the Medical Examiner to confirm fitness before appointment and course instructors to comment
        on fitness to deploy.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The FCO HRD reviewed procedures on 16 February 2006.
  - id: F2
    kind: situation
    status: confirmed
    fact: The review covered hostile environment training procedures.
  - id: F3
    kind: situation
    status: confirmed
    fact: The review covered medical clearance procedures.
  - id: F4
    kind: capability
    status: assessed
    fact: There were concerns that some FCO personnel posting to Iraq might not be capable of meeting the physical requirements.
  - id: F5
    kind: capability
    status: assessed
    fact: There were concerns that some FCO personnel visiting Iraq might not be capable of meeting the physical requirements.
  - id: F6
    kind: situation
    status: confirmed
    fact: The procedures under review concerned personnel deploying to or visiting Iraq.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: The capability concerns make fitness relevant to whether personnel can safely meet the demands of deployment; the
      reported risk was to personnel themselves and others.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: The officials chose to have the Medical Examiner confirm fitness before appointment, rather than after it, addressing
      the timing of medical clearance before a posting decision.
  - id: C3
    facts:
    - F2
    - F4
    - F5
    equity: own_force_life
    favors:
    - O3
    weight: weak
    why: The officials also included hostile-environment course instructors’ comments on fitness to deploy, adding a training-related
      input to the fitness procedure.
  reasoning:
    read: This is a procedural decision about when fitness should be assessed and what input should inform that assessment—not
      a finding that any particular person was unfit. The concern was that some personnel might not meet Iraq’s physical demands;
      a reported view about staff already at post described low fitness and limited mobility as a possible danger to themselves
      and others. The trap is to treat appointment as something that can safely precede fitness confirmation despite that
      concern.
    weighing: The reported capability concerns support resolving medical fitness before appointment, and the officials expressly
      adopted that timing. They also assigned course instructors a role in commenting on fitness to deploy. The balance depends
      on the concern being relevant to safe deployment; the source records it as a concern and a subjective judgment, not
      as a documented assessment of each individual.
    tradecraft: Apply the Medical Examiner confirmation before the appointment decision and obtain the course instructors’
      comments on fitness to deploy. Keep those roles distinct, and record the fitness information and how it informed the
      decision without treating a course comment as a medical confirmation.
    uncertainty: The material gives no individual medical findings, fitness criteria, or account of how instructors should
      form their comments. The reported concern about staff already at post is expressly subjective.
    handoff: The HRD officials decide the procedure; the Medical Examiner supplies the pre-appointment fitness confirmation
      and hostile-environment course instructors comment on fitness to deploy. The source assigns those inputs but does not
      describe a further approval or referral.
    tempting_wrong:
      option: O2
      pull: It retains instructor comments while avoiding a pre-appointment medical confirmation.
      why_wrong: It leaves fitness confirmation until after appointment, contrary to the timing the officials chose in response
        to concerns about meeting the physical demands.
    rejected:
      O1: The officials agreed a procedure requiring pre-appointment confirmation rather than deferring the procedure to seek
        advice about timing.
      O2: The officials did not waive pre-appointment medical confirmation; they specified that the Medical Examiner should
        confirm fitness before, not after, appointment.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Medical Examiner advised that pre-appointment confirmation could not be carried out reliably or safely under
        the available procedure.
      then: O1
      why: Seeking the Examiner’s advice before setting the procedure would then be a reasonable way to resolve the timing
        problem rather than adopting an unworkable requirement.
    would_not_change:
    - id: noflip1
      if: The concern about existing staff’s fitness is based on subjective judgment rather than an individual medical finding.
      why: That qualification alone would not undo the officials’ decision to require pre-appointment confirmation and instructor
        comments in response to the reported safety concern.
    watch_for:
    - id: watch1
      what: Whether the Medical Examiner confirms an individual’s fitness before the posting appointment.
      favors:
      - O3
      why: That is the pre-appointment input the officials required in response to the capability concerns.
  lesson: When a posting’s physical demands raise credible safety concerns, assess fitness before the appointment rather than
    postponing confirmation until afterward. Use relevant training input as an additional comment, while keeping its role
    distinct from medical confirmation.
  limits: The source addresses the timing and inputs for fitness assessment in the Iraq posting and visiting context. It does
    not specify fitness standards, individual outcomes, or the separate health-surveillance and post-tour arrangements.
  library:
    domain: security-clearance
    family: CORPUS-CHILCOT
    source: https://assets.publishing.service.gov.uk/media/5a747da3ed915d0e8e3989c3/The_Report_of_the_Iraq_Inquiry_-_Volume_XI.pdf
    episode_focus: The decision concerns whether and when to assess fitness for a dangerous posting, following concerns that
      some staff might not meet its physical demands. Exclude the separate health-surveillance and post-tour assessment arrangements.
