case:
  id: DR-CORPUS-CHILCOT-NX-fe3dbf91-E46@v1
  title: Immediate Action or a Phased Security Plan
  status: draft
  setting: Basra, Iraq, 23 March 2008, Iraqi Government and MCNS
  decider: The Iraqi Prime Minister
  agent: The Iraqi Prime Minister
  agent_role: decide
  situation: A proposed Basra security plan called for building Iraqi security-force capability, a defined period for voluntary
    weapons surrender, and a later confrontation phase. The Iraqi Government and US leadership supported the plan, which was
    intended for later in the year. Military planning work was under way to make the plan workable and not unduly forceful.
    Basra was tense, with sporadic violence between Iraqi security forces and JAM, including assassinations of senior police
    officers. The Prime Minister had received security reports described as exaggerated, while some people of consequence
    had been assassinated. He considered the proposed plan too slow and too late to assert government authority before provincial
    elections. Officials assessed that the OMS might break its truce in response to the Prime Minister’s presence in Basra.
  question: What should the Iraqi Prime Minister do about whether to initiate immediate security action in Basra?
  options:
    O1:
      do: The Iraqi Prime Minister should defer and seek an updated assessment from security leaders.
      move: ask
      irreversible: false
      to: security leaders
    O2:
      do: The Iraqi Prime Minister should authorize an immediate security operation in Basra.
      move: act
      irreversible: true
    O3:
      do: The Iraqi Prime Minister should implement the proposed phased security plan for Basra.
      move: act
      irreversible: true
    O4:
      do: The Iraqi Prime Minister should decline an immediate security operation in Basra.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The proposed Basra plan had a preparation phase, a defined disarmament period with incentives for voluntary surrender,
      and a later confrontation phase.
  - id: F2
    kind: situation
    status: assessed
    fact: The Iraqi Government and US leadership supported the plan to confront Basra’s militias later in the year.
  - id: F3
    kind: situation
    status: assessed
    fact: Military planning was focused on making the Basra plan workable and not unduly forceful.
  - id: F4
    kind: situation
    status: confirmed
    fact: Basra had seen sporadic violence between Iraqi security forces and JAM, including assassinations of senior police
      officers.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Prime Minister had received reports of worsening local security that were described as exaggerated; some people
      of consequence to him had been assassinated.
  - id: F6
    kind: situation
    status: assessed
    fact: The Prime Minister regarded the proposed plan as too slow and too late to assert government authority before provincial
      elections.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Officials assessed that the OMS was considering breaking its truce in Basra in response to the Prime Minister’s
      presence there.
  - id: F8
    kind: situation
    status: assessed
    fact: Before the decision, the Prime Minister characterized the situation in Basra as having deteriorated and spoke of
      going there with additional forces.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    - F8
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The Prime Minister viewed the situation as deteriorating and the later plan as too slow to assert government authority
      before provincial elections; waiting risked missing the political and security window he considered important.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Prime Minister considered immediate action necessary to demonstrate government authority, amid violence and assassinations
      of people of consequence to him.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: escalation_control
    favors:
    - O1
    - O3
    weight: strong
    why: The supported phased plan allowed preparation, voluntary surrender, and a later confrontation intended to be workable
      and not unduly forceful; officials also assessed that the Prime Minister's presence might prompt the OMS to break its
      truce.
  - id: C4
    facts:
    - F5
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The security reports reaching the Prime Minister were described as exaggerated, which supported checking the assessment
      before acting, although the assassinations and his separate assessment gave him reasons for concern.
  reasoning:
    read: The decision was whether to act immediately or await the supported phased plan, not whether Basra needed a security
      response at all. The central tension was the Prime Minister's judgment that delay would undermine government authority
      before elections against the risk that immediate action could aggravate an already tense situation and provoke a truce
      breakdown.
    weighing: The Prime Minister's stated view that the plan was too slow and too late, alongside reported violence and assassinations,
      weighs toward O2 {C1} {C2}. The phased plan's support and its effort to avoid undue force, as well as the assessed risk
      to the truce, weigh toward O1 or O3 {C3}. The reports described as exaggerated make an updated assessment a plausible
      caution, but do not erase the Prime Minister's separate assessment of deterioration {C4}. On the source's recorded balance,
      urgency and the assertion of government authority prevailed.
    tradecraft: 'Before acting, make the decision basis explicit: what is known, what remains an assessment, why delay is
      unacceptable, and what escalation risks have been considered. Consult the responsible security leadership and relevant
      government and coalition counterparts, and preserve a contemporaneous record of the decision and its rationale.'
    uncertainty: The Prime Minister had received reports characterized as exaggerated, and officials assessed that the OMS
      might break its truce. The record also describes the immediate decision as unexpected to coalition leadership; it does
      not establish that those risks had been resolved before the decision.
    handoff: 'The Prime Minister was the decision-maker, but should involve security leaders and relevant Iraqi Government
      and coalition counterparts: military planning was under way, the plan had their support, and the decision carried risks
      beyond the Prime Minister''s own assessment.'
    tempting_wrong:
      option: O3
      pull: The phased approach had government and US support and was being developed to be workable and not unduly forceful.
      why_wrong: The Prime Minister judged that its later timetable would be too slow to assert government authority before
        provincial elections, so adopting it as proposed would not meet the urgency he identified.
    rejected:
      O1: Deferring for another assessment would address concerns about exaggerated reporting, but would not meet the Prime
        Minister's stated need to act before provincial elections.
      O3: The phased plan offered a supported, less immediate course, but the Prime Minister judged it too slow and too late.
      O4: Declining immediate action would not address the Prime Minister's assessment that the situation had deteriorated
        and government authority needed to be asserted.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A fresh, reliable assessment showed that the security situation was not deteriorating and that the phased plan could
        assert government authority in time for the elections.
      then: O3
      why: That would weaken the stated urgency for immediate action while preserving the supported, staged approach.
    - id: flip2
      if: Further assessment established that an immediate operation was likely to trigger a severe escalation and that deferral
        would not materially compromise government authority.
      then: O1
      why: The escalation risk would outweigh the time pressure and make obtaining an updated assessment preferable.
    would_not_change:
    - id: noflip1
      if: The Iraqi Government and US leadership continued to support the later phased plan, without changing the Prime Minister's
        judgment that it was too slow for the election timetable.
      why: Support for the plan alone would not remove the urgency that drove the Prime Minister's decision.
    watch_for:
    - id: watch1
      what: Whether security leaders and coalition counterparts are aligned on the timing and whether the assessed threat
        to the truce is changing.
      favors:
      - O1
      - O3
      why: The decision was unexpected to coalition leadership, and officials had assessed a possible truce break; changes
        in coordination or escalation risk could affect the balance.
  lesson: When a decision-maker believes delay will forfeit a time-critical opportunity to assert lawful government authority,
    that urgency can outweigh a supported, less forceful staged plan. But reports of uncertain reliability and a foreseeable
    risk of escalation should be made explicit, tested where time permits, and weighed rather than treated as settled facts.
  limits: This reasoning reflects the Prime Minister's recorded judgment about timing, security, and political authority;
    it does not establish that the operation was lawful, effective, or proportionate in its execution. It does not determine
    what should be done where the governing authority, threat assessment, or foreseeable risks differ.
