case:
  id: DR-CORPUS-CHILCOT-NX-249d4566-E44@v1
  title: Civilian Repatriation and Arrival Arrangements
  status: draft
  setting: Iraq, 7 April 2003, Ministry of Defence
  decider: The senior MOD official who requested the advice
  agent: The senior MOD official who requested the advice
  agent_role: decide
  situation: The senior MOD official has urgently requested advice on arrangements for civilian deaths in Iraq. MOD civilians
    and accredited journalists are being considered for different treatment under an overarching policy that also applies
    to service personnel. MOD civilians are Crown servants serving in direct support of the military in a theatre of war.
    The proposed arrangements return MOD civilians to the UK alongside service personnel and provide the same treatment on
    arrival, including ceremony if the next of kin wish. For accredited journalists, the proposal is to fly their bodies home
    without ceremony.
  question: What should the senior MOD official do about the proposed repatriation and arrival arrangements for MOD civilians
    and accredited journalists?
  options:
    O1:
      do: The senior MOD official rejects the proposed arrangements and adopts common repatriation and arrival treatment,
        including ceremony, for both groups.
      move: act
      irreversible: false
    O2:
      do: The senior MOD official approves the proposed arrangements, returning MOD civilians with service personnel and flying
        accredited journalists home without ceremony.
      move: act
      irreversible: false
    O3:
      do: The senior MOD official asks the MOD Personnel Director for further advice on civilian repatriation arrangements
        before making a policy decision.
      move: ask
      irreversible: false
      to: The MOD Personnel Director
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The senior MOD official urgently requested advice on arrangements for civilian deaths.
  - id: F2
    kind: situation
    status: assessed
    fact: The MOD Personnel Director explained that MOD civilians and accredited war correspondents would be subject to the
      same overarching policy as service personnel.
  - id: F3
    kind: situation
    status: confirmed
    fact: The proposal was to return MOD civilians to the UK alongside service personnel and give them the same treatment
      on arrival, including ceremony if their next of kin wished.
  - id: F4
    kind: situation
    status: confirmed
    fact: MOD civilians were Crown servants operating in direct support of the military in a theatre of war.
  - id: F5
    kind: situation
    status: assessed
    fact: The MOD Personnel Director considered that offering MOD civilian families less treatment might cause offence or
      embarrassment.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposal for accredited journalists was to fly their bodies home without ceremony.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: The proposal treats MOD civilians alongside service personnel, consistent with the overarching policy, and their
      direct support to the military in a theatre of war is the stated basis for that treatment.
  - id: C2
    facts:
    - F3
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The same arrival treatment, including ceremony when next of kin wish it, avoids offering MOD civilian families less
      treatment that might cause offence or embarrassment.
  - id: C3
    facts:
    - F2
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The proposal distinguishes accredited journalists from MOD civilians by providing for their return home without ceremony;
      the source records this distinction but does not state a separate rationale for it.
  reasoning:
    read: 'This is an administrative decision about repatriation and treatment on arrival, not a decision about battlefield
      conduct. The overarching policy applies to both groups, but that does not mean the proposed arrangements are identical:
      MOD civilians directly support the military, while accredited journalists are assigned a more limited arrival arrangement.'
    weighing: 'The stated reasons support approving the proposal: MOD civilians are Crown servants in direct military support,
      and giving their families less treatment could cause offence or embarrassment. The source records flying accredited
      journalists home without ceremony as the proposed distinction, but gives no further reason for that limit. The senior
      official approved the proposals, so the balance favors {O2}, while the journalist distinction should not be given a
      rationale the source does not provide.'
    tradecraft: Record the different arrangements by group, preserve the next-of-kin choice about ceremony for MOD civilians,
      and make clear that the journalist arrangement is repatriation without ceremony. These are implementation safeguards,
      not additional reasons stated for the decision.
    uncertainty: The source does not explain why accredited journalists were to receive no ceremony, or whether their families'
      wishes were considered. It does establish the proposed arrangements and their approval.
    handoff: The senior MOD official who requested advice made the decision after receiving the Personnel Director's advice;
      no further referral is indicated.
    tempting_wrong:
      option: O1
      pull: It may seem fairer to give both groups identical arrival treatment.
      why_wrong: The source's endorsed approach distinguishes MOD civilians, who directly support the military, from accredited
        journalists; extending the MOD civilian ceremony arrangement to journalists would reject that proposed distinction
        without a stated basis.
    rejected:
      O1: It was not chosen because the approved proposal gave accredited journalists a different, no-ceremony arrangement
        from MOD civilians.
      O3: It was not chosen because the Personnel Director had provided the requested advice and the senior official approved
        the proposals.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: MOD civilians were not Crown servants operating in direct support of the military in a theatre of war.
      then: O3
      why: The stated basis for treating MOD civilians alongside service personnel would no longer be established, making
        further advice appropriate before deciding on parity.
    would_not_change:
    - id: noflip1
      if: A MOD civilian's next of kin did not wish to have a ceremony on arrival.
      why: The approved proposal already makes ceremony conditional on the next of kin's wish, so this would not require rejecting
        the arrangements.
    watch_for:
    - id: watch1
      what: Whether the next of kin of MOD civilians wish to have a ceremony on arrival.
      favors:
      - O2
      why: Their wishes determine whether the conditional ceremony in the approved arrangement is provided.
  lesson: When deciding how to treat civilian deaths, distinguish the groups' roles and apply the stated policy consistently
    where the source gives a basis for doing so. Attend to foreseeable effects on families, while not inventing a justification
    for distinctions the decision record leaves unexplained.
  limits: This reasoning concerns the stated repatriation and arrival arrangements in this particular MOD decision. It does
    not establish a general rule that accredited journalists should never receive ceremony or that every civilian death must
    be handled like a service death.
  library:
    domain: gov-ethics
    family: CORPUS-CHILCOT
    source: https://assets.publishing.service.gov.uk/media/5a747da3ed915d0e8e3989c3/The_Report_of_the_Iraq_Inquiry_-_Volume_XI.pdf
    episode_focus: The decision distinguished MOD civilians serving in direct support of the military from accredited journalists,
      and weighed consistent treatment and the possible impact on families against a more limited policy for journalists.
      Keep the focus on the ethical and administrative treatment decision, not battlefield circumstances.
