case:
  id: DR-CORPUS-CHILCOT-NX-b15898a1-E34@v1
  title: UK Participation in a Proposed Allied Action
  status: draft
  setting: United Kingdom, January–February 2001, ministerial consideration of participation in an allied action associated
    with the southern No-Fly Zone.
  decider: The UK ministers responsible for foreign and defence policy
  agent: The UK ministers responsible for foreign and defence policy
  agent_role: decide
  situation: In early 2001, UK ministers were considering whether the UK should join a proposed US-led use of force associated
    with enforcement of the southern No-Fly Zone. Officials presented the action as addressing an increased danger to aircraft
    from Iraqi air defences, and had considered its legality, proportionality and risk of civilian casualties. The Attorney
    General initially made approval conditional on a categorical assurance that ending the zones would lead to humanitarian
    distress comparable to that of 1991–92; officials said they could not honestly provide that assurance. Officials later
    assessed a high risk of extreme humanitarian distress if operations ceased, while acknowledging uncertainty and that the
    assessment could change if alternatives emerged. The Attorney General considered that the legal argument for maintaining
    the zones remained possible on balance, but described it as a very fine judgement and required efforts to avoid civilian
    casualties. Ministers also faced warnings that non-participation could cause a serious disagreement with the US and increase
    risks to UK pilots.
  question: What should the UK ministers responsible for foreign and defence policy do about UK participation in the proposed
    allied action?
  options:
    O1:
      do: The ministers authorize UK participation in the proposed allied action.
      move: act
      irreversible: true
    O2:
      do: The ministers decline UK participation in the proposed allied action.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An FCO official invited the Foreign Secretary to agree to UK participation in a proposed US-led use of force.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Officials described Iraqi air-defence arrangements as creating increased risk to aircraft operating in the No-Fly
      Zones.
  - id: F3
    kind: situation
    status: confirmed
    fact: The proposed action had been considered for legality, proportionality and risk of civilian casualties.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Attorney General initially said the proposed action could be justified only on an assurance that ending the
      No-Fly Zones would cause humanitarian distress comparable to the crisis that led to their establishment in 1991 and
      1992.
  - id: F5
    kind: situation
    status: confirmed
    fact: Officials said they could not honestly provide the categorical assurance, and the Attorney General regarded the
      existing JIC assessment as insufficient.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Officials assessed an unacceptably high risk of extreme humanitarian distress if southern operations ceased, while
      acknowledging that the consequences could not be predicted with absolute certainty and that the assessment could change
      if alternatives emerged.
  - id: F7
    kind: authority
    status: confirmed
    fact: The stated legal test for force on grounds of overwhelming humanitarian necessity required convincing evidence of
      extreme humanitarian distress, no practicable alternative to force, and necessary and proportionate force strictly limited
      in time and scope.
  - id: F8
    kind: authority
    status: confirmed
    fact: On the basis of the assurances provided, the Attorney General considered that maintaining the No-Fly Zones could
      still be argued justified on balance, but called the judgement a very fine one.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Attorney General required every effort to avoid civilian casualties and stressed that the legal basis was precarious,
      not clearly established in international law, and could not justify action for ulterior motives.
  - id: F10
    kind: situation
    status: assessed
    fact: An official warned that not joining the action risked a major disagreement with the US and increased danger to UK
      pilots.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    - F8
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Officials assessed an unacceptably high risk of extreme humanitarian distress if southern operations ceased. On the
      assurances they provided, the Attorney General considered it still possible on balance to argue that maintaining the
      Zones was justified to prevent a humanitarian crisis.
  - id: C2
    facts:
    - F3
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The legal argument depended on convincing evidence of extreme distress, no practicable alternative, and force that
      was necessary, proportionate, and strictly limited to humanitarian relief. The Attorney General accepted the argument
      only on balance, called it a very fine judgement, required every effort to avoid civilian casualties, and ruled out
      ulterior motives as a justification.
  - id: C3
    facts:
    - F2
    - F10
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Officials assessed that Iraqi air-defence arrangements increased the danger to aircraft in the Zones, and warned
      that non-participation would increase risks to UK pilots. This supported action to address the danger, but did not itself
      establish the humanitarian legal basis.
  - id: C4
    facts:
    - F10
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: Officials warned that declining could cause a major disagreement with the US. That consequence mattered to ministers,
      but alliance management could not replace the required humanitarian and legal justification.
  reasoning:
    read: This was a decision about participation in force associated with the southern No-Fly Zone, with a legal basis the
      Attorney General regarded as precarious rather than clearly established. The central trap was to treat danger to UK
      aircraft or the prospect of disagreement with the US as sufficient justification; the case for action had to rest on
      humanitarian necessity and meet the legal conditions.
    weighing: 'The assessed high risk of extreme humanitarian distress if operations ceased, together with the Attorney General’s
      acceptance that maintaining the Zones could still be justified on balance, supported {O1} {C1}. That support was narrow:
      the legal standard required no practicable alternative and necessary, proportionate force limited to humanitarian relief,
      with every effort to avoid civilian casualties {C2}. The danger to pilots reinforced the case for action {C3}; pressure
      to preserve cooperation with the US was relevant but secondary {C4}. The balance depended on the humanitarian assessment
      and on the action remaining within those legal limits.'
    tradecraft: Keep the humanitarian justification distinct from alliance and force-protection considerations. Record the
      evidence, its uncertainty, the proportionality and civilian-harm assessment, and why no practicable alternative is considered
      available; keep the legal basis under review and seek updated information on humanitarian conditions, alternatives,
      and civilian casualties.
    uncertainty: Officials said they could not predict with absolute certainty what would happen if operations ceased, while
      expressing high confidence in their assessment. The Attorney General regarded the legal judgement as very fine, noted
      reduced international support, and required continued review.
    handoff: Ministers should decide with current advice from the Attorney General and legal advisers, informed by FCO and
      MOD assessments and a humanitarian assessment endorsed at a sufficiently senior level. The source records both the need
      for ministerial judgement and the Attorney General’s role in assessing whether the legal argument could be maintained.
    tempting_wrong:
      option: O1
      pull: Authorize participation principally to avoid a serious disagreement with the US and reduce danger to UK pilots.
      why_wrong: 'Those concerns did not establish the legal basis for force: the Attorney General said the humanitarian justification
        could not support ulterior objectives and depended on necessity and proportionality.'
    rejected:
      O2: Declining was not chosen because officials assessed a high risk of extreme humanitarian distress if operations ceased,
        and the Attorney General ultimately accepted that maintaining the Zones could still be argued justified on balance.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The humanitarian assurance on which the Attorney General’s approval depended no longer held firm.
      then: O2
      why: The Attorney General expressly said he would not approve the target if that assurance no longer held.
    - id: flip2
      if: A practicable alternative emerged that could prevent the humanitarian catastrophe without maintaining the Zones.
      then: O2
      why: An alternative would undermine the claim that force was necessary; officials also said the humanitarian judgement
        could change if alternative arrangements emerged.
    would_not_change:
    - id: noflip1
      if: Officials could not predict the consequences of cessation with absolute certainty.
      why: The assessment acknowledged that uncertainty while still expressing high confidence in the risk of humanitarian
        distress; lack of absolute certainty alone did not displace the assessment.
    - id: noflip2
      if: The principal argument for participation were avoiding political disagreement with the US or protecting UK pilots.
      why: Those considerations could not cure a deficient humanitarian legal basis or justify force for ulterior purposes.
    watch_for:
    - id: watch1
      what: Updated assessments of humanitarian conditions, alternatives to the Zones, and civilian casualties associated
        with operations.
      favors:
      - O2
      why: The Attorney General requested these updates; evidence of workable alternatives or civilian harm could weaken the
        necessity, proportionality, or humanitarian basis for continued force.
  lesson: 'When force is defended on humanitarian necessity, the humanitarian case must carry the legal justification: evidence
    of extreme distress, no practicable alternative, and necessary, proportionate, narrowly limited action. Alliance cohesion
    and force protection may matter to the decision, but cannot substitute for that basis; continuing review and civilian-harm
    precautions are essential where the legal judgement is fine.'
  limits: This reasoning concerns the specific early-2001 decision and the Attorney General’s assessment of the No-Fly Zones
    on the assurances then provided. It does not establish a general or settled international-law right to use force for humanitarian
    purposes, nor does it decide the legality of later operations or different circumstances.
