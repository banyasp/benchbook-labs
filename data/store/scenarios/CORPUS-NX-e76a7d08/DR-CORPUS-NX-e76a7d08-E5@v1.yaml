case:
  id: DR-CORPUS-NX-e76a7d08-E5@v1
  title: Positive Identification at a Training Engagement
  status: draft
  setting: Red Rio range; 31 January 2017; military night close-air-support training sortie.
  decider: The pilot-in-command
  agent: The pilot-in-command
  agent_role: decide
  situation: The pilot was conducting a night close-air-support training sortie at Red Rio range. The intended object of the
    simulated engagement was an SA-8 training target, while a ground element was at another location. Before the final decision,
    the pilot had two unsuccessful attempts and had expressed confusion about what he was seeing. The instructor pilot had
    provided limited monitoring and instruction, and had not verified the pilot’s identification. At the final decision point,
    the instructor pilot cleared the engagement while the pilot’s onboard systems indicated the intended training target.
    The pilot-in-command was responsible for positively identifying the target before an engagement.
  question: What should the pilot-in-command do at the final engagement decision when confused about the identification, cleared
    by the instructor, and receiving onboard indications of the intended training target?
  options:
    O1:
      do: The pilot-in-command declines the cleared engagement and does not proceed.
      move: act
      irreversible: false
    O2:
      do: The pilot-in-command pauses the cleared engagement and requests clarification.
      move: ask
      irreversible: false
      to: the instructor pilot
    O3:
      do: The pilot-in-command accepts the cleared engagement and proceeds.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The event occurred at Red Rio range on 31 January 2017 during a night close-air-support training sortie.
  - id: F2
    kind: situation
    status: assessed
    fact: The pilot perceived the ground element’s location as the intended simulated SA-8 training target.
  - id: F3
    kind: situation
    status: confirmed
    fact: Before the final decision, the pilot had two unsuccessful attempts and verbalized confusion about the target.
  - id: F4
    kind: situation
    status: confirmed
    fact: After the pilot expressed confusion, the instructor pilot cleared him to continue with the engagement.
  - id: F5
    kind: situation
    status: assessed
    fact: The pilot misinterpreted his instruments even though his onboard systems indicated the intended target.
  - id: F6
    kind: situation
    status: assessed
    fact: The instructor pilot provided inadequate monitoring and limited assistance during the pilot’s attempts.
  - id: F7
    kind: authority
    status: confirmed
    fact: The pilot-in-command was responsible for positively identifying the target before engagement, regardless of external
      influences.
  considerations:
  - id: C1
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The pilot-in-command had the responsibility to positively identify the target before engagement, regardless of clearance
      or other external influences.
  - id: C2
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The pilot perceived the ground element as the intended target and had already expressed confusion after two unsuccessful
      attempts; that uncertainty undermined a positive identification.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Although onboard systems indicated the intended target, the pilot misinterpreted his instruments and did not follow
      those indications. The indications alone therefore did not establish that he had positively identified the target.
  - id: C4
    facts:
    - F4
    - F6
    - F7
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The instructor's clearance after the pilot expressed confusion, coupled with limited monitoring and assistance, supports
      seeking clarification; it does not transfer the pilot-in-command's identification responsibility.
  reasoning:
    read: This was a decision about whether the pilot-in-command could positively identify the intended training target, not
      whether an instructor had cleared the engagement. The trap was treating clearance and favorable onboard indications
      as enough despite the pilot's confusion, mistaken perception, and misinterpretation of those indications.
    weighing: The decisive consideration is the pilot-in-command's responsibility to identify the target before proceeding
      {C1}. The mistaken perception and prior confusion {C2}, together with the failure to follow correctly directed onboard
      systems {C3}, support declining this engagement. The instructor's inadequate supervision is relevant and could support
      asking for clarification {C4}, but it does not displace the pilot's responsibility. The balance would differ if the
      pilot had positively identified the intended target rather than remaining confused.
    tradecraft: Withhold the engagement, state that positive identification is not established, and document the unresolved
      confusion and the decision. Any later decision should follow only after the identification issue is resolved.
    uncertainty: The findings characterize the pilot's perception and instrument interpretation as assessments based on the
      evidence. They do not specify what additional clarification would have been sufficient to establish positive identification.
    handoff: The pilot-in-command must make the engagement decision. The instructor can be asked to clarify or provide further
      direction, but that involvement does not transfer the pilot's responsibility.
    tempting_wrong:
      option: O3
      pull: The instructor cleared the engagement and onboard systems indicated the intended target.
      why_wrong: Those circumstances did not overcome the pilot's confusion and misperception or excuse the failure to follow
        the onboard indications; the pilot-in-command remained responsible for positive identification.
    rejected:
      O2: Clarification could be sought, but as framed it pauses the decision rather than adopting the report's endorsed disposition
        that this engagement should not proceed.
      O3: Proceeding was not chosen because clearance and onboard indications did not cure the pilot's mistaken perception,
        instrument misinterpretation, and failure to positively identify the target.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The pilot's confusion were resolved through clarification, but positive identification had not yet been established.
      then: O2
      why: Pausing to seek clarification would address the unresolved identification question without proceeding on the existing
        uncertainty.
    - id: flip2
      if: The pilot-in-command had positively identified the intended target and correctly understood the relevant indications.
      then: O3
      why: The source's stated basis for finding the pilot causal—mistaken perception, instrument misinterpretation, and failure
        to follow the onboard systems—would no longer apply.
    would_not_change:
    - id: noflip1
      if: The instructor had cleared the engagement.
      why: Clearance alone would not change the pilot-in-command's responsibility to positively identify the target, regardless
        of external influences.
    watch_for:
    - id: watch1
      what: The pilot remains confused or misinterprets indications even when onboard systems indicate the intended target.
      favors:
      - O1
      why: The source identifies mistaken perception and failure to follow the onboard systems as reasons for the mishap.
  lesson: A clearance does not replace the pilot-in-command's responsibility to positively identify a target before engagement.
    When confusion or misinterpretation prevents that identification, do not proceed on the strength of clearance or indications
    the pilot does not understand.
  limits: This reasoning addresses a training engagement where the pilot's identification was mistaken and the pilot-in-command's
    responsibility was expressly stated. It does not determine what action is appropriate under different operational conditions
    or a different governing rule.
