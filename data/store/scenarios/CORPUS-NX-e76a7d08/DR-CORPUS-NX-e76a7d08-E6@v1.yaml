case:
  id: DR-CORPUS-NX-e76a7d08-E6@v1
  title: Clearance During Night Training
  status: draft
  setting: Night close-air-support training sortie, 31 January 2017, Air Force.
  decider: The instructor pilot
  agent: The instructor pilot
  agent_role: decide
  situation: The instructor pilot must decide whether to clear a trainee to continue a night training sortie. It is the trainee’s
    first night close-air-support mission, and he has had two unsuccessful prior attempts. During the second attempt, the
    trainee expressed confusion, but the instructor pilot did not provide additional guidance before preparing him for another
    attempt. The instructor pilot is also handling FAC(A) responsibilities and duties involving another flight. Terminal attack
    control has not been transferred from the JTAC to the instructor pilot, and the trainee’s understanding has not been verified.
  question: What should the instructor pilot do about clearing the trainee to continue the training activity?
  options:
    O1:
      do: The instructor pilot denies clearance pending terminal attack control transfer and trainee verification.
      move: act
      irreversible: false
    O2:
      do: The instructor pilot grants clearance for the trainee to continue the training activity.
      move: act
      irreversible: false
    O3:
      do: The instructor pilot asks the JTAC to transfer control before reconsidering clearance.
      move: ask
      irreversible: false
      to: the JTAC
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: This was the trainee’s first night close-air-support training mission.
  - id: F2
    kind: situation
    status: confirmed
    fact: The trainee had two unsuccessful prior training attempts before the clearance decision.
  - id: F3
    kind: situation
    status: confirmed
    fact: During the second attempt, the trainee expressed confusion.
  - id: F4
    kind: situation
    status: confirmed
    fact: The instructor pilot was responsible for instruction while also performing FAC(A) duties.
  - id: F5
    kind: situation
    status: confirmed
    fact: After the trainee expressed confusion, the instructor pilot gave no additional guidance before preparing him for
      another attempt and clearing him.
  - id: F6
    kind: situation
    status: confirmed
    fact: The instructor pilot was handling other FAC(A) duties and attempting to communicate with the JTAC during the trainee’s
      final clearance.
  - id: F7
    kind: authority
    status: confirmed
    fact: The JTAC had not transferred terminal attack control to the instructor pilot before the instructor pilot cleared
      the trainee.
  - id: F8
    kind: capability
    status: assessed
    fact: The instructor pilot had not verified that the trainee had correctly identified the training objective before clearance.
  - id: F9
    kind: capability
    status: assessed
    fact: The instructor pilot’s directions were nonspecific and required greater autonomy from the trainee.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The trainee had two unsuccessful attempts and expressed confusion, yet received no further guidance and had not been
      verified as understanding the training objective. The board found that the instructor failed to effectively cross-monitor
      the trainee.
  - id: C2
    facts:
    - F4
    - F6
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The instructor was dividing attention between instruction and FAC(A) responsibilities, including duties involving
      another flight and communications with the JTAC. The board found that the instructor misprioritized those tasks and
      failed to effectively monitor the trainee.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F9
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: This was the trainee’s first night close-air-support mission, and the instructor’s nonspecific directions required
      greater autonomy despite the trainee’s prior unsuccessful attempts and expressed confusion. The board found overconfidence
      and complacency, including a failure to provide needed instruction or clarification.
  - id: C4
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The instructor cleared the trainee without terminal attack control having been transferred and without verifying
      the trainee’s understanding. The board specifically found that the instructor aggressively cleared the trainee without
      that transfer.
  reasoning:
    read: 'This is not a routine continuation decision: the trainee’s inexperience, two unsuccessful attempts, and expressed
      confusion were warning signs that required effective supervision. The instructor’s competing FAC(A) duties did not remove
      the need to monitor and instruct, and a clearance could not substitute for the missing transfer of terminal attack control
      or verification of the trainee’s understanding.'
    weighing: The findings on inadequate cross-monitoring, task misprioritization, overconfidence, complacency, and overaggressive
      conduct all support withholding clearance {C1} {C2} {C3} {C4}. The balance could support reconsidering clearance only
      after the authority issue is resolved, the trainee’s understanding is verified, and the instructor can provide adequate
      supervision.
    tradecraft: Withhold clearance while the necessary conditions remain unmet. Confirm that terminal attack control has actually
      been transferred, verify the trainee’s understanding, and ensure the instructor can give adequate attention to instruction;
      record the unresolved conditions and the basis for withholding clearance.
    uncertainty: The board could not determine whether wearing required protective equipment would have prevented the injury
      or reduced its severity. That uncertainty does not resolve the separate concerns about supervision, trainee understanding,
      or authority at the clearance decision.
    handoff: Involve the JTAC to address the transfer of terminal attack control. The instructor should retain responsibility
      for the clearance decision and for verifying the trainee’s understanding rather than treating a request for transfer
      as a completed transfer.
    tempting_wrong:
      option: O2
      pull: The instructor may be tempted to continue the planned training activity despite the trainee’s prior attempts and
        the competing demands of the sortie.
      why_wrong: 'That would repeat the board’s identified failures: clearing without effective cross-monitoring, additional
        guidance after expressed confusion, verified understanding, or transferred terminal attack control.'
    rejected:
      O2: It was not chosen because the trainee’s confusion remained unaddressed, understanding was unverified, and terminal
        attack control had not been transferred.
      O3: A request to the JTAC alone would address only the transfer issue and would not ensure the trainee’s understanding
        or adequate instructor supervision before clearance.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Terminal attack control has been transferred, the trainee’s understanding has been verified, and the instructor
        is able to provide adequate supervision without competing duties impairing monitoring.
      then: O2
      why: Those changes would address the authority, verification, and supervision concerns underlying the recommendation
        to withhold clearance.
    would_not_change:
    - id: noflip1
      if: Terminal attack control is transferred, but the trainee’s understanding remains unverified or the instructor remains
        unable to provide adequate supervision.
      why: Transfer alone would not resolve the board’s concerns about cross-monitoring, instruction, and the trainee’s expressed
        confusion.
    watch_for: []
  lesson: Prior unsuccessful attempts and expressed confusion call for added instruction and effective cross-monitoring, not
    an unverified continuation. Do not clear a trainee when required authority has not been transferred or the instructor
    cannot ensure adequate supervision.
  limits: This recommendation concerns a training-clearance decision with unresolved authority, supervision, and trainee-understanding
    concerns. It does not establish a general rule for every training sortie or determine whether protective equipment would
    have changed the injury outcome.
