case:
  id: DR-CORPUS-NX-86c73e42-E1@v1
  title: Housing at the Suhodol Police Academy
  status: draft
  setting: Postwar reconstruction in Bosnia and Herzegovina, at the federation-based police academy at Suhodol.
  decider: The authorities responsible for the police academy
  agent: The authorities responsible for the police academy
  agent_role: decide
  situation: The Dayton Peace Accords and other agreements included reforming and rebuilding the police agencies of the Federation
    of Bosnia-Herzegovina and the Republika Srpska. A federation-based police academy at Suhodol was being developed with
    young Muslim, Serb, and Croat recruits. Factional leaders had opposed opening the academy. After it opened, those leaders
    demanded that recruits from each faction be housed on separate floors. The authorities responsible for the academy must
    decide how to house the recruits.
  question: What should the authorities responsible for the police academy do about housing recruits from the different factions?
  options:
    O1:
      do: The academy authorities assign recruits to mixed dormitory rooms.
      move: act
      irreversible: false
    O2:
      do: The academy authorities assign recruits to separate factional floors.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The 1995 Dayton Peace Accords and other agreements included reforming, restructuring, certifying, and rebuilding
      the police agencies of the Federation of Bosnia-Herzegovina and the Republika Srpska.
  - id: F2
    kind: situation
    status: confirmed
    fact: A federation-based police academy was being developed at Suhodol with young Muslim, Serb, and Croat recruits.
  - id: F3
    kind: situation
    status: confirmed
    fact: Factional leaders mounted considerable opposition to opening the police academy.
  - id: F4
    kind: situation
    status: confirmed
    fact: After the academy opened, factional leaders insisted on segregated housing for the recruits.
  - id: F5
    kind: situation
    status: confirmed
    fact: The demanded arrangement would place recruits from each faction on separate floors.
  - id: F6
    kind: situation
    status: assessed
    fact: Separate factional housing would undermine the purpose of creating a unified national police institution.
  - id: F7
    kind: situation
    status: assessed
    fact: The academy was intended to support police agencies formed along professional lines that included ethnic, religious,
      and geographic diversity.
  - id: F8
    kind: situation
    status: confirmed
    fact: The war had claimed the lives of more than 200,000 citizens and damaged functioning societies, legal systems, and
      structures.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Separate floors would undermine the purpose of creating a unified national police institution; integrated housing
      better preserves that purpose.
  - id: C2
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The academy was intended to support professional police agencies that included ethnic, religious, and geographic
      diversity. Mixed housing puts that objective into practice.
  - id: C3
    facts:
    - F2
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Integrated housing signals that police agencies are to be formed along professional, diverse lines rather than factional
      ones.
  reasoning:
    read: This is a choice about whether the academy will reinforce factional separation or support the unified, professionally
      diverse police institution it was meant to help create. The trap is treating separate floors as a neutral accommodation
      when that arrangement would defeat the academy's unifying purpose {C1}.
    weighing: 'The decisive considerations favor mixed housing: separate factional floors would undermine institutional unity
      {C1}, while integration supports the intended professional diversity and signals that police agencies are to be formed
      on those lines {C2} {C3}. The balance depends on the academy''s purpose of building a unified, diverse police institution,
      not on satisfying factional leaders'' demand for separation.'
    tradecraft: Assign mixed rooms, communicate the institutional rationale, and record the decision and its implementation
      so the housing arrangement remains consistent with the academy's professional and inclusive purpose.
    uncertainty: The passage gives the institutional reasons for the decision but does not specify a governing legal rule,
      formal delegation, or any competing housing requirement.
    handoff: The academy authorities are the identified decision-makers. The passage gives no basis for treating factional
      leaders' opposition as an approval requirement or veto.
    tempting_wrong:
      option: O2
      pull: Separate floors may appear to accommodate factional leaders and reduce disagreement over housing.
      why_wrong: That accommodation would undermine the unified national police institution the academy was intended to support.
    rejected:
      O2: Separate factional floors were rejected because they would defeat the purpose of creating a unified national police
        institution.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The academy's authorized purpose changed so that creating a unified, diverse police institution was no longer an
        objective, and separate housing better served the revised purpose.
      then: O2
      why: The decisive reason for rejecting segregation is that it undermined the academy's unifying institutional purpose;
        a materially different purpose could alter that balance.
    would_not_change:
    - id: noflip1
      if: Factional leaders continued to insist on separate floors without new evidence that this arrangement served the academy's
        institutional purpose.
      why: The leaders' opposition and demand were already rejected because segregation would undermine the purpose of a unified
        national police institution.
    watch_for:
    - id: watch1
      what: Whether recruits from different factions continue to live together peacefully and amiably.
      favors:
      - O1
      why: Peaceful, amiable relations among integrated recruits provide evidence that integration could work and support
        professional, diverse police agencies.
  lesson: When an institution is being built to serve a unifying, professional purpose, housing choices should support that
    purpose rather than reproduce factional divisions. A demand for separation should not override the institution's stated
    mission without a reason that changes the balance.
  limits: This reasoning applies to the academy's housing choice during postwar reconstruction. It does not establish a general
    rule for every housing arrangement or resolve legal requirements not addressed here.
