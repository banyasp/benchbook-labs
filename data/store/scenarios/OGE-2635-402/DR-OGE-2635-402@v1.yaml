case:
  id: DR-OGE-2635-402@v1
  title: FDA Employee Spouse Employment and Artificial Limb Approval
  status: draft
  setting: Food and Drug Administration, present, review of biomedical device approval
  decider: the employee
  agent: ethics‑assistant AI
  agent_role: decide
  situation: An employee of the Food and Drug Administration is assigned to the review and approval process for an artificial
    limb developed by a biomedical company. The employee’s spouse is a salaried employee of that company and does not hold
    any stock or ownership interest. The approval or denial of the artificial limb will not have a direct and predictable
    effect on the spouse’s salary or continued employment. Under 18 U.S.C. 208(a), participation is prohibited when a direct
    and predictable effect on a financial interest exists. The employee’s spouse’s financial interests are imputed to the
    employee. Recusal is required when a direct and predictable effect on an imputed financial interest is present. The impartiality
    principle requires the employee to follow procedures in §2635.502 before participating when a covered relationship exists.
  question: What should the employee do about participating in the artificial‑limb approval review?
  options:
    O1:
      do: The employee holds participation pending a formal waiver.
      move: hold
      irreversible: false
    O2:
      do: The employee recuses from the artificial‑limb approval review.
      move: act
      irreversible: false
    O3:
      do: The employee participates in the artificial‑limb approval review.
      move: act
      irreversible: false
    O4:
      do: The employee asks the ethics official for guidance before acting.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for the FDA and is assigned to the artificial‑limb approval review.
  - id: F2
    kind: situation
    status: confirmed
    fact: The employee’s spouse is a salaried employee of the biomedical company seeking FDA approval for the artificial limb.
  - id: F3
    kind: situation
    status: confirmed
    fact: The spouse holds no stock or ownership interest in the company.
  - id: F4
    kind: situation
    status: confirmed
    fact: Granting or withholding FDA approval will not directly and predictably affect the spouse’s salary or continued employment.
  - id: F5
    kind: authority
    status: confirmed
    fact: 18 U.S.C. 208(a) prohibits an employee from participating personally and substantially in a matter that will have
      a direct and predictable effect on a financial interest.
  - id: F6
    kind: authority
    status: confirmed
    fact: Imputed interests include the employee’s spouse.
  - id: F7
    kind: authority
    status: confirmed
    fact: Recusal is required when a particular matter will have a direct and predictable effect on an employee’s (or imputed)
      financial interest.
  - id: F8
    kind: authority
    status: confirmed
    fact: The impartiality principle requires the employee to follow procedures in §2635.502 before participating when a covered
      relationship exists.
  - id: F9
    kind: authority
    status: assessed
    fact: The employee has authority to decide whether to recuse from a particular matter, subject to the statutes and regulations.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The statute requires a direct and predictable effect on a financial interest for recusal; the spouse's salary is
      not directly or predictably affected by the FDA decision.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Although the spouse’s interest is imputed, the lack of a direct and predictable financial impact means the disqualification
      provision does not apply.
  - id: C3
    facts:
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The impartiality principle obliges the employee to follow the procedures in §2635.502 before participating, but it
      does not bar participation once those procedures are satisfied.
  reasoning:
    read: The employee’s spouse works for the applicant company, but the spouse’s compensation is not tied to the FDA’s approval
      decision, so there is no direct and predictable financial impact on the spouse.
    weighing: C1 and C2 show that the statutory trigger for recusal—direct and predictable effect on an imputed interest—is
      absent. C3 adds a procedural step but does not create a disqualifying conflict. Accordingly, participation is permissible
      after complying with §2635.502.
    tradecraft: The employee should document compliance with §2635.502 (e.g., notify the agency ethics official, keep a written
      record) before taking part in the review.
    uncertainty: Minimal; the only uncertainty would be a later finding that the approval decision does have a direct financial
      impact on the spouse’s salary, which the source rules out.
    handoff: The employee may act independently after completing the required §2635.502 procedures; no higher‑level approval
      is needed unless a waiver is later requested.
    tempting_wrong:
      option: O2
      pull: Recusal may feel safer because of the spouse’s employment with the applicant.
      why_wrong: The regulation expressly states that without a direct and predictable effect on the spouse’s financial interest,
        recusal is not required.
    rejected:
      O1: Holding the decision pending a waiver is unnecessary because the statute does not require a waiver.
      O2: Recusal is not mandated since the spouse’s salary is not directly affected.
      O4: Guidance can be sought, but the regulations already permit participation after procedural compliance.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The FDA approval or denial would have a direct and predictable effect on the spouse's salary or continued employment.
      then: O2
      why: A direct and predictable financial impact on an imputed interest triggers the recusal requirement of 18 U.S.C. 208(a).
    would_not_change:
    - id: noflip1
      if: The employee follows all procedures in §2635.502 before participating.
      why: Procedural compliance satisfies the impartiality principle without altering the eligibility to participate.
    watch_for:
    - id: watch1
      what: Failure to document compliance with §2635.502 or to notify the ethics official.
      favors:
      - O2
      why: Non‑compliance could be treated as a breach of the impartiality principle, leading to required recusal or disciplinary
        action.
  lesson: When an imputed spouse interest does not create a direct and predictable financial effect, the employee may participate
    in the matter after satisfying the impartiality procedures of §2635.502.
  limits: This analysis applies only where the spouse’s compensation is unrelated to the agency decision and no stock or ownership
    interest exists; it does not extend to situations involving direct financial stakes or broader policy matters.
