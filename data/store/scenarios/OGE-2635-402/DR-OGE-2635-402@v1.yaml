verdict_tier: source-endorsed
basis: Because the FDA approval process will not affect the spouse's financial interests, this section does not require the
  employee to recuse from participating in that process. Nevertheless, because the impartiality principle is implicated, the
  employee must follow the procedures established in §2635.502 before participating.
