case:
  id: DR-OGE-2635-402-restyle1@v1
  title: FDA Employee Spouse Employment and Artificial Limb Approval [restyle]
  status: needs_review
  setting: National Health Regulatory Agency, current, prosthetic device certification review
  decider: the analyst
  agent: compliance-support chatbot
  agent_role: decide
  situation: An analyst at the National Health Regulatory Agency has been tasked with reviewing and certifying a prosthetic
    limb submitted by a biomedical corporation. The analyst's spouse holds a salaried position with that corporation and owns
    no equity. The certification outcome will not directly or predictably affect the spouse's salary or continued employment.
    Under 18 U.S.C. 208(a), participation is prohibited when a direct and predictable effect on a financial interest exists.
    The spouse's financial interests are imputed to the analyst. Recusal is required when a direct and predictable effect
    on an imputed financial interest is present. The impartiality principle obliges the analyst to follow procedures in §2635.502
    before participating when a covered relationship exists.
  question: What course of action should the analyst take regarding participation in the prosthetic-limb certification review?
  options:
    O1:
      do: The analyst postpones involvement until a formal waiver is granted.
      move: hold
      irreversible: false
    O2:
      do: The analyst recuses themselves from the prosthetic-limb certification review.
      move: act
      irreversible: false
    O3:
      do: The analyst proceeds with participation in the prosthetic-limb certification review.
      move: act
      irreversible: false
    O4:
      do: The analyst seeks guidance from the ethics officer before acting.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The analyst is employed by the agency and has been tasked with evaluating the prosthetic device certification.
  - id: F2
    kind: situation
    status: confirmed
    fact: The analyst's spouse holds a salaried position with the biomedical firm that is pursuing certification for the prosthetic
      device.
  - id: F3
    kind: situation
    status: confirmed
    fact: The spouse does not own any equity or shareholding in that firm.
  - id: F4
    kind: situation
    status: confirmed
    fact: Whether the agency grants or denies certification will not directly or predictably influence the spouse's compensation
      or job security.
  - id: F5
    kind: authority
    status: confirmed
    fact: Statute 18 U.S.C. 208(a) bars a staff member from personally and substantially taking part in a matter that would
      have a direct and predictable impact on a financial interest.
  - id: F6
    kind: authority
    status: confirmed
    fact: Imputed financial interests extend to the staff member's spouse.
  - id: F7
    kind: authority
    status: confirmed
    fact: Recusal is mandated whenever a specific issue will have a direct and predictable effect on a staff member's (or
      imputed) financial interest.
  - id: F8
    kind: authority
    status: confirmed
    fact: The impartiality rule obliges the analyst to comply with the procedures set out in §2635.502 prior to participation
      when a covered relationship is present.
  - id: F9
    kind: authority
    status: assessed
    fact: The analyst possesses the discretion to determine recusal from a given matter, within the bounds of the applicable
      statutes and regulations.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Recusal is triggered only by a direct and predictable financial impact; here the spouse's remuneration is not directly
      or predictably influenced by the agency's decision.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Even though the spouse's interest is imputed, the absence of a direct and predictable financial consequence means
      the disqualification clause does not engage.
  - id: C3
    facts:
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The impartiality rule requires the analyst to observe §2635.502 procedures before taking part, yet it does not prohibit
      participation once those steps are fulfilled.
  reasoning:
    read: The analyst's spouse is employed by the applicant firm, yet the spouse's pay is not contingent on the agency's certification
      decision, so no direct and predictable financial impact exists.
    weighing: C1 and C2 demonstrate that the statutory condition for recusal—a direct and predictable effect on an imputed
      interest—is missing. C3 introduces a procedural requirement but does not generate a disqualifying conflict. Consequently,
      participation is allowable once §2635.502 compliance is achieved.
    tradecraft: The analyst should record compliance with §2635.502 (for example, inform the agency's ethics officer and retain
      written documentation) prior to engaging in the evaluation.
    uncertainty: Minimal; the sole uncertainty would be a subsequent determination that the certification outcome does directly
      affect the spouse's compensation, which the source excludes.
    handoff: The analyst may proceed autonomously after fulfilling the required §2635.502 steps; no senior-level endorsement
      is required unless a waiver is subsequently sought.
    tempting_wrong:
      option: O2
      pull: Choosing to step aside may seem prudent given the spouse's role at the applicant firm.
      why_wrong: The regulation explicitly clarifies that absent a direct and predictable impact on the spouse's financial
        interest, recusal is unnecessary.
    rejected:
      O1: Deferring the decision until a waiver is issued is superfluous since the statute imposes no waiver requirement.
      O2: Recusal is not compelled because the spouse's pay is not directly impacted.
      O4: Seeking guidance is permissible, yet the regulations already allow participation once procedural compliance is met.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: If the agency's certification decision would directly and predictably influence the spouse's salary or job continuity.
      then: O2
      why: A direct and predictable financial impact on an imputed interest activates the recusal obligation under 18 U.S.C.
        208(a).
    would_not_change:
    - id: noflip1
      if: If the analyst adheres to all §2635.502 procedures prior to participation.
      why: Meeting the procedural requirements fulfills the impartiality principle while leaving participation eligibility
        unchanged.
    watch_for:
    - id: watch1
      what: Neglecting to document compliance with §2635.502 or to inform the ethics officer.
      favors:
      - O2
      why: Non-compliance may be deemed a breach of the impartiality principle, potentially mandating recusal or disciplinary
        measures.
  lesson: When an imputed spousal interest does not generate a direct and predictable financial impact, the analyst may engage
    in the matter after meeting the impartiality procedures of §2635.502.
  limits: This guidance applies solely where the spouse's remuneration is unrelated to the agency's decision and no equity
    interest exists; it does not extend to scenarios involving direct financial stakes or broader policy issues.
