case:
  id: DR-OGE-2635-402-flip1@v1
  title: FDA Employee Spouse Employment and Artificial Limb Approval [flip]
  status: needs_review
  setting: U.S. Food and Drug Administration, present day, review of a prosthetic-limb device
  decider: the reviewing officer
  agent: automated ethics-advice system
  agent_role: decide
  situation: A reviewing officer at the FDA is assigned to evaluate a prosthetic-limb submitted by a biomedical firm. The
    officer's spouse works as a salaried employee for that firm. The spouse does not own any equity in the company. The firm's
    compensation plan includes a performance bonus that is automatically paid only if the FDA grants approval for the prosthetic,
    and the employment contract allows termination if the product loses that approval. Under 18 U.S.C. §208(a), an employee
    must recuse when a matter has a direct and predictable effect on a financial interest that is imputed to the employee.
    The impartiality rule in 5 C.F.R. §2635.502 requires the officer to follow prescribed steps before participating when
    a covered relationship exists.
  question: Should the reviewing officer take part in the prosthetic-limb approval review?
  options:
    O1:
      do: Hold participation pending a formal conflict-of-interest waiver request.
      move: hold
      irreversible: false
    O2:
      do: Recuse immediately from the prosthetic-limb approval review process.
      move: act
      irreversible: false
    O3:
      do: Proceed with participation in the prosthetic-limb approval review.
      move: act
      irreversible: false
    O4:
      do: Seek guidance from the ethics official before deciding.
      move: ask
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The officer is an FDA employee tasked with the prosthetic-limb review.
  - id: F2
    kind: situation
    status: confirmed
    fact: The officer's spouse is a salaried employee of the applicant company.
  - id: F3
    kind: situation
    status: confirmed
    fact: The spouse holds no stock or ownership interest in the applicant.
  - id: F4
    kind: situation
    status: confirmed
    fact: The spouse’s compensation package includes a bonus that is automatically awarded only if the company secures FDA
      approval for the artificial limb, and the employment agreement stipulates termination if the product loses that approval.
  - id: F5
    kind: authority
    status: confirmed
    fact: 18 U.S.C. §208(a) bars an employee from participating personally and substantially in a matter that will have a
      direct and predictable effect on a financial interest.
  - id: F6
    kind: authority
    status: confirmed
    fact: Imputed interests encompass the employee's spouse.
  - id: F7
    kind: authority
    status: confirmed
    fact: Recusal is required when a matter will have a direct and predictable effect on an employee's (or imputed) financial
      interest.
  - id: F8
    kind: authority
    status: confirmed
    fact: The impartiality principle obligates the employee to follow the procedures in §2635.502 before participating when
      a covered relationship exists.
  - id: F9
    kind: authority
    status: assessed
    fact: The officer has discretion to decide whether to recuse, subject to the statutes and regulations.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The spouse's bonus and job-security provisions create a direct and predictable financial impact from the FDA decision,
      triggering the statutory recusal requirement.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Even though the interest is imputed, the concrete link between approval and the spouse's compensation satisfies the
      "direct and predictable" test, so participation would compromise the agency's credibility.
  - id: C3
    facts:
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The impartiality rule requires adherence to §2635.502, but when a disqualifying financial interest exists, the appropriate
      outcome under that rule is recusal rather than participation.
  reasoning:
    read: The officer's spouse receives a bonus only if the prosthetic gains FDA approval and faces termination if it loses
      that approval, establishing a direct and predictable financial stake in the outcome.
    weighing: C1, C2, and C3 all identify a statutory trigger for disqualification because the spouse's compensation is tied
      to the agency's decision. Consequently, recusal is the only compliant course of action.
    tradecraft: The officer should promptly notify the agency ethics official of the conflict, file a formal recusal request,
      and document the referral in the review docket.
    uncertainty: Minimal; the statutory language and the compensation arrangement clearly create a direct financial effect.
    handoff: Recusal is final unless a higher authority grants a waiver, which is unlikely given the explicit financial link.
    tempting_wrong:
      option: O3
      pull: Participating might seem efficient because the spouse's role is non-ownership and the officer may feel the conflict
        is minor.
      why_wrong: The law expressly mandates recusal when a direct, predictable financial impact on an imputed interest exists,
        regardless of ownership status.
    rejected:
      O1: A waiver is unnecessary because the conflict is clear and disqualifying under the statute.
      O4: Guidance is advisable, but the regulations already require recusal; seeking guidance does not change the required
        outcome.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The FDA approval or denial would NOT have a direct and predictable effect on the spouse's salary or continued employment.
      then: O3
      why: Without a direct financial link, the statutory trigger for recusal disappears, allowing participation.
    would_not_change:
    - id: noflip1
      if: The officer follows all procedures in §2635.502 before acting.
      why: Procedural compliance satisfies the impartiality principle but does not override the statutory recusal requirement
        when a direct financial impact exists.
    watch_for:
    - id: watch1
      what: Failure to file a formal recusal or to notify the ethics official.
      favors:
      - O2
      why: Non-compliance could be interpreted as a breach of the impartiality principle, leading to disciplinary action.
  lesson: When a spouse's compensation is directly tied to an agency decision, the employee must recuse, even if the spouse
    holds no equity, after satisfying any required procedural steps.
  limits: This guidance applies only where the spouse's pay is contingent on the agency's action. It does not cover situations
    involving stock ownership, indirect financial effects, or broader policy decisions.
