case:
  id: DR-CORPUS-NX-a7539563-E1@v1
  title: Use of Force Before an Embassy Overrun
  status: draft
  setting: At the embassy, before the expected forced takeover; a diplomatic post with Marine guards.
  decider: The officer
  agent: The officer
  agent_role: decide
  situation: Militants held the embassy grounds and may have occupied parts of the chancery, but their precise position was
    unknown. The officer regarded an overrun as certain. Headquarters could not provide assistance. Marine guards were present
    at the embassy. The officer assessed that ordering the guards to open fire would provoke a bloodier attack.
  question: What should the officer do about whether to order the Marine guards to open fire on the militants?
  options:
    O1:
      do: The officer permits the Marine guards to open fire on the militants.
      move: act
      irreversible: true
    O2:
      do: The officer prohibits the Marine guards from opening fire on the militants.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Headquarters could do nothing to assist the embassy personnel.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The officer assessed that the embassy would be overrun.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Militants held the embassy grounds.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Militants may have held parts of the chancery, but their precise location within it was unknown.
  - id: F5
    kind: capability
    status: confirmed
    fact: Marine guards were present at the embassy.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The officer assessed that ordering the guards to open fire would provoke a bloodier attack.
  considerations:
  - id: C1
    facts:
    - F6
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The officer assessed that ordering the guards to fire would provoke a bloodier attack, so prohibiting fire avoided
      an escalation the officer expected.
  - id: C2
    facts:
    - F5
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: A bloodier attack would create greater danger for embassy personnel, including the guards; this is a safety implication
      of the officer's stated assessment, not a separately stated rationale.
  reasoning:
    read: The officer regarded an overrun as certain, while militants held the grounds and their presence inside the chancery
      was uncertain. The decision was whether to order fire before that expected takeover; the trap is treating the expected
      overrun as, by itself, a reason to start a firefight despite the officer's assessment of its likely consequence.
    weighing: The officer's stated reason for prohibiting fire was that it would certainly provoke a bloodier attack {C1}.
      That forecast outweighed the option of opening fire; the decision depends on the officer's assessment that firing would
      worsen the attack.
    tradecraft: Communicate the prohibition clearly to the Marine guards and preserve the rationale and the assessment it
      rests on. Recording the decision is sound practice, though not stated in the account.
    uncertainty: The militants' precise location within the chancery was unknown. The officer nevertheless treated the expected
      overrun as certain and the bloodier-attack consequence of firing as sufficiently certain to prohibit fire.
    handoff: The officer made the decision locally; Headquarters could not assist. No further referral or consultation is
      described.
    tempting_wrong:
      option: O1
      pull: Opening fire may seem like a way to resist a takeover that the officer regarded as certain.
      why_wrong: The officer assessed that firing would provoke a bloodier attack, and the account gives no contrary expected
        benefit that outweighed that consequence.
    rejected:
      O1: The officer prohibited fire because he assessed that it would provoke a bloodier attack.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The officer instead assessed that opening fire would not provoke a bloodier attack and would reduce the danger of
        the expected takeover.
      then: O1
      why: That would remove the stated reason for prohibiting fire and supply a countervailing protective benefit.
    would_not_change:
    - id: noflip1
      if: The militants' precise location remained uncertain, while the officer's assessment that firing would provoke a bloodier
        attack remained unchanged.
      why: The account records that uncertainty alongside the officer's prohibition; absent a change in the escalation assessment,
        it does not displace the stated reason for O2.
    watch_for:
    - id: watch1
      what: Whether the assessment that opening fire would provoke a bloodier attack remains sound.
      favors:
      - O1
      why: If that assessment changes, the decisive reason given for prohibiting fire may no longer apply.
  lesson: When a decision-maker expects a takeover but assesses that opening fire will make the attack bloodier, the expected
    takeover alone does not settle the choice in favor of firing. The decision should turn on the anticipated consequences
    of each available course, and should be revisited if that assessment changes.
  limits: This reasoning is specific to the officer's assessment that firing would provoke a bloodier attack. It does not
    establish a general rule against defensive fire or resolve cases where a different legal obligation or materially different
    threat assessment applies.
