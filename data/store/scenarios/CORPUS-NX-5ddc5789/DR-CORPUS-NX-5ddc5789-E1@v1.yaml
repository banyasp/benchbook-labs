case:
  id: DR-CORPUS-NX-5ddc5789-E1@v1
  title: Security Support for Agency Recruiting Visits
  status: draft
  setting: College and university campuses, February 1967, Office of Security.
  decider: The Deputy Director for Support
  agent: The Deputy Director for Support
  agent_role: decide
  situation: Agency recruiting visits were contemplated at college and university campuses amid an increasingly hostile atmosphere.
    Dissident activity and activity directed against the Agency were relevant campus conditions. The policy question was whether
    the Office of Security should establish a program of assistance for Agency recruiters. The stated policy was to avoid
    confrontations.
  question: What should the Deputy Director for Support do about a security-support program for Agency recruiting visits amid
    increasingly hostile campus conditions?
  options:
    O1:
      do: The Deputy Director for Support defers the recruiter-support program decision pending further campus assessment.
      move: hold
      irreversible: false
    O2:
      do: The Deputy Director for Support prohibits the Office of Security from establishing a recruiter-support program.
      move: act
      irreversible: false
    O3:
      do: The Deputy Director for Support authorizes the Office of Security to establish a recruiter-support program.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The atmosphere on many college campuses was increasingly hostile.
  - id: F2
    kind: situation
    status: confirmed
    fact: The relevant settings were college and university campuses.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The level of dissident activity on campuses was a relevant condition.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Activity directed against the Agency on campuses was a relevant condition.
  - id: F5
    kind: situation
    status: confirmed
    fact: Agency recruiters could elect to visit a campus.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposed program concerned providing assistance to Agency recruiters.
  - id: F7
    kind: situation
    status: confirmed
    fact: The stated policy was to avoid confrontations.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    - F6
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: The increasingly hostile campus atmosphere made security assistance relevant to protecting recruiters who elected
      to visit.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The program supported Agency recruiting visits rather than abandoning that activity because campus conditions had
      become hostile.
  - id: C3
    facts:
    - F1
    - F7
    equity: escalation_control
    favors:
    - O3
    weight: strong
    why: The stated policy was to avoid confrontations; the chosen response was to establish assistance for recruiters under
      that policy, not to treat confrontation as an acceptable means of continuing recruiting.
  reasoning:
    read: This was a policy choice about whether to support recruiting visits amid worsening campus hostility, not a choice
      between confronting campus dissent and abandoning recruiting. The key trap is treating hostility alone as a reason to
      prohibit the program, even though the stated policy was to avoid confrontations.
    weighing: The hostile atmosphere supported taking protective action for recruiters, while the recruiting purpose favored
      enabling visits where appropriate. The Deputy Director for Support chose to institute the program while retaining avoidance
      of confrontations as the governing policy. The balance would change if the need for security precautions were eliminated.
    tradecraft: Record the purpose of the authorization, its connection to recruiter safety, and the commitment to avoid confrontations.
      Reassess whether the program remains necessary if the recruiting circumstances change.
    uncertainty: The source identifies hostile conditions and relevant campus activity but gives no quantified threshold for
      when those conditions require security support.
    handoff: The Deputy Director for Support was the identified decision-maker and directed the program. The source gives
      no basis for requiring referral to another authority.
    tempting_wrong:
      option: O2
      pull: Prohibiting the program could seem like the simplest way to avoid confrontations on hostile campuses.
      why_wrong: The response to hostility was to institute assistance for recruiters, while maintaining avoidance of confrontations
        as the policy.
    rejected:
      O1: Deferring the decision was not chosen because the Deputy Director for Support directed the Office of Security to
        institute the program in response to the hostile campus atmosphere.
      O2: Prohibiting the program was not chosen because the selected response was to support recruiters while adhering to
        the policy of avoiding confrontations.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Revisions to the Agency’s recruiting program eliminate the need for security precautions.
      then: O2
      why: The program was discontinued when revisions to the recruiting program eliminated the need for security precautions.
    - id: flip2
      if: The Deputy Director for Support has reason to conclude that a security-support program would itself produce confrontations
        rather than help avoid them.
      then: O2
      why: That would undermine the stated policy that governed the choice to establish the program.
    would_not_change:
    - id: noflip1
      if: The campus atmosphere is hostile and recruiters may face opposition.
      why: That condition was the context for instituting assistance, not by itself a reason to prohibit the program.
    watch_for:
    - id: watch1
      what: Whether campus conditions continue to make security precautions necessary for recruiting visits.
      favors:
      - O3
      why: Campus activity and hostility were relevant to the decision to provide assistance; a continuing need supports authorization.
  lesson: Hostile conditions can justify protective support for an ongoing mission without making confrontation acceptable.
    Authorize support in keeping with the stated restraint policy, and reconsider it when the underlying need changes.
  limits: This reasoning applies to the policy choice described here, where the stated purpose was assistance to recruiters
    and the policy was to avoid confrontations. It does not establish that every recruiting visit should proceed or that security
    support is appropriate when it would conflict with that policy.
  library:
    domain: intel-oversight
    family: CORPUS-NX-5ddc5789
    source: https://www.aarclibrary.org/publib/church/rockcomm/pdf/RockComm_Chap12_Security.pdf
    episode_focus: The decision was whether to provide security support for Agency recruiting visits amid increasingly hostile
      campus conditions, with the stated aim of protecting recruiters and Agency activity while avoiding confrontations. Focus
      on the policy choice to institute the program; exclude the operational details of monitoring, warnings, communications,
      and evacuation.
