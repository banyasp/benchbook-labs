case:
  id: DR-CORPUS-NX-106e7205-E1@v1
  title: Uncertain Winds at Walan Rabat
  status: draft
  setting: M-28 mission at Walan Rabat, 18 December 2011
  decider: The Mission Pilot
  agent: The Mission Pilot
  agent_role: decide
  situation: During an M-28 mission at Walan Rabat, the crew encountered winds that differed from its expectations. The Mission
    Pilot had understood from the preflight brief that the winds there were variable at 5 knots, although that value applied
    to Qalat. The crew was uncertain about the crosswind and tailwind components at the landing zone. The Mission Copilot
    could not verify the Mission Pilot’s wind assessment. The conditions raised the possibility of winds exceeding limits
    at the destination, and recognizing the conditions could support developing alternative procedures.
  question: What should the Mission Pilot do when observed winds create uncertainty about the crosswind and tailwind conditions
    at Walan Rabat?
  options:
    O1:
      do: The Mission Pilot aborts the landing and reassesses conditions.
      move: act
      irreversible: false
    O2:
      do: The Mission Pilot continues with the landing.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The Mission Pilot understood from the preflight brief that winds at Walan Rabat were variable at 5 knots, although
      that value applied to Qalat.
  - id: F2
    kind: situation
    status: assessed
    fact: At Walan Rabat, the winds were not what the crew expected.
  - id: F3
    kind: situation
    status: assessed
    fact: There was confusion about the crosswind and tailwind components of the winds.
  - id: F4
    kind: capability
    status: assessed
    fact: The Mission Copilot was unable to verify the Mission Pilot’s wind assessment.
  - id: F5
    kind: situation
    status: assessed
    fact: The crew focused on landing rather than resolving uncertainty about the wind components.
  - id: F6
    kind: situation
    status: assessed
    fact: Recognizing the winds at Walan Rabat could have alerted the crew to the possibility of out-of-limit winds at the
      destination and allowed development of alternative procedures.
  - id: F7
    kind: situation
    status: confirmed
    fact: Mission-in-progress replanning involves reassessing changes in the environment and changing the plan to manage risk.
  considerations:
  - id: C1
    facts:
    - F1
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The preflight understanding confused Walan Rabat's winds with the conditions at Qalat. Recognizing the actual destination
      conditions could have alerted the crew to possible out-of-limit winds and allowed it to develop alternatives.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: There was confusion about the wind components, and the copilot could not verify the pilot's assessment. The report
      identifies this as a cross-monitoring failure.
  - id: C3
    facts:
    - F2
    - F3
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The crew concentrated on landing rather than resolving uncertainty after finding that the winds were not as expected.
  - id: C4
    facts:
    - F3
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Mission-in-progress replanning calls for reassessing changed conditions and adapting the plan to manage risk. The
      crew misassessed the wind components and proceeded with an out-of-limits tailwind.
  reasoning:
    read: 'This was not simply a question of completing the planned landing: the observed winds differed from the briefing,
      the wind components were uncertain, and the copilot could not verify the assessment. The trap was allowing focus on
      landing to displace reassessment of a changed and potentially out-of-limits condition.'
    weighing: The mistaken preflight understanding and the possibility of out-of-limit winds favored stopping to reassess
      and consider alternatives {C1}. Confusion and the lack of cross-verification made proceeding on the pilot's assessment
      unreliable {C2}. The crew's focus on landing instead of resolving the uncertainty, followed by an out-of-limits landing,
      reinforces the need to replan as conditions change {C3} {C4}. These reasons favor {O1}; the balance depends on resolving
      the wind uncertainty rather than assuming the original plan remains suitable.
    tradecraft: Pause the landing decision, make the uncertainty explicit to the crew, and reassess the conditions and available
      alternatives before deciding whether to proceed. Record the changed conditions, unresolved uncertainty, and basis for
      the revised decision.
    uncertainty: The excerpt establishes confusion about the wind components and a possibility of out-of-limit conditions;
      it does not establish that the crew had resolved the uncertainty before proceeding. The recommended course is to reassess
      rather than treat uncertain conditions as acceptable.
    handoff: The Mission Pilot holds the decision in this scenario, but should involve the Mission Copilot in reassessment
      and cross-checking because the copilot could not verify the original assessment.
    tempting_wrong:
      option: O2
      pull: Continuing preserves the focus on completing the planned landing.
      why_wrong: 'That focus was itself part of the failure: the crew did not resolve uncertainty about the wind components,
        and the landing proceeded with an out-of-limits tailwind.'
    rejected:
      O2: Continuing was not chosen because the crew had not adequately reassessed the changed winds or resolved the uncertainty,
        and it proceeded with an out-of-limits tailwind.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A reassessment established that the conditions were within applicable limits and that proceeding was acceptably
        safe.
      then: O2
      why: With the uncertainty resolved and the risk assessed as acceptable, continuing would no longer rest on the mistaken
        briefing or an unverified wind assessment.
    would_not_change:
    - id: noflip1
      if: The crew remained focused on completing the landing while the wind components were still uncertain.
      why: Commitment to the planned landing does not resolve the uncertainty or satisfy the need to reassess changed conditions.
    watch_for:
    - id: watch1
      what: Observed winds differ from expectations, the crew is confused about the wind components, or the copilot cannot
        verify the pilot's assessment.
      favors:
      - O1
      why: These are indications that the original assessment and plan need to be reconsidered before proceeding.
  lesson: When observed conditions differ from the plan and a material risk assessment cannot be verified, pause and reassess
    rather than letting mission momentum decide. Replanning is part of managing risk during execution, not merely a preflight
    task.
  limits: This conclusion concerns uncertainty about wind conditions and the report's finding that the crew proceeded with
    an out-of-limits tailwind. It does not establish that every change in conditions requires aborting; a sufficiently reliable
    reassessment may support a different decision.
