case:
  id: DR-CORPUS-NX-bdd0cea6-E1@v1
  title: Restraint in a Culturally Significant City
  status: draft
  setting: Shusha, during the planned battle; joint task force
  decider: The joint task force
  agent: The joint task force
  agent_role: decide
  situation: The joint task force faced a planned battle within Shusha, a culturally significant city. Most of the civilian
    population had fled by the time the battle began. The task force sought to avoid an extended urban battle and minimize
    damage to the city. The decision was whether to authorize broader fires within Shusha or limit them.
  question: What should the joint task force do about the use of broader fires within Shusha during the battle?
  options:
    O1:
      do: The joint task force authorizes broader fires within Shusha during the battle.
      move: act
      irreversible: true
    O2:
      do: The joint task force declines broader fires within Shusha during the battle.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The joint task force planned a battle within Shusha.
  - id: F2
    kind: situation
    status: confirmed
    fact: Shusha was culturally significant.
  - id: F3
    kind: situation
    status: confirmed
    fact: Most of the civilian population had fled by the time the battle began.
  - id: F4
    kind: situation
    status: confirmed
    fact: The task force sought to avoid an extended urban battle.
  - id: F5
    kind: situation
    status: confirmed
    fact: The task force sought to minimize damage to the city.
  - id: F6
    kind: situation
    status: confirmed
    fact: The decision concerned whether to use broader fires within the city or limit them.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F6
    equity: protected_sites
    favors:
    - O2
    weight: strong
    why: The task force sought to minimize damage to a culturally significant city, supporting restraint in the use of broader
      fires.
  - id: C2
    facts:
    - F4
    - F6
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: Avoiding an extended urban battle was a stated aim; the task force's plan paired that aim with limiting fires within
      the city.
  - id: C3
    facts:
    - F3
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: Most civilians had fled, which reduced—but did not eliminate—the civilian-protection concern. The source gives this
      as context, not as a reason to authorize broader fires.
  reasoning:
    read: This was a planned battle in a culturally significant city, with most civilians already gone but the task force
      still seeking to limit damage and avoid an extended urban fight. The trap is treating the reduced civilian presence
      as though it erased the separate concern for damage to the city.
    weighing: The task force's stated aims of minimizing damage and avoiding a prolonged urban battle support {O2}. The fact
      that most civilians had fled weighs weakly the other way, but the source does not present it as a basis for broader
      fires. The balance could differ if broader fires were shown to be necessary to avoid a longer battle while reducing
      overall harm; the source does not establish that.
    tradecraft: Record the reasons for restraint and the competing mission and civilian-harm considerations. Keep the decision
      at the level of whether to authorize broader fires; do not turn it into guidance on weapon employment.
    uncertainty: The source gives the task force's aims and planned restraint, but does not quantify the damage broader fires
      might cause or compare their effects on the battle's duration.
    handoff: The joint task force is the stated decider. The source does not identify a separate approval authority or require
      a handoff; involving relevant legal or command advisers would be prudent if authority or applicable constraints were
      uncertain.
    tempting_wrong:
      option: O1
      pull: Most civilians had fled, and broader fires might appear to make a planned urban battle easier to conclude.
      why_wrong: The source's stated plan still prioritized minimizing damage to the culturally significant city and avoiding
        an extended urban battle; it does not say broader fires would achieve those aims.
    rejected:
      O1: The task force did not authorize broader fires because its plan sought to limit damage to the culturally significant
        city while avoiding an extended urban battle.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable assessment showed that broader fires were necessary to prevent an extended urban battle and would reduce
        overall harm, including damage to the city.
      then: O1
      why: That would change the balance between the stated aims of limiting damage and avoiding a prolonged fight.
    would_not_change:
    - id: noflip1
      if: Most civilians had fled, but the city remained culturally significant and the task force still sought to minimize
        damage.
      why: Reduced civilian presence alone would not remove the source's stated reason to limit damage to the city.
    watch_for:
    - id: watch1
      what: Reliable indications that civilians remained in or had returned to the city.
      favors:
      - O2
      why: That would strengthen the civilian-safety consideration alongside the stated concern about damage to the city.
  lesson: A reduced civilian presence does not by itself erase the reasons to restrain fires in a culturally significant city.
    Weigh the mission's need to avoid a prolonged urban battle against the harm broader fires could cause, and do not assume
    broader fires would shorten the fight without support for that judgment.
  limits: This reasoning reflects the task force's stated aims and the limited facts provided; it does not establish a legal
    rule or determine whether a particular use of force would be lawful. It does not apply unchanged if the mission, civilian
    presence, anticipated harm, or available evidence materially differs.
