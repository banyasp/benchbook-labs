case:
  id: DR-CORPUS-NX-bdd0cea6-E3@v1
  title: Advance Beyond Muxtar or Halt
  status: draft
  setting: East of Shusha, during the battle for Shusha, Azerbaijani mechanized brigade
  decider: The mechanized brigade commander
  agent: The mechanized brigade commander
  agent_role: decide
  situation: The Azerbaijani mechanized brigade had fought at the line of contact in the opening days of the war and had since
    been held in reserve. Its commander was assessed as wanting greater involvement than the immediate requirement called
    for. The brigade had advanced as far as Muxtar, east of Shusha. It had accomplished its mission of drawing Armenian reinforcements
    away from Shusha, while its forces did not want to incur additional casualties by advancing farther.
  question: 'What should the mechanized brigade commander do after the brigade has drawn Armenian reinforcements away from
    Shusha: advance beyond Muxtar or halt there?'
  options:
    O1:
      do: The mechanized brigade commander advances the brigade beyond Muxtar.
      move: act
      irreversible: false
    O2:
      do: The mechanized brigade commander halts the brigade's advance at Muxtar.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The brigade had fought at the line of contact in the opening days of the war.
  - id: F2
    kind: situation
    status: confirmed
    fact: The brigade had been held in reserve since the opening days of the war.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The commander likely wanted the unit more involved in the fight than was required at the time.
  - id: F4
    kind: situation
    status: confirmed
    fact: The mechanized forces had advanced as far as Muxtar, east of Shusha.
  - id: F5
    kind: situation
    status: confirmed
    fact: The mechanized forces had accomplished their mission of drawing Armenian reinforcements away from Shusha.
  - id: F6
    kind: situation
    status: assessed
    fact: The mechanized forces did not want to incur additional casualties by trying to advance.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The brigade had already accomplished its assigned purpose of drawing Armenian reinforcements away from Shusha, so
      there was no further mission-based reason stated for advancing.
  - id: C2
    facts:
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Avoiding additional casualties was a reason not to advance farther.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The brigade's time in reserve and the assessed desire for greater involvement explain the pull toward advancing,
      but that desire was not what the situation required.
  reasoning:
    read: The decision is whether to continue after the brigade has already achieved its diversion mission. The trap is treating
      the brigade's earlier reserve status, or the assessed desire for greater involvement, as a mission requirement.
    weighing: The brigade had accomplished its diversion mission, and the mechanized forces did not want additional casualties
      from trying to advance. Those reasons favor halting at Muxtar {C1} {C2}; the assessed desire for greater involvement
      does not outweigh them {C3}. The balance could change if the assigned purpose or the situation materially changes.
    tradecraft: Record that the diversion mission was complete and that avoiding additional casualties supported halting.
      Reassess if the assigned purpose or the situation materially changes; do not treat a desire for greater involvement
      as a substitute for a mission need.
    uncertainty: The desire for greater involvement and the concern about casualties are assessments, and no further decision
      criteria for this choice are provided.
    handoff: The brigade commander is identified as the decision-maker, with no stated reason to refer this choice to another
      authority.
    tempting_wrong:
      option: O1
      pull: Advancing could feel like a way to involve a brigade that had been held in reserve.
      why_wrong: The diversion mission was already accomplished, and avoiding additional casualties was a reason not to advance;
        greater involvement alone is not a stated operational need.
    rejected:
      O1: Advancing beyond Muxtar was not chosen because the diversion mission was accomplished and avoiding additional casualties
        weighed against continuing.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The diversion mission had not been accomplished and advancing remained necessary to achieve it.
      then: O1
      why: An unmet assigned purpose could provide a mission-based reason to continue despite the casualty concern.
    would_not_change:
    - id: noflip1
      if: The commander still wanted the brigade more involved, but the diversion mission remained complete.
      why: A desire for greater involvement, without a further mission requirement, does not displace the reasons for halting.
    watch_for:
    - id: watch1
      what: Whether the assigned diversion purpose remains complete and whether advancing would impose additional casualties.
      favors:
      - O2
      why: Mission completion and avoiding additional casualties support not advancing farther.
  lesson: When an assigned purpose has been achieved, do not extend the operation merely to create greater involvement. Weigh
    any further mission need against the additional risk to one's own forces.
  limits: This reasoning applies to the stated choice after the diversion mission was accomplished. It does not establish
    that halting is appropriate if the mission remains unmet or circumstances materially change.
