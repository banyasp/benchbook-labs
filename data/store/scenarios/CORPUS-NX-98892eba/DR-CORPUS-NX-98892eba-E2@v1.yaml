        O2: 10
        O3: 12
      real_option: O2
      real_to_mean_other_length: 0.8
      real_is_longest: false
      moves:
        O1: act
        O2: act
        O3: hold
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
        O3: false
    equities: pilot2
