case:
  id: DR-CORPUS-NX-98892eba-E2@v1
  title: Selecting the Initial Mission Target
  status: draft
  setting: Washington and China, during China-based XXth Bomber Command planning.
  decider: The Washington decision-makers
  agent: The Washington decision-makers
  agent_role: decide
  situation: Washington decision-makers are choosing the initial mission target for the China-based XXth Bomber Command. Yawata
    is under consideration on the assessment that it contains Japan’s largest collection of coke ovens. The estimate rests
    on projections and hypotheses based on limited data, and the basis for the coke-oven estimate is not convincing to a 14th
    Air Force participant. The bombers cannot reach Yawata with anything like a full bomb load. Other priorities include the
    supply dumps at Hankow and an operational aircraft depot on Taiwan, each associated with potential effects on the broader
    campaign.
  question: What should the Washington decision-makers do about selecting the initial mission target?
  options:
    O1:
      do: The Washington decision-makers disapprove Yawata as the initial mission target and select Hankow.
      move: act
      irreversible: true
    O2:
      do: The Washington decision-makers approve Yawata as the initial mission target.
      move: act
      irreversible: true
    O3:
      do: The Washington decision-makers defer the initial target choice pending further intelligence review.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The XXth Bomber Command could have destroyed the supply dumps at Hankow in a single strike.
  - id: F2
    kind: situation
    status: confirmed
    fact: Japanese materiel at Hankow supported a drive that cost the 14th Air Force its eastern airfields and gave Japan
      an overland route between its holdings; Chinese military and civilian personnel losses numbered in the tens of thousands.
  - id: F3
    kind: capability
    status: assessed
    fact: An operational Japanese aircraft depot on Taiwan was within easy range under a full bomb load, and its destruction
      could have shortened the approach to the Philippines and saved losses of personnel, ships, and aircraft.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Washington assessed that Yawata contained Japan’s largest collection of coke ovens.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A 14th Air Force participant did not recall convincing grounds for the coke-oven estimate, although the target charts
      marked the ovens in color.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The program's conclusions relied on projections and hypotheses based on meager data of dubious authenticity, and
      its authors lacked the basic data to determine the proper use of the China-based B-29s.
  - id: F7
    kind: capability
    status: confirmed
    fact: The planes could not cover the distance to Yawata with anything like a full bomb load.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: strong
    why: The coke-oven estimate lacked convincing grounds, and the broader conclusions depended on projections and hypotheses
      built on meager, dubious data. The participant's central objection was that the planners lacked the basic data needed
      to determine the proper use of the China-based B-29s.
  - id: C2
    facts:
    - F1
    - F2
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Hankow's supply dumps could have been destroyed in one strike, and the materiel there supported a Japanese drive
      associated with tens of thousands of Chinese military and civilian personnel losses. This is a concrete alternative
      with grave human consequences.
  - id: C3
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Taiwan depot was within easy range under a full bomb load, and its destruction could have shortened the approach
      to the Philippines and saved substantial losses. This supports redirecting effort away from Yawata, although it does
      not itself establish that Hankow, rather than Taiwan, should be selected.
  - id: C4
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Washington selected Yawata on the assessment that it held Japan's largest collection of coke ovens. That was the
      stated target rationale, but the source questions its evidentiary foundation.
  - id: C5
    facts:
    - F7
    equity: resource_stewardship
    favors:
    - O1
    - O3
    weight: strong
    why: The planes could not reach Yawata with anything like a full bomb load, a significant limitation when comparing that
      mission with the stated alternatives.
  reasoning:
    read: 'Washington chose Yawata because it believed the site contained Japan''s largest collection of coke ovens. The trap
      is treating a confident estimate and colorful target charts as reliable evidence: the participant found no convincing
      basis for the estimate and judged the planning analysis to rest on meager, dubious data {C1}. The decision also had
      to be weighed against targets with stated campaign benefits {C2} {C3} and Yawata''s bomb-load limitation {C5}.'
    weighing: 'The source records that Washington proceeded with the original plan and that Yawata was chosen on the coke-oven
      assessment {C4}. It also records a forceful challenge to the data supporting that plan, a prepared alternative, and
      Washington''s rejection of that alternative {C1}. Hankow offered a concrete potential benefit in light of severe Chinese
      losses {C2}; the Taiwan depot offered a different potential campaign benefit {C3}. Thus O2 is the recorded outcome,
      but the source does not establish that the balance was sound: it preserves real disagreement over the plan''s evidentiary
      basis. The balance depends especially on whether the coke-oven estimate and the assumed strategic value of Yawata can
      be substantiated.'
    tradecraft: Separate the strategic case for a target from the confidence in the intelligence supporting it. Record the
      evidence gaps, the alternatives and their expected effects, the reasons for accepting or rejecting them, and the decision-maker's
      basis for proceeding; do not present unsupported estimates as established facts.
    uncertainty: The source supplies no convincing support for the coke-oven estimate and says the relevant planning analysis
      lacked basic data. It does not provide a quantified comparison of expected effects across the candidate targets, so
      it cannot resolve which target would have produced the greatest overall benefit.
    handoff: Washington's decision-makers held the target decision. The alternative program was prepared for transmission
      to the Joint Chiefs of Staff, and a 14th Air Force participant raised objections to the planning basis. A decision review
      should include relevant command and planning perspectives rather than relying solely on the original Washington assessment.
    tempting_wrong:
      option: O2
      pull: The asserted concentration of coke ovens at Yawata offered an apparently direct strategic rationale for the initial
        mission.
      why_wrong: That rationale depended on an estimate the participant could not recall being convincingly supported, within
        a program whose conclusions rested on meager data of dubious authenticity {C1}.
    rejected:
      O1: Washington did not adopt the alternative program, despite the source's stated case for Hankow and other priorities,
        and proceeded under the original plan.
      O3: Washington proceeded under the original plan rather than deferring the choice for further intelligence review.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C4
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A renewed review established that the coke-oven estimate was materially wrong and confirmed Hankow's stated campaign
        and human consequences as the stronger available priority.
      then: O1
      why: The Yawata rationale would lose its stated factual basis while the case for Hankow would remain concrete.
    - id: flip2
      if: The decision-maker could not resolve whether the coke-oven estimate or the comparative target assessments were reliable
        before choosing.
      then: O3
      why: Deferring for further review would avoid committing the initial mission on an evidentiary basis that remains uncertain.
    would_not_change:
    - id: noflip1
      if: The mistaken strike happened to damage another industrial establishment.
      why: That outcome would not validate the intelligence or reasoning behind selecting Yawata in advance.
    watch_for:
    - id: watch1
      what: Independent, credible support for the estimated coke-oven concentration and for Yawata's strategic value relative
        to the alternatives.
      favors:
      - O2
      why: It would address the source's central objection to the factual basis for selecting Yawata.
  lesson: A consequential decision should not treat a detailed presentation or confident estimate as a substitute for reliable
    underlying data. Compare the evidentiary basis and expected consequences of available alternatives, and make uncertainty
    explicit when choosing to proceed.
  limits: This scenario concerns the strategic choice of an initial mission target and the reliability of the stated intelligence
    rationale. It does not establish a legal rule, quantify comparative military effects, or determine what target should
    be chosen under different evidence or circumstances.
  library:
    domain: military-operational
    family: CORPUS-NX-98892eba
    source: https://www.cia.gov/resources/csi/static/e5497c1492b7444db09c1b2003f26b8b/B29s-Against-Coke-Ovens.pdf
    episode_focus: The decision point is selecting Yawata for the initial mission, reportedly because it was believed to contain
      Japan’s largest collection of coke ovens, despite the long-distance mission and available alternative priorities. Consider
      the target choice and the reliability of the intelligence behind it; exclude operational details and treat the mistaken
      damage to another industrial site as an outcome, not a separate decision.
    cues:
      option_words:
