case:
  id: DR-OHA-26-0011-restyle1@v1
  title: DOE Security Clearance Restoration Decision [restyle]
  status: needs_review
  setting: Department of Energy, Office of Hearings and Appeals – June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The employee, a contractor staff member of the Department of Energy, holds a position that requires a security
    clearance. A Notification Letter has raised substantial doubt under Guideline E (conduct) and Guideline I (psychological
    condition). The employee failed to disclose four disciplinary incidents on his QNSP, namely omissions of building checks,
    missed training, improper key-card use, and failure to report a missing ammunition magazine. A psychologist employed by
    the contractor reported anxiety symptoms that could impair judgment and reliability, and also identified integrity concerns,
    while the Personnel Security Specialist deemed the Guideline E issues justified. The employee submitted two colleagues'
    supportive statements and attempted to add further evidence, but the submission arrived late and was only partially admitted.
    The Administrative Judge must determine whether to reinstate the employee's access authorization.
  question: What should the Administrative Judge do about the Individual's access authorization?
  options:
    O1:
      do: The Administrative Judge denies restoration of the employee's access authorization immediately.
      move: act
      irreversible: false
    O2:
      do: The Administrative Judge grants provisional access authorization pending completion of treatment.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge restores the employee's access authorization without full restriction.
      move: act
      irreversible: false
    O4:
      do: The Administrative Judge defers the decision until further evidence is received.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a Department of Energy contractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: A Notification Letter has raised substantial doubt pursuant to Guideline E (conduct) and Guideline I (psychological
      condition).
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee failed to disclose four disciplinary actions on his QNSP, occurring in May 2021, July 2023, August
      2024, and October 2024.
  - id: F4
    kind: situation
    status: confirmed
    fact: These omitted actions comprised a failure to complete building checks, missing a training exercise, improper use
      of a key card, and not reporting a missing ammunition magazine.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A psychologist employed by the contractor reported anxiety symptoms that could impair judgment and reliability,
      and also identified integrity concerns.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Personnel Security Specialist concluded that the employee's disciplinary record and observed behavior substantiate
      concerns under Guideline E.
  - id: F7
    kind: situation
    status: confirmed
    fact: The employee submitted supportive statements from two coworkers who described him as reliable and emotionally stable.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employee did not provide the evidence in the prescribed format before the deadline; the tardy submission was
      only partially admitted.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Guideline E concerns are supported by multiple disciplinary actions omitted from the QNSP and corroborated by the
      Personnel Security Specialist; the judge finds these omissions raise serious doubts about reliability and trustworthiness.
  - id: C2
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The psychologist's assessment of anxiety symptoms and integrity problems, though not a formal diagnosis, is deemed
      sufficient to support a whole-person concern under Guideline I, but the judge ultimately finds the evidence inadequate
      to overcome the Guideline E findings.
  - id: C3
    facts:
    - F8
    - F7
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The employee was given a full hearing and opportunity to submit mitigating evidence, but the late, improperly formatted
      submission was excluded, limiting the ability to offset the adverse findings.
  - id: C4
    facts:
    - F2
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: 10 C.F.R. § 710.7(a) imposes a presumption against granting or restoring a clearance when substantial doubt exists;
      the judge follows this statutory standard.
  - id: C5
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The judge evaluates the totality of the record, giving greater weight to documented disciplinary infractions and
      the psychologist's professional opinion than to uncorroborated self-statements.
  reasoning:
    read: The determination hinges on whether the employee's conduct issues under Guideline E and the alleged psychological
      condition under Guideline I have been sufficiently mitigated to justify reinstating his DOE security clearance.
    weighing: The Administrative Judge balances the documented disciplinary omissions and the psychologist's anxiety findings
      against the employee's supportive colleague statements. Invoking the presumption in § 710.7(a) and the whole-person
      doctrine, the judge concludes that the unresolved Guideline E concerns outweigh any mitigating evidence, and that the
      psychologist's assessment does not meet the evidentiary threshold for a qualifying mental-health condition under Guideline
      I.
    tradecraft: The ruling is entered into the official OHA docket, citing the pertinent CFR provisions and adjudicative guidelines,
      and the denial is recorded in the employee's personnel security file.
    uncertainty: The judge notes limited corroboration for the November-6 exercise and explosion report, yet deems the disciplinary
      record alone sufficient to uphold the denial.
    handoff: The Administrative Judge makes the determination individually, as the statutory framework places the mitigation
      burden on the employee and the judge lacks authority to delegate the final clearance decision.
    tempting_wrong:
      option: O3
      pull: The employee's colleague endorsements and his own claim of no anxiety might appear to support a restoration.
      why_wrong: Relying on unverified self-reports would disregard the established pattern of omissions and disciplinary
        infractions, contravening the presumption against clearance when substantial doubt exists.
    rejected:
      O2: A provisional grant would clash with the clear finding that the employee's unresolved conduct issues constitute
        an unacceptable risk.
      O3: Restoration would ignore the weight of the Guideline E findings and the absence of credible mitigation.
      O4: Deferring the decision for additional evidence is unnecessary because the record already demonstrates unmitigated
        concerns.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had promptly and fully disclosed all disciplinary actions prior to being questioned, thereby meeting
        mitigating condition (a) of Guideline E.
      then: O3
      why: A good-faith correction would mitigate the conduct concern, potentially permitting restoration.
    - id: flip2
      if: A qualified mental-health professional issued a definitive diagnosis confirming the employee has no anxiety or other
        condition affecting judgment, and the contractor psychologist's report was withdrawn.
      then: O3
      why: Absent a mental-health issue, only the conduct concern remains, and if that were also mitigated, clearance could
        be reinstated.
    would_not_change:
    - id: noflip1
      if: The employee's colleague support statements were admitted as evidence.
      why: Colleague statements by themselves are insufficient to outweigh the documented disciplinary omissions and the statutory
        presumption against clearance.
    watch_for:
    - id: watch1
      what: New, verifiable proof of completed treatment and demonstrated behavioral change.
      favors:
      - O3
      why: If the employee can demonstrate sustained rehabilitation, the whole-person assessment may shift in favor of restoration.
  lesson: When an individual's record contains multiple documented conduct violations and omissions, the statutory presumption
    against granting a security clearance dominates unless the individual can show prompt, good-faith remediation. Supportive
    testimony alone cannot outweigh concrete disciplinary evidence.
  limits: This reasoning is limited to Department of Energy personnel-security adjudications governed by 10 C.F.R. Part 710
    and its adjudicative guidelines; it does not apply to other agencies or to criminal matters.
