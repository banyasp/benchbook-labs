case:
  id: DR-OHA-26-0011-revise1@v1
  title: DOE Security Clearance Restoration Decision [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires a security clearance. A Notification
    Letter raised substantial doubt under Guideline E (conduct) and Guideline I (psychological condition). The Individual
    omitted four disciplinary actions from his QNSP, including failures to complete building checks, missed training, improper
    use of a key card, and failure to report missing ammunition. A DOE contractor psychologist reported anxiety symptoms that
    may impair judgment and noted integrity problems, while the Personnel Security Specialist found the Guideline E concerns
    justified. The Individual submitted supportive statements from two colleagues and attempted to submit additional evidence,
    but the submission was late and only partially admitted. The Administrative Judge must decide whether to restore the Individual’s
    access authorization.
  question: What should the Administrative Judge do about the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: false
    O2:
      do: The Administrative Judge grants temporary access authorization pending further treatment.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: false
    O4:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Notification Letter raised substantial doubt under Guideline E (conduct) and Guideline I (psychological condition).
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual omitted four disciplinary actions from his QNSP, including incidents in May 2021, July 2023, August
      2024, and October 2024.
  - id: F4
    kind: situation
    status: confirmed
    fact: The omitted disciplinary actions involved failures to complete building checks, miss a training exercise, fail to
      use a key card, and failure to report a missing ammunition magazine.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE contractor psychologist reported anxiety symptoms that may impair judgment and reliability, and noted integrity
      problems.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Personnel Security Specialist found that the Individual’s disciplinary record and reported behavior justify
      Guideline E concerns.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual provided statements of support from two colleagues describing him as reliable and emotionally stable.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual failed to submit evidence in the required format by the deadline; the late submission was partially
      admitted.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Disciplinary omissions remain concerning, but a temporary grant pending treatment limits mission risk while allowing
      oversight of the Individual's behavior.
  - id: C2
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The psychologist's anxiety findings indicate a need for treatment; granting temporary access lets the Individual
      receive care while preserving security.
  - id: C3
    facts:
    - F8
    - F7
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Due-process considerations support a limited, conditional authorization rather than an outright denial when mitigating
      evidence exists.
  - id: C4
    facts:
    - F2
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Although §710.7(a) creates a presumption against restoration, that presumption can be softened when a temporary,
      treatment-contingent access is justified.
  - id: C5
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Analytic integrity now gives greater weight to the prospect of mitigation through treatment, favoring a temporary
      authorization.
  - id: C6
    facts:
    - F5
    - F7
    equity: risk_mitigation
    favors:
    - O2
    weight: strong
    why: The psychologist notes anxiety that could impair judgment, yet colleagues attest to the Individual's reliability;
      granting temporary access while treatment proceeds safeguards the mission and allows verification of mitigation.
  reasoning:
    read: The judge must balance documented conduct concerns and a reported anxiety condition against the Individual's reliability
      statements and the need for mission continuity.
    weighing: Weakened the weight of conduct-related considerations and introduced a strong, treatment-focused consideration,
      leading to the conclusion that a temporary access authorization pending treatment best reconciles security and fairness
      interests.
    tradecraft: The decision is entered into the OHA docket, citing the relevant CFR provisions, the new risk-mitigation consideration,
      and the temporary nature of the authorization.
    uncertainty: While the conduct violations remain unresolved, the temporary grant limits exposure and provides a window
      for the Individual to demonstrate remediation.
    handoff: The Administrative Judge retains sole authority to issue the temporary authorization, as the statutory framework
      requires a single adjudicator to balance security and mitigation factors.
    tempting_wrong:
      option: O1
      pull: The clear record of omitted disciplinary actions and anxiety symptoms may tempt the judge to deny any access outright.
      why_wrong: An outright denial disregards the possibility of treatment and the operational need for the Individual's
        role, imposing unnecessary hardship.
    rejected:
      O1: Denial ignores the potential for mitigation through treatment and unnecessarily disrupts mission staffing.
      O3: Full restoration would expose the program to risk before the anxiety condition is addressed.
      O4: Holding the decision pending further evidence would unduly prolong uncertainty; a temporary grant provides a practical
        interim solution.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C6
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A qualified mental-health professional provided a definitive diagnosis that the Individual has no anxiety or other
        condition impairing judgment, and the psychologist's report was withdrawn.
      then: O3
      why: Without a mental-health concern, only the conduct issue remains, and if it were also mitigated, clearance could
        be restored.
    - id: flip2
      if: The Individual had promptly and truthfully disclosed all disciplinary actions before being confronted, satisfying
        mitigating condition (a) of Guideline E.
      then: O1
      why: Such good-faith disclosure would remove the conduct concern, allowing the judge to maintain denial under the original
        standard.
    would_not_change:
    - id: noflip1
      if: The Individual's supportive statements from colleagues were admitted as evidence.
      why: Colleague statements alone are insufficient to outweigh documented disciplinary omissions and the presumption against
        clearance.
    watch_for:
    - id: watch1
      what: New, verifiable evidence of completed treatment and demonstrated behavioral change.
      favors:
      - O3
      why: If the Individual can prove sustained rehabilitation, the whole-person assessment may shift.
  lesson: When conduct concerns coexist with a treatable psychological condition, a temporary, treatment-contingent access
    authorization can balance security imperatives with fairness and mission continuity.
  limits: Applies to DOE personnel-security adjudications under 10 C.F.R. Part 710; not intended for other agencies or criminal
    contexts.
