case:
  id: DR-OHA-26-0011@v1
  title: DOE Security Clearance Restoration Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires a security clearance. A Notification
    Letter raised substantial doubt under Guideline E (conduct) and Guideline I (psychological condition). The Individual
    omitted four disciplinary actions from his QNSP, including failures to complete building checks, missed training, improper
    use of a key card, and failure to report missing ammunition. A DOE contractor psychologist reported anxiety symptoms that
    may impair judgment and noted integrity problems, while the Personnel Security Specialist found the Guideline E concerns
    justified. The Individual submitted supportive statements from two colleagues and attempted to submit additional evidence,
    but the submission was late and only partially admitted. The Administrative Judge must decide whether to restore the Individual’s
    access authorization.
  question: What should the Administrative Judge do about the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge denies restoration of the Individual’s access authorization.
      move: act
      irreversible: false
    O2:
      do: The Administrative Judge grants temporary access authorization pending further treatment.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: false
    O4:
      do: The Administrative Judge holds the decision pending additional evidence.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Notification Letter raised substantial doubt under Guideline E (conduct) and Guideline I (psychological condition).
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual omitted four disciplinary actions from his QNSP, including incidents in May 2021, July 2023, August
      2024, and October 2024.
  - id: F4
    kind: situation
    status: confirmed
    fact: The omitted disciplinary actions involved failures to complete building checks, miss a training exercise, fail to
      use a key card, and failure to report a missing ammunition magazine.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE contractor psychologist reported anxiety symptoms that may impair judgment and reliability, and noted integrity
      problems.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Personnel Security Specialist found that the Individual’s disciplinary record and reported behavior justify
      Guideline E concerns.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual provided statements of support from two colleagues describing him as reliable and emotionally stable.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual failed to submit evidence in the required format by the deadline; the late submission was partially
      admitted.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Guideline E concerns are supported by multiple disciplinary actions omitted from the QNSP and corroborated by the
      Personnel Security Specialist; the judge finds these omissions raise serious doubts about reliability and trustworthiness.
  - id: C2
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The psychologist’s assessment of anxiety symptoms and integrity problems, though not a formal diagnosis, is deemed
      sufficient to support a whole‑person concern under Guideline I, but the judge ultimately finds the evidence inadequate
      to overcome the Guideline E findings.
  - id: C3
    facts:
    - F8
    - F7
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The Individual was given a full hearing and opportunity to submit mitigating evidence, but the late, improperly formatted
      submission was excluded, limiting the ability to offset the adverse findings.
  - id: C4
    facts:
    - F2
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: 10 C.F.R. § 710.7(a) imposes a presumption against granting or restoring a clearance when substantial doubt exists;
      the judge follows this statutory standard.
  - id: C5
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The judge evaluates the totality of the record, giving greater weight to documented disciplinary infractions and
      the psychologist’s professional opinion than to uncorroborated self‑statements.
  reasoning:
    read: The case hinges on whether the Individual’s conduct (Guideline E) and alleged psychological condition (Guideline I)
      have been sufficiently mitigated to permit restoration of his DOE security clearance.
    weighing: The Administrative Judge balances the multiple, documented disciplinary omissions and the psychologist’s findings
      of anxiety‑related impairment against the Individual’s supportive statements. Citing the presumption in § 710.7(a) and
      the whole‑person concept, the judge concludes that the unresolved Guideline E concerns outweigh any mitigating evidence,
      and that the psychologist’s assessment does not meet the evidentiary threshold to establish a qualifying mental‑health
      condition under Guideline I.
    tradecraft: The decision is recorded in the official OHA decision docket, citing the relevant CFR provisions and adjudicative
      guidelines, and the denial is entered into the Individual’s personnel security file.
    uncertainty: The judge notes limited corroboration for the November‑6 exercise and explosion report, but finds the disciplinary
      record itself sufficient to sustain the denial.
    handoff: The Administrative Judge decides alone, as the statutory framework places the burden on the Individual to mitigate
      and the judge has no authority to delegate the final clearance determination.
    tempting_wrong:
      option: O3
      pull: The Individual’s supportive colleague statements and his claim of no anxiety might suggest a restoration.
      why_wrong: Relying on uncorroborated self‑reports would ignore the documented pattern of omissions and disciplinary
        infractions, violating the presumption against clearance when substantial doubt exists.
    rejected:
      O2: A temporary grant would conflict with the clear finding that the Individual’s unresolved conduct issues present
        an unacceptable risk.
      O3: Restoration ignores the weight of the Guideline E findings and the lack of credible mitigation.
      O4: Holding the decision pending additional evidence would be unnecessary because the record already shows unmitigated
        concerns.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had promptly and truthfully disclosed all disciplinary actions before being confronted, satisfying
        mitigating condition (a) of Guideline E.
      then: O3
      why: A good‑faith correction would mitigate the conduct concern and could allow restoration.
    - id: flip2
      if: A qualified mental‑health professional provided a definitive diagnosis that the Individual has no anxiety or other
        condition impairing judgment, and the psychologist’s report was withdrawn.
      then: O3
      why: Without a mental‑health concern, only the conduct issue remains, and if it were also mitigated, clearance could
        be restored.
    would_not_change:
    - id: noflip1
      if: The Individual’s supportive statements from colleagues were admitted as evidence.
      why: Colleague statements alone are insufficient to outweigh documented disciplinary omissions and the presumption against
        clearance.
    watch_for:
    - id: watch1
      what: New, verifiable evidence of completed treatment and demonstrated behavioral change.
      favors:
      - O3
      why: If the Individual can prove sustained rehabilitation, the whole‑person assessment may shift.
  lesson: When multiple, documented conduct violations and omissions exist, the presumption against granting a security clearance
    prevails unless the individual can demonstrate prompt, good‑faith remediation. Supportive testimony cannot outweigh concrete
    disciplinary evidence.
  limits: This analysis applies specifically to DOE personnel‑security adjudications under 10 C.F.R. Part 710 and the associated
    adjudicative guidelines; it does not extend to other agencies or to criminal proceedings.
