case:
  id: DR-OHA-26-0011-addfact1@v1
  title: DOE Security Clearance Restoration Decision [addfact]
  status: needs_review
  setting: U.S. Department of Energy, Office of Hearings and Appeals, June 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The employee of a DOE contractor holds a position that requires a security clearance and is slated to lead a
    time-sensitive engineering project that cannot start until his clearance is restored. A Notification Letter has raised
    substantial doubt under Guideline E (conduct) and Guideline I (psychological condition). The employee omitted four disciplinary
    actions from his QNSP—incidents from May 2021, July 2023, August 2024, and October 2024 involving failures to complete
    building checks, missing a training exercise, neglecting to use a key card, and not reporting a missing ammunition magazine.
    A contractor-employed psychologist reported anxiety symptoms that may impair judgment and flagged integrity concerns.
    The Personnel Security Specialist concluded that the disciplinary record and reported behavior substantiate the Guideline
    E concerns. The employee submitted two colleagues' statements attesting to his reliability and emotional stability, and
    later attempted to provide additional evidence, but the late filing was only partially admitted.
  question: What should the Administrative Law Judge decide regarding the employee's security clearance?
  options:
    O1:
      do: Deny restoration of the employee's security clearance.
      move: act
      irreversible: false
    O2:
      do: Grant a provisional clearance pending completion of treatment.
      move: partial
      irreversible: false
    O3:
      do: Restore the employee's security clearance in full.
      move: act
      irreversible: false
    O4:
      do: Suspend the decision until further evidence is received.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: He is scheduled to head a time-critical engineering effort that cannot begin until his clearance is reinstated.
  - id: F3
    kind: situation
    status: confirmed
    fact: A Notification Letter expressed substantial doubt under Guideline E (conduct) and Guideline I (psychological condition).
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee failed to disclose four disciplinary actions on his QNSP, the incidents occurring in May 2021, July
      2023, August 2024, and October 2024.
  - id: F5
    kind: situation
    status: confirmed
    fact: These omitted actions consisted of not completing building checks, missing a training exercise, neglecting to use
      a key card, and not reporting a missing ammunition magazine.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A psychologist employed by the contractor reported anxiety symptoms that could impair judgment and reliability,
      and also noted concerns about integrity.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Personnel Security Specialist concluded that the employee's disciplinary record and reported behavior substantiate
      the Guideline E concerns.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employee submitted two colleagues' statements attesting to his reliability and emotional stability.
  - id: F9
    kind: situation
    status: confirmed
    fact: He attempted to provide additional evidence after the deadline; the late submission was only partially admitted.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Guideline E concerns are substantiated by the four omitted disciplinary actions ({F4}, {F5}) and reinforced by the
      Personnel Security Specialist's analysis; the judge concludes these omissions create a serious reliability deficit that
      outweighs any operational need.
  - id: C2
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The contractor-employed psychologist's observation of anxiety symptoms and integrity doubts satisfies a whole-person
      concern under Guideline I, and the judge finds this assessment, together with the conduct record, insufficiently mitigated.
  - id: C3
    facts:
    - F9
    - F8
    equity: due_process
    favors:
    - O1
    weight: weak
    why: Although the employee received a full hearing and attempted to submit additional evidence, the late filing ({F9})
      was only partially admitted, limiting its mitigating impact; the project's urgency ({F2}) was noted but deemed secondary
      to the unresolved security concerns.
  - id: C4
    facts:
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: 10 C.F.R. § 710.7(a) imposes a presumption against granting or restoring a clearance when substantial doubt exists;
      the judge adheres to this statutory standard.
  - id: C5
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: In the totality-of-the-record analysis, documented disciplinary infractions and the psychologist's professional opinion
      carry greater weight than uncorroborated colleague statements.
  reasoning:
    read: The adjudication must decide whether the employee's conduct (Guideline E) and alleged psychological condition (Guideline
      I) have been sufficiently mitigated to permit restoration of his DOE security clearance.
    weighing: The judge balances the multiple, documented disciplinary omissions and the psychologist's findings of anxiety-related
      impairment against the employee's supportive statements and the project's urgency. Citing the presumption in § 710.7(a)
      and the whole-person concept, the judge finds the unresolved Guideline E concerns dominate, and the psychologist's assessment
      does not meet the evidentiary threshold for a mitigating mental-health condition under Guideline I.
    tradecraft: The decision is entered into the official OHA docket, referencing the applicable CFR provisions and adjudicative
      guidelines; the denial is recorded in the employee's personnel security file.
    uncertainty: Limited corroboration exists for the specific incidents cited in the disciplinary record, but the pattern
      of omissions and infractions is sufficient to sustain the denial.
    handoff: The Administrative Law Judge decides unilaterally, as the statutory framework places the burden of mitigation
      on the employee and does not permit delegation of the final clearance determination.
    tempting_wrong:
      option: O3
      pull: The employee's colleague statements and claim of no anxiety might suggest a full restoration.
      why_wrong: Relying on uncorroborated self-reports would ignore the documented pattern of omissions and disciplinary
        infractions, violating the presumption against clearance when substantial doubt exists.
    rejected:
      O2: A provisional clearance would conflict with the clear finding that unresolved conduct and mental-health concerns
        present an unacceptable risk.
      O3: Restoration ignores the weight of the Guideline E findings and the lack of credible mitigation.
      O4: Holding the decision pending further evidence is unnecessary because the record already demonstrates unmitigated
        concerns.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had promptly and truthfully disclosed all disciplinary actions before being confronted, satisfying
        the mitigating condition (a) of Guideline E.
      then: O3
      why: A good-faith correction would mitigate the conduct concern and could allow restoration.
    - id: flip2
      if: A qualified mental-health professional provided a definitive diagnosis that the employee has no anxiety or other
        condition impairing judgment, and the psychologist's report was withdrawn.
      then: O3
      why: Without a mental-health concern, only the conduct issue remains, and if it were also mitigated, clearance could
        be restored.
    would_not_change:
    - id: noflip1
      if: The employee's supportive statements from colleagues were admitted as evidence.
      why: Colleague statements alone are insufficient to outweigh documented disciplinary omissions and the presumption against
        clearance.
    watch_for:
    - id: watch1
      what: New, verifiable evidence of completed treatment and demonstrated behavioral change.
      favors:
      - O3
      why: If the employee can prove sustained rehabilitation, the whole-person assessment may shift.
  lesson: When multiple, documented conduct violations and omissions exist, the statutory presumption against granting a security
    clearance prevails unless the individual can demonstrate prompt, good-faith remediation; supportive testimony cannot outweigh
    concrete disciplinary evidence.
  limits: This analysis is confined to DOE personnel-security adjudications under 10 C.F.R. Part 710 and the associated adjudicative
    guidelines; it does not extend to other agencies or to criminal proceedings.
