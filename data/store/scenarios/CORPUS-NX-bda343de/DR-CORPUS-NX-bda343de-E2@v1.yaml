case:
  id: DR-CORPUS-NX-bda343de-E2@v1
  title: Civilian Access to Intelligence-System Photography
  status: draft
  setting: United States, after the 1973 abolition of the Office of the President’s Science Adviser, in the Commission’s review
    of civilian use of aerial intelligence photography.
  decider: The Commission
  agent: The Commission
  agent_role: advise
  situation: Civilian agencies use aerial intelligence photography for projects including mapping, disaster assessment, pipeline
    route surveys, forest inventories, and crop-blight detection. The Director of Central Intelligence has entered agreements
    allowing several federal agencies access to classified overhead photography. Earlier arrangements provided photography
    on civilian-agency committee request, subject to no interference with intelligence needs and no significant cost increase.
    The civilian steering committee ceased to exist in 1973, while efforts to establish a new committee were underway. A concern
    is that information from a civilian use could potentially support an environmental criminal action.
  question: What should the Commission recommend the Director of Central Intelligence do about civilian agencies’ access to
    intelligence-system photography and the conditions governing that access?
  options:
    O1:
      do: The Commission recommends that the Director permit civilian access through a reestablished civilian committee under
        the existing operational and cost conditions.
      move: partial
      irreversible: false
    O2:
      do: The Commission recommends that the Director prohibit civilian agencies from using the photography and end existing
        agency access agreements.
      move: act
      irreversible: false
    O3:
      do: The Commission recommends that the Director permit civilian agencies to use the photography on request, subject
        to no intelligence interference or significant cost increase.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A steering committee for civilian use of aerial photography was established in 1967.
  - id: F2
    kind: situation
    status: confirmed
    fact: The steering committee was intended to serve as an interface through which the intelligence community could assure
      the public that it did not select or determine the end use of domestic aerial photographs.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Director of Central Intelligence agreed to provide photography on steering committee requests, provided there
      was no interference with intelligence needs and no significant cost increase.
  - id: F4
    kind: situation
    status: confirmed
    fact: Civilian uses included mapping, disaster assessment, pipeline route surveys, forest inventories, snow-cover assessment,
      crop-blight detection, and limited equipment testing and performance evaluation.
  - id: F5
    kind: situation
    status: confirmed
    fact: In 1973, the Office of the President’s Science Adviser was abolished and the special steering committee controlling
      civilian use ceased to exist; efforts were underway to establish a new committee.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Director of Central Intelligence had entered agreements with several federal agencies allowing them access to
      classified overhead photography.
  - id: F7
    kind: capability
    status: confirmed
    fact: The CIA engineered and developed most of the operational aerial photography systems, but was no longer responsible
      for their operational aspects.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Operating a single aerial photography program was considered economical and supported use of the photographs for
      appropriate civilian purposes.
  - id: F9
    kind: intelligence
    status: assessed
    fact: At least one present use was considered arguably law-enforcement in nature, and information from it could potentially
      support an environmental criminal action.
  - id: F10
    kind: authority
    status: confirmed
    fact: The National Security Act of 1947 prohibited the CIA from engaging in law-enforcement activities.
  considerations:
  - id: C1
    facts:
    - F4
    - F8
    equity: resource_stewardship
    favors:
    - O3
    - O1
    weight: strong
    why: The Commission found no impropriety in appropriate civilian use and considered a single photography program economical.
      This supports civilian access rather than ending it.
  - id: C2
    facts:
    - F2
    - F5
    equity: public_transparency
    favors:
    - O1
    weight: strong
    why: The civilian committee served as an interface to assure the public that the intelligence community did not select
      or determine domestic photographs’ end use. With that committee gone, reestablishing civilian oversight addresses the
      concern about improper domestic use.
  - id: C3
    facts:
    - F3
    equity: mission_effect
    favors:
    - O3
    - O1
    weight: strong
    why: The existing arrangement makes civilian access conditional on avoiding interference with intelligence needs and significant
      cost increases. Those conditions allow civilian use while preserving intelligence requirements and economy.
  - id: C4
    facts:
    - F9
    - F10
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The Commission recognized that a use could be law-enforcement in nature and that its information might support an
      environmental criminal action. It nevertheless reasoned that the 1947 prohibition could not have contemplated the systems
      then in use, supporting oversight rather than a general ban.
  reasoning:
    read: The question is whether appropriate civilian agencies may use imagery from an intelligence-developed system, and
      what safeguards should govern that access. The trap is treating possible downstream law-enforcement use as either proof
      that all civilian access is improper or as a reason to dispense with oversight; the Commission distinguished general
      civilian purposes from law-enforcement use and recommended a committee to address concern about domestic end use.
    weighing: The Commission’s conclusion that appropriate civilian use is not improper, together with the economy of one
      program, weighs against ending access {C1}. The former committee’s public-assurance role and its absence after 1973
      weigh against simply continuing agency agreements without civilian oversight {C2}. Access should remain subject to the
      stated limits on interference with intelligence needs and significant cost increases {C3}. Although one use raised a
      law-enforcement concern, the Commission did not treat that possibility as defeating civilian use generally {C4}; the
      balance therefore supports access through a reestablished civilian committee.
    tradecraft: Reestablish the civilian committee to oversee civilian uses, and keep the existing limits on interference
      with intelligence needs and significant cost increases explicit in the access process. Record the civilian purpose and
      the committee’s oversight so the distinction between intelligence-system access and selection of civilian end uses remains
      clear.
    uncertainty: The Commission described the law-enforcement character of at least one use as arguable and the prospect of
      criminal use as conceivable. The source does not specify the committee’s membership, procedures, or how it should resolve
      a disputed use.
    handoff: The Commission should recommend reestablishing a civilian-agency committee, rather than leaving oversight solely
      to the intelligence agency; the committee’s stated role is to address public concern about who determines civilian end
      use.
    tempting_wrong:
      option: O2
      pull: A use might support an environmental criminal action, while the National Security Act prohibited CIA law-enforcement
        activity.
      why_wrong: The Commission did not find that this possibility made civilian photography improper overall; it reasoned
        that the 1947 prohibition could not have contemplated the systems then in use and recommended civilian oversight to
        address the concern.
    rejected:
      O2: A general prohibition would reject civilian uses the Commission considered appropriate and economical, rather than
        addressing the identified concern through oversight.
      O3: Continuing access without a reestablished civilian committee would omit the public-assurance safeguard the Commission
        specifically recommended after the former committee ceased to exist.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The requested use were directly for law enforcement, rather than a civilian purpose whose information might later
        be used in a criminal action.
      then: O2
      why: The Commission distinguished law-enforcement activity and noted that the CIA had declined a request to use infrared
        photography to locate moonshine stills on that ground.
    - id: flip2
      if: Interference with intelligence needs or significant cost increases became persistent and could not be avoided through
        the committee arrangement.
      then: O2
      why: The source makes both matters conditions of providing the photography; if neither condition could be met, the basis
        for continued access under the recommended arrangement would fail.
    would_not_change:
    - id: noflip1
      if: Civilian-use information could potentially support an environmental criminal action, but the use was not itself
        law enforcement.
      why: The Commission addressed that possibility and still found no general impropriety in appropriate civilian use, while
        recommending committee oversight.
    watch_for:
    - id: watch1
      what: Whether a proposed civilian use interferes significantly with intelligence needs or increases costs significantly.
      favors:
      - O2
      why: Those are express limits on providing photography under the existing arrangement; sustained failure to meet them
        would undermine continued access.
  lesson: When a shared capability can serve appropriate civilian purposes efficiently, do not treat its intelligence origin
    alone as a reason to prohibit civilian access. Preserve clear limits on intelligence needs and cost, and use civilian
    oversight to separate access from intelligence-community control of domestic end uses.
  limits: This reasoning addresses the Commission’s review of aerial intelligence photography for civilian purposes, not every
    use of classified information or every law-enforcement request. It does not resolve how a committee should assess particular
    proposed uses or what rules should govern later use of information by civilian agencies.
