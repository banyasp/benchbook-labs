case:
  id: DR-CORPUS-NX-bda343de-E1@v1
  title: Testing on Unsuspecting Subjects
  status: draft
  setting: CIA drug-testing program in the United States, 1953–1963; Agency review in 1963.
  decider: The CIA
  agent: The CIA
  agent_role: decide
  situation: The CIA had tested LSD on unsuspecting subjects between 1953 and 1963. The Inspector General questioned the propriety
    of the practice and reported that some subjects became ill for hours or days. In one incident, an Army employee received
    LSD without knowing it and was told about it about 20 minutes later. He developed serious side effects, received psychiatric
    treatment, and died several days later. The General Counsel determined that the death resulted from circumstances arising
    out of an experiment undertaken in the employee’s official duties.
  question: What should the CIA do about further testing of potentially dangerous substances on unsuspecting persons?
  options:
    O1:
      do: The CIA should permit further testing of potentially dangerous substances on unsuspecting persons.
      move: act
      irreversible: false
    O2:
      do: The CIA should prohibit further testing of potentially dangerous substances on unsuspecting persons.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The CIA conducted tests of LSD on unsuspecting subjects between 1953 and 1963.
  - id: F2
    kind: situation
    status: confirmed
    fact: Early proposals called for testing to be carefully supervised and conducted in the presence of a qualified physician;
      some tests were later run on voluntary participants.
  - id: F3
    kind: situation
    status: confirmed
    fact: In 1963, the Inspector General questioned the propriety of testing on unsuspecting subjects and reported that subjects
      had become ill for hours or days in a number of instances.
  - id: F4
    kind: situation
    status: confirmed
    fact: In an incident during the early phase of the program, an Army employee received LSD without his knowledge and was
      told about it about 20 minutes later.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee developed serious side effects, received psychiatric treatment, and died several days later after jumping
      from a tenth-floor window.
  - id: F6
    kind: authority
    status: confirmed
    fact: The General Counsel ruled that the death resulted from circumstances arising out of an experiment undertaken in
      the employee’s official duties for the United States Government.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Remaining Agency records indicated that the employee may have had a history of emotional instability.
  considerations:
  - id: C1
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: The Commission concluded that testing potentially dangerous drugs on unsuspecting U.S. citizens was clearly illegal;
      continuing that practice is ruled out.
    rules_out:
    - O1
  - id: C2
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Subjects became ill for hours or days, and an employee who received LSD without knowing it suffered serious side
      effects and later died. The General Counsel treated the death as arising from an experiment undertaken in official duties.
  - id: C3
    facts:
    - F2
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The Commission judged that most testing could have been done using Agency personnel with their full knowledge. The
      availability of a less intrusive alternative weighs against exposing unsuspecting people.
  - id: C4
    facts:
    - F3
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: Following the Inspector General's review, the Agency prohibited further testing of potentially dangerous substances
      on unsuspecting subjects, and the Commission recommended that the CIA not resume it.
  reasoning:
    read: 'This is a decision about whether to continue a practice the Commission found clearly illegal, not merely whether
      testing can be supervised. The trap is to treat early proposals for medical supervision or the employee''s possible
      emotional instability as answers to the central issue: unsuspecting people were exposed, serious illness was reported,
      and one employee died after such an experiment.'
    weighing: The legal conclusion independently rules out {O1} {C1}. The reported illnesses and fatal incident reinforce
      the need to protect individuals {C2}, while the Commission's view that most testing could readily use Agency personnel
      who knew they were participating weakens any claim that unsuspecting subjects were necessary {C3}. The Agency's subsequent
      prohibition and the Commission's recommendation confirm the balance in favor of {O2} {C4}.
    tradecraft: Maintain a clear prohibition on testing potentially dangerous substances on unsuspecting people, record the
      legal and human-welfare basis for it, and ensure proposed human-subject activity is reviewed under the applicable guidelines
      before it proceeds.
    uncertainty: The surviving records did not establish all details of the hospitalization, and they only indicated that
      the employee may have had a history of emotional instability. That qualification does not negate the reported harms
      or the General Counsel's determination about the death.
    handoff: 'The CIA should involve legal counsel and the Inspector General in oversight of any proposed human-subject activity:
      the Inspector General raised the propriety concern, and the General Counsel addressed the legal status of the fatal
      incident.'
    tempting_wrong:
      option: O1
      pull: Early proposals contemplated medical supervision, and some testing involved volunteers, which might suggest that
        safeguards could make continued testing acceptable.
      why_wrong: Those circumstances do not make testing on unsuspecting people lawful or answer the harms reported in the
        actual program; the Commission found the practice clearly illegal and recommended against resuming it.
    rejected:
      O1: The Commission rejected continued testing on unsuspecting persons because it found the practice clearly illegal,
        noted serious harms, and concluded most testing could have used informed Agency personnel.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A binding legal change expressly authorized the specific practice and reliable evidence established that the substances
        at issue were not potentially dangerous, removing the legal and danger grounds stated for this decision.
      then: O1
      why: Those changes would remove the Commission's stated legal and safety bases for prohibition, though the ethical concern
        about exposing people without their knowledge would still require separate consideration.
    would_not_change:
    - id: noflip1
      if: Further information suggested that the employee had a history of emotional instability.
      why: That possibility does not change the reported illness of other subjects, the Commission's legal conclusion, or
        its finding that most testing could have used Agency personnel with their full knowledge.
    watch_for:
    - id: watch1
      what: Whether any proposed testing would again involve unsuspecting people.
      favors:
      - O2
      why: The Commission's recommendation and the Agency's stated policy specifically prohibit testing on unsuspecting persons.
  lesson: When a practice is found clearly illegal and has caused serious harm, prohibit its continuation rather than treating
    supervision as a substitute for lawful, informed participation. Where a less intrusive alternative is readily available,
    that further weakens the case for exposing unsuspecting people.
  limits: This reasoning addresses testing potentially dangerous substances on unsuspecting people in the United States. It
    does not decide the permissibility of research involving informed volunteers or other activity governed by different facts
    and applicable human-subject guidelines.
