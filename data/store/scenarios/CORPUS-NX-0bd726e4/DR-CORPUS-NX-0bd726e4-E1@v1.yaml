case:
  id: DR-CORPUS-NX-0bd726e4-E1@v1
  title: Programming the Autonomous Trolley
  status: draft
  setting: A hypothetical track, with the autonomous trolley’s action programmed in advance by its engineers.
  decider: The engineers responsible for programming the autonomous trolley.
  agent: The engineers responsible for programming the autonomous trolley.
  agent_role: decide
  situation: A runaway trolley is approaching a track occupied by five people, and a second track is occupied by one person.
    A lever can switch the trolley onto the second track, and the people on whichever track it takes will be killed. The trolley
    is autonomous, so engineers must establish its action in advance; it can execute its instructions without panic or hesitation.
    One moral framework evaluates the outcome by the number of lives saved, while another treats intentionally killing a person
    as prohibited. The programming choice is whether the trolley will divert to the second track or stay on its current course.
  question: What should the engineers program the autonomous trolley to do when it approaches the occupied tracks?
  options:
    O1:
      do: The engineers program the autonomous trolley to swerve onto the track occupied by one person.
      move: act
      irreversible: true
    O2:
      do: The engineers program the autonomous trolley to stay on its current course toward the track occupied by five people.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A runaway trolley is approaching a track where five people are standing.
  - id: F2
    kind: situation
    status: confirmed
    fact: A second track has one person on it.
  - id: F3
    kind: situation
    status: confirmed
    fact: The people on whichever track the trolley takes will be killed.
  - id: F4
    kind: capability
    status: confirmed
    fact: A lever can switch the trolley onto the other track when pulled.
  - id: F5
    kind: situation
    status: confirmed
    fact: For an autonomous trolley, the action in this scenario must be programmed in advance.
  - id: F6
    kind: capability
    status: confirmed
    fact: The trolley can execute its instruction quickly without panic or hesitation.
  - id: F7
    kind: situation
    status: assessed
    fact: Utilitarian reasoning treats diverting the trolley to kill one person rather than five as the morally preferable
      choice because it saves more lives.
  - id: F8
    kind: situation
    status: assessed
    fact: Deontological reasoning treats killing a person as morally wrong, including when doing so would save more lives.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Under utilitarian reasoning, diverting the trolley sacrifices one life rather than five and therefore saves more
      lives.
  - id: C2
    facts:
    - F3
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Deontological reasoning treats intentionally killing a person as morally wrong, even when doing so would save more
      lives.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: analytic_integrity
    favors: []
    weight: weak
    why: Utilitarianism treats good as quantifiable and additive, but moral considerations may not be; whether the people’s
      characteristics should affect the decision remains unanswered.
  - id: C4
    facts:
    - F7
    - F8
    equity: duty_to_individual
    favors: []
    weight: weak
    why: 'Both frameworks face difficulties: utilitarianism may permit morally troubling means, while deontological rules
      can conflict, such as the rule against killing and the duty to save lives.'
  reasoning:
    read: 'This is a moral choice that engineers must establish in advance, rather than a bystander’s split-second reaction.
      The trap is treating the numerical outcome as the whole moral question: utilitarian reasoning favors diverting, while
      deontological reasoning objects to intentionally killing the one person.'
    weighing: On the utilitarian standard, {C1} supports {O1} because it saves more lives. {C2} supplies a serious competing
      objection. Utilitarian calculations may not capture all relevant moral considerations, and deontological rules can conflict.
      The required choice of {O1} is therefore conditional on giving the utilitarian life-saving standard priority, not a
      universally established moral resolution.
    tradecraft: Because the choice is programmed in advance, record the selected course and the moral standard used, including
      the competing objection and the limits of the analysis. Do not present the conditional choice as an uncontested moral
      rule.
    uncertainty: The two moral frameworks conflict, and neither is established as the final answer. Whether the identities
      or circumstances of those on the tracks should matter is also unresolved.
    handoff: No approval hierarchy or required reviewer is specified. As a decision practice, involve the responsible ethics
      or policy reviewers in documenting which moral standard governs the programming choice; this is a synthesis, not a procedure
      stated in the text.
    tempting_wrong:
      option: O2
      pull: The deontological prohibition against killing makes staying on course seem like the only morally permissible choice.
      why_wrong: That treats one framework as conclusive even though the life-saving utilitarian reason supports diversion
        and deontological rules can conflict; {O2} is not established as the resolution.
    rejected:
      O2: It is not selected under the conditional utilitarian standard because it leaves five people to die rather than diverting
        the trolley to the track with one person.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The engineers treat the deontological rule against intentionally killing a person as controlling.
      then: O2
      why: That framework treats killing the person on the second track as morally wrong even if diverting would save more
        lives.
    would_not_change:
    - id: noflip1
      if: The trolley’s ability to execute its instruction quickly and without hesitation is unchanged.
      why: That capability makes advance programming important but does not resolve the competing moral reasons for diverting
        or staying on course.
    watch_for:
    - id: watch1
      what: Whether the people on the tracks are described as helpless babies or as murderers who escaped from prison.
      favors:
      - O1
      - O2
      why: Whether those circumstances should affect the decision is raised but left unanswered.
  lesson: When a moral framework makes the choice depend on outcomes, compare the lives saved; do not mistake that calculation
    for a complete account of moral permissibility. State the governing standard and preserve material disagreement when another
    framework objects to the means.
  limits: This reasoning addresses only the stated hypothetical and its two moral frameworks. It does not establish a legal
    rule, an engineering standard, or a general authorization to sacrifice one person to save others.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-0bd726e4
    source: https://jsouapplicationstorage.blob.core.windows.net/press/3/21-9.pdf
    episode_focus: The passage presents pulling the lever as the utilitarian choice because it saves more lives, while contrasting
      that reasoning with a deontological objection to intentionally killing one person. Treat the choice as conditional on
      the utilitarian standard, not as a resolution endorsed by the document; exclude the later military-robot examples, which
      do not state a chosen course.
    cues:
      option_words:
        O1: 15
        O2: 19
      real_option: O1
      real_to_mean_other_length: 0.79
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The utilitarian position endorses pulling the lever because five human lives are a greater good than one; this is one
  side of the moral dispute, not its final resolution.
