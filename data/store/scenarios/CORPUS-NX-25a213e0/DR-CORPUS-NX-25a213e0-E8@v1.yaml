case:
  id: DR-CORPUS-NX-25a213e0-E8@v1
  title: Command of the Initial Phase
  status: draft
  setting: Central Region of Europe, early 1960s, Soviet planning for a Warsaw Pact contingency plan.
  decider: Soviet planners
  agent: Soviet planners
  agent_role: decide
  situation: The planning problem concerned a Warsaw Pact contingency for war with NATO in the Central Region of Europe. The
    prior concept placed the initial offensive mainly in Soviet hands, including forces based in the western USSR, and integrated
    East European forces into Soviet-led Fronts. That approach depended on high combat readiness among Soviet forces in the
    western USSR. Soviet ground-force strength had fallen in the early 1960s, and this was assessed as probably making the
    previous concept infeasible. East European ground forces were being improved to take on greater responsibilities, and
    forces were already deployed in East Germany, Czechoslovakia, and Poland.
  question: What should Soviet planners do about command and responsibility for the Warsaw Pact plan's initial offensive phase?
  options:
    O1:
      do: Soviet planners centralize the opening offensive in Soviet-led Fronts, integrate East European forces into those
        Fronts, and use Soviet forces, including those based in the western USSR, from the outset.
      move: act
      irreversible: false
    O2:
      do: Soviet planners delegate the opening offensive to deployed East European forces, preserve Czech and Polish command
        of their national forces, and bring Soviet forces in after initial objectives are gained.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The contingency plan addressed war with NATO in the Central Region of Europe.
  - id: F2
    kind: capability
    status: confirmed
    fact: Forces of East Germany, Czechoslovakia, and Poland were already deployed in the Central Region.
  - id: F3
    kind: situation
    status: confirmed
    fact: Under the previous plan, Soviet forces were to conduct most of the initial offensive, including forces based in
      the western USSR.
  - id: F4
    kind: situation
    status: confirmed
    fact: The previous plan integrated East European forces into Soviet-led Fronts.
  - id: F5
    kind: capability
    status: confirmed
    fact: The previous concept required a high level of combat readiness from Soviet forces in the western USSR.
  - id: F6
    kind: capability
    status: confirmed
    fact: Soviet ground-force strength was reduced in the early 1960s.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The reduction in Soviet ground-force strength probably made the previous plan infeasible.
  - id: F8
    kind: capability
    status: confirmed
    fact: East European ground forces were being improved to permit them to assume greater responsibilities.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The previous Soviet-led opening depended on high readiness among western USSR forces, and their reduced strength
      probably made that concept infeasible. This directly favors changing who carries the initial responsibility.
  - id: C2
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: East European ground forces were being improved specifically to assume greater responsibilities, supporting their
      use in the initial phase.
  - id: C3
    facts:
    - F2
    - F8
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: Forces from the relevant East European states were already deployed in the region, and the revised plan gives the
      Czechs and Poles command over their own national forces while assigning those forces greater responsibility.
  reasoning:
    read: 'The problem is not simply whether to retain Soviet command or delegate: the prior arrangement relied on a level
      of Soviet readiness that reduced Soviet ground-force strength probably made infeasible. The trap is treating the previous
      Soviet-led structure as workable without accounting for that changed capability.'
    weighing: The balance favors {O2}. The previous plan's readiness requirement and the assessment that reduced Soviet strength
      probably made it infeasible weigh against {O1}; improvements to East European forces intended to permit greater responsibility
      support {O2}. The case depends in part on the assessment of infeasibility, which is stated as probable rather than certain.
    tradecraft: Record the capability assessment and the reason for shifting initial responsibility, distinguish the probable
      infeasibility judgment from confirmed force changes, and revisit the arrangement if the underlying capabilities change.
    uncertainty: The source characterizes the prior plan's infeasibility as probable. It does not quantify readiness or force
      levels, or describe a separate assessment of the revised plan's risks.
    handoff: The decision belongs to the Soviet planners responsible for the contingency plan. The source gives no basis for
      requiring another authority's approval or identifying a separate handoff.
    tempting_wrong:
      option: O1
      pull: It preserves the previous Soviet-led approach and keeps East European forces integrated into Soviet-led Fronts.
      why_wrong: That approach depended on high readiness among Soviet forces in the western USSR, while the reduction in
        Soviet ground-force strength probably made the previous concept infeasible.
    rejected:
      O1: It was not chosen because the previous Soviet-led opening probably became infeasible after Soviet ground-force strength
        was reduced, while East European forces were being improved to assume greater responsibility.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Soviet ground-force strength and the required readiness of forces in the western USSR were restored sufficiently
        to make the previous concept feasible.
      then: O1
      why: The source identifies reduced Soviet strength as the reason the previous Soviet-led approach probably became infeasible;
        reversing that condition could remove the stated reason for changing the opening arrangement.
    would_not_change:
    - id: noflip1
      if: East European forces were already deployed in the region but were not being improved to assume greater responsibilities.
      why: Deployment alone would not address the source's central concern that the previous concept probably became infeasible
        because of reduced Soviet ground-force strength.
    watch_for:
    - id: watch1
      what: Whether Soviet force strength and western USSR readiness change enough to alter the assessment that the previous
        concept was infeasible.
      favors:
      - O1
      why: The source makes the feasibility of the prior approach depend on high Soviet readiness and identifies reduced Soviet
        strength as a likely cause of infeasibility.
  lesson: When a plan depends on a capability that has diminished, do not preserve its command arrangement merely because
    it was the previous design. Reassess who can assume responsibility, and align the plan with forces being developed to
    meet that need.
  limits: This reasoning concerns the stated capability and command changes in this contingency plan; it does not establish
    a general rule favoring delegation or national command. It also does not resolve operational questions beyond the source's
    assessment of feasibility and force improvements.
  library:
    domain: operational-command
    family: CORPUS-NX-25a213e0
    source: https://www.cia.gov/static/136e6394aacf5c13cb058d949267cc58/CIA-Analysis-of-the-Warsaw-Pact-Forces-The-Importance-of-Clandestine-Reporting.pdf
    episode_focus: 'The decision point is the change in who would command and conduct the plan’s initial phase, with Soviet
      forces entering later. Compare that choice with the previous plan and its stated rationale: reduced Soviet ground-force
      strength made the previous approach probably infeasible, while East European forces were being improved. Exclude tactical
      execution details.'
    cues:
      option_words:
        O2: 30
        O1: 30
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The Directorate of Intelligence's 18 June 1968 memorandum describes the revised plan as assigning the initial offensive
  to forces already deployed in East Germany, Czechoslovakia, and Poland, with Soviet forces entering after initial objectives
  are gained; it links the change to the probable infeasibility of the previous approach and improvements in East European
  forces.
