case:
  id: DR-CORPUS-NX-bc82cbd7-E1@v1
  title: Role 2 Care or Hospital Transfer
  status: draft
  setting: CHHC, during COVID-19 operations; C/101BSB Role 2 facility.
  decider: C/101BSB
  agent: C/101BSB
  agent_role: decide
  situation: C/101BSB's Role 2 facility at CHHC was operating during COVID-19 response. Its ordinary ventilator capability
    was mainly intended to stabilize casualties with healthy lungs pending evacuation, while its equipment and support capacity
    were limited for respiratory disease and critically ill ventilated patients. The facility also had limitations in broader
    non-oxygen support for COVID-19 patients without augmentation, training, laboratory capacity, and continuous monitoring.
    Organic PPE and infection-control capacity was insufficient for respiratory-infection operations without additional support
    and training, and CHHC had no negative-pressure rooms. C/101BSB had begun cross-training coordination with 1CAB, and IACH
    supported PPE resources and fit testing for personnel.
  question: 'What should C/101BSB do with critically ill COVID-19 patients at its Role 2 facility: retain them there or transfer
    them to IACH or network hospitals?'
  options:
    O1:
      do: C/101BSB transfers critically ill COVID-19 patients to IACH or network hospitals.
      move: act
      irreversible: false
    O2:
      do: C/101BSB retains critically ill COVID-19 patients at the Role 2 facility.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: Role 2 ventilator capability usually supports casualties with healthy lungs and stabilizes them before evacuation
      to a higher level of care.
  - id: F2
    kind: capability
    status: confirmed
    fact: The BSMC could intubate casualties but lacked appropriate equipment to protect medical personnel during aerosolizing
      procedures.
  - id: F3
    kind: capability
    status: confirmed
    fact: The ventilators assigned to the BSMC were not suitable for properly caring for patients with respiratory disease.
  - id: F4
    kind: capability
    status: confirmed
    fact: The BSMC lacked numerous support capabilities associated with caring for a ventilated patient.
  - id: F5
    kind: capability
    status: confirmed
    fact: C/101BSB had limited capability to manage complications for critically ill patients on ventilators.
  - id: F6
    kind: capability
    status: confirmed
    fact: Role 2 had limited capacity for non-oxygen-related COVID-19 support without augmented CLVIII, training, comprehensive
      lab work, and continuous monitoring.
  - id: F7
    kind: capability
    status: confirmed
    fact: PPE and infection-control precautions for respiratory infections exceeded organic BSMC capabilities and required
      additional CLVIII support, training, and N95 fit testing.
  - id: F8
    kind: situation
    status: confirmed
    fact: CHHC did not have negative-pressure rooms.
  - id: F9
    kind: situation
    status: confirmed
    fact: C/101BSB coordinated cross-training with 1CAB on air medical ventilators that were more advanced than those organic
      to the ABCT.
  - id: F10
    kind: situation
    status: confirmed
    fact: IACH supported C/101BSB in ensuring medical personnel at CHHC had N95 fit testing and recommended PPE and decontamination
      control measures.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The facility's ordinary ventilator role was stabilization before evacuation, and its equipment and support capabilities
      were insufficient for respiratory-disease patients and complications in critically ill ventilated patients.
  - id: C2
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Without augmented supplies, training, comprehensive laboratory work, and continuous monitoring, Role 2 had limited
      capacity for the broader non-oxygen support anticipated for COVID-19 patients.
  - id: C3
    facts:
    - F2
    - F7
    - F8
    - F10
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Respiratory-infection PPE and infection-control needs exceeded organic capability, and CHHC lacked negative-pressure
      rooms. IACH provided fit testing, recommended PPE, and decontamination measures, mitigating but not eliminating the
      stated capability concern.
  - id: C4
    facts:
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Cross-training with 1CAB on more advanced air-medical ventilators was a capability-building effort, but the source
      does not indicate it supplied the broader support needed to keep critically ill COVID-19 patients at Role 2.
  reasoning:
    read: The facility could intubate and had ventilators, but its ordinary role was to stabilize casualties with healthy
      lungs pending evacuation. The trap is treating those capabilities, or cross-training on more advanced ventilators, as
      equivalent to the equipment, monitoring, support tasks, and infection-control capacity required to retain critically
      ill COVID-19 patients.
    weighing: The respiratory-disease and critically ill patient support gaps, together with limited broader COVID-19 support,
      favor transfer. PPE assistance reduced one concern, and cross-training was underway, but neither was stated to close
      the full set of gaps. The balance could be reconsidered if augmentation, training, laboratory capacity, monitoring,
      and other needed support were actually available; on the stated facts, C/101BSB determined that critical patients would
      be transferred.
    tradecraft: Record the capability basis for the disposition and coordinate the transfer with IACH or a network hospital.
      Distinguish completed support from planned training or coordination, and document any change in capability before revisiting
      the disposition.
    uncertainty: The stated reasons address facility-wide capability, not an individual patient's circumstances, receiving-hospital
      capacity, or transfer availability. Those matters should not be assumed from this record.
    handoff: C/101BSB made the disposition decision; transfer requires coordination with IACH or network hospitals. 1CAB's
      role was cross-training, while IACH also supported PPE and infection-control measures.
    tempting_wrong:
      option: O2
      pull: The facility could intubate, cross-training with 1CAB was underway, and IACH had supported PPE and fit testing.
      why_wrong: Those measures did not establish that Role 2 could provide the full range of respiratory-disease and critical-patient
        support that the source identified as lacking.
    rejected:
      O2: C/101BSB did not retain critically ill patients because its ventilator-related, broader support, and infection-control
        capabilities were insufficient for that level of care.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Role 2 had the necessary augmentation and training, comprehensive laboratory capacity and continuous monitoring,
        and the support capability to manage critically ill ventilated patients.
      then: O2
      why: That would address the principal capability gaps given as the reason for transferring critical patients.
    - id: flip2
      if: The facility's respiratory-disease equipment and infection-control capacity were brought to an adequate level in
        addition to closing the critical-patient support gaps.
      then: O2
      why: Retention could be reconsidered if the limitations supporting transfer were actually resolved, rather than only
        partly mitigated.
    would_not_change:
    - id: noflip1
      if: IACH continued to provide PPE, fit testing, and decontamination support, but the ventilator-related and broader
        patient-support gaps remained.
      why: PPE assistance mitigates the infection-control concern but does not by itself resolve the stated limitations in
        critical-patient and non-oxygen support.
    - id: noflip2
      if: Cross-training on more advanced air-medical ventilators continued without the broader support capabilities needed
        to care for critically ill patients.
      why: A more advanced ventilator alone would not supply the other support capabilities identified as deficient.
    watch_for:
    - id: watch1
      what: Whether augmentation, training, laboratory capacity, continuous monitoring, and other needed critical-patient
        support become available in practice.
      favors:
      - O2
      why: A verified change in the capabilities underlying the transfer decision could warrant reassessing whether retention
        is appropriate.
  lesson: Do not equate the ability to stabilize or perform an initial procedure with the capability to retain a critically
    ill patient. Transfer is supported when the facility lacks the broader equipment, support, monitoring, and protective
    capacity required for the patient's needs; reconsider only when those gaps are actually closed.
  limits: This reasoning concerns the stated COVID-19 capability gaps at this Role 2 facility. It does not establish a general
    rule for every Role 2 facility or resolve patient-specific, receiving-hospital, or transport circumstances not addressed
    here.
