case:
  id: DR-OHA-26-0101-flip1@v1
  title: Restoration of Access Authorization under Guideline F [flip]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy, August 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The subject failed to submit his federal and state income tax returns for the 2023 and 2024 filing periods, prompting
    the Local Security Office to suspend his clearance and issue a Notification Letter that cited Guideline F financial concerns.
    He fully disclosed the omission in the February 2026 security questionnaire. After receiving the letter, he hired a certified
    public accountant in early April 2026, who prepared the delinquent returns for 2023-2025. The Treasury has not yet entered
    the 2023-2024 package, and a $4,200 balance for those years remains unpaid. The subject has arranged to retain the CPA
    for future filings and described a backup plan if the CPA becomes unavailable. His partner testified that he is generally
    dependable and that personal circumstances contributed to the lapse.
  question: How should the Administrative Law Judge rule on the subject's access authorization under Guideline F?
  options:
    O1:
      do: Place a six-month administrative hold on the subject's access authorization.
      move: hold
      irreversible: false
    O2:
      do: Order the Local Security Office to provide mandatory counseling to the subject.
      move: ask
      irreversible: false
    O3:
      do: Restore the subject's access authorization, allowing him to resume duties.
      move: act
      irreversible: true
    O4:
      do: Refuse to restore the subject's access authorization and maintain the denial.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The subject neglected to submit both federal and state income tax returns for the 2023 and 2024 filing periods.
  - id: F2
    kind: authority
    status: confirmed
    fact: Following the omission, the Local Security Office placed the subject's clearance on hold and issued a Notification
      Letter citing concerns under Guideline F.
  - id: F3
    kind: capability
    status: confirmed
    fact: In the February 2026 security questionnaire, the subject fully disclosed the missed filings.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual retained a CPA in early April 2026; the CPA prepared the 2023‑2025 tax paperwork, but the 2023‑2024
      package has not yet been entered into the Treasury’s processing system.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual received a federal and state payment for the 2025 tax year, with no disbursement reported for the
      2023‑2024 period.
  - id: F6
    kind: situation
    status: confirmed
    fact: Records show a residual balance of $4,200 for the 2023‑2024 tax year remains unsettled.
  - id: F7
    kind: capability
    status: assessed
    fact: The subject intends to keep the CPA for upcoming tax years and has outlined a backup plan to file extensions or
      engage another professional if the CPA becomes unavailable.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A personal reference from the subject's partner described him as generally dependable and noted that personal circumstances
      contributed to the filing lapse.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The Treasury has not processed the 2023-2024 returns and a $4,200 balance remains, so mitigating condition (g) of
      Guideline F is unsatisfied, leaving the financial concern unresolved.
  - id: C2
    facts:
    - F1
    - F3
    - F8
    equity: due_process
    favors:
    - O4
    weight: weak
    why: Full disclosure and a character reference are positive, but the outstanding tax liability means the required mitigating
      conditions for restoration are lacking.
  - id: C3
    facts:
    - F4
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O4
    weight: weak
    why: Post-notification actions demonstrate intent to remediate, yet the lingering $4,200 debt indicates continued risk
      that outweighs those efforts.
  - id: C4
    facts:
    - F3
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Disclosure satisfies honesty requirements but does not address the unresolved tax balance, so it cannot support restoration.
  reasoning:
    read: The core issue is the subject's unpaid $4,200 tax balance for 2023-2024, which keeps the Guideline F financial concern
      active despite corrective steps.
    weighing: Mitigating condition (g) is not met because the Treasury has not recorded the returns and a balance remains.
      Consequently, the security concern is unresolved, and denial of the access authorization is warranted. The subject's
      proactive measures are noted but do not erase the existing liability.
    tradecraft: The Judge issues a written decision citing 10 C.F.R. § 710.7(c) and the Adjudicative Guidelines, documenting
      that the outstanding tax debt precludes restoration under Guideline F.
    uncertainty: High; the record clearly shows an unpaid tax balance, leaving little doubt about the continued financial
      risk.
    handoff: The Administrative Law Judge decides unilaterally, as OHA regulations vest sole authority for clearance determinations
      in the Judge after a hearing.
    tempting_wrong:
      option: O3
      pull: The subject's engagement of a CPA and a contingency plan may suggest the risk has been mitigated.
      why_wrong: The outstanding $4,200 balance means mitigating condition (g) remains unmet, so restoration would conflict
        with Guideline F requirements.
    rejected:
      O1: A hold would postpone an inevitable denial while the tax debt remains unpaid.
      O2: Counseling is unnecessary because the unresolved financial liability, not lack of awareness, drives the concern.
      O3: Denial of restoration ignores the persisting tax balance, violating the adjudicative standards for Guideline F.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the Treasury had recorded the 2023-2024 returns and the $4,200 balance had been fully paid, eliminating any outstanding
        tax liability.
      then: O3
      why: With condition (g) satisfied, the Guideline F concern would be resolved, making restoration appropriate.
    would_not_change:
    - id: noflip1
      if: If mitigating condition (a) were later found to apply
      why: Condition (g) already resolves the concern, so the outcome would remain restoration.
    watch_for:
    - id: watch1
      what: Any future failure to file tax returns on time
      favors:
      - O4
      why: A recurrence would re-create a substantial doubt under Guideline F.
  lesson: When a clearance holder retains an outstanding tax balance, Guideline F remains unsatisfied regardless of post-notification
    corrective actions. The presence of any unpaid tax liability mandates denial of the access authorization.
  limits: This principle applies only when a tax balance remains unpaid or unprocessed by the Treasury. It does not cover
    cases where all liabilities have been cleared, the returns have been entered into the system, or the individual demonstrates
    full compliance.
