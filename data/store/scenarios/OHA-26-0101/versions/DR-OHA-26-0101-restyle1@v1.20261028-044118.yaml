case:
  id: DR-OHA-26-0101-restyle1@v1
  title: Restoration of Access Authorization under Guideline F [restyle]
  status: needs_review
  setting: Office of Personnel Security, Department of Energy, August 2026
  decider: Senior Security Adjudicator
  agent: Senior Security Adjudicator
  agent_role: decide
  situation: The employee failed to submit his federal and state income tax returns for the 2023 and 2024 filing periods,
    prompting the Local Security Office to suspend his clearance and issue a notification letter that cited Guideline F financial
    considerations. He fully disclosed the omission on his February 2026 questionnaire for positions requiring a security
    clearance. After receiving the notification, he hired a certified public accountant in early April 2026, who prepared
    and filed the delinquent returns for 2023 through 2025. The employee subsequently received federal and state refunds for
    those years, and records confirm he has no outstanding tax liabilities. He has arranged to retain the CPA for future filings
    and described a contingency plan should the CPA become unavailable. The employee's partner testified that he is generally
    dependable and that personal circumstances contributed to the filing lapse.
  question: What action should the Senior Security Adjudicator take regarding the employee's access authorization under Guideline
    F?
  options:
    O1:
      do: The Senior Security Adjudicator postpones a final decision for a six-month period.
      move: hold
      irreversible: false
    O2:
      do: The Senior Security Adjudicator orders the Local Security Office to provide counseling.
      move: ask
      irreversible: false
    O3:
      do: The Senior Security Adjudicator restores the employee's security clearance with full privileges.
      move: act
      irreversible: true
    O4:
      do: The Senior Security Adjudicator denies reinstatement of the employee's security clearance permanently.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee did not submit his required federal and state income tax returns for the 2023 and 2024 filing periods.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Local Security Office placed the employee's clearance on hold and dispatched a notification letter referencing
      concerns under Guideline F.
  - id: F3
    kind: capability
    status: confirmed
    fact: The employee completely reported his tax-filing omissions on the February 2026 questionnaire for positions requiring
      a security clearance.
  - id: F4
    kind: capability
    status: confirmed
    fact: In early April 2026, the employee engaged a certified public accountant who prepared and submitted the tax returns
      for 2023 through 2025.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee obtained federal and state refunds for the 2023-2025 periods, confirming acceptance of the filings
      by the tax agencies.
  - id: F6
    kind: situation
    status: confirmed
    fact: Records demonstrate that the employee carries no unpaid tax liabilities for the years in question.
  - id: F7
    kind: capability
    status: assessed
    fact: The employee intends to keep the CPA for subsequent filings and has devised a backup procedure to request extensions
      or secure alternative assistance if the CPA becomes unavailable.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A personal reference from the employee's partner attested to his overall reliability and cited personal circumstances
      as a factor in the filing lapse.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Because the employee filed the overdue 2023-2024 returns, the tax agencies accepted them, and he holds no remaining
      tax liabilities, the requirements of mitigating condition (g) under Guideline F are met.
  - id: C2
    facts:
    - F1
    - F3
    - F8
    equity: due_process
    favors:
    - O3
    weight: weak
    why: Although mitigating conditions (a), (b), and (c) are absent, their lack does not bar reinstatement since condition
      (g) alone satisfies the guideline.
  - id: C3
    facts:
    - F4
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The employee's proactive response following the notification—engaging a CPA, submitting the overdue returns, and
      establishing a contingency plan—indicates dependable future conduct.
  - id: C4
    facts:
    - F3
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The employee's complete and prompt disclosure of the tax-filing lapse on the February 2026 questionnaire fulfills
      the honesty and accountability standards.
  reasoning:
    read: The security issue originates from the employee's failure to file the 2023-2024 tax returns, triggering Guideline
      F. The adjudicator must determine whether the matter has been sufficiently remedied to warrant restoration of the clearance.
    weighing: I conclude that mitigating condition (g) is satisfied—the returns have been filed, accepted, and no tax debt
      remains. I deem condition (g) alone adequate to eliminate the security concern. Based on the employee's post-notification
      actions, his engagement of a CPA, and his contingency arrangement, I am confident he will meet future filing obligations
      promptly. Consequently, I determine that the Guideline F issue is resolved and the employee's access authorization should
      be reinstated.
    tradecraft: The adjudicator issues a formal written decision, references the applicable CFR provisions and adjudicative
      guidelines, and documents the finding that the security concern is resolved, in accordance with 10 C.F.R. § 710.7(c).
    uncertainty: Uncertainty is minimal; the record clearly demonstrates filing compliance and the absence of any tax debt.
    handoff: The Senior Security Adjudicator decides unilaterally, as OHA regulations vest the adjudicator with exclusive
      authority to resolve the clearance matter following the hearing.
    tempting_wrong:
      option: O4
      pull: The default statutory presumption favoring denial may tempt a rejection even though corrective steps have been
        taken.
      why_wrong: The governing guidance explicitly indicates that satisfying condition (g) alone resolves the Guideline F
        issue, rendering a denial inconsistent with adjudicative standards.
    rejected:
      O1: A hold would unduly extend the denial despite the employee having remedied the problem.
      O2: Counseling is unnecessary because the security concern has already been addressed under the guidelines.
      O4: Denial disregards the satisfied condition (g) and the adjudicator's finding that the employee will file timely in
        the future.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee had failed to file the overdue 2023-2024 returns and retained outstanding tax liabilities
      then: O4
      why: Absent fulfillment of condition (g), the Guideline F issue would remain unresolved.
    would_not_change:
    - id: noflip1
      if: If mitigating condition (a) were later determined to apply
      why: Since condition (g) already resolves the issue, the outcome would still be restoration.
    watch_for:
    - id: watch1
      what: Any subsequent failure to file tax returns punctually
      favors:
      - O4
      why: A repeat occurrence would re-establish substantial doubt under Guideline F.
  lesson: When a clearance holder addresses a Guideline F financial issue by filing overdue tax returns and showing no remaining
    tax debt, the concern is considered mitigated even in the absence of other mitigating factors. Proactive remediation and
    full disclosure further bolster restoration.
  limits: This principle applies solely when the individual has completed filing, obtained acceptance from tax authorities,
    and carries no outstanding tax obligations. It does not extend to situations involving ongoing non-compliance, unresolved
    debts, or evidence of intentional concealment.
