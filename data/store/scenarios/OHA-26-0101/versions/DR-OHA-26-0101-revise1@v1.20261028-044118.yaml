case:
  id: DR-OHA-26-0101-revise1@v1
  title: Restoration of Access Authorization under Guideline F [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, July 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual failed to file his federal and state tax returns for the 2023 and 2024 tax years, which led the
    Local Security Office to suspend his security clearance and issue a Notification Letter citing Guideline F financial considerations.
    The Individual fully disclosed the failure in his February 2026 questionnaire for national security positions. After receiving
    the Notification Letter, he retained a certified public accountant in early April 2026, who prepared and filed the delinquent
    returns for 2023 through 2025. The Individual subsequently received federal and state tax refunds for those years, and
    documentation shows he has no outstanding tax obligations. He has also arranged to keep the CPA for future filings and
    described a contingency plan if the CPA becomes unavailable. The Individual’s girlfriend testified that he is generally
    reliable and that personal circumstances contributed to the lapse.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline F?
  options:
    O1:
      do: The Administrative Judge holds the decision for six months.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge asks the Local Security Office for counseling.
      move: ask
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual failed to file federal and state tax returns for tax years 2023 and 2024.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Local Security Office suspended the Individual’s clearance and issued a Notification Letter citing Guideline
      F concerns.
  - id: F3
    kind: capability
    status: confirmed
    fact: The Individual fully disclosed his tax‑filing delinquencies in the February 2026 questionnaire for national security
      positions.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual retained a CPA in early April 2026, and the CPA prepared and filed the 2023‑2025 tax returns.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual received federal and state tax refunds for 2023‑2025, indicating the returns were accepted by the
      tax authorities.
  - id: F6
    kind: situation
    status: confirmed
    fact: Documentation shows the Individual has no outstanding tax obligations for the years in question.
  - id: F7
    kind: capability
    status: assessed
    fact: The Individual plans to retain the CPA for future filings and has a contingency plan to file extensions or seek
      another professional if needed.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Individual’s girlfriend testified that he is generally reliable and that personal circumstances contributed
      to the tax‑filing failure.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Individual filed the delinquent 2023‑2024 returns, the tax authorities accepted them, and there are no outstanding
      tax obligations, satisfying mitigating condition (g) of Guideline F.
  - id: C2
    facts:
    - F1
    - F3
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Disclosure was timely, but the absence of mitigating conditions (a)–(c) leaves residual doubt about future compliance,
      justifying a temporary hold.
  - id: C3
    facts:
    - F4
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The Individual took proactive steps after the Notification Letter—retaining a CPA, filing the returns, and establishing
      a contingency plan—demonstrating reliable future behavior.
  - id: C4
    facts:
    - F3
    equity: due_process
    favors:
    - O3
    weight: bar
    why: Full disclosure alone does not eliminate the security concern; it precludes immediate restoration.
    rules_out:
    - O3
  reasoning:
    read: The Individual remedied the tax-filing lapse, yet the record shows only partial mitigation under Guideline F, creating
      a need for a monitoring period.
    weighing: Although mitigating condition (g) is satisfied, the lack of other mitigating factors and the recent nature of
      the corrective actions create enough uncertainty to warrant a six-month hold rather than immediate restoration or denial.
    tradecraft: The Judge issues a written decision citing the relevant CFR and Guideline F, notes the temporary hold, and
      outlines the conditions for a future review.
    uncertainty: Moderate; the corrective steps are recent and future compliance, while likely, is not yet proven.
    handoff: The Administrative Judge decides alone, as OHA regulations give the Judge sole authority after the hearing.
    tempting_wrong:
      option: O4
      pull: The presumption against granting a clearance could tempt a denial despite corrective actions.
      why_wrong: Mitigating condition (g) is satisfied, so denial would ignore the adjudicative standards.
    rejected:
      O2: Counseling is unnecessary because a temporary hold already provides oversight while the Individual demonstrates
        compliance.
      O3: Restoration is premature; a hold allows verification of sustained compliance.
      O4: Denial disregards the satisfied mitigating condition (g) and the Individual's proactive remediation.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual had not filed the delinquent 2023-2024 returns and still owed tax liabilities
      then: O3
      why: Without satisfying mitigating condition (g), the concern would remain unresolved, but the Judge would opt for a
        temporary hold rather than immediate denial.
    would_not_change:
    - id: noflip1
      if: Mitigating condition (a) were later found to apply
      why: Condition (g) already resolves the concern, so the outcome would remain restoration.
    watch_for:
    - id: watch1
      what: Any future failure to file tax returns on time
      favors:
      - O4
      why: A recurrence would re-create a substantial doubt under Guideline F.
  lesson: When a security-clearance holder resolves a Guideline F financial concern by filing delinquent tax returns and demonstrating
    no outstanding tax debt, the concern is deemed mitigated even if other mitigating factors are absent. Proactive corrective
    actions and full disclosure further support restoration.
  limits: This rule applies only where the individual has completed filing, received acceptance by tax authorities, and has
    no remaining tax obligations. It does not extend to cases with ongoing non-compliance, unresolved debts, or evidence of
    intentional concealment.
