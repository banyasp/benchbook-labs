case:
  id: DR-CORPUS-NX-3f9305a8-E1@v1
  title: A Child’s Revolutionary Activity
  status: draft
  setting: Warsaw, before the later wartime reunion, at the Okhrana office.
  decider: The Okhrana officer handling the case
  agent: The Okhrana officer handling the case
  agent_role: decide
  situation: In Warsaw, a thirteen-year-old girl was suspected of having spied on the Okhrana office and of being under revolutionary
    influence. Her mother, an Austrian subject, was cooperative but evasive when asked for information. The mother said the
    girl had spied on the office at first but had stopped after being treated kindly by the office. The girl did not answer
    when asked to confirm that account. The mother said she had been unable to counteract revolutionary pressure on the girl
    and wished to leave Warsaw with her daughter and enroll her in school. The Okhrana officer must decide how to address
    the girl's activity and the mother's request.
  question: What should the Okhrana officer do about the girl's spying and the mother's request to leave Warsaw?
  options:
    O1:
      do: The Okhrana officer releases the mother and girl and sends them to safety.
      move: act
      irreversible: true
    O2:
      do: The Okhrana officer asks the mother for further information before deciding their disposition.
      move: ask
      irreversible: false
      to: the mother
    O3:
      do: The Okhrana officer imprisons the mother and girl in Warsaw.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The mother was an Austrian subject.
  - id: F2
    kind: situation
    status: assessed
    fact: The mother described the girl as thirteen years old.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The mother said the girl had spied on the office at first.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The mother said the girl stopped spying after being treated kindly by the office.
  - id: F5
    kind: situation
    status: confirmed
    fact: The girl did not answer when asked to confirm that she had stopped spying.
  - id: F6
    kind: situation
    status: confirmed
    fact: The mother was cooperative but evasive when giving information.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The mother said she had been unable to counteract revolutionary pressure on the girl.
  - id: F8
    kind: situation
    status: assessed
    fact: The mother said she wished to leave Warsaw with the girl, remove her from revolutionary influence, and enroll her
      in school.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The girl was thirteen, and her mother said she could not shield her from revolutionary pressure but wanted to take
      her away and enroll her in school. The officer's choice to send them to safety addressed the child's welfare and the
      mother's request.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: The mother's account acknowledged that the girl had spied, while her claim that the girl had stopped was not confirmed
      by the girl's silence. This left uncertainty about the activity, but the account does not identify evidence of continuing
      spying that displaced the safe-departure course.
  - id: C3
    facts:
    - F1
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The stated disposition was to expel the mother because she was an Austrian subject and induce her to take the girl
      with her. The mother's wish to leave supplied a practical route consistent with that disposition.
  reasoning:
    read: This was a case involving a child suspected of spying amid revolutionary influence, not simply an adult intelligence
      suspect. The trap is to treat the allegation and the girl's silence as proof that imprisonment is the necessary response,
      while overlooking the mother's willingness to leave and remove the child from that influence.
    weighing: The stated course was to expel the Austrian-subject mother and induce her to take the girl. The mother's wish
      to leave Warsaw and enroll the girl in school, together with the officer's choice to send them to safety rather than
      prison, supports {O1}. The counterweight is that the girl's stopping was only the mother's account and the girl did
      not confirm it. On this record, that uncertainty does not outweigh the available protective departure; the balance would
      depend on credible evidence of continuing activity or the absence of a safe departure.
    tradecraft: Record the distinction between the mother's claims, the girl's nonconfirmation, and the disposition actually
      chosen. Carry out the release and departure consistently with the stated aim of getting the girl away from revolutionary
      influence, without treating the unconfirmed claim that she stopped as established fact.
    uncertainty: The mother was cooperative but evasive, and the girl's silence leaves the claim that she stopped spying unverified.
      The account does not establish whether there was continuing activity or what independent corroboration the officer had.
    handoff: The officer was to expel the mother and induce her to take the girl, but the approval structure is not specified.
      The officer should act within the authority assigned for the expulsion and release; if that authority is unclear, refer
      the disposition to the responsible superior rather than assume it.
    tempting_wrong:
      option: O3
      pull: Imprisonment may seem the safest response to a reported instance of spying and the girl's failure to confirm that
        it stopped.
      why_wrong: It gives insufficient weight to her age, the mother's willingness to remove her from revolutionary influence,
        and the choice to send them to safety rather than prison.
    rejected:
      O2: The mother had already offered a departure and schooling plan, and the officer proceeded with expulsion and safe
        departure rather than making further questioning a prerequisite.
      O3: The chosen response was to send the mother and girl to safety rather than imprison them.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible new evidence showed that the girl was still spying and that the proposed departure would not remove the
        risk.
      then: O2
      why: The mother's unconfirmed account would no longer be enough to support immediate release; the officer should obtain
        further information before choosing a disposition.
    would_not_change:
    - id: noflip1
      if: The girl remained silent and the mother remained evasive, without additional evidence of continuing activity.
      why: Those uncertainties alone would not erase the mother's stated plan to remove the child from revolutionary influence
        or the choice to send them to safety rather than prison.
    watch_for:
    - id: watch1
      what: Whether the mother can in fact take the girl away from revolutionary influence and enroll her in school.
      favors:
      - O2
      why: If the proposed protective departure is not practicable, the officer would need to reassess the disposition rather
        than assume the risk has been addressed.
  lesson: When a child is suspected of harmful activity under outside influence, weigh the allegation against the child's
    circumstances and any credible path to remove that influence. A protective departure can be preferable to imprisonment,
    while unresolved claims should remain identified as unverified rather than treated as fact.
  limits: This reasoning depends on the mother's concrete willingness to leave with the child and on the availability of sending
    them to safety. It does not establish a general rule for cases involving confirmed continuing activity, an unavailable
    safe departure, or different legal authority.
