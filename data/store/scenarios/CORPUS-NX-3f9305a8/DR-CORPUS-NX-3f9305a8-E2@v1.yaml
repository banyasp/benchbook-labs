case:
  id: DR-CORPUS-NX-3f9305a8-E2@v1
  title: Ending an Exposed Agent’s Service
  status: draft
  setting: Paris, 1913, Paris Okhrana.
  decider: The supervisor of most of the Paris Okhrana’s non-Russian agents
  agent: The supervisor of most of the Paris Okhrana’s non-Russian agents
  agent_role: decide
  situation: The supervisor is deciding whether to end one employee’s service. The agents’ identities have been exposed in
    public reporting, and their names and addresses are known to terrorists. The supervisor regards the exposed agents as
    no longer useful and says the service is discontinuing operations. Ending service is also presented as a measure intended
    to protect agents from danger. The employee has served for six years, received praise, and says she needs the job. She
    believes no other agent can replace her.
  question: What should the supervisor do about the employee’s service?
  options:
    O1:
      do: The supervisor should discontinue the employee’s service.
      move: act
      irreversible: false
    O2:
      do: The supervisor should continue the employee’s service.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The agents’ names were published in the European press.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The supervisor said terrorists knew the agents’ names and addresses.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The supervisor considered the exposed agents entirely useless.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Okhrana was discontinuing operations.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The supervisor said ending service was partly intended to protect agents whose identities were known to terrorists.
  - id: F6
    kind: capability
    status: confirmed
    fact: The employee had worked for the service for six years and had received praise for her work.
  - id: F7
    kind: situation
    status: assessed
    fact: The employee said she wanted and needed the job.
  - id: F8
    kind: capability
    status: assessed
    fact: The employee believed no other agent could replace her.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The supervisor assessed that public exposure had made the agents entirely useless, and the service was discontinuing
      operations.
  - id: C2
    facts:
    - F2
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The supervisor said terrorists knew the agents’ names and addresses and that ending service was partly intended to
      protect them.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: Her six years of praised service, need for the job, and belief that she was irreplaceable weigh in favor of keeping
      her employed, but her claim of unique value is her own assessment.
  reasoning:
    read: This is an end-of-operations decision after the agents’ identities were exposed, not simply a judgment about whether
      the employee’s past service was valuable. The trap is to let her need for the job and her claim of unique value eclipse
      the supervisor’s stated concerns about lost usefulness, closure, and safety.
    weighing: 'The supervisor’s stated balance favors ending service: exposed agents were assessed as entirely useless, operations
      were ending, and dismissal was partly intended to protect agents known to terrorists. Her service record, need, and
      belief that she could not be replaced favor continuation, but did not overcome those operational and safety reasons.
      The balance depends on the assessments that exposed agents were no longer useful and that ending service served the
      agents’ protection.'
    tradecraft: Keep the decision record focused on the stated reasons for ending service and distinguish the employee’s claim
      of irreplaceability from an independently established assessment of her continued usefulness. Do not let personal history
      substitute for the operational rationale.
    uncertainty: The decision rests on the supervisor’s assessments of the agents’ usefulness and the danger from terrorists;
      the available facts do not independently establish those assessments or address whether another safe role was available.
    handoff: The source depicts the supervisor making the decision and identifies no required referral or other decision-maker.
    tempting_wrong:
      option: O2
      pull: Her long service, praise, need for income, and conviction that no other agent could replace her make continuation
        emotionally and operationally appealing.
      why_wrong: 'Those considerations do not answer the supervisor’s stated grounds: the service was closing, exposed agents
        were assessed as useless, and ending service was partly intended to protect them.'
    rejected:
      O2: The supervisor did not continue her service because the stated closure, loss of usefulness after exposure, and agent-protection
        reasons outweighed her appeal to remain.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Operations were continuing and a credible assessment found that the employee remained useful and could serve without
        the exposure creating the stated safety concern.
      then: O2
      why: That would remove the central operational and protective grounds the supervisor gave for ending service.
    would_not_change:
    - id: noflip1
      if: Her six years of praised service, need for the job, and belief that she was irreplaceable remain the only counterweights
        to the stated closure and exposure concerns.
      why: Those considerations are already present, but the supervisor’s stated operational and protection reasons still
        favor ending service.
    watch_for: []
  lesson: When an organization is ending operations and exposure has made an employee’s continued service assessed as useless
    and hazardous, those institutional and personnel-protection reasons can outweigh tenure, praise, and the employee’s claim
    of unique value. Treat that claim as relevant, but not dispositive.
  limits: This reasoning depends on the service actually discontinuing operations and on the supervisor’s assessments that
    exposure removed usefulness and created a safety concern. It does not establish an employment-law rule, independently
    verify the threat, or address whether another role was available.
  library:
    domain: operational-command
    family: CORPUS-NX-3f9305a8
    source: https://www.cia.gov/resources/csi/static/1b4db814a287d709b5a5dd912ec089d2/Okhrana-Female-Agents-Pt.2.pdf
    episode_focus: The decision followed the exposure and publication of the agents’ identities and addresses. The stated
      reasons were that exposed agents would be useless, the service was discontinuing operations, and termination was intended
      to protect agents whose identities were known to terrorists; exclude the agents’ surveillance activities and the mechanics
      of their termination paperwork.
