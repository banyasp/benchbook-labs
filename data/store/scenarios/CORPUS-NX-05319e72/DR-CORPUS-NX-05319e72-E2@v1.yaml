case:
  id: DR-CORPUS-NX-05319e72-E2@v1
  title: Pinned Down Under Fire
  status: draft
  setting: During the GWOT, a Marine squad is in a gully under fire from an adobe compound.
  decider: The squad leader
  agent: The squad leader
  agent_role: decide
  situation: The squad is pinned in a gully under intense fire from an adobe compound. It cannot move forward or retreat.
    Women and children are inside the building, having been herded there by the Taliban as human shields, but the squad leader
    could not have known this. The squad leader must decide whether to approve an attack or continue to hold.
  question: What should the squad leader do while the squad is pinned under intense fire and unable to advance or retreat?
  options:
    O1:
      do: The squad leader approves an attack against the compound.
      move: act
      irreversible: true
    O2:
      do: The squad leader declines an attack against the compound.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The squad was pinned down in a gully.
  - id: F2
    kind: situation
    status: assessed
    fact: The squad was taking intense fire from an adobe compound.
  - id: F3
    kind: capability
    status: assessed
    fact: The squad could not move forward.
  - id: F4
    kind: capability
    status: assessed
    fact: The squad could not retreat.
  - id: F5
    kind: situation
    status: assessed
    fact: Women and children had been herded into the building by the Taliban as human shields.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The squad leader could not have known that women and children had been herded into the building.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The squad was pinned under intense fire and could neither advance nor retreat. The account presents those constraints
      as the reason the squad leader approved an attack.
  - id: C2
    facts:
    - F5
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Women and children were inside the building as human shields, so an attack exposed civilians to grave danger.
  - id: C3
    facts:
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The leader could not have known civilians had been herded into the building. The account treats that lack of knowledge
      as important to judging the decision, rather than judging it solely by what was later revealed.
  reasoning:
    read: 'This was a decision under immediate pressure: the squad was pinned by intense fire and had no way to advance or
      retreat. The central trap is hindsight: civilians were in the building, but the leader could not have known that when
      deciding.'
    weighing: Civilian safety weighs heavily against attacking, while the squad's immediate danger and lack of movement options
      weigh toward it. The account's framing supports O1 because the leader faced those constraints and could not have known
      civilians were inside; that balance depends on the stated lack of knowledge and the absence of a way forward or back.
    tradecraft: At the decision level, make the rationale reflect the constraints and information actually available, including
      the civilian risk that can reasonably be identified and any alternatives actually available. Preserve that reasoning
      for accountability without treating later-discovered facts as facts the leader knew at the time.
    uncertainty: The account gives no applicable rules of engagement, legal analysis, or details about other options or information
      available to the leader. It supports the stated decision rationale, but does not establish a broader legal finding.
    handoff: The squad leader is identified as the decision-maker; the account does not describe consultation or identify
      another approval authority. Do not infer a required handoff from the information given.
    tempting_wrong:
      option: O2
      pull: Declining an attack appears to avoid harming civilians who were inside the building.
      why_wrong: That pull overlooks that the squad was pinned under intense fire and could neither advance nor retreat, and
        that the leader could not have known civilians were inside.
    rejected:
      O2: The account favors the squad leader's approval because the squad was pinned under intense fire with no way to advance
        or retreat, and the leader could not have known civilians were in the building.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The leader had reliable information that civilians were inside before deciding.
      then: O2
      why: Known civilian presence would remove the account's key reason for discounting the danger as unknowable and would
        substantially strengthen the case for declining the attack.
    - id: flip2
      if: The squad had a viable way to disengage without remaining under the same intense fire.
      then: O2
      why: A viable alternative would weaken the account's stated basis that the squad could neither advance nor retreat.
    would_not_change:
    - id: noflip1
      if: Later information merely confirms that civilians were in the building, while the leader still could not have known
        that when deciding.
      why: The account expressly distinguishes the civilians' actual presence from what the leader could have known; hindsight
        alone would not undo that distinction.
    watch_for: []
  lesson: Judge a decision using the information and options available to the decision-maker at the time, while giving serious
    weight to civilian danger. Later-discovered harm matters, but it does not by itself establish that the decision-maker
    could have foreseen it.
  limits: This reasoning applies to the account's stated circumstances and does not establish compliance with any particular
    legal standard or rules of engagement. It should not be carried over where civilian presence was known, the constraints
    were different, or meaningful alternatives were available.
