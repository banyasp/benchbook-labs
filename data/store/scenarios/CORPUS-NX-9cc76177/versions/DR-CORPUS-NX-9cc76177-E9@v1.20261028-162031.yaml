    episode_focus: 'Wisner argues for retaining flexibility in clearance procedures: in a limited set of cases, a full investigation
      could continue after a person begins duties, while the standard name check remains desirable. The decision weighs thorough
      security vetting against timely access to talent, initiative, and expertise; exclude procedural details beyond this
      policy choice.'
