case:
  id: DR-CORPUS-NX-98d80222-NX-ec81d479-E1@v1
  title: AFMIC National-Center Designation
  status: draft
  setting: DIA, Department of Defense; at the time of the designation request (date not stated).
  decider: DIA
  agent: DIA
  agent_role: decide
  situation: AFMIC is the existing medical intelligence center within DIA and is described as functioning as a national intelligence
    center. It is the primary producer of medical intelligence for the U.S. government, including finished, all-source intelligence
    on medical and health-related topics. Designating AFMIC as the National Center for Medical Intelligence would follow prior
    Departmental renaming actions involving other intelligence centers. The proposed NCMI would be established under DIA through
    an amendment to DoDD 6420.1, subject to concurrence. The Under Secretary's approval remains pending.
  question: What should DIA do about seeking national-center designation for AFMIC?
  options:
    O1:
      do: DIA seeks national-center designation for AFMIC as the National Center for Medical Intelligence.
      move: act
      irreversible: false
    O2:
      do: DIA declines to seek national-center designation for AFMIC as the National Center for Medical Intelligence.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: AFMIC is DIA's current Armed Forces Medical Intelligence Center.
  - id: F2
    kind: situation
    status: confirmed
    fact: AFMIC functions as a national intelligence center.
  - id: F3
    kind: capability
    status: confirmed
    fact: AFMIC is the primary producer of medical intelligence for the U.S. government.
  - id: F4
    kind: capability
    status: confirmed
    fact: AFMIC provides finished, all-source medical intelligence on infectious disease risks, medical systems, environmental
      health risks, and medical science and technology.
  - id: F5
    kind: capability
    status: confirmed
    fact: AFMIC partners with domestic agencies on homeland health protection.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposed national-center designation is consistent with prior Departmental renaming actions involving NASIC,
      NMEC, and NGIC.
  - id: F7
    kind: authority
    status: confirmed
    fact: Establishing NCMI under DIA is proposed to require an amendment to DoDD 6420.1 and is subject to concurrence.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Under Secretary's approval of AFMIC's designation as NCMI remains pending.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: AFMIC already functions as a national intelligence center and is the U.S. government's primary producer of medical
      intelligence, with broad all-source coverage and domestic-agency partnerships. Designation would align its formal status
      with its existing role.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The proposed designation is consistent with prior Departmental renaming actions involving other intelligence centers.
  - id: C3
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The proposal identifies a formal route—amendment of DoDD 6420.1—and makes establishment subject to concurrence; the
      request does not itself establish NCMI or resolve the pending approval.
  reasoning:
    read: This is a request to align AFMIC's formal designation with its described national role, not a decision that the
      Under Secretary has already approved the change. The trap is to treat a request to seek designation as though it completed
      the designation.
    weighing: AFMIC's existing national role and its primary, broad medical-intelligence function are the strongest reasons
      for O1 {C1}. Consistency with prior Departmental renaming actions also supports O1, though less directly {C2}. The proposed
      amendment and required concurrence are conditions on establishment, not evidence that approval has occurred {C3}.
    tradecraft: Present the designation request through the stated concurrence process and identify the proposed DoDD 6420.1
      amendment. Record that approval remains pending and do not describe AFMIC as NCMI unless and until the required concurrence
      and amendment occur.
    uncertainty: The reasons provided support the requested alignment but do not describe its expected operational effects,
      costs, or any objections. The Under Secretary's decision remains pending.
    handoff: DIA should seek the stated concurrence from the Under Secretary identified in the recommendation, because establishment
      is expressly subject to concurrence and a directive amendment.
    tempting_wrong:
      option: O2
      pull: Declining could seem preferable because AFMIC already performs the national role and the designation change is
        not yet approved.
      why_wrong: That does not answer the stated case for aligning AFMIC's designation with its existing national function
        and prior Departmental renaming actions; pending approval is a condition on establishment, not a reason the request
        should not be made.
    rejected:
      O2: DIA should not decline to seek designation because AFMIC already functions nationally and the proposed designation
        is consistent with prior Departmental actions.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable information showed that AFMIC no longer functioned as a national intelligence center or no longer performed
        the described primary medical-intelligence role.
      then: O2
      why: The strongest stated rationale for aligning the designation with AFMIC's actual role would no longer apply.
    - id: flip2
      if: The required concurrence or directive amendment could not lawfully be obtained.
      then: O2
      why: The proposed establishment is expressly subject to concurrence and an amendment to DoDD 6420.1.
    would_not_change:
    - id: noflip1
      if: The Under Secretary's approval remains pending while DIA considers whether to seek designation.
      why: The memo recommends seeking approval; pending concurrence means the designation is not yet established, not that
        DIA should abandon the request.
    watch_for:
    - id: watch1
      what: Whether the Under Secretary concurs and the proposed DoDD 6420.1 amendment is completed.
      favors:
      - O1
      why: Those are the stated conditions for establishing NCMI under DIA.
  lesson: 'When an institution already performs a national role, formal designation may appropriately be brought into line
    with its function and established departmental practice. Seeking that alignment is distinct from treating a proposed change
    as approved: required concurrence and formal amendment must still be respected.'
  limits: This reasoning addresses only the stated request to designate AFMIC as NCMI. It does not establish that the Under
    Secretary approved the request, nor does it resolve questions about the merits, costs, or effects of the designation that
    the memo does not address.
  library:
    domain: natsec-other
    family: CORPUS-NX-98d80222
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-39b.pdf
    episode_focus: The decision point is DIA’s choice to seek national-center designation rather than continue AFMIC under
      its existing designation, with approval by the Under Secretary still pending in the memo. The stated reasons are AFMIC’s
      de facto national role and consistency with prior Departmental renaming actions; exclude any inference that the Under
      Secretary ultimately approved the request.
