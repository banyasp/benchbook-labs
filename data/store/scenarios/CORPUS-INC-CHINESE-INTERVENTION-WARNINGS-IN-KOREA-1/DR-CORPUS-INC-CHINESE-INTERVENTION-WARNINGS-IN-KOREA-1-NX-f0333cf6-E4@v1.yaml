case:
  id: DR-CORPUS-INC-CHINESE-INTERVENTION-WARNINGS-IN-KOREA-1-NX-f0333cf6-E4@v1
  title: Assessing Chinese Intervention in Korea
  status: draft
  setting: Korea, September-November 1950, CIA Daily and Weekly Summaries.
  decider: CIA analysts
  agent: CIA analysts
  agent_role: decide
  situation: CIA analysts considered reports of Chinese troop movements in Manchuria and Chinese warnings about US actions
    in Korea. Political and military considerations included the risk of war with the United States and possible effects on
    Soviet influence over China and Korea. The analysts considered whether Chinese forces might materially affect the course
    of events in Korea. Chinese troops had entered combat in northern Korea, and the analysts were assessing whether the intervention
    would become a large-scale attack.
  question: What should the CIA analysts include in their Korea estimate about the likelihood of a large-scale Chinese attack?
  options:
    O1:
      do: The CIA analysts include a large-scale Chinese attack among likely outcomes in their Korea estimate.
      move: act
      irreversible: false
    O2:
      do: The CIA analysts exclude a large-scale Chinese attack from likely outcomes in their Korea estimate.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Numerous reports described Chinese Communist troop movements in Manchuria.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Beijing had charged the United States with aggression and violations of Chinese territory.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Warnings that China might intervene if UN forces crossed the 38th parallel had been passed within the US diplomatic
      corps.
  - id: F4
    kind: capability
    status: assessed
    fact: Chinese Communist forces had the capability to intervene in Korea at a scale sufficient to materially affect events.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The analysts found no evidence of disagreement between China and the Soviet Union on military policy.
  - id: F6
    kind: situation
    status: assessed
    fact: The analysts considered that Chinese intervention could increase the risk of global war, including through UN or
      US reaction and possible Soviet commitment of troops.
  - id: F7
    kind: situation
    status: assessed
    fact: The analysts considered that a Chinese victory could enhance Chinese Communist prestige and threaten Soviet direction
      of Korean affairs and control over the Chinese Communist regime.
  - id: F8
    kind: situation
    status: confirmed
    fact: Chinese troops entered combat in far northern Korea three weeks before the 17 November Summary.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Troop movements, Chinese warnings, the forces’ capacity to affect events, and the fact that Chinese troops had entered
      combat all made intervention a serious possibility. The analysts nevertheless distinguished evidence of some intervention
      from evidence that it would become a large-scale attack.
  - id: C2
    facts:
    - F6
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The analysts judged that open Chinese intervention risked widening the conflict into a global war, through possible
      UN or US reaction and possible Soviet commitment of troops.
  - id: C3
    facts:
    - F7
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The analysts considered that a Chinese victory could strengthen Chinese Communist prestige, challenge Soviet leadership
      in Asia, and threaten Soviet direction of Korean affairs and control over the Chinese Communist regime.
  - id: C4
    facts:
    - F5
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The analysts found no evidence of China-Soviet disagreement and continued to assess that intervention would not develop
      into a large-scale attack even after Chinese troops had entered combat.
  reasoning:
    read: The question is whether Chinese intervention would become a large-scale attack, not whether China had the capability
      to intervene or whether any Chinese troops were already fighting. The trap is treating alarming reports and confirmed
      entry into combat as proof of the scale of intervention the analysts judged unlikely.
    weighing: 'The reports, warnings, and demonstrated capability supported taking intervention seriously {C1}. But the analysts’
      stated political and military judgment was that open intervention was unlikely: it risked a wider war {C2}, could produce
      outcomes detrimental to Soviet influence {C3}, and was not supported by evidence of a China-Soviet military-policy disagreement
      {C4}. They maintained the assessment that the intervention would not become a large-scale attack even after troops entered
      combat, so the balance favors {O2}.'
    tradecraft: Keep capability, evidence of limited entry, and assessment of likely scale distinct in the estimate. State
      the conclusion alongside the evidence that cuts against it, and make clear that the judgment concerns likelihood rather
      than impossibility.
    uncertainty: The reports and warnings made intervention a real concern, and Chinese forces had the capability to materially
      affect events. The estimate was still a judgment about what China was likely to do, not certainty that it would refrain
      from a large-scale attack.
    handoff: The source identifies CIA analysts as making the estimate and does not identify a separate approval authority
      or operational handoff. Keep the answer at the level of the intelligence judgment; the source gives no basis for adding
      an operational response.
    tempting_wrong:
      option: O1
      pull: Troop movements, warnings, Chinese forces’ capacity, and Chinese troops’ entry into combat could make a large-scale
        attack seem likely.
      why_wrong: Those facts established a serious possibility of intervention, but the analysts’ stated assessment remained
        that it was unlikely to become a large-scale attack, based on the political and military costs they identified.
    rejected:
      O1: The analysts did not include a large-scale Chinese attack among likely outcomes because they continued to judge
        that open intervention at that scale was unlikely despite the warnings, capability, and initial troop entry.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that Beijing intended to commit forces on a large scale despite the risk of war with the
        UN nations and the political costs the analysts identified.
      then: O1
      why: That would directly undermine the analysts’ judgment about both the likely scale of intervention and the political
        and military reasons they relied on.
    would_not_change:
    - id: noflip1
      if: Chinese forces have the capability to intervene at a scale that could materially affect events.
      why: The analysts acknowledged that capability while still assessing intervention as unlikely to become a large-scale
        attack.
    - id: noflip2
      if: Chinese troops have entered combat in northern Korea.
      why: The analysts continued to make the not-large-scale judgment three weeks after the first troops entered combat.
    watch_for:
    - id: watch1
      what: Whether further evidence changes the assessment of Beijing’s willingness to accept the risk of war or the expected
        scale of its commitment.
      favors:
      - O1
      why: The likelihood judgment depends on political and military calculations; evidence that materially changed those
        calculations could support revisiting the estimate.
  lesson: Separate a demonstrated capability and evidence of some intervention from the likelihood and scale of further action.
    A sound estimate weighs warning indicators against the decision-maker’s stated political and military incentives, and
    states uncertainty without treating possibility as likelihood.
  limits: This reasoning describes the CIA analysts’ historical estimate of likely Chinese action; it is not a binding legal
    rule or a claim that their assessment was correct. It does not address any operational response to intervention.
