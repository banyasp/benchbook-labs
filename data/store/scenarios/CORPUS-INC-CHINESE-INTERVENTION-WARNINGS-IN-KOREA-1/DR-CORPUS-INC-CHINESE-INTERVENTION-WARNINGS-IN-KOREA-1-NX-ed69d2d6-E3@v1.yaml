case:
  id: DR-CORPUS-INC-CHINESE-INTERVENTION-WARNINGS-IN-KOREA-1-NX-ed69d2d6-E3@v1
  title: Estimating Chinese Intervention in Korea
  status: draft
  setting: Korea and the Manchurian border, October 1950, Office of Reports and Estimates
  decider: The Office of Reports and Estimates
  agent: The Office of Reports and Estimates
  agent_role: decide
  situation: In the week after the Inchon landing, North Korean armies were crumbling. Chinese leadership had given no indication
    that events on the peninsula would prompt a military reaction, while Chinese forces were massed on the Manchurian border.
    The Office of Reports and Estimates continued to consider Chinese capabilities and the possibility of outside communist
    intervention. Statements, troop movements to Manchuria, and propaganda charges of atrocities and border violations were
    also part of the situation. From a military standpoint, the most favorable time for intervention was assessed to have
    passed.
  question: What should the Office of Reports and Estimates do in assessing whether full-scale Chinese intervention in Korea
    is probable in 1950?
  options:
    O1:
      do: The Office of Reports and Estimates should accept the assessment that full-scale Chinese intervention in Korea is
        probable in 1950.
      move: act
      irreversible: false
    O2:
      do: The Office of Reports and Estimates should reject the assessment that full-scale Chinese intervention in Korea is
        probable in 1950.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In the week after the Inchon landing, North Korean armies were crumbling.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Chinese leadership had given no indication that events on the peninsula would prompt a military reaction.
  - id: F3
    kind: capability
    status: assessed
    fact: The Office of Reports and Estimates considered China and the USSR capable of intervening.
  - id: F4
    kind: capability
    status: assessed
    fact: Communist forces massed on the Manchurian border could enter the battle and materially change its course.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Statements by Chinese leadership, troop movements to Manchuria, and propaganda charges of atrocities and border
      violations raised concern about intervention.
  - id: F6
    kind: intelligence
    status: assessed
    fact: From a military standpoint, the most favorable time for intervention in Korea had passed.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: As North Korean forces crumbled, Chinese leadership had given no indication that events would prompt a military reaction,
      weighing against an assessment that full-scale intervention was probable.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: China and the USSR had the capability to intervene, and forces on the Manchurian border could enter the battle and
      materially change its course. This made intervention possible, though capability alone did not establish that full-scale
      intervention was probable.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Office considered the statements, troop movements, and propaganda charges but found no convincing indication
      of an actual Chinese intention to intervene at full scale.
  - id: C4
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Office judged that the most favorable military time for intervention had passed, supporting its conclusion that
      full-scale intervention was not probable in 1950.
  reasoning:
    read: The decision is an estimate of probability, not whether China had the capability to intervene. The trap is treating
      forces that could change the course of the war, together with alarming statements and troop movements, as proof of an
      actual intention to commit to full-scale intervention.
    weighing: The Office weighed the absence of an indicated Chinese decision to react and its judgment that the most favorable
      time had passed against Chinese capability and forces positioned to affect the fighting. It treated the statements,
      troop movements, and propaganda charges as insufficient evidence of actual intent, and assessed full-scale intervention
      as not probable in 1950. The balance depends on distinguishing capability and concerning signals from convincing evidence
      of intent.
    tradecraft: State the probability judgment separately from the assessment of capability, and make the countervailing evidence
      and the basis for discounting it explicit in the estimate.
    uncertainty: 'The assessment was not that intervention was impossible: the Office recognized that forces on the border
      could enter and materially change the battle. Its conclusion was that full-scale intervention was not probable in 1950
      on the indications then considered.'
    handoff: The Office made the estimate and sent it directly to the President; the source does not identify another office
      as sharing the decision.
    tempting_wrong:
      option: O1
      pull: Chinese forces were capable of intervening, were massed on the Manchurian border, and the statements and troop
        movements raised concern.
      why_wrong: Those considerations established a serious possibility, but the Office found no convincing indication of
        actual intent and judged that the most favorable time for intervention had passed.
    rejected:
      O1: The Office rejected an assessment that full-scale intervention was probable because it found no convincing indication
        of actual Chinese intent and judged the favorable military opportunity to have passed.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Office had convincing indications of an actual Chinese intention to intervene at full scale.
      then: O1
      why: 'That would address the distinction central to the estimate: capability and concerning signals were not, by themselves,
        convincing evidence of actual intent.'
    - id: flip2
      if: The most favorable military time for intervention had not passed.
      then: O1
      why: The Office relied on the judgment that the favorable opportunity had passed; removing that consideration would
        weaken a stated reason for finding intervention not probable.
    would_not_change:
    - id: noflip1
      if: The evidence remained limited to statements, troop movements to Manchuria, and propaganda charges of atrocities
        and border violations.
      why: The Office expressly assessed that, despite those matters, there were no convincing indications of actual intent
        and intervention was not probable.
    watch_for:
    - id: watch1
      what: Communist forces remained massed on the Manchurian border and could enter the battle.
      favors:
      - O1
      why: The Office recognized that those forces could materially change the course of the war, making this a consequential
        risk to monitor even while judging intervention not probable.
  lesson: Assess probability of action separately from an adversary's capability to act. Concerning signals and available
    forces can warrant attention without, absent convincing indications of intent, establishing that full-scale intervention
    is probable.
  limits: This reasoning concerns the Office's October 1950 estimate of full-scale Chinese intervention in Korea, not whether
    intervention was possible or what later events showed. It does not establish a general rule for weighing intelligence
    in other settings.
