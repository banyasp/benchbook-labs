case:
  id: DR-CORPUS-NX-7ef6c129-E1@v1
  title: Setting the DDI’s Review Standard
  status: draft
  setting: CIA, during the DDI’s tenure following 1982
  decider: The Deputy Director for Intelligence (DDI)
  agent: The DDI
  agent_role: decide
  situation: At CIA, the DDI is considering how to review in-depth assessments and current intelligence articles before publication.
    The DDI has authority to review those products. The DDI sees weaknesses in analysts’ arguments and wants analysis to distinguish
    reliably reported information from opinions supported by evidence. The DDI also values input from experts outside CIA
    and the presentation of alternate future scenarios. The decision is whether to use a stringent review that returns drafts
    for revision or to approve drafts through the review process without that further scrutiny.
  question: What should the DDI do about reviewing in-depth assessments and current intelligence articles before publication?
  options:
    O1:
      do: The DDI approves drafts for publication without returning them for further evidentiary or analytic revision.
      move: act
      irreversible: false
    O2:
      do: The DDI rejects drafts with evidentiary or analytic weaknesses and returns them to managers for revision.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The DDI had authority to review analytic products before publication.
  - id: F2
    kind: situation
    status: confirmed
    fact: The products under consideration included in-depth assessments and current intelligence articles.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The DDI viewed some analytic argumentation as insular, weak, or incoherent.
  - id: F4
    kind: situation
    status: assessed
    fact: The DDI held that analysts should distinguish reliably reported information from their opinions and support those
      opinions with evidence.
  - id: F5
    kind: situation
    status: assessed
    fact: The DDI valued seeking views from experts outside CIA, including academic specialists and policy officials.
  - id: F6
    kind: situation
    status: assessed
    fact: The DDI valued presenting alternate future scenarios.
  considerations:
  - id: C1
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The DDI viewed some analysis as insular, weak, or incoherent, which called for scrutiny rather than approval without
      further review.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The DDI’s stated standard was to distinguish reliably reported information from analysts’ opinions and require evidence
      to support those opinions.
  - id: C3
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Seeking views beyond CIA and presenting alternate future scenarios were among the DDI’s analytic tenets; review could
      press products to meet those standards.
  - id: C4
    facts:
    - F1
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The DDI used review authority over in-depth assessments and current intelligence articles to demand evidence and
      challenge inconsistency, lack of clarity, bias, and poorly supported judgments; this made the review chain more rigorous
      and raised standards.
  - id: C5
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Stringent review improved attention to the basis for judgments, but the account notes that longer-term benefits were
      limited because the review effort did not sufficiently clarify tradecraft practices that promote sound analysis.
  reasoning:
    read: 'This is a choice about using the DDI’s review authority to improve the evidentiary quality of analytic products,
      not a choice between competing substantive conclusions. The trap is to treat demanding review as sufficient by itself:
      the account credits it with raising standards but also identifies a limit to its longer-term effect.'
    weighing: The balance favors returning weak drafts. The DDI sought to distinguish information from opinion and require
      evidence {C2}; direct review addressed perceived analytic weaknesses and made the review chain more rigorous {C1} {C4}.
      External perspectives and alternate scenarios also fit the DDI’s stated analytic principles {C3}. The outcome remains
      qualified by the limited longer-term benefit where tradecraft practices were not sufficiently clarified {C5}.
    tradecraft: Apply review to the products in question, identify inconsistencies, unclear reasoning, bias, and judgments
      without adequate support, and return drafts with specific revision comments. In carrying this out, make the distinction
      between reported information and analyst judgment visible, and consider whether relevant outside expertise and alternate
      scenarios have been addressed.
    uncertainty: The account describes a marked increase in attention to the basis for judgments, but does not establish that
      stringent review alone produces lasting analytic soundness. Its longer-term benefit depends in part on clarifying tradecraft
      practices.
    handoff: The DDI should retain the review decision under the authority described, while sending returned drafts through
      managers for revision. Relevant academic specialists and policy officials can contribute to analysis where useful, consistent
      with the DDI’s stated preference for outside views.
    tempting_wrong:
      option: O1
      pull: Approving drafts without further scrutiny avoids another round of review and revision.
      why_wrong: That would leave the perceived weaknesses unaddressed and abandon the DDI’s evidence-focused standard for
        analysis.
    rejected:
      O1: The DDI did not choose approval without further scrutiny because direct review was used to challenge weakly supported
        judgments and raise analytic standards.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Stringent review were shown to prevent time-critical publication in circumstances where that delay would undermine
        the product’s purpose.
      then: O1
      why: The account gives no such timing conflict, but a demonstrated cost to timely mission-relevant analysis could change
        the balance between scrutiny and approval.
    would_not_change:
    - id: noflip1
      if: The review process involved career or ego pressure on analysts and managers.
      why: The account notes those stakes while also describing how they helped motivate higher standards; their presence
        alone would not displace the case for evidence-focused review.
    watch_for:
    - id: watch1
      what: Whether review comments are accompanied by clearer tradecraft practices that promote analytic soundness.
      favors:
      - O2
      why: The account identifies insufficient clarification of those practices as a limit on the longer-term benefits of
        intensified review.
  lesson: When an authorized reviewer identifies weak or incoherent analysis, require judgments to be supported by evidence
    and distinguish them from reliably reported information. Stringent review can raise standards, but it should be paired
    with clear tradecraft practices if lasting analytic soundness is the aim.
  limits: This reasoning concerns review of analytic products under the DDI’s authority and does not resolve the separate
    politicization controversy. It also does not establish that stringent review is appropriate where a demonstrated need
    for timely publication would materially alter the balance.
