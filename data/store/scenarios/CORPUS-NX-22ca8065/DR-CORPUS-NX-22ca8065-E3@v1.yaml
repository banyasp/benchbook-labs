case:
  id: DR-CORPUS-NX-22ca8065-E3@v1
  title: War College Admission Decision
  status: draft
  setting: The War College, during consideration of a candidate’s admission; the Office of the Minister of Defense.
  decider: The Office of the Minister of Defense
  agent: The Office of the Minister of Defense
  agent_role: decide
  situation: The Office of the Minister of Defense is considering a candidate for admission to the War College. An unwritten
    custom is not to admit candidates with German and Hungarian backgrounds to the highest military school. The candidate
    has those backgrounds. All departments of the General Staff oppose the nomination. A powerful denominational political
    party has strongly intervened on the candidate’s behalf. The Office must decide whether to admit the candidate or apply
    the customary exclusion.
  question: What should the Office of the Minister of Defense do about the candidate’s admission to the War College?
  options:
    O1:
      do: The Office of the Minister of Defense excludes the candidate from the War College.
      move: act
      irreversible: false
    O2:
      do: The Office of the Minister of Defense admits the candidate to the War College.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A candidate was being considered for admission to the War College.
  - id: F2
    kind: situation
    status: confirmed
    fact: The candidate had German and Hungarian backgrounds.
  - id: F3
    kind: situation
    status: confirmed
    fact: A custom was not to admit candidates with German and Hungarian backgrounds to the highest military school.
  - id: F4
    kind: situation
    status: confirmed
    fact: The custom was not written down.
  - id: F5
    kind: situation
    status: confirmed
    fact: All departments of the General Staff opposed the candidate’s nomination.
  - id: F6
    kind: situation
    status: confirmed
    fact: A denominational political party intervened on the candidate’s behalf.
  - id: F7
    kind: situation
    status: confirmed
    fact: The political party was powerful.
  - id: F8
    kind: situation
    status: confirmed
    fact: The party’s intervention on the candidate’s behalf was strong.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: policy_compliance
    favors:
    - O1
    weight: weak
    why: The candidate's background fell within an unwritten custom against admission, which points toward exclusion; the
      passage does not say the custom was binding.
  - id: C2
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: All General Staff departments opposed the nomination, but the passage gives no grounds for their opposition.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: impartiality
    favors:
    - O2
    weight: weak
    why: Strong intervention by a powerful denominational party on the candidate's behalf preceded the Office's decision to
      admit him; the passage does not identify that intervention as a substantive or lawful reason for admission.
  reasoning:
    read: The Office admitted a candidate who fell within an unwritten exclusion custom and whose nomination all General Staff
      departments opposed. The trap is to treat either the custom or the staff opposition as a binding rule, or to treat political
      intervention as proof of the candidate's merits; the passage establishes none of those conclusions.
    weighing: The custom and staff opposition point toward {O1} ({C1}, {C2}); the passage associates strong party intervention
      with the Office's decision to choose {O2} ({C3}). It supplies no further explanation of the admission's merits or the
      Office's legal authority, so the balance can be described only as the recorded outcome, not as a fully explained merits
      judgment.
    tradecraft: Record the admission decision and distinguish the unwritten custom, staff opposition, and party intervention
      as separate considerations. State any actual authority and rationale for departing from the custom rather than presenting
      political pressure as an admission criterion.
    uncertainty: The passage does not explain why the General Staff opposed the nomination, whether the custom had formal
      force, or what substantive grounds the Office relied on. It also does not say the party's intervention was improper.
    handoff: The Office of the Minister of Defense is identified as the decision-maker. The passage gives no basis for assigning
      the decision to another authority or requiring a particular handoff.
    tempting_wrong:
      option: O1
      pull: The unwritten custom and opposition from every General Staff department both point toward exclusion.
      why_wrong: That choice would not match the Office's recorded decision to admit, and the passage does not establish that
        either consideration controlled the Office's authority.
    rejected:
      O1: The Office did not apply the customary exclusion; it admitted the candidate after strong party intervention.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Office determined that the customary exclusion was controlling and had to be applied in this case.
      then: O1
      why: A controlling exclusion would change the decision from the recorded admission to exclusion.
    would_not_change:
    - id: noflip1
      if: The custom remains unwritten while the other recorded circumstances and the Office's decision remain unchanged.
      why: The source's recorded outcome is admission despite the unwritten custom; this condition alone supplies no stated
        reason to change that outcome.
    watch_for: []
  lesson: An unwritten custom and institutional opposition are relevant context, but should not be assumed to be binding authority
    or to disclose the reasons behind opposition. Record political intervention separately from substantive grounds for a
    decision, and do not infer merits or motives that the record does not provide.
  limits: This reasoning is limited to the passage's account of the admission decision. It does not establish the legal status
    of the custom, the grounds for the General Staff's opposition, or whether the party's intervention affected the candidate's
    qualifications.
