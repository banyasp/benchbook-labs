    episode_focus: The analytic choice is to infer a Sino-Soviet dispute from the cited editorials and chronology, or to treat
      the evidence as insufficient to establish one. The author finds the claim unsubstantiated, citing the editorials’ actual
      wording, the timing of the Soviet leader’s trip, and the crisis’s outcome; exclude the diplomatic decisions themselves,
      whose rationales are not developed here.
