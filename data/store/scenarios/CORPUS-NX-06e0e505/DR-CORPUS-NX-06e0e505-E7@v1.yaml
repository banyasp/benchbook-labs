case:
  id: DR-CORPUS-NX-06e0e505-E7@v1
  title: District Transition Under a Fixed Schedule
  status: draft
  setting: Afghanistan, early 2013, SOJTF-A
  decider: SOJTF-A
  agent: SOJTF-A
  agent_role: decide
  situation: In early 2013, SOJTF-A faced district handovers as reductions in troop numbers and support made the transition
    schedule time-based. Some districts did not meet the ALP sustainability criteria, and in several such areas insurgents
    overran ALP checkpoints. The districts selected for transition earlier had generally been in excellent condition, so their
    security did not necessarily reflect conditions across districts. Many ALP received less than a year of SOF mentorship
    rather than the desired two years. Training was extended, but inexperienced leaders and shortages of capable leadership
    remained concerns.
  question: What should SOJTF-A do about district handovers as troop and support reductions make the schedule imperative?
  options:
    O1:
      do: SOJTF-A retains districts until they meet sustainability conditions.
      move: act
      irreversible: false
    O2:
      do: SOJTF-A transfers districts on the troop-reduction schedule.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In early 2013, troop-number and enabler-support reductions made time-based transition imperative.
  - id: F2
    kind: situation
    status: confirmed
    fact: Security was relatively good in the districts selected for ALP transition during 2012.
  - id: F3
    kind: situation
    status: confirmed
    fact: The early transition districts had generally been selected because the ALP there were in excellent shape, and the
      initial number of districts was relatively small.
  - id: F4
    kind: capability
    status: confirmed
    fact: Some districts did not meet the criteria for a sustainable ALP program.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: In several areas where districts were handed over, insurgents were able to overrun ALP checkpoints.
  - id: F6
    kind: capability
    status: confirmed
    fact: Many ALP received less than one year of SOF mentorship before transition instead of the desired two years.
  - id: F7
    kind: capability
    status: assessed
    fact: Training was extended from three weeks to four weeks, but that amount might not have been enough for inexperienced
      Afghans in leadership positions.
  - id: F8
    kind: capability
    status: confirmed
    fact: The Afghan government assigned former ANP, ANA, and NDS officers as ALP leaders, and some of the most effective
      ALP units in 2013 had such leaders.
  - id: F9
    kind: capability
    status: assessed
    fact: Those leadership infusions were insufficient in number, and a substantial number of ALP leaders lacked adequate
      leadership experience.
  considerations:
  - id: C1
    facts:
    - F1
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Troop-number and support reductions made a time-based transition imperative, so retaining districts until each met
      sustainability conditions was not treated as a feasible general course.
  - id: C2
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: 'The relatively good security in early transition districts was not reliable evidence that transition would work
      across districts: the first, small group had generally been selected because its ALP were already in excellent shape.'
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Some districts did not meet the sustainability criteria, and insurgents overran ALP checkpoints in several handed-over
      areas, showing a concrete risk to the transition's purpose.
  - id: C4
    facts:
    - F6
    - F7
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Many ALP had less than the desired mentorship, the added training might not suffice for inexperienced leaders, and
      a substantial number of leaders lacked adequate experience.
  - id: C5
    facts:
    - F8
    - F9
    equity: mitigation
    favors:
    - O2
    weight: weak
    why: Assigning former Afghan security-service officers provided some experienced leadership, including in some effective
      units, but those leadership infusions were insufficient in number.
  reasoning:
    read: 'The early districts'' relatively good security could create a misleading impression that transition was succeeding
      generally: those districts had been selected because their ALP were in excellent shape. By early 2013, the decision
      was different: reductions in troops and support made transition time-based, including for districts that did not meet
      sustainability criteria.'
    weighing: 'The imperative schedule created by troop and support reductions favored proceeding. Against that stood evidence
      of readiness risk: checkpoint overruns in some handed-over districts, shorter-than-desired mentorship, and inadequate
      leadership experience. The favorable early transitions did not resolve that risk because those districts were a selected,
      unusually strong group. The balance therefore favors O2 because the schedule was treated as imperative, not because
      all districts were sustainable or the risks had been removed.'
    tradecraft: Record the schedule constraint separately from the readiness assessment. Document which sustainability gaps
      and leadership risks remain at each handover, and avoid presenting early-district security as proof that later transitions
      are equally ready.
    uncertainty: Training sufficiency for inexperienced leaders remained uncertain, and many leaders lacked adequate experience.
      Some effective units had former Afghan security-service officers as leaders, but those leadership infusions were insufficient
      overall.
    handoff: SOJTF-A is the decision-maker in the fixed scenario. Coordination with the Afghan government on leadership capacity
      is a prudent implementation step, since it assigned former ANP, ANA, and NDS officers as ALP leaders; no separate approval
      authority is identified.
    tempting_wrong:
      option: O1
      pull: Waiting for every district to meet sustainability conditions appears to avoid exposing weak ALP units to handover
        risks.
      why_wrong: It disregards the constraint that troop and support reductions made time-based transition imperative; the
        decision was to proceed despite unresolved readiness risks, not because those risks were negligible.
    rejected:
      O1: SOJTF-A did not retain districts until each met sustainability conditions because the reductions made time-based
        transition imperative.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Troop and support reductions did not make time-based transition imperative, leaving time to retain districts until
        they met sustainability conditions.
      then: O1
      why: The basis for proceeding was the imperative schedule; without that constraint, the documented sustainability and
        leadership risks would favor waiting.
    would_not_change:
    - id: noflip1
      if: The early districts selected for transition in 2012 continued to have relatively good security.
      why: Those districts were generally selected because their ALP were in excellent shape, so their security would still
        not establish that other districts were ready.
    watch_for:
    - id: watch1
      what: Further evidence that insurgents are overrunning checkpoints in handed-over districts.
      favors:
      - O1
      why: Such evidence would reinforce the identified risk that handovers in districts below sustainability criteria undermine
        the transition's purpose.
  lesson: Do not infer that a transition policy is broadly sustainable from early cases selected for unusually favorable conditions.
    When a schedule is treated as imperative, proceed only with a clear account of the unresolved readiness risks and do not
    mistake a binding constraint for proof that those risks have been mitigated.
  limits: This conclusion depends on the characterization of troop and support reductions as making time-based transition
    imperative. It does not establish a general rule that schedule should override readiness, or that handover is appropriate
    when the schedule constraint is absent.
