case:
  id: DR-OHA-26-0051-addfact1@v1
  title: Restoration of Access Authorization after DUI and Psychological Evaluation [addfact]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, July 2026 – administrative security-clearance hearing
  decider: Presiding Administrative Law Judge
  agent: Presiding Administrative Law Judge
  agent_role: decide
  situation: On 25 May 2025 the employee was arrested for driving while intoxicated, with blood-alcohol readings of 0.21 %
    and 0.22 %. He failed to inform the Local Security Office until 17 July 2025, missing the required three-business-day
    reporting deadline. The LSO suspended his clearance and sent a Notification Letter invoking Guideline I concerns. A DOE-appointed
    psychologist evaluated him and concluded that a mental condition impairs his judgment, reliability, and trustworthiness,
    citing minimization, deception, and poor decision-making. A consulting psychologist later judged the conduct to be situational
    poor judgment rather than a persistent condition and recommended voluntary counseling. The employee has given contradictory
    statements about his drinking and reporting, downplaying his consumption to police while later claiming full disclosure.
    He has not pursued any treatment despite the DOE psychologist's recommendation. He occupies a critical position in a nuclear-weapons
    design program, and no other qualified staff are presently available to assume his duties. The judge must decide whether
    the Guideline I security concerns have been sufficiently mitigated to restore his access authorization.
  question: How should the presiding judge rule on the employee's security-clearance restoration?
  options:
    O1:
      do: Order the LSO to perform a fresh psychological evaluation before any clearance action.
      move: ask
      irreversible: false
    O2:
      do: Deny restoration of the employee's security clearance until further evidence resolves the concerns.
      move: act
      irreversible: false
    O3:
      do: Restore the employee's clearance immediately, but impose a requirement for voluntary counseling.
      move: act
      irreversible: false
    O4:
      do: Hold the clearance decision pending verification of the employee's compliance with recommended treatment.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 25 May 2025 the employee was arrested for driving while intoxicated, with blood-alcohol measurements of 0.21
      % and 0.22 %.
  - id: F2
    kind: situation
    status: confirmed
    fact: He did not notify the Local Security Office of the arrest until 17 July 2025, thereby missing the mandated three-business-day
      reporting window.
  - id: F3
    kind: situation
    status: confirmed
    fact: The LSO responded by suspending his security clearance and issuing a Notification Letter that invoked Guideline
      I security concerns.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: A DOE-appointed psychologist assessed him and determined that he suffers from a mental condition that compromises
      judgment, reliability and trustworthiness, noting tendencies toward minimization, deception and poor decision-making.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A consulting psychologist subsequently concluded that the conduct stemmed from situational poor judgment rather
      than a chronic condition and suggested voluntary counseling.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The employee has provided inconsistent accounts of his alcohol use and of his reporting, at times downplaying his
      drinking to police and later asserting full disclosure.
  - id: F7
    kind: situation
    status: confirmed
    fact: He has not pursued any treatment despite the DOE psychologist's recommendation.
  - id: F8
    kind: authority
    status: confirmed
    fact: The judge must determine whether the Guideline I security concerns have been sufficiently mitigated to permit restoration
      of the clearance.
  - id: F9
    kind: situation
    status: confirmed
    fact: The employee holds a critical role in a nuclear-weapons design program, and no other qualified staff are presently
      available to assume his duties.
  considerations:
  - id: C1
    facts:
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The employee failed to report the arrest within the three-business-day deadline mandated by DOE Order 472.2A, an
      aggravating factor under Guideline I.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The DOE-appointed psychologist concluded the employee suffers from a mental condition that impairs judgment, reliability,
      and trustworthiness, satisfying the security-concern language of Guideline I.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The record shows repeated contradictory statements, minimization, and deception, indicating a persistent pattern
      that undermines trustworthiness.
  - id: C4
    facts:
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The employee has not engaged in any treatment despite the DOE psychologist's recommendation, so mitigating conditions
      (a) and (b) are unavailable.
  - id: C5
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The consultant psychologist's opinion received little weight because it was not presented at the hearing and did
      not directly address the employee's inconsistent statements.
  - id: C6
    facts:
    - F9
    equity: operational_continuity
    favors:
    - O3
    weight: weak
    why: The employee occupies a critical position in a nuclear‑weapons design program with no qualified replacements, creating
      pressure to maintain program continuity.
  - id: C7
    facts:
    - F9
    equity: employee_fairness
    favors:
    - O3
    weight: weak
    why: Denying restoration would impose a disproportionate hardship on the employee given his unique expertise, suggesting
      a fairness interest in allowing limited restoration with counseling.
  reasoning:
    read: The judge must determine whether the employee's DUI arrest, untimely reporting, contradictory statements, and untreated
      mental-health condition constitute an unresolved Guideline I concern that bars restoration, even though the employee
      holds a critical role (F9).
    weighing: The adjudicator weighed the aggravating factors—failure to report (C1), the DOE psychologist's diagnosis (C2),
      and the pattern of deception (C3)—against the absence of mitigating treatment (C4) and the limited credibility of the
      consultant's opinion (C5). The weak operational-continuity and fairness interests introduced by F9 were noted in new_considerations
      but were insufficient to offset the strong security concerns, leading to a balance that favors denial.
    tradecraft: The decision is entered into the administrative record, citing 10 C.F.R. § 710.7(a), the Adjudicative Guidelines,
      and the specific exhibits that substantiate each factual finding.
    uncertainty: The only residual uncertainty is the consultant psychologist's divergent view, which the judge found insufficient
      to overcome the DOE psychologist's expert assessment and the documented conduct.
    handoff: The presiding Administrative Law Judge acted alone, as authorized, and did not refer the matter to a higher authority.
    tempting_wrong:
      option: O3
      pull: Restoring the clearance with voluntary counseling might seem compassionate given the employee's critical role.
      why_wrong: The unresolved mental-condition finding and the employee's pattern of deception remain present, posing a
        national-security risk that outweighs operational convenience.
    rejected:
      O1: A fresh psychological evaluation would not remedy the lack of treatment already documented and would not change
        the adjudicative finding of a disqualifying condition.
      O3: Restoration conflicts with the judge's determination that the employee has not demonstrated sufficient reliability
        to protect the common defense.
      O4: Holding the decision pending verification of treatment merely postpones a conclusion that the current record shows
        cannot be mitigated.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the employee voluntarily entered and completed a treatment program that a qualified mental-health professional deemed
        effective with a favorable prognosis
      then: O3
      why: Mitigating condition (b) would be satisfied, removing the mental-condition concern under Guideline I.
    - id: flip2
      if: the employee had reported the arrest within three working days as required by DOE Order 472.2A
      then: O3
      why: The failure to report is an aggravating factor; its removal would lessen the overall security concern.
    would_not_change:
    - id: noflip1
      if: the consultant psychologist's opinion were given full weight
      why: The judge expressly found the consultant's report unreliable and therefore it does not alter the security-concern
        analysis.
    watch_for:
    - id: watch1
      what: any future incidents showing continued minimization or deception
      favors:
      - O2
      why: Such behavior would reaffirm the mental-condition finding and keep the clearance denied.
  lesson: When a clearance holder fails to report a disqualifying incident and a qualified psychologist identifies a mental
    condition that impairs judgment, the lack of treatment and ongoing deceptive behavior constitute unresolved Guideline
    I concerns that preclude restoration, even if the individual occupies a critical position. Mitigating conditions must
    be demonstrably satisfied before any clearance can be reinstated.
  limits: This analysis applies solely to DOE personnel-security adjudications under 10 C.F.R. Part 710 and the associated
    Adjudicative Guidelines; it does not extend to criminal sentencing, civilian employment decisions, or clearances administered
    by other agencies.
