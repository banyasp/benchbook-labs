case:
  id: DR-HARIM-2014-1@v1
  title: Lifting No‑Strike Restriction on Compounds 001 and 002
  status: draft
  setting: Harim, Syria, November 5‑6 2014, United States Central Command (USCENTCOM)
  decider: the Combatant Commander
  agent: the Combatant Commander
  agent_role: decide
  situation: Compounds 001 and 002 were listed on the No‑Strike List with a CATCODE restriction. Intelligence assessments
    indicated that the compounds had been repurposed as KG‑affiliated meeting places, bomb‑making and safe‑house facilities
    used by hostile forces. The compounds are situated in a neighborhood that includes civilian housing. The Combatant Commander,
    as the only authority authorized to change an entity's status on the No‑Strike List, must decide whether to remove the
    restriction. The targets had been validated by the CENTCOM J3 target validation board and added to the Restricted Target
    List as legitimate military targets, with the strike planned for early morning to reduce civilian risk. LOAC principles
    and mitigation procedures were reported to have been followed, but evidence also shows that two civilian children were
    killed and two local civilians injured during the airstrikes.
  question: What should the Combatant Commander do regarding the no‑strike restriction on compounds 001 and 002?
  options:
    O1:
      do: The Combatant Commander asks for additional intelligence before deciding on compounds 001 and 002.
      move: ask
      irreversible: false
    O2:
      do: The Combatant Commander denies the strike on compounds 001 and 002.
      move: act
      irreversible: true
    O3:
      do: The Combatant Commander approves the strike on compounds 001 and 002.
      move: act
      irreversible: true
    O4:
      do: The Combatant Commander postpones the strike on compounds 001 and 002 pending additional intelligence.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Compounds 001 and 002 were on the No‑Strike List with a CATCODE restriction.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Intelligence assessed that compounds 001 and 002 had been repurposed as KG‑affiliated meeting places and bomb‑making
      facilities used by hostile forces.
  - id: F3
    kind: situation
    status: confirmed
    fact: The compounds are located in an area with civilian housing nearby.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Combatant Commander or his designated representative is the only level of command authorized to change the status
      of an entity on the No‑Strike List.
  - id: F5
    kind: authority
    status: confirmed
    fact: The targets were validated by the CENTCOM J3 target validation board and added to the Restricted Target List as
      legitimate military targets.
  - id: F6
    kind: situation
    status: confirmed
    fact: The strike was scheduled for early morning to minimize civilian risk.
  - id: F7
    kind: capability
    status: confirmed
    fact: Law of Armed Conflict principles of military necessity, proportionality, distinction, and procedures to mitigate
      civilian casualties were considered and followed.
  - id: F8
    kind: situation
    status: assessed
    fact: A preponderance of evidence indicates two civilian children were killed and two local civilians were injured during
      the airstrikes on 5‑6 November 2014.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Only the Combatant Commander or his designated representative is authorized to remove a CATCODE restriction, so the
      commander has clear legal authority to lift the no‑strike status.
  - id: C2
    facts:
    - F2
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Intelligence assessed that the compounds had been repurposed as KG‑affiliated meeting places and bomb‑making facilities,
      giving them a predominant military function that justifies targeting.
  - id: C3
    facts:
    - F5
    equity: chain_of_command
    favors:
    - O3
    weight: strong
    why: The CENTCOM J3 target validation board validated the targets and added them to the Restricted Target List, confirming
      they meet the required command‑level approval.
  - id: C4
    facts:
    - F6
    - F7
    equity: civilian_life
    favors:
    - O3
    weight: strong
    why: The strike was scheduled for early morning to minimize civilian exposure and all LOAC precautions—necessity, proportionality,
      distinction, and mitigation—were reported as followed.
  - id: C5
    facts:
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: A preponderance of evidence indicates two civilian children were killed and two civilians injured, which is a serious
      harm but was deemed regrettable rather than a basis to abort the strike.
  reasoning:
    read: The commander must decide whether to lift a no‑strike restriction on two compounds that intelligence says now serve
      hostile military purposes, while civilian housing exists nearby and some civilian casualties occurred.
    weighing: The commander’s exclusive authority (C1), the confirmed military repurposing (C2), and the formal validation
      by the J3 board (C3) are decisive factors. Mitigation steps (C4) further support the legality of the strike. Although
      civilian deaths are acknowledged (C5), they do not outweigh the mission imperative and lawful authority, leading to
      approval.
    tradecraft: The decision is recorded in the AR‑15‑6 investigation report, the CATCODE is removed in the NSL, and the strike
      is executed under the approved ROE with after‑action reporting to oversight bodies.
    uncertainty: Limited information on the exact location of the civilians relative to the targets creates some residual
      uncertainty, but the investigation concluded the authorization was reasonable given the intelligence available at the
      time.
    handoff: The Combatant Commander acts alone under delegated authority; no further consultation is required because the
      chain‑of‑command validation has already been completed.
    tempting_wrong:
      option: O2
      pull: The presence of civilian housing and the confirmed civilian casualties could tempt a commander to deny the strike
        to avoid civilian harm.
      why_wrong: The commander judged that the predominant military use and the authorized mitigation measures satisfy LOAC
        requirements, so denying the strike would forfeit a legitimate military objective.
    rejected:
      O1: Additional intelligence was not required because the existing assessments already met the validation standards.
      O2: Denial would ignore the commander’s authority, the validated military nature of the targets, and the mitigation
        steps already taken.
      O4: Postponement was unnecessary; the strike timing already minimized civilian risk and the command had sufficient confidence
        in the intelligence.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: subsequent intelligence conclusively showed the compounds had no predominant military function and were purely civilian
        housing
      then: O2
      why: Without a military use, the protected status could not be removed, making a strike unlawful.
    would_not_change:
    - id: noflip1
      if: the civilian casualties remain limited to the two children and two injuries already documented
      why: The source already deemed the strike lawful despite those casualties.
    watch_for:
    - id: watch1
      what: any new evidence of higher civilian presence or use of the compounds as shelters
      favors:
      - O2
      why: Increased civilian presence would raise proportionality and distinction concerns.
  lesson: When a commander has exclusive authority to remove a no‑strike restriction, a determination that a protected site
    now serves a predominant military function—validated by the appropriate command‑level board—permits targeting even in
    the presence of nearby civilians, provided LOAC mitigation measures are applied. Civilian casualties, while regrettable,
    do not automatically preclude a lawful strike if the targeting process meets legal standards.
  limits: This reasoning applies only when the commander’s authority is clear, the target has been formally validated as a
    military objective, and documented mitigation steps have been taken. It does not extend to situations where civilian use
    is dominant, validation is absent, or mitigation cannot be reasonably achieved.
