case:
  id: DR-HARIM-2014-1@v1
  title: Lift No‑Strike Restriction on Compounds 001 and 002
  status: draft
  setting: USCENTCOM, November 2014, Harim region, Syria
  decider: the Combatant Commander
  agent: the Combatant Commander
  agent_role: decide
  situation: Compounds 001 and 002, located near civilian housing, were listed on the No‑Strike list with a CATCODE restriction.
    Intelligence assessments indicated that the compounds had been repurposed as KG‑affiliated meeting places, bomb‑making
    sites, and safe‑houses used by hostile forces, thereby serving a predominant military function. The Combatant Commander
    is the sole authority authorized to remove the no‑strike restriction and change the status of entities on the NSL. The
    CENTCOM J3 target validation board reviewed the intelligence and added the compounds to the Restricted Target List as
    legitimate military targets. The commander removed the CATCODE restriction and approved a single airstrike, scheduling
    the attack for early morning to reduce civilian risk. Post‑strike analysis later reported probable civilian child deaths
    and injuries, though the exact cause could not be determined.
  question: What should the Combatant Commander do regarding lifting the no‑strike restriction and authorizing a strike on
    compounds 001 and 002?
  options:
    O1:
      do: The Combatant Commander holds the decision pending additional intelligence on civilian presence near compounds 001
        and 002.
      move: hold
      irreversible: false
    O2:
      do: The Combatant Commander approves the removal of the no‑strike restriction and authorizes a strike on compounds 001
        and 002.
      move: act
      irreversible: true
    O3:
      do: The Combatant Commander denies the removal of the no‑strike restriction and refrains from authorizing a strike on
        compounds 001 and 002.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Compounds 001 and 002 were on the No‑Strike list with a CATCODE restriction.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Combatant Commander or his designated representative is the only level authorized to change the status of an
      entity on the NSL.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Intelligence assessed compounds 001 and 002 as repurposed for military use, serving as KG‑affiliated meeting places,
      bomb‑making facilities, and safe‑houses for hostile extremists.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Combatant Commander (USCENTCOM) removed the CATCODE restriction and approved a single engagement on the compounds.
  - id: F5
    kind: authority
    status: confirmed
    fact: The targets were validated by the CENTCOM J3 target validation board and added to the Restricted Target List as
      legitimate military targets.
  - id: F6
    kind: situation
    status: confirmed
    fact: Civilian housing is located near compounds 001 and 002.
  - id: F7
    kind: capability
    status: assessed
    fact: The strike was scheduled for early morning hours to minimize risk to civilians.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Post‑strike assessment indicated that two civilian children were probably killed and two local civilians injured,
      though the exact cause could not be determined.
  - id: F9
    kind: authority
    status: assessed
    fact: Law of Armed Conflict principles of military necessity, proportionality, distinction, and unnecessary suffering
      were asserted to have been adhered to in the strike.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Combatant Commander is the only authority authorized to remove a No‑Strike CATCODE and the commander exercised
      that authority, as documented in the AR 15‑6 findings.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Intelligence assessed that compounds 001 and 002 had been repurposed as KG‑affiliated meeting places, bomb‑making
      sites, and safe‑houses, giving them a predominant military function despite nearby civilian housing.
  - id: C3
    facts:
    - F5
    - F7
    - F9
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The targets were validated by the CENTCOM J3 board, scheduled for early‑morning attack to minimize civilian exposure,
      and the strike adhered to LOAC principles of necessity, proportionality, distinction, and unnecessary suffering.
  - id: C4
    facts:
    - F8
    equity: civilian_life
    favors:
    - O1
    - O3
    weight: weak
    why: Post‑strike assessment indicated probable civilian child deaths and injuries, and the evidence was deemed insufficient
      to overturn the earlier determination of lawful targeting.
  - id: C5
    facts:
    - F1
    - F2
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Regulations require that a facility’s protected status be removed by proper authority before engagement; the commander’s
      action satisfied that requirement after the intelligence determination.
  reasoning:
    read: Compounds 001 and 002, listed on the No‑Strike list, were judged to have shifted from civilian housing to facilities
      serving a predominant hostile military purpose. The commander faced the dilemma of protecting nearby civilians versus
      neutralizing a legitimate enemy capability.
    weighing: The source weighed the authority to lift the restriction (C1, C5) and the intelligence of predominant military
      use (C2) against the precautionary steps taken (C3). Although civilian casualties were reported (C4), the AR 15‑6 investigation
      found the strike reasonable and LOAC‑compliant, tipping the balance toward approval.
    tradecraft: The commander recorded the removal of the CATCODE in the NSL, documented the intelligence assessment, and
      filed the AR 15‑6 findings. The strike was logged, and post‑strike casualty reports were entered for future review.
    uncertainty: The exact cause of the civilian casualties (primary vs. secondary explosion) could not be determined, leaving
      some residual uncertainty about the proportionality assessment.
    handoff: The decision was made by the Combatant Commander after validation by the CENTCOM J3 target validation board;
      no further escalation was required.
    tempting_wrong:
      option: O3
      pull: Avoid civilian harm by denying the strike.
      why_wrong: The source determined that the compounds had lost protected status and that the strike met LOAC requirements;
        denying would forfeit a legitimate military target.
    rejected:
      O1: Holding the decision would delay neutralizing a confirmed hostile facility and was unnecessary given the available
        intelligence and precautions.
      O3: Denying the strike would ignore the authority‑driven determination that the facilities were no longer protected
        civilian structures.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: subsequent intelligence demonstrated that the predominant function of the compounds was civilian rather than military
      then: O3
      why: Without a military function the protected status could not be lawfully removed, making a strike unlawful.
    would_not_change:
    - id: noflip1
      if: the strike was conducted with the documented early‑morning timing and all LOAC precautions were observed
      why: The source affirmed that these precautions satisfied the proportionality and distinction requirements.
    watch_for:
    - id: watch1
      what: any future evidence that civilian casualties exceeded proportionality thresholds
      favors:
      - O3
      why: Higher civilian harm could trigger a reassessment of the target’s status.
  lesson: When credible intelligence shows that a No‑Strike facility has lost its protected status because its predominant
    use is military, the authorized commander may lift the restriction and strike, provided LOAC safeguards and timing precautions
    are applied.
  limits: This rule applies only when the determination of predominant military use is made by the proper authority and is
    supported by reliable intelligence; it does not apply where civilian use remains primary or where protected status cannot
    be lawfully removed.
