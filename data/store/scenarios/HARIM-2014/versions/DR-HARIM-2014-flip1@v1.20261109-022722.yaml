case:
  id: DR-HARIM-2014-flip1@v1
  title: Lift No‑Strike Restriction on Compounds 001 and 002 [flip]
  status: needs_review
  setting: CENTCOM AOR, March 2022, outskirts of Al-Rashid, Iraq
  decider: the Combatant Commander
  agent: the Combatant Commander
  agent_role: decide
  situation: Compounds 001 and 002, situated adjacent to civilian dwellings, were originally listed on the No-Strike list
    with a CATCODE restriction. New intelligence later assessed that the sites function mainly as residential homes and small
    commercial workshops, with only marginal incidental military activity. The Combatant Commander is the exclusive authority
    to lift a No-Strike restriction and alter an entity's status on the NSL. The CENTCOM J3 target validation board had previously
    validated the sites and placed them on the Restricted Target List as presumed military targets. The commander removed
    the CATCODE restriction and scheduled a single airstrike for early morning to limit civilian exposure. After the strike,
    analysts reported probable civilian child deaths and injuries, though the precise cause remained unclear.
  question: Should the Combatant Commander maintain the No-Strike restriction and refrain from authorizing a strike on compounds
    001 and 002?
  options:
    O1:
      do: Hold the decision pending further intelligence on civilian presence at compounds 001 and 002.
      move: hold
      irreversible: false
    O2:
      do: Approve the removal of the No-Strike restriction and authorize a strike on compounds 001 and 002.
      move: act
      irreversible: true
    O3:
      do: Deny the removal of the No-Strike restriction and refrain from authorizing a strike on compounds 001 and 002.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Entries 001 and 002 had been entered onto the No-Strike register, each bearing a CATCODE prohibition.
  - id: F2
    kind: authority
    status: confirmed
    fact: Only the Combatant Commander, or a delegate he appoints, may alter an entity's designation on the No-Strike List.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Intelligence later assessed that compounds 001 and 002 were primarily used for civilian purposes, functioning mainly
      as residential housing and commercial workshops, with only minimal incidental military activity.
  - id: F4
    kind: authority
    status: confirmed
    fact: The CENTCOM Combatant Commander exercised his authority to lift the CATCODE ban and sanctioned one airstrike against
      the two sites.
  - id: F5
    kind: authority
    status: confirmed
    fact: Following review, the J3 target-validation panel certified the sites as valid military objectives and entered them
      onto the Restricted Target List.
  - id: F6
    kind: situation
    status: confirmed
    fact: Neighbouring civilian residences are situated adjacent to the two compounds.
  - id: F7
    kind: capability
    status: assessed
    fact: Planners set the attack for pre-dawn hours in order to reduce civilian exposure.
  - id: F8
    kind: intelligence
    status: assessed
    fact: After the operation, evaluators judged that two children likely perished and two other locals sustained injuries,
      but the precise source of harm remained unclear.
  - id: F9
    kind: authority
    status: assessed
    fact: The conduct of the strike was claimed to comply with LOAC tenets of necessity, proportionality, distinction, and
      avoidance of unnecessary suffering.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Combatant Commander remains the sole authority to modify a No-Strike CATCODE, and he exercised that authority
      by removing the restriction, as recorded in the official documentation.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Updated intelligence indicates that compounds 001 and 002 are chiefly civilian residences and workshops, with only
      limited incidental military activity, undermining any predominant military function.
  - id: C4
    facts:
    - F8
    equity: civilian_life
    favors:
    - O1
    - O3
    weight: weak
    why: Post-strike assessment shows probable civilian child deaths and injuries, and the evidence is insufficient to overturn
      the earlier determination of lawful targeting.
  - id: C5
    facts:
    - F1
    - F2
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Regulations require that protected status be removed only when a legitimate military function is established; the
      revised intelligence showing civilian predominance means the commander's removal does not satisfy that requirement.
  reasoning:
    read: Compounds 001 and 002, originally on the No-Strike list, were later judged to remain primarily civilian facilities
      despite nearby housing. The commander must decide whether to keep the protection or to proceed with a strike that could
      cause civilian harm.
    weighing: The analysis weighed the authority to lift the restriction (C1) against the revised intelligence showing civilian
      predominance (C2) and the legal requirement that removal be justified (C5). The civilian casualty report (C4) further
      tipped the balance toward maintaining protection, leading to a denial of the strike.
    tradecraft: The commander documented the removal of the CATCODE, filed the intelligence assessment, and recorded the AR
      15-6 findings. Post-strike casualty data were entered for future review.
    uncertainty: The exact mechanism of the civilian casualties (direct blast vs. secondary effects) remains unclear, leaving
      some residual doubt about the proportionality calculation.
    handoff: The decision rests with the Combatant Commander after validation by the CENTCOM J3 board; no higher authority
      escalation is required.
    tempting_wrong:
      option: O2
      pull: Eliminate a potential threat by striking the compounds.
      why_wrong: The latest intelligence shows the sites are primarily civilian, making a strike disproportionate and unlawful
        under LOAC.
    rejected:
      O1: Holding the decision provides no immediate protection for civilians and does not address the reported casualties.
      O2: Approving the strike would violate LOAC because the facilities lack a predominant military function.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C2
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: subsequent intelligence demonstrates that the predominant function of the compounds is military rather than civilian
      then: O2
      why: A confirmed military use would re-establish a lawful basis to lift the restriction and conduct the strike.
    would_not_change:
    - id: noflip1
      if: the strike was conducted with the documented early-morning timing and all LOAC precautions were observed
      why: The source affirmed that these precautions satisfied the proportionality and distinction requirements.
    watch_for:
    - id: watch1
      what: any future evidence that civilian casualties exceed proportionality thresholds
      favors:
      - O3
      why: Higher civilian harm could trigger a reassessment of the target's status.
  lesson: When credible intelligence confirms that a No-Strike facility remains primarily civilian, the commander must retain
    the protection and refrain from authorizing a strike, even if some incidental military activity is present.
  limits: This guidance applies only when the determination of predominant civilian use is made by the proper authority and
    supported by reliable intelligence; it does not apply where a clear military function is established or where protected
    status cannot be lawfully removed.
