case:
  id: DR-HARIM-2014-restyle1@v1
  title: Lift No‑Strike Restriction on Compounds 001 and 002 [restyle]
  status: needs_review
  setting: Joint Forces Headquarters, March 2022, Eastern Province, Country X
  decider: the Area Commander
  agent: the Area Commander
  agent_role: decide
  situation: Compounds 001 and 002, situated adjacent to a civilian neighbourhood, were entered on the No-Strike register
    with a PROHIBIT designation. Intelligence reports indicated that the compounds had been converted into extremist-affiliated
    meeting venues, improvised-explosive workshops, and safe-houses for hostile operatives, thereby serving a dominant military
    purpose. The Area Commander is the exclusive authority empowered to rescind the prohibition and alter the status of entries
    on the register. The regional J3 target-validation panel reviewed the intelligence and placed the compounds on the Restricted
    Target List as lawful military objectives. The commander removed the PROHIBIT tag and sanctioned a single airstrike, timing
    the operation for early dawn to lessen civilian exposure. Subsequent assessment noted probable civilian child fatalities
    and injuries, though the precise cause could not be ascertained.
  question: What should the Area Commander do concerning the removal of the prohibition and the authorization of a strike
    on compounds 001 and 002?
  options:
    O1:
      do: The Area Commander should defer the decision until further intelligence on civilian presence near compounds 001
        and 002 is obtained.
      move: hold
      irreversible: false
    O2:
      do: The Area Commander should lift the prohibition and approve a strike on compounds 001 and 002.
      move: act
      irreversible: true
    O3:
      do: The Area Commander should refuse to lift the prohibition and refrain from authorising a strike on compounds 001
        and 002.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Compounds 001 and 002 were listed on the No-Strike register with a PROHIBIT designation.
  - id: F2
    kind: authority
    status: confirmed
    fact: Only the Area Commander or a delegate expressly appointed by him may modify the status of an entry on the register.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Intelligence judged Compounds 001 and 002 to have been repurposed for military use, functioning as extremist-affiliated
      meeting venues, bomb-making workshops, and safe-houses for hostile fighters.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Area Commander (Joint Forces Headquarters) removed the PROHIBIT restriction and approved a single engagement
      on the compounds.
  - id: F5
    kind: authority
    status: confirmed
    fact: The targets were validated by the J3 target-validation board and added to the Restricted Target List as legitimate
      military targets.
  - id: F6
    kind: situation
    status: confirmed
    fact: Civilian dwellings are located in close proximity to Compounds 001 and 002.
  - id: F7
    kind: capability
    status: assessed
    fact: The strike was scheduled for early-dawn hours to reduce the risk to civilians.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Post-strike analysis indicated that two civilian children were probably killed and two local civilians injured,
      though the exact cause could not be determined.
  - id: F9
    kind: authority
    status: assessed
    fact: Law of Armed Conflict principles of military necessity, proportionality, distinction, and avoidance of unnecessary
      suffering were asserted to have been observed in the strike.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Area Commander alone holds the legal authority to rescind a No-Strike PROHIBIT, and he exercised that authority
      as recorded in the AR 15-6 findings.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Intelligence determined that Compounds 001 and 002 had been transformed into extremist-affiliated meeting places,
      bomb-making facilities, and safe-houses, conferring a predominant military function despite the nearby civilian neighbourhood.
  - id: C3
    facts:
    - F5
    - F7
    - F9
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The targets were cleared by the J3 panel, the attack was timed for early dawn to limit civilian exposure, and the
      operation complied with LOAC requirements of necessity, proportionality, distinction, and avoidance of unnecessary suffering.
  - id: C4
    facts:
    - F8
    equity: civilian_life
    favors:
    - O1
    - O3
    weight: weak
    why: The post-strike report suggests probable civilian child deaths and injuries, yet the evidence was deemed insufficient
      to overturn the prior lawful-target determination.
  - id: C5
    facts:
    - F1
    - F2
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Regulations require that a protected status be removed by the proper authority before engagement; the commander's
      action satisfied that prerequisite following the intelligence assessment.
  reasoning:
    read: Compounds 001 and 002, originally on the No-Strike register, were judged to have transitioned from civilian structures
      to facilities serving a dominant hostile military role. The commander faced a trade-off between shielding nearby civilians
      and neutralising a genuine enemy capability.
    weighing: The analysis gave primary weight to the commander's authority to lift the prohibition (C1, C5) and the intelligence
      indicating predominant military use (C2), while also noting the precautionary timing (C3). Although civilian casualties
      were reported (C4), the AR 15-6 review concluded the strike was lawful and LOAC-compliant, tipping the balance toward
      approval.
    tradecraft: The commander documented the removal of the PROHIBIT tag in the register, recorded the intelligence assessment,
      and filed the AR 15-6 findings. The strike was entered into the operational log, and the casualty report was filed for
      future review.
    uncertainty: The precise mechanism of the civilian casualties (primary versus secondary blast) could not be established,
      leaving residual doubt about the proportionality calculation.
    handoff: The decision rested with the Area Commander after validation by the J3 target-validation panel; no further escalation
      was required.
    tempting_wrong:
      option: O3
      pull: Prevent civilian harm by refusing the strike.
      why_wrong: The source concluded that the compounds had lost protected status and that the strike met LOAC standards;
        refusing would forfeit a legitimate military target.
    rejected:
      O1: Deferring would delay the neutralisation of a confirmed hostile facility and was unnecessary given the available
        intelligence and safeguards.
      O3: Refusing the strike would ignore the authority-driven finding that the facilities were no longer protected civilian
        structures.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: subsequent intelligence demonstrated that the predominant function of the compounds was civilian rather than military
      then: O3
      why: Without a military function the protected status could not be lawfully removed, rendering a strike unlawful.
    would_not_change:
    - id: noflip1
      if: the strike was executed at the documented early-dawn time and all LOAC safeguards were observed
      why: The source affirmed that these measures satisfied the proportionality and distinction requirements.
    watch_for:
    - id: watch1
      what: any future evidence that civilian casualties exceed proportionality limits
      favors:
      - O3
      why: Higher civilian harm would prompt a reassessment of the target's status.
  lesson: When credible intelligence shows that a No-Strike facility has forfeited its protected status because its primary
    use is military, the duly authorised commander may lift the prohibition and conduct a strike, provided LOAC safeguards
    and timing precautions are observed.
  limits: This principle applies only when the determination of predominant military use is made by the proper authority and
    is supported by reliable intelligence; it does not apply where civilian use remains dominant or where protected status
    cannot be lawfully removed.
