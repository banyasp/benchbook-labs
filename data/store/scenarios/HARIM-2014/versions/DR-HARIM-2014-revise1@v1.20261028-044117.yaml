case:
  id: DR-HARIM-2014-revise1@v1
  title: Lift No‑Strike Restriction on Compounds 001 and 002 [revise]
  status: needs_review
  setting: USCENTCOM, November 2014, Harim region, Syria
  decider: the Combatant Commander
  agent: the Combatant Commander
  agent_role: decide
  situation: Compounds 001 and 002, located near civilian housing, were listed on the No‑Strike list with a CATCODE restriction.
    Intelligence assessments indicated that the compounds had been repurposed as KG‑affiliated meeting places, bomb‑making
    sites, and safe‑houses used by hostile forces, thereby serving a predominant military function. The Combatant Commander
    is the sole authority authorized to remove the no‑strike restriction and change the status of entities on the NSL. The
    CENTCOM J3 target validation board reviewed the intelligence and added the compounds to the Restricted Target List as
    legitimate military targets. The commander removed the CATCODE restriction and approved a single airstrike, scheduling
    the attack for early morning to reduce civilian risk. Post‑strike analysis later reported probable civilian child deaths
    and injuries, though the exact cause could not be determined.
  question: What should the Combatant Commander do regarding lifting the no‑strike restriction and authorizing a strike on
    compounds 001 and 002?
  options:
    O1:
      do: The Combatant Commander holds the decision pending additional intelligence on civilian presence near compounds 001
        and 002.
      move: hold
      irreversible: false
    O2:
      do: The Combatant Commander approves the removal of the no‑strike restriction and authorizes a strike on compounds 001
        and 002.
      move: act
      irreversible: true
    O3:
      do: The Combatant Commander denies the removal of the no‑strike restriction and refrains from authorizing a strike on
        compounds 001 and 002.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Compounds 001 and 002 were on the No‑Strike list with a CATCODE restriction.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Combatant Commander or his designated representative is the only level authorized to change the status of an
      entity on the NSL.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Intelligence assessed compounds 001 and 002 as repurposed for military use, serving as KG‑affiliated meeting places,
      bomb‑making facilities, and safe‑houses for hostile extremists.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Combatant Commander (USCENTCOM) removed the CATCODE restriction and approved a single engagement on the compounds.
  - id: F5
    kind: authority
    status: confirmed
    fact: The targets were validated by the CENTCOM J3 target validation board and added to the Restricted Target List as
      legitimate military targets.
  - id: F6
    kind: situation
    status: confirmed
    fact: Civilian housing is located near compounds 001 and 002.
  - id: F7
    kind: capability
    status: assessed
    fact: The strike was scheduled for early morning hours to minimize risk to civilians.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Post‑strike assessment indicated that two civilian children were probably killed and two local civilians injured,
      though the exact cause could not be determined.
  - id: F9
    kind: authority
    status: assessed
    fact: Law of Armed Conflict principles of military necessity, proportionality, distinction, and unnecessary suffering
      were asserted to have been adhered to in the strike.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The commander has sole authority to lift the restriction, but exercising that authority alone does not guarantee
      the strike is justified given the nearby civilian presence.
  - id: C2
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Intelligence points to predominant military use, yet the assessment is uncertain and the proximity of civilian housing
      reduces confidence in that conclusion.
  - id: C3
    facts:
    - F5
    - F7
    - F9
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: Validation and early-morning timing mitigate risk, but the post-strike civilian casualties raise serious doubts about
      proportionality and distinction.
  - id: C4
    facts:
    - F8
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Probable civilian child deaths and injuries indicate insufficient certainty to proceed; the commander should hold
      the decision pending further intelligence on civilian presence.
  - id: C5
    facts:
    - F1
    - F2
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Regulations allow removal of protected status, but without conclusive evidence of a predominant military function
      the authority alone is insufficient to justify a strike.
  reasoning:
    read: Compounds 001 and 002, originally on the No-Strike list, were re-evaluated as having a military function while being
      adjacent to civilian housing; a strike was approved, but post-strike reports suggest probable civilian child deaths.
    weighing: The revised analysis gives decisive weight to the civilian-life equity (C4) and treats authority, mission-effect,
      and validation equities as weak, concluding that the risk to civilians outweighs the perceived military benefit.
    tradecraft: The commander documented the removal of the CATCODE, recorded the intelligence assessment, and logged the
      strike timing; post-strike casualty reports are now being used to reassess the target status before any further action.
    uncertainty: Uncertainty remains about the exact cause of civilian casualties and the reliability of the intelligence
      indicating predominant military use, reinforcing the need for additional information.
    handoff: The decision remains with the Combatant Commander, but the revised weighing advises a pause until further civilian-presence
      intelligence is obtained.
    tempting_wrong:
      option: O2
      pull: Approve the strike to eliminate a confirmed hostile facility.
      why_wrong: Proceeding despite probable civilian child deaths violates proportionality and the precautionary principle,
        making the strike ethically and legally untenable.
    rejected:
      O2: Approving the strike ignores the strong indication of civilian harm and the remaining uncertainty about the target's
        true function.
      O3: Denying the strike altogether would forgo a legitimate military opportunity without first seeking additional intelligence
        that could clarify the civilian risk.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: subsequent intelligence demonstrated that the predominant function of the compounds was civilian rather than military
      then: O2
      why: If later intelligence shows the compounds are primarily civilian, the decision could still shift to approval if
        an imminent threat is identified from other sources.
    would_not_change:
    - id: noflip1
      if: the strike was conducted with the documented early‑morning timing and all LOAC precautions were observed
      why: The source affirmed that these precautions satisfied the proportionality and distinction requirements.
    watch_for:
    - id: watch1
      what: any future evidence that civilian casualties exceeded proportionality thresholds
      favors:
      - O3
      why: Higher civilian harm could trigger a reassessment of the target’s status.
  lesson: When credible evidence of civilian casualties emerges, the precautionary principle demands holding the decision
    pending further intelligence, even if authority and prior assessments favor a strike.
  limits: This guidance applies when post-strike assessments indicate probable civilian harm and the intelligence on military
    use remains uncertain; it does not override clear, overwhelming evidence of an imminent, high-value military target.
