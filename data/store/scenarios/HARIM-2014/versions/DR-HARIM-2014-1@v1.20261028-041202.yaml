case:
  id: DR-HARIM-2014-1@v1
  title: Lifting No‑Strike Restriction on Compounds 001 and 002
  status: draft
  setting: USCENTCOM, November 2014, Harim region, Syria
  decider: the Combatant Commander
  agent: the Combatant Commander
  agent_role: decide
  situation: Compounds 001 and 002 were listed on the No‑Strike list because they contained civilian housing. Intelligence
    assessments concluded that the compounds had been repurposed as hostile meeting places, bomb‑making facilities, and safe‑houses
    used by KG‑affiliated extremists. The Combatant Commander holds the sole authority to remove the CATCODE restriction and
    to approve a strike on NSL entities. The targets had been validated by the CENTCOM J3 target‑validation board and added
    to the Restricted Target List as legitimate military targets. Civilian casualties were later reported, with two children
    killed and two local civilians injured, though attribution to a specific strike could not be determined.
  question: What should the Combatant Commander do regarding lifting the no‑strike restriction on compounds 001 and 002 and
    approving a strike?
  options:
    O1:
      do: The Combatant Commander partially lifts the no‑strike restriction on compounds 001 and 002, permitting a limited
        strike while deferring a full engagement.
      move: partial
      irreversible: false
    O2:
      do: The Combatant Commander lifts the no‑strike restriction on compounds 001 and 002 and authorizes a single strike.
      move: act
      irreversible: true
    O3:
      do: The Combatant Commander maintains the no‑strike restriction on compounds 001 and 002 and declines to authorize a
        strike.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Compounds 001 and 002 were designated as No‑Strike entities on the NSL due to civilian housing.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Intelligence determined the predominant use of compounds 001 and 002 was as hostile meeting places and bomb‑making
      facilities.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Combatant Commander is the only level authorized to change the status of an entity on the NSL.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Combatant Commander removed the No‑Strike restriction and approved a strike on the compounds.
  - id: F5
    kind: situation
    status: confirmed
    fact: The targets were validated by the CENTCOM J3 target‑validation board and added to the Restricted Target List as
      legitimate military targets.
  - id: F6
    kind: authority
    status: confirmed
    fact: The engagement was carried out under applicable authorities, ROE, and LOAC, with procedures intended to mitigate
      civilian harm.
  - id: F7
    kind: situation
    status: assessed
    fact: A preponderance of evidence indicates that two civilian children were killed and two local civilians injured in
      the strike, though attribution to a specific strike is uncertain.
  - id: F8
    kind: authority
    status: confirmed
    fact: Dual‑use facilities lose protected status if determined to support exclusively military purposes, and only proper
      authority may remove that status.
  considerations:
  - id: C1
    facts:
    - F3
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Combatant Commander is the sole authority to remove the No‑Strike CATCODE and change an entity's status on the
      NSL, and only a proper authority may lift protected status.
  - id: C2
    facts:
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Intelligence assessments concluded that compounds 001 and 002 were being used predominantly as hostile meeting places,
      bomb‑making facilities, and safe‑houses for KG‑affiliated extremists, converting them to legitimate military objectives.
  - id: C3
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The targets were validated by the CENTCOM J3 target‑validation board, added to the Restricted Target List, and the
      strike was executed in accordance with ROE, LOAC, and mitigation procedures to minimize civilian risk.
  - id: C4
    facts:
    - F7
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: Although a preponderance of evidence indicates two civilian children were killed and two locals injured, the investigation
      found the strike lawful and noted that civilian loss, while regrettable, does not overturn the validity of the targeting
      decision.
  reasoning:
    read: The commander faced a conflict between the No‑Strike protection of civilian housing and intelligence showing the
      compounds had become hostile military facilities. Only the commander can lift the restriction and the targets were validated
      as legitimate military objectives.
    weighing: The source gives decisive weight to authority (C1), the intelligence determination of predominant military use
      (C2), and the formal validation process (C3). Civilian casualty evidence (C4) is acknowledged but deemed insufficient
      to negate the lawful authority and mission necessity, leading to a net endorsement of the strike.
    tradecraft: The commander documented the removal of the CATCODE, recorded the target‑validation board decision, and filed
      the AR‑15‑6 investigation findings to provide an auditable trail of authority, intelligence, and compliance with LOAC.
    uncertainty: At the time of the decision, the exact location of civilians relative to the targets and whether casualties
      resulted from primary or secondary explosions could not be determined.
    handoff: The decision rests solely with the Combatant Commander; no additional consultative body is required beyond the
      target‑validation board and intelligence analysts.
    tempting_wrong:
      option: O3
      pull: Preserving the No‑Strike status to avoid any civilian risk.
      why_wrong: The source states that the protected status must be removed when an entity’s predominant function supports
        military objectives, and the commander has the exclusive authority to do so.
    rejected:
      O1: A partial lift would leave the decision ambiguous and conflict with the commander’s authority to either fully remove
        the restriction or maintain it.
      O3: Maintaining the No‑Strike restriction would ignore the intelligence assessment and the validated determination that
        the compounds were being used for hostile purposes.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: subsequent intelligence proved the compounds were not being used for military purposes
      then: O3
      why: Without a predominant military function, the protected status could not be lawfully removed.
    would_not_change:
    - id: noflip1
      if: civilian casualties occurred as reported
      why: Despite civilian deaths, coalition targeting practices will continue.
    watch_for:
    - id: watch1
      what: new intelligence indicating a higher concentration of civilians at the sites
      favors:
      - O3
      why: Increased civilian presence could shift the balance toward preserving the No‑Strike status.
  lesson: When a No‑Strike entity is determined by the authorized commander to have a predominant military function, its protected
    status may be removed and a strike authorized, provided the decision follows the validation process and LOAC mitigation
    requirements.
  limits: This rule applies only when the determination of military use is made by the proper authority and validated through
    the target‑validation board; it does not excuse strikes where intelligence is insufficient or where civilian presence
    is known and substantial.
