case:
  id: DR-CORPUS-NS-9d786077-E2@v1
  title: Delegating Fires Enterprise Latitude
  status: draft
  setting: At the maneuver brigade commander's initial counseling, about 10 days before deployment to a decisive-action NTC
    rotation, in the BCT.
  decider: The Brigade Commander
  agent: The Brigade Commander
  agent_role: decide
  situation: The coordinator had been in battalion command for one week when the initial counseling took place. The counseling
    was about 10 days before deployment to a decisive-action NTC rotation. The coordinator lacked context from the organization's
    home-station training for the transition to the rotation. The Brigade Commander understood the coordinator's limited time
    in command and lack of context. The Brigade Commander regarded fires as hard and complicated and did not completely understand
    that area. The coordinator's role was to make the fires enterprise work to meet the Brigade Commander's intent.
  question: What should the Brigade Commander do at the coordinator's initial counseling about the coordinator's latitude
    over the BCT fires enterprise?
  options:
    O1:
      do: The Brigade Commander grants the coordinator latitude over the fires enterprise to meet the commander's intent.
      move: act
      irreversible: false
    O2:
      do: The Brigade Commander denies the coordinator latitude and retains close control of the fires enterprise.
      move: act
      irreversible: false
    O3:
      do: The Brigade Commander grants the coordinator limited latitude over the fires enterprise under closer oversight.
      move: partial
      irreversible: false
      to: the coordinator
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The coordinator had been in battalion command for one week when the initial counseling took place.
  - id: F2
    kind: situation
    status: confirmed
    fact: The counseling took place approximately 10 days before deployment to a decisive-action NTC rotation.
  - id: F3
    kind: situation
    status: assessed
    fact: The coordinator lacked context from the organization's home-station training for the transition to the NTC rotation.
  - id: F4
    kind: situation
    status: assessed
    fact: The Brigade Commander understood that the coordinator had been in command for only one week and lacked the prior
      training context.
  - id: F5
    kind: capability
    status: assessed
    fact: The Brigade Commander described fires as hard and complicated and said he did not completely understand that area.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Brigade Commander identified making the fires enterprise work to meet his intent as part of the coordinator's
      role.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The coordinator was new to command and lacked the organization's home-station training context shortly before deployment.
      Those acknowledged constraints support caution about the extent of latitude, though the reflection does not treat them
      as a reason to deny it.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The commander regarded fires as hard and complicated and did not completely understand the area. The reflection presents
      this as context for trusting the coordinator to make the enterprise work, rather than for the commander to retain close
      control.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Making the fires enterprise work to meet the commander's intent was part of the coordinator's role, supporting latitude
      within that delegated purpose.
  - id: C4
    facts:
    - F5
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The commander expressly trusted the coordinator to do the job and meet his intent. The reflection says that trust
      empowered the coordinator to act confidently and generate relevant dialogue with the commander and fellow commanders.
  reasoning:
    read: This was an initial counseling shortly before deployment, with a coordinator who had little time in command and
      lacked prior training context, while the commander acknowledged that fires was a complicated area he did not fully understand.
      The trap is to treat the coordinator's limited context as a reason for the commander to take over an area he himself
      did not completely understand, rather than to give the coordinator the latitude assigned by the role and the commander's
      intent.
    weighing: The coordinator's newness and missing context support some caution {C1}, but the reflection's endorsed balance
      is trust, not close control. The commander's limited understanding of a complicated area, the coordinator's responsibility
      to make it work, and the stated intent together favor granting latitude {C2} {C3} {C4}. The balance depends on the coordinator
      acting to meet the commander's intent; the source does not describe a separate condition or oversight scheme.
    tradecraft: State the coordinator's responsibility and the commander's intent plainly, and preserve the relevant dialogue
      between them as the coordinator carries out that role. Any additional boundaries or reporting arrangements would be
      implementation choices, not conditions stated in the reflection.
    uncertainty: The reflection does not specify formal limits on the coordinator's latitude, subsequent oversight, or what
      would happen if the coordinator could not meet the commander's intent.
    handoff: The commander makes the delegation decision. The reflection supports continued dialogue with the coordinator
      and fellow commanders, but does not indicate that the decision should be referred to another authority.
    tempting_wrong:
      option: O2
      pull: The coordinator had only one week in command and lacked context from prior training shortly before deployment.
      why_wrong: Those facts were understood by the commander, but the reflection's endorsed response was to trust the coordinator
        with the role, especially given the commander's own limited understanding of the complicated area.
    rejected:
      O2: The commander did not retain close control; he trusted the coordinator to make the fires enterprise work and meet
        his intent.
      O3: The reflection endorses trust and latitude, not a limited delegation under closer oversight.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander had concrete reason to believe the coordinator could not make the enterprise work to meet the commander's
        intent.
      then: O3
      why: That would weaken the reflection's central basis for broad trust and could support granting latitude with closer
        oversight.
    would_not_change:
    - id: noflip1
      if: The coordinator still had only one week in command and lacked the prior training context described here.
      why: Those circumstances were already understood at counseling, yet the commander chose to trust the coordinator rather
        than deny latitude.
    watch_for:
    - id: watch1
      what: Whether the coordinator's actions continue to meet the commander's intent.
      favors:
      - O3
      why: The trust described in the reflection is expressly tied to doing the job to meet that intent; a failure to do so
        could support reconsidering the extent of latitude.
  lesson: When a commander recognizes both an agent's limited context and the commander's own limits in a complex area, trust
    can be the better way to enable the assigned role. Delegate against a clear intent and maintain relevant dialogue rather
    than treating newness alone as a reason to retain control.
  limits: This reasoning concerns the counseling decision and the latitude granted to this coordinator in this setting. It
    does not establish that trust requires unlimited discretion, or determine how any particular fires decision should be
    made.
