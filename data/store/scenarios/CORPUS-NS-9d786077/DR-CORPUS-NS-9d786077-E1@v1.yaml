case:
  id: DR-CORPUS-NS-9d786077-E1@v1
  title: Weather and Forward Progress
  status: draft
  setting: National Training Center (NTC), a cold, foggy, rainy night during a brigade combat team rotation.
  decider: The division commander
  agent: The division commander
  agent_role: decide
  situation: The brigade combat team has been making slow progress through the day while preparing for the next operation,
    described as the rotation’s biggest combat operation. The brigade commander reports that several battalion commanders
    consider movement through the restricted terrain too dangerous. Fog, rain, and possible flooding are contributing to those
    concerns, and no one has been hurt. Stopping risks mission failure. Other elements on the battlefield have raised similar
    concerns, and the division commander must decide what direction to give the brigade.
  question: What should the division commander direct the brigade to do about its movement and mission?
  options:
    O1:
      do: The division commander directs the brigade to advance and continue the mission as planned.
      move: act
      irreversible: false
    O2:
      do: The division commander directs the brigade to halt at its current position and execute when weather permits.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: It is a cold, foggy, rainy night at the NTC.
  - id: F2
    kind: situation
    status: confirmed
    fact: The brigade combat team has been making slow progress while setting conditions for the next operation, described
      as the rotation’s biggest combat operation.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Several battalion commanders believe movement through the restricted terrain is too dangerous.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Fog, rain, and imminent flooding give some units a valid safety concern in their areas.
  - id: F5
    kind: situation
    status: confirmed
    fact: Nobody has been hurt.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Stopping at this point risks mission failure for the team.
  - id: F7
    kind: authority
    status: confirmed
    fact: The division commander is the brigade commander’s higher headquarters and receives the brigade commander’s call
      about the mission risk.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: Multiple other elements on the battlefield have raised similar concerns with the division commander.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: 'The reports were not uniformly speculative: fog, rain, and possible flooding gave some units a valid safety concern,
      and continuing under those conditions risked needless loss of life.'
  - id: C2
    facts:
    - F2
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The brigade was preparing for the rotation’s biggest operation, and stopping risked mission failure for the team.
  - id: C3
    facts:
    - F8
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: Similar concerns from multiple battlefield elements supported taking the reported conditions seriously rather than
      treating them as an isolated worry.
  reasoning:
    read: The division commander faced a real tension between preserving progress toward the mission and avoiding needless
      danger to personnel. The trap is to dismiss all concerns as trepidation, or to treat the mission risk from stopping
      as if it were absent; some concerns were valid while stopping could jeopardize the mission.
    weighing: Mission failure was a serious risk, but the brigade commander reported safety concerns grounded in the weather
      and possible flooding, and other battlefield elements reported similar concerns. The division commander gave priority
      to holding until weather permitted execution. That balance depends on the safety concern being credible in the affected
      areas and on conditions changing enough to permit movement.
    tradecraft: Direct the brigade to remain at its current position and prepare to execute when weather permits. Communicate
      the decision and its condition clearly, and preserve the rationale and relevant updates so the decision can be reassessed
      as conditions change.
    uncertainty: 'Concern levels differed by area: some leaders may have worried without reason, while others had valid concerns.
      No threshold for when weather permits execution is specified.'
    handoff: The brigade commander brought the risk to the division commander, who considered that multiple other elements
      had similar concerns and issued the direction. The division commander made the decision.
    tempting_wrong:
      option: O1
      pull: Continuing would preserve forward progress and avoid the stated risk of mission failure.
      why_wrong: It would discount the credible weather and flooding concerns and expose personnel to danger characterized
        as potentially needless.
    rejected:
      O1: The division commander did not direct continued movement because credible safety concerns, reinforced by similar
        reports from other elements, outweighed the risk of stopping until weather permitted execution.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The weather permits safe execution.
      then: O1
      why: The direction was to hold only until weather permitted execution.
    would_not_change:
    - id: noflip1
      if: No one has been hurt so far.
      why: The absence of prior injury does not, by itself, resolve the reported danger from fog, rain, and possible flooding.
    watch_for:
    - id: watch1
      what: Changes in weather and flooding conditions that determine whether execution is permitted.
      favors:
      - O2
      why: The hold remains appropriate until weather permits execution.
  lesson: When mission progress conflicts with credible reports of danger to personnel, assess the conditions rather than
    dismissing the reports or ignoring the mission risk. A hold can preserve the ability to execute later when the stated
    safety condition changes.
  limits: This reasoning concerns a training exercise and a decision tied to specific weather and terrain concerns. It does
    not establish a general rule that weather concerns always justify halting or define when conditions permit movement.
  library:
    domain: operational-command
    family: CORPUS-NS-9d786077
    source: https://api.army.mil/e2/c/downloads/2021/05/21/10e49a30/21-04.pdf
