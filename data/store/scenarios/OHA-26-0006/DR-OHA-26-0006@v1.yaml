case:
  id: DR-OHA-26-0006@v1
  title: Restoration of Access Authorization under Guideline G
  status: draft
  setting: DOE Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised a security concern under Guideline G because the Individual was diagnosed with
    severe Alcohol Use Disorder and had a positive PEth test indicating recent heavy drinking. The Individual reported abstinence
    beginning June 10, 2025, and submitted multiple negative PEth tests from August 2025 through May 2026. He completed an
    intensive outpatient program, continued aftercare, and maintained frequent AA participation with a sponsor. The IOP counselor
    testified that his prognosis is excellent and that he demonstrates a clear pattern of abstinence. The DOE psychiatrist
    later acknowledged the possibility that the Individual had been abstinent since June 10, 2025. The Administrative Judge
    must decide whether the security concerns are resolved and whether to restore the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline G?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization conditionally.
      move: partial
      irreversible: false
    O2:
      do: The Administrative Judge holds the decision for further review.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual holds a DOE access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The LSO issued a Notification Letter stating substantial doubt about eligibility under Guideline G, based on a severe
      AUD diagnosis and a PEth result of 264 ng/mL.
  - id: F3
    kind: capability
    status: confirmed
    fact: The DOE psychiatrist diagnosed the Individual with Alcohol Use Disorder, Severe, and found no evidence of rehabilitation.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual reported abstinence starting June 10 2025 and provided negative PEth tests from August 2025 through
      May 2026.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual completed an intensive outpatient program, continued aftercare, and met AA sponsor requirements,
      attending multiple meetings weekly.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The IOP counselor testified that the Individual’s prognosis is excellent and that he demonstrates a clear pattern
      of abstinence.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The DOE psychiatrist later testified that he believes the Individual has been transparent and may have been abstinent
      since June 10 2025.
  - id: F8
    kind: authority
    status: confirmed
    fact: 10 C.F.R. § 710.7(a) presumes against granting a clearance and requires evidence that granting will not endanger
      security.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: Guideline G raises a security concern because of the severe AUD diagnosis, but the Individual has provided credible
      evidence of sustained abstinence and extensive treatment, satisfying mitigating condition (b) of the Adjudicative Guidelines.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: Multiple negative PEth tests (August 2025‑May 2026) and weekly EtG tests (June‑August 2025) objectively corroborate
      the Individual’s claim of abstinence since June 10 2025.
  - id: C3
    facts:
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The IOP counselor, who had frequent direct contact, testified that the Individual’s prognosis is excellent and that
      he demonstrates a clear, treatment‑aligned pattern of abstinence.
  - id: C4
    facts:
    - F7
    equity: oversight_candor
    favors:
    - O4
    weight: strong
    why: The DOE psychiatrist, after hearing the evidence, revised his view and stated he now believes the Individual has
      been transparent and likely abstinent since June 10 2025.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: 10 C.F.R. § 710.7(a) presumes against granting a clearance, but the regulation also requires the adjudicator to weigh
      all evidence; the cumulative evidence meets the statutory burden that restoration “will not endanger the common defense
      and security.”
  reasoning:
    read: The LSO raised a Guideline G concern based on a severe AUD diagnosis and a positive PEth result. The Individual
      has since documented a sustained period of abstinence, completed an intensive outpatient program, and maintained intensive
      AA involvement, while both the treating IOP counselor and the DOE psychiatrist now attest to his transparency and stability.
    weighing: The Administrative Judge applied the Adjudicative Guidelines, finding that mitigating condition (b) – acknowledgment,
      corrective action, and a clear pattern of abstinence – is satisfied ({C1}). Objective laboratory data ({C2}) and the
      treating clinician’s excellent prognosis ({C3}) further outweigh the residual concern. The psychiatrist’s later concession
      ({C4}) removes the earlier speculation of secret drinking. Although the statutory presumption against granting a clearance
      remains ({C5}), the totality of evidence meets the burden that restoration does not endanger national security.
    tradecraft: The decision is recorded in the formal OHA Decision, citing the specific exhibits and testimony, and the clearance
      is reinstated effective immediately. The Individual is advised to continue monthly PEth testing and AA participation
      for the remainder of the 12‑month period.
    uncertainty: The primary uncertainty lies in the possibility of future relapse; however, the current evidentiary record
      is sufficient to satisfy the regulatory standard.
    handoff: The Administrative Judge decides alone, as permitted by 10 C.F.R. § 710.27(d), after reviewing all submitted
      evidence and testimony.
    tempting_wrong:
      option: O3
      pull: The lingering positive PEth result and the severe AUD diagnosis could tempt a denial, but the source explicitly
        rejects that view.
      why_wrong: Denial would ignore the substantial mitigating evidence and the psychiatrist’s revised opinion, contrary
        to the Guidelines.
    rejected:
      O1: A conditional restoration was unnecessary because the evidence fully satisfied the mitigation criteria; the source
        chose an outright restoration.
      O2: Holding for further review would contradict the source’s finding that the security concerns are resolved.
      O3: Denial disregards the strong mitigating factors and the statutory burden that the Individual has demonstrated reliability.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual tests positive for alcohol on a future PEth or EtG test after this decision.
      then: O3
      why: A new positive test would re‑establish a substantial doubt under Guideline G, revoking the mitigating evidence.
    - id: flip2
      if: The Individual fails to complete the recommended 12‑month period of documented abstinence.
      then: O3
      why: Mitigating condition (d) would remain unmet, and the presumption against granting would dominate.
    would_not_change:
    - id: noflip1
      if: The Individual retains his severe AUD diagnosis.
      why: I find that the Individual has resolved the security concerns asserted by the LSO under Guideline G.
    watch_for:
    - id: watch1
      what: Any future relapse or positive alcohol biomarker.
      favors:
      - O3
      why: A relapse would re‑activate the security concern under Guideline G.
  lesson: Under Guideline G, a severe alcohol‑use disorder can be overcome by sustained, documented abstinence, credible treatment
    participation, and corroborating laboratory evidence, allowing clearance restoration when the adjudicative burden is met.
    The adjudicator must weigh all mitigating evidence against the statutory presumption against granting.
  limits: This analysis applies only when the individual provides objective, continuous negative alcohol biomarkers and credible
    treatment documentation. It does not extend to cases lacking such evidence or where relapse occurs before the 12‑month
    benchmark.
