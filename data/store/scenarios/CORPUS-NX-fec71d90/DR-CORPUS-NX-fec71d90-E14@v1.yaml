case:
  id: DR-CORPUS-NX-fec71d90-E14@v1
  title: Delegating Cyber Operations Authority
  status: draft
  setting: United States, 2018, the President and Department of Defense
  decider: The President
  agent: The President
  agent_role: decide
  situation: In 2018, the President faced a choice about approval authority for time-sensitive military operations in cyberspace.
    Cyber Command had been elevated to a Unified Combatant Command in May. Persistent engagement treated cyber forces as needing
    ongoing contact with competitors. Defending forward was a key pillar of that concept, which depended on intelligence from
    the US intelligence community and foreign partners. The choice was whether to retain presidential approval or delegate
    authority to the Secretary of Defense.
  question: What should the President do about presidential approval for time-sensitive military operations in cyberspace?
  options:
    O1:
      do: The President authorizes the Secretary of Defense to exercise delegated authority for time-sensitive military operations
        in cyberspace.
      move: act
      irreversible: false
    O2:
      do: The President prohibits delegation of authority and retains approval for time-sensitive military operations in cyberspace.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Cyber Command was elevated to a Unified Combatant Command in May 2018.
  - id: F2
    kind: authority
    status: confirmed
    fact: The authority decision concerned whether presidential approval would remain in place or authority would be delegated
      to the Secretary of Defense.
  - id: F3
    kind: situation
    status: confirmed
    fact: The operations at issue were time-sensitive military operations in cyberspace.
  - id: F4
    kind: situation
    status: confirmed
    fact: Persistent engagement was a concept associated with the authority decision.
  - id: F5
    kind: situation
    status: confirmed
    fact: Persistent engagement recognized that cyber forces needed to remain in contact with competitors day to day.
  - id: F6
    kind: situation
    status: confirmed
    fact: Defending forward was a key pillar of the persistent-engagement concept.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: Defending forward required intelligence from the US intelligence community and foreign partners to inform operations.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The authority at issue covered time-sensitive cyber operations. Delegating authority to the Secretary of Defense
      was the chosen way to enable those operations without requiring presidential approval for each one.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Persistent engagement treated day-to-day contact with competitors as necessary; the President's delegation empowered
      Cyber Command to conduct operations in support of that approach.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Defending forward was a key pillar of persistent engagement and required intelligence from U.S. sources and foreign
      partners to inform operations. That intelligence requirement reinforces the need to support the operational concept,
      though it does not independently determine who should approve operations.
  - id: C4
    facts:
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The President delegated key authorities through NSPM 13, and Congress later codified the operations as traditional
      military activities not requiring special presidential approval. This supports delegation as an authorized course, rather
      than treating presidential approval as necessary for every operation.
  reasoning:
    read: This was an authority decision about time-sensitive military operations, not a decision about operational methods.
      The trap is to treat the President's approval as necessary for every operation even though the stated concept required
      cyber forces to remain in contact with competitors day to day.
    weighing: 'The stated rationale favors delegation: delegated authority supports persistent engagement, which requires
      ongoing contact with competitors. Defending forward was a key pillar and depended on intelligence from U.S. sources
      and foreign partners. The balance depends on the continuing relevance of time-sensitive operations and persistent engagement;
      the later congressional codification also supports the legality of proceeding without special presidential approval.'
    tradecraft: Keep the delegation within the authority granted and make the decision and its scope clear in the record.
      This is decision-level implementation guidance, not a claim that a particular process was prescribed.
    uncertainty: Safeguards, reporting arrangements, and bounds for individual cases remain unspecified.
    handoff: The President decides whether to delegate, and the Secretary of Defense receives the authority. Intelligence
      from the U.S. intelligence community and foreign partners informs the operations.
    tempting_wrong:
      option: O2
      pull: Retaining presidential approval may seem to preserve direct control over consequential military action.
      why_wrong: The rationale emphasizes time sensitivity and the need for day-to-day contact, and the President chose delegation
        to enable persistent engagement.
    rejected:
      O2: The President did not retain approval for these time-sensitive operations; the stated rationale was to enable persistent
        engagement through delegated authority.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Time-sensitive requirements and the need for day-to-day contact with competitors no longer applied.
      then: O2
      why: Without the operational rationale for delegation, retaining presidential approval could become the preferable authority
        arrangement.
    would_not_change:
    - id: noflip1
      if: Cyber Command had been elevated to a Unified Combatant Command, but the time-sensitive and persistent-engagement
        rationale were absent.
      why: The elevation is part of the context, but the stated reason for delegating approval authority is the need to enable
        time-sensitive operations and persistent engagement.
    watch_for:
    - id: watch1
      what: Whether the intelligence needed to inform defending-forward operations, including intelligence from foreign partners,
        remains available.
      favors:
      - O2
      why: This intelligence is identified as a requirement for the concept; a change in its availability could weaken the
        operational rationale for delegation, though it would not necessarily require retaining presidential approval.
  lesson: Match approval authority to the decision's time demands when the mission concept requires sustained, day-to-day
    action. Delegation should be grounded in the authority granted and understood in light of the operational rationale that
    supports it.
  limits: This reasoning concerns the 2018 decision about time-sensitive cyber operations and the persistent-engagement concept
    described here. It does not determine approval authority for other operations or supply safeguards and procedures that
    are not specified.
