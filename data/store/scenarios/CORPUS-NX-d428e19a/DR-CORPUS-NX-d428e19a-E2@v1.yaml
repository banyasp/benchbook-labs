case:
  id: DR-CORPUS-NX-d428e19a-E2@v1
  title: Criminalizing Government-Sponsored Political Assassination
  status: draft
  setting: United States, during the Church Committee's investigations
  decider: The Church Committee
  agent: The Church Committee
  agent_role: decide
  situation: The Church Committee was examining alleged plots involving foreign leaders, including the question of whether
    government authorization existed and at what level. It also examined communications and control associated with planning
    or execution. The committee found some evidence of planning in the Castro and Lumumba episodes, while no evidence of actual
    U.S. participation had surfaced at that time. A proposed federal crime could cover planning or carrying out government-sponsored,
    politically motivated assassination of foreign officials, including certain insurgent and political-party leaders. Critics
    described such a law as immoral, impractical, risky because of possible reprisals against U.S. leaders, and un-American.
  question: What should the Church Committee recommend to Congress about making planning or carrying out government-sponsored,
    politically motivated assassination of foreign officials a federal crime?
  options:
    O1:
      do: The Church Committee should recommend that Congress permit planning or carrying out government-sponsored, politically
        motivated assassination of foreign officials without making it a federal crime.
      move: act
      irreversible: false
    O2:
      do: The Church Committee should recommend that Congress prohibit planning or carrying out government-sponsored, politically
        motivated assassination of foreign officials as a federal crime.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The committee examined alleged plots, evidence of government authorization and its possible level, and communications
      and control associated with planning or execution.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The committee found some evidence of planning in the Castro and Lumumba episodes.
  - id: F3
    kind: intelligence
    status: assessed
    fact: At the time of the committee's investigation, no evidence had surfaced of actual U.S. participation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The committee found no evidence of a direct U.S. role in the actual execution of Lumumba or other leaders killed
      in various circumstances.
  - id: F5
    kind: authority
    status: confirmed
    fact: The proposed federal crime would cover planning or carrying out government-sponsored, politically motivated assassination
      of foreign officials.
  - id: F6
    kind: authority
    status: confirmed
    fact: The proposed definition of foreign officials included insurgent leaders and political-party leaders not associated
      with states.
  - id: F7
    kind: situation
    status: assessed
    fact: The proposed criminalization was criticized as immoral, impractical, and un-American.
  - id: F8
    kind: situation
    status: assessed
    fact: Critics warned that the proposed law could place U.S. leaders at risk of reprisal actions.
  - id: F9
    kind: situation
    status: assessed
    fact: Government-sponsored actions might be construed as advancing national policy against adversary or rogue regimes.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    equity: complicity_risk
    favors:
    - O2
    weight: strong
    why: After examining alleged plots, authorization, and communications and control, the committee found some evidence of
      planning and recommended making planning or carrying out government-sponsored, politically motivated assassination a
      federal crime.
  - id: C2
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The committee had not found evidence of actual U.S. participation at the time, including a direct U.S. role in the
      actual execution of Lumumba or the other leaders identified; this limits what the investigation established about completed
      acts.
  - id: C3
    facts:
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The proposed crime covered planning as well as carrying out assassination, and its definition of foreign officials
      extended to insurgent and political-party leaders not associated with states.
  - id: C4
    facts:
    - F7
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The proposal faced objections that it was immoral, impractical, and un-American, and that it could expose U.S. leaders
      to reprisals.
  - id: C5
    facts:
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: A further objection was that government-sponsored actions might be construed as advancing national policy against
      adversary or rogue regimes.
  reasoning:
    read: The decision was whether to recommend a federal crime, not whether a statute had already been enacted. The committee
      examined planning, authorization, and communications and control; the evidentiary finding of some planning did not amount
      to a finding of actual U.S. participation. The trap is to treat that absence as resolving whether planning itself should
      be criminalized.
    weighing: 'The committee''s stated recommendation was to make both planning and carrying out the specified government-sponsored
      assassinations a federal crime. The record also gives the objections: the proposed law was called immoral, impractical,
      and un-American, was said to risk reprisals, and could reach actions cast as national policy against adversary or rogue
      regimes. The committee''s endorsed outcome was prohibition despite those objections; the evidence of planning and the
      breadth of the proposal are relevant, while the lack of evidence of actual participation limits the investigation''s
      factual findings. The source does not provide a detailed rebuttal to each objection.'
    tradecraft: Keep the recommendation distinct from enactment, and record separately the committee's findings about planning
      and its lack of evidence of actual participation. Preserve the stated objections as objections rather than presenting
      them as the committee's reasons for its recommendation.
    uncertainty: The available account does not explain in detail how the committee weighed the objections or the proposed
      definition's breadth. Its findings are bounded by what had surfaced during that investigation; later-released CIA documents
      pointed to more direct leadership approval and Agency participation in the Castro case.
    handoff: The committee's role was to recommend legislation to Congress; Congress would decide whether and how to enact
      it. Any legislative consideration should keep the proposed scope and the stated objections visible.
    tempting_wrong:
      option: O1
      pull: No actual U.S. participation had surfaced, and critics warned of impracticality, reprisals, and conflict with
        national policy.
      why_wrong: Those points limit or challenge the proposal, but they do not change the committee's recorded recommendation
        to make planning or carrying out the specified conduct a federal crime.
    rejected:
      O1: The committee did not endorse permitting the conduct without a federal criminal prohibition; it urged Congress to
        make planning or carrying it out a federal crime.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The committee concluded that the objections to criminalization outweighed the case for prohibiting the conduct.
      then: O1
      why: That changed balance would remove the basis for the committee's recommendation and favor declining to recommend
        the proposed prohibition.
    would_not_change:
    - id: noflip1
      if: The investigation still found no evidence of actual U.S. participation.
      why: That was already the committee's finding at the time, yet it still recommended criminalizing planning as well as
        carrying out the conduct.
    watch_for:
    - id: watch1
      what: Later-released CIA documents pointing to more direct CIA leadership approval and Agency participation in the Castro
        case.
      favors:
      - O2
      why: Such evidence could strengthen the factual case for a prohibition, while remaining distinct from what the committee
        had found at the time.
  lesson: When considering a prospective prohibition, distinguish evidence of planning from evidence of completed participation.
    A lack of proof of actual participation may constrain factual conclusions without dictating whether planning should be
    criminalized; record material objections without mistaking them for the decider's endorsed outcome.
  limits: This reasoning concerns the Church Committee's legislative recommendation based on the investigation and objections
    described here. It does not establish that Congress enacted the proposed statute, resolve the legality of any particular
    operation, or incorporate later evidence into the committee's contemporaneous findings.
