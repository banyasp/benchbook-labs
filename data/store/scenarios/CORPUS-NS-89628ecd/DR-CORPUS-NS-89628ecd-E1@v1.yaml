case:
  id: DR-CORPUS-NS-89628ecd-E1@v1
  title: Defensive Support Under Civilian-Harm Uncertainty
  status: draft
  setting: Baghuz, Syria, 18 March 2019; U.S.-led Coalition support to the SDF.
  decider: The Ground Force Commander responsible for support
  agent: The Ground Force Commander responsible for support
  agent_role: decide
  situation: In Baghuz, Syria, on 18 March 2019, ISIS launched a successful counterattack against the SDF. The SDF requested
    defensive Coalition air support. The Ground Force Commander responsible for support was operating under Presidentially
    authorized defensive ROE, with the Law of War also applicable. The commander validated hostile act and intent and repeatedly
    received confirmation that no civilians were in the strike areas. The commander must decide whether to authorize the requested
    support or withhold it.
  question: What should the Ground Force Commander do about the requested defensive Coalition air support under the applicable
    ROE?
  options:
    O1:
      do: The Ground Force Commander authorizes defensive Coalition air strikes against the ISIS fighters.
      move: act
      irreversible: true
    O2:
      do: The Ground Force Commander declines defensive Coalition air strikes against the ISIS fighters.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 18 March 2019 in Baghuz, Syria, ISIS launched a successful counterattack against the SDF.
  - id: F2
    kind: situation
    status: confirmed
    fact: The SDF requested defensive Coalition air support.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Ground Force Commander was responsible for support to the SDF.
  - id: F4
    kind: authority
    status: confirmed
    fact: Presidentially authorized defensive ROE governed the decision.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Law of War was an applicable legal framework for the decision.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Ground Force Commander validated ISIS hostile act and intent.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The Ground Force Commander repeatedly received confirmation that no civilians were in the strike areas.
  - id: F8
    kind: situation
    status: confirmed
    fact: Multiple efforts were made to distinguish civilians from ISIS.
  - id: F9
    kind: situation
    status: assessed
    fact: The commander assessed engagement as necessary to defend SDF partner forces and proportional.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The review concluded that authorizing the strikes was within the Presidentially authorized defensive ROE and did
      not violate the Law of War.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    - F6
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The commander validated ISIS hostile act and intent, and the review found engaging ISIS necessary to defend the SDF
      partner forces and proportional.
  - id: C3
    facts:
    - F7
    - F8
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Repeated assurances that civilians were not in the strike areas and multiple efforts to distinguish civilians from
      ISIS supported the commander's assessment; the review found awareness of civilian-harm risk and steps to mitigate it.
  - id: C4
    facts:
    - F6
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The review judged the decision on the information available to the commander at the time, not on later information
      that showed the data was inaccurate; it found the commander acted reasonably on what he knew.
  reasoning:
    read: This is a defensive-support decision under the applicable ROE and Law of War, made after the commander validated
      hostile act and intent and received repeated civilian-absence confirmations. The trap is to let what became known after
      the strikes replace the information available when the decision was made.
    weighing: The review found that defending the SDF made engagement necessary, that the engagements were proportional, and
      that multiple efforts were made to distinguish civilians from ISIS. Those grounds, together with the commander's repeated
      assurances about civilians and the review's time-of-decision standard, support {O1}. The balance depends on the reasonableness
      of the commander's judgment given the information then available, not on hindsight.
    tradecraft: Keep the decision focused on the defensive ROE, the validated hostile act and intent, the civilian-risk information
      available at the time, and the necessity and proportionality assessment. Preserve a clear contemporaneous record of
      the basis for the decision and any information that materially changes that assessment.
    uncertainty: The review found that information available to the commander was not fully accurate, but that this was through
      no fault of his own. The source does not identify a contemporaneous indication that contradicted the repeated civilian-absence
      confirmations.
    handoff: The Ground Force Commander was responsible for the support decision, and the source identifies no additional
      approval authority or required handoff. The commander should decide within the applicable ROE and Law of War framework.
    tempting_wrong:
      option: O2
      pull: Withholding support may seem preferable because civilian harm was ultimately caused.
      why_wrong: The review expressly rejects judging the decision by hindsight and instead assesses whether it was reasonable
        on the information available at the time; it found the engagement necessary, proportional, and within the ROE and
        Law of War.
    rejected:
      O2: The review endorsed authorizing support because the commander reasonably assessed the engagement as necessary and
        proportional on the information available at the time.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible information available to the commander at the time indicated civilians were in the strike areas.
      then: O2
      why: That would materially undermine the civilian-risk basis for authorizing support and require a different assessment
        of distinction, precautions, and reasonableness.
    - id: flip2
      if: The commander could not validate hostile act and intent, or the engagement was not necessary to defend the SDF or
        was not proportional.
      then: O2
      why: The review relied on validation, defensive necessity, and proportionality in concluding the authorization was within
        the applicable ROE and Law of War.
    would_not_change:
    - id: noflip1
      if: Later information shows the data relied on by the commander was inaccurate, but was not available to him at the
        time and the reliance was through no fault of his own.
      why: The review says the decision must be judged by the reasonableness of the commander's actions given information
        known at the time, not by hindsight.
    watch_for:
    - id: watch1
      what: Evidence that the commander had contemporaneous information inconsistent with the repeated civilian-absence confirmations
        or otherwise failed to account for civilian risk.
      favors:
      - O2
      why: Such evidence could alter whether the decision was reasonable on the information actually available and whether
        adequate steps were taken to mitigate civilian harm.
  lesson: Assess a defensive-force decision under the governing authority using the information reasonably available to the
    decision-maker at the time. Validate the threat, consider civilian risk and mitigation, and assess necessity and proportionality;
    do not substitute hindsight for that contemporaneous judgment.
  limits: This conclusion is specific to the review's findings that the commander validated hostile act and intent, repeatedly
    received civilian-absence confirmations, made efforts to distinguish civilians, and acted reasonably on the information
    available. It does not establish that authorization is appropriate when those findings are absent or materially different.
