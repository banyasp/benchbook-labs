case:
  id: DR-CORPUS-NX-0e357613-E12@v1
  title: Assault Timing at Cold Harbor
  status: draft
  setting: Cold Harbor, morning of 2 June; Union command during the campaign.
  decider: The Union commander
  agent: The Union commander
  agent_role: decide
  situation: At Cold Harbor on the morning of 2 June, Union forces were not ready to launch an assault. Some troops were poorly
    positioned after earlier attacks, and a corps had arrived late after taking a wrong road, with much of its force and equipment
    still strung out along the route. The Union commander had given the army commander tactical control of the assault, but
    instructions were vague and coordination among corps commanders was limited. Additional preparation might improve coordination,
    while a pause could also give the opposing force time to reinforce its threatened flank and strengthen its defenses.
  question: What should the Union commander do about the timing of the assault at Cold Harbor?
  options:
    O1:
      do: The Union commander postpones the assault until the afternoon of 2 June.
      move: act
      irreversible: true
    O2:
      do: The Union commander authorizes the Union assault to begin on the morning of 2 June.
      move: act
      irreversible: true
    O3:
      do: The Union commander prohibits a 2 June assault and schedules it for 3 June.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: A corps commander reported that his troops were poorly positioned after earlier attacks and needed time to reposition
      and receive ammunition from trains well to the rear.
  - id: F2
    kind: situation
    status: confirmed
    fact: A corps started late, took a wrong road on its guides' advice, and marched several extra miles before doubling back.
  - id: F3
    kind: situation
    status: confirmed
    fact: On the morning of 2 June, the lead element of that corps had reached Cold Harbor, while the rest of the corps, its
      trains, and its artillery remained strung out along the route.
  - id: F4
    kind: situation
    status: assessed
    fact: The Union forces were not ready to launch an assault on the morning of 2 June.
  - id: F5
    kind: situation
    status: assessed
    fact: The army commander's instructions gave little direction beyond a start time, and coordination among the corps commanders
      was limited.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Additional preparation might help Union troops and leaders mount a well-coordinated attack.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A pause could give the opposing force an opportunity to transfer reinforcements to its threatened flank and improve
      its entrenchments.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Union commander gave the army commander tactical control of the assault, including control over an attached
      corps.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: 'The forces were not ready: some needed repositioning and ammunition, while much of a late-arriving corps and its
      equipment remained on the route. This lack of readiness was the immediate reason an assault on the morning of 2 June
      could not proceed.'
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: More time might have helped the Union troops and leaders prepare a coordinated attack, but this was a possible benefit
      rather than a certainty.
  - id: C3
    facts:
    - F7
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Waiting gave the opposing force time to move reinforcements to its threatened flank and improve its defenses. This
      was a substantial cost of delay.
  - id: C4
    facts:
    - F5
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Tactical control had been delegated to the army commander, but the instructions offered little beyond a start time
      and coordination among corps commanders was limited. More time might have helped address this shortfall, without ensuring
      coordination.
  reasoning:
    read: 'This was a choice between acting while the Union forces were plainly unready and accepting the risk that a pause
      would improve the opposing force''s position. The trap is to treat more preparation as an unqualified benefit: the same
      delay that could help Union coordination also gave the Confederates time to reinforce and strengthen their defenses.'
    weighing: The clearest reason against a morning 2 June assault is that the Union forces were not ready {C1}. There were
      possible gains from additional preparation and coordination {C2}, but they had to be weighed against the enemy's concrete
      opportunity to reinforce and improve its defenses {C3}. The Union commander nevertheless postponed the assault until
      the morning of 3 June. The balance depends on whether the additional time could meaningfully improve Union readiness
      and coordination; the extent of any improvement is not established.
    tradecraft: Before confirming a delayed start, make readiness and coordination expectations explicit to the army commander
      and obtain a clear account of whether the delay is likely to resolve the stated deficiencies. Record the readiness basis,
      the expected coordination benefit, and the opposing-force risk, without treating hoped-for improvement as assured.
    uncertainty: The Union commander may have expected the extra time to improve preparation and coordination, but that motive
      is uncertain. The delay gave the Confederates an opportunity to reinforce and strengthen their positions; the extent
      to which additional Union preparation improved readiness is not established.
    handoff: The Union commander had given the army commander tactical control, including control over an attached corps,
      so timing and readiness should be discussed with that commander. Limited coordination among corps commanders makes it
      important to determine whether the army command could address that problem before deciding on timing.
    tempting_wrong:
      option: O2
      pull: Attacking on the morning of 2 June would avoid giving the opposing force more time to reinforce and strengthen
        its defenses.
      why_wrong: 'The Union forces were not ready that morning: troops needed repositioning and ammunition, and a corps and
        its equipment were still strung out along the route. The enemy''s opportunity to improve its position does not remove
        those readiness problems.'
    rejected:
      O1: The Union commanders initially postponed the assault to the afternoon, but the Union commander then decided to wait
        until the morning of 3 June rather than proceed that afternoon.
      O2: The Union forces were not ready on the morning of 2 June, and the Union commander postponed the assault instead.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Union forces were ready to act on the morning of 2 June and the commanders had a workable plan for coordination.
      then: O2
      why: That would remove the principal readiness reason for delay, making the risk of giving the opposing force more time
        weigh more heavily.
    - id: flip2
      if: A delay to the morning of 3 June was not expected to improve Union readiness or coordination.
      then: O2
      why: Without a meaningful Union benefit from waiting, the opposing force's opportunity to reinforce and strengthen its
        defenses would weigh more heavily against postponement.
    would_not_change:
    - id: noflip1
      if: The only reason for waiting was a general hope that coordination might improve, with no indication that Union forces
        were otherwise ready.
      why: That hope alone would not overcome the assessment that the forces were not ready for a morning assault.
    watch_for:
    - id: watch1
      what: Whether the opposing force is using the delay to move reinforcements and strengthen its defenses.
      favors:
      - O2
      why: Both are costs of delay, making their extent relevant to any further postponement.
  lesson: 'Do not equate haste with effectiveness when forces are not ready and command coordination is weak. But delay is
    not cost-free: weigh the expected improvement in readiness against the adversary''s opportunity to strengthen its position,
    and distinguish demonstrated gains from hoped-for ones.'
  limits: This reasoning applies to the timing decision at Cold Harbor on the morning of 2 June, given the readiness and coordination
    conditions described. It does not establish a general rule that postponement is preferable or that the postponement itself
    was correct.
