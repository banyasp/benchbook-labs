case:
  id: DR-CORPUS-NX-0e357613-E36@v1
  title: Assault Readiness at Cold Harbor
  status: draft
  setting: Cold Harbor, 2 June 1864, Union command.
  decider: The senior Union commanders
  agent: The senior Union commanders
  agent_role: decide
  situation: At Cold Harbor on 2 June, the senior Union commanders must decide whether to proceed with an afternoon assault
    or defer it for a coordinated assault. The attack had initially been scheduled for 0430 and later moved to 1700. The last
    II Corps troops arrived at noon, after the planned start had passed. A corps commander had reported that his troops were
    exhausted, out of ammunition, and unable to be ready; the arriving troops were also described as tired and ill prepared.
    The commanders judged that an immediate attack would come too late to catch the Confederates off guard, while Confederate
    forces had used the pause to reinforce and entrench.
  question: What should the senior Union commanders do about the planned assault at Cold Harbor?
  options:
    O1:
      do: The senior Union commanders defer the coordinated assault until 0430 on 3 June.
      move: act
      irreversible: true
    O2:
      do: The senior Union commanders proceed with the coordinated assault at 1700 on 2 June.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The initial order directed an attack on 2 June with the entire force, made as vigorously as possible.
  - id: F2
    kind: situation
    status: confirmed
    fact: The initial order did not specify a time, boundary, or objective.
  - id: F3
    kind: capability
    status: assessed
    fact: A corps commander reported that his troops were exhausted, out of ammunition, and unable to be ready.
  - id: F4
    kind: situation
    status: confirmed
    fact: The 0430 attack was postponed to 1700 on 2 June, and the II Corps had missed the planned 0430 start.
  - id: F5
    kind: situation
    status: confirmed
    fact: The last II Corps troops arrived at noon on 2 June.
  - id: F6
    kind: capability
    status: assessed
    fact: The arriving II Corps troops were described as exhausted and ill prepared to assault.
  - id: F7
    kind: capability
    status: assessed
    fact: The senior Union commanders cited the heat and the men's lack of energy after moving during the previous night.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The senior Union commanders judged that an attack that evening would be too late to catch the Confederates off guard.
  - id: F9
    kind: intelligence
    status: confirmed
    fact: During the pause, Confederate forces moved into position and entrenched.
  - id: F10
    kind: intelligence
    status: assessed
    fact: A senior Union commander believed that recent fighting had severely mauled the Confederate army and left it ready
      to collapse.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    - F6
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The troops were exhausted, short of ammunition, late, and ill prepared; the commanders also cited the heat and lack
      of energy after night movement. Their readiness concerns weighed against an immediate assault.
  - id: C2
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The commanders judged that an attack that evening would be too late to catch the Confederates off guard, undercutting
      the case for proceeding at 1700.
  - id: C3
    facts:
    - F9
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The pause gave Confederate forces time to move into position and entrench, making further delay costly to the Union's
      opportunity to act.
  reasoning:
    read: This was a choice between attacking with troops who had arrived late and were not ready, or postponing for a coordinated
      assault. The trap was to treat the urgency of the original order—or a belief that the Confederate army was near collapse—as
      proof that an immediate attack remained advantageous, despite the lost surprise and the troops' condition.
    weighing: The readiness concerns and the commanders' judgment that an evening attack would not catch the Confederates
      off guard favored deferral {C1} {C2}. The opposing cost was that the pause let Confederate forces reinforce and entrench
      {C3}. The balance depended on the commanders' assessment that the immediate opportunity for surprise had passed and
      that the troops were not prepared to assault.
    tradecraft: Record the readiness reports, the timing change, the assessment that surprise was no longer possible, and
      the reason for deferral. Keep the decision focused on readiness and mission judgment rather than reconstructing later
      assault details.
    uncertainty: The belief that the Confederate army was badly mauled may have influenced the Union command, but its effect
      on this specific decision is unclear. Responsibility for the delays is not assigned.
    handoff: This was a senior-command decision. The senior Union commanders discussed the situation and coordinated the decision
      to postpone rather than leaving it to a single corps commander.
    tempting_wrong:
      option: O2
      pull: The original order called for a vigorous attack, and the belief that the Confederate army was close to collapse
        could make immediate action seem urgent.
      why_wrong: The commanders judged that an evening attack would be too late to catch the Confederates off guard, while
        the troops were exhausted and ill prepared.
    rejected:
      O2: The commanders did not proceed at 1700 because they judged the troops unprepared and the attack too late to achieve
        surprise.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The troops were ready to assault and an attack at 1700 could still catch the Confederates off guard.
      then: O2
      why: Those changes would remove the principal stated reasons for postponement and restore the prospect of an immediate
        attack achieving surprise.
    would_not_change:
    - id: noflip1
      if: The belief that the Confederate army was badly mauled remained, but troop readiness and the loss of surprise did
        not change.
      why: That belief alone would not resolve the stated readiness concerns or the commanders' judgment that an evening attack
        was too late to catch the Confederates off guard.
    watch_for:
    - id: watch1
      what: Further Confederate movement into position and entrenchment during the pause.
      favors:
      - O2
      why: The pause allowed Confederate forces to reinforce and entrench, increasing the cost of delay.
  lesson: Do not let an urgent order or optimism about an adversary's condition substitute for a current assessment of readiness
    and opportunity. When troops are unprepared and the chance to achieve surprise has passed, weigh the cost of delay against
    the risks of pressing an immediate assault.
  limits: This reasoning applies to the stated choice between the 1700 assault and deferral, given the reported readiness
    and surprise assessments. It does not determine responsibility for the delay or decide whether a later assault was warranted.
