case:
  id: DR-CORPUS-NX-4a5c0fcd-E2@v1
  title: Holding or Withdrawing at Gettysburg
  status: draft
  setting: Gettysburg, June 30, 1863, Union Army
  decider: The cavalry commander
  agent: The cavalry commander
  agent_role: decide
  situation: On June 30, 1863, a cavalry commander arrived at Gettysburg with fewer than 3,000 men. A substantial enemy infantry
    presence was believed to be in the area, but its exact location, size, and intent were unclear. Enemy patrols had been
    encountered near town and withdrew west; the commander assessed them as part of a larger enemy force. Reinforcements were
    not expected for a day or more. The commander faced the choice of remaining to contest control of the high ground or withdrawing,
    which could leave the enemy with that advantage.
  question: What should the cavalry commander do at Gettysburg while enemy strength and intent remain uncertain and reinforcements
    are still a day or more away?
  options:
    O1:
      do: The cavalry commander stays at Gettysburg and retains control of the high ground.
      move: act
      irreversible: false
    O2:
      do: The cavalry commander requests updated information from subordinates before choosing whether to stay or leave.
      move: ask
      irreversible: false
      to: subordinate officers
    O3:
      do: The cavalry commander leaves Gettysburg and cedes control of the high ground.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The cavalry commander arrived at Gettysburg on June 30 with fewer than 3,000 men.
  - id: F2
    kind: intelligence
    status: assessed
    fact: A considerable enemy infantry force was believed to be in the area, but its exact location, size, and intent were
      unclear.
  - id: F3
    kind: situation
    status: confirmed
    fact: Enemy patrols encountered near Gettysburg withdrew west.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The cavalry commander assessed the encountered patrols as belonging to two enemy regiments.
  - id: F5
    kind: situation
    status: confirmed
    fact: Friendly reinforcements were still a day or more away.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The commander assessed that withdrawing could give the enemy the high ground and risk a strategic blow to the Union
      Army.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The enemy’s location, size, and intent were unclear, but the commander assessed the encountered patrols as part of
      a larger force rather than an insignificant encounter.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The commander judged that withdrawal would give the enemy the high ground and could expose the Union Army to a strategic
      blow.
  - id: C3
    facts:
    - F1
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The force was small and reinforcements were still a day or more away; holding could delay the enemy and buy time
      for support to arrive.
  reasoning:
    read: 'This was a time-sensitive choice under incomplete intelligence: the enemy’s strength and intent were unclear, while
      reinforcements were distant. The trap was to treat uncertainty as a reason to withdraw or wait, without accounting for
      the strategic cost the commander associated with surrendering the high ground.'
    weighing: The commander accepted uncertainty about the enemy but assessed the patrols as evidence of a larger force {C1}.
      In the commander’s judgment, withdrawal risked giving that force a consequential advantage {C2}, whereas staying could
      delay it until reinforcements arrived {C3}. The balance depends on the assessed strategic value of the high ground and
      whether holding can buy meaningful time.
    tradecraft: Assess and record the reliability of the enemy assessment, the strategic consequences of staying or leaving,
      and the expected time until support arrives. Keep those assumptions under review as information changes.
    uncertainty: The commander did not know the enemy’s precise location, size, or intent. That uncertainty remained, but
      the commander considered the terrain’s strategic importance and the opportunity to delay sufficient grounds to stay.
    handoff: The cavalry commander made the decision, informed by subordinate assessment. No higher approval authority or
      required referral is identified; involving a higher authority is not presented as a prerequisite.
    tempting_wrong:
      option: O3
      pull: Leaving could seem prudent when a small force faces an enemy whose size and intent are uncertain.
      why_wrong: The commander judged that withdrawal would give the enemy the high ground and risk a strategic blow, while
        staying could buy time for reinforcements.
    rejected:
      O2: The commander did not make further subordinate reporting a precondition for action; despite uncertainty, the commander
        assessed the strategic consequences and stayed.
      O3: The commander rejected withdrawal because it could give the enemy the high ground and risk a strategic blow to the
        Union Army.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessment that withdrawal would give the enemy the high ground and risk a strategic blow no longer held.
      then: O3
      why: Without that assessed cost of withdrawal, the principal reason for remaining would be reduced.
    - id: flip2
      if: Reinforcements were no longer a day or more away and there were time to clarify the situation before committing
        to stay or leave.
      then: O2
      why: The urgency of holding to buy time would be diminished, making a request for updated information a more plausible
        course.
    would_not_change:
    - id: noflip1
      if: The enemy’s exact location, size, and intent remained uncertain.
      why: Uncertainty was present in the decision as made, but the commander still judged the high ground and the chance
        to delay important enough to stay.
    watch_for:
    - id: watch1
      what: Changes in the assessment of enemy strength or intent.
      favors:
      - O2
      - O1
      why: The commander’s assessment of the encountered patrols informed the judgment that a larger force was approaching.
    - id: watch2
      what: Changes in the expected time until reinforcements arrive.
      favors:
      - O2
      - O1
      why: The case for staying rested in part on buying time for support to close.
  lesson: When intelligence is incomplete, uncertainty need not decide the matter by itself. Compare the strategic cost of
    yielding an advantage with the time that holding may buy, and make the choice on those assessed consequences.
  limits: This reasoning applies where the decision-maker has a credible basis to assess the strategic value of the terrain
    and the likely benefit of delay. It does not establish that holding is appropriate when those assessments differ or when
    the expected costs of remaining outweigh the delay gained.
