case:
  id: DR-CORPUS-NX-82bec30f-E1@v1
  title: Responding to a Soldier’s Late Arrival
  status: draft
  setting: A platoon formation after a suicide awareness class, in an Army platoon.
  decider: The platoon leader and platoon sergeant.
  agent: The platoon leader and platoon sergeant
  agent_role: decide
  situation: A Soldier arrives late to formation after receiving a positive drug test and going through a divorce. The platoon
    leader and platoon sergeant had been flippant during a suicide awareness class. The leaders must decide how to respond
    to the late arrival. The Soldier may be experiencing serious stress, although suicidal thoughts are not established. A
    public reprimand could add stress, while a private conversation could offer support.
  question: What should the platoon leader and platoon sergeant do after the Soldier arrives late to formation?
  options:
    O1:
      do: The platoon leader and platoon sergeant publicly reprimand the Soldier for arriving late to formation.
      move: act
      irreversible: false
    O2:
      do: The platoon leader and platoon sergeant privately ask the Soldier what is happening during counseling.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The platoon leader and platoon sergeant serve as a link between Soldiers and the company and are involved in welcoming
      and counseling Soldiers.
  - id: F2
    kind: situation
    status: confirmed
    fact: The platoon leader and platoon sergeant were flippant during a suicide awareness class.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Soldier is going through a divorce because of a positive drug test.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Soldier arrives late to formation.
  - id: F5
    kind: intelligence
    status: assessed
    fact: If the Soldier is contemplating suicide, a public chewing-out could add a leadership-created stressor and leave
      him believing his leaders do not care or support him.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Private counseling and supportive engagement can help a Soldier build resilience.
  - id: F7
    kind: capability
    status: confirmed
    fact: The company chain of command can connect Soldiers with Army assistance programs, including chaplain, behavioral
      health, and family support resources.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The Soldier is facing drug- and family-related stress. If he is contemplating suicide, a public chewing-out could
      add a leadership-created stressor and make him believe his leaders do not care or support him.
  - id: C2
    facts:
    - F3
    - F4
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The engaged-leader example is to take the Soldier aside and ask what is happening during counseling; supportive engagement
      helps him build resilience.
  - id: C3
    facts:
    - F1
    - F7
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: Platoon leaders are a link to the company and should use the chain of command to connect Soldiers with appropriate
      assistance when they identify an issue.
  reasoning:
    read: 'This is not just a late arrival: the Soldier is dealing with a positive drug test and divorce, and the leaders''
      earlier flippancy may compound the risk that he sees them as unsupportive. The trap is to respond to the visible lateness
      with public discipline while overlooking the underlying stress.'
    weighing: 'The guidance favors taking the Soldier aside and asking what is happening: public humiliation could add stress
      if he is contemplating suicide, whereas engaged support can help build resilience. That balance does not depend on establishing
      suicidal thoughts first; the source presents the risk conditionally and still endorses private, supportive inquiry in
      the example. If an issue is identified, leaders can use the company chain to connect him with help.'
    tradecraft: Address the Soldier privately during counseling, ask what is happening, and listen supportively rather than
      humiliating or belittling him. If he needs assistance, use the company chain to connect him with appropriate resources;
      keep any counseling record factual and limited to appropriate information.
    uncertainty: 'Suicidal thoughts are not established. The source''s concern is conditional: if the Soldier is contemplating
      suicide, a public reprimand could create an additional stressor. Private inquiry is the recommended response without
      assuming a diagnosis.'
    handoff: The platoon leader and platoon sergeant should begin the private counseling themselves, then use the company
      chain of command to connect the Soldier with suitable Army assistance if needed. The source specifically advises platoon-level
      leaders to use that chain when they may not know all available programs.
    tempting_wrong:
      option: O1
      pull: A public reprimand may seem like a direct response to lateness and an assertion of formation expectations.
      why_wrong: In this circumstance it risks adding stress and reinforcing the Soldier's belief that his leaders do not
        care, rather than finding out what is happening.
    rejected:
      O1: They do not publicly reprimand him because the source warns that this could add stress and contrasts it with a supportive
        private conversation.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The stressors described were absent and there were a separate, legitimate need for immediate public correction of
        the lateness.
      then: O1
      why: That would remove the source's stated stress-based reason against a public response and add a different accountability
        consideration; this is an authored hypothetical, not an outcome endorsed by the passage.
    would_not_change:
    - id: noflip1
      if: The Soldier is in fact contemplating suicide because of the drug and family issues.
      why: The source expressly uses that possibility to explain why a public chewing-out could add stress, and contrasts
        it with private supportive engagement.
    watch_for:
    - id: watch1
      what: Whether the private conversation identifies issues for which the Soldier needs assistance.
      favors:
      - O2
      why: Engaged leaders help Soldiers get the help they need, and platoon-level leaders should use the company chain when
        necessary.
  lesson: When a Soldier's conduct occurs amid significant personal stress, do not let the visible infraction eclipse the
    person behind it. Private, supportive inquiry can preserve trust and resilience while allowing leaders to connect the
    Soldier with help.
  limits: This reasoning addresses the choice between a public reprimand and private counseling in the described circumstances;
    it does not establish that the Soldier has suicidal thoughts or decide what separate accountability measures may be appropriate.
    The passage does not endorse a public reprimand as the response even if those stressors are absent.
