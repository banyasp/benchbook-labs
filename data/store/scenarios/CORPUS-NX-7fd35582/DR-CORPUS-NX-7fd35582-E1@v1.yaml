case:
  id: DR-CORPUS-NX-7fd35582-E1@v1
  title: Wording an Estimate of Invasion Risk
  status: draft
  setting: United States intelligence community, March 1951, during preparation and review of NIE 29-51.
  decider: The Intelligence Advisory Committee, with the Director of Central Intelligence in the chair, gave the estimate
    its final review and approval.
  agent: The Intelligence Advisory Committee, with the Director of Central Intelligence in the chair
  agent_role: decide
  situation: NIE 29-51 assessed the probability of an invasion of Yugoslavia in 1951. Its key judgment said an attack should
    be considered a “serious possibility,” citing the extent of Satellite military and propaganda preparations. The estimate
    also said it was impossible to determine which course the Kremlin was likely to adopt. The drafting process involved expert
    contributions and review by the Board of National Estimates before the Intelligence Advisory Committee’s final review
    and approval. The estimate’s language had to convey the analysts’ judgment about likelihood, while the phrase “serious
    possibility” did not itself specify odds.
  question: What should the Intelligence Advisory Committee do with NIE 29-51’s final wording?
  options:
    O1:
      do: The Intelligence Advisory Committee should approve NIE 29-51 with the phrase “serious possibility” unchanged.
      move: act
      irreversible: true
    O2:
      do: The Intelligence Advisory Committee should reject NIE 29-51’s final wording and return it for revision.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: NIE 29-51 concerned the probability of an invasion of Yugoslavia in 1951.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The estimate’s key judgment said an attack on Yugoslavia in 1951 should be considered a serious possibility, based
      on the extent of Satellite military and propaganda preparations.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The estimate judged that it was impossible to determine which course the Kremlin was likely to adopt.
  - id: F4
    kind: authority
    status: confirmed
    fact: The stated analytic duty was to assess how likely an attack might be and draft language that conveyed the exact
      judgment.
  - id: F5
    kind: situation
    status: confirmed
    fact: The draft was prepared using written contributions from IAC agencies and reviewed by experts from the intelligence
      community.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Board of National Estimates presided over an all-but-final text, and the Intelligence Advisory Committee, with
      the Director of Central Intelligence in the chair, gave it final review, revision, and approval.
  - id: F7
    kind: situation
    status: confirmed
    fact: The State Department’s Policy Planning Staff was among the important government groups concerned with Soviet and
      Satellite intentions toward Yugoslavia.
  - id: F8
    kind: intelligence
    status: assessed
    fact: When asked what odds the phrase meant, the estimator who answered gave a personal estimate of 65 to 35 in favor
      of an attack; Board members later reported having held differing odds, ranging from about 20 to 80 to 80 to 20.
  considerations:
  - id: C1
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The estimate grounded its serious-possibility judgment in the extent of Satellite military and propaganda preparations.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The stated analytic duty was to assess how likely an attack might be and use language that conveyed the exact judgment;
      the phrase itself did not specify odds.
  - id: C3
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Not knowing which course the Kremlin would adopt did not remove the duty to assess the likelihood of an attack; uncertainty
      and a likelihood judgment could coexist.
  - id: C4
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The draft received expert review, then the Board of National Estimates presided over an almost-final text, and the
      IAC had authority to give final review and approval.
  - id: C5
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: A key policy audience read the phrase as implying much lower odds than one estimator's personal estimate, and Board
      members themselves held odds ranging widely. That divergence shows the wording did not communicate a shared exact judgment.
  reasoning:
    read: The estimate faced uncertainty both about the Kremlin's eventual choice and about how much could be known of its
      intentions. The trap is treating that uncertainty as a reason to avoid assessing likelihood, or treating expert review
      as proof that “serious possibility” communicated one agreed probability. The stated duty was to assess likelihood either
      way, while the phrase left readers and estimators with sharply different understandings.
    weighing: The Satellite preparations supported the serious-possibility assessment, and the IAC gave the estimate final
      review and approval. But the stated duty to convey an exact judgment weighs against language that readers and Board
      members understood as substantially different odds. The recorded outcome is O1, though its communication merits remain
      contested; the balance depends on distinguishing the basis for the assessment from whether its wording conveyed that
      assessment clearly.
    tradecraft: Preserve the evidence-based likelihood judgment and the uncertainty about the Kremlin's choice in the decision
      record. At final review, check that the wording conveys the judgment the estimators actually reached, rather than relying
      on the phrase alone to do so.
    uncertainty: The estimate said it was impossible to determine which course the Kremlin was likely to adopt, and the passage
      leaves open whether this was imperfect knowledge or an undecided Soviet choice. Separately, the recorded odds varied
      substantially, so the meaning of the selected phrase was not settled among its readers.
    handoff: The IAC held final approval authority. Involving the intelligence experts who formed the estimate and the policy
      staff expected to use it would help expose whether the wording conveyed the intended likelihood; the policy staff's
      different reading made that communication issue consequential.
    tempting_wrong:
      option: O2
      pull: Return the estimate because “serious possibility” produced widely differing interpretations of the odds.
      why_wrong: That is a substantial communication concern, but the recorded outcome was approval after final review, with
        an evidence-based judgment that an attack was a serious possibility. The disagreement about implied odds does not
        itself establish that the underlying assessment had no basis.
    rejected:
      O2: The IAC gave final review and approval to the estimate's serious-possibility judgment, grounded in Satellite preparations,
        despite the recorded disagreement about what odds the wording implied.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The IAC could not identify a defensible likelihood judgment behind “serious possibility” after reviewing the evidence.
      then: O2
      why: Without a judgment to convey, retaining the wording would not meet the stated duty to assess likelihood and communicate
        that judgment.
    would_not_change:
    - id: noflip1
      if: The uncertainty arose because the Kremlin had not yet reached a binding decision.
      why: The stated duty to assess likelihood and draft language conveying the judgment applied whichever kind of uncertainty
        was present.
    watch_for:
    - id: watch1
      what: Whether the estimators and important policy readers assign materially different odds to the phrase.
      favors:
      - O2
      why: The recorded differences—from a policy reader's substantially lower interpretation to Board members' estimates
        ranging from about 20 to 80 to 80 to 20—signal that the wording may not convey the intended judgment.
  lesson: Uncertainty about an adversary's choice does not remove the duty to assess likelihood. The language used to communicate
    that judgment must be checked against what estimators and decision-makers actually understand it to mean.
  limits: This reasoning concerns an intelligence estimate and its probability language, not a determination that the attack
    would occur or a broader prescription for standardized terminology. The recorded approval does not resolve the communication
    problem revealed by the differing interpretations.
