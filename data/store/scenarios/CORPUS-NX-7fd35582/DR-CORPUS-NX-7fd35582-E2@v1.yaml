case:
  id: DR-CORPUS-NX-7fd35582-E2@v1
  title: Responding to an Unanswerable Estimate Request
  status: draft
  setting: Intelligence-estimating work; place and time unspecified.
  decider: The intelligence estimators
  agent: The intelligence estimators
  agent_role: decide
  situation: Intelligence estimators receive a request about a subject they regard as wholly impenetrable or too uncertain
    for a firm estimate. The consumer says the information is essential to planning and presses the estimators to respond,
    invoking their expertise and threatening to seek other advice. An institutional convention makes it difficult for the
    estimators to state explicitly that a subject cannot be estimated. Possible safeguards include describing contingencies
    without firm conclusions, identifying evidentiary limits, and presenting ranges of quantities and uncertainty as planning
    assumptions. The estimators must decide whether to respond in a qualified form, reject the request, or defer pending more
    evidence.
  question: What should the intelligence estimators do in response to the consumer's request for an estimate on a subject
    they cannot reliably estimate?
  options:
    O1:
      do: The estimators accept the request and provide a qualified planning assessment with uncertainty ranges.
      move: act
      irreversible: false
    O2:
      do: The estimators hold their response and revisit the request after additional evidence becomes available.
      move: hold
      irreversible: false
    O3:
      do: The estimators reject the request and provide no planning assessment for the consumer.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: assessed
    fact: The estimators sometimes face requests concerning subjects they regard as totally impenetrable or impossible to
      estimate firmly.
  - id: F2
    kind: authority
    status: assessed
    fact: An established convention makes it difficult for the estimators to write that a subject is impossible to estimate.
  - id: F3
    kind: situation
    status: assessed
    fact: The consumer describes the requested information as essential for planning and says complete accuracy or confidence
      is not expected.
  - id: F4
    kind: situation
    status: assessed
    fact: The consumer appeals to the estimators' expertise and threatens to seek the information from others if they refuse.
  - id: F5
    kind: situation
    status: assessed
    fact: The estimators may accept a request despite having grave reservations.
  - id: F6
    kind: situation
    status: assessed
    fact: One available form of response is to describe contingencies without making firm estimates and revisit the matter
      when sufficient information is available.
  - id: F7
    kind: situation
    status: assessed
    fact: For a subject that cannot be estimated, the estimators can describe their work as planning assumptions rather than
      estimates.
  - id: F8
    kind: situation
    status: assessed
    fact: A qualified planning assessment can identify where the evidence begins and ends and use ranges for quantities and
      uncertainty.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The consumer says the information is essential for planning and may seek less knowledgeable advice if refused. That
      supports providing something useful, but the pressure does not make the subject more knowable.
  - id: C2
    facts:
    - F1
    - F5
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The estimators accept the request despite grave reservations, but for a subject they cannot estimate they describe
      the product as planning assumptions rather than an estimate. This preserves the distinction between useful planning
      material and a firm conclusion.
  - id: C3
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: A qualified assessment can mark where evidence ends, identify speculation, and use ranges for quantities and uncertainty.
      These safeguards make the limitations visible rather than disguising uncertainty as precision.
  - id: C4
    facts:
    - F6
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Where firm conclusions are unavailable, the estimators can state contingencies without closing them with firm estimates,
      and revisit the matter when sufficient returns are available. Cautionary material should remain attached to numerical
      tables so qualifications are not lost.
  reasoning:
    read: This is a request for planning help on a subject the estimators regard as impenetrable, not a basis for claiming
      a reliable firm estimate. The trap is that institutional pressure, the consumer's asserted need, and the threat to consult
      others can make the estimators feel obliged to answer more confidently than their evidence permits.
    weighing: 'The estimators accept the charge because the consumer says the information is essential and may otherwise turn
      to people who know less {C1}. But acceptance is qualified, not a license to invent certainty: the answer is to call
      the work planning assumptions, mark evidentiary limits, use ranges, and preserve caveats {C2} {C3} {C4}. The balance
      depends on keeping those limits explicit; if sufficient information later arrives, the matter can be revisited.'
    tradecraft: State what the evidence does and does not establish, distinguish evidence from speculation, and label the
      product as planning assumptions rather than a firm estimate when that is what the evidence supports. Use ranges and
      describe unresolved contingencies without supplying unsupported firm conclusions. Keep the cautions attached to any
      figures or tables, and revisit the assessment as relevant information accumulates.
    uncertainty: Some subjects cannot be estimated firmly. Caveats and ranges communicate that uncertainty but do not remove
      it or turn assumptions into reliable facts.
    handoff: The estimators can make and qualify the assessment themselves; no higher authority is identified as required.
      The consumer may use it for planning, and the estimators can revisit the issue when sufficient returns are available.
    tempting_wrong:
      option: O3
      pull: Reject the request to avoid producing anything on a subject that cannot be estimated reliably.
      why_wrong: The estimators accept the charge despite grave reservations, in part because the information is presented
        as essential and refusal may send the consumer to less knowledgeable advisers. The answer is qualified assistance,
        not an unqualified estimate.
    rejected:
      O2: The estimators do not simply hold the current response because the consumer says the information is needed for planning;
        they instead provide a qualified account and can revisit it when sufficient returns arrive.
      O3: The estimators do not reject the request because they accept the consumer's planning need while limiting what they
        claim through caveats, contingencies, and ranges.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Sufficient returns become available to support a more grounded reassessment before the planning response is needed.
      then: O2
      why: The estimators may revisit the matter or make a further estimate once sufficient returns are in, rather than treating
        the initial assumptions as final.
    would_not_change:
    - id: noflip1
      if: The consumer continues to say the information is essential and threatens to consult others if the estimators refuse.
      why: That pressure may explain why the estimators accept the task, but it does not change the evidence or justify presenting
        an unsupported firm estimate.
    watch_for:
    - id: watch1
      what: Whether sufficient returns arrive to resolve contingencies or permit a second look.
      favors:
      - O2
      why: The estimators may revisit the assessment when sufficient returns are in.
  lesson: When a consumer needs an answer to a question the evidence cannot support firmly, provide useful planning material
    only with its epistemic status made unmistakable. State the evidence limits, use ranges and contingencies, keep cautions
    attached to the material, and revisit the assessment when more information arrives.
  limits: This reasoning concerns intelligence analysis under profound uncertainty and a consumer's planning need. It does
    not establish that analysts should answer every request, or that caveats can cure an assessment whose assumptions or evidentiary
    basis cannot be responsibly described.
