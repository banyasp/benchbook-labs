case:
  id: DR-XFER-CORPUS-INC-YUGOSLAV-CRISIS-NS-776ba75b-E1-A@v1
  title: A Readiness Assessment for a Missile-Warning Satellite
  status: draft
  setting: At the satellite integration facility and the operational test office, during preparation of an independent readiness
    assessment for a missile-warning satellite program.
  decider: The Director of Operational Test
  agent: The Director of Operational Test
  agent_role: decide
  situation: The Director of Operational Test is overseeing an independent readiness assessment of a missile-warning satellite
    program. The first draft concludes that the program will be ready on schedule. Its central rationale is that a gap in
    warning coverage would be so damaging that the contractor and program office would not allow the schedule to slip. The
    Director visited the integration facility while the assessment was being drafted. The review panel is considering the
    draft alongside information about the contractor’s financial position and the program office’s remaining management reserve.
  question: What should the Director of Operational Test do about the first draft and its assignment?
  options:
    O1:
      do: The Director of Operational Test reassigns the first draft to a new lead author.
      move: act
      irreversible: false
    O2:
      do: The Director of Operational Test retains the first draft with its current lead author.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An independent readiness assessment of the missile-warning satellite program was in draft.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Director of Operational Test visited the integration facility while the assessment was in draft.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The first draft judged that the program would be ready on schedule.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The first draft reasoned that a gap in warning coverage would be so damaging that the contractor and program office
      would not allow the schedule to slip.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The contractor’s latest financial reporting indicated less available financial capacity to carry the program than
      the draft’s rationale appeared to assume.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The program office’s schedule-risk records indicated that little unallocated management reserve remained.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The draft’s forecast depended on the assumption that the consequences of a coverage gap would prevent the schedule
      from slipping. The review panel found that reasoning unpersuasive.
  - id: C2
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The contractor’s finances and the program office’s remaining reserve no longer seemed strong enough to serve as the
      backstops on which the draft’s schedule forecast relied.
  - id: C3
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The Director visited the integration facility to assess the program and, reflecting on that assessment, judged the
      initial conclusion unpersuasive; retaining the draft unchanged would leave that assessment unaddressed.
  reasoning:
    read: The question is whether to retain an initial forecast whose central reassurance was that the schedule would hold
      because the consequences of a warning-coverage gap were so severe. The trap is treating the gravity of a coverage gap
      as evidence that the contractor and program office still have the capacity and resources to prevent a schedule slip.
    weighing: The initial forecast’s reasoning did not persuade the Director and review panel {C1}. Their assessment that
      the contractor’s finances and the program office’s remaining reserve were no longer credible backstops directly undermined
      its premise {C2}. The Director’s assessment after visiting the integration facility also weighed against leaving the
      first draft as it stood {C3}. On that balance, reassignment was the chosen response; the stated basis was the assessment
      of the draft and its assumed backstops, not a general rule that drafts must be reassigned whenever a reviewer disagrees.
    tradecraft: Reassign the draft to a new lead author. As a decision-practice addition, record the specific premise found
      unpersuasive and the evidence or assessment that bears on it, without presenting the reassignment itself as proof of
      the readiness forecast.
    uncertainty: The scenario gives the Director’s judgment and its key rationale, but not the underlying details of the integration-facility
      assessment or a full account of evidence for either schedule forecast. The decision therefore rests here on the stated
      concern about the contractor’s finances and remaining reserve, and the Director’s assessment, not on an independent
      reconstruction of readiness.
    handoff: The Director acted with the review panel, whose members shared concern about the first conclusion. The scenario
      does not specify a separate approval authority for the reassignment.
    tempting_wrong:
      option: O2
      pull: 'The initial draft offered a reassuring way through: a gap in warning coverage would be so damaging that the contractor
        and program office would prevent a schedule slip.'
      why_wrong: That reasoning assumes the very capacity and financial and schedule resources that the Director and review
        panel no longer found persuasive.
    rejected:
      O2: The Director did not retain the first draft with its current lead author because its conclusion was unpersuasive
        in light of the weakened credibility of the financial and reserve backstops.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The contractor’s finances and the program office’s remaining management reserve instead appeared strong enough to
        carry the program.
      then: O2
      why: That would remove the stated reason the initial draft’s central premise was unpersuasive and could support retaining
        it.
    - id: flip2
      if: The Director’s assessment after the integration-facility visit supported the initial schedule forecast rather than
        undermining it.
      then: O2
      why: The stated basis for reassignment would be absent, making retention more supportable on the facts presented.
    would_not_change:
    - id: noflip1
      if: The consequences of a warning-coverage gap remained severe, but the contractor’s finances and the program office’s
        reserve still did not seem credible backstops.
      why: The gravity of a coverage gap alone would not resolve the stated concern about whether the parties expected to
        prevent a schedule slip could do so.
    watch_for:
    - id: watch1
      what: Whether the contractor and program office are assessed as having the financial capacity and reserve to support
        the schedule.
      favors:
      - O2
      - O1
      why: That assessment bears directly on the premise the Director and review panel found unpersuasive.
  lesson: Do not treat the severe consequences of a schedule failure as proof that someone will prevent it. Test whether the
    organizations on which that assumption depends still have the capacity and resources the forecast requires.
  limits: This reasoning concerns whether to reassign an independent readiness assessment draft in light of a challenged analytic
    premise. It does not establish the program’s actual readiness or determine what later acquisition decisions should be.
  library:
    domain: defense acquisition, test and evaluation
    family: XFER-CORPUS-INC-YUGOSLAV-CRISIS
    source: transfer of DR-CORPUS-INC-YUGOSLAV-CRISIS-NS-776ba75b-E1@v1
    episode_focus: The initial draft judged that Yugoslavia would muddle through; the National Intelligence Officer and caucus
      group found that conclusion unpersuasive because the Communist Party and military no longer seemed credible guarantors
      of cohesion. Focus on the analytic choice to reassign the draft and its basis, not on later operational or diplomatic
      responses.
    equities: pilot2
