    domain: natsec-other
    family: CORPUS-NX-d0f02cb5
    source: https://www.cia.gov/resources/csi/static/f4b6cf75ca9efcabacc393400eb01dd8/50-Years-in-Langley.pdf
    episode_focus: The President rules out the proposed brewery site because Washington is already congested; the DCI argues
      for proximity to other government offices, and the deputy director for administration proposes the Leiter Estate, which
      the President accepts. Focus on the site decision and the reasons stated, not later construction details.
    cues:
      option_words:
        O1: 13
        O2: 13
      real_option: O2
