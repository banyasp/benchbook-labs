case:
  id: DR-CORPUS-NX-d0f02cb5-E3@v1
  title: Identifying Signs at Headquarters
  status: draft
  setting: Langley, during the President's administration, at CIA Headquarters and the parkway.
  decider: The Director of Central Intelligence
  agent: The Director of Central Intelligence
  agent_role: decide
  situation: CIA Headquarters was located in Langley, and the parkway had been extended to reach it. Signs along the parkway
    identified the CIA, and they had been erected before the headquarters building was finished. The President objected to
    the signs and had conveyed that view to the Director of Central Intelligence. The Director had not acted on the objection.
    The President then called the Director and said he would come remove the signs himself if they were not taken down.
  question: What should the Director of Central Intelligence do about the identifying signs on the parkway?
  options:
    O1:
      do: The Director of Central Intelligence directs that the identifying signs remain along the parkway.
      move: act
      irreversible: false
    O2:
      do: The Director of Central Intelligence directs quiet removal of the identifying signs from the parkway.
      move: act
      irreversible: true
    O3:
      do: The Director of Central Intelligence asks the President to clarify the signs' status before acting.
      move: ask
      irreversible: false
      to: the President
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Locating CIA Headquarters in Langley meant the parkway had to be extended to reach it.
  - id: F2
    kind: situation
    status: assessed
    fact: Signs along the parkway identified the CIA's location.
  - id: F3
    kind: situation
    status: assessed
    fact: The signs were put up before the headquarters building was finished.
  - id: F4
    kind: situation
    status: assessed
    fact: The President objected to the signs and conveyed that objection to the Director of Central Intelligence.
  - id: F5
    kind: situation
    status: assessed
    fact: The Director of Central Intelligence initially paid little attention to the President's objection.
  - id: F6
    kind: situation
    status: assessed
    fact: The President told the Director of Central Intelligence he would come remove the signs himself if they were not
      taken down.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The President had already conveyed his objection, but the Director initially paid little attention; the account gives
      no basis for treating the objection as resolved.
  - id: C2
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: After the President directly said he would remove the signs himself if they remained, the Director ordered them taken
      down.
  - id: C3
    facts:
    - F2
    - F6
    equity: public_transparency
    favors:
    - O2
    weight: weak
    why: The Director’s deputy expressly preferred avoiding publicity around the removal. This is a preference about public
      attention, not a stated legal or security reason for removing the signs.
  reasoning:
    read: 'The choice was whether to retain signs identifying CIA Headquarters after the President had objected and then directly
      threatened to remove them himself. The trap is to treat the signs’ identifying function as proof of a security rationale:
      the account states no such rationale, and it gives no substantive reason for retaining them.'
    weighing: The earlier objection had not moved the Director, but the President’s direct call and stated intention to act
      himself were followed by the Director’s order to remove the signs {C1} {C2}. The only additional stated preference was
      to avoid publicity {C3}. The account supports removal as the Director’s response to the President, not as the result
      of a stated legal rule or security assessment.
    tradecraft: If acting on this account, distinguish the President’s direction from any independent legal or security basis,
      and record the decision and its stated rationale accurately. The preference to avoid publicity should not be converted
      into a false claim that the signs created a demonstrated security risk.
    uncertainty: The passage does not explain the President’s reasons for objecting, whether the signs served an operational
      or public-information purpose, or what legal authority governed their placement or removal.
    handoff: The account describes the Director acting on the President’s direct call; it does not describe referral to another
      authority. Seeking legal or administrative advice would be prudent only if the Director needed to establish authority
      or resolve a relevant constraint not addressed in the account.
    tempting_wrong:
      option: O1
      pull: The signs were already erected and identified the Headquarters location.
      why_wrong: The source gives no reason that their continued presence was necessary, while the President had objected
        and then made a direct demand.
    rejected:
      O1: The Director did not retain the signs after the President’s direct call and stated intention to remove them himself.
      O3: The account records a removal order after the President’s direct call, not a request for further clarification.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The President withdrew the objection and confirmed that the signs should remain.
      then: O1
      why: The source’s stated basis for removal was the President’s objection and direct demand; withdrawal would remove
        that basis.
    - id: flip2
      if: A binding legal or operational requirement to retain identifying signs applied.
      then: O3
      why: The account establishes no such requirement; if one existed, the Director would need to resolve the conflict before
        directing removal.
    would_not_change:
    - id: noflip1
      if: The signs had been erected before the Headquarters building was finished.
      why: That timing is part of the account, but it is not given as a reason to retain the signs after the President’s direct
        demand.
    watch_for:
    - id: watch1
      what: Whether the President has moved from conveying an objection to issuing a direct demand.
      favors:
      - O2
      why: The account distinguishes the earlier objection, which the Director initially disregarded, from the later call
        followed by the removal order.
  lesson: When a superior’s objection becomes a direct demand, distinguish the force of that direction from any independent
    legal or policy rationale. Do not invent a security justification where the account supplies none, and keep the recorded
    rationale faithful to what actually drove the decision.
  limits: This conclusion is specific to the account’s stated sequence and does not establish that a President may lawfully
    direct removal of signs in every circumstance. It does not resolve any legal, security, or public-information interests
    that the passage does not address.
  library:
    domain: natsec-other
    family: CORPUS-NX-d0f02cb5
    source: https://www.cia.gov/resources/csi/static/f4b6cf75ca9efcabacc393400eb01dd8/50-Years-in-Langley.pdf
    episode_focus: The passage describes the choice to remove rather than retain the identifying signs after the President
      objects and threatens to remove them himself. The deputy director for administration also directs that removal be quiet
      to avoid publicity; exclude the mechanics of carrying it out.
