case:
  id: DR-XFER-CORPUS-NX-41af3c89-E2-B@v1
  title: Space-Resilience Research
  status: draft
  setting: On the space-policy staff of a U.S. national security organization, at the decision point after two decades of
    U.S. advantage in space; the rival has recently fielded comparable satellites and gained an edge in systems able to threaten
    them.
  decider: A small office on the space-policy staff
  agent: A small office on the space-policy staff
  agent_role: decide
  situation: For about two decades, U.S. advantage in space rested on a few large, capable satellites that the rival could
    not match. The rival now fields comparable satellites and, in the past decade, has gained an edge in systems able to threaten
    them. A small office on the space-policy staff is considering whether to launch a long-range research program. The program
    would cover planning and research to make space support to U.S. and allied forces more resilient. Its stated approach
    would not rely mainly on declared threats of retaliation against the rival's satellites, which planners warn could escalate
    a crisis in orbit.
  question: What should the small office on the space-policy staff do about the long-range space-resilience research program?
  options:
    O1:
      do: The small office on the space-policy staff approves and launches the long-range space-resilience research program.
      move: act
      irreversible: false
    O2:
      do: The small office on the space-policy staff rejects and declines to launch the long-range space-resilience research
        program.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: For about two decades, U.S. advantage in space rested on a few large, capable satellites that the rival could not
      match.
  - id: F2
    kind: capability
    status: confirmed
    fact: The rival now fields satellites comparable to the U.S. satellites that underpinned that advantage.
  - id: F3
    kind: capability
    status: assessed
    fact: Over the past decade, the rival has gained an edge in systems able to threaten those satellites.
  - id: F4
    kind: situation
    status: confirmed
    fact: The decision is being considered after the rival's satellite capabilities reached comparability and its threat-related
      systems gained an edge.
  - id: F5
    kind: authority
    status: confirmed
    fact: A small office on the space-policy staff is considering whether to launch a long-range research program.
  - id: F6
    kind: situation
    status: confirmed
    fact: The program's stated aim is to make space support to U.S. and allied forces more resilient through planning and
      research only.
  - id: F7
    kind: situation
    status: confirmed
    fact: The stated adversary context for the program is the rival whose satellites are now comparable and whose related
      systems have gained an edge.
  - id: F8
    kind: situation
    status: confirmed
    fact: The proposed approach would not rely mainly on declared threats of retaliation against the rival's satellites.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Planners warn that declared threats of retaliation against the rival's satellites could escalate a crisis in orbit.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The long-standing advantage based on a few capable satellites has eroded as the rival fielded comparable satellites
      and gained an edge in systems able to threaten them. This strategic setting motivates a shift toward research and planning
      for resilience.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The proposed program has the concrete purpose of making space support to U.S. and allied forces more resilient in
      the stated rival context.
  - id: C3
    facts:
    - F6
    - F8
    - F9
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The stated approach seeks resilience without making declared threats of retaliation against the rival's satellites
      the primary reliance. Planners warn that such threats could escalate a crisis in orbit, supporting the policy rationale
      for pursuing the program without establishing that it would control escalation.
  reasoning:
    read: This is a strategic shift as a long-standing advantage in space erodes and the rival's related capabilities improve,
      not simply a choice to issue more threats of retaliation. The trap is to treat reduced primary reliance on declared
      retaliatory threats as a rejection of deterrence altogether; the stated purpose is to make space support more resilient
      through planning and research.
    weighing: The changed capabilities motivate consideration of a research program, with the concrete purpose of making space
      support to U.S. and allied forces more resilient. The approach also avoids making declared threats of retaliation the
      primary reliance, in a context where planners warn such threats could escalate a crisis in orbit. That strategic rationale
      favors {O1} over {O2}. The balance depends on the program being directed toward that resilience purpose; costs and feasibility
      are not addressed.
    tradecraft: Identify the objective as improving the resilience of space support without making declared retaliatory threats
      the primary reliance, and record how the proposed planning and research serves that objective. Confirm the office's
      authority and document the basis for the decision.
    uncertainty: The office's authority is not detailed beyond its role in considering launch of the program. Costs, feasibility,
      and competing proposals are also not addressed. The strategic rationale is clear, but those matters cannot be resolved
      from the available facts.
    handoff: The small space-policy staff office is identified as the actor considering the program. No required consultation
      or approval is identified; confirming applicable authority or review is prudent.
    tempting_wrong:
      option: O2
      pull: Declining the program could seem prudent because the rival's capabilities have caught up and a new research effort
        may carry uncertainty.
      why_wrong: The changed strategic balance motivates a new resilience-focused research effort rather than standing still.
    rejected:
      O2: The office did not decline the program; it launched it to improve resilience in response to the changed strategic
        setting.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The office had reason to conclude that the proposed program could not plausibly make space support more resilient,
        or that it would depend primarily on declared threats of retaliation against the rival's satellites.
      then: O2
      why: Those conditions would defeat the program's stated purpose, the central reason for launching it.
    would_not_change:
    - id: noflip1
      if: The only established circumstance were that U.S. advantage in space had lasted about two decades, without the described
        changes in the rival's satellite and threat-related capabilities.
      why: The rationale rests on the changed strategic balance, including the rival's comparable satellites and its edge
        in systems able to threaten them, not duration alone.
    watch_for:
    - id: watch1
      what: Whether the proposed planning and research has a credible connection to more resilient space support for U.S.
        and allied forces in the stated rival context.
      favors:
      - O1
      why: A credible connection would support the purpose given for launching the program.
  lesson: When an established advantage erodes, assess whether a different capability can serve the mission rather than assuming
    the answer is to intensify reliance on the old one. Keep the decision tied to the stated resilience objective and do not
    claim that unresolved questions have been settled.
  limits: This reasoning supports the choice to launch the planning and research program given the stated strategic context
    and purpose. It does not establish the merits of later technologies or operational uses, or resolve questions of cost,
    feasibility, or authority that are not addressed here.
