case:
  id: DR-XFER-CORPUS-NX-41af3c89-E2-A@v1
  title: Targeted Financial-Pressure Research
  status: draft
  setting: In the capital of an allied state, in the mid-2020s, within the Ministry of Finance.
  decider: A small policy-planning office within the Ministry of Finance
  agent: A small policy-planning office within the Ministry of Finance
  agent_role: decide
  situation: For about two decades, comprehensive trade and banking restrictions have been the main economic lever used against
    a rival power. The rival has since developed alternative payment networks and expanded its trading relationships. Over
    the past decade, it has also gained an advantage in moving funds through intermediaries that existing restrictions do
    not reach. A small policy-planning office in the finance ministry is weighing whether to initiate a multi-year research
    program on targeted financial measures. The proposed program is intended to make allied economic pressure on the rival
    more effective without relying mainly on broad secondary restrictions, which the rival has said it would treat as economic
    warfare.
  question: What should the small finance ministry policy-planning office do about the proposed multi-year research program?
  options:
    O1:
      do: The small finance ministry policy-planning office rejects and declines to launch the multi-year research program.
      move: act
      irreversible: false
    O2:
      do: The small finance ministry policy-planning office approves and launches the multi-year research program.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Comprehensive trade and banking restrictions were the principal economic lever applied against the rival power for
      about two decades.
  - id: F2
    kind: capability
    status: confirmed
    fact: The rival has developed alternative payment networks.
  - id: F3
    kind: situation
    status: confirmed
    fact: The rival has expanded its trading relationships beyond jurisdictions participating in the restrictions.
  - id: F4
    kind: capability
    status: assessed
    fact: Over the past decade, the rival has improved its ability to move funds through intermediaries outside the reach
      of existing restrictions.
  - id: F5
    kind: authority
    status: confirmed
    fact: The finance ministry's planning charter assigns the office responsibility for evaluating whether to initiate multi-year
      policy research programs.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposed program's stated aim is to improve the effectiveness of allied economic pressure on the rival through
      research on targeted financial measures.
  - id: F7
    kind: situation
    status: confirmed
    fact: The rival power is the stated focus of the proposed research program.
  - id: F8
    kind: situation
    status: confirmed
    fact: The proposed approach is not to rely mainly on broad secondary restrictions, which the rival has said it would treat
      as economic warfare.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The established restrictions have been the main lever for years, while the rival's alternative networks, trading
      relationships, and ability to move funds through intermediaries have changed the setting in which that lever is used.
      This strategic setting motivates considering research on a different approach.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The proposed research is intended to improve the effectiveness of allied economic pressure against the rival.
  - id: C3
    facts:
    - F6
    - F8
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The stated approach seeks greater effectiveness without relying mainly on broad secondary restrictions, which the
      rival has said it would treat as economic warfare. This supports the policy rationale for pursuing the program, though
      the stated purpose is not expressly framed as controlling escalation.
  reasoning:
    read: This is a strategic shift in the face of changes that have blunted the established restrictions, not simply a choice
      to impose more of the same. The trap is to treat avoiding primary reliance on broad secondary restrictions as rejecting
      economic pressure altogether; the stated purpose is to improve the effectiveness of allied pressure through targeted
      financial measures.
    weighing: The rival's alternative networks and intermediary advantage prompt consideration of research, with the concrete
      purpose of improving allied economic pressure against the rival. The approach also avoids making broad secondary restrictions
      the primary reliance. That strategic rationale favors {O1} over {O2}. The balance depends on the program being directed
      toward that purpose; costs and feasibility are not addressed.
    tradecraft: Identify the objective as improving the effectiveness of allied economic pressure without making broad secondary
      restrictions the primary reliance, and record how the proposed program serves that objective. Confirm the office's authority
      and document the basis for the decision.
    uncertainty: The office's authority is not detailed beyond its role in evaluating whether to initiate the program. Costs,
      feasibility, and competing proposals are also not addressed. The strategic rationale is clear, but those matters cannot
      be resolved from the available facts.
    handoff: The small finance ministry office is identified as the actor considering initiation of the program. No required
      consultation or approval is identified; confirming applicable authority or review is prudent.
    tempting_wrong:
      option: O1
      pull: Declining the program could seem prudent because the rival has adapted to existing restrictions and a new research
        effort might carry uncertainty.
      why_wrong: The changed economic setting motivates a new research effort focused on targeted measures rather than standing
        still.
    rejected:
      O1: The office should not decline the program; it should launch it to improve the effectiveness of allied economic pressure
        in response to the changed strategic setting.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The office had reason to conclude that the proposed program could not plausibly improve the effectiveness of allied
        targeted financial measures, or that it would depend mainly on broad secondary restrictions.
      then: O1
      why: Those conditions would defeat the program's stated purpose, the central reason for launching it.
    would_not_change:
    - id: noflip1
      if: The only established circumstance were that comprehensive restrictions had been the main economic lever for about
        two decades, without the described changes to the rival's networks or its ability to use intermediaries.
      why: The rationale rests on the changed strategic setting, including the rival's alternative networks and intermediary
        advantage, not duration alone.
    watch_for:
    - id: watch1
      what: Whether the proposed research has a credible connection to greater effectiveness of allied economic pressure against
        the rival.
      favors:
      - O1
      why: A credible connection would support the purpose given for launching the program.
  lesson: When an established strategic lever loses effectiveness, assess whether a different approach can serve the mission
    rather than assuming the answer is to intensify reliance on the old one. Keep the decision tied to the stated objective
    and do not claim that unresolved questions have been settled.
  limits: This reasoning supports the choice to launch the program given the stated strategic setting and purpose. It does
    not establish the merits of later financial measures or their application, or resolve questions of cost, feasibility,
    or authority that are not addressed here.
  library:
    domain: sanctions and economic statecraft
    family: XFER-CORPUS-NX-41af3c89
    source: transfer of DR-CORPUS-NX-41af3c89-E2@v1
    episode_focus: The decision point is the 1973 shift toward research and development intended to improve U.S. and allied
      conventional effectiveness as Soviet nuclear capabilities caught up. Include the strategic choice and its stated purpose;
      exclude later examples of technologies and their operational use.
    equities: pilot2
