case:
  id: DR-CORPUS-NX-c3d4b87d-E1@v1
  title: CIA Assistance to BNDD
  status: draft
  setting: Virginia, late 1970–July 1973; CIA cooperation with BNDD.
  decider: The CIA Director
  agent: The CIA Director
  agent_role: decide
  situation: In late 1970, BNDD sought CIA assistance in building counterintelligence capacity within the Bureau, with support
    from the Attorney General. BNDD was concerned that some employees might have been corrupted by drug traffickers. The CIA
    recruited personnel for BNDD and assigned two of its agents to work for the Bureau between January 1972 and July 1973.
    BNDD directed those two agents, while the CIA provided their salaries and administrative support and was reimbursed by
    BNDD. The 1947 Act prohibits CIA participation in law-enforcement activities, and the CIA Director must decide whether
    CIA assistance to BNDD should continue.
  question: What should the CIA Director do about the CIA's assistance to BNDD?
  options:
    O1:
      do: The CIA Director prohibits further CIA assistance to BNDD.
      move: act
      irreversible: false
    O2:
      do: The CIA Director permits continued CIA assistance to BNDD.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In late 1970, BNDD asked the CIA Director for help building counterintelligence capacity within BNDD.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Attorney General supported BNDD's request.
  - id: F3
    kind: intelligence
    status: assessed
    fact: BNDD's request reflected concern that some employees might have been corrupted by drug traffickers.
  - id: F4
    kind: capability
    status: assessed
    fact: BNDD reported that it lacked the expertise to establish a counterintelligence unit.
  - id: F5
    kind: situation
    status: confirmed
    fact: The CIA recruited 19 agents for BNDD between December 1970 and July 1973.
  - id: F6
    kind: situation
    status: confirmed
    fact: The CIA assigned two of its agents to work for BNDD between January 1972 and July 1973; BNDD directed them, and
      they were not under CIA operational control.
  - id: F7
    kind: situation
    status: confirmed
    fact: The CIA paid the two agents' salaries and administrative costs, and BNDD reimbursed the CIA.
  - id: F8
    kind: authority
    status: confirmed
    fact: The 1947 Act prohibits CIA participation in law-enforcement activities.
  considerations:
  - id: C1
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: The 1947 Act prohibits CIA participation in law-enforcement activities, ruling out continued assistance that constitutes
      such participation.
    rules_out:
    - O2
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Although BNDD directed the two agents and reimbursed the CIA, the CIA assigned them and paid their salaries and administrative
      costs; the Commission concluded these activities violated the Act.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: BNDD sought help because it lacked counterintelligence expertise and feared employee corruption, and the Attorney
      General supported the request. This explains the purpose of the assistance but does not overcome the statutory prohibition.
  reasoning:
    read: This was assistance to a federal law-enforcement agency, not merely an internal CIA activity. The trap is to treat
      BNDD's operational direction of the assigned agents and reimbursement of their costs as removing the CIA from the activity;
      the Commission still classified the CIA's participation as prohibited by the 1947 Act.
    weighing: The counterintelligence need and Attorney General's support favor helping BNDD, but the controlling consideration
      is the statutory boundary. The Commission found that the CIA's activities crossed it and concluded that termination
      was correct. The balance depends on whether CIA assistance constitutes participation in law enforcement; the Commission
      resolved that question against continuation here.
    tradecraft: Carry out the termination through a clear written directive, and have the Director and Inspector General remain
      alert to prevent similar Agency involvement.
    uncertainty: The Commission expressed no uncertainty about the legal conclusion for this project. The source does not
      address what different forms of assistance or different legal authority might permit.
    handoff: The CIA Director should decide and issue the termination directive; the Inspector General should be alert to
      similar future involvement, as the Commission directed.
    tempting_wrong:
      option: O2
      pull: BNDD had a serious stated need, the Attorney General supported the request, and BNDD directed the assigned agents
        and reimbursed the CIA.
      why_wrong: Those circumstances do not change the Commission's conclusion that the CIA's participation in law enforcement
        violated the 1947 Act.
    rejected:
      O2: Continued assistance was not chosen because the Commission concluded that the CIA's participation violated the 1947
        Act.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The 1947 Act were changed or other applicable law expressly authorized this CIA participation in law enforcement.
      then: O2
      why: That would remove the statutory prohibition decisive in this case, though any continued assistance would still
        need to comply with applicable authority.
    would_not_change:
    - id: noflip1
      if: BNDD's need for counterintelligence help and the Attorney General's support remained in place.
      why: Those circumstances already accompanied the project, but the Commission still concluded that CIA participation
        violated the Act.
    watch_for:
    - id: watch1
      what: Any future proposed Agency involvement in a similar law-enforcement enterprise.
      favors:
      - O1
      why: The Commission directed the Director and Inspector General to be alert to prevent similar involvement.
  lesson: A legitimate partner need and senior support do not themselves authorize an agency to cross a statutory boundary.
    Assess the Agency's actual participation, including support and administrative roles, and end involvement that the governing
    law prohibits.
  limits: This conclusion concerns the CIA's participation in this BNDD law-enforcement project under the 1947 Act. The source
    does not establish what other agencies, legally authorized activities, or materially different forms of assistance may
    do.
  library:
    domain: intel-oversight
    family: CORPUS-NX-c3d4b87d
    source: https://www.aarclibrary.org/publib/church/rockcomm/pdf/RockComm_Chap17_Relations.pdf
    episode_focus: The decision was whether the CIA should continue assisting a federal narcotics law-enforcement agency or
      end its participation; the report says the project violated the 1947 Act’s prohibition on CIA participation in law-enforcement
      activities. Focus on the authority and institutional boundary, not the operational methods used to recruit or support
      personnel.
