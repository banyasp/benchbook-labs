case:
  id: DR-CORPUS-NS-94d2ba03-E57@v1
  title: UK Support for the ISG
  status: draft
  setting: Iraq, during the ISG's establishment; UK Ministry of Defence.
  decider: The Secretary of State for Defence
  agent: The Secretary of State for Defence
  agent_role: decide
  situation: The discovery of WMD was regarded as a high and urgent policy priority. The ISG was expected to become the primary
    executive vehicle for detection work once fully established by the end of May. US and UK resources in Iraq needed to be
    redirected while the ISG built its capacity. The UK faced political, presentational and legal pressures. Third-party validation
    was considered politically desirable, and UN involvement was not ruled out, although there was considerable hostility
    to UNMOVIC in its present form. Coordinated public handling and expectation management were also considered necessary.
  question: What should the Secretary of State for Defence do about UK support for the US-led ISG, including personnel assignments
    and additional expertise?
  options:
    O1:
      do: The Secretary of State for Defence approves a Chief of Staff for the ISG, assigns 32 existing UK personnel across
        Iraq for six months, and pursues additional WMD expertise.
      move: act
      irreversible: false
    O2:
      do: The Secretary of State for Defence rejects a Chief of Staff for the ISG, assigns no existing UK personnel to it
        across Iraq for six months, and declines to pursue additional WMD expertise.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The discovery of WMD was regarded as a high and urgent policy priority.
  - id: F2
    kind: situation
    status: confirmed
    fact: The ISG was agreed to be the primary executive vehicle for detection work once fully established by the end of May.
  - id: F3
    kind: capability
    status: confirmed
    fact: US and UK resources in Iraq were to be redirected while the ISG was still building its capacity.
  - id: F4
    kind: situation
    status: confirmed
    fact: Political, presentational and legal pressures for the UK were recognized.
  - id: F5
    kind: situation
    status: assessed
    fact: Third-party validation of finds was considered politically desirable; UN involvement was not ruled out, despite
      considerable hostility to UNMOVIC in its present form.
  - id: F6
    kind: situation
    status: confirmed
    fact: Coordinated public handling and expectation management were considered necessary.
  - id: F7
    kind: capability
    status: confirmed
    fact: The recommendation was to provide a Chief of Staff to the ISG and assign 32 existing UK personnel to it across Iraq
      for an initial six months.
  - id: F8
    kind: capability
    status: confirmed
    fact: Officials were to pursue additional steps to enhance the UK contribution, including urgent recruitment and redeployment
      of WMD experts.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: WMD discovery was a high and urgent priority, and the ISG was to be the primary executive vehicle for detection once
      established; supporting it aligned UK action with the stated detection priority.
  - id: C2
    facts:
    - F3
    - F7
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Resources needed redirecting while the ISG built capacity. The recommendation was to provide a Chief of Staff and
      assign existing UK personnel across Iraq for an initial six months, giving the ISG support during that period.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The UK faced political, presentational and legal pressures; third-party validation was considered politically desirable,
      and coordinated public handling and expectation management were considered necessary. These considerations favored an
      organized contribution, while the stated hostility to UNMOVIC did not rule out UN involvement.
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The recommendation included further steps to enhance the UK contribution, specifically urgent recruitment and redeployment
      of WMD experts.
  reasoning:
    read: The decision was how to support the designated detection vehicle while it was still building capacity, not whether
      to abandon the WMD discovery priority. The trap is treating hostility to UNMOVIC as excluding all UN involvement, although
      UN involvement was not ruled out, or treating the need to redirect resources as a reason to withhold the recommended
      support.
    weighing: The urgent priority and the ISG's intended role favor support {C1}. The need to redirect resources while the
      ISG built capacity is met by the recommended initial six-month assignment {C2}; the recommendation also calls for further
      expertise {C4}. Political, presentational and legal pressures, third-party validation, and coordinated public handling
      reinforce the case for an organized contribution, but the source does not specify these as legal tests or say they independently
      determine the outcome {C3}. The balance favors {O1}, subject to the ISG remaining the primary vehicle and the stated
      priority remaining urgent.
    tradecraft: Approve the Chief of Staff and the recommended personnel assignment for the initial six-month period, and
      have officials pursue urgent recruitment and redeployment of WMD experts. Coordinate public handling and expectation
      management. Keep the decision record clear about the recommendation, the approved scope, and the stated policy reasons.
    uncertainty: The ISG was not yet fully established and was still building capacity; the source anticipated establishment
      by the end of May. It also records hostility to UNMOVIC in its then-current form, without resolving how third-party
      validation or any UN involvement would be arranged.
    handoff: The Secretary of State for Defence makes the support decision; officials pursue the additional steps to enhance
      the UK contribution. Coordinated public handling is also needed, but the source does not specify a separate approval
      authority or a particular body to involve.
    tempting_wrong:
      option: O2
      pull: Withholding personnel and expertise could appear prudent while resources are being redirected, especially given
        the stated hostility to UNMOVIC.
      why_wrong: That would leave the primary detection vehicle without the recommended support despite the urgent priority;
        hostility to UNMOVIC did not amount to ruling out UN involvement.
    rejected:
      O2: It was not chosen because the recommendation, approved by the Secretary of State for Defence, was to support the
        ISG with a Chief of Staff, existing personnel, and further WMD expertise.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Decision-makers no longer regarded WMD discovery as a high and urgent priority and no longer expected the ISG to
        be the primary executive vehicle for detection.
      then: O2
      why: The two central reasons for directing personnel and additional expertise to the ISG would no longer apply.
    would_not_change:
    - id: noflip1
      if: Hostility to UNMOVIC in its present form continued.
      why: 'That concern alone would not reverse the recommendation: UN involvement was not ruled out, and the stated case
        for supporting the ISG rested principally on its detection role and the urgent priority.'
    watch_for:
    - id: watch1
      what: Whether the ISG is still building capacity and whether additional WMD experts can be urgently recruited or redeployed.
      favors:
      - O1
      why: The recommendation addresses the ISG's capacity-building period through an initial assignment and additional expertise.
  lesson: When an urgent policy priority has a designated executive vehicle that is still building capacity, support can be
    justified as a time-limited bridge while further expertise is pursued. Political and presentational pressures should inform
    coordinated handling, but should not be mistaken for a legal finding or for a blanket bar on third-party involvement.
  limits: This reasoning supports the specific recommendation during the ISG's establishment; it does not establish that the
    same staffing level or duration would be appropriate after capacity, priorities, or circumstances change. The source does
    not set out a legal standard for the detection work or prescribe how it should be conducted.
