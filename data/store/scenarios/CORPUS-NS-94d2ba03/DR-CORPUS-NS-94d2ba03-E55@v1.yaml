case:
  id: DR-CORPUS-NS-94d2ba03-E55@v1
  title: Sizing the UK Contribution
  status: draft
  setting: United Kingdom, early planning for SSE operations, PJHQ and Ministerial decision-making.
  decider: the Minister
  agent: the Minister
  agent_role: decide
  situation: PJHQ was shaping a UK contribution to support the United States in SSE operations. The contribution was expected
    to cohere with wider policy objectives and be no larger than needed to achieve the UK aim and support the US. The UK also
    needed to preserve its response to any CBRN incident at home. EOD and CBRN resources faced significant Home Base and force-protection
    demands. Planning remained at an early stage, and further ministerial approval was required for any additional personnel.
  question: What should the Minister do about the size of the UK personnel contribution?
  options:
    O1:
      do: The Minister should decline a UK personnel deployment.
      move: act
      irreversible: true
    O2:
      do: The Minister should approve deployment of 74 UK personnel.
      move: act
      irreversible: true
    O3:
      do: The Minister should approve a smaller UK personnel deployment.
      move: partial
      irreversible: true
    O4:
      do: The Minister should defer the UK contribution decision.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: PJHQ's priority was for any UK contribution to cohere with wider policy objectives.
  - id: F2
    kind: situation
    status: confirmed
    fact: PJHQ's priority was for a UK contribution not to put the response to any CBRN incident in the UK at risk.
  - id: F3
    kind: situation
    status: confirmed
    fact: PJHQ's priority was for a UK contribution to be no more than needed to achieve the UK aim and support the US.
  - id: F4
    kind: capability
    status: confirmed
    fact: UK EOD and CBRN resources faced significant Home Base and force-protection demands.
  - id: F5
    kind: situation
    status: confirmed
    fact: Planning for SSE operations was still at an early stage.
  - id: F6
    kind: authority
    status: confirmed
    fact: Further Ministerial approval was required for the participation of additional personnel.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: weak
    why: The contribution was to cohere with wider policy objectives, supporting a UK contribution, though this priority does
      not establish a particular size.
  - id: C2
    facts:
    - F2
    equity: civilian_life
    favors:
    - O1
    - O3
    - O4
    weight: strong
    why: The contribution must not put the UK's response to a CBRN incident at risk, a material constraint on committing personnel.
  - id: C3
    facts:
    - F3
    equity: resource_stewardship
    favors:
    - O2
    - O3
    weight: strong
    why: 'The contribution was to be efficient and effective: no more than needed to achieve the UK aim and support the US.
      This supports a limited contribution, but the source does not explain why 74, rather than a smaller number, met that
      test.'
  - id: C4
    facts:
    - F4
    equity: own_force_life
    favors:
    - O1
    - O3
    - O4
    weight: strong
    why: Significant Home Base and force-protection demands on EOD and CBRN resources weighed against committing more capacity.
  - id: C5
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    - O4
    weight: weak
    why: Planning was at an early stage, but the Minister approved 74 personnel and required further ministerial approval
      for any additional personnel. The initial approval was distinct from any later increase.
  reasoning:
    read: The issue was the scale of a UK contribution supporting the US, not whether to commit without limit. The trap is
      treating support for the US as a reason to provide as many personnel as possible, despite the stated requirement to
      protect the domestic CBRN response and use no more resources than needed.
    weighing: 'The stated priorities pulled in both directions: policy coherence and support for the US favored a contribution,
      while domestic response and resource demands constrained its size. The Minister approved 74 personnel, with any additional
      personnel requiring further ministerial approval. The source does not give a separate calculation showing why 74 was
      necessary or why a smaller contribution would not suffice; the outcome reflects the Minister''s judgment on the balance,
      not a stated numerical rule.'
    tradecraft: Keep the approval to the stated 74 personnel distinct from any later request for additional personnel. Record
      the decision against the stated policy, domestic-response, efficiency, and resource-demand considerations; seek further
      ministerial approval before any additional personnel participate.
    uncertainty: The source identifies the governing priorities and the number approved, but does not explain how 74 was assessed
      as no more than needed or quantify the effect on domestic capacity.
    handoff: The Minister made the initial decision. Further ministerial approval was required for additional personnel; the
      source does not transfer that approval decision to another office.
    tempting_wrong:
      option: O4
      pull: Planning was still at an early stage, making deferral seem prudent.
      why_wrong: The Minister approved 74 despite the early planning stage; the stated approach was to seek further approval
        for additional personnel rather than defer the initial contribution.
    rejected:
      O1: The Minister approved a UK contribution, consistent with the priority that it cohere with wider policy objectives
        and support the US.
      O3: A smaller contribution might reduce pressure on resources, but the source records approval of 74 and does not state
        that a smaller number would achieve the UK aim and support the US.
      O4: Although planning remained at an early stage, the Minister approved 74 personnel and reserved further approval for
        additional personnel.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: A contribution of 74 were shown to put the UK's response to a CBRN incident at risk.
      then: O3
      why: The stated priority was to preserve the domestic CBRN response, so evidence of that risk would weigh toward reducing
        the contribution.
    - id: flip2
      if: The available assessment could not establish that 74 was no more than needed to achieve the UK aim and support the
        US.
      then: O4
      why: The contribution was to be limited to what was needed; without a basis to judge its size, deferral would allow
        that constraint to be assessed before approval.
    would_not_change:
    - id: noflip1
      if: Planning remained at an early stage, without evidence that the approved 74 personnel would put the domestic response
        at risk.
      why: Early-stage planning did not prevent approval of the initial 74-person contribution; additional personnel remained
        subject to further ministerial approval.
    watch_for:
    - id: watch1
      what: Any proposed participation by additional personnel.
      favors:
      - O4
      why: Further ministerial approval was required before additional personnel could participate.
  lesson: When a partner-support contribution competes with domestic response and force-protection demands, size it to the
    stated mission need rather than treating support as a reason to maximize deployment. Keep any initial approval distinct
    from later additions that require separate approval.
  limits: The source records the approval and the priorities guiding it, but not the assessment that made 74 the appropriate
    number. This reasoning does not establish that 74, or any other fixed contribution, is appropriate in different operational
    or domestic-capacity circumstances.
