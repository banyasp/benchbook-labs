case:
  id: DR-CORPUS-INC-CREATION-AND-ACTIVATION-OF-THE-DEFENSE-I-NS-4ec53ab6-E1@v1
  title: Organizing Defense Intelligence
  status: draft
  setting: Early 1961, Department of Defense, United States
  decider: The Secretary of Defense
  agent: The Secretary of Defense
  agent_role: decide
  situation: In early 1961, each military service had its own intelligence organization, and there was no concrete plan for
    a department-level intelligence agency. A joint study group identified overlap and duplication in defense intelligence
    activities and an inefficient distribution of resources. The group also identified barriers to information-sharing among
    Department of Defense components. During a visit to Air Force intelligence headquarters, the Secretary of Defense reviewed
    intelligence photographs and found they did not establish a missile gap; he considered the service chief's interpretation
    shaped by the service's institutional perspective. The Secretary of Defense concluded that a single defense intelligence
    agency should be considered instead of several agencies representing individual services. Staff consideration of establishing
    such an agency had begun.
  question: What should the Secretary of Defense do about organizing and managing Department of Defense intelligence functions?
  options:
    O1:
      do: The Secretary of Defense should decentralize Department of Defense intelligence management among the military departments.
      move: act
      irreversible: false
    O2:
      do: The Secretary of Defense should centralize Department of Defense intelligence management in a new department-level
        agency.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Each military service had developed its own intelligence organization.
  - id: F2
    kind: situation
    status: assessed
    fact: A joint study group found considerable overlap and duplication in defense intelligence activities, resulting in
      an inefficient distribution of resources.
  - id: F3
    kind: situation
    status: assessed
    fact: The joint study group observed that fragmented efforts created barriers to the free and complete exchange of intelligence
      information among Department of Defense components.
  - id: F4
    kind: situation
    status: confirmed
    fact: Near the end of the preceding presidential administration, there was no concrete plan to establish a Department
      of Defense-level intelligence agency.
  - id: F5
    kind: intelligence
    status: assessed
    fact: After reviewing photographs at Air Force intelligence headquarters, the Secretary of Defense did not find that they
      established a missile gap and considered the service chief's interpretation shaped by Air Force institutional perspective.
  - id: F6
    kind: capability
    status: assessed
    fact: The Secretary of Defense concluded that one defense intelligence agency should be considered instead of several
      agencies representing individual services and their operational interests.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Secretary of Defense raised the establishment of a Defense Intelligence Agency with the Joint Chiefs of Staff
      in a February 8, 1961 memorandum.
  considerations:
  - id: C1
    facts:
    - F2
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: The joint study group found substantial overlap and duplication that led to inefficient use of defense intelligence
      resources, supporting a department-level approach to organizing and managing those resources.
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Fragmented efforts created barriers to the free and complete exchange of intelligence information among DoD components;
      central management was favored as a response to that fragmentation.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The Secretary of Defense found that the photographs did not establish a missile gap and considered the service chief's
      interpretation shaped by Air Force institutional perspective. This experience supported concern about relying on separate
      service organizations, though it was one experience rather than proof that service analysis was generally unreliable.
  - id: C4
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The Secretary of Defense concluded that one defense intelligence agency should be considered instead of several agencies
      representing individual services and their operational interests.
  reasoning:
    read: The problem was not simply that several services performed intelligence functions; the joint study group identified
      duplication, inefficient resource use, and barriers to information exchange. The managerial trap was to treat each service's
      perspective as an adequate substitute for department-wide coordination, while the Secretary of Defense's experience
      suggested that service interests could shape interpretation without implying that the service chief was dishonest.
    weighing: The identified duplication and inefficient resource allocation, together with barriers to information-sharing,
      strongly favored centralizing management in a department-level agency. The Secretary of Defense's experience with service-specific
      interpretation reinforced that judgment, and his stated conclusion directly favored one agency over several service-based
      agencies. The balance depended on whether a department-level agency could address fragmentation and coordinate the functions
      that remained with the military departments.
    tradecraft: Define the new agency's responsibility for department-wide management and resource allocation, and specify
      how it will review and coordinate intelligence functions retained by the military departments. Record the identified
      duplication, information-sharing barriers, and service-perspective concern as the reasons for the organizational change.
    uncertainty: The available account summarizes the Secretary of Defense's reasoning but does not provide the full analysis
      of expected benefits or evidence about how well the new arrangement later performed. The service-chief example is illustrative,
      not a finding that all service intelligence was biased.
    handoff: The Secretary of Defense should involve the Joint Chiefs of Staff and relevant DoD staff in developing the agency's
      organization and coordinating the functions that remain with the military departments; staff and Joint Chiefs consideration
      had already begun.
    tempting_wrong:
      option: O1
      pull: Keeping intelligence management decentralized preserves each military department's direct role and avoids creating
        a new department-level organization.
      why_wrong: That approach would leave in place the fragmentation associated with duplication, inefficient resource use,
        and barriers to information exchange.
    rejected:
      O1: The Secretary of Defense did not choose decentralization because the identified duplication, resource inefficiency,
        and information-sharing barriers supported a single department-level agency.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A department-wide assessment showed that central management would worsen coordination or resource use, while decentralized
        management could resolve the identified duplication and information-sharing barriers.
      then: O1
      why: The stated case for centralization rests on addressing fragmentation, inefficient resource use, and barriers to
        exchange; evidence that decentralization better addressed those problems could change the balance.
    would_not_change:
    - id: noflip1
      if: The Secretary of Defense had no further experience with service-specific interpretation beyond the Air Force visit.
      why: The case for a department-level agency also rested on the joint study group's separate findings of duplication,
        inefficient resource use, and barriers to information exchange.
    watch_for:
    - id: watch1
      what: Whether intelligence functions retained by the military departments are effectively reviewed and coordinated by
        the new department-level agency.
      favors:
      - O2
      why: Effective coordination would address the fragmentation that supported creating a single agency.
  lesson: When separate organizational interests produce duplication, inefficient resource use, or barriers to information
    exchange, assess whether a department-level authority can coordinate the work more effectively. A service-specific perspective
    can be a reason to examine analytic independence, but an illustrative experience should not be treated as proof of general
    unreliability.
  limits: This reasoning concerns the early-1961 decision about organizing and managing DoD intelligence functions. It does
    not establish that every intelligence function should be transferred to a central agency or that centralization will be
    effective without clear coordination of functions retained by the military departments.
  library:
    domain: intel-oversight
    family: CORPUS-INC-CREATION-AND-ACTIVATION-OF-THE-DEFENSE-I
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/
