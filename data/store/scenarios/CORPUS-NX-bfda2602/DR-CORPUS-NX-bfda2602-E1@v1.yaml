case:
  id: DR-CORPUS-NX-bfda2602-E1@v1
  title: Eighth Army Strategic Choice
  status: draft
  setting: South Korea, winter 1950, Eighth Army.
  decider: The Eighth Army commander.
  agent: The Eighth Army commander
  agent_role: decide
  situation: The Eighth Army is in poor condition after retreating down almost the entire Korean Peninsula under pressure
    from Chinese and North Korean forces. The theater commander has warned that evacuation of the peninsula is inevitable
    without massive reinforcement and bombing Chinese territory. The Eighth Army commander assesses that the army has a poor
    theory of success, a defeatist attitude, and little confidence in its mission and command. The commander faces a choice
    between seeking outright defeat of Chinese forces and pursuing coercion while preserving Eighth Army forces on the peninsula.
    Coercion would aim to convince Chinese forces that victory is impossible and impose costs until they change their strategy.
  question: 'What should the Eighth Army commander do: adopt an annihilation strategy for outright defeat of Chinese forces
    or a coercion strategy to deny Chinese victory while preserving Eighth Army forces?'
  options:
    O1:
      do: The Eighth Army commander adopts coercion as its strategy to deny Chinese victory and preserve Eighth Army forces.
      move: act
      irreversible: false
    O2:
      do: The Eighth Army commander adopts annihilation as its strategy for outright defeat of Chinese forces.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Eighth Army was in poor condition after retreating down almost the entire Korean Peninsula under pressure from
      Chinese and North Korean forces.
  - id: F2
    kind: situation
    status: assessed
    fact: The theater commander warned that evacuation of the peninsula was inevitable without massive reinforcement and bombing
      Chinese territory.
  - id: F3
    kind: situation
    status: assessed
    fact: The Eighth Army commander assessed that the army had a poor theory of success.
  - id: F4
    kind: situation
    status: assessed
    fact: The Eighth Army commander assessed that soldiers and Marines had a defeatist attitude.
  - id: F5
    kind: situation
    status: assessed
    fact: The Eighth Army commander assessed that the forces lacked confidence in their mission and command.
  - id: F6
    kind: situation
    status: confirmed
    fact: The strategic alternatives under consideration were annihilation to seek outright defeat of Chinese forces or coercion
      through denial and punishment.
  - id: F7
    kind: situation
    status: assessed
    fact: The coercion approach was intended to convince Chinese forces that victory was impossible and impose costs until
      they changed their strategy.
  - id: F8
    kind: situation
    status: assessed
    fact: The coercion approach was framed as wearing down the opposing forces while preserving Eighth Army forces on the
      Korean Peninsula, rather than focusing on holding specific territory or outright defeat.
  considerations:
  - id: C1
    facts:
    - F3
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The commander judged the existing theory of success poor and shifted from annihilation to coercion: deny the opposing
      forces confidence in victory and impose costs until they change their strategy.'
  - id: C2
    facts:
    - F4
    - F5
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The army's defeatist attitude and lack of confidence in its mission and command made a strategy centered on outright
      defeat a poor fit; the commander also sought to restore the army's fighting identity and confidence.
  - id: C3
    facts:
    - F1
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: After the army's near-peninsula-wide retreat and in its poor condition, the chosen approach aimed to wear down the
      opposing forces while preserving Eighth Army forces on the peninsula.
  reasoning:
    read: The army was in disarray, and its commander assessed that it lacked both a sound theory of success and confidence
      in its mission and leadership. The trap is to treat the theater commander's warning of possible evacuation as proof
      that seeking outright defeat is the only serious response; the commander instead changed the theory of success.
    weighing: The commander favored coercion because it offered a way to deny the opposing forces victory and impose costs
      without making outright defeat the objective. The army's condition and the aim of preserving its forces reinforced that
      choice. The balance depends on coercion being a credible way to change the opposing forces' strategy while keeping the
      Eighth Army on the peninsula.
    tradecraft: Record the choice as a strategic decision, including the assessed weaknesses, the intended denial-and-punishment
      logic, and the preservation aim. Reassess those premises if circumstances change; this does not determine operational
      orders or actions.
    uncertainty: The theater commander's evacuation warning was conditional on the absence of massive reinforcement and bombing
      Chinese territory. The passage gives no comparative estimate of the feasibility of annihilation versus coercion, or
      of how likely coercion was to change the opposing forces' strategy.
    handoff: The Eighth Army commander made the strategic choice. The passage identifies no required approval or consultation,
      so it does not establish a further decision authority.
    tempting_wrong:
      option: O2
      pull: The army's retreat and the warning that evacuation might be inevitable could make a strategy seeking outright
        defeat seem like the forceful response to an urgent crisis.
      why_wrong: The commander assessed the army's theory of success as poor and chose instead to make enemy victory impossible
        while preserving his own forces.
    rejected:
      O2: The commander did not pursue annihilation because he shifted to coercion by denial and punishment, aiming to wear
        down the opposing forces while preserving the Eighth Army on the peninsula.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A materially changed assessment showed that coercion could not deny the opposing forces victory or preserve the
        Eighth Army, while annihilation offered a credible means of achieving the mission.
      then: O2
      why: The stated rationale for O1 depends on coercion being a workable theory of success that protects the army; if that
        rationale no longer holds and annihilation becomes credible, the balance could change.
    would_not_change:
    - id: noflip1
      if: The evacuation warning remained conditional on the absence of massive reinforcement and bombing Chinese territory.
      why: That warning establishes the gravity of the situation, but by itself does not show that annihilation is a better
        strategy than the commander's chosen denial-and-punishment approach.
    watch_for:
    - id: watch1
      what: Whether coercion continues to be a credible means of convincing the opposing forces that victory is impossible
        and changing their strategy.
      favors:
      - O1
      why: That is the stated logic for choosing coercion; evidence that it no longer applies would call the choice's strategic
        premise into question.
  lesson: When a force is in poor condition, do not assume that seeking outright defeat is the only effective response. Choose
    a theory of success suited to the force's assessed weaknesses, and weigh mission aims against preserving the force needed
    to pursue them.
  limits: This reasoning concerns the strategic choice described for the Eighth Army in winter 1950. It does not establish
    a general rule that coercion is preferable to annihilation, or resolve questions about legal authority, operational orders,
    or battlefield actions.
