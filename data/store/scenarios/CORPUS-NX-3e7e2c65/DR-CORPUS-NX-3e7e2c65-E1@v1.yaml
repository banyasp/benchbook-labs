case:
  id: DR-CORPUS-NX-3e7e2c65-E1@v1
  title: Grenada Mission Scope
  status: draft
  setting: Grenada, October 1983; the U.S. administration and the Joint Chiefs of Staff.
  decider: The Joint Chiefs of Staff
  agent: The Joint Chiefs of Staff
  agent_role: decide
  situation: In 1983, U.S. leadership viewed Grenada as a national-security concern after its government signed a treaty with
    the Soviet Union connected to construction of a 10,000-foot runway by Cuban personnel. In October, radical leaders overthrew
    and arrested the prime minister, who was later assassinated with dozens of his followers. The coup leaders imposed martial
    law and a 24-hour shoot-on-sight curfew. Reports placed more than 600 U.S. medical students in the capital, St. George’s,
    but planners were unsure where the students were. The U.S. administration feared a repetition of the Iranian hostage crisis
    and had begun planning a rescue mission. The question facing the Joint Chiefs of Staff was whether the mission should
    remain limited to rescuing the students or take on a broader scope in response to the coup and curfew.
  question: What should the Joint Chiefs of Staff do about the scope of the operation in Grenada?
  options:
    O1:
      do: The Joint Chiefs of Staff restrict the operation to rescuing students and leave coup leaders in place.
      move: act
      irreversible: true
    O2:
      do: The Joint Chiefs of Staff expand the operation to remove coup leaders and restore order.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Pro-Castro Marxists gained government control in Grenada in 1979, and the government began receiving military training
      and weapons from Cuba and the Soviet Union.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The U.S. president disclosed that Grenada presented a national-security threat because its government had signed
      a treaty with the Soviet Union for a 10,000-foot runway capable of receiving Soviet bombers, under construction by the
      Cubans.
  - id: F3
    kind: situation
    status: confirmed
    fact: On 13 October 1983, radical leaders overthrew and arrested the prime minister, who was later assassinated with dozens
      of his followers.
  - id: F4
    kind: situation
    status: confirmed
    fact: The coup leaders imposed martial law and a 24-hour shoot-on-sight curfew.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Reports indicated that more than 600 U.S. medical students were in St. George’s, Grenada’s capital.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: The rescue planners were unsure about the whereabouts of the students.
  - id: F7
    kind: situation
    status: confirmed
    fact: The U.S. administration’s national-security team feared a repetition of the Iranian hostage crisis and had begun
      planning a rescue mission.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The coup, assassination of the prime minister and others, and shoot-on-sight curfew formed the crisis to which the
      Joint Chiefs responded by adding removal of the coup leaders and a return to order.
  - id: C2
    facts:
    - F1
    - F2
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: U.S. leadership regarded Grenada as a national-security concern because of its military ties and the runway project.
      That concern was soon overtaken by reports about the students, making it background context rather than the principal
      stated driver of the expanded scope.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O1
    - O2
    weight: strong
    why: The reported presence of more than 600 U.S. students, uncertainty about where they were, and fear of a hostage-crisis
      repetition drove rescue planning. This supports making their rescue a central objective, but does not by itself decide
      whether to expand the mission.
  reasoning:
    read: The immediate decision arose from both the reported danger to U.S. students and a coup that had produced the prime
      minister’s assassination and a shoot-on-sight curfew. The trap is to treat the rescue as the only relevant issue, or
      conversely to treat the prior national-security concern as sufficient by itself to justify every broader objective.
    weighing: The source records that the Joint Chiefs broadened the operation to remove the coup leaders and return Grenada
      to order, in addition to responding to the student emergency {C1}. The runway and military ties supplied background
      security context {C2}; the students’ uncertain whereabouts and the fear of a hostage crisis explain the rescue mission,
      but do not alone resolve its scope {C3}. The source does not set out a legal test or a detailed weighing of civilian
      risks, so the judgment here is limited to the rationale it records.
    tradecraft: Record the decision as a choice to retain the rescue objective while adding the stated objectives of removing
      the coup leaders and returning to order. Keep the rationale and limits of that scope explicit, and document any separate
      legal-authority and civilian-risk assessment rather than implying that the source supplies one.
    uncertainty: The students’ whereabouts were uncertain, and the source gives no detailed assessment of the legal authority
      for the expanded objectives or of the civilian risks considered at the decision point. It therefore supports identifying
      the Joint Chiefs’ stated scope choice, not a conclusion that every aspect of the operation was legally or ethically
      justified.
    handoff: The Joint Chiefs made the scope decision; the administration’s national-security leadership should be involved
      because the source places the rescue planning within that broader national-security response. This does not establish
      a particular approval or legal-authority process.
    tempting_wrong:
      option: O1
      pull: Restricting the operation to rescue would keep the response closely tied to the urgent concern that brought planners
        to the decision.
      why_wrong: 'It would leave out the response the Joint Chiefs chose to make to the coup, assassination, and imposed curfew:
        removing the coup leaders and returning the island to order.'
    rejected:
      O1: The Joint Chiefs did not keep the mission limited to rescue; they expanded it in response to the coup and curfew.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The overthrow, assassination, and shoot-on-sight curfew were absent, leaving the reported student emergency as the
        only stated immediate crisis.
      then: O1
      why: Without the crisis the Joint Chiefs addressed through removal of the coup leaders and restoration of order, the
        rationale for broadening the mission would be substantially weaker.
    would_not_change:
    - id: noflip1
      if: The runway-related national-security concern were absent, but the coup, assassination, and curfew remained.
      why: The coup and curfew remain the immediate context for broadening the operation; the runway concern was already overtaken
        by the student reports.
    watch_for:
    - id: watch1
      what: Reliable information changing the assessment of danger to the students or the severity of the curfew crisis.
      favors:
      - O1
      - O2
      why: The rescue concern and crisis response are distinct grounds for setting scope, so changes in either should be assessed
        separately.
  lesson: When an urgent rescue coincides with a wider political and security crisis, distinguish the reason to rescue people
    from the reasons for expanding the mission. State the added objectives and their rationale explicitly, and do not infer
    legal authority or a complete civilian-risk assessment from a source that does not provide them.
  limits: This reasoning applies to the scope choice as recorded, not to the legality or execution of the operation. The source
    does not provide a governing legal standard, a detailed authority analysis, or a full account of how civilian risks were
    weighed.
