case:
  id: DR-CORPUS-NX-287ad80d-E1@v1
  title: Selecting a Working Hypothesis for Individual Scent
  status: draft
  setting: Research setting; time, place, and institution are not specified.
  decider: The research team
  agent: The research team
  agent_role: decide
  situation: The research team is comparing skin secretions as candidate sources of individual human scent. Eccrine sweat
    has a water-solubility mismatch with the scent, and the team found that scent could be extracted from hair with a fat
    solvent. Dogs can take scent from a person's hand or head hair as readily as from the armpit, while only the armpit among
    those areas has apocrine glands. The fatty material from decomposing skin cells is produced slowly, although dogs can
    detect scent after a series of baths. Sebum has properties that may fit the observed scent, but the team has not established
    that it is the unique source.
  question: What should the research team do about selecting a working hypothesis for the source of individual human scent?
  options:
    O1:
      do: The research team should reject sebum as the working hypothesis for individual scent.
      move: act
      irreversible: false
    O2:
      do: The research team should defer selecting a working hypothesis among the candidate secretions.
      move: hold
      irreversible: false
    O3:
      do: The research team should adopt sebum as the working hypothesis for individual scent.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The non-water portion of eccrine sweat is water-soluble, while Löhner's experiments indicated that human scent is
      not readily soluble in water.
  - id: F2
    kind: capability
    status: assessed
    fact: The research team extracted an individual's scent from a hair sample using a fat solvent.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Eccrine sweat contains materials similar to those in urine, which the research team concluded does not carry the
      individual's characteristic odor.
  - id: F4
    kind: capability
    status: assessed
    fact: Dogs can take a person's scent as readily from the hand or head hair as from the armpit.
  - id: F5
    kind: situation
    status: confirmed
    fact: Of the hand, head hair, and armpit, only the armpit is equipped with apocrine glands.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Fatty material from decomposing skin cells is produced too slowly to be promptly replaced after removal by a thorough
      bath.
  - id: F7
    kind: capability
    status: assessed
    fact: A dog can detect human scent after a series of baths.
  - id: F8
    kind: situation
    status: assessed
    fact: Sebum is described as a fatty substance containing heavy alcohols and hydrocarbons, with a fusion point between
      room and body temperatures.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Sebum removed from the skin is rapidly replaced, and sebum is soluble in fat solvents.
  - id: F10
    kind: situation
    status: assessed
    fact: The research team had not proved that sebum was the unique source of individual scent or that other skin secretions
      did not also contain it.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Eccrine sweat is a poor candidate because its water-soluble material does not fit the scent's reported lack of water
      solubility, and the team concluded that similar materials in urine do not carry the characteristic individual odor.
  - id: C2
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: 'Apocrine sweat is a poor candidate under the team''s single-source assumption: dogs take scent as readily from the
      hand or head hair as from the armpit, but only the armpit has apocrine glands.'
  - id: C3
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Skin-cell material is produced too slowly to be promptly replaced after removal, whereas dogs can still detect scent
      after a series of baths, so the team considered skin cells unlikely to be the source.
  - id: C4
    facts:
    - F2
    - F8
    - F9
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Sebum's fatty composition and fusion point appear consistent with the proposed scent properties; its rapid replacement
      could explain persistence after bathing, and its fat-solvent solubility fits the team's extraction of scent from hair.
  - id: C5
    facts:
    - F10
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The team had not proved sebum was the unique source or excluded other secretions, which cautions against treating
      the hypothesis as established; this limits the claim but does not prevent a tentative working hypothesis.
  reasoning:
    read: The choice is among candidate sources for a working hypothesis, not a finding that one secretion has been proved
      to be the unique source. The trap is to treat the evidence as conclusive, or to treat the absence of conclusive proof
      as preventing a provisional research judgment.
    weighing: The team reasons against eccrine sweat based on the solubility mismatch and comparison with urine, against apocrine
      sweat based on scent distribution under the single-source assumption, and against skin cells based on slow replacement
      despite scent persisting after baths. Sebum is the remaining candidate and appears to fit the relevant properties, replenishment,
      and extraction evidence. The balance supports adopting it provisionally; it depends on the team's stated single-source
      assumption for its apocrine reasoning and does not establish uniqueness.
    tradecraft: Record sebum as a working hypothesis, preserve the distinction between a plausible candidate and a proved
      unique source, and keep the stated uncertainty visible in subsequent analysis.
    uncertainty: The team says it has not proved that sebum is the unique source or that other skin secretions do not also
      contain the scent.
    handoff: The research team can make this provisional analytic judgment; the source identifies no need for a separate approving
      authority.
    tempting_wrong:
      option: O2
      pull: Deferring avoids elevating a candidate before its unique role is proved.
      why_wrong: The source's conclusion is expressly a working hypothesis, not a claim of proof; the remaining evidence is
        considered sufficient for that tentative judgment.
    rejected:
      O1: Rejecting sebum was not chosen because its properties, replenishment, and fat-solvent solubility appear consistent
        with the observed scent and extraction evidence.
      O2: Deferring was not chosen because the team regarded sebum as a reasonable working hypothesis despite acknowledging
        that its unique role was unproved.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Further evidence showed that sebum's properties or behavior do not fit the scent, and another candidate better explained
        the observations.
      then: O1
      why: The main basis for adopting sebum is its apparent fit with the scent evidence; materially contrary evidence would
        undermine that basis.
    - id: flip2
      if: The evidence remained insufficient to distinguish sebum from other plausible sources, with no candidate adequately
        accounting for the observations.
      then: O2
      why: If the comparative evidence no longer supports sebum as a reasonable working candidate, deferring selection would
        be appropriate.
    would_not_change:
    - id: noflip1
      if: The team still lacked proof that sebum was the unique source.
      why: Lack of proof of uniqueness is already acknowledged and does not prevent adopting sebum as a tentative working
        hypothesis.
    watch_for:
    - id: watch1
      what: Evidence clarifying whether other skin secretions also contain the characteristic scent, or whether sebum alone
        accounts for it.
      favors:
      - O3
      - O1
      - O2
      why: That evidence would address the stated uncertainty about uniqueness and could confirm, undermine, or leave unresolved
        the working hypothesis.
  lesson: When the decision is to choose a working hypothesis, comparative evidence can justify a provisional choice even
    without proof of exclusivity. State the limits of the inference clearly and do not present a working hypothesis as an
    established finding.
  limits: This judgment concerns the reported comparison among skin secretions and the evidence available to the research
    team. It does not establish sebum as the unique source, rule out other secretions, or resolve questions beyond that research
    judgment.
