case:
  id: DR-OHA-26-0090-restyle1@v1
  title: Guideline E Personal Conduct Security Concern Decision [restyle]
  status: needs_review
  setting: National Energy Agency Review Board, June 2026, security clearance adjudication hearing
  decider: Senior Adjudicator
  agent: Senior Adjudicator
  agent_role: decide
  situation: The Regional Personnel Security Office expressed substantial doubt about the applicant's suitability for a security
    clearance under Guideline E, pointing to disciplinary actions, a civil lawsuit, and alleged mishandling of evidence. The
    applicant had been placed on unpaid suspension for ten days in May 2023 after a detainee died while in his custody and
    was a defendant in a civil action related to that death. He also admitted to discarding shell casings in a residential
    area, violating agency policy, and disclosed both incidents on his security questionnaire and interrogatory response.
    The applicant testified that he accepted responsibility, completed remedial training, and has had no further incidents
    while employed by a contractor for the agency. The regulations require that any doubt be resolved in favor of denial unless
    mitigating conditions are satisfied. The Senior Adjudicator must decide whether the security concerns are resolved and
    whether to grant the applicant's clearance.
  question: What action should the Senior Adjudicator take regarding the applicant's clearance under Guideline E?
  options:
    O1:
      do: The Senior Adjudicator asks the Security Office for underlying evidence.
      move: ask
      irreversible: false
      to: Local Security Office
    O2:
      do: The Senior Adjudicator postpones the final determination pending additional investigation.
      move: hold
      irreversible: false
    O3:
      do: The Senior Adjudicator formally issues the clearance to the applicant.
      move: act
      irreversible: true
    O4:
      do: The Senior Adjudicator formally denies the clearance to the applicant.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Regional Personnel Security Office sent a Notification Letter indicating substantial doubt about the applicant's
      eligibility under Guideline E.
  - id: F2
    kind: situation
    status: confirmed
    fact: The applicant was placed on unpaid suspension for ten days in May 2023 for multiple policy breaches connected to
      the detainee-death incident.
  - id: F3
    kind: situation
    status: confirmed
    fact: The applicant is named as a defendant in a civil lawsuit concerning the detainee's death.
  - id: F4
    kind: situation
    status: confirmed
    fact: The applicant discarded shell casings by throwing them into a wooded area, contravening agency policy.
  - id: F5
    kind: situation
    status: confirmed
    fact: The applicant reported the suspension and civil lawsuit on the Questionnaire for National Security Positions and
      in the Letter of Interrogatory.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The applicant testified that he has taken responsibility, completed required training, and has not incurred further
      disciplinary actions while working for the agency's contractor.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Regional Personnel Security Office cited Guideline E (Personal Conduct) as the basis for the security concerns.
  - id: F8
    kind: authority
    status: confirmed
    fact: Agency regulations establish a presumption against granting a clearance when any doubt remains.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Guideline E addresses serious misconduct – a death in custody and subsequent policy breaches – which the security
      office identified as substantial doubt, and the regulations impose a presumption against granting when such doubt exists.
  - id: C2
    facts:
    - F5
    - F6
    equity: due_process
    favors:
    - O4
    weight: weak
    why: Although the applicant promptly disclosed the incidents (mitigating condition (a)), none of the other mitigating
      conditions (c-g) are met; the absence of counseling, vulnerability reduction, or any untruthfulness means the mitigation
      is insufficient to outweigh the security concern.
  - id: C3
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The recent shell-casing disposal demonstrates a continued willingness to violate rules after the earlier incident,
      suggesting a risk of recurrence and eroding confidence in the applicant's reliability.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: Agency Part 710 expressly presumes denial when any doubt persists; the adjudicator must resolve doubt in favor of
      denial unless all mitigating conditions are satisfied, which they are not.
  reasoning:
    read: The security office raised substantial doubt under Guideline E because the applicant's conduct involved a detainee
      death, a suspension for multiple policy breaches, and a later unlawful disposal of evidence. The adjudicator must determine
      whether those concerns are resolved.
    weighing: Applying the Adjudicative Guidelines, the adjudicator found the seriousness of the conduct (C1) and the recent
      repeat violation (C3) to outweigh the limited benefit of disclosure (C2). The statutory presumption against granting
      (C4) further pushes the balance toward denial.
    tradecraft: The decision is entered into the official record, the denial is transmitted to the applicant, and the matter
      is closed unless appealed under 10 C.F.R. § 710.28.
    uncertainty: The only uncertainty concerns whether future conduct might demonstrate lasting remediation, but the record
      at the hearing does not satisfy any mitigating condition beyond disclosure.
    handoff: The Senior Adjudicator acts alone, as the regulations vest sole authority to resolve the security concern after
      the hearing.
    tempting_wrong:
      option: O3
      pull: The applicant's strong performance with the contractor and his statements of accountability could tempt a grant.
      why_wrong: Granting would disregard the unresolved serious conduct issues and the absence of mitigating conditions,
        contravening the presumption against granting.
    rejected:
      O1: All evidence from the security office has already been fully examined; another request would be redundant.
      O2: Deferring the decision would violate the regulation's requirement to resolve doubt now rather than postpone.
      O3: The security concerns remain unmitigated; the regulations mandate denial.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the applicant had completed counseling and demonstrated sustained behavioral change addressing the misconduct
      then: O3
      why: Mitigating condition (d) would be satisfied, eliminating the remaining security concern under Guideline E.
    would_not_change:
    - id: noflip1
      if: only additional time had elapsed since the incidents without any further remedial action
      why: The seriousness of the conduct and lack of mitigation still require denial.
    watch_for:
    - id: watch1
      what: any future disciplinary record showing no further violations
      favors:
      - O3
      why: A clean record could satisfy the frequency/recency consideration and support a future grant.
  lesson: Guideline E requires denial of a clearance when serious personal conduct violations are not offset by any mitigating
    condition; the presumption against granting prevails unless the applicant can demonstrably resolve all concerns.
  limits: This analysis is limited to security-clearance determinations for the National Energy Agency under 10 C.F.R. Part
    710 and does not address criminal liability or other agencies' personnel-security programs.
