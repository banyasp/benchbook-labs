case:
  id: DR-OHA-26-0090-revise1@v1
  title: Guideline E Personal Conduct Security Concern Decision [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, June 2026, administrative security clearance hearing
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised substantial doubt about the Individual’s eligibility for access authorization
    under Guideline E, citing disciplinary actions, a civil suit, and alleged mishandling of evidence. The Individual had
    been suspended without pay for ten days after a detainee died in his custody and was a defendant in a civil action related
    to that death. He also admitted to discarding shell casings in a residential area, violating agency policy, and disclosed
    both incidents on his questionnaire and interrogatory response. The Individual testified that he had taken accountability,
    received training, and had no further incidents while employed by a DOE contractor. The regulations require that any doubt
    be resolved in favor of denial unless mitigating conditions are met. The Administrative Judge must determine whether the
    security concerns are resolved and whether to grant the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline E?
  options:
    O1:
      do: The Administrative Judge asks the Local Security Office for evidence.
      move: ask
      irreversible: false
      to: Local Security Office
    O2:
      do: The Administrative Judge holds the decision pending further investigation.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge grants the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      under Guideline E.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was suspended without pay for ten days in May 2023 for multiple policy violations related to the
      detainee death incident.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual is a defendant in a civil suit concerning the death of the detainee.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual disposed of shell casings by throwing them into the woods, violating agency policy.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual disclosed the suspension and civil suit on the Questionnaire for National Security Positions and
      the Letter of Interrogatory.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual testified that he has taken accountability, received training, and has had no further disciplinary
      incidents while employed by the DOE contractor.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline E (Personal Conduct) as the basis for the security concerns.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations impose a presumption against granting access authorization when any doubt exists.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: weak
    why: The serious misconduct is noted, but without the LSO's evidentiary record the judge cannot fully assess reliability,
      reducing its decisive impact.
  - id: C2
    facts:
    - F5
    - F6
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The Individual fully disclosed the incidents, creating a due-process interest that the judge must first obtain the
      LSO's supporting evidence before any denial.
  - id: C3
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O4
    weight: weak
    why: The shell-casing disposal suggests a pattern, yet the lack of concrete evidence from the LSO makes this concern less
      decisive at this stage.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: DOE Part 710's presumption of denial applies after the evidentiary record is reviewed; the judge must first request
      that record.
  reasoning:
    read: The record shows the LSO has raised substantial doubt based on a detainee death, a suspension, a civil suit, and
      a shell-casing incident, all disclosed by the Individual, but the Judge has not yet seen the LSO's underlying evidence.
    weighing: Due-process equity (C2) now carries strong weight, outweighing the weaker institutional-credibility concerns
      (C1, C3, C4). Because the judge must base any denial on a complete evidentiary record, the prudent step is to ask the
      LSO for its evidence before deciding.
    tradecraft: The Administrative Judge will issue a formal request to the Local Security Office for all supporting documentation
      and investigative findings before rendering a final authorization decision.
    uncertainty: Uncertainty remains regarding the strength and relevance of the LSO's evidence; obtaining it is necessary
      to resolve the doubt objectively.
    handoff: The Administrative Judge retains sole authority to resolve the security concern, but must first acquire the LSO's
      evidentiary file before any final determination.
    tempting_wrong:
      option: O4
      pull: Denial would immediately eliminate any perceived risk to the program.
      why_wrong: Denial would be premature without first reviewing the LSO's evidence, violating the due-process requirement
        to base a denial on a complete record.
    rejected:
      O2: Holding the decision would delay resolution contrary to the regulation's mandate to address doubt promptly.
      O3: Granting would ignore unresolved serious conduct concerns and the statutory presumption against granting.
      O4: Denial proceeds without the LSO's evidentiary support, breaching the due-process equity that requires the judge
        to see the evidence first.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual had obtained counseling and demonstrated sustained behavioral change addressing the misconduct
      then: O4
      why: Although counseling is provided, the judge would still need the LSO's evidence before overturning the presumption
        of denial.
    would_not_change:
    - id: noflip1
      if: only additional time had passed since the incidents without any further remedial action
      why: The seriousness of the conduct and lack of mitigation still require denial.
    watch_for:
    - id: watch1
      what: any future disciplinary record showing no further violations
      favors:
      - O3
      why: A clean record could satisfy the frequency/recency consideration and support a future grant.
  lesson: When an adjudicative record lacks the LSO's evidentiary material, due-process equity requires the judge to request
    that evidence before making a final authorization decision, even if serious conduct concerns exist.
  limits: This analysis applies only to DOE personnel-security clearance determinations under 10 C.F.R. Part 710 and does
    not extend to criminal liability or other agencies' security programs.
