case:
  id: DR-OHA-26-0090@v1
  title: Guideline E Personal Conduct Security Concern Decision
  status: draft
  setting: DOE Office of Hearings and Appeals, June 2026, administrative security clearance hearing
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised substantial doubt about the Individual’s eligibility for access authorization
    under Guideline E, citing disciplinary actions, a civil suit, and alleged mishandling of evidence. The Individual had
    been suspended without pay for ten days after a detainee died in his custody and was a defendant in a civil action related
    to that death. He also admitted to discarding shell casings in a residential area, violating agency policy, and disclosed
    both incidents on his questionnaire and interrogatory response. The Individual testified that he had taken accountability,
    received training, and had no further incidents while employed by a DOE contractor. The regulations require that any doubt
    be resolved in favor of denial unless mitigating conditions are met. The Administrative Judge must determine whether the
    security concerns are resolved and whether to grant the Individual’s access authorization.
  question: What should the Administrative Judge do regarding the Individual’s access authorization under Guideline E?
  options:
    O1:
      do: The Administrative Judge asks the Local Security Office for evidence.
      move: ask
      irreversible: false
      to: Local Security Office
    O2:
      do: The Administrative Judge holds the decision pending further investigation.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge grants the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      under Guideline E.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was suspended without pay for ten days in May 2023 for multiple policy violations related to the
      detainee death incident.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual is a defendant in a civil suit concerning the death of the detainee.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual disposed of shell casings by throwing them into the woods, violating agency policy.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual disclosed the suspension and civil suit on the Questionnaire for National Security Positions and
      the Letter of Interrogatory.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Individual testified that he has taken accountability, received training, and has had no further disciplinary
      incidents while employed by the DOE contractor.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Local Security Office cited Guideline E (Personal Conduct) as the basis for the security concerns.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations impose a presumption against granting access authorization when any doubt exists.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Guideline E concerns are based on serious misconduct – a detainee death and policy violations – which the LSO identified
      as substantial doubt, and the regulations impose a presumption against granting when such doubt exists.
  - id: C2
    facts:
    - F5
    - F6
    equity: due_process
    favors:
    - O4
    weight: weak
    why: Although the Individual disclosed the incidents promptly (mitigating condition (a)), none of the other mitigating
      conditions (c‑g) are satisfied; the lack of counseling, vulnerability reduction, or untruthfulness means the mitigation
      is insufficient to overcome the security concern.
  - id: C3
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The recent shell‑casing incident shows a pattern of willful rule violations after the earlier incident, indicating
      a likelihood of recurrence and undermining confidence in the Individual’s reliability.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: DOE Part 710 expressly presumes denial when any doubt remains; the Judge must resolve doubt in favor of denial unless
      all mitigating conditions are met, which they are not.
  reasoning:
    read: The LSO raised substantial doubt under Guideline E because the Individual’s conduct involved a death in custody,
      a suspension for multiple policy violations, and a later unlawful disposal of evidence. The Judge must decide whether
      those concerns are resolved.
    weighing: The Judge applied the Adjudicative Guidelines, finding the seriousness of the conduct (C1) and the recent repeat
      violation (C3) outweigh the limited disclosure benefit (C2). The statutory presumption against granting (C4) further
      tips the balance toward denial.
    tradecraft: The decision is recorded in the administrative record, the denial is communicated to the Individual, and the
      case is closed unless appealed under 10 C.F.R. § 710.28.
    uncertainty: The only uncertainty is whether future conduct might demonstrate lasting remediation, but the record as of
      the hearing does not satisfy any mitigating condition beyond disclosure.
    handoff: The Administrative Judge decides alone, as the regulations grant the Judge sole authority to resolve the security
      concern after the hearing.
    tempting_wrong:
      option: O3
      pull: The Individual’s strong performance with the DOE contractor and his statements of accountability might tempt a
        grant.
      why_wrong: Granting would ignore the unresolved serious conduct issues and the lack of mitigating conditions, violating
        the presumption against granting.
    rejected:
      O1: The LSO’s evidence was already fully considered; further requests would be redundant.
      O2: Holding the decision would contravene the regulation’s mandate to resolve doubt now, not defer.
      O3: The security concerns remain unmitigated; the regulations require denial.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the Individual had obtained counseling and demonstrated sustained behavioral change addressing the misconduct
      then: O3
      why: Mitigating condition (d) would be satisfied, removing the remaining security concern under Guideline E.
    would_not_change:
    - id: noflip1
      if: only additional time had passed since the incidents without any further remedial action
      why: The seriousness of the conduct and lack of mitigation still require denial.
    watch_for:
    - id: watch1
      what: any future disciplinary record showing no further violations
      favors:
      - O3
      why: A clean record could satisfy the frequency/recency consideration and support a future grant.
  lesson: Under Guideline E, serious personal conduct violations that are not offset by any mitigating condition result in
    denial of access authorization; the presumption against granting prevails unless the individual can demonstrably resolve
    all concerns.
  limits: This analysis applies only to DOE personnel‑security clearance determinations under 10 C.F.R. Part 710 and does
    not extend to criminal liability or other agencies’ security programs.
