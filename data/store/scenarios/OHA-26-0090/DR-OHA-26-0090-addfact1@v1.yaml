case:
  id: DR-OHA-26-0090-addfact1@v1
  title: Guideline E Personal Conduct Security Concern Decision [addfact]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, June 2026 – security-clearance adjudication
  decider: Hearing Officer
  agent: Hearing Officer
  agent_role: decide
  situation: The Local Security Office has issued a notification indicating substantial doubt about the individual's eligibility
    under Guideline E (Personal Conduct). The individual was suspended without pay for ten days in May 2023 after multiple
    policy violations tied to a detainee's death while in his custody, and he is currently a defendant in a civil suit arising
    from that death. He later discarded spent shell casings by throwing them into a wooded residential area, violating agency
    policy. He reported both the suspension and the civil suit on his security questionnaire and on the required interrogatory
    letter. The individual also disclosed that he received a DOE performance award for safety compliance in the quarter preceding
    the shell-casing incident, that he has taken responsibility for his actions, completed remedial training, and has had
    no further disciplinary events while employed by a DOE contractor. The Local Security Office cited Guideline E as the
    basis for its concerns, and DOE regulations state that any unresolved doubt creates a presumption against granting access.
  question: How should the Hearing Officer rule on the individual's request for access authorization under Guideline E?
  options:
    O1:
      do: Request additional documentation from the Local Security Office before deciding.
      move: ask
      irreversible: false
      to: Local Security Office
    O2:
      do: Place the determination on hold pending further fact-finding.
      move: hold
      irreversible: false
    O3:
      do: Approve the individual's request for access authorization under Guideline E.
      move: act
      irreversible: true
    O4:
      do: Reject the individual's request for access authorization under Guideline E.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Local Security Office sent a Notification Letter asserting substantial doubt regarding the individual's eligibility
      under Guideline E.
  - id: F2
    kind: situation
    status: confirmed
    fact: In May 2023, the individual received a ten-day unpaid suspension for several policy breaches linked to the detainee-death
      incident.
  - id: F3
    kind: situation
    status: confirmed
    fact: During the quarter immediately before the shell-casing episode, the individual earned a DOE performance award for
      exemplary safety compliance.
  - id: F4
    kind: situation
    status: confirmed
    fact: The individual is named as a defendant in a civil lawsuit concerning the detainee's death.
  - id: F5
    kind: situation
    status: confirmed
    fact: The individual violated agency policy by discarding shell casings in a wooded residential area.
  - id: F6
    kind: situation
    status: confirmed
    fact: The individual disclosed both the suspension and the civil suit on the Questionnaire for National Security Positions
      and the accompanying Letter of Interrogatory.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The individual testified that he accepted responsibility, completed remedial training, and has not incurred any
      further disciplinary actions while working for the DOE contractor.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Local Security Office identified Guideline E (Personal Conduct) as the source of the security concerns.
  - id: F9
    kind: authority
    status: confirmed
    fact: DOE regulations establish a presumption against granting access authorization whenever any doubt exists.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F8
    - F9
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Guideline E concerns arise from the individual's ten-day suspension for policy breaches linked to a detainee death
      and the later unlawful disposal of shell casings; the LSO flagged substantial doubt, and DOE regulations impose a presumption
      against granting when such doubt exists.
  - id: C2
    facts:
    - F6
    - F7
    - F3
    equity: due_process
    favors:
    - O4
    weight: weak
    why: The individual disclosed the suspension and civil suit (mitigating condition a) and completed remedial training,
      but the safety-performance award does not satisfy any statutory mitigating condition, so mitigation remains insufficient
      to overcome the security concern.
  - id: C3
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: The recent shell-casing incident demonstrates a pattern of willful rule violations after earlier misconduct, indicating
      a likelihood of recurrence and eroding confidence in the individual's reliability.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: DOE Part 710 expressly presumes denial when any doubt remains; the adjudicator must resolve doubt in favor of denial
      unless all mitigating conditions are satisfied, which they are not.
  - id: C5
    facts:
    - F1
    - F2
    - F4
    - F5
    - F9
    equity: national_security
    favors:
    - O4
    weight: strong
    why: The combination of a suspension, civil litigation, and a policy breach creates substantial doubt, and DOE policy
      presumes denial to protect national security.
  - id: C6
    facts:
    - F3
    - F7
    equity: fairness_to_individual
    favors:
    - O3
    weight: weak
    why: The safety award and completed training show rehabilitation, but they are outweighed by the serious conduct concerns.
  reasoning:
    read: The Local Security Office raised substantial doubt under Guideline E because the individual's conduct involved a
      detainee death, a suspension for multiple policy violations, and a later unlawful disposal of evidence, despite his
      later award for safety compliance.
    weighing: Applying the Adjudicative Guidelines, the seriousness of the conduct (C1) and the repeat violation (C3) outweigh
      the limited mitigation from disclosure (C2). The statutory presumption against granting (C4) further tips the balance
      toward denial.
    tradecraft: The decision is entered into the administrative record, the denial is communicated to the individual, and
      the matter is closed unless appealed under 10 C.F.R. § 710.28.
    uncertainty: Future conduct could alter the assessment, but as of the hearing no mitigating condition beyond disclosure
      has been satisfied.
    handoff: The Hearing Officer acts alone, as the regulations vest sole authority to resolve the security concern after
      the hearing.
    tempting_wrong:
      option: O3
      pull: The recent safety award and the individual's statements of accountability might make a grant appear reasonable.
      why_wrong: Granting would contravene the statutory presumption and ignore the unresolved serious conduct issues.
    rejected:
      O1: All evidence from the LSO has already been considered; requesting more documentation would be redundant.
      O2: Holding the decision would violate the regulation's requirement to resolve doubt now rather than defer.
      O3: The security concerns remain unmitigated; the regulations require denial.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the individual had obtained counseling and demonstrated sustained behavioral change addressing the misconduct
      then: O3
      why: Satisfying mitigating condition (d) would eliminate the remaining security concern under Guideline E.
    would_not_change:
    - id: noflip1
      if: only additional time had passed since the incidents without any further remedial action
      why: The seriousness of the conduct and lack of mitigation still require denial.
    watch_for:
    - id: watch1
      what: any future disciplinary record showing no further violations
      favors:
      - O3
      why: A clean record could satisfy the frequency/recency consideration and support a future grant.
  lesson: Under Guideline E, serious personal-conduct violations that are not offset by any statutory mitigating condition
    result in denial of access authorization; the presumption against granting prevails unless the individual can demonstrably
    resolve all concerns.
  limits: This analysis applies solely to DOE personnel-security clearance determinations under 10 C.F.R. Part 710 and does
    not address criminal liability or the security programs of other agencies.
