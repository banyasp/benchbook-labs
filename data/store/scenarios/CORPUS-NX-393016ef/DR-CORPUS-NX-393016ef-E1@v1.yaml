      option_words:
        O1: 11
        O2: 10
      real_option: O2
      real_to_mean_other_length: 0.91
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
