case:
  id: DR-CORPUS-NX-393016ef-E1@v1
  title: Legal Limits on an Overseas Assignment
  status: draft
  setting: Abroad, in time of peace, within the Okhrana
  decider: The Okhrana staff abroad
  agent: The Okhrana staff abroad
  agent_role: decide
  situation: The Okhrana staff abroad had received an indirect assignment from the home office. The assignment concerned intelligence
    gathering against another nation. The officials were operating in a time of peace. They were bound by law while serving
    abroad. Okhrana officials abroad had protested against operations against other nations, and dispatches objecting to the
    assignment had been directed to the home office.
  question: What should the Okhrana staff abroad do about the home office’s indirect assignment?
  options:
    O1:
      do: The Okhrana staff abroad comply with the home office’s indirect assignment.
      move: act
      irreversible: false
    O2:
      do: The Okhrana staff abroad refuse the home office’s indirect assignment.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The officials considering the assignment were Okhrana staff serving abroad.
  - id: F2
    kind: situation
    status: confirmed
    fact: The home office made an indirect assignment to the staff abroad.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The assignment concerned intelligence gathering against another nation.
  - id: F4
    kind: situation
    status: confirmed
    fact: The assignment arose in time of peace.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Okhrana staff abroad were bound by law.
  - id: F6
    kind: situation
    status: confirmed
    fact: Okhrana officials abroad had protested against Okhrana operations against other nations.
  - id: F7
    kind: situation
    status: confirmed
    fact: Dispatches to the home office objected to the indirect assignment.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: The staff were bound by law while abroad and refused this assignment in time of peace; compliance was ruled out by
      that legal constraint.
    rules_out:
    - O1
  - id: C2
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The assignment concerned intelligence gathering against another nation during peacetime, the circumstances in which
      the staff refused to comply.
  - id: C3
    facts:
    - F6
    - F7
    equity: complicity_risk
    favors:
    - O2
    weight: weak
    why: Officials had protested against operations against other nations, and dispatches objected to this assignment. Those
      objections support refusal, though the legal constraint is the explicit reason given for it.
  reasoning:
    read: This was an indirect home-office assignment to staff serving abroad in peacetime, but the staff were bound by law.
      The trap is treating the home office's assignment as sufficient authority to comply despite that legal constraint.
    weighing: 'The stated legal constraint controls: the staff refused the assignment in peacetime {C1, C2}. Their protests
      and dispatches are consistent with refusal, but are not presented as an independent legal ground {C3}. The balance depends
      on the applicable law binding the staff abroad.'
    tradecraft: Do not comply while the legal constraint applies. Record the legal basis for refusing and communicate the
      refusal through the established channel to the home office; if the law's application is uncertain, seek an authoritative
      legal determination before acting.
    uncertainty: The particular law and its scope are unspecified. The conclusion is limited to the premise that the staff
      were bound by law and therefore refused in time of peace.
    handoff: The staff abroad made the decision and directed objections to the home office. If the applicable legal constraint
      is unclear, involving a competent legal authority would help resolve that question; this additional step is a decision-practice
      recommendation.
    tempting_wrong:
      option: O1
      pull: The assignment came from the home office, which could appear to settle the matter through the chain of command.
      why_wrong: The staff were bound by law while abroad; the assignment did not displace that constraint.
    rejected:
      O1: The staff refused rather than comply because they were bound by law in time of peace.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: An authoritative legal determination established that the assignment was lawful and within the staff's authority.
      then: O1
      why: That would remove the legal constraint underlying the refusal, making compliance available on the stated rationale.
    would_not_change:
    - id: noflip1
      if: The home office restated the assignment as a direct rather than indirect instruction.
      why: A change in the form of the instruction would not, by itself, remove the staff's obligation to act within the law.
    watch_for:
    - id: watch1
      what: Clarification of the law that bound the staff abroad and its application to the assignment.
      favors:
      - O2
      why: The stated reason for refusing turns on that legal constraint.
  lesson: An instruction from a home office does not displace legal limits binding personnel abroad. When law is the reason
    for refusal, compliance must remain subordinate to that constraint.
  limits: The applicable law is not identified, and the account does not establish a general rule for every foreign assignment.
    This reasoning applies to the stated peacetime situation and the premise that the staff were bound by law.
  library:
    domain: intel-oversight
    family: CORPUS-NX-393016ef
    source: https://www.cia.gov/resources/csi/static/254d0fcf7c11fe4b8d144844d9c4e2d7/Review-the-Okhrana.pdf
    episode_focus: The decision was whether to comply with the home office’s indirect assignment or refuse it; the officials
      refused because they were bound by law. Keep the focus on legal authority and compliance, and exclude any operational
      methods of intelligence gathering.
