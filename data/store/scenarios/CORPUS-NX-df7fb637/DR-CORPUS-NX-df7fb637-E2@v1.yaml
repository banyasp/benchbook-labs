case:
  id: DR-CORPUS-NX-df7fb637-E2@v1
  title: Delayed Public Access to the Files
  status: draft
  setting: United States, during arrangements with the Hoover Institution after 1925.
  decider: The ambassador
  agent: The ambassador
  agent_role: decide
  situation: The ambassador had to set terms for public access to files whose custody was being arranged with the Hoover Institution.
    The Bolsheviks had asked for the files in 1925. The files remained intact and were awaiting shipment to the United States.
    The ambassador feared retaliation from the Bolsheviks’ intelligence service, the Cheka. He presumably believed the Cheka
    would seek to kill him if it discovered what he had done with the files.
  question: What should the ambassador do about public access to the files?
  options:
    O1:
      do: The ambassador would withhold public access until three months after his death.
      move: act
      irreversible: false
    O2:
      do: The ambassador would disclose the files to the public immediately.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Bolsheviks asked for the files in 1925.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Bolsheviks described the files as theirs.
  - id: F3
    kind: situation
    status: confirmed
    fact: The files remained intact.
  - id: F4
    kind: situation
    status: confirmed
    fact: The files were awaiting shipment to the United States.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The ambassador feared retaliation from the Bolsheviks’ intelligence service, the Cheka.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Cheka presumably would have sought to kill the ambassador if it discovered what he had done with the files.
  considerations:
  - id: C1
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The ambassador feared Cheka retaliation, so delaying public access protected him from a risk tied to discovery of
      the files.
  - id: C2
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: 'The feared consequence was potentially fatal: the Cheka was presumed likely to seek to kill the ambassador if it
      discovered what he had done.'
  - id: C3
    facts:
    - F3
    equity: public_transparency
    favors:
    - O1
    weight: weak
    why: The files remained intact, so the chosen delay did not itself eliminate the possibility of later public access. This
      is a limited inference from the arrangement, not a separately stated reason for it.
  reasoning:
    read: The decision was about when the public could access the files, not whether to destroy them or resolve the Bolsheviks’
      claim to them. The central trap is to treat the request for files described as theirs as dispositive; the stated reason
      for delaying disclosure was the ambassador’s fear of Cheka retaliation.
    weighing: The ambassador’s concern about retaliation, especially the presumed threat to his life, favored withholding
      access. The files’ intact condition made a delayed release possible without permanently foreclosing public access, but
      the ambassador gave no separate public-interest rationale for immediate disclosure. On the stated reasons, the personal
      risk outweighed immediate access.
    tradecraft: Set out the reason for the restriction, the access date or triggering condition, and the custody terms clearly
      in the agreement. Keep the files intact and ensure the agreed delayed-access condition is followed. These are decision-practice
      recommendations, not terms specified here.
    uncertainty: The threat was feared, and the Cheka’s lethal response was presumed rather than confirmed. The likelihood
      of discovery and whether the risk could be reduced are not established.
    handoff: The ambassador made the access decision through terms agreed with the Hoover Institution. No other decision-maker
      or required approval is identified; the Institution’s role was to hold the files under those terms.
    tempting_wrong:
      option: O2
      pull: Immediate disclosure could seem preferable because the files remained intact and public access would be prompt.
      why_wrong: It would disregard the ambassador’s stated fear that discovery could lead the Cheka to kill him, while the
        chosen arrangement preserved the possibility of later access.
    rejected:
      O2: The ambassador did not choose immediate disclosure because he feared that discovery would expose him to Cheka retaliation,
        potentially a lethal one.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence established that the Cheka could no longer discover the ambassador’s connection to the files or
        retaliate against him.
      then: O2
      why: If the personal danger motivating delayed access were removed, the balance could shift toward immediate public
        access.
    would_not_change:
    - id: noflip1
      if: The Bolsheviks’ description of the files as theirs remained the only additional consideration.
      why: That claim is not identified as the reason for the access restriction; without a change in the stated retaliation
        risk, it would not displace the ambassador’s stated rationale.
    watch_for:
    - id: watch1
      what: Material changes in the assessed likelihood or consequences of Cheka retaliation.
      favors:
      - O1
      - O2
      why: The decision turns on the feared risk to the ambassador; a worsening risk supports delay, while a reliably reduced
        risk could support earlier access.
  lesson: When disclosure could expose a specific person to a serious threat, weigh that risk against the value of immediate
    access. If access can be delayed without destroying the material or permanently foreclosing disclosure, a bounded delay
    may address the danger while preserving later access.
  limits: This reasoning applies to the access restriction described here and the ambassador’s stated fear of Cheka retaliation.
    It does not determine ownership of the files, establish a general rule for archival access, or resolve cases where a binding
    law or authority controls disclosure.
