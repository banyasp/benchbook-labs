case:
  id: DR-CORPUS-NS-a31f944b-E2@v1
  title: Fighting in the East After the War Seemed Hopeless
  status: draft
  setting: The East, 1 May 1945, German Head of State
  decider: The Head of State
  agent: The Head of State
  agent_role: decide
  situation: By April 1945, the military leader knew the struggle was hopeless. On 1 May 1945, he became Head of State. The
    Wehrmacht was fighting in the East, and the Head of State could issue orders to it. The considerations he identified were
    evacuation of the German civilian population and an orderly retreat by the Army from the East. The decision was whether
    fighting in the East should continue or cease.
  question: What should the Head of State do about whether the Wehrmacht continues fighting in the East after he knows the
    struggle is hopeless?
  options:
    O1:
      do: The Head of State orders the Wehrmacht to continue fighting in the East.
      move: act
      irreversible: true
    O2:
      do: The Head of State orders the Wehrmacht to cease fighting in the East.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: By April 1945, the military leader knew the struggle was hopeless.
  - id: F2
    kind: authority
    status: confirmed
    fact: On 1 May 1945, the military leader became Head of State.
  - id: F3
    kind: authority
    status: confirmed
    fact: As Head of State, he could issue orders to the Wehrmacht.
  - id: F4
    kind: situation
    status: confirmed
    fact: The war in the East was the theater at issue.
  - id: F5
    kind: situation
    status: assessed
    fact: The Head of State identified evacuation of the German civilian population as an objective.
  - id: F6
    kind: situation
    status: assessed
    fact: The Head of State identified an orderly retreat from the East by the Army as an objective.
  - id: F7
    kind: situation
    status: assessed
    fact: The Head of State gave civilian evacuation and an orderly Army retreat as his reasons for the orders concerning
      the war in the East.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Knowing the struggle was hopeless weighs against continuing a fight that could no longer achieve its broader military
      purpose.
  - id: C2
    facts:
    - F5
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: The Head of State gave evacuation of the civilian population as a reason to continue; the record identifies that
      objective but does not establish how much continued fighting would help achieve it.
  - id: C3
    facts:
    - F6
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: He also gave an orderly Army retreat from the East as a reason to continue, though the record does not establish
      the necessity or likely effectiveness of continued fighting for that purpose.
  reasoning:
    read: 'This is a choice about continuing the war in the East after the Head of State knew the struggle was hopeless. The
      trap is treating that knowledge as resolving the immediate question: he identified civilian evacuation and an orderly
      Army retreat as purposes for continuing, but the record does not show whether continued fighting was necessary or effective
      for either purpose.'
    weighing: The stated objectives of evacuation and retreat favor O1, while knowledge that the struggle was hopeless weighs
      toward O2. The Head of State chose O1 for those stated reasons. The Tribunal also characterized the evidence as showing
      that he was active in waging aggressive war, but the passage does not separately analyze the legality or necessity of
      this particular East-front order. The balance therefore depends on whether continued fighting could in fact advance
      the evacuation and retreat objectives.
    tradecraft: Before issuing or maintaining the order, identify whether continued fighting is needed to accomplish the stated
      evacuation and retreat objectives, and record the basis for that judgment and when it should be revisited. Do not treat
      the stated objectives alone as proof that continued fighting will achieve them.
    uncertainty: The record gives the Head of State's reasons but does not establish the military or humanitarian circumstances
      affecting their feasibility, the likely consequences of ceasing, or whether another course could achieve the same objectives.
    handoff: The Head of State held authority to issue orders. As a decision practice, he should obtain relevant military
      and civilian assessments of the retreat and evacuation objectives before deciding whether those objectives require continued
      fighting.
    tempting_wrong:
      option: O2
      pull: The struggle was known to be hopeless, which can make immediate cessation seem self-evident.
      why_wrong: That conclusion would disregard the Head of State's stated reasons that continued fighting might permit civilian
        evacuation and an orderly Army retreat; the record does not establish that those concerns had been resolved.
    rejected:
      O2: The Head of State did not choose cessation, giving civilian evacuation and an orderly Army retreat as reasons to
        order continued fighting.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The evacuation and orderly-retreat objectives had already been achieved, or continued fighting could no longer advance
        them.
      then: O2
      why: The stated reasons for continuing would no longer support that course.
    - id: flip2
      if: A feasible alternative could secure the evacuation and orderly retreat without continued fighting.
      then: O2
      why: The stated objectives would not require the more destructive course of continuing to fight.
    would_not_change:
    - id: noflip1
      if: The struggle remained hopeless, while continued fighting was still assessed as necessary to advance the stated evacuation
        and retreat objectives.
      why: Hopelessness alone would not remove the Head of State's stated reasons for continuing.
    watch_for: []
  lesson: A hopeless overall struggle does not, by itself, resolve whether fighting should cease immediately when civilian
    evacuation or an orderly retreat remains at issue. Those objectives must be weighed against the costs of continuing, and
    the decision should turn on whether continued fighting can actually advance them.
  limits: The passage records the Head of State's stated reasons and the Tribunal's broader finding that he was active in
    waging aggressive war; it does not supply a legal test or a separate evaluation of this particular order. This reasoning
    does not establish that continued fighting was lawful, necessary, or effective in the circumstances.
