case:
  id: DR-CORPUS-NS-a31f944b-E1@v1
  title: Warning Policy for Enemy Merchant Ships
  status: draft
  setting: German Navy, waters around the British Isles and the English Channel, 1939.
  decider: The German naval commander
  agent: The German naval commander
  agent_role: decide
  situation: At the start of the war, the German Prize Ordinance served as the German Navy’s guide to submarine warfare and
    was taken almost literally from the Protocol. The naval commander maintained that the Navy remained within international
    law and the Protocol. Existing orders covered attacks on enemy merchant ships in convoy. Reports indicated that British
    merchant ships used wireless to report submarines, were armed, and attacked submarines on sight. The naval commander assessed
    that resistance from enemy merchant ships was to be expected.
  question: 'What should the German naval commander do at the decision point: authorize attacks on all enemy merchant ships
    without prior warning, or decline that authorization and continue to require warning?'
  options:
    O1:
      do: The German naval commander declines authorization for attacks on all enemy merchant ships without prior warning
        and retains the warning requirement.
      move: act
      irreversible: false
    O2:
      do: The German naval commander authorizes attacks on all enemy merchant ships without prior warning and removes the
        warning requirement.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: assessed
    fact: The naval commander maintained that the Navy remained within international law and the Protocol.
  - id: F2
    kind: authority
    status: assessed
    fact: At the start of the war, the German Prize Ordinance served as the guide to submarine warfare and was taken almost
      literally from the Protocol.
  - id: F3
    kind: situation
    status: assessed
    fact: Existing orders directed attacks on enemy merchant ships in convoy.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Reports indicated that British merchant ships used wireless to give information about submarines.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Reports indicated that British merchant ships were armed.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Reports indicated that British merchant ships attacked submarines on sight.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The naval commander assessed that resistance from enemy merchant ships was to be expected.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Reports that British merchant ships used wireless to give information about submarines and were armed supported treating
      them as posing a direct threat, rather than assuming a warning would make an encounter safe.
  - id: C2
    facts:
    - F6
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The reported attacks on submarines on sight led the naval commander to assess that resistance was to be expected;
      that expectation was the stated reason for ordering attacks without warning.
  - id: C3
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The commander framed submarine warfare through the German Prize Ordinance, which he said followed the Protocol almost
      literally, and maintained that the Navy remained within international law. This was his asserted legal basis, not an
      independent determination that the no-warning order was lawful.
  - id: C4
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Orders already covered attacks on enemy merchant ships in convoy, placing the disputed authorization within an existing
      policy of engaging enemy merchant shipping; this context does not itself establish that removing the warning requirement
      was lawful.
  reasoning:
    read: The decision was whether to extend the existing engagement policy from enemy merchant ships in convoy to all enemy
      merchant ships without prior warning. The trap is to treat the commander's assertion that the Navy stayed within the
      law as an independent ruling that this particular extension was lawful.
    weighing: 'The commander’s stated balance favored {O2}: reports described merchant ships using wireless, being armed,
      and attacking submarines on sight, so he assessed resistance as expected {C1} {C2}. He also presented the Prize Ordinance
      and Protocol as the governing framework and pointed to existing orders against enemy merchant ships in convoy {C3} {C4}.
      The choice depends on accepting those reports and that threat assessment; the legal status of the order is not independently
      resolved.'
    tradecraft: At the decision level, record the authority relied on, the reported conduct, the assessment that resistance
      is expected, and the reason for changing the warning policy. Reassess the decision if its factual basis or governing
      authority changes. Do not treat the commander’s assertion of legality as a substitute for an independent legal assessment.
      (Authored synthesis.)
    uncertainty: The commander’s rationale is not an independent legal finding. No competing assessment of the reports is
      given, and it is not established whether the Protocol permitted the no-warning policy.
    handoff: The naval commander is the decision-maker, and no higher approval or consultation is identified as required.
      If the authority to change the policy were uncertain, confirming the applicable delegation would be prudent. (Authored
      synthesis.)
    tempting_wrong:
      option: O1
      pull: Retaining a warning requirement may seem the safer way to honor the stated legal framework.
      why_wrong: In the commander’s stated reasoning, that choice did not address the assessment that armed merchant ships
        were reporting submarines and attacking them, making resistance expected.
    rejected:
      O1: The commander did not retain the warning requirement because he assessed, on the reported conduct, that resistance
        from enemy merchant ships was to be expected.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The reports no longer indicated that enemy merchant ships were armed, used wireless to report submarines, or attacked
        submarines on sight, and resistance was no longer expected.
      then: O1
      why: The stated rationale for removing the warning requirement depended on the assessment that resistance was to be
        expected.
    would_not_change:
    - id: noflip1
      if: The reports and assessment of expected resistance remained as described, with no change in the applicable authority.
      why: Those reports and that assessment are the commander’s stated basis for authorizing attacks without warning.
    watch_for:
    - id: watch1
      what: Whether the reports about merchant ships’ wireless use, armament, and attacks on submarines remain reliable and
        support the assessment that resistance is expected.
      favors:
      - O2
      why: Those reported circumstances and the resulting expectation of resistance are the stated rationale for the policy
        change.
  lesson: When a decision to remove a warning requirement rests on expected resistance, identify the reports supporting that
    expectation and keep the decision tied to that stated basis. A commander’s claim of legal compliance is not, by itself,
    an independent determination that a particular order is lawful.
  limits: This reasoning applies to the described 1939 engagement-policy choice and the naval commander’s stated rationale.
    It does not determine the order’s legal status or address other rules, facts, or circumstances.
