case:
  id: DR-CORPUS-NX-97011d14-E1@v1
  title: Population Protection or Enemy Focus
  status: draft
  setting: Afghanistan, 2009, ISAF/USFOR-A campaign planning
  decider: The ISAF/USFOR-A Commander
  agent: The ISAF/USFOR-A Commander
  agent_role: decide
  situation: The Coalition was losing, and Taliban numbers continued to replenish despite insurgents being killed. An enemy-focused
    approach offered a direct emphasis on finding and eliminating threats, but commanders recognized that it could have consequences
    for the population. The insurgency remained resilient, while Afghan confidence in both the government and the international
    community was in crisis. The national strategy sought to defeat al-Qaeda and transfer responsibility to a capable Afghan
    partner. The Commander faced a choice about whether the campaign should prioritize protecting and gaining support from
    the Afghan population or focus on seizing terrain and destroying insurgent forces.
  question: What should the ISAF/USFOR-A Commander prioritize in the Afghanistan campaign?
  options:
    O1:
      do: The Commander prioritizes protecting the Afghan population and gaining its support in the campaign.
      move: act
      irreversible: false
    O2:
      do: The Commander deprioritizes protecting the Afghan population and prioritizes seizing terrain and destroying insurgent
        forces.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The United States was losing, and killing Taliban did not prevent their numbers from replenishing.
  - id: F2
    kind: situation
    status: assessed
    fact: An enemy-focused approach was understood as directly finding and killing threats, with less regard for the consequences.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A commander assessed that Coalition actions were creating insurgents.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Commander directed a population-centric counterinsurgency approach and improved unity of command and effort.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Commander identified protecting the Afghan people as the objective rather than seizing terrain or destroying
      insurgent forces.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The insurgency was resilient, and a crisis of Afghan confidence in the government and international community undermined
      their credibility.
  - id: F7
    kind: situation
    status: confirmed
    fact: The national strategy aimed to defeat al-Qaeda and prevent its return, while transferring responsibility to a capable
      Afghan partner.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The Commander made protecting the Afghan people the objective and directed a population-centric approach.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Killing insurgents did not stop their numbers from replenishing, and enemy-focused action could disregard consequences
      and create more insurgents.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The resilient insurgency coincided with a crisis of Afghan confidence in both the government and the international
      community, undermining their credibility.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The national strategy included transferring responsibility to a capable Afghan partner, supporting an approach that
      protects the population and addresses confidence in government.
  reasoning:
    read: 'The apparent choice between a direct enemy-focused approach and a population-focused one is misleading: killing
      Taliban did not prevent replenishment, and Coalition actions were assessed as creating insurgents. The real problem
      also included a resilient insurgency and a crisis of Afghan confidence.'
    weighing: The Commander’s stated objective was the Afghan population, not seizing terrain or destroying insurgent forces.
      That judgment is reinforced by the failure of killing alone to prevent replenishment, the risk of worsening the insurgency,
      and the need to restore confidence while pursuing the national strategy. The balance favors {O1}; it depends on treating
      population protection and support as central to the campaign’s purpose, not as secondary to enemy attrition.
    tradecraft: State the population-protection priority and its relationship to the national strategy in the decision record.
      Review the decision against civilian safety, Afghan confidence, and progress toward transferring responsibility; do
      not treat enemy losses alone as evidence of success.
    uncertainty: The record identifies a resilient insurgency and a serious confidence crisis, but does not establish that
      a population-centric approach guarantees success. The source’s judgment is that success remained achievable, while legitimacy
      was not a short-term project.
    handoff: The Commander should make the campaign-priority decision and communicate it through the command structure. Coordination
      with coalition and Afghan partners is appropriate because the stated strategy depends on unity of effort and transfer
      to a capable Afghan partner.
    tempting_wrong:
      option: O2
      pull: Finding and eliminating threats appears to be the more direct response to a resilient insurgency.
      why_wrong: The directness of that approach does not answer why Taliban numbers kept replenishing, and it gives insufficient
        weight to consequences for the population and the risk of creating more insurgents.
    rejected:
      O2: The Commander did not choose to subordinate population protection to seizing terrain or destroying insurgent forces
        because the stated objective was the Afghan population and enemy-focused action risked worsening the problem.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable new evidence showed that prioritizing population protection was itself causing greater danger to the Afghan
        population, while the alternative was necessary to protect that population and advance the national objective.
      then: O2
      why: That changed record could undermine the central premise for O1, though it would not by itself justify disregarding
        civilian safety.
    would_not_change:
    - id: noflip1
      if: The apparent directness of finding and killing threats remained the main argument for an enemy-focused approach.
      why: Directness alone would not overcome the stated concerns that Taliban numbers replenished and Coalition actions
        could create insurgents.
    watch_for:
    - id: watch1
      what: Whether Afghan confidence in the government and the international community improves or continues to be undermined.
      favors:
      - O1
      why: The source identifies the confidence crisis as undermining credibility and makes the population the campaign objective.
  lesson: When enemy losses do not prevent replenishment and actions risk creating more insurgents, do not mistake directness
    for effectiveness. Make population protection and support central when the campaign’s objective and partner transition
    depend on Afghan confidence.
  limits: This reasoning addresses the campaign-priority choice in the stated 2009 setting; it does not establish that population-centric
    priorities guarantee success or resolve every immediate operational decision. It does not assess particular methods of
    carrying out the campaign.
