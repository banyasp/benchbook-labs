case:
  id: DR-CORPUS-NX-095c4441-E1@v1
  title: Germany’s Exclusion-Zone Policy
  status: draft
  setting: Berlin, 4 February 1915, German government
  decider: Berlin
  agent: Berlin
  agent_role: decide
  situation: After months of complaints, efforts to address American arms and supplies reaching Germany’s enemies had produced
    no result. Berlin’s stated aim in considering a response was to stem that flow. The contemplated maritime policy concerned
    an exclusion zone around Great Britain. It would apply to vessels sailing in the zone, including vessels flying neutral
    flags. Berlin faced a choice between adopting that policy and continuing to rely on diplomatic complaints.
  question: What should Berlin do about the proposed exclusion-zone sinking policy?
  options:
    O1:
      do: Berlin permits an exclusion-zone sinking policy for vessels sailing in the zone.
      move: act
      irreversible: true
    O2:
      do: Berlin prohibits an exclusion-zone sinking policy for vessels sailing in the zone.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Germany had made complaints for months about American arms and supplies reaching its enemies.
  - id: F2
    kind: situation
    status: confirmed
    fact: The complaints had been fruitless.
  - id: F3
    kind: situation
    status: confirmed
    fact: The stated aim of a response was to stem the flow of American arms and supplies to Germany’s enemies.
  - id: F4
    kind: situation
    status: confirmed
    fact: The policy decision was made on 4 February 1915.
  - id: F5
    kind: situation
    status: confirmed
    fact: The proposed exclusion zone was around Great Britain.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposed policy covered vessels sailing within the exclusion zone, including vessels flying neutral flags.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Berlin had relied on complaints for months, but they had produced no result; this supported moving away from continued
      reliance on that approach.
  - id: C2
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The complaints were fruitless, so continuing them offered no demonstrated means of addressing the problem.
  - id: C3
    facts:
    - F3
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Berlin's stated aim was to stem the flow of supplies, and the proposed policy applied to vessels sailing in the zone,
      including neutral-flag vessels.
  reasoning:
    read: Berlin faced a choice after months of unsuccessful complaints about supplies reaching its enemies. The stated purpose
      of the proposed policy was to stem that flow. The key limit is that the available account gives this reason for the
      choice but does not assess the policy's legality or discuss the consequences of applying it to neutral-flag vessels.
    weighing: 'The stated balance favors {O1}: complaints had been fruitless, while Berlin wanted to stem the flow of supplies.
      The account does not explain why neutral vessels were included, or give a separate assessment of the risks of that breadth;
      those points cannot be treated as reasons Berlin weighed.'
    tradecraft: At the decision level, record the stated aim, the history and result of the complaints, and the policy's stated
      coverage of neutral-flag vessels. Before implementation, seek legal and diplomatic review of the policy because it concerns
      neutral vessels and international complaints.
    uncertainty: The available account does not identify legal advice, alternatives considered beyond continued complaints,
      or evidence that the policy would achieve its stated aim. It supports the historical choice and its stated rationale,
      not a conclusion that the policy was lawful or effective.
    handoff: Berlin is identified as the decider, but no consultation is specified. As a decision-practice recommendation,
      involve legal and diplomatic advisers because the policy concerns neutral vessels and a response to international complaints.
    tempting_wrong:
      option: O2
      pull: Continuing diplomatic complaints avoids adopting the broader exclusion-zone policy.
      why_wrong: 'That restraint does not answer the stated reason for changing course: complaints had been fruitless, while
        Berlin sought to stem the supplies.'
    rejected:
      O2: Berlin did not continue to rely on diplomatic complaints because they had been fruitless and it chose action aimed
        at stemming the supplies.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Diplomatic complaints had begun producing results sufficient to address the flow of supplies.
      then: O2
      why: A working diplomatic approach would remove the stated reason for abandoning reliance on complaints.
    would_not_change:
    - id: noflip1
      if: The proposed policy's coverage of neutral-flag vessels were emphasized, but there were no new facts showing that
        complaints could work.
      why: That concern is important to assess, but it does not alter the stated rationale; neutral-vessel coverage is not
        discussed as a factor in the decision.
    watch_for:
    - id: watch1
      what: Evidence that the complaints could become effective, or that the policy's neutral-vessel coverage raised material
        legal or policy concerns.
      favors:
      - O2
      why: Either could weaken the stated case for adopting the policy or supply a reason to continue diplomacy instead.
  lesson: When a decision-maker changes course after repeated complaints have failed, distinguish the stated reason for acting
    from any legal or ethical assessment not provided. A policy's reach—including its effect on neutral parties—should be
    assessed explicitly rather than assumed to have been weighed by the decision-maker.
  limits: This rationale does not establish that the policy was lawful, effective, or justified under any governing maritime
    rule. It should not be generalized to cases where diplomatic efforts remain productive or where additional legal and humanitarian
    considerations are documented.
