case:
  id: DR-CORPUS-INC-POLISH-CRISIS-AND-POSSIBLE-MARTIAL-LAW-1-NX-8668b50f-E9@v1
  title: Whether to Move Forces into Poland for a Planned Exercise
  status: draft
  setting: Moscow, December 1980, Soviet political leadership summit
  decider: The Soviet political leadership
  agent: The Soviet political leadership
  agent_role: decide
  situation: The Soviet political leadership is deciding whether to authorize a planned exercise involving forces entering
    Poland. Polish leaders oppose foreign forces on Polish territory and may see their presence as weakening their domestic
    position. The Polish leadership has begun preparing legal measures for martial law amid an acute political crisis, while
    other Warsaw Pact leaders have viewed a Polish Supreme Court ruling as a retreat from prior commitments. Soviet political
    leaders could regard the exercise as pressure on the Polish leadership, while military planners could regard it as a rehearsal.
    The exercise's execution and timing remain subject to a political decision, and Polish leaders seek more time.
  question: What should the Soviet political leadership do about authorizing the movement of forces into Poland for the planned
    exercise?
  options:
    O1:
      do: The Soviet political leadership should authorize movement of forces into Poland and proceed with the planned exercise.
      move: act
      irreversible: false
    O2:
      do: The Soviet political leadership should deny movement of forces into Poland for now and defer the planned exercise.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Moscow knew that Polish leaders were actively preparing martial-law measures but doubted their resolve to implement
      them.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Polish leaders strongly opposed foreign forces entering Poland, including for maneuvers, because they believed it
      could make an indigenous crackdown more difficult.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Polish leaders believed foreign forces could galvanize the opposition, alienate potential supporters, and make a
      crackdown appear to be carried out for Moscow.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Other Warsaw Pact leaders viewed the Polish Supreme Court ruling of 10 November as a capitulation to Solidarity
      and a broken promise.
  - id: F5
    kind: situation
    status: confirmed
    fact: On 26 November, the Polish Politburo directed preparation of draft emergency legislation and government decrees
      banning strikes and assemblies and tightening censorship.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Soviet political leaders could view the exercise as a way to strengthen pressure on Polish leaders, while Soviet
      military planners could view it as a rehearsal.
  - id: F7
    kind: authority
    status: assessed
    fact: The exercise's execution, including its timing, was to be determined by the political leadership.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The target date for bringing forces to full readiness was shortly after the planned political summit.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Polish leaders sought more time before the planned exercise.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Soviets doubted the Polish leadership's resolve, and the Supreme Court ruling was viewed as retreat from prior
      commitments. The exercise could strengthen pressure on Polish leaders, although the preparations for emergency measures
      suggested that pressure was beginning to produce action.
  - id: C2
    facts:
    - F5
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Polish leaders had begun preparing martial-law measures and sought more time. The assessment was that pressure was
      showing results, so the Soviets could grant time without abandoning pressure.
  - id: C3
    facts:
    - F2
    - F3
    equity: third_party_harm
    favors:
    - O2
    weight: strong
    why: Foreign forces entering Poland could make an indigenous crackdown more difficult, galvanize opposition, alienate
      potential supporters, and make Polish leaders appear to be acting for Moscow. Deferring the exercise avoided those added
      political costs and risks.
  - id: C4
    facts:
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: Execution and timing remained for the political leadership to decide, and the readiness target was after the summit.
      That left room to defer while considering the Polish request for more time; this is a decision-authority consideration,
      not a finding of a legal prohibition.
  reasoning:
    read: This was a political choice about whether to put foreign forces on Polish territory, not merely a military exercise.
      The trap was to treat the exercise's pressure value and rehearsal value as requiring immediate execution, despite indications
      that pressure was working and that an early entry could weaken the Polish leaders' ability to manage their own crisis.
    weighing: The Supreme Court ruling and doubts about Polish resolve supported continued pressure {C1}. But the martial-law
      preparations indicated movement, while Polish leaders sought more time {C2}; the assessment judged that the Soviets
      could grant it and defer the risks of moving forces into Poland {C3}. Because the political leadership retained the
      decision and the readiness date was after the summit, deferral was available without surrendering the option to act
      later {C4}. The balance depended on whether pressure continued to produce Polish action.
    tradecraft: Keep authorization and timing with the political leadership, record the assessment that pressure is producing
      results alongside the risks of foreign-force entry, and make clear that deferral is not an irrevocable abandonment of
      the exercise.
    uncertainty: The Soviet leaders' actual commitment to execute the maneuvers remained unclear. The assessment inferred
      that they could defer at that point, while recognizing that the exercise could be reconsidered if needed.
    handoff: The decision belongs to the Soviet political leadership, which held authority over execution and timing. Military
      planners could inform the leadership of the exercise's rehearsal value, but that value does not replace the political
      judgment about whether forces should enter Poland.
    tempting_wrong:
      option: O1
      pull: Authorizing the exercise could intensify pressure on Polish leaders whose resolve was doubted, while also serving
        the military planners' rehearsal purpose.
      why_wrong: Immediate movement risked galvanizing opposition, alienating potential Polish supporters, and making a domestic
        crackdown appear to be carried out for Moscow, even as Polish preparations suggested that pressure was taking effect.
    rejected:
      O1: The leadership did not authorize movement then because pressure appeared to be producing results, while entry risked
        adding political costs and weakening the Polish leadership's position.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Pressure failed to produce the desired results from the Polish leadership.
      then: O1
      why: The assessment identifies that failure as a circumstance in which the exercise could be carried out, making authorization
        more compelling than continued deferral.
    would_not_change:
    - id: noflip1
      if: The only change is that the forces approach the stated readiness date shortly after the summit.
      why: 'Readiness alone would not settle the political choice: execution and timing remained subject to a political decision,
        and the assessment treated implementation as contingent on that decision.'
    watch_for:
    - id: watch1
      what: Whether later developments make reviving the exercise proposal necessary, including whether Polish acquiescence
        gives the Soviets grounds to believe the proposal can be revived.
      favors:
      - O1
      why: The assessment anticipated that the exercise proposal could be revived later if necessary.
  lesson: When pressure appears to be producing the desired political movement, immediate escalation may add costs without
    adding necessary leverage. Deferral can preserve the option to act later while avoiding risks that could undermine the
    local leadership's ability to manage the situation.
  limits: This reasoning applies to the December 1980 choice as assessed, where the Soviet leadership retained control of
    timing and believed Polish preparations showed progress. It does not establish that the Polish measures were lawful, that
    the exercise was legally prohibited, or that deferral would be appropriate if pressure ceased to produce results.
