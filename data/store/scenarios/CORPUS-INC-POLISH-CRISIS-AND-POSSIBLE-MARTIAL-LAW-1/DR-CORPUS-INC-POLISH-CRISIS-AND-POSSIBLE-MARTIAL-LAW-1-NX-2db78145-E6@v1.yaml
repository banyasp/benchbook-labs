case:
  id: DR-CORPUS-INC-POLISH-CRISIS-AND-POSSIBLE-MARTIAL-LAW-1-NX-2db78145-E6@v1
  title: Estimating the Risk of Martial Law
  status: draft
  setting: Poland, late 1981; CIA analytical assessment
  decider: CIA analysts
  agent: CIA analysts
  agent_role: decide
  situation: By late 1981, U.S. analysts had information about the Polish authorities’ intentions and preparations for martial
    law. Reports from September and October described steady progress toward martial law, while other events in Poland also
    appeared relevant to the possibility. Analysts and policymakers considered that the plans might fail and that the authorities
    might therefore refrain from acting. Interpretations of events, including the Solidarity congress, differed. CIA analysts
    also continued to consider the authorities moderate and focused on political solutions, while weighing the possibility
    of Soviet intervention.
  question: What should the CIA analysts do in framing their late-1981 estimate of whether the Polish authorities would impose
    martial law?
  options:
    O1:
      do: The CIA analysts favor an estimate of likely martial law and discount continued political accommodation.
      move: act
      irreversible: false
    O2:
      do: The CIA analysts defer the estimate pending a review of the available evidence.
      move: hold
      irreversible: false
    O3:
      do: The CIA analysts oppose an estimate of likely martial law and favor continued political accommodation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Reports from September and October 1981 highlighted steady progress toward martial law.
  - id: F2
    kind: intelligence
    status: assessed
    fact: A series of conspicuous events in Poland during that period also pointed toward martial law.
  - id: F3
    kind: intelligence
    status: assessed
    fact: By late fall 1981, the CIA had ample information about the Polish authorities’ intentions.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Analysts and policymakers believed there was a serious risk that martial-law plans would fail and that the Polish
      authorities, aware of that risk, would refrain from acting.
  - id: F5
    kind: intelligence
    status: assessed
    fact: One interpretation was that the Solidarity congress had become a rival political force, increasing pressure on the
      authorities; another was that its moderate outcome might briefly delay martial-law plans.
  - id: F6
    kind: intelligence
    status: assessed
    fact: CIA analysts remained inclined to view the Polish authorities as moderates seeking political solutions and to assess
      that they preferred political accommodation.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The CIA’s focus on possible Soviet intervention contributed to discounting the likelihood that Polish authorities
      would impose martial law using their own forces.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Reports highlighted steady progress toward martial law, other conspicuous events pointed in the same direction, and
      the CIA had ample information about the authorities’ intentions. The evidence should not have been discounted as though
      it were too limited to support an estimate.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The belief that plans might fail and that the authorities would therefore refrain from acting was a key reason the
      available information went for naught. Treating perceived risk of failure as evidence of unwillingness to act contributed
      to discounting the martial-law possibility.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: 'The Solidarity congress supported different readings: one increased pressure for martial law, while another suggested
      a possible brief delay. That disagreement counsels against relying on a single event or interpretation and gives some
      support to further review.'
  - id: C4
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The continuing assumption that the regime preferred political accommodation, together with the dominant focus on
      possible Soviet intervention, led analysts to downplay the prospect that Polish authorities would impose martial law
      using their own forces. The resulting accommodation judgment proved erroneous.
  reasoning:
    read: The central problem was not a lack of relevant information but the way analysts interpreted it. The trap was allowing
      a belief in the authorities’ moderation, doubts that the plans could succeed, and attention to Soviet intervention to
      outweigh converging indications of Polish preparations.
    weighing: The reports and other events provided a substantial basis for estimating that martial law was likely {C1}. Concerns
      about failure and the competing readings of the congress warranted qualification, but did not outweigh that record {C2}
      {C3}. The assumption of political accommodation and the focus on Soviet intervention had already contributed to erroneous
      judgments about the Polish authorities’ willingness to act themselves {C4}. The balance therefore favors {O1}, while
      recognizing uncertainty about timing and the interpretation of particular events.
    tradecraft: State the likelihood judgment against the full body of available evidence, distinguish observed preparations
      from interpretations of intent, and address the competing congress interpretations explicitly. Record why doubts about
      success and possible Soviet intervention do not, by themselves, establish that Polish authorities will refrain from
      acting.
    uncertainty: The meaning of particular events was disputed, and the passage does not establish that any single event or
      reporting method would have resolved analysts’ skepticism. The estimate should convey that uncertainty without allowing
      it to obscure the cumulative indications of preparation.
    handoff: CIA analysts should make and explain the estimate, consulting relevant policy officials to test assumptions because
      both analysts and policymakers were skeptical. That consultation should not substitute for the analysts’ responsibility
      to assess the evidence.
    tempting_wrong:
      option: O3
      pull: The authorities were viewed as moderate, and analysts believed the plans might fail or that Soviet intervention
        remained a major concern.
      why_wrong: Those considerations helped produce the erroneous conclusion that the regime preferred political accommodation,
        despite ample information and reports of advancing preparations.
    rejected:
      O2: 'Deferring is not warranted on this record: the CIA already had ample information, and the difficulty was discounting
        it rather than lacking evidence.'
      O3: Opposing a likely-martial-law estimate would repeat the accommodation judgment that the passage identifies as erroneous.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence instead established that the authorities had abandoned the martial-law plans and were pursuing
        political accommodation.
      then: O3
      why: Evidence of abandonment would directly undermine the inference that preparations indicated likely action.
    - id: flip2
      if: The available evidence were materially incomplete or irreconcilable such that the authorities’ intentions could
        not responsibly be estimated.
      then: O2
      why: A genuine evidentiary gap, unlike the discounting described here, could justify deferring the estimate.
    would_not_change:
    - id: noflip1
      if: The congress were read as moderate and as possibly delaying martial-law plans.
      why: That was one recorded interpretation, alongside the view that the congress had become a rival political force and
        increased pressure for martial law; neither interpretation alone displaces the wider record.
    - id: noflip2
      if: Concern about possible Soviet intervention remained prominent.
      why: That focus contributed to analysts downplaying action by Polish forces themselves, rather than justifying dismissal
        of the evidence of Polish preparations.
    watch_for:
    - id: watch1
      what: Evidence that the Polish authorities’ own preparations were advancing or, conversely, had been halted.
      favors:
      - O1
      - O3
      why: The estimate turns on whether Polish authorities were moving toward action themselves, a possibility the Soviet-intervention
        focus tended to obscure.
  lesson: When multiple reports and events point toward an outcome, do not let assumptions about an actor’s moderation or
    doubts about the plan’s success substitute for assessing its willingness to proceed. Competing interpretations should
    be recorded and weighed, but they should not erase the cumulative evidentiary picture.
  limits: This reasoning addresses an intelligence estimate about whether Polish authorities would impose martial law in late
    1981. It does not determine whether martial law was lawful or justified, or resolve any collection, source-handling, or
    operational question.
