case:
  id: DR-CORPUS-INC-POLISH-CRISIS-AND-POSSIBLE-MARTIAL-LAW-1-NX-52315bc7-E2@v1
  title: Whether to Warn Solidarity
  status: draft
  setting: Poland and Washington, before martial law in Poland; U.S. policymakers.
  decider: U.S. policymakers
  agent: U.S. policymakers
  agent_role: decide
  situation: Senior U.S. officials knew of a colonel’s reporting about martial-law planning in Poland. The reporting indicated
    that planning had begun in late 1980 and that the regime intended to crush Solidarity. U.S. policymakers did not regard
    an internal crackdown as likely or feasible, given doubts about the Polish Army’s loyalty. A former Secretary of State
    assessed that a warning might provoke the opposition into suicidal resistance. The U.S. administration had worked to avoid
    a bloodbath in Poland.
  question: What should U.S. policymakers do about warning Solidarity of the possibility of a crackdown?
  options:
    O1:
      do: U.S. policymakers disclose to Solidarity the possibility of a martial-law crackdown.
      move: act
      irreversible: true
    O2:
      do: U.S. policymakers withhold from Solidarity a warning about a possible martial-law crackdown.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: At least 20 senior U.S. officials, including the president and his closest advisers, knew of the colonel’s reporting.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The colonel’s reporting indicated that planning for martial law had begun in late 1980, earlier than the regime
      had admitted.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The colonel’s reporting indicated that the regime had intended to crush Solidarity.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The colonel’s reporting described Soviet pressure on the Polish regime to declare martial law.
  - id: F5
    kind: situation
    status: assessed
    fact: U.S. policymakers did not regard an internal crackdown as likely or feasible, given doubts about the Polish Army’s
      loyalty.
  - id: F6
    kind: situation
    status: assessed
    fact: A former Secretary of State assessed that warning Solidarity could provoke the opposition into suicidal resistance.
  - id: F7
    kind: situation
    status: confirmed
    fact: The U.S. administration at the time, like the preceding administration, had worked to avoid a bloodbath in Poland.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: The reporting indicated that martial-law planning had begun earlier than admitted and that the regime intended to
      crush Solidarity, giving a warning potential value in protecting people from repression.
  - id: C2
    facts:
    - F6
    - F7
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: A former Secretary of State judged that warning could provoke suicidal resistance, while the administration’s stated
      aim was to avoid a bloodbath; withholding was judged less likely to intensify the danger.
  - id: C3
    facts:
    - F5
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: Policymakers did not regard an internal crackdown as likely or feasible because of doubts about the Polish Army’s
      loyalty, reducing the perceived benefit of a warning.
  reasoning:
    read: The reporting described early planning and an intention to crush Solidarity, but policymakers doubted that an internal
      crackdown was likely or feasible. The trap is treating serious intelligence as an automatic reason to warn without weighing
      Haig’s concern that the warning itself could provoke suicidal resistance.
    weighing: The reporting gave a warning potential protective value, but the stated judgment was that the immediate danger
      of provoking suicidal resistance outweighed that benefit, especially given doubts about the Army’s loyalty. Haig would
      have advised against warning even if the White House had known martial law was coming. The balance depends on the assessed
      likelihood of a crackdown and the risk that warning would trigger lethal resistance.
    tradecraft: Record the intelligence assessment separately from judgments about the likelihood of a crackdown and the effects
      of warning. Document the reasons for withholding, the risks considered, and the assumptions that would warrant revisiting
      the decision.
    uncertainty: The reporting indicated planning and regime intent, but policymakers doubted that an internal crackdown was
      likely or feasible. The risk that a warning would provoke suicidal resistance was Haig’s assessment, not a certainty.
    handoff: This consequential judgment belongs at senior policymaking level, with relevant intelligence and foreign-policy
      advisers involved so that the assessment of the threat and the risks of warning are considered together.
    tempting_wrong:
      option: O1
      pull: The reporting indicated that the regime had planned martial law early and intended to crush Solidarity.
      why_wrong: The stated judgment was that a warning could provoke suicidal resistance, and policymakers did not regard
        an internal crackdown as likely or feasible.
    rejected:
      O1: The warning was not chosen because Haig judged that it could incite suicidal resistance, while policymakers did
        not regard an internal crackdown as likely or feasible.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessment changed so that an internal crackdown was likely and feasible, and a warning was not judged likely
        to provoke suicidal resistance.
      then: O1
      why: Those changes would increase the warning’s protective value while reducing the principal stated risk of warning.
    would_not_change:
    - id: noflip1
      if: The White House had known that martial law was coming.
      why: Haig stated that even with that knowledge he would have advised against warning Solidarity.
    watch_for:
    - id: watch1
      what: Changes in the assessment of the Polish Army’s loyalty, the likelihood of an internal crackdown, or the risk that
        warning would provoke suicidal resistance.
      favors:
      - O1
      why: These are the key assumptions underlying the stated judgment against warning.
  lesson: A warning decision should weigh the danger it may help prevent against the danger the warning itself may provoke.
    Revisit the balance when the perceived likelihood of the threat or the assessed consequences of warning change.
  limits: This reasoning does not establish a general rule against warning people of impending repression. It applies to this
    decision as framed, where policymakers doubted the feasibility of a crackdown and a former Secretary of State feared that
    warning could trigger suicidal resistance.
  library:
    domain: intel-analysis
    family: CORPUS-INC-POLISH-CRISIS-AND-POSSIBLE-MARTIAL-LAW-1
    source: https://www.cia.gov/static/9f23f444b10d916fea76e2fe35e710e2/Preparing-for-Martial-Law.pdf
    episode_focus: The decision point is the choice not to warn Solidarity, despite senior US officials knowing about the
      colonel’s reporting and the possibility of a crackdown. The stated concern was that a warning could provoke the opposition
      into suicidal resistance; exclude claims that the United States intended to cause a bloodbath, which the source rejects.
    cues:
