    domain: operational-command
    family: CORPUS-NX-32105ed4
    source: https://www.cia.gov/resources/csi/static/874ecdf03ef9a9bbdb18bc89b46b8192/Intelligence-in-the-War-of-Independence-web.pdf
    episode_focus: The decision point is whether the mission should permit lethal or injurious force, or prioritize capture
      without harm. The stated reason was that public punishment, not killing, was the objective; exclude the mission’s operational
      methods.
