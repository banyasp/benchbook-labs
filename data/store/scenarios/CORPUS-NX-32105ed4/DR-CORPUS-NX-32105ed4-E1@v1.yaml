case:
  id: DR-CORPUS-NX-32105ed4-E1@v1
  title: Capture Without Harm
  status: draft
  setting: September 1780, American military command
  decider: The General
  agent: The General
  agent_role: decide
  situation: In September 1780, the General was considering a secret plan to capture a defector who had turned against the
    American cause. Several earlier special operations to capture him had failed. The proposed mission was to return him to
    American control for public punishment. Prohibiting lethal or injurious force could leave open the possibility that he
    escaped.
  question: What should the General do about lethal or injurious force during the capture mission?
  options:
    O1:
      do: The General should prohibit lethal or injurious force during the mission to capture the defector.
      move: act
      irreversible: false
    O2:
      do: The General should permit lethal or injurious force during the mission to capture the defector.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The defector had turned against the American cause.
  - id: F2
    kind: situation
    status: confirmed
    fact: Several special operations to capture the defector had been mounted, and none had succeeded.
  - id: F3
    kind: situation
    status: confirmed
    fact: In September 1780, an Army major presented a secret capture plan to the General.
  - id: F4
    kind: situation
    status: confirmed
    fact: The plan aimed to return the defector to American control and bring him to the gallows.
  - id: F5
    kind: situation
    status: confirmed
    fact: The General identified public punishment as the sole objective.
  - id: F6
    kind: situation
    status: confirmed
    fact: Prohibiting killing or injury could allow the defector to escape.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The purpose was to return the defector for public punishment; killing him would defeat that stated objective rather
      than accomplish it.
  - id: C2
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The General expressly made public punishment the sole objective and insisted that the defector not be killed or injured
      in carrying out the mission.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: A prohibition on lethal or injurious force could allow the defector to escape, creating a real cost to mission completion;
      the General nevertheless accepted that risk.
  reasoning:
    read: This was a capture mission intended to bring the defector back for public punishment, not a mission to kill him.
      The trap is to treat the risk of escape as permission to use any force that might improve the chance of capture, despite
      the General's stated objective and constraint.
    weighing: The stated purpose and the General's express insistence against killing or injury favor O1. The risk that the
      defector might escape favors O2, but the General accepted that risk because public punishment, not killing, was the
      sole objective.
    tradecraft: State the prohibition and its rationale clearly in the mission authorization, and record that the possibility
      of escape was considered and accepted. Keep the direction at the decision level; do not add operational methods.
    uncertainty: The account gives no estimate of the likelihood of escape or further legal standard. Those details are not
      needed to report the General's stated choice and rationale.
    handoff: The General was the decision-maker and approved the plan with the stated constraint; the account identifies no
      additional approval or consultation requirement.
    tempting_wrong:
      option: O2
      pull: Permitting injury or lethal force could seem more likely to prevent another failed capture or an escape.
      why_wrong: That treats capture at any cost as the objective, whereas the General identified public punishment as the
        sole objective and accepted the escape risk.
    rejected:
      O2: The General did not permit lethal or injurious force because the mission's stated purpose was public punishment,
        and he accepted that restraint could allow escape.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The mission's authorized purpose changed from capture for public punishment to stopping an immediate threat that
        could not be stopped without injurious force.
      then: O2
      why: A materially different urgent purpose could make permission for force relevant to the mission, unlike the purpose
        stated in this decision.
    would_not_change:
    - id: noflip1
      if: The prohibition on killing or injury still carried a risk that the defector would escape.
      why: The General expressly maintained the prohibition even at the risk of allowing escape.
    watch_for: []
  lesson: 'Keep the permitted means tied to the mission''s actual objective: a mission to secure a person for public punishment
    is not a mission to kill that person. A risk of escape may be accepted when the decision-maker has made capture without
    harm the governing constraint.'
  limits: This reasoning addresses the General's stated choice in this capture plan; it does not establish a general rule
    for other missions or resolve situations involving a materially different urgent threat. The account supplies no broader
    legal analysis.
