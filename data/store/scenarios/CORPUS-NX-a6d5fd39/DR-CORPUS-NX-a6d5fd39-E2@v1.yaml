case:
  id: DR-CORPUS-NX-a6d5fd39-E2@v1
  title: CIA Assessment of Foreign Influence
  status: draft
  setting: United States, August 1967, Central Intelligence Agency
  decider: The Director of Central Intelligence
  agent: The Director of Central Intelligence
  agent_role: decide
  situation: In the late 1960s, widespread domestic disorder included demonstrations, campus unrest, and threats and incidents
    involving bombings. The President requested information about possible foreign influence on domestic dissidence. The institutional
    choice was whether the CIA would assess that question or leave evaluation to other agencies. The stated concern was foreign
    connections, although assessing it could involve information about domestic dissident activity. The decision had to fit
    the CIA’s statutory authority and an appropriate level of Agency oversight.
  question: What should the Director of Central Intelligence do about the President’s request for an assessment of foreign
    influence on domestic dissidence?
  options:
    O1:
      do: The Director of Central Intelligence authorizes the CIA to assess foreign influence on domestic dissidence within
        defined limits and regular Agency review.
      move: act
      irreversible: false
    O2:
      do: The Director of Central Intelligence asks the President to clarify the CIA’s authority and oversight arrangements
        before deciding whether to accept the assessment.
      move: ask
      irreversible: false
      to: the President
    O3:
      do: The Director of Central Intelligence prohibits the CIA from taking on the assessment and leaves its evaluation to
        other agencies.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The late 1960s and early 1970s saw widespread domestic disorder, demonstrations, campus unrest, and threats and
      incidents involving bombings.
  - id: F2
    kind: situation
    status: confirmed
    fact: The President made requests for information in response to growing domestic disorder.
  - id: F3
    kind: situation
    status: confirmed
    fact: The proposed assessment concerned whether foreign contacts existed with American dissident groups.
  - id: F4
    kind: capability
    status: assessed
    fact: The FBI collected information but would not evaluate it, and an information base on domestic dissident activity
      was probably necessary to assess foreign connections fairly.
  - id: F5
    kind: authority
    status: assessed
    fact: The CIA’s declared mission of gathering intelligence abroad about foreign influence on domestic dissident activity
      was proper, but some domestic activities exceeded its statutory authority.
  - id: F6
    kind: authority
    status: assessed
    fact: The domestic information accumulated by the CIA exceeded what was reasonably required to assess whether foreign
      connections existed.
  - id: F7
    kind: situation
    status: confirmed
    fact: The operation was insulated from meaningful Agency review, and the absence of regular review prevented timely correction
      of missteps.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The presidential request arose amid widespread disorder and asked about foreign connections with dissident groups,
      giving the proposed assessment a defined public purpose.
  - id: C2
    facts:
    - F3
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The declared mission of gathering intelligence abroad about foreign influence on domestic dissidence was proper;
      the task should therefore be authorized only within that mission.
  - id: C3
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: A domestic information base was probably needed to assess foreign connections fairly, and the FBI collected information
      but would not evaluate it. That supports a limited CIA assessment rather than leaving evaluation entirely elsewhere.
  - id: C4
    facts:
    - F6
    equity: usp_privacy
    favors:
    - O1
    weight: strong
    why: The domestic information accumulated exceeded what was reasonably required for the foreign-connection assessment.
      Any authorization must confine domestic information to what is reasonably needed.
  - id: C5
    facts:
    - F7
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: Isolation from meaningful Agency review allowed the activity to stray beyond its authority, and the lack of regular
      review prevented timely correction. Authorization must include regular review through the Agency's normal chain.
  reasoning:
    read: This is a bounded foreign-influence assessment, not a general CIA mandate to investigate domestic dissent. Domestic
      disorder and a presidential request explain the demand for information, but do not enlarge statutory authority. The
      central trap is treating the need for some domestic context as permission to accumulate domestic information without
      limit.
    weighing: The declared foreign-influence mission was proper, and an information base on domestic dissident activity was
      probably necessary to assess foreign connections fairly {C2} {C3}. But the accumulation exceeded what was reasonably
      required, and domestic activities beyond the foreign-connection inquiry were improper {C4}. The balance supports accepting
      the assessment only with defined limits and regular Agency review {C5}; if the task cannot be kept within those limits,
      the authority rationale for accepting it fails.
    tradecraft: State the foreign-connection purpose and statutory boundary in the authorization, limit domestic information
      to what is reasonably needed for that assessment, and require regular review through the normal Agency chain. Record
      the scope, review responsibility, and any decision to narrow or stop the assessment. These are decision safeguards,
      not collection instructions.
    uncertainty: The conclusion that an information base was probably necessary does not specify a precise threshold for what
      is reasonably required. The authorization should therefore make the foreign-connection purpose controlling and use regular
      review to identify excess or purely domestic material.
    handoff: The Director should make the authorization decision and involve the established Agency supervisory chain in its
      review, because isolation from that chain was identified as a reason the activity exceeded its authority. A presidential
      request supplies the reason for the assessment, not a substitute for statutory authority.
    tempting_wrong:
      option: O3
      pull: Prohibiting CIA involvement avoids the risk of exceeding authority while domestic dissent is at issue.
      why_wrong: That would also abandon a foreign-influence assessment considered proper and probably in need of an evaluative
        information base; the identified problem was excess and inadequate oversight, not the declared mission itself.
    rejected:
      O2: The stated foreign-influence mission was already judged proper, so the better response is to authorize it within
        statutory limits and regular review rather than defer the decision for presidential clarification.
      O3: A blanket prohibition would discard the proper, probably necessary assessment instead of addressing the identified
        failures by limiting domestic information and restoring regular Agency review.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed task could not be confined to assessing foreign connections and instead required the CIA to assess
        purely domestic matters.
      then: O3
      why: Gathering domestic intelligence on strictly domestic matters was beyond CIA authority; a task that necessarily
        crossed that boundary should not be accepted.
    - id: flip2
      if: The Director could not establish meaningful limits or regular Agency review before accepting the task.
      then: O2
      why: Without a reliable way to keep the assessment within authority and correct overreach, the Director should seek
        clarification of authority and oversight arrangements before deciding.
    would_not_change:
    - id: noflip1
      if: Domestic disorder remained widespread and the President continued to request information.
      why: Those circumstances explain the request but do not justify accumulating domestic information beyond what is reasonably
        required or acting outside statutory authority.
    watch_for:
    - id: watch1
      what: Domestic information accumulating beyond what is reasonably required to assess whether foreign connections exist.
      favors:
      - O3
      why: That would reproduce the identified excess; if it cannot be corrected by narrowing the assessment, CIA involvement
        should end.
  lesson: A legitimate national-security question does not create authority to investigate domestic activity without limits.
    When some domestic context is needed for a proper foreign-intelligence assessment, authorize only what is reasonably required
    and provide regular oversight capable of correcting overreach.
  limits: This reasoning applies to the framed decision about assessing foreign influence, not to the operational collection
    activities or dissemination described. It does not establish authority for a different mission or for domestic intelligence
    unrelated to foreign connections.
