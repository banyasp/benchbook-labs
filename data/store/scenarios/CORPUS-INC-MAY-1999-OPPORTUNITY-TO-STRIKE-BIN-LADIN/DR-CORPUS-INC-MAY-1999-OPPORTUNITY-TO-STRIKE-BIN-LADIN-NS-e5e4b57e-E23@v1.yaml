case:
  id: DR-CORPUS-INC-MAY-1999-OPPORTUNITY-TO-STRIKE-BIN-LADIN-NS-e5e4b57e-E23@v1
  title: Kandahar Strike Decision
  status: draft
  setting: Kandahar, May 1999, U.S. administration principals with CIA and military representatives.
  decider: The administration's principals at the strike decision meeting.
  agent: The administration's principals at the strike decision meeting
  agent_role: decide
  situation: CIA reporting placed the al-Qaeda leader in and around Kandahar over five days and nights, and working-level
    officials considered the reporting detailed and actionable. A conflicting report about his whereabouts existed, though
    intelligence experts discounted it. Officials had the capacity to act, but accounts differed about how reliable the intelligence
    was and how much collateral harm was possible. The CIA Director was absent from the principals' meeting, and the Deputy
    Director represented the agency. The administration and the CIA were under intense scrutiny after faulty intelligence
    had led to the mistaken bombing of the Chinese embassy in Belgrade.
  question: What should the administration's principals do about authorizing a strike against the al-Qaeda leader based on
    the information available in May 1999?
  options:
    O1:
      do: The principals decline to authorize a strike against the al-Qaeda leader.
      move: act
      irreversible: false
    O2:
      do: The principals authorize a strike against the al-Qaeda leader now.
      move: act
      irreversible: true
    O3:
      do: The principals request a further CIA assessment and defer the strike decision.
      move: ask
      irreversible: false
      to: the CIA
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: CIA reporting placed the al-Qaeda leader in and around Kandahar over five days and nights and was described by working-level
      officials as detailed and based on several sources.
  - id: F2
    kind: intelligence
    status: assessed
    fact: A conflicting intelligence report concerned the al-Qaeda leader's whereabouts, but working-level experts discounted
      it.
  - id: F3
    kind: capability
    status: assessed
    fact: A senior military officer described the strike capacity as ready and communications as good.
  - id: F4
    kind: intelligence
    status: assessed
    fact: CIA working-level officials were told that the military doubted the intelligence and was concerned about collateral
      damage.
  - id: F5
    kind: intelligence
    status: assessed
    fact: 'Accounts of the intelligence''s reliability differed: a military officer recalled being told the assessment was
      50–50, while the CIA Director later recalled a single uncorroborated source and collateral-damage risk; the Deputy Director
      recalled presenting the intelligence positively with caveats.'
  - id: F6
    kind: authority
    status: assessed
    fact: The CIA Director was apparently absent from the principals' meeting, and the Deputy Director represented the CIA.
  - id: F7
    kind: situation
    status: confirmed
    fact: The administration, and the CIA in particular, were under intense scrutiny and criticism after faulty intelligence
      had led to the mistaken bombing of the Chinese embassy in Belgrade.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Working-level officials regarded the location reporting as unusually detailed and actionable, and a senior military
      officer recalled that the capacity to act was ready. This made the opportunity to disrupt the leader's activity appear
      substantial.
  - id: C2
    facts:
    - F2
    - F5
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: strong
    why: 'The conflicting report was discounted by working-level experts, but accounts differed sharply about the underlying
      intelligence: one recollection put confidence at 50–50, another described a single uncorroborated source, and the Deputy
      Director recalled caveats. That uncertainty weighed against immediate action.'
  - id: C3
    facts:
    - F4
    - F5
    equity: third_party_harm
    favors:
    - O1
    - O3
    weight: strong
    why: Officials were told that the military doubted the intelligence and was concerned about collateral damage. The later
      recollection of collateral-damage risk reinforces that this was a material reason for caution, not merely a dispute
      over whether the opportunity was valuable.
  - id: C4
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O1
    - O3
    weight: weak
    why: The recent mistaken bombing after faulty intelligence may have made officials more cautious. This circumstance is
      relevant context, but does not by itself establish that declining the strike was substantively correct.
  reasoning:
    read: This was a time-sensitive opportunity supported by detailed reporting, but the reported confidence and collateral
      risk were disputed. The trap is to treat either working-level confidence as conclusive or post-error scrutiny as a sufficient
      reason by itself; neither resolves the underlying uncertainty.
    weighing: The detailed reporting and apparent readiness supported authorizing the strike {C1}. Against that stood conflicting
      assessments of reliability and concern about collateral harm {C2} {C3}; the recent intelligence failure may also have
      increased caution, though only as context {C4}. The principals chose not to strike. The balance depends chiefly on how
      much weight is given to the intelligence caveats and possible harm, and officials disagreed about both.
    tradecraft: Record the evidence supporting the opportunity alongside the conflicting reliability assessments and collateral-harm
      concern. Make clear which official is providing the intelligence assessment, who holds decision authority, and why the
      principals chose to decline or defer; preserve material disagreement rather than presenting a single confidence level
      as settled.
    uncertainty: The accounts do not establish a single agreed reliability assessment or a definitive account of who drove
      the decision. The CIA Director was absent, the Deputy Director represented the agency, and working-level officials expressed
      frustration while another account described the decision-maker as acting responsibly.
    handoff: The principals made the decision, with the Deputy Director representing the CIA in the Director's absence. A
      sound process would ensure the agency's assessment and caveats are fully presented while keeping responsibility for
      the decision with the principals.
    tempting_wrong:
      option: O2
      pull: The reporting was detailed, working-level officials considered it actionable, and a military officer believed
        the opportunity was compelling.
      why_wrong: That case for action does not eliminate the conflicting reliability accounts or the stated concern about
        collateral harm; those concerns were central to the decision.
    rejected:
      O2: The principals did not authorize the strike in light of doubts about the intelligence and concerns about collateral
        damage, although working-level officials disputed that judgment.
      O3: The principals chose to stand down rather than defer for another assessment; no separate rationale for rejecting
        deferral is given.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The principals had received substantially stronger, corroborated evidence of the leader's location and a well-supported
        assessment that collateral harm would be low.
      then: O2
      why: Those changes would reduce the principal concerns associated with declining to act, making authorization more supportable.
    would_not_change:
    - id: noflip1
      if: The reporting remained detailed and the capacity to act remained ready, but the conflicting reliability assessments
        and collateral-harm concern were unresolved.
      why: Readiness and apparent opportunity alone would not answer the concerns about the intelligence and possible harm.
    watch_for:
    - id: watch1
      what: Whether the reliability assessment is genuinely shared across the relevant officials, and whether collateral-harm
        concerns remain material.
      favors:
      - O1
      - O3
      why: Officials gave sharply different recollections of the intelligence's reliability, and collateral damage was identified
        as a reason for not striking.
  lesson: A time-sensitive opportunity does not make contested intelligence reliable by itself. Weigh the evidence and potential
    harm directly, and treat institutional scrutiny as relevant context rather than a substitute for that assessment.
  limits: The accounts give competing recollections and do not establish a single definitive rationale for the principals'
    decision. This scenario does not supply a legal standard or establish what collateral harm would actually have occurred.
