case:
  id: DR-CORPUS-NX-d16b8824-E7@v1
  title: Postwar Iranian Strategic Choice
  status: draft
  setting: Iran, after the Iran-Iraq War (1980–1988), post-revolutionary Iranian leadership
  decider: The Iranian leadership
  agent: The Iranian leadership
  agent_role: decide
  situation: After the Iran-Iraq War, the Iranian leadership faced a strategic choice about how to project power. Iran had
    achieved few military successes against a smaller conventional Iraqi Army and had lacked international support during
    the war. Western conventional superiority informed the perceived need for a different approach. One available approach
    was to build partnerships with non-Iranian non-state groups, whose network could impose costs on U.S. regional interests
    without escalating to conventional war. The leadership must determine its postwar strategic approach.
  question: What should the Iranian leadership do about its postwar strategic approach to imposing costs on U.S. regional
    interests?
  options:
    O1:
      do: The Iranian leadership adopts a proxy-partnership strategy as its regional approach.
      move: act
      irreversible: false
    O2:
      do: The Iranian leadership rejects a proxy-partnership strategy and emphasizes conventional military development.
      move: act
      irreversible: false
    O3:
      do: The Iranian leadership holds its strategic choice pending a review of available approaches.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Iran-Iraq War provided the post-revolutionary Iranian leadership with lessons about its military and strategic
      position.
  - id: F2
    kind: capability
    status: confirmed
    fact: Iran had achieved few military successes against a smaller conventional Iraqi Army.
  - id: F3
    kind: situation
    status: confirmed
    fact: Iran lacked global support in fighting the invading Iraqi forces.
  - id: F4
    kind: situation
    status: assessed
    fact: Iranian leaders understood Western conventional superiority as a factor shaping their strategic choices.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Iran Threat Network consists of non-Iranian non-state groups, including Hezbollah in Lebanon, Asa’ib Ahl al-Haq
      in Iraq, and Ansar Allah in Yemen.
  - id: F6
    kind: intelligence
    status: assessed
    fact: From Iran’s perspective, the network could impose costs on U.S. regional interests without escalating the confrontation
      to conventional war.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Members of the network, rather than Tehran, were considered the most likely to strike U.S. or partner military targets.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The war was treated as a lesson in Iran''s strategic position: few successes against a smaller conventional army
      and a lack of international support pointed the leadership toward a different way to project power.'
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The leadership perceived Western conventional superiority, while the non-Iranian proxy network offered, from Iran's
      perspective, a way to impose costs on U.S. regional interests without escalating to conventional war.
  - id: C3
    facts:
    - F6
    - F7
    equity: escalation_control
    favors:
    - O2
    - O3
    weight: weak
    why: 'The assessment that network members, rather than Tehran, were most likely to strike U.S. or partner military targets
      is a caution: proxy activity could still create escalation pressure. This concern does not outweigh the strategic rationale
      for the network.'
  reasoning:
    read: 'This is a postwar choice about how Iran should project power given perceived conventional disadvantages and limited
      international support. The trap is to treat avoiding conventional war as eliminating escalation risk: network members
      were also considered likely to strike U.S. or partner military targets.'
    weighing: 'The stated rationale favors {O1}: the war''s lessons, perceived Western conventional superiority, and the prospect
      of imposing costs without conventional escalation support a different, proxy-based approach {C1} {C2}. The likelihood
      of proxy members striking is a caution, but it does not outweigh that rationale {C3}. The balance depends on the leadership''s
      strategic assessment that this approach can impose costs while avoiding conventional war.'
    tradecraft: Record the choice as a strategic judgment, distinguish confirmed facts from assessments, and state both the
      intended escalation constraint and the assessed possibility of proxy-member strikes. This is decision-level documentation,
      not direction for proxy activities.
    uncertainty: 'The strategic benefit is an assessment, not an established result: the approach might not reliably impose
      costs or prevent escalation. The available facts do not provide a comparison of the alternatives beyond the postwar
      strategic rationale.'
    handoff: The Iranian leadership owns this strategic choice, and no external approval or referral is specified. As a decision-practice
      safeguard, leadership could document the assumptions underlying its strategic judgment; that process is not specified.
    tempting_wrong:
      option: O2
      pull: Conventional military development might appear to address the weakness exposed by the war directly.
      why_wrong: The war's limited success against a smaller conventional force and lack of international support led the
        leadership toward a different way to project power, rather than reliance on conventional development alone.
    rejected:
      O2: The leadership did not make conventional military development its sole postwar approach because the war's results
        and the perceived conventional imbalance led it toward a different strategy.
      O3: The leadership did not hold the choice pending review; the postwar lessons gave rise to the proxy-network approach.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership had reliable grounds to conclude that the proxy-partnership approach could not impose costs without
        escalating the confrontation to conventional war.
      then: O2
      why: That would remove the central stated advantage of the proxy approach and could make conventional development the
        preferable course.
    would_not_change:
    - id: noflip1
      if: Network members remain more likely than Tehran to strike U.S. or partner military targets.
      why: That assessment is a material caution, but by itself it does not displace the stated postwar rationale for adopting
        the network approach.
    watch_for:
    - id: watch1
      what: Whether the assessed likelihood of network members striking U.S. or partner military targets changes the leadership's
        view of escalation control.
      favors:
      - O2
      - O3
      why: A changed assessment could weaken the claimed advantage of imposing costs without conventional escalation.
  lesson: When a conflict exposes limits in conventional capability and outside support, a decision-maker may choose an alternative
    strategy that pursues the objective while constraining escalation. That rationale should be weighed against evidence that
    the alternative itself could create escalation pressure.
  limits: This reasoning captures the strategic rationale attributed to Iran's postwar leadership; it is not a legal or ethical
    endorsement of proxy activity. It does not assess the conduct of proxy groups, the legality of particular actions, or
    the consequences of later events.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-d16b8824
    source: https://api.army.mil/e2/c/downloads/2025/07/10/3af1001b/no-25-897-understanding-irregular-warfare-jul-25.pdf
    episode_focus: The decision point is the leadership’s post-Iran-Iraq War strategic choice, informed by weak results against
      Iraq’s conventional forces and a lack of international support, to develop proxy partnerships that could impose costs
      on U.S. regional interests without escalating to conventional war. Exclude operational decisions by proxy groups and
      the mechanics of their activities.
    cues:
      option_words:
        O2: 12
        O3: 13
        O1: 11
      real_option: O1
      real_to_mean_other_length: 0.88
      real_is_longest: false
      moves:
        O2: act
        O3: hold
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O3: false
        O1: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The Iranian leadership's postwar strategic lesson was that limited success against Iraq's conventional forces and the
  absence of global support called for a different approach to projecting power; the resulting network was intended, from
  Iran's perspective, to impose costs without conventional war.
