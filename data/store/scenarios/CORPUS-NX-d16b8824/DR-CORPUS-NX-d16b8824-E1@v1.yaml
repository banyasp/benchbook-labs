case:
  id: DR-CORPUS-NX-d16b8824-E1@v1
  title: Weapons in an Indirect Support Effort
  status: draft
  setting: Afghanistan, 1986; U.S. foreign-policy decision-making.
  decider: The U.S. decision authority; the office is unspecified.
  agent: The U.S. decision authority; the office is unspecified.
  agent_role: decide
  situation: U.S. policy toward Afghanistan sought to punish Soviet interference in Vietnam and contain further territorial
    expansion. An indirect support effort for the Mujahadin was already under way through Pakistan’s Inter-Services Intelligence.
    The decision is whether to introduce U.S. weapons into that effort or continue assistance without them. Unconventional
    warfare can help address international crises without overt large-scale conventional force, but it carries significant
    risks and failure can have serious political consequences. Relevant considerations include the opposition’s support, its
    plans for a new government, and the presence and influence of radical or extremist elements.
  question: What should the U.S. decision authority do about introducing U.S. weapons into the existing indirect support effort?
  options:
    O1:
      do: The U.S. decision authority declines to introduce U.S. weapons into the existing indirect support effort.
      move: act
      irreversible: false
    O2:
      do: The U.S. decision authority authorizes introducing U.S. weapons into the existing indirect support effort.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: U.S. foreign policy during 1979–1989 focused on punishing the Soviet Union for its interference in Vietnam and containing
      further territorial expansion.
  - id: F2
    kind: situation
    status: confirmed
    fact: U.S. military assistance to the Mujahadin was covert and indirect, and was provided through Pakistan’s Inter-Services
      Intelligence.
  - id: F3
    kind: capability
    status: confirmed
    fact: Unconventional warfare can help resolve international crises without overt large-scale conventional force.
  - id: F4
    kind: situation
    status: confirmed
    fact: Unconventional warfare presents significant risks.
  - id: F5
    kind: situation
    status: assessed
    fact: Failure in unconventional warfare can have significant political consequences.
  - id: F6
    kind: authority
    status: confirmed
    fact: Unconventional warfare requires assessing the depth of support for opposition groups.
  - id: F7
    kind: authority
    status: confirmed
    fact: Unconventional warfare requires assessing opposition groups’ plans for forming a new government, including plans
      to reintegrate former regime elements.
  - id: F8
    kind: authority
    status: confirmed
    fact: Unconventional warfare requires assessing the presence and influence of radical or extremist elements among opposition
      groups.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Introducing the weapons was consistent with the stated strategic aims of punishing Soviet interference and containing
      further territorial expansion.
  - id: C2
    facts:
    - F3
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: Unconventional warfare can help resolve an international crisis without overt large-scale conventional force, supporting
      an indirect option rather than an overt escalation.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    - F7
    - F8
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Because unconventional warfare carries significant risks and failure can have serious political consequences, the
      depth of opposition support, its plans for a new government and reintegration, and extremist influence need assessment.
      The passage provides no findings from those assessments.
  - id: C4
    facts:
    - F2
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: In the Stinger example, support remained covert and indirect, with no deployed conventional or special operations
      forces; the passage judges the political risk acceptable even though the Soviets knew the United States had supplied
      the weapons.
  reasoning:
    read: 'This is a decision about adding weapons to an existing indirect support effort, not about whether to begin overt
      conventional action. The trap is treating indirect support as free of political risk, or treating risk alone as decisive:
      the example says risk was acceptable in its circumstances, while also requiring careful assessment of the opposition.'
    weighing: The strategic aims and the possibility of addressing the crisis without overt large-scale force favor {O2} ({C1},
      {C2}). The risks of failure and the required assessments weigh against authorizing without understanding the opposition's
      support, governing plans, and extremist elements ({C3}). The example nevertheless endorses the introduction as politically
      acceptable because the effort was covert and indirect and involved no deployed conventional or special operations forces,
      despite Soviet awareness ({C4}). The balance therefore supports {O2}, while depending on the assessments called for
      by the passage.
    tradecraft: 'Keep the decision at the policy level: record the strategic rationale, the political-risk judgment, and the
      status and results of the required opposition assessments. Confirm the decision authority and its legal authority before
      acting; the passage does not identify either.'
    uncertainty: The passage gives no results of assessments of opposition support, governing plans, or extremist influence.
      It also does not identify the authorizing office or specify legal authority, so neither can be inferred from this example.
    handoff: The office is unspecified. The decision should go to the designated U.S. decision authority; the relevant assessments
      should inform that decision, but the passage does not name the offices responsible for providing them.
    tempting_wrong:
      option: O1
      pull: Declining could appear safer because unconventional warfare risks failure and political consequences.
      why_wrong: That response would disregard the example's judgment that political risk was acceptable for this covert,
        indirect effort without deployed conventional or special operations forces, even with Soviet awareness.
    rejected:
      O1: The example favors introducing the weapons because the effort's indirect character and absence of deployed conventional
        or special operations forces made its political risk acceptable.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The required assessments showed shallow opposition support, inadequate plans for forming a new government or reintegrating
        former regime elements, or significant radical or extremist influence.
      then: O1
      why: Those findings would make the risks that the passage requires decision-makers to assess materially more concerning;
        declining introduction would be the more prudent judgment.
    - id: flip2
      if: Introducing the weapons would no longer be covert and indirect or would require deploying conventional or special
        operations forces.
      then: O1
      why: The example's acceptable-risk judgment rests on the indirect character of the effort and the absence of deployed
        forces; changing those conditions weakens its rationale.
    would_not_change:
    - id: noflip1
      if: The Soviets knew that the United States had supplied the weapons.
      why: The example expressly treats political risk as acceptable even though the Soviets knew of the supply.
    watch_for:
    - id: watch1
      what: The results of assessments of opposition support, plans for a new government and reintegration, and the presence
        and influence of radical or extremist elements.
      favors:
      - O1
      why: These are required considerations, and unfavorable findings could undermine the basis for judging the political
        risk acceptable.
  lesson: Indirect action may address a crisis without overt large-scale conventional force, but it still carries political
    risk. Weigh that risk against the strategic purpose and the actual conditions of the support effort, and assess opposition
    support, governing plans, and extremist influence before deciding.
  limits: This reasoning concerns the policy choice to introduce weapons into the described indirect support effort. It does
    not establish the legal authority for that choice or apply to circumstances with different strategic aims, support arrangements,
    or assessment findings.
