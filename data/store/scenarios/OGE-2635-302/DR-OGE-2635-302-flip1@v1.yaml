case:
  id: DR-OGE-2635-302-flip1@v1
  title: Rent‑free vacation house use by a new supervisor [flip]
  status: needs_review
  setting: U.S. Department of Homeland Security, present day, federal workplace
  decider: the staff member
  agent: the staff member
  agent_role: decide
  situation: A GS-13 staff member at DHS has been a close personal friend for many years with a neighboring GS-15 employee
    from another agency. Over the years the staff member has let the neighbor's family stay in a vacation cottage without
    charge. The neighbor recently took a position at DHS, but remains a peer—not the staff member's direct supervisor. Agency
    ethics rules allow a gift when a personal relationship justifies it and the recipient is not the employee's official superior,
    or when the giver is the official superior. The rules also forbid a superior from coercing a subordinate to give a gift,
    and during a supervisor-subordinate relationship the employee may not let the superior receive such a gift except as the
    exceptions permit.
  question: Should the staff member keep allowing the neighbor's family to use the vacation cottage rent-free?
  options:
    O1:
      do: The staff member stops allowing the neighbor's family to use the vacation cottage rent-free.
      move: act
      irreversible: false
    O2:
      do: The staff member continues to allow the neighbor's family to use the vacation cottage rent-free.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: A gift is permissible when a personal relationship justifies it and the person receiving the gift is not the employee's
      official superior.
  - id: F2
    kind: authority
    status: confirmed
    fact: A gift is permissible when the employee who gives the gift is the official superior of the recipient.
  - id: F3
    kind: authority
    status: confirmed
    fact: An official superior may not compel a subordinate to provide a gift.
  - id: F4
    kind: situation
    status: confirmed
    fact: The staff member and the neighbor share a long-standing, close personal friendship.
  - id: F5
    kind: situation
    status: confirmed
    fact: The staff member has permitted the neighbor's family to occupy the vacation cottage rent-free.
  - id: F6
    kind: situation
    status: confirmed
    fact: The neighbor remains a peer of the employee and is not the employee's official superior.
  - id: F7
    kind: situation
    status: confirmed
    fact: Because there is no supervisor‑subordinate relationship, the employee may allow the neighbor to use the vacation
      house rent‑free, subject only to the standard gift regulations.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The recipient (the neighbor) is not an official superior, so the personal-relationship exception permits the rent-free
      use as a lawful gift.
  - id: C2
    facts:
    - F1
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: A deep personal friendship satisfies the relationship justification, and because the recipient is not a superior,
      the gift remains permissible.
  reasoning:
    read: The staff member's long-standing friendship with the neighbor justifies the rent-free use of the cottage, and because
      the neighbor is not the staff member's official supervisor, the ethics regulation's personal-relationship exception
      applies.
    weighing: Considerations C1 and C2 both point to the permissibility of the arrangement under the regulation; no remaining
      consideration bars it, so the balance clearly favors continuing the rent-free use.
    tradecraft: The staff member should keep allowing the neighbor's family to stay rent-free, document the arrangement in
      the personal file, and optionally inform the agency ethics office for record-keeping.
    uncertainty: None – the regulatory language directly supports the continuation of the gift in this circumstance.
    handoff: The staff member may decide unilaterally, though a brief notice to the ethics office is advisable for transparency.
    tempting_wrong:
      option: O1
      pull: The desire to avoid any appearance of favoritism or future complications with the new colleague.
      why_wrong: Stopping the rent-free use would unnecessarily forfeit a permissible gift that does not violate any regulation.
    rejected:
      O1: There is no regulatory prohibition because the recipient is not an official superior; ending the arrangement would
        be overly cautious.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: if the colleague were to become the staff member's official supervisor, the personal-relationship exception would
        no longer apply
      then: O1
      why: the gift would then be to an official superior, making it prohibited
    - id: flip2
      if: the agency ethics office issues a binding advisory prohibiting any rent‑free use of personal property by employees
      then: O1
      why: the advisory creates an overriding restriction that supersedes the personal‑relationship exception
    would_not_change:
    - id: noflip1
      if: the supervisor offered to pay market rent for the house
      why: the regulation still bars a superior from receiving a gift, even if compensated, because the gift is the rent-free
        use itself
    watch_for:
    - id: watch1
      what: any request or implied pressure from the supervisor for the rent-free use
      favors:
      - O1
      why: Such coercion would violate the prohibition on a superior coercing a subordinate to offer a gift
  lesson: When no supervisor-subordinate relationship exists, a personal friendship can justify a rent-free use as a permissible
    gift; employees may continue such arrangements under the ethics regulations.
  limits: Applies only to tangible benefits like rent-free use and only to federal employees governed by 5 C.F.R. §2635.302;
    it does not address non-gift interactions or situations where the recipient is an official superior.
