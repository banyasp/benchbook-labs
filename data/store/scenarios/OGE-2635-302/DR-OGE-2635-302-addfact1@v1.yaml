case:
  id: DR-OGE-2635-302-addfact1@v1
  title: Rent‑free vacation house use by a new supervisor [addfact]
  status: needs_review
  setting: U.S. Department of Homeland Security, present day, federal agency
  decider: the staff member
  agent: the staff member
  agent_role: decide
  situation: A GS-13 staff member at DHS has maintained a long-standing, close personal friendship with a former GS-15 colleague
    from another agency. For many years the staff member allowed that colleague's family to occupy a vacation house rent-free.
    The colleague recently accepted a position at DHS and now serves as the staff member's direct supervisor, overseeing the
    staff member's annual performance appraisal and promotion eligibility. Agency ethics rules state that a gift is permissible
    when a personal relationship justifies it and the recipient is not the official superior, or when the giver is the official
    superior. The rules also prohibit a superior from coercing a subordinate to provide a gift, and during a supervisor-subordinate
    relationship the employee may not let the supervisor benefit from such a gift except as expressly permitted.
  question: What course of action should the staff member take regarding the supervisor's family's rent-free use of the vacation
    house?
  options:
    O1:
      do: Terminate the rent-free use of the vacation house by the supervisor's family.
      move: act
      irreversible: false
    O2:
      do: Maintain the rent-free use of the vacation house by the supervisor's family.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: A gift may be accepted when a personal relationship justifies it and the recipient is not the employee's official
      superior.
  - id: F2
    kind: authority
    status: confirmed
    fact: A gift is allowed when the giver is the official superior of the recipient.
  - id: F3
    kind: authority
    status: confirmed
    fact: An official superior may not pressure a subordinate to provide a gift.
  - id: F4
    kind: situation
    status: confirmed
    fact: The staff member and the former colleague share a long-standing, close personal friendship.
  - id: F5
    kind: situation
    status: confirmed
    fact: The staff member has permitted the colleague's family to use a vacation house without charge.
  - id: F6
    kind: situation
    status: confirmed
    fact: The colleague has become the staff member's direct supervisor at DHS.
  - id: F7
    kind: situation
    status: confirmed
    fact: The supervisor conducts the staff member's annual performance appraisal and determines promotion eligibility.
  - id: F8
    kind: situation
    status: confirmed
    fact: While in a supervisor-subordinate relationship, the staff member may not allow the supervisor to use the vacation
      house rent-free, except where the ethics exceptions apply.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    - F6
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The regulation allows a gift only when the recipient is not the employee's official superior; because the supervisor
      now controls the staff member's appraisal and promotion ({F7}), the rent-free use violates that prohibition.
  - id: C2
    facts:
    - F1
    - F4
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Even though a close personal friendship exists, the personal-relationship exception applies only when the recipient
      is not the official superior, which the supervisor is ({F6}).
  - id: C3
    facts:
    - F3
    - F7
    equity: norm_reciprocity
    favors:
    - O1
    weight: weak
    why: A superior may not pressure a subordinate to provide a gift; the staff member's continued allowance could be seen
      as implicit pressure affecting the upcoming appraisal ({F7}).
  - id: C4
    facts:
    - F8
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: The regulation's example expressly bars a supervisor-subordinate gift; the supervisor's authority over performance
      and promotion ({F7}) reinforces that bar.
    rules_out:
    - O2
  reasoning:
    read: The staff member once justified a rent-free vacation house on the basis of a long-standing friendship, but the colleague's
      promotion to direct supervisor now makes the relationship supervisory, and the supervisor also determines the staff
      member's appraisal and promotion ({F7}).
    weighing: Considerations C1, C2, and C4 apply the statutory language that a gift is permissible only when the recipient
      is not the official superior; C3 warns of coercive perception; C5 highlights the conflict of interest created by appraisal
      authority. Together they compel ending the rent-free use.
    tradecraft: The staff member should promptly cease allowing the supervisor's family to stay rent-free, document the decision
      in the personal file, and inform the agency ethics office to obtain written confirmation of compliance.
    uncertainty: None – the combined regulatory language and the supervisor's evaluative role leave no ambiguity.
    handoff: The staff member may act unilaterally, but should copy the ethics official on the termination notice to ensure
      an audit trail.
    tempting_wrong:
      option: O2
      pull: Desire to preserve the personal friendship and avoid tension with the new supervisor.
      why_wrong: Continuing the rent-free use would breach the explicit gift prohibition and create a serious conflict of
        interest.
    rejected:
      O2: Allowing the supervisor's family to stay rent-free constitutes a prohibited gift because the supervisor is the employee's
        official superior and also controls performance appraisal and promotion.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C4
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: the supervisor were not the employee's official superior (e.g., remained a peer)
      then: O2
      why: The personal-relationship exception would apply, making the gift permissible.
    - id: flip2
      if: the personal friendship no longer existed
      then: O2
      why: Without a personal relationship there is no justification for any gift, but the prohibition would be moot because
        no gift would be offered.
    would_not_change:
    - id: noflip1
      if: the supervisor offered to pay market rent for the house
      why: The regulation still bars a superior from receiving a gift, even if compensated, because the rent-free use itself
        is the prohibited benefit.
    watch_for:
    - id: watch1
      what: any request or implied pressure from the supervisor for the rent-free use
      favors:
      - O1
      why: Such coercion would violate the prohibition on a superior coercing a subordinate to provide a gift.
  lesson: A personal friendship does not excuse a prohibited gift to an official superior; when the superior also controls
    performance appraisal and promotion, the conflict of interest is amplified, requiring immediate cessation of the benefit.
  limits: The rule applies to tangible benefits such as rent-free use and is limited to federal employees governed by 5 C.F.R.
    §2635.302; it does not address non-gift interactions or benefits outside the scope of the ethics regulations.
