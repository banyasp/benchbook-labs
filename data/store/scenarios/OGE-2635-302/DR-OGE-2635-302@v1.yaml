case:
  id: DR-OGE-2635-302@v1
  title: Rent‑free vacation house use by a new supervisor
  status: draft
  setting: Department of Homeland Security, present, federal agency
  decider: the employee
  agent: the employee
  agent_role: decide
  situation: A GS‑13 employee of the Department of Homeland Security has been close personal friends for many years with a
    neighbor who was a GS‑15 employee in another agency. During that friendship the GS‑13 employee allowed the neighbor's
    family to use a vacation house rent‑free. The neighbor recently accepted a position at the Department of Homeland Security
    and will serve as the GS‑13 employee's direct supervisor. The applicable ethics regulation permits a gift if a personal
    relationship justifies it and the recipient is not the official superior, or if the giver is the official superior. The
    regulation also states that a superior may not coerce a subordinate to offer a gift and that, during a supervisor‑subordinate
    relationship, the employee may not allow the supervisor to receive such a gift except as permitted by the exceptions.
  question: What should the employee do about allowing the supervisor's family to use the vacation house rent‑free?
  options:
    O1:
      do: The employee stops allowing the supervisor's family to use the vacation house rent‑free.
      move: act
      irreversible: false
    O2:
      do: The employee continues to allow the supervisor's family to use the vacation house rent‑free.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: A gift is permissible if there is a personal relationship that justifies the gift and the recipient is not the official
      superior.
  - id: F2
    kind: authority
    status: confirmed
    fact: A gift is permissible if the employee giving the gift is the official superior of the employee receiving the gift.
  - id: F3
    kind: authority
    status: confirmed
    fact: An official superior may not coerce a subordinate to offer a gift.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee and the neighbor have a long‑standing close personal friendship.
  - id: F5
    kind: situation
    status: confirmed
    fact: The employee has allowed the neighbor's family to use a vacation house rent‑free.
  - id: F6
    kind: situation
    status: confirmed
    fact: The neighbor has become the employee's direct supervisor at the Department of Homeland Security.
  - id: F7
    kind: situation
    status: confirmed
    fact: During the supervisor‑subordinate relationship, the employee may not allow the supervisor to use the vacation house
      rent‑free, except as permitted by the exceptions.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The regulation permits a gift only when the recipient is not the official superior; the supervisor is the employee's
      superior, so the rent‑free use is prohibited.
  - id: C2
    facts:
    - F1
    - F4
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Although a long‑standing personal friendship exists, the exception for personal relationships applies only when the
      recipient is not the official superior, which is not the case here.
  - id: C3
    facts:
    - F3
    equity: norm_reciprocity
    favors:
    - O1
    weight: weak
    why: A superior may not coerce a subordinate to offer a gift; allowing the gift could be perceived as pressure or expectation,
      reinforcing the need to stop it.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: The regulation’s own example states that during a supervisor‑subordinate relationship the employee may not allow
      the supervisor to use the vacation house rent‑free, directly ruling out option O2.
    rules_out:
    - O2
  reasoning:
    read: The employee’s long‑standing friendship once justified a rent‑free vacation house, but once the friend becomes the
      employee’s direct supervisor the relationship changes to a superior‑subordinate one, triggering the gift prohibition
      in 2635.302(b).
    weighing: Considerations C1 and C2 apply the statutory language that a gift is permissible only when the recipient is
      not the official superior; C3 adds the policy against coercion; C4 is a direct regulatory example that bars the gift.
      The balance therefore unequivocally favors stopping the rent‑free use.
    tradecraft: The employee should immediately cease allowing the supervisor’s family to stay rent‑free, document the decision
      in the employee’s personal file, and notify the agency’s ethics office to confirm compliance.
    uncertainty: None – the regulation provides a clear rule for this circumstance.
    handoff: The employee can decide alone, but should inform the agency’s ethics official to ensure the record is complete
      and to obtain any needed guidance.
    tempting_wrong:
      option: O2
      pull: The desire to maintain the personal friendship and avoid awkwardness with the new supervisor.
      why_wrong: Even a well‑intentioned continuation of the gift would violate the explicit prohibition in the regulation.
    rejected:
      O2: The rent‑free use would be a prohibited gift because the recipient is the employee’s official superior, and the
        regulation’s example expressly forbids it.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C4
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: the supervisor were not the employee’s official superior (e.g., remained a peer)
      then: O2
      why: The personal‑relationship exception would then apply, making the gift permissible.
    - id: flip2
      if: the personal friendship no longer existed
      then: O2
      why: Without a personal relationship there is no justification for any gift, but the prohibition would be moot because
        no gift would be offered.
    would_not_change:
    - id: noflip1
      if: the supervisor offered to pay market rent for the house
      why: The regulation still bars a superior from receiving a gift, even if compensated, because the gift is the rent‑free
        use itself.
    watch_for:
    - id: watch1
      what: any request or implied pressure from the supervisor for the rent‑free use
      favors:
      - O1
      why: Such coercion would violate the prohibition on a superior coercing a subordinate to offer a gift.
  lesson: A personal friendship does not excuse a gift to an official superior; federal employees must cease any benefit that
    constitutes a prohibited gift once a superior‑subordinate relationship exists.
  limits: This rule applies only to gifts that are tangible benefits like rent‑free use and does not address non‑gift interactions.
    It is limited to federal employees governed by 5 C.F.R. §2635.302.
