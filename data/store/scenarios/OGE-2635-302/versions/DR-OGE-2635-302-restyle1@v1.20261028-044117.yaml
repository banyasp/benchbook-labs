case:
  id: DR-OGE-2635-302-restyle1@v1
  title: Rent‑free vacation house use by a new supervisor [restyle]
  status: needs_review
  setting: Office of the Department of Homeland Security, current fiscal year, federal bureau
  decider: the staff member
  agent: the staff member
  agent_role: decide
  situation: A GS-13 staffer at DHS has been close personal friends for many years with a neighbor who formerly worked as
    a GS-15 in a different agency. While the friendship endured, the staffer let the neighbor's family occupy a vacation cottage
    without charge. The neighbor has recently taken a position within DHS and will now serve as the staffer's direct supervisor.
    The governing ethics rule allows a gift when a personal relationship justifies it and the recipient is not the official
    supervisor, or when the giver is the official supervisor. The rule also states that a supervisor may not pressure a subordinate
    to provide a gift and that, once a supervisory relationship exists, the subordinate may not permit the supervisor to receive
    such a gift except under the stated exceptions.
  question: How should the staff member proceed regarding the supervisor's family staying in the vacation cottage rent-free?
  options:
    O1:
      do: Terminate the rent-free arrangement for the supervisor's family.
      move: act
      irreversible: false
    O2:
      do: Maintain the rent-free arrangement for the supervisor's family.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: A gift is permissible when a personal relationship justifies it and the recipient is not the employee's official
      supervisor.
  - id: F2
    kind: authority
    status: confirmed
    fact: A gift is permissible when the employee giving the gift is the official supervisor of the employee receiving it.
  - id: F3
    kind: authority
    status: confirmed
    fact: An official supervisor may not coerce a subordinate to provide a gift.
  - id: F4
    kind: situation
    status: confirmed
    fact: The staff member and the neighbor share a long-standing close personal friendship.
  - id: F5
    kind: situation
    status: confirmed
    fact: The staff member has allowed the neighbor's family to use a vacation cottage without charge.
  - id: F6
    kind: situation
    status: confirmed
    fact: The neighbor has become the staff member's direct supervisor at DHS.
  - id: F7
    kind: situation
    status: confirmed
    fact: During a supervisor-subordinate relationship, the employee may not permit the supervisor to use the vacation cottage
      rent-free, except as the exceptions allow.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The rule only authorizes a gift when the recipient is not the official supervisor; because the supervisor now holds
      that role, the rent-free use violates the regulation.
  - id: C2
    facts:
    - F1
    - F4
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Even though a deep personal friendship exists, the personal-relationship exception applies solely when the recipient
      is not the official supervisor, which is not the case here.
  - id: C3
    facts:
    - F3
    equity: norm_reciprocity
    favors:
    - O1
    weight: weak
    why: A supervisor is prohibited from pressuring a subordinate to give a gift; allowing the rent-free stay could be seen
      as implicit pressure, supporting a halt to the arrangement.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: The regulation's illustrative example expressly states that, once a supervisory relationship exists, the employee
      may not let the supervisor use the vacation cottage rent-free, thereby eliminating option O2.
    rules_out:
    - O2
  reasoning:
    read: The staffer's long-standing friendship once justified the rent-free cottage, but the friend's promotion to direct
      supervisor transforms the relationship into a supervisory one, activating the gift prohibition in 5 C.F.R. §2635.302(b).
    weighing: Considerations C1 and C2 invoke the statutory language that a gift is allowed only when the recipient is not
      the official supervisor; C3 adds the anti-coercion policy; C4 provides a direct regulatory illustration that bars the
      gift. Together they overwhelmingly support ending the rent-free use.
    tradecraft: The staff member should promptly cease permitting the supervisor's family to stay rent-free, record the action
      in the personal file, and advise the agency's ethics office to verify compliance.
    uncertainty: None – the regulation offers a clear directive for this scenario.
    handoff: The staff member may act independently, but should notify the ethics official to create a complete record and
      obtain any further guidance.
    tempting_wrong:
      option: O2
      pull: The wish to preserve the personal friendship and avoid tension with the new supervisor.
      why_wrong: Even a well-meaning continuation would breach the explicit prohibition in the ethics rule.
    rejected:
      O2: Allowing the rent-free stay would constitute a prohibited gift because the recipient is the staff member's official
        supervisor, and the regulation's example directly forbids it.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C4
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: the supervisor were not the staff member's official supervisor (e.g., remained a peer)
      then: O2
      why: The personal-relationship exception would then apply, rendering the gift permissible.
    - id: flip2
      if: the personal friendship had ended
      then: O2
      why: Without a personal relationship there is no justification for any gift, but the prohibition would be irrelevant
        because no gift would be offered.
    would_not_change:
    - id: noflip1
      if: the supervisor offered to pay market rent for the cottage
      why: The rule still bars a supervisor from receiving a gift, even if compensated, because the rent-free use itself is
        the gift.
    watch_for:
    - id: watch1
      what: any request or implied pressure from the supervisor for the rent-free stay
      favors:
      - O1
      why: Such coercion would violate the prohibition on a supervisor pressuring a subordinate to provide a gift.
  lesson: A personal friendship does not excuse a prohibited gift to an official supervisor; federal employees must discontinue
    any benefit that qualifies as a gift once a supervisory relationship is established.
  limits: This principle applies only to tangible benefits such as rent-free use and does not cover non-gift interactions.
    It is confined to federal employees governed by 5 C.F.R. §2635.302.
