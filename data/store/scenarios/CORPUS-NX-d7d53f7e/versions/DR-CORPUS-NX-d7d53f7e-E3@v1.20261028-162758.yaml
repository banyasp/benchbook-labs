case:
  id: DR-CORPUS-NX-d7d53f7e-E3@v1
  title: Proceed, Postpone, or Discontinue
  status: draft
  setting: Burma campaign, at the time of the planned operation, Allied military command
  decider: The senior commander responsible for the operation
  agent: The senior commander responsible for the operation
  agent_role: decide
  situation: A photograph had revealed an obstruction at one planned site. The other planned sites were clear. The senior
    commander had no evidence that the opposing force had learned of the operation, and did not regard the obstruction as
    proof that it had. He assessed that there was a grave risk, but not a certainty of disaster. Another clear site was available
    for the affected force. Postponement or cancellation could jeopardize the wider Burma campaign.
  question: What should the senior commander do about the operation after learning that one planned site is obstructed?
  options:
    O1:
      do: The senior commander should continue the operation with the affected force reassigned to another clear site.
      move: act
      irreversible: true
    O2:
      do: The senior commander should discontinue the operation, including the affected force's planned participation.
      move: act
      irreversible: true
    O3:
      do: The senior commander should postpone the operation and reassess whether the affected force can proceed.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: A photograph showed an obstruction at one planned site.
  - id: F2
    kind: situation
    status: confirmed
    fact: The other planned landing sites were clear of obstructions.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The senior commander did not believe the obstruction was evidence that the opposing force had learned of the operation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The senior commander assessed a grave risk, but not a certainty of disaster.
  - id: F5
    kind: situation
    status: assessed
    fact: Postponing or canceling the operation could jeopardize the push into northern Burma and the wider Burma campaign.
  - id: F6
    kind: situation
    status: confirmed
    fact: An alternative clear site was available for the affected force.
  - id: F7
    kind: situation
    status: confirmed
    fact: The senior commander was told that responsibility for the decision was his.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The obstruction was real, but the senior commander did not regard it as evidence that the opposing force had learned
      of the operation; it therefore did not establish that continuing would expose the whole operation.
  - id: C2
    facts:
    - F4
    equity: own_force_life
    favors:
    - O3
    - O2
    weight: weak
    why: The risk was grave and warranted serious weight for the safety of personnel, but the senior commander assessed that
      disaster was not certain.
  - id: C3
    facts:
    - F2
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The other sites were clear and an alternative was available for the affected force, so the obstruction did not require
      abandoning that force's participation or the operation.
  - id: C4
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Postponement or cancellation could jeopardize the push into northern Burma and the wider campaign, making continuation
      important to the mission beyond this one obstacle.
  reasoning:
    read: This was a serious, localized obstacle, not proof that the opposing force knew of the operation. The trap is to
      treat a grave risk as either certainty of disaster or as a reason to disregard the risk; the other sites and the available
      alternative allowed the commander to address the obstruction without abandoning the wider operation.
    weighing: The grave risk to personnel weighed toward caution {C2}, but the commander did not assess disaster as certain.
      The obstruction did not establish that the opposing force had learned of the operation {C1}, and the clear alternative
      site made continuation feasible {C3}. Against those points, postponement or cancellation could put the wider campaign
      in jeopardy {C4}. The balance therefore favored continuing with the affected force reassigned; it depended on the assessment
      that the obstruction was not evidence of enemy awareness and that a clear alternative remained available.
    tradecraft: 'Record the basis for proceeding: the confirmed obstruction, the assessment that it did not show the opposing
      force knew of the operation, the remaining clear site, the grave but non-certain risk, and the campaign consequences
      of delay or cancellation. Make clear that the senior commander accepted responsibility for the decision and communicate
      the reassignment to those carrying it out.'
    uncertainty: The commander acknowledged a grave risk, not a certainty of disaster. The decision rested on an assessment
      about what the obstruction did and did not show, rather than certainty that the operation was safe.
    handoff: The decision remained with the senior commander, who was told the responsibility was his {F7}. Coordination on
      the changed plan could support execution, but should not obscure who made the judgment.
    tempting_wrong:
      option: O3
      pull: Postponement appears to offer a cautious response to a grave risk.
      why_wrong: 'The source''s balance did not treat the risk as certain disaster: the obstruction was not taken as evidence
        that the opposing force had learned of the operation, a clear alternative was available, and postponement could jeopardize
        the wider campaign.'
    rejected:
      O2: Discontinuing the operation was not chosen because the obstruction did not establish that the opposing force knew
        of it, a clear alternative was available, and cancellation could jeopardize the wider campaign.
      O3: Postponing was not chosen because the senior commander judged the risk grave but not a certainty of disaster and
        assessed that the operation could proceed using the available alternative.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The senior commander had credible evidence that the opposing force had learned of the operation.
      then: O3
      why: That would undermine the key assessment that the obstruction did not indicate the operation had been compromised,
        and would make a pause to reassess more compelling.
    - id: flip2
      if: The assessed risk became a certainty of disaster rather than a grave but uncertain risk.
      then: O3
      why: The source's stated balance depended on the absence of certainty of disaster; certainty would substantially change
        the weight of the danger to personnel.
    would_not_change:
    - id: noflip1
      if: The obstruction at one site remained, while the other sites were clear and the affected force still had an alternative.
      why: That is the localized problem the commander faced; by itself it did not defeat the stated reasons for continuing.
    watch_for: []
  lesson: A serious obstacle does not by itself establish that an operation is compromised or that it must be abandoned. Weigh
    the uncertainty and danger against feasible alternatives and the consequences of delay, and make the decision at the level
    of risk the evidence supports.
  limits: This reasoning applies where the obstacle does not establish adversary awareness, an alternative remains available,
    and delay or cancellation carries significant mission consequences. It should not be carried over unchanged if the evidence
    indicates compromise, the risk becomes near-certain disaster, or no viable alternative remains.
  library:
    domain: operational-command
    family: CORPUS-NX-d7d53f7e
    source: https://www.cia.gov/resources/csi/static/d5fa5c7cd1dd486c957be8ca25699811/Development-of-British-American.pdf
    episode_focus: The choice was whether to postpone or cancel the operation, or proceed despite the newly discovered risk
      and alter the plan for the affected force. The account cites the absence of evidence that the enemy had learned of the
      operation, the availability of other clear sites, and the consequences for the wider campaign; exclude the operational
      details of the insertion.
