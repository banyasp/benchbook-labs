        O2: 11
      real_option: O3
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O3: act
        O2: hold
      real_move: act
      irreversible_flags:
        O1: false
        O3: false
        O2: false
    equities: pilot2
