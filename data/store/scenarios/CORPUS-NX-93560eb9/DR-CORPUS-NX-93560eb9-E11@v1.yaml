case:
  id: DR-CORPUS-NX-93560eb9-E11@v1
  title: POW Treatment and Article 5 Tribunal
  status: draft
  setting: Following capture during an international armed conflict, within the detaining power and before a competent tribunal
    determines status.
  decider: The detaining power
  agent: The detaining power
  agent_role: decide
  situation: During an international armed conflict, the detaining power has captured an individual who committed a belligerent
    act. The detaining power doubts whether the individual is entitled to POW status or treatment and does not wish to treat
    the individual as a POW. The status question concerns facts and circumstances for a competent tribunal to review. The
    decision arises after capture and before the individual’s status has been determined. Military exigencies may affect whether
    a tribunal can be convened, and the individual must be treated humanely.
  question: What should the detaining power do about POW treatment and convening an Article 5 tribunal?
  options:
    O1:
      do: The detaining power provides POW treatment pending status determination and declines to convene an Article 5 tribunal
        if military exigencies prevent it.
      move: act
      irreversible: false
    O2:
      do: The detaining power provides POW treatment pending status determination and convenes an Article 5 tribunal within
        a reasonable time.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The setting is an international armed conflict, and the individual has committed a belligerent act.
  - id: F2
    kind: situation
    status: confirmed
    fact: The detaining power has doubt about whether the captured individual is entitled to POW status or treatment.
  - id: F3
    kind: situation
    status: confirmed
    fact: The detaining power wishes not to treat the captured individual as a POW.
  - id: F4
    kind: authority
    status: confirmed
    fact: When status or treatment is in doubt, POW treatment is required until a competent tribunal determines the individual’s
      status.
  - id: F5
    kind: authority
    status: confirmed
    fact: An Article 5 tribunal reviews the facts and circumstances to determine the individual’s status.
  - id: F6
    kind: authority
    status: confirmed
    fact: When the detaining power has doubt and wishes not to provide POW treatment, an Article 5 tribunal should be convened
      within a reasonable time following capture.
  - id: F7
    kind: authority
    status: confirmed
    fact: The detaining power may decline to convene a tribunal only if military exigencies prevent it.
  - id: F8
    kind: authority
    status: confirmed
    fact: The individual must be treated humanely at all times.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    equity: duty_to_individual
    favors:
    - O1
    - O2
    weight: strong
    why: Because entitlement to POW status or treatment is in doubt, POW treatment must continue until a competent tribunal
      determines status.
  - id: C2
    facts:
    - F5
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The tribunal reviews the facts and circumstances, and when the detaining power has doubt but wishes not to provide
      POW treatment, it should convene the tribunal within a reasonable time.
  - id: C3
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Declining to convene is permitted only if military exigencies prevent it; absent a basis to apply that exception,
      the stated course is to convene.
  - id: C4
    facts:
    - F8
    equity: duty_to_individual
    favors:
    - O1
    - O2
    weight: strong
    why: Whatever the status determination or tribunal decision, the individual must be treated humanely at all times.
  reasoning:
    read: 'This is an international armed conflict, and the detaining power both doubts POW entitlement and wishes not to
      provide POW treatment. The trap is treating the choice as either withholding POW treatment or convening a tribunal:
      POW treatment is required pending the status determination, and the tribunal is the ordinary means to resolve the doubt.'
    weighing: The interim-treatment rule applies while status is unresolved {C1}. The tribunal should then review the facts
      and circumstances within a reasonable time {C2}. Military exigencies are a narrow exception to convening, not a general
      reason to omit the tribunal {C3}; the stated facts do not establish that exigencies prevent it. Humane treatment remains
      required regardless {C4}.
    tradecraft: Provide POW treatment pending the competent tribunal's determination. Convene the tribunal within a reasonable
      time; if relying on military exigencies to decline, identify and record how they prevent convening. Maintain humane
      treatment throughout.
    uncertainty: The facts do not establish whether military exigencies actually prevent convening. That condition matters
      to the exception; the mere possibility that exigencies may affect the decision does not establish that the exception
      applies.
    handoff: The detaining power must decide whether military exigencies prevent convening. A competent tribunal must determine
      the individual's status by reviewing the facts and circumstances.
    tempting_wrong:
      option: O1
      pull: Military exigencies may affect whether the tribunal can be convened.
      why_wrong: On the stated facts, exigencies are only a possibility, not a reason established to prevent convening; the
        ordinary rule is to provide POW treatment pending status determination and convene within a reasonable time.
    rejected:
      O1: It is not chosen because the facts do not establish that military exigencies prevent convening, while the doctrine
        directs convening within a reasonable time in the ordinary case.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Military exigencies prevent the detaining power from convening a tribunal.
      then: O1
      why: The doctrine permits the detaining power to decline to convene only when military exigencies prevent it; POW treatment
        still continues pending determination.
    would_not_change:
    - id: noflip1
      if: A competent tribunal later determines that the individual is not entitled to POW status or treatment.
      why: That later determination does not change the requirement to treat the individual humanely at all times, nor does
        it alter the need to resolve the current doubt through a tribunal before status is determined.
    watch_for:
    - id: watch1
      what: Whether military exigencies actually prevent convening a tribunal.
      favors:
      - O1
      why: That is the stated condition under which the detaining power may decline to convene.
  lesson: When POW status or treatment is in doubt after capture in an international armed conflict, provide POW treatment
    until a competent tribunal determines status. If the detaining power wishes not to treat the person as a POW, convene
    the tribunal within a reasonable time unless military exigencies prevent it; humane treatment remains required throughout.
  limits: This reasoning addresses the stated case of a person who committed a belligerent act during an international armed
    conflict, where the detaining power has doubt and wishes not to provide POW treatment. It does not determine the individual's
    ultimate status or extend the Article 5 requirement to cases the doctrine treats differently, such as a non-international
    armed conflict or a case in which the detaining power has no doubt.
