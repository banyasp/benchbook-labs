case:
  id: DR-CORPUS-NX-93560eb9-E3@v1
  title: Whether to Submit Additional Protocol I
  status: draft
  setting: United States, January 1987, the President and the Senate
  decider: The President
  agent: The President
  agent_role: decide
  situation: Additional Protocol I is a treaty concerning the conduct of hostilities during international armed conflict.
    The United States signed it in 1977 but had not ratified it. The President faced a choice between submitting it to the
    Senate for advice and consent to ratification and withholding it from submission. The Administration had serious objections
    to several provisions, including Articles 1(4), 43(1), and 44(3). It also recognized meritorious elements and positive
    provisions that could provide humanitarian benefit if generally observed by parties to international armed conflicts.
  question: What should the President do about submitting Additional Protocol I to the Senate for advice and consent to ratification?
  options:
    O1:
      do: The President withholds Additional Protocol I from submission to the Senate for advice and consent to ratification.
      move: act
      irreversible: false
    O2:
      do: The President submits Additional Protocol I to the Senate for advice and consent to ratification.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Additional Protocol I was adopted in 1977 and contains rules on the conduct of hostilities during international
      armed conflict.
  - id: F2
    kind: situation
    status: confirmed
    fact: The United States signed Additional Protocol I in 1977 but had not ratified it.
  - id: F3
    kind: situation
    status: assessed
    fact: The United States expressed the view that Additional Protocol I was fundamentally and irreconcilably flawed.
  - id: F4
    kind: situation
    status: assessed
    fact: The United States had major objections to certain provisions, including Articles 1(4), 43(1), and 44(3).
  - id: F5
    kind: situation
    status: assessed
    fact: The United States also recognized that Additional Protocol I contained certain meritorious elements.
  - id: F6
    kind: situation
    status: assessed
    fact: The United States would support positive provisions of the Protocol that could provide real humanitarian benefit
      if generally observed by parties to international armed conflicts.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Administration considered the Protocol fundamentally and irreconcilably flawed and had major objections to several
      provisions, including Articles 1(4), 43(1), and 44(3). Those treaty-level concerns supported withholding it rather than
      seeking ratification.
  - id: C2
    facts:
    - F5
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: The Protocol also contained meritorious provisions that could provide real humanitarian benefit if generally observed.
      That benefit counted in favor of ratification, but the President's stated choice shows it did not overcome the serious
      objections. Civilian life is the closest available equity for the stated humanitarian benefit.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The President's choice reflects an overall assessment of a Protocol with both positive elements and provisions the
      Administration considered seriously flawed. The recognized merits did not lead the Administration to submit the treaty
      for advice and consent.
  reasoning:
    read: The decision was whether the President should submit a signed but unratified treaty to the Senate, not whether the
      Protocol had any humanitarian value. The trap is to treat recognized merits as resolving the separate, serious objections
      to provisions the Administration regarded as fundamentally and irreconcilably flawed.
    weighing: The humanitarian merits favored submission {C2}, but the Administration's fundamental objections and its major
      concerns about particular provisions weighed more heavily {C1}. The resulting presidential judgment was to withhold
      the Protocol from submission, notwithstanding its positive elements {C3}. The stated humanitarian benefit depended on
      general observance by parties to international armed conflicts.
    tradecraft: State the reasons for withholding at the treaty level, identify the provisions that prompted major objections,
      and distinguish those objections from the provisions recognized as beneficial. Preserve the President's expressed support
      for positive provisions rather than implying that withholding the treaty rejected every humanitarian principle in it.
    uncertainty: The source identifies the overall assessment, examples of provisions objected to, and the recognized humanitarian
      merits, but does not explain the detailed grounds for each objection or provide a provision-by-provision comparison.
    handoff: The President made the submission decision. The Senate's advice and consent would become relevant if the treaty
      were submitted; the source does not describe a Senate decision on this Protocol.
    tempting_wrong:
      option: O2
      pull: The Protocol contained provisions the United States regarded as meritorious and potentially capable of real humanitarian
        benefit.
      why_wrong: Those benefits were acknowledged, but the President's stated decision was that the serious objections to
        the Protocol as a whole warranted not submitting it.
    rejected:
      O2: The President did not submit the Protocol because the Administration's serious objections outweighed the recognized
        humanitarian merits.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Before the submission decision, the Administration's serious objections to the provisions it considered fundamentally
        flawed were satisfactorily resolved.
      then: O2
      why: With the stated treaty-level objections resolved, the recognized humanitarian merits could support submitting the
        Protocol for Senate advice and consent.
    would_not_change:
    - id: noflip1
      if: The Protocol's positive provisions remain potentially beneficial if generally observed, while the Administration's
        serious objections remain unresolved.
      why: The source records those merits alongside the serious objections, and the President nevertheless chose not to submit
        the Protocol.
    watch_for:
    - id: watch1
      what: Whether the positive provisions would be generally observed by parties to international armed conflicts.
      favors:
      - O2
      why: The stated prospect of real humanitarian benefit was expressly conditional on general observance.
  lesson: A treaty's recognized humanitarian value does not by itself settle whether to seek ratification when the decision-maker
    considers other provisions fundamentally flawed. Weigh the treaty as a whole, state both the objections and the merits
    accurately, and make clear which concerns control the submission decision.
  limits: This reasoning concerns the 1987 presidential choice whether to submit Additional Protocol I to the Senate. It does
    not determine the legal status or later application of individual Protocol provisions, or address later operational decisions.
  library:
    domain: natsec-other
    family: CORPUS-NX-93560eb9
    source: https://digitalcommons.unl.edu/cgi/viewcontent.cgi?context=usarmyfieldmanuals&article=1049
    episode_focus: The decision point is the 1987 choice between seeking ratification and withholding the treaty, weighing
      objections to provisions the Administration considered seriously flawed against the protocol’s humanitarian elements.
      Exclude later operational application of individual protocol provisions.
