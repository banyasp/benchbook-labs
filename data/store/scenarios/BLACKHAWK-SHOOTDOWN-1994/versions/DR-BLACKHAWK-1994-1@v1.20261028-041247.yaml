    domain: military-operational
    family: BLACKHAWK-SHOOTDOWN-1994
    source: https://www.govinfo.gov/content/pkg/GAOREPORTS-OSI-98-4/html/GAOREPORTS-OSI-98-4.htm
    episode_focus: Whether the lead fighter pilot should engage two helicopters after a single visual pass, with no consistent
      electronic response, and without reporting the unidentified contact to the airborne command element, or hold fire and
      seek confirmation.
