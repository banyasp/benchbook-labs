        O2: ask
        O3: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
        O3: true
verdict_tier: source-endorsed
basis: The Aircraft Accident Investigation Board President concluded that the lead pilot’s misidentification and the chain
  of events led to the shootdown, implicitly affirming the pilot’s decision to engage.
