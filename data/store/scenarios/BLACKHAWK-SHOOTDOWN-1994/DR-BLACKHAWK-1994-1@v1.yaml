case:
  id: DR-BLACKHAWK-1994-1@v1
  title: Engagement Decision Over Unidentified Helicopters
  status: draft
  setting: TAOR, Iraq, 14 April 1994, Operation Provide Comfort air operations
  decider: the lead F-15 pilot
  agent: the lead F-15 pilot
  agent_role: decide
  situation: Two Army Black Hawk helicopters carrying military officers, Kurdish representatives, and a U.S. political advisor
    were flying eastward in the TAOR after departing Zakhu. An AWACS aircraft over Turkey was monitoring the area and knew
    the helicopters were in the vicinity. Two F-15 fighters were conducting a sanitizing patrol and were not briefed on the
    friendly helicopters, nor did they receive a positive electronic identification response. The helicopters could not hear
    the radio exchange between the fighters and the AWACS because they were on a different frequency. The lead F-15 pilot
    performed a single visual identification pass and misidentified the Black Hawks as hostile Hind helicopters, while the
    wingman did not confirm a positive ID. The lead pilot then fired a missile at one helicopter and the wingman fired at
    the other, resulting in the loss of all aboard.
  question: What should the lead F-15 pilot do after a single visual identification pass with no consistent electronic response
    and without having reported the contact to the airborne command element?
  options:
    O1:
      do: The lead F-15 pilot withholds fire and seeks AWACS confirmation
      move: act
      irreversible: false
    O2:
      do: The lead F-15 pilot fires missiles at the helicopters
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two Army Black Hawk helicopters were transporting military officers, Kurdish representatives, and a U.S. political
      advisor in the TAOR on 14 April 1994.
  - id: F2
    kind: situation
    status: confirmed
    fact: The AWACS was over Turkey providing airborne threat warning and control and was aware of the helicopters' departure
      and location.
  - id: F3
    kind: situation
    status: confirmed
    fact: Two F-15 fighters were sanitizing the area and were unaware of the helicopters' presence, receiving no advisory
      about friendly aircraft.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The F-15 pilots reported unknown radar contacts to the AWACS but did not obtain positive or consistent electronic
      identification responses from the helicopters.
  - id: F5
    kind: situation
    status: confirmed
    fact: The helicopters were on a different radio frequency and could not hear the transmissions between the F-15 pilots
      and the AWACS.
  - id: F6
    kind: situation
    status: confirmed
    fact: The lead F-15 pilot performed a single visual identification pass and misidentified the Black Hawks as Iraqi Hind
      helicopters.
  - id: F7
    kind: situation
    status: confirmed
    fact: The wingman did not confirm a positive identification when asked by the lead pilot.
  - id: F8
    kind: situation
    status: confirmed
    fact: The lead pilot fired a missile at the trailing helicopter and the wingman fired a missile at the lead helicopter,
      killing all 26 individuals aboard.
  - id: F9
    kind: authority
    status: confirmed
    fact: Airspace Control Order required pilots to report unidentified contacts to the airborne command element aboard the
      AWACS.
  considerations:
  - id: C1
    facts:
    - F9
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Airspace Control Order explicitly required reporting unidentified contacts to the AWACS; the pilots failed to do
      so, violating the authority governing engagement.
  - id: C2
    facts:
    - F4
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: No positive or consistent electronic identification was obtained and a single visual pass at speed and altitude cannot
      reliably establish friendly markings; engaging would risk non‑combatant lives.
  - id: C3
    facts:
    - F7
    - F6
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The wingman did not confirm a positive ID when asked, indicating a breakdown in the required confirmation process
      before use of force.
  - id: C4
    facts:
    - F8
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The result of firing was the death of 26 persons, including non‑combatants, demonstrating the grave consequence of
      proceeding without verification.
  reasoning:
    read: The lead pilot faced an unidentified contact after a single, high‑speed visual pass that did not yield a reliable
      identification, while the required electronic response was absent and the pilot had not reported the contact to the
      airborne command element as mandated.
    weighing: The chain of failures—lack of clear responsibility, misidentification, and the wingman’s failure to confirm—combined
      with the explicit Airspace Control Order requirement to report, outweigh any perceived urgency to engage. Therefore
      the prudent course is to withhold fire and obtain confirmation before any weapons release.
    tradecraft: The pilot should immediately cease any weapons employment, radio the AWACS to request positive identification,
      and await a command decision before re‑engaging. All communications and actions must be logged for later review.
    uncertainty: While the pilots may have believed the helicopters hostile, the absence of electronic ID and the inability
      to see markings created high uncertainty that required additional verification.
    handoff: The decision to engage must be escalated to the airborne command element (AWACS) and, if necessary, to the higher‑level
      Operations Provide Comfort commander before any weapons release.
    tempting_wrong:
      option: O2
      pull: A perceived urgent threat and the desire to protect the airspace prompted the pilot to fire immediately.
      why_wrong: Engaging without reporting and without positive identification violated the Airspace Control Order and the
        Board’s finding that such haste led to fratricide.
    rejected:
      O2: Not chosen because the pilot had not reported the contact as required and lacked a reliable positive identification,
        making engagement unlawful and contrary to the Board’s conclusions.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A consistent positive electronic identification response from the helicopters had been received
      then: O2
      why: With a reliable IFF lock the pilots would have satisfied the positive‑identification requirement, removing the
        primary reason to withhold fire.
    would_not_change:
    - id: noflip1
      if: The pilot continued to lack any positive identification after reporting to the AWACS
      why: Even with command awareness, the lack of positive ID still mandates restraint under the Airspace Control Order.
    watch_for:
    - id: watch1
      what: Improved coordination and clear responsibility assignments among Operation Provide Comfort units
      favors:
      - O1
      why: When responsibilities are unambiguous, pilots are more likely to follow reporting procedures and avoid premature
        engagement.
  lesson: Never engage an unidentified aircraft without a positive identification and without first reporting the contact
    to the airborne command element; clear responsibility and communication are essential to prevent fratricide.
  limits: This rule applies to air‑to‑air engagements governed by an Airspace Control Order and similar ROE. It does not extend
    to situations where a clear, imminent threat is established by other authorized means.
