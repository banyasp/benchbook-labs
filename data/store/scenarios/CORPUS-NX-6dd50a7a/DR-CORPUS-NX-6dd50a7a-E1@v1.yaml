case:
  id: DR-CORPUS-NX-6dd50a7a-E1@v1
  title: Setting a Soviet ICBM Capability Planning Date
  status: draft
  setting: United States intelligence estimate, 1959, assessing Soviet initial operational capability for planning.
  decider: The intelligence estimative body issuing the estimate
  agent: The intelligence estimative body issuing the estimate
  agent_role: decide
  situation: The estimative body must choose a planning date for Soviet initial operational capability amid uncertainty over
    whether capability might already exist or arrive in 1959. The Soviet test program is assessed as orderly, while test activity
    is lower than expected. The available evidence does not establish whether series production has begun, and production
    lead times bear on when capability might follow. One group of offices assesses that capability will probably occur in
    the first half of 1960, while allowing that it could occur in late 1959. The evidence does not support a precise date,
    but planners need a usable assumption.
  question: What should the intelligence estimative body do about the planning date it assigns to Soviet initial operational
    capability?
  options:
    O1:
      do: The intelligence estimative body should hold the planning assumption without selecting a single initial operational
        capability date.
      move: hold
      irreversible: false
    O2:
      do: The intelligence estimative body should defer the planning assumption to an initial operational capability in the
        first half of 1960.
      move: act
      irreversible: false
    O3:
      do: The intelligence estimative body should advance the planning assumption to an initial operational capability by
        1 January 1960.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: An earlier estimate judged an initial operational capability with 10 prototype ICBMs probable during 1959 and a
      limited capability in 1958 possible but unlikely.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The 1959 test program was assessed as orderly and as effectively testing a complete ICBM system.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The rate and number of ICBM test firings were lower than expected by that time.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Periods of test activity and inactivity did not provide sufficient evidence to determine whether the program had
      suffered a setback.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The available hard evidence did not establish whether series production of ICBMs had begun.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Soviet statements during the winter of 1958–1959 about series production were consistent with a decision to begin
      production before all technical aspects had been demonstrated.
  - id: F7
    kind: capability
    status: assessed
    fact: Production lead times were estimated at about 12–18 months, and the USSR was assessed to have had sufficient time
      to begin producing series-built missiles.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The evidence was insufficient to support a precise estimate of the initial operational capability date.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Several offices assessed that initial operational capability would probably occur in the first half of 1960, with
      a possibility of occurrence in late 1959.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The orderly program and lower-than-expected test activity weighed against assuming an unusually early capability;
      the observed pauses did not establish that a setback had occurred.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Although hard evidence did not establish that series production had begun, Soviet statements were consistent with
      beginning production before all technical aspects were demonstrated, and the estimated lead time left sufficient time
      for production to have started.
  - id: C3
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The evidence did not support a precise date, but the estimate judged a small series-produced capability imminent
      and chose a usable planning assumption rather than treating date uncertainty as a reason to leave planning undated.
  - id: C4
    facts:
    - F2
    - F3
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Several offices assessed that capability would probably occur in the first half of 1960, while allowing a late-1959
      possibility, based on the orderly program and lower-than-expected firing activity.
  reasoning:
    read: The issue is a planning assumption under uncertainty, not a claim that the exact date of actual capability is known.
      The trap is to treat either the earlier 1959 estimate or the lack of a precise date as conclusive, despite the newer
      evidence and the need for a usable planning date.
    weighing: The orderly test program and below-expected activity made an early, rushed capability less likely, supporting
      the later estimate held by several offices. But the main estimate also judged an early prototype capability extremely
      unlikely, considered production before full technical demonstration plausible, and assessed that lead times allowed
      series missiles to be available soon. Balancing those considerations, it judged capability at least imminent and directed
      planners to assume it by 1 January 1960. The balance depends on the inference that production could have begun despite
      the absence of hard confirmation.
    tradecraft: State 1 January 1960 as a planning assumption, not as a precisely established date of actual capability. Preserve
      the evidentiary basis, the uncertainty about production, and the differing office view in the estimate so planning users
      can distinguish the assumption from confirmed fact.
    uncertainty: The evidence did not establish whether series production had begun, and the test-activity pattern did not
      establish a program setback. The estimate therefore could not support a precise IOC date; the first-half-of-1960 assessment
      with a late-1959 possibility remained a recorded alternative.
    handoff: The issuing estimative body should make and communicate the planning judgment, while retaining the alternative
      office assessment for planning users; the cited reasons do not require a separate authority to select the date.
    tempting_wrong:
      option: O2
      pull: It reflects the view of several offices and takes seriously the orderly program and lower-than-expected test activity.
      why_wrong: The main estimate judged a small series-produced capability at least imminent and, despite being unable to
        specify the actual date, expressly chose 1 January 1960 as the planning assumption.
    rejected:
      O1: The evidence did not justify a precise actual date, but the estimate still selected a usable planning assumption
        rather than leaving the date unassigned.
      O2: The first-half-of-1960 view was a genuine alternative, but the main estimate's overall judgment was that capability
        was at least imminent and should be assumed by 1 January 1960.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable additional evidence established that production could not have begun early enough for an IOC by 1 January
        1960.
      then: O2
      why: That would undercut the production-lead-time inference supporting an imminent capability and make the later planning
        assumption more appropriate.
    would_not_change:
    - id: noflip1
      if: Test activity continued to show pauses without evidence establishing that the program had suffered a setback.
      why: Pauses alone were insufficient to establish a setback, so they would not overturn the overall planning judgment.
    - id: noflip2
      if: The evidence remained insufficient to identify a precise IOC date.
      why: The estimate selected a planning date despite acknowledging that the evidence could not establish a precise actual
        date.
    watch_for:
    - id: watch1
      what: New evidence clarifying whether series production had begun and whether production lead times still supported
        an imminent capability.
      favors:
      - O3
      - O2
      why: Confirmation that production had begun would reinforce the imminent-capability inference; evidence that it had
        not begun early enough would favor the later assumption.
  lesson: When a decision requires a planning date, uncertainty about the exact event date does not necessarily justify leaving
    the plan undated. Make the assumption that best fits the full evidence, and clearly distinguish it from confirmed fact
    and from significant alternative assessments.
  limits: This reasoning applies to choosing a planning assumption from the evidence available at the time; it does not establish
    the actual historical IOC date. A materially different assessment of production timing or capability would require reconsidering
    the assumption.
