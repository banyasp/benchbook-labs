verdict_tier: source-endorsed
basis: The estimate's main body judged a Soviet IOC with a few series-produced ICBMs at least imminent and stated that, for
  planning purposes, it should be considered to have occurred by 1 January 1960; several offices instead assessed that it
  would probably occur in the first half of 1960, with a late-1959 possibility.
