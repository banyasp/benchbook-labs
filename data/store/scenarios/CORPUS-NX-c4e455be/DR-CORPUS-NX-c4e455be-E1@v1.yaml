case:
  id: DR-CORPUS-NX-c4e455be-E1@v1
  title: Sanitizing Records for Disclosure
  status: draft
  setting: Agency records review concerning the Guatemalan Revolution of 1954; the review period is unstated.
  decider: The reviewers
  agent: The reviewers
  agent_role: decide
  situation: A news service has requested records related to the Guatemalan Revolution of 1954, in which the Agency is alleged
    to have played a significant role. Identifying and retrieving the relevant documents has been difficult. Reviewers have
    found that source-identifying information appears in the documents, and most cannot be declassified as presented. Many
    papers can be sanitized, and that approach could meet much of the news service's request.
  question: What should the reviewers do with the news service's request for records?
  options:
    O1:
      do: The reviewers disclose sanitized records from the request and withhold the remainder.
      move: partial
      irreversible: true
    O2:
      do: The reviewers withhold every record covered by the news service's request from disclosure.
      move: act
      irreversible: false
    O3:
      do: The reviewers disclose every record covered by the news service's request to the news service.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A major news service requested records related to the Guatemalan Revolution of 1954.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Agency is alleged to have played a significant role in the Guatemalan Revolution.
  - id: F3
    kind: situation
    status: confirmed
    fact: Identifying and retrieving the relevant documents was difficult.
  - id: F4
    kind: situation
    status: confirmed
    fact: The relevant documents identified sources of information.
  - id: F5
    kind: situation
    status: assessed
    fact: Reviewers assessed that most of the documents could not be declassified as presented.
  - id: F6
    kind: capability
    status: confirmed
    fact: Many of the papers could be sanitized.
  - id: F7
    kind: capability
    status: assessed
    fact: Sanitizing many papers could meet a larger part of the requester's needs.
  considerations:
  - id: C1
    facts:
    - F4
    equity: source_protection
    favors:
    - O2
    - O1
    weight: strong
    why: The documents identify information sources, which is the stated reason the reviewers could not declassify most of
      them as presented.
  - id: C2
    facts:
    - F6
    - F7
    equity: public_transparency
    favors:
    - O1
    - O3
    weight: strong
    why: Sanitization makes it possible to meet much of the news service’s request without releasing the records as presented.
  - id: C3
    facts:
    - F5
    - F6
    equity: classification_integrity
    favors:
    - O2
    - O1
    weight: strong
    why: The reviewers assessed that most records could not be declassified as presented, supporting withholding those records
      while allowing sanitized papers to be released.
  reasoning:
    read: This is a records-disclosure decision where the request can be substantially answered, but the records as presented
      identify sources. The trap is treating the choice as either disclose everything or withhold everything, despite the
      reviewers’ finding that many papers can be sanitized.
    weighing: 'Source protection weighs against releasing the records as presented {C1, C3}. The ability to sanitize many
      papers and thereby meet much of the request weighs against withholding everything {C2}. The reviewers’ stated balance
      is partial disclosure: release sanitized papers and withhold the remainder.'
    tradecraft: Separate papers that can be sanitized from those that cannot be declassified as presented; document the source-identification
      concern and the basis for withholding the remainder. Confirm that released versions no longer identify sources.
    uncertainty: The source does not specify which records were sanitized, what the sanitization removed, or the review period.
      The outcome rests on the reviewers’ assessment that many papers could be sanitized and that this would meet much of
      the request.
    handoff: The reviewers made the decision. The source does not identify another approving office; involve one only if the
      reviewers lack authority to decide or need a further review of whether sanitization protects sources.
    tempting_wrong:
      option: O2
      pull: Withholding every record avoids disclosing information that identifies sources.
      why_wrong: It disregards the finding that many papers could be sanitized to meet much of the request.
    rejected:
      O2: The reviewers did not withhold everything because many papers could be sanitized to meet much of the request.
      O3: The reviewers did not disclose every record because most could not be declassified as presented due to source-identifying
        information.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reviewers found that none of the papers could be sanitized to protect source-identifying information.
      then: O2
      why: Without a safe subset to release, the stated basis for partial disclosure would no longer apply.
    - id: flip2
      if: Reviewers found that every requested record could be sanitized while protecting source-identifying information.
      then: O3
      why: The source-protection concern would no longer require withholding any part of the request.
    would_not_change:
    - id: noflip1
      if: Identifying and retrieving the documents remained difficult.
      why: That difficulty is reported as context, but the stated disclosure decision turns on source-identifying information
        and the availability of sanitization.
    watch_for:
    - id: watch1
      what: Whether a proposed sanitized version still identifies information sources.
      favors:
      - O2
      why: If sanitization does not protect the identified sources, the basis for releasing that paper is undermined.
  lesson: When requested records identify sources, do not assume the only choices are full disclosure or blanket withholding.
    Release what can be sanitized to meet the request while withholding records that cannot be declassified as presented.
  limits: This reasoning applies to the stated records review and its findings about source identification and sanitization.
    It does not establish a general disclosure rule or resolve cases where sanitization cannot protect sources or other interests
    are involved.
