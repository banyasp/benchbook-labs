  id: DR-CORPUS-NX-07fc75ae-E1@v1
  title: Vietnam’s Film Screening Decision
  status: draft
  setting: Vietnam; time unspecified; deciding institution unspecified.
  decider: Vietnam; the specific deciding office is not identified.
  agent: Vietnam
  agent_role: decide
  situation: Abominable was being shown in theatres in Vietnam. The film included a map image. That image was viewed as undermining
    Vietnam’s sovereignty claim. Vietnam faced a choice about whether the film should remain in theatres.
  question: What should Vietnam do about Abominable’s theatrical screening in Vietnam?
  options:
    O1:
      do: Vietnam keeps Abominable in its theatres.
      move: act
      irreversible: false
    O2:
      do: Vietnam withdraws Abominable from its theatres.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The film was titled Abominable.
  - id: F2
    kind: situation
    status: confirmed
    fact: Abominable was being shown in theatres in Vietnam.
  - id: F3
    kind: situation
    status: confirmed
    fact: The film included a map image.
  - id: F4
    kind: situation
    status: assessed
    fact: The map image was viewed as undermining Vietnam’s sovereignty claim.
  - id: F5
    kind: situation
    status: confirmed
    fact: Vietnam had a sovereignty claim implicated by the map image.
  - id: F6
    kind: situation
    status: confirmed
    fact: The matter concerned Abominable’s theatrical screening in Vietnam.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The map image was viewed as undermining Vietnam’s sovereignty claim, giving a direct reason to withdraw the film.
  - id: C2
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The source characterizes withdrawal as the only recourse in response to the image’s perceived effect on the sovereignty
      claim.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Withdrawal further justified the Chinese perspective by highlighting the image as a problem warranting drastic action.
  reasoning:
    read: The decision concerned a film screening in Vietnam and a map image viewed as undermining Vietnam’s sovereignty claim.
      The trap is that withdrawing the film could address the perceived sovereignty concern while also making the image appear
      to merit a drastic response.
    weighing: The source calls withdrawal the only recourse given the image’s perceived effect on Vietnam’s sovereignty claim
      {C1} {C2}. It also recognizes that withdrawal further justified the Chinese perspective {C3}. Despite that downside,
      its stated characterization of withdrawal as the only recourse supports {O2}.
    tradecraft: The source does not specify implementation steps or a recording process. Any record of the decision should
      distinguish the assessment that the image undermined the sovereignty claim from the acknowledged consequence of withdrawal.
    uncertainty: The source does not identify the deciding office, state a legal standard, or explain how the image was assessed.
      The reasoning here is limited to its stated characterization of the perceived sovereignty concern and the consequence
      of withdrawal.
    handoff: The source does not identify a specific office or consultation process, so no particular authority or handoff
      can be attributed.
    tempting_wrong:
      option: O1
      pull: Keeping the film in theatres would avoid the drastic action that the source says further justified the Chinese
        perspective.
      why_wrong: That concern is real, but the source still characterizes withdrawal as the only recourse to the image’s perceived
        undermining of Vietnam’s sovereignty claim.
    rejected:
      O1: The source does not choose to keep the film in theatres, despite recognizing that withdrawal further justified the
        Chinese perspective.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The map image were not viewed as undermining Vietnam’s sovereignty claim.
      then: O1
      why: Without the stated sovereignty concern, the source’s reason for calling withdrawal the only recourse would no longer
        apply.
    would_not_change:
    - id: noflip1
      if: Withdrawal still further justified the Chinese perspective by highlighting the image as a problem warranting drastic
        action.
      why: The source identifies that downside while still characterizing withdrawal as the only recourse.
    watch_for:
    - id: watch1
      what: Whether the map image is viewed as undermining Vietnam’s sovereignty claim.
      favors:
      - O2
      why: That assessment is the stated basis for describing withdrawal as the only recourse.
  lesson: When an image is viewed as undermining a sovereignty claim, assess the response against that concern while also
    accounting for whether the response itself gives the opposing perspective greater justification. A recognized downside
    does not erase the source’s stated reason for choosing withdrawal, but it should remain explicit in the balance.
  limits: This reasoning applies only to the source’s account of Vietnam’s withdrawal of this film over the map image and
    its perceived effect on a sovereignty claim. It does not establish a general legal rule for film screenings, identify
    a deciding office, or resolve other sovereignty disputes.
