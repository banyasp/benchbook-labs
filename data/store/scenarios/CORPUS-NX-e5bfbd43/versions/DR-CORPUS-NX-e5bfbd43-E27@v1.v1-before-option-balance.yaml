case:
  id: DR-CORPUS-NX-e5bfbd43-E27@v1
  title: Choosing a Soviet Strategic Policy
  status: draft
  setting: Soviet Union, during the period of the strategic buildup and SALT, Soviet leadership
  decider: The Soviet leadership
  agent: The Soviet leadership
  agent_role: decide
  situation: The Soviet leadership is considering preemption, launch-on-warning, and retaliation, while a sudden first-strike
    strategy is outside the options under consideration. Preemption is presented as desirable in Soviet military writings,
    though those discussions do not address U.S. early-warning systems and massive retaliatory capabilities. The option carries
    immense risks, and practical adoption is judged unlikely. Launch-on-warning has apparently been considered but is rarely
    mentioned; it may have psychological value for deterrence, while raising command-and-control concerns and risks associated
    with launch authority. Retaliation is a declared strategy frequently advocated by senior party and government officials.
    A strategic buildup has made retaliation credible, and the leadership's stated assumptions include catastrophic consequences
    for both states and a retaliatory capacity surviving a first attack.
  question: What should the Soviet leadership choose among preemption, launch-on-warning, and retaliation as its strategic
    policy?
  options:
    O1:
      do: The Soviet leadership adopts retaliation as its declared strategic policy.
      move: act
      irreversible: false
    O2:
      do: The Soviet leadership rejects retaliation and adopts launch-on-warning as its strategic policy.
      move: act
      irreversible: false
    O3:
      do: The Soviet leadership rejects retaliation and adopts preemption as its strategic policy.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The Soviet leadership has considered preemption, launch-on-warning, and retaliation, excluding a sudden first-strike
      strategy.
  - id: F2
    kind: situation
    status: assessed
    fact: Soviet military writings often present preemption as a desirable strategic option.
  - id: F3
    kind: capability
    status: assessed
    fact: Discussions of preemption do not address U.S. early-warning systems and massive retaliatory capabilities.
  - id: F4
    kind: situation
    status: assessed
    fact: Preemption involves immense risks, and the Soviet leadership probably would not translate the theoretical concept
      into a practical option.
  - id: F5
    kind: situation
    status: assessed
    fact: Launch-on-warning has apparently been considered but is rarely mentioned, and may have psychological value in reinforcing
      deterrence.
  - id: F6
    kind: authority
    status: assessed
    fact: Launch-on-warning would present command-and-control problems, and the Soviet leadership is unlikely to delegate
      launch authority or accept the risks of accidental or unauthorized launch.
  - id: F7
    kind: situation
    status: assessed
    fact: Retaliation is the oldest declared Soviet strategy and the strategy most frequently advocated by top party and government
      officials.
  - id: F8
    kind: authority
    status: assessed
    fact: Statements about preemption and launch-on-warning have not come from the upper levels of the civilian leadership.
  - id: F9
    kind: capability
    status: assessed
    fact: The Soviet strategic buildup over the past decade has made retaliation a thoroughly credible doctrine.
  - id: F10
    kind: situation
    status: assessed
    fact: The leadership's assumptions include that both countries possess enough nuclear weapons to cause worldwide catastrophe,
      that a side attacked first would retain a retaliatory force capable of annihilating the attacker's homeland, and that
      war between the countries would be disastrous for both.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Although military writings present preemption as desirable, they do not account for U.S. warning systems and massive
      retaliatory capabilities. The assessment judges the risks immense and practical adoption unlikely.
  - id: C2
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Launch-on-warning may reinforce deterrence psychologically, but it raises command-and-control problems and risks
      accidental or unauthorized launch. The leadership is judged unlikely to delegate launch authority or accept those risks.
  - id: C3
    facts:
    - F7
    - F8
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: Retaliation is the longstanding declared strategy most frequently advocated by top party and government officials;
      statements favoring the alternatives have not come from the upper levels of civilian leadership.
  - id: C4
    facts:
    - F9
    - F10
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The strategic buildup has made retaliation credible. The leadership's stated assumptions are that a first-struck
      side would retain a force capable of annihilating the attacker's homeland and that war would be disastrous for both
      countries, against a background of worldwide catastrophic capability.
  reasoning:
    read: This is a choice among strategic policies, not a claim that every option has equal standing or that private deliberations
      are fully known. The trap is to treat preemption's presentation in military writings, or launch-on-warning's psychological
      deterrent value, as sufficient to outweigh the practical risks and the senior civilian leadership's demonstrated preference
      for retaliation.
    weighing: The assessment weighs against preemption the unaddressed U.S. warning and retaliatory capabilities and the immense
      risks {C1}; it weighs against launch-on-warning command-and-control problems and accidental or unauthorized launch risks,
      despite possible psychological value {C2}. Retaliation is supported by senior officials' advocacy and its status as
      the declared strategy {C3}, as well as by the buildup that makes it credible and the leadership's assumptions about
      surviving retaliation and catastrophic consequences {C4}. On that qualified record, retaliation is the preferred policy;
      the balance depends in part on the assessment's stated assumptions about retaliatory capability and the risks of the
      alternatives.
    tradecraft: Record the choice as a strategic-policy judgment, distinguish stated assumptions from established certainty,
      and document why the risks of the alternatives and the credibility of retaliation support the decision. Revisit the
      judgment if the underlying capability or command-and-control assessments materially change.
    uncertainty: 'The assessment uses qualified language: preemption is probably not a practical option, launch-on-warning
      has evidently been considered, and the leadership''s assumptions are described as reflected in its SALT position. It
      does not establish certainty about private deliberations or prove that every senior official shared the same view.'
    handoff: This is a leadership-level policy choice. The assessment supports treating it as a decision for the Soviet leadership,
      rather than inferring authority to launch from discussion of launch-on-warning; the source specifically judges delegation
      of launch authority unlikely.
    tempting_wrong:
      option: O2
      pull: Launch-on-warning may have psychological value in reinforcing deterrence.
      why_wrong: That possible value does not resolve the stated command-and-control problems or the risks of accidental or
        unauthorized launch, which the leadership is judged unlikely to accept.
    rejected:
      O2: Launch-on-warning was not preferred because its possible psychological value was outweighed by command-and-control
        problems and risks of accidental or unauthorized launch.
      O3: Preemption was not preferred because its military-writing rationale did not address U.S. warning and retaliatory
        capabilities, and the assessment judged its risks immense and practical adoption unlikely.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The leadership's assessment changed so that launch-on-warning no longer presented the cited command-and-control
        problems or risks of accidental or unauthorized launch.
      then: O2
      why: Removing the assessment's principal stated objections could make launch-on-warning's deterrent value decisive,
        though the source does not itself say this would occur.
    would_not_change:
    - id: noflip1
      if: Preemption continued to be presented as desirable in military writings without addressing U.S. warning systems and
        retaliatory capabilities.
      why: That presentation alone would not answer the assessment's practical objections or remove the immense risks it identifies.
    watch_for:
    - id: watch1
      what: Whether the retaliatory force remains credible and capable of surviving a first attack, as assumed by the leadership.
      favors:
      - O1
      why: The credibility of retaliation is tied both to the strategic buildup and to the stated assumption that a first-struck
        side retains a devastating retaliatory force.
  lesson: Prefer a declared and credible retaliatory policy over alternatives whose practical risks are left unresolved, especially
    when the source identifies catastrophic consequences for both sides. Treat deterrent value as one factor, not as a substitute
    for assessing command-and-control risk and the credibility of the policy.
  limits: This reasoning applies to the strategic options and assumptions assessed for this period; it does not establish
    that retaliation is appropriate under different capabilities, risks, or political conditions. The assessment is qualified
    and does not reveal private deliberations with certainty.
