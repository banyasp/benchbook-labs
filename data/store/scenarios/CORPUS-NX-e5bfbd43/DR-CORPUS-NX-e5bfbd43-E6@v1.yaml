case:
  id: DR-CORPUS-NX-e5bfbd43-E6@v1
  title: The Kremlin’s Near-Term External Posture
  status: draft
  setting: The non-Communist world, near term; Kremlin external policy during the period of the estimate.
  decider: The Kremlin’s leaders
  agent: The Kremlin’s leaders
  agent_role: decide
  situation: The Kremlin’s leaders seek to expand Communist control and retain the initiative in international affairs. Their
    near-term objectives include weakening the mutual defense arrangements of non-Communist states and isolating the US from
    its allies. They can vary their methods and timing to take advantage of opportunities. A generally conciliatory pose is
    assessed as potentially useful for the time being, while continued support for nationalist and anticolonial movements
    remains part of the contemplated approach. The estimate also allows for a return to more aggressive conduct if the Kremlin
    judges that it would bring increased returns.
  question: What should the Kremlin’s leaders do about the USSR’s near-term external posture toward non-Communist states?
  options:
    O1:
      do: The Kremlin’s leaders should combine conciliatory gestures with selective political pressure toward non-Communist
        states.
      move: partial
      irreversible: false
    O2:
      do: The Kremlin’s leaders should adopt a generally conciliatory external posture toward non-Communist states.
      move: act
      irreversible: false
    O3:
      do: The Kremlin’s leaders should adopt a generally aggressive external posture toward non-Communist states.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The USSR is assessed to be pursuing expansionist objectives and seeking opportunities to enlarge the area of Communist
      control.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Kremlin is assessed to seek the initiative in international affairs and to capitalize on successes.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Near-term objectives include weakening non-Communist mutual defense arrangements, preventing or retarding the rearmament
      of Germany and Japan, undermining non-Communist stability, and isolating the US from its allies and associates.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Communists are assessed to vary their methods and time their actions to exploit situations they judge favorable.
  - id: F5
    kind: intelligence
    status: assessed
    fact: For the time being, the Kremlin is assessed to regard a generally conciliatory foreign-relations posture as serving
      its objectives best.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The stated purposes of conciliatory tactics include allaying fear, creating an impression of a basic change in Soviet
      policy, reducing the incentive for Western defense, and undermining US policies.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Communists are assessed to continue supporting nationalist and anticolonial movements.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Kremlin is assessed to revert to more aggressive and threatening conduct when it judges that such conduct will
      bring increased returns.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The tactics are not assessed to indicate a change in basic Communist objectives or to involve substantial concessions
      by the Kremlin.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: For the time being, a generally conciliatory pose is judged to serve the Kremlin’s stated objectives by allaying
      fear, reducing incentives for Western defense, and undermining US policies.
  - id: C2
    facts:
    - F1
    - F2
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Conciliation is tactical rather than a renunciation of expansionist aims or the effort to retain international initiative;
      these tactics do not indicate changed basic objectives or substantial concessions.
  - id: C3
    facts:
    - F5
    - F8
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The near-term preference is for a generally conciliatory posture, with more aggressive conduct conditional on the
      Kremlin judging that it will bring increased returns.
  - id: C4
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Varied methods and continued support for nationalist and anticolonial movements make a combined approach plausible.
      Those activities do not displace the near-term preference for an overall conciliatory pose.
  reasoning:
    read: Conciliation is an instrument for advancing Communist objectives, not evidence that those objectives have changed.
      The trap is to mistake the conciliatory pose for a strategic concession, or to treat conditional willingness to become
      more aggressive as the preferred near-term posture.
    weighing: 'The near-term balance favors O2: a generally conciliatory pose is judged to best serve the Kremlin’s objectives
      by reducing fear and weakening incentives for Western defense {C1}. The underlying expansionist aims remain, and the
      tactics involve no substantial concessions {C2}. Continued support for nationalist and anticolonial movements and varied
      methods make O1 plausible as part of the broader approach, but not as the preferred overall posture {C4}. More aggressive
      conduct is conditional on expected returns {C3}. A separate G-2 and USAF assessment differs on willingness to support
      Chinese courses of action risking localized war; that disagreement qualifies the assessment of escalation risk without
      changing the stated near-term preference.'
    tradecraft: Keep the time horizon and the distinction between overall posture and other ongoing policies explicit. Record
      the assumptions behind the choice, including the expected benefits of conciliation and the conditions that could change
      the assessment; reassess those assumptions as circumstances and judgments about returns change.
    uncertainty: The situation in Southeast Asia is assessed as too fluid for judgments beyond the early period. The Assistant
      Chief of Staff, G-2, and Director of Intelligence, USAF, differ from the principal assessment about whether Soviet leaders
      might support Chinese courses of action involving localized war, depending on the expected outcome.
    handoff: The decision rests with the Kremlin’s leaders; no referral or concurrence process is specified. As a decision
      practice, make the differing judgments about conflict risk visible rather than presenting them as a single consensus.
    tempting_wrong:
      option: O3
      pull: Expansionist objectives and the desire to retain the initiative may make a generally aggressive posture seem like
        the most direct way to pursue them.
      why_wrong: 'Enduring objectives are distinct from the posture judged to serve them best for the time being: a generally
        conciliatory pose, with more aggressive conduct conditional on expected returns.'
    rejected:
      O1: Varied methods and continued support for nationalist and anticolonial movements remain part of the approach, but
        the near-term judgment favors a generally conciliatory overall posture rather than defining it as a combination with
        selective political pressure.
      O3: A generally aggressive posture is not the near-term preference; more aggressive conduct is conditional on the Kremlin
        judging that it will bring increased returns.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Kremlin judges that more aggressive and threatening conduct will bring increased returns.
      then: O3
      why: That judgment is the stated condition for reverting to more aggressive conduct.
    would_not_change:
    - id: noflip1
      if: Soviet leaders believe a conflict would cause a severe defeat for Communism or lead to full-scale Soviet participation
        in general war.
      why: They would probably pressure the Chinese to avoid courses of action precipitating hostilities; this condition supports
        restraint rather than a more aggressive posture.
    watch_for:
    - id: watch1
      what: Whether the Kremlin comes to judge that more aggressive conduct will bring increased returns.
      favors:
      - O3
      why: That judgment is the stated condition for reverting to more aggressive and threatening conduct.
  lesson: Distinguish an instrumentally conciliatory posture from a change in underlying objectives. Prefer the posture judged
    to serve current aims, while treating more aggressive conduct as conditional on the decision-maker’s reassessment of its
    likely returns.
  limits: This is a restatement of a predictive intelligence judgment, not a legal authorization or an independent moral endorsement
    of the Kremlin’s objectives. Its near-term conclusion should not be extended beyond the identified time horizon or uncertainties.
