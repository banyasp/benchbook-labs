basis: The principal estimating judgment is that, for the time being, the Kremlin’s foreign objectives are best served by
  a generally conciliatory pose. The Assistant Chief of Staff, G-2, and Director of Intelligence, USAF, separately assess
  a greater willingness to support courses of action risking localized war.
