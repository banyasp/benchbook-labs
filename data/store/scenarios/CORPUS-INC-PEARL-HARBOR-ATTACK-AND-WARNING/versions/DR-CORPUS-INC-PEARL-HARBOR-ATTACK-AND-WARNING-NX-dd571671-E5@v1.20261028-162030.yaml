case:
  id: DR-CORPUS-INC-PEARL-HARBOR-ATTACK-AND-WARNING-NX-dd571671-E5@v1
  title: Warning Pearl Harbor
  status: draft
  setting: United States, shortly before the Japanese attack on Pearl Harbor; a U.S. military warning decision
  decider: The General responsible for warning forces at Pearl Harbor
  agent: The General responsible for warning forces at Pearl Harbor
  agent_role: decide
  situation: U.S. intelligence indicated that Japan would break off diplomatic relations with the United States. In the context
    of the time, this meant war. The General believed forces at Pearl Harbor needed a warning about a possible attack. He
    did not trust the available secure voice system and feared telephone listeners might learn that the United States had
    access to sensitive intelligence about Japanese diplomacy. If Japan learned this, it might alter the basis of that intelligence,
    reducing its future value. A slower means of sending the warning was available, but would delay delivery.
  question: 'What should the General do about warning forces at Pearl Harbor of a possible attack: transmit the warning by
    telephone or send it by slower means?'
  options:
    O1:
      do: The General transmits the warning to Pearl Harbor by telephone without delay.
      move: act
      irreversible: true
    O2:
      do: The General withholds telephone transmission and sends the warning by slower means.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: U.S. intelligence indicated that Japan would break off diplomatic relations with the United States.
  - id: F2
    kind: intelligence
    status: assessed
    fact: In the context of the time, a break in diplomatic relations meant war.
  - id: F3
    kind: situation
    status: confirmed
    fact: The General knew he needed to alert forces at Pearl Harbor to prepare for a possible attack.
  - id: F4
    kind: capability
    status: confirmed
    fact: The General did not trust the available secure voice system.
  - id: F5
    kind: situation
    status: assessed
    fact: The General feared telephone listeners might learn that the United States had access to sensitive intelligence about
      Japanese diplomacy.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The General believed Japan would likely alter the basis of that intelligence, depriving the United States of its
      future benefit.
  - id: F7
    kind: capability
    status: confirmed
    fact: The warning could be sent by slower means.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: source_protection
    favors:
    - O2
    weight: strong
    why: The General feared that a telephone listener could learn that the United States had access to sensitive Japanese
      diplomatic intelligence, prompting Japan to change its basis and depriving the United States of its future intelligence
      value.
  - id: C2
    facts:
    - F2
    - F3
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The intelligence was understood in the circumstances to mean war, and the General knew Pearl Harbor needed a warning
      to prepare for a possible attack; delay therefore carried an urgent cost.
  - id: C3
    facts:
    - F3
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The slower means ultimately delivered the warning only after the attack, showing that preserving the intelligence
      advantage came at the cost of the warning's immediate purpose.
  - id: C4
    facts:
    - F4
    - F5
    equity: source_protection
    favors:
    - O2
    weight: strong
    why: The General did not trust the available secure voice system and feared the telephone could expose the intelligence
      advantage; he therefore declined to use it.
  reasoning:
    read: 'The General faced a choice between warning Pearl Harbor without delay and protecting intelligence that could remain
      useful only if Japan did not learn the United States had broken its diplomatic cipher. The trap is that protecting future
      intelligence could defeat the immediate purpose of the warning: the slower message arrived after the attack.'
    weighing: The General chose to protect the continuing intelligence advantage, fearing that telephone listeners could reveal
      it to Japan and lead Japan to change the basis of that intelligence {C1}. The urgency of warning forces and the actual
      delay weighed strongly the other way {C2} {C3}. The stated choice prioritized avoiding disclosure despite that severe
      cost; the source does not establish that the slower method was timely or that the risk of telephone disclosure was certain.
    tradecraft: Record the warning's urgency, the risk of disclosing the intelligence, the reason for choosing the slower
      means, and the expected delay. Send the warning promptly by the selected available means and make the decision and its
      consequences accountable. This is decision practice, not a claim about additional actions taken in the episode.
    uncertainty: The concern about listeners learning the intelligence was a fear, and Japan's likely response was an assessment,
      not a certainty. The source records the realized delay and its consequence but gives no estimate of the probability
      of interception or of how much future intelligence would otherwise have been preserved.
    handoff: The General was responsible for the warning decision. The source identifies no required higher approval or consultation,
      so the decision remains with that role; documenting the tradeoff supports accountability.
    tempting_wrong:
      option: O1
      pull: A direct telephone warning appears to meet the urgent need to prepare Pearl Harbor for a possible attack.
      why_wrong: The General did not trust the available voice system and believed telephone listeners might learn of the
        intelligence advantage, allowing Japan to change the basis of future intelligence; that risk drove his refusal to
        use the telephone.
    rejected:
      O1: The General did not choose telephone transmission because he feared it would reveal the intelligence advantage and
        cause Japan to change the basis of that intelligence.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The General had reliable grounds to conclude that telephone transmission would not expose the intelligence advantage,
        while the warning remained urgent.
      then: O1
      why: Removing the stated risk to future intelligence would weaken the reason for delaying a warning that the General
        believed Pearl Harbor needed.
    - id: flip2
      if: The slower means could not deliver the warning before the possible attack.
      then: O1
      why: The source-protection benefit would have to be weighed against a delay that made the warning incapable of serving
        its immediate protective purpose.
    would_not_change:
    - id: noflip1
      if: The warning is urgent, but the General still reasonably fears that telephone listeners could expose the intelligence
        and prompt Japan to change its basis.
      why: Urgency alone does not remove the separate source-protection concern that the General treated as decisive, even
        though the actual delay shows its high cost.
    watch_for:
    - id: watch1
      what: Whether the available communication route could reveal the sensitive intelligence to Japanese listeners.
      favors:
      - O2
      why: The possibility of disclosure and a resulting change in the basis of the intelligence was the General's stated
        reason for avoiding the telephone.
  lesson: When a time-critical warning could expose intelligence that may be valuable in the future, weigh the immediate protective
    purpose against the concrete risk of losing that intelligence. If choosing delay to protect it, account explicitly for
    whether the warning can still arrive in time; preserving future value can carry a grave immediate cost.
  limits: This is a historical account of a particular warning decision, not a general rule that intelligence protection should
    outweigh urgent warnings. The source supplies no governing legal standard, probability assessment, or evidence about alternative
    safeguards, so it does not resolve how other cases should be decided.
