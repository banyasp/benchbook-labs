case:
  id: DR-CORPUS-INC-PEARL-HARBOR-ATTACK-AND-WARNING-NX-0077b9de-E11@v1
  title: Review of a Pacific Warning Draft
  status: draft
  setting: 4 or 5 December, Office of Naval Intelligence and War Plans Division, considering a warning for Pacific commands.
  decider: The War Plans Division chief
  agent: The War Plans Division chief
  agent_role: decide
  situation: An intelligence officer drafted a warning message for Pacific commands based on recent intelligence indicating
    that hostilities might begin soon. The draft went through senior review for approval. The War Plans Division chief was
    responsible for drawing conclusions from intelligence and edited the warning portions of the draft. The chief also showed
    the officer warning messages already sent to the Pacific Fleet commander. Senior commanders had authority to leave dispatches
    unsent.
  question: What should the War Plans Division chief do with the draft warning for the Pacific commands?
  options:
    O1:
      do: The War Plans Division chief withholds the draft warning from the Pacific commands.
      move: act
      irreversible: false
    O2:
      do: The War Plans Division chief sends the draft warning to the Pacific commands.
      move: act
      irreversible: true
    O3:
      do: The War Plans Division chief asks the Chief of ONI to decide on the draft.
      move: ask
      irreversible: false
      to: The Chief of ONI
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: An intelligence officer drafted a warning message for Pacific commands on 4 or 5 December.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Recent intelligence suggested or indicated that the Japanese might initiate hostilities very soon.
  - id: F3
    kind: authority
    status: assessed
    fact: The draft was taken through senior review, and approval was required from the head of the War Plans Division.
  - id: F4
    kind: authority
    status: confirmed
    fact: The head of the War Plans Division was responsible for drawing conclusions from intelligence.
  - id: F5
    kind: situation
    status: assessed
    fact: The head of the War Plans Division edited the warning portions of the draft and showed the intelligence officer
      warning messages already sent to the Pacific Fleet commander.
  - id: F6
    kind: authority
    status: assessed
    fact: Senior commanders had the prerogative to leave dispatches unsent.
  considerations:
  - id: C1
    facts:
    - F2
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: The recent intelligence indicated that hostilities might begin soon, providing a reason to consider a warning; that
      indication alone did not require another dispatch.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The War Plans chief showed the officer that warning messages had already been sent to the Pacific Fleet commander,
      supporting the judgment that this additional draft was not necessary.
  - id: C3
    facts:
    - F3
    - F4
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The War Plans chief was responsible for drawing conclusions from intelligence and had approval authority; senior
      commanders could leave dispatches unsent.
  reasoning:
    read: This was a decision about whether the reviewed draft added a necessary warning, not whether the recent intelligence
      warranted attention at all. The indications prompted a draft, but the chief assessed it in light of warning messages
      already sent.
    weighing: The indications of possible imminent hostilities gave some reason to send {O2} {C1}. The chief's review, including
      the existing warnings, supported withholding this additional dispatch {C2}; the decision also rested with the official
      responsible for drawing conclusions from intelligence {C3}. The chief determined that the draft was not necessary to
      send.
    tradecraft: Compare the proposed warning with the warnings already sent, then make the authorization decision through
      the established review. If withholding the draft, record the decision and its basis.
    uncertainty: The chief's reason was that warning messages had already been sent, but their contents and how closely they
      covered the draft's warning are not detailed. The decision therefore rests on the assessment that another dispatch was
      unnecessary, not on a claim that the intelligence posed no concern.
    handoff: The War Plans chief should make the determination within the assigned review role; senior review had already
      taken place. No further referral to the Chief of ONI was indicated as necessary.
    tempting_wrong:
      option: O2
      pull: The intelligence indicated that hostilities might begin very soon, making an additional warning seem prudent.
      why_wrong: That indication prompted the draft but did not settle whether another message was needed; the chief considered
        the warnings already sent and determined this draft was unnecessary.
    rejected:
      O2: The War Plans chief edited the warning portions and determined the draft was not necessary to send, in light of
        warning messages already sent to the Pacific Fleet commander.
      O3: The War Plans chief held responsibility for drawing conclusions from intelligence and had the approval role; the
        decision followed senior review and did not require further referral.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The War Plans chief determined that the messages already sent did not adequately convey the warning needed by the
        Pacific commands.
      then: O2
      why: That would remove the principal stated reason for withholding the draft and could make an additional warning necessary.
    would_not_change:
    - id: noflip1
      if: Dispatches were commonly left unsent by senior commanders.
      why: That practice establishes authority to withhold a dispatch, but does not by itself establish whether this particular
        draft was necessary; the decision still turns on the chief's assessment and the warnings already sent.
    watch_for:
    - id: watch1
      what: Whether the warnings already sent covered the urgency conveyed by the recent intelligence.
      favors:
      - O2
      why: If the existing warnings did not convey the relevant urgency, the case for sending an additional warning would
        be stronger.
  lesson: A serious intelligence indication can justify drafting a warning without automatically requiring that every draft
    be sent. The authorized reviewer should assess whether an additional dispatch is necessary in light of warnings already
    issued and exercise the delegated judgment.
  limits: This reasoning applies to the decision about this additional draft and the existing warning messages. It does not
    establish that withholding warnings is appropriate when prior warnings are absent or the responsible official judges them
    inadequate.
  library:
    domain: intel-analysis
    family: CORPUS-INC-PEARL-HARBOR-ATTACK-AND-WARNING
    source: https://media.defense.gov/2021/Jul/13/2002761540/-1/-1/0/WEST_WIND_CLEAR.PDF
    episode_focus: The intelligence officer drafted a warning based on indications that hostilities might begin soon; the
      draft was reviewed and edited by senior officers, and the War Plans chief determined it was not necessary to send. The
      record cites existing warning messages to the Pacific Fleet commander and makes clear this draft was not based on the
      alleged Winds message. Exclude technical collection details and later disputed claims about the message.
    cues:
      option_words:
        O1: 13
        O2: 13
        O3: 15
      real_option: O1
      real_to_mean_other_length: 0.93
      real_is_longest: false
      moves:
        O1: act
        O2: act
        O3: ask
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
        O3: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The War Plans Division chief determined that the draft was not necessary to send, after editing it and showing the
  officer warning messages already sent to the Pacific Fleet commander.
