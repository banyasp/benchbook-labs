case:
  id: DR-CORPUS-INC-PEARL-HARBOR-ATTACK-AND-WARNING-NX-2fc939b7-E1@v1
  title: Estimative Judgment on a Possible Approach to Hawaii
  status: draft
  setting: United States, evening of 5 December and the same weekend; public discussion and military intelligence settings.
  decider: The professional intelligence officer assigned to estimative duties
  agent: The professional intelligence officer assigned to estimative duties
  agent_role: decide
  situation: The officer is considering an estimate concerning possible Japanese-American hostilities. A university professor
    publicly predicted an attack on the United States, probably that weekend, and said it could include a diversionary naval
    raid against Hawaii. At a Pacific peace colloquium that same weekend, civil and military figures, area experts, and others
    generally considered U.S. military involvement in the Pacific unlikely. A military intelligence appreciation from about
    the same time discussed possible fleet actions and a raid on merchant shipping in the Gulf of Panama, but did not mention
    Japanese surface ships approaching Hawaii. The officer must weigh these competing assessments while preparing an estimate.
  question: What should the professional intelligence officer assigned to estimative duties do about including a Japanese
    surface approach to Hawaii in the appreciation?
  options:
    O1:
      do: The professional intelligence officer omits a Japanese surface approach to Hawaii from the appreciation.
      move: act
      irreversible: false
    O2:
      do: The professional intelligence officer includes a Japanese surface approach to Hawaii among the possibilities in
        the appreciation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A university professor publicly predicted on the evening of 5 December that Japan would attack the United States,
      probably that weekend.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The professor believed an attack would almost certainly include a diversionary naval raid against Hawaii to deter
      U.S. reinforcement of the Philippines.
  - id: F3
    kind: capability
    status: confirmed
    fact: The professor had no formal military training or access to classified information, but had lived in eastern Asia
      and seen the Japanese army in action.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The professor drew his conclusions from the daily press and his courses on Pacific politics.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Participants at a Pacific peace colloquium that same weekend generally considered U.S. military involvement in the
      Pacific unlikely.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A military intelligence appreciation from about the same time anticipated possible large fleet actions and mentioned
      the possibility of Japanese cruisers raiding U.S. merchant shipping in the Gulf of Panama.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: That military intelligence appreciation did not mention Japanese surface ships approaching the Hawaiian Islands.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A retrospective assessment attributed the officer's failure to anticipate the assault to a prevailing stereotype
      and noted the risk of accepting congenial beliefs while rejecting repugnant ones.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The professor offered a specific prediction that included Hawaii, drawing on his experience in eastern Asia and public
      information, but he lacked formal military training and classified access. His forecast warrants consideration as a
      possibility, not acceptance as certain.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The broad view among public and expert figures was that U.S. military involvement in the Pacific was unlikely. This
      prevailing opinion could pressure the officer’s estimate, but it is not a sufficient reason to omit an unwelcome possibility.
  - id: C3
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The appreciation considered other possible Japanese operations but omitted surface ships approaching Hawaii. The
      failure to anticipate the assault despite the availability of a specific warning shows why the officer should not repeat
      that omission merely because it appears in the existing appreciation.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: A stereotype overcame the officer, and analysts tend to accept congenial beliefs and reject repugnant ones. This
      risk supports including the Hawaii possibility rather than letting consensus or discomfort screen it out.
  reasoning:
    read: The officer is making an estimate amid a specific warning, broad contrary opinion, and an appreciation that discusses
      other contingencies but omits Hawaii. The trap is treating consensus and the existing appreciation’s silence as reassurance,
      when prevailing opinion and stereotype can cause estimative failure.
    weighing: Include a Japanese surface approach to Hawaii as a possibility, not as a certain prediction. The professor’s
      forecast had limitations, and the contrary consensus was strong, but neither justifies excluding the scenario; the central
      lesson is that congenial assumptions and stereotypes can defeat sound estimation. The balance turns on resisting that
      bias, not on treating the professor as authoritative.
    tradecraft: State the Hawaii possibility at an appropriately qualified level and distinguish it from a judgment that an
      attack is certain. Record the evidence and uncertainty, including the competing consensus, so the estimate does not
      convert prevailing opinion into an unexamined assumption.
    uncertainty: 'The passage does not establish that the officer could confidently predict the attack: it says there was
      only a little chance of doing so under the weight of public and expert opinion. The professor also lacked formal military
      training and classified information, so inclusion should convey possibility rather than certainty.'
    handoff: The passage assigns the estimative judgment to the professional intelligence officer and identifies no required
      approver or consultation authority. The officer should make and explain the estimate; any additional consultation would
      be a matter of sound practice, not a source-stated requirement.
    tempting_wrong:
      option: O1
      pull: Omitting Hawaii follows the prevailing view among prominent public and official figures and matches the military
        appreciation’s silence.
      why_wrong: Prevailing opinion and stereotype contributed to the failure of judgment, so they are not sound grounds for
        dismissing the possibility.
    rejected:
      O1: Omit Hawaii because prevailing opinion and the existing appreciation do not outweigh the risk that stereotype and
        congenial assumptions will overcome estimative judgment.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Independent, reliable evidence available to the officer showed that a Japanese surface approach to Hawaii was not
        a plausible contingency.
      then: O1
      why: A possibility should not be included merely to counter a stereotype if evidence available to the officer affirmatively
        rules it out.
    would_not_change:
    - id: noflip1
      if: The public and expert consensus against likely U.S. involvement were even broader or more emphatic.
      why: The concern is that prevailing public and expert opinion can overpower judgment; greater consensus alone would
        not resolve the risk of stereotype.
    watch_for:
    - id: watch1
      what: Independent evidence that bears specifically on whether Japanese surface ships might approach Hawaii.
      favors:
      - O2
      why: Such evidence would strengthen the case for including the possibility without relying on the professor’s prediction
        alone.
  lesson: An estimate should not omit a consequential possibility simply because prominent opinion or an existing appreciation
    leaves it out. Treat a specific but uncertain warning as a possibility to weigh, and guard against accepting congenial
    assumptions or rejecting repugnant ones.
  limits: This conclusion concerns estimative judgment and inclusion of a possibility in an appreciation. It does not establish
    that an attack was certain, prescribe operational planning, or supply a general rule for resolving every conflict between
    a single forecast and expert consensus.
