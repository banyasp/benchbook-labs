case:
  id: DR-CORPUS-NX-7b862543-E3@v1
  title: Authorization for Proposed Cross-Border Training
  status: draft
  setting: Late 1938; the RCMP and American maritime authorities, with proposed personnel training in New York.
  decider: The acting Coast Guard intelligence officer
  agent: The acting Coast Guard intelligence officer
  agent_role: advise
  situation: In late 1938, the RCMP sought to send two personnel to New York for specialized training. The RCMP Marine Division
    commander said the proposed trainees had some experience and believed the training would improve their proficiency. The
    request went to the New York Coast Guard intelligence office. The 1925 U.S.–Canada treaty concerned suppression of smuggling,
    and the acting Coast Guard intelligence officer assessed that extending cooperation in this field required permission
    from higher authority. Earlier cross-border assistance had been kept unofficial, with the expectation that the RCMP would
    continue on its own. The Coast Guard intelligence office also raised concerns that some radio operators were civilian
    employees who had not been investigated, including some former rumrunner operators; trainees should be regular RCMP members.
  question: What should the acting Coast Guard intelligence officer do about the RCMP's proposed training request?
  options:
    O1:
      do: The acting Coast Guard intelligence officer should ask the RCMP to submit a formal request.
      move: ask
      irreversible: false
      to: the RCMP
    O2:
      do: The acting Coast Guard intelligence officer should recommend rejection of the training.
      move: act
      irreversible: false
    O3:
      do: The acting Coast Guard intelligence officer should recommend informal approval of the training.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In late 1938, the RCMP proposed sending two personnel to New York for specialized training.
  - id: F2
    kind: capability
    status: assessed
    fact: The proposed trainees had some experience in the field.
  - id: F3
    kind: capability
    status: assessed
    fact: The RCMP Marine Division commander believed the training would improve the trainees' proficiency.
  - id: F4
    kind: authority
    status: confirmed
    fact: The 1925 U.S.–Canada treaty concerned the suppression of smuggling.
  - id: F5
    kind: authority
    status: assessed
    fact: The acting Coast Guard intelligence officer assessed that extending cooperation into this field required permission
      from higher authority.
  - id: F6
    kind: situation
    status: confirmed
    fact: Earlier assistance to the RCMP had been kept unofficial, with the expectation that the RCMP would continue independently.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Coast Guard intelligence office noted that many RCMP radio operators were civilian Department of Transport employees
      who had not been investigated, and some were former rumrunner radio operators.
  - id: F8
    kind: authority
    status: assessed
    fact: The Coast Guard intelligence office considered regular RCMP membership necessary for trainees if training were provided.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    - O2
    weight: bar
    why: The acting Coast Guard intelligence officer assessed that extending cooperation in this treaty-related field required
      higher permission, which rules out informal approval without that permission.
    rules_out:
    - O3
  - id: C2
    facts:
    - F5
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: Earlier help was deliberately unofficial and expected to be followed by independent RCMP work; it does not establish
      authority for a further extension of cooperation. A formal request provides a route for higher authority to consider
      it.
  - id: C3
    facts:
    - F7
    - F8
    equity: security_risk
    favors:
    - O1
    - O2
    weight: strong
    why: The concern about uninvestigated civilian radio operators, including former rumrunner operators, supports limiting
      any training to regular RCMP members and considering that safeguard before proceeding.
  - id: C4
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The trainees had some experience and the RCMP commander expected training to improve their proficiency. That supports
      considering the request rather than rejecting it outright, but does not resolve the authority or personnel concerns.
  reasoning:
    read: This is a request to extend cross-border cooperation in a field covered by the 1925 treaty, not simply a continuation
      of the earlier unofficial assistance. The trap is treating that past arrangement, or the potential benefit of training,
      as permission to proceed informally.
    weighing: The acting Coast Guard intelligence officer assessed that higher permission was needed {C1}, and the earlier
      assistance was not a basis for bypassing that process {C2}. The personnel concern also makes regular RCMP membership
      a necessary safeguard if training is provided {C3}. The proposed trainees’ experience and the expected improvement in
      proficiency favor considering the request, but do not outweigh those requirements {C4}. The balance supports asking
      for a formal request, not approving training informally or rejecting the possibility before higher authority considers
      it.
    tradecraft: Ask the RCMP to submit its request formally to the Coast Guard commandant. Make clear that any training provided
      should be limited to regular RCMP members, and preserve the request and the stated authority and personnel considerations
      for the higher-level review.
    uncertainty: There is no available record establishing whether the training ultimately took place.
    handoff: The acting intelligence officer should not treat this as a decision to grant training alone. The formal request
      should go to the Coast Guard commandant, who could present the matter to the State Department.
    tempting_wrong:
      option: O3
      pull: Informal approval could seem like a practical continuation of earlier cooperation and would support the RCMP’s
        stated proficiency goal.
      why_wrong: The acting intelligence officer assessed that extending cooperation required higher permission, while the
        earlier assistance had been kept unofficial with an expectation that the RCMP would continue independently.
    rejected:
      O2: Outright rejection was not chosen because the expected proficiency benefit could be considered through a formal
        request, subject to higher permission and the regular-member safeguard.
      O3: Informal approval was not chosen because the acting intelligence officer assessed that higher permission was required.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed trainees are not regular RCMP members.
      then: O2
      why: The Coast Guard intelligence office considered regular RCMP membership necessary if training were provided, so
        the request as proposed should not proceed with ineligible trainees.
    - id: flip2
      if: Higher authority declines permission for the proposed extension of cooperation.
      then: O2
      why: Without the permission assessed as necessary, the training should not go ahead.
    would_not_change:
    - id: noflip1
      if: The trainees’ experience and the expected proficiency improvement are offered as reasons to bypass formal authorization.
      why: Those considerations support evaluating the request but do not remove the assessed need for permission from higher
        authority.
    watch_for:
    - id: watch1
      what: Whether the RCMP submits a formal request and whether the proposed trainees are regular RCMP members.
      favors:
      - O1
      why: The formal route enables higher-level consideration, while regular RCMP membership addresses the personnel safeguard
        identified by the Coast Guard intelligence office.
  lesson: When an agreement or treaty makes higher-level permission necessary, prior informal cooperation is not a substitute
    for authorization. Preserve a viable request for review while applying any stated personnel safeguards before cooperation
    proceeds.
  limits: This reasoning addresses whether to refer a proposed training request for authorization and the stated trainee-membership
    safeguard. It does not establish that permission was granted, that training occurred, or what other requirements a later
    approval might impose.
