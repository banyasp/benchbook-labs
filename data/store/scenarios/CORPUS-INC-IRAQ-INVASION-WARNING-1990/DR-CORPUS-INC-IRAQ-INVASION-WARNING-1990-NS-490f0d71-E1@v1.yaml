case:
  id: DR-CORPUS-INC-IRAQ-INVASION-WARNING-1990-NS-490f0d71-E1@v1
  title: Near-Term Iraq War Estimate
  status: draft
  setting: Iraq, the year before the 1990 invasion of Kuwait; the DI analytic community.
  decider: The analysts
  agent: The analysts
  agent_role: decide
  situation: In the year before Iraq’s 1990 invasion of Kuwait, analysts had to judge whether Iraq might initiate warfare
    in the near term. Iraq had emerged from a long war with Iran that had caused military and economic devastation. Analysts
    commonly assumed that Iraq would need several years to recover. That assumption was rarely examined critically. The choice
    was whether to assess near-term war as unlikely or warn of a greater likelihood.
  question: What should the analysts do about whether to issue a strategic warning of greater near-term likelihood of Iraqi
    warfare?
  options:
    O1:
      do: The analysts issue a strategic warning of greater near-term likelihood of Iraqi warfare.
      move: act
      irreversible: true
    O2:
      do: The analysts withhold a strategic warning and assess near-term Iraqi warfare as unlikely.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Iraq had fought a long war with Iran.
  - id: F2
    kind: situation
    status: confirmed
    fact: The war with Iran had caused military devastation in Iraq.
  - id: F3
    kind: situation
    status: confirmed
    fact: The war with Iran had caused economic devastation in Iraq.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Analysts assumed Iraq needed several years to recover from the effects of its war with Iran.
  - id: F5
    kind: situation
    status: confirmed
    fact: The recovery assumption was widely held among analysts.
  - id: F6
    kind: situation
    status: confirmed
    fact: The recovery assumption was rarely examined critically.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Analysts did not explicitly recognize how heavily their no-war conclusion depended on the recovery assumption.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Iraq’s military and economic devastation made a lengthy recovery a plausible consideration in estimating near-term
      warfare, but the DDI’s criticism was that this assumption carried the no-war conclusion without being critically tested.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The recovery assumption was widely held but rarely examined critically, so its prevalence did not establish that
      it was a sound basis for ruling near-term warfare unlikely.
  - id: C3
    facts:
    - F4
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Analysts did not explicitly recognize how heavily the no-war conclusion depended on the recovery assumption; that
      hidden dependence weakened the confidence warranted by the bottom-line judgment.
  reasoning:
    read: The analysts faced genuine uncertainty after a long and devastating war, but the trap was treating the assumption
      that Iraq needed years to recover as if it settled whether Iraq might initiate warfare soon. The no-war judgment depended
      heavily on that assumption even though analysts rarely tested it critically.
    weighing: The devastation of the war gives the recovery assumption some plausibility {C1}, but the DDI’s assessment gives
      greater weight to the fact that the assumption was widely held without critical examination and that its importance
      to the no-war conclusion was not recognized {C2} {C3}. On that assessment, the analysts should issue a warning of greater
      near-term likelihood rather than let the recovery assumption carry the conclusion. The balance depends on whether the
      assumption is sound, not on how commonly it was accepted.
    tradecraft: For this decision, state the warning and make clear that the recovery assumption is a key premise rather than
      an established fact; record how the judgment depends on it. This is a decision-level application of the source’s criticism,
      not a separate tradecraft recommendation.
    uncertainty: There was too little hard information for a flat prediction, and no precise probability of Iraqi warfare
      is established here. The concern is that the unlikely-war judgment rested on an insufficiently examined assumption,
      not that war was certain.
    handoff: The source identifies the analysts as the decision-makers and specifies no separate approving authority or required
      handoff. The analysts should own the warning judgment and its stated basis.
    tempting_wrong:
      option: O2
      pull: Iraq’s military and economic devastation after the war with Iran made a long recovery seem likely.
      why_wrong: The DDI’s assessment was that analysts relied on that recovery assumption without examining it critically
        or recognizing how heavily their no-war conclusion depended on it.
    rejected:
      O2: The analysts should not withhold a warning on the strength of a recovery assumption that the DDI judged widely held,
        rarely examined critically, and central to the no-war conclusion.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Independent, persuasive evidence established that Iraq could not or would not initiate warfare in the near term,
        apart from the recovery assumption.
      then: O2
      why: That evidence would provide an independently examined basis for assessing near-term warfare as unlikely.
    would_not_change:
    - id: noflip1
      if: The recovery assumption remained widely accepted among analysts but was still not critically examined.
      why: Consensus alone would not address the DDI’s concern that the assumption was carrying the no-war conclusion without
        adequate scrutiny.
    watch_for:
    - id: watch1
      what: Evidence bearing on whether the assumed years-long recovery actually constrained Iraq’s ability or intention to
        initiate near-term warfare.
      favors:
      - O1
      why: It tests the premise on which the no-war judgment heavily depended.
  lesson: A widely shared premise is not a reliable basis for a consequential judgment merely because it seems plausible.
    When a conclusion depends heavily on an assumption, examine that dependence before allowing it to foreclose a warning.
  limits: This reasoning addresses the specific recovery-first assumption and the analysts’ near-term war judgment described
    here. It does not establish that Iraq’s likelihood of initiating warfare was certain or prescribe a general warning threshold.
