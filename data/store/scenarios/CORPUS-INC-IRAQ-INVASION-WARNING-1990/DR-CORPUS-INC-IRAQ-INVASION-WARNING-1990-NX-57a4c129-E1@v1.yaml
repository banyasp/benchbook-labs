case:
  id: DR-CORPUS-INC-IRAQ-INVASION-WARNING-1990-NX-57a4c129-E1@v1
  title: Assessing Near-Term Iraqi War Risk
  status: draft
  setting: Iraq, the year before 1990; DI analysts assessing near-term warfare risk
  decider: The DI analysts
  agent: The DI analysts
  agent_role: decide
  situation: The DI analysts were assessing whether Iraq might initiate warfare in the near term. Iraq had experienced a long
    war with Iran and was described as suffering military and economic devastation. Analysts held the view that Iraq needed
    several years to recover from that damage. This recovery-first view was widely held and rarely examined critically. The
    analysts faced a choice between issuing a low-likelihood estimate and warning of near-term war.
  question: What should the DI analysts do when assessing whether Iraq is likely to initiate warfare in the near term?
  options:
    O1:
      do: The DI analysts should issue an assessment that Iraq is unlikely to initiate warfare in the near term.
      move: act
      irreversible: false
    O2:
      do: The DI analysts should issue a strategic warning that Iraq may initiate warfare in the near term.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Iraq had fought a long war with Iran.
  - id: F2
    kind: situation
    status: confirmed
    fact: Iraq's military and economy had been devastated by its war with Iran.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Analysts assumed Iraq needed several years to recover from the effects of the war.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The recovery-first assumption was widely held among analysts.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The recovery-first assumption was rarely examined critically.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The assessment of near-term war risk depended heavily on the recovery-first assumption, but analysts did not explicitly
      recognize that dependence.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The long war and resulting devastation formed the basis for analysts' view that Iraq needed several years to recover,
      which supported their low near-term risk estimate.
  - id: C2
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The recovery-first assumption was widely shared but rarely examined critically, weakening its value as a foundation
      for reassurance.
  - id: C3
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The low-risk conclusion depended heavily on the recovery-first assumption, but analysts did not explicitly recognize
      that dependence.
  reasoning:
    read: The analysts assessed near-term warfare risk against the background of Iraq's military and economic devastation.
      The trap was treating the assumption that Iraq needed years to recover as a settled basis for a low-risk judgment, although
      the assumption was rarely critically examined and the conclusion's dependence on it was not explicit.
    weighing: The devastation and recovery assumption provide some support for {O1} {C1}. But the assumption's wide acceptance
      did not make it well-tested, and the analysts did not recognize how heavily their conclusion depended on it {C2} {C3}.
      The balance therefore favors warning of near-term war {O2}, rather than relying on that assumption to issue a low-likelihood
      estimate.
    tradecraft: Issue the strategic warning and clearly record that the low-risk conclusion rested heavily on the recovery-first
      assumption.
    uncertainty: The identified weakness is an inadequately examined assumption, not a definitive assessment of Iraq's actual
      capacity or intent. The warning should therefore convey risk without presenting near-term war as certain.
    handoff: The DI analysts are the deciders in this scenario. No additional approving authority or required referral is
      identified.
    tempting_wrong:
      option: O1
      pull: Iraq's military and economic devastation made the belief that recovery would take several years seem plausible.
      why_wrong: The low-risk judgment rested heavily on that widely held belief, yet it was rarely critically examined and
        its role in the judgment was not explicitly recognized.
    rejected:
      O1: The low-likelihood estimate was not chosen because its central recovery-first premise was insufficiently examined
        despite its heavy influence on the conclusion.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Independent, critically examined evidence established that Iraq could not initiate warfare in the near term and
        supported the several-years recovery judgment.
      then: O1
      why: That would provide a substantiated basis for the low-likelihood estimate rather than relying on an unexamined assumption.
    would_not_change:
    - id: noflip1
      if: The recovery-first view remained widely held but was still rarely examined critically.
      why: Consensus alone would not address the concern that the assumption was untested and that the risk judgment depended
        heavily on it.
    watch_for:
    - id: watch1
      what: Whether the low-risk conclusion depends heavily on the recovery-first assumption and whether analysts have critically
        examined that assumption.
      favors:
      - O2
      why: Unexamined dependence on that premise is the identified weakness in the low-likelihood judgment.
  lesson: A widely shared assumption is not a reliable foundation for a consequential judgment merely because analysts accept
    it. When a low-risk conclusion depends heavily on a premise, examine that premise critically and make its influence on
    the conclusion explicit.
  limits: This reasoning concerns an intelligence estimate whose low-risk conclusion depended on a rarely examined assumption.
    It does not establish that every uncertain assessment requires a warning or that near-term war was certain.
  library:
    domain: intel-analysis
    family: CORPUS-INC-IRAQ-INVASION-WARNING-1990
    source: https://www.cia.gov/resources/csi/static/2c195241699da364e003c1a28d313182/Strategic-Warning-1.pdf
    episode_focus: The decision point is the analysts’ choice to issue a low-likelihood estimate rather than warn of near-term
      war, given Iraq’s recovery from its war with Iran. The source says the estimate rested on a widely held recovery-first
      assumption that was rarely critically examined; exclude later general recommendations and analytic techniques.
    cues:
      option_words:
        O1: 18
        O2: 17
      real_option: O2
      real_to_mean_other_length: 0.94
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The DDI's assessment identified the failure to provide strategic warning before Iraq's invasion of Kuwait and described
  the low-risk judgment as resting on a widely held, rarely examined recovery-first assumption.
