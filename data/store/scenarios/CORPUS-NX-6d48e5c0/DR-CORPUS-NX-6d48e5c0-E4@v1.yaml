case:
  id: DR-CORPUS-NX-6d48e5c0-E4@v1
  title: A Deployment as a Signal of Resolve
  status: draft
  setting: White House, 10 June, U.S. presidential decision-making.
  decider: The president
  agent: The president
  agent_role: decide
  situation: On 10 June, Israeli victory appeared near. A message from the Soviet premier arrived at the White House over
    the hotline. The Soviet leadership described a grave catastrophe and threatened necessary actions, including military
    action, unless the Israeli advance across the Golan Heights stopped. The defense secretary recommended deploying the Sixth
    Fleet, and the presidential advisers present supported the recommendation. The proposed deployment was intended to convey
    U.S. resolve without backing the Soviet Union into a corner.
  question: What should the president do about whether to deploy the Sixth Fleet to signal resolve while avoiding escalation
    with the Soviet Union?
  options:
    O1:
      do: The president approves the deployment of the Sixth Fleet to the eastern Mediterranean.
      move: act
      irreversible: false
    O2:
      do: The president disapproves the deployment of the Sixth Fleet to the eastern Mediterranean.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 10 June, the White House received a message from the Soviet premier over the hotline.
  - id: F2
    kind: situation
    status: assessed
    fact: Israeli victory appeared near.
  - id: F3
    kind: situation
    status: assessed
    fact: The Soviet leadership foresaw a grave catastrophe.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Soviet message threatened necessary actions, including military action, unless the Israeli advance across the
      Golan Heights stopped.
  - id: F5
    kind: situation
    status: confirmed
    fact: The defense secretary recommended deploying the Sixth Fleet to the eastern Mediterranean.
  - id: F6
    kind: situation
    status: confirmed
    fact: The presidential advisers present endorsed the defense secretary's recommendation.
  - id: F7
    kind: situation
    status: confirmed
    fact: The proposed deployment was intended to convey U.S. resolve without backing the Soviet Union into a corner.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: With Israeli victory appearing near, the Soviet leadership described a grave catastrophe and threatened military
      action unless the advance stopped. The recommended deployment was a way to respond to that threat without backing the
      Soviet Union into a corner.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The defense secretary recommended deployment, the advisers present endorsed it, and its stated purpose was to convey
      U.S. resolve while avoiding an unnecessarily confrontational signal.
  - id: C3
    facts:
    - F5
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The recommendation came from the defense secretary and was endorsed by the advisers present, providing a shared advisory
      basis for the president's judgment rather than a stated binding rule.
  reasoning:
    read: This was a choice about signaling resolve during a crisis, not simply whether to answer a Soviet threat with military
      force. The central trap is treating restraint and resolve as mutually exclusive when the stated purpose of deployment
      was to signal resolve without cornering the Soviet Union.
    weighing: The Soviet threat and the prospect of a near Israeli victory made the crisis serious {C1}. The defense secretary's
      recommendation, supported by the advisers present, offered a response with the specific stated aim of conveying resolve
      while limiting escalation {C2} {C3}. Moscow received the message, and a ceasefire later that day restored an uneasy
      peace; this is consistent with the intended signaling effect, though it does not establish that deployment alone caused
      the ceasefire. On this balance, approve deployment.
    tradecraft: Keep the decision rationale tied to the stated purpose—communicating resolve without needlessly escalating—and
      record the recommendation, the advisers' support, and the president's decision. Reassess if the situation changes in
      a way that undermines that balance.
    uncertainty: The Soviet leadership's assessment and threat are known, but what it would have done absent deployment is
      not. Moscow received the message and a ceasefire followed, but the deployment's causal contribution is not isolated.
    handoff: The president makes the decision, informed by the defense secretary's recommendation and the views of the advisers
      present. No separate legal approval requirement is specified.
    tempting_wrong:
      option: O2
      pull: With the Soviet Union threatening military action, withholding deployment may seem the safest way to avoid escalation.
      why_wrong: It rejects the recommended means of communicating resolve, which was expressly intended to avoid backing
        the Soviet Union into a corner.
    rejected:
      O2: The president did not withhold deployment because the recommended response was intended to convey U.S. resolve without
        backing the Soviet Union into a corner.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed deployment could not credibly convey resolve without instead backing the Soviet Union into a corner.
      then: O2
      why: That would defeat the stated restraint that made deployment the recommended signal and would weigh against approving
        it.
    - id: flip2
      if: The circumstances no longer presented a serious Soviet threat or an imminent prospect of Israeli victory.
      then: O2
      why: The crisis described as warranting a signal would have materially changed, weakening the stated reason for deploying.
    would_not_change:
    - id: noflip1
      if: Israeli victory still appeared near, while the deployment remained intended to convey resolve without cornering
        the Soviet Union.
      why: Those are the circumstances and calibrated purpose supporting the recommended approval.
    watch_for:
    - id: watch1
      what: Whether the signal is received and whether the crisis moves toward a ceasefire.
      favors:
      - O1
      why: Moscow received the message and a ceasefire followed, making these relevant indicators of the intended effect without
        proving sole causation.
  lesson: A military signal can communicate resolve while remaining deliberately limited in its political purpose. Weigh the
    need to respond against whether the proposed response can do so without unnecessarily escalating the confrontation.
  limits: This reasoning applies to the described 10 June crisis and the stated purpose of the deployment. No general legal
    rule, separate approval standard, or basis for assuming a similar deployment would have the same effect in another crisis
    is provided.
