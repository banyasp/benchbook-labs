case:
  id: DR-CORPUS-NS-5b2611a4-E22@v1
  title: Public Presentation of Intelligence
  status: draft
  setting: Government and Parliamentary debate; preparation of an unclassified dossier on Iraqi programmes; the Government
    and JIC.
  decider: The Government
  agent: The Government
  agent_role: decide
  situation: The Government is preparing an unclassified account of intelligence for public and Parliamentary debate and wants
    to use it in advocacy of its policy. The JIC seeks to provide a dispassionate assessment of intelligence and other material
    concerning Iraqi programmes, and has accepted responsibility for ensuring that the intelligence content reflects intelligence-community
    judgments. In translating assessments into a public dossier, warnings about limited intelligence bases can be lost, and
    readers may infer a fuller and firmer evidential basis than exists. The dossier's judgments are at the outer limits of
    available intelligence, although they do not go beyond it. The Government must decide how to present JIC-cleared material
    while balancing the demand for an authoritative account against the risk of placing pressure on the JIC's objectivity.
  question: What should the Government do in presenting intelligence publicly while balancing the demand for an authoritative
    account against the risk of compromising the JIC's objectivity?
  options:
    O1:
      do: The Government drafts the public document, obtains JIC endorsement of its intelligence content, and publishes it
        under the JIC's name and authority.
      move: act
      irreversible: true
    O2:
      do: The Government has the JIC publish a self-standing assessment with its usual caveats, leaving others to place it
        in policy context.
      move: act
      irreversible: true
    O3:
      do: The Government drafts the public document, obtains JIC endorsement of its intelligence content, and publishes it
        without attributing authorship to the JIC.
      move: act
      irreversible: true
    O4:
      do: The Government publishes its document, showing the JIC's endorsement separately from the Government's own policy
        case and advocacy.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Government wanted an unclassified document for use in advocating its policy.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The JIC sought to provide a dispassionate assessment of intelligence and other material concerning Iraqi nuclear,
      biological, chemical, and ballistic missile programmes.
  - id: F3
    kind: situation
    status: confirmed
    fact: The JIC took responsibility for the dossier so its content would reflect the judgments of the intelligence community.
  - id: F4
    kind: intelligence
    status: assessed
    fact: In translating JIC assessments into the dossier, warnings about the limited intelligence base for some assessments
      were lost.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The dossier's language may have suggested fuller and firmer intelligence than was available, while its judgments
      reached the outer limits of the intelligence but did not go beyond them.
  - id: F6
    kind: situation
    status: assessed
    fact: The Government faced a dilemma between giving the public an authoritative account of the intelligence picture and
      protecting JIC objectivity from pressures arising from public debate.
  - id: F7
    kind: situation
    status: assessed
    fact: The Government faced mounting public and Parliamentary demand for information.
  - id: F8
    kind: authority
    status: assessed
    fact: JIC clearance of the intelligence content of a similar public document is essential.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    - O3
    weight: strong
    why: Warnings about limited intelligence were lost, and the dossier could imply firmer evidence than existed. Public use
      must explain the intelligence's limitations; a JIC assessment with its normal caveats or a government document with
      JIC-cleared intelligence can address this concern.
  - id: C2
    facts:
    - F3
    - F6
    equity: impartiality
    favors:
    - O3
    - O4
    weight: strong
    why: Having the JIC take responsibility for the dossier put pressure on its normal objective role. Publishing the government's
      advocacy without attributing authorship to the JIC avoids placing the JIC and its Chair into public controversy; separate
      endorsement is another way to distinguish their roles.
  - id: C3
    facts:
    - F1
    - F6
    - F7
    equity: public_transparency
    favors:
    - O3
    - O4
    - O2
    weight: strong
    why: The Government faced mounting demand for an authoritative account, but meeting that demand created a real dilemma
      with protecting JIC objectivity. The demand supports providing information, not presenting policy advocacy as the JIC's
      own assessment.
  - id: C4
    facts:
    - F8
    equity: analytic_integrity
    favors:
    - O2
    - O4
    - O3
    weight: strong
    why: JIC clearance of the intelligence content is essential whichever route is chosen. Clearance supports using the intelligence
      while keeping its assessment distinct from the Government's policy case.
  - id: C5
    facts:
    - F1
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: Among the alternatives, the preferred course is for the Government to draft, obtain JIC endorsement of the intelligence
      content, and publish without ascribing the document to the JIC. A self-standing JIC assessment may be less persuasive
      as a policy case, but that is the price of using a JIC assessment.
  reasoning:
    read: 'The Government needed to respond to demand for public information while using intelligence in support of policy.
      The trap is treating JIC authorship as a way to make the account authoritative: in this instance, the dossier''s language
      could imply a stronger intelligence basis than existed, and the JIC''s name gave the intelligence more weight than it
      could bear.'
    weighing: The need to inform the public and Parliament supports publication, and JIC clearance of the intelligence content
      remains essential. But the loss of caveats and the pressure on the JIC's objectivity weigh against publishing the Government's
      document in the JIC's name or authority. The Review greatly preferred government drafting with JIC endorsement of the
      intelligence content, but no JIC attribution. A self-standing JIC assessment preserves its usual caveats but may be
      less persuasive in making a policy case; that reduced persuasiveness is the price of using such an assessment.
    tradecraft: Obtain JIC clearance of the intelligence content, explain the uses and limitations of the intelligence clearly,
      and establish an effective dividing line between assessment and advocacy. Publish the policy-context document as the
      Government's, without attributing its authorship to the JIC.
    uncertainty: The assessment reached the outer limits of the available intelligence, though it did not go beyond them.
      The concern is that readers could mistake those judgments for conclusions supported by fuller and firmer intelligence;
      the record does not establish that the judgments themselves exceeded the available intelligence.
    handoff: The Government should decide and own the public policy document, while obtaining JIC clearance of its intelligence
      content. This preserves the JIC's role in checking intelligence judgments without placing it in the role of publicly
      advocating the Government's policy.
    tempting_wrong:
      option: O1
      pull: Publishing under the JIC's name and authority could appear to give the public the authoritative intelligence account
        it was demanding.
      why_wrong: In the circumstances, JIC authorship gave the intelligence more weight than it could bear and drew the JIC
        and its Chair into public controversy; the Review judged making that authorship public a mistake.
    rejected:
      O1: Do not publish the Government's document under the JIC's name and authority, because that can overstate the weight
        readers place on the intelligence and compromise the JIC's position.
      O2: A self-standing JIC assessment with its usual caveats is an available alternative, but the Review preferred government
        drafting because the JIC assessment may be less persuasive in making the policy case.
      O4: Separate display of JIC endorsement is an option, but the Review judged government drafting with endorsement and
        no JIC attribution greatly preferable.
      O3: 'This is the preferred course: it lets the Government provide policy context while keeping JIC endorsement of the
        intelligence content distinct from authorship of the document.'
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Government instead makes a self-standing JIC assessment, with its normal caveats, the overriding aim and accepts
        that it may be less persuasive as a policy case.
      then: O2
      why: That changed priority would favor letting the JIC publish its own assessment and leaving others to place it in
        policy context.
    - id: flip2
      if: The Government's priority is to display the JIC's endorsement separately from its own policy case and advocacy.
      then: O4
      why: Separate presentation would make the distinction between the Government's advocacy and JIC endorsement visible,
        rather than leaving the endorsement unattributed.
    would_not_change:
    - id: noflip1
      if: Public and Parliamentary demand for information continues to mount.
      why: Demand explains why the Government wanted to publish, but by itself does not resolve the risk that JIC authorship
        gives the intelligence too much weight or compromises JIC objectivity.
    watch_for:
    - id: watch1
      what: Whether the public document makes the limited intelligence base and the uses and limitations of the intelligence
        clear.
      favors:
      - O3
      why: Lost warnings created a serious weakness, and future public use of intelligence requires clear explanation of its
        limitations and a stronger dividing line between assessment and advocacy.
  lesson: When government uses intelligence in public advocacy, obtain intelligence clearance but keep the Government's policy
    case distinct from the JIC's assessment and authorship. Explain the limits of the intelligence plainly; institutional
    authority must not make uncertain evidence appear firmer than it is.
  limits: This recommendation concerns the particular circumstances of an unclassified policy dossier based on JIC assessments.
    It does not establish that JIC authorship is always inappropriate or determine how intelligence should be handled outside
    public debate.
