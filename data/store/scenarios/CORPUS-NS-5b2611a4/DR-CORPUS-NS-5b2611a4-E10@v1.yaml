case:
  id: DR-CORPUS-NS-5b2611a4-E10@v1
  title: Responsibility for the Iraq dossier
  status: draft
  setting: United Kingdom Government, September 2002; Joint Intelligence Committee dossier on Iraq.
  decider: The Security and Intelligence Co-ordinator and the Chairman of the JIC, with Government agreement
  agent: The Security and Intelligence Co-ordinator and the Chairman of the JIC
  agent_role: decide
  situation: The Government was preparing to publish a dossier drawing on intelligence about Iraq. The JIC’s leadership considered
    whether the JIC or another part of Government should take responsibility for producing and owning it. Government witnesses
    considered JIC endorsement important to the dossier’s credibility, while the Government also intended to use the document
    in advocacy of its policy. The JIC’s role was to offer a dispassionate assessment, not to make a case for a policy. Its
    leadership wanted the dossier to reflect intelligence-community judgments and not prejudice national security. Presenting
    intelligence judgments to a wider public audience was a difficult task that could put pressure on the JIC’s neutral assessment
    standards.
  question: What should the Security and Intelligence Co-ordinator and the Chairman of the JIC do about responsibility for
    producing and owning the dossier?
  options:
    O1:
      do: The JIC relinquishes responsibility for dossier production and ownership.
      move: act
      irreversible: false
    O2:
      do: The JIC retains responsibility for dossier production and ownership.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Government had decided to publish a dossier drawing on intelligence.
  - id: F2
    kind: authority
    status: assessed
    fact: The Security and Intelligence Co-ordinator and the JIC Chairman considered JIC responsibility appropriate for reflecting
      intelligence-community judgments and avoiding prejudice to national security.
  - id: F3
    kind: situation
    status: assessed
    fact: Many ministerial and official witnesses considered that a Government document claiming intelligence support would
      face immediate skepticism without evident JIC endorsement.
  - id: F4
    kind: situation
    status: confirmed
    fact: Government information about Al Qaida’s responsibility for the September 11 attacks had been published without public
      reference to the JIC, and that issue had less controversy and skepticism about the grounds for Government policy.
  - id: F5
    kind: situation
    status: assessed
    fact: Associating the JIC’s name with the dossier was seen as lending it objectivity and credibility.
  - id: F6
    kind: situation
    status: assessed
    fact: The Government intended the dossier to provide intelligence-based information about Iraq and to encourage international
      recognition of the issue’s importance.
  - id: F7
    kind: situation
    status: assessed
    fact: The JIC Chairman understood the dossier’s purpose as informing public debate with intelligence assessments, not
      making a case for anything.
  - id: F8
    kind: capability
    status: assessed
    fact: The JIC’s assessment concerned Iraqi nuclear, biological, chemical, and ballistic missile programmes and relied
      substantially on judgment; presenting those judgments to a wider public was a different and difficult task that could
      strain neutral, objective standards.
  considerations:
  - id: C1
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The JIC leadership considered JIC responsibility the way to ensure the dossier properly reflected the intelligence
      community’s judgments.
  - id: C2
    facts:
    - F2
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: JIC responsibility was also intended to ensure that publication did not prejudice national security.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Witnesses considered evident JIC endorsement important to credibility because an intelligence-based Government document
      otherwise risked immediate skepticism. The earlier publication about the September 11 attacks without public JIC reference
      was a less comparable case because it attracted less controversy and skepticism about the grounds for Government policy.
  - id: C4
    facts:
    - F6
    - F7
    - F8
    equity: impartiality
    favors:
    - O1
    weight: weak
    why: The Government intended to use the dossier in advocacy, whereas the JIC understood its role as informing debate rather
      than making a case. Explaining judgment-based intelligence assessments to a wider audience was difficult and could strain
      neutral, objective standards.
  reasoning:
    read: This was a choice about who would own an intelligence-based public document, not simply who would prepare it. JIC
      ownership could lend credibility and protect the integrity and security of the assessment, but the Government also intended
      to use the dossier in advocacy while the JIC’s role was dispassionate assessment.
    weighing: The reasons supporting JIC responsibility were that it could help the dossier reflect intelligence-community
      judgments, avoid prejudice to national security, and provide the credibility of evident JIC endorsement. The counterweight
      was the pressure created by Government advocacy and the difficulty of explaining intelligence judgments to a wider audience.
      The JIC took responsibility with commendable motives and did its utmost to maintain its standards; on balance, the stated
      credibility and integrity rationales support {O2}, while the strain remains an important qualification.
    tradecraft: Keep the decision record clear about the distinction between the JIC’s assessment role and the Government’s
      advocacy purpose. Record why JIC ownership is considered necessary and any concern that public presentation could strain
      neutral assessment or national-security protections.
    uncertainty: Witnesses considered JIC endorsement important to credibility, but it is not established that endorsement
      was the only way to secure credibility. The September 11 comparison is limited by the lower controversy and skepticism
      in that case.
    handoff: The Security and Intelligence Co-ordinator and the JIC Chairman should decide with Government agreement, as they
      did, because the choice affects both the JIC’s assessment role and the Government’s intended use of the dossier.
    tempting_wrong:
      option: O1
      pull: Moving responsibility elsewhere might seem to insulate the JIC from Government advocacy and the strain of explaining
        its judgments to the public.
      why_wrong: That response would give up the JIC endorsement that witnesses considered important to the credibility of
        an intelligence-based document, as well as the JIC leadership’s stated reasons for ensuring fidelity to intelligence
        judgments and protecting national security.
    rejected:
      O1: The JIC did not relinquish responsibility because its leadership considered JIC ownership important to reflecting
        intelligence-community judgments and protecting national security, and its endorsement brought the dossier credibility.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: JIC ownership could no longer preserve a dispassionate assessment because Government advocacy had compromised the
        JIC’s ability to maintain neutral and objective standards, and another Government owner could preserve the assessment’s
        integrity.
      then: O1
      why: That would make the pressure on the JIC decisive rather than a recognized strain that it could work to withstand.
    would_not_change:
    - id: noflip1
      if: The September 11 information had also been published without public reference to the JIC.
      why: That precedent is less comparable because it involved less controversy and skepticism about the grounds for Government
        policy.
    watch_for:
    - id: watch1
      what: Whether explaining the assessment to the public, while the Government uses the dossier in advocacy, is putting
        the JIC’s neutral and objective standards under strain.
      favors:
      - O1
      why: This pressure is a real difficulty, even though the JIC took responsibility and did its utmost to maintain its
        standards.
  lesson: Where an intelligence-based public document needs credibility and faithful representation of intelligence judgments,
    assigning ownership to the independent assessment body can serve both aims. That choice carries a corresponding duty to
    recognize and guard against pressure from the Government’s use of the document in advocacy.
  limits: This reasoning concerns responsibility for a public intelligence dossier, not a general rule that an assessment
    body should own every Government publication drawing on intelligence. It does not establish that JIC endorsement is always
    necessary or that another Government owner could never preserve credibility, integrity, and security.
