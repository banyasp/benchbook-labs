case:
  id: DR-XFER-CORPUS-NS-7d5e5ea6-E6-B@v1
  title: Bulk Continuous-Evaluation Record Pulls
  status: draft
  setting: A defense security agency's continuous-evaluation program, United States, 2023; agency personnel-security office.
  decider: The defense security agency
  agent: The defense security agency
  agent_role: decide
  situation: The agency's continuous-evaluation program uses bulk requests for financial and travel records concerning cleared
    employees. Privacy incidents have been traced to requests that included people outside the program's authorized criteria.
    In those incidents, one analyst's decision about which cleared population was in scope resulted in records being pulled
    for hundreds of employees. All subjects are U.S. persons, and the requests are governed by the program's records-access
    rules. Employees have signed forms acknowledging monitoring, including access to specified records. The agency is considering
    whether to require general-counsel preapproval for any pull covering 100 or more people.
  question: What should the defense security agency do about a proposed general-counsel preapproval requirement for record
    pulls covering 100 or more people?
  options:
    O1:
      do: The defense security agency approves a policy requiring general-counsel preapproval for record pulls covering 100
        or more people.
      move: act
      irreversible: false
    O2:
      do: The defense security agency rejects a policy requiring general-counsel preapproval for record pulls covering 100
        or more people.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Privacy incidents in the continuous-evaluation program had been traced to bulk record requests.
  - id: F2
    kind: situation
    status: assessed
    fact: A single analyst's decision about which cleared population was in scope could cause a request to include hundreds
      of employees outside the program's authorized criteria.
  - id: F3
    kind: situation
    status: confirmed
    fact: The continuous-evaluation program used bulk requests for employee records.
  - id: F4
    kind: authority
    status: confirmed
    fact: The program's records-access rules governed the requests.
  - id: F5
    kind: situation
    status: confirmed
    fact: A bulk pull could cover 100 or more people.
  - id: F6
    kind: situation
    status: assessed
    fact: Financial and travel records concerning U.S. persons had significant potential to affect privacy interests.
  - id: F7
    kind: situation
    status: confirmed
    fact: Cleared employees had signed forms acknowledging monitoring and access to specified records.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: A single mistaken scope decision in a bulk request could lead to many records being accessed outside the program's
      criteria, making an additional check relevant to preventing scaled noncompliance.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: usp_privacy
    favors:
    - O1
    weight: strong
    why: Pulls at this scale involve sensitive records about U.S. persons and could significantly affect privacy interests;
      employees' monitoring acknowledgments do not make those records non-sensitive.
  - id: C3
    facts:
    - F2
    - F4
    - F6
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The agency described general-counsel preapproval as an added layer intended to mitigate the risk that high-impact
      record pulls would fail to comply with the program's records-access rules.
  reasoning:
    read: 'This is not merely a choice about handling one record request: one mistaken scope judgment in a bulk pull could
      result in records for hundreds of people being accessed outside the program''s criteria. The trap is to treat the scale
      of the request as an administrative convenience while overlooking its cumulative effect on the privacy of U.S. persons.'
    weighing: 'The agency''s stated reasons support preapproval: scope errors in bulk requests can affect many people, and
      the records can significantly implicate privacy interests. General-counsel review is the safeguard the agency selected
      to mitigate the risk of noncompliance with its records-access rules. The record gives no specific operational-flexibility
      benefit or delay concern to weigh against that safeguard.'
    tradecraft: 'For record pulls within the proposed threshold, require general-counsel approval before the pull proceeds.
      Keep the decision focused on the safeguard''s purpose: reducing the risk that a single mistaken scope assessment will
      lead to widespread noncompliance.'
    uncertainty: The record identifies the risk and the purpose of general-counsel review, but does not report measured effectiveness,
      review burdens, or effects on operational timeliness.
    handoff: Involve general counsel before a covered record pull proceeds; preapproval is the chosen additional review layer.
    tempting_wrong:
      option: O2
      pull: Rejecting preapproval may seem to preserve operational flexibility.
      why_wrong: The record identifies a concrete risk of many out-of-scope records being accessed and significant privacy
        effects, while giving no evidence that rejecting review is needed to meet an operational requirement.
    rejected:
      O2: The agency chose preapproval because one mistaken scope assessment could affect records for hundreds of employees
        and the pulls could significantly affect privacy interests.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that bulk pulls at this scale could not multiply access incidents and presented no significant
        privacy risk.
      then: O2
      why: The stated justification for added review depends on the scale of the compliance risk and the potential impact
        on privacy.
    would_not_change:
    - id: noflip1
      if: Each person's records in a bulk pull were individually authorized under the applicable rules, but the risk of a
        single mistaken scope assessment affecting many people remained.
      why: Individual authorization would not, by itself, remove the aggregation risk or the stated need to mitigate potential
        noncompliance.
    watch_for:
    - id: watch1
      what: Whether the review requirement remains limited to pulls covering 100 or more people, or is later expanded to all
        bulk pulls.
      favors:
      - O1
      why: An expansion would show that the agency extended the same preapproval safeguard beyond the initial threshold.
  lesson: When one decision can scale into many compliance incidents and implicate significant privacy interests, assess the
    cumulative risk rather than treating each person's records as an isolated matter. A proportionate preapproval safeguard
    is supported when it directly addresses that risk and no countervailing operational harm is established.
  limits: This reasoning concerns bulk record pulls in a defense security agency's continuous-evaluation program, governed
    by its records-access rules and involving the documented risk of scaled out-of-scope access. It does not establish that
    general-counsel preapproval is appropriate for every personnel-security record request or for settings with materially
    different risks or demonstrated operational costs.
