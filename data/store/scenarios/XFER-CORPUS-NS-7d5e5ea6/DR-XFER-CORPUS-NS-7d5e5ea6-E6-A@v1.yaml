    episode_focus: The decision point is FBI’s adoption of preapproval for batch jobs of 100 or more queries, later expanded
      to all batch jobs. Focus on the balance between operational flexibility and privacy and civil-liberties safeguards;
      exclude the mechanics of conducting queries.
    equities: pilot2
