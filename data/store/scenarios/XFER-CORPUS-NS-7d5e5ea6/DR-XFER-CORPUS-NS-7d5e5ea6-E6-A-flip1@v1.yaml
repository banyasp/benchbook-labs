case:
  id: DR-XFER-CORPUS-NS-7d5e5ea6-E6-A-flip1@v1
  title: Bulk Screening-List Nominations
  status: draft
  setting: Washington, D.C., March 2023, National Counterterrorism Screening Center.
  decider: The Center
  agent: The Center
  agent_role: decide
  situation: The Center is reviewing compliance incidents associated with batch nominations to a counterterrorism screening
    list. Reliable audit evidence showed that batches at this scale could not multiply compliance incidents. In each incident,
    one analyst's judgment that a group met the nomination criteria resulted in 100 or more people being nominated at once.
    The nominations are governed by the Center's written nomination guidelines, and batches can include U.S. persons whose
    placement may affect travel and other civil liberties. Reliable evidence showed that batch nominations at this scale presented
    no significant risk to travel or other civil liberties. The Center is considering a counsel-preapproval requirement for
    batches of 100 or more people. Individual urgent nominations are exempt from the proposed batch requirement.
  question: What should the Center do about a proposed counsel-preapproval requirement for batch nominations of 100 or more
    people?
  options:
    O1:
      do: The Center rejects a policy requiring counsel preapproval for batch nominations of 100 or more people.
      move: act
      irreversible: false
    O2:
      do: The Center approves a policy requiring counsel preapproval for batch nominations of 100 or more people.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Reliable audit evidence showed that batch nominations at this scale could not multiply compliance incidents.
  - id: F2
    kind: situation
    status: assessed
    fact: A single analyst's mistaken judgment that a group met the criteria could result in 100 or more people being nominated.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Center used batch nominations to submit multiple people for screening-list consideration.
  - id: F4
    kind: authority
    status: confirmed
    fact: Screening-list nominations were governed by the Center's written nomination guidelines.
  - id: F5
    kind: situation
    status: confirmed
    fact: A batch nomination could cover 100 or more people and could include U.S. persons.
  - id: F6
    kind: situation
    status: assessed
    fact: Reliable evidence showed that batch nominations at this scale presented no significant risk to travel or other civil
      liberties.
  - id: F7
    kind: authority
    status: confirmed
    fact: The proposed batch preapproval requirement exempted individual urgent nominations.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: Although one mistaken judgment could lead to a large batch nomination, reliable audit evidence showed that batches
      at this scale could not multiply compliance incidents, weakening the stated compliance rationale for added preapproval.
  - id: C2
    facts:
    - F5
    - F6
    equity: usp_privacy
    favors:
    - O1
    weight: strong
    why: Batches can include U.S. persons, but reliable evidence showed that batch nominations at this scale presented no
      significant risk to travel or other civil liberties; the asserted civil-liberties rationale for added review is therefore
      not established.
  - id: C3
    facts:
    - F2
    - F4
    - F6
    equity: policy_compliance
    favors:
    - O1
    weight: weak
    why: The written guidelines remain applicable and a mistaken assessment is possible, but the evidence of no significant
      risk at this scale weakens the case that counsel preapproval is a proportionate additional safeguard for these batches.
  reasoning:
    read: 'This is a choice about handling batch nominations: one mistaken judgment could affect 100 or more people. But reliable
      evidence shows that batches at this scale cannot multiply compliance incidents and present no significant risk to travel
      or other civil liberties. The scale of a batch alone does not establish the cumulative harms that would justify the
      proposed additional review.'
    weighing: 'The Center''s written nomination guidelines still govern, and a mistaken eligibility assessment remains possible.
      However, the reliable evidence removes the stated grounds for requiring counsel preapproval at this threshold: batches
      at this scale cannot multiply compliance incidents and present no significant risk to travel or other civil liberties.
      The record identifies no separate justification for imposing this additional review requirement. Rejecting the proposed
      requirement is therefore the better-supported choice.'
    tradecraft: Reject the proposed counsel-preapproval requirement for batches of 100 or more people on this record. Keep
      the written nomination guidelines in force; the evidence does not establish that this added review is warranted by the
      risks at this scale.
    uncertainty: The record reports reliable evidence about compliance incidents and civil-liberties risk at this scale, but
      does not report measured review burdens or effects on the timeliness of covered batch nominations.
    handoff: Do not add the proposed counsel-preapproval requirement for covered batch nominations. The exemption for individual
      urgent nominations remains applicable.
    tempting_wrong:
      option: O2
      pull: Requiring preapproval may seem prudent because a single mistaken judgment can lead to 100 or more people being
        nominated and the written guidelines govern those nominations.
      why_wrong: The evidence indicates that batches at this scale cannot multiply compliance incidents and present no significant
        risk to travel or other civil liberties. The record does not establish a separate reason to impose counsel preapproval
        despite the reduced risks.
    rejected:
      O2: 'The Center should not require preapproval on this record: reliable evidence shows that batch nominations at this
        scale cannot multiply compliance incidents and present no significant risk to travel or other civil liberties.'
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that batch nominations at this scale could multiply compliance incidents or presented significant
        risk to travel or other civil liberties.
      then: O2
      why: Evidence of either scaled compliance risk or significant civil-liberties risk would restore the stated justification
        for added review.
    would_not_change:
    - id: noflip1
      if: The people in a batch nomination individually met the applicable guidelines, but the risk of one mistaken assessment
        producing many incidents remained.
      why: Individual eligibility assessments would not, by themselves, remove the aggregation risk or the stated need to
        mitigate potential noncompliance.
    watch_for:
    - id: watch1
      what: Whether the review requirement remains limited to batches of 100 or more people or is later extended to all batch
        nominations.
      favors:
      - O1
      why: Extending preapproval beyond the initial threshold would apply the same review safeguard to smaller batches.
  lesson: When reliable evidence shows that batch scale does not multiply compliance incidents and presents no significant
    risk to civil liberties, do not assume that a batch threshold alone warrants additional preapproval. Match safeguards
    to the risks the evidence establishes.
  limits: This reasoning concerns batch nominations governed by the Center's written nomination guidelines and reliable evidence
    about compliance incidents and civil-liberties risk at this scale. It does not establish that counsel preapproval is inappropriate
    in settings with materially different risks or evidence.
