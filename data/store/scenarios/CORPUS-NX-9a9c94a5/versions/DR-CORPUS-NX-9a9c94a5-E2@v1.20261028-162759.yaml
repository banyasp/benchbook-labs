case:
  id: DR-CORPUS-NX-9a9c94a5-E2@v1
  title: Authority Under Immediate Pressure
  status: draft
  setting: A street engagement in Iraq; the Civilian Police Assistance Training Team advisory role; time not specified.
  decider: The American advisor
  agent: The American advisor
  agent_role: decide
  situation: The American advisor is accompanying Iraqi commandos as an observer and is outside their chain of command. Iraqi
    officers are killed or wounded, and the situation is deteriorating. The advisor cannot identify the senior NCO who remains
    on his feet. Taking command would expose the advisor to danger, and a language barrier leaves uncertain whether the commandos
    would understand or follow him. The commandos are nearly surrounded, and withdrawing would be hazardous and leave killed
    or wounded comrades behind. Intervening could also affect relations with the Iraqi interim government and the advisor’s
    rapport with the commandos.
  question: What should the American advisor do as the Iraqi officers are down and the commandos face immediate danger?
  options:
    O1:
      do: The American advisor withdraws, leaving the surviving commandos and their casualties behind.
      move: act
      irreversible: false
    O2:
      do: The American advisor intervenes, rallies the surviving commandos, and remains with them.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The American advisor accompanied the commandos as an observer, was outside their chain of command, and had no authority
      over them.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Iraqi officers had been killed or wounded, and the situation was rapidly deteriorating.
  - id: F3
    kind: capability
    status: confirmed
    fact: The advisor could not identify the senior NCO who was still on his feet.
  - id: F4
    kind: situation
    status: assessed
    fact: A direct attempt to take command would require the advisor to expose himself to enemy fire.
  - id: F5
    kind: capability
    status: assessed
    fact: A significant language barrier meant the advisor could not be sure the commandos would understand his directions
      or agree to follow him.
  - id: F6
    kind: situation
    status: assessed
    fact: The Iraqi interim government could take offense at an American acting presumptuously, potentially creating an international
      incident.
  - id: F7
    kind: situation
    status: assessed
    fact: The commandos were virtually surrounded, and retreat would be hazardous and require abandoning killed and wounded
      comrades.
  - id: F8
    kind: situation
    status: assessed
    fact: Retreat could save the advisor’s life but could end his rapport with the commandos and weaken the stature of the
      Civilian Police Assistance Training Team in Iraqi eyes.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: With the Iraqi officers down and the commandos in a rapidly deteriorating, nearly surrounded situation, intervention
      offered a chance to prevent the surviving commandos and their wounded comrades from being overwhelmed.
  - id: C2
    facts:
    - F1
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The advisor was outside the command chain and had no authority over the commandos; taking command could be seen as
      presumptuous by the Iraqi interim government and create an international incident.
  - id: C3
    facts:
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Intervening exposed the advisor to enemy fire, while the language barrier left uncertain whether the commandos would
      understand or follow him.
  - id: C4
    facts:
    - F7
    - F8
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Withdrawal would be hazardous and leave killed and wounded comrades behind; although it might save the advisor, it
      could end his rapport with the commandos and weaken the advisory team's standing with Iraqis.
  reasoning:
    read: 'This was an immediate crisis after the Iraqi officers were killed or wounded, not a routine question of an advisor
      exercising authority. The trap was to treat the lack of formal authority as the only consideration, or to treat withdrawal
      as a safe way to avoid overstepping: the commandos were nearly surrounded, and retreat itself carried serious danger
      and relational costs.'
    weighing: 'The lack of authority, risk of offense to the Iraqi interim government, danger to the advisor, and uncertainty
      about whether the commandos would follow all weighed against intervention. But the officers were down, the situation
      was deteriorating, and withdrawal risked abandoning casualties and damaging rapport. The account endorses intervention:
      the advisor''s experience and training, in the absence of the commando leaders, helped prevent the remaining Iraqis
      from being annihilated. The balance depended on the immediate danger and lack of effective leadership, not on a general
      grant of command authority.'
    tradecraft: Make the urgent decision on the information available, seek assistance, and keep any intervention limited
      to what the immediate crisis requires. Once the situation permits, explain and record the reasons for acting outside
      the advisory role and raise the authority and coordination issue with the appropriate leadership.
    uncertainty: The advisor could not identify the senior NCO, could not be sure the commandos would understand or follow
      him, and faced uncertainty about the Iraqi government's response. The account's chosen course did not eliminate these
      uncertainties; it weighed them against the immediate danger to the commandos.
    handoff: The account presents an immediate decision for the advisor rather than one that could wait for referral. He should
      seek assistance while acting; consultation or reporting to appropriate leadership can follow when the urgency allows.
    tempting_wrong:
      option: O1
      pull: Withdrawal could protect the advisor from the danger of taking command without authority and from possible diplomatic
        consequences.
      why_wrong: It could leave a virtually surrounded force's killed and wounded behind, was itself hazardous, and risked
        ending the advisor's rapport with the commandos and weakening the team's standing.
    rejected:
      O1: Withdrawal was not chosen because its risks to the commandos, their casualties, and the advisor's rapport outweighed
        the danger and authority concerns of intervening in the immediate crisis.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The commandos were not in immediate danger and an effective Iraqi leader could take charge without the advisor intervening.
      then: O1
      why: Without the urgent danger and leadership gap that made intervention valuable, the advisor's lack of authority and
        the risk of offending the Iraqi government would weigh more heavily.
    - id: flip2
      if: Intervention were likely to be rejected by the commandos or to cause a serious diplomatic incident, while withdrawal
        no longer required abandoning casualties or undertaking a hazardous retreat.
      then: O1
      why: Those changed conditions would substantially reduce intervention's potential to help and lessen the costs of withdrawal.
    would_not_change:
    - id: noflip1
      if: The advisor still could not identify the senior NCO, while the commandos remained in immediate danger.
      why: That uncertainty did not prevent the account's endorsed choice to intervene when the leaders were down and the
        situation was deteriorating.
    watch_for:
    - id: watch1
      what: Whether the Iraqi interim government would view intervention as presumptuous and take offense.
      favors:
      - O1
      why: The account identifies this as a possible international consequence of an American acting without authority.
  lesson: In an immediate crisis, an advisor's lack of command authority remains a serious constraint, but it is not the only
    relevant consideration when leaders are down and people face imminent danger. Weigh the risk of overstepping against the
    harm of inaction, and do not generalize an emergency intervention into a standing authority to command.
  limits: This reasoning applies to the source's immediate crisis, with Iraqi officers down and a rapidly deteriorating situation.
    It does not establish a general authority for an advisor to take command or resolve cases where there is time for an effective
    Iraqi leader or higher authority to decide.
