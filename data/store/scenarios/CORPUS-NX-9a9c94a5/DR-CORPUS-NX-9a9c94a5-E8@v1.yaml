case:
  id: DR-CORPUS-NX-9a9c94a5-E8@v1
  title: Withholding Air Support Amid Conflicting Markings
  status: draft
  setting: Syahcow area; during a Coalition patrol engagement; RC South and CJSOTF context.
  decider: The patrol's air-support coordinator
  agent: The patrol's air-support coordinator
  agent_role: decide
  situation: An aircraft providing close air support was on station for the patrol. The patrol's air-support coordinator and
    the pilot had agreed on an air-support target. The coordinator had reported that the nearest friendly troops were marked
    with red smoke, the only marking available. An unidentified voice over the radio then said that red smoke marked the enemy.
    The coordinator suspected the voice might be from an airborne command-and-control element, but its identity was not established.
  question: What should the patrol's air-support coordinator do about the agreed air-support action after the conflicting
    marking report?
  options:
    O1:
      do: The patrol's air-support coordinator approves the agreed air-support action.
      move: act
      irreversible: true
    O2:
      do: The patrol's air-support coordinator holds the agreed air-support action pending clarification.
      move: hold
      irreversible: false
    O3:
      do: The patrol's air-support coordinator rejects the agreed air-support action.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: An aircraft providing close air support was on station for the patrol.
  - id: F2
    kind: situation
    status: confirmed
    fact: The patrol's air-support coordinator and the pilot had agreed on an air-support target.
  - id: F3
    kind: situation
    status: confirmed
    fact: The coordinator had reported that the nearest friendly troops were marked with red smoke.
  - id: F4
    kind: situation
    status: confirmed
    fact: Red smoke was the only marking available to the patrol.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: An unidentified voice over the radio said that red smoke marked the enemy.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The coordinator suspected the voice might be from an airborne command-and-control element; the voice was unidentified.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The conflicting report concerned the patrol's only marking, which the coordinator had identified as marking nearby
      friendly troops. Acting before resolving that conflict risked endangering friendly personnel.
  - id: C2
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The radio voice's identity was unknown. Although the coordinator suspected it might be from an airborne command-and-control
      element, that suspicion did not establish who was speaking or resolve the conflicting identification.
  - id: C3
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Air support was available and the coordinator and pilot had agreed on a target, so holding postponed a potential
      contribution to the patrol's mission. There was no stated time pressure or other reason to let that cost override the
      unresolved marking conflict.
  reasoning:
    read: The coordinator had an agreed air-support action, but the only marking available to the patrol was simultaneously
      identified as friendly by the coordinator and as enemy by an unidentified radio voice. The trap is treating the agreement
      on a target, or the coordinator's suspicion about the voice, as if either resolved the conflicting information.
    weighing: The coordinator delayed the bombing to sort out the conflicting identification. That concern outweighed the
      benefit of proceeding with an agreed action while the marking conflict and the voice's identity remained unresolved.
      The balance could change if reliable clarification resolved that conflict.
    tradecraft: Maintain the hold while the conflicting marking report is clarified. Record the conflicting information, what
      remains unknown, and the basis for resuming or abandoning the action.
    uncertainty: The voice was unidentified, its suspected connection to airborne command and control was not established,
      and how the conflicting marking information was ultimately sorted out is unspecified.
    handoff: Involve the patrol commander and the relevant air-support command channel to clarify the conflict rather than
      resolving it on the coordinator's suspicion alone. The identity of whoever clarified the information is unspecified.
    tempting_wrong:
      option: O1
      pull: An aircraft was on station and the coordinator and pilot had already agreed on a target.
      why_wrong: Those facts did not resolve the direct conflict over whether the patrol's only marking identified friendly
        troops or the enemy.
    rejected:
      O1: The coordinator did not approve the agreed action while the conflicting marking report remained unresolved.
      O3: The coordinator delayed rather than permanently rejecting the action, leaving it available once the conflict was
        sorted out.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable clarification establishes that the marking conflict is resolved and the agreed action is directed at the
        intended target.
      then: O1
      why: With the uncertainty that prompted the hold resolved, proceeding with the agreed support action could become appropriate.
    - id: flip2
      if: Clarification establishes that the agreed action cannot be safely or appropriately carried out.
      then: O3
      why: A resolved conflict that shows the action should not proceed would support rejecting it rather than continuing
        to hold it.
    would_not_change:
    - id: noflip1
      if: The coordinator still only suspects, without confirming, that the unidentified voice is from airborne command and
        control.
      why: Suspicion alone does not identify the speaker or resolve the conflicting report, so it would not justify approving
        the action.
    watch_for:
    - id: watch1
      what: Whether the conflicting marking report is credibly clarified.
      favors:
      - O2
      why: Until the conflict is resolved, the reason for delaying the action remains.
  lesson: When a report directly conflicts with the coordinator's account of how friendly personnel are marked, do not treat
    prior agreement on an action as resolving the discrepancy. Hold while the conflict is clarified, then reassess whether
    to proceed or reject the action.
  limits: This reasoning concerns a specific unresolved conflict about the patrol's only marking and an unidentified radio
    voice. It does not establish a general legal rule for air support or determine what action is required when reliable identification
    or other governing authority resolves the uncertainty.
