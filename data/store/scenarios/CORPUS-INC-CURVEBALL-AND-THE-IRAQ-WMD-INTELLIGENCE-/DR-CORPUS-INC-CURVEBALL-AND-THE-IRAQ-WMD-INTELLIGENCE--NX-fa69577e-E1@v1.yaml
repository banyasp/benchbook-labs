case:
  id: DR-CORPUS-INC-CURVEBALL-AND-THE-IRAQ-WMD-INTELLIGENCE--NX-fa69577e-E1@v1
  title: Reassessing a Source’s Credibility
  status: draft
  setting: Iraq, after contrary evidence emerged, DIA and CIA
  decider: DIA and CIA
  agent: DIA and CIA
  agent_role: decide
  situation: DIA had previously assessed the source's credibility using evaluations of his reporting. Scientists and engineers
    in Iraq disputed the source's claims. The source's reporting did not match physical layouts at the facilities under review.
    His behavior indicated that he was being less than truthful. DIA and CIA faced a decision about whether to inform the
    Intelligence Community that the reporting was suspect.
  question: What should DIA and CIA do about disclosing their assessment of the source's reporting to the Intelligence Community?
  options:
    O1:
      do: DIA and CIA withhold from the Intelligence Community the assessment that the source's reporting is suspect.
      move: act
      irreversible: false
    O2:
      do: DIA and CIA disclose to the Intelligence Community that the source's reporting is suspect.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: DIA had assessed the source as credible.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: DIA's earlier credibility assessment was based on evaluations of the source's reporting.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Scientists and engineers in Iraq refuted the source's claims.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The source's reporting did not match physical layouts at the facilities under review.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The source's behavior indicated that he was being less than truthful.
  - id: F6
    kind: situation
    status: confirmed
    fact: DIA and CIA were the agencies involved in determining the source's credibility.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Intelligence Community was the audience identified for notification.
  considerations:
  - id: C1
    facts:
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Scientists and engineers in Iraq refuted the source's claims, weighing against continued reliance on the reporting.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The reporting did not match the physical layouts at the facilities under review, undermining its reliability.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The source's behavior during debriefing indicated that he was being less than truthful.
  reasoning:
    read: DIA had previously assessed the source as credible based on evaluations of his reporting, but the later assessment
      faced contrary evidence from Iraqi scientists and engineers, facility layouts, and the source's behavior. The trap is
      treating the earlier credibility assessment as conclusive after those indicators emerged.
    weighing: The refutation of claims, mismatch with physical layouts, and behavior suggesting untruthfulness collectively
      supported DIA and CIA's determination that the source was a fabricator. They therefore favored notifying the Intelligence
      Community that the reporting was suspect. The balance depends on the adverse evidence described in these assessments;
      the source gives no further account of its verification or weight.
    tradecraft: Communicate the assessment clearly to the identified Intelligence Community audience and preserve the basis
      for the reassessment in the record. These are decision-practice recommendations, not additional reasons stated for the
      outcome.
    uncertainty: The source identifies the adverse indicators but does not detail their scope, the evidence behind each assessment,
      or any remaining disagreement. The stated conclusion is that the indicators warranted treating the reporting as suspect.
    handoff: DIA and CIA were the agencies involved in determining credibility and should communicate their joint assessment
      to the Intelligence Community, the audience identified for notification. The source does not identify any further approval
      or consultation requirement.
    tempting_wrong:
      option: O1
      pull: The prior credibility assessment may make withholding a revised assessment seem prudent.
      why_wrong: That earlier assessment does not resolve the later contrary evidence; DIA and CIA concluded the source was
        a fabricator and notified the Intelligence Community that his reporting was suspect.
    rejected:
      O1: Withholding the assessment was not chosen because DIA and CIA determined the source was a fabricator and notified
        the Intelligence Community that the reporting was suspect.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable new evidence substantially rebutted the claims of refutation, explained the mismatch with facility layouts,
        and undermined the assessment of the source's truthfulness.
      then: O1
      why: If the adverse indicators no longer supported treating the reporting as suspect, withholding that assessment could
        be warranted.
    would_not_change:
    - id: noflip1
      if: The earlier credibility assessment remained in the record alongside the stated contrary evidence.
      why: The earlier assessment alone would not outweigh the later refutation, physical mismatch, and behavior indicating
        untruthfulness.
    watch_for:
    - id: watch1
      what: Further evaluation that validates or rebuts the claims of refutation, the physical-layout mismatch, or the behavioral
        assessment.
      favors:
      - O2
      - O1
      why: Those are the stated grounds for the credibility reassessment, so material changes in their evidentiary support
        could affect whether the reporting should be disclosed as suspect.
  lesson: A prior credibility assessment should be revisited when material contrary indicators emerge. When those indicators
    support a finding that reporting is suspect, communicate the reassessment to the relevant intelligence audience rather
    than allowing the earlier assessment to stand unqualified.
  limits: This reasoning concerns disclosure of a source-credibility reassessment within the Intelligence Community. It does
    not establish a general disclosure rule or specify how to resolve conflicting evidence beyond the indicators described
    here.
