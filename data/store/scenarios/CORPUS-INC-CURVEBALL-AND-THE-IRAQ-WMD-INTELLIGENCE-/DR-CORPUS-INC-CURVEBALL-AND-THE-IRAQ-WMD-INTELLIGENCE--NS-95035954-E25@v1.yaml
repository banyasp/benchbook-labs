case:
  id: DR-CORPUS-INC-CURVEBALL-AND-THE-IRAQ-WMD-INTELLIGENCE--NS-95035954-E25@v1
  title: Elevating Source-Reliability Concerns Before a Speech
  status: draft
  setting: CIA Iraqi Task Force, February 4, 2003, one day before the Secretary of State’s speech.
  decider: The Deputy Chief of the CIA’s Iraqi Task Force
  agent: The Deputy Chief of the CIA’s Iraqi Task Force
  agent_role: decide
  situation: The Deputy Chief received an email from a detailee about concerns with the reliability of sources informing the
    forthcoming speech. The detailee had previously raised concerns with analysts and was frustrated as the speech took shape.
    The Deputy Chief believed the concerns had been raised repeatedly and were already known to analysts and superiors. The
    Deputy Chief invited the detailee to discuss the concerns and acknowledged that a warning might be owed if the reservations
    were genuine. The speech was near completion, and the Deputy Chief believed the analysts would not use the source information
    without resolving the concerns.
  question: 'What should the Deputy Chief do before the speech: disclose the detailee’s concerns through the existing review
    process or withhold them from that process?'
  options:
    O1:
      do: The Deputy Chief discloses the detailee’s concerns through the existing review process before the speech.
      move: act
      irreversible: false
    O2:
      do: The Deputy Chief withholds the detailee’s concerns from the existing review process before the speech.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The detailee’s email reached the Deputy Chief on February 4, 2003, one day before the Secretary of State’s speech.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The detailee said he had repeatedly discussed his concerns about a source with analysts as the speech took shape.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Deputy Chief invited the detailee to discuss his concerns and wrote that a brief warning was owed if the reservations
      were genuine.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Deputy Chief believed the email contained no new information and that the detailee had raised the concerns many
      times before.
  - id: F5
    kind: situation
    status: assessed
    fact: The detailee said the Deputy Chief told him the speech was too far along to raise the concerns; the Deputy Chief
      later could not recall whether he made that comment.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Deputy Chief believed the analysts and his superiors already knew the detailee’s concerns; he could not recall
      whether he passed them to the Task Force Chief and had no record of doing so.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Deputy Chief believed the analysts would not have used the source information in the speech if they had not
      resolved the detailee’s concerns.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Deputy Chief believed management would listen to valid concerns but had already heard the detailee’s concerns
      repeatedly and was not interested in hearing them again.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The detailee had raised concerns about source reliability while the speech was taking shape, and the Deputy Chief
      acknowledged that a warning was owed if the reservations were genuine.
  - id: C2
    facts:
    - F4
    - F6
    - F8
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The Deputy Chief believed the concerns were repeated, not new, and already known to analysts and superiors; he also
      believed management was not interested in hearing them again.
  - id: C3
    facts:
    - F1
    - F5
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The speech was only a day away, and the detailee said he was told it was too far along to raise the concerns.
  - id: C4
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Deputy Chief could not recall passing the specific concerns to the Task Force Chief and had no record of doing
      so; his belief that analysts had resolved them did not establish that the concerns had reached the decision process.
  reasoning:
    read: The decision is not simply whether to repeat an objection already discussed with analysts. It is whether the concern
      has been brought into the review process where it can be considered before the speech. The trap is treating the Deputy
      Chief’s belief that others already knew and had resolved the concern as equivalent to ensuring it was on the table.
    weighing: 'The Deputy Chief had reasons to think another warning would add little: he believed the concern was familiar,
      the speech was near completion, and analysts would not proceed without resolving it. But he could not recall ensuring
      the concern reached the Task Force Chief, and his belief about resolution did not establish that the issue had been
      presented for decision. The DCI’s stated judgment was that concerns should have gone through the process so they could
      be presented to the Secretary and debated. That judgment makes disclosure through the process the stronger choice, even
      with the timing pressure.'
    tradecraft: Pass the concern promptly through the existing review channel, identify it as a concern about source reliability,
      and record who received it and whether it was considered. Do not treat prior discussion or an assumed resolution as
      a substitute for documenting that the concern reached the relevant decision-makers.
    uncertainty: The record leaves uncertainty about whether the Deputy Chief told the Task Force Chief and whether the analysts
      had resolved the detailee’s concerns. The Deputy Chief believed they had, but could not recall passing on the specific
      concerns or point to a record of doing so.
    handoff: Use the existing review process and involve the relevant Task Force and analytic leadership so the concern can
      be considered and, if appropriate, presented to the Secretary. The Deputy Chief need not resolve the analytic dispute
      alone.
    tempting_wrong:
      option: O2
      pull: The concern seemed familiar, the speech was nearly complete, and the Deputy Chief believed analysts had already
        resolved it.
      why_wrong: Those beliefs did not ensure that the specific concern reached the decision process; the DCI said it should
        have been put on the table for possible debate.
    rejected:
      O2: Withholding the concern was not chosen because the Deputy Chief’s belief that it was already known or resolved did
        not replace putting it through the process for consideration.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A contemporaneous record showed that the specific concerns had already been presented to the relevant decision-makers,
        explicitly adjudicated, and resolved before the speech.
      then: O2
      why: A documented review and resolution would remove the principal reason to elevate the same concern again through
        the process.
    would_not_change:
    - id: noflip1
      if: The speech remained only a day away.
      why: The short timeline would make prompt handling important, but would not by itself establish that the concern had
        reached the review process.
    watch_for:
    - id: watch1
      what: Whether there is a record that the specific concerns were communicated to the relevant decision-makers and considered,
        rather than merely being familiar to analysts.
      favors:
      - O1
      why: The Deputy Chief could not recall passing the concerns to the Task Force Chief and had no record of doing so.
  lesson: Repeated discussion of a concern is not the same as ensuring that it reaches the decision process responsible for
    acting on it. When a concern may affect a consequential official presentation, elevate it through the established channel
    and make its consideration traceable, even when the deadline is close.
  limits: This reasoning concerns whether source-reliability concerns were appropriately elevated before a speech. It does
    not establish whether the underlying concerns were correct, whether they should have changed the speech, or what result
    a review would have reached.
