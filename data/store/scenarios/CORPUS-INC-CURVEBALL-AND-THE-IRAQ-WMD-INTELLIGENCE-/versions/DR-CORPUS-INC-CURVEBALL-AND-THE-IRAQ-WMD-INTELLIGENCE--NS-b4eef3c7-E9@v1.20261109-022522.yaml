case:
  id: DR-CORPUS-INC-CURVEBALL-AND-THE-IRAQ-WMD-INTELLIGENCE--NS-b4eef3c7-E9@v1
  title: When to Correct the Mobile BW Assessment
  status: draft
  setting: CIA headquarters and Iraq, early 2004.
  decider: CIA senior management
  agent: CIA senior management
  agent_role: decide
  situation: Analysts investigating two trailers discovered in Iraq in April and May 2003 became doubtful that they were mobile
    BW facilities. People identified as participants denied knowing of the project, and the informant’s supervisors, family,
    and travel records contradicted parts of his account. By October 2003, some WINPAC analysts assessed that the reporting
    was fabricated, while other analysts and CIA headquarters management continued to support it. In January 2004, travel
    records confirmed the informant had been out of Iraq during a period when he claimed to be working on the program, and
    most analysts were convinced his reporting was fabricated. CIA senior management had to weigh correcting the assessment
    against waiting for the Iraq investigation to finish, seeking direct access to the informant, and reconciling internal
    analytic disagreements.
  question: What should CIA senior management do about the mobile BW assessment in early 2004?
  options:
    O1:
      do: CIA senior management retains the mobile BW assessment and continues supporting its underlying reporting.
      move: act
      irreversible: false
    O2:
      do: CIA senior management defers correction until the Iraq investigation, direct access, and analytic review are complete.
      move: hold
      irreversible: false
    O3:
      do: CIA senior management retracts the mobile BW assessment and issues a correction promptly.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Coalition forces discovered two trailers in Iraq in April and May 2003 that were then thought to be mobile BW facilities.
  - id: F2
    kind: intelligence
    status: assessed
    fact: As the Iraq investigation continued, at least one WINPAC analyst and some DIA and INR analysts became doubtful that
      the trailers were BW-related.
  - id: F3
    kind: intelligence
    status: assessed
    fact: People identified as participants consistently denied knowing of the mobile BW project, and supposed project designers
      did not know the informant.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Interviews with the informant’s supervisors, friends, and family established that he had been fired from his government
      position in 1995.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A family member reported that the informant had been outside Iraq for substantial periods between 1995 and 1999.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Travel records confirmed that the informant was outside Iraq during the 1998 period when he claimed to have been
      present for a BW production run.
  - id: F7
    kind: intelligence
    status: assessed
    fact: By the end of October 2003, WINPAC analysts investigating the reporting assessed that it was fabricated and false,
      while other WINPAC analysts and CIA headquarters management continued to support it.
  - id: F8
    kind: intelligence
    status: confirmed
    fact: By January 2004, CIA had obtained travel records confirming that the informant had been outside Iraq during a period
      when he claimed to be working on the mobile BW program.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Senior managers wanted the Iraq Survey Group to complete its work and CIA to obtain direct access to the informant
      before correcting the mobile-labs analysis.
  - id: F10
    kind: situation
    status: assessed
    fact: WINPAC biological and chemical group management was struggling to reconcile strong disagreements among BW analysts,
      and CIA management was concerned about the political appearance of disavowing the reporting.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F6
    - F8
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Doubt about the trailers was reinforced by participants’ denials and contradictions in the informant’s employment
      and whereabouts, including confirmed travel records that placed him outside Iraq when he claimed to be present for a
      BW production run.
  - id: C2
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: By October, investigating analysts assessed the reporting as fabricated, and by January the travel records had persuaded
      most analysts that it was fabricated; continuing to support the assessment despite that record risked leaving intelligence
      uncorrected.
  - id: C3
    facts:
    - F9
    - F10
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Waiting for the Iraq Survey Group to finish, seeking direct access to the informant, and reconciling strong analytic
      disagreements were stated reasons for delaying correction. These concerns supported caution, but did not outweigh the
      accumulated disconfirming evidence.
  - id: C4
    facts:
    - F10
    equity: institutional_credibility
    favors:
    - O1
    - O2
    weight: weak
    why: Management was concerned about how disavowing the reporting would appear to senior CIA leadership and the wider government.
      Avoiding an embarrassing reversal was not a sound basis for continuing to support reporting judged fabricated.
  reasoning:
    read: 'This was no longer just an unresolved dispute about two trailers: independent contradictions had accumulated, and
      by January the travel records had convinced most analysts the informant had fabricated his account. The trap was treating
      completion of every review and concern about the appearance of reversal as prerequisites to correcting an assessment
      whose reliability was already seriously compromised.'
    weighing: The evidence of fabrication and the analysts’ resulting judgment favor prompt correction {C1} {C2}. Waiting
      for the Iraq investigation, direct access, and internal reconciliation had been management’s stated rationale, but those
      reasons carried less weight as the contradictory record strengthened {C3}. Concern about political appearance did not
      justify continued support {C4}. The balance depends on whether further review could substantiate the reporting; in the
      actual course, direct access did not resolve the discrepancies, and the CIA concluded the reporting was unreliable and
      recalled it.
    tradecraft: Issue the correction promptly, state plainly that the assessment is withdrawn, and distinguish the confirmed
      contradictions from analytic judgments and unresolved disagreement. Record the basis for the change and the remaining
      uncertainty so the correction is clear and accountable.
    uncertainty: There had been substantial disagreement among analysts, and management had reason to seek further review.
      But by January the travel records had changed most analysts’ assessment; later direct access failed to explain the discrepancies
      and removed the remaining doubts.
    handoff: Senior management should make the correction decision while obtaining the relevant analytic views from WINPAC
      and the Iraq investigation. Their input helps resolve evidentiary disagreements, but should not turn political concern
      or a desire for unanimity into a reason to leave an unreliable assessment uncorrected.
    tempting_wrong:
      option: O2
      pull: Deferring correction could seem prudent while the Iraq investigation finished, direct access was sought, and analysts
        reconciled their differences.
      why_wrong: Those were the stated reasons for delay, but the accumulating contradictions and January travel records made
        continued delay increasingly difficult to justify; direct access ultimately did not restore the reporting’s credibility.
    rejected:
      O1: Continued support was not chosen because the evidence led the CIA to conclude that the informant had fabricated
        his reporting and to recall it.
      O2: Further review had been a reason for delay, but the evidence available by early 2004 called for correction rather
        than another open-ended deferral.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Direct examination had shown the informant’s account stood up, or the Iraq investigation had uncovered evidence
        requiring the account to be adjusted rather than withdrawn.
      then: O1
      why: That is the counterfactual concern management identified as a reason not to disavow the reporting before review
        was complete.
    - id: flip2
      if: The travel records had not confirmed that the informant was outside Iraq during a period when he claimed to be working
        on the program, and the other contradictions remained unresolved.
      then: O2
      why: Without that confirmation, a short deferral for investigation and analytic review would have had greater evidentiary
        weight.
    would_not_change:
    - id: noflip1
      if: Management remained concerned that correcting the assessment would look politically damaging.
      why: Concern about appearances does not rebut the evidence that led analysts and ultimately the CIA to judge the reporting
        fabricated.
    watch_for:
    - id: watch1
      what: Whether substantial analytic disagreement remains after the contradictory evidence is reviewed.
      favors:
      - O2
      why: Unresolved disagreement can warrant focused review, but should not by itself sustain an assessment contradicted
        by the available evidence.
  lesson: Correct intelligence when substantial, corroborated contradictions make its underlying reporting unreliable; do
    not let political optics or a desire to finish every review postpone correction indefinitely. Further review can inform
    the correction, but should change the outcome only if it materially substantiates the reporting.
  limits: This reasoning concerns correction of an intelligence assessment where the source’s reliability was contradicted
    by accumulating evidence. It does not establish a general rule that every disputed assessment must be withdrawn before
    relevant investigation or analytic review is complete.
