case:
  id: DR-CORPUS-NX-2421348f-E1@v1
  title: Command Responsibility for Atrocities
  status: draft
  setting: Philippine Islands, October 9, 1944–September 2, 1945; review by the Supreme Court of the United States.
  decider: The Supreme Court of the United States
  agent: The Supreme Court of the United States
  agent_role: decide
  situation: The Commander, who was military governor of the Philippines and commander of Japanese forces there, faced a charge
    alleging that he failed to control his forces and permitted widespread atrocities. The charge and particulars alleged
    violence and homicide against civilians and prisoners of war, pillage, and destruction of religious monuments; they did
    not allege that the Commander personally committed or directed those acts. The applicable law included treaty provisions
    concerning responsible command, duties of commanders, and public order in occupied territory. The commission considered
    the circumstances facing the Commander, including attacks by superior forces and weaknesses in the organization and condition
    of his troops, and found that he had not taken measures required by the circumstances. A dissenting justice disputed whether
    established law supported imposing command responsibility under conditions of overwhelming attack.
  question: What should the Supreme Court of the United States do about whether the charge states a recognized law-of-war
    violation based on the Commander's alleged failure to control his forces?
  options:
    O1:
      do: The Supreme Court of the United States should accept the charge as alleging a recognized command-duty violation.
      move: act
      irreversible: true
    O2:
      do: The Supreme Court of the United States should reject the charge as alleging no recognized command-duty violation.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The charge covered the period from October 9, 1944, to September 2, 1945, in the Philippine Islands, when the Commander
      was military governor and commander of Japanese forces there.
  - id: F2
    kind: situation
    status: confirmed
    fact: The charge alleged that the Commander unlawfully failed to control his forces, permitting them to commit atrocities
      and other crimes against people in the Philippines and other allied populations.
  - id: F3
    kind: situation
    status: assessed
    fact: The prosecution's particulars alleged 123 acts, including a plan to kill more than 25,000 unarmed civilians in Batangas
      Province and to destroy settlements and property.
  - id: F4
    kind: situation
    status: assessed
    fact: The particulars also alleged violence against civilians and prisoners of war, pillage, and wanton destruction of
      religious monuments.
  - id: F5
    kind: authority
    status: confirmed
    fact: The charge alleged failure to control the forces by permitting their acts; it did not allege that the Commander
      personally committed or directed the atrocities.
  - id: F6
    kind: authority
    status: confirmed
    fact: The cited legal provisions included a requirement that armed forces be commanded by a person responsible for subordinates,
      a duty of commanders-in-chief to provide for execution of the Geneva Convention, and an occupying commander's duty to
      take measures within their power to restore public order and safety.
  - id: F7
    kind: situation
    status: assessed
    fact: The commission considered attacks by superior forces, errors by predecessors, and weaknesses in organization, equipment,
      supply, training, communication, discipline, morale, and subordinate leadership; it found that the Commander had not
      taken measures required by the circumstances.
  - id: F8
    kind: authority
    status: assessed
    fact: A dissenting justice argued that international law did not define a commander's duties under constant and overwhelming
      attack and that applying ordinary command responsibilities in those circumstances was unfair and unsupported by established
      law.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The majority read the cited treaty provisions as imposing an affirmative duty on the Commander to take measures within
      his power and appropriate in the circumstances to protect civilians and prisoners of war.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The alleged atrocities against civilians and prisoners of war were law-of-war violations, and the charge's theory
      was the Commander's breach of his duty to control his forces by permitting them—not that he personally committed or
      directed the acts.
  - id: C3
    facts:
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The commission considered the difficult military conditions and still found that the Commander had not taken measures
      required by the circumstances; the majority noted that the Court did not reweigh the evidence and that no claim was
      made that the measures were beyond his control or inappropriate.
  - id: C4
    facts:
    - F7
    - F8
    equity: impartiality
    favors:
    - O2
    weight: strong
    why: The dissent argued that applying ordinary command responsibilities during overwhelming attack was unsupported by
      established law and risked judging the defeated Commander by disorganization the victorious forces had helped create.
  reasoning:
    read: This is a charge of culpable failure to control forces, not a charge that the Commander personally committed or
      ordered the atrocities. The central difficulty is whether the cited command duties support personal liability when the
      forces were under severe attack and the ability to control them was impaired.
    weighing: The majority relied on the law-of-war purpose of protecting civilians and prisoners, and on treaty provisions
      requiring responsible command and measures to maintain public order in occupied territory. It concluded that those provisions
      imposed an affirmative duty, and that the charge sufficiently alleged breach of that duty by permitting widespread atrocities.
      The commission considered the adverse conditions and found the Commander had not taken measures required in those circumstances;
      the Court did not reweigh that evidence. The dissent's objection that the law did not define command duties under overwhelming
      attack remains a genuine dispute, but it did not displace the majority's conclusion that the charge states a recognized
      violation.
    tradecraft: Keep the legal-sufficiency question distinct from whether the evidence ultimately proves culpability. Record
      the command-duty theory, the cited legal basis, the commission's consideration of circumstances, and the dissent's objection
      without treating the Court's review as a fresh weighing of the evidence.
    uncertainty: The majority upheld the legal sufficiency of the charge and the commission's ability to find guilt on the
      facts found; it did not weigh the evidence anew. The dissent disputed whether established international law supplied
      a sufficiently defined duty under the conditions of overwhelming attack.
    handoff: The Supreme Court resolves the legal-sufficiency question on review; no additional decision-maker is needed for
      that question. The commission's findings about the circumstances remain relevant to its assessment of culpable failure.
    tempting_wrong:
      option: O2
      pull: The Commander did not personally commit or direct the atrocities, and the dissent regarded ordinary command standards
        during overwhelming attack as unfair and unsupported by law.
      why_wrong: That approach treats the absence of direct participation as dispositive, although the majority understood
        the charge to allege a separate breach of command duty and found support for that duty in the cited law-of-war provisions.
    rejected:
      O2: The majority rejected dismissal because the charge alleged a breach of an affirmative command duty by permitting
        specified law-of-war violations, and the commission could find guilt on the facts it found.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The commission had found that the measures required were beyond the Commander's control or inappropriate in the
        circumstances.
      then: O2
      why: The majority's conclusion rested on the absence of any claim that the commission imposed responsibility for measures
        beyond his control or inappropriate to take.
    - id: flip2
      if: The charge alleged only that atrocities occurred, without alleging that the Commander breached a duty to control
        his forces by permitting them.
      then: O2
      why: The majority treated the alleged breach of command duty—not the atrocities alone—as the gist that made the charge
        sufficient against the Commander.
    would_not_change:
    - id: noflip1
      if: The Commander did not personally commit or direct the atrocities.
      why: That was already the charge's posture; the majority held that an alleged failure to discharge the command duty
        could itself state the violation.
    watch_for:
    - id: watch1
      what: The extent to which the attacks and weaknesses in the forces affected the measures within the Commander's power
        and appropriate to the circumstances.
      favors:
      - O2
      why: The dissent regarded those conditions as undermining the fairness and legal foundation for applying ordinary command
        responsibilities; the majority treated them as circumstances for the commission to consider.
  lesson: A command-responsibility charge need not allege that the commander personally committed or directed the underlying
    violations if it alleges a culpable breach of an affirmative duty to control forces. Whether that duty was breached depends
    on the measures within the commander's power and appropriate to the circumstances, while the legal sufficiency of the
    charge remains distinct from appellate reweighing of evidence.
  limits: This conclusion addresses the sufficiency of this charge under the provisions cited and the commission's findings;
    it does not specify a universal standard for command responsibility or resolve every issue concerning knowledge, culpability,
    or battlefield conditions. The dissent's objection shows that the legal basis for applying command duties under overwhelming
    attack was contested.
