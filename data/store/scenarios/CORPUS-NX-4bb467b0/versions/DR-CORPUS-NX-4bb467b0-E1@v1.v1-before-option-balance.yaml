case:
  id: DR-CORPUS-NX-4bb467b0-E1@v1
  title: Choosing an MDMP for a Combined Task Force
  status: draft
  setting: Early in the MDMP cycle, within a task force working with the American army and BRAAR.
  decider: The task force
  agent: The task force
  agent_role: decide
  situation: Early in the MDMP cycle, the task force had to choose a process for planning and executing operations involving
    both armies. Using only the American army's process was associated with confusion, excessive time, and impeded interoperability.
    Using only BRAAR's process was associated with the same problems. The task force needed a process understood by both armies.
    Interpreter and translator personnel were high-demand, low-density resources.
  question: What should the task force do about which MDMP process to use for planning and executing operations?
  options:
    O1:
      do: The task force rejects the combined MDMP and adopts the American-army-only MDMP.
      move: act
      irreversible: false
    O2:
      do: The task force adopts a combined MDMP for planning and execution.
      move: act
      irreversible: false
    O3:
      do: The task force rejects the combined MDMP and adopts the BRAAR-only MDMP.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Early in the MDMP cycle, using only American army or BRAAR MDMP steps was assessed not to work.
  - id: F2
    kind: situation
    status: assessed
    fact: Using only the American army process caused confusion.
  - id: F3
    kind: situation
    status: assessed
    fact: Using only the American army process consumed too much time.
  - id: F4
    kind: situation
    status: assessed
    fact: Using only the American army process impeded interoperability.
  - id: F5
    kind: situation
    status: assessed
    fact: Using only the BRAAR process caused confusion.
  - id: F6
    kind: situation
    status: assessed
    fact: Using only the BRAAR process consumed too much time.
  - id: F7
    kind: situation
    status: assessed
    fact: Using only the BRAAR process impeded interoperability.
  - id: F8
    kind: capability
    status: assessed
    fact: The task force needed a process for planning and executing operations understood by both armies.
  - id: F9
    kind: capability
    status: confirmed
    fact: Interpreter and translator personnel were high-demand, low-density resources.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Using either army's process alone caused confusion, so neither standalone format met the task force's planning need.
  - id: C2
    facts:
    - F3
    - F6
    equity: tempo
    favors:
    - O2
    weight: strong
    why: Either standalone process consumed too much time; the task force identified this as a reason not to rely exclusively
      on either one.
  - id: C3
    facts:
    - F4
    - F7
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Either standalone process impeded interoperability between the armies, supporting a process intended for both.
  - id: C4
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The task force needed a planning and execution process understood by both armies, which was the stated purpose of
      developing a combined MDMP.
  - id: C5
    facts:
    - F9
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: The combined MDMP lessened the need for interpreter and translator support, which was a scarce resource.
  reasoning:
    read: The task force faced a joint-process problem, not a choice between two standalone formats that had each proved workable.
      The trap is treating either army's familiar process as an adequate default despite the confusion, time cost, and interoperability
      problems associated with each.
    weighing: 'The task force''s stated reasons point to O2: neither exclusive national process worked, and a combined MDMP
      was developed so both armies could understand the process and plan and execute together. Reducing reliance on scarce
      interpreter and translator personnel reinforced that choice. The balance would depend on whether a standalone process
      could meet the shared-understanding and interoperability need without the stated drawbacks.'
    tradecraft: 'Record the decision as adoption of a combined MDMP and preserve the stated rationale: the problems with both
      standalone processes, the need for shared understanding, and the reduced interpreter burden. Check whether the combined
      process continues to meet those aims.'
    uncertainty: The source gives qualitative reasons but no comparative measurements of time saved, confusion reduced, interoperability
      achieved, or interpreter support avoided.
    handoff: The task force is the identified decision-maker. Involving representatives of both armies in confirming that
      the process is understood by both is a prudent implementation step, not a separate authority required by the source.
    tempting_wrong:
      option: O1
      pull: The American-army-only process may seem simpler because it uses one army's established format.
      why_wrong: The task force found that using only that process caused confusion, consumed too much time, and impeded interoperability.
    rejected:
      O1: The task force did not choose the American-army-only MDMP because exclusive use of it produced confusion, excessive
        time, and impaired interoperability.
      O3: The task force did not choose the BRAAR-only MDMP because exclusive use of it produced the same stated problems.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A new assessment showed that the American-army-only process was understood by both armies and no longer caused the
        stated confusion, time, or interoperability problems.
      then: O1
      why: Those findings would remove the source's stated reasons for rejecting exclusive use of the American process.
    - id: flip2
      if: A new assessment showed that the BRAAR-only process was understood by both armies and no longer caused the stated
        confusion, time, or interoperability problems.
      then: O3
      why: Those findings would remove the source's stated reasons for rejecting exclusive use of the BRAAR process.
    would_not_change:
    - id: noflip1
      if: Interpreter and translator personnel became more available, but the standalone processes still caused confusion,
        consumed too much time, and impeded interoperability.
      why: Greater personnel availability would reduce the weight of the interpreter-support reason but would not resolve
        the other stated reasons for adopting a combined process.
    watch_for:
    - id: watch1
      what: Whether the combined process remains understood by both armies and continues to reduce reliance on interpreter
        and translator support.
      favors:
      - O2
      why: These are stated aims and benefits of the combined MDMP and provide a basis for reviewing whether it remains suitable.
  lesson: When distinct partners' standalone processes each create confusion, delay, and interoperability problems, do not
    assume that choosing either one will solve the joint-process problem. A shared process is supported when it addresses
    those problems and is understood by both partners.
  limits: This reasoning applies to the stated MDMP choice and the problems identified in this task force's early planning
    cycle. It does not establish that a combined process is always preferable or address other operational procedures.
