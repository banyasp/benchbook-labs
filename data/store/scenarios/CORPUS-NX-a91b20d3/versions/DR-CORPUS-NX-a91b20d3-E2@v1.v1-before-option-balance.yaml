case:
  id: DR-CORPUS-NX-a91b20d3-E2@v1
  title: DIA’s Uncertainty-Reporting Trial
  status: draft
  setting: DIA, July 1976, Department of Defense intelligence analysis
  decider: DIA
  agent: DIA
  agent_role: decide
  situation: DIA is considering how to carry forward its trial of expressions of uncertainty after surveying readers. The
    survey asked 750 DIN readers about the experiment, and 128 responses came from a broad spectrum of DoD consumers. A majority
    favored quantified probability expressions, while respondents showed little enthusiasm for alphabetized expressions of
    confidence in sources. Respondents saw uncertainty expressions as most useful in current intelligence, somewhat less useful
    in estimative intelligence, and least useful in basic intelligence. Customers in the Office of the Secretary of Defense’s
    International Security Affairs singled out quantitative confidence statements as worthy of praise.
  question: What should DIA do about continuing quantified probability statements and retaining alphabetized source ratings
    after surveying readers about the trial?
  options:
    O1:
      do: DIA should discontinue quantified probability statements and drop alphabetized source ratings.
      move: act
      irreversible: false
    O2:
      do: DIA should continue quantified probability statements and drop alphabetized source ratings.
      move: act
      irreversible: false
    O3:
      do: DIA should continue quantified probability statements and retain alphabetized source ratings.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: At the end of the trial, 750 DIN readers were asked about the experiment’s usefulness.
  - id: F2
    kind: situation
    status: confirmed
    fact: The survey received 128 responses from a broad spectrum of DoD consumers.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A majority of respondents favored quantified expressions of probability, believing they increased confidence in
      the information and DIA’s judgment and gave greater credibility to briefings based on DIA material.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Respondents showed little enthusiasm for alphabetized expressions of confidence in sources.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Respondents considered expressions of uncertainty most useful in current intelligence, somewhat less useful in estimative
      intelligence, and least useful in basic intelligence.
  - id: F6
    kind: capability
    status: confirmed
    fact: The uncertainty-expression effort was intended to provide analysts and supervisors greater confidence and consistency
      in using expressions of uncertainty.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Office of the Secretary of Defense International Security Affairs customers singled out DIA’s use of quantitative
      confidence statements as an element of support worthy of praise.
  considerations:
  - id: C1
    facts:
    - F3
    equity: institutional_credibility
    favors:
    - O2
    - O3
    weight: strong
    why: A majority favored quantified probability expressions because they increased confidence in the information and DIA’s
      judgment and gave DIA-based briefings greater credibility.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O1
    - O2
    weight: strong
    why: Respondents showed little enthusiasm for alphabetized source-confidence expressions, weighing against retaining them.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    - O3
    weight: weak
    why: Respondents saw uncertainty expressions as useful, especially in current intelligence, though their perceived value
      varied by intelligence type.
  - id: C4
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    - O3
    weight: weak
    why: The effort was intended to give analysts and supervisors greater confidence and consistency in expressing uncertainty,
      supporting continuation of quantified expressions.
  - id: C5
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O2
    - O3
    weight: weak
    why: OSD International Security Affairs customers specifically praised quantitative confidence statements, reinforcing
      the positive customer response.
  reasoning:
    read: 'DIA had consumer feedback favoring quantified probability statements but not alphabetized source-confidence ratings.
      The trap is treating the trial as a single package: the feedback supported continuing one expression and dropping the
      other.'
    weighing: The majority response and the reported credibility benefit support quantified statements, with additional praise
      from OSD International Security Affairs customers. Respondents’ limited enthusiasm for alphabetized source ratings weighs
      against keeping them. The usefulness of uncertainty expressions varied by intelligence type, but that variation was
      reported alongside overall support rather than as a reason to abandon quantification. On balance, continue quantified
      probability statements and drop alphabetized source ratings.
    tradecraft: 'State the reporting-policy choice as two separate decisions: continue quantified probability statements and
      discontinue alphabetized source ratings. Record the consumer feedback and the distinct rationale for each decision.'
    uncertainty: The choice is grounded in the responses received, not a binding requirement or proof that all consumers would
      assess the expressions alike. There is no further basis here for judging the representativeness of the responses.
    handoff: DIA can make this reporting-policy decision on the consumer feedback presented; no higher approval or referral
      requirement is identified.
    tempting_wrong:
      option: O3
      pull: Keeping both approaches could seem to preserve the full trial and its general aim of improving confidence and
        consistency.
      why_wrong: That treats the expressions as a package and overlooks the respondents’ specific lack of enthusiasm for alphabetized
        source-confidence ratings.
    rejected:
      O1: DIA did not choose to discontinue quantified statements because a majority favored them and customers also praised
        their contribution to confidence and credibility.
      O3: DIA did not retain alphabetized source ratings because respondents showed little enthusiasm for them.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Consumer feedback instead showed strong support for alphabetized source-confidence ratings and a clear benefit from
        retaining them.
      then: O3
      why: That would remove the reported customer-preference reason for dropping the ratings and could favor retaining both
        approaches.
    - id: flip2
      if: Consumers instead reported that quantified probability statements reduced their confidence in DIA’s information
        or judgment.
      then: O1
      why: That would reverse the principal reported benefit supporting continuation of quantified statements.
    would_not_change:
    - id: noflip1
      if: Expressions of uncertainty were viewed as least useful in basic intelligence, while remaining more useful in current
        and estimative intelligence.
      why: That is the variation already described in the feedback and does not outweigh the overall support for quantification
        or the lack of enthusiasm for alphabetized source ratings.
    watch_for: []
  lesson: When feedback distinguishes between components of a trial, decide on each component separately rather than continuing
    or ending the package as a whole. Preserve the approach that consumers say improves confidence and credibility, and discontinue
    the approach they do not find useful.
  limits: This reasoning applies to the reporting-policy choice between quantified probability statements and alphabetized
    source ratings. It does not establish whether quantified judgments are accurate in every case or useful in every intelligence
    product, or set a general rule for other agencies or later circumstances.
  library:
    domain: intel-analysis
    family: CORPUS-NX-a91b20d3
    source: https://www.cia.gov/resources/csi/static/673d0414fdd6f124560185cca4a61d26/ICs-Struggle-to-Express.pdf
    episode_focus: 'The decision point is how DIA would carry the trial forward after surveying readers: retain quantified
      probability statements, and whether to retain the letter ratings for sources. The reported consumer preferences support
      the choice; exclude implementation details beyond the reporting policy.'
