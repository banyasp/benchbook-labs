case:
  id: DR-CORPUS-NX-cf776672-E2@v1
  title: Choosing Charges in a New Legal Territory
  status: draft
  setting: Colorado, 1994; the FBI and Colorado Attorney General.
  decider: The FBI and Colorado Attorney General
  agent: The FBI and Colorado Attorney General
  agent_role: decide
  situation: An employee gave notice of an intention to leave Ellery Systems and transferred company source-code files to
    another company. Ellery discovered the missing files and contacted the FBI and Colorado Attorney General. Officials faced
    a case in which they had explained that virtually no laws applied. The matter involved an interstate Internet transmission,
    while the available wire-fraud law dated from the early 1900s and addressed communications by telegraph and telephone.
    The FBI had no other charges available at the time.
  question: What charges, if any, should the FBI and Colorado Attorney General pursue against the employee and the other individual?
  options:
    O1:
      do: The FBI and Colorado Attorney General file wire- and computer-fraud charges against the employee and the other individual.
      move: act
      irreversible: false
    O2:
      do: The FBI and Colorado Attorney General withhold wire- and computer-fraud charges against the employee and the other
        individual.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 31 January 1994, an Ellery employee gave notice that they intended to leave the company within two weeks.
  - id: F2
    kind: situation
    status: confirmed
    fact: On 1 February 1994, the employee transferred 122 Ellery computer files containing 2.5 megabytes of source code to
      another company.
  - id: F3
    kind: situation
    status: confirmed
    fact: Ellery discovered the missing files on 10 February 1994, and its president contacted the FBI and Colorado Attorney
      General.
  - id: F4
    kind: authority
    status: assessed
    fact: Officials explained to Ellery's president that virtually no laws applied to the case.
  - id: F5
    kind: authority
    status: confirmed
    fact: The wire-fraud law available to officials dated from the early 1900s and addressed criminal acts over telegraph
      and telephone lines.
  - id: F6
    kind: situation
    status: confirmed
    fact: The case involved an Internet transmission routed through three other states.
  - id: F7
    kind: capability
    status: confirmed
    fact: The FBI had no other charges available against the individuals under investigation at the time.
  - id: F8
    kind: intelligence
    status: assessed
    fact: FBI officials briefed Ellery's president that the incident fit the profile of Chinese intelligence operations.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Although officials had explained that virtually no laws applied and the available wire-fraud law was old, they viewed
      the interstate routing as their best chance to prosecute and had no other charges available at the time.
  - id: C2
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Officials supported prosecution because they recognized the precedent it could set and wanted to help other small
      businesses that might be victimized by electronic theft.
  - id: C3
    facts:
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Companies that are victims of this kind of theft often stay silent to avoid losing customers; pursuing the case would
      make electronic theft something a business could bring before a court.
  reasoning:
    read: This is a choice about whether to pursue the only charges officials then saw as available despite the gap between
      a new form of conduct and an early-twentieth-century communications law. The trap is treating the absence of a purpose-built
      statute as either automatic immunity or permission to proceed without a supportable legal theory.
    weighing: The FBI and Colorado Attorney General saw the interstate transmission as making wire fraud their best chance
      to prosecute, and they had no other charges available {C1}. They also supported taking the case to court to establish
      precedent and help other businesses facing similar theft {C2}, against a background in which companies could be reluctant
      to report such losses {C3}. The balance therefore favors filing, but depends on the transmission providing a legally
      supportable basis for the wire-fraud charge; the intelligence profile does not itself supply that basis.
    tradecraft: State the factual and statutory basis for each charge separately, distinguish the wire-fraud theory from the
      computer-fraud charge, and record the limits of applying an older law to the conduct at issue. Do not treat the value
      of setting precedent or the intelligence assessment as a substitute for the legal elements.
    uncertainty: Officials described the law as sparse, and the available wire-fraud statute predated the Internet. The excerpt
      records indictments and innocent pleas but does not establish the eventual judicial resolution or whether the statutory
      theory was upheld.
    handoff: The FBI and Colorado Attorney General should decide together, as they investigated and pursued the case jointly;
      a legal review of the proposed statutory theories is appropriate given the acknowledged gap in the law.
    tempting_wrong:
      option: O2
      pull: Withhold charges because officials said virtually no laws applied and the available wire-fraud law was written
        for telegraph and telephone communications.
      why_wrong: That caution overlooks the officials' stated assessment that the interstate transmission made wire fraud
        their best available chance and their reason for pursuing a precedent that could help other victimized businesses.
    rejected:
      O2: Withholding all charges was not chosen because officials viewed wire fraud as their best available prosecutorial
        theory and pursued the case to help other small businesses.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The interstate transmission did not provide a legally supportable connection to the available wire-fraud law.
      then: O2
      why: The stated basis for choosing that charge was that the interstate routing made it the best chance to prosecute;
        without a supportable legal connection, the case for filing would fall away, especially since no other charges were
        available.
    would_not_change:
    - id: noflip1
      if: The intelligence-profile assessment were absent.
      why: The stated charging rationale rests on the available legal theory and the prospect of helping other businesses,
        not on the intelligence assessment.
    watch_for:
    - id: watch1
      what: Whether the interstate transmission supplies a sufficient legal basis for applying the available wire-fraud law.
      favors:
      - O2
      why: The available law addressed telegraph and telephone communications, while officials viewed the interstate routing
        as making wire fraud their best chance to prosecute; the legal fit is pivotal.
  lesson: When new conduct falls into a legal gap, identify the closest available authority and assess whether the facts support
    applying it; novelty alone does not resolve whether charges should be brought. The prospect of setting a helpful precedent
    can weigh in favor of prosecution, but cannot replace a legally supportable charging theory.
  limits: This reasoning is tied to the laws and circumstances described in Colorado in 1994. It does not establish that either
    individual was guilty, that the wire-fraud theory was ultimately upheld, or how comparable conduct should be charged under
    later law.
  library:
    domain: natsec-other
    family: CORPUS-NX-cf776672
    source: https://www.cia.gov/resources/csi/static/1e9e6ea141310e2fcd792e71bd24d792/Safeguarding-Information-Ops.pdf
    episode_focus: The decision point is the choice of available legal charges in a case where officials said virtually no
      laws applied. The document says the Internet transmission’s routing through several states made wire fraud their best
      chance to prosecute; exclude the technical mechanics of the file transfer.
    cues:
      option_words:
        O2: 18
        O1: 18
      real_option: O1
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
