case:
  id: DR-CORPUS-NX-d7e4592b-E4@v1
  title: Uncertain Intelligence Before the Son Tay Decision
  status: draft
  setting: Son Tay operation decision; early evening, November 18; DIA, Joint Chiefs leadership, the Secretary of Defense,
    and the President
  decider: The President
  agent: The President
  agent_role: decide
  situation: The raid had been rescheduled from October to November 21 to allow the President time to review and approve the
    plan. Analysts had observed declining activity at the camp since July, but believed the prisoners might still be there.
    An intelligence report from Hanoi indicated the prisoners had been moved, while photographs through early November showed
    no significant changes and other intelligence indicators appeared to show someone remained at the camp. Analysts could
    not conclusively establish either possibility, and further efforts to obtain information yielded none amid weather and
    mechanical problems. The DIA Director recommended proceeding, and Joint Chiefs leadership agreed and advised the Secretary
    of Defense to go forward; the President sought a public-relations victory and intended to send a statement to Hanoi.
  question: What should the President do about the operation scheduled for November 21?
  options:
    O1:
      do: The President declines authorization and cancels the operation scheduled for November 21.
      move: act
      irreversible: true
    O2:
      do: The President authorizes the operation to proceed on November 21.
      move: act
      irreversible: true
    O3:
      do: The President postpones the operation and defers a final decision.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The raid was moved from October to November 21 to give the President time to review and approve the plan.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Analysts observed declining activity at the camp since July but believed the prisoners might still be there.
  - id: F3
    kind: intelligence
    status: assessed
    fact: An intelligence report from Hanoi indicated that the prisoners had been moved to another camp.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Photographs taken through early November revealed no significant changes at the camp.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Other intelligence indicators appeared to show that someone remained at the camp.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Analysts could not conclusively establish whether the prisoners remained at the camp or had been moved.
  - id: F7
    kind: capability
    status: confirmed
    fact: Further efforts to obtain information produced no new information amid weather and mechanical problems.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The DIA Director described the available intelligence as evenly divided between the prisoners having moved and their
      remaining at the camp.
  - id: F9
    kind: situation
    status: confirmed
    fact: The DIA Director recommended proceeding, and Joint Chiefs leadership agreed and advised the Secretary of Defense
      to go forward.
  - id: F10
    kind: situation
    status: assessed
    fact: The President sought a public-relations victory and intended to send a statement to Hanoi.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    - F6
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The intelligence did not establish whether the prisoners remained at the camp or had been moved. The DIA Director
      described the evidence as evenly divided, and efforts to obtain more information produced none.
  - id: C2
    facts:
    - F9
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The DIA Director recommended proceeding, and Joint Chiefs leadership agreed and advised the Secretary of Defense
      to go forward.
  - id: C3
    facts:
    - F10
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The President wanted a public-relations victory and intended the operation to send a statement to Hanoi; these objectives
      supported proceeding in his judgment.
  reasoning:
    read: The central problem was unresolved intelligence, not a finding that the camp was empty or that the prisoners were
      certainly still there. The trap is to treat either side of the divided evidence as conclusive, or to assume that more
      time would resolve the uncertainty when further efforts had produced no new information.
    weighing: The evidence created a real reason to hesitate {C1}, but it did not establish that the operation would find
      an empty camp. Against that uncertainty, the DIA Director recommended proceeding and Joint Chiefs leadership concurred
      {C2}. The President also valued the public-relations and signaling objectives {C3}. The balance therefore favored proceeding,
      although it did not establish that the prisoners remained.
    tradecraft: Make the authorization decision explicit, preserve the unresolved intelligence and the advice received in
      the decision record, and distinguish the operational rationale from the public-relations objective.
    uncertainty: Whether the prisoners remained at Son Tay was unresolved; the intelligence was divided, and the additional
      efforts described yielded no new information.
    handoff: The President made the final decision after receiving the Secretary of Defense's advice, following the DIA Director's
      recommendation and the concurrence of Joint Chiefs leadership. Those senior assessments informed the President's decision
      but did not substitute for it.
    tempting_wrong:
      option: O3
      pull: Deferring could seem prudent because the available intelligence did not establish where the prisoners were.
      why_wrong: Further efforts produced no new information, while the DIA Director and Joint Chiefs leadership recommended
        going forward; the President chose to proceed rather than defer.
    rejected:
      O1: The President did not cancel because the intelligence did not establish that the prisoners had been moved, and senior
        advisers recommended proceeding.
      O3: The President did not postpone because further efforts produced no new information and senior advisers counseled
        proceeding.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable new information established that the prisoners had been moved and were not at Son Tay.
      then: O1
      why: That would remove the factual basis for proceeding with this operation and favor cancellation.
    would_not_change:
    - id: noflip1
      if: The intelligence remained evenly divided and further efforts still yielded no new information.
      why: The intelligence would remain unresolved, while the DIA Director recommended proceeding and Joint Chiefs leadership
        concurred; the President proceeded under those conditions.
    watch_for:
    - id: watch1
      what: New reliable information indicating that the prisoners had been moved to another camp.
      favors:
      - O1
      why: Evidence resolving the central uncertainty in favor of relocation would weaken the basis for proceeding.
  lesson: When intelligence is divided, do not convert uncertainty into certainty in either direction. Weigh the unresolved
    evidence against the advice of responsible senior officials and the decision's stated objectives, while keeping those
    objectives distinct from proof about the underlying facts.
  limits: This reasoning concerns the authorization decision on the facts available at the time; it does not establish whether
    the prisoners were at the camp or assess the operation's later outcome. The source provides no separate legal standard
    or detailed assessment of risks to people or forces.
