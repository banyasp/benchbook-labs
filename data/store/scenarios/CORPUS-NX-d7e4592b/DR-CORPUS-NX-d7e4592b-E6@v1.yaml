case:
  id: DR-CORPUS-NX-d7e4592b-E6@v1
  title: Evacuation Planning Amid a Deteriorating Situation
  status: draft
  setting: Saigon, April 1975; U.S. evacuation planning.
  decider: The attaché
  agent: The attaché
  agent_role: decide
  situation: In Saigon, U.S. evacuation planning had languished amid concern about the signal evacuation might send. The ambassador
    opposed countenancing evacuation to avoid suggesting that the U.S. commitment was anything less than full. By April, North
    Vietnamese forces were moving into the South and advancing on Saigon, while conditions worsened over the month. The attaché
    faced a choice about continued evacuation planning amid those political concerns and the worsening situation.
  question: What should the attaché do about evacuation planning as conditions worsen in South Vietnam?
  options:
    O1:
      do: The attaché asks the ambassador for direction on continued evacuation planning before proceeding.
      move: ask
      irreversible: false
      to: the ambassador
    O2:
      do: The attaché prohibits continued evacuation planning for U.S. personnel and Vietnamese at risk.
      move: act
      irreversible: false
    O3:
      do: The attaché authorizes continued evacuation planning for U.S. personnel and Vietnamese at risk.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: U.S. evacuation planning had languished.
  - id: F2
    kind: situation
    status: assessed
    fact: The ambassador wanted to avoid giving South Vietnamese the impression that the U.S. commitment was anything less
      than full.
  - id: F3
    kind: authority
    status: confirmed
    fact: The ambassador refused to countenance evacuation.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: By April, North Vietnamese forces were pouring into the South.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: By April, North Vietnamese forces were advancing on Saigon.
  - id: F6
    kind: situation
    status: confirmed
    fact: Conditions worsened as April progressed.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The attaché publicly characterized the situation as presenting a risk that observers could recognize.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: partner_relationship
    favors:
    - O1
    - O2
    weight: weak
    why: The ambassador opposed evacuation planning because he feared it would signal that the U.S. commitment was less than
      full; that concern weighed against proceeding without direction or against planning altogether.
  - id: C2
    facts:
    - F4
    - F5
    - F7
    equity: tempo
    favors:
    - O3
    weight: strong
    why: North Vietnamese forces were moving into the South and advancing on Saigon, and the attaché publicly acknowledged
      that the situation presented a recognizable risk. He judged that risk serious enough to begin planning despite the ambassador's
      opposition.
  - id: C3
    facts:
    - F6
    equity: tempo
    favors:
    - O3
    weight: strong
    why: Conditions worsened as April progressed, supporting continued preparation rather than allowing the political concern
      about signaling to keep planning stalled.
  reasoning:
    read: The choice was between avoiding a signal that the U.S. commitment was ending and preparing for a danger the attaché
      judged increasingly apparent. The trap is treating the appearance of commitment as a substitute for responding to the
      worsening situation.
    weighing: The ambassador's concern explains why planning had languished, but the attaché saw the risk in the advancing
      forces and began planning despite that objection. As conditions worsened, the balance favored continuing planning; the
      judgment depends on the danger remaining sufficiently serious to warrant preparation.
    tradecraft: Continue planning, tie the decision to changing conditions, and communicate the risk assessment and the reason
      for proceeding to the ambassador.
    uncertainty: No quantified likelihood of Saigon's fall or formal authority relationship between the attaché and ambassador
      is established. The outcome is a judgment on the risk described, not a stated binding rule.
    handoff: The attaché made the planning judgment despite the ambassador's opposition. Keep the ambassador informed of the
      basis for continued planning without making prior agreement a condition for preparation.
    tempting_wrong:
      option: O2
      pull: Prohibiting planning would avoid the signal the ambassador feared.
      why_wrong: It would let that political concern override the attaché's assessment of a recognizable and worsening danger.
    rejected:
      O1: The attaché did not wait for the ambassador's direction before beginning planning, judging the risk sufficient to
        proceed despite the ambassador's opposition.
      O2: The attaché did not prohibit planning because he judged the advancing forces and worsening conditions to warrant
        preparation.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The forces were no longer advancing on Saigon and conditions were no longer worsening.
      then: O1
      why: With the immediate danger reduced, pausing to seek the ambassador's direction could carry more weight than continuing
        planning against his stated concern.
    would_not_change:
    - id: noflip1
      if: The ambassador continued to oppose evacuation planning solely because of the signal it might send.
      why: The attaché proceeded despite that opposition when he judged the risk apparent and serious.
    watch_for: []
  lesson: Do not let the signal a precaution may send substitute for assessing the danger it addresses. When the risk is serious
    and conditions worsen, preparation may be warranted even when it conflicts with a political preference, while the rationale
    should remain connected to the facts that support it.
  limits: This reasoning concerns contingency planning amid an advancing threat; it does not establish a general rule for
    disregarding an ambassador's direction or resolve questions of formal authority. It also does not address the logistics
    or execution of an evacuation.
  library:
    domain: operational-command
    family: CORPUS-NX-d7e4592b
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-46.pdf
