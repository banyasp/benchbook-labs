case:
  id: DR-CORPUS-NX-58d85b7e-E2@v1
  title: Warnings About an Applicant for Secretary
  status: draft
  setting: Berlin and the opposition movement's international correspondence, after May 1930
  decider: the opposition leader
  agent: the opposition leader
  agent_role: decide
  situation: In urgent need of a qualified secretary, the opposition leader was impressed by a young applicant. A publisher
    and several opposition leaders evaluated the applicant negatively, including assessing that he might be an agent. The
    publisher's wife found the applicant evasive about his origin and occupation. The leaders were alarmed by questions about
    confidential leadership and organizational matters and warned against further contact. The applicant had given prompt
    and convincing explanations for incidents, which the leader apparently found persuasive. The leader had to decide whether
    to end contact and restrict access to organizational information or continue the relationship and disclose such information.
  question: What should the opposition leader do about maintaining contact with the applicant and sharing organizational information?
  options:
    O1:
      do: The opposition leader ends contact and withholds names and addresses of followers from the applicant.
      move: act
      irreversible: false
    O2:
      do: The opposition leader continues contact and discloses names and addresses of followers to the applicant.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The opposition leader was impressed by the young applicant and urgently needed a qualified secretary.
  - id: F2
    kind: intelligence
    status: assessed
    fact: A publisher's evaluation of the applicant was negative and raised the possibility that he was a GPU agent.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The publisher's wife found the applicant evasive and false about his origin and occupation.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Opposition leaders were alarmed by the applicant's questions about confidential leadership and organizational matters.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Several opposition leaders separately warned the opposition leader to have no further contact with the applicant.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The applicant gave prompt and convincing explanations for incidents, and the opposition leader appeared satisfied
      with them.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The leader urgently needed a qualified secretary and was impressed by the applicant, creating pressure to preserve
      the relationship.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The negative assessment, evasiveness, probing about confidential matters, and separate warnings created a substantial
      risk in continuing contact and sharing organizational information.
  - id: C3
    facts:
    - F6
    equity: mitigation
    favors:
    - O2
    weight: weak
    why: The applicant's prompt, convincing explanations apparently reassured the leader, although they did not independently
      resolve the concerns.
  reasoning:
    read: 'This was more than a hiring decision: the leader had to choose whether to continue a relationship that could expose
      organizational information. The trap was allowing urgent need and persuasive explanations to outweigh multiple independent
      warnings without establishing that the underlying concerns had been resolved.'
    weighing: The warnings and the risk associated with confidential organizational information strongly supported ending
      contact. The leader's urgent need and the applicant's prompt explanations pulled toward continued engagement; these
      explanations apparently satisfied him. In the event, the warnings stopped him from accepting the applicant as secretary
      but did not stop correspondence or disclosure of names and addresses. The balance therefore turned on the leader's trust
      in those explanations, not on a reported resolution of the warnings.
    tradecraft: The source records no access safeguards or formal review of the explanations. As a decision practice, document
      the warnings and the basis for crediting or rejecting each explanation; keep hiring and access decisions distinct, and
      limit sensitive information unless a documented need and sufficient confidence justify disclosure.
    uncertainty: The applicant's status as an agent was not established, and the leader had not verified the explanations
      independently. Experienced peers had raised serious concerns, yet the leader continued to trust the applicant.
    handoff: 'The decision should not rest on the leader''s judgment alone: the publisher and several opposition leaders had
      assessed the applicant and warned against further contact. Their concerns should be weighed directly and any continued
      access decision should have an accountable organizational review.'
    tempting_wrong:
      option: O1
      pull: The independent warnings, evasiveness, and questions about confidential matters make ending contact appear the
        safer course.
      why_wrong: 'It is not the course the leader took: he remained persuaded by the applicant''s explanations and continued
        correspondence, even though he declined to accept him as secretary.'
    rejected:
      O1: The leader did not end contact or withhold organizational information, apparently accepting the applicant's explanations
        despite the warnings.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The leader had independently confirmed the warnings or found the applicant's explanations false or unreliable.
      then: O1
      why: That would remove the reassurance that apparently sustained continued contact and strengthen the already substantial
        security concerns.
    - id: flip2
      if: The applicant's access created a concrete risk to followers that the leader could not adequately contain.
      then: O1
      why: Preventing exposure of organizational information would outweigh the staffing need and the value of continued contact.
    would_not_change:
    - id: noflip1
      if: The applicant remained unproven as an agent, without any additional information resolving the warnings.
      why: The absence of proof alone would not erase the concerns; the leader continued contact despite warnings that the
        applicant had not been proven.
    watch_for:
    - id: watch1
      what: Whether later explanations are independently supported and whether new conduct reinforces or contradicts the existing
        concerns.
      favors:
      - O1
      why: Further unexplained discrepancies would weaken the basis for continued trust and increase the risk of disclosing
        organizational information.
  lesson: Urgent staffing needs and persuasive explanations do not by themselves resolve credible, independent security warnings.
    Before sharing sensitive organizational information, assess whether concerns have been verified or meaningfully mitigated,
    and distinguish the decision to maintain contact from the decision to grant access.
  limits: The account does not establish the applicant's actual affiliation or provide a formal access policy, so this scenario
    does not determine what a binding rule required. Its reasoning concerns the leader's reported judgment in this particular
    relationship and information-sharing decision.
  library:
    domain: security-clearance
    family: CORPUS-NX-58d85b7e
    source: https://www.cia.gov/resources/csi/static/339302a0cbc1db73dfff7980d929dad3/Leon-Trotsky-of-NKVD.pdf
    episode_focus: The decision point is whether to end contact and restrict access or continue the relationship and provide
      information. The source reports continued correspondence and the sharing of names and addresses after warnings, with
      the applicant’s explanations apparently reassuring the leader; exclude details of communications or covert methods.
    cues:
      option_words:
        O1: 15
        O2: 15
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The opposition leader continued correspondence and apparently accepted the applicant's prompt explanations, while the
  warnings were enough to prevent him from accepting the applicant as secretary but not enough to end contact.
