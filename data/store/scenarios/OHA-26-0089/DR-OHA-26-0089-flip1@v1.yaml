case:
  id: DR-OHA-26-0089-flip1@v1
  title: DOE Security Clearance Restoration Decision [flip]
  status: needs_review
  setting: Office of Security Adjudications, Department of Energy, September 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office sent a notification asserting serious doubt about the employee's clearance eligibility
    because of alcohol-related conduct. The employee works for a DOE contractor in a role that requires a clearance. The record
    includes a July 2025 random workplace test that showed a .034 % blood-alcohol concentration and a vehicle inspection that
    uncovered six empty beer cans. A DOE-contracted psychologist evaluated the employee in November 2025 and concluded that
    he habitually binge-drinks, impairing judgment, and that he has not shown sufficient rehabilitation. A phosphatidylethanol
    (PEth) assay later returned 286 ng/mL, indicating heavy drinking inconsistent with the employee's stated consumption.
    The employee answered "No" on a Letter of Interrogatory about ever reporting to work under the influence, despite the
    positive BAC, and did not follow the psychologist's recommended counseling, resuming limited drinking in April 2026. At
    the hearing, the employee produced a negative PEth result dated 13 July 2026, while the psychologist testified that his
    statements are now consistent, abstinence has been independently corroborated by a series of undetectable PEth results,
    and rehabilitation has been demonstrated.
  question: What action should the Administrative Judge take regarding the employee's access authorization?
  options:
    O1:
      do: Postpone the decision until further PEth testing.
      move: hold
      irreversible: false
    O2:
      do: Reinstate clearance with mandatory counseling participation required.
      move: partial
      irreversible: false
    O3:
      do: Reinstate clearance without any further additional conditions.
      move: act
      irreversible: true
    O4:
      do: Maintain ongoing denial of the employee's clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The worker holds a position with a DOE subcontractor that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office dispatched a notice expressing substantial uncertainty regarding the worker's clearance
      eligibility, citing alcohol-related behavior and personal conduct issues.
  - id: F3
    kind: situation
    status: confirmed
    fact: From May 2026 through April 2027, each monthly phosphatidylethanol analysis returned below the laboratory detection
      limit, providing objective evidence of continuous sobriety.
  - id: F4
    kind: authority
    status: confirmed
    fact: Security Guideline G flags heavy alcohol use as a potential risk factor.
  - id: F5
    kind: authority
    status: confirmed
    fact: Security Guideline E designates personal conduct lapses, untruthfulness, and lack of candor as disqualifying factors.
  - id: F6
    kind: situation
    status: confirmed
    fact: A random workplace screening in July 2025 recorded a blood-alcohol level of .034 % and, during a vehicle inspection,
      six empty beer cans were discovered.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The consulting psychologist determined that the worker engages in habitual binge drinking, which compromises judgment,
      and that rehabilitation remains insufficient.
  - id: F8
    kind: intelligence
    status: assessed
    fact: Subsequent phosphatidylethanol testing yielded 286 ng/mL, a concentration that signals heavy drinking at odds with
      the worker's self-reported intake.
  - id: F9
    kind: situation
    status: confirmed
    fact: When queried in a Letter of Interrogatory about ever reporting to duty while intoxicated, the worker responded "No,"
      even though a positive BAC had been recorded earlier that month.
  - id: F10
    kind: situation
    status: confirmed
    fact: The Individual fulfilled the psychologist’s prescribed therapeutic program and, since April 2026, has abstained
      from alcoholic beverages, limiting intake to water and non‑alcoholic drinks.
  - id: F11
    kind: intelligence
    status: assessed
    fact: The psychologist testified that the Individual’s accounts are now consistent, abstinence has been independently
      corroborated by the series of undetectable PEth results, and rehabilitation has been demonstrated.
  considerations:
  - id: C1
    facts:
    - F6
    - F8
    - F7
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: Guideline G concerns (excessive alcohol use, binge drinking, impaired judgment) are substantiated by the July 2025
      BAC, the heavy-use PEth result, and the psychologist's finding of habitual binge drinking, with no mitigating conditions
      satisfied.
  - id: C3
    facts:
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Regulatory standards impose a presumption against granting or restoring clearances when security concerns remain;
      the adjudicator must be convinced that the concerns are fully mitigated, which the record now shows they are.
  - id: C4
    facts:
    - F11
    - F10
    - F3
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The psychologist's testimony confirms that the employee's statements are now consistent, that abstinence has been
      independently verified by twelve consecutive months of undetectable PEth results, and that genuine rehabilitation has
      been demonstrated, satisfying the due-process requirements for restoration.
  reasoning:
    read: The central issue is whether, at the time of the hearing, the employee poses an unacceptable risk to national security
      and the common defense.
    weighing: 'Applying the Adjudicative Guidelines, the record now shows that the employee has met the rehabilitation criteria
      for both Guideline G and Guideline E: sustained abstinence documented by serial PEth tests, completion of the prescribed
      counseling program, and consistent, truthful statements. Accordingly, the presumption against restoration is overcome,
      and a conditional reinstatement with counseling is warranted.'
    tradecraft: The decision is entered in the Administrative Judge's formal Decision, citing the relevant sections of 10
      C.F.R. §§ 710.5, 710.7, 710.21, 710.25, and is transmitted to the Local Security Office for implementation.
    uncertainty: No material uncertainty remains regarding the employee's sobriety or candor, as the objective PEth data and
      psychologist's testimony provide independent verification.
    handoff: The Judge acts under statutory authority without further inter-agency consultation, as the evidentiary record
      satisfies the regulatory requirements.
    tempting_wrong:
      option: O4
      pull: Continuing the denial might appear cautious and protect the mission from any residual risk.
      why_wrong: The record now demonstrates concrete, sustained rehabilitation; denying clearance would ignore the mitigated
        risk and contravene the due-process balance.
    rejected:
      O1: Deferring would unnecessarily prolong uncertainty despite clear evidence of rehabilitation.
      O3: Restoring the clearance without counseling disregards the requirement to ensure ongoing compliance and monitoring.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the employee were to relapse into binge drinking and produce a positive PEth result after the twelve-month period,
        the restoration with counseling would no longer be appropriate.
      then: O4
      why: A relapse would re-establish the security concerns that originally justified denial.
    would_not_change:
    - id: noflip1
      if: If the employee only supplies a single negative PEth test without additional verification or counseling, the evidence
        remains insufficient to confirm sustained abstinence.
      why: A solitary negative PEth result evidences only a brief interval of sobriety.
    watch_for:
    - id: watch1
      what: Any future evidence of binge drinking or falsified statements.
      favors:
      - O4
      why: New adverse conduct would revive the original security concerns and justify denial.
  lesson: When adjudicating clearances, documented, sustained rehabilitation—verified through objective testing and completed
    counseling—overrides earlier alcohol-misuse and candor concerns, allowing restoration with conditions. Mitigating evidence
    must be concrete, continuous, and independently corroborated.
  limits: This analysis applies only where the record shows verified, long-term abstinence and completed treatment. It does
    not extend to cases lacking serial objective evidence, where counseling is incomplete, or where misconduct is minor and
    temporally distant.
