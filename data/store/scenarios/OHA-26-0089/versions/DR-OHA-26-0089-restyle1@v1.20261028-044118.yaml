case:
  id: DR-OHA-26-0089-restyle1@v1
  title: DOE Security Clearance Restoration Decision [restyle]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, August 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office transmitted a Notification Letter expressing serious uncertainty regarding the employee's
    suitability for a security clearance on grounds of alcohol use and personal conduct. The employee works for a DOE contractor
    in a role that mandates a security clearance. Evidence includes a July 2025 workplace alcohol test showing a .034% BAC
    and a vehicle inspection that uncovered six empty beer cans. A DOE-contracted psychologist evaluated the employee in November
    2025 and concluded that he habitually engages in binge drinking, which impairs judgment, and that he has not shown evidence
    of rehabilitation. A subsequent phosphatidylethanol (PEth) assay indicated heavy alcohol consumption inconsistent with
    the employee's stated intake. The employee answered "No" on a Letter of Interrogatory concerning ever reporting to work
    under the influence, despite the earlier positive BAC, and failed to complete the psychologist's recommended counseling,
    resuming limited drinking in April 2026. At the hearing, the employee produced a negative PEth result dated July 13, 2026,
    yet the psychologist testified that his statements remain contradictory and his abstinence has not been independently
    verified.
  question: What action should the Administrative Judge take regarding the employee's access authorization?
  options:
    O1:
      do: The Administrative Judge delays the ruling pending further PEth testing results.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge reinstates the employee's clearance, provided he completes counseling.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge reinstates the employee's clearance without imposing any conditions.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge denies the employee's clearance and maintains the restriction.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter expressing substantial doubt about the employee's eligibility
      for a clearance because of alcohol use and personal conduct.
  - id: F3
    kind: authority
    status: confirmed
    fact: Guideline G treats excessive alcohol consumption as a security-related concern.
  - id: F4
    kind: authority
    status: confirmed
    fact: Guideline E identifies personal conduct, lack of candor, and dishonesty as security concerns.
  - id: F5
    kind: situation
    status: confirmed
    fact: A random workplace test in July 2025 recorded a .034% blood alcohol concentration for the employee, and a vehicle
      inspection uncovered six empty beer cans.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The psychologist concluded that the employee habitually binge-drinks, which impairs judgment, and that he has not
      shown sufficient rehabilitation.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A PEth assay yielded 286 ng/mL, indicating heavy alcohol use that conflicts with the employee's reported consumption.
  - id: F8
    kind: situation
    status: confirmed
    fact: The employee responded "No" on a Letter of Interrogatory concerning ever reporting to work under the influence,
      despite the earlier positive BAC.
  - id: F9
    kind: situation
    status: confirmed
    fact: The employee failed to complete the psychologist's recommended counseling and resumed drinking in April 2026, limiting
      intake to one or two beers on weekends.
  - id: F10
    kind: intelligence
    status: assessed
    fact: The psychologist testified that the employee's statements were inconsistent, his abstinence was not independently
      verified, and no rehabilitation had been demonstrated.
  considerations:
  - id: C1
    facts:
    - F5
    - F7
    - F6
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: Guideline G's focus on excessive alcohol use, binge drinking, and impaired judgment is supported by the July 2025
      BAC, the PEth result showing heavy use, and the psychologist's finding of habitual binge drinking; none of the mitigating
      factors listed under Guideline G are satisfied.
  - id: C2
    facts:
    - F8
    - F10
    - F9
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Guideline E's emphasis on lack of candor and false statements is reinforced by the employee's "No" response on the
      Letter of Interrogatory despite a positive BAC, and by his inconsistent accounts of alcohol use that remain uncorrected,
      indicating no remediation of personal-conduct concerns.
  - id: C3
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Regulatory policy imposes a presumption against granting or restoring clearances when security concerns persist;
      the Judge must be persuaded that those concerns are fully mitigated, which the record fails to demonstrate.
  - id: C4
    facts:
    - F10
    equity: due_process
    favors:
    - O4
    weight: weak
    why: The psychologist's testimony that the employee's abstinence was unverified and that he did not follow the recommended
      counseling further erodes confidence in his rehabilitation.
  reasoning:
    read: The matter before me is whether the employee, at the time of the hearing, poses an unacceptable risk to national
      security and the common defense.
    weighing: Applying the Adjudicative Guidelines, the Judge determined that none of the mitigating conditions for Guideline
      G (elapsed time, acknowledgment, treatment) or Guideline E (prompt correction, counseling) were met. Since the presumption
      opposes restoration absent clear mitigation, the balance decisively favors denial, as set out in the Decision.
    tradecraft: The ruling is documented in the Administrative Judge's formal Decision, referencing the applicable regulatory
      provisions (10 C.F.R. §§ 710.5, 710.7, 710.21, 710.25) and the evidentiary record, and is transmitted to the LSO for
      implementation.
    uncertainty: The sole uncertainty concerns the lack of independent verification of the employee's asserted recent abstinence;
      the source considers a single negative PEth test insufficient to resolve this doubt.
    handoff: The Judge acts independently under statutory authority; no additional inter-agency consultation is required because
      the record is complete and the regulatory framework is clear.
    tempting_wrong:
      option: O2
      pull: Approving the clearance with counseling could seem compassionate and promote rehabilitation.
      why_wrong: The source notes that without proven rehabilitation—specifically completed counseling and verified abstinence—the
        risk remains unmitigated, rendering such a grant contrary to the required presumption against clearance.
    rejected:
      O1: Deferring would extend uncertainty despite the record showing no mitigation.
      O2: Granting with counseling lacks the necessary evidence of rehabilitation and candor.
      O3: Full restoration is barred because the security concerns remain unresolved.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee completes the psychologist's recommended counseling and supplies a series of negative PEth tests for
        twelve consecutive months, thereby demonstrating sustained abstinence and rehabilitation.
      then: O2
      why: She opined that successful adherence to those recommendations for twelve months would constitute sufficient evidence
        of rehabilitation or reformation.
    would_not_change:
    - id: noflip1
      if: The employee only produces a single negative PEth test without further verification or counseling.
      why: She testified that a single negative PEth test offers objective evidence for only one discrete time period.
    watch_for:
    - id: watch1
      what: Any future evidence of binge drinking or false statements.
      favors:
      - O4
      why: New adverse conduct would reinforce the existing security concerns and further justify denial.
  lesson: In adjudicating access authorizations, unresolved alcohol misuse and personal-conduct violations—particularly absent
    documented rehabilitation or candor—require denial under the presumption against clearance. Mitigating evidence must be
    concrete, sustained, and independently verified.
  limits: This reasoning applies only where the record demonstrates clear, unmitigated violations of Guidelines G and E. It
    does not extend to situations where the employee has completed treatment, provided verifiable abstinence, or where the
    conduct is minor and remote in time.
