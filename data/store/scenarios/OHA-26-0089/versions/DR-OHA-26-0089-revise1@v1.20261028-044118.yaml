case:
  id: DR-OHA-26-0089-revise1@v1
  title: DOE Security Clearance Restoration Decision [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, August 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office issued a Notification Letter indicating substantial doubt about the Individual’s eligibility
    for a security clearance because of alcohol consumption and personal conduct. The Individual is employed by a DOE contractor
    in a position that requires a security clearance. Evidence presented includes a July 2025 workplace alcohol test showing
    a .034% BAC and a vehicle search that found six empty beer cans. A DOE consultant psychologist evaluated the Individual
    in November 2025 and concluded he habitually binge‑drinks, impairing judgment, and has not demonstrated rehabilitation.
    A phosphatidylethanol (PEth) test later indicated heavy alcohol use inconsistent with the Individual’s reported consumption.
    The Individual answered “No” on a Letter of Interrogatory about ever reporting to work under the influence, despite the
    positive BAC, and did not complete the psychologist’s recommended counseling, resuming limited drinking in April 2026.
    At the hearing, the Individual provided a negative PEth test from July 13, 2026, but the psychologist testified that his
    accounts remain inconsistent and his abstinence is unverified.
  question: What should the Administrative Judge do about the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge defers the decision pending additional PEth testing.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge restores the Individual’s access authorization with counseling.
      move: partial
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      for a security clearance due to alcohol consumption and personal conduct.
  - id: F3
    kind: authority
    status: confirmed
    fact: Guideline G addresses excessive alcohol consumption as a security concern.
  - id: F4
    kind: authority
    status: confirmed
    fact: Guideline E addresses personal conduct, lack of candor, and dishonesty as security concerns.
  - id: F5
    kind: situation
    status: confirmed
    fact: In July 2025 a random workplace test showed the Individual had a .034% BAC and a vehicle search found six empty
      beer cans.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The psychologist concluded the Individual habitually binge‑drinks, impairing judgment, and has not demonstrated
      adequate rehabilitation.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A PEth test returned a level of 286 ng/mL, indicating heavy alcohol use inconsistent with the Individual’s reported
      consumption.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual answered “No” on a Letter of Interrogatory about ever reporting to work under the influence, despite
      the positive BAC earlier that month.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Individual did not complete the psychologist’s recommended counseling and resumed drinking in April 2026, limiting
      consumption to one or two beers on weekends.
  - id: F10
    kind: intelligence
    status: assessed
    fact: The psychologist testified that the Individual’s accounts were inconsistent, abstinence was not independently verified,
      and rehabilitation had not been demonstrated.
  considerations:
  - id: C1
    facts:
    - F5
    - F7
    - F6
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: Guideline G concerns (excessive alcohol use, binge drinking, impaired judgment) are substantiated by the July 2025
      BAC, the PEth result indicating heavy use, and the psychologist’s conclusion of habitual binge drinking, and none of
      the mitigating conditions under Guideline G are met.
  - id: C2
    facts:
    - F8
    - F10
    - F9
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Guideline E concerns (lack of candor, false statements) are supported by the Individual’s “No” answer on the LOI
      despite a positive BAC, and by his inconsistent accounts of alcohol consumption that were not corrected, showing no
      remediation of personal‑conduct issues.
  - id: C3
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Regulatory standards impose a presumption against granting or restoring clearances when security concerns remain;
      the Judge must be convinced that the concerns are fully mitigated, which the record does not demonstrate.
  - id: C4
    facts:
    - F10
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The psychologist's testimony that abstinence is unverified and counseling was not completed highlights a remedial
      need; ordering counseling directly addresses the conduct gap, so the appropriate remedy is restoration contingent on
      counseling rather than outright denial.
  reasoning:
    read: The question is whether, given the record of alcohol misuse and candor issues, the Individual may be restored to
      access provided that counseling ensures future reliability.
    weighing: While Guidelines G and E raise serious concerns, the Judge now places primary weight on the remedial potential
      of mandated counseling (C4, strong) and treats the lack of verified abstinence as a condition that can be satisfied
      through supervised treatment, leading to a balanced decision to restore with counseling.
    tradecraft: The decision will be documented in the Administrative Judge's formal Decision, citing the relevant sections
      of the Adjudicative Guidelines and the psychologist's testimony, and communicated to the LSO for implementation of the
      conditional restoration.
    uncertainty: Residual uncertainty about sustained abstinence remains, but the requirement for counseling creates an oversight
      mechanism that mitigates the risk while allowing the Individual to resume duties.
    handoff: The Judge acts under statutory authority; no inter-agency consultation is required because the record now supports
      a conditional restoration rather than a full denial.
    tempting_wrong:
      option: O4
      pull: Denial appears to protect security by avoiding any risk from unresolved conduct.
      why_wrong: Denial ignores the opportunity for rehabilitation through counseling and imposes an unnecessary barrier when
        the record shows the Individual is willing to engage in treatment.
    rejected:
      O1: Deferring would extend uncertainty without adding substantive evidence of rehabilitation.
      O3: Full restoration bypasses the needed counseling step that addresses the psychologist's concerns.
      O4: Denial fails to recognize that conditional restoration with counseling can adequately mitigate the identified risks.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the Individual fails to provide additional verification of sustained abstinence beyond the single negative PEth
        test.
      then: O4
      why: Lack of corroborated abstinence sustains the security risk, justifying denial.
    would_not_change:
    - id: noflip1
      if: The Individual only produces a single negative PEth test without additional verification or counseling.
      why: She testified that a single negative PEth test provides objective evidence only for one discrete period of time.
    watch_for:
    - id: watch1
      what: Any future evidence of binge drinking or falsified statements.
      favors:
      - O4
      why: New adverse conduct would reinforce the existing security concerns and further justify denial.
  lesson: When adjudicating access authorizations, the presence of unresolved alcohol misuse and personal-conduct violations—especially
    without documented rehabilitation or candor—mandates denial under the presumption against clearance. Mitigating evidence
    must be concrete, sustained, and independently verified.
  limits: This reasoning applies only where the record shows clear, unmitigated violations of Guidelines G and E. It does
    not extend to cases where the individual has completed treatment, provided verifiable abstinence, or where the conduct
    is minor and remote in time.
