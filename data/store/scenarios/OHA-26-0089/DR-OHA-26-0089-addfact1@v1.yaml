case:
  id: DR-OHA-26-0089-addfact1@v1
  title: DOE Security Clearance Restoration Decision [addfact]
  status: needs_review
  setting: U.S. Department of Energy, Office of Hearings and Appeals – August 2026
  decider: Presiding Administrative Judge
  agent: Presiding Administrative Judge
  agent_role: decide
  situation: The Local Security Office sent a Notification Letter expressing serious doubt about the employee's suitability
    for a security clearance because of alcohol use and personal conduct. The employee works for a DOE contractor in a role
    that requires a clearance. Security Guideline G flags excessive alcohol consumption as a security risk, while Guideline
    E identifies personal conduct, lack of candor, and dishonesty as concerns. A random workplace screening in July 2025 recorded
    a blood alcohol concentration of 0.034 % and a vehicle inspection uncovered six empty beer cans. The consulting psychologist
    concluded the employee habitually binge-drinks, impairing judgment, and has not shown sufficient rehabilitation. A phosphatidylethanol
    (PEth) analysis yielded 286 ng/mL, indicating heavy drinking that conflicts with the employee's self-reported intake.
    When responding to a Letter of Interrogatory, the employee denied ever reporting to work while under the influence, despite
    the earlier positive BAC. He failed to complete the psychologist-recommended counseling and, in April 2026, resumed limited
    drinking, restricting intake to one or two beers on weekends. In March 2026, he participated in a three-day alcohol-awareness
    seminar provided by the contractor's employee assistance program. At the hearing, the psychologist testified that the
    employee's statements were inconsistent, abstinence had not been independently confirmed, and rehabilitation remained
    unproven.
  question: How should the presiding Administrative Judge resolve the employee's access authorization?
  options:
    O1:
      do: The Judge postpones the decision pending additional PEth testing to verify alcohol use.
      move: hold
      irreversible: false
    O2:
      do: The Judge reinstates the employee's access authorization, contingent on required counseling.
      move: partial
      irreversible: false
    O3:
      do: The Judge reinstates the employee's access authorization without any additional conditions.
      move: act
      irreversible: true
    O4:
      do: The Judge denies the employee's access authorization based on the presented evidence.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a Department of Energy contractor in a role that mandates a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Local Security Office sent a Notification Letter expressing serious doubt about the employee's suitability for
      a clearance because of alcohol use and conduct issues.
  - id: F3
    kind: authority
    status: confirmed
    fact: Security Guideline G identifies heavy alcohol consumption as a potential security risk.
  - id: F4
    kind: authority
    status: confirmed
    fact: Security Guideline E covers personal conduct, including lack of candor and dishonesty, as security concerns.
  - id: F5
    kind: situation
    status: confirmed
    fact: A random workplace screening in July 2025 recorded a blood alcohol concentration of 0.034 % for the employee, and
      a vehicle inspection uncovered six empty beer cans.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The consulting psychologist concluded the employee habitually engages in binge-drinking, which impairs judgment,
      and has not shown sufficient rehabilitation.
  - id: F7
    kind: intelligence
    status: assessed
    fact: A phosphatidylethanol (PEth) analysis yielded 286 ng/mL, signifying heavy drinking that conflicts with the employee's
      self-reported intake.
  - id: F8
    kind: situation
    status: confirmed
    fact: When responding to a Letter of Interrogatory, the employee denied ever reporting to work while under the influence,
      despite the earlier positive BAC result.
  - id: F9
    kind: situation
    status: confirmed
    fact: The employee failed to complete the psychologist-recommended counseling and, in April 2026, resumed drinking, limiting
      intake to one or two beers on weekends.
  - id: F10
    kind: situation
    status: confirmed
    fact: In March 2026, the employee participated in a three-day alcohol-awareness seminar provided by the contractor's employee
      assistance program.
  - id: F11
    kind: intelligence
    status: assessed
    fact: The psychologist testified that the employee's statements were inconsistent, that abstinence had not been independently
      confirmed, and that rehabilitation remained unproven.
  considerations:
  - id: C1
    facts:
    - F5
    - F7
    - F6
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: Guideline G flags heavy alcohol use as a security risk. The July 2025 BAC of 0.034 %, the PEth level of 286 ng/mL,
      and the psychologist's assessment of habitual binge-drinking together satisfy the guideline's risk criteria, and no
      mitigating condition under Guideline G has been met.
  - id: C2
    facts:
    - F8
    - F11
    - F9
    equity: due_process
    favors:
    - O4
    weight: strong
    why: Guideline E requires candor. The employee's denial of drinking at work ({F8}) contradicts the positive BAC, and his
      inconsistent accounts, unaccompanied by corrective action ({F9}, {F11}), demonstrate a lack of honesty that is not remedied.
  - id: C3
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Regulatory policy presumes against granting or restoring a clearance when unresolved security concerns remain; the
      record does not show that the concerns raised by Guidelines G and E have been fully mitigated.
  - id: C4
    facts:
    - F11
    equity: due_process
    favors:
    - O4
    weight: weak
    why: The psychologist testified that abstinence has not been independently verified and that the employee failed to complete
      the recommended counseling, leaving rehabilitation unproven.
  reasoning:
    read: The issue is whether the employee, at the time of the hearing, poses an unacceptable risk to national security and
      the common defense.
    weighing: Applying the Adjudicative Guidelines, the Judge finds that none of the mitigating conditions for Guideline G
      (sustained abstinence, completed counseling) or Guideline E (prompt correction, demonstrated candor) are satisfied.
      Although the employee attended a brief awareness seminar ({F10}), that effort is insufficient to offset the strong evidence
      of ongoing alcohol misuse and lack of honesty. Consequently, the balance decisively favors denial.
    tradecraft: The decision will be entered in the Administrative Judge's formal Decision, citing the relevant sections of
      10 C.F.R. §§ 710.5, 710.7, 710.21, 710.25, and transmitted to the Local Security Office for implementation.
    uncertainty: The only residual uncertainty concerns the employee's claim of limited weekend drinking, but without independent
      verification (e.g., serial negative PEth tests) the risk cannot be deemed mitigated.
    handoff: The Judge acts under statutory authority alone; no inter-agency consultation is required because the evidentiary
      record is complete and the regulatory framework is clear.
    tempting_wrong:
      option: O2
      pull: Granting clearance with counseling might appear compassionate and encourage rehabilitation.
      why_wrong: The record lacks proof of completed counseling or verified sustained abstinence; granting clearance would
        contravene the presumption against restoration when security concerns remain unmitigated.
    rejected:
      O1: Deferring the decision would extend uncertainty despite the absence of any mitigating evidence.
      O2: Conditional reinstatement lacks the required proof of rehabilitation and candor.
      O3: Full reinstatement is barred because the security concerns have not been resolved.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee completes the psychologist-recommended counseling and provides serial negative PEth results for twelve
        consecutive months, demonstrating sustained abstinence.
      then: O2
      why: Such evidence would satisfy the mitigation criteria for both Guidelines G and E, supporting a conditional reinstatement.
    would_not_change:
    - id: noflip1
      if: The employee produces only a single negative PEth test without additional verification or counseling.
      why: A solitary negative test addresses only a brief interval and does not meet the guideline's requirement for sustained
        proof of rehabilitation.
    watch_for:
    - id: watch1
      what: Any future evidence of binge drinking or false statements.
      favors:
      - O4
      why: New adverse conduct would reinforce the existing security concerns and further justify denial.
  lesson: When adjudicating access authorizations, unresolved alcohol misuse combined with a lack of candor and absent, verifiable
    rehabilitation mandates denial under the presumption against clearance. Mitigating actions must be concrete, sustained,
    and independently verified to outweigh the security risk.
  limits: This analysis applies only where the record shows clear, unmitigated violations of Guidelines G and E. It does not
    extend to cases where the individual has completed treatment, provided verifiable abstinence over an extended period,
    or where the conduct is minor and temporally remote.
