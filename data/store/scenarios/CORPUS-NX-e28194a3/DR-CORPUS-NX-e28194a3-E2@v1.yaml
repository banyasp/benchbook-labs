case:
  id: DR-CORPUS-NX-e28194a3-E2@v1
  title: Responding to Intelligence of a German Counterattack
  status: draft
  setting: American military command confronting German forces; time and place unstated.
  decider: The senior American commander
  agent: The senior American commander
  agent_role: decide
  situation: The commander received a warning that German forces planned a counterattack. The prevailing assessment was that
    German military thinkers would regard a counterattack at that time as suicidal. Messages were presented as indicating
    that German leadership had ordered a counterattack. The commander was offered a demonstration that the messages were genuine.
    At the decision point, the commander was convinced that the intelligence was authentic.
  question: What should the senior American commander do after accepting intelligence of a planned German counterattack?
  options:
    O1:
      do: The senior commander directs the force to forego defensive preparation.
      move: act
      irreversible: false
    O2:
      do: The senior commander orders the force to prepare defensively.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The commander initially dismissed the warning.
  - id: F2
    kind: intelligence
    status: assessed
    fact: German military thinkers were characterized as capable.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The prevailing judgment was that a counterattack at that time would be suicidal.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Messages indicated that German leadership had ordered a counterattack.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The commander was offered a demonstration that the messages were genuine.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The commander became convinced that the intelligence was genuine.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The prior assessment was that capable German military thinkers would regard a counterattack at that time as suicidal,
      which gave the commander reason to doubt the warning.
  - id: C2
    facts:
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The messages indicated that German leadership had ordered the counterattack, making the threat relevant despite the
      prior expectation.
  - id: C3
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: After being offered a demonstration of authenticity, the commander became convinced the intelligence was genuine;
      the decision then followed that accepted intelligence.
  reasoning:
    read: The choice is between relying on the prior judgment that a counterattack would be suicidal and responding to intelligence
      indicating that German leadership had ordered one. The trap is treating the prior expectation about what the enemy would
      rationally do as conclusive after accepting evidence of its actual intent.
    weighing: The prior assessment gives some reason to doubt the warning {C1}, but the leadership order and the commander's
      conviction that the intelligence was genuine outweigh that expectation {C2} {C3}. On that balance, prepare defensively
      {O2}. The balance depends on the intelligence being accepted as authentic.
    tradecraft: State the accepted intelligence and the reason it changes the prior assessment; direct subordinate commanders
      to prepare, and record the basis for the decision. Reassess if the intelligence's authenticity or meaning materially
      changes.
    uncertainty: The source gives no further detail about the intelligence's reliability beyond the offered demonstration
      and the commander's resulting conviction, and does not describe later developments.
    handoff: The senior commander made the decision and directed subordinate commanders to prepare; the source identifies
      no additional approval authority or required handoff.
    tempting_wrong:
      option: O1
      pull: A counterattack seemed irrational because German military thinkers were considered capable and the attack was
        judged suicidal.
      why_wrong: That expectation did not outweigh the accepted intelligence indicating that German leadership had ordered
        the counterattack.
    rejected:
      O1: The commander did not rely on the prior expectation alone after becoming convinced that the intelligence of an ordered
        counterattack was genuine.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander was not convinced the messages were genuine.
      then: O1
      why: Without accepting the intelligence as authentic, the prior assessment that a counterattack would be suicidal would
        carry greater weight.
    would_not_change:
    - id: noflip1
      if: The prior assessment that a counterattack would be suicidal remained the only reason to discount the warning, while
        the intelligence was still accepted as genuine.
      why: That expectation alone would not displace the accepted indication that German leadership had ordered a counterattack.
    watch_for: []
  lesson: A prior assessment of what an adversary is likely to do should not be treated as decisive once credible intelligence
    indicates an actual order to act. When the decision turns on authenticity, make that assessment explicit and update the
    choice if its basis changes.
  limits: This reasoning concerns a commander's response to accepted intelligence of a planned counterattack. It does not
    establish what to do when intelligence is unverified, when the order's meaning is unclear, or when other legal or operational
    constraints govern the response.
