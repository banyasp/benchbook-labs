    domain: operational-command
    family: CORPUS-NX-e28194a3
    source: https://media.defense.gov/2022/Dec/29/2003138487/-1/-1/0/CRYPTOCOMICS%20004%20%E2%80%93%20TEACHING%20AN%20OLD%20GENERAL%20NEW%20TRICKS.PDF
    episode_focus: The decision is whether to prepare the force defensively after receiving and accepting intelligence of
      a planned counterattack, rather than continuing to rely on the prior expectation that the Germans would not attack.
      Include the command choice and stated intelligence-based rationale; exclude tactical details of the ambush or defense.
