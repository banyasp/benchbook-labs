case:
  id: DR-CORPUS-NX-881fdaac-E2@v1
  title: Advisory Presence in AFP Combat Operations
  status: draft
  setting: The Philippines, 1953, the U.S. military advisory program supporting the AFP.
  decider: U.S. military authorities
  agent: U.S. military authorities
  agent_role: decide
  situation: U.S. advisors worked with Filipino counterparts, while U.S. trainers were barred from accompanying AFP units
    during combat operations. U.S. authorities were concerned that advisors might assume a tactical leadership role and that
    the Huks might portray their presence as a foreign occupation. Advisors had been instructed to take a back seat and give
    Filipino counterparts credit for successes. The advisory program involved U.S. aid and advice, while Filipinos fought
    the Huks and ran social and economic programs. In 1953, the policy question was whether to retain the bar or allow advisors
    to accompany combat units as observers without taking part.
  question: What should U.S. military authorities do about U.S. advisors accompanying AFP combat units in the Philippines?
  options:
    O1:
      do: U.S. military authorities permit U.S. advisors to accompany AFP combat units as observers without taking part.
      move: act
      irreversible: false
    O2:
      do: U.S. military authorities prohibit U.S. advisors from accompanying AFP units during combat operations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: U.S. trainers were prohibited from accompanying AFP units during combat operations.
  - id: F2
    kind: situation
    status: assessed
    fact: U.S. authorities were concerned that advisors might take over or be thrust into a de facto tactical leadership role.
  - id: F3
    kind: situation
    status: assessed
    fact: U.S. authorities were concerned that the Huks might use the presence of Americans to portray the conflict as a fight
      to expel a foreign occupier.
  - id: F4
    kind: situation
    status: assessed
    fact: The restriction on accompanying combat units was assessed as sound at the strategic level.
  - id: F5
    kind: authority
    status: confirmed
    fact: U.S. advisors were instructed to take a back seat and give Filipino counterparts credit for successes.
  - id: F6
    kind: situation
    status: assessed
    fact: A retired U.S. officer assessed that Filipinos best understood their problems and how to solve them, with U.S. aid
      and advice but without U.S. domination.
  - id: F7
    kind: capability
    status: confirmed
    fact: U.S. trainers emphasized improving the AFP's treatment of the civilian population.
  - id: F8
    kind: capability
    status: confirmed
    fact: U.S. trainers helped reorganize the AFP and build a functioning logistics system.
  - id: F9
    kind: situation
    status: confirmed
    fact: The United States provided most of the AFP's material, arms, and funding, while Filipinos fought the Huks and ran
      social and economic programs.
  considerations:
  - id: C1
    facts:
    - F3
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: U.S. authorities feared the Huks would use American presence to cast the conflict as a struggle against a foreign
      occupier, threatening Filipino ownership and the strategic standing of the effort.
  - id: C2
    facts:
    - F2
    - F5
    - F6
    - F9
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: Advisors were meant to take a back seat, and the stated view was that Filipinos understood their problems and should
      solve them with U.S. aid and advice, not U.S. domination. Accompanying units risked putting Americans in a de facto
      leadership role.
  - id: C3
    facts:
    - F1
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The restriction had been judged sound at the strategic level because of the leadership and foreign-occupation risks,
      so changing it required a meaningful distinction between observing and taking part.
  - id: C4
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Observation of operations could provide current lessons for improving training, including attention to the effects
      of military actions on civilians and to the use of U.S.-supplied support.
  - id: C5
    facts:
    - F5
    - F6
    - F9
    equity: partner_relationship
    favors:
    - O1
    weight: strong
    why: Allowing observation without active participation, while keeping advice with Filipino leaders and preserving Filipino
      credit and responsibility, could capture lessons without abandoning the program's principle of Filipino leadership.
  reasoning:
    read: This was a choice about the limits of an advisory role, not whether Americans should lead Filipino combat units.
      The trap is to treat the serious strategic risks that justified the earlier restriction as requiring a continuing blanket
      bar, even when the 1953 policy change allowed observation without participation.
    weighing: The concerns about de facto U.S. leadership and a foreign-occupier narrative were substantial, and the earlier
      restriction had been assessed as strategically sound {C1} {C2} {C3}. The balance shifted toward allowing observation
      because it could generate real-time lessons to improve training, while the nonparticipation limit and Filipino-directed
      advice preserved local ownership {C4} {C5}. The outcome depends on maintaining that distinction in practice.
    tradecraft: State the nonparticipation boundary clearly, direct any advice to the responsible Filipino leader, and use
      observations to improve training while keeping Filipino counterparts visibly responsible for successes. Record the decision
      and the reasons for any departure from the observer-only boundary.
    uncertainty: The account identifies the risks and the expected value of observation but does not establish how often advisors
      would be perceived as leaders or how much observation would improve training. The policy therefore depends on preserving
      the observer-only role and reviewing whether it continues to support Filipino leadership.
    handoff: U.S. military authorities decide the U.S. policy, with Filipino leadership involved in applying it so the advisory
      role respects Filipino ownership and responsibility.
    tempting_wrong:
      option: O2
      pull: The earlier restriction was considered strategically sound, and U.S. presence could create a leadership or foreign-occupation
        risk.
      why_wrong: A continuing blanket prohibition would forgo the learning value of observation even though the changed policy
        allowed observation without active participation and retained Filipino leadership.
    rejected:
      O2: The continuing bar was not chosen because the 1953 policy allowed observation without participation to capture operational
        lessons while preserving Filipino responsibility.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Accompanying advisors were taking over or being thrust into de facto tactical leadership, or their presence was
        enabling the Huks to portray the conflict as a fight to expel a foreign occupier.
      then: O2
      why: Those developments would make the strategic and Filipino-ownership risks that justified the restriction outweigh
        the value of observation.
    - id: flip2
      if: The observer-only limit could not be maintained and advisors were actively participating in combat operations.
      then: O2
      why: The decision endorsed observation without participation; active participation would remove the distinction on which
        the change in policy depended.
    would_not_change:
    - id: noflip1
      if: The United States continued to provide most of the AFP's material, arms, and funding while Filipinos remained responsible
        for fighting and for social and economic programs.
      why: U.S. support alone would not displace the stated principle that Filipinos should lead their own effort; the observer-only
        policy would remain appropriate if that responsibility was preserved.
    watch_for:
    - id: watch1
      what: Whether observations produce useful training improvements and attention to the effects of military actions on
        civilians without shifting responsibility from Filipino leaders.
      favors:
      - O1
      why: Evidence of learning alongside continued Filipino responsibility supports the balance behind allowing observation.
  lesson: An advisory presence can be justified when observation yields useful learning but does not displace the partner's
    leadership. Preserve the distinction between observing and participating, and reassess if the partner's ownership or the
    strategic case is undermined.
  limits: This reasoning addresses the 1953 choice to allow observation without participation in the Philippines. It does
    not establish that accompanying combat units is appropriate where advisors would participate, assume leadership, or where
    local conditions make their presence a strategic liability.
