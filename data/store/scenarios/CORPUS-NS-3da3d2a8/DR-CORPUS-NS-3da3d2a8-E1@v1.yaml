case:
  id: DR-CORPUS-NS-3da3d2a8-E1@v1
  title: Proposed Patrol-Boat Operating Location
  status: draft
  setting: Bahrain and Kuwait, with a proposed presence in the Northern Arabian Gulf; time not stated; Riverine Units and
    the Task Force Commander.
  decider: The Task Force Commander
  agent: The Task Force Commander
  agent_role: advise
  situation: Riverine Units have historically operated from Bahrain. The Task Force Commander is proposing operating patrol
    boats from Kuwait to increase presence in the Northern Arabian Gulf. Subordinates have raised concerns about “Blue Water
    Ops.” The CONOPS lacks specificity and does not clearly address pre-planned responses if foreign forces are encountered.
    Patrol briefs are rarely created or required by the COC, though they typically discuss safety considerations and pre-planned
    responses. Pre-mission briefs are conducted informally, and skipping them is not uncommon.
  question: What should the Task Force Commander recommend about the proposed operating location of the patrol boats?
  options:
    O1:
      do: The Task Force Commander rejects operating patrol boats from Kuwait.
      move: act
      irreversible: false
    O2:
      do: The Task Force Commander recommends operating patrol boats from Kuwait.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Riverine Units have historically operated from Bahrain.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Task Force Commander proposes operating patrol boats from Kuwait.
  - id: F3
    kind: situation
    status: confirmed
    fact: The stated purpose of the proposal is to increase presence in the Northern Arabian Gulf.
  - id: F4
    kind: situation
    status: confirmed
    fact: Subordinates have raised concerns about “Blue Water Ops.”
  - id: F5
    kind: situation
    status: assessed
    fact: The CONOPS lacks specificity.
  - id: F6
    kind: situation
    status: confirmed
    fact: The CONOPS does not clearly address pre-planned responses if interaction with foreign forces occurs.
  - id: F7
    kind: situation
    status: confirmed
    fact: Patrol briefs are rarely created or required by the COC, and typically discuss safety considerations and pre-planned
      responses.
  - id: F8
    kind: situation
    status: confirmed
    fact: Pre-mission briefs are conducted informally, and skipping them is not uncommon.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Operating from Kuwait is proposed to increase presence in the Northern Arabian Gulf, giving the proposed change a
      stated mission purpose.
  - id: C2
    facts:
    - F4
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: Subordinates raised concerns about “Blue Water Ops,” but the concerns are not specified further, so their implications
      for the location decision are unclear.
  - id: C3
    facts:
    - F5
    - F6
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The CONOPS lacks specificity and does not clearly address pre-planned responses to interaction with foreign forces.
  - id: C4
    facts:
    - F7
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Patrol briefs are rarely created or required, and pre-mission briefs may be skipped, leaving safety considerations
      and pre-planned responses without consistently required briefing.
  reasoning:
    read: This is a proposal to change the boats’ operating location, not an approved or executed move. The stated mission
      purpose supports considering Kuwait, but the blue-water concerns and planning gaps are not themselves resolved by that
      purpose.
    weighing: The affirmative reason given is the increased Northern Arabian Gulf presence {C1}. The source also identifies
      subordinate concerns and weaknesses in planning and briefing {C2} {C3} {C4}, but does not explain how the Task Force
      Commander assessed or mitigated them. The endorsed outcome is {O2}; the stated reasons do not supply a full account
      of how that balance was reached.
    tradecraft: Record the mission rationale and the planning concerns considered before advancing the recommendation. Seek
      clarification from the subordinates who raised concerns and the COC about how the identified gaps will be addressed.
    uncertainty: The source does not state the details of the blue-water concerns, whether the planning and briefing gaps
      were later addressed, or the Commander’s express reasoning for proceeding with the proposal.
    handoff: The Task Force Commander owns the recommendation. Consulting the subordinates who raised concerns and the COC
      is prudent because the concerns and briefing practices are directly relevant, though the source does not state that
      consultation is required.
    tempting_wrong:
      option: O1
      pull: Rejecting the proposal may seem prudent because the CONOPS and briefing practices leave important issues unclear.
      why_wrong: That response would not match the stated outcome, and the source does not say the identified shortcomings
        made the proposed location unacceptable; it records them as concerns and planning gaps.
    rejected:
      O1: The Task Force Commander’s endorsed course is to recommend operating from Kuwait, rather than reject the proposal.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The Commander determines that the unresolved blue-water concerns and planning gaps make operating from Kuwait unacceptable.
      then: O1
      why: That determination would make the identified concerns outweigh the stated presence objective.
    would_not_change:
    - id: noflip1
      if: The only additional consideration is that Riverine Units historically operated from Bahrain.
      why: Historical practice alone does not negate the stated purpose for proposing a change in location.
    watch_for:
    - id: watch1
      what: Whether the CONOPS and briefing gaps, especially the lack of clear pre-planned responses to foreign-force interactions,
        remain unresolved.
      favors:
      - O1
      why: If they remain unresolved, the concerns weighing against the proposal persist.
  lesson: A stated mission benefit can support a recommendation, but it does not by itself resolve operational concerns or
    planning deficiencies. Keep the proposal distinct from approval, and make the unresolved issues visible when explaining
    the recommendation.
  limits: The source does not describe the substance of the blue-water concerns, the risks of the proposed location, or any
    later mitigation. This reasoning addresses only the location proposal, not the approval or conduct of particular patrols
    or responses to foreign forces.
  library:
    domain: operational-command
    family: CORPUS-NS-3da3d2a8
    source: https://www.usna.edu/Ethics/_files/documents/Incident_in_the_Gulf_Facilitator_Guide.pdf
    episode_focus: The decision point is the command proposal to change the boats’ operating location, against subordinate
      concerns about blue-water operations and inadequate planning guidance. Treat this as a proposal, not as an approved
      or executed move; exclude decisions about specific patrols or responses to foreign forces.
    cues:
