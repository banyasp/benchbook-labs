case:
  id: DR-CORPUS-NX-56e636fc-E1@v1
  title: Scope of a Security Inquiry
  status: draft
  setting: 1968, Office of Security, Central Intelligence Agency
  decider: The Office of Security
  agent: The Office of Security
  agent_role: decide
  situation: The Office of Security is conducting a security investigation of a person who had received unclassified Agency
    materials. The Agency was considering furnishing the person with classified materials, and a routine security investigation
    had begun. The Office learned that the person had been asked to work on a political campaign. A full inquiry can include
    contacts with friends, neighbors, and business associates, while routine name checks with other agencies are also part
    of the process. The Office must decide whether to continue the full inquiry or restrict further inquiry to interagency
    name checks.
  question: What should the Office of Security do about the scope of the security inquiry after learning of the subject's
    campaign role?
  options:
    O1:
      do: The Office of Security holds the inquiry at its current stage pending supervisory review.
      move: hold
      irreversible: false
    O2:
      do: The Office of Security prohibits further investigative contacts and limits the inquiry to interagency name checks.
      move: act
      irreversible: false
    O3:
      do: The Office of Security permits the full security inquiry and further investigative contacts to continue.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Office of Security conducts security investigations of prospective Agency employees and operatives.
  - id: F2
    kind: situation
    status: confirmed
    fact: The investigations are intended to prevent security risks from being hired or retained by the Agency or used by
      private companies on sensitive jobs.
  - id: F3
    kind: capability
    status: confirmed
    fact: When no satisfactory recent investigation is on file, the Office conducts its own investigation, which can include
      contacts with friends, neighbors, and business associates; routine name checks with other agencies are part of the process.
  - id: F4
    kind: situation
    status: confirmed
    fact: The subject had received unclassified materials from the Agency, and the Agency was considering furnishing classified
      materials to the subject.
  - id: F5
    kind: situation
    status: confirmed
    fact: A routine security investigation of the subject had begun.
  - id: F6
    kind: situation
    status: confirmed
    fact: The subject had been asked to work on a political campaign.
  considerations:
  - id: C1
    facts:
    - F2
    - F4
    - F5
    equity: security_risk
    favors:
    - O3
    weight: strong
    why: The purpose of security investigations is to prevent security risks, and the Agency was considering classified access;
      proper investigations are essential. This supports taking the security inquiry seriously, though it does not itself
      establish that full contacts had to continue after the new information.
  - id: C2
    facts:
    - F3
    - F6
    equity: protected_activity
    favors:
    - O2
    weight: weak
    why: After learning of the campaign role, the Office immediately curtailed the inquiry and limited further inquiry to
      name checks. That course avoids continuing broader contacts in these circumstances; the campaign role is not expressly
      characterized as legally protected activity.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Commission found no basis for criticizing the Office's specific decision to curtail the investigation after learning
      of the campaign role. That is the direct endorsement of the limited inquiry in this instance.
  reasoning:
    read: 'This was a legitimate security inquiry: classified materials were under consideration, and a routine investigation
      had begun. The decision was whether to continue broader contacts after the Office learned of the campaign role, not
      whether to abandon security screening altogether; name checks remained. The trap is treating the general importance
      of security investigations as an automatic reason to continue every investigative step, or treating campaign involvement
      as evidence of a security risk.'
    weighing: The general need to assess security risks, especially where classified access is contemplated, supports a thorough
      inquiry. But the specific course taken was to curtail this inquiry to interagency name checks upon learning of the campaign
      role, and the Commission found no basis to criticize that action. The balance therefore favors {O2}, while the reasons
      given do not establish a broader rule for when full contacts should be curtailed.
    tradecraft: Implement the limitation by keeping further inquiry to interagency name checks. Record the change in scope,
      the campaign-role information that prompted it, and the continuing classified-access consideration.
    uncertainty: The reason the campaign role led to curtailment, any legal rule governing campaign-related inquiries, and
      the results of the name checks are not given. The endorsement is specific to this instance and does not establish that
      every inquiry involving a campaign role must be limited in the same way.
    handoff: The Office of Security should make the scope decision. Involve a supervisor if applicable procedures require
      review; otherwise, the Office can carry out the restriction and record its basis.
    tempting_wrong:
      option: O3
      pull: Classified access was under consideration, and proper security investigations are essential.
      why_wrong: That general security rationale does not displace the specific course of immediately curtailing the inquiry
        after learning of the campaign role, which the Commission found no basis to criticize.
    rejected:
      O1: The endorsed course was an immediate curtailment to interagency name checks, not holding the inquiry pending supervisory
        review.
      O3: The endorsed course stopped further broad contacts and restricted further inquiry to interagency name checks.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A concrete, independently supported security concern arose that required broader inquiry to assess the contemplated
        classified access.
      then: O3
      why: A specific security concern could make the general need to prevent security risks outweigh the reason for limiting
        contacts in this instance.
    would_not_change:
    - id: noflip1
      if: The only additional fact were that the routine inquiry had already begun.
      why: The inquiry had already begun when it was curtailed, so that fact alone would not change the outcome.
    watch_for:
    - id: watch1
      what: Whether classified materials remain under consideration and whether any particularized security concern supports
        further contacts.
      favors:
      - O3
      why: The security purpose and contemplated classified access weigh in favor of effective screening, though they did
        not prevent curtailment in this instance.
  lesson: A security purpose can justify an inquiry without making every investigative step automatic. When circumstances
    change, preserve proportionate screening while respecting the endorsed limit; do not treat political campaign involvement
    alone as proof of risk. This outcome is supported for the particular instance, not as a categorical rule.
  limits: This reasoning applies only to curtailing broader contacts while retaining interagency name checks after learning
    of a campaign role. It supplies no general legal standard for political activity, gives no explanation for the basis of
    the curtailment, and does not resolve how a concrete new security concern should be handled.
  library:
    domain: intel-oversight
    family: CORPUS-NX-56e636fc
    source: https://www.aarclibrary.org/publib/church/rockcomm/pdf/RockComm_Chap13_OtherInv.pdf
    episode_focus: The decision point is the choice between continuing the full security inquiry and curtailing it to interagency
      name checks. The investigation began because the subject might receive classified material; after learning of the campaign
      role, the CIA curtailed it, a course the Commission found no basis to criticize. Exclude broader claims about political
      use of the Agency.
