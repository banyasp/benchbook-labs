case:
  id: DR-CORPUS-NX-56e636fc-E2@v1
  title: Investigating Reported Threats by Outsiders
  status: draft
  setting: United States; date not specified; Central Intelligence Agency, with the FBI and Secret Service.
  decider: The Director of Central Intelligence
  agent: The Director of Central Intelligence
  agent_role: decide
  situation: A report alleged that several people planned to assassinate the Director of Central Intelligence and kidnap the
    Vice President. The people under consideration had no relationship whatever with the Agency. The Commission framed the
    CIA's general investigative boundary as limiting inquiries to people presently or formerly affiliated with the Agency,
    directly or indirectly. Further inquiry into contacts of people properly under investigation was to be left to the FBI
    or other appropriate law-enforcement agencies. The FBI and Secret Service were involved with knowledge and consent.
  question: What should the Director of Central Intelligence do about the reported threats against the Director and the Vice
    President?
  options:
    O1:
      do: The Director declines a CIA investigation of the outsiders and refers the reported threats to the FBI and Secret
        Service.
      move: act
      irreversible: false
    O2:
      do: The Director authorizes a CIA investigation of the outsiders concerning the reported threats, with the FBI and Secret
        Service participating.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A report alleged that several people intended to assassinate the Director of Central Intelligence and kidnap the
      Vice President.
  - id: F2
    kind: situation
    status: confirmed
    fact: The people involved in the alleged threats had no relationship whatever with the Agency.
  - id: F3
    kind: authority
    status: assessed
    fact: The Commission stated that CIA investigations should generally be limited to people presently or formerly affiliated
      with the Agency, directly or indirectly.
  - id: F4
    kind: authority
    status: assessed
    fact: The Commission stated that further investigation of contacts of people properly under investigation should be left
      to the FBI or other appropriate law-enforcement agencies.
  - id: F5
    kind: situation
    status: confirmed
    fact: The investigation concerning the alleged threats was conducted in close cooperation with the FBI and Secret Service.
  - id: F6
    kind: situation
    status: confirmed
    fact: The FBI and Secret Service had full knowledge of and consented to the investigation.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The general boundary is that CIA investigations should be limited to people affiliated with the Agency, and further
      inquiry into contacts should be left to law-enforcement authorities.
  - id: C2
    facts:
    - F1
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The alleged plan involved assassinating the Director and kidnapping the Vice President; the Commission treated the
      circumstances as extreme and the threat to the Agency's Director as a reason for an exception.
  - id: C3
    facts:
    - F5
    - F6
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The investigation was undertaken with the FBI and Secret Service, with their full knowledge and consent, a condition
      the Commission expressly noted in treating the case as probably exceptional.
  reasoning:
    read: This is an alleged threat of exceptional gravity, but the people under consideration have no Agency relationship.
      The trap is to treat the general limit on CIA investigations as either irrelevant because the threat is grave, or as
      an absolute bar despite the unusual circumstances and law-enforcement coordination.
    weighing: The general rule favors declining a CIA investigation of outsiders and leaving further inquiry into contacts
      to law enforcement {C1}. The Commission nevertheless treated this episode as probably an exception because the circumstances
      were extreme, the threats involved the Director, and the FBI and Secret Service knew of and consented to the investigation
      {C2} {C3}. On this record, those specific conditions outweigh the general boundary, but the judgment depends on the
      exceptional threat and interagency involvement.
    tradecraft: Record the exceptional circumstances supporting the decision, the scope of the CIA's role, and the FBI's and
      Secret Service's knowledge and consent. Keep any further inquiry within the stated boundary and refer matters outside
      it to the appropriate law-enforcement authority.
    uncertainty: The source characterizes the exception as probable, not categorical. The report alleges the threats; the
      source does not establish a general CIA authority to investigate unrelated outsiders whenever a serious allegation arises.
    handoff: 'Do not decide or act in isolation: involve the FBI and Secret Service, as their knowledge and consent were part
      of the Commission''s stated basis for treating this investigation as an exception.'
    tempting_wrong:
      option: O1
      pull: The people have no relationship whatever with the Agency, and the Commission stated a general limit on CIA investigations.
      why_wrong: That rule is important, but applying it as an absolute bar would disregard the Commission's treatment of
        this extreme threat involving the Director, conducted with the FBI's and Secret Service's knowledge and consent.
    rejected:
      O1: The Commission treated the extreme circumstances and interagency knowledge and consent as making this investigation
        probably an exception to the general limit.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The CIA investigation were sought simply because newsmen had published leaked classified information, without the
        exceptional threat circumstances described here.
      then: O1
      why: The Commission stated that the CIA has no authority to investigate newsmen simply for publishing leaked classified
        information.
    - id: flip2
      if: The inquiry extended to further investigation of contacts of people properly under investigation.
      then: O1
      why: The Commission said further investigation of those contacts should be left to the FBI or other appropriate law-enforcement
        agencies.
    would_not_change:
    - id: noflip1
      if: The people under consideration remain unaffiliated with the Agency while the extreme threat to the Director and
        the FBI's and Secret Service's knowledge and consent remain as described.
      why: Outsider status is the general-rule concern, but the Commission treated this particular combination of exceptional
        circumstances and coordination as probably an exception.
    watch_for:
    - id: watch1
      what: Whether the circumstances remain extreme, the threat involves the Agency's Director, and the FBI and Secret Service
        have knowledge of and consent to the investigation.
      favors:
      - O2
      why: These are the conditions the Commission identified in treating the case as probably exceptional.
  lesson: A general limit on an agency's authority to investigate outsiders should not be treated as either meaningless or
    absolute. A grave, exceptional threat may justify a narrow exception when the stated circumstances support it and the
    appropriate law-enforcement authorities are involved.
  limits: This reasoning supports only the exceptional threat described here and does not establish general CIA authority
    to investigate people without an Agency relationship. The Commission's conclusion was that this was probably an exception,
    not a categorical rule for other cases.
