case:
  id: DR-CORPUS-INC-YUGOSLAV-CRISIS-NS-776ba75b-E6@v1
  title: Whether to Support Active Steps on Yugoslavia
  status: draft
  setting: United States, after the Cold War, senior policymakers considering Yugoslavia policy
  decider: Senior policymakers
  agent: Senior policymakers
  agent_role: decide
  situation: Senior policymakers in the United States faced whether to support active steps to prevent Yugoslavia's feared
    disintegration. The Soviet threat had declined, and Yugoslavia was widely regarded on both sides of the Atlantic as less
    important than it had been during the Cold War. During the Cold War, countervailing pressures from the United States and
    the Soviet Union had helped hold Yugoslavia together, but those pressures had ended. Policymakers would need to be persuaded
    both that the country would collapse and that there was something within reach to prevent it. Senior working-level officials
    believed active steps were justified by U.S. interests, while the available estimate was unhelpful on whether preventive
    action was within reach.
  question: What should senior policymakers do about supporting active steps to prevent Yugoslavia's feared disintegration?
  options:
    O1:
      do: Senior policymakers decline active steps to prevent Yugoslavia's disintegration.
      move: act
      irreversible: false
    O2:
      do: Senior policymakers support active steps to prevent Yugoslavia's disintegration.
      move: act
      irreversible: false
    O3:
      do: Senior policymakers defer action pending assessment of feasible preventive steps.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: With the Soviet threat declining, Yugoslavia was widely viewed on both sides of the Atlantic as less important than
      during the Cold War.
  - id: F2
    kind: situation
    status: assessed
    fact: During the Cold War, countervailing pressure from the United States and the Soviet Union helped hold Yugoslavia
      together.
  - id: F3
    kind: situation
    status: assessed
    fact: After the Cold War ended, neither side cared about Yugoslavia's future alignment.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Yugoslavia's collapse was feared.
  - id: F5
    kind: capability
    status: assessed
    fact: Policymakers would need to be convinced both that Yugoslavia would collapse and that something within reach could
      prevent it.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The estimate was unhelpful on whether there was something within reach to prevent disintegration.
  - id: F7
    kind: situation
    status: assessed
    fact: Some senior working-level officials believed U.S. interests justified very active steps to prevent disintegration.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: With the Soviet threat diminished and neither side concerned about Yugoslavia's future alignment, senior policymakers
      saw less strategic reason to commit to active prevention.
  - id: C2
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    - O3
    weight: strong
    why: Action required confidence not only that collapse was coming but also that prevention was within reach; the estimate
      did not help establish that feasibility.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The countervailing U.S. and Soviet pressures that had helped hold Yugoslavia together had ended, while neither side
      cared about its future alignment.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Some senior working-level officials judged that U.S. interests justified very active steps, providing a substantive
      case for intervention that the senior policymakers did not accept.
  reasoning:
    read: 'The decision was not simply whether collapse was feared: policymakers also needed a reason to treat Yugoslavia
      as strategically important and confidence that some preventive action was within reach. The trap is to treat either
      the feared collapse or the working-level officials'' view of U.S. interests as sufficient by itself to settle the decision.'
    weighing: 'The senior policymakers declined active steps in a setting where Yugoslavia was widely regarded as less important
      after the Cold War and the estimate was unhelpful about whether prevention was feasible. That position was not uncontested:
      some senior working-level officials considered active steps justified by U.S. interests, but failed to persuade their
      superiors. The balance would depend on both the perceived stakes and whether preventive action appeared achievable.'
    tradecraft: Keep the forecast of collapse separate from the assessment of preventive feasibility and from the judgment
      about U.S. interests. Record the uncertainty, the working-level dissent, and the senior policymakers' decision and rationale
      without inventing operational details.
    uncertainty: The estimate did not establish whether anything within reach could prevent disintegration. The passage also
      does not specify what active steps were proposed or the detailed grounds on which senior policymakers rejected the working-level
      officials' case.
    handoff: The decision belonged to senior policymakers. Senior working-level officials had a role in presenting their assessment
      of U.S. interests, but the passage records that they could not persuade their superiors.
    tempting_wrong:
      option: O2
      pull: Some senior working-level officials believed U.S. interests justified very active steps to prevent disintegration.
      why_wrong: That view did not resolve the separate problem that policymakers also needed to be persuaded that prevention
        was within reach, and the senior policymakers were not persuaded by the officials' case.
    rejected:
      O2: Senior policymakers did not accept the working-level officials' case for active steps, while the estimate was unhelpful
        about whether prevention was feasible.
      O3: The senior policymakers' recorded outcome was to want no part of active prevention, not to defer pending a further
        assessment.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Senior policymakers were persuaded both that Yugoslavia would collapse and that something within reach could prevent
        it, and judged the U.S. interests sufficient to justify action.
      then: O2
      why: A persuasive case on both the anticipated collapse and the feasibility of prevention, together with sufficient
        perceived U.S. interests, could shift the decision toward support.
    would_not_change:
    - id: noflip1
      if: Policymakers were persuaded only that Yugoslavia would collapse, without being persuaded that prevention was within
        reach.
      why: The source identifies confidence in both collapse and preventive feasibility as necessary to move policymakers
        to action; collapse concern alone would not resolve the feasibility gap.
    watch_for:
    - id: watch1
      what: U.S. interests framed around ideals, allies, and the future of NATO.
      favors:
      - O2
      why: The passage identifies these interests as part of what later moved the United States to intervene in Bosnia, suggesting
        that a comparable assessment of stakes could strengthen the case for action.
  lesson: 'A feared crisis does not by itself establish a case for preventive action: decision-makers must also assess whether
    action can plausibly affect the outcome and what interests are at stake. Separate those questions, give dissent a clear
    hearing, and make the senior decision on the resulting balance.'
  limits: This account gives no operational proposal, detailed legal analysis, or complete record of the senior policymakers'
    reasoning. It concerns a post-Cold War strategic judgment and should not be treated as a general rule to decline preventive
    action.
