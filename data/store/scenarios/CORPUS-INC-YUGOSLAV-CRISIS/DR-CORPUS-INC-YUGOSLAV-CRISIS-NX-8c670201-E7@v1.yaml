case:
  id: DR-CORPUS-INC-YUGOSLAV-CRISIS-NX-8c670201-E7@v1
  title: Organizing Intelligence Support for Yugoslavia
  status: draft
  setting: Yugoslavia and the U.S. intelligence community, during the worsening regional situation.
  decider: The DCI
  agent: The DCI
  agent_role: decide
  situation: The situation in Yugoslavia has deteriorated markedly over several weeks. Some outside military intervention
    in the region is increasingly likely, and the United States is expected to play a facilitating role that includes intelligence
    support. The DCI must decide how to organize that support while using Community resources efficiently. The contemplated
    support includes sanctions monitoring for a UN Security Council resolution, general military intelligence support for
    U.S. policy and contingency planning, and tactical intelligence support. A proposed organizational model involves CIA,
    DIA, and some NSA support, with a military analytic element at DIA.
  question: What should the DCI do about organizing U.S. intelligence support for the situation in Yugoslavia?
  options:
    O1:
      do: The DCI decentralizes U.S. intelligence support among the existing intelligence agencies.
      move: act
      irreversible: false
    O2:
      do: The DCI centralizes U.S. intelligence support in an interagency Balkan Task Force.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The situation in Yugoslavia had deteriorated markedly over several weeks.
  - id: F2
    kind: situation
    status: assessed
    fact: Some form of outside military intervention in the region was increasingly likely.
  - id: F3
    kind: situation
    status: assessed
    fact: The United States was expected to play a facilitating role that included intelligence support.
  - id: F4
    kind: situation
    status: assessed
    fact: Efficient use of Community resources was a stated organizational concern.
  - id: F5
    kind: authority
    status: confirmed
    fact: The DCI was positioned to establish an interagency task force to manage all-source U.S. intelligence support.
  - id: F6
    kind: situation
    status: confirmed
    fact: The contemplated mission included coordinating the Community's sanctions-monitoring effort in support of a UN Security
      Council resolution.
  - id: F7
    kind: situation
    status: confirmed
    fact: The contemplated mission included coordinating general military intelligence support for U.S. policy and contingency
      planning, as well as tactical intelligence support.
  - id: F8
    kind: capability
    status: confirmed
    fact: The proposed task force arrangement placed its headquarters at CIA, included a military analytic element at DIA,
      relied largely on CIA and DIA staffing with some NSA support, and could require assistance from other agencies.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The marked deterioration, increasing likelihood of outside intervention, and expected U.S. intelligence-support role
      create a need to organize that support for the situation.
  - id: C2
    facts:
    - F4
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: The DCI expressly made efficient use of Community resources a reason for establishing a task force to manage all-source
      support.
  - id: C3
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The contemplated mission covers sanctions monitoring and several forms of military intelligence support; the DCI
      assigned their coordination to the task force.
  reasoning:
    read: This is an organizational decision about U.S. intelligence support as the situation in Yugoslavia worsens and outside
      intervention becomes more likely. It is not a decision to authorize intervention. The issue is whether to centralize
      support in a task force or leave it with existing agencies.
    weighing: 'The DCI''s stated reasons support {O2}: the deteriorating situation and likely intervention increase the need
      to organize support, while efficient use of Community resources favors a central coordinating structure. The task force''s
      assigned coordination of sanctions monitoring and military support gives that structure a defined mission. The balance
      depends on the stated expectation that the United States will facilitate events with intelligence support and on the
      need to use Community resources efficiently.'
    tradecraft: State the DCI's organizational decision, its authority, the task force's mission, and the reasons for centralization
      in the decision record. Keep the record focused on organizational responsibility and coordination rather than collection
      or tasking procedures.
    uncertainty: The stated reasons support centralization, but the source does not compare the expected performance or costs
      of a task force with those of decentralized agency support.
    handoff: The DCI makes the organizational decision and should involve the NFIB representatives in discussing the task
      force's mission and operation, as planned. CIA, DIA, and NSA participation is relevant to carrying out the stated interagency
      mission.
    tempting_wrong:
      option: O1
      pull: Leaving support decentralized may seem to preserve existing agency arrangements.
      why_wrong: The DCI's stated concerns were the worsening situation, likely outside intervention, and efficient use of
        Community resources; the chosen task force was expressly intended to manage and coordinate the support.
    rejected:
      O1: The DCI did not leave support dispersed among agencies, choosing instead to establish a task force to manage and
        coordinate it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Outside military intervention were no longer increasingly likely and the United States were no longer expected to
        facilitate events with intelligence support.
      then: O1
      why: Those circumstances would substantially weaken the source's stated need to organize a dedicated, centralized support
        effort.
    would_not_change:
    - id: noflip1
      if: The participating agencies or their staffing contributions changed, while the deteriorating situation, coordination
        mission, and resource-efficiency concern remained.
      why: A change in staffing arrangements alone would not remove the source's stated reasons for centralizing the support
        function.
    watch_for:
    - id: watch1
      what: Whether a centralized task force can in fact use Community resources efficiently while coordinating its assigned
        support mission.
      favors:
      - O1
      why: Evidence that centralization undermines rather than serves the DCI's stated efficiency concern could weaken the
        case for O2.
  lesson: When a deteriorating situation creates a cross-agency support need, organize the function around the mission and
    the stated need to use shared resources efficiently. Do not confuse a decision to coordinate intelligence support with
    a decision to authorize the underlying military intervention.
  limits: This reasoning applies to the organizational choice presented here, where the DCI is positioned to establish a task
    force and the source identifies both a multi-part support mission and an efficiency concern. It does not establish that
    centralization is preferable when those conditions are absent or when evidence shows it would not use resources efficiently.
