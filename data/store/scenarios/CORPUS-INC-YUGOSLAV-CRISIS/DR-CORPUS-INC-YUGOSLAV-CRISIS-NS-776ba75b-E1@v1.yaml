case:
  id: DR-CORPUS-INC-YUGOSLAV-CRISIS-NS-776ba75b-E1@v1
  title: Reassigning the Yugoslavia Estimate Draft
  status: draft
  setting: Belgrade and the National Intelligence Council, during preparation of the 1990 Yugoslavia estimate.
  decider: The National Intelligence Officer
  agent: The National Intelligence Officer
  agent_role: decide
  situation: An NIE on Yugoslavia was being drafted. The National Intelligence Officer visited Belgrade to assess the situation
    while the estimate was in preparation. The initial draft forecast that Yugoslavia would muddle through, reasoning that
    Yugoslavs, especially the JNA officer corps, would not allow the country to collapse. The Communist Party and the JNA
    no longer appeared to be strong or credible guarantors of cohesion.
  question: What should the National Intelligence Officer do about the first draft and its assignment?
  options:
    O1:
      do: The National Intelligence Officer reassigns the first draft to a new drafter.
      move: act
      irreversible: false
    O2:
      do: The National Intelligence Officer retains the first draft with its current drafter.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An NIE on Yugoslavia was in draft.
  - id: F2
    kind: situation
    status: confirmed
    fact: The National Intelligence Officer visited Belgrade while the NIE was in draft to assess the situation.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The initial draft judged that Yugoslavia would muddle through.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The initial draft reasoned that the prospect of national collapse was so dark that Yugoslavs, especially the JNA
      officer corps, would not allow it.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Communist Party no longer seemed strong or credible enough to guarantee Yugoslav cohesion.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The JNA no longer seemed strong or credible enough to guarantee Yugoslav cohesion.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The draft’s forecast depended on the assumption that the prospect of collapse would prevent Yugoslavs, especially
      the JNA officer corps, from allowing it. The NIO and caucus group found that reasoning unpersuasive.
  - id: C2
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The Communist Party and the JNA no longer seemed strong or credible enough to serve as the guarantors of cohesion
      on which the draft’s forecast relied.
  - id: C3
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The NIO had visited Belgrade to assess the situation and, reflecting on those findings, judged the initial conclusion
      unpersuasive; retaining the draft unchanged would leave that assessment unaddressed.
  reasoning:
    read: The question is whether to retain an initial forecast whose central reassurance was that Yugoslavs would prevent
      collapse because its consequences were so severe. The trap is treating the gravity of collapse as evidence that the
      institutions expected to prevent it still had the strength and credibility to do so.
    weighing: The initial forecast’s reasoning did not persuade the NIO and caucus group {C1}. Their assessment that the Communist
      Party and JNA were no longer credible guarantors of cohesion directly undermined its premise {C2}. The NIO’s assessment
      after visiting Belgrade also weighed against leaving the first draft as it stood {C3}. On that balance, reassignment
      was the chosen response; the stated basis was the assessment of the draft and the guarantors, not a general rule that
      drafts must be reassigned whenever a reviewer disagrees.
    tradecraft: Reassign the draft to a new drafter, as the NIO did. As a decision-practice addition, record the specific
      premise found unpersuasive and the evidence or assessment that bears on it, without presenting the reassignment itself
      as proof of the forecast.
    uncertainty: The passage gives the NIO’s judgment and its key rationale, but not the underlying details of the Belgrade
      assessment or a full account of evidence for either forecast. The decision therefore rests here on the stated credibility
      concern and the NIO’s assessment, not on an independent reconstruction of the estimate.
    handoff: The NIO acted with the caucus group, whose members shared the concern about the first conclusion. The passage
      does not specify a separate approval authority for the reassignment.
    tempting_wrong:
      option: O2
      pull: 'The initial draft offered a reassuring way through: the stakes of national collapse were so grave that the Yugoslavs,
        especially the JNA, would prevent it.'
      why_wrong: That reasoning assumes the very capacity and credibility of the Communist Party and JNA that the NIO and
        caucus group no longer found persuasive.
    rejected:
      O2: The NIO did not retain the first draft with its current drafter because its conclusion was unpersuasive in light
        of the weakened credibility of the former guarantors of cohesion.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Communist Party and JNA instead appeared strong and credible enough to guarantee cohesion.
      then: O2
      why: That would remove the stated reason the initial draft’s central premise was unpersuasive and could support retaining
        it.
    - id: flip2
      if: The NIO’s assessment after the Belgrade visit supported the initial forecast rather than undermining it.
      then: O2
      why: The stated basis for reassignment would be absent, making retention more supportable on the facts presented.
    would_not_change:
    - id: noflip1
      if: The consequences of national collapse remained grave, but the Communist Party and JNA still did not seem credible
        guarantors of cohesion.
      why: The gravity of collapse alone would not resolve the stated concern about whether the actors expected to prevent
        it could do so.
    watch_for:
    - id: watch1
      what: Whether the institutions relied on to preserve cohesion are assessed as strong and credible.
      favors:
      - O2
      - O1
      why: That assessment bears directly on the premise the NIO and caucus group found unpersuasive.
  lesson: Do not treat the severe consequences of a forecasted failure as proof that someone will prevent it. Test whether
    the institutions or actors on which that assumption depends still have the capacity and credibility the forecast requires.
  limits: This reasoning concerns whether to reassign an intelligence estimate draft in light of a challenged analytic premise.
    It does not establish what the final forecast should have been or determine what later policymakers should do.
  library:
    domain: intel-analysis
    family: CORPUS-INC-YUGOSLAV-CRISIS
    source: https://www.cia.gov/resources/csi/static/75ca22531faf720b31ff82f353d79301/Unheeded-Warning-Yugoslavia.pdf
    episode_focus: The initial draft judged that Yugoslavia would muddle through; the National Intelligence Officer and caucus
      group found that conclusion unpersuasive because the Communist Party and military no longer seemed credible guarantors
      of cohesion. Focus on the analytic choice to reassign the draft and its basis, not on later operational or diplomatic
      responses.
