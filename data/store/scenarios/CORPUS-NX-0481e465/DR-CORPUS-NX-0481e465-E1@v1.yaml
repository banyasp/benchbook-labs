case:
  id: DR-CORPUS-NX-0481e465-E1@v1
  title: ECOWAS Reinforcement of ECOMOG
  status: draft
  setting: Sierra Leone, February 1998, ECOWAS
  decider: ECOWAS
  agent: ECOWAS
  agent_role: decide
  situation: 'The Security Council had authorized ECOWAS to implement the arms and petroleum embargo, and ECOMOG''s authorized
    role was monitoring that embargo. The Conakry peace agreement provided for ECOMOG to supervise the ceasefire, address
    disarmament, demobilization and reintegration, and monitor humanitarian assistance. After the agreement broke down, ECOWAS
    faced a decision about strengthening ECOMOG with additional contingents. The Security Council had not authorized that
    step. Before February 1998, the status of Nigerian and ECOMOG forces in Sierra Leone was controversial: Sierra Leone''s
    president said Nigeria had been asked to intervene under a bilateral defence agreement, while Nigeria maintained it had
    acted under the ECOMOG banner.'
  question: What should ECOWAS do about strengthening ECOMOG in Sierra Leone after the Conakry agreement broke down?
  options:
    O1:
      do: ECOWAS deploys additional contingents to reinforce ECOMOG in Sierra Leone.
      move: act
      irreversible: false
    O2:
      do: ECOWAS withholds additional contingents from reinforcing ECOMOG in Sierra Leone.
      move: act
      irreversible: false
    O3:
      do: ECOWAS asks the Security Council to authorize ECOMOG reinforcements in Sierra Leone.
      move: ask
      irreversible: false
      to: the Security Council
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Security Council authorized ECOWAS to ensure implementation of the arms and petroleum embargo stipulated in
      Resolution 1132.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Security Council had authorized ECOMOG to monitor the embargo, but had not given it a broader peacekeeping mandate.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Conakry agreement provided for ECOMOG to supervise ceasefire compliance, address disarmament, demobilization
      and reintegration, and monitor humanitarian assistance.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Conakry peace agreement had broken down.
  - id: F5
    kind: authority
    status: confirmed
    fact: The strengthening of ECOMOG with new contingents was undertaken without Security Council authorization.
  - id: F6
    kind: authority
    status: confirmed
    fact: A bilateral defence agreement with Sierra Leone's president was cited as the basis for Nigerian troops being in
      Sierra Leone before February 1998.
  - id: F7
    kind: situation
    status: assessed
    fact: Sierra Leone's president said he had asked Nigeria to intervene under the bilateral defence agreement, while Nigeria
      maintained that it had acted under the ECOMOG banner; the forces' status was controversial.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Security Council authorized embargo monitoring, not a broader mandate, and the reinforcements were sent without
      Council authorization. Article 53 requires Security Council authorization for enforcement action under regional arrangements.
      [src:b7d3abb8af49#p1.14] [src:b7d3abb8af49#p1.16]
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Conakry agreement described a peacekeeping role, and its breakdown was the context for strengthening ECOMOG.
      Regional peacekeeping activities may fall within peaceful settlement under Chapter VI and Article 52, distinct from
      enforcement action under Article 53. [src:b7d3abb8af49#p1.14] [src:b7d3abb8af49#p1.15]
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Security Council commended ECOWAS and ECOMOG for their important role supporting restoration of peace and security.
      That recognition supports the regional peacekeeping framing, but did not itself authorize the reinforcements. [src:b7d3abb8af49#p1.16]
  - id: C4
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: weak
    why: 'The pre-February status of the Nigerian and ECOMOG forces was controversial: Sierra Leone''s president invoked a
      bilateral defence agreement, while Nigeria said it had acted under the ECOMOG banner. The asserted basis for intervention
      therefore remained unsettled. [src:b7d3abb8af49#p1.15]'
  reasoning:
    read: The issue is not simply whether ECOWAS could reinforce a force after a peace agreement collapsed. ECOMOG's Council
      authorization covered embargo monitoring, while the agreement described a peacekeeping role; the legal distinction is
      whether the expanded regional role falls under peaceful settlement and coordination or constitutes enforcement requiring
      Security Council authorization. The disputed status of the earlier Nigerian and ECOMOG presence adds uncertainty rather
      than resolving that distinction.
    weighing: The authority limitation weighs against deploying without first seeking Council authorization {C1}. Against
      that, ECOMOG's regional peacekeeping role is characterized as peaceful settlement under Chapter VI and Article 52, and
      the Security Council commended ECOWAS and ECOMOG {C2} {C3}. ECOWAS nevertheless strengthened ECOMOG. The legal balance
      depends on whether the role is treated as peaceful settlement or enforcement; Council praise is not itself authorization.
      The competing accounts of the prior forces' status add uncertainty {C4}.
    tradecraft: For a comparable decision, document the existing mandate separately from the agreement's stated tasks, identify
      whether the proposed role is being treated as Article 52 peaceful settlement or Article 53 enforcement, and record the
      basis for that classification. Because the authority question is unresolved here, seek the Security Council's position
      and distinguish its commendation from formal authorization.
    uncertainty: Whether ECOMOG's expanded role and use of force without Security Council authorization breached international
      law is not conclusively resolved. The basis for Nigerian forces' presence before February 1998 is also disputed.
    handoff: Seek the Security Council's position on the scope of authority, because Article 53 requires its authorization
      for enforcement action. Council commendation alone does not resolve whether the operation was enforcement.
    tempting_wrong:
      option: O2
      pull: Withholding reinforcements avoids expanding a role beyond the Security Council's express embargo-monitoring authorization.
      why_wrong: That treats the authorization gap as settling the classification question, although the regional peacekeeping
        role may fall within peaceful settlement and the Security Council commended ECOMOG's contribution.
    rejected:
      O2: Withholding reinforcements was not the course taken in the context of the agreement's breakdown and ECOMOG's regional
        peacekeeping role.
      O3: Seeking authorization would address the Article 53 concern, but ECOWAS strengthened ECOMOG while the Security Council
        treated its role in terms of peaceful settlement without resolving the authorization issue.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Security Council determined that the proposed expanded role was enforcement action under Article 53 and that
        prior authorization was required.
      then: O3
      why: That determination would make the authorization gap decisive and support asking the Council to authorize the reinforcements
        before deployment.
    - id: flip2
      if: The Conakry agreement had not broken down and the circumstances that prompted strengthening were absent.
      then: O2
      why: The breakdown of the agreement was the context for ECOWAS's decision to strengthen ECOMOG.
    would_not_change:
    - id: noflip1
      if: The Security Council continued to commend ECOMOG's contribution to restoring peace and security.
      why: Commendation supports the peacekeeping framing but, without more, does not amount to authorization for the additional
        contingents.
    - id: noflip2
      if: The disagreement over whether Nigerian troops acted under a bilateral defence agreement or the ECOMOG banner remained
        unresolved.
      why: That dispute would preserve uncertainty about the earlier forces' status, not establish authority for the February
        reinforcements.
    watch_for:
    - id: watch1
      what: Whether the expanded regional role is treated as peaceful settlement under Article 52 or enforcement action under
        Article 53.
      favors:
      - O3
      why: This classification determines whether Security Council authorization is required.
  lesson: A regional agreement's peacekeeping provisions and a Security Council's authorization are distinct sources of authority;
    one should not be treated as silently enlarging the other. Where the legal classification of a regional role determines
    whether Council authorization is required, record the ambiguity and distinguish Council praise from formal authorization.
  limits: This reasoning concerns the authority and context for strengthening ECOMOG after the Conakry agreement broke down.
    It does not resolve the legality of particular operations, establish a general rule that regional peacekeeping never requires
    Security Council authorization, or settle the status of the pre-February forces.
