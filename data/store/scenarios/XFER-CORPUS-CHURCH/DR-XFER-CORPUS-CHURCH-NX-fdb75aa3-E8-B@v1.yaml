case:
  id: DR-XFER-CORPUS-CHURCH-NX-fdb75aa3-E8-B@v1
  title: 'Defensive and Mission Cyber Teams: Separate Commands or Integration'
  status: draft
  setting: A national military service, 2024–2025
  decider: The Service Chief
  agent: The Service Chief
  agent_role: decide
  situation: The service's network-defense teams and mission cyber teams remain separately administered commands, although
    their responsibilities overlap on the same service networks. Their relationship is marked by organizational rivalry, with
    teams clashing over personnel and tools. Mission-team billets carry higher grades and special pay, and the mission command
    now has more personnel and budget than the defensive command. The service's General Counsel and an organizational study
    recommend creating a single cyber command, and the Service Chief is weighing that option. Senior defensive-team leaders
    favor placing mission functions under their command and fear being engulfed. The two kinds of team operate under distinct
    legal authorities that would remain separate even if their administrative organization changed.
  question: What should the Service Chief do about the organizational relationship between the network-defense teams and the
    mission cyber teams?
  options:
    O1:
      do: The Service Chief combines selected divisional functions while retaining separate administrations for the network-defense
        teams and mission cyber teams.
      move: partial
      irreversible: false
    O2:
      do: The Service Chief establishes a unified cyber command while keeping the distinct legal authorities for defensive
        and mission cyber activities separate.
      move: act
      irreversible: false
    O3:
      do: The Service Chief keeps the network-defense teams and mission cyber teams in independently administered commands.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The network-defense teams and mission cyber teams are separately administered commands with overlapping responsibilities
      for the same service networks.
  - id: F2
    kind: situation
    status: assessed
    fact: Rivalry dominates relations between the commands, and teams clash over personnel and tools.
  - id: F3
    kind: situation
    status: confirmed
    fact: Differences in mission, grades, and special pay have been identified as sources of antagonism between the commands.
  - id: F4
    kind: situation
    status: confirmed
    fact: Mission-team billets carry higher grades and special pay than corresponding network-defense billets.
  - id: F5
    kind: situation
    status: confirmed
    fact: The mission cyber command has more personnel and a larger budget than the network-defense command.
  - id: F6
    kind: authority
    status: confirmed
    fact: Applicable law and service directives assign distinct legal authorities to defensive and mission cyber activities;
      administrative reorganization does not consolidate those authorities.
  - id: F7
    kind: situation
    status: confirmed
    fact: The service's General Counsel and an organizational study recommend a single cyber command.
  - id: F8
    kind: situation
    status: assessed
    fact: Senior network-defense leaders favor placing mission functions under their command and fear that integration would
      leave the defensive teams overwhelmed by the mission command.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Service Chief is weighing whether to establish an integrated cyber command.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Separate administration of overlapping responsibilities leaves rivalry dominant and produces clashes at the team
      level; integration addresses the structural coordination problem.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Differences in mission and compensation feed antagonism, while the mission command's higher grades, special pay,
      personnel, and budget add to the imbalance. These conditions strengthen the case for addressing the relationship structurally,
      though the record does not establish that integration itself would resolve them.
  - id: C3
    facts:
    - F7
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The General Counsel and an organizational study recommend a single command, and the Service Chief is weighing an
      integrated structure; this supports moving beyond coordination changes that leave the commands separately administered.
  - id: C4
    facts:
    - F8
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: Senior network-defense leaders fear being overwhelmed and prefer mission functions under their command rather than
      an integrated chain of command. Distinct legal authorities also require clear, separate approval lines within any organization.
      These are real concerns about the form of integration, but they do not require keeping separate administrations or change
      the case for integration.
  reasoning:
    read: 'The central problem is not simply friction between two teams: overlapping responsibilities are divided between
      separately administered commands, and rivalry dominates their relationship. The distinct legal authorities must remain
      separate, but they do not require separate administration. The trap is to treat grade and pay grievances as the whole
      problem, or to assume that placing mission functions under the defensive command would answer the broader coordination
      problem.'
    weighing: 'The structural case for integration is strongest: the separation accompanies persistent clashes, while the
      General Counsel and an organizational study recommend a single command and the Service Chief is weighing an integrated
      structure {C1} {C3}. Grade, pay, and resource disparities contribute to antagonism but do not, on this record, establish
      that retaining separate administrations would cure it {C2}. The defensive leaders'' fear of being overwhelmed weighs
      against the chosen form, and the distinct legal authorities require separate approval lines, but neither point requires
      separate administration; the concern about form remains important without outweighing the case for a unified command
      {C4}. The balance therefore favors O1, while depending on whether integration can establish a unified structure without
      allowing one command''s interests to dominate and while keeping legal authorities distinct.'
    tradecraft: Record the coordination problem, the competing views about the form of integration, and the reasons for choosing
      a unified command. Define reporting, decision, and legal approval authority clearly, preserving the distinct authorities
      for defensive and mission cyber activities. Consult the affected senior commands and the General Counsel, and review
      whether integration is reducing organizational rivalry rather than reproducing it under one structure.
    uncertainty: The record identifies sources of conflict and the recommendations for integration, but does not establish
      that integration would resolve grade, pay, or resource grievances. It also records concern that the network-defense
      teams could be overwhelmed and does not establish that integration's organizational effects would be even. The legal
      authorities remain distinct regardless of administrative structure.
    handoff: The Service Chief should decide the internal structure after consulting senior network-defense and mission cyber
      leadership and the General Counsel. The disagreement concerns the form of integration, while the legal authorities governing
      defensive and mission cyber activities must remain separate within any unified command.
    tempting_wrong:
      option: O1
      pull: It appears to offer compromise by combining selected functions while preserving separate administrations, addressing
        the defensive leaders' concern about being overwhelmed and preserving distinct legal authorities.
      why_wrong: The record identifies overlapping work and rivalry while the commands remain separately administered. Distinct
        legal authorities can be preserved within a unified command, so a partial arrangement would leave the underlying organizational
        division in place.
    rejected:
      O1: The record identifies continuing rivalry amid overlapping responsibilities under separate administrations, so combining
        selected functions while retaining separate administrations would not address the structural problem.
      O3: Keeping the commands separately administered would preserve the arrangement associated with rivalry and clashes
        despite their overlapping responsibilities.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that a unified command would materially increase the risk that the network-defense teams
        would be overwhelmed, while combining selected functions could resolve the coordination problem and preserve effective
        accountability and the distinct legal authorities.
      then: O1
      why: That would make the concern about integration's form more consequential and support a partial structure instead.
    - id: flip2
      if: The responsibilities ceased to overlap and the rivalry attributable to separate administration no longer impaired
        coordination.
      then: O3
      why: Without the structural coordination problem, the main reason for integration would be substantially reduced.
    would_not_change:
    - id: noflip1
      if: The grade, pay, and resource disparities were reduced but the commands remained separately administered with overlapping
        responsibilities and team-level rivalry.
      why: The record identifies compensation and resources as sources of antagonism, but also identifies structural separation
        and organizational rivalry as central problems.
    watch_for:
    - id: watch1
      what: Whether a unified command establishes clear and balanced authority across the teams, preserves separate legal
        approval authorities, and addresses the network-defense leaders' concern about being overwhelmed.
      favors:
      - O2
      why: If integration does not provide balanced, workable authority while maintaining the distinct legal boundaries, the
        concern about its form becomes more weighty.
  lesson: When separately administered commands have overlapping responsibilities and persistent rivalry, address the structural
    source of the conflict rather than relying on coordination measures alone. Integration still requires attention to authority
    and balance, especially when one command fears being overwhelmed; a unified administrative structure need not combine
    distinct legal authorities.
  limits: This reasoning applies to the organizational choice described here, not to the merits of any particular cyber activity.
    It does not establish that integration will cure grade, pay, or resource disparities, or that integration is appropriate
    when responsibilities and authority are materially different.
