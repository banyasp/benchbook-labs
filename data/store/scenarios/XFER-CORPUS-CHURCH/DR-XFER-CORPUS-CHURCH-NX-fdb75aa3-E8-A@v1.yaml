case:
  id: DR-XFER-CORPUS-CHURCH-NX-fdb75aa3-E8-A@v1
  title: 'Port-of-Entry Inspection Services: Separate Services or Integration'
  status: draft
  setting: Department of Border Administration, national ports of entry, 2008–2009
  decider: The Secretary
  agent: The Secretary
  agent_role: decide
  situation: Customs inspectors and immigration inspectors remain separately administered services, although both screen the
    same travelers and cargo at the nation's ports of entry. Their relationship is marked by organizational rivalry, and clashes
    occur at the inspection booths. Customs inspectors hold higher grades and receive better pay than their immigration counterparts,
    and this year customs surpassed immigration in personnel and budget allocation. The department's General Counsel and a
    management survey recommend a single border service, and the Secretary is weighing integration. Senior immigration officials
    favor placing customs functions under immigration control and fear that immigration could be swallowed by a unified service.
    The Secretary has administrative authority over both services, while interdepartmental border policy guidance is routed
    through the Secretary.
  question: What should the Secretary do about the organizational relationship between customs and immigration inspection
    services?
  options:
    O1:
      do: The Secretary keeps customs and immigration inspection services fully separate.
      move: act
      irreversible: false
    O2:
      do: The Secretary integrates customs and immigration inspection services into one border service.
      move: act
      irreversible: false
    O3:
      do: The Secretary combines selected port inspection functions while retaining separate administrations.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Customs and immigration are separately administered services with overlapping responsibility for screening travelers
      and cargo at ports of entry.
  - id: F2
    kind: situation
    status: assessed
    fact: Organizational rivalry dominates relations between the services, and clashes occur at the inspection booths.
  - id: F3
    kind: situation
    status: confirmed
    fact: Differences in mission and compensation have been identified as sources of antagonism between the services.
  - id: F4
    kind: situation
    status: confirmed
    fact: Customs inspectors hold higher grades and receive better pay than their immigration counterparts.
  - id: F5
    kind: situation
    status: confirmed
    fact: This year, customs surpassed immigration in personnel and budget allocation.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Secretary has administrative authority over both services, and interdepartmental border policy guidance is routed
      through the Secretary.
  - id: F7
    kind: situation
    status: confirmed
    fact: The department's General Counsel and a management survey recommend creating a single border service.
  - id: F8
    kind: situation
    status: assessed
    fact: Senior immigration officials favor placing customs functions under immigration control and fear that immigration
      could be swallowed by a unified service.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Secretary is weighing an integrated structure, while senior immigration officials disagree about its form.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Separate administration of services with overlapping inspection responsibilities leaves rivalry, rather than interchange,
      dominant and produces clashes at the booths; integration addresses the structural coordination problem.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Differences in mission and compensation feed antagonism, and customs' greater grades, pay, personnel, and budget
      add to the imbalance. These conditions strengthen the case for addressing the relationship structurally, though the
      record does not establish that integration itself would resolve them.
  - id: C3
    facts:
    - F7
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The General Counsel and a management survey recommend a single service, and the Secretary is weighing integration;
      this supports moving beyond coordination changes that leave the services separately administered.
  - id: C4
    facts:
    - F8
    equity: chain_of_command
    favors:
    - O3
    weight: weak
    why: Senior immigration officials fear being swallowed and prefer customs functions under immigration control rather than
      an integrated chain of command. This is a real concern about the form of integration, but it does not alter the Secretary's
      consideration of integration.
  reasoning:
    read: 'The central problem is not simply friction between two services: overlapping inspection responsibilities are divided
      between separately administered organizations, and rivalry dominates their relationship. The trap is to treat pay and
      grade grievances as the whole problem, or to assume that assigning customs functions to immigration would answer the
      broader coordination problem.'
    weighing: 'The structural case for integration is strongest: separate administration accompanies clashes at the booths,
      while the General Counsel and a management survey recommend a single service and the Secretary is weighing integration
      {C1} {C3}. Grade, pay, and resource disparities contribute to antagonism but do not, on this record, establish that
      retaining separate administrations would cure it {C2}. Immigration''s fear of being swallowed weighs against the chosen
      form, but the record shows disagreement about form alongside recommendations for integration in principle {C4}. The
      balance therefore favors O1, while depending on whether integration can establish a unified structure without allowing
      one service''s interests to dominate.'
    tradecraft: Record the coordination problem, the competing views about the form of integration, and the reasons for choosing
      a unified structure. Define reporting and decision authority clearly, consult senior leaders from both services and
      the General Counsel, and review whether integration is reducing organizational rivalry rather than reproducing it under
      one structure.
    uncertainty: The record identifies causes of conflict and the recommendations under consideration, but does not establish
      that integration would resolve grade, pay, or resource grievances. It also records concern that immigration could be
      swallowed and leaves uncertain whether integration's organizational effects would be even.
    handoff: The Secretary should decide the internal structure after consulting senior customs and immigration leadership
      and the General Counsel. The disagreement concerns the form of integration, while the Secretary has administrative authority
      over both services and interdepartmental policy guidance is routed through the Secretary.
    tempting_wrong:
      option: O3
      pull: It appears to offer compromise by combining selected functions while preserving separate administrations, addressing
        immigration's concern about being absorbed.
      why_wrong: A partial arrangement would combine some functions while leaving the services separately administered, preserving
        the underlying division associated with rivalry and booth-level clashes.
    rejected:
      O3: Combining selected functions while retaining separate administrations would leave the structural division in place,
        despite overlapping inspection responsibilities and the rivalry between the services.
      O1: Keeping the services separate would preserve the arrangement associated with rivalry and clashes despite their overlapping
        responsibilities.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that a unified service would intensify the risk of immigration being swallowed, while combining
        selected functions could resolve the coordination problem and preserve effective accountability.
      then: O3
      why: That would make the concern about integration's form more consequential and support a partial structure instead.
    - id: flip2
      if: The services' inspection responsibilities ceased to overlap and rivalry attributable to separate administration
        no longer impaired coordination.
      then: O1
      why: Without the structural coordination problem, the main reason for integration would be substantially reduced.
    would_not_change:
    - id: noflip1
      if: The grade and pay disparities were reduced but the services remained separately administered with overlapping responsibilities
        and booth-level rivalry.
      why: The record identifies compensation as one source of antagonism, but also identifies structural separation and organizational
        rivalry as central problems.
    watch_for:
    - id: watch1
      what: Whether a unified service establishes clear authority across both services while addressing immigration's concern
        about being swallowed.
      favors:
      - O2
      why: If integration does not provide balanced, workable authority, the concern about its form becomes more weighty.
  lesson: When separately administered services have overlapping responsibilities and persistent rivalry, address the structural
    source of the conflict rather than relying on coordination measures alone. Integration still requires attention to authority
    and balance, especially when one service fears being overwhelmed.
  limits: This reasoning applies to the organizational choice described here, not to the merits of any particular inspection
    decision. It does not establish that integration will resolve grade, pay, or resource disparities, or that integration
    is appropriate when responsibilities and authority are materially different.
