case:
  id: DR-XFER-CORPUS-CHURCH-NX-fdb75aa3-E8-A-flip1@v1
  title: 'Port-of-Entry Inspection Services: Separate Services or Integration'
  status: draft
  setting: Department of Border Administration, national ports of entry, 2008–2009
  decider: The Secretary
  agent: The Secretary
  agent_role: decide
  situation: Customs inspectors and immigration inspectors remain separately administered services, although both screen the
    same travelers and cargo at the nation's ports of entry. Their relationship is marked by organizational rivalry, and clashes
    occur at the inspection booths. Customs inspectors hold higher grades and receive better pay than their immigration counterparts,
    and this year customs surpassed immigration in personnel and budget allocation. The department's General Counsel and a
    management survey recommend a single border service, and the Secretary is weighing integration. Senior immigration officials
    favor placing customs functions under immigration control and fear that immigration could be swallowed by a unified service.
    Credible evidence indicates that a unified service would intensify that risk, while combining selected functions could
    resolve the coordination problem and preserve effective accountability. The Secretary has administrative authority over
    both services, while interdepartmental border policy guidance is routed through the Secretary.
  question: What should the Secretary do about the organizational relationship between customs and immigration inspection
    services?
  options:
    O1:
      do: The Secretary keeps customs and immigration inspection services fully separate.
      move: act
      irreversible: false
    O2:
      do: The Secretary integrates customs and immigration inspection services into one border service.
      move: act
      irreversible: false
    O3:
      do: The Secretary combines selected port inspection functions while retaining separate administrations.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Customs and immigration are separately administered services with overlapping responsibility for screening travelers
      and cargo at ports of entry.
  - id: F2
    kind: situation
    status: assessed
    fact: Organizational rivalry dominates relations between the services, and clashes occur at the inspection booths.
  - id: F3
    kind: situation
    status: confirmed
    fact: Differences in mission and compensation have been identified as sources of antagonism between the services.
  - id: F4
    kind: situation
    status: confirmed
    fact: Customs inspectors hold higher grades and receive better pay than their immigration counterparts.
  - id: F5
    kind: situation
    status: confirmed
    fact: This year, customs surpassed immigration in personnel and budget allocation.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Secretary has administrative authority over both services, and interdepartmental border policy guidance is routed
      through the Secretary.
  - id: F7
    kind: situation
    status: confirmed
    fact: The department's General Counsel and a management survey recommend creating a single border service.
  - id: F8
    kind: situation
    status: assessed
    fact: Senior immigration officials favor placing customs functions under immigration control and fear that immigration
      could be swallowed by a unified service.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Secretary is weighing an integrated structure, while senior immigration officials disagree about its form.
  - id: F10
    kind: situation
    status: assessed
    fact: Credible evidence indicates that a unified service would intensify the risk that immigration is swallowed, while
      combining selected functions could resolve the coordination problem and preserve effective accountability.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F10
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Separate administration of services with overlapping inspection responsibilities leaves rivalry, rather than interchange,
      dominant and produces clashes at the booths. F10 indicates that combining selected functions could resolve the coordination
      problem while preserving effective accountability, supporting a partial structure rather than full integration.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Differences in mission and compensation feed antagonism, and customs' greater grades, pay, personnel, and budget
      add to the imbalance. These conditions strengthen the case for addressing the relationship structurally, though the
      record does not establish that integration itself would resolve them.
  - id: C3
    facts:
    - F7
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The General Counsel and a management survey recommend a single service, and the Secretary is weighing integration.
      But those recommendations do not account for the credible evidence that a unified service would intensify the risk of
      immigration being swallowed, or that selected functions could address coordination while preserving accountability.
  - id: C4
    facts:
    - F8
    - F10
    equity: chain_of_command
    favors:
    - O3
    weight: strong
    why: Senior immigration officials fear being swallowed, and credible evidence indicates that a unified service would intensify
      that risk. Combining selected functions could address coordination while preserving effective accountability, making
      the concern about integration's form consequential and supporting O3.
  reasoning:
    read: 'The central problem is not simply friction between two services: overlapping inspection responsibilities are divided
      between separately administered organizations, and rivalry dominates their relationship. The trap is to treat pay and
      grade grievances as the whole problem, or to assume that a unified service is the only way to address coordination.
      The record indicates that combining selected functions could resolve the coordination problem while preserving accountability,
      whereas full integration would intensify the risk that immigration is swallowed.'
    weighing: 'The structural case for addressing coordination remains strong: separate administration accompanies clashes
      at the booths {C1}. But the credible evidence indicates that selected functions could resolve that problem while preserving
      effective accountability, whereas a unified service would intensify the risk that immigration is swallowed {C1} {C4}.
      The General Counsel and management survey recommend a single service, but their recommendation does not outweigh the
      specific evidence about the risks of that structure {C3}. Grade, pay, and resource disparities contribute to antagonism
      but do not establish that integration would cure it {C2}. The balance therefore favors O3: combine selected functions
      while retaining separate administrations.'
    tradecraft: Record the coordination problem, the competing views about the form of integration, and the reasons for choosing
      a partial structure. Define reporting and decision authority for the combined functions, consult senior leaders from
      both services and the General Counsel, and review whether the arrangement is reducing organizational rivalry while preserving
      effective accountability.
    uncertainty: The record identifies causes of conflict and the recommendations under consideration, and credible evidence
      indicates that a partial arrangement could resolve the coordination problem while preserving accountability. It does
      not establish that the arrangement would resolve grade, pay, or resource grievances, and the effects of combining selected
      functions remain uncertain.
    handoff: The Secretary should decide which functions to combine after consulting senior customs and immigration leadership
      and the General Counsel. The disagreement concerns the form of integration, while the Secretary has administrative authority
      over both services and interdepartmental policy guidance is routed through the Secretary.
    tempting_wrong:
      option: O2
      pull: It appears to answer the rivalry and coordination problems and follows the General Counsel's and management survey's
        recommendation for a single service.
      why_wrong: Credible evidence indicates that a unified service would intensify the risk of immigration being swallowed,
        while selected functions could resolve the coordination problem and preserve effective accountability.
    rejected:
      O1: Keeping the services fully separate would preserve the arrangement associated with rivalry and clashes despite their
        overlapping responsibilities.
      O2: A unified service is not the best fit because credible evidence indicates that it would intensify the risk of immigration
        being swallowed, while combining selected functions could address coordination and preserve accountability.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence did not show that a unified service would intensify the risk of immigration being swallowed, and
        that combining selected functions could resolve the coordination problem and preserve effective accountability.
      then: O2
      why: Without that evidence, the original structural case for a single service would again be decisive.
    would_not_change:
    - id: noflip1
      if: The grade and pay disparities were reduced but the services remained separately administered with overlapping responsibilities
        and booth-level rivalry.
      why: The record identifies compensation as one source of antagonism, but also identifies structural separation and organizational
        rivalry as central problems.
    watch_for:
    - id: watch1
      what: Whether a unified service establishes clear authority across both services while addressing immigration's concern
        about being swallowed.
      favors:
      - O2
      why: If integration does not intensify the risk of one service overwhelming the other and provides balanced, workable
        authority, the case for a unified structure becomes more weighty.
  lesson: When separately administered services have overlapping responsibilities and persistent rivalry, address the structural
    source of the conflict. A partial arrangement can be preferable to full integration when credible evidence indicates it
    can resolve coordination problems while preserving accountability and avoiding a heightened risk that one service is overwhelmed.
  limits: This reasoning applies to the organizational choice described here, not to the merits of any particular inspection
    decision. It does not establish that combining selected functions will resolve grade, pay, or resource disparities, or
    that a partial arrangement is appropriate when responsibilities and authority are materially different.
