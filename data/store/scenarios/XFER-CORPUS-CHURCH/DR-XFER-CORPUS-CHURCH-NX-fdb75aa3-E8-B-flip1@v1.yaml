case:
  id: DR-XFER-CORPUS-CHURCH-NX-fdb75aa3-E8-B-flip1@v1
  title: 'Defensive and Mission Cyber Teams: Separate Commands or Integration'
  status: draft
  setting: A national military service, 2024–2025
  decider: The Service Chief
  agent: The Service Chief
  agent_role: decide
  situation: The service's network-defense teams and mission cyber teams remain separately administered commands, although
    their responsibilities overlap on the same service networks. Their relationship is marked by organizational rivalry, with
    teams clashing over personnel and tools. Mission-team billets carry higher grades and special pay, and the mission command
    now has more personnel and budget than the defensive command. The service's General Counsel and an organizational study
    recommend creating a single cyber command, and the Service Chief is weighing that option. Senior defensive-team leaders
    favor placing mission functions under their command and fear being engulfed. A credible workload and command assessment
    finds that a unified command would materially increase the risk of the network-defense teams being overwhelmed, while
    combining selected functions could resolve the coordination problem and preserve effective accountability. The two kinds
    of team operate under distinct legal authorities that would remain separate even if their administrative organization
    changed.
  question: What should the Service Chief do about the organizational relationship between the network-defense teams and the
    mission cyber teams?
  options:
    O1:
      do: The Service Chief combines selected divisional functions while retaining separate administrations for the network-defense
        teams and mission cyber teams.
      move: partial
      irreversible: false
    O2:
      do: The Service Chief establishes a unified cyber command while keeping the distinct legal authorities for defensive
        and mission cyber activities separate.
      move: act
      irreversible: false
    O3:
      do: The Service Chief keeps the network-defense teams and mission cyber teams in independently administered commands.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The network-defense teams and mission cyber teams are separately administered commands with overlapping responsibilities
      for the same service networks.
  - id: F2
    kind: situation
    status: assessed
    fact: Rivalry dominates relations between the commands, and teams clash over personnel and tools.
  - id: F3
    kind: situation
    status: confirmed
    fact: Differences in mission, grades, and special pay have been identified as sources of antagonism between the commands.
  - id: F4
    kind: situation
    status: confirmed
    fact: Mission-team billets carry higher grades and special pay than corresponding network-defense billets.
  - id: F5
    kind: situation
    status: confirmed
    fact: The mission cyber command has more personnel and a larger budget than the network-defense command.
  - id: F6
    kind: authority
    status: confirmed
    fact: Applicable law and service directives assign distinct legal authorities to defensive and mission cyber activities;
      administrative reorganization does not consolidate those authorities.
  - id: F7
    kind: situation
    status: confirmed
    fact: The service's General Counsel and an organizational study recommend a single cyber command.
  - id: F8
    kind: situation
    status: assessed
    fact: Senior network-defense leaders favor placing mission functions under their command and fear that integration would
      leave the defensive teams overwhelmed.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Service Chief is weighing whether to establish an integrated cyber command.
  - id: F10
    kind: situation
    status: assessed
    fact: A credible workload and command assessment finds that a unified command would materially increase the risk that
      the network-defense teams would be overwhelmed, while combining selected functions could resolve the coordination problem
      and preserve effective accountability.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F10
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Separate administration of overlapping responsibilities leaves rivalry dominant and produces clashes at the team
      level. The assessment finds that combining selected functions can resolve the coordination problem without the materially
      increased risk associated with a unified command, supporting O1.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Differences in mission and compensation feed antagonism, while the mission command's higher grades, special pay,
      personnel, and budget add to the imbalance. These conditions strengthen the case for addressing the relationship structurally,
      though the record does not establish that integration itself would resolve them.
  - id: C3
    facts:
    - F7
    - F9
    - F10
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The General Counsel and an organizational study recommend a single command, and the Service Chief is weighing that
      option. But the credible assessment identifies a material risk in a unified structure and finds that selected-function
      integration can resolve the coordination problem, reducing the force of the recommendation for a single administration.
  - id: C4
    facts:
    - F8
    - F10
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: The network-defense leaders' concern about being overwhelmed is supported by a credible assessment finding materially
      increased risk under a unified command. The assessment finds that selected-function integration can preserve effective
      accountability, while distinct legal authorities must remain separate under any structure. These facts strongly favor
      O1's more limited integration.
  reasoning:
    read: 'The central problem is not simply friction between two teams: overlapping responsibilities are divided between
      separately administered commands, and rivalry dominates their relationship. The distinct legal authorities must remain
      separate, but they do not require separate administration. The choice is not limited to preserving the current separation
      or creating a single command: credible evidence indicates that combining selected functions can address the coordination
      problem while avoiding a material risk that the network-defense teams would be overwhelmed.'
    weighing: 'The structural case for addressing the coordination problem remains strong: separate administration accompanies
      persistent clashes, and selected-function integration is assessed as capable of resolving that problem {C1}. The General
      Counsel and organizational study recommend a single command, but the credible assessment of increased risk to the network-defense
      teams makes that recommendation less decisive here {C3} {C4}. Grade, pay, and resource disparities contribute to antagonism
      but do not establish that a unified command would cure them {C2}. Distinct legal authorities require separate approval
      lines, but they can be preserved under O1 as well as O2 {C4}. The balance therefore favors O1: it addresses coordination
      while avoiding the assessed risk of a unified command and preserving effective accountability.'
    tradecraft: Record the coordination problem, the competing views about the form of integration, and the assessment supporting
      selected-function integration. Define reporting, decision, and legal approval authority clearly, preserving the distinct
      authorities for defensive and mission cyber activities. Consult the affected senior commands and the General Counsel,
      and review whether the selected functions are reducing organizational rivalry while maintaining effective accountability.
    uncertainty: The record identifies sources of conflict and recommendations for integration, but does not establish that
      integration would resolve grade, pay, or resource grievances. The assessment identifies a material risk that a unified
      command would leave the network-defense teams overwhelmed and finds that selected-function integration could address
      coordination while preserving accountability. The legal authorities remain distinct regardless of administrative structure.
    handoff: The Service Chief should decide which functions to combine after consulting senior network-defense and mission
      cyber leadership and the General Counsel. The disagreement concerns the form of integration, while the legal authorities
      governing defensive and mission cyber activities must remain separate under any structure.
    tempting_wrong:
      option: O2
      pull: It appears to answer the structural coordination problem directly and follows the General Counsel's and organizational
        study's recommendation for a single command.
      why_wrong: The credible assessment finds that a unified command would materially increase the risk that the network-defense
        teams would be overwhelmed. It also finds that combining selected functions can resolve the coordination problem and
        preserve effective accountability, so a unified command is not necessary to address the central problem.
    rejected:
      O2: A unified command would materially increase the assessed risk that the network-defense teams would be overwhelmed,
        while selected-function integration can resolve the coordination problem and preserve effective accountability.
      O3: Keeping the commands separately administered without combining selected functions would leave the arrangement associated
        with rivalry and clashes in place, despite the assessment that selected-function integration can resolve the coordination
        problem.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence did not show that a unified command would materially increase the risk of the network-defense
        teams being overwhelmed, and did not show that combining selected functions could resolve the coordination problem
        while preserving effective accountability and the distinct legal authorities.
      then: O2
      why: Without the evidence favoring a limited structure, the structural case for a unified command and the recommendation
        for one would again carry greater weight.
    would_not_change:
    - id: noflip1
      if: The grade, pay, and resource disparities were reduced but the commands remained separately administered with overlapping
        responsibilities and team-level rivalry.
      why: The record identifies compensation and resources as sources of antagonism, but also identifies structural separation
        and organizational rivalry as central problems.
    watch_for:
    - id: watch1
      what: Whether selected-function integration establishes clear and balanced authority across the teams, preserves separate
        legal approval authorities, and addresses the network-defense leaders' concern about being overwhelmed.
      favors:
      - O1
      why: If the limited integration does not provide balanced, workable authority while maintaining the distinct legal boundaries,
        the case for the chosen structure weakens.
  lesson: When separately administered commands have overlapping responsibilities and persistent rivalry, address the structural
    source of the conflict rather than relying on coordination measures alone. Where credible evidence indicates that a unified
    command would materially increase the risk that one command is overwhelmed, selected-function integration may address
    coordination while preserving effective accountability. A unified administrative structure is not necessary to combine
    functions, and neither form of integration need combine distinct legal authorities.
  limits: This reasoning applies to the organizational choice described here, not to the merits of any particular cyber activity.
    It does not establish that integration will cure grade, pay, or resource disparities, or that integration is appropriate
    when responsibilities and authority are materially different.
