case:
  id: DR-CORPUS-NX-7de53e9d-E2@v1
  title: ABNER After the Partnership Ends
  status: draft
  setting: July 1949, Army Security Agency, after its partnership with the National Bureau of Standards ended.
  decider: The Army Security Agency
  agent: The Army Security Agency
  agent_role: decide
  situation: In August 1948, the Army Security Agency and the National Bureau of Standards agreed that the latter would design
    a computer for Army Security Agency engineers to build. The proposed computer was called ABNER. The National Bureau of
    Standards withdrew from the partnership in July 1949 to focus on completing its own computer. The Army Security Agency
    estimated that it could build ABNER in two years. Its programmers had experimented with several available computer designs
    and judged that they lacked flexibility needed for agency operations, including ABNER as then conceived. They also found
    that elementary instructions for typical cryptologic jobs resulted in excessive operating times.
  question: What should the Army Security Agency do about the ABNER effort after the National Bureau of Standards withdraws?
  options:
    O1:
      do: The Army Security Agency proceeds with building ABNER on its own.
      move: act
      irreversible: false
    O2:
      do: The Army Security Agency alters the ABNER effort and continues development.
      move: partial
      irreversible: false
    O3:
      do: The Army Security Agency halts its effort to build ABNER.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In August 1948, the National Bureau of Standards agreed to produce a computer design for Army Security Agency engineers
      to build.
  - id: F2
    kind: situation
    status: confirmed
    fact: The proposed Army Security Agency computer was called ABNER.
  - id: F3
    kind: situation
    status: confirmed
    fact: The National Bureau of Standards was designing and building a similar computer for itself.
  - id: F4
    kind: situation
    status: confirmed
    fact: In July 1949, the National Bureau of Standards left the partnership to focus on expediting completion of its own
      computer.
  - id: F5
    kind: capability
    status: assessed
    fact: The Army Security Agency estimated that it could build ABNER in two years.
  - id: F6
    kind: situation
    status: confirmed
    fact: Programmers had experimented with several available computer designs.
  - id: F7
    kind: capability
    status: assessed
    fact: Programmers judged that the available designs and ABNER as then conceived lacked flexibility needed for Army Security
      Agency operations.
  - id: F8
    kind: capability
    status: assessed
    fact: Elementary computer instructions for typical cryptologic jobs were resulting in excessive operating times.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    equity: mission_effect
    favors:
    - O1
    - O2
    weight: weak
    why: The NBS partnership ended, leaving ASA to decide whether to carry the ABNER effort forward itself or stop it. The
      passage records continuation as ASA’s course, but does not give a separate explanation of why continuation best served
      the mission.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: ASA estimated that it could build ABNER in two years. That assessed ability supports proceeding independently, though
      the passage does not establish that the estimate was certain.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Programmers’ experiments led them to judge that available designs, including ABNER as then conceived, lacked needed
      flexibility; elementary instructions also produced excessive operating times for typical cryptologic jobs. This weighs
      against proceeding without addressing the identified shortcomings.
  reasoning:
    read: The partnership’s end did not itself settle whether ASA should continue, alter, or stop ABNER. The central tension
      is between ASA’s estimate that it could build the computer in two years and programmers’ judgment that ABNER as then
      conceived did not meet operational needs.
    weighing: The source records ASA proceeding on its own, supported by its estimate that it could build ABNER in two years
      {C2}. The programmers’ flexibility and operating-time concerns point toward changing the effort {C3}; the passage does
      not explain how ASA resolved those concerns or say they were resolved. The stated outcome is therefore best understood
      as continuation despite those concerns, not as proof that the design was adequate.
    tradecraft: Record the two-year estimate as an assessment, not a guarantee, and document how the programmers’ stated operational
      requirements bear on the decision to proceed. Keep responsibility for the course of action with ASA and revisit it if
      the capability estimate or the assessment of requirements changes.
    uncertainty: The excerpt gives the outcome and the relevant assessments, but not a full justification for choosing independent
      construction over alteration or stopping. It also does not say whether, or how, ASA planned to address the programmers’
      concerns.
    handoff: ASA is the identified decision-maker. As a decision-practice matter, it should draw on the programmers’ and engineers’
      assessments because the recorded concerns concern agency operations and build capability; the excerpt identifies no
      outside approval authority.
    tempting_wrong:
      option: O3
      pull: Stopping avoids continuing with a design programmers judged insufficiently flexible and slow for typical work.
      why_wrong: The passage records ASA’s estimate that it could build ABNER in two years and its decision to proceed; it
        gives no finding that the shortcomings made the effort unworkable or that stopping was preferable.
    rejected:
      O2: Although the programmers’ concerns support considering alteration, the passage records ASA choosing to build ABNER
        on its own and does not state that it adopted an altered course.
      O3: ASA did not halt the effort; it chose independent construction and had estimated a two-year build.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: ASA established that ABNER as conceived could not meet the operational requirements and that a revised effort could
        address the gap.
      then: O2
      why: That would make alteration a better fit for the programmers’ stated concerns than proceeding with ABNER as conceived.
    - id: flip2
      if: ASA no longer had a credible basis for its estimate that it could build ABNER in two years.
      then: O3
      why: Without the capability assessment supporting independent construction, the principal stated support for proceeding
        would be weakened.
    would_not_change:
    - id: noflip1
      if: NBS’s withdrawal remained the only changed circumstance.
      why: The withdrawal created the decision point, but does not by itself resolve the balance between ASA’s build estimate
        and the programmers’ operational concerns.
    watch_for:
    - id: watch1
      what: Further assessment of whether the flexibility and operating-time concerns could be addressed while continuing
        the effort.
      favors:
      - O2
      why: A finding that the concerns require a changed effort would strengthen the case for alteration over proceeding unchanged.
  lesson: A partner’s withdrawal does not, by itself, require either abandonment or continuation. Weigh the responsible organization’s
    capability assessment against whether the proposed effort meets its stated operational needs, and make clear when the
    source records an outcome without explaining how a material concern was resolved.
  limits: This reasoning applies to the recorded choice about continuing ABNER after NBS withdrew; it does not establish that
    the project was ultimately successful or that its design met ASA’s needs. The excerpt supplies no binding legal rule or
    broader approval framework.
