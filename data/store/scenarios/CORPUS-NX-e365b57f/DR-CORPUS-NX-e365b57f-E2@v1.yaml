case:
  id: DR-CORPUS-NX-e365b57f-E2@v1
  title: 'Yemen: Control or Reserve'
  status: draft
  setting: Yemen, during a period of regime military weakness, amid AQAP leadership deliberations.
  decider: The AQAP leadership
  agent: The AQAP leadership
  agent_role: decide
  situation: The AQAP leadership was considering whether to pursue control of Yemen or avoid escalation and preserve Yemen
    as a reserve. It had sought guidance on fundamentally rethinking the purpose of an open al-Qaeda front in Yemen. The regime
    was militarily weak at the time. A senior al-Qaeda leader assessed that AQAP might be ousted by the United States if it
    seized control without being able to maintain it. The leader also assessed that losing control after rallying the population
    could cost AQAP future popular support. In the leader’s assessment, the United States would not accept AQAP’s military
    control of Yemen given the country’s geographic position in the Gulf.
  question: What should the AQAP leadership do about pursuing control of Yemen or preserving Yemen as a reserve?
  options:
    O1:
      do: The AQAP leadership should de-escalate its activity and preserve Yemen as a reserve.
      move: act
      irreversible: false
    O2:
      do: The AQAP leadership should escalate its pursuit of control over Yemen.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The Yemeni regime was militarily weak at the time.
  - id: F2
    kind: situation
    status: assessed
    fact: AQAP’s leadership had sought guidance on fundamentally rethinking the purpose of an open al-Qaeda front in Yemen.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A senior al-Qaeda leader assessed that regime weakness did not justify trying to overthrow the regime if AQAP could
      not ensure it could maintain control of Yemen.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The senior al-Qaeda leader assessed that the United States would have little trouble ousting AQAP from control of
      Yemen, citing its ability to topple the regimes in Iraq and Afghanistan.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The senior al-Qaeda leader assessed that the United States would not accept AQAP seizing military control of Yemen
      because of Yemen’s geographic position in the Gulf and its proximity to the world’s largest oil store.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The senior al-Qaeda leader assessed that if AQAP rallied the population to seize control and then lost it, the Yemeni
      population would not support AQAP a second time.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The senior al-Qaeda leader viewed AQAP’s regional leadership as operating in a way markedly different from his thinking
      about the organization’s presence in Yemen.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Regime weakness could make pursuing control appear timely, but the senior leader treated that opportunity as insufficient
      on its own.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The senior leader judged that AQAP should not try to take control unless it could maintain it, and assessed that
      the United States would have little trouble ousting AQAP and would not accept its control given Yemen’s geographic position.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The senior leader assessed that losing control after rallying the population would cost AQAP the population’s support
      for a later attempt.
  - id: C4
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The senior leader’s judgment was to preserve Yemen rather than risk losing control of it, treating it as a reserve
      rather than pursuing control during the regime’s weakness.
  reasoning:
    read: The trap is to treat the regime’s military weakness as a sufficient opportunity to seize control. The senior leader
      instead framed the decision around whether AQAP could hold control against likely U.S. opposition and retain the population’s
      support if control were lost.
    weighing: The temporary opening favors O2, but it is outweighed by the assessed risk that AQAP could not maintain control,
      would be ousted by the United States, and would lose the population’s support after a failed attempt. The senior leader
      therefore favored O1 and preserving Yemen as a reserve. The balance depends chiefly on whether the assessments of control,
      U.S. response, and future popular support are sound.
    tradecraft: Record the choice, the assumptions behind the assessments, and the reasons the apparent opportunity was judged
      insufficient. Keep the decision record at the level of the choice and its consequences.
    uncertainty: The decisive considerations are assessments rather than established outcomes. The source gives no independent
      basis for measuring the likelihood of U.S. intervention, AQAP’s ability to maintain control, or the population’s future
      response.
    handoff: The source presents the judgment as senior al-Qaeda leadership guidance to AQAP’s leadership. It identifies no
      separate approval authority or required review body.
    tempting_wrong:
      option: O2
      pull: The regime’s weakness may look like a rare opening to take control.
      why_wrong: That opportunity does not answer whether AQAP could hold control; the senior leader judged that an unsustainable
        seizure could lead to U.S. ouster and lasting loss of popular support.
    rejected:
      O2: The senior leader rejected pursuing control on the basis of regime weakness because the assessed risk of being ousted
        and losing future popular support outweighed the apparent opportunity.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible changed assessments showed AQAP could maintain control and the risks of U.S. ouster and loss of popular
        support were materially lower.
      then: O2
      why: Those changes would weaken the central reasons the senior leader gave for avoiding a bid for control.
    would_not_change:
    - id: noflip1
      if: The regime remained militarily weak while AQAP still could not ensure that it could maintain control.
      why: The senior leader expressly judged regime weakness insufficient justification for overthrowing the regime under
        that condition.
    watch_for:
    - id: watch1
      what: Whether AQAP could maintain control, whether the United States would oust it, and whether a failed attempt would
        cost future popular support.
      favors:
      - O1
      why: These are the assessments on which the senior leader’s recommendation turns.
  lesson: Do not treat an opponent’s weakness as sufficient reason to pursue control. Weigh whether control can be maintained
    and what a failed attempt would do to future support before choosing escalation over restraint.
  limits: This reasoning addresses the senior leader’s strategic judgment about control of Yemen, not the legality or ethics
    of AQAP’s broader aims or activities. It does not establish whether the assessments about U.S. action, control, or popular
    support were accurate.
