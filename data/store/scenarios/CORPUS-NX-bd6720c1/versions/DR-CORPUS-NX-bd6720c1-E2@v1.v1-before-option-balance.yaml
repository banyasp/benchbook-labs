case:
  id: DR-CORPUS-NX-bd6720c1-E2@v1
  title: Assurance or Deterrence in Eastern Europe
  status: draft
  setting: Warsaw, Poland, on the 25th anniversary of Freedom Day; U.S. national-security policy.
  decider: The President of the United States
  agent: The President of the United States
  agent_role: decide
  situation: The President faces a strategic choice between continuing an assurance posture and emphasizing deterrence through
    a more visible U.S. commitment. The United States has reaffirmed its commitment to NATO, Poland, and the Baltic States.
    The security of the United States and its allies and partners is a stated national interest, with NATO central to that
    interest. Collective defense and building partner capability and capacity are considerations in preventing conflict. Deterrence
    is described in terms of clear red lines, the capability to impose costs, and credible commitments.
  question: What should the President do about the U.S. strategic posture toward NATO, Poland, and the Baltic States?
  options:
    O1:
      do: The President decreases the visibility of the U.S. commitment to NATO, Poland, and the Baltic States.
      move: act
      irreversible: false
    O2:
      do: The President increases the visibility of the U.S. commitment to NATO, Poland, and the Baltic States.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The President reaffirmed the U.S. commitment to NATO, Poland, and each of the Baltic States.
  - id: F2
    kind: situation
    status: confirmed
    fact: The security of the United States and its allies and partners is a stated U.S. national interest, and NATO is central
      to it.
  - id: F3
    kind: authority
    status: confirmed
    fact: Collective defense is important under the Articles of NATO.
  - id: F4
    kind: capability
    status: assessed
    fact: Building partner capability and capacity within member states reduces or helps prevent conflict.
  - id: F5
    kind: capability
    status: assessed
    fact: Effective deterrence requires clarity about red lines that cannot be crossed.
  - id: F6
    kind: capability
    status: assessed
    fact: Effective deterrence requires the capability to respond so that the cost of aggression greatly exceeds its potential
      benefits.
  - id: F7
    kind: capability
    status: assessed
    fact: Effective deterrence requires credibility about the determination to fulfill U.S. commitments.
  - id: F8
    kind: capability
    status: assessed
    fact: Forward-deployed and rotational forces are described as demonstrating the capability and will to act if an actor
      threatens U.S. national interests, allies, or partners.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: partner_relationship
    favors:
    - O2
    weight: strong
    why: The security of the United States and its allies is a stated national interest, NATO is central to it, and collective
      defense is important under the NATO Articles. A more visible commitment reinforces the commitment to NATO, Poland, and
      the Baltic States.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Building partner capability and capacity within member states reduces or helps prevent conflict, supporting the security
      purpose of the policy.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Deterrence requires clear red lines, the capability to make aggression's costs exceed its benefits, and credibility
      about fulfilling commitments. A visible commitment can demonstrate the capability and will to act.
  reasoning:
    read: 'The choice is not simply between reassuring allies and making a symbolic gesture: the strategic shift is from assurance
      toward deterrence. The trap is treating visibility alone as sufficient; the rationale depends on clear red lines, adequate
      capability, and credible resolve.'
    weighing: The allied-security and collective-defense interests support {O2} {C1}; partner capability is also presented
      as helping prevent conflict {C2}. The deterrence rationale further favors {O2} because visible commitment can demonstrate
      capability and will, but only where clarity, capability, and credibility accompany it {C3}.
    tradecraft: State the commitment and the red lines it supports in clear policy terms; record how the posture is intended
      to support allied security, conflict prevention, and credible deterrence. Review whether the stated capability and resolve
      continue to support that rationale.
    uncertainty: The strategic rationale does not quantify the likelihood of conflict or compare the effects of the two postures.
    handoff: The President holds the decision. Consulting national-security policy and legal advisers, and coordinating with
      allies on the clarity of the commitment, would help ensure the posture remains credible and consistent with collective
      defense.
    tempting_wrong:
      option: O1
      pull: A less visible posture may seem sufficient if the commitment has already been publicly reaffirmed.
      why_wrong: That approach does not match the stated transition from assurance to deterrence or the emphasis on demonstrating
        the capability and will to fulfill commitments.
    rejected:
      O1: The recommended course moves beyond assurance toward a more visible commitment intended to make deterrence credible.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The more visible posture could not be matched by the capability and credible resolve needed to make aggression's
        costs exceed its benefits.
      then: O1
      why: The case for emphasizing deterrence depends on capability and credibility; if these were absent, the reason for
        increasing visibility would be undermined.
    would_not_change:
    - id: noflip1
      if: No actor had yet crossed a red line or directly threatened a NATO ally.
      why: Deterrence can demonstrate capability and will in anticipation of a threat, and partner capability is also linked
        to conflict prevention; an attack need not already have occurred for the rationale to apply.
    watch_for:
    - id: watch1
      what: Whether the commitment remains clear, backed by capability, and credible.
      favors:
      - O2
      why: These are the stated requirements for effective deterrence and the basis for treating visible commitment as meaningful.
  lesson: A public commitment can support deterrence when it is clear, backed by the capability to impose costs, and credible
    as a promise to act. Allied security and conflict prevention can therefore favor greater visibility, but visibility without
    those supporting conditions is not enough.
  limits: This reasoning concerns strategic posture, not operational design of deployments. It does not establish that visibility
    alone prevents conflict or that this posture is appropriate where the stated interests or deterrence conditions differ.
