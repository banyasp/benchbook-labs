case:
  id: DR-CORPUS-NX-a45a14f5-E2@v1
  title: Airstrikes in Response to ISIL’s Advance in Iraq
  status: draft
  setting: Iraq, during ISIL’s advance; the U.S. presidency
  decider: The President of the United States
  agent: The President of the United States
  agent_role: decide
  situation: ISIL had crossed from Syria into Iraq and taken important cities, including Mosul. It had overrun Iraqi army
    positions and massacred surrendered soldiers and civilians. ISIL had seized the Haditha Dam in western Iraq, which could
    be used as a weapon. ISIL fighters were also in close proximity to the U.S. consulate in Erbil. The decision concerned
    whether to use airstrikes amid the risks to the dam area and U.S. diplomats, with the stated aims of restoring Iraqi government
    control of the dam and pushing ISIL fighters back from Erbil.
  question: What should the President of the United States do about ISIL’s seizure of the Haditha Dam and proximity to the
    U.S. consulate in Erbil?
  options:
    O1:
      do: The President defers authorization of airstrikes against ISIL in Iraq.
      move: hold
      irreversible: false
    O2:
      do: The President authorizes airstrikes against ISIL in Iraq.
      move: act
      irreversible: true
    O3:
      do: The President declines to authorize airstrikes against ISIL in Iraq.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: ISIL was engaged in a civil war with the Syrian government.
  - id: F2
    kind: situation
    status: confirmed
    fact: ISIL crossed into Iraq and overtook important cities, including Mosul.
  - id: F3
    kind: situation
    status: confirmed
    fact: ISIL overran Iraqi army positions and massacred surrendered Iraqi soldiers and civilians by the thousands.
  - id: F4
    kind: situation
    status: confirmed
    fact: ISIL had taken the Haditha Dam in western Iraq.
  - id: F5
    kind: intelligence
    status: assessed
    fact: ISIL could use the Haditha Dam as a weapon.
  - id: F6
    kind: situation
    status: confirmed
    fact: ISIL was in close proximity to the U.S. consulate in Erbil.
  - id: F7
    kind: situation
    status: confirmed
    fact: The stated aims of airstrikes were to help the Iraqi government regain control of the dam, push ISIL fighters back
      from Erbil, and protect U.S. diplomats at the consulate.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: ISIL had seized the dam and could use it as a weapon; the stated purpose of striking included helping the Iraqi government
      regain control.
  - id: C2
    facts:
    - F6
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: ISIL fighters were close to the U.S. consulate, and pushing them back was intended to protect the U.S. diplomats
      there.
  - id: C3
    facts:
    - F2
    - F3
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: ISIL’s advance and its massacres of surrendered soldiers and civilians formed the grave security context for the
      decision, though the stated purposes for these strikes were the dam and the consulate.
  reasoning:
    read: 'This was a decision to respond to two specific risks during ISIL’s advance: its seizure of a dam it could use as
      a weapon and its proximity to the U.S. consulate. The trap is to treat the broader record of ISIL violence as if it
      alone supplied the stated rationale for these strikes; the source identifies restoring Iraqi control of the dam and
      protecting U.S. diplomats as the purposes.'
    weighing: 'The source’s stated reasons favor authorizing strikes: help the Iraqi government regain control of the potentially
      weaponized dam and push ISIL back from the consulate to protect U.S. diplomats. ISIL’s broader advance and massacres
      heighten the context but are not identified as the specific purposes of this action. The balance depends on the assessed
      dam danger and the threat to the diplomats.'
    tradecraft: As a decision-level practice, record the protective and dam-related purposes separately and keep the authorization
      bounded to those purposes; reassess if the threat or intended purpose changes. The source does not state the legal authority,
      the assessment process, or any operational conditions.
    uncertainty: The source gives no detail about the likelihood or scale of harm from the dam, the immediacy of danger to
      the diplomats, possible harms from strikes, or the legal basis for using force. The dam danger is expressed as a possibility.
    handoff: The President is the identified decision maker, and the Iraqi government is the stated partner whose control
      of the dam the strikes would help restore. The source does not describe a referral or consultation process.
    tempting_wrong:
      option: O1
      pull: Deferring could seem prudent given the potential risks surrounding the dam.
      why_wrong: It would delay the response despite the source’s stated concerns that ISIL could use the dam as a weapon
        and that U.S. diplomats were close to ISIL fighters.
    rejected:
      O1: Deferring was not the course taken; the President ordered strikes to address the stated dam and consulate risks.
      O3: Declining would leave the stated purposes of restoring Iraqi control of the dam and pushing ISIL back from the consulate
        unpursued.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessed risk that ISIL could use the dam as a weapon and the threat to the consulate were both no longer present.
      then: O1
      why: Without the specific risks given as reasons for action, deferring to reassess would be more consistent with the
        source’s stated rationale than authorizing strikes on that rationale.
    would_not_change:
    - id: noflip1
      if: ISIL’s broader advance and reported massacres were absent, but the dam and consulate risks remained as stated.
      why: The source gives the dam and protection of diplomats as the specific purposes for the strikes, so those reasons
        would remain.
    watch_for:
    - id: watch1
      what: Whether the assessed possibility that ISIL could use the dam as a weapon or the danger to the consulate changes.
      favors:
      - O2
      - O1
      why: Those are the stated grounds for action; a reduced or heightened threat could change the balance.
  lesson: When force is chosen to address a specific threat, state the protective purpose and the risk that makes action relevant.
    Do not let a grave broader context substitute for assessing whether those stated risks remain.
  limits: This reasoning applies to the source’s described decision and stated purposes only. It does not establish the legal
    authority for force, assess the conduct of strikes, or determine how any operation should be carried out.
