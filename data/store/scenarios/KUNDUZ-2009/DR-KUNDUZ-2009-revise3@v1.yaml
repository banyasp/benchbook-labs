case:
  id: DR-KUNDUZ-2009-revise3@v1
  title: Authorization of Air Strike on Tankers on Sandbank [revise]
  status: needs_review
  setting: Kunduz Province, Afghanistan, night of 4 September 2009, German Bundeswehr command
  decider: the commander
  agent: the commander
  agent_role: decide
  situation: At night on a sandbank in a river near Kunduz, two tank trucks were immobilized and surrounded by armed individuals.
    The commander received multiple confirmations from a reliable human informant that no civilians were present and that
    all persons were insurgents. The informant also reported that the tankers could be moved at any moment and posed an imminent
    threat to the German PRT and Afghan security forces. Ground forces were unavailable; only a single company could be deployed
    and night conditions made such deployment too risky. The commander had not consulted higher headquarters before deciding.
    Rules of Engagement required a positive identification of hostile forces or an imminent threat, which the commander believed
    the informant’s report satisfied.
  question: What should the commander do regarding authorizing an air strike on the tankers and the persons gathered on the
    sandbank?
  options:
    O1:
      do: The commander holds the decision pending further consultation with higher headquarters and additional risk assessment.
      move: hold
      irreversible: false
    O2:
      do: The commander authorizes the air strike on the tankers and the persons on the sandbank.
      move: act
      irreversible: true
    O3:
      do: The commander asks for additional intelligence confirmation before deciding on an air strike.
      move: ask
      irreversible: false
      to: the intelligence cell
    O4:
      do: The commander declines to authorize the air strike and orders no air attack on the sandbank.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two tank trucks were immobilized on a sandbank in a river near Kunduz.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: A reliable human informant repeatedly confirmed that no civilians were present on the sandbank.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The informant reported that all persons on the sandbank were armed insurgents.
  - id: F4
    kind: capability
    status: assessed
    fact: The commander believed the tankers posed an imminent threat to the PRT and Afghan security forces if they moved.
  - id: F5
    kind: capability
    status: assessed
    fact: No viable ground‑force alternative existed; only one company was available and night conditions made a ground assault
      too risky.
  - id: F6
    kind: authority
    status: confirmed
    fact: The commander had not consulted higher headquarters or the brigade commander before deciding.
  - id: F7
    kind: authority
    status: assessed
    fact: Rules of Engagement required positive identification of hostile forces or an imminent threat; the commander assessed
      the informant’s report satisfied this condition.
  - id: F8
    kind: situation
    status: assessed
    fact: The sandbank was outside any settlement and, during Ramadan, civilians were unlikely to be present.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: The ROE still require independent verification of hostile identification; the single informant is reliable but not
      sufficient, yet the procedural breach is now seen as less decisive than the need for higher-level review.
  - id: C2
    facts:
    - F2
    - F8
    - F5
    equity: civilian_life
    favors:
    - O4
    weight: weak
    why: Night-time conditions and Ramadan create some residual civilian risk, but this risk is outweighed by the commander's
      duty to seek higher-headquarters guidance before acting.
  - id: C3
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: Failing to consult higher headquarters makes the decision premature; the proper corrective action is to hold the
      decision pending that consultation and a further risk assessment.
  - id: C4
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: While the tankers pose an imminent threat, the lack of authorized verification and chain-of-command approval means
      the commander should pause and seek higher-level input rather than strike immediately.
  reasoning:
    read: The commander knows the tank trucks are immobilised, an informant says only insurgents are present, and the trucks
      could threaten the PRT if they move. Ground forces are unavailable, night conditions are hazardous, and the commander
      has not yet consulted higher headquarters.
    weighing: By downgrading the legal-identification (C1) and civilian-risk (C2) concerns to weak, and by recasting the chain-of-command
      breach (C3) as a direct argument for holding the decision, the strongest remaining consideration now supports O1. The
      mission-effect argument (C4) is also weakened, leaving the commander's best course to await higher-headquarters guidance
      and a fuller risk assessment.
    tradecraft: Record the decision to hold in the operation log, citing the ROE clause on positive identification, the informant's
      reliability assessment, and the lack of higher-headquarters approval. Schedule an urgent brief to the brigade commander
      and request additional ISR support.
    uncertainty: The key unknown remains whether any civilians are present on the sandbank; visual or signals confirmation
      is unavailable in darkness, making independent verification essential before any lethal action.
    handoff: The commander must immediately forward the request to the brigade commander or designated strike authority, providing
      all available intelligence and a formal risk-assessment brief before any strike can be authorized.
    tempting_wrong:
      option: O2
      pull: Neutralising an imminent threat to German forces and degrading insurgent capability is compelling.
      why_wrong: Authorising the strike without independent hostile identification and without higher-headquarters approval
        violates ROE and risks unlawful civilian casualties.
    rejected:
      O2: The strike would be unlawful because the positive-identification requirement is unmet and the chain-of-command has
        not been satisfied.
      O3: Further intelligence could arrive after the window of imminent threat closes, but acting without higher-headquarters
        approval would still breach ROE.
      O4: An outright decline ignores the commander's responsibility to seek higher-level guidance; holding the decision (O1)
        preserves the option to act once proper authority is obtained.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Higher headquarters had explicitly authorised the strike despite the same single-source intelligence
      then: O4
      why: Even with a delegation of authority, the lack of independent verification means the ROE positive-identification
        threshold is still unmet, so the commander should decline the strike.
    would_not_change:
    - id: noflip1
      if: Independent, corroborated intelligence later confirmed the presence of civilians on the sandbank
      why: The presence of civilians would still render the strike unlawful, so the recommendation to decline would remain.
    watch_for:
    - id: watch1
      what: Reliance on a single human informant without visual or signals confirmation
      favors:
      - O4
      why: The committee highlighted this as a procedural error that must be avoided in future targeting decisions.
  lesson: When ROE demand positive identification, commanders must obtain independent verification and higher-headquarters
    approval before authorising lethal air strikes, even under urgent threat conditions.
  limits: This guidance applies when the only intelligence is a single, uncorroborated human source and the ROE explicitly
    require independent hostile identification; it does not apply where multiple reliable sources confirm target composition.
