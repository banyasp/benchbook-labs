case:
  id: DR-KUNDUZ-2009-revise2@v1
  title: Accepting or Declining a Show of Force before Airstrike on Sandbank [revise]
  status: needs_review
  setting: Kunduz Provincial Reconstruction Team, Afghanistan, night of 4 September 2009, under ISAF command
  decider: the commander
  agent: the Commander
  agent_role: decide
  situation: Pilots repeatedly offered to conduct a low‑altitude overflight as a show of force to disperse people gathered
    on a sandbank where two fuel trucks and accompanying hostile individuals were located. The Joint Terminal Attack Controller
    had informed the pilots that the commander intended to destroy the fuel trucks. The commander believed that the aircraft
    already circling for hours were clearly audible to those on the sandbank and that the presence of the aircraft had not
    caused them to leave. Based on this assessment, the commander concluded that an additional show of force would not be
    effective. The commander ultimately declined the pilots' offer and proceeded with the planned strike. A HUMINT source
    on the sandbank was not warned before the strike.
  question: What should the commander do regarding the pilots' repeated offer of a show of force to disperse the people on
    the sandbank before the strike?
  options:
    O1:
      do: The Commander rejects the pilots' offer of a show of force and proceeds with the strike as planned.
      move: act
      irreversible: false
    O2:
      do: The Commander accepts the pilots' offer of a show of force to disperse the people on the sandbank before the strike.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Pilots repeatedly offered a show of force, a low‑altitude overflight, to disperse people on the sandbank.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The JTAC informed the pilots that the commander intended to destroy two fuel trucks on the sandbank.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The commander believed the aircraft circling the sandbank were clearly audible to the people there.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The commander concluded that a show of force would not cause the people to leave because they had remained despite
      hearing the aircraft.
  - id: F5
    kind: authority
    status: confirmed
    fact: The commander declined the pilots' offer of a show of force.
  - id: F6
    kind: situation
    status: confirmed
    fact: The planned strike targeted two fuel trucks and the Taliban personnel present on the sandbank.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The HUMINT informant on the sandbank was not warned before the bomb drop.
  - id: F8
    kind: authority
    status: confirmed
    fact: The decision-maker was the commander of the Provincial Reconstruction Team in Kunduz.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The aircraft circling for hours were audible and continuously present, which under IHL constitutes an effective warning;
      additional low-altitude overflight would not improve civilian safety.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The commander's assessment that civilians remained despite hearing the aircraft shows they have already been warned
      and are unlikely to be further deterred by another overflight.
  - id: C3
    facts:
    - F6
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: bar
    why: Legal analysis determines that the existing audible presence satisfies the ROE/LOAC precaution requirement; a further
      show of force would be redundant and could constitute an unnecessary escalation.
    rules_out:
    - O2
  - id: C4
    facts:
    - F1
    - F2
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: Pilots repeatedly offered the overflight, indicating it could be carried out safely without endangering own forces.
  - id: C5
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The HUMINT source on the sandbank was not warned, evidencing a failure to provide the required precaution.
  reasoning:
    read: The commander judged that the prolonged audible presence of circling aircraft already provided a sufficient warning
      to civilians on the sandbank.
    weighing: Re-evaluated considerations now treat the audible aircraft as an effective warning (C1) and deem any extra overflight
      unnecessary (C2). A bar consideration (C3) explicitly rules out the show-of-force option, leaving the rejection of the
      pilots' offer (O1) as the legally and operationally sound choice.
    tradecraft: The commander proceeds with the planned strike, records the decision in the mission log, and informs the JTAC
      and legal advisor that the warning requirement has been met.
    uncertainty: While it cannot be guaranteed that every civilian understood the warning, the law does not demand proof of
      behavioral change once an effective warning has been given.
    handoff: Responsibility remains with the commander, but coordination with the JTAC and a legal officer is documented to
      ensure compliance.
    tempting_wrong:
      option: O2
      pull: Desire to add an extra precaution to protect civilians.
      why_wrong: The additional overflight offers no legal benefit, adds risk to aircraft, and delays the mission without
        improving civilian safety.
    rejected:
      O2: Accepting the show of force is unnecessary because the audible aircraft already satisfy the required warning; it
        also creates an avoidable risk and could be viewed as a disproportionate action.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: If post‑strike intelligence indicated that civilians remained unharmed but expressed confusion about the warning,
      then: O2
      why: A commander might reconsider the overflight to clarify the warning and reduce future ambiguity.
    would_not_change:
    - id: noflip1
      if: Even under extreme time pressure,
      why: The legal duty to provide an effective warning remains unchanged.
    watch_for:
    - id: watch1
      what: Future assessments of civilian response to audible aircraft
      favors:
      - O2
      why: If civilians consistently ignore audible aircraft, the need for a show of force becomes even stronger.
  lesson: When aircraft have been audible and continuously present for an extended period, that may satisfy the legal requirement
    for an effective warning, making additional low-altitude overflights unnecessary.
  limits: Applies when audible aircraft are clearly observable by the civilian population and no other feasible, lower-risk
    warning measures are available; does not replace the need for positive identification of combatants.
