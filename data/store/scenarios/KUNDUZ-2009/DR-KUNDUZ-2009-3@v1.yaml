case:
  id: DR-KUNDUZ-2009-3@v1
  title: Decision on Conducting a Show of Force Before Airstrike
  status: draft
  setting: Kunduz, Afghanistan, night of 4 September 2009, Provincial Reconstruction Team operation
  decider: the commander of the PRT Kunduz
  agent: the commander of the PRT Kunduz
  agent_role: decide
  situation: Pilots of F‑15 aircraft repeatedly offered to fly a low‑altitude show of force over a sandbank where civilians
    were present before a planned strike on two fuel trucks. The joint terminal attack controller had informed the pilots
    of the commander’s intent to destroy the trucks. The commander observed that the aircraft had been circling the sandbank
    for hours and were audible to troops and the local population from six kilometres away. Witnesses reported that insurgents
    on the sandbank heard the aircraft but did not disperse. The commander believed that an additional show of force would
    not cause the insurgents to leave and therefore would not add effective warning. He possessed the authority to approve
    or reject such a demonstration.
  question: What should the commander do regarding the pilots' repeated offer to conduct a show of force before the strike?
  options:
    O1:
      do: The commander declines to authorize a show of force and proceeds with the strike as planned.
      move: act
      irreversible: true
    O2:
      do: The commander authorizes the pilots to conduct a low‑altitude show of force over the sandbank before the strike.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Pilots repeatedly asked whether they should conduct a low‑altitude show of force over the sandbank.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The JTAC informed the pilots of the commander’s intent to strike two fuel trucks.
  - id: F3
    kind: situation
    status: confirmed
    fact: The commander declined the pilots’ offer to conduct a show of force.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: Aircraft had been circling the sandbank for hours and were audible to troops and civilians from six kilometres away.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: Insurgents on the sandbank heard the aircraft but did not disperse.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The commander assessed that a show of force would be ineffective in dispersing the insurgents.
  - id: F7
    kind: authority
    status: confirmed
    fact: The commander had authority to approve or reject a show of force as part of the operation.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The commander judged that the aircraft were already audible to the insurgents and civilians, and that previous exposure
      had not caused them to disperse, so an additional low‑altitude pass would not provide effective warning.
  - id: C2
    facts:
    - F4
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Audible presence of the aircraft satisfied the precautionary requirement to give warning; further action was unnecessary.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The commander possessed the delegated authority to approve or reject a show of force and exercised it in accordance
      with his assessment.
  - id: C4
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Proceeding with the strike on the fuel trucks was essential to the mission; delaying for an ineffective show would
      not improve the outcome.
  - id: C5
    facts:
    - F5
    - F6
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: Authorizing a show of force that was unlikely to disperse the insurgents could be seen as unnecessary intimidation
      and increase the risk of civilian harm without benefit.
  reasoning:
    read: The commander faced a request from pilots to perform a low‑altitude show of force over a sandbank where civilians
      and insurgents were present before a strike on fuel trucks. He observed that the aircraft had been circling for hours,
      were audible from six kilometres, and that insurgents had not left despite hearing them, leading him to conclude that
      an additional pass would not add effective warning.
    weighing: The source’s own reasoning balances the need for effective warning (C1, C2) against the lack of observed effect
      (C5) and the authority to decide (C3). While mission success (C4) favours proceeding, the decisive factor was the assessment
      that a show of force would be ineffective, making O1 the preferred choice.
    tradecraft: Document the commander’s decision in the operation log, note the factual basis (audibility, lack of dispersal),
      and record that the show of force was declined per Oberst Klein’s assessment.
    uncertainty: Limited intelligence on civilian perception beyond audible noise; uncertainty remains about whether a different
      type of warning could have succeeded.
    handoff: The decision was made solely by the commander of the PRT Kunduz; no higher authority needed to be consulted because
      the authority to approve a show of force rested with him.
    tempting_wrong:
      option: O2
      pull: Desire to provide an additional, visible warning to civilians before the strike.
      why_wrong: The source concluded that the extra low‑altitude pass would not cause the insurgents to leave and would therefore
        not improve civilian protection, while adding risk and consuming resources.
    rejected:
      O2: The commander judged that the aircraft were already audible and that insurgents had not dispersed, so a further
        show of force would be ineffective and unnecessary.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The aircraft had not been audible to the insurgents and civilians, or intelligence indicated that a low‑altitude
        pass would likely cause dispersal.
      then: O2
      why: Without prior audible warning, a show of force could provide the necessary effective warning to reduce civilian
        risk.
    would_not_change:
    - id: noflip1
      if: Time pressure increased and the strike needed to be executed immediately.
      why: Even under time pressure, the commander still judged the show of force ineffective, so the decision to decline
        remains.
    watch_for:
    - id: watch1
      what: New intelligence showing that civilians on the sandbank were unaware of the aircraft presence.
      favors:
      - O2
      why: If civilians were not aware, an additional visual warning could be justified.
  lesson: When forces are already audible and have not caused the target population to disperse, an additional low‑altitude
    show of force is unlikely to add effective warning and can be omitted.
  limits: This rule applies only where audible presence has been confirmed and there is evidence that prior exposure did not
    influence behaviour; it does not apply when civilians are unaware of the aircraft or when the threat level demands a demonstrable
    deterrent.
  library:
    domain: military-operational
    family: KUNDUZ-2009
    source: https://dserver.bundestag.de/btd/17/074/1707400.pdf
    episode_focus: Whether the commander should accept the pilots' repeated offer of a show of force to disperse the people
      on the sandbank before the strike, or decline it and proceed, given his view that the aircraft overhead were already
      audible and the duty to give effective warning where civilians may be affected.
    cues:
      option_words:
        O1: 16
        O2: 18
      real_option: O1
      real_to_mean_other_length: 0.89
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: true
verdict_tier: source-endorsed
basis: Oberst Klein declined the pilots' offer for a show of force, stating that the aircraft were already audible and that
  an additional low‑altitude pass would not cause the insurgents to leave.
