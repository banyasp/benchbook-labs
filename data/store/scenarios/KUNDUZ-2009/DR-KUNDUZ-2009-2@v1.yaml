case:
  id: DR-KUNDUZ-2009-2@v1
  title: Authorization of Air Strike on Tankers on Sandbank
  status: draft
  setting: Kunduz Province, Afghanistan, night of 4 September 2009, German Bundeswehr command
  decider: the commander
  agent: the commander
  agent_role: decide
  situation: At night on a sandbank in a river near Kunduz, two tank trucks were immobilized and surrounded by armed individuals.
    The commander received multiple confirmations from a reliable human informant that no civilians were present and that
    all persons were insurgents. The informant also reported that the tankers could be moved at any moment and posed an imminent
    threat to the German PRT and Afghan security forces. Ground forces were unavailable; only a single company could be deployed
    and night conditions made such deployment too risky. The commander had not consulted higher headquarters before deciding.
    Rules of Engagement required a positive identification of hostile forces or an imminent threat, which the commander believed
    the informant’s report satisfied.
  question: What should the commander do regarding authorizing an air strike on the tankers and the persons gathered on the
    sandbank?
  options:
    O1:
      do: The commander holds the decision pending further consultation with higher headquarters and additional risk assessment.
      move: hold
      irreversible: false
    O2:
      do: The commander authorizes the air strike on the tankers and the persons on the sandbank.
      move: act
      irreversible: true
    O3:
      do: The commander asks for additional intelligence confirmation before deciding on an air strike.
      move: ask
      irreversible: false
      to: the intelligence cell
    O4:
      do: The commander declines to authorize the air strike and orders no air attack on the sandbank.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two tank trucks were immobilized on a sandbank in a river near Kunduz.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: A reliable human informant repeatedly confirmed that no civilians were present on the sandbank.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The informant reported that all persons on the sandbank were armed insurgents.
  - id: F4
    kind: capability
    status: assessed
    fact: The commander believed the tankers posed an imminent threat to the PRT and Afghan security forces if they moved.
  - id: F5
    kind: capability
    status: assessed
    fact: No viable ground‑force alternative existed; only one company was available and night conditions made a ground assault
      too risky.
  - id: F6
    kind: authority
    status: confirmed
    fact: The commander had not consulted higher headquarters or the brigade commander before deciding.
  - id: F7
    kind: authority
    status: assessed
    fact: Rules of Engagement required positive identification of hostile forces or an imminent threat; the commander assessed
      the informant’s report satisfied this condition.
  - id: F8
    kind: situation
    status: assessed
    fact: The sandbank was outside any settlement and, during Ramadan, civilians were unlikely to be present.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The Rules of Engagement required a positive identification of hostile forces or an imminent threat; relying solely
      on a single human informant without independent verification does not satisfy this legal threshold.
  - id: C2
    facts:
    - F2
    - F8
    - F5
    equity: civilian_life
    favors:
    - O4
    weight: strong
    why: Even though the informant said no civilians were present, the uncertainty about civilian presence on the sandbank
      (night, Ramadan) created a substantial risk of unlawful civilian casualties.
  - id: C3
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O4
    weight: strong
    why: The commander did not consult higher headquarters, violating the established chain of command and the oversight obligations
      of the Bundeswehr.
  - id: C4
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The tankers posed an imminent threat to the PRT, and ground forces were unavailable; however, the procedural deficiencies
      outweighed the perceived mission benefit.
  reasoning:
    read: 'The commander faced an urgent‑threat picture: immobilised tankers on a sandbank, armed men around them, and a belief—based
      on a single informant—that only insurgents were present. The trap was to treat that single, uncorroborated report as
      sufficient for a lethal air strike, ignoring the legal requirement for positive identification and the need for higher‑level
      validation.'
    weighing: The Bundestag Untersuchungsausschuss weighed the strong considerations C1, C2 and C3 against the weaker mission‑effect
      argument C4. It concluded that the procedural breaches (lack of independent verification, failure to consult the chain
      of command, and the residual risk to civilians) outweighed the perceived tactical advantage, leading to a recommendation
      to decline the strike.
    tradecraft: The decision should be recorded in the operation log, citing the specific ROE clause, the informant’s reliability
      assessment, and the failure to obtain higher‑headquarters approval. A formal after‑action report must be filed with
      the oversight committee.
    uncertainty: The principal uncertainty lay in the true composition of the crowd on the sandbank; the informant’s report
      could not be independently confirmed, and night‑time conditions limited visual verification.
    handoff: The commander should have escalated the decision to the brigade commander or the designated strike authority
      before authorising any lethal air action, as required by the chain‑of‑command provisions.
    tempting_wrong:
      option: O2
      pull: The desire to neutralise an imminent threat to German forces and to degrade Taliban capability was strong.
      why_wrong: Authorising the strike without independent confirmation and without higher‑level approval violated ROE, risked
        civilian casualties, and constituted a procedural error.
    rejected:
      O1: Holding the decision pending would not have resolved the immediate threat and still left the commander without the
        required authority.
      O2: Authorising the air strike ignored the legal requirement for positive identification and the need for higher‑command
        validation.
      O3: Requesting additional intelligence would have delayed action beyond the window of imminent threat, but the procedural
        breach of acting without that confirmation made the strike unlawful.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Higher headquarters had explicitly authorised the strike despite the same single‑source intelligence
      then: O2
      why: With a lawful delegation from the chain of command, the ROE requirement for authority would be satisfied, making
        the strike permissible under the committee’s own assessment of the threat.
    would_not_change:
    - id: noflip1
      if: Independent, corroborated intelligence later confirmed the presence of civilians on the sandbank
      why: The presence of civilians would still render the strike unlawful, so the recommendation to decline would remain.
    watch_for:
    - id: watch1
      what: Reliance on a single human informant without visual or signals confirmation
      favors:
      - O4
      why: The committee highlighted this as a procedural error that must be avoided in future targeting decisions.
  lesson: Commanders must obtain independent verification of civilian absence and secure higher‑level approval before authorising
    lethal air strikes when ROE demand positive identification. Procedural compliance outweighs tactical expediency.
  limits: This rule applies when the only available intelligence is a single, uncorroborated human source and the ROE explicitly
    require positive identification; it does not apply where multiple reliable sources confirm the target composition.
