case:
  id: DR-KUNDUZ-2009-restyle1@v1
  title: Declaration of Troops‑in‑Contact Based on Imminent Threat [restyle]
  status: needs_review
  setting: Kunduz Provincial Reconstruction Unit, Afghanistan, during the night of 3–4 September 2009, operating under ISAF
    authority
  decider: the officer commanding the Provincial Reconstruction Unit
  agent: the unit commander
  agent_role: decide
  situation: During the night, the joint terminal attack controller (JTAC) submitted a request for close air support to protect
    the reconstruction element. The Air Support Operations Center (ASOC) replied that such support would be authorized only
    if a troops-in-contact (TIC) status were reported on the basis of an imminent threat. At that moment no coalition personnel
    were engaged with hostile forces on the sandbank, although a sizable insurgent contingent and several fuel tankers were
    positioned a few kilometres away, creating a perceived imminent danger. The commander judged that without a TIC report
    the ASOC would refuse the request, thereby jeopardizing his personnel and Afghan partners. ISAF rules of engagement allowed
    a TIC designation for forces actually in contact or for an imminent threat, but the guidance was open to interpretation.
    The commander faced acute time pressure and a limited pool of air assets.
  question: What action should the commander take concerning the declaration of a troops-in-contact status?
  options:
    O1:
      do: The commander postpones the decision pending additional intelligence.
      move: hold
      irreversible: false
    O2:
      do: The commander proceeds to declare a troops-in-contact status.
      move: act
      irreversible: true
    O3:
      do: The commander seeks clarification from higher headquarters.
      move: ask
      irreversible: false
      to: higher headquarters
    O4:
      do: The commander refrains from declaring a troops-in-contact status.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The joint terminal attack controller submitted a request for close air support to protect the reconstruction element.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Air Support Operations Center indicated that close air support would be released only if a troops-in-contact
      condition were reported because of an imminent threat.
  - id: F3
    kind: authority
    status: confirmed
    fact: The commander instructed the joint terminal attack controller to report a troops-in-contact condition based on the
      perceived imminent threat.
  - id: F4
    kind: situation
    status: confirmed
    fact: No coalition personnel were physically engaged with the enemy on the sandbank at that time.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A sizable group of armed insurgents and several fuel tankers were located a few kilometres from the reconstruction
      element, constituting a tangible threat.
  - id: F6
    kind: capability
    status: assessed
    fact: The commander assessed that, absent a troops-in-contact report, the ASOC would deny air support, endangering his
      forces and the Afghan security contingent.
  - id: F7
    kind: authority
    status: assessed
    fact: ISAF rules of engagement authorized a troops-in-contact designation for forces in direct contact or for an imminent
      threat, though the interpretation remained ambiguous.
  - id: F8
    kind: situation
    status: assessed
    fact: The commander operated under severe time constraints and with a limited number of available air assets.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: bar
    why: ISAF rules of engagement authorize a TIC only when forces are in contact or when an imminent threat is evident, but
      the source judged the guidance ambiguous and concluded the commander's interpretation deviated from the official directive.
    rules_out:
    - O2
  - id: C2
    facts:
    - F4
    equity: chain_of_command
    favors:
    - O4
    weight: strong
    why: Because no coalition forces were physically engaged with the enemy, the factual prerequisite for a TIC was not met.
  - id: C3
    facts:
    - F5
    - F6
    equity: complicity_risk
    favors:
    - O4
    weight: strong
    why: Issuing a TIC without actual contact would have enabled air strikes that could breach the law of armed conflict and
      cause unlawful civilian casualties.
  - id: C4
    facts:
    - F8
    equity: tempo
    favors:
    - O4
    weight: weak
    why: Although the commander faced pressing time constraints, the obligation to adhere to the ROE supersedes the desire
      for rapid action.
  reasoning:
    read: The scenario illustrates a classic conflation of an "imminent threat" with a "troops-in-contact" (TIC) status. The
      ASOC would release air assets only upon a TIC report, yet no coalition forces were actually engaged on the sandbank.
    weighing: The analysis weighs the strong considerations that the factual condition for a TIC was absent (C2) and that
      the ROE would be violated (C1, C3) against the weaker pressure of time (C4). It determines that the commander should
      refrain from a false TIC declaration, even at the cost of potentially losing air support.
    tradecraft: The commander documents the decision to withhold the TIC, records the rationale, and forwards the report to
      the ASOC and higher headquarters, ensuring traceability and compliance with oversight protocols.
    uncertainty: Intelligence on the insurgent force was limited, but the absence of any coalition troops in contact eliminated
      the core factual element required for a legitimate TIC.
    handoff: The authority to decide rests with the PRT commander; higher-headquarters clarification was unnecessary because
      the ROE explicitly prohibit fabricating a TIC.
    tempting_wrong:
      option: O2
      pull: The urge to secure close air support to safeguard personnel and Afghan partners.
      why_wrong: Falsifying a TIC breaches ISAF rules of engagement and introduces unlawful risk to civilians and mission
        legitimacy.
    rejected:
      O1: Delaying for additional intelligence would not alter the factual lack of contact and would postpone needed protection.
      O2: Reporting a TIC without actual contact contravenes the ROE and the source's legal assessment.
      O3: Requesting clarification from higher headquarters would not change the rule that a TIC requires genuine contact;
        even with clarification the commander should not fabricate the status.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Coalition troops of the PRT were engaged in direct fire with the enemy on the sandbank.
      then: O2
      why: The factual condition for a TIC would be satisfied, meeting the ROE.
    would_not_change:
    - id: noflip1
      if: The commander remained under time pressure but still lacked any troops-in-contact.
      why: Time pressure does not override the legal requirement for a genuine TIC.
    watch_for:
    - id: watch1
      what: An official clarification from ISAF higher headquarters stating that an imminent threat alone fulfills the TIC
        definition.
      favors:
      - O2
      why: Such clarification would eliminate the ambiguity identified by the source.
  lesson: Commanders must adhere strictly to the defined conditions of a troops-in-contact declaration; ambiguous interpretations
    do not justify fabricating status to obtain air support. Legal authority and factual reality take precedence over operational
    urgency.
  limits: This principle applies only where the rules of engagement explicitly tie a TIC to actual contact or a clearly defined
    imminent threat, and does not extend to situations where the ROE are silent or permit broader threat-based authorizations.
