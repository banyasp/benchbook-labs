case:
  id: DR-KUNDUZ-2009-flip2@v1
  title: Accepting or Declining a Show of Force before Airstrike on Sandbank [flip]
  status: needs_review
  setting: Kunduz Provincial Reconstruction Team, Afghanistan, evening of 4 September 2009, operating under ISAF authority
  decider: the unit commander
  agent: Commander of the PRC
  agent_role: decide
  situation: The flight crew repeatedly volunteered to fly a low-altitude pass as a show of force to scatter the people gathered
    on a sandbank where two fuel trucks and hostile combatants were positioned. The Joint Terminal Attack Controller had briefed
    the pilots that the commander intended to destroy the fuel trucks. The commander assessed, based on {F3} and the newly-fixed
    observation {F4}, that the audible circling aircraft had already caused the crowd to leave the area. Consequently, the
    commander judged an additional overflight unnecessary and declined the pilots' offer, moving forward with the strike as
    scheduled. No advance warning was given to the HUMINT source located on the sandbank.
  question: Should the commander accept the pilots' repeated offer to conduct a low-altitude show of force before the strike?
  options:
    O1:
      do: Reject the pilots' offer and proceed with the planned airstrike without an additional overflight.
      move: act
      irreversible: false
    O2:
      do: Accept the pilots' offer and conduct an overflight to ensure civilians have left before the strike.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The aircrew repeatedly volunteered to fly a low-level pass as a deterrent demonstration to scatter the individuals
      gathered on the sandbank.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The Joint Terminal Attack Controller briefed the pilots that the commander's intent was to eliminate the two fuel
      trucks positioned on the sandbank.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The commander was of the view that the aircraft orbiting the sandbank could be heard clearly by those present.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The commander assessed that the crowd had withdrawn from the sandbank once the aircraft passed overhead, indicating
      the audible fly‑by had already prompted them to leave.
  - id: F5
    kind: authority
    status: confirmed
    fact: Consequently, the commander turned down the pilots' proposal for a show of force.
  - id: F6
    kind: situation
    status: confirmed
    fact: The intended airstrike was aimed at the pair of fuel trucks and the Taliban fighters located on the sandbank.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The human-source embedded on the sandbank received no advance warning before the munition release.
  - id: F8
    kind: authority
    status: confirmed
    fact: The authority making the decision was the commander of the Kunduz Provincial Reconstruction Team.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: International humanitarian law demands an effective warning; the audible aircraft already caused the civilians to
      disperse, satisfying the warning requirement.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The commander's own assessment shows that the audible fly-by achieved the intended warning effect, so an additional
      low-altitude pass would be redundant.
  - id: C3
    facts:
    - F6
    - F2
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: ROE/LOAC require feasible precautions; when the precaution (audible aircraft) has already been effective, further
      action is unnecessary.
  - id: C4
    facts:
    - F1
    - F2
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: While pilots can safely conduct the overflight, repeating the maneuver offers no additional safety benefit and could
      expose the aircraft to unnecessary risk.
  - id: C5
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The HUMINT source was not warned, but with the civilian crowd already gone the lack of warning does not create a
      heightened risk of civilian harm.
  reasoning:
    read: The commander judged that the audible circling aircraft had already prompted the sandbank crowd to leave, making
      an extra low-altitude pass unnecessary. The error would be to assume that any additional show of force is automatically
      required.
    weighing: A review of the legal and operational factors (C1-C3) shows that the warning already achieved its purpose, that
      further action would not improve civilian protection, and that the ROE's precautionary requirement is satisfied. The
      balance therefore supports rejecting the pilots' offer ({O1}).
    tradecraft: The commander should confirm the crowd's absence, document the decision in the mission log, and proceed with
      the strike while maintaining communication with the JTAC and legal adviser.
    uncertainty: Although the exact number of remaining persons cannot be verified, the evidence that the audible fly-by caused
      dispersal removes the legal necessity for an additional overflight.
    handoff: Final authority remains with the commander, but coordination with the JTAC and a legal officer is advised to
      ensure compliance with ROE.
    tempting_wrong:
      option: O2
      pull: Desire to guarantee that no civilians remain by performing an extra overflight.
      why_wrong: The extra maneuver adds risk to the aircraft and offers no legal benefit because the warning requirement
        has already been met.
    rejected:
      O2: Accepting the overflight rests on a mistaken belief that the audible aircraft did not warn civilians; the commander's
        assessment proves otherwise.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: If credible intelligence indicated that the sandbank crowd had NOT dispersed after hearing the circling aircraft,
      then: O2
      why: An additional low-altitude overflight would become a necessary precaution to provide an effective warning.
    would_not_change:
    - id: noflip1
      if: Even under extreme time pressure,
      why: The legal duty to give an effective warning remains unchanged.
    watch_for:
    - id: watch1
      what: Future assessments of civilian response to audible aircraft
      favors:
      - O2
      why: If civilians consistently ignore audible fly-bys, the need for a show of force becomes stronger.
  lesson: When audible aircraft successfully cause civilians to disperse, the legal requirement for an effective warning is
    satisfied and additional low-risk show-of-force actions are unnecessary.
  limits: This principle applies only when there is credible evidence that civilians have already responded to the audible
    warning and when a feasible, low-risk additional precaution is not required. It does not replace the obligation to positively
    identify combatants before striking.
