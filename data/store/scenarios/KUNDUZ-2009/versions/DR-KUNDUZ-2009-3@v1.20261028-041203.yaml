case:
  id: DR-KUNDUZ-2009-3@v1
  title: Decision on Accepting a Show of Force Before Airstrike
  status: draft
  setting: Kunduz, Afghanistan, night of 4 September 2009, Provincial Reconstruction Team operation
  decider: Commander of the Provincial Reconstruction Team (PRT) Kunduz
  agent: Commander of the Provincial Reconstruction Team (PRT) Kunduz
  agent_role: decide
  situation: At the decision point, pilots of the supporting aircraft repeatedly offered to conduct a low overflight, described
    as a "show of force," intended to disperse the civilian crowd gathered on a sandbank before a planned strike on two fuel
    tank trucks and nearby Taliban fighters. The aircraft had been circling the sandbank for about two hours and were audible
    to ground personnel at a distance of six kilometres. Observers reported that the people on the sandbank heard the aircraft,
    some temporarily left, returned, and additional individuals arrived later, indicating that the audible presence had not
    caused permanent dispersion. The commander believed that because the aircraft were already audible and the crowd remained,
    a show of force would not be effective. The commander possessed the authority to approve or reject such air‑support actions.
  question: What should the commander do regarding the pilots' repeated offer of a show of force to disperse the people on
    the sandbank before the strike?
  options:
    O1:
      do: The commander asks the JTAC for additional intelligence on civilian presence before deciding on the show of force.
      move: ask
      irreversible: false
      to: JTAC
    O2:
      do: The commander partially authorizes a limited show of force over only part of the sandbank before the strike.
      move: partial
      irreversible: true
      to: pilots
    O3:
      do: The commander authorizes the pilots to conduct a low overflight show of force to disperse the people before the
        strike.
      move: act
      irreversible: true
    O4:
      do: The commander declines the pilots' offer of a show of force and proceeds with the strike as planned.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Pilots repeatedly offered a low overflight ('show of force') to disperse people on the sandbank before the strike.
  - id: F2
    kind: authority
    status: confirmed
    fact: The commander of the PRT declined the pilots' offer of a show of force.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Aircraft had been circling over the sandbank for two hours and were audible to ground personnel at a distance of
      six kilometres.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: People on the sandbank heard the aircraft but did not permanently disperse; some left temporarily, returned, and
      additional people arrived later.
  - id: F5
    kind: situation
    status: confirmed
    fact: The strike target comprised two fuel tank trucks and Taliban fighters present around them, considered an immediate
      threat.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The commander assessed that because the aircraft were already audible and the people remained, a show of force would
      be ineffective.
  - id: F7
    kind: authority
    status: confirmed
    fact: The commander had authority to approve or reject air support actions such as a show of force for the operation.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The commander had delegated authority to approve or reject a show‑of‑force; the decision to decline was within his
      lawful authority.
  - id: C2
    facts:
    - F3
    - F4
    - F6
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The commander judged that the aircraft were already audible for two hours and that the crowd had not been permanently
      dispersed, so an additional low overflight would not increase the warning effect.
  - id: C3
    facts:
    - F3
    - F4
    equity: civilian_life
    favors:
    - O4
    weight: weak
    why: Civilian protection requires an effective warning; because the audible presence had already been provided and proved
      ineffective, further warning was deemed unlikely to reduce civilian risk.
  - id: C4
    facts:
    - F5
    equity: mission_effect
    favors:
    - O4
    weight: strong
    why: The target (fuel trucks and Taliban fighters) represented an immediate threat; delaying the strike for a show‑of‑force
      could jeopardise the mission objective.
  reasoning:
    read: The commander believed that the two‑hour circling of aircraft had already given a clear audible warning to the people
      on the sandbank, yet the crowd remained and even grew, indicating that a low‑level show‑of‑force would not achieve the
      intended dispersion.
    weighing: Based on the strong considerations C1‑C4, the commander concluded that declining the pilots' repeated offer
      was the most appropriate action. The authority to reject the overflight (C1), the assessment that the warning was already
      ineffective (C2), the limited additional civilian protection a show‑of‑force could provide (C3), and the pressing tactical
      need to strike the hostile target (C4) together outweighed any potential benefit of a further overflight.
    tradecraft: The decision was recorded in the operational log, the JTAC was informed of the refusal, and the strike was
      executed according to the approved plan.
    uncertainty: The commander acknowledged limited knowledge of the exact number of civilians present, but judged the observable
      evidence (audibility, crowd behaviour) sufficient for the decision.
    handoff: The commander acted alone, as the authority to approve or decline air‑support actions rested with him; no further
      escalation was required.
    tempting_wrong:
      option: O3
      pull: The pilots repeatedly offered a low overflight, which could be seen as a straightforward way to provide an additional
        warning.
      why_wrong: Accepting the offer would have added a redundant warning that, according to the commander’s assessment, was
        unlikely to change civilian behaviour and could increase risk to the aircraft.
    rejected:
      O1: Requesting further intelligence would have delayed the strike without adding actionable insight, given the already
        evident audible presence.
      O2: A partial show‑of‑force would still constitute a low overflight and therefore suffer the same ineffectiveness identified
        for a full overflight.
      O3: Authorising the full show‑of‑force was rejected because the commander judged it ineffective and unnecessary.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the commander had more accurate knowledge of the civilian presence and their reaction to the audible aircraft
      then: O3
      why: He stated that with fuller situational awareness he would have chosen a different course, implying he might have
        authorised a show of force.
    would_not_change:
    - id: noflip1
      if: If the audible aircraft had already caused permanent civilian dispersion
      why: The commander would still see no need for an additional overflight, keeping the decision to decline.
    watch_for:
    - id: watch1
      what: Situations where audible aircraft do not achieve dispersion and the commander lacks reliable civilian‑presence
        data
      favors:
      - O4
      why: These conditions repeat the reasoning that a show of force is unlikely to add protective value.
  lesson: When aerial assets have already provided a clear audible warning that has not achieved civilian dispersion, a low‑level
    show of force is unlikely to add protective value and may be lawfully declined.
  limits: This rule applies only when the presence and effect of audible aircraft are confirmed; it does not apply where civilians
    have not been warned at all or where audible warning is insufficient to meet the proportionality and precaution requirements.
