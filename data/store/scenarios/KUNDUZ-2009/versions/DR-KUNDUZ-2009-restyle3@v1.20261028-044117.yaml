case:
  id: DR-KUNDUZ-2009-restyle3@v1
  title: Authorization of Air Strike on Tankers on Sandbank [restyle]
  status: needs_review
  setting: Northern Afghanistan, Kunduz district, 04-Sep-2009, German Armed Forces operational sector
  decider: the unit commander
  agent: the unit commander
  agent_role: decide
  situation: During the night on a riverine sandbank near Kunduz, two fuel-laden trucks were stranded and encircled by armed
    individuals. A trusted local source repeatedly affirmed that no civilians were present and that every person on the sandbank
    was a combatant. The source also warned that the trucks could be moved at any moment, posing an immediate danger to the
    German Provincial Reconstruction Team and Afghan security units. No ground element was available; only a single company
    could be mobilised and darkness rendered a ground assault excessively hazardous. The commander had not sought approval
    from higher headquarters before making a decision. The applicable Rules of Engagement required a positive identification
    of hostile forces or an imminent threat, which the commander judged the source's report satisfied.
  question: How should the commander proceed with regard to authorising an aerial strike against the trucks and the individuals
    gathered on the sandbank?
  options:
    O1:
      do: Delay the decision until higher headquarters can be consulted and a comprehensive risk assessment is completed.
      move: hold
      irreversible: false
    O2:
      do: Authorize the aerial strike on the trucks and all persons gathered on the sandbank immediately.
      move: act
      irreversible: true
    O3:
      do: Seek additional intelligence confirmation before reaching a final decision on whether to conduct an aerial strike.
      move: ask
      irreversible: false
      to: the intelligence cell
    O4:
      do: Reject the aerial strike request and order that no air attack be carried out on the sandbank.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A pair of tanker trucks, loaded with fuel, sat stuck on a riverine sandbank just outside Kunduz.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: A reliable indigenous informant repeatedly asserted that the sandbank held no civilian persons.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The informant stated that every person present on the sandbank was an armed rebel.
  - id: F4
    kind: capability
    status: assessed
    fact: The commander assessed that, should the trucks be moved, they would pose an immediate danger to the Provincial Reconstruction
      Team and Afghan security units.
  - id: F5
    kind: capability
    status: assessed
    fact: A ground-force solution was unavailable; only a single company could be mobilised and darkness rendered a land attack
      excessively hazardous.
  - id: F6
    kind: authority
    status: confirmed
    fact: The commander proceeded without seeking guidance from higher headquarters or the brigade commander.
  - id: F7
    kind: authority
    status: assessed
    fact: The applicable ROE required a positive identification of hostile actors or an imminent threat; the commander concluded
      that the informant's account met this criterion.
  - id: F8
    kind: situation
    status: assessed
    fact: The sandbank was situated beyond any village and, given the Ramadan period, civilian presence was deemed improbable.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The ROE call for a positive identification of hostile forces or an imminent threat; basing that identification solely
      on a single human source without independent corroboration does not meet the legal threshold.
  - id: C2
    facts:
    - F2
    - F8
    - F5
    equity: civilian_life
    favors:
    - O4
    weight: strong
    why: Although the source asserted no civilians were present, the uncertainty created by night conditions and the Ramadan
      period leaves a substantial risk of unlawful civilian casualties.
  - id: C3
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O4
    weight: strong
    why: The commander failed to seek approval from higher headquarters, breaching the established chain of command and the
      Bundeswehr's oversight requirements.
  - id: C4
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The trucks represented an imminent threat to the PRT and ground forces were unavailable; however, the procedural
      shortcomings outweigh the modest tactical benefit.
  reasoning:
    read: 'The commander was presented with a time-critical picture: stranded trucks on a sandbank, armed men surrounding
      them, and a belief—derived from one human source—that only insurgents were present. The pitfall was to treat that uncorroborated
      report as sufficient justification for a lethal air strike, overlooking the ROE''s demand for positive identification
      and the necessity of higher-level validation.'
    weighing: The investigative panel weighed the strong considerations C1, C2 and C3 against the weaker mission-effect argument
      C4. It concluded that the procedural violations (lack of independent verification, failure to consult the chain of command,
      and residual civilian risk) outweighed any perceived tactical advantage, leading to a recommendation to reject the strike.
    tradecraft: The decision must be logged in the operation record, citing the specific ROE clause, the source's reliability
      rating, and the absence of higher-headquarters endorsement. A formal after-action report should be submitted to the
      oversight committee.
    uncertainty: The chief uncertainty concerned the actual composition of the crowd on the sandbank; the source's account
      could not be independently verified, and darkness limited visual confirmation.
    handoff: The commander should have escalated the decision to the brigade commander or the designated strike authority
      before authorising any lethal air action, as mandated by the chain-of-command provisions.
    tempting_wrong:
      option: O2
      pull: The urge to eliminate an imminent threat to German personnel and to degrade insurgent capability was compelling.
      why_wrong: Authorising the strike without independent confirmation and without higher-level approval breached ROE, heightened
        the risk of civilian harm, and constituted a procedural error.
    rejected:
      O1: Deferring the decision would not have eliminated the immediate threat and still left the commander without the necessary
        authority.
      O2: Approving the air strike ignored the legal requirement for positive identification and the need for higher-command
        validation.
      O3: Seeking additional intelligence would have delayed action beyond the window of imminent threat, yet acting without
        that confirmation would have rendered the strike unlawful.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Higher headquarters had explicitly authorised the strike despite the same single-source intelligence
      then: O2
      why: With a lawful delegation from the chain of command, the ROE authority requirement would be satisfied, rendering
        the strike permissible under the panel's own threat assessment.
    would_not_change:
    - id: noflip1
      if: Independent, corroborated intelligence later confirmed the presence of civilians on the sandbank
      why: The existence of civilians would still make the strike unlawful, so the recommendation to decline would remain
        unchanged.
    watch_for:
    - id: watch1
      what: Reliance on a single human source without visual or signals corroboration
      favors:
      - O4
      why: The panel identified this as a procedural flaw that must be avoided in future targeting decisions.
  lesson: Commanders must secure independent verification of civilian absence and obtain higher-level approval before authorising
    lethal air strikes when ROE demand positive identification. Procedural compliance supersedes tactical expediency.
  limits: This guidance applies when the only intelligence available is a single, uncorroborated human source and the ROE
    explicitly require positive identification; it does not apply where multiple reliable sources confirm target composition.
