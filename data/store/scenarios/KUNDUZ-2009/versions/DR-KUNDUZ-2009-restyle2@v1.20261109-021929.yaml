case:
  id: DR-KUNDUZ-2009-restyle2@v1
  title: Accepting or Declining a Show of Force before Airstrike on Sandbank [restyle]
  status: needs_review
  setting: Northwest Regional Development Unit, Country X, night of 4 September 2009, under UN peacekeeping command
  decider: the senior officer
  agent: the senior officer
  agent_role: decide
  situation: A pair of rotary-wing crews repeatedly proposed a low-level fly-by intended as a show of force to scatter individuals
    assembled on a riverine sandbar that held two fuel containers and several hostile combatants. The joint terminal attack
    controller briefed the crews that the senior officer planned to eliminate the fuel containers. The senior officer judged
    that the helicopters already loitering overhead for several hours were clearly audible to those on the sandbar and that
    their presence had failed to prompt dispersal. From that judgment the officer concluded that another show of force would
    achieve little. Consequently the officer rejected the crews' proposal and moved forward with the scheduled attack. An
    on-the-ground human-intelligence source positioned on the sandbar received no warning prior to the strike.
  question: What course of action should the senior officer take concerning the crews' repeated proposal to conduct a show
    of force before the attack?
  options:
    O1:
      do: The senior officer declines the crews' offer of a show of force and carries out the attack as originally scheduled.
      move: act
      irreversible: false
    O2:
      do: The senior officer accepts the crews' offer and orders a low-altitude show of force to disperse the individuals
        on the sandbar before the attack.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The rotary-wing crews repeatedly proposed a low-altitude fly-by as a show of force to disperse individuals on the
      sandbar.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The joint terminal attack controller briefed the crews that the senior officer intended to destroy two fuel containers
      on the sandbar.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The senior officer judged that the aircraft circling the sandbar were clearly audible to the people present.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The senior officer concluded that a show of force would not cause the people to leave because they had remained
      despite hearing the aircraft.
  - id: F5
    kind: authority
    status: confirmed
    fact: The senior officer rejected the crews' offer of a show of force.
  - id: F6
    kind: situation
    status: confirmed
    fact: The planned attack targeted two fuel containers and the hostile personnel present on the sandbar.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The human-intelligence source on the sandbar was not warned before the bomb release.
  - id: F8
    kind: authority
    status: confirmed
    fact: The decision-maker was the senior officer of the Northwest Regional Development Unit in Country X.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F7
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: International humanitarian law obligates commanders to give civilians an effective warning before an attack; merely
      audible aircraft that failed to cause dispersal does not satisfy that requirement.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Because the officer's own assessment shows that the audible presence did not move the civilians, an additional low-altitude
      fly-by is required to provide a genuine warning.
  - id: C3
    facts:
    - F6
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Rules of engagement and the law of armed conflict require the commander to employ all practicable precautions to
      limit civilian harm; a show of force qualifies as a practicable precaution.
  - id: C4
    facts:
    - F1
    - F2
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: The crews' repeated proposal demonstrates that the overflight could be executed safely, posing minimal risk to friendly
      forces.
  - id: C5
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The failure to alert the on-site human-intelligence source evidences a lapse in meeting the mandated precaution.
  reasoning:
    read: The senior officer believed that the helicopters already circling for hours supplied sufficient warning because
      they were audible, and therefore declined a low-altitude show of force. The error lies in treating audibility as an
      effective warning; the law demands a demonstrable precaution that actually alters civilian behaviour.
    weighing: The assessment panel weighed the officer's judgment against the legal obligation to provide an effective warning.
      Considerations C1, C2, C3 and C5, each strongly weighted, indicate that audible presence alone is inadequate and that
      a low-risk show of force is a feasible precaution. Accordingly the balance supports accepting the crews' proposal ({O2}).
    tradecraft: The senior officer should order the crews to execute a low-altitude fly-by, document the maneuver, and then
      reassess the situation before authorising the strike. The overflight must be entered into the mission log and reported
      to the oversight board.
    uncertainty: It cannot be assured that the fly-by will disperse every civilian, yet the precaution is required irrespective
      of the uncertain outcome.
    handoff: The final decision stays with the senior officer but should be coordinated with the joint terminal attack controller
      and a legal adviser to verify compliance with the rules of engagement.
    tempting_wrong:
      option: O1
      pull: Desire to maintain momentum and avoid further delay of the attack.
      why_wrong: Foregoing the show of force breaches the precautionary duty and raises the likelihood of civilian casualties.
    rejected:
      O1: The officer's refusal rested on an inadequate warning assessment and disregarded the legal requirement to take feasible
        precautions.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If reliable intelligence confirmed that the individuals on the sandbar had already fled after hearing the circling
        aircraft,
      then: O1
      why: The extra fly-by would no longer constitute a necessary precaution.
    would_not_change:
    - id: noflip1
      if: Even when operating under severe time constraints,
      why: The legal obligation to deliver an effective warning remains unchanged.
    watch_for:
    - id: watch1
      what: Ongoing evaluation of civilian reactions to audible aircraft
      favors:
      - O2
      why: If civilians habitually ignore audible aircraft, the justification for a show of force becomes even stronger.
  lesson: Audible aircraft alone do not meet the legal standard for an effective warning when civilians are present; commanders
    must apply feasible additional precautions, such as a low-altitude show of force, before executing a strike.
  limits: This principle applies only when civilians are known or reasonably expected in the target area and when a practicable,
    low-risk warning measure exists. It does not replace the necessity for positive identification of combatants.
