    domain: military-operational
    family: KUNDUZ-2009
    source: https://dserver.bundestag.de/btd/17/074/1707400.pdf
    episode_focus: Whether the commander should accept the pilots' repeated offer of a show of force to disperse the people
      on the sandbank before the strike, or decline it and proceed, given his view that the aircraft overhead were already
      audible and the duty to give effective warning where civilians may be affected.
    cues:
      option_words:
        O1: 18
        O2: 21
      real_option: O2
      real_to_mean_other_length: 1.17
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
