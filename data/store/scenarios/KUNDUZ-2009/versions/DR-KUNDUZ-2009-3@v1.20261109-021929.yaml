case:
  id: DR-KUNDUZ-2009-3@v1
  title: Accepting or Declining a Show of Force before Airstrike on Sandbank
  status: draft
  setting: Kunduz Provincial Reconstruction Team, Afghanistan, night of 4 September 2009, under ISAF command
  decider: the commander
  agent: the Commander
  agent_role: decide
  situation: Pilots repeatedly offered to conduct a low‑altitude overflight as a show of force to disperse people gathered
    on a sandbank where two fuel trucks and accompanying hostile individuals were located. The Joint Terminal Attack Controller
    had informed the pilots that the commander intended to destroy the fuel trucks. The commander believed that the aircraft
    already circling for hours were clearly audible to those on the sandbank and that the presence of the aircraft had not
    caused them to leave. Based on this assessment, the commander concluded that an additional show of force would not be
    effective. The commander ultimately declined the pilots' offer and proceeded with the planned strike. A HUMINT source
    on the sandbank was not warned before the strike.
  question: What should the commander do regarding the pilots' repeated offer of a show of force to disperse the people on
    the sandbank before the strike?
  options:
    O1:
      do: The Commander rejects the pilots' offer of a show of force and proceeds with the strike as planned.
      move: act
      irreversible: false
    O2:
      do: The Commander accepts the pilots' offer of a show of force to disperse the people on the sandbank before the strike.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Pilots repeatedly offered a show of force, a low‑altitude overflight, to disperse people on the sandbank.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The JTAC informed the pilots that the commander intended to destroy two fuel trucks on the sandbank.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The commander believed the aircraft circling the sandbank were clearly audible to the people there.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The commander concluded that a show of force would not cause the people to leave because they had remained despite
      hearing the aircraft.
  - id: F5
    kind: authority
    status: confirmed
    fact: The commander declined the pilots' offer of a show of force.
  - id: F6
    kind: situation
    status: confirmed
    fact: The planned strike targeted two fuel trucks and the Taliban personnel present on the sandbank.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The HUMINT informant on the sandbank was not warned before the bomb drop.
  - id: F8
    kind: authority
    status: confirmed
    fact: The decision-maker was the commander of the Provincial Reconstruction Team in Kunduz.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F7
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: International humanitarian law requires effective warning to civilians before an attack; audible aircraft that did
      not cause dispersal is insufficient.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The commander’s own assessment that the people remained despite hearing the aircraft shows the warning was ineffective,
      so an additional low‑altitude overflight was needed.
  - id: C3
    facts:
    - F6
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: ROE/LOAC obligate the commander to take all feasible precautions to minimise civilian harm; a show of force is a
      feasible precaution.
  - id: C4
    facts:
    - F1
    - F2
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: Pilots repeatedly offered the overflight, indicating it could be carried out safely without endangering own forces.
  - id: C5
    facts:
    - F7
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The HUMINT source on the sandbank was not warned, evidencing a failure to provide the required precaution.
  reasoning:
    read: The commander believed that the aircraft already circling for hours provided sufficient warning because they were
      audible, and therefore declined a low‑altitude show of force. The trap is equating audibility with an effective warning;
      law requires a demonstrable precaution that actually influences civilian behaviour.
    weighing: The Bundestag Untersuchungsausschuss weighed the commander’s assessment against the legal duty to give an effective
      warning. Considerations C1, C2, C3 and C5, all strongly weighted, show that the audible presence was not enough and
      that a show of force was a feasible, low‑risk precaution. The balance therefore favours accepting the pilots’ offer
      ({O2}).
    tradecraft: The commander should instruct the pilots to conduct a low‑altitude overflight, record the action, and then
      re‑evaluate the situation before authorising the strike. The overflight must be documented in the mission log and reported
      to the oversight committee.
    uncertainty: It cannot be guaranteed that the overflight will disperse all civilians, but the precaution is required regardless
      of the uncertain effect.
    handoff: The decision remains with the commander but should be coordinated with the JTAC and a legal advisor to confirm
      compliance with ROE.
    tempting_wrong:
      option: O1
      pull: Desire to act quickly and avoid further delay in the strike.
      why_wrong: Skipping the show of force violates the precautionary requirement and increases the risk of civilian casualties.
    rejected:
      O1: The commander’s refusal relied on an insufficient warning assessment and ignored the legal duty to take feasible
        precautions.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: If credible evidence showed that the people on the sandbank had already dispersed after hearing the circling aircraft,
      then: O1
      why: The additional overflight would no longer be a necessary precaution.
    would_not_change:
    - id: noflip1
      if: Even under extreme time pressure,
      why: The legal duty to provide an effective warning remains unchanged.
    watch_for:
    - id: watch1
      what: Future assessments of civilian response to audible aircraft
      favors:
      - O2
      why: If civilians consistently ignore audible aircraft, the need for a show of force becomes even stronger.
  lesson: When civilians are present, audible aircraft alone do not satisfy the legal requirement for an effective warning;
    commanders must employ feasible additional precautions, such as a low‑altitude show of force, before striking.
  limits: This rule applies only when civilians are known or reasonably expected to be in the target area and when a feasible,
    low‑risk warning measure is available. It does not replace the need for positive identification of combatants.
