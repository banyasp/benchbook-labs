case:
  id: DR-KUNDUZ-2009-2@v1
  title: Authorization of Air Strike on Stolen Tank Trucks
  status: draft
  setting: Kunduz Province, Afghanistan, night of 4 September 2009, ISAF command
  decider: the commander
  agent: the commander
  agent_role: decide
  situation: At night during Ramadan, two tank trucks stolen by insurgents were parked on a sandbank in a river, away from
    any settlement. A human informant, judged reliable, repeatedly told the commander that no civilians were present on the
    sandbank. The commander believed only armed insurgents were there and that the vehicles could soon be moved to attack
    friendly forces. Rules of Engagement allowed a strike if an imminent threat existed; the commander judged the threat had
    become imminent. No ground troops or drones were available to seize the vehicles, and a show‑of‑force overflight was considered
    ineffective. The commander held sole authority to approve the strike without consulting higher headquarters.
  question: What should the commander do regarding authorizing an air strike on the tank trucks and the people gathered around
    them?
  options:
    O1:
      do: The commander holds the decision and delays action until ground forces become available.
      move: hold
      irreversible: false
    O2:
      do: The commander authorizes the air strike on the tank trucks and the surrounding persons.
      move: act
      irreversible: true
    O3:
      do: The commander requests additional intelligence confirmation before deciding on the air strike.
      move: ask
      irreversible: false
      to: the intelligence officer
    O4:
      do: The commander declines to authorize the air strike and orders no attack on the sandbank.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two tank trucks stolen by insurgents were located on a sandbank in a river, outside any settlement, at night during
      Ramadan.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: A reliable informant repeatedly confirmed that no civilians were present on the sandbank.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The commander believed that only armed insurgents were present, based on the informant and cultural expectations
      that women would not be there.
  - id: F4
    kind: authority
    status: confirmed
    fact: Rules of Engagement permitted a strike under an imminent‑threat condition (ROE 421) and later under ROE 429.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The commander assessed that the tank trucks posed an increasing threat because they could become mobile and be used
      against friendly forces.
  - id: F6
    kind: capability
    status: confirmed
    fact: No ground forces, drones, or effective show‑of‑force options were available to engage the target.
  - id: F7
    kind: authority
    status: confirmed
    fact: The commander had sole authority to approve the air strike without consulting higher command.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The exact number of persons on the sandbank was uncertain, with estimates ranging from 30 to 50 (up to 100) and
      no definitive civilian identification.
  - id: F9
    kind: capability
    status: assessed
    fact: The intended effect was to destroy the tank trucks with minimal collateral damage and not to target persons.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The informant, judged reliable, repeatedly confirmed no civilians were present; the commander assessed only insurgents
      were there despite uncertainty about exact numbers.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The stolen tankers could become mobile and be used to attack friendly forces; waiting would increase the risk to
      the PRT and ISAF troops.
  - id: C3
    facts:
    - F4
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: ROE 421 (imminent threat) and later ROE 429 permitted a strike; the commander had delegated authority to approve
      without higher‑command clearance.
  - id: C4
    facts:
    - F6
    - F9
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: No ground troops, drones or effective show‑of‑force were available; the only feasible way to neutralise the threat
      was an air strike with minimal collateral damage.
  - id: C5
    facts:
    - F1
    - F3
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The situation was time‑critical; the threat could materialise within minutes, requiring rapid action.
  reasoning:
    read: The commander faced an imminent threat from two insurgent‑captured tankers on a sandbank at night. A single, reliable
      HUMINT source repeatedly assured that only armed insurgents were present, and cultural cues (Ramadan, Pashtun customs)
      reinforced the belief that civilians, especially women, would not be there.
    weighing: The source’s own analysis balances the strong need to protect ISAF personnel (C2, C4) against the low probability
      of civilian presence (C1). The legal framework (C3) explicitly authorised a strike under an imminent‑threat condition,
      and the commander possessed delegated authority (F7). While uncertainty about exact numbers (C5) exists, the commander
      judged the proportionality of two 500‑pound bombs to be acceptable because the target was isolated from any settlement
      (F1). The balance therefore favours authorising the strike.
    tradecraft: The commander documented the intelligence, the ROE justification, and the lack of alternatives in the operation
      log, then transmitted the strike authorization to the JTAC and the F‑15 crews. Post‑strike, a Battle Damage Assessment
      was conducted the following morning as per standard procedure.
    uncertainty: The exact number of persons on the sandbank could not be verified (30‑50, possibly up to 100) and the reliability
      of a single informant always carries residual doubt. Nevertheless, the informant’s reports matched aerial imagery and
      weapon‑effects expectations, reducing the uncertainty to an acceptable level for the commander.
    handoff: The decision was taken solely by the commander (sole authority per F7). No higher‑command consultation was required,
      and no other units were tasked to verify the target.
    tempting_wrong:
      option: O4
      pull: A cautious officer might delay or cancel the strike to avoid any risk of civilian casualties, especially given
        the uncertainty about numbers.
      why_wrong: Delaying would have allowed the tankers to become mobile, creating a far greater threat to ISAF forces and
        the civilian population elsewhere.
    rejected:
      O1: Holding the strike would have left the tankers free to move and potentially attack the PRT, endangering many more
        lives.
      O3: Further intelligence could not be obtained in time; waiting would have turned an imminent threat into an actual
        one.
      O4: Refusing the strike ignored the commander’s legal authority, the reliable intelligence, and the lack of feasible
        alternatives.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: the reliable informant had indicated the presence of civilians on the sandbank
      then: O4
      why: A confirmed civilian presence would make the strike disproportionate and unlawful under ROE, forcing the commander
        to decline the attack.
    would_not_change:
    - id: noflip1
      if: ground forces became available after the decision window closed
      why: The imminent‑threat assessment would have already justified the strike; the later availability of troops does not
        retroactively alter the legality of the authorized action.
    watch_for:
    - id: watch1
      what: any new intelligence suggesting civilian casualties after the strike
      favors:
      - O4
      why: Post‑strike civilian casualty reports could trigger investigations and affect future decision‑making thresholds.
  lesson: When a commander has reliable, corroborated intelligence that no civilians are present and an imminent threat exists,
    the Rules of Engagement permit a timely air strike even without higher‑command consultation. The decision must be documented,
    and proportionality must be assessed against the isolated nature of the target.
  limits: This reasoning applies only where a single, vetted HUMINT source can be cross‑checked with ISR, where no feasible
    ground or drone options exist, and where the target is isolated from civilian areas. It does not extend to situations
    with ambiguous target identification or where alternative non‑kinetic measures are viable.
