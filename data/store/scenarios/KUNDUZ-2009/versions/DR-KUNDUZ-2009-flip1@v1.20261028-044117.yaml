case:
  id: DR-KUNDUZ-2009-flip1@v1
  title: Authorization of Air Strike on Tankers on Sandbank [flip]
  status: needs_review
  setting: Al-Murad Province, Afghanistan, night of 12 May 2012, NATO coalition command
  decider: the battalion commander
  agent: the battalion commander
  agent_role: decide
  situation: During a moonless night on a sandbank beside the River Qara near the provincial capital, two fuel-laden trucks
    were stranded and encircled by armed men. A trusted local informant repeatedly assured that no civilians were in the vicinity
    and that every individual present was a hostile combatant. The informant also warned that the trucks could be driven away
    at any moment, creating an immediate danger to the forward operating base and nearby Afghan police units. No ground-force
    element could be deployed; only a single infantry company was on standby and the darkness made a ground assault excessively
    hazardous. The commander had not sought approval from higher headquarters before acting. The applicable Rules of Engagement
    demanded either a positive identification of hostile forces or proof of an imminent threat, which the commander judged
    the informant's report satisfied.
  question: Should the battalion commander authorize an air strike against the trucks and the armed individuals gathered on
    the sandbank?
  options:
    O1:
      do: Postpone the decision and request further guidance from higher headquarters while re-evaluating the risk.
      move: hold
      irreversible: false
    O2:
      do: Approve the air strike on the trucks and the armed persons on the sandbank.
      move: act
      irreversible: true
    O3:
      do: Seek additional intelligence confirmation before making a final determination on the air strike.
      move: ask
      irreversible: false
      to: the intelligence cell
    O4:
      do: Refuse to authorize the air strike and order that no aerial attack be conducted on the sandbank.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two fuel-laden trucks were immobilised on a sandbank beside the River Qara near the provincial capital.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: A trusted local informant repeatedly confirmed that no civilians were present on the sandbank.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: The informant asserted that every person on the sandbank was an armed insurgent.
  - id: F4
    kind: capability
    status: assessed
    fact: The commander assessed that the trucks posed an imminent threat to the forward operating base and Afghan police
      if they were moved.
  - id: F5
    kind: capability
    status: assessed
    fact: No viable ground-force alternative existed; only one infantry company was available and night conditions rendered
      a ground assault too risky.
  - id: F6
    kind: authority
    status: confirmed
    fact: The division staff, after reviewing the sole informant’s report, sanctioned the air operation on the sandbank.
  - id: F7
    kind: authority
    status: assessed
    fact: Rules of Engagement required positive identification of hostile forces or an imminent threat; the commander judged
      the informant's report satisfied this condition.
  - id: F8
    kind: situation
    status: assessed
    fact: The sandbank lay outside any settlement and, during Ramadan, civilian presence was considered unlikely.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: ROE demand a positive identification of hostile forces; relying solely on a single human source without independent
      verification does not meet that legal threshold.
  - id: C2
    facts:
    - F2
    - F8
    - F5
    equity: civilian_life
    favors:
    - O4
    weight: strong
    why: Despite the informant's assurance, night-time conditions and the observance of Ramadan create a substantial risk
      that civilians could be present, raising the possibility of unlawful casualties.
  - id: C3
    facts:
    - F6
    equity: chain_of_command
    favors:
    - O2
    weight: strong
    why: The division staff's explicit sanction satisfies the chain-of-command requirement, removing the procedural breach
      that previously favoured a refusal.
  - id: C4
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The imminent threat posed by the trucks and the lack of a safe ground alternative support authorising the strike,
      though the benefit is outweighed by procedural concerns.
  reasoning:
    read: 'The battalion commander confronted an urgent threat: immobilised fuel trucks surrounded by armed men, with a single
      informant asserting that only insurgents were present. The key dilemma was whether the informant''s uncorroborated report,
      together with the division staff''s sanction, satisfied the ROE and command-approval requirements for a lethal air strike.'
    weighing: The assessment weighed the strong chain-of-command endorsement (C3) and the tactical necessity (C4) against
      the legal shortfall of positive identification (C1) and the residual civilian-risk concern (C2). Because higher-level
      authority had already authorised the operation, the procedural barrier was removed, allowing the mission-effect argument
      to dominate.
    tradecraft: The decision should be logged in the operation record, citing the specific ROE clause, the informant's reliability
      rating, and the division staff's sanction. A post-mission report must be submitted to the oversight board.
    uncertainty: The principal uncertainty remained the true composition of the crowd; visual confirmation was impossible
      in darkness, and the single-source intelligence could not be independently verified.
    handoff: Having received explicit approval from the division staff, the commander satisfied the chain-of-command requirement
      and could proceed without further escalation.
    tempting_wrong:
      option: O4
      pull: The instinct to avoid any possible civilian harm and to adhere strictly to ROE was strong.
      why_wrong: Refusing the strike would leave an imminent threat unmitigated and would disregard the lawful authority already
        granted by higher headquarters.
    rejected:
      O1: Delaying the decision would forfeit the narrow window in which the threat was imminent, and higher-headquarters
        approval had already been obtained.
      O3: Waiting for additional intelligence would likely miss the opportunity to neutralise the threat, and the division
        staff's sanction already satisfied the command requirement.
      O4: Declining the strike ignores the authorized chain-of-command decision and permits a clear danger to persist.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Higher headquarters had not authorised the strike despite the same single-source intelligence
      then: O4
      why: Without explicit higher-level approval the chain-of-command breach would re-emerge, making a refusal the correct
        course.
    would_not_change:
    - id: noflip1
      if: Independent, corroborated intelligence later confirmed the presence of civilians on the sandbank
      why: The presence of civilians would still render the strike unlawful, so the recommendation to decline would remain.
    watch_for:
    - id: watch1
      what: Reliance on a single human informant without visual or signals confirmation
      favors:
      - O4
      why: The panel highlighted this as a procedural error that must be avoided in future targeting decisions.
  lesson: When higher-level authority explicitly sanctions an operation, and the target presents an imminent threat, an air
    strike may be lawfully authorised even if the intelligence source is singular, provided the ROE's threat criterion is
    satisfied.
  limits: This guidance applies only when a legitimate chain-of-command endorsement exists and the ROE are met by an imminent-threat
    assessment; it does not apply when multiple reliable sources are required for positive identification.
