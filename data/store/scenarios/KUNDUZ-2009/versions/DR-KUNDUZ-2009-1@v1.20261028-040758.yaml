case:
  id: DR-KUNDUZ-2009-1@v1
  title: Declaration of Troops-in-Contact Based on Imminent Threat
  status: draft
  setting: Kunduz Provincial Reconstruction Team, Afghanistan, night of 3–4 September 2009, under ISAF command
  decider: the regional reconstruction-team commander
  agent: the regional reconstruction-team commander
  agent_role: decide
  situation: At night, the JTAC requested close air support from the ASOC, which said support could only be provided if a
    troops-in-contact (TIC) situation was declared based on an imminent threat. No own troops were physically in contact on
    the sandbank where two fuel tankers and an armed group were located. The commander believed a large armed group and fuel‑laden
    tankers a few kilometres away constituted an imminent threat to the PRT. The commander was aware that other German forces
    were engaged elsewhere and that the PRT had limited defensive capability. Under ISAF rules of engagement, a TIC could
    be declared either when troops are in direct fire or when an imminent threat exists. The commander considered that declaring
    a TIC would satisfy the ASOC requirement and enable air support to protect the PRT and civilians.
  question: What should the regional reconstruction-team commander do regarding declaring a troops-in-contact situation?
  options:
    O1:
      do: The commander holds the decision pending intelligence.
      move: hold
      irreversible: false
    O2:
      do: The commander declares a troops-in-contact situation.
      move: act
      irreversible: true
    O3:
      do: The commander asks the ASOC for clarification.
      move: ask
      irreversible: false
    O4:
      do: The commander withholds the troops-in-contact declaration.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The JTAC requested close air support and the ASOC said support could only be granted if a troops-in-contact situation
      was declared based on an imminent threat.
  - id: F2
    kind: authority
    status: confirmed
    fact: ASOC required a declaration of troops-in-contact (TIC) that meets the imminent threat condition before providing
      air support.
  - id: F3
    kind: situation
    status: confirmed
    fact: No own troops were present on the sandbank where the fuel tankers and armed group were located.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The commander assessed that a large armed group and fuel‑laden tankers a few kilometres away created an imminent
      threat to the PRT.
  - id: F5
    kind: authority
    status: confirmed
    fact: ISAF rules of engagement allow a TIC declaration when troops are in contact or when an imminent threat exists.
  - id: F6
    kind: situation
    status: assessed
    fact: The commander was under pressure because other German forces were engaged elsewhere and the PRT had limited defensive
      capability.
  - id: F7
    kind: situation
    status: confirmed
    fact: The JTAC declared a troops-in-contact situation to the ASOC at 01:04.
  - id: F8
    kind: authority
    status: confirmed
    fact: The commander ordered the JTAC to declare a TIC based on an imminent threat.
  considerations:
  - id: C1
    facts:
    - F5
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: ISAF rules of engagement expressly permit a troops‑in‑contact (TIC) declaration when an imminent threat exists, satisfying
      the legal authority for the action.
  - id: C2
    facts:
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The commander judged that a large armed group with fuel‑laden tankers nearby created an imminent threat to the PRT,
      making air support essential to protect the mission.
  - id: C3
    facts:
    - F1
    - F2
    - F8
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The ASOC would only grant close air support after a TIC is declared; without a declaration the time‑critical request
      could not be satisfied.
  - id: C4
    facts:
    - F3
    - F7
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: Although no own troops were physically in contact, the commander relied on his authority to interpret the imminent‑threat
      clause as sufficient for a TIC.
  - id: C5
    facts:
    - F4
    - F6
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Failing to obtain air support could expose both coalition personnel and nearby civilians to a potentially lethal
      attack by the armed group.
  reasoning:
    read: The situation presented a gap between the ASOC’s requirement (TIC) and the factual reality (no troops in direct
      fire). The commander interpreted the ‘imminent threat’ provision of the ISAF ROE as satisfying the TIC condition, thereby
      bridging the gap to obtain needed air support.
    weighing: Strong considerations C1, C2, C3 and C5 overwhelmingly support declaring a TIC; the weaker C4 acknowledges the
      interpretive stretch but does not outweigh the mission‑critical need. The balance therefore tips to O2. The declaration
      was a reasonable application of the ROE to protect forces and civilians.
    tradecraft: The commander records the TIC declaration in the joint chat, notes the basis (imminent threat), informs the
      JTAC and ASOC, and files a post‑action report documenting the reasoning and the intelligence assessment.
    uncertainty: Intelligence on the exact disposition of the armed group was limited, but the commander judged the threat
      credible enough to act.
    handoff: The decision rests with the regional reconstruction‑team commander; he consulted the JTAC and kept senior staff
      informed, but exercised sole authority under the delegated ROE.
    tempting_wrong:
      option: O4
      pull: Avoiding a possibly inaccurate TIC claim could preserve strict adherence to the letter of the rule.
      why_wrong: Withholding the declaration would have denied air support, exposing the PRT and civilians to a greater, foreseeable
        danger.
    rejected:
      O1: Holding the decision pending further intelligence would have delayed air support beyond the window of imminent threat.
      O3: Asking the ASOC for clarification would not change the requirement that a TIC be declared; it would only waste critical
        time.
      O4: Withholding the TIC would leave the PRT without protection despite a clear, imminent threat.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: reliable intelligence later showed no imminent threat from the armed group or fuel tankers
      then: O4
      why: Without an actual threat the justification for a TIC disappears, making the declaration unjustified.
    - id: flip2
      if: the ASOC clarified that a TIC must involve direct fire contact and not merely an imminent threat
      then: O4
      why: The legal condition for air‑support would no longer be met, requiring the commander to withhold the declaration.
    would_not_change:
    - id: noflip1
      if: the commander remained under the same time‑critical pressure and limited defensive assets
      why: The need to protect forces and civilians continues to outweigh the interpretive risk.
    watch_for:
    - id: watch1
      what: any amendment to the ISAF SPIN definition of TIC that removes the imminent‑threat clause
      favors:
      - O4
      why: A rule change would eliminate the legal basis for declaring TIC on threat alone.
  lesson: When ROE permit a TIC declaration on the basis of an imminent threat, commanders may lawfully invoke that clause
    to obtain essential air support, provided the threat assessment is credible and documented.
  limits: This reasoning applies only where the rules of engagement explicitly include an imminent‑threat provision; it does
    not extend to situations where the ROE require actual contact or where civilian protection outweighs the need for air
    support.
