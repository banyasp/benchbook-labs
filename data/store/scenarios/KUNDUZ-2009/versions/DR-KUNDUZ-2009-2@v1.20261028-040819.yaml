case:
  id: DR-KUNDUZ-2009-2@v1
  title: Authorization of Air Strike on Sandbank Tankers
  status: draft
  setting: Kunduz Province, Afghanistan, night of 4 September 2009, German Bundeswehr command
  decider: the commander
  agent: the commander
  agent_role: decide
  situation: Two tank transport vehicles were immobilized on a sandbank in a river, outside any settlement and about a kilometre
    from the nearest village. The sandbank was observed at night during Ramadan, a time when civilians typically remain indoors.
    A human informant, deemed reliable, repeatedly reported that no civilians were present and that all persons there were
    insurgents. The commander assessed that the tankers could be moved to launch an attack on the nearby Provincial Reconstruction
    Team, constituting an imminent threat. Rules of Engagement required a positive identification of hostile forces or an
    imminent threat, which the commander believed was satisfied. No ground forces were available to seize the tankers without
    unacceptable risk to soldiers and civilians, and the commander held delegated authority to approve air strikes without
    consulting higher command.
  question: What should the commander do regarding the air strike on the tankers and persons on the sandbank?
  options:
    O1:
      do: The commander requests higher‑command approval before any air strike.
      move: ask
      irreversible: false
      to: higher command
    O2:
      do: The commander authorizes the air strike on the tankers and persons.
      move: act
      irreversible: true
    O3:
      do: The commander postpones the strike pending further civilian verification.
      move: hold
      irreversible: false
    O4:
      do: The commander declines the air strike on the tankers and persons.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two tank transport vehicles were immobilized on a sandbank in a river.
  - id: F2
    kind: situation
    status: assessed
    fact: The sandbank was outside any settlement, about a kilometre from the nearest village, and it was night during Ramadan
      when civilians typically stay indoors.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: A reliable human informant repeatedly confirmed that no civilians were present on the sandbank; all persons were
      insurgents.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The commander believed the tankers could be used to transport fuel for insurgents and might be moved to attack the
      PRT Kunduz, creating an imminent threat.
  - id: F5
    kind: authority
    status: assessed
    fact: Rules of Engagement required a positive identification of hostile forces or an imminent threat; the commander assessed
      that the situation met the imminent‑threat condition.
  - id: F6
    kind: capability
    status: assessed
    fact: No ground forces were available to seize the tankers without unacceptable risk to soldiers and civilians.
  - id: F7
    kind: authority
    status: confirmed
    fact: The commander had delegated authority to approve air strikes without consulting higher command.
  - id: F8
    kind: situation
    status: assessed
    fact: The pilots expressed internal doubts about the legality under ROE but did not voice them to the JTAC.
  considerations:
  - id: C1
    facts:
    - F3
    - F2
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Der als zuverlässig eingestufte Informant bestätigte wiederholt, dass sich auf der Sandbank ausschließlich Aufständische
      befänden und keine Zivilisten, was angesichts der nächtlichen Ramadan‑Situation die Annahme von zivilen Opfern stark
      reduzierte.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Der Kommandant bewertete, dass die Tanklastzüge bei Mobilisierung eine unmittelbare Bedrohung für das PRT Kunduz
      darstellten; die ROE‑Vorgabe einer positiven Identifikation oder eines „imminent threat“ war nach seiner Einschätzung
      erfüllt.
  - id: C3
    facts:
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Keine Bodentruppen standen zur Verfügung, um die Tanklastzüge ohne unvertretbares Risiko für Soldaten und Zivilisten
      zu sichern; ein Bodeneinsatz wäre daher unverhältnismäßig.
  - id: C4
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Der Kommandant verfügte über delegierte Befugnis, Luftschläge eigenständig zu genehmigen, und die Piloten hatten
      ihre Zweifel nicht an den JTAC weitergeleitet, sodass die Entscheidung im Rahmen der geltenden Befehlsgewalt lag.
  - id: C5
    facts:
    - F2
    equity: third_party_harm
    favors:
    - O2
    weight: weak
    why: Die Sandbank lag außerhalb jeder Ortschaft und etwa einen Kilometer vom nächsten Dorf entfernt, wodurch das Risiko
      unbeabsichtigter ziviler Verluste im Vergleich zu einem Angriff in bebautem Gebiet als gering eingeschätzt wurde.
  reasoning:
    read: Der Kommandant sah sich einem potenziellen Angriff der Taliban auf das PRT Kunduz gegenüber, weil die erbeuteten
      Tanklastzüge mobilisiert werden konnten. Er musste entscheiden, ob er das Risiko eines Luftschlags mit dem Risiko eines
      möglichen Angriffs und dem Fehlen von Bodentruppen abwägen sollte.
    weighing: Die Überlegungen C1‑C5 zeigen, dass die Quelle die Entscheidung primär auf die Gewissheit stützte, dass nur
      Kombattanten anwesend waren (C1), ein unmittelbar drohender Angriff vorlag (C2), keine sichere Alternative existierte
      (C3), die rechtliche Befugnis vorlag (C4) und das Ziel isoliert lag (C5). Das Gleichgewicht fiel zugunsten des Luftschlags,
      weil das Schutzinteresse der eigenen Truppen und das Missionsziel die geringe, aber mögliche Gefahr für Zivilisten überstiegen.
    tradecraft: Der Befehl wurde schriftlich im Lagebrief festgehalten, die Piloten erhielten die Anweisung, die kleinste
      mögliche Sprengladung mit verzögerter Zündung zu verwenden und ausschließlich die Tanklastzüge zu treffen. Das Ergebnis
      wurde im Anschluss durch ein Battle‑Damage‑Assessment dokumentiert.
    uncertainty: Trotz der zuverlässigen Quelle blieb Unsicherheit über die exakte Zahl und Identität der Personen auf der
      Sandbank; die Quelle selbst räumte ein, dass die Unterscheidung zwischen Aufständischen und Zivilisten schwierig sei.
    handoff: Der Kommandant handelte eigenständig im Rahmen seiner delegierten Vollmacht; eine Rücksprache mit höherem Kommando
      war nicht erforderlich, weil die Dringlichkeit und das Fehlen von Alternativen eine sofortige Entscheidung erforderten.
    tempting_wrong:
      option: O4
      pull: Die moralische Versuchung, zivile Opfer um jeden Preis zu vermeiden, könnte zum Verzicht auf den Luftschlag verleiten.
      why_wrong: Der Kommandant hatte jedoch klar erklärt, dass er den Angriff nicht befohlen hätte, wenn er glaubte, Zivilisten
        seien anwesend; das Ignorieren der unmittelbaren Bedrohung hätte das PRT und eigene Soldaten einem größeren Risiko
        ausgesetzt.
    rejected:
      O1: Eine Anfrage an das höhere Kommando hätte die Zeit bis zur möglichen Mobilisierung der Tanklastzüge verloren und
        das Risiko eines Angriffs erhöht.
      O3: Ein Aufschub hätte die Unsicherheit über die zivile Präsenz verlängert, während die Bedrohung weiter wuchs und keine
        alternativen Kräfte verfügbar waren.
      O4: Ein Verzicht auf den Luftschlag hätte die Taliban die Möglichkeit gelassen, die Tanklastzüge zu befreien und das
        PRT anzugreifen.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Der Informant hätte bestätigt, dass Zivilisten auf der Sandbank anwesend waren.
      then: O4
      why: Die Annahme zivilen Lebens hätte das Prinzip der Unterscheidung und das Verbot unverhältnismäßiger Gewalt aktiviert,
        sodass ein Luftschlag nicht mehr gerechtfertigt gewesen wäre.
    - id: flip2
      if: Bodentruppen wären verfügbar gewesen, um die Tanklastzüge zu sichern, ohne das Risiko für die Soldaten zu erhöhen.
      then: O3
      why: Eine sichere Bodenoption hätte die Notwendigkeit eines Luftschlags eliminiert und die Verpflichtung zur Vermeidung
        ziviler Opfer gestärkt.
    would_not_change:
    - id: noflip1
      if: Die ROE‑Vorgabe einer positiven Identifikation von feindlichen Kräften bliebe erfüllt durch das bestätigte Fehlen
        von Zivilisten.
      why: Die rechtliche Schwelle wäre weiterhin gegeben, sodass die Autorisierung des Luftschlags bestehen bleibt.
    watch_for:
    - id: watch1
      what: Neue Informationen, die das Vorhandensein von Zivilisten belegen.
      favors:
      - O4
      why: Ein späteres Erkennen ziviler Opfer würde die Bewertung der Verhältnismäßigkeit und die Einhaltung des Grundsatzes
        der Unterscheidung ändern.
  lesson: Wenn ein zuverlässiger Informant eindeutig bestätigt, dass keine Zivilisten anwesend sind und ein unmittelbarer
    Angriff droht, kann ein Kommandant im Rahmen delegierter Vollmacht einen Luftschlag autorisieren, solange Alternativen
    fehlen und das Ziel isoliert ist.
  limits: Diese Regel gilt nur, wenn die menschliche Quelle als zuverlässig eingestuft ist, das Ziel klar von zivilen Bereichen
    getrennt liegt und keine praktikablen Bodeneinsätze oder andere präzise Mittel zur Verfügung stehen; sie ist nicht anwendbar
    bei unklarer Zivilbevölkerung oder wenn höhere Befehlsinstanzen ausdrücklich eine Genehmigung verlangen.
