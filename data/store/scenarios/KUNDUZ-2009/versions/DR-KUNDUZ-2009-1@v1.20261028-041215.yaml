case:
  id: DR-KUNDUZ-2009-1@v1
  title: Declaration of Troops‑in‑Contact Based on Imminent Threat
  status: draft
  setting: Kunduz Provincial Reconstruction Team, Afghanistan, night of 3–4 September 2009, ISAF operational environment
  decider: the regional reconstruction‑team commander
  agent: the regional reconstruction‑team commander
  agent_role: decide
  situation: The Joint Terminal Attack Controller requested close air support for the Kunduz PRT. The ISAF air support operations
    centre said that such support would only be granted if an imminent‑threat condition existed and a troops‑in‑contact (TIC)
    situation was declared. The commander, believing that a large armed group and fuel tankers a few kilometres away posed
    an imminent threat, ordered the JTAC to declare a TIC despite no own troops being present on the sandbank. The JTAC subsequently
    declared a TIC at 01:04, leading to the provision of air support.
  question: What should the regional reconstruction‑team commander do regarding declaring a troops‑in‑contact situation based
    on an imminent‑threat assessment when no own troops are in contact, in order to obtain air support?
  options:
    O1:
      do: The commander withholds a troops‑in‑contact declaration.
      move: act
      irreversible: false
    O2:
      do: The commander asks higher headquarters for clarification.
      move: ask
      irreversible: false
    O3:
      do: The commander declares a troops‑in‑contact situation.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The JTAC requested close air support for the Kunduz PRT.
  - id: F2
    kind: authority
    status: confirmed
    fact: The ASOC stated that air support would be granted only if an imminent threat existed and a troops‑in‑contact situation
      was declared.
  - id: F3
    kind: authority
    status: confirmed
    fact: The commander ordered the JTAC to declare a TIC based on an imminent‑threat assessment.
  - id: F4
    kind: situation
    status: confirmed
    fact: No own troops were present on the sandbank at the time of the request.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A large group of armed Taliban and fuel tankers were a few kilometres from the PRT, creating a concrete threat.
  - id: F6
    kind: capability
    status: assessed
    fact: The commander believed that without a TIC declaration air support would not be granted, endangering soldiers and
      civilians.
  - id: F7
    kind: authority
    status: assessed
    fact: ISAF rules of engagement allowed a TIC declaration either for direct contact or for an imminent threat, but the
      interpretation was ambiguous.
  - id: F8
    kind: situation
    status: confirmed
    fact: The JTAC declared a troops‑in‑contact situation at 01:04.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: ISAF rules of engagement permitted a TIC declaration either for direct contact or for an imminent threat; the commander
      interpreted the latter as valid.
  - id: C2
    facts:
    - F5
    - F6
    - F8
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: Without a TIC declaration no close air support would be granted, endangering the PRT personnel, Afghan security forces
      and nearby civilians.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The imminent threat required a rapid response; delaying for further clarification would have jeopardised the mission’s
      protective objective.
  - id: C4
    facts:
    - F3
    - F2
    equity: chain_of_command
    favors:
    - O3
    weight: weak
    why: The commander acted within his delegated authority to order the JTAC; no higher‑level prohibition was cited.
  - id: C5
    facts:
    - F5
    equity: civilian_life
    favors:
    - O3
    weight: weak
    why: The presence of a large armed group and fuel tankers posed a concrete risk to nearby civilians; the air strike was
      seen as a precautionary measure.
  reasoning:
    read: The situation involved no own troops physically in contact on the sandbank, yet a sizable hostile force and fuel‑laden
      vehicles nearby created an imminent threat. The commander interpreted the ISAF ROE to allow a TIC declaration on that
      basis, risking a mis‑characterisation of the factual state.
    weighing: The Bundestag Untersuchungsausschuss weighed the commander’s good‑faith interpretation of the ‘imminent threat’
      clause (C1) against the imperative to protect his forces and civilians (C2, C3). Although the ROE were ambiguous, the
      committee found the balance tipped toward declaring a TIC because the alternative would have left the PRT exposed. The
      weaker concerns about chain‑of‑command propriety (C4) and civilian risk (C5) did not outweigh the protective need.
    tradecraft: The commander should document the TIC declaration, citing the imminent‑threat assessment, the JTAC’s confirmation,
      and the ASOC’s request. The record must be filed with the ISAF operations centre and the PRT command for later review.
    uncertainty: The definition of ‘imminent threat’ in the ISAF ROE was not unequivocal; the committee noted that the rule
      was later amended, reflecting the ambiguity at the time of the decision.
    handoff: The decision was taken by the regional reconstruction‑team commander after consulting the JTAC; no higher headquarters
      was involved because time pressure precluded waiting for clarification.
    tempting_wrong:
      option: O1
      pull: Withholding a TIC would avoid any possible falsification of the contact status.
      why_wrong: It would have denied urgently needed air support, increasing the risk to own troops and civilians.
    rejected:
      O1: Withholding the TIC would have left the PRT without protection against a clear imminent threat.
      O2: Seeking higher‑headquarters clarification would have caused unacceptable delay in a time‑critical situation.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: No credible imminent threat existed (e.g., no armed group or fuel tankers nearby).
      then: O1
      why: Without an imminent threat the justification for a TIC disappears, making a false declaration unlawful.
    would_not_change:
    - id: noflip1
      if: Higher‑headquarters clarification was unavailable within the required time window.
      why: The commander still needed to act to protect forces; the decision to declare a TIC remains appropriate.
    watch_for:
    - id: watch1
      what: Future reliance on the ‘imminent threat’ clause to create TICs without direct contact.
      favors:
      - O1
      why: Repeated expansive interpretations could erode ROE credibility and increase risk of unlawful strikes.
  lesson: When ROE allow a TIC declaration for an imminent threat, commanders may lawfully invoke that clause to obtain air
    support, provided the threat assessment is credible and documented. Ambiguities in the rule must be recorded and justified
    to preserve accountability.
  limits: This reasoning applies only where the ROE explicitly include an ‘imminent threat’ provision and where the commander
    has credible intelligence of a near‑term hostile action. It does not justify TIC declarations in the absence of any threat
    or where civilian harm would be disproportionate.
