      irreversible_flags:
        O1: false
        O2: false
        O3: true
verdict_tier: source-endorsed
basis: The Bundestag Untersuchungsausschuss, majority evaluation (Drucksache 17/7400), concluded that the commander acted
  in good faith under time pressure and that his interpretation of the ISAF rules was understandable, thereby endorsing the
  declaration of a troops‑in‑contact situation.
