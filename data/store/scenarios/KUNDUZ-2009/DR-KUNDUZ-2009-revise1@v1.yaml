case:
  id: DR-KUNDUZ-2009-revise1@v1
  title: Declaration of Troops‑in‑Contact Based on Imminent Threat [revise]
  status: needs_review
  setting: Kunduz Provincial Reconstruction Team, Afghanistan, night of 3–4 September 2009, under ISAF command
  decider: the commander of the Provincial Reconstruction Team
  agent: the commander
  agent_role: decide
  situation: At night, the joint terminal attack controller requested close air support for the reconstruction team. The air
    support operations centre said that support would only be granted if a troops‑in‑contact (TIC) situation was declared
    based on an imminent threat. No own troops were physically in contact with the enemy on the sandbank, but a large armed
    group and fuel tankers were a few kilometres away, creating a perceived imminent threat. The commander believed that without
    a TIC declaration the air support would be denied, endangering his forces and Afghan partners. ISAF rules of engagement
    permitted a TIC declaration for troops in contact or for an imminent threat, but the interpretation was not clear. The
    commander was under time pressure and limited air assets were available.
  question: What should the commander do regarding declaring a troops‑in‑contact situation?
  options:
    O1:
      do: The commander holds the decision for intel.
      move: hold
      irreversible: false
    O2:
      do: The commander declares a troops‑in‑contact situation.
      move: act
      irreversible: true
    O3:
      do: The commander asks higher headquarters for clarification.
      move: ask
      irreversible: false
      to: higher headquarters
    O4:
      do: The commander withholds a troops‑in‑contact declaration.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The joint terminal attack controller requested close air support for the reconstruction team.
  - id: F2
    kind: authority
    status: confirmed
    fact: The air support operations centre said air support would only be granted if a troops‑in‑contact situation was declared
      due to an imminent threat.
  - id: F3
    kind: authority
    status: confirmed
    fact: The commander ordered the joint terminal attack controller to declare a troops‑in‑contact situation based on an
      imminent threat.
  - id: F4
    kind: situation
    status: confirmed
    fact: No own troops were physically in contact with the enemy on the sandbank at that time.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A large group of armed insurgents and fuel tankers were a few kilometres from the reconstruction team, representing
      a concrete threat.
  - id: F6
    kind: capability
    status: assessed
    fact: The commander believed that without declaring a troops‑in‑contact situation, air support would be denied, endangering
      his forces and Afghan security forces.
  - id: F7
    kind: authority
    status: assessed
    fact: ISAF rules of engagement allowed a troops‑in‑contact declaration for troops in contact or for an imminent threat,
      but the interpretation was ambiguous.
  - id: F8
    kind: situation
    status: assessed
    fact: The commander was under time pressure and limited air assets were available.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: bar
    why: ISAF rules of engagement permit a TIC declaration only for troops in contact or an imminent threat, but the source
      judges the interpretation was ambiguous and the commander’s reading departed from the directives.
    rules_out:
    - O2
  - id: C2
    facts:
    - F4
    equity: chain_of_command
    favors:
    - O3
    weight: strong
    why: No own forces were physically in contact, so the commander lacks the factual basis to declare a TIC; the appropriate
      response is to seek higher-headquarters clarification before any declaration.
  - id: C3
    facts:
    - F5
    - F6
    equity: complicity_risk
    favors:
    - O4
    weight: strong
    why: Declaring a TIC without contact would have enabled air support that could violate the law of armed conflict and cause
      unlawful civilian harm.
  - id: C4
    facts:
    - F8
    equity: tempo
    favors:
    - O3
    weight: weak
    why: Time pressure and limited air assets make rapid clarification essential to avoid an illegal TIC declaration and to
      preserve operational safety.
  reasoning:
    read: The JTAC needs close air support, but the ASOC will only provide it if a troops-in-contact (TIC) status is declared.
      No own troops are actually engaged, while a sizable insurgent force nearby creates an imminent threat.
    weighing: The strong chain-of-command consideration (C2) now points to seeking clarification, and the tempo consideration
      (C4) adds weight to that choice. Together they outweigh the temptation to fabricate a TIC, even under pressure.
    tradecraft: The commander radios higher headquarters, requests an official clarification on whether an imminent threat
      alone satisfies the TIC definition, documents the request, and pauses any declaration pending guidance.
    uncertainty: The ROE wording is ambiguous regarding an imminent-threat-only TIC, creating genuine uncertainty that must
      be resolved by higher authority.
    handoff: Responsibility for the final TIC determination is transferred to higher headquarters; the commander will act
      on the clarification received.
    tempting_wrong:
      option: O2
      pull: The urgent need for close air support to protect forces and Afghan partners.
      why_wrong: Fabricating a TIC breaches ISAF ROE, risks unlawful civilian harm, and undermines mission legitimacy.
    rejected:
      O1: Holding for further intelligence does not address the legal requirement for a genuine TIC and still leaves the unit
        exposed.
      O2: Declaring a TIC without actual contact violates the ROE and the chain-of-command duty to seek proper authorization.
      O4: Withholding a TIC without clarification ignores the commander's responsibility to resolve ROE ambiguity before making
        a legally binding status decision.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Actual troops of the PRT were in direct fire with the enemy on the sandbank.
      then: O4
      why: A genuine TIC would be justified, removing the need for clarification.
    would_not_change:
    - id: noflip1
      if: The commander remained under time pressure but still lacked any troops-in-contact.
      why: Time pressure does not override the legal requirement for a genuine TIC.
    watch_for:
    - id: watch1
      what: A formal clarification from ISAF higher headquarters that an imminent threat alone satisfies the TIC definition.
      favors:
      - O2
      why: Such a clarification would remove the ambiguity that the source identified.
  lesson: When ROE are ambiguous, commanders must seek higher-headquarters clarification rather than fabricate status, even
    under severe time pressure.
  limits: Applies where the ROE tie a TIC to actual contact or a clearly defined imminent threat; does not extend to situations
    where the ROE are silent or expressly allow threat-based authorizations.
