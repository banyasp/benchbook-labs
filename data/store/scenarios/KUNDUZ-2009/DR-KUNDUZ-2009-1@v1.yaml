case:
  id: DR-KUNDUZ-2009-1@v1
  title: Declaration of Troops‑in‑Contact Based on Imminent Threat
  status: draft
  setting: Kunduz Provincial Reconstruction Team, Afghanistan, night of 3–4 September 2009, under ISAF command
  decider: the commander of the Provincial Reconstruction Team
  agent: the commander
  agent_role: decide
  situation: At night, the joint terminal attack controller requested close air support for the reconstruction team. The air
    support operations centre said that support would only be granted if a troops‑in‑contact (TIC) situation was declared
    based on an imminent threat. No own troops were physically in contact with the enemy on the sandbank, but a large armed
    group and fuel tankers were a few kilometres away, creating a perceived imminent threat. The commander believed that without
    a TIC declaration the air support would be denied, endangering his forces and Afghan partners. ISAF rules of engagement
    permitted a TIC declaration for troops in contact or for an imminent threat, but the interpretation was not clear. The
    commander was under time pressure and limited air assets were available.
  question: What should the commander do regarding declaring a troops‑in‑contact situation?
  options:
    O1:
      do: The commander holds the decision for intel.
      move: hold
      irreversible: false
    O2:
      do: The commander declares a troops‑in‑contact situation.
      move: act
      irreversible: true
    O3:
      do: The commander asks higher headquarters for clarification.
      move: ask
      irreversible: false
      to: higher headquarters
    O4:
      do: The commander withholds a troops‑in‑contact declaration.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The joint terminal attack controller requested close air support for the reconstruction team.
  - id: F2
    kind: authority
    status: confirmed
    fact: The air support operations centre said air support would only be granted if a troops‑in‑contact situation was declared
      due to an imminent threat.
  - id: F3
    kind: authority
    status: confirmed
    fact: The commander ordered the joint terminal attack controller to declare a troops‑in‑contact situation based on an
      imminent threat.
  - id: F4
    kind: situation
    status: confirmed
    fact: No own troops were physically in contact with the enemy on the sandbank at that time.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A large group of armed insurgents and fuel tankers were a few kilometres from the reconstruction team, representing
      a concrete threat.
  - id: F6
    kind: capability
    status: assessed
    fact: The commander believed that without declaring a troops‑in‑contact situation, air support would be denied, endangering
      his forces and Afghan security forces.
  - id: F7
    kind: authority
    status: assessed
    fact: ISAF rules of engagement allowed a troops‑in‑contact declaration for troops in contact or for an imminent threat,
      but the interpretation was ambiguous.
  - id: F8
    kind: situation
    status: assessed
    fact: The commander was under time pressure and limited air assets were available.
  considerations:
  - id: C1
    facts:
    - F2
    - F7
    equity: lawful_authority
    favors:
    - O4
    weight: bar
    why: ISAF rules of engagement permit a TIC declaration only for troops in contact or an imminent threat, but the source
      judges the interpretation was ambiguous and the commander’s reading departed from the directives.
    rules_out:
    - O2
  - id: C2
    facts:
    - F4
    equity: chain_of_command
    favors:
    - O4
    weight: strong
    why: No own forces were physically in contact with the enemy, so the factual condition for a TIC was not satisfied.
  - id: C3
    facts:
    - F5
    - F6
    equity: complicity_risk
    favors:
    - O4
    weight: strong
    why: Declaring a TIC without contact would have enabled air support that could violate the law of armed conflict and cause
      unlawful civilian harm.
  - id: C4
    facts:
    - F8
    equity: tempo
    favors:
    - O4
    weight: weak
    why: Although the commander faced time pressure, the requirement to respect the ROE outweighs the desire for rapid action.
  reasoning:
    read: The situation was a classic trap of conflating an "imminent threat" with a "troops‑in‑contact" (TIC) status. The
      air‑support centre would only release assets if a TIC was declared, yet no own troops were actually engaged with the
      enemy on the sandbank.
    weighing: The source balances the strong considerations that the factual pre‑condition for a TIC was absent (C2) and that
      the ROE were breached (C1, C3) against the weaker pressure of time (C4). It concludes that the commander should have
      refrained from a false TIC declaration, even if it meant risking loss of air support.
    tradecraft: The commander records the decision to withhold the TIC, documents the reasoning, and files the report with
      the ASOC and higher headquarters, ensuring traceability and compliance with oversight requirements.
    uncertainty: Intelligence on the insurgent force was limited, but the lack of any own troops in contact removed the core
      factual element required for a legitimate TIC.
    handoff: The decision rests with the PRT commander; no higher‑headquarters clarification was required because the ROE
      were clear that a TIC could not be fabricated.
    tempting_wrong:
      option: O2
      pull: The desire to obtain close air support to protect forces and Afghan partners.
      why_wrong: Fabricating a TIC violates the ISAF rules of engagement and creates unlawful risk to civilians and the mission’s
        legitimacy.
    rejected:
      O1: Holding for further intelligence would not change the factual absence of contact and would delay needed protection.
      O2: Declaring a TIC without actual contact breaches the ROE and the source’s assessment of legality.
      O3: Asking higher headquarters would not have altered the rule that a TIC requires real contact; the commander could
        have awaited clarification but still should not have fabricated the status.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Actual troops of the PRT were in direct fire with the enemy on the sandbank.
      then: O2
      why: The factual condition for a TIC would be met, satisfying the ROE.
    would_not_change:
    - id: noflip1
      if: The commander remained under time pressure but still lacked any troops‑in‑contact.
      why: Time pressure does not override the legal requirement for a genuine TIC.
    watch_for:
    - id: watch1
      what: A formal clarification from ISAF higher headquarters that an imminent threat alone satisfies the TIC definition.
      favors:
      - O2
      why: Such a clarification would remove the ambiguity that the source identified.
  lesson: Commanders must adhere strictly to the defined conditions of a troops‑in‑contact declaration; ambiguous interpretations
    do not justify fabricating status to obtain air support. Legal authority and factual reality take precedence over operational
    urgency.
  limits: This rule applies only where the rules of engagement explicitly tie a TIC to actual contact or a clearly defined
    imminent threat, and does not extend to situations where the ROE are silent or allow broader threat‑based authorizations.
