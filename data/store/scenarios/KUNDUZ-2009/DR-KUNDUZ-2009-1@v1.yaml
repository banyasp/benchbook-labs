        O2: act
        O3: ask
        O4: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
        O3: false
        O4: true
verdict_tier: source-endorsed
basis: The Bundestag Untersuchungsausschuss majority concluded that the commander should have withheld a troops‑in‑contact
  declaration, as the ISAF rules of engagement did not support such a declaration without actual contact.
