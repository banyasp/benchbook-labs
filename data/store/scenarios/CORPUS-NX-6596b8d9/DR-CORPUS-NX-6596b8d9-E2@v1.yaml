case:
  id: DR-CORPUS-NX-6596b8d9-E2@v1
  title: OSS Wartime Command Design
  status: draft
  setting: Washington, D.C. and field units, during World War II, Office of Strategic Services
  decider: The OSS Director
  agent: The OSS Director
  agent_role: decide
  situation: The OSS was organized as a small organization with small teams supporting the wartime effort. Its headquarters
    in Washington, D.C., was intended to apply strategy to units in the field. Two-way communication between headquarters
    and field units was limited, partly by design and partly by communication-equipment limitations. The Director considered
    field commanders best positioned to make decisions in their theaters. The command design could be continued with field
    discretion or changed to a larger, more centralized structure.
  question: What should the OSS Director do about wartime command design?
  options:
    O1:
      do: The OSS Director should retain a small headquarters, keep two-way field communications limited, and leave operational
        decisions to field commanders.
      move: act
      irreversible: false
    O2:
      do: The OSS Director should enlarge headquarters, expand two-way field communications, and centralize operational decisions
        at headquarters.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The OSS began as a small organization by design.
  - id: F2
    kind: situation
    status: confirmed
    fact: The OSS used small teams across much of its organization.
  - id: F3
    kind: situation
    status: confirmed
    fact: The headquarters design was intended to apply strategy from Washington, D.C., to field units.
  - id: F4
    kind: capability
    status: confirmed
    fact: Two-way communication between headquarters and field units was limited, partly by design and partly by communication-equipment
      limitations.
  - id: F5
    kind: authority
    status: assessed
    fact: The Director considered field commanders best positioned to make decisions in their theaters.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Director stood by field commanders' decisions, including decisions he regarded as wrong.
  - id: F7
    kind: capability
    status: assessed
    fact: The organizational structure was considered flexible enough to adjust to objectives supporting the war effort.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The Director designed headquarters to remain small so it could stay agile while applying strategy to field units.
  - id: C2
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: With two-way communications limited, the Director believed field commanders were best positioned to make decisions
      in their theaters.
  - id: C3
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The small-team structure was considered flexible enough to adjust to objectives supporting the war effort, consistent
      with retaining a decentralized command design.
  reasoning:
    read: The choice is not simply between good communication and poor communication. The OSS used a small headquarters to
      apply strategy, while field communications were limited partly by design and partly by equipment. The trap is to treat
      that limitation alone as proof that a larger, centralized headquarters would work better, despite the Director's view
      that commanders in the field were best positioned to decide.
    weighing: The strongest reasons favoring {O1} are the intended agility of a small headquarters and the Director's assessment
      of field commanders' position to make theater decisions. The limited communications are a real constraint, but the source
      gives no reason to conclude that centralizing decisions would overcome it or better serve the mission. The balance depends
      on the small headquarters remaining able to apply strategy and commanders remaining best positioned to decide locally.
    tradecraft: Retain strategic direction from headquarters while leaving operational decisions to field commanders. Record
      the rationale for that allocation and reassess it if the headquarters can no longer apply strategy effectively or the
      field commanders' decision advantage changes.
    uncertainty: The source gives no comparative evidence about how a larger headquarters or expanded communications would
      have affected wartime performance. The recommendation therefore rests on the Director's stated design rationale and
      assessment, not a demonstrated comparison of outcomes.
    handoff: 'The OSS Director should decide: the design and allocation of command discretion are the decision at issue, and
      the source identifies no required referral or other decision-maker.'
    tempting_wrong:
      option: O2
      pull: A larger headquarters and more communication might appear to offer tighter coordination and control.
      why_wrong: 'That appeal is not supported by the stated reasons: the Director designed a small headquarters for agility
        and believed field commanders were best positioned to decide in their theaters.'
    rejected:
      O2: The Director did not choose centralization because the stated design priorities were headquarters agility and field
        commanders' position to make theater decisions.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The small headquarters could no longer apply strategy effectively to field units.
      then: O2
      why: That would undermine the stated rationale for keeping headquarters small and could support reconsidering a more
        centralized design.
    - id: flip2
      if: Field commanders were no longer best positioned to make decisions in their theaters.
      then: O2
      why: The Director's stated reason for leaving decisions to commanders would no longer hold.
    would_not_change:
    - id: noflip1
      if: Two-way communications remain limited, including because of equipment limitations.
      why: 'That condition alone would not overturn the choice: the design accommodated limited communications while relying
        on the Director''s assessment that field commanders were best positioned to decide.'
    watch_for:
    - id: watch1
      what: Whether headquarters remains agile enough to apply strategy and whether field commanders remain best positioned
        to decide in their theaters.
      favors:
      - O1
      - O2
      why: These are the conditions on which the Director's stated rationale for the command design depends.
  lesson: A limited ability to communicate does not by itself establish that command should be centralized. Match decision
    authority to the people best positioned to decide, while preserving the headquarters' ability to provide strategic direction.
  limits: This reasoning applies to the OSS wartime command design described here, not to every organization or mission. It
    does not establish that limited communications are generally desirable or that decentralization is appropriate when the
    field decision advantage or headquarters' ability to apply strategy is absent.
  library:
    domain: operational-command
    family: CORPUS-NX-6596b8d9
    source: https://jsouapplicationstorage.blob.core.windows.net/press/282/OSS_Symposium_Report_FINAL.pdf
    episode_focus: 'The decision point is the OSS wartime command design: retain a small headquarters with limited two-way
      communication and discretion for commanders, or use a larger, more centralized structure. The report says agility and
      the commanders’ position in the field supported the choice; exclude the separate allocation of propaganda functions,
      for which the passage does not give enough rationale.'
    cues:
      option_words:
        O1: 20
        O2: 16
      real_option: O1
      real_to_mean_other_length: 1.25
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
