case:
  id: DR-CORPUS-NX-acf8d9fa-E1@v1
  title: The Misidentified Hospital Ship
  status: draft
  setting: Gulf of Venice; British air operations during the Second World War; incident date unstated.
  decider: The controlling officer
  agent: The controlling officer
  agent_role: decide
  situation: Reports identified a vessel as a high-speed launch and gave two positions, one in the Gulf of Venice and another
    over the Istrian Peninsula. The controlling officer found no Allied high-speed launch at the first reported position,
    which was many miles from the Tübingen’s position. The vessel was a hospital ship, and standing orders prohibited attacks
    on hospital ships. One aircraft captain had identified the vessel as a hospital ship and assumed the leader had done so
    as well. The leader remained unaware of the vessel’s identity when the reported information came before the controlling
    officer.
  question: 'What should the controlling officer do: approve an attack on the reported vessel, reject an attack, or hold the
    decision pending clarification?'
  options:
    O1:
      do: The controlling officer approves an attack on the reported vessel.
      move: act
      irreversible: true
    O2:
      do: The controlling officer holds the attack decision pending clarification.
      move: hold
      irreversible: false
    O3:
      do: The controlling officer rejects an attack on the reported vessel.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Standing orders prohibited attacks on hospital ships.
  - id: F2
    kind: situation
    status: confirmed
    fact: The vessel was a hospital ship.
  - id: F3
    kind: intelligence
    status: assessed
    fact: One aircraft captain identified the vessel as a hospital ship and assumed the leader had identified it too.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The first report was received as identifying a high-speed launch at a position in the middle of the Gulf of Venice.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A later report gave a position over the Istrian Peninsula and again identified the vessel as a high-speed launch.
  - id: F6
    kind: situation
    status: confirmed
    fact: The controlling officer found no Allied high-speed launch at the first reported position, which was many miles from
      the Tübingen’s position.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The leader was still unaware that the vessel was a hospital ship when the decision to attack was presented to him.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The controlling officer found no Allied high-speed launch at the first reported position and nevertheless ordered
      an attack. This is the stated basis for the action taken, though the account does not explain why that finding supported
      attacking the reported vessel.
  - id: C2
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: protected_sites
    favors:
    - O2
    - O3
    weight: strong
    why: Standing orders prohibited attacks on hospital ships, and the vessel was one. An aircraft captain had identified
      it as a hospital ship, but assumed the leader had too; the leader remained unaware of its identity when the decision
      was presented.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The reports gave two different positions, including one over land, and both described a high-speed launch. The officer's
      finding that no Allied launch was at the first position did not resolve the vessel's identity or the location discrepancy.
  - id: C4
    facts:
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The hospital-ship identification known to one aircraft captain had not reached the leader's understanding at the
      decision point. The account does not establish whether that information was available to the controlling officer.
  reasoning:
    read: The reports presented a high-speed launch, but the vessel was a hospital ship protected by standing orders. The
      trap was treating the repeated launch label as a reliable identification despite the conflicting positions and the fact
      that the leader did not know the vessel's identity.
    weighing: The controlling officer's stated basis for the action was finding no Allied high-speed launch at the first reported
      position, after which he ordered an attack {C1}. The hospital-ship prohibition and the identification gap point toward
      withholding or rejecting an attack {C2}, while the unresolved report discrepancies favor clarification {C3}. The recorded
      outcome was nevertheless to attack; the account does not explain how the officer assessed those contrary considerations
      or whether he knew of the aircraft captain's identification.
    tradecraft: At the decision level, distinguish what the reports say from what has been verified; record the conflicting
      locations, the negative finding, and the basis for proceeding. Seek clarification from the reporting and controlling
      personnel before treating an unresolved identification as settled.
    uncertainty: The account describes the mistaken reporting and the order, but does not establish whether the controlling
      officer knew that one aircraft captain had identified a hospital ship. It also does not state that the officer expressly
      considered the standing order when making the engagement decision.
    handoff: The controlling officer held the decision. As a decision-practice safeguard, involve the personnel responsible
      for the reports and the leader to clarify the vessel's identity and the conflicting positions before deciding; the account
      does not say that such clarification was obtained.
    tempting_wrong:
      option: O1
      pull: The reports repeatedly described a high-speed launch, and the officer found no Allied launch at the first reported
        location.
      why_wrong: Those facts did not resolve whether the reported vessel was the hospital ship protected by standing orders,
        and the two reported positions were inconsistent.
    rejected:
      O2: The controlling officer did not hold for clarification; after finding no Allied high-speed launch at the first reported
        position, he ordered an attack.
      O3: The controlling officer did not reject the attack; the reports framed the vessel as a high-speed launch, and he
        ordered an attack after his negative finding at the first position.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The controlling officer had reliable confirmation before deciding that the vessel was a hospital ship.
      then: O3
      why: Standing orders prohibited attacks on hospital ships.
    - id: flip2
      if: The vessel's identity or location remained unresolved after the conflicting reports.
      then: O2
      why: A mismatch between the reported positions and the actual vessel would not establish a reliable basis to attack.
    would_not_change:
    - id: noflip1
      if: A further report merely repeated the high-speed-launch label without resolving the conflicting positions or identity.
      why: Repetition would not cure the report's unresolved identification and location problems.
    watch_for:
    - id: watch1
      what: Whether the hospital-ship identification known to the aircraft captain is communicated to the controlling officer.
      favors:
      - O3
      why: If confirmed to the decision-maker, the standing prohibition directly applies.
  lesson: A report's repeated classification does not resolve material conflicts in identity or location. Where standing orders
    protect a class of vessel, an unresolved identification should prompt clarification rather than being treated as proof
    that the prohibition is irrelevant.
  limits: This scenario concerns an engagement decision made on the reports described here, not a general rule that every
    conflicting report requires the same disposition. It does not establish what the controlling officer knew beyond the facts
    stated or supply a broader legal standard for attack decisions.
