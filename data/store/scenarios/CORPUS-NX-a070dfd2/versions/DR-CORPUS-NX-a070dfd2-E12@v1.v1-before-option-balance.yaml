case:
  id: DR-CORPUS-NX-a070dfd2-E12@v1
  title: Setting a Contested ICBM Estimate
  status: draft
  setting: United States intelligence community, 1961, national intelligence estimate on Soviet long-range ballistic missile
    forces.
  decider: The interagency intelligence estimators
  agent: The interagency intelligence estimators
  agent_role: decide
  situation: New information had strengthened the basis for estimating Soviet long-range ballistic missile forces, although
    significant gaps and alternative interpretations remained. The community estimate under consideration put current Soviet
    ICBM strength at 10–25 launchers. The Assistant Chief of Staff, Intelligence, USAF, held a substantially higher assessment
    of about 50 operational launchers in mid-1961. The two assessments rested on differing judgments about the evidence and
    the extent of deployment activity. The interagency estimators had to settle the current force estimate for the assessment.
  question: What should the interagency intelligence estimators do in setting the current Soviet ICBM force estimate?
  options:
    O1:
      do: The interagency intelligence estimators raise the current estimate to about 50 launchers and issue it.
      move: act
      irreversible: false
    O2:
      do: The interagency intelligence estimators request further review of the current force estimate before issuing it.
      move: ask
      irreversible: false
      to: the intelligence offices
    O3:
      do: The interagency intelligence estimators lower the current estimate to 10–25 launchers and issue it.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The available information provided a firmer basis for estimating Soviet long-range ballistic missile forces, while
      significant gaps and alternate interpretations remained.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Some areas previously suspected of containing ICBM deployment activity had not contained complexes by the summer
      of 1961, while activity could be underway in other, unsuspected areas.
  - id: F3
    kind: capability
    status: assessed
    fact: The community estimate under consideration placed current Soviet ICBM strength at 10–25 launchers capable of firing
      against the United States.
  - id: F4
    kind: capability
    status: assessed
    fact: The Assistant Chief of Staff, Intelligence, USAF, assessed that the Soviets had about 50 operational ICBM launchers
      in mid-1961.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The USAF assessment relied on the first-generation system's early availability and performance, continued test firings,
      and the view that Soviet foreign policy indicated substantial ICBM capability.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The community analysis assessed that coverage of test activity and potential deployment areas supported the judgment
      that only a few ICBM complexes were operational or under construction.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Assistant Chief of Staff, Intelligence, USAF, did not concur in the community's ICBM force-level estimate.
  considerations:
  - id: C1
    facts:
    - F1
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The new information gave the estimate a firmer basis than before, while the acknowledged gaps and alternate interpretations
      counsel against claiming greater certainty than the evidence supports.
  - id: C2
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The community judged its coverage of test activity and potential deployment areas adequate to support the conclusion
      that only a few complexes were operational or under construction.
  - id: C3
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Previously suspected areas had sometimes proved negative, and other activity might be in unsuspected areas; this
      limits confidence in the count, though the community still judged its coverage adequate for an estimate.
  - id: C4
    facts:
    - F4
    - F5
    - F7
    equity: analytic_integrity
    favors:
    - O1
    - O2
    weight: weak
    why: The USAF intelligence official disagreed and relied on the first-generation system's availability and performance,
      continued firings, and an inference from Soviet foreign policy; this is a genuine competing assessment, but the community's
      stated estimate rested on its coverage and deployment analysis.
  reasoning:
    read: The decision was how to express current force levels from incomplete but improved intelligence, not how to resolve
      uncertainty by adopting the more alarming figure. The trap is treating evidence of missile development or an inference
      from foreign policy as equivalent to evidence establishing a larger current operational force.
    weighing: The firmer evidentiary base and the community's judgment that coverage supported only a few operational or developing
      complexes favor issuing the 10–25 estimate {C1} {C2}. The possibility of missed activity and the USAF's contrary assessment
      remain relevant, but do not outweigh the community's stated assessment that its coverage supported the estimate {C3}
      {C4}. The balance depends on whether coverage is adequate and what it supports about current deployment, not on eliminating
      every intelligence gap.
    tradecraft: Issue the estimate as a range, preserve the stated uncertainty and the reasons for it, and record the USAF
      dissent rather than presenting the judgment as unanimous. This is a decision-practice synthesis, not a procedure specified
      in the assessment.
    uncertainty: Significant gaps and alternate interpretations remained, including the possibility that activity existed
      in areas not yet suspected. The 10–25 range accommodates uncertainty about the number of complexes and launchers; it
      is not a claim of exact knowledge.
    handoff: The interagency estimators should settle the estimate while preserving the USAF intelligence official's recorded
      disagreement. The assessment records no referral to a higher authority; this handoff description is a synthesis of the
      documented decision and dissent.
    tempting_wrong:
      option: O1
      pull: The USAF assessment of about 50 launchers had a stated rationale based on the first-generation system's availability
        and performance, test firings, and Soviet foreign policy.
      why_wrong: Those considerations formed a serious dissent, but the community judged its coverage and deployment evidence
        sufficient to support the lower current estimate; the assessment does not adopt the higher assessment.
    rejected:
      O1: The community did not adopt the USAF's higher estimate because its own assessment judged the available coverage
        and deployment evidence to support only a few operational or developing complexes.
      O2: The community acknowledged gaps and alternate interpretations but judged its coverage adequate to issue a current
        estimate rather than defer it for further review.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable new evidence established that several additional complexes were operational and equipped to contribute
        to the current force.
      then: O1
      why: A materially larger verified current force would undermine the evidentiary basis for the 10–25 estimate.
    - id: flip2
      if: Review showed that coverage of potential deployment areas could not support a responsible current force estimate.
      then: O2
      why: If the community's stated basis for estimating only a few complexes failed, further review would be preferable
        to issuing that estimate.
    would_not_change:
    - id: noflip1
      if: The USAF dissent remained on record but no materially different evidence about current deployment emerged.
      why: Disagreement alone would not displace the community's stated judgment about what its evidence and coverage supported.
    watch_for:
    - id: watch1
      what: Evidence that changes the assessment of whether additional, previously unsuspected areas contain current deployment
        activity.
      favors:
      - O1
      - O2
      why: The assessment recognizes that activity could exist in unsuspected areas, so new information there could either
        raise the estimate or make further review necessary.
  lesson: A force estimate should follow the evidence judged adequate for the question at hand, while representing uncertainty
    rather than concealing it. A serious dissent deserves a clear record, but disagreement does not by itself require deferral
    or control the estimate.
  limits: This reasoning applies to the source's analytic choice about the current force estimate, not to later force projections
    or operational decisions. It depends on the community's own judgment that its intelligence coverage was adequate to support
    the estimate.
