case:
  id: DR-CORPUS-NX-4a5cc316-E3@v1
  title: Leahy Law Waiver for Colombia
  status: draft
  setting: Colombia, 1998, U.S. executive branch.
  decider: The President
  agent: The President
  agent_role: decide
  situation: U.S. funding was barred for foreign military units with credible evidence of gross human-rights violations, subject
    to specified waiver conditions. The Department of State had withheld substantial aid from the Colombian Army, and no waivers
    had initially been granted for Colombia. Colombian Army leaders objected to the restrictions, which officers viewed as
    unjust and insulting to their national honor; the leadership had refused American assistance for a time. Some senior U.S.
    officials sympathized with the Colombian military’s objections and considered congressional expectations unrealistic.
    The military situation in Colombia worsened during 1998 as the insurgent threat intensified.
  question: What should the President do about granting a national-security waiver from Leahy Law aid restrictions for Colombia
    in 1998?
  options:
    O1:
      do: The President denies Colombia a national-security waiver under the Leahy Laws.
      move: act
      irreversible: false
    O2:
      do: The President grants Colombia a national-security waiver under the Leahy Laws.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Leahy Laws barred U.S. funding for a foreign military unit when credible evidence showed that the unit had committed
      gross violations of human rights.
  - id: F2
    kind: authority
    status: confirmed
    fact: The statutory provisions allowed waivers if the local government was acting to bring perpetrators to justice or
      vital U.S. national-security interests were at stake.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Department of State used the Leahy Laws to withhold substantial aid from the Colombian Army.
  - id: F4
    kind: situation
    status: confirmed
    fact: No waivers under the Leahy Laws were initially granted for Colombia.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Colombian Army’s top leadership objected to the Leahy Laws and, for a time, refused American assistance; many
      Colombian officers considered the laws and vetting procedures unjust and insulting to national honor.
  - id: F6
    kind: situation
    status: assessed
    fact: Some senior American officials sympathized with the Colombian military’s objections and believed the laws reflected
      unrealistic expectations among U.S. members of Congress.
  - id: F7
    kind: situation
    status: assessed
    fact: A senior State Department official argued that transforming military and police forces to meet human-rights and
      civil-liberties norms was exceptionally difficult while they faced hostile forces that disregarded those constraints.
  - id: F8
    kind: situation
    status: confirmed
    fact: The military situation in Colombia worsened dramatically in 1998.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The law barred funding for units with credible evidence of gross human-rights violations but allowed a waiver when
      vital U.S. national-security interests were at stake. The President therefore had statutory authority to grant a waiver
      on that ground.
  - id: C2
    facts:
    - F2
    - F8
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The stated ground for the waiver was that supporting Colombia was vital to U.S. national security, while the military
      situation worsened dramatically in 1998.
  - id: C3
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: A senior State Department official argued that transforming forces to meet human-rights and civil-liberties norms
      was exceptionally difficult while they faced hostile forces that disregarded those constraints; the worsening situation
      lent weight to that argument.
  - id: C4
    facts:
    - F1
    - F3
    equity: complicity_risk
    favors:
    - O1
    weight: strong
    why: The restrictions addressed credible evidence of gross human-rights violations, and the Department of State had withheld
      substantial aid under them. A national-security rationale did not make the underlying human-rights concern disappear.
  - id: C5
    facts:
    - F5
    - F6
    equity: norm_reciprocity
    favors:
    - O2
    weight: weak
    why: The Colombian Army’s objections and temporary refusal of assistance, together with some senior U.S. officials’ sympathy
      for those objections, showed that the restrictions carried significant relationship costs. Those costs supported reconsidering
      sweeping restrictions but did not by themselves establish the statutory waiver ground.
  reasoning:
    read: 'This was a discretionary statutory exception to a human-rights funding restriction, not a choice between protecting
      human rights and disregarding them altogether. The central trap is treating the national-security waiver as if it erased
      the unit-level concern: the waiver prevented sweeping aid cuts while some individuals and units remained denied assistance.'
    weighing: The national-security ground and worsening conditions carried the balance toward {O2}, and President Clinton
      treated support for Colombia as vital to U.S. national security. The human-rights restriction remained a serious counterweight,
      with some individuals and units continuing to be denied assistance. The balance depends on the national-security interest
      being vital, rather than on the Colombian Army’s objections alone.
    tradecraft: State the statutory national-security basis for the waiver and preserve the distinction between granting a
      country-level waiver and making unit-level assistance decisions. Record the basis and keep any continuing unit exclusions
      explicit so that the waiver is not treated as a finding that human-rights concerns have been resolved.
    uncertainty: The extent of the President’s assessment of the security threat and the underlying human-rights evidence
      for particular units is not specified. The stated rationale is that support for Colombia was vital to U.S. national
      security, amid a worsening military situation.
    handoff: The President makes the waiver decision under the statutory authority. Relevant State Department and national-security
      assessments can inform the decision and its record.
    tempting_wrong:
      option: O1
      pull: Maintaining the aid restrictions gives full weight to the law’s human-rights purpose and avoids support to units
        implicated in gross violations.
      why_wrong: It would discount the statutory national-security waiver and the President’s stated judgment that support
        for Colombia was vital, despite the worsening situation.
    rejected:
      O1: The President did not maintain the sweeping restrictions because the stated vital national-security interest and
        worsening situation justified granting the waiver.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The President no longer assessed vital U.S. national-security interests to be at stake, and the local government
        was not acting to bring perpetrators to justice.
      then: O1
      why: Without either stated basis for a waiver, the statutory human-rights funding restriction would weigh against granting
        one.
    would_not_change:
    - id: noflip1
      if: Colombian Army leaders continued to regard the vetting rules as unjust or insulting to national honor.
      why: Those objections alone do not satisfy either statutory waiver condition or remove the human-rights concern.
    watch_for:
    - id: watch1
      what: Whether the President continues to assess support for Colombia as vital to U.S. national security.
      favors:
      - O2
      why: That was the stated statutory ground for the waiver.
  lesson: When a statute creates a national-security waiver from a human-rights restriction, assess whether the stated security
    threshold is met while keeping the underlying rights concern visible. A waiver can address a vital national interest without
    treating every implicated unit as eligible for assistance.
  limits: This reasoning applies to the 1998 decision and its stated national-security rationale; it does not establish that
    a waiver is appropriate whenever an insurgent threat worsens. It also does not resolve the human-rights status of any
    particular unit.
