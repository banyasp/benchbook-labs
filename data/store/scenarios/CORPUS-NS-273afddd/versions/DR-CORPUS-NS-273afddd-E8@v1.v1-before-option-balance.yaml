case:
  id: DR-CORPUS-NS-273afddd-E8@v1
  title: Section 702 Procedure Review
  status: draft
  setting: Foreign Intelligence Surveillance Court, April 21, 2022, review of the Section 702 2021 certification.
  decider: The FISC
  agent: The FISC
  agent_role: decide
  situation: The FISC is reviewing proposed Section 702 targeting, minimization, and querying procedures under the Fourth
    Amendment. The government’s interest in obtaining foreign intelligence to protect national security is substantial, while
    the procedures may affect U.S.-person privacy interests in the aggregate. U.S.-person queries can retrieve information
    about people who were not Section 702 targets, and can expose private information or be used in investigations unrelated
    to national security. The procedures include protections for minimizing, retaining, using, and disclosing U.S.-person
    information. The FBI had a record of misunderstandings and persistent querying problems, and the assessment of its likely
    implementation depended on the anticipated efficacy of improvement measures. The FISC is considering the procedures together,
    while a Second Circuit decision has treated certain U.S.-person queries as separate Fourth Amendment events.
  question: What should the FISC do about the proposed procedures in its Section 702 Fourth Amendment review?
  options:
    O1:
      do: The FISC should approve the procedures as written.
      move: act
      irreversible: false
    O2:
      do: The FISC should defer ruling pending further evidence.
      move: hold
      irreversible: false
    O3:
      do: The FISC should reject the procedures as written.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The constitutional assessment balances the degree of privacy intrusion against the need to promote legitimate governmental
      interests, with national-security foreign-intelligence gathering described as a particularly intense interest.
  - id: F2
    kind: capability
    status: confirmed
    fact: The targeting procedures are designed to focus on persons reasonably believed to be non-U.S. persons located outside
      the United States.
  - id: F3
    kind: situation
    status: assessed
    fact: The government reported an estimated 202,723 Section 702 targets in 2020, and the aggregate acquisitions were understood
      to involve a substantial number of U.S.-person privacy interests, including communications with Section 702 targets.
  - id: F4
    kind: capability
    status: confirmed
    fact: The minimization rules are designed to minimize acquisition and retention of private U.S.-person information and
      restrict its dissemination, including limits on identifying a U.S. person in certain disclosures.
  - id: F5
    kind: situation
    status: confirmed
    fact: U.S.-person queries can retrieve information about people who were not Section 702 targets and can cause an additional
      privacy intrusion; use to identify evidence of crimes unrelated to national-security threats raises additional Fourth
      Amendment concerns.
  - id: F6
    kind: situation
    status: confirmed
    fact: The FBI had experienced fundamental misunderstandings of querying requirements since 2018, and querying problems
      in September 2021 were characterized as substantial and persistent.
  - id: F7
    kind: capability
    status: assessed
    fact: The FBI had adopted measures to improve querying practices, and their likely efficacy was material to assessing
      how the procedures would be implemented.
  - id: F8
    kind: situation
    status: confirmed
    fact: An earlier FISC review found that the FBI's querying and minimization procedures were inconsistent with Fourth Amendment
      requirements because broad, suspicionless queries were likely.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Second Circuit held that querying Section 702 information to retrieve information about particular U.S. persons
      should be treated as a separate Fourth Amendment event, while the FISC's review considers the reasonableness of the
      procedures as a whole.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Fourth Amendment balance weighs privacy intrusion against the need for legitimate governmental interests. The
      Court regarded foreign-intelligence gathering to safeguard national security as especially weighty, and found that foreign-focused
      targeting was designed to limit acquisition to people reasonably believed to be non-U.S. persons abroad.
  - id: C2
    facts:
    - F3
    - F4
    equity: usp_privacy
    favors:
    - O1
    weight: strong
    why: The Court recognized that acquisitions implicate U.S.-person privacy interests substantially in the aggregate. It
      also found that minimization and related protections limit acquisition and retention of private information and restrict
      identifying disclosures; protections of this kind can weigh considerably, even decisively, in the reasonableness balance.
  - id: C3
    facts:
    - F5
    - F8
    - F9
    equity: usp_privacy
    favors:
    - O2
    - O3
    weight: strong
    why: Queries can expose information about U.S. persons who were not targets, create an additional privacy intrusion, and
      raise particular concerns when used for unrelated criminal investigations. The earlier finding about broad, suspicionless
      FBI queries underscores that these concerns require meaningful review. The Court acknowledged the Second Circuit's separate-event
      approach but adhered, for this review, to assessing the procedures as a whole.
  - id: C4
    facts:
    - F6
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    - O2
    - O3
    weight: strong
    why: The FBI's history of fundamental misunderstandings and persistent querying problems makes approval dependent on whether
      improvement measures are likely to work. The Court based its favorable assessment on its evaluation of those measures'
      likely efficacy, while warning that continued violations could create greater statutory and constitutional difficulties.
  reasoning:
    read: This is a totality-of-the-circumstances review of privacy intrusion against an exceptionally important foreign-intelligence
      interest, not a conclusion that foreign targeting eliminates U.S.-person privacy concerns. The aggregate impact and
      the additional intrusion possible through queries are real. The trap is either to discount those interests because the
      targeting is foreign-directed or to treat the separate-event approach as controlling this FISC review; the Court instead
      examined the combined procedures while taking query risks seriously.
    weighing: The Court concluded that foreign-focused targeting, minimization protections, and querying safeguards, considered
      together, adequately guarded against error and abuse in light of the interests at stake. That judgment depends materially
      on the likely efficacy of the FBI's improvement measures, given its history of serious querying problems. The Court
      did not regard imperfect implementation or some potential for error as alone sufficient to invalidate the procedures,
      but warned that unabated violations or unrealized improvements could make continued approval untenable.
    tradecraft: 'State the constitutional balance and the combined-procedures basis for approval, including the reliance on
      expected FBI improvements. Preserve the Court''s warning as an implementation condition: the government should monitor
      whether the measures are effective and act proactively if problems persist.'
    uncertainty: The outcome rests in part on a forward-looking assessment of improvement measures, against a record of persistent
      misunderstandings and querying problems. The Court acknowledged that this reliance cannot continue indefinitely if promised
      improvements remain unrealized.
    handoff: The FISC makes the review decision. The government is responsible for monitoring the effectiveness of its measures
      and implementing additional ones if problems persist.
    tempting_wrong:
      option: O3
      pull: The substantial aggregate privacy impact, risks from U.S.-person queries, and the FBI's prior record could support
        rejecting the procedures outright.
      why_wrong: 'The Court did not treat those concerns as dispositive in isolation: it assessed the protections together
        and found them adequate based on the likely efficacy of the improvement measures, while expressly reserving the possibility
        that continued violations would change the assessment.'
    rejected:
      O2: The Court did not defer because it concluded, based on its assessment of the improvement measures' likely efficacy,
        that the procedures as written and likely to be implemented met the constitutional standard.
      O3: The Court found that the combined targeting, minimization, and querying safeguards adequately guarded against error
        and abuse under the circumstances, rather than finding them inadequate at this review.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The scope and pervasiveness of FBI querying violations continue unabated.
      then: O3
      why: The Court warned that continued violations would present greater statutory and Fourth Amendment difficulties, and
        that there is a point at which it would be untenable to base sufficiency findings on improvements that remain unrealized.
    would_not_change:
    - id: noflip1
      if: Some potential for error remains despite efforts to improve implementation.
      why: The Court said that perfect implementation is unrealistic and that some potential for error alone is not a sufficient
        reason to invalidate procedures as unreasonable.
    watch_for:
    - id: watch1
      what: Whether the FBI's adopted measures effectively improve querying practices and whether querying problems persist.
      favors:
      - O2
      - O3
      why: The Court's findings depended on the likely efficacy of those measures and directed the government to monitor them
        and implement additional measures if problems persist.
  lesson: Balance the degree of privacy intrusion against the strength of the governmental interest, and assess the safeguards
    together when the governing review calls for a totality-of-the-circumstances inquiry. A favorable judgment that depends
    on corrective measures must remain responsive to whether those measures work; persistent, unremedied violations can make
    continued reliance on expected improvements untenable.
  limits: This reasoning concerns the FISC's review of the proposed Section 702 procedures under the Fourth Amendment and
    its decision to assess them as a whole. It does not resolve whether a U.S.-person query is a separate Fourth Amendment
    event in other proceedings, nor does it support approval if the improvements on which the Court relied prove ineffective
    and violations continue unabated.
