case:
  id: DR-CORPUS-NS-273afddd-E11@v1
  title: Section 702 Authorization Scope
  status: draft
  setting: Foreign Intelligence Surveillance Court, April 21, 2022, review of the Section 702 2021 Certification.
  decider: The Foreign Intelligence Surveillance Court
  agent: The Foreign Intelligence Surveillance Court
  agent_role: decide
  situation: The Court is reviewing proposed acquisitions under the Section 702 2021 Certification. Section 702(a) authorizes
    the Attorney General and the Director of National Intelligence to jointly authorize, for up to one year, targeting people
    reasonably believed to be outside the United States to acquire foreign intelligence information. Section 702(b) sets limits
    on who may be targeted, certain communications that may be intentionally acquired, and Fourth Amendment consistency. A
    certification must attest that the acquisition involves obtaining foreign intelligence information from or with the assistance
    of an electronic communication service provider. Section 702(f) establishes querying procedures for information collected
    under an authorization, including protections related to United States-person queries. Amicus contends that provisions
    concerning providers, queries, and legislative history support a narrower reading of what acquisitions Section 702 permits.
  question: What should the Court decide about whether Section 702 provides an available authorization route for the proposed
    acquisitions?
  options:
    O1:
      do: The Court should prohibit Section 702 from serving as an authorization route for the proposed acquisitions.
      move: act
      irreversible: false
    O2:
      do: The Court should permit Section 702 to serve as an authorization route for the proposed acquisitions.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Section 702(a) permits the Attorney General and the Director of National Intelligence jointly to authorize, for
      up to one year, targeting people reasonably believed to be outside the United States to acquire foreign intelligence
      information.
  - id: F2
    kind: authority
    status: confirmed
    fact: Section 702(b) bars intentionally targeting a person known to be in the United States, targeting a person abroad
      for the purpose of targeting a particular known person in the United States, and intentionally targeting a United States
      person reasonably believed to be abroad.
  - id: F3
    kind: authority
    status: confirmed
    fact: Section 702(b) bars intentionally acquiring communications when the sender and all intended recipients are known
      to be in the United States, bars certain communications that refer to but are not to or from a target, and requires
      Fourth Amendment consistency.
  - id: F4
    kind: authority
    status: confirmed
    fact: A Section 702 certification must attest that the acquisition involves obtaining foreign intelligence information
      from or with the assistance of an electronic communication service provider.
  - id: F5
    kind: situation
    status: confirmed
    fact: The proposed acquisition involves obtaining foreign intelligence information with the assistance of an electronic
      communication service provider.
  - id: F6
    kind: authority
    status: confirmed
    fact: Section 702(f) requires querying procedures for information collected under an authorization, consistent with Fourth
      Amendment requirements, and requires a record of each United States-person query term.
  - id: F7
    kind: authority
    status: confirmed
    fact: In narrowly delineated circumstances, the FBI must obtain a FISC order before accessing communications content retrieved
      by a query for a criminal investigation unrelated to national security.
  - id: F8
    kind: situation
    status: assessed
    fact: Amicus argued that the provider, querying, and reporting provisions support a narrower interpretation of the acquisitions
      Section 702 permits.
  - id: F9
    kind: situation
    status: confirmed
    fact: Amicus relied on legislative history in support of its interpretation of Section 702.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Section 702(a) authorizes targeting people reasonably believed to be outside the United States to acquire foreign
      intelligence information. The Court found that Section 702(b)'s express limits, read separately or together, did not
      impose the additional categorical restriction Amicus proposed.
  - id: C2
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: 'The ECSP requirement limits the information that may be acquired under Section 702: information obtainable from
      an entity that is not an ECSP cannot be acquired through this route. But the proposed acquisition involves ECSP assistance,
      and the Court found no basis to read that requirement as imposing Amicus''s further limitation.'
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: usp_privacy
    favors:
    - O2
    weight: strong
    why: The querying provisions provide additional protections for certain queries involving U.S.-person information. The
      Court read them as governing searches after acquisition, not as changing Section 702(a)'s authorization scope; it found
      no absurdity in applying each provision according to its terms.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Amicus offered substantial legislative-history evidence that legislators had not contemplated this application. The
      Court found no pertinent ambiguity in the enacted text and concluded that legislative-history silence could not override
      its plain meaning.
  reasoning:
    read: The issue is whether provider, querying, and related provisions narrow the acquisition authority in Section 702(a),
      not whether those provisions have independent force. The interpretive trap is treating safeguards for particular providers
      or later queries as an unstated categorical limit on what may be acquired.
    weighing: 'The Court gave controlling weight to Section 702(a)''s authorization language and the express limits in Section
      702(b): together they did not exclude the proposed acquisitions. The ECSP condition is a real limit, but these proposed
      acquisitions meet it; the querying provisions protect U.S.-person information after collection without altering the
      authorization language. The Court also relied on Section 702(a)''s “notwithstanding” clause and found that, when an
      acquisition meets Section 702''s terms, authorization under Section 702 is sufficient. Amicus''s legislative-history
      evidence did not overcome the enacted text. The conclusion depends on satisfying the statutory conditions, including
      the applicable targeting, acquisition, and Fourth Amendment limits.'
    tradecraft: 'State the holding narrowly: Section 702 is an available authorization route, not a blanket approval of every
      acquisition or later query. Record the statutory conditions separately from the conclusion that the cited provisions
      do not categorically bar this route.'
    uncertainty: The central statutory-availability question is resolved by the Court's interpretation. Whether every other
      certification and procedural requirement is satisfied is a separate review question.
    handoff: The FISC is the deciding authority on the statutory question presented. No additional decision-maker is identified
      as necessary for resolving this interpretation.
    tempting_wrong:
      option: O1
      pull: The provider, query, and legislative-history provisions can appear to signal that Congress intended a narrower
        acquisition authority.
      why_wrong: The Court found that the provider condition was met, that the querying provisions regulate searches rather
        than the scope of acquisition, and that legislative history could not displace the plain text.
    rejected:
      O1: The Court rejected a categorical prohibition because Section 702's text and structure did not exclude the proposed
        acquisitions when its conditions are met.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The acquisition did not involve obtaining foreign intelligence information from or with the assistance of an ECSP.
      then: O1
      why: The Court explained that Section 702 could not be used to acquire information from a non-ECSP under this requirement.
    - id: flip2
      if: The proposed acquisition failed an applicable Section 702(a) or 702(b) requirement, including the requirement of
        Fourth Amendment consistency.
      then: O1
      why: The Court's conclusion that Section 702 is sufficient is conditional on the acquisition being authorized in accordance
        with Section 702's terms.
    would_not_change:
    - id: noflip1
      if: Additional legislative-history evidence showed that legislators had not foreseen this application of Section 702.
      why: The Court reasoned that such history could not override the plain meaning of the enacted text.
    - id: noflip2
      if: The querying provisions were again cited as a reason to narrow acquisition authority.
      why: The Court treated those provisions as governing searches after acquisition and applied them according to their
        own terms.
    watch_for:
    - id: watch1
      what: Whether the acquisition complies with Section 702's express targeting, communications, and Fourth Amendment limits.
      favors:
      - O1
      why: The Court's conclusion that the route is available does not eliminate those statutory conditions.
  lesson: Read an authorization provision in its statutory context, but do not turn ancillary safeguards into unstated limits
    on acquisition when the text does not support that inference. A route that is legally available remains subject to its
    express statutory and constitutional conditions.
  limits: This conclusion addresses whether Section 702 is categorically available for the proposed acquisitions; it does
    not decide whether every certification, procedure, or individual acquisition satisfies all applicable requirements. It
    does not determine the scope of permissible querying beyond the provisions discussed.
