case:
  id: DR-CORPUS-NX-f729bf0b-E1@v1
  title: Protest Over Alleged POW Treatment
  status: draft
  setting: German Foreign Office, January 1945; alleged events near Kirchberg, Jülich, in November 1944.
  decider: The German Foreign Office
  agent: The German Foreign Office
  agent_role: decide
  situation: A sworn deposition alleged that German prisoners of war had been compelled to dig trenches near the American
    battle front at Kirchberg, Jülich, in November 1944. The deposition alleged that they worked under German artillery fire
    and that the resulting casualties included two dead and twenty wounded. The War Crimes Bureau recommended lodging a protest
    against the British and American governments, identifying Articles 7 and 9 of the 1929 POW Convention as relevant. The
    Wehrmacht operations staff passed the recommendation to the German Foreign Office. The Foreign Office must decide whether
    to transmit a formal protest, decline to do so, or seek further corroboration before deciding.
  question: What should the German Foreign Office do about the War Crimes Bureau's recommendation to lodge a formal protest?
  options:
    O1:
      do: The German Foreign Office should approve and transmit a formal protest to the British and American governments.
      move: act
      irreversible: true
    O2:
      do: The German Foreign Office should request further corroboration from the War Crimes Bureau before deciding on a formal
        protest.
      move: ask
      irreversible: false
      to: The War Crimes Bureau
    O3:
      do: The German Foreign Office should reject and withhold a formal protest from the British and American governments.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A sworn deposition alleged that German prisoners of war, including the deponent, had been compelled to dig trenches
      near the American battle front at Kirchberg, Jülich, in November 1944.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The deposition alleged that the prisoners had been compelled to work under German artillery fire.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The deposition alleged that the resulting casualties included two dead and twenty wounded.
  - id: F4
    kind: situation
    status: confirmed
    fact: On 20 December 1944, the War Crimes Bureau sent a copy of the sworn deposition to the Wehrmacht operations staff.
  - id: F5
    kind: authority
    status: confirmed
    fact: The War Crimes Bureau recommended lodging a diplomatic protest against the British and American governments.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Bureau's recommendation identified Articles 7 and 9 of the 1929 Geneva Convention relative to POWs as the relevant
      legal provisions.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Wehrmacht operations staff passed the Bureau's recommendation to the German Foreign Office.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: hors_de_combat
    favors:
    - O1
    weight: strong
    why: The sworn deposition alleged that prisoners of war were compelled to dig trenches under German artillery fire, a
      serious danger to people held as prisoners.
  - id: C2
    facts:
    - F3
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The alleged consequences included two deaths and twenty wounded, making the reported harm to the prisoners grave.
  - id: C3
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Bureau identified Articles 7 and 9 of the 1929 POW Convention as relevant and characterized the alleged conduct
      as a very serious violation, providing the legal ground for its protest recommendation.
  reasoning:
    read: The decision was whether to lodge a diplomatic protest based on a sworn deposition alleging dangerous compelled
      work and serious casualties, not whether to make a final finding that the allegations were proven. The key trap is treating
      a protest as though it were an adjudication of the underlying facts.
    weighing: The alleged work under German artillery fire and the reported deaths and injuries made the matter serious {C1}
      {C2}. The Bureau connected the allegation to Articles 7 and 9 of the 1929 POW Convention and recommended protest on
      that basis {C3}; the Foreign Office agreed. The stated balance therefore favored transmitting a formal protest, while
      the underlying factual account remained an allegation.
    tradecraft: Transmit the formal protest and preserve a clear record distinguishing the sworn allegations from established
      findings, including the Bureau's identified treaty provisions and the Foreign Office's decision. The record does not
      supply the protest's text.
    uncertainty: The deposition alleged the conduct and casualties, but the available account does not describe independent
      corroboration or a separate factual verification. That limits conclusions about what occurred, but the stated decision
      was to protest the alleged serious violation.
    handoff: The Bureau made the recommendation, the Wehrmacht operations staff passed it to the Foreign Office, and the Foreign
      Office decided to proceed. The account identifies no further referral as part of this decision.
    tempting_wrong:
      option: O2
      pull: Seeking corroboration before acting can seem prudent when the decision rests on an allegation.
      why_wrong: The Foreign Office accepted the Bureau's recommendation that the sworn allegation described a very serious
        violation of Articles 7 and 9 and transmitted the protest; the stated record does not make further corroboration a
        precondition.
    rejected:
      O2: The Foreign Office did not defer for further corroboration; it accepted the recommendation grounded in the alleged
        serious Convention violation and transmitted the protest.
      O3: The Foreign Office did not reject the recommendation, but agreed with it and transmitted an official protest.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: If material contrary evidence undermined the deposition's central allegations but left the facts unresolved,
      then: O2
      why: The basis for treating the alleged conduct as a serious Convention violation would need further support before
        transmitting a protest.
    - id: flip2
      if: If reliable evidence established that the alleged compelled work under artillery fire and resulting casualties did
        not occur,
      then: O3
      why: The factual basis for the recommended protest would no longer stand.
    would_not_change:
    - id: noflip1
      if: If the exact casualty count were uncertain but the central allegation of compelled dangerous work remained credible,
      why: The alleged exposure to artillery fire and the Bureau's identified Convention provisions would still support transmitting
        a protest.
    watch_for:
    - id: watch1
      what: Corroborating or materially contradicting evidence about the compelled work, exposure to artillery fire, or casualties.
      favors:
      - O1
      - O2
      - O3
      why: Such evidence could strengthen the allegation, warrant further inquiry, or remove the factual basis for protest.
  lesson: When a sworn allegation describes grave harm to prisoners of war and the responsible office identifies relevant
    treaty provisions, a formal protest can be justified without treating the allegation as a final adjudication. Keep the
    protest's evidentiary basis distinct from any later determination of the facts.
  limits: This reasoning supports the recorded decision to protest; it does not establish that the alleged events occurred
    or independently interpret the full text of Articles 7 and 9. It does not determine what response would be appropriate
    if the allegation were materially contradicted.
