case:
  id: DR-CORPUS-NX-5fa502d0-E45@v1
  title: Authorizing a High-Risk Air Attack
  status: draft
  setting: Midway, at the opening of the war; naval command of the force.
  decider: The naval commander responsible for the force
  agent: The naval commander responsible for the force
  agent_role: decide
  situation: The naval force faced an enemy with substantial advantages, and its commander assessed that evasion was important
    because the force had little ability to destroy enemy aircraft or submarines. Long-range enemy bombers were understood
    to be at Midway Lagoon when the war began. The commander considered an air attack as a means of reducing enemy air strength.
    The available air force was small and not equipped for the proposed task; nearby aircraft were limited to the cruiser
    scouting planes, which had little strike capability. The commander had experience training those aircraft and believed
    they could perform the task, while the proposed undertaking remained untried and risky.
  question: What should the naval commander do about authorizing the proposed air attack on the enemy's long-range aircraft?
  options:
    O1:
      do: The Commander declines to authorize the proposed air attack on the enemy's long-range aircraft.
      move: act
      irreversible: false
    O2:
      do: The Commander authorizes the proposed air attack on the enemy's long-range aircraft.
      move: act
      irreversible: true
    O3:
      do: The Commander defers the authorization decision and leaves the proposed air attack unapproved.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: The enemy had substantial advantages over the force.
  - id: F2
    kind: capability
    status: assessed
    fact: The force had little ability to destroy enemy aircraft or submarines, making evasion important to its prospects
      for success.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Long-range enemy bombers were understood to be at Midway Lagoon when the war began.
  - id: F4
    kind: situation
    status: assessed
    fact: The proposed air attack was intended to weaken the enemy's air strength.
  - id: F5
    kind: capability
    status: assessed
    fact: The available air force was small and not equipped for the proposed task.
  - id: F6
    kind: capability
    status: confirmed
    fact: Within a thousand miles of Midway, the only available aircraft were scouting planes from three heavy cruisers, with
      four aircraft per cruiser.
  - id: F7
    kind: capability
    status: assessed
    fact: The cruiser aircraft had little capability to strike the enemy's aircraft on the ground.
  - id: F8
    kind: capability
    status: confirmed
    fact: The naval commander had commanded the heavy cruisers and been responsible for their training for two years.
  - id: F9
    kind: capability
    status: assessed
    fact: The naval commander believed the cruiser aircraft could carry out the proposed task, though it was an untried undertaking
      with significant risk.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The force faced a substantial disadvantage and had little ability to destroy enemy aircraft or submarines, so evasion
      was important. Reducing enemy air strength offered a possible way to improve the force's prospects.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Enemy long-range bombers were understood to be at Midway Lagoon, and the proposed attack could weaken the enemy's
      air strength. The commander judged that possible gain important enough to justify taking a risk.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: own_force_life
    favors:
    - O1
    - O3
    weight: strong
    why: The force's available aircraft were few, not equipped for the task, and had little strike capability. That made the
      undertaking risky and weighed against exposing the force to it.
  - id: C4
    facts:
    - F8
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The commander had two years' responsibility for training the cruiser aircraft and believed they could perform the
      task. That experience supported accepting the risk despite the undertaking being untried.
  reasoning:
    read: 'This was a force facing substantial enemy advantages, with evasion important because it had little ability to destroy
      enemy aircraft or submarines. The trap is to treat the aircraft''s poor fit for the proposed task as automatically decisive:
      the commander considered that limitation, but also judged that reducing enemy air strength could be worth the risk.'
    weighing: The case for {O2} rested on the importance of weakening enemy air strength and the commander's confidence in
      aircraft whose training he knew firsthand {C1} {C2} {C4}. The principal counterweight was the small, poorly equipped
      force and the untried risk {C3}. The commander resolved that balance in favor of the possible gain, not because the
      risk was absent, but because he judged the gain worth taking it.
    tradecraft: 'At the decision level, make the authorization and its rationale clear: the expected mission benefit, the
      capability limits, the risk accepted, and the basis for confidence in the force. Do not represent the commander''s confidence
      as eliminating the uncertainty.'
    uncertainty: The source gives the commander's assessment of the aircraft and the possible gain, but not a quantified likelihood
      of success or a fuller comparison of expected losses and benefits.
    handoff: The commander responsible for the force made the choice. The stated reasons provide no indication that referral
      to another authority was required; whether such referral was required under separate orders is not established here.
    tempting_wrong:
      option: O1
      pull: Declining avoids committing a small, poorly equipped force to an untried and risky task.
      why_wrong: 'That concern was real, but it does not reflect the commander''s full balance: he judged reducing enemy air
        strength sufficiently important that the possible gain was worth the risk, and believed the aircraft could carry out
        the task.'
    rejected:
      O1: The commander did not decline because he judged the potential reduction in enemy air strength worth the risk, given
        his confidence in the aircraft.
      O3: The commander did not defer; he accepted the risk and authorized the proposed attack on the basis of the potential
        gain and his confidence in the aircraft.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C4
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander judged that the possible gain was not worth the risk to the limited force.
      then: O1
      why: The stated rationale for authorizing the attack depends on the commander's judgment that the possible gain justified
        accepting the risk.
    - id: flip2
      if: The commander no longer had confidence that the cruiser aircraft could carry out the task.
      then: O1
      why: The commander's confidence, grounded in his training responsibility, helped support accepting the risk; without
        it, the case for authorization would be materially weaker.
    would_not_change:
    - id: noflip1
      if: The aircraft remained few and poorly equipped, while the commander still judged the possible gain worth the risk
        and believed the aircraft could perform the task.
      why: Those limitations were present in the commander's assessment and did not prevent him from authorizing the attack.
    watch_for:
    - id: watch1
      what: A reassessment undermining the belief that the enemy bombers were at Midway Lagoon.
      favors:
      - O3
      why: The expected gain depended in part on the assessment that the bombers were there; uncertainty about that assessment
        could justify deferring authorization for reassessment.
  lesson: When a force has few ways to counter a serious disadvantage, a risky and poorly matched capability may still warrant
    use if the commander judges the potential mission gain to justify the risk. Make that judgment explicitly, including the
    capability limits and the basis for confidence; do not mistake confidence for certainty.
  limits: This reasoning applies to the commander's stated assessment of this force and this proposed attack, not to other
    operations with different authority, risks, or expected benefits. The source does not establish legal standards, detailed
    risk estimates, or whether separate orders required additional approval.
