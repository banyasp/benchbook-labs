case:
  id: DR-CORPUS-NX-5fa502d0-E14@v1
  title: Force Threshold During Peaceful Reconnaissance
  status: draft
  setting: Around Luzon in the Philippines; aboard the Wheeling and Panay during a peaceful reconnaissance mission.
  decider: The ship's commander
  agent: The ship's commander
  agent_role: decide
  situation: The ship is on a peaceful mission to learn the native feeling toward it. Ports have shown hostility when the
    vessel appears, and in some places insurgent troops are positioned to fight or seize anyone attempting to land. Native
    boats have not approached to barter or ask the vessel's purpose. On some occasions, groups have opened fire on the vessel
    after dark. The commander must decide what threshold should govern any defensive response.
  question: What should the ship's commander do when groups open fire on the vessel during the peaceful reconnaissance?
  options:
    O1:
      do: The ship's commander permits defensive force only when necessary for protection.
      move: act
      irreversible: false
    O2:
      do: The ship's commander prohibits defensive force in response to hostile firing.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: The crew knew little about the Philippines, and people in Manila could provide little useful information about the
      islands.
  - id: F2
    kind: capability
    status: confirmed
    fact: Few charts of the local waters had been drawn, despite unmarked rocks, reefs, and shoals along the coasts and in
      the harbors.
  - id: F3
    kind: capability
    status: confirmed
    fact: The ship had one chart, almost no navigational instruments, and a general chart of northern Luzon based on rough
      surveys from 1797 and marked incomplete, inaccurate, and not to be relied on.
  - id: F4
    kind: situation
    status: confirmed
    fact: Every port showed hostility when the ship appeared.
  - id: F5
    kind: situation
    status: assessed
    fact: In some ports, insurgent troops were positioned to fight or seize anyone attempting to land; in others, insurrectionist
      flags were raised over the towns.
  - id: F6
    kind: situation
    status: confirmed
    fact: Native boats did not come to the ship to barter or ascertain its purpose.
  - id: F7
    kind: situation
    status: confirmed
    fact: In a few ports, groups of natives opened fire on the ship as soon as it was dark.
  - id: F8
    kind: situation
    status: confirmed
    fact: The mission was to learn what the native feeling toward the ship might be and was described as peaceful.
  considerations:
  - id: C1
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The mission was peaceful and intended to learn native feeling toward the ship, which weighs against fighting as a
      general response.
  - id: C2
    facts:
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Groups did open fire on the vessel, so an absolute ban on defensive force could prevent the crew from protecting
      themselves.
  - id: C3
    facts:
    - F7
    - F8
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The stated limit—fighting only when necessary for protection—allows a defensive response while keeping it bounded
      by the peaceful mission.
  reasoning:
    read: The situation combines a peaceful reconnaissance mission with actual hostile firing. The trap is treating the peaceful
      purpose as requiring no defensive response, or treating hostile firing as permission for fighting beyond what protection
      requires.
    weighing: 'The peaceful mission weighs against fighting, but the groups'' firing creates a protective concern. The source
      resolves that tension by limiting fighting to what is necessary for self-protection: this rejects an absolute prohibition
      while preserving restraint.'
    tradecraft: Apply the necessity-for-protection threshold to the decision whether to use force and its continuation; do
      not treat hostility alone as authorization for broader fighting. Record the threat considered, why force was or was
      not necessary for protection, and the basis for stopping.
    uncertainty: The account does not specify the intensity or duration of the firing or the precise protective need on each
      occasion. The stated threshold remains necessity for protection, rather than an assumption that every hostile act warrants
      a response.
    handoff: The ship's commander makes the threshold decision. The account identifies no separate approval authority or required
      outside handoff.
    tempting_wrong:
      option: O2
      pull: An absolute prohibition may seem to best preserve the mission's peaceful character.
      why_wrong: It would prohibit even force necessary for protection, contrary to the stated practice of fighting when necessary
        to protect themselves.
    rejected:
      O2: The source did not choose an absolute prohibition; it permitted fighting only when necessary for protection.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander had reliable grounds to conclude that a proposed use of force could not serve protection and would
        only add fighting.
      then: O2
      why: Without a protective purpose, the source's stated necessity condition would not support permitting that response.
    would_not_change:
    - id: noflip1
      if: Ports remain hostile or insurgent troops appear ready to fight, but force is not necessary for protection.
      why: Hostility in itself does not displace the stated limit that fighting be necessary for protection.
    watch_for:
    - id: watch1
      what: Groups open fire on the vessel.
      favors:
      - O1
      why: The account identifies firing as the circumstance in which the ship sometimes replied, while retaining the necessity-for-protection
        limit.
  lesson: 'A peaceful mission does not require abandoning necessary self-protection. But hostile conduct does not justify
    fighting without limit: keep any defensive response tied to what protection requires.'
  limits: This reasoning addresses the source's narrow choice between prohibiting defensive force and permitting it only when
    necessary for protection. It does not establish a general rule for other missions, threats, or legal authorities not described
    here.
  library:
    domain: military-operational
    family: CORPUS-NX-5fa502d0
    source: https://digital-commons.usnwc.edu/cgi/viewcontent.cgi?article=1013&context=usnwc-historical-monographs
    episode_focus: Hostile groups sometimes fire on the ships, while the stated mission is peaceful reconnaissance. The commanders
      sometimes reply but limit fighting to what is necessary for protection; focus on that force threshold and exclude the
      mechanics of any exchange.
