case:
  id: DR-CORPUS-NS-7d0bf1da-E1@v1
  title: RFRA Defense for Workplace Signs
  status: draft
  setting: United States, 2015 September Term; military court-martial proceedings; the appellant’s workspace.
  decider: The reviewing military court
  agent: The reviewing military court
  agent_role: decide
  situation: During the 2015 September Term, an appellant had posted signs at her workspace stating, “no weapon formed against
    me shall prosper.” The posting was claimed to be religiously motivated at least in part. The appellant faced court-martial
    proceedings for violating an order to remove the signs. The question was whether she could present a RFRA defense. The
    record did not identify a sincerely held religious belief that made posting the signs important to her religious exercise
    or explain how removing them substantially burdened that exercise in another way.
  question: What should the reviewing military court do about the appellant’s entitlement to present an RFRA defense at the
    court-martial?
  options:
    O1:
      do: The reviewing military court grants the appellant permission to present the RFRA defense at the court-martial.
      move: act
      irreversible: false
    O2:
      do: The reviewing military court denies the appellant permission to present the RFRA defense at the court-martial.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The appellant posted signs at her workspace.
  - id: F2
    kind: situation
    status: confirmed
    fact: The signs stated, “no weapon formed against me shall prosper.”
  - id: F3
    kind: situation
    status: assessed
    fact: The posting was claimed to be religiously motivated at least in part.
  - id: F4
    kind: authority
    status: confirmed
    fact: RFRA has an expansive definition of religious exercise.
  - id: F5
    kind: authority
    status: confirmed
    fact: An order required the appellant to remove the signs.
  - id: F6
    kind: situation
    status: confirmed
    fact: The appellant faced court-martial proceedings for violating the order to remove the signs.
  - id: F7
    kind: situation
    status: confirmed
    fact: The appellant did not identify a sincerely held religious belief that made placing the signs important to her religious
      exercise.
  - id: F8
    kind: situation
    status: confirmed
    fact: The appellant did not explain how removal of the signs substantially burdened her religious exercise in another
      way.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: protected_activity
    favors:
    - O1
    weight: weak
    why: The claim that the signs were at least partly religiously motivated brought the conduct within RFRA’s expansive definition
      of religious exercise, but that alone did not establish entitlement to the defense.
  - id: C2
    facts:
    - F7
    equity: protected_activity
    favors:
    - O2
    weight: strong
    why: The appellant did not identify a sincerely held religious belief that made placing the signs important to her religious
      exercise.
  - id: C3
    facts:
    - F8
    equity: protected_activity
    favors:
    - O2
    weight: strong
    why: The appellant did not explain how removing the signs substantially burdened her religious exercise in another way.
  reasoning:
    read: The question is entitlement to present an RFRA defense, not whether the signs should have been posted or removed.
      The trap is treating a partial religious-motivation claim and RFRA’s expansive definition of religious exercise as sufficient
      despite the missing explanation of a sincere belief’s importance or a substantial burden.
    weighing: The religious-motivation claim and RFRA’s expansive scope support considering the defense, but the appellant
      did not identify the sincerely held belief that made placing the signs important to religious exercise or explain another
      way their removal substantially burdened that exercise. The reviewing court concluded that she was therefore not entitled
      to the defense. The balance depends on those missing explanations, not simply on the religious-motivation claim.
    tradecraft: Keep the ruling confined to entitlement to present the RFRA defense. Record the two evidentiary omissions
      as the basis for denying it, without resolving whether the order to remove the signs was otherwise proper.
    uncertainty: The excerpt gives the court’s conclusion on this record but does not set out a broader RFRA test or address
      what evidence would suffice in another case.
    handoff: The reviewing military court decides the entitlement question; the stated reasons do not identify a need for
      another decision-maker.
    tempting_wrong:
      option: O1
      pull: RFRA defines religious exercise expansively, and the posting was claimed to be partly religiously motivated.
      why_wrong: The court held that the claim and broad definition did not overcome the failure to identify the relevant
        sincerely held belief or explain a substantial burden.
    rejected:
      O1: The reviewing court did not grant the defense because the appellant did not identify the relevant sincerely held
        belief or explain how removal substantially burdened religious exercise.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The record identified a sincerely held religious belief making placement of the signs important to religious exercise
        and explained how removal substantially burdened that exercise.
      then: O1
      why: That would address both omissions on which the court based its conclusion, and could support presenting the RFRA
        defense.
    would_not_change:
    - id: noflip1
      if: The appellant continued to claim partial religious motivation without identifying the relevant sincerely held belief
        or explaining a substantial burden.
      why: Those omissions remain the stated basis for denying entitlement, notwithstanding RFRA’s expansive definition of
        religious exercise.
    watch_for:
    - id: watch1
      what: Evidence identifying the sincerely held belief that made posting the signs important and explaining how their
        removal substantially burdened religious exercise.
      favors:
      - O1
      why: Those are the specific gaps the reviewing court relied on.
  lesson: A claim that conduct is religiously motivated, even within an expansive definition of religious exercise, does not
    by itself establish entitlement to an RFRA defense. Identify the sincere belief’s connection to the conduct and explain
    the substantial burden attributed to the challenged action.
  limits: This reasoning addresses entitlement to the RFRA defense on the described record; it does not decide whether the
    signs should have been posted or removed. The excerpt does not supply a comprehensive RFRA test for other records or circumstances.
