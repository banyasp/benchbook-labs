case:
  id: DR-CORPUS-NS-7d0bf1da-E2@v1
  title: Entitlement to an Obedience-to-Orders Instruction
  status: draft
  setting: Iraq; time not stated; military prosecution for prisoner maltreatment.
  decider: The reviewing military court
  agent: The reviewing military court
  agent_role: decide
  situation: The case concerns a prosecution for maltreatment of a prisoner in Iraq, based on the accused's use of an unmuzzled
    military working dog during an interrogation. There was some evidence that the accused received an order to use the dog
    during the interrogation. The record contained no evidence that the accused received an order to remove the dog's muzzle
    or have the dog remove the prisoner's hood. It also contained no evidence that an order to do either of those things would
    have been lawful. The legal standard for an obedience-to-orders instruction concerns whether some evidence supports a
    lawful order, or one the accused might reasonably have believed lawful, to engage in the charged conduct.
  question: What should the reviewing military court do regarding the accused's request for an obedience-to-orders instruction?
  options:
    O1:
      do: The reviewing military court grants the accused's request for an obedience-to-orders instruction.
      move: act
      irreversible: false
    O2:
      do: The reviewing military court denies the accused's request for an obedience-to-orders instruction.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The accused was prosecuted for maltreatment of a prisoner based on use of an unmuzzled military working dog during
      an interrogation in Iraq.
  - id: F2
    kind: situation
    status: confirmed
    fact: There was some evidence that the accused received an order to use the working dog during the interrogation.
  - id: F3
    kind: situation
    status: confirmed
    fact: The record contained no evidence that the accused received an order to remove the dog's muzzle.
  - id: F4
    kind: situation
    status: confirmed
    fact: The record contained no evidence that the accused received an order to have the dog remove the prisoner's hood.
  - id: F5
    kind: situation
    status: confirmed
    fact: The record contained no evidence that an order to remove the muzzle or have the dog remove the hood would have been
      lawful.
  - id: F6
    kind: authority
    status: confirmed
    fact: An instruction on the affirmative defense requires some evidence of a lawful order, or an order the accused might
      reasonably have believed lawful, given to the accused to engage in the charged conduct.
  - id: F7
    kind: authority
    status: confirmed
    fact: A lawful order requires issuance by a competent authority, communication of a specific mandate to do or not do a
      specific act, and a relationship between the mandate and a military duty.
  - id: F8
    kind: authority
    status: confirmed
    fact: Orders are presumed to be lawful.
  considerations:
  - id: C1
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The instruction requires some evidence of a lawful order, or one the accused might reasonably have believed lawful,
      directing the accused to engage in the charged conduct; the record must support that threshold.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Evidence of an order to use the dog during interrogation did not establish an order to remove its muzzle or have
      it remove the prisoner's hood. The order must relate to the conduct charged.
  - id: C3
    facts:
    - F5
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Although orders are presumed lawful, the record had no evidence that an order to remove the muzzle or hood would
      have been lawful. A lawful order requires a competent authority, a specific mandate, and a relationship to military
      duty.
  reasoning:
    read: The issue is whether the evidence supports giving the requested defense instruction, not whether using a working
      dog in a particular way was proper. The trap is treating an order to use the dog during interrogation as an order to
      perform the specific acts underlying the charge.
    weighing: The instruction requires some evidence of a lawful order, or an order the accused might reasonably have believed
      lawful, to engage in the charged conduct. The evidence of an order to use the dog did not extend to removing its muzzle
      or having it remove the prisoner's hood, and there was no evidence that an order to do either would have been lawful.
      The presumption that orders are lawful does not supply evidence of an order covering those acts. The balance depends
      on evidence connecting an order to the conduct charged and supporting its lawfulness or reasonable perceived lawfulness.
    tradecraft: Resolve the instruction request by identifying the conduct charged and assessing whether the evidence supports
      an order covering that conduct. Record separately the evidence of a general order to use the dog and the absence of
      evidence of an order for the specific acts; do not treat the ruling as a broader determination about working-dog use.
    uncertainty: The record described here does not establish an order for the specific acts or the lawfulness of such an
      order. Do not infer either from the general order to use the dog.
    handoff: The reviewing military court can decide the instruction request on the evidentiary record and the stated legal
      standard; the issue presented does not require a separate operational decision.
    tempting_wrong:
      option: O1
      pull: There was some evidence of an order to use the dog during the interrogation, and orders are presumed lawful.
      why_wrong: That evidence did not show an order to perform the specific acts underlying the charge, or that an order
        for those acts would have been lawful.
    rejected:
      O1: Granting the instruction was not warranted because the evidence did not support an order, lawful or otherwise, to
        engage in the specific conduct charged.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The record contained some evidence that a competent authority gave the accused a specific order to remove the muzzle
        or have the dog remove the hood, and that the order was lawful or might reasonably have been believed lawful.
      then: O1
      why: That evidence could satisfy the threshold for an instruction by connecting a potentially lawful order to the charged
        conduct.
    would_not_change:
    - id: noflip1
      if: The record contained only evidence of an order to use the dog during interrogation, with no evidence that the order
        covered the specific acts charged.
      why: A general order to use the dog does not establish an order to remove its muzzle or have it remove the prisoner's
        hood.
    watch_for:
    - id: watch1
      what: Evidence about the order's specific mandate, who issued it, and whether it related to military duty.
      favors:
      - O1
      why: Those details bear on whether there is evidence of a competent authority's lawful order covering the charged conduct.
  lesson: An order to perform a general task does not by itself support an obedience-to-orders instruction for specific conduct
    charged. The evidence must support an order covering that conduct and its lawfulness, or the accused's reasonable belief
    that it was lawful.
  limits: This reasoning addresses entitlement to an instruction on the record described, not the proper use of a working
    dog or the ultimate merits of the maltreatment prosecution. A record with evidence of a specific order and its lawfulness
    or reasonable perceived lawfulness could present a different instruction question.
