case:
  id: DR-CORPUS-NX-6c75c96e-E1@v1
  title: Fleet Coaling Destination
  status: draft
  setting: Off Santiago, on the 6th; naval flying squadron.
  decider: The flying squadron commander
  agent: The flying squadron commander
  agent_role: decide
  situation: The naval flying squadron was operating off Santiago during a period when it needed to replenish coal. Coaling
    in the rough sea off Santiago was difficult. A coal steamer accompanying the fleet carried 3,000 tons of coal. Key West
    was 700 nautical miles away, while Guantanamo Bay was about 50 nautical miles east of Santiago. The commander lacked information
    that Guantanamo Bay's defenses were weak.
  question: What should the flying squadron commander do about the fleet's coaling destination on the 6th?
  options:
    O1:
      do: The flying squadron commander approves the fleet's return to Key West as its coaling destination.
      move: act
      irreversible: false
    O2:
      do: The flying squadron commander rejects the fleet's return to Key West and chooses Guantanamo Bay as its coaling destination.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The flying squadron had arrived off Santiago by the 26th.
  - id: F2
    kind: situation
    status: assessed
    fact: Coaling in the rough sea off Santiago was difficult.
  - id: F3
    kind: capability
    status: confirmed
    fact: A coal steamer accompanying the fleet carried 3,000 tons of coal.
  - id: F4
    kind: situation
    status: confirmed
    fact: Key West was 700 nautical miles away.
  - id: F5
    kind: situation
    status: confirmed
    fact: Guantanamo Bay was about 50 nautical miles east of Santiago.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Guantanamo Bay's defenses were weak.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The commander lacked information about the weakness of Guantanamo Bay's defenses.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The commander considered the rough-sea coaling difficulty serious enough to make a return to Key West necessary,
      despite the 700-nautical-mile distance and the fleet's accompanying coal steamer.
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The commander lacked the information that Guantanamo Bay was weakly defended; that intelligence gap explains why
      he did not select it on the 6th.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: With knowledge that Guantanamo Bay's defenses were weak, the commander would have chosen it as a coaling place instead.
  reasoning:
    read: This was a coaling-destination decision made with a significant intelligence gap. The trap is to use the later-known
      weakness of Guantanamo Bay as though the commander knew it on the 6th.
    weighing: The commander judged coaling in the rough sea off Santiago difficult enough to require the return to Key West
      {C1}. Since he lacked information about Guantanamo Bay's weak defenses, the closer harbor was not the option he selected
      on the information available {C2}. With that information, he would have chosen Guantanamo Bay instead {C3}.
    tradecraft: Record the coaling difficulty, the information available about alternative ports, and the reason for the destination
      decision; reassess if material information changes.
    uncertainty: The intelligence gap and the coaling difficulty are identified, but there is no further detail about the
      commander's assessment of the alternatives or the expected duration of the coal requirement.
    handoff: The decision is presented as the flying squadron commander's, with no required higher approval or consultation
      identified.
    tempting_wrong:
      option: O2
      pull: Guantanamo Bay was about 50 nautical miles away and its defenses were weak.
      why_wrong: Choosing it on the actual decision record would rely on information the commander lacked; that knowledge
        is the counterfactual that would have changed his choice.
    rejected:
      O2: The commander did not choose Guantanamo Bay because he lacked information about its weak defenses, although that
        knowledge would have led him to choose it.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The commander had known that Guantanamo Bay's defenses were weak.
      then: O2
      why: With that knowledge, he would have chosen Guantanamo Bay as a coaling place.
    would_not_change:
    - id: noflip1
      if: Coaling in the rough sea off Santiago remained difficult and the commander still lacked information about Guantanamo
        Bay's weak defenses.
      why: Those are the conditions associated with the actual return decision.
    watch_for: []
  lesson: Judge a logistics decision using the information available to the decider at the time, not later-acquired intelligence.
    A material change in knowledge can change which destination is preferable.
  limits: This reasoning addresses the coaling destination on the 6th and the intelligence gap. It does not establish that
    Key West would remain preferable after new information about Guantanamo Bay or changed operating conditions.
  library:
    domain: operational-command
    family: CORPUS-NX-6c75c96e
    source: https://digital-commons.usnwc.edu/cgi/viewcontent.cgi?article=1006&context=usnwc-historical-monographs
    episode_focus: The passage links the return decision to the difficulty of coaling in rough seas off Santiago and says
      the commander lacked information that Guantanamo Bay was weakly defended; with that information, he would have selected
      it instead. Treat this as a fleet-logistics command decision, and exclude the surrounding account of cable-cutting and
      other operational actions.
