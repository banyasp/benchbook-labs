case:
  id: DR-OHA-26-0122-addfact2@v1
  title: Guideline H Mitigation Determination [addfact]
  status: needs_review
  setting: U.S. Department of Energy, Office of Hearings and Appeals – 19 October 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee, has held a security clearance since 6 July 2018. A random drug screen
    on 16 March 2026 returned a positive result for cocaine, and the Individual later testified that he used cocaine on 14
    March 2026. He first denied any use to his employer, but in May 2026 admitted the denial was false. Subsequent testing
    showed a negative hair analysis on 28 July 2026 and a negative urine analysis on 12 August 2026, yet no expert testimony
    was offered regarding the detection windows of those tests. The Individual's record contains no prior security violations,
    disciplinary actions, or policy breaches before the March 2026 incident. Guideline H of the Adjudicative Guidelines, together
    with the Bond Amendment, bars clearance for unlawful users of controlled substances, and DOE regulations create a presumption
    against granting or restoring a clearance.
  question: How should the Administrative Law Judge rule on the Individual's request for restoration of his security clearance
    under Guideline H?
  options:
    O1:
      do: Hold the case pending additional proof of continued drug abstinence.
      move: hold
      irreversible: false
    O2:
      do: Deny the Individual's request to have his security clearance restored.
      move: act
      irreversible: true
    O3:
      do: Grant restoration of the Individual's security clearance based on the evidence.
      move: act
      irreversible: true
    O4:
      do: Ask the Individual to provide drug-test results for March through July 2026.
      move: ask
      irreversible: false
      to: the Individual
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A random drug screen administered on 16 March 2026 yielded a positive cocaine result for the Individual.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Individual testified that he consumed cocaine on 14 March 2026.
  - id: F3
    kind: situation
    status: confirmed
    fact: He has maintained a DOE security clearance continuously since 6 July 2018.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Initially, he denied any drug use to his employer, but in May 2026 he acknowledged that denial was false.
  - id: F5
    kind: situation
    status: confirmed
    fact: Subsequent testing produced a negative hair analysis on 28 July 2026 and a negative urine analysis on 12 August
      2026.
  - id: F6
    kind: intelligence
    status: assessed
    fact: No expert testimony was offered concerning the detection windows of those drug tests.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Individual's record shows no prior security violations, disciplinary actions, or policy breaches before the
      March 2026 incident.
  - id: F8
    kind: authority
    status: confirmed
    fact: Guideline H of the Adjudicative Guidelines, together with the Bond Amendment, bars clearance for unlawful users
      of controlled substances.
  - id: F9
    kind: authority
    status: confirmed
    fact: DOE regulations establish a presumption against granting or restoring a security clearance.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment, incorporated in DOE Order 472.2A, expressly bars any clearance holder who is an unlawful user
      of a controlled substance; the positive cocaine test and the Individual's admission satisfy that bar.
  - id: C2
    facts:
    - F5
    - F6
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Guideline H requires a documented pattern of abstinence or treatment; the two isolated negative tests, lacking expert
      interpretation and covering only limited intervals, fail to demonstrate the sustained abstinence the guideline demands.
  - id: C3
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Individual's initial false denial constitutes a breach of truthfulness, a core reliability factor under Guideline
      H, reinforcing the security concern.
  - id: C4
    facts:
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: DOE regulation 10 C.F.R. §710.7(a) creates a presumption against granting or restoring a clearance when a security
      concern exists, supporting denial.
  - id: C5
    facts:
    - F5
    - F6
    - F7
    equity: security_clearance
    favors:
    - O3
    weight: weak
    why: The negative hair and urine results and the Individual’s clean prior record suggest possible abstinence, but without
      expert testimony on detection windows the evidence is insufficient to overcome the statutory bar.
  reasoning:
    read: The Individual, a long-time DOE clearance holder, tested positive for cocaine in March 2026, lied about the use,
      and later admitted it. Subsequent negative tests were offered without expert analysis and do not establish a continuous
      abstinence record. Guideline H and the Bond Amendment prohibit clearance for unlawful drug users unless clear mitigation
      is shown.
    weighing: C1 (statutory bar) and C3 (dishonesty) are decisive, establishing a clear violation of the Bond Amendment and
      Guideline H. C2 confirms that the mitigation offered is inadequate. C4 reinforces the presumption against restoration
      but is secondary to the explicit statutory prohibition. The balance therefore supports denial.
    tradecraft: The decision is entered in the OHA docket, cites DOE Order 472.2A, the Bond Amendment, and 10 C.F.R. §§710.7(a)
      and 710.28, and notifies the Individual of his right to appeal.
    uncertainty: The only uncertainty lies in the absence of expert testimony on detection windows, but the statutory language
      does not require such proof to deny a clearance.
    handoff: The Administrative Law Judge acts alone under the authority granted by 10 C.F.R. §710.25(d)–(g).
    tempting_wrong:
      option: O3
      pull: Two negative drug tests might be read as evidence that the Individual has stopped using cocaine.
      why_wrong: Without a documented pattern of abstinence, treatment, or truthful conduct, the statutory bar and Guideline
        H remain unmet; granting would contravene the Bond Amendment.
    rejected:
      O1: Holding the case pending additional evidence would ignore the clear statutory prohibition and the lack of mitigation
        presented.
      O3: Granting restoration ignores the unresolved security concerns under Guideline H and the Bond Amendment.
      O4: Requesting further test results would not cure the fundamental issues of unlawful use and dishonesty already established.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual supplies a credible, continuous series of negative drug tests from March onward and completes an
        approved drug-treatment program with a favorable prognosis.
      then: O3
      why: Such evidence satisfies the mitigation factors enumerated in Guideline H, which can offset the security concern.
    - id: flip2
      if: The Individual had been fully truthful from the beginning, immediately acknowledging the cocaine use without prior
        deception.
      then: O3
      why: Truthfulness would mitigate the reliability concern, reducing the weight of the security violation.
    would_not_change:
    - id: noflip1
      if: The Individual relies solely on the two negative tests already submitted, without additional proof of continuous
        abstinence or treatment.
      why: Isolated negative results do not meet Guideline H's requirement for a sustained abstinence pattern.
    watch_for:
    - id: watch1
      what: Any future evidence of association with drug-using persons or additional positive drug tests.
      favors:
      - O2
      why: Such developments would reinforce concerns about self-control and reliability, favoring continued denial.
  lesson: When Guideline H and the Bond Amendment apply, a single unlawful use of a controlled substance combined with dishonesty
    and insufficient mitigation justifies denial of clearance restoration. Mitigation must be continuous, documented, and
    supported by expert or treatment evidence.
  limits: This analysis applies only when the statutory definition of "unlawful user" is satisfied and the individual fails
    to meet the specific mitigating factors listed in Guideline H. It does not address cases involving medically prescribed
    drug use or completed recognized rehabilitation programs.
