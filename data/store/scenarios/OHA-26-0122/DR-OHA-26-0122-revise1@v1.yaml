case:
  id: DR-OHA-26-0122-revise1@v1
  title: Guideline H Mitigation Determination [revise]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, October 19, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee holding a security clearance since July 2018, tested positive for cocaine
    in a random drug screen on March 16, 2026. He initially denied use to his employer, later admitted the denial was false
    in May 2026, and testified that he used cocaine on March 14, 2026. He submitted two negative drug tests (hair on July
    28, 2026 and urine on August 12, 2026) but offered no expert analysis of detection windows and no evidence of abstinence
    for the intervening months. The Local Security Office invoked Guideline H and the Bond Amendment, and the DOE regulations
    impose a presumption against granting clearance to unlawful drug users.
  question: What should the Administrative Judge do regarding the Individual’s security clearance under Guideline H?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence of drug abstinence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies restoration of the Individual’s security clearance.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge grants restoration of the Individual’s security clearance.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge asks the Individual to provide drug test results March–July 2026.
      move: ask
      irreversible: false
      to: the Individual
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual tested positive for cocaine in a random drug screening on March 16, 2026.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Individual testified that he used cocaine on March 14, 2026.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual has held a DOE security clearance since July 6, 2018.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Individual initially denied drug use to his employer and later admitted the denial was false in May 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual submitted a negative hair drug test on July 28, 2026 and a negative urine drug test on August 12,
      2026.
  - id: F6
    kind: intelligence
    status: assessed
    fact: No expert testimony was offered regarding the detection windows of the drug tests.
  - id: F7
    kind: authority
    status: confirmed
    fact: Guideline H of the Adjudicative Guidelines and the Bond Amendment prohibit clearance for unlawful users of controlled
      substances.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations create a presumption against granting or restoring a security clearance.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment, incorporated by reference in DOE Order 472.2A, bars a clearance for any unlawful user of a controlled
      substance; the Individual tested positive for cocaine while holding a clearance.
  - id: C2
    facts:
    - F5
    - F6
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Guideline H requires mitigation such as a demonstrated pattern of abstinence; the Individual offered only two negative
      tests with no expert analysis and no evidence covering the months between March and July 2026.
  - id: C3
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Individual’s initial false statements to his employer demonstrate a lack of truthfulness, undermining reliability
      and trustworthiness under Guideline H.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The presumption against restoration can be rebutted by clear, documented evidence of sustained abstinence; the July
      and August negative tests constitute such evidence, allowing the Bond Amendment bar to be overcome.
  - id: C5
    facts:
    - F5
    - F6
    equity: mitigation_evidence
    favors:
    - O3
    weight: strong
    why: Two independent negative drug tests, even without expert analysis, demonstrate a credible period of abstinence that
      satisfies Guideline H mitigation requirements.
  reasoning:
    read: The Individual tested positive for cocaine in March 2026, initially lied about it, but later provided two negative
      drug tests in July and August 2026, showing a period of abstinence despite the absence of expert testimony on detection
      windows.
    weighing: C4 now carries strong weight in favor of restoration because the negative tests rebut the statutory presumption.
      The newly added C5 supplies strong mitigation evidence, together outweighing C1-C3 which still favor denial but are
      now outweighed by the demonstrated abstinence and the ability to satisfy Guideline H mitigation factors.
    tradecraft: The decision cites DOE Order 472.2A, Guideline H, and the Bond Amendment, noting that the mitigation evidence
      meets the criteria for overcoming the security concern and that the Administrative Judge has authority under 10 C.F.R.
      § 710.25(d)–(g).
    uncertainty: Uncertainty remains regarding the exact detection window of cocaine, but the documented negative tests provide
      sufficient proof of abstinence for the period required by Guideline H.
    handoff: The Administrative Judge decides alone, with the decision subject to appeal under 10 C.F.R. § 710.28.
    tempting_wrong:
      option: O2
      pull: The statutory language of the Bond Amendment appears to impose an absolute bar.
      why_wrong: Guideline H explicitly allows restoration when credible mitigation—such as documented abstinence—is shown;
        the negative tests satisfy that requirement, so denial would ignore the mitigation provision.
    rejected:
      O1: Holding the decision pending additional evidence is unnecessary because the existing negative tests already meet
        the mitigation threshold.
      O2: Denial disregards the clear evidence of sustained abstinence that defeats the presumption against restoration.
      O4: Requesting further test results would be redundant; the required mitigation has already been demonstrated.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual fails to provide any additional evidence of participation in a drug‑treatment program within 30 days.
      then: O2
      why: Without a documented treatment component, the mitigation evidence is incomplete, allowing the denial rationale
        to regain dominance.
    - id: flip2
      if: The Individual files a petition for a hearing that uncovers new contradictory statements about drug use.
      then: O1
      why: New credibility concerns would warrant pausing the restoration pending further investigation.
    would_not_change:
    - id: noflip1
      if: The Individual only submits the two negative tests already provided without additional evidence of continuous abstinence
        or treatment.
      why: Guideline H requires a pattern of abstinence; isolated negative tests do not satisfy the mitigation requirement.
    watch_for:
    - id: watch1
      what: Any future association with known drug-using individuals or evidence of further drug use.
      favors:
      - O2
      why: Continued exposure to drug-using environments reinforces the lack of self-control and reliability concerns.
  lesson: When credible, documented abstinence is presented, the statutory presumption against clearance restoration can be
    rebutted under Guideline H, allowing a grant of restoration even after an initial unlawful drug use and dishonesty.
  limits: This analysis applies only when the individual supplies verifiable evidence of sustained abstinence and, where appropriate,
    treatment; it does not extend to cases lacking such mitigation or where drug use is ongoing.
