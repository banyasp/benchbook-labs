case:
  id: DR-OHA-26-0122@v1
  title: Guideline H Mitigation Decision – Security Clearance
  status: draft
  setting: DOE Office of Hearings and Appeals, October 2026
  decider: Administrative Judge Diane L. Miles
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee holding a security clearance since July 2018, tested positive for cocaine
    in a random drug screen in March 2026. The Local Security Office (LSO) cited this result and invoked both the Bond Amendment
    and Guideline H of the Adjudicative Guidelines, noting the use occurred while the Individual possessed a clearance. The
    Individual initially denied use, provided a false written statement to his employer, and only admitted the use in May
    2026. At the hearing, he testified that he used cocaine on March 14, 2026, citing personal stress and a social setting.
    He submitted two negative drug tests (hair sample July 28, 2026; urine sample August 12, 2026) but offered no expert analysis
    of detection windows and no evidence of continuous abstinence. He also provided a signed statement promising future abstinence
    and reported attending therapy intermittently, without supporting documentation.
  question: What should the Administrative Judge do regarding the Individual's Guideline H security concern?
  options:
    O1:
      do: Deny restoration of the Individual's security clearance permanently.
      move: act
      irreversible: true
    O2:
      do: Conditionally restore clearance with required ongoing drug testing.
      move: partial
      irreversible: true
    O3:
      do: Hold decision pending further evidence such as expert analysis.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor and has held a security clearance since July 6, 2018.
  - id: F2
    kind: situation
    status: confirmed
    fact: In March 2026 the Individual tested positive for cocaine in a random drug screening.
  - id: F3
    kind: authority
    status: confirmed
    fact: The LSO invoked the Bond Amendment and Guideline H of the Adjudicative Guidelines based on the positive test.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Individual initially denied drug use, gave a false written statement to his employer, and later admitted the
      use in May 2026.
  - id: F5
    kind: intelligence
    status: assessed
    fact: At the hearing the Individual testified he used cocaine on March 14, 2026, citing stress, grief, and a social setting
      with a "friend of a friend".
  - id: F6
    kind: situation
    status: confirmed
    fact: The Individual submitted a negative hair drug test (collected July 28, 2026) and a negative urine drug test (collected
      August 12, 2026).
  - id: F7
    kind: situation
    status: assessed
    fact: No expert testimony was offered on detection windows, and no evidence was provided of continuous abstinence between
      March and July 2026 or after August 12, 2026.
  - id: F8
    kind: situation
    status: assessed
    fact: The Individual signed a statement promising future abstinence and reported attending therapy one to two times per
      month, without documentation.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Bond Amendment, a statutory authority, bars granting a clearance to an unlawful user of a controlled substance;
      the positive cocaine test while holding a clearance triggers this prohibition.
  - id: C2
    facts:
    - F2
    - F6
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Guideline H factor (a) requires the conduct to be infrequent or unlikely to recur; the recent use, lack of continuous
      abstinence evidence, and no expert analysis of detection windows show the conduct is recent and unmitigated.
  - id: C3
    facts:
    - F5
    - F8
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Mitigation factor (b) demands concrete actions such as disassociation from drug‑using contacts and documented treatment;
      the Individual continues social ties to drug‑using friends and provides no documentation of therapy or treatment.
  - id: C4
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Without expert testimony on detection windows, the record cannot establish a reliable period of abstinence, weakening
      any claim of sustained sobriety.
  reasoning:
    read: The Individual, a long‑time clearance holder, tested positive for cocaine while cleared, then lied about the use
      and only admitted it after the clearance was suspended. He offered limited post‑incident testing and a signed abstinence
      statement but no corroborating evidence of continuous sobriety or treatment.
    weighing: The Administrative Judge applied the Bond Amendment and Guideline H, finding the positive test and deception
      constitute an unlawful user under the statute. The lack of mitigating evidence under Guideline H factors (a) and (b)
      left the security concern unresolved, leading to a denial. The balance rests on the statutory prohibition and the insufficient
      mitigation, as the source repeatedly states the Individual has not demonstrated sustained abstinence or rehabilitation.
    tradecraft: The decision is entered as a final Administrative Judge Decision, denying restoration of the clearance. The
      record notes the appeal pathway under 10 C.F.R. § 710.28.
    uncertainty: Uncertainty exists only regarding the exact period of abstinence, but the statutory and guideline framework
      provides a clear presumption against restoration absent proven mitigation.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.25(d)–(g).
    tempting_wrong:
      option: O2
      pull: A conditional restoration with periodic testing might appear compassionate given the Individual’s expressed remorse
        and negative tests.
      why_wrong: The source finds the mitigation insufficient; without documented treatment, continuous abstinence, and disassociation
        from drug‑using contacts, a conditional restoration would violate the Bond Amendment and Guideline H.
    rejected:
      O2: Mitigation factors (b) and (d) were not satisfied; the Individual provided no evidence of treatment or sustained
        abstinence.
      O3: Holding the decision pending further evidence would ignore the clear statutory prohibition and the lack of mitigating
        evidence already on record.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provides credible evidence of continuous abstinence from cocaine, completes a prescribed drug‑treatment
        program with a qualified medical professional, and disassociates from drug‑using associates.
      then: O2
      why: Meeting Guideline H mitigation factor (b) and (d) would remove the security concern, allowing a conditional restoration.
    would_not_change:
    - id: noflip1
      if: The Individual continues to associate with friends who use illicit drugs and offers no documented treatment or sustained
        abstinence.
      why: The lack of mitigation under Guideline H remains, so the clearance stays denied.
    watch_for:
    - id: watch1
      what: Any future positive drug test or evidence of renewed drug use.
      favors:
      - O1
      why: A new violation would reaffirm the Bond Amendment prohibition.
  lesson: Under the Bond Amendment and Guideline H, a single illicit drug use while cleared, coupled with deception and insufficient
    mitigation, justifies a denial of clearance restoration. Demonstrated treatment, sustained abstinence, and disassociation
    from drug‑using contacts are required to overcome the security concern.
  limits: This reasoning applies only when the individual lacks documented treatment or continuous abstinence evidence. If
    credible, verifiable mitigation is presented, the analysis must be revisited under the same guidelines.
