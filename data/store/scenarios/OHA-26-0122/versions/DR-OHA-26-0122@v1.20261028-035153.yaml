case:
  id: DR-OHA-26-0122@v1
  title: Guideline H Mitigation Decision for DOE Security Clearance
  status: draft
  setting: DOE Office of Hearings and Appeals, September 2026, United States
  decider: Administrative Judge (Diane L. Miles)
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee holding a security clearance since July 2018, tested positive for cocaine
    in a random drug screen on March 16, 2026. The Local Security Office cited this result under Guideline H and the Bond
    Amendment, noting the drug use occurred while the Individual possessed a clearance. At the September 10, 2026 hearing,
    the Individual admitted using cocaine on March 14, 2026, initially denied the use to his employer, and later admitted
    the false statement in May 2026. He submitted two negative drug tests (hair July 28, 2026; urine August 12, 2026) and
    a signed statement promising future abstinence, but provided no expert testimony on detection windows and no evidence
    of continuous abstinence before or after those tests. The adjudicative framework presumes against granting clearance when
    such concerns exist.
  question: What should the Administrative Judge do regarding the Individual’s Guideline H security concern?
  options:
    O1:
      do: Do not restore the clearance.
      move: act
      irreversible: true
    O2:
      do: Restore the Individual’s clearance now.
      move: act
      irreversible: true
    O3:
      do: Hold decision; require further testing.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual tested positive for cocaine in a random drug screening on March 16, 2026.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Local Security Office invoked Guideline H and the Bond Amendment based on the positive test.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual admitted to using cocaine on March 14, 2026, at a social gathering.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Individual initially denied drug use to his employer and later admitted the false statement in May 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual submitted a negative hair drug test on July 28, 2026, and a negative urine drug test on August 12,
      2026.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: No expert testimony was offered regarding the detection windows of the drug tests.
  - id: F7
    kind: intelligence
    status: assessed
    fact: There is no evidence of the Individual’s abstinence between March and July 2026, nor after August 12, 2026.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Individual signed a statement committing to abstain from all illegal drug use.
  - id: F9
    kind: authority
    status: confirmed
    fact: Guideline H treats illegal drug use while holding a clearance as a security concern affecting reliability and judgment.
  - id: F10
    kind: authority
    status: confirmed
    fact: Regulatory standards presume against granting or restoring a clearance when security concerns exist.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F9
    - F10
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Bond Amendment, as incorporated by DOE Order 472.2A, bars granting or restoring a clearance to an unlawful user
      of a controlled substance; the Individual tested positive for cocaine while holding a clearance.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    - F5
    - F6
    - F7
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Guideline H concerns are not mitigated because the Individual’s use was recent, voluntary, and accompanied by dishonesty;
      no credible evidence of sustained abstinence or rehabilitation was presented.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The two negative drug tests are isolated and lack expert interpretation; there is no proof of abstinence for the
      four‑month gap between March and July or after August.
  - id: C4
    facts:
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The Individual initially lied to his employer about the drug use and only admitted it after his clearance was suspended,
      casting doubt on his reliability and trustworthiness.
  reasoning:
    read: The Individual, a cleared DOE contractor, used cocaine in March 2026 while holding a security clearance, then denied
      the use, later admitted it, and offered limited negative drug tests without expert analysis. The core issue is whether
      Guideline H concerns are mitigated enough to permit restoration of the clearance.
    weighing: The Administrative Judge applied the Bond Amendment (C1) and found the invocation of Guideline H justified (C2).
      The lack of continuous abstinence evidence (C3) and the Individual’s dishonesty (C4) together prevented mitigation under
      Guideline H factors (a) and (b). Accordingly, the balance of the source’s reasons leads to a denial of restoration.
    tradecraft: The Judge issues a written decision, cites the relevant CFR and statutes, records the finding that the Bond
      Amendment prohibits restoration, and notes the appeal rights under 10 C.F.R. § 710.28.
    uncertainty: The record contains no expert testimony on detection windows and no longitudinal drug‑testing data, leaving
      some uncertainty about the exact period of abstinence, but the source deemed that insufficient to overcome the security
      concern.
    handoff: The decision is made solely by the Administrative Judge, as authorized by 10 C.F.R. § 710.25(d)-(g). No further
      agency review is required unless an appeal is filed.
    tempting_wrong:
      option: O2
      pull: A desire to give the Individual a second chance and to rely on the two negative drug tests.
      why_wrong: The source concluded that without concrete evidence of sustained abstinence, treatment, or disassociation
        from drug‑using contacts, the security risk remains unmitigated.
    rejected:
      O2: Restoring the clearance would ignore the unresolved Guideline H concerns and the Bond Amendment prohibition.
      O3: Holding the decision for further testing was not necessary because the record already demonstrated a lack of mitigation;
        the Judge has authority to decide now.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provided credible, expert‑supported evidence of continuous abstinence from cocaine from March 2026
        through the present, completed a documented drug‑treatment program, and permanently disassociated from drug‑using
        associates.
      then: O2
      why: Such evidence would satisfy Guideline H mitigation factor (b) and demonstrate that the security concern has been
        resolved.
    would_not_change:
    - id: noflip1
      if: The Individual’s drug use was motivated solely by stress or grief.
      why: The source expressly rejected stress and grief as a mitigating circumstance, holding the conduct serious and recent.
    watch_for:
    - id: watch1
      what: Any future positive drug test or evidence of continued association with drug‑using individuals.
      favors:
      - O1
      why: New evidence would reinforce the security concern and keep the clearance denied.
  lesson: Under DOE security regulations, a single recent illegal drug use while holding a clearance, coupled with dishonesty
    and lack of documented abstinence or treatment, triggers Guideline H concerns that cannot be mitigated; the Bond Amendment
    then bars restoration of the clearance.
  limits: This reasoning applies only when the record lacks credible, expert‑backed proof of sustained abstinence or rehabilitation.
    If such evidence is later presented, the analysis must be revisited.
