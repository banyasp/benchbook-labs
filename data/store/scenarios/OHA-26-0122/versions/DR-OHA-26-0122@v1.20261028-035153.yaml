verdict_tier: source-endorsed
basis: I find that the Bond Amendment prohibits the DOE from restoring the Individual’s security clearance and that the Individual
  has not demonstrated that restoring his security clearance would not endanger the common defense and security; therefore,
  the Individual’s access authorization should not be restored.
