case:
  id: DR-OHA-26-0122-restyle1@v1
  title: Guideline H Mitigation Decision for DOE Security Clearance [restyle]
  status: needs_review
  setting: Office of the Department of Energy Office of Hearings and Appeals, Washington, D.C., October 2026
  decider: Administrative Judge (Robert J. Harris)
  agent: Administrative Judge
  agent_role: decide
  situation: The employee, a DOE contractor who has held a security clearance since July 2018, produced a positive cocaine
    result in a random drug screen on March 16, 2026. The Local Security Office cited this outcome under Guideline H and the
    Bond Amendment, noting the drug use occurred while the employee possessed a clearance. At a hearing on September 10, 2026,
    the employee admitted to using cocaine on March 14, 2026, initially denied the use to his employer, and later confessed
    to the false statement in May 2026. He submitted two negative drug tests (hair on July 28, 2026; urine on August 12, 2026)
    and a signed pledge to remain drug-free, but offered no expert testimony on detection windows and no proof of continuous
    abstinence before or after those tests. The adjudicative framework presumes against granting a clearance when such concerns
    exist.
  question: What action should the Administrative Judge take concerning the employee's Guideline H security concern?
  options:
    O1:
      do: Refuse to reinstate the employee's clearance.
      move: act
      irreversible: true
    O2:
      do: Reinstate the employee's clearance without delay.
      move: act
      irreversible: true
    O3:
      do: Hold the decision and require further testing.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A random drug screen on March 16, 2026 returned a positive result for cocaine.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Local Security Office applied Guideline H and the Bond Amendment in response to that result.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee acknowledged using cocaine on March 14, 2026 at a private gathering.
  - id: F4
    kind: intelligence
    status: assessed
    fact: He first denied any drug use to his employer, then confessed to the falsehood in May 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: Subsequent drug analyses showed a negative hair test on July 28, 2026 and a negative urine test on August 12, 2026.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: No expert was called to explain the detection periods of those assays.
  - id: F7
    kind: intelligence
    status: assessed
    fact: There is no documentation showing continuous abstinence from March through July 2026, nor after August 12, 2026.
  - id: F8
    kind: situation
    status: confirmed
    fact: He signed a declaration promising to refrain from illegal drug consumption.
  - id: F9
    kind: authority
    status: confirmed
    fact: Guideline H classifies illicit drug use while holding a clearance as a security concern that impairs reliability
      and judgment.
  - id: F10
    kind: authority
    status: confirmed
    fact: Regulatory policy presumes against granting or restoring a clearance when such security concerns are present.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F9
    - F10
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Bond Amendment, incorporated through DOE Order 472.2A, prohibits granting or reinstating a clearance to any individual
      who uses a controlled substance unlawfully; the positive cocaine test occurred while the employee possessed a clearance.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    - F5
    - F6
    - F7
    - F8
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Because the drug use was recent, voluntary, and accompanied by deception, and because no credible evidence of sustained
      abstinence or rehabilitation was offered, the Guideline H concern remains unmitigated.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The two negative test results are isolated incidents and, without expert interpretation, do not establish a continuous
      period of abstinence for the four-month interval between March and July or after August.
  - id: C4
    facts:
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The employee's initial false statement to his employer raises doubts about his reliability and trustworthiness, a
      core element of the duty owed to the agency.
  reasoning:
    read: The employee, a cleared DOE contractor, used cocaine in March 2026 while holding a security clearance, then denied
      the use, later admitted it, and presented limited negative drug tests without expert analysis. The central issue is
      whether the Guideline H concern can be sufficiently mitigated to allow restoration of the clearance.
    weighing: The Administrative Judge applied the Bond Amendment (C1) and concluded that the invocation of Guideline H is
      warranted (C2). The absence of continuous abstinence evidence (C3) and the employee's deception (C4) together preclude
      mitigation under Guideline H factors (a) and (b). Consequently, the balance of reasons leads to a denial of restoration.
    tradecraft: The Judge issues a written decision, cites the applicable CFR provisions and statutes, records the finding
      that the Bond Amendment bars restoration, and notes the appeal rights under 10 C.F.R. § 710.28.
    uncertainty: The record lacks expert testimony on detection windows and longitudinal drug-testing data, creating some
      uncertainty about the exact duration of abstinence, but the source deemed that insufficient to overcome the security
      concern.
    handoff: The decision is rendered solely by the Administrative Judge, as authorized by 10 C.F.R. § 710.25(d)-(g). No further
      agency review is required unless an appeal is filed.
    tempting_wrong:
      option: O2
      pull: A tendency to favor a compassionate outcome based on the recent negative tests.
      why_wrong: The record lacks verified proof of ongoing abstinence, treatment, or disengagement from drug-using contacts,
        so the security risk has not been sufficiently reduced.
    rejected:
      O2: Reinstating the clearance would contradict the Bond Amendment and the unresolved Guideline H issue.
      O3: Delaying a decision for additional testing is unnecessary because the existing record already demonstrates an absence
        of mitigating factors; the Judge has authority to rule now.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the employee submits expert-validated documentation showing uninterrupted abstinence from cocaine since March
        2026, completes an accredited rehabilitation program, and severs all ties with drug-using associates.
      then: O2
      why: Such corroborated evidence would satisfy mitigation factor (b) of Guideline H, indicating the security concern
        has been effectively addressed.
    would_not_change:
    - id: noflip1
      if: If the employee's drug use was driven solely by personal stress or bereavement.
      why: The source explicitly rejected stress or grief as mitigating circumstances, deeming the conduct serious and recent.
    watch_for:
    - id: watch1
      what: Any subsequent positive drug test or proof of continued association with individuals who use illicit substances.
      favors:
      - O1
      why: New adverse evidence would reinforce the security concern and sustain the denial of clearance.
  lesson: Under DOE security regulations, a recent illegal drug use while holding a clearance, coupled with dishonesty and
    an absence of documented abstinence or treatment, triggers Guideline H concerns that cannot be mitigated; the Bond Amendment
    then bars restoration of the clearance.
  limits: This analysis applies only when the record lacks credible, expert-backed proof of sustained abstinence or rehabilitation.
    If such evidence is later presented, the assessment must be revisited.
