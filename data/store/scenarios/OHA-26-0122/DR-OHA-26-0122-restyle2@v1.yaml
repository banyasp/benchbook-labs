case:
  id: DR-OHA-26-0122-restyle2@v1
  title: Guideline H Mitigation Determination [restyle]
  status: needs_review
  setting: Office of Hearings and Appeals, Department of Energy – 19 October 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: A contractor employee of the Department, who has possessed a security clearance since 6 July 2018, recorded a
    positive cocaine result in a randomly administered drug screen on 16 March 2026. He first denied any use to his employer,
    later acknowledged in May 2026 that his denial was false, and testified that he consumed cocaine on 14 March 2026. He
    later submitted a hair analysis dated 28 July 2026 and a urine analysis dated 12 August 2026, both reporting negative
    findings, but offered no expert testimony on detection windows nor any proof of continuous abstinence for the intervening
    months. The Local Security Office invoked Guideline H and the Bond Amendment, and DOE regulations impose a presumption
    against granting or restoring a clearance to unlawful drug users.
  question: What ruling should the Administrative Law Judge issue concerning the employee's clearance pursuant to Guideline
    H?
  options:
    O1:
      do: Hold the clearance decision pending additional proof of continuous abstinence.
      move: hold
      irreversible: false
    O2:
      do: Refuse to restore the employee's security clearance at this time.
      move: act
      irreversible: true
    O3:
      do: Approve restoration of the employee's security clearance under the present evidence.
      move: act
      irreversible: true
    O4:
      do: Require the employee to submit drug-test results covering March through July 2026.
      move: ask
      irreversible: false
      to: the Individual
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 16 March 2026, an unscheduled drug examination indicated the presence of cocaine in the employee's sample.
  - id: F2
    kind: intelligence
    status: assessed
    fact: In testimony, the employee acknowledged cocaine consumption on 14 March 2026.
  - id: F3
    kind: situation
    status: confirmed
    fact: Since 6 July 2018, the employee has been granted a DOE security clearance.
  - id: F4
    kind: intelligence
    status: assessed
    fact: He first refuted any drug use to his employer, but in May 2026 conceded that his earlier denial was untrue.
  - id: F5
    kind: situation
    status: confirmed
    fact: He submitted a hair specimen analysis dated 28 July 2026 and a urine analysis dated 12 August 2026, both reporting
      negative findings.
  - id: F6
    kind: intelligence
    status: assessed
    fact: No specialist testimony was presented to explain the detection windows applicable to those hair and urine analyses.
  - id: F7
    kind: authority
    status: confirmed
    fact: Guideline H, together with the Bond Amendment, bars the granting of a clearance to any unlawful user of a controlled
      drug.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulatory policy establishes a presumption that a clearance should not be granted or reinstated when a security
      concern exists.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment, incorporated by reference in DOE Order 472.2A, bars any clearance holder who is an unlawful user
      of a controlled substance; the employee's positive cocaine test while cleared triggers that prohibition.
  - id: C2
    facts:
    - F5
    - F6
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Guideline H requires mitigation such as a documented pattern of abstinence; the employee supplied only two isolated
      negative tests, offered no expert analysis, and presented no evidence covering the period between March and July 2026.
  - id: C3
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The employee's initial false statements demonstrate a lack of truthfulness, undermining the reliability and trustworthiness
      requirements of Guideline H.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: 10 C.F.R. § 710.7(a) establishes a presumption against granting or restoring a clearance when a security concern
      exists.
  reasoning:
    read: The employee, a long-standing clearance holder, recorded a positive cocaine result in March 2026, lied about the
      use, and later admitted the deception. He later produced two negative drug tests but gave no expert testimony or continuous
      proof of abstinence. The Local Security Office applied Guideline H and the Bond Amendment, both of which bar clearance
      for unlawful drug users absent convincing mitigation.
    weighing: The Judge treated C1 (Bond Amendment) and C3 (lack of truthfulness) as decisive, concluding that the conduct
      plainly violates statutory and regulatory bars. C2 reinforced that the employee failed to satisfy any mitigating factor
      enumerated in Guideline H (e.g., sustained abstinence, treatment). Although C4 echoes the presumption against clearance,
      it is subordinate to the explicit statutory prohibition. Accordingly, the balance unequivocally supports denial.
    tradecraft: The decision is entered into the OHA docket, cites the applicable statutes and guidelines, and notifies the
      employee of his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The sole uncertainty lies in the absence of expert testimony on detection windows; nevertheless, the Bond
      Amendment's language does not require such proof to deny a clearance.
    handoff: The Administrative Law Judge decides independently, as authorized by 10 C.F.R. § 710.25(d)–(g).
    tempting_wrong:
      option: O3
      pull: The two negative tests could be interpreted as evidence that the employee has stopped using cocaine.
      why_wrong: Without a documented pattern of abstinence, treatment, or truthful conduct, the statutory bar and Guideline
        H remain unmet; granting would violate the Bond Amendment.
    rejected:
      O1: Holding the decision pending additional evidence would disregard the clear statutory prohibition and the lack of
        mitigation presented.
      O3: Restoring the clearance ignores the unresolved security concerns under Guideline H and the Bond Amendment.
      O4: Requesting further test results would not cure the fundamental issues of unlawful use and dishonesty already established.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee provides credible, continuous evidence of abstinence (e.g., regular negative drug tests covering the
        period from March to the present) and completes a prescribed drug-treatment program with a favorable medical prognosis.
      then: O3
      why: These are the mitigating factors listed in Guideline H (factors (b)(1)–(3) and (d)) that, if satisfied, can overcome
        the security concern.
    - id: flip2
      if: The employee had been fully truthful from the outset, admitting drug use without prior deception, thereby restoring
        credibility.
      then: O3
      why: Truthfulness is a core element of reliability; without the dishonesty finding, the weight of the security concern
        would be reduced.
    would_not_change:
    - id: noflip1
      if: The employee only submits the two negative tests already provided without additional evidence of continuous abstinence
        or treatment.
      why: Guideline H requires a pattern of abstinence; isolated negative tests do not satisfy the mitigation requirement.
    watch_for:
    - id: watch1
      what: Any future association with known drug-using individuals or evidence of further drug use.
      favors:
      - O2
      why: Continued exposure to drug-using environments reinforces the lack of self-control and reliability concerns.
  lesson: Under the Bond Amendment and Guideline H, a single unlawful use of a controlled substance while holding a clearance,
    combined with dishonesty and insufficient mitigation, justifies denial of clearance restoration. Mitigation must be concrete,
    continuous, and supported by expert or treatment evidence.
  limits: This analysis applies only when the statutory definition of "unlawful user" is met and the individual fails to meet
    the specific mitigating factors enumerated in Guideline H. It does not address situations where drug use is medically
    prescribed or where the individual has completed a recognized rehabilitation program.
