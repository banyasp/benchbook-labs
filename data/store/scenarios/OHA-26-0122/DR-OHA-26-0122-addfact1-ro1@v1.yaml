case:
  id: DR-OHA-26-0122-addfact1-ro1@v1
  title: Guideline H Mitigation Decision for DOE Security Clearance [addfact]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, September 2026, United States
  decider: Administrative Judge (Diane L. Miles)
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor who has held a security clearance since July 2018, earned three agency performance
    commendations for exemplary conduct on highly classified projects between 2022 and 2025 {F1}. A random drug screen on
    16 March 2026 returned a positive result for cocaine {F2}, leading the Local Security Office to invoke Guideline H and
    the Bond Amendment {F3}. The Individual later acknowledged using cocaine on 14 March 2026 at a social gathering {F4},
    noting that he had initially denied any use to his employer and only corrected that false statement in May 2026 {F5}.
    He subsequently provided a negative hair test on 28 July 2026 and a negative urine test on 12 August 2026 {F6}, but no
    expert testimony was offered regarding the detection windows of those tests {F7}. There is no evidence that he abstained
    from cocaine between March and July 2026, nor after 12 August 2026 {F8}. He signed a written declaration promising to
    refrain from any illegal drug use {F9}. Guideline H classifies illegal drug use while holding a clearance as a security
    concern that impairs reliability and judgment {F10}, and regulatory policy presumes against granting or reinstating a
    clearance when such concerns exist {F11}.
  question: What action should the Administrative Judge take regarding the Individual's Guideline H security concern?
  options:
    O1:
      do: Hold decision and require further testing.
      move: hold
      irreversible: false
    O2:
      do: Do not reinstate the security clearance.
      move: act
      irreversible: true
    O3:
      do: Reinstate the Individual's clearance without delay.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Between 2022 and 2025 the Individual earned three agency performance commendations for exemplary conduct on highly
      classified projects.
  - id: F2
    kind: situation
    status: confirmed
    fact: A random drug screen on 16 March 2026 returned a positive result for cocaine.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Local Security Office cited the positive result under Guideline H and the Bond Amendment.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual acknowledged using cocaine on 14 March 2026 at a social gathering.
  - id: F5
    kind: intelligence
    status: assessed
    fact: He initially told his employer he had not used drugs, but in May 2026 he admitted that statement was false.
  - id: F6
    kind: situation
    status: confirmed
    fact: He later provided a hair test on 28 July 2026 and a urine test on 12 August 2026, both of which were negative for
      cocaine.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: No expert testimony was offered concerning the detection windows of those drug tests.
  - id: F8
    kind: intelligence
    status: assessed
    fact: There is no evidence that the Individual abstained from cocaine between March and July 2026, nor after 12 August
      2026.
  - id: F9
    kind: situation
    status: confirmed
    fact: He signed a written declaration promising to refrain from any illegal drug use.
  - id: F10
    kind: authority
    status: confirmed
    fact: Guideline H classifies illegal drug use while holding a clearance as a security concern that impairs reliability
      and judgment.
  - id: F11
    kind: authority
    status: confirmed
    fact: Regulatory policy presumes against granting or reinstating a clearance when such security concerns are present.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F10
    - F11
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment, incorporated by DOE Order 472.2A, bars granting or restoring a clearance to an unlawful user
      of a controlled substance; the Individual tested positive for cocaine while holding a clearance.
  - id: C2
    facts:
    - F2
    - F4
    - F5
    - F6
    - F7
    - F8
    - F9
    equity: due_process
    favors:
    - O2
    weight: weak
    why: Guideline H concerns remain because the use was recent, voluntary, and accompanied by dishonesty; the record offers
      no credible, continuous-abstinence evidence, though the Individual's pledge (F9) provides a minimal procedural safeguard.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The two negative drug tests are isolated, lack expert interpretation, and no proof of abstinence exists for the four-month
      interval between March and July or after August; the record is therefore inconclusive and warrants additional testing
      before a final determination.
  - id: C4
    facts:
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: weak
    why: The Individual's initial false statement and delayed admission undermine confidence in his reliability and trustworthiness,
      even though later negative tests were submitted.
  - id: C5
    facts:
    - F1
    - F9
    equity: mitigation
    favors:
    - O3
    weight: weak
    why: The commendations for exemplary conduct and the written pledge suggest a history of reliability, but they do not
      outweigh the unresolved drug‑use security concern.
  reasoning:
    read: The Individual, a cleared DOE contractor, used cocaine in March 2026 while holding a security clearance, denied
      the use, later admitted it, and submitted two negative drug tests that lack expert analysis. The core issue is whether
      the Guideline H concern can be resolved without further evidentiary clarification.
    weighing: The Judge notes the Bond Amendment prohibition (C1) and the seriousness of the dishonesty (C2, C4). However,
      the inconclusive nature of the later negative tests (C3) creates uncertainty about current risk, leading to a determination
      that additional testing is required before a final clearance decision can be made.
    tradecraft: The Judge issues a written decision citing DOE Order 472.2A, the Bond Amendment, and relevant CFR provisions,
      and orders the Individual to undergo a supervised drug-testing regimen before any reinstatement determination.
    uncertainty: Absent expert testimony on detection windows and lacking longitudinal testing data, the record does not establish
      continuous abstinence; this uncertainty justifies holding the decision pending further testing.
    handoff: The decision rests solely with the Administrative Judge under 10 C.F.R. § 710.25(d)-(g); no further agency action
      is required unless the Individual appeals.
    tempting_wrong:
      option: O3
      pull: A desire to reward the Individual's prior commendations and the two negative tests.
      why_wrong: Without expert-supported proof of sustained abstinence, reinstating the clearance would ignore the unresolved
        Guideline H security concern.
    rejected:
      O2: Denial now would preempt the opportunity to obtain definitive evidence of abstinence, contrary to the presumption
        of fairness when the record is ambiguous.
      O3: Restoring the clearance would disregard the lack of conclusive proof that the Individual has remained drug-free
        since the March incident.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provided credible, expert-supported evidence of continuous abstinence from cocaine from March 2026
        through the present, completed a documented drug-treatment program, and permanently disassociated from drug-using
        contacts.
      then: O3
      why: Such evidence would satisfy Guideline H mitigation factor (b) and demonstrate that the security concern has been
        resolved.
    - id: flip2
      if: The Individual submits a comprehensive, expert‑validated drug‑testing panel confirming continuous abstinence since
        March 2026 and provides certification of successful completion of a federally recognized treatment program.
      then: O2
      why: These additional assurances would eliminate the uncertainty that currently drives the hold, restoring the parent’s
        position that the clearance should not be reinstated.
    would_not_change:
    - id: noflip1
      if: The Individual's drug use was motivated solely by stress or grief.
      why: The source expressly rejected stress and grief as mitigating circumstances, holding the conduct serious and recent.
    watch_for:
    - id: watch1
      what: Any future positive drug test or evidence of continued association with drug-using individuals.
      favors:
      - O2
      why: New evidence would reinforce the security concern and keep the clearance denied.
  lesson: When a cleared employee's record contains a recent illegal drug use and the subsequent testing evidence is inconclusive,
    the prudent course is to hold the clearance decision and require additional, expert-backed testing before any reinstatement
    can be considered.
  limits: This analysis applies only when the record lacks definitive, expert-verified proof of continuous abstinence or documented
    rehabilitation. If such evidence is later produced, the weighing must be revisited.
