case:
  id: DR-OHA-26-0122@v1
  title: Guideline H Mitigation Determination
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, October 19, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual, a DOE contractor employee holding a security clearance since July 2018, tested positive for cocaine
    in a random drug screen on March 16, 2026. He initially denied use to his employer, later admitted the denial was false
    in May 2026, and testified that he used cocaine on March 14, 2026. He submitted two negative drug tests (hair on July
    28, 2026 and urine on August 12, 2026) but offered no expert analysis of detection windows and no evidence of abstinence
    for the intervening months. The Local Security Office invoked Guideline H and the Bond Amendment, and the DOE regulations
    impose a presumption against granting clearance to unlawful drug users.
  question: What should the Administrative Judge do regarding the Individual’s security clearance under Guideline H?
  options:
    O1:
      do: The Administrative Judge holds the decision pending additional evidence of drug abstinence.
      move: hold
      irreversible: false
    O2:
      do: The Administrative Judge denies restoration of the Individual’s security clearance.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge grants restoration of the Individual’s security clearance.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge asks the Individual to provide drug test results March–July 2026.
      move: ask
      irreversible: false
      to: the Individual
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual tested positive for cocaine in a random drug screening on March 16, 2026.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Individual testified that he used cocaine on March 14, 2026.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual has held a DOE security clearance since July 6, 2018.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Individual initially denied drug use to his employer and later admitted the denial was false in May 2026.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual submitted a negative hair drug test on July 28, 2026 and a negative urine drug test on August 12,
      2026.
  - id: F6
    kind: intelligence
    status: assessed
    fact: No expert testimony was offered regarding the detection windows of the drug tests.
  - id: F7
    kind: authority
    status: confirmed
    fact: Guideline H of the Adjudicative Guidelines and the Bond Amendment prohibit clearance for unlawful users of controlled
      substances.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations create a presumption against granting or restoring a security clearance.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Bond Amendment, incorporated by reference in DOE Order 472.2A, bars a clearance for any unlawful user of a controlled
      substance; the Individual tested positive for cocaine while holding a clearance.
  - id: C2
    facts:
    - F5
    - F6
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Guideline H requires mitigation such as a demonstrated pattern of abstinence; the Individual offered only two negative
      tests with no expert analysis and no evidence covering the months between March and July 2026.
  - id: C3
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Individual’s initial false statements to his employer demonstrate a lack of truthfulness, undermining reliability
      and trustworthiness under Guideline H.
  - id: C4
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: 10 C.F.R. § 710.7(a) creates a presumption against granting or restoring a clearance when a security concern exists.
  reasoning:
    read: The Individual, a long‑time clearance holder, tested positive for cocaine in March 2026, lied about the use, and
      later admitted it. He submitted two negative drug tests months later but offered no expert testimony or continuous proof
      of abstinence. The LSO invoked Guideline H and the Bond Amendment, both of which prohibit clearance for unlawful drug
      users unless mitigation is convincingly shown.
    weighing: The Administrative Judge applied C1 (Bond Amendment) and C3 (lack of truthfulness) as decisive, finding the
      conduct a clear violation of statutory and regulatory prohibitions. C2 showed that the Individual failed to meet any
      mitigating factor listed in Guideline H (e.g., sustained abstinence, treatment). Although C4 reinforces the presumption
      against clearance, it is secondary to the explicit statutory bar. The balance therefore tips unequivocally toward denial.
    tradecraft: The decision is recorded in the OHA docket, cites the relevant statutes and guidelines, and informs the Individual
      of his right to appeal under 10 C.F.R. § 710.28.
    uncertainty: The only uncertainty stems from the lack of expert testimony on detection windows; however, the statutory
      language of the Bond Amendment does not require such proof to deny a clearance.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.25(d)–(g).
    tempting_wrong:
      option: O3
      pull: Two negative drug tests might suggest the Individual has ceased using cocaine.
      why_wrong: Without a demonstrated pattern of abstinence, treatment, or truthful conduct, the statutory bar and Guideline
        H remain unmet; granting would contravene the Bond Amendment.
    rejected:
      O1: Holding the decision pending additional evidence would ignore the clear statutory prohibition and the lack of mitigation
        presented.
      O3: Granting restoration ignores the unresolved security concerns under Guideline H and the Bond Amendment.
      O4: Requesting additional test results would not cure the fundamental issues of unlawful use and dishonesty already
        established.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provides credible, continuous evidence of abstinence (e.g., regular negative drug tests covering
        the period from March to the present) and completes a prescribed drug‑treatment program with a favorable medical prognosis.
      then: O3
      why: These are the mitigating factors listed in Guideline H (factors (b)(1)–(3) and (d)) that, if satisfied, can overcome
        the security concern.
    - id: flip2
      if: The Individual had been fully truthful from the outset, admitting drug use without prior deception, thereby restoring
        credibility.
      then: O3
      why: Truthfulness is a core element of reliability; without the dishonesty finding, the weight of the security concern
        would be reduced.
    would_not_change:
    - id: noflip1
      if: The Individual only submits the two negative tests already provided without additional evidence of continuous abstinence
        or treatment.
      why: Guideline H requires a pattern of abstinence; isolated negative tests do not satisfy the mitigation requirement.
    watch_for:
    - id: watch1
      what: Any future association with known drug‑using individuals or evidence of further drug use.
      favors:
      - O2
      why: Continued exposure to drug‑using environments reinforces the lack of self‑control and reliability concerns.
  lesson: Under the Bond Amendment and Guideline H, a single unlawful use of a controlled substance while holding a clearance,
    coupled with dishonesty and insufficient mitigation, justifies denial of clearance restoration. Mitigation must be concrete,
    continuous, and supported by expert or treatment evidence.
  limits: This reasoning applies only when the statutory definition of "unlawful user" is met and the individual fails to
    meet the specific mitigating factors enumerated in Guideline H. It does not address cases where the drug use is medically
    prescribed or where the individual has completed a recognized rehabilitation program.
