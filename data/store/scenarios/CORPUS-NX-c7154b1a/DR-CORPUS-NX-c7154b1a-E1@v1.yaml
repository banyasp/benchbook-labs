case:
  id: DR-CORPUS-NX-c7154b1a-E1@v1
  title: Congressional Authority for Cyber Responses
  status: draft
  setting: United States, FY19, Congress
  decider: Congress
  agent: Congress
  agent_role: decide
  situation: Congress faced a policy choice about whether responses to cyber provocations should rely exclusively on covert-action
    authorities or also include a military-activity route. Information campaigns targeting individuals and societies were
    assessed as capable of eroding the cooperation needed to sustain democratic society. In France’s 2017 presidential election,
    Russian actors published thousands of campaign emails shortly before the election, while the campaign’s cyber defenses
    limited resulting damage. British leaders in 2017 publicly warned of a growing threat of Russian cyber and electoral disruption,
    potentially backed by powerful military forces. Section 1642 of the FY19 National Defense Authorization Act provides presidential
    authority to direct specified cyber activity in response to certain states’ ongoing campaigns of cyber attacks.
  question: What should Congress do about whether responses to cyber provocations should include a military-activity route
    alongside covert-action authorities?
  options:
    O1:
      do: Congress should authorize a military-activity route alongside covert-action authorities for cyber responses.
      move: act
      irreversible: false
    O2:
      do: Congress should prohibit a military-activity route and retain covert-action authorities for cyber responses.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Targeting individuals and societies through the information space can have strategic effects by eroding the cooperation
      needed to sustain democratic society.
  - id: F2
    kind: situation
    status: assessed
    fact: The 2016 reelection illustrated that information-space targeting of individuals and societies could have strategic
      effects.
  - id: F3
    kind: situation
    status: confirmed
    fact: In France’s spring 2017 presidential race, Russian actors published thousands of a campaign’s emails two days before
      the election.
  - id: F4
    kind: capability
    status: assessed
    fact: The campaign’s cyber defenses limited intrusions and the resulting damage.
  - id: F5
    kind: intelligence
    status: assessed
    fact: British leaders in 2017 publicly cited a growing threat of Russian cyber and electoral disruption potentially backed
      by powerful military forces.
  - id: F6
    kind: authority
    status: confirmed
    fact: Section 1642 of the FY19 National Defense Authorization Act offers the President authority to direct specified cyber
      activity against attacks by named states conducting an active, systematic, and ongoing campaign against the United States,
      including attempts to influence American elections and democratic political processes.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Information-space targeting can erode the cooperation needed to sustain democratic society, making the threat broader
      than disruption of a single election and supporting a response not confined to covert-action authorities.
  - id: C2
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The French election example and British leaders’ warning illustrate electoral disruption and the possibility of powerful
      military backing, supporting inclusion of military action in cyberspace.
  - id: C3
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The campaign’s cyber defenses limited intrusions and resulting damage, showing that harms can be mitigated; this
      example does not establish a reason to exclude a military-activity route.
  - id: C4
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Section 1642 provides presidential authority for specified cyber activity against qualifying ongoing campaigns, consistent
      with Congress’s decision that the response should not rely exclusively on covert action.
  reasoning:
    read: The decision concerns how to respond to cyber provocations whose effects may extend beyond an individual election
      to trust and cooperation in democratic society. The trap is treating the problem as only covert influence or isolated
      electoral interference, despite the assessed strategic effects and the possibility of military backing.
    weighing: The risk of undermining democratic cooperation and the examples of election disruption support including a military-activity
      route {C1} {C2}. The French campaign’s defenses limited damage, which is a counterweight, but that mitigation does not
      establish a reason to rely exclusively on covert action {C3}. Section 1642 supplies a statutory route for specified
      circumstances {C4}; the balance supports O1, while the authority’s stated conditions matter to its scope.
    tradecraft: Keep the legislative choice at the level of whether the route is available, and distinguish that choice from
      any later decision by the President to direct activity. Record the statutory scope and the policy basis for the choice;
      this does not decide whether any particular activity should be undertaken.
    uncertainty: The strategic effects of cyber campaigns and the consequences of future interference are not certain in every
      case. Section 1642 is limited to specified states and qualifying ongoing campaigns.
    handoff: Congress decides whether to provide the route; the President’s authority under Section 1642 concerns whether
      to direct specified activity within the statutory scope. The passage does not assign Congress a later operational decision.
    tempting_wrong:
      option: O2
      pull: Retaining only covert-action authorities may seem sufficient for responding to election interference while avoiding
        a military-activity route.
      why_wrong: The stated conclusion is that responses could not be done exclusively through covert action and had to include
        military action in cyberspace.
    rejected:
      O2: Congress did not choose to confine responses to covert-action authorities because the assessed threat could undermine
        democratic society and the conclusion was that the response had to include military action in cyberspace.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The relevant decision record instead showed that the cyber provocations posed no strategic risk to democratic cooperation
        and no electoral disruption requiring a response beyond covert-action authorities.
      then: O2
      why: Without the central justification for a broader response, the case for adding a military-activity route would be
        substantially weaker.
    would_not_change:
    - id: noflip1
      if: Cyber defenses limited damage in an instance of election interference.
      why: That mitigation does not alter the conclusion that the response could not rely exclusively on covert action.
    watch_for:
    - id: watch1
      what: Whether an attack falls within Section 1642’s stated conditions, including an active, systematic, and ongoing
        campaign by a named state against the United States.
      favors:
      - O1
      why: Those conditions define the statutory scope of the route Congress provided.
  lesson: When cyber provocations can threaten the cooperation sustaining democratic society, a response framework need not
    be confined to covert-action authorities. Provide any additional route through defined legal authority, while keeping
    its existence distinct from a decision to use it in a particular case.
  limits: This reasoning addresses Congress’s choice to include a military-activity route, not whether a particular operation
    is lawful, necessary, or advisable. It does not establish that every cyber provocation meets Section 1642’s conditions.
  library:
    domain: cyber-policy
    family: CORPUS-NX-c7154b1a
    source: https://www.cia.gov/resources/csi/static/d61827122b5a1b8023e0f11678c2edce/Covert-Action-Reconsidered.pdf
    episode_focus: 'The decision point is Congress’s response to cyber provocations: rely exclusively on covert-action authorities
      and oversight, or provide a military-activity route as well. The passage says the response required including military
      action in cyberspace and identifies the statutory authority; exclude operational methods and any later decision to conduct
      a particular operation.'
    cues:
      option_words:
        O1: 12
        O2: 13
      real_option: O1
      real_to_mean_other_length: 0.92
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
