case:
  id: DR-CORPUS-NX-d2d4a405-E1@v1
  title: Habeas Review of Military-Commission Jurisdiction
  status: draft
  setting: United States during wartime; the Court reviewing habeas petitions and military-commission jurisdiction.
  decider: The Court
  agent: The Court
  agent_role: decide
  situation: During wartime in the United States, petitioners were held for trial before a military commission on charges
    under the law of war and the Articles of War. The charge alleged that enemy belligerents entered U.S. territory in civilian
    dress after crossing military and naval defenses, with the hostile purpose of destroying war industries and materials.
    The alleged entry was under the direction of the German High Command, and the stated plan was to damage property used
    in prosecuting the war. A presidential proclamation placed specified wartime entrants charged with hostile acts within
    the jurisdiction of military tribunals under the law of war. The Court was considering habeas petitions concerning the
    petitioners’ military custody and trial.
  question: What should the Court do with the petitioners’ habeas petitions and their challenge to military-commission jurisdiction?
  options:
    O1:
      do: The Court should deny habeas relief and affirm the District Court’s orders, leaving the petitioners in military
        custody.
      move: act
      irreversible: false
    O2:
      do: The Court should grant habeas relief, reverse the District Court’s orders, and order the petitioners discharged
        from military custody.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The petitioners had received instructions in Germany from an officer of the German High Command to destroy war industries
      and facilities in the United States.
  - id: F2
    kind: situation
    status: assessed
    fact: The charge alleged that the petitioners entered the United States in civilian dress, secretly passed military and
      naval defenses, and intended to destroy war industries, utilities, and materials.
  - id: F3
    kind: authority
    status: confirmed
    fact: A presidential order directed a military commission to try the petitioners for offenses against the law of war and
      the Articles of War.
  - id: F4
    kind: authority
    status: confirmed
    fact: A presidential proclamation placed specified wartime entrants charged with hostile acts or violations of the law
      of war under the jurisdiction of military tribunals.
  - id: F5
    kind: authority
    status: confirmed
    fact: The law-of-war framework distinguishes lawful combatants, who may be captured and detained as prisoners of war,
      from unlawful combatants, who may also be tried and punished by military tribunals.
  - id: F6
    kind: authority
    status: confirmed
    fact: The legal framework treats entry into enemy territory during war, without a uniform, for the purpose of destroying
      property used or useful in prosecuting the war as a hostile act subject to punishment under the law of war.
  - id: F7
    kind: situation
    status: confirmed
    fact: The charge characterized the petitioners’ alleged conduct as unlawful belligerency, and at least one petitioner
      was a United States citizen.
  - id: F8
    kind: situation
    status: confirmed
    fact: The petitioners sought habeas corpus review in the Court following District Court proceedings.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The charge alleged secret entry in civilian dress to destroy property used in prosecuting the war. The Court treated
      that conduct as a hostile, warlike act punishable under the law of war.
  - id: C2
    facts:
    - F2
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Court distinguished lawful from unlawful belligerents and held that entering without a uniform for the alleged
      hostile purpose made the petitioners unlawful belligerents, subject to trial and punishment by military tribunal.
  - id: C3
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Because Charge I alleged an offense the President was authorized to have tried by military commission, the Court
      concluded that the commission was lawfully constituted and the petitioners were held in lawful custody.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Court held that U.S. citizenship did not relieve an enemy belligerent from the consequences of unlawful belligerency;
      citizenship therefore did not provide cause for discharge.
  reasoning:
    read: This was habeas review of the charge and the military commission's jurisdiction, not a decision on the petitioners'
      ultimate guilt. The trap is to treat civilian dress, lack of conventional weapons, or the absence of an intended clash
      with U.S. forces as negating belligerency; the Court treated the alleged covert entry to destroy war property as a hostile
      warlike act.
    weighing: The Court found that Charge I alleged unlawful belligerency under the law of war, and that the President was
      authorized to have that offense tried by military commission. It further held that the commission was lawfully constituted
      and custody lawful, and that citizenship did not excuse the alleged unlawful belligerency. Those stated reasons support
      affirming the District Court's orders and denying habeas relief {C1} {C2} {C3} {C4}. The balance depends on the charge
      alleging conduct that constitutes an offense triable by military commission.
    tradecraft: For this review, identify the jurisdictional question presented by the charge, apply the Court's stated law-of-war
      rule to the alleged conduct, and record why the charge supports military-commission jurisdiction and lawful custody.
      Do not treat the habeas ruling as a finding of guilt.
    uncertainty: The holding addresses whether the charge alleged an offense the commission could try and whether custody
      was lawful; it does not determine the ultimate truth of the allegations or the outcome of the trial.
    handoff: The Court decides the habeas challenge. The stated reasoning does not call for referral to another decision-maker.
    tempting_wrong:
      option: O2
      pull: Granting relief may seem warranted if civilian dress, lack of conventional weapons, or a petitioner's U.S. citizenship
        is treated as defeating enemy belligerent status.
      why_wrong: The Court held that covert entry without a uniform to destroy war property was unlawful belligerency, that
        conventional weapons or an intended clash with U.S. forces were not necessary, and that citizenship did not excuse
        the alleged conduct.
    rejected:
      O2: The Court rejected discharge because Charge I alleged a law-of-war offense within military-commission jurisdiction
        and the petitioners were held in lawful custody.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The charge did not allege entry without a uniform for a hostile purpose constituting an offense under the law of
        war.
      then: O2
      why: The Court's stated basis for finding military-commission jurisdiction was that Charge I alleged unlawful belligerency;
        without such an allegation, that basis for denying habeas relief would be absent.
    - id: flip2
      if: The commission lacked lawful authority to try the charged offense.
      then: O2
      why: The Court's denial rested on its conclusion that the President was authorized to order the charged offense tried
        and that the commission was lawfully constituted.
    would_not_change:
    - id: noflip1
      if: A petitioner is a U.S. citizen.
      why: The Court expressly held that citizenship did not relieve an enemy belligerent from the consequences of unlawful
        belligerency.
    - id: noflip2
      if: The petitioners were not alleged to have carried conventional weapons or to have intended a collision with U.S.
        armed forces.
      why: The Court said those circumstances were not significant because the alleged destruction of war industries and supplies
        was itself a hostile warlike act.
    watch_for:
    - id: watch1
      what: Whether the charge alleges secret entry without a uniform for the purpose of committing hostile acts against property
        used in prosecuting the war.
      favors:
      - O1
      why: The Court relied on those allegations to conclude that the charge stated unlawful belligerency under the law of
        war.
  lesson: When reviewing military-commission jurisdiction on habeas, examine whether the charge alleges conduct the governing
    law treats as an offense triable by that commission. Under the Court's reasoning here, citizenship and the absence of
    conventional weapons or an intended clash did not defeat jurisdiction where the charge alleged covert entry without a
    uniform to destroy war property.
  limits: This reasoning addresses the Court's review of this charge and its wartime law-of-war framework; it does not decide
    the petitioners' guilt at trial. It should not be extended to different charges or legal frameworks without examining
    the applicable law and authority.
