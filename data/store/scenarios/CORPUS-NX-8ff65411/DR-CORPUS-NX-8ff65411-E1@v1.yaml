case:
  id: DR-CORPUS-NX-8ff65411-E1@v1
  title: Legal Review of a Suspected Incident
  status: draft
  setting: Military operational chain of command, upon receipt of an initial report of a suspected law of war violation or
    friendly fire incident.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: The Commander receives an initial report of a suspected law of war violation or friendly fire incident. The incident
    remains suspected, and available information requires review. The operational chain of command must address evidence preservation
    and determine whether the information is credible and reportable. Investigation needs may also arise. A higher authority
    or regulation may mandate a formal investigation.
  question: What should the Commander do upon receiving an initial report of a suspected law of war violation or friendly
    fire incident?
  options:
    O1:
      do: The Commander immediately includes judge advocates and paralegals in reviewing available information and guiding
        evidence-preservation measures.
      move: act
      irreversible: false
    O2:
      do: The Commander immediately excludes judge advocates and paralegals from reviewing available information and guiding
        evidence-preservation measures.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: A possible law of war violation or friendly fire incident may be discovered, reported, or reasonably suspected.
  - id: F2
    kind: situation
    status: confirmed
    fact: The decision point arises upon receipt of an initial report of a suspected incident.
  - id: F3
    kind: authority
    status: confirmed
    fact: Commanders should immediately involve judge advocates and paralegals when a possible violation or friendly fire
      incident is discovered, reported, or reasonably suspected.
  - id: F4
    kind: capability
    status: confirmed
    fact: Judge advocates and paralegals guide the operational chain of command on measures to preserve evidence.
  - id: F5
    kind: capability
    status: confirmed
    fact: Judge advocates and paralegals review all available information.
  - id: F6
    kind: capability
    status: confirmed
    fact: Judge advocates and paralegals assist the Commander in determining whether the information is credible and reportable.
  - id: F7
    kind: capability
    status: confirmed
    fact: Judge advocates and paralegals help initiate or assist in investigations.
  - id: F8
    kind: authority
    status: confirmed
    fact: If a higher authority or regulation mandates a formal investigation, judge advocates advise and assist the cognizant
      military criminal investigative organization.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The guidance calls for commanders to involve judge advocates and paralegals immediately when a possible violation
      or friendly fire incident is discovered, reported, or reasonably suspected.
  - id: C2
    facts:
    - F4
    - F5
    equity: record_integrity
    favors:
    - O1
    weight: strong
    why: Judge advocates and paralegals guide evidence-preservation measures and review available information, supporting
      a careful response to the initial report.
  - id: C3
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Their review helps the Commander determine whether the information is credible and therefore reportable; the report
      need not be treated as established before that assessment.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Judge advocates and paralegals can help initiate or assist in investigations, so involving them supports the investigative
      response if one is needed.
  - id: C5
    facts:
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: If a higher authority or regulation mandates a formal investigation, judge advocates advise and assist the cognizant
      military criminal investigative organization.
  reasoning:
    read: This is an initial report of a suspected incident, not a finding that a violation or friendly fire incident occurred.
      The trap is to treat uncertainty as a reason to postpone legal involvement, although the guidance calls for involvement
      at the suspected-report stage and assigns judge advocates and paralegals a role in assessing the information.
    weighing: Immediate involvement is favored because it supports evidence preservation, review of available information,
      and an assessment of credibility and reportability. Their assistance can also support investigations; if a formal investigation
      is mandated, they advise and assist the cognizant military criminal investigative organization. The possible formal-investigation
      requirement affects that later assistance, not the immediate-involvement recommendation.
    tradecraft: Involve judge advocates and paralegals upon receipt of the report. Use their guidance on preserving evidence
      and reviewing available information, and their assistance in determining credibility and reportability. If a higher
      authority or regulation mandates a formal investigation, have judge advocates advise and assist the cognizant military
      criminal investigative organization.
    uncertainty: The information remains under review, and the report's credibility and reportability have not yet been determined.
      The guidance assigns judge advocates and paralegals a role in helping make that assessment; it does not treat suspicion
      alone as proof.
    handoff: The Commander should involve judge advocates and paralegals immediately because the guidance assigns them roles
      in evidence preservation, information review, credibility and reportability assessment, and investigations. If a formal
      investigation is mandated, judge advocates advise and assist the cognizant military criminal investigative organization.
    tempting_wrong:
      option: O2
      pull: Excluding legal personnel may seem prudent while the report remains unverified.
      why_wrong: The guidance calls for their immediate involvement on discovery, report, or reasonable suspicion, and gives
        them a role in assessing whether the information is credible and reportable.
    rejected:
      O2: The Commander should not exclude judge advocates and paralegals because the guidance calls for their immediate involvement
        and assigns them relevant review and investigation roles.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The initial report is withdrawn after it is established that it does not concern any possible law of war violation
        or friendly fire incident.
      then: O2
      why: The trigger for immediate involvement described in this guidance would no longer apply to that report.
    would_not_change:
    - id: noflip1
      if: A higher authority or regulation mandates a formal investigation.
      why: That condition adds a role for judge advocates to advise and assist the cognizant military criminal investigative
        organization; it does not displace immediate involvement.
    watch_for:
    - id: watch1
      what: Whether the information is credible and constitutes a reportable incident.
      favors:
      - O1
      why: Judge advocates and paralegals assist the Commander in making that determination after reviewing available information.
  lesson: When a possible law of war violation or friendly fire incident is reported or reasonably suspected, involve judge
    advocates and paralegals immediately. Their review helps preserve evidence, assess credibility and reportability, and
    support investigations without treating suspicion as a proven finding.
  limits: This reasoning addresses the legal response to an initial report and the roles described in the doctrine. It does
    not determine whether a violation occurred or specify investigative procedures beyond the stated involvement and assistance.
