case:
  id: DR-CORPUS-NX-143ee8bf-E5@v1
  title: The General’s Partnership Decision
  status: draft
  setting: Philadelphia and the United States, July 1806; the presidency and the Louisiana Territory.
  decider: The general
  agent: The general
  agent_role: decide
  situation: 'In July 1806, a political adventurer’s proposed enterprise presented a choice about whether to join it and what
    to tell the President. The plan was alleged to threaten disruption of the United States and an attempt to take Spain’s
    colony of Mexico. The general had recently been removed from the Louisiana Territory governorship by the President. The
    proposal appears to have originated in an earlier contemplated partnership between the general and the adventurer. The
    dispatch’s content and wording were uncertain: the original was not found, and the general’s version may have changed
    passages. Regaining presidential favor may have influenced the general, although that motive is uncertain.'
  question: What should the general do about the proposed partnership and whether to alert the President?
  options:
    O1:
      do: The general approves the partnership and joins the proposed enterprise.
      move: act
      irreversible: true
    O2:
      do: The general defers the partnership decision and asks the President for guidance.
      move: ask
      irreversible: false
      to: the President
    O3:
      do: The general rejects the partnership and warns the President of the alleged plan.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The proposed plan was alleged to threaten disruption of the United States and an attempt to take Spain’s colony
      of Mexico.
  - id: F2
    kind: situation
    status: confirmed
    fact: The general had been removed from the Louisiana Territory governorship in May.
  - id: F3
    kind: situation
    status: assessed
    fact: The proposed enterprise appears to have been designed earlier as a partnership between the general and the political
      adventurer.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The original dispatch was not found, and the general’s version may have changed passages relevant to an indictment
      of him.
  - id: F5
    kind: situation
    status: assessed
    fact: Regaining favor with the President after removal from office may have motivated the general.
  - id: F6
    kind: situation
    status: confirmed
    fact: The general had been a secret, paid informant for the Spanish government in the 1780s.
  considerations:
  - id: C1
    facts:
    - F1
    equity: security_risk
    favors:
    - O3
    weight: strong
    why: The alleged enterprise threatened disruption of the United States and an attempt to take Spain’s colony of Mexico,
      giving the general a stated reason to reject participation and alert the President.
  - id: C2
    facts:
    - F3
    equity: complicity_risk
    favors:
    - O3
    weight: strong
    why: The enterprise appears to have originated in an earlier contemplated partnership between the general and the adventurer.
      The general decided against joining it and warned the President.
  - id: C3
    facts:
    - F2
    - F5
    equity: impartiality
    favors:
    - O2
    weight: weak
    why: The general had recently been removed from office, and he may have warned the President to regain favor. That expressly
      uncertain motive makes caution about the general’s possible self-interest appropriate.
  - id: C4
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The original dispatch was not found, and the general’s version may have changed passages relevant to an indictment
      of him. That uncertainty counsels against treating the alleged plan or the general’s account as established fact.
  reasoning:
    read: The choice was whether to participate in an alleged enterprise threatening the United States and to alert the President.
      The trap is that the general had apparently once contemplated partnering in the enterprise and may have had a personal
      reason to warn the President after his removal from office; the uncertain dispatch cannot be treated as proof of the
      allegations.
    weighing: 'The source’s stated course was to reject the partnership and warn the President: the alleged threat to the
      United States and Mexico weighed against joining, while the general’s prior connection and possible motive make his
      account less secure. Those uncertainties qualify the warning, but the source’s documented outcome remains O3. The balance
      depends on keeping the alleged plan distinct from proven fact and acknowledging the limits of the general’s account.'
    tradecraft: State the allegation as an allegation, distinguish what is known from what is uncertain, and disclose the
      general’s prior connection and possible self-interest when reporting. Preserve an accurate account of what was communicated
      and what remains unverified.
    uncertainty: The original dispatch was not found, and the general may have altered passages that could have implicated
      him. Historians and biographers have offered differing decipherments, so neither the wording nor the truth of the alleged
      plan is established by this extract.
    handoff: The general warned the President. As a decision practice, the report should reach the President with the evidentiary
      limitations and the general’s possible conflict made clear, rather than being presented as conclusive proof.
    tempting_wrong:
      option: O1
      pull: The proposal appears to have begun as a contemplated partnership involving the general.
      why_wrong: That earlier connection is not a reason to join an enterprise alleged to threaten the United States; the
        general in fact decided against partnering in it.
    rejected:
      O1: The general rejected partnership rather than join the alleged enterprise.
      O2: The source records that the general rejected the partnership and warned the President, rather than deferring for
        guidance.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the alleged threat was unfounded and that the dispatch did not support the allegation.
      then: O2
      why: With the asserted basis for warning substantially undermined, deferring for presidential guidance would be preferable
        to presenting the allegation as a warning of a real plan.
    would_not_change:
    - id: noflip1
      if: The general’s motive to regain presidential favor remained unproven.
      why: That uncertainty does not remove the source’s stated reason to reject participation in the alleged enterprise,
        though it remains relevant to how the warning is assessed.
    watch_for:
    - id: watch1
      what: Independent evidence clarifying the alleged plan or the accuracy of the general’s account.
      favors:
      - O2
      why: Such evidence would help assess the allegation without treating the missing original or the general’s potentially
        altered version as conclusive.
  lesson: Rejecting a proposed partnership and alerting an appropriate authority can be warranted when the alleged stakes
    are serious, even if the evidence is uncertain. A decision-maker with a possible personal interest should disclose that
    interest and clearly separate allegation from established fact.
  limits: This reasoning does not establish that the alleged plan was real or that the general’s account was accurate. It
    applies to the described choice and does not resolve the historical dispute over the dispatch’s contents or the general’s
    motive.
