case:
  id: DR-CORPUS-NX-143ee8bf-E4@v1
  title: Frontier Reports and Temporary Secrecy
  status: draft
  setting: Early September 1785, Office of the Secretary of Foreign Affairs, Congress
  decider: The Secretary of Foreign Affairs
  agent: The Secretary of Foreign Affairs
  agent_role: decide
  situation: In early September 1785, the Secretary of Foreign Affairs had private intelligence that made surrender of the
    posts seem less certain. Congress had ordered troops raised, and reports linked that action to British attention and two
    regiments ordered toward Quebec. The Loyalists at the posts were estimated at six to seven thousand and reported to receive
    government arms and rations. Other frontier reports described Canadian encouragement for settlers near the posts and movement
    of people from the United States toward those lands. The credibility of the intelligence could not be ascertained, though
    it was consistent with other reports. The Secretary had to decide whether to bring the reports before Congress and what
    to recommend about their circulation.
  question: What should the Secretary of Foreign Affairs do with the reports and recommend about their circulation?
  options:
    O1:
      do: The Secretary of Foreign Affairs lays the reports before Congress and recommends that Congress keep them secret
        temporarily.
      move: act
      irreversible: true
    O2:
      do: The Secretary of Foreign Affairs lays the reports before Congress and recommends that Congress disclose them.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Private intelligence made surrender of the posts seem more problematic than it had recently appeared.
  - id: F2
    kind: situation
    status: confirmed
    fact: Congress had ordered some troops to be raised.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Reports indicated that the troop order drew the British ministry's attention and that two regiments were ordered
      to embark for Quebec.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The Loyalists at the different posts were estimated at between six and seven thousand and were reported to receive
      arms and rations from the British government.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Frontier reports indicated that the government of Canada encouraged people from the United States to settle lands
      near the posts.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Frontier reports indicated that a considerable number of people from the United States had moved to those lands
      after receiving offers.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Secretary could not ascertain the degree of credit due to the intelligence.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The intelligence was consistent with other reports recently received from the frontiers.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    - F6
    - F7
    - F8
    equity: oversight_candor
    favors:
    - O1
    - O2
    weight: strong
    why: The Secretary expressly judged it his duty to lay the matters before Congress, despite being unable to ascertain
      the intelligence's credibility.
  - id: C2
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The intelligence was unverified, though consistent with other frontier reports. That combination supports bringing
      it to Congress while avoiding a recommendation for wider disclosure as though the reports were established.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: The reports concerned British military activity, armed Loyalists, and efforts to attract settlers near the posts.
      The Secretary recommended temporary secrecy, although he did not state a specific security rationale.
  reasoning:
    read: The Secretary faced an information-handling decision, not a choice between treating the intelligence as proven and
      ignoring it. The reports made surrender of the posts seem less certain, but their credibility could not be ascertained;
      the trap is letting that uncertainty either suppress information Congress should receive or turn it into a basis for
      wider disclosure.
    weighing: The stated duty to lay the matters before Congress supports reporting them despite the uncertainty. Their consistency
      with other frontier reports lends them enough significance to bring forward, but does not verify them. The Secretary
      therefore recommended reporting them to Congress while keeping them secret for the present. The source gives no further
      explanation for the secrecy recommendation.
    tradecraft: Present the reports as unverified intelligence rather than established fact, and keep the temporary secrecy
      recommendation distinct from the duty to inform Congress. The source does not specify further handling or recording
      procedures.
    uncertainty: The Secretary expressly could not ascertain how much credit the intelligence deserved. Its consistency with
      other frontier reports is relevant context, not confirmation.
    handoff: The Secretary chose to bring the matters before Congress, the body to which he said he owed the duty to report
      them. The source does not specify a further review process.
    tempting_wrong:
      option: O2
      pull: Disclosure may seem the more candid response to information that Congress needs to assess.
      why_wrong: 'The Secretary distinguished informing Congress from wider disclosure: he judged reporting a duty while recommending
        that the matters remain secret for the present.'
    rejected:
      O2: The Secretary did not recommend disclosure; he recommended that the matters be kept secret for the present.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable assessment established that broader disclosure would create no material security concern.
      then: O2
      why: The source gives no separate reason for secrecy beyond its recommendation; removing a plausible security concern
        could shift the balance toward disclosure.
    would_not_change:
    - id: noflip1
      if: The intelligence remained impossible to verify but continued to comport with other reports.
      why: That was the situation the Secretary described, and he still judged it his duty to bring the matters before Congress
        while recommending temporary secrecy.
    watch_for:
    - id: watch1
      what: Whether subsequent information strengthens or undermines the reports' credibility.
      favors:
      - O1
      - O2
      why: The Secretary identified uncertainty about the intelligence's credibility and noted its consistency with other
        reports; changes in that evidentiary picture could affect the case for wider disclosure.
  lesson: Unverified information may still warrant prompt reporting to the responsible oversight body when the decision-maker
    believes reporting is a duty. Reporting to that body and disclosing more broadly are separate choices; uncertainty and
    the sensitivity of the subject can support temporary restraint without suppressing the information from Congress.
  limits: The source records the Secretary's recommendation but does not explain the specific reason for temporary secrecy
    or prescribe a broader disclosure policy. This reasoning does not establish that secrecy is appropriate when governing
    law or a reporting duty requires wider disclosure.
