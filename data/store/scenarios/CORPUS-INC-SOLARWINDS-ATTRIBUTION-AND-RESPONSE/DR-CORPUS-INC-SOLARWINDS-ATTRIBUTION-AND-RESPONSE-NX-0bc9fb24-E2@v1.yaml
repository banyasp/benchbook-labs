case:
  id: DR-CORPUS-INC-SOLARWINDS-ATTRIBUTION-AND-RESPONSE-NX-0bc9fb24-E2@v1
  title: Public Response to an Assessed Intelligence Operation
  status: draft
  setting: United States, 2021; US government policy response to the SolarWinds operation
  decider: The US government
  agent: The US government
  agent_role: decide
  situation: In 2021, the US government faced a policy choice about a public response to the SolarWinds operation. US and
    UK assessments treated the initial compromise and follow-on activity as most likely intelligence collection rather than
    activity intended to produce cyber effects. The operation’s scope and scale, alongside Russia’s history of reckless and
    disruptive cyber activity, were presented as national-security concerns; allied statements also situated it alongside
    electoral interference and aggressive conduct. At the same time, observers questioned whether condemning such intelligence
    activity was consistent with Five Eyes practices, and whether scale alone supplied a defensible threshold. Public attribution
    could impose costs and increase private-sector awareness, while intelligence collection was described as an enduring practice
    of statecraft that cannot reliably be prevented.
  question: What should the US government do about publicly attributing the assessed intelligence-collection operation and
    imposing targeted sanctions?
  options:
    O1:
      do: The US government withholds public attribution, does not denounce Russian electoral interference, and imposes no
        targeted sanctions on Russian government and private-sector entities.
      move: act
      irreversible: false
    O2:
      do: The US government publicly attributes the operation, denounces Russian electoral interference, and imposes targeted
        sanctions on Russian government and private-sector entities.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: US and UK intelligence assessments judged that the initial compromise and follow-on activity were most likely for
      intelligence collection, rather than cyber operations intended to produce effects.
  - id: F2
    kind: situation
    status: assessed
    fact: The US Treasury characterized the operation’s scope and scale, together with Russia’s history of reckless and disruptive
      cyber operations, as a national-security concern.
  - id: F3
    kind: situation
    status: assessed
    fact: The UK characterized the campaign as malign behavior within a wider pattern that included election interference
      and aggressive behavior.
  - id: F4
    kind: situation
    status: assessed
    fact: Observers questioned whether condemning the operation was consistent with Five Eyes intelligence practices, noting
      that allied states conduct similar operations.
  - id: F5
    kind: situation
    status: assessed
    fact: A former White House official argued that the operation’s scale and disproportionality made it worth singling out
      as a violation of cyber-espionage norms meriting sanctions.
  - id: F6
    kind: situation
    status: assessed
    fact: Scale had not appeared to be a useful rubric for determining cyber-espionage deterrence thresholds.
  - id: F7
    kind: situation
    status: assessed
    fact: Cyber espionage was described as an established part of modern statecraft that cannot reliably be prevented, though
      counterintelligence can frustrate it.
  - id: F8
    kind: situation
    status: assessed
    fact: Public attribution was identified as a way to impose costs on adversaries and increase private-sector awareness
      of cyber-espionage threats.
  considerations:
  - id: C1
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: 'Because intelligence collection is an established practice that cannot reliably be prevented, the realistic policy
      aim is shaping: imposing friction and costs so the activity becomes harder and less successful, rather than claiming
      it can be stopped.'
  - id: C2
    facts:
    - F8
    equity: public_transparency
    favors:
    - O2
    weight: strong
    why: Public attribution can impose costs on an adversary and increase private-sector awareness of cyber-espionage threats,
      giving disclosure practical value beyond criminal punishment.
  - id: C3
    facts:
    - F2
    - F3
    - F5
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The operation's scope and scale, considered alongside Russia's record of reckless and disruptive cyber activity and
      electoral interference, supported treating the episode as a national-security concern and responding with targeted sanctions.
  - id: C4
    facts:
    - F4
    - F6
    equity: norm_reciprocity
    favors:
    - O1
    weight: strong
    why: Condemning intelligence collection risks appearing hypocritical when allied states conduct similar operations, and
      scale alone had not proved a useful basis for a cyber-espionage deterrence threshold.
  reasoning:
    read: This was assessed as intelligence collection, not an operation intended to produce cyber effects {F1}. The decision
      is therefore not whether to promise prevention, which is unrealistic, but whether a public response can shape conduct.
      The trap is to treat intelligence collection itself as an exceptional wrong while overlooking allied practices, or to
      treat scale by itself as a settled threshold.
    weighing: 'The case for {O2} rests on shaping rather than preventing espionage: attribution can impose costs and raise
      awareness {C1} {C2}, while the scope of the operation and Russia''s wider conduct supplied a national-security rationale
      for the public response and sanctions {C3}. The counterweight is substantial: allied intelligence practices make condemnation
      vulnerable to charges of hypocrisy, and scale alone is not a reliable deterrence rubric {C4}. The balance favors {O2}
      only when the rationale is clearly tied to the operation''s scale and broader harmful conduct, and the response is presented
      as an effort to impose costs and frustrate activity—not as proof that espionage can be prevented or as a general rule
      that large-scale collection is impermissible.'
    tradecraft: State publicly what the response is meant to achieve—costs, disruption, and awareness—and distinguish intelligence
      collection from conduct such as election interference and reckless, disruptive activity. Explain why the combined circumstances
      warrant sanctions rather than relying on scale alone; keep the public rationale at the policy level and record the limits
      of what the response can establish.
    uncertainty: Available data do not establish that engagement can prevent espionage, and consistent US deterrence goals
      over the decade are unclear. The response's value should therefore be judged as shaping, not as demonstrated prevention.
    handoff: The US government makes the policy decision; an internally coordinated rationale is appropriate because the response
      combines public attribution, diplomatic condemnation, and sanctions, each of which should support the same stated shaping
      objective.
    tempting_wrong:
      option: O1
      pull: Withholding attribution and sanctions avoids the appearance of condemning conduct that Five Eyes members also
        undertake, and avoids treating scale as a deterrence threshold.
      why_wrong: 'That concern warrants a more precise rationale, not silence: public attribution can impose costs and increase
        awareness, and the operation was presented alongside broader Russian conduct as a national-security concern.'
    rejected:
      O1: The case for withholding the response is outweighed by the potential for attribution to impose costs and raise awareness,
        alongside the national-security concern presented by the operation's scale and Russia's wider conduct.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The case for response rested on scale alone, with no substantiated wider pattern of disruptive or otherwise harmful
        conduct.
      then: O1
      why: Scale alone is not a useful threshold; without the broader conduct that contextualized the response, the rationale
        for sanctions would be materially weaker.
    - id: flip2
      if: Public attribution and sanctions had no plausible prospect of imposing costs, frustrating activity, or increasing
        awareness.
      then: O1
      why: The affirmative case for a response is shaping through costs and awareness, not prevention or punishment for its
        own sake.
    would_not_change:
    - id: noflip1
      if: Intelligence collection remained impossible to prevent reliably.
      why: That does not rule out a response aimed at making it harder and less successful; shaping is distinct from prevention.
    watch_for:
    - id: watch1
      what: Whether the response identifies the cyber-espionage behaviors most likely to cause inadvertent or uncontrolled
        escalation.
      favors:
      - O2
      why: This behavioral focus is a potential policy goal within a shaping framework.
  lesson: When intelligence collection cannot reliably be prevented, assess public responses by whether they can impose costs,
    frustrate activity, or improve awareness. Make the rationale specific to the conduct and context; scale alone is a weak
    threshold, especially when the condemning state and its allies conduct similar operations.
  limits: This reasoning applies to a policy response to activity assessed as intelligence collection, not to operations intended
    to produce cyber effects or to cases governed by a distinct legal prohibition. It does not establish that attribution
    or sanctions will prevent espionage, nor does it supply a universal threshold for sanctions.
