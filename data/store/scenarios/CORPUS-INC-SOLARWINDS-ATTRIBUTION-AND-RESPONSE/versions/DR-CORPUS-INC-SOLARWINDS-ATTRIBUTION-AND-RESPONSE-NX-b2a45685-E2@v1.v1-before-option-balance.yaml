case:
  id: DR-CORPUS-INC-SOLARWINDS-ATTRIBUTION-AND-RESPONSE-NX-b2a45685-E2@v1
  title: Public Response to the SolarWinds Operation
  status: draft
  setting: United States and United Kingdom, 2021, national-security and foreign-policy institutions.
  decider: The US government
  agent: The US government
  agent_role: decide
  situation: The US and UK assessed that the SolarWinds initial compromise and follow-on activities were most likely intended
    for intelligence collection rather than destructive cyber effects. Open-source accounts linked the group attributed with
    the operation to Russia’s foreign intelligence service. The operation’s scale and Russia’s history of disruptive cyber
    activity were raised as national-security concerns. The response options included making the attribution public, denouncing
    broader Russian conduct, and imposing targeted sanctions, or withholding those public measures. US policy discussions
    also faced questions about how to distinguish acceptable espionage from intolerable conduct and how consistently to signal
    that distinction.
  question: What should the US government do in response to the operation assessed as intelligence collection?
  options:
    O1:
      do: The US government publicly discloses its attribution, condemns broader Russian conduct, and imposes targeted sanctions.
      move: act
      irreversible: true
    O2:
      do: The US government withholds its attribution, avoids public condemnation, and imposes no targeted sanctions.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Distinguishing acceptable cyber espionage from intolerable activity has made it difficult to communicate expectations
      and objectives clearly.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The US and UK assessments judged that the SolarWinds initial compromise and follow-on activities were most likely
      for intelligence collection rather than destructive cyber effects or other operations.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Open-source accounts linked the group attributed with the operation to Russia’s foreign intelligence service.
  - id: F4
    kind: situation
    status: assessed
    fact: The US Treasury characterized the scope and scale of the compromise, together with Russia’s history of reckless
      and disruptive cyber operations, as a national-security concern.
  - id: F5
    kind: situation
    status: assessed
    fact: The UK characterized the campaign as malign behavior within a broader pattern that included election interference
      and aggressive behavior.
  - id: F6
    kind: situation
    status: confirmed
    fact: The public response included denunciation of Russian conduct and targeted sanctions against Russian government and
      private-sector entities.
  - id: F7
    kind: situation
    status: assessed
    fact: US policy over the decade lacked continuity, and its deterrence goals were unclear to an outsider.
  - id: F8
    kind: situation
    status: assessed
    fact: Criminal charges against PRC-sponsored hackers have blurred the distinction between economic crime and intelligence
      gathering.
  - id: F9
    kind: situation
    status: assessed
    fact: Sanctions, criminal indictments, and diplomatic engagement may have influenced PRC intelligence actors, but there
      is no data showing that such engagement can prevent espionage.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Although the activity was assessed as intelligence collection rather than destructive cyber effects, its scope and
      scale, together with Russia's history of disruptive cyber operations, made it a national-security concern. Public attribution
      can disrupt activity and force changes in conduct. [src:65f9a685f330#p6.11] [src:65f9a685f330#p6.12] [src:65f9a685f330#p6.13]
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: public_transparency
    favors:
    - O1
    weight: strong
    why: The public response connected the operation to a broader pattern of Russian conduct and paired attribution with denunciation
      and targeted sanctions. That makes the response intelligible as a response to the operation's scale and wider context,
      rather than as a claim that intelligence collection alone was destructive activity. [src:65f9a685f330#p6.12] [src:65f9a685f330#p6.13]
  - id: C3
    facts:
    - F1
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Unclear deterrence goals, discontinuity in US policy, and criminal charges that blur intelligence gathering with
      economic crime undermine consistent signaling. These concerns weigh against presenting the public measures as a clear,
      general rule about espionage. [src:65f9a685f330#p6.11] [src:65f9a685f330#p6.13]
  - id: C4
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Sanctions, indictments, and diplomatic engagement may influence intelligence actors, but there is no data showing
      that these measures can prevent espionage. The response should therefore not be justified by claiming that it will prevent
      espionage. [src:65f9a685f330#p6.13]
  reasoning:
    read: This was assessed as intelligence collection, not a destructive cyber operation, but its scale and Russia's wider
      record made it a national-security concern. The trap is to treat all espionage as either acceptable and beyond response,
      or as equivalent to destructive cyber activity; the challenge is to draw and communicate that line.
    weighing: The operation's scale and the broader pattern support public attribution, denunciation, and targeted sanctions
      {C1} {C2}. Policy inconsistency, blurred distinctions in criminal charges, and lack of evidence that engagement prevents
      espionage counsel restraint in what the measures are claimed to achieve {C3} {C4}. The balance supports {O1} as a response
      to this operation and its context, not as proof that public measures prevent espionage or establish a consistent deterrence
      policy.
    tradecraft: State the purpose and limits of the public response, distinguish intelligence collection from destructive
      conduct, and explain why the operation's scale and broader context justify these measures. Record the policy rationale
      and assess its consistency with prior and future signaling; do not claim a deterrent effect that the available evidence
      does not establish.
    uncertainty: US deterrence goals were unclear because policy lacked continuity, and there is no data showing that sanctions,
      indictments, and diplomatic engagement can prevent espionage. The assessment was that the operation was most likely
      for intelligence collection, not destructive effects.
    handoff: The source does not specify a decision process. As a decision practice, coordinate the public rationale across
      national-security and foreign-policy institutions and with the UK, so the attribution, broader condemnation, and sanctions
      communicate a consistent policy distinction.
    tempting_wrong:
      option: O2
      pull: Withholding public measures avoids treating intelligence collection as automatically intolerable and avoids a
        potentially inconsistent or hypocritical signal.
      why_wrong: The operation's scale and Russia's broader record were considered a national-security concern, and public
        attribution was justified in that context.
    rejected:
      O2: The stated justification for public attribution in response to the operation's scale and broader Russian conduct
        weighs against withholding all public measures.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible reassessment showed that the operation's scale and the broader conduct cited as its context did not present
        the stated national-security concern.
      then: O2
      why: The stated justification for public attribution rests on the operation's scale and the broader pattern of conduct.
    would_not_change:
    - id: noflip1
      if: The operation remains assessed as intelligence collection rather than destructive cyber effects.
      why: That was already the assessment when public attribution was judged justified in light of scale and wider context.
    watch_for:
    - id: watch1
      what: Whether US policy develops clearer, more continuous deterrence goals and a more consistent distinction between
        espionage and intolerable conduct.
      favors:
      - O2
      why: Policy discontinuity and unclear goals are obstacles to communicating expectations; those concerns should shape
        how public measures are explained and applied.
  lesson: 'Publicly responding to intelligence collection need not imply that all espionage is intolerable: the justification
    here rests on the operation''s scale and broader context. Explain the distinction and the limits of the response, and
    do not claim preventive or deterrent effects that the evidence does not establish.'
  limits: This reasoning applies to the assessed SolarWinds operation and the stated context of its scale and Russia's broader
    conduct. It does not establish a general rule that intelligence collection warrants public attribution or sanctions, nor
    that such measures prevent espionage.
