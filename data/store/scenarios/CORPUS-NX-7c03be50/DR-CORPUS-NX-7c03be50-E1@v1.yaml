case:
  id: DR-CORPUS-NX-7c03be50-E1@v1
  title: Authorization of OGS Operations Against ISIS
  status: draft
  setting: United States, November 2016, execute-order authorization
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: In October 2014, the United States established CJTF-OIR to counter ISIS, using coalition air and ground forces
    and support to local forces and opposition groups. ISIS used the internet to recruit, radicalize, threaten, and intimidate,
    and to maintain global reach. CJTF-OIR could not disrupt that reach solely through air or ground forces. By May 2016,
    JTF-ARES had been authorized to counter ISIS in cyberspace as a subordinate to CYBERCOM, outside the control of the theater
    command and CJTF-OIR. In November 2016, the Commander faced an execute-order decision concerning offensive cyberspace
    operations under OGS against ISIS.
  question: What should the Commander do about approving an execute order for offensive cyberspace operations under OGS against
    ISIS?
  options:
    O1:
      do: The Commander approves the execute order for offensive cyberspace operations under OGS against ISIS.
      move: act
      irreversible: false
    O2:
      do: The Commander rejects the execute order for offensive cyberspace operations under OGS against ISIS.
      move: act
      irreversible: false
    O3:
      do: The Commander requests further assessment from CYBERCOM before deciding on the execute order.
      move: ask
      irreversible: false
      to: CYBERCOM
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The United States established CJTF-OIR in October 2014 to counter ISIS.
  - id: F2
    kind: situation
    status: confirmed
    fact: CJTF-OIR pursued ISIS with coalition air and ground forces and support to local forces and opposition groups.
  - id: F3
    kind: situation
    status: confirmed
    fact: ISIS used the internet to recruit, radicalize, threaten, and intimidate.
  - id: F4
    kind: capability
    status: assessed
    fact: ISIS used the internet to maintain global reach, which CJTF-OIR could not disrupt solely with air or ground forces.
  - id: F5
    kind: authority
    status: confirmed
    fact: JTF-ARES was authorized in May 2016 to counter ISIS in cyberspace as a subordinate to CYBERCOM and outside the control
      of the theater command or CJTF-OIR.
  - id: F6
    kind: authority
    status: confirmed
    fact: The decision concerned an execute order authorizing offensive cyberspace operations under OGS against ISIS targets.
  considerations:
  - id: C1
    facts:
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: ISIS used the internet to recruit, radicalize, threaten, and intimidate, making its online reach relevant to the
      counter-ISIS mission.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The source identifies a capability gap: CJTF-OIR could not disrupt ISIS''s global reach solely through air or ground
      forces.'
  - id: C3
    facts:
    - F5
    - F6
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The cyberspace mission had been placed under CYBERCOM, outside the theater command, and the decision was an execute-order
      authorization for operations under OGS. This establishes a distinct command arrangement, but does not by itself establish
      the legal sufficiency of every authority.
  reasoning:
    read: This was a decision about addressing a mission-relevant capability gap, not simply choosing between cyberspace and
      the existing air-and-ground campaign. ISIS's internet use supported recruitment, intimidation, and global reach; the
      stated limit was that conventional forces alone could not disrupt that reach.
    weighing: The source's rationale favors approval because ISIS's online activity served the adversary's global reach and
      the existing air-and-ground approach could not address it by itself. The separate CYBERCOM command arrangement and execute-order
      authorization provide context for the decision, but the decisive balance depends on the stated capability gap; the source
      does not set out a detailed legal or collateral-effects analysis.
    tradecraft: As a decision practice, record the mission gap, the authority relied on, and why the chosen course addresses
      a need the existing approach cannot meet. Keep the decision record distinct from operational implementation details.
    uncertainty: The source identifies the strategic need and the command arrangement but does not give the commander's detailed
      deliberations, a specific legal analysis, or an assessment of possible effects on third parties or essential services.
    handoff: The source places JTF-ARES under CYBERCOM and describes interagency and partner input as helping prevent interference
      with existing operations. As a decision-level practice, involve CYBERCOM and relevant partners where needed to clarify
      authority and avoid conflicts; this does not replace the commander's approval decision.
    tempting_wrong:
      option: O2
      pull: Rejecting the order could seem prudent because the operation was outside the theater command's control and involved
        offensive cyberspace action.
      why_wrong: 'That concern does not answer the source''s central rationale: air and ground forces alone could not disrupt
        the internet-enabled global reach that supported ISIS''s activities.'
    rejected:
      O2: Rejection was not chosen because it would leave the stated gap in disrupting ISIS's internet-enabled reach unaddressed.
      O3: Further assessment from CYBERCOM was not chosen because the source's stated rationale supported acting on the identified
        capability gap, and the command arrangement had already placed the cyberspace mission under CYBERCOM.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible assessment showed that ISIS no longer depended on internet-enabled reach for the activities at issue,
        or that existing air-and-ground operations could disrupt that reach without the proposed order.
      then: O2
      why: The source's principal reason for approval is the gap left by air and ground forces; if that gap were absent, the
        stated rationale for this order would substantially weaken.
    - id: flip2
      if: The command could not establish that the execute order was within the applicable authority or delegation.
      then: O3
      why: An unresolved authority question would warrant clarification before approval rather than treating the existence
        of a command arrangement as proof of legal sufficiency.
    would_not_change:
    - id: noflip1
      if: JTF-ARES remains subordinate to CYBERCOM rather than under the theater command.
      why: That separation is part of the described command arrangement and does not, by itself, remove the stated need to
        address ISIS's internet-enabled reach.
    watch_for:
    - id: watch1
      what: Whether ISIS's internet use continues to sustain reach that the existing air-and-ground approach cannot disrupt.
      favors:
      - O1
      - O3
      why: That assessment bears directly on whether the source's stated capability gap persists and whether further decision-level
        review is warranted.
  lesson: When an adversary uses a domain to sustain mission-relevant reach that the existing approach cannot disrupt, assess
    whether an authorized course in that domain addresses the gap. The capability gap supports action, but it does not substitute
    for confirming authority or considering effects not addressed in the available record.
  limits: This reasoning supports approval in the specific context of the stated ISIS internet-use problem and the described
    authorization; it does not establish that offensive cyberspace operations are generally lawful or appropriate. The source
    provides no detailed account of legal review, third-party effects, or operational limits.
