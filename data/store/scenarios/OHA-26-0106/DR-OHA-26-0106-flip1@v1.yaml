case:
  id: DR-OHA-26-0106-flip1@v1
  title: Guideline G Alcohol Consumption Clearance Restoration [flip]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, 7 October 2026
  decider: Administrative Law Judge
  agent: Adjudication Support System
  agent_role: decide
  situation: The Individual was arrested on 3 September 2025 for driving while intoxicated, registering a blood-alcohol concentration
    of .233 g/210 L. The Local Security Office subsequently filed a security-concern notification under Guideline G, citing
    the arrest and alleged habitual binge drinking. In January 2026 a DOE psychologist evaluated the Individual and concluded
    that the person habitually engaged in binge-drinking and that there was insufficient evidence of rehabilitation. The Individual
    later fulfilled a court-ordered 26-week outpatient alcohol-treatment program, attended supplemental alcohol-education
    classes, and complied with the contractor's fitness-for-duty monitoring. A series of phosphatidylethanol (PEth) screens
    from December 2025 through August 2026 were negative, suggesting abstinence. Both the occupational psychologist and the
    DOE psychologist testified that the Individual had participated in treatment, received favorable feedback, and maintained
    sustained abstinence. However, a PEth assay performed in February 2026 showed markedly elevated levels, confirming recent
    substantial alcohol intake, and the occupational psychologist testified that, in light of that result, there was evidence
    of recent drinking despite prior treatment.
  question: How should the Adjudication Support System rule on the Individual's access authorization under Guideline G?
  options:
    O1:
      do: Request further documentation from the Local Security Office regarding the concern.
      move: ask
      irreversible: false
      to: Security Office
    O2:
      do: Hold the Individual's access authorization pending additional review.
      move: hold
      irreversible: false
    O3:
      do: Deny the Individual's access authorization based on recent evidence.
      move: act
      irreversible: true
    O4:
      do: Restore the Individual's access authorization if future evidence supports it.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested on 3 September 2025 for a DUI with a blood-alcohol concentration of .233 g/210 L.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a notification asserting substantial doubt about the Individual's eligibility under
      Guideline G.
  - id: F3
    kind: intelligence
    status: assessed
    fact: A DOE psychologist's January 2026 evaluation concluded the Individual habitually binge-drank and lacked adequate
      evidence of rehabilitation.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual completed a court-ordered 26-week outpatient alcohol-treatment program and supplemental education
      classes.
  - id: F5
    kind: capability
    status: confirmed
    fact: A phosphatidylethanol assay performed in February 2026 showed markedly elevated levels, confirming recent substantial
      alcohol intake.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The occupational psychologist testified that, in light of the February 2026 PEth result, there was evidence of recent
      drinking despite prior treatment.
  - id: F7
    kind: authority
    status: confirmed
    fact: Guideline G of the Adjudicative Guidelines designates excessive alcohol use as a security concern and lists mitigation
      factors such as acknowledgment, treatment completion, and sustained abstinence.
  - id: F8
    kind: authority
    status: confirmed
    fact: Regulatory policy presumes against granting a security clearance; the Individual must demonstrate that restoration
      would not jeopardize the common defense or national security.
  - id: F9
    kind: authority
    status: assessed
    fact: The Administrative Law Judge delegated authority to the Adjudication Support System to determine the Individual's
      access authorization.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Local Security Office correctly invoked Guideline G based on the DUI arrest and the DOE psychologist's initial
      finding of habitual binge drinking, establishing a legitimate security concern that supports denial.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The positive February 2026 PEth result and the occupational psychologist's testimony demonstrate recent alcohol consumption,
      negating mitigation factors of sustained abstinence and undermining the claim of rehabilitation.
  - id: C3
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Objective biomarker evidence of recent drinking contradicts any assertion of rehabilitation, rendering the record
      insufficient for restoration.
  - id: C4
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Although regulations permit a clearance when no risk is shown, the recent drinking evidence indicates a potential
      threat to the common defense, outweighing the weak presumption for restoration.
  reasoning:
    read: The core issue is whether the Individual's recent alcohol use, evidenced by a positive PEth assay, still poses a
      security risk under Guideline G despite prior treatment and earlier negative tests.
    weighing: Applying the Adjudicative Guidelines, the positive biomarker and occupational psychologist's testimony satisfy
      the prohibition against granting access when recent consumption is documented. The earlier mitigation factors are eclipsed
      by this new evidence, and the presumption against clearance remains unrefuted.
    tradecraft: Record the denial in the official OHA docket, update the Individual's security file to reflect the terminated
      access authorization, and notify the Local Security Office and the contractor's security office of the decision.
    uncertainty: Low; the February 2026 PEth result provides clear, objective proof of recent alcohol intake, which outweighs
      earlier mitigating evidence.
    handoff: The decision is executed solely by the Adjudication Support System under the delegated authority of the Administrative
      Law Judge; no further inter-agency consultation is required.
    tempting_wrong:
      option: O4
      pull: The earlier assessment of habitual binge drinking and the completion of a comprehensive treatment program could
        suggest the Individual is no longer a risk.
      why_wrong: The February 2026 PEth result and the occupational psychologist's testimony provide concrete evidence of
        recent drinking, which outweighs prior mitigation and mandates denial.
    rejected:
      O1: The record already contains sufficient evidence; additional documentation would not alter the risk assessment.
      O2: A hold would merely postpone protective action while the positive PEth result already justifies immediate denial.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: All phosphatidylethanol assays conducted after December 2025 remain negative, confirming continued abstinence.
      then: O4
      why: Sustained negative biomarker results would reaffirm that mitigation factors are satisfied and would support restoration
        of access.
    would_not_change:
    - id: noflip1
      if: The DUI remains an isolated incident with no subsequent alcohol-related offenses.
      why: Even without extensive treatment, the infrequency of the behavior would still favor restoration under Guideline
        G.
    watch_for:
    - id: watch1
      what: Any future alcohol-related incident or a positive PEth test.
      favors:
      - O3
      why: Such evidence would re-establish a security concern under Guideline G.
  lesson: When objective evidence—such as a positive PEth assay—demonstrates recent alcohol consumption, it outweighs prior
    mitigation and obligates denial of access under Guideline G.
  limits: This analysis applies only when the record includes verifiable, positive biomarker results indicating recent drinking;
    it does not extend to cases lacking such objective evidence.
