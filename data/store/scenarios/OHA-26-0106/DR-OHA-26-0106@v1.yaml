case:
  id: DR-OHA-26-0106@v1
  title: Guideline G Alcohol Consumption Clearance Restoration
  status: draft
  setting: DOE Office of Hearings and Appeals, October 7 2026
  decider: Administrative Judge
  agent: Adjudication Support AI
  agent_role: decide
  situation: The Individual was arrested on September 3 2025 for driving under the influence, registering a blood alcohol
    content of .233 g/210L. The Local Security Office raised a security concern under Guideline G, citing the arrest and alleged
    habitual binge drinking. A DOE psychologist evaluated the Individual in January 2026 and concluded the Individual had
    a pattern of habitual and binge alcohol consumption with insufficient evidence of rehabilitation. The Individual subsequently
    completed a court‑ordered 26‑week outpatient alcohol treatment program, additional alcohol‑education classes, and complied
    with an employer‑run fitness‑for‑duty program. Multiple phosphatidylethanol (PEth) tests from December 2025 through August
    2026 were negative, indicating abstinence. Both the occupational psychologist and the DOE psychologist testified that
    the Individual had engaged in treatment, received positive feedback, and demonstrated sustained abstinence.
  question: What should the Adjudication Support AI do regarding the Individual’s access authorization under Guideline G?
  options:
    O1:
      do: The Adjudication Support AI asks the Security Office for more evidence.
      move: ask
      irreversible: false
      to: Security Office
    O2:
      do: The Adjudication Support AI holds the Individual’s access authorization pending review.
      move: hold
      irreversible: false
    O3:
      do: The Adjudication Support AI denies the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Adjudication Support AI restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual was arrested on September 3 2025 for DUI with a blood alcohol content of .233 g/210L.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt about the Individual’s eligibility
      under Guideline G.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The DOE psychologist evaluated the Individual in January 2026 and opined that the Individual habitually and binge
      consumed alcohol with no adequate evidence of rehabilitation.
  - id: F4
    kind: capability
    status: confirmed
    fact: The Individual completed a court‑ordered 26‑week outpatient alcohol treatment program and additional alcohol‑education
      classes.
  - id: F5
    kind: capability
    status: confirmed
    fact: PEth tests conducted from December 2025 to August 2026 were negative, indicating the Individual abstained from alcohol
      for approximately nine months.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The occupational psychologist testified that the Individual engaged in treatment, received positive feedback, and
      had no recent alcohol use.
  - id: F7
    kind: authority
    status: confirmed
    fact: Guideline G of the Adjudicative Guidelines defines excessive alcohol consumption as a security concern and lists
      mitigation factors such as acknowledgment, treatment, and sustained abstinence.
  - id: F8
    kind: authority
    status: confirmed
    fact: Regulatory standards presume against granting a security clearance; the Individual must show that restoration will
      not endanger the common defense and security.
  - id: F9
    kind: authority
    status: assessed
    fact: The Administrative Judge delegated authority to the Adjudication Support AI to determine the Individual’s access
      authorization.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O4
    weight: strong
    why: The LSO correctly invoked Guideline G based on the DUI arrest and the DOE psychologist’s initial opinion of habitual
      binge drinking, satisfying the regulatory requirement to raise a security concern.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: due_process
    favors:
    - O4
    weight: strong
    why: 'Mitigation factors (b) and (d) of the Adjudicative Guidelines are met: the Individual acknowledged the problem,
      completed a court‑ordered 26‑week treatment program, attended additional education classes, and demonstrated nine months
      of abstinence via negative PEth tests.'
  - id: C3
    facts:
    - F6
    - F5
    equity: analytic_integrity
    favors:
    - O4
    weight: strong
    why: The DOE psychologist, after reviewing the full record, revised her opinion and concluded the Individual was rehabilitated
      with a “very good” prognosis, directly supporting restoration.
  - id: C4
    facts:
    - F8
    - F7
    equity: mission_effect
    favors:
    - O4
    weight: weak
    why: Although Part 710 presumes against granting a clearance, the regulation allows a clearance when the evidence shows
      restoration will not endanger the common defense and is consistent with the national interest.
  reasoning:
    read: The case hinges on whether the Individual’s past DUI and alleged habitual binge drinking still pose a security risk
      under Guideline G, or whether the extensive treatment and sustained abstinence mitigate that risk.
    weighing: The Administrative Judge applied the Adjudicative Guidelines, finding that mitigation factors (acknowledgment,
      treatment completion, and documented abstinence) satisfy paragraphs 23(b) and 23(d). The Judge gave weight to the DOE
      psychologist’s updated opinion that the Individual is rehabilitated, and to the objective PEth evidence showing nine
      months of sobriety. These considerations outweigh the presumption against clearance and the initial concern raised by
      the LSO.
    tradecraft: Record the restoration decision in the official OHA docket, update the Individual’s security file to reflect
      the restored access authorization, and notify the LSO and the contractor’s security office of the outcome.
    uncertainty: Minimal; the record contains clear, corroborated evidence of sustained abstinence and professional assessments
      of rehabilitation.
    handoff: The decision is made solely by the Adjudication Support AI under the delegated authority of the Administrative
      Judge; no further inter‑agency consultation is required.
    tempting_wrong:
      option: O3
      pull: The prior DUI and the psychologist’s initial finding of habitual binge drinking could suggest a continued risk.
      why_wrong: Relying on the initial opinion ignores the subsequent treatment, negative PEth results, and the revised professional
        judgment that the Individual has been rehabilitated.
    rejected:
      O1: Additional evidence is unnecessary because the record already satisfies the mitigation criteria.
      O2: Holding the clearance pending further review would contradict the Judge’s finding that the concerns have been resolved.
      O3: Denial would disregard the strong mitigating evidence and the DOE psychologist’s final opinion of rehabilitation.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A PEth test after December 2025 returned a positive result indicating renewed heavy alcohol consumption.
      then: O3
      why: A positive PEth would demonstrate a relapse, negating the mitigation factor of sustained abstinence and re‑triggering
        Guideline G concerns.
    would_not_change:
    - id: noflip1
      if: The DUI remained a single, isolated incident with no further alcohol‑related offenses.
      why: Even without the extensive treatment, the Guideline G mitigation factor (a) – the infrequency and unusual circumstance
        of the behavior – would still support restoration.
    watch_for:
    - id: watch1
      what: Any future alcohol‑related incident or a positive PEth test.
      favors:
      - O3
      why: Such evidence would re‑establish a security concern under Guideline G.
  lesson: When an individual demonstrates acknowledgment of past alcohol misuse, completes prescribed treatment, and provides
    objective proof of sustained abstinence, Guideline G concerns can be mitigated and a security clearance restored.
  limits: This reasoning applies only where the record includes verifiable, negative PEth results and professional assessments
    confirming rehabilitation; it does not extend to cases lacking objective evidence of abstinence.
