case:
  id: DR-CORPUS-NX-a62a82bc-E1@v1
  title: Campaign Response at Santiago
  status: draft
  setting: Washington, during the Spanish-American War in 1898, U.S. leadership
  decider: U.S. leadership in Washington
  agent: U.S. leadership in Washington
  agent_role: decide
  situation: During the Spanish-American War, U.S. leadership in Washington had to decide how to respond to the Spanish fleet.
    Intelligence placed the fleet at Santiago de Cuba, resolving uncertainty about whether it might be headed to the Philippines,
    Florida, or the Atlantic coast of the United States. The fleet had reached Santiago without being noticed by the Americans,
    and it was in poor fighting condition with inadequate provisioning. The existing plan called for land forces to operate
    in the Havana region. The choice concerned whether to impose a naval blockade at Santiago and redirect the land campaign,
    or retain the existing plan.
  question: What should U.S. leadership in Washington do about the Spanish fleet at Santiago de Cuba and the existing land-force
    plan?
  options:
    O1:
      do: U.S. leadership in Washington declines a naval blockade of Santiago de Cuba and retains the plan to use land forces
        in the Havana region.
      move: act
      irreversible: false
    O2:
      do: U.S. leadership in Washington authorizes a naval blockade of Santiago de Cuba and redirects land forces to attack
        Santiago.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A large Spanish fleet had assembled and was preparing to cross the Atlantic.
  - id: F2
    kind: situation
    status: confirmed
    fact: Part of the Spanish fleet departed the Cape Verde Islands in late April.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The fleet's destination was uncertain, with the Philippines, Florida, and the Atlantic coast of the United States
      among the possibilities.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A fleet at the Philippines could outgun the U.S. fleet there, a fleet at Florida could threaten Army transports,
      and a fleet on the Atlantic coast could shell major urban areas.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Spanish fleet was in poor fighting condition and had been ordered to the Caribbean before adequate provisioning
      was complete.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Spanish fleet reached Santiago and entered the harbor unnoticed by the Americans.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: Information identifying the Spanish fleet's location at Santiago was sent to Washington.
  - id: F8
    kind: situation
    status: confirmed
    fact: The existing war plan assigned land forces to the Havana region.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F7
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The fleet's possible destinations carried serious threats, but intelligence identified it at Santiago. That gave
      Washington a specific location on which to focus its response rather than leaving the destination question unresolved.
  - id: C2
    facts:
    - F7
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The information reached Washington soon after it was received, and the resulting response was a blockade of Santiago.
      The account presents the speed of this intelligence as important to the decision.
  - id: C3
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Identifying the fleet at Santiago led not only to a naval blockade there but also to changing the land campaign from
      the Havana region to an attack on the port from behind.
  reasoning:
    read: 'The immediate decision was no longer just where the Spanish fleet might go: intelligence placed it at Santiago,
      while the existing land plan was directed at Havana. The trap is to treat the old plan as fixed despite the newly identified
      location. The fleet''s poor condition is part of the situation, but the account does not state that it was the reason
      for the campaign change.'
    weighing: The account connects the identification of the fleet at Santiago with a blockade there and a change in the land
      campaign. The location made a focused response possible {C1}; the rapid arrival of the information mattered to the response
      {C2}; and the revised plan aligned the land campaign with the fleet's location {C3}. The balance depends on Santiago
      being the fleet's current location; the account gives no separate comparative assessment of the two plans' risks or
      costs.
    tradecraft: Record the intelligence assessment of the fleet's location, the reasons for changing the plan, and the decisions
      for naval and land forces. Ensure the revised campaign direction is communicated to the responsible commands and that
      later location updates prompt reassessment.
    uncertainty: The account does not provide an assessment of the intelligence's reliability beyond identifying the fleet
      at Santiago, or compare the blockade's risks and likely effectiveness with retaining the Havana plan. It also does not
      state a legal standard or describe disagreement among decision-makers.
    handoff: The decision belongs to U.S. leadership in Washington. Coordinating the naval response and the revised land-force
      plan with their responsible commands is a practical implementation step, not a consultation requirement stated in the
      account.
    tempting_wrong:
      option: O1
      pull: Retain the existing Havana plan, particularly given that the fleet was in poor fighting condition and inadequately
        provisioned.
      why_wrong: The account describes the identified location at Santiago as the intelligence that prompted both the blockade
        and the change to the land campaign; it does not present the fleet's condition as a reason to leave the existing plan
        unchanged.
    rejected:
      O1: The account's response to intelligence placing the fleet at Santiago was to blockade the port and redirect the land
        campaign, rather than retain the Havana plan.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Updated intelligence showed that the fleet was no longer at Santiago and did not identify another location requiring
        a change to the existing land plan.
      then: O1
      why: The location at Santiago is the stated basis for the blockade and for redirecting the land campaign; without it,
        those measures would lack the specific location-based rationale in this account.
    would_not_change:
    - id: noflip1
      if: The fleet remained at Santiago but was still in poor fighting condition and inadequately provisioned.
      why: The account describes the fleet's condition but still records the blockade and campaign redirection after its location
        was identified; it does not say that poor condition alone favored retaining the Havana plan.
    watch_for:
    - id: watch1
      what: Further intelligence about whether the fleet remains at Santiago.
      favors:
      - O2
      why: The recorded decision and change to the land plan were tied to identifying the fleet at Santiago.
  lesson: When intelligence resolves uncertainty about an adversary's location, reassess whether the existing campaign plan
    still fits the situation. A focused response can require changing complementary naval and land plans rather than preserving
    the original plan by default.
  limits: This account describes the outcome and its connection to the intelligence, but does not supply a legal analysis
    or a full comparison of the options' costs and risks. The reasoning does not establish a general rule that a blockade
    or a change of campaign plan is appropriate in other circumstances.
