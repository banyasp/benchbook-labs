case:
  id: DR-CORPUS-NX-a62a82bc-E4@v1
  title: Secrecy and Courtroom Evidence
  status: draft
  setting: United States, early 1918, Department of State and the federal prosecution in San Francisco.
  decider: The Department of State
  agent: The Department of State
  agent_role: decide
  situation: In the federal conspiracy prosecution in San Francisco, prosecutors sought to use telegram copies supplied through
    British-American cooperation. British authorities wanted the messages’ source kept secret and had instructed their agents
    to attribute receipt of the messages to the American government. The prosecution could fail without admissible proof that
    the telegrams had been delivered to the conspirators, while telegraph offices in the United States generally destroyed
    records after twelve months. The copies differed in dates and text; the date differences reflected original dispatch dates
    versus later relay dates, and some textual differences were attributed to translators. Harrison considered the time too
    short to obtain proof from Buenos Aires. It was unclear whether the attorney could have the cables admitted on the available
    basis.
  question: What should the Department of State do about disclosing the telegram copies’ provenance and providing court support
    in the San Francisco prosecution?
  options:
    O1:
      do: The Department of State will ask British authorities for admissible provenance records and defer its court-support
        position.
      move: ask
      irreversible: false
      to: British authorities
    O2:
      do: The Department of State will disclose the copies’ provenance and provide a court representative to explain their
        interpretation.
      move: act
      irreversible: true
    O3:
      do: The Department of State will withhold the copies’ provenance and provide no court representative to explain their
        interpretation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: British authorities wanted the messages’ source kept secret and instructed their agents to say the messages had
      first come from the American government, been compared with information from other sources, and then been sent back
      to America.
  - id: F2
    kind: situation
    status: assessed
    fact: The San Francisco prosecution could fail without admissible proof of how the telegrams had been delivered.
  - id: F3
    kind: situation
    status: confirmed
    fact: Telegraph offices in the United States generally destroyed their records after twelve months.
  - id: F4
    kind: situation
    status: confirmed
    fact: The British supplied copies, and the dates differed from copies previously given to the San Francisco prosecutor;
      the difference was attributed to original dispatch dates versus dates of later relays.
  - id: F5
    kind: situation
    status: confirmed
    fact: Copies from San Francisco and London also differed in text, and some differences were attributed to translation
      choices.
  - id: F6
    kind: situation
    status: assessed
    fact: Harrison considered that there was too little time to obtain proof from Buenos Aires about the telegrams.
  - id: F7
    kind: situation
    status: assessed
    fact: It was unclear whether the federal attorney in San Francisco could have the cables admitted on the available basis.
  considerations:
  - id: C1
    facts:
    - F1
    equity: source_protection
    favors:
    - O3
    weight: strong
    why: British authorities were anxious to keep the messages’ source secret, making disclosure of provenance contrary to
      the confidentiality they sought to preserve.
  - id: C2
    facts:
    - F2
    - F3
    equity: due_process
    favors:
    - O1
    - O2
    weight: strong
    why: Without admissible proof of delivery, the prosecution could fail; the usual destruction of telegraph records also
      made timely efforts to secure proof important.
  - id: C3
    facts:
    - F6
    equity: tempo
    favors:
    - O3
    weight: weak
    why: Harrison considered it too late to obtain proof from Buenos Aires, limiting the practical value of delaying the court-support
      decision while pursuing that route.
  - id: C4
    facts:
    - F4
    - F5
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The differing dates and texts, together with uncertainty about admission, created a reason to provide a court explanation;
      the available record did not establish that such support would resolve the evidentiary problem.
  reasoning:
    read: The Department faced a real conflict between preserving the British source’s secrecy and helping the prosecution
      establish admissible proof. The trap is to treat the prosecution’s need as a reason to disclose provenance automatically,
      or to treat secrecy as a reason to imply a provenance account that the Department could not substantiate.
    weighing: 'The prosecution risk was serious, and the approaching loss of telegraph records added urgency {C2}. But Harrison
      considered the time too short to obtain proof from Buenos Aires {C3}, while the Department’s eventual position preserved
      the requested secrecy: it would not explain how most copies were obtained and was not prepared to send a representative
      to explain them. The differences among copies and uncertainty about admission strengthened the case for court support,
      but did not establish that disclosure or testimony would supply admissible proof {C4}. The balance therefore favored
      withholding provenance and providing no representative, while accepting the risk to the prosecution.'
    tradecraft: Keep the decision and its basis on the record, distinguish any verified, disclosable facts from protected
      provenance, and do not substitute an unsupported account for withheld information. Reassess if the Department receives
      authority to disclose or new admissible proof becomes available.
    uncertainty: The available basis for admitting the cables remained unclear. The record also left unresolved whether another
      timely, admissible source of delivery proof could be obtained.
    handoff: Coordinate with British authorities through the Department of State; the British indicated that future dealings
      on the telegrams would be through that Department. The Department should communicate to the federal prosecutors only
      what it can accurately and permissibly support.
    tempting_wrong:
      option: O2
      pull: Disclosure and a court representative could appear to give prosecutors the explanation they needed to pursue admission.
      why_wrong: The British wanted the source kept secret, and the Department was not prepared to explain the provenance
        or send a representative; the record did not show that disclosure would cure the admissibility problem.
    rejected:
      O1: The Department did not defer its position to seek further admissible provenance records, and Harrison considered
        that there was too little time to obtain delivery proof from Buenos Aires.
      O2: The Department chose not to expose the provenance or provide a representative, preserving the source’s secrecy despite
        the potential benefit to the prosecution.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: British authorities authorized disclosure of the provenance and the Department could give an accurate court explanation
        relevant to admissibility.
      then: O2
      why: The principal source-protection constraint would be reduced, making court support a more viable response to the
        prosecution’s evidentiary need.
    - id: flip2
      if: A prompt request could secure admissible provenance records without revealing the protected source.
      then: O1
      why: That would make a limited request and deferral a practical way to support the prosecution while preserving source
        secrecy.
    would_not_change:
    - id: noflip1
      if: The date and text differences among the copies were clarified, but no authority to disclose the source or new admissible
        delivery proof became available.
      why: Clarifying discrepancies alone would not remove the source-protection constraint or resolve the underlying uncertainty
        about proof of delivery.
    watch_for:
    - id: watch1
      what: Whether admissible delivery records remain obtainable before telegraph offices destroy their records.
      favors:
      - O1
      why: A timely, independent route to delivery proof could permit a request for records without disclosing the protected
        provenance.
  lesson: Protecting a source does not remove the obligation to recognize the evidentiary cost of withholding provenance.
    When court use depends on provenance or testimony, distinguish what can be proved and disclosed from what must remain
    protected, and do not present an unsupported account as a substitute.
  limits: This reasoning applies to the Department’s choice about these copies and the available court support in the San
    Francisco prosecution. It does not determine whether the telegrams were admissible, whether the prosecution should proceed,
    or what disclosure would be required under other legal rules or later-developed evidence.
