case:
  id: DR-CORPUS-NS-7d5e5ea6-E6@v1
  title: FBI Batch-Job Review Policy
  status: draft
  setting: FBI systems, June 2021, Federal Bureau of Investigation.
  decider: The FBI
  agent: The FBI
  agent_role: decide
  situation: In June 2021, the FBI was addressing query-compliance incidents associated with batch jobs in its systems. A
    single improper decision or assessment by FBI personnel could lead to a large number of incidents. Batch jobs could produce
    100 or more queries, and the queries were governed by the FBI’s Section 702 querying procedures. The queries could have
    significant potential to affect privacy and civil-liberties interests. The FBI had to decide whether to adopt a preapproval
    requirement for batch jobs at that scale.
  question: What should the FBI do about a proposed preapproval requirement for batch jobs producing 100 or more queries?
  options:
    O1:
      do: The FBI approves a policy requiring attorney preapproval for batch jobs producing 100 or more queries.
      move: act
      irreversible: false
    O2:
      do: The FBI rejects a policy requiring attorney preapproval for batch jobs producing 100 or more queries.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Query-compliance incidents had resulted from batch jobs.
  - id: F2
    kind: situation
    status: assessed
    fact: A single improper decision or assessment by FBI personnel could result in a large number of compliance incidents.
  - id: F3
    kind: situation
    status: confirmed
    fact: The batch-job tool was used for queries in an FBI system.
  - id: F4
    kind: authority
    status: confirmed
    fact: The queries were subject to the FBI’s Section 702 querying procedures.
  - id: F5
    kind: situation
    status: confirmed
    fact: Batch jobs could result in 100 or more queries.
  - id: F6
    kind: situation
    status: assessed
    fact: Queries with significant potential to affect privacy and civil-liberties interests were at issue.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: A single improper decision or assessment in a batch job could generate many compliance incidents, making an additional
      check relevant to preventing scaled noncompliance.
  - id: C2
    facts:
    - F5
    - F6
    equity: usp_privacy
    favors:
    - O1
    weight: strong
    why: Batch jobs at this scale could affect privacy and civil-liberties interests significantly, so the potential consequences
      warrant added review.
  - id: C3
    facts:
    - F2
    - F4
    - F6
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The FBI described attorney preapproval as an added layer intended to mitigate the risk that high-impact queries would
      fail to comply with its Section 702 querying procedures.
  reasoning:
    read: 'This is not merely a choice about handling one query: one improper judgment in a batch job could produce a large
      number of compliance incidents. The trap is to treat the scale of the job as an administrative convenience while overlooking
      its potential cumulative effect on privacy and civil liberties.'
    weighing: 'The FBI''s stated reasons support preapproval: batch-job errors can multiply, and the affected queries can
      significantly implicate privacy and civil liberties. Attorney review is the safeguard the FBI selected to mitigate the
      risk of noncompliance. The source gives no specific operational-flexibility benefit or delay concern to weigh against
      that safeguard.'
    tradecraft: 'For batch jobs within the proposed threshold, require FBI attorney approval before the job proceeds. Keep
      the decision focused on the safeguard''s purpose: reducing the risk that a single improper assessment will lead to widespread
      noncompliance.'
    uncertainty: The source identifies the risk and the purpose of attorney review, but does not report measured effectiveness,
      review burdens, or effects on operational timeliness.
    handoff: Involve an FBI attorney before the covered batch job proceeds; attorney preapproval is the chosen additional
      review layer.
    tempting_wrong:
      option: O2
      pull: Rejecting preapproval may seem to preserve operational flexibility.
      why_wrong: The source identifies a concrete risk of multiplied compliance incidents and significant privacy and civil-liberties
        effects, while giving no evidence that rejecting review is needed to meet an operational requirement.
    rejected:
      O2: The FBI chose preapproval because a single improper assessment could create many compliance incidents and the queries
        could significantly affect privacy and civil liberties.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence showed that batch jobs at this scale could not multiply compliance incidents and presented no
        significant privacy or civil-liberties risk.
      then: O2
      why: The source's stated justification for added review depends on the scale of the compliance risk and the potential
        impact on privacy and civil liberties.
    would_not_change:
    - id: noflip1
      if: The queries in a batch job were individually authorized under the applicable procedures, but the risk of a single
        improper assessment producing many incidents remained.
      why: Individual authorization would not, by itself, remove the aggregation risk or the stated need to mitigate potential
        noncompliance.
    watch_for:
    - id: watch1
      what: Whether the review requirement remains limited to jobs of 100 or more queries; the FBI later expanded preapproval
        to all batch jobs.
      favors:
      - O1
      why: The later expansion shows that the FBI extended the same preapproval safeguard beyond the initial threshold.
  lesson: When one decision can scale into many compliance incidents and implicate significant privacy interests, assess the
    cumulative risk rather than treating each resulting query as isolated. A proportionate preapproval safeguard is supported
    when it directly addresses that risk and no countervailing operational harm is established.
  limits: This reasoning concerns FBI batch jobs governed by Section 702 querying procedures and the documented risk of multiplied
    compliance incidents. It does not establish that attorney preapproval is appropriate for every query or for settings with
    materially different risks or demonstrated operational costs.
  library:
    domain: intel-oversight
    family: CORPUS-NS-7d5e5ea6
    source: https://www.intelligence.gov/assets/documents/702-documents/declassified/28th_Joint_Assessment_for_PUBLIC_1.15.25.pdf
