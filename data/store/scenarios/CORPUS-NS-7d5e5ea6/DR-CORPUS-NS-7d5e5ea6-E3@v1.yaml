case:
  id: DR-CORPUS-NS-7d5e5ea6-E3@v1
  title: Training and Conditional Access for FBI Queries
  status: draft
  setting: FBI, December 2021, during efforts to address non-compliant queries of unminimized Section 702 information
  decider: The FBI
  agent: The FBI
  agent_role: decide
  situation: FBI queries of unminimized Section 702 information had raised recurring compliance concerns. The concerns included
    issues associated with a large number of non-compliant queries. FBI personnel had access to unminimized FISA-acquired
    information, and FBI online training programs included query requirements. The FBI had to determine how to address the
    query concerns while setting training and access requirements.
  question: 'What should the FBI do about recurring non-compliant queries: require revised query training with access conditioned
    on completion, require training while permitting access during training, or seek oversight input before changing either
    policy?'
  options:
    O1:
      do: The FBI requires revised query training and permits access to unminimized FISA-acquired information for noncompleters
        pending completion.
      move: act
      irreversible: false
    O2:
      do: The FBI requires revised query training and prohibits access to unminimized FISA-acquired information for noncompleters
        pending completion.
      move: act
      irreversible: false
    O3:
      do: The FBI asks the joint oversight team to assess the training and access policy before the FBI changes either one.
      move: ask
      irreversible: false
      to: the joint oversight team
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Recent compliance issues involved FBI queries of unminimized Section 702 information.
  - id: F2
    kind: situation
    status: confirmed
    fact: The joint oversight team leads regular meetings with FBI representatives.
  - id: F3
    kind: situation
    status: confirmed
    fact: Those meetings include discussion of remedial measures for compliance issues.
  - id: F4
    kind: situation
    status: confirmed
    fact: Issues being addressed were causing a large number of non-compliant queries.
  - id: F5
    kind: situation
    status: confirmed
    fact: FBI online training programs included requirements concerning querying.
  - id: F6
    kind: situation
    status: confirmed
    fact: FBI personnel with access to unminimized FISA-acquired information were a relevant group for query training requirements.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: The concerns involved FBI queries of unminimized Section 702 information, and the issues being addressed were causing
      a large number of non-compliant queries. The FBI treated this as a reason for corrective action.
  - id: C2
    facts:
    - F5
    - F6
    equity: policy_compliance
    favors:
    - O2
    weight: strong
    why: Query requirements were included in FBI training, and personnel with access to unminimized FISA-acquired information
      were the relevant group for the revised mandatory training.
  - id: C3
    facts:
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Regular meetings with the joint oversight team included remedial measures, providing an existing channel for addressing
      compliance concerns alongside the FBI's training and access response.
  reasoning:
    read: The decision was how to address a substantial recurring query-compliance problem among personnel who could access
      unminimized information. The trap is treating mandatory training by itself as the whole remedy while leaving access
      unchanged for people who have not completed it.
    weighing: The issues being addressed were causing a large number of non-compliant queries {C1}. The FBI responded with
      revised query training mandatory for the relevant access group and temporarily suspended access for noncompleters pending
      completion {C2}. Regular oversight-team meetings addressed remedial measures and compliance trends, but the FBI implemented
      this access-conditioned training measure rather than waiting for further input {C3}. The balance depends on the connection
      between the query concerns, the training requirement, and access to unminimized information; the reasons do not address
      the burden of temporary suspension.
    tradecraft: Make the revised query training mandatory for the relevant personnel and condition access to unminimized FISA-acquired
      information on completion, restoring access when training is complete. As an implementation practice, track completion
      and access status and document the basis for any suspension.
    uncertainty: The available facts do not specify the individual causes of the non-compliant queries, the practical effects
      of suspending access, or whether the measures reduced non-compliance. They also do not provide a separate legal analysis
      of the access condition.
    handoff: The FBI made the training and access change. The joint oversight team provides an existing coordination channel
      through regular meetings on remedial measures and compliance trends; the FBI implemented the change without first deferring
      the decision for oversight input.
    tempting_wrong:
      option: O1
      pull: Requiring training while preserving access could avoid interruption for personnel who have not yet completed it.
      why_wrong: The FBI's response to the issues causing many non-compliant queries was to suspend access for noncompleters
        pending completion, rather than leave their access unchanged.
    rejected:
      O1: The FBI did not permit noncompleters to retain access pending completion; it temporarily suspended that access.
      O3: Although the joint oversight team met regularly to discuss remedial measures, the FBI implemented the training and
        conditional-access response rather than first deferring the policy decision for further input.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence showed that the query-compliance concerns had been resolved and that allowing access during a
        short training-completion period would not recreate the identified problem.
      then: O1
      why: With the stated compliance concern materially reduced, the case for conditioning access on completion would be
        weaker.
    - id: flip2
      if: The FBI faced a material unresolved question about whether this training-and-access response was appropriate and
        the joint oversight team could resolve it before implementation.
      then: O3
      why: Obtaining oversight input first could then be preferable to changing the policy without resolving that question.
    would_not_change:
    - id: noflip1
      if: The joint oversight team continued holding regular meetings that included discussion of remedial measures.
      why: Those meetings provide a coordination channel, but their existence alone would not remove the stated problem of
        numerous non-compliant queries or change the FBI's described response.
    watch_for:
    - id: watch1
      what: Whether personnel complete the revised query training and whether compliance concerns persist in the oversight
        team's review of compliance trends.
      favors:
      - O2
      why: Incomplete training or continuing compliance concerns would support maintaining the access condition; evidence
        of resolution could warrant reassessing it.
  lesson: When recurring compliance concerns are linked to access to sensitive information, training can be paired with a
    temporary access condition for those who have not completed it. Reassess the condition as training is completed and compliance
    trends develop.
  limits: This reasoning applies to the described FBI response to query-compliance concerns involving unminimized FISA-acquired
    information. It does not establish a general legal rule requiring access suspension in other settings or address the operational
    costs of this measure.
  library:
    domain: intel-oversight
    family: CORPUS-NS-7d5e5ea6
    source: https://www.intelligence.gov/assets/documents/702-documents/declassified/28th_Joint_Assessment_for_PUBLIC_1.15.25.pdf
    episode_focus: The decision point is whether to address recurring non-compliant queries through mandatory retraining and
      conditional access, rather than leave access unchanged. The assessment connects the measures to efforts to address issues
      causing non-compliant queries; exclude the broader training program details and later compliance statistics.
    cues:
      option_words:
        O2: 17
        O1: 17
        O3: 20
      real_option: O2
      real_to_mean_other_length: 0.92
      real_is_longest: false
      moves:
        O2: act
        O1: act
        O3: ask
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
        O3: false
    equities: pilot2
