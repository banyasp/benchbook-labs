case:
  id: DR-CORPUS-NX-4eb0424e-E1@v1
  title: Whether to Authorize Intervention in Iran
  status: draft
  setting: Iran, early 1950s; the U.S. executive branch.
  decider: The President and Secretary of State.
  agent: The President and Secretary of State
  agent_role: decide
  situation: The Iranian government had refused to modify a concession that the British regarded as an important enterprise
    benefiting both countries and the wider free world. The Iranian prime minister expressed deep distrust of the British.
    The Truman administration had resisted British calls to use gunboat diplomacy. Diplomacy had failed, and a military incursion
    was considered infeasible while the Korean War was underway. The President and Secretary of State were committed to rolling
    back communism and defending democratic governments they considered threatened by Moscow.
  question: What should the President and Secretary of State do about Iran after diplomacy has failed and a military incursion
    is considered infeasible?
  options:
    O1:
      do: The President and Secretary of State decline covert intervention in Iran.
      move: act
      irreversible: false
    O2:
      do: The President and Secretary of State authorize covert intervention in Iran.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Iranian government refused to modify the firm's concession.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The British government characterized the enterprise as beneficial to the United Kingdom, Iran, and the wider free
      world.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Iranian prime minister expressed strong distrust of the British.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Truman administration resisted efforts to use gunboat diplomacy.
  - id: F5
    kind: situation
    status: confirmed
    fact: Diplomacy had failed.
  - id: F6
    kind: capability
    status: confirmed
    fact: A military incursion was considered infeasible while the Korean War was underway.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The President and Secretary of State were committed to rolling back communism and defending democratic governments
      they considered threatened by Moscow.
  considerations:
  - id: C1
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The President and Secretary of State were committed to rolling back communism and defending democratic governments
      they considered threatened by Moscow; that strategic judgment supported taking action rather than accepting the impasse.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Diplomacy had failed and a military incursion was considered infeasible during the Korean War. Those constraints
      formed the immediate context for choosing covert intervention.
  - id: C3
    facts:
    - F2
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: The British characterized the enterprise as benefiting the United Kingdom, Iran, and the wider free world, giving
      the dispute a claimed allied and broader strategic stake. This was a British characterization, not an uncontested fact.
  - id: C4
    facts:
    - F1
    - F3
    equity: norm_reciprocity
    favors:
    - O1
    weight: weak
    why: The Iranian government refused to modify the concession, while its prime minister deeply distrusted the British.
      The account describes the parties as talking past each other, which cautions against treating the British account of
      shared benefit as resolving the dispute.
  reasoning:
    read: This was a choice made after diplomacy had failed and military action was considered infeasible, not a choice between
      diplomacy and immediate invasion. The trap is treating the British claim of a benefit to the free world as shared and
      uncontested, despite the Iranian prime minister's distrust and the parties talking past one another.
    weighing: The stated U.S. rationale was to roll back communism and defend democratic governments considered threatened
      by Moscow; failed diplomacy and the Korean War constraint framed the move to covert intervention. The British account
      of the enterprise's wider benefit added context, but this claim did not resolve the Iranian-British dispute. The balance
      therefore depends on the leaders' assessment of the communist threat and their judgment that the strategic objective
      warranted intervention despite the failed talks and limits on military action.
    tradecraft: At the decision level, record the authority for the decision, the strategic objective, the threat assessment
      and its uncertainty, the failed diplomatic effort, the constraint on military action, and why the chosen option is preferred
      to declining. Keep the record focused on the decision and its accountability, not execution details.
    uncertainty: The leaders considered governments threatened by Moscow, but the underlying evidence and the strength of
      the threat assessment are not specified here. The legal authorization and the intervention's consequences are also not
      evaluated.
    handoff: The President and Secretary of State were the decision-makers in the account. As a decision practice, they should
      seek relevant threat and authority assessments before deciding; the account does not specify a required additional approver.
    tempting_wrong:
      option: O1
      pull: Declining intervention may seem attractive given the Iranian prime minister's distrust, the disputed concession,
        and the administration's earlier resistance to gunboat diplomacy.
      why_wrong: It was not the choice made because the President and Secretary of State judged that rolling back communism
        and defending governments they considered threatened required action after diplomacy failed and military incursion
        was infeasible.
    rejected:
      O1: The President and Secretary of State did not choose to decline intervention; they chose covert action in pursuit
        of their anti-communist and democracy-protection objectives after diplomacy failed and military incursion was considered
        infeasible.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The leaders no longer assessed a meaningful communist threat to a democratic government in Iran.
      then: O1
      why: The stated strategic rationale for intervention would be substantially weakened.
    - id: flip2
      if: Diplomacy became viable again and offered a credible way to resolve the impasse.
      then: O1
      why: The stated condition that diplomacy had failed would no longer support moving to intervention.
    would_not_change:
    - id: noflip1
      if: The Iranian prime minister continued to distrust the British.
      why: That distrust is important context, but by itself it would not change the leaders' stated strategic assessment
        or establish whether intervention should be authorized.
    watch_for:
    - id: watch1
      what: Whether the assessment that Moscow threatened a democratic government remains credible.
      favors:
      - O2
      why: The anti-communist and democracy-protection rationale was central to the decision.
  lesson: When diplomacy has failed and military action is infeasible, leaders may still choose intervention if they judge
    a strategic threat serious enough to warrant it. A claimed allied or wider benefit should not be treated as settling a
    dispute when the affected government rejects the arrangement and distrusts the other party.
  limits: This extracts the rationale for the historical choice, not a finding that intervention was lawful, effective, or
    justified on a complete evidentiary record. It does not establish the underlying threat assessment or generalize the decision
    to other crises.
