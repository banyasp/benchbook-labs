case:
  id: DR-CORPUS-INC-KOSOVO-AIR-CAMPAIGN-NX-537b3e70-E6@v1
  title: Negotiation or Air Strikes in Kosovo
  status: draft
  setting: Kosovo and the Federal Republic of Yugoslavia, 23 March 1999, NATO.
  decider: NATO
  agent: NATO
  agent_role: decide
  situation: NATO had announced that it would carry out air strikes against the Federal Republic of Yugoslavia if the demands
    of the international community were not met. Negotiations took place at Rambouillet from 6 to 23 February 1999 and in
    Paris from 15 to 18 March 1999. The resulting peace agreement was accepted by the Kosovo Albanian delegation and rejected
    by the Serbian delegation. NATO considered that efforts to reach a negotiated political settlement had failed. Its stated
    objective was to protect Kosovo Albanians from Serbian repression.
  question: 'What should NATO do on 23 March 1999: continue pursuing a negotiated political settlement or authorize air strikes
    against the Federal Republic of Yugoslavia?'
  options:
    O1:
      do: NATO prohibits strikes against Yugoslavia and continues negotiations.
      move: act
      irreversible: false
    O2:
      do: NATO authorizes strikes against Yugoslavia and ends negotiations.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On 30 January 1999, NATO announced that it would carry out air strikes against the Federal Republic of Yugoslavia
      if the demands of the international community were not met.
  - id: F2
    kind: situation
    status: confirmed
    fact: Negotiations between the parties to the conflict took place in Rambouillet from 6 to 23 February 1999.
  - id: F3
    kind: situation
    status: confirmed
    fact: Negotiations between the parties to the conflict took place in Paris from 15 to 18 March 1999.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Kosovo Albanian delegation agreed to the resulting peace agreement.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Serbian delegation rejected the resulting peace agreement.
  - id: F6
    kind: situation
    status: assessed
    fact: NATO considered that all efforts to reach a negotiated political settlement to the crisis in Kosovo had failed.
  - id: F7
    kind: situation
    status: assessed
    fact: NATO's stated objective was to protect Kosovo Albanians from Serbian repression.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: After negotiations in Rambouillet and Paris, NATO assessed that all efforts to reach a negotiated political settlement
      had failed; continuing negotiations therefore did not appear to offer a viable settlement.
  - id: C2
    facts:
    - F4
    - F5
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The Kosovo Albanian delegation accepted the agreement but the Serbian delegation rejected it, leaving the negotiated
      agreement without the parties' shared acceptance. This supports NATO's assessment that the settlement effort had failed,
      but does not independently establish institutional credibility as a reason for the decision.
  - id: C3
    facts:
    - F7
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: NATO's stated objective was to protect Kosovo Albanians from Serbian repression.
  - id: C4
    facts:
    - F1
    - F6
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: NATO had announced that it would carry out air strikes if the demands were not met, and it later assessed that negotiated
      efforts had failed. The prior announcement may have made follow-through relevant, but no independent weight is assigned
      to credibility as a reason for the decision.
  reasoning:
    read: The decision came after negotiations at Rambouillet and Paris, with the resulting agreement accepted by the Kosovo
      Albanian delegation and rejected by the Serbian delegation. The central trap is treating the humanitarian objective
      or the prior announcement of strikes as, by itself, proof that force was legally authorized or that further diplomacy
      was impossible; the stated basis for moving to strikes was NATO's assessment that negotiated efforts had failed.
    weighing: NATO's assessment that all efforts to reach a negotiated political settlement had failed weighs against continuing
      negotiations {C1}; the parties' differing positions support that assessment {C2}. NATO's stated objective of protecting
      Kosovo Albanians from Serbian repression weighs in favor of acting to pursue that objective {C3}. The resulting balance
      is the course NATO chose, authorizing strikes and ending negotiations {O2}. This rationale does not establish the legal
      authority for resorting to force or show that the humanitarian objective alone made force lawful.
    tradecraft: At the decision level, record the basis for concluding negotiations had failed, the parties' positions on
      the agreement, the stated protection objective, and the authority and legal assessment relied on for using force. Keep
      that review separate from any operational planning or execution.
    uncertainty: The rationale does not assess whether the use of force was lawful, identify its legal authority, or explain
      what evidence supported the conclusion that every avenue for negotiation had failed. It also leaves unanswered whether
      an armed conflict existed and whether international humanitarian law applied.
    handoff: NATO's political decision-makers should make the force decision with legal advice and appropriate authority review,
      because the stated rationale does not itself settle the legality of resorting to force.
    tempting_wrong:
      option: O1
      pull: Continuing negotiations avoids immediately moving to air strikes and preserves a diplomatic path.
      why_wrong: On the facts given, NATO had assessed that all efforts to reach a negotiated political settlement had failed;
        choosing O1 would disregard the assessment that the negotiated path had been exhausted.
    rejected:
      O1: NATO did not continue negotiations because it considered that all efforts to reach a negotiated political settlement
        had failed and chose strikes to pursue its stated protection objective.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A credible negotiated settlement remained available, for example because the Serbian delegation accepted the agreement
        or renewed negotiations showed a realistic path to settlement.
      then: O1
      why: That would undermine NATO's stated assessment that negotiated efforts had failed and make continued diplomacy a
        viable course.
    would_not_change:
    - id: noflip1
      if: The Kosovo Albanian delegation's acceptance remained the only acceptance while the Serbian delegation continued
        to reject the agreement.
      why: 'That fact alone would not change the decision: the stated rationale rests on NATO''s assessment that the negotiated
        settlement effort had failed, not on one delegation''s acceptance alone.'
    watch_for:
    - id: watch1
      what: Any new evidence that a negotiated political settlement was still realistically attainable.
      favors:
      - O1
      why: It would call into question the assessment that all negotiated efforts had failed.
  lesson: When a decision-maker moves from negotiations to force, distinguish the stated reason that diplomacy has failed
    from the separate legal question whether force is authorized. A humanitarian objective may explain the purpose of a decision
    without, by itself, resolving that legal question.
  limits: This reasoning applies only to the decision-level facts and rationale set out here. It does not determine the legality
    of the resort to force, the applicability of international humanitarian law, or whether later evidence might have shown
    that negotiations remained viable.
