case:
  id: DR-OHA-26-0086-addfact1@v1
  title: DOE Personnel Security Clearance Restoration Decision [addfact]
  status: needs_review
  setting: U.S. Department of Energy, Office of Hearings and Appeals – 10 August 2026
  decider: Administrative Law Judge
  agent: Administrative Law Judge
  agent_role: decide
  situation: The Local Security Office has raised substantial doubt about the employee's continued eligibility for a security
    clearance, invoking Guideline E (personal conduct) and Guideline F (financial considerations). A DOE credit report indicates
    six delinquent debt accounts totaling $20,525, which the employee failed to report as required by DOE Order 472.2A. The
    employee also did not file federal personal income tax returns for 2021-2024. He resides in a suburban neighborhood within
    ten miles of the DOE facility where he works. Although he settled one debt and retained a financial-services firm, he
    supplied no documentation for the remaining debts or the missing 2021 tax filing. The Administrative Judge has examined
    the mitigating-condition criteria under the adjudicative guidelines and found none applicable. DOE regulations create
    a presumption against granting or reinstating a clearance, placing the burden on the individual to demonstrate eligibility.
    Consequently, the judge has concluded that the clearance should not be restored.
  question: What action should the Administrative Law Judge take regarding the employee's security clearance?
  options:
    O1:
      do: Issue an order restoring the employee's security clearance.
      move: act
      irreversible: true
    O2:
      do: Issue an order denying restoration of the employee's security clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A DOE credit report shows the employee has six delinquent accounts with a combined balance of $20,525.
  - id: F2
    kind: authority
    status: confirmed
    fact: The employee did not disclose those delinquent accounts as mandated by DOE Order 472.2A.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee failed to file federal personal income tax returns for the years 2021 through 2024.
  - id: F4
    kind: situation
    status: confirmed
    fact: The employee resides in a suburban area located within ten miles of the DOE facility where he is employed.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline E (personal conduct) and Guideline F (financial considerations) as grounds
      for substantial doubt.
  - id: F6
    kind: capability
    status: assessed
    fact: The employee settled one of the debts, retained a financial-services firm, but supplied no supporting documentation
      for the remaining debts or the 2021 tax return.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The Administrative Judge determined that none of the mitigating-condition criteria under Guideline E or Guideline
      F are satisfied.
  - id: F8
    kind: authority
    status: confirmed
    fact: DOE regulations establish a presumption against granting or reinstating a clearance, requiring the individual to
      demonstrate eligibility.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The Administrative Judge concluded that the employee's access authorization should not be restored.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline E is triggered because the employee concealed delinquent debts required by DOE Order 472.2A, evidencing
      a lack of candor and poor judgment.
  - id: C2
    facts:
    - F3
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline F applies due to the unresolved $20,525 in debts and the failure to file federal tax returns for 2021-2024,
      indicating unreliable financial conduct.
  - id: C3
    facts:
    - F7
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: DOE regulations impose a presumption against granting or restoring a clearance; the employee has not met the burden
      of proof to overcome it.
  - id: C4
    facts:
    - F7
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The judge found no mitigating conditions under Guidelines E or F, leaving the security concerns unresolved.
  - id: C5
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The employee's claim of engaging a financial-services firm lacks corroborating documentation, weakening the credibility
      of his remedial effort.
  reasoning:
    read: The adjudicative issue is whether the employee's undisclosed debts, failure to file tax returns, and lack of mitigating
      evidence create sufficient doubt under Guidelines E and F to justify denial of clearance restoration.
    weighing: The judge applied the Adjudicative Guidelines and found no mitigating condition satisfied ({C1}, {C2}, {C4}).
      The statutory presumption against restoration remains unrebutted ({C3}), and the proximity concern adds a modest risk
      factor, all of which tip the balance toward denial ({C5} reinforces credibility concerns).
    tradecraft: The decision is entered in the official OHA memorandum, signed by the Administrative Law Judge, and the Local
      Security Office is instructed to maintain the denial.
    uncertainty: Future submission of verified debt-repayment records, tax filings, or audited financial statements could
      alter the mitigation analysis, but the current lack of evidence sustains the denial.
    handoff: The Administrative Law Judge alone holds the authority to resolve the eligibility determination under DOE Part
      710.
    tempting_wrong:
      option: O1
      pull: The employee's acknowledgment of responsibility and his claim of hiring a financial-services firm might suggest
        leniency.
      why_wrong: Absent documented proof of debt settlement or tax compliance, no mitigating condition is met, and granting
        the clearance would conflict with the presumption and the judge's analysis.
    rejected:
      O1: The employee failed to satisfy any mitigating condition and did not meet the burden of proof required to overcome
        the statutory presumption against restoration.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee provides verifiable documentation that all delinquent debts are fully paid and that all missing federal
        tax returns have been filed and any liabilities settled.
      then: O1
      why: Such evidence would satisfy mitigating condition (a) for both Guidelines E and F, removing the substantial doubt.
    would_not_change:
    - id: noflip1
      if: The employee continues to rely solely on uncorroborated statements without documentary proof.
      why: The lack of evidence means no mitigating conditions are met, so the denial remains appropriate.
    watch_for:
    - id: watch1
      what: Any future submission of audited financial statements or IRS acceptance notices for the 2021-2024 tax years.
      favors:
      - O1
      why: Concrete proof of compliance could trigger a re-evaluation of the security concerns under Guidelines E and F.
  lesson: When an individual fails to disclose financial delinquencies and to file required tax returns, the burden of proof
    lies with the individual to demonstrate remediation; without verifiable evidence, the statutory presumption against granting
    a clearance prevails.
  limits: This analysis applies solely to DOE personnel-security determinations under Part 710 where the Adjudicative Guidelines
    govern eligibility; it does not extend to criminal, civil, or other regulatory contexts.
