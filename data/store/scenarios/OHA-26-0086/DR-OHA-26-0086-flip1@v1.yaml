case:
  id: DR-OHA-26-0086-flip1@v1
  title: DOE Personnel Security Clearance Restoration Decision [flip]
  status: needs_review
  setting: Department of Energy Office of Personnel Security, September 3 2026
  decider: Administrative Hearing Officer
  agent: Administrative Hearing Officer
  agent_role: decide
  situation: The Local Security Office expressed substantial doubt about the employee's continued access authorization, invoking
    Guideline E (personal conduct) and Guideline F (financial considerations). The employee had six delinquent debt accounts
    totaling $20,525 and had not filed Federal income tax returns for 2021-2024. He admitted past lapses, settled one account,
    and asserted that a financial-services firm had cleared the remaining obligations, but initially offered no documentation.
    The officer received official clearance letters from each creditor confirming zero balances and stamped IRS acceptance
    notices for the 2021-2024 returns showing no tax liability. After evaluating the mitigating condition (a) for both guidelines,
    the officer concluded that the evidence satisfies the required remediation. DOE policy presumes against granting or restoring
    a clearance unless the individual rebuts the presumption. The officer must now decide whether to restore the employee's
    access authorization.
  question: What should the Administrative Hearing Officer decide regarding the employee's access authorization?
  options:
    O1:
      do: The Administrative Hearing Officer restores the employee's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Hearing Officer denies restoration of the employee's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A DOE credit report identified six outstanding debt accounts with a combined balance of $20,525.
  - id: F2
    kind: authority
    status: confirmed
    fact: The employee did not disclose those debts as required by DOE Order 472.2A.
  - id: F3
    kind: situation
    status: confirmed
    fact: Federal personal income tax returns for the years 2021-2024 were not filed.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline E (personal conduct) and Guideline F (financial considerations) as the
      basis for substantial doubt.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual submitted official clearance letters from each creditor confirming zero balances, and provided stamped
      copies of IRS acceptance notices for the 2021‑2024 returns showing no outstanding tax due.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Administrative Judge concluded that the provided evidence satisfies mitigating condition (a) for both Guidelines
      E and F.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE policy establishes a presumption against granting or restoring a clearance, placing the burden on the individual
      to demonstrate eligibility.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Administrative Judge concluded that the employee's access authorization should be restored.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline E is satisfied because the creditor letters and the officer's finding that mitigating condition (a) is
      met demonstrate that the employee has corrected the earlier nondisclosure and shown candor.
  - id: C2
    facts:
    - F3
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Guideline F is satisfied since the IRS acceptance notices prove that the missing tax returns have been filed and
      any liabilities resolved, meeting mitigating condition (a) for financial considerations.
  - id: C3
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The evidence in F6 rebuts the statutory presumption against restoration, shifting the burden away from the employee
      and allowing a favorable determination.
  - id: C4
    facts:
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The officer's determination that mitigating conditions are satisfied eliminates the unresolved security concerns
      that originally underpinned the denial.
  reasoning:
    read: The issue is whether the employee's remedial actions—cleared debts and filed tax returns—sufficiently address the
      security concerns raised under Guidelines E and F to permit restoration of access.
    weighing: Because the officer found that mitigating condition (a) is satisfied for both guidelines ({C1}, {C2}) and the
      presumption against restoration is rebutted ({C3}), the balance now favors restoration ({C4}).
    tradecraft: The decision is documented in the official OHA memorandum, signed by the Administrative Hearing Officer, and
      the outcome is transmitted to the Local Security Office for implementation.
    uncertainty: Future uncertainty centers on whether any new undisclosed financial issues emerge that could revive substantial
      doubt.
    handoff: The Administrative Hearing Officer acts alone, as DOE regulations vest sole authority in the officer to resolve
      eligibility after the hearing.
    tempting_wrong:
      option: O2
      pull: The employee's prior nondisclosure and the historical tax-filing lapse might tempt a cautious approach.
      why_wrong: Given the verified documentation of debt satisfaction and tax compliance, denying restoration would ignore
        the fulfilled mitigating condition and conflict with due-process requirements.
    rejected:
      O2: The employee has now provided concrete proof that all debts are cleared and tax obligations are satisfied, meeting
        mitigating condition (a) and rebutting the presumption against restoration.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the employee fails to produce verifiable proof that all delinquent debts have been satisfied and that the missing
        tax returns have been filed and any liabilities settled.
      then: O2
      why: Without such proof, mitigating condition (a) would not be met, reinstating substantial doubt and justifying denial.
    would_not_change:
    - id: noflip1
      if: If the employee continues to rely solely on uncorroborated statements without documentary evidence.
      why: The absence of documentation means the mitigating conditions remain unmet, so the denial stays appropriate.
    watch_for:
    - id: watch1
      what: Any future submission of audited financial statements or additional IRS acceptance notices for the 2021-2024 tax
        years.
      favors:
      - O1
      why: New concrete proof could further reinforce the employee's eligibility and sustain the restored authorization.
  lesson: When an individual supplies verifiable documentation that debts are cleared and tax returns are filed, the mitigating
    condition (a) for Guidelines E and F is satisfied, rebutting the presumption against granting a clearance and supporting
    restoration of access.
  limits: This analysis applies exclusively to DOE personnel-security determinations governed by Part 710 and the Adjudicative
    Guidelines; it does not extend to criminal, civil, or non-DOE security contexts.
