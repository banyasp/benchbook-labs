case:
  id: DR-OHA-26-0086-restyle1@v1
  title: DOE Personnel Security Clearance Restoration Decision [restyle]
  status: needs_review
  setting: Office of Personnel Security, Department of Energy, 10 August 2026
  decider: Adjudicative Officer
  agent: Adjudicative Officer
  agent_role: decide
  situation: The Local Security Office expressed substantial doubt about the employee's eligibility for a restored security
    clearance, invoking Guideline E (personal conduct) and Guideline F (financial considerations). The employee carries six
    delinquent debt accounts totaling $20,525 and has not filed Federal income tax returns for the 2021-2024 years. He admitted
    to imprudent behavior, settled one debt, and asserted that he hired a financial counseling service, yet he supplied no
    documentation for the remaining obligations or the tax filings. The Adjudicative Officer examined the mitigating provisions
    of the Adjudicative Guidelines and found none applicable. DOE policy imposes a presumption against granting or reinstating
    a clearance, requiring the employee to demonstrate eligibility. At the decision point, the Officer must decide whether
    to restore the employee's security clearance.
  question: What action should the Adjudicative Officer take regarding the employee's security clearance?
  options:
    O1:
      do: The Adjudicative Officer grants restoration of the employee's security clearance.
      move: act
      irreversible: true
    O2:
      do: The Adjudicative Officer denies any restoration of the employee's security clearance.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A DOE credit assessment identified six outstanding debt accounts aggregating to $20,525.
  - id: F2
    kind: authority
    status: confirmed
    fact: The employee failed to disclose those outstanding debts as mandated by DOE Order 472.2A.
  - id: F3
    kind: situation
    status: confirmed
    fact: The employee did not submit Federal personal income tax returns for the years 2021 through 2024.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office raised substantial doubt, citing Guideline E (personal conduct) and Guideline F (financial
      considerations).
  - id: F5
    kind: capability
    status: assessed
    fact: The employee settled one obligation, engaged a financial counseling service, but supplied no supporting documents
      for the remaining balances or for the 2021 tax filing.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Adjudicative Officer determined that none of the mitigating conditions under Guideline E or Guideline F were
      satisfied.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE policy establishes a presumption against granting or reinstating a clearance, placing the burden of proof on
      the employee.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Adjudicative Officer concluded that the employee's clearance should not be reinstated.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline E is triggered because the employee omitted required disclosure of delinquent debts under DOE Order 472.2A,
      reflecting a lapse in candor and judgment.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline F applies due to the employee's unresolved $20,525 in debts and the absence of tax filings for 2021-2024,
      indicating questionable financial responsibility.
  - id: C3
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: Under DOE policy, the presumption against clearance reinstatement remains in effect; the employee has not met the
      evidentiary burden to overturn it.
  - id: C4
    facts:
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: Since no mitigating condition under Guidelines E or F was found, the security concerns identified by the Local Security
      Office persist.
  - id: C5
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The employee's assertion of having hired a financial counseling service lacks corroborating evidence, weakening the
      credibility of his remediation claim.
  reasoning:
    read: The issue is whether the employee's unpaid debts and failure to file taxes, together with his nondisclosure of those
      debts, constitute unresolved security concerns under Guidelines E and F that bar restoration of his clearance.
    weighing: The Officer applied the Adjudicative Guidelines and determined that none of the seven mitigating factors for
      Guideline E nor the seven for Guideline F were met ({C1}, {C2}, {C4}). Because the statutory presumption against clearance
      reinstatement remains unchallenged ({C3}), the analysis leans decisively toward denial.
    tradecraft: The determination is entered in the official OHA decision memorandum, bearing the Officer's signature, and
      the result is forwarded to the Local Security Office for execution.
    uncertainty: Uncertainty remains regarding the employee's capacity to later produce verifiable proof of debt satisfaction
      and tax compliance, which could modify the mitigation assessment.
    handoff: The Adjudicative Officer acts unilaterally, as the regulations vest sole authority for eligibility rulings in
      the Officer after the hearing.
    tempting_wrong:
      option: O1
      pull: The employee's acknowledgment of fault and his claim of retaining a financial counseling service might incline
        the decision-maker toward leniency.
      why_wrong: Absent documented evidence of debt repayment or filed tax returns, the mitigating criteria are unmet, and
        granting would violate the presumption and the Officer's analysis.
    rejected:
      O1: The employee failed to satisfy any mitigating condition and did not meet the evidentiary burden required to overcome
        the presumption against restoration.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee submits verifiable records showing that all outstanding debts have been fully satisfied and that the
        missing Federal tax returns for 2021-2024 have been filed and any liabilities settled.
      then: O1
      why: Such documentation would fulfill mitigating condition (a) for both Guidelines E and F—demonstrating prompt, good-faith
        remediation—and would eliminate the substantial doubt.
    would_not_change:
    - id: noflip1
      if: The employee continues to rely solely on unsubstantiated statements without documentary support.
      why: Without evidence, no mitigating conditions are satisfied, so the denial remains appropriate.
    watch_for:
    - id: watch1
      what: Any future receipt of audited financial statements or IRS acknowledgment of filed returns for the 2021-2024 periods.
      favors:
      - O1
      why: Concrete proof of compliance could prompt a re-evaluation of the security concerns under Guidelines E and F.
  lesson: When an employee fails to disclose financial delinquencies and neglects required tax filings, the evidentiary burden
    rests on the employee to prove remediation; lacking verifiable proof, the presumption against clearance reinstatement
    prevails.
  limits: This analysis is confined to DOE personnel security determinations governed by Part 710 and the Adjudicative Guidelines;
    it does not extend to criminal or civil liability contexts.
