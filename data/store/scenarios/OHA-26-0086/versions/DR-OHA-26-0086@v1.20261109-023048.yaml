case:
  id: DR-OHA-26-0086@v1
  title: DOE Personnel Security Clearance Restoration Decision
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, August 10 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Local Security Office raised substantial doubt about the Individual's eligibility for continued access authorization,
    citing Guideline E (personal conduct) and Guideline F (financial considerations). The Individual had six delinquent debt
    accounts totaling $20,525 and had failed to file Federal income tax returns for the 2021‑2024 tax years. He acknowledged
    irresponsible behavior, settled one debt, and claimed to have engaged a financial service provider, but provided no documentation
    for most debts or tax filings. The Administrative Judge evaluated the mitigating conditions under the Adjudicative Guidelines
    and found none applicable. DOE regulations impose a presumption against granting or restoring a clearance, requiring the
    individual to prove eligibility. At the decision point, the Judge must determine whether to restore the Individual's access
    authorization.
  question: What should the Administrative Judge do regarding the Individual's access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual's access authorization.
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge denies restoration of the Individual's access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual has six delinquent accounts totaling $20,525 identified in a DOE credit report.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Individual failed to report those delinquent accounts as required by DOE Order 472.2A.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual did not file Federal personal income tax returns for tax years 2021‑2024.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Local Security Office cited Guideline E (personal conduct) and Guideline F (financial considerations) as bases
      for substantial doubt.
  - id: F5
    kind: capability
    status: assessed
    fact: The Individual settled one debt, engaged a financial service provider, but provided no documentation for the remaining
      debts or the 2021 tax return.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Administrative Judge found that none of the mitigating conditions under Guideline E or Guideline F apply.
  - id: F7
    kind: authority
    status: confirmed
    fact: DOE regulations impose a presumption against granting or restoring a clearance and require the individual to prove
      eligibility.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The Administrative Judge concluded that the Individual's access authorization should not be restored.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline E (personal conduct) is invoked because the Individual failed to report delinquent debts as required by
      DOE Order 472.2A, demonstrating lack of candor and questionable judgment.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Guideline F (financial considerations) is invoked due to the Individual’s unresolved $20,525 in debts and failure
      to file Federal tax returns for 2021‑2024, indicating poor financial judgment and unreliability.
  - id: C3
    facts:
    - F6
    - F7
    equity: due_process
    favors:
    - O2
    weight: strong
    why: DOE regulations impose a presumption against granting or restoring a clearance; the burden is on the Individual to
      prove eligibility, which he failed to meet.
  - id: C4
    facts:
    - F6
    - F8
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The Administrative Judge found none of the mitigating conditions under Guidelines E or F applicable, so the security
      concerns remain unresolved.
  - id: C5
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The Individual’s claim of engaging a financial service provider lacks corroborating documentation, reducing the credibility
      of his remedial efforts.
  reasoning:
    read: The case centers on whether the Individual’s financial delinquencies and failure to file taxes, coupled with his
      nondisclosure of those delinquencies, create unresolved security concerns under Guidelines E and F that preclude restoration
      of his access authorization.
    weighing: The Judge applied the Adjudicative Guidelines and found that none of the seven mitigating conditions for Guideline
      E nor the seven for Guideline F were satisfied ({C1}, {C2}, {C4}). Because the presumption against granting a clearance
      remains unrebutted ({C3}), the balance tips decisively toward denial.
    tradecraft: The decision is recorded in the official OHA decision memorandum, signed by the Administrative Judge, and
      the outcome is communicated to the Local Security Office for implementation.
    uncertainty: The primary uncertainty lies in the Individual’s future ability to provide verifiable evidence of debt repayment
      and tax compliance, which could alter the mitigation analysis.
    handoff: The Administrative Judge decides alone, as the regulations grant the judge sole authority to resolve the eligibility
      determination after the hearing.
    tempting_wrong:
      option: O1
      pull: The Individual’s admission of responsibility and his claim of hiring a financial service provider might tempt
        a more lenient view.
      why_wrong: Without documented proof of repayment or tax filing, the mitigating conditions are not met, and granting
        would contravene the statutory presumption and the Judge’s own analysis.
    rejected:
      O1: The Individual did not satisfy any mitigating condition and failed to meet the burden of proof required to overcome
        the presumption against restoration.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual provides verifiable documentation that all delinquent debts have been paid in full and that all missing
        Federal tax returns have been filed and any tax liabilities settled.
      then: O1
      why: Such evidence would satisfy mitigating condition (a) for both Guidelines E and F—prompt, good‑faith efforts to
        correct the omissions—removing the substantial doubt.
    would_not_change:
    - id: noflip1
      if: The Individual continues to rely solely on uncorroborated statements without documentary proof.
      why: The lack of evidence means none of the mitigating conditions are met, so the denial remains appropriate.
    watch_for:
    - id: watch1
      what: Any future submission of audited financial statements or IRS acceptance notices for the 2021‑2024 tax years.
      favors:
      - O1
      why: Concrete proof of compliance could trigger a re‑evaluation of the security concerns under Guidelines E and F.
  lesson: When an individual fails to report financial delinquencies and to file required tax returns, the burden of proof
    lies with the individual to demonstrate remediation; without verifiable evidence, the presumption against granting a clearance
    prevails.
  limits: This reasoning applies only to DOE personnel security determinations under Part 710 where the Adjudicative Guidelines
    are the governing standard; it does not extend to criminal or civil liability contexts.
  library:
    domain: personnel security adjudication
    family: OHA-26-0086
    source: https://www.energy.gov/sites/default/files/2026-08/PSH-26-0086.pdf
    episode_focus: 'The security concerns under Guideline E (personal conduct), Guideline F (financial considerations): whether
      the Individual has resolved them, so that access authorization can be restored. Decision point: the Administrative Judge''s
      overall determination on the Individual''s eligibility (unfavorable, not restored).'
