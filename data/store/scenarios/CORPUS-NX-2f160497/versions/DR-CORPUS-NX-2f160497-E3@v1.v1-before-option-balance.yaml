case:
  id: DR-CORPUS-NX-2f160497-E3@v1
  title: Preparing Conventional Forces for Security Force Assistance
  status: draft
  setting: Army force-management and BCT training policy during development of FM 3-07.1.
  decider: The Army
  agent: The Army
  agent_role: decide
  situation: Demand for security force assistance missions is growing, while developing additional Special Operations Forces
    capacity is a long-term process. Conventional forces are expected to augment Special Operations Forces for these missions.
    The Army is considering how to prepare conventional brigades for assistance work within its force-management and training
    system. Critics question whether preparation within the regular brigade training cycle will produce adequate capacity
    and skills. A dedicated Department of Defense agency has also been raised as a possible way to manage growing assistance
    demands.
  question: What should the Army do about preparing conventional brigades for growing security force assistance requirements?
  options:
    O1:
      do: The Army asks the Department of Defense to assess a dedicated SFA agency for managing growing assistance demands.
      move: ask
      irreversible: false
      to: the Department of Defense
    O2:
      do: The Army rejects the regular BCT training cycle as its framework for preparing conventional forces for SFA missions.
      move: act
      irreversible: false
    O3:
      do: The Army adopts the regular BCT training cycle as its framework for preparing conventional forces for SFA missions.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Security force assistance activities have grown over the last decade.
  - id: F2
    kind: capability
    status: assessed
    fact: Building foreign security force proficiency and accountability across an expanding number of states requires more
      Special Operations Forces and other Department of Defense capabilities.
  - id: F3
    kind: capability
    status: assessed
    fact: Rapidly expanding Special Operations Forces is not a viable short-term solution, since developing those personnel
      takes substantial training, education, and operational experience.
  - id: F4
    kind: capability
    status: assessed
    fact: The USSOCOM guide asserts that conventional Army forces will have to augment Special Operations Forces on security
      force assistance missions.
  - id: F5
    kind: situation
    status: confirmed
    fact: FM 3-07.1 proposed adapting Army force-management institutions to meet assistance requirements and making security
      force assistance a conventional force core competency.
  - id: F6
    kind: situation
    status: confirmed
    fact: Under the proposed approach, conventional brigades would be tailored and augmented for assistance missions during
      their regular training cycle, with selected brigades preparing during an 18-month train-ready phase.
  - id: F7
    kind: capability
    status: assessed
    fact: Critics doubt that brigades prepared through this approach will have the capacity or skills to execute assistance
      missions successfully.
  - id: F8
    kind: situation
    status: assessed
    fact: Critics expect geographic commands' requests for assistance missions to grow amid persistent irregular conflict.
  - id: F9
    kind: situation
    status: assessed
    fact: Establishing a Department of Defense agency with primary responsibility for managing geographic commands' assistance
      demands has been proposed as a possible starting point.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Assistance demand is growing, while developing additional SOF capacity is a long-term undertaking; conventional Army
      forces are expected to augment SOF.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The Army's chosen framework adapts force-management institutions to the demand and incorporates assistance preparation
      into the regular brigade training cycle.
  - id: C3
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    - O1
    weight: strong
    why: Critics doubt that brigades prepared this way will have the capacity and skills to execute missions successfully,
      while geographic commands' requests are expected to grow.
  - id: C4
    facts:
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: A dedicated DOD agency is raised as a possible starting point for managing growing assistance demands, but it is
      not presented as the Army's chosen preparation framework.
  reasoning:
    read: 'The problem is a growing assistance requirement that cannot be met quickly by expanding SOF, alongside an Army
      choice to prepare conventional brigades within their existing training system. The trap is to treat that framework as
      proof that brigades will have adequate capacity and skills: critics specifically question whether it will meet the demands.'
    weighing: The near-term need for conventional forces to augment SOF, and the Army's plan to adapt its force-management
      and training systems, support {O3} {C1} {C2}. The serious counterweight is the doubt that this preparation will produce
      sufficient capacity and skills as requests grow {C3}. The source records the Army's adoption of the approach despite
      that criticism, while identifying a DOD agency as a possible starting point rather than an adopted alternative {C4}.
      The balance depends on whether brigade preparation can in practice meet the mission requirements.
    tradecraft: Treat adoption of the training-cycle framework as a force-structure decision, and record the capacity-and-skills
      concern alongside the rationale for using conventional forces to augment SOF. Track whether the approach is producing
      the capabilities required before treating the framework as sufficient.
    uncertainty: The source gives the critics' doubts but does not resolve them with evidence of how well brigades prepared
      under the approach performed. It also raises an agency as a possible starting point without specifying how that option
      would work or whether it would address the identified capability gap.
    handoff: The Army holds the force-management and brigade-preparation decision. Because the alternative raised would place
      primary responsibility for managing demand in a DOD agency, pursuing that alternative would require DOD involvement.
    tempting_wrong:
      option: O2
      pull: Rejecting the regular training cycle may seem prudent given the stated doubts about brigade capacity and skills.
      why_wrong: That concern is important but does not itself establish that the Army should reject the framework; the stated
        demand and long lead time for additional SOF explain why the Army chose to adapt conventional force preparation.
    rejected:
      O1: The dedicated DOD agency is raised only as a possible starting point, whereas the Army's described choice was to
        prepare conventional brigades through its regular training system.
      O2: The Army chose to fold assistance preparation into the regular brigade training cycle rather than reject that framework,
        despite the recorded doubts about its adequacy.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Further assessment establishes that regular-cycle brigade preparation cannot provide the capacity or skills required
        for successful assistance missions.
      then: O2
      why: That would substantiate the central criticism and support rejecting the training-cycle framework.
    - id: flip2
      if: DOD determines that a dedicated agency should manage growing assistance demands and that the Army should seek that
        assessment instead of relying on the brigade training-cycle framework.
      then: O1
      why: That would make the possible agency approach the preferred force-management course rather than merely a proposed
        starting point.
    would_not_change:
    - id: noflip1
      if: Developing additional SOF remains a long-term process.
      why: That condition reinforces the stated need for conventional forces to augment SOF; by itself it does not resolve
        the separate question of whether brigade preparation is adequate.
    watch_for:
    - id: watch1
      what: Whether growing geographic-command requests exceed the capacity and skills of brigades prepared through the regular
        training cycle.
      favors:
      - O1
      - O2
      why: The source identifies both increasing demand and doubts about the adequacy of this preparation; evidence that the
        gap is real would strengthen the alternatives.
  lesson: 'When demand grows faster than a specialized force can be developed, adapting conventional-force preparation may
    be a necessary response. That choice should not be treated as proof of capability: test whether the adapted force can
    meet the mission, and revisit the framework if it cannot.'
  limits: This reasoning concerns Army force-management and training policy for security force assistance, not the adequacy
    of any particular mission or tactical activity. The source records concerns about brigade capacity and skills but does
    not resolve them with performance evidence.
