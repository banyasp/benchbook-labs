        O3: 18
      real_option: O3
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: ask
        O2: act
        O3: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
        O3: false
