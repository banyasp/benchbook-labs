case:
  id: DR-CORPUS-NX-1823a383-E1@v1
  title: Prior Review of FBI Reports
  status: draft
  setting: At CIA Headquarters, during the period described, concerning FBI field-office reports furnished to the Agency.
  decider: The Agency
  agent: The Agency
  agent_role: decide
  situation: In the past, FBI field offices routinely furnished the Agency with copies of reports when an individual might
    have counterintelligence interest. FBI reports were a major source of index references to United States citizens. Many
    names in raw reports were indexed with relatively little attempt to assess their potential relevance to CIA. The result
    was a large number of generally unevaluated index references to Americans. The policy choice is whether incoming FBI reports
    should be indexed routinely or require a prior relevance-and-criteria determination.
  question: 'What should the Agency do about routine indexing of incoming FBI reports: include them routinely, or exclude
    them from routine indexing unless a prior relevance-and-criteria determination is made?'
  options:
    O1:
      do: The Agency excludes incoming FBI reports from routine indexing unless a prior relevance-and-criteria determination
        is made.
      move: act
      irreversible: false
    O2:
      do: The Agency includes incoming FBI reports in routine indexing without a prior relevance-and-criteria determination.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: FBI field offices considered that a report on an individual might have counterintelligence interest.
  - id: F2
    kind: situation
    status: confirmed
    fact: FBI field offices routinely furnished the Agency copies of reports they considered potentially relevant to counterintelligence.
  - id: F3
    kind: situation
    status: confirmed
    fact: FBI reports were a major source of index references to United States citizens.
  - id: F4
    kind: situation
    status: confirmed
    fact: Many names in raw FBI reports were indexed with relatively little attempt to determine their potential relevance
      to CIA.
  - id: F5
    kind: situation
    status: confirmed
    fact: A large number of generally unevaluated index references to Americans were placed in the system.
  - id: F6
    kind: authority
    status: confirmed
    fact: Indexing criteria existed, and clerks were expected to comply with them.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: usp_privacy
    favors:
    - O1
    weight: strong
    why: Raw FBI reports produced a large number of generally unevaluated index references to Americans. Requiring a prior
      determination responds to that stated concern by limiting references to cases that meet the criteria.
  - id: C2
    facts:
    - F4
    equity: record_integrity
    favors:
    - O1
    weight: strong
    why: Many names were indexed with relatively little assessment of their potential relevance to the Agency. The prior determination
      makes relevance to the Agency part of the decision before indexing.
  - id: C3
    facts:
    - F6
    equity: policy_compliance
    favors:
    - O1
    weight: weak
    why: Indexing criteria already existed and clerks were expected to comply with them. Requiring an appropriate division
      or staff to determine that the criteria are met supports their application to FBI reports.
  reasoning:
    read: The decision is about whether FBI reports should generate index references routinely, not whether the Agency should
      receive the reports. The trap is treating an FBI field office's view that someone might have counterintelligence interest
      as enough, by itself, to establish that indexing criteria are met or that the person is relevant to the Agency.
    weighing: 'The central stated concern is the volume of American names placed in the system without adequate assessment
      of their potential relevance {C1} {C2}. Existing criteria also supplied a standard for addressing that concern {C3}.
      Those reasons support O1: the Agency''s policy was to require a prior relevance-and-criteria determination. The balance
      depends on applying the criteria before indexing, rather than treating potential counterintelligence interest alone
      as sufficient.'
    tradecraft: Have the appropriate division or staff make the prior relevance-and-criteria determination, and apply the
      existing criteria consistently. Keep the decision at the level of whether the report meets those criteria; the source
      does not specify a separate documentation procedure.
    uncertainty: The passage does not give the criteria themselves or quantify the consequences of the unevaluated references.
      It therefore does not establish that every FBI report or every American named in one is irrelevant, or that the prior
      practice violated a specific privacy law.
    handoff: The Agency makes the policy decision, with the appropriate division or staff making the prior determination because
      the stated policy assigns that assessment to them.
    tempting_wrong:
      option: O2
      pull: FBI field offices furnished reports when they thought an individual might have counterintelligence interest, which
        can make routine indexing seem justified.
      why_wrong: That assessment did not prevent many names from being indexed with little assessment of their potential relevance
        to the Agency, producing a large number of generally unevaluated references.
    rejected:
      O2: The Agency did not continue routine indexing without prior determination because the raw reports had generated many
        American references with little assessment of their potential relevance to the Agency.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Agency changed its criteria and policy to permit routine indexing of this category of reports without a prior
        relevance-and-criteria determination.
      then: O2
      why: If the governing policy expressly removed the prior-determination requirement, O1 would no longer follow from that
        policy; the revised criteria would need to justify routine indexing.
    would_not_change:
    - id: noflip1
      if: An FBI field office considers a person potentially of counterintelligence interest, but no prior determination establishes
        that the Agency's indexing criteria are met.
      why: Potential counterintelligence interest alone does not answer the relevance-and-criteria concern that led the Agency
        to stop routine indexing.
    watch_for:
    - id: watch1
      what: Whether the appropriate division or staff determines that particular reports meet the existing indexing criteria.
      favors:
      - O1
      why: That determination is the stated condition for indexing under the Agency's policy; it permits qualifying reports
        to be treated differently from reports that have not been assessed.
  lesson: A source agency's preliminary view that information may matter does not, on its own, establish that it meets the
    receiving agency's criteria for indexing. When routine handling has produced many unevaluated references about people,
    require a relevance-and-criteria determination before adding those references.
  limits: This reasoning concerns indexing FBI reports under the criteria described, not whether reports should be received,
    retained, or used for other purposes. The passage does not establish a legal finding of a privacy violation or provide
    the criteria needed to assess any particular report.
