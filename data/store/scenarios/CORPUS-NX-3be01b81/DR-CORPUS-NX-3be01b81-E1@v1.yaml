case:
  id: DR-CORPUS-NX-3be01b81-E1@v1
  title: Aggressive War and the Rules of Warfare
  status: draft
  setting: United States Military Tribunal, proceedings concerning occupied territories and German nationals
  decider: The Tribunal
  agent: The Tribunal
  agent_role: decide
  situation: The accused were before a United States Military Tribunal on charges involving the enactment and enforcement
    of criminal statutes and cooperation with German Security Police organizations. The charges concerned crimes against civilian
    inhabitants of occupied territories, prisoners of war, and German nationals. The prosecution relied on the rules of land
    warfare as a measure of conduct. An argument was advanced that Germany’s aggressive war made every act that would have
    been lawful in a defensive war illegal. The accused were not charged with crimes against the peace, and it had not been
    proved that they knew the war rested on a criminal conspiracy or violated international law.
  question: What should the Tribunal do with the argument that Germany’s aggressive war made every act otherwise lawful in
    a defensive war illegal for these defendants?
  options:
    O1:
      do: The Tribunal accepts the argument that the aggressive war made every act otherwise lawful in a defensive war illegal
        for these defendants.
      move: act
      irreversible: true
    O2:
      do: The Tribunal rejects the argument that the aggressive war made every act otherwise lawful in a defensive war illegal
        for these defendants.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The accused were charged with enacting and enforcing statutes, decrees, and orders of an essentially criminal nature.
  - id: F2
    kind: situation
    status: confirmed
    fact: The accused were charged with working with German Security Police organizations for essentially criminal purposes.
  - id: F3
    kind: situation
    status: confirmed
    fact: The charges concerned crimes against civilian inhabitants of occupied territories, prisoners of war, and German
      nationals.
  - id: F4
    kind: situation
    status: confirmed
    fact: The accused were not charged with crimes against the peace.
  - id: F5
    kind: situation
    status: confirmed
    fact: It had not been proved that the accused knew the war they supported rested on a criminal conspiracy or was itself
      a violation of international law.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Propaganda concealed the criminal plans of the aggressors’ inner circle from many public officials.
  - id: F7
    kind: authority
    status: confirmed
    fact: The prosecution relied on the rules of land warfare as the measure of conduct.
  - id: F8
    kind: situation
    status: confirmed
    fact: The argument presented was that acts lawful in a defensive war became illegal because Germany’s war was aggressive.
  considerations:
  - id: C1
    facts:
    - F4
    - F8
    equity: due_process
    favors:
    - O2
    weight: strong
    why: The accused were not charged with crimes against the peace, so the Tribunal would not treat Germany’s aggressive
      war alone as making every otherwise lawful act criminal for them.
  - id: C2
    facts:
    - F5
    - F6
    equity: due_process
    favors:
    - O2
    weight: strong
    why: It had not been proved that the accused knew the war rested on a criminal conspiracy or violated international law;
      the concealment of the aggressors’ plans from many public officials reinforced why that knowledge could not simply be
      presumed.
  - id: C3
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Tribunal reasoned that accepting the blanket argument would make the rules of land warfare cease to measure conduct
      and turn guilt into a formality, treating every soldier who marched into occupied territory or fought at home as a criminal.
  reasoning:
    read: The issue is whether Germany’s aggressive resort to war automatically criminalizes acts that would otherwise have
      been lawful in a defensive war for these defendants. The trap is to transfer the criminality of the war itself to defendants
      who were neither charged with crimes against the peace nor proved to have known of the criminal conspiracy.
    weighing: The Tribunal rejected that automatic transfer. The absence of charges for crimes against the peace and the lack
      of proof of the defendants’ knowledge weigh against accepting the argument; the Tribunal also reasoned that doing so
      would displace the rules of land warfare as the measure of conduct and make guilt a formality. Its stated exception
      was for those who planned the aggressive war and were charged with and guilty of a crime against the peace.
    tradecraft: 'Record the ruling narrowly: reject the blanket argument, while assessing the charged conduct under the rules
      of land warfare relied on by the prosecution. Do not imply that rejecting this argument resolves the separate charges
      against the accused.'
    uncertainty: The defendants’ knowledge of the war’s criminal basis was not proved; the record as framed does not establish
      what each accused privately knew.
    handoff: The Tribunal decides the argument as part of its adjudication. No further decision-maker is identified as necessary.
    tempting_wrong:
      option: O1
      pull: Germany’s war was aggressive, which may seem to taint every act undertaken in support of it.
      why_wrong: The Tribunal rejected that categorical approach for these defendants because they were not charged with crimes
        against the peace and their knowledge of the criminal conspiracy had not been proved; accepting it would make the
        rules of land warfare irrelevant as a measure of conduct.
    rejected:
      O1: The Tribunal rejected this because the defendants’ uncharged and unproved connection to the crime against the peace
        did not justify treating every otherwise lawful act as illegal.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The defendants were among those who planned the aggressive war and were charged with and guilty of a crime against
        the peace.
      then: O1
      why: The Tribunal stated that, for those who planned the aggressive war and were charged with and guilty of the crime
        against the peace, the argument was conclusive.
    would_not_change:
    - id: noflip1
      if: It is established only that Germany’s war was aggressive, while the defendants remain uncharged with crimes against
        the peace and their knowledge remains unproved.
      why: The Tribunal’s stated reasoning rejects using the war’s aggressive character alone to make every otherwise lawful
        act illegal for these defendants.
    watch_for: []
  lesson: Do not automatically transfer the criminality of an aggressive war to every act of those who supported it. Apply
    the relevant rules of conduct and assess the defendants’ charges and established knowledge rather than making guilt a
    formality.
  limits: This reasoning concerns the argument that aggression alone made every otherwise lawful act illegal for these defendants.
    It does not decide whether particular charged conduct violated the rules of land warfare, or the responsibility of persons
    charged with and guilty of crimes against the peace.
