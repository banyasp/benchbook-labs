case:
  id: DR-CORPUS-NX-85374225-E1@v1
  title: Shifting the Division Main Effort
  status: draft
  setting: During the next phase of a division operation, at the division level.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: A division operation is moving from shaping operations toward a decisive operation. The Commander must designate
    the main effort for the next phase. The main effort receives prioritized resources, while supporting efforts receive the
    minimum assets needed for their missions. The shaping operation may be designated as the main effort to set conditions
    for later decisive operations. The division’s sequence of shaping and decisive operations is intended to set conditions
    for future success.
  question: What should the Commander do in the next phase about the division’s main effort and resource priorities?
  options:
    O1:
      do: The Commander deprioritizes the decisive operation, retains the shaping operation as the main effort, and keeps
        resources aligned to it.
      move: act
      irreversible: false
    O2:
      do: The Commander prioritizes the decisive operation as the main effort and reallocates resources to support it.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The main effort is the subordinate unit whose mission is most critical to overall mission success at a given time.
  - id: F2
    kind: situation
    status: confirmed
    fact: Resources are prioritized to support the main effort, which usually contains the bulk of the unit’s combat power.
  - id: F3
    kind: situation
    status: confirmed
    fact: A supporting effort is a subordinate unit with a mission that supports the main effort and receives the minimum
      assets needed for its mission.
  - id: F4
    kind: situation
    status: confirmed
    fact: The main effort can shift between decisive and shaping operations multiple times as the operation is sequenced and
      executed.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Commander can designate the shaping operation as the main effort.
  - id: F6
    kind: situation
    status: confirmed
    fact: The sequence of shifting main and supporting efforts between shaping and decisive operations sets conditions for
      future successful operations.
  considerations:
  - id: C1
    facts:
    - F1
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The main effort is the subordinate mission most critical to success at that time, and the next-phase example shifts
      the main effort from shaping to decisive operations.
  - id: C2
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Resources are prioritized for the main effort, while supporting efforts receive only the assets needed for their
      missions; once the decisive operation is designated main effort, priorities should align with it.
  - id: C3
    facts:
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Shifting main and supporting efforts as operations are sequenced sets conditions for future successful operations;
      the next-phase example applies that rationale by shifting priority to the decisive operation.
  - id: C4
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Commander may keep the shaping operation as the main effort when it is needed to set conditions for later decisive
      operations, but that is a conditional alternative rather than the next-phase outcome.
  reasoning:
    read: The decision is a phase-specific designation of which subordinate mission is most critical, followed by aligning
      resource priorities to that designation. The trap is treating shaping as the default main effort merely because it can
      prepare the way for a decisive operation; the main effort can shift as sequencing and execution change.
    weighing: 'The next-phase example favors {O2}: the decisive operation becomes the main effort, while supporting efforts
      enable it. That aligns the main-effort designation and resource priorities with the phase and with the stated purpose
      of setting conditions for future success {C1} {C2} {C3}. Retaining shaping as the main effort is reasonable when shaping
      is still the mission most critical to setting those conditions, but that is a possible designation, not the next-phase
      outcome {C4}. The balance depends on which subordinate mission is most critical at the time.'
    tradecraft: Record the phase-specific assessment of which mission is most critical, designate the main effort, and align
      resource priorities with that designation. Reassess as the operation is sequenced and executed; preserve enough explanation
      to show why the designation supports mission success.
    uncertainty: The example gives no detailed assessment of the division's actual missions or circumstances. The decision
      therefore rests on the fixed frame that the operation is moving toward its decisive phase; a different assessment of
      what is most critical could support a different designation.
    handoff: The Commander is the identified decision-maker and has authority to designate the shaping operation as main effort.
      No basis is given for requiring a referral or additional approval.
    tempting_wrong:
      option: O1
      pull: Shaping can set conditions for later decisive operations, so retaining it as the main effort may seem prudent.
      why_wrong: That rationale applies when shaping is still the mission most critical to success. In the next-phase example,
        the decisive operation becomes the main effort and supporting efforts enable it.
    rejected:
      O1: The next-phase example shifts the main effort to the decisive operation rather than retaining shaping as the priority.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Commander assesses that the shaping operation is again the mission most critical to success, for example because
        it must wear down enemy forces and set conditions for later decisive operations.
      then: O1
      why: The shaping operation may be designated main effort for that purpose.
    would_not_change:
    - id: noflip1
      if: The shaping operation was the main effort in an earlier phase.
      why: Prior designation alone does not require retaining it; the next-phase example shifts the main effort from shaping
        to decisive operations.
    watch_for:
    - id: watch1
      what: Changes in sequencing or execution that make a shaping mission more critical to overall mission success.
      favors:
      - O1
      why: The main effort can shift multiple times as the operation is sequenced and executed.
  lesson: Designate the main effort according to which subordinate mission is most critical to success in the current phase,
    rather than preserving a prior designation by default. Align resource priorities with that designation and reassess as
    the operation is sequenced and executed.
  limits: This reasoning applies to a phase-specific choice between the shaping and decisive operations described here. It
    does not establish that decisive operations should always be the main effort; shaping may take priority when it is most
    critical to setting conditions for later success.
  library:
    domain: operational-command
    family: CORPUS-NX-85374225
    source: https://api.army.mil/e2/c/downloads/2023/01/31/d9843d58/18-516.pdf
    episode_focus: The example presents a choice between continuing to prioritize the shaping operation and shifting priority
      to the decisive operation, with resources reassigned to support the new main effort. The stated rationale is that sequencing
      shaping and decisive operations sets conditions for future success; exclude the specific employment of artillery or
      aviation assets.
    cues:
      option_words:
        O2: 16
        O1: 20
      real_option: O2
      real_to_mean_other_length: 0.8
      real_is_longest: false
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
