case:
  id: DR-CORPUS-INC-BAY-OF-PIGS-OPERATION-NS-2159ccc1-E3@v1
  title: Scope of the Bay of Pigs Survey
  status: draft
  setting: CIA, internal Survey of the Bay of Pigs operation; time not specified.
  decider: The Inspector General responsible for the Survey
  agent: The Inspector General responsible for the Survey
  agent_role: decide
  situation: The Inspector General was defining the scope of an internal CIA Survey of the Bay of Pigs operation. The stated
    purpose was to evaluate selected aspects of Agency performance in the attempt to overthrow Castro, and the remit did not
    include the operation's purely military phase. The Taylor report had already evaluated the US Government's conduct of
    the entire operation. The Inspector General later maintained that the Director of Central Intelligence had instructed
    him to stay out of national policy decisions, although that instruction is not independently established here. The scope
    choice was whether to keep the assessment focused on CIA performance or extend it to national-policy and military decisions.
  question: What should the Inspector General do in setting the Survey's scope?
  options:
    O1:
      do: The Inspector General includes national-policy and purely military decisions in the Survey and evaluates selected
        aspects of CIA performance.
      move: act
      irreversible: false
    O2:
      do: The Inspector General excludes national-policy and purely military decisions from the Survey and evaluates selected
        aspects of CIA performance.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An internal Survey by the CIA Inspector General concerned the Bay of Pigs operation.
  - id: F2
    kind: situation
    status: confirmed
    fact: The stated purpose was to evaluate selected aspects of Agency performance in the attempt to overthrow Castro.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Survey's stated remit did not include the operation's purely military phase.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Taylor report had already evaluated the US Government's conduct of the entire operation.
  - id: F5
    kind: authority
    status: assessed
    fact: The Inspector General later maintained that the Director of Central Intelligence had instructed him to stay out
      of national policy decisions.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Survey did not purport to judge actions of other departments or higher authority and concentrated on phases
      controlled by CIA.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Survey did not examine the totality of CIA activities within Cuba or directed against it from abroad.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Survey's stated task was to evaluate selected aspects of CIA performance and excluded the operation's purely
      military phase; extending it to national-policy and military judgments would exceed the stated scope.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Taylor report had already evaluated the US Government's conduct of the entire operation, so the IG Survey could
      focus on the Agency's performance rather than duplicate that broader assessment.
  - id: C3
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Survey did not purport to judge other departments or higher authority and concentrated on phases controlled by
      CIA, matching its institutional remit.
  - id: C4
    facts:
    - F5
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: Kirkpatrick later said the DCI instructed him to stay out of national-policy decisions. That supports exclusion,
      but the reported instruction is not independently established here and is not needed to ground the choice in the Survey's
      stated purpose and the Taylor report.
  reasoning:
    read: The decision is about the boundary of an internal CIA performance review, not a judgment on the merits of the invasion
      as a whole. The trap is to treat the reported DCI instruction as certain, or to mistake a CIA-focused Survey for a comprehensive
      assessment of all government and military decisions.
    weighing: The stated purpose and exclusion of the purely military phase favor {O2} {C1}. The Taylor report's prior assessment
      of the entire government's conduct and the Survey's focus on CIA-controlled phases reinforce that boundary {C2} {C3}.
      Kirkpatrick's account of the DCI instruction points in the same direction but carries limited weight because it is reported
      retrospectively and is not independently established {C4}.
    tradecraft: State the Survey's remit expressly, distinguish CIA-controlled performance questions from national-policy
      and military judgments, and record the Taylor report as the existing broader assessment. This keeps the scope decision
      and its rationale clear without implying that the Survey assessed matters it excluded.
    uncertainty: The passage qualifies the DCI instruction as Kirkpatrick's later account, not an independently established
      order. It also makes clear that the Survey covered selected aspects, not the totality of CIA activities in or directed
      against Cuba.
    handoff: The IG can set the Survey's CIA-focused scope; the Taylor report had already assessed the government's conduct
      of the entire operation. Broader judgments belong with the authorities responsible for those decisions, rather than
      being added to this Survey.
    tempting_wrong:
      option: O1
      pull: Including national-policy and military decisions may seem to promise a more complete account of the operation.
      why_wrong: That would go beyond the Survey's stated purpose and its focus on CIA-controlled phases, while the Taylor
        report had already assessed the government's conduct of the whole operation.
    rejected:
      O1: The IG did not include national-policy and purely military decisions because the Survey was limited to selected
        aspects of CIA performance and the Taylor report had already assessed the whole government's conduct.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Survey were expressly assigned responsibility for assessing the entire operation and no separate review had
        already evaluated the government's overall conduct.
      then: O1
      why: A broader assigned remit, without the Taylor report's existing coverage, would remove the principal reasons for
        keeping national-policy and military decisions outside this Survey.
    would_not_change:
    - id: noflip1
      if: The DCI instruction described by Kirkpatrick could not be independently confirmed.
      why: The stated Survey purpose, its exclusion of the purely military phase, and the Taylor report's prior evaluation
        still support O2.
    watch_for: []
  lesson: Set an internal review's scope by its stated mandate and the authority responsible for the matters under review.
    When a separate inquiry has already assessed the broader operation, keep the focused review within its remit and do not
    rely on an uncertain account of an instruction as the sole justification.
  limits: This reasoning concerns the scope of this CIA Survey, not whether the Bay of Pigs operation or its underlying policy
    was justified. A different assignment or the absence of the Taylor report's broader assessment could alter the scope balance.
