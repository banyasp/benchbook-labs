      of national and military decisions. The passage attributes the restriction to the DCI as Kirkpatrick later recalled
      it, and explains that the Taylor inquiry had already assessed the government’s conduct; do not treat the reported instruction
      as certain beyond the passage’s qualification.'
    cues:
