case:
  id: DR-CORPUS-INC-BAY-OF-PIGS-OPERATION-NX-f3087007-E1@v1
  title: Public Commitment or Limited Covert Action
  status: draft
  setting: Bay of Pigs, Cuba, 1961; U.S. executive branch.
  decider: The President of the United States
  agent: The President of the United States
  agent_role: decide
  situation: The contemplated undertaking was massive in scale and aimed at reversing the Cuban Revolution. The CIA was solely
    responsible for the proposed operation. The President faced a choice between a limited covert operation and public national-level
    commitment, congressional engagement, and broader resourcing. Covert action was considered understandable in the historical
    context, while the undertaking’s scale was assessed as unlikely to offer much deniability. A cross-government group of
    professionals and broader resourcing were possible alternatives.
  question: What should the President do about whether to pursue the limited covert operation or publicly commit to the objective
    and resource a government-wide effort?
  options:
    O1:
      do: The President should publicly commit to the objective and resource a government-wide effort.
      move: act
      irreversible: true
    O2:
      do: The President should withhold public commitment and pursue the limited covert operation.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The President was the decision maker on whether to pursue a limited covert operation.
  - id: F2
    kind: situation
    status: confirmed
    fact: The proposed undertaking was described as massive in scale.
  - id: F3
    kind: situation
    status: confirmed
    fact: The proposed undertaking aimed to overturn the Cuban Revolution.
  - id: F4
    kind: capability
    status: confirmed
    fact: The CIA was solely responsible for the proposed operation.
  - id: F5
    kind: situation
    status: confirmed
    fact: The limited covert approach did not include public U.S. commitment to the desired outcome.
  - id: F6
    kind: situation
    status: confirmed
    fact: The approach did not include congressional engagement or acceptance of national-level accountability.
  - id: F7
    kind: situation
    status: assessed
    fact: The undertaking’s scale was assessed as unlikely to offer the United States much deniability.
  - id: F8
    kind: capability
    status: assessed
    fact: A cross-government group of professionals and broader government resourcing were assessed as capable of supporting
      a different approach.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: public_transparency
    favors:
    - O1
    weight: strong
    why: The limited approach withheld public commitment, congressional engagement, and national-level accountability. The
      secrecy was undue for an undertaking of this scale.
  - id: C2
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The undertaking was massive, yet its scale was unlikely to provide much deniability; the covert character became
      overt as the operation collapsed. Limited covert action was therefore a poor fit for the undertaking.
  - id: C3
    facts:
    - F2
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The CIA was solely responsible for an undertaking beyond its adequacy. The lack of capabilities for the task was
      a central reason to resource it across government.
  - id: C4
    facts:
    - F8
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Broader resourcing and a diverse, cross-government group could have supported a different approach, and national-level
      resources could have helped ensure success.
  reasoning:
    read: This was a massive undertaking aimed at reversing the Cuban Revolution, not a small operation whose scale could
      reliably remain deniable. The trap was treating limited commitment and covert status as a workable substitute for the
      authority, accountability, and capabilities the undertaking required.
    weighing: 'The judgment favors O1: secrecy and political constraints were ill-suited to the scale, deniability was unlikely,
      and the CIA alone was inadequate. A broader, cross-government effort was more likely to support a different approach
      and success. Covert action was understandable in its historical context, but that consideration did not outweigh the
      mismatch between the undertaking and the limited approach.'
    tradecraft: Before committing, make the scale, objective, accountability, and resourcing assumptions explicit; seek cross-departmental
      assessments and congressional engagement; and record the reasons for the choice and the resources it requires. These
      are decision practices, not operational instructions.
    uncertainty: 'The conclusions are probabilistic: broader resourcing probably could have avoided disaster, and a diverse
      group likely would have devised a different approach. They do not establish that O1 would certainly have achieved the
      objective.'
    handoff: The President should involve professionals across executive departments and engage Congress, because an undertaking
      of this scale required national-level accountability and broader capabilities.
    tempting_wrong:
      option: O2
      pull: Covert action could appear attractive because public commitment and accountability carry political costs, and
        covert action was understandable in the historical context.
      why_wrong: Those constraints did not make deniability credible for an undertaking of this scale, and they left the mission
        with inadequate support and national-level accountability.
    rejected:
      O2: The President should not pursue the limited covert operation because its scale made deniability unlikely while the
        CIA alone lacked the capabilities judged necessary.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The undertaking were materially smaller and credible evidence showed that a limited covert approach could remain
        deniable.
      then: O2
      why: That would weaken the central scale-and-deniability objection to limited covert action; it would not by itself
        resolve whether the CIA had adequate capabilities.
    would_not_change:
    - id: noflip1
      if: The historical context made covert action understandable.
      why: That consideration alone would not overcome the judgment that the undertaking's scale made deniability unlikely
        and required broader resourcing.
    watch_for:
    - id: watch1
      what: Whether a cross-government group and broader resourcing are actually available to support a different approach.
      favors:
      - O1
      why: Those capabilities were important to a different approach and to the prospects of success.
  lesson: Do not use a limited covert commitment as a substitute for the authority, accountability, and capabilities a large
    undertaking requires. Match the level of commitment and resourcing to the scale of the objective, especially when deniability
    is unlikely.
  limits: This reasoning addresses a massive undertaking whose scale was assessed as unlikely to provide much deniability
    and for which the CIA alone was judged inadequate. It does not establish that public commitment or government-wide resourcing
    is preferable for every covert action or every national-security objective.
