case:
  id: DR-CORPUS-INC-BAY-OF-PIGS-OPERATION-NX-50b252eb-E4@v1
  title: Whether to Retain the D-Day Cancellation
  status: draft
  setting: Command Post and Department of State, night of 16 April 1961, United States executive decision-making
  decider: The President
  agent: The President
  agent_role: decide
  situation: At the Command Post on the night of 16 April 1961, a presidential order had canceled the planned D-Day air attacks
    following a recommendation from the Department of State. Higher authority had directed that D-Day air attacks be more
    limited. The Commander warned senior officials that the opposing air force retained dangerous fighter and bomber capability
    and that the landing force's supply ships could be sunk. An assessment after earlier strikes estimated that about half
    of the opposing tactical aircraft had been knocked out. The ships were close to the transport area, and the Commander
    reported that a withdrawal message would arrive after landing operations were underway. After conferring with senior intelligence
    officials, the Secretary of State recommended keeping the cancellation in place.
  question: What should the President do about the planned D-Day air attacks after receiving the cancellation and the warning
    about the remaining opposing air capability?
  options:
    O1:
      do: The President authorizes only a limited portion of the planned D-Day air attacks.
      move: partial
      irreversible: true
    O2:
      do: The President authorizes the planned D-Day air attacks under the existing limits.
      move: act
      irreversible: true
    O3:
      do: The President declines authorization for the planned D-Day air attacks under the current limits.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Higher authority directed that D-Day air attacks be more limited.
  - id: F2
    kind: situation
    status: confirmed
    fact: At about 2215 on 16 April, the Command Post was informed that the planned attacks had been canceled by presidential
      order on the Department of State's recommendation.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Commander warned that the opposing side still had dangerous fighter and bomber capability.
  - id: F4
    kind: intelligence
    status: assessed
    fact: An assessment after the earlier strike estimated that about half of the opposing side's original tactical air force
      had been knocked out.
  - id: F5
    kind: capability
    status: assessed
    fact: The Commander predicted that supply ships carrying essential supplies could be sunk the following day.
  - id: F6
    kind: situation
    status: assessed
    fact: The Commander reported that the ships were already close to the transport area and that landing operations would
      be underway before a withdrawal message could reach them.
  - id: F7
    kind: authority
    status: confirmed
    fact: After conferring with senior officials, the Secretary of State recommended that the cancellation remain unchanged.
  considerations:
  - id: C1
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O1
    - O3
    weight: strong
    why: Higher authority had directed that D-Day air attacks be more limited, making adherence to that policy constraint
      a central consideration.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O1
    - O2
    weight: strong
    why: The Commander warned that a dangerous opposing air capability remained and predicted that ships carrying essential
      supplies could be sunk; the earlier strike was assessed to have disabled only about half of the opposing tactical air
      force.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    - O2
    weight: strong
    why: Because the ships were already close and landing operations would begin before a withdrawal message arrived, the
      Commander argued that the force could not simply be withdrawn in time to avoid the exposure.
  - id: C4
    facts:
    - F2
    - F7
    equity: chain_of_command
    favors:
    - O3
    weight: strong
    why: The cancellation was a presidential order made on the Department of State's recommendation, and after conferring
      with senior officials the Secretary recommended that it remain unchanged.
  reasoning:
    read: The decision was whether to keep the cancellation or reverse it after a forceful warning about the danger to the
      landing force and its supplies. The trap is to treat that urgent operational warning as if it erased the higher-level
      limit or the Secretary of State's recommendation; the account records the warning and the contrary recommendation, but
      does not give a fuller explanation of the President's personal weighing.
    weighing: 'The case for authorizing attacks was serious: the Commander warned of a remaining dangerous air capability,
      possible loss of essential supplies, and the practical impossibility of withdrawing before the landing began {C2} {C3}.
      Against that, higher authority had limited D-Day attacks, and the Secretary recommended retaining the cancellation after
      consulting senior officials {C1} {C4}. The President accepted that recommendation, despite the Commander''s contrary
      warning. The balance therefore turned on the executive policy decision and the Secretary''s recommendation, not on a
      finding that the operational risk was absent.'
    tradecraft: Make the decision and its scope explicit, preserve the higher-authority constraint, and record both the Commander's
      risk warning and the Secretary's recommendation so the basis for retaining the cancellation is clear. Communicate the
      decision promptly to the affected command.
    uncertainty: The account gives the Commander's assessment and the Secretary's recommendation, but no independent reassessment
      of the opposing air capability at the decision point and no detailed account of the President's reasons beyond accepting
      the recommendation.
    handoff: The President was the decider. The Secretary of State had consulted senior intelligence officials and made a
      recommendation; the Commander supplied the operational warning. The President accepted the Secretary's recommendation.
    tempting_wrong:
      option: O2
      pull: Restoring the planned attacks could appear to answer the immediate warning about the remaining opposing air capability
        and the threatened supply ships.
      why_wrong: The source records that the Secretary recommended keeping the cancellation and that the President accepted
        that recommendation, against the background of higher authority's limit on D-Day attacks; the operational warning
        did not itself authorize overriding that decision.
    rejected:
      O1: A limited authorization might seem to reconcile the warning with the higher-level limit, but the President accepted
        the recommendation to leave the cancellation unchanged rather than authorize a portion of the attacks.
      O2: The President did not restore the planned attacks, accepting instead the Secretary of State's recommendation to
        keep the cancellation in place.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Secretary of State recommended authorizing a limited set of attacks and higher authority expressly permitted
        that scope.
      then: O1
      why: That would change the controlling recommendation while keeping the authorization within the stated policy limit.
    would_not_change:
    - id: noflip1
      if: The Commander's prediction of danger to the supply ships remained, while the Secretary's recommendation and the
        higher-authority limit were unchanged.
      why: The source records that the President retained the cancellation despite that warning; the warning alone would not
        change the recorded recommendation or policy constraint.
    watch_for:
    - id: watch1
      what: A material change in the Secretary of State's recommendation or in the applicable higher-authority limit.
      favors:
      - O1
      - O2
      why: Either change could alter the policy basis for retaining the cancellation.
  lesson: An urgent operational warning deserves serious weight, but it does not by itself displace an applicable higher-level
    policy limit or the recommendation of the responsible senior officials. Record the competing risks and authority basis,
    then make and communicate the decision through the proper chain.
  limits: This reasoning concerns the recorded executive decision and its policy context; it does not determine the legality
    or merits of any particular attack. It should not be applied where the governing authority, available options, or decision-maker's
    information materially differ.
