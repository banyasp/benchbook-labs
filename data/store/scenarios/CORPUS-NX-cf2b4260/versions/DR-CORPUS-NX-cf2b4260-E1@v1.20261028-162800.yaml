case:
  id: DR-CORPUS-NX-cf2b4260-E1@v1
  title: Regional Policy Choice on ISIS
  status: draft
  setting: Middle East; U.S. policy debate over ISIS; time not specified.
  decider: U.S. policymakers
  agent: U.S. policymakers
  agent_role: decide
  situation: The United States is considering its role in the regional response to ISIS. The neighboring states identified
    include Jordan, Iraq, Turkey, Lebanon, Israel, and Saudi Arabia. The policy argument assigns responsibility for addressing
    ISIS to the states living in the region and assesses that they have the means to do so. It describes regional alliances
    as waiting for others to act while seeking advantage. A narrower U.S. role is presented as allowing the United States
    to choose when to influence events rather than serve as a proxy for others.
  question: What should U.S. policymakers do about the scope of U.S. support for regional actors addressing ISIS?
  options:
    O1:
      do: The policymakers should reject that limit and continue broader support for regional partners addressing ISIS.
      move: act
      irreversible: false
    O2:
      do: The policymakers should ask neighboring states to outline their plans for addressing ISIS.
      move: ask
      irreversible: false
      to: neighboring states
    O3:
      do: The policymakers should approve limiting support to Turkey and the Kurds of Northern Iraq.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The neighboring states identified as directly affected by ISIS include Jordan, Iraq, Turkey, Lebanon, Israel, and
      Saudi Arabia.
  - id: F2
    kind: capability
    status: assessed
    fact: The neighboring states are assessed to have the means to address ISIS.
  - id: F3
    kind: situation
    status: assessed
    fact: The United States is described as neither intending nor undertaking to solve the ISIS problem for the neighboring
      states.
  - id: F4
    kind: situation
    status: assessed
    fact: Regional alliances are described as waiting for someone else to deal with ISIS while seeking advantage.
  - id: F5
    kind: situation
    status: assessed
    fact: The proposed U.S. policy is to offer regional support only to its Turkish NATO ally and the Kurds of Northern Iraq.
  - id: F6
    kind: situation
    status: assessed
    fact: A narrower U.S. role is presented as letting the United States choose when and where to influence events rather
      than be used as a proxy air force.
  - id: F7
    kind: capability
    status: assessed
    fact: The assessment is that no regional state actor will attack Turkey on a significant scale, given Turkey's military
      capacity and the prospect of a full NATO response.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The neighboring states directly affected by ISIS are assessed to have the means to address it, and the United States
      is not undertaking to solve the problem for them.
  - id: C2
    facts:
    - F4
    - F6
    equity: resource_stewardship
    favors:
    - O3
    weight: strong
    why: Regional actors are described as waiting for others to act while seeking advantage. A narrower U.S. role would preserve
      the choice of when to influence events instead of leaving the United States used as a proxy.
  - id: C3
    facts:
    - F5
    - F7
    equity: partner_relationship
    favors:
    - O3
    weight: weak
    why: The proposed limit retains support for Turkey as a NATO ally and the Kurds of Northern Iraq; Turkey's military capacity
      and the prospect of a NATO response are assessed to deter significant attacks on it.
  reasoning:
    read: ISIS is a regional problem for the states that live next to it, not one the United States should solve for them.
      The trap is allowing regional actors to defer action while the United States becomes their proxy, rather than choosing
      its own limited role.
    weighing: The recommendation rests chiefly on the assessment that neighboring states have the means to address ISIS and
      should bear responsibility {C1}. A narrower role is also said to preserve U.S. discretion amid regional actors' pursuit
      of advantage {C2}. Support would be retained for Turkey and the Kurds, with Turkey's NATO position and the deterrence
      assessment providing a reason for that exception {C3}. The balance depends on the assessments of regional capacity,
      alliance behavior, and deterrence.
    tradecraft: Record the policy choice, its limited scope, and the assumptions about regional capacity and alliance behavior
      on which it rests. Review those assumptions as circumstances change; do not expand the decision into operational instructions.
    uncertainty: 'The recommendation depends on assessments rather than established outcomes: that neighboring states have
      sufficient means, that the United States will not solve the problem for them, and that Turkey is deterred from significant
      attack. The available reasoning does not establish how those assessments may change.'
    handoff: U.S. policymakers make the policy decision. Diplomatic, defense, and legal advisers can help test the assumptions
      and implications of the proposed limit before the decision is finalized.
    tempting_wrong:
      option: O1
      pull: Broader support could appear to offer a more direct U.S. contribution to defeating ISIS.
      why_wrong: ISIS's destruction would be desirable, but the problem is for its neighbors to solve; broader support risks
        making the United States a proxy for regional actors.
    rejected:
      O1: Broader support is rejected because it would preserve the United States' role as a primary actor or proxy instead
        of making neighboring states bear responsibility.
      O2: Asking neighboring states for plans is not chosen; the proposed policy instead sets a defined limit on U.S. support,
        based on the assessment that those states have the means to act.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The neighboring states lacked the means to address ISIS.
      then: O1
      why: The central reason for assigning them responsibility would no longer hold, making broader U.S. support a plausible
        alternative.
    - id: flip2
      if: The assessment that Turkey is protected from significant attack by its military capacity and the prospect of a NATO
        response proved unreliable.
      then: O1
      why: A key reason for retaining the proposed limited support arrangement would be weakened, warranting reconsideration
        of the limit.
    would_not_change:
    - id: noflip1
      if: Defeating ISIS remained desirable, without a change in the neighboring states' assessed capacity or the U.S. role.
      why: Desirability alone would not displace the position that regional states should address the problem rather than
        have the United States solve it for them.
    watch_for:
    - id: watch1
      what: Changes in the neighboring states' capacity or willingness to take responsibility for addressing ISIS.
      favors:
      - O1
      why: A material change could undermine the premise that responsibility can rest with regional states.
  lesson: When responsibility is assigned to affected partners, test whether they have the means to act and whether the proposed
    role would instead make the United States a proxy. A limited commitment may preserve discretion, but its justification
    should be revisited if the underlying capacity or deterrence assessments change.
  limits: This reasoning concerns the proposed scope of U.S. policy, not a binding legal requirement or an adopted decision.
    It does not establish that regional states could in fact address ISIS, nor does it resolve other legal, humanitarian,
    or operational questions.
