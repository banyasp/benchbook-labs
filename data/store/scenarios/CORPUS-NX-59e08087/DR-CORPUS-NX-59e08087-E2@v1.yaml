case:
  id: DR-CORPUS-NX-59e08087-E2@v1
  title: Remedy for a Substantial Procedural Error
  status: draft
  setting: An Army investigation or board under AR 15–6, 22 June 2025.
  decider: The approval authority
  agent: The approval authority
  agent_role: decide
  situation: An investigation or board contains an error that materially adversely affects an individual’s substantial rights.
    The approval authority must determine whether the error can be corrected without substantial prejudice to the individual.
    Returning the case for correction entails notifying affected respondents of the error and proposed correction and giving
    them the right to comment. If the error cannot be corrected without substantial prejudice, the affected portion may not
    be used as the basis for adverse action. The available referral paths include referring the entire case to a new investigative
    officer or board, or referring only the affected portion while acting on unaffected findings and recommendations.
  question: What should the approval authority do about the substantial error while determining whether it can be corrected
    without substantial prejudice to the affected Individual?
  options:
    O1:
      do: The approval authority acts on unaffected findings and recommendations, sets aside affected findings, and refers
        the affected portion to a new investigative officer or board.
      move: act
      irreversible: false
    O2:
      do: The approval authority sets aside all findings and recommendations and refers the entire case to a new investigative
        officer or board with entirely new voting members.
      move: act
      irreversible: false
    O3:
      do: The approval authority returns the case to the same investigative officer or board for corrective action and notifies
        affected respondents of the error, proposed correction, and right to comment.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: A substantial error is one that materially adversely affects an individual’s substantial rights.
  - id: F2
    kind: authority
    status: confirmed
    fact: If a substantial error can be corrected without substantial prejudice, the approval authority may return the case
      to the same investigative officer or board for corrective action.
  - id: F3
    kind: authority
    status: confirmed
    fact: Respondents affected by a return for corrective action are to be notified of the error and proposed correction and
      of their right to comment on both.
  - id: F4
    kind: authority
    status: confirmed
    fact: If a substantial error cannot be corrected, or cannot be corrected without substantial prejudice, the approval authority
      may not use the affected part as the basis for adverse action against the individual.
  - id: F5
    kind: authority
    status: confirmed
    fact: For an error that cannot be corrected without substantial prejudice, the approval authority may set aside all findings
      and recommendations and refer the entire case to a new investigative officer or board composed of entirely new voting
      members.
  - id: F6
    kind: authority
    status: confirmed
    fact: Alternatively, the approval authority may act on findings and recommendations unaffected by the error, set aside
      affected findings and recommendations, and refer the affected portion to a new investigative officer or board.
  - id: F7
    kind: authority
    status: confirmed
    fact: A new investigative officer or board may be furnished evidence properly considered by the previous one and may also
      consider additional evidence.
  considerations:
  - id: C1
    facts:
    - F1
    equity: due_process
    favors:
    - O3
    - O1
    - O2
    weight: strong
    why: Because the error materially adversely affects substantial rights, the approval authority must address it rather
      than treat it as inconsequential.
  - id: C2
    facts:
    - F2
    equity: due_process
    favors:
    - O3
    weight: strong
    why: If correction can be made without substantial prejudice, the regulation permits returning the case to the same investigative
      officer or board for corrective action.
  - id: C3
    facts:
    - F3
    equity: due_process
    favors:
    - O3
    weight: strong
    why: A return for correction must include notice to affected respondents of the error and proposed correction, plus their
      right to comment on both.
  - id: C4
    facts:
    - F4
    - F5
    - F6
    equity: due_process
    favors:
    - O1
    - O2
    weight: strong
    why: If correction is impossible or would cause substantial prejudice, the affected portion cannot support adverse action;
      the authority may instead refer the affected portion or the entire case anew.
  reasoning:
    read: This is a substantial error, but that fact alone does not decide whether to return the case or refer it anew. The
      key question is whether the error can be corrected without substantial prejudice; the trap is treating the existence
      of a substantial error as automatically requiring a new investigative officer or board.
    weighing: The regulation permits return to the same investigative officer or board when correction can be made without
      substantial prejudice {C2}, with notice and an opportunity for affected respondents to comment {C3}. If that condition
      is not met, the affected portion may not support adverse action, and the authority may choose a partial or whole-case
      referral {C4}. Thus O3 is appropriate on the correctable-without-prejudice determination; the stated facts do not independently
      establish that determination.
    tradecraft: Before directing corrective action, identify the error, the proposed correction, and why the correction can
      be made without substantial prejudice. Notify affected respondents of the error and proposal and preserve their opportunity
      to comment; record the assessment and the disposition of their comments. These documentation steps are decision practice,
      not additional requirements stated in the excerpt.
    uncertainty: The material provided establishes that the error is substantial and describes the available paths, but does
      not specify the error or establish whether correcting it would cause substantial prejudice. O3 therefore depends on
      the approval authority making that assessment.
    handoff: The approval authority is the decision-maker under the framed situation. If it selects O3, the same investigative
      officer or board carries out the corrective action; no separate handoff is specified in the cited rule.
    tempting_wrong:
      option: O2
      pull: A whole-case referral to entirely new voting members may seem the safest response to an error affecting substantial
        rights.
      why_wrong: The regulation makes a new-board referral an option when the error cannot be corrected, or cannot be corrected
        without substantial prejudice; it also permits return for correction when that can be done without substantial prejudice.
    rejected:
      O1: O1 is a referral path for an error that cannot be corrected without substantial prejudice, while O3 is the appropriate
        path if correction can be made without that prejudice.
      O2: O2 is an available whole-case referral for an error that cannot be corrected without substantial prejudice, but
        the correctable-error path supports O3.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The error cannot be corrected, or cannot be corrected without substantial prejudice, and the authority proceeds
        by setting aside the affected findings and referring only the affected portion.
      then: O1
      why: The regulation then bars use of the affected portion as a basis for adverse action and permits referral of that
        portion while acting on unaffected findings and recommendations.
    - id: flip2
      if: The error cannot be corrected, or cannot be corrected without substantial prejudice, and the authority sets aside
        all findings and recommendations.
      then: O2
      why: The regulation permits referring the entire case to a new investigative officer or board composed of entirely new
        voting members.
    would_not_change:
    - id: noflip1
      if: A new investigative officer or board receives evidence properly considered by the previous one or considers additional
        evidence.
      why: Those evidence options apply after referral and do not alter the threshold question of whether correction can be
        made without substantial prejudice.
    watch_for:
    - id: watch1
      what: Whether the proposed correction can be completed without substantial prejudice to the affected individual.
      favors:
      - O3
      why: That is the stated condition for returning the case to the same investigative officer or board for corrective action.
  lesson: For a substantial procedural error, distinguish whether it can be corrected without substantial prejudice from whether
    it can be corrected at all. Use the same investigative officer or board for corrective action when the no-substantial-prejudice
    condition is met, with notice and an opportunity to comment; otherwise do not use the affected portion as a basis for
    adverse action and consider referral anew.
  limits: This reasoning addresses only the substantial-error correction and referral rules in the cited AR 15–6 excerpt.
    It does not resolve whether a particular proposed correction would cause substantial prejudice, or determine which referral
    path is preferable when correction is not possible.
