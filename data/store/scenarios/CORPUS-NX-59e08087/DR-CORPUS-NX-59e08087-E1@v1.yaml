case:
  id: DR-CORPUS-NX-59e08087-E1@v1
  title: Public Access to Investigation Proceedings
  status: draft
  setting: During proceedings of a military investigation; the date and location are unspecified.
  decider: The appointing authority, or, if it has not specified access, the investigating officer or board president.
  agent: The appointing authority, or, if it has not specified access, the investigating officer or board president.
  agent_role: decide
  situation: An investigation is being conducted, and there is no respondent. The subject matter is of substantial public
    interest. Investigation proceedings are not generally open to the public. Whether to open proceedings depends on the circumstances
    of the case. The appointing authority may specify whether proceedings will be open or closed; otherwise, the investigating
    officer or board president decides.
  question: What should the authorized decision-maker do about opening the investigation proceedings to the public?
  options:
    O1:
      do: The authorized decision-maker closes the investigation proceedings to the public.
      move: act
      irreversible: false
    O2:
      do: The authorized decision-maker opens the investigation proceedings to the public.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Investigation proceedings are not generally open to the public.
  - id: F2
    kind: situation
    status: confirmed
    fact: Whether proceedings should be open depends on the circumstances of the case.
  - id: F3
    kind: situation
    status: confirmed
    fact: There is no respondent.
  - id: F4
    kind: situation
    status: assessed
    fact: The subject matter is of substantial public interest.
  - id: F5
    kind: authority
    status: confirmed
    fact: The appointing authority may specify whether proceedings will be open or closed.
  - id: F6
    kind: authority
    status: confirmed
    fact: If the appointing authority does not specify access, the investigating officer or board president decides.
  - id: F7
    kind: situation
    status: confirmed
    fact: Proceedings that are open to the public are also open to representatives of the news media.
  considerations:
  - id: C1
    facts:
    - F1
    equity: public_transparency
    favors:
    - O1
    weight: weak
    why: Proceedings are not generally open to the public, so closure is the ordinary starting point; this is not an absolute
      bar.
  - id: C2
    facts:
    - F2
    - F4
    equity: public_transparency
    favors:
    - O2
    weight: strong
    why: The decision turns on the circumstances of the case, and substantial public interest is a circumstance the regulation
      identifies as making public access appropriate.
  - id: C3
    facts:
    - F3
    - F4
    equity: public_transparency
    favors:
    - O2
    weight: strong
    why: The absence of a respondent does not preclude opening proceedings; the regulation says opening may be appropriate
      even in that situation when the subject matter is of substantial public interest.
  reasoning:
    read: This is a discretionary public-access decision, not a categorical rule that all investigation proceedings must be
      closed. The trap is treating the usual closed status, or the absence of a respondent, as controlling despite the substantial-public-interest
      circumstance.
    weighing: The ordinary starting point favors closure {C1}, but the case-specific standard and substantial public interest
      favor opening {C2}. The regulation expressly allows opening even when there is no respondent {C3}; on these facts, that
      reason supports O2. The balance depends on the circumstances, rather than on the default alone.
    tradecraft: The authorized decision-maker should make the access decision within the stated allocation of authority and
      record the public-interest basis and any circumstances bearing on access. The source does not prescribe a particular
      recordkeeping method.
    uncertainty: 'The regulation uses permissive language: opening may be appropriate, not that it is invariably required.
      The assessment depends on the circumstances, and the supplied facts identify substantial public interest but do not
      describe any other case-specific concerns.'
    handoff: The appointing authority may specify whether proceedings are open or closed; if it has not, the investigating
      officer or board president decides. No additional referral is specified for this no-respondent situation.
    tempting_wrong:
      option: O1
      pull: Proceedings are not generally open to the public.
      why_wrong: That is only the general starting point; the regulation allows opening based on the circumstances, including
        substantial public interest even when there is no respondent.
    rejected:
      O1: Closure was not chosen because the stated substantial public interest supports using the regulation's case-specific
        discretion to open proceedings.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The subject matter were classified and that concern warranted excluding the public.
      then: O1
      why: The regulation identifies classified subject matter as a circumstance in which excluding the public may be appropriate.
    - id: flip2
      if: The substantial-public-interest assessment no longer held and the remaining circumstances favored closure.
      then: O1
      why: Without the stated reason supporting the exception to the usual closed status, the case-specific balance could
        favor closure.
    would_not_change:
    - id: noflip1
      if: There continued to be no respondent.
      why: The absence of a respondent does not itself rule out opening when the subject matter is of substantial public interest.
    - id: noflip2
      if: The appointing authority did not specify whether proceedings would be open or closed.
      why: That changes who decides—the investigating officer or board president—not the public-access balance itself.
    watch_for:
    - id: watch1
      what: Whether the subject matter is classified.
      favors:
      - O1
      why: The regulation identifies classification as a circumstance that may support excluding the public.
  lesson: A general presumption about access is a starting point, not an automatic outcome, when the governing rule calls
    for a case-specific decision. Substantial public interest can support opening proceedings even when there is no respondent,
    subject to other relevant circumstances.
  limits: This reasoning addresses only whether investigation proceedings should be open to the public under the stated circumstances.
    It does not determine access where other material circumstances, such as classified subject matter, alter the balance,
    or address rules about recording or broadcasting.
  library:
    domain: natsec-other
    family: CORPUS-NX-59e08087
    source: https://sharplearningportal.army.mil/portals/3/LinkedFiles/RegulatoryGuidance/AR%2015-6.pdf
    episode_focus: The regulation says opening the proceedings may be appropriate in this situation, identifying substantial
      public interest as the reason. Focus on the public-access decision; exclude rules about recording or broadcasting proceedings.
    cues:
      option_words:
        O2: 10
        O1: 10
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O1: false
    equities: pilot2
