case:
  id: DR-CORPUS-NX-8567d8c4-E1@v1
  title: Allocating Federal Investigative Responsibility
  status: draft
  setting: Federal executive branch, June 26, 1939
  decider: The President
  agent: The President
  agent_role: decide
  situation: An informal committee of representatives from several federal departments served as a clearing house for information
    concerning espionage, counterespionage, and sabotage. Information was transmitted from the committee to an investigative
    agency for further action. Most investigations in these areas were conducted by the FBI, the War Department's G-2 Section,
    and the Navy Department's Office of Naval Intelligence. The Attorney General assessed that the committee arrangement was
    neither effective nor desirable. The three investigative agencies had accumulated substantial information about foreign
    agencies operating in the United States and had developed efficient channels for exchanging information, with capacity
    for prompt expansion in an emergency.
  question: What should the President do about the allocation of responsibility for espionage, counterespionage, and sabotage
    investigations and the handling of related information?
  options:
    O1:
      do: The President decentralizes investigations of espionage, counterespionage, and sabotage, retains the interdepartmental
        clearing-house arrangement, and continues referrals of relevant information to the investigative agencies under their
        current responsibilities.
      move: act
      irreversible: false
    O2:
      do: The President centralizes investigations of espionage, counterespionage, and sabotage in the three named agencies,
        assigns coordination to their directors, bars other agencies from investigating those matters, and directs them to
        refer related information to the FBI.
      move: act
      irreversible: false
    O3:
      do: The President defers changing the allocation of investigations of espionage, counterespionage, and sabotage and
        leaves the clearing-house arrangement and the agencies' current responsibilities in place pending further consideration.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An informal committee composed of representatives from the Departments of State, the Treasury, War, Justice, the
      Post Office, and the Navy served as a clearing house for information about espionage, counterespionage, and sabotage.
  - id: F2
    kind: situation
    status: confirmed
    fact: Information handled by the committee was transmitted to one of the investigative agencies for further action.
  - id: F3
    kind: situation
    status: confirmed
    fact: The FBI, the War Department's G-2 Section, and the Navy Department's Office of Naval Intelligence conducted the
      great majority of investigations in these areas.
  - id: F4
    kind: situation
    status: assessed
    fact: The Attorney General assessed that handling these matters through the interdepartmental committee was neither effective
      nor desirable.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The three investigative agencies had gathered a substantial reservoir of information concerning foreign agencies
      operating in the United States.
  - id: F6
    kind: capability
    status: assessed
    fact: The three agencies had developed efficient channels for exchanging information, with flexibility to expand promptly
      in an emergency.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Attorney General proposed that, if the President approved, confidential instructions be issued to the heads
      of the departments concerned.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The committee passed information to investigative agencies, but the Attorney General assessed that handling these
      matters through the committee was neither effective nor desirable. That weighs against retaining it as the clearing-house
      arrangement.
  - id: C2
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The three named agencies already conducted most of the investigations and had accumulated substantial information
      about foreign agencies operating in the United States. The Attorney General regarded concentrating responsibility in
      those agencies as a more effective organization of investigative activity.
  - id: C3
    facts:
    - F6
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The three agencies had efficient information-exchange channels that could expand promptly in an emergency, supporting
      the proposed arrangement's capacity to respond quickly.
  reasoning:
    read: The committee was an information-clearing arrangement, while the three named agencies already conducted most investigations.
      The key issue is whether the committee adds effective coordination or instead interposes an ineffective step between
      information and investigation.
    weighing: The Attorney General's assessment that the committee arrangement was neither effective nor desirable weighs
      strongly against retaining it {C1}. The three agencies' existing investigative role and accumulated information favor
      placing responsibility with them {C2}; their flexible information-exchange channels add support, particularly for emergency
      expansion {C3}. On that balance, concentrate investigations in the three agencies, coordinate through their directors,
      and direct other agencies to refer relevant information.
    tradecraft: Carry out the decision through confidential instructions to the heads of the departments concerned. Specify
      that the three named agencies handle the investigations, that their directors coordinate their activities, and that
      other investigative agencies refer relevant information to the nearest FBI office. Record the allocation and the reasons
      for it so responsibilities are clear.
    uncertainty: The stated reasons establish the Attorney General's assessment of the committee and the three agencies' capabilities,
      but do not compare costs, identify dissent, or evaluate other possible coordination arrangements.
    handoff: The President makes the allocation decision. The three agency directors are assigned the coordination role, and
      the heads of the other concerned departments are to receive instructions on the referral requirement.
    tempting_wrong:
      option: O1
      pull: Keeping a multi-department clearing house may appear to preserve broad departmental participation in handling
        relevant information.
      why_wrong: The Attorney General's assessment was that the committee arrangement was neither effective nor desirable,
        while the three agencies already conducted most investigations and had developed information-sharing capacity.
    rejected:
      O1: The Attorney General recommended abandoning the clearing-house committee because its handling of these matters was
        assessed as neither effective nor desirable.
      O3: The stated assessment and the three agencies' existing information and coordination capacity supported changing
        the arrangement rather than leaving it in place pending further consideration.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The clearing-house arrangement were shown to be effective and desirable, contrary to the assessment supporting the
        recommendation.
      then: O1
      why: That would remove the central stated reason for abandoning the committee and could support retaining it.
    - id: flip2
      if: The three agencies lacked the accumulated information and effective exchange capacity that supported concentrating
        responsibility in them.
      then: O3
      why: Without those supporting capabilities, deferring the reallocation for further consideration could be preferable
        to immediate concentration.
    would_not_change:
    - id: noflip1
      if: Other departments continued to encounter information relevant to espionage, counterespionage, or sabotage.
      why: That alone would not require them to investigate; the President's direction provides for those agencies to refer
        relevant information to the FBI.
    watch_for:
    - id: watch1
      what: Whether the three agencies' information-exchange channels retain the flexibility to expand promptly in an emergency.
      favors:
      - O2
      why: That capacity was part of the Attorney General's stated support for concentrating responsibility in the three agencies.
  lesson: When a clearing-house arrangement is assessed as ineffective and specialist agencies already conduct most investigations
    and hold substantial relevant information, concentrating investigative responsibility in those agencies can improve effectiveness.
    Preserve coordination and give other agencies a clear route to refer relevant information.
  limits: This reasoning addresses the allocation of investigative responsibility and related information referrals in the
    stated circumstances. It does not establish a general rule for other investigative functions or resolve questions not
    addressed in the stated reasons.
