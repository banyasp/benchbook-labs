case:
  id: DR-OHA-26-0094@v1
  title: Guideline H Drug Involvement Security Concern – Clearance Restoration
  status: draft
  setting: DOE Office of Hearings and Appeals, October 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual holds a DOE security clearance that was granted on September 14, 2009. On January 8, 2026, a random
    employer drug test returned a positive result for the marijuana metabolite Delta9‑THC. The Individual later admitted that
    from November 7, 2025 to January 6, 2026 he used over‑the‑counter CBD products that may have contained THC to manage pain
    after shoulder surgery. He subsequently provided seven negative drug test results covering March through July 2026. The
    Local Security Office cited Guideline H of the Adjudicative Guidelines and the Bond Amendment as the basis for a security
    concern. A psychologist evaluated the Individual and concluded there was no substance‑use disorder or impairment.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge asks the Local Security Office for evidence.
      move: ask
      irreversible: false
      to: Local Security Office
    O2:
      do: The Administrative Judge holds the decision pending additional investigation.
      move: hold
      irreversible: false
    O3:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
    O4:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual holds a DOE security clearance that was granted on September 14, 2009.
  - id: F2
    kind: situation
    status: confirmed
    fact: On January 8, 2026, a random employer drug test returned a positive result for the marijuana metabolite Delta9‑THC.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual admitted using CBD products that may have contained THC from November 7, 2025 to January 6, 2026
      to manage pain after shoulder surgery.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Individual underwent shoulder surgery in November 2025, resulting in severe pain and sleep disruption.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Individual provided seven consecutive negative drug tests covering March through July 2026.
  - id: F6
    kind: authority
    status: confirmed
    fact: Guideline H of the Adjudicative Guidelines treats illegal drug use as a security concern.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Bond Amendment prohibits granting a security clearance to an unlawful user of a controlled substance.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A psychologist evaluated the Individual and concluded there was no substance‑use disorder, no cravings, and no functional
      impairment.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The Individual’s positive test and subsequent seven negative tests demonstrate a clear period of abstinence, satisfying
      Guideline H mitigation factor (¶26(a)).
  - id: C2
    facts:
    - F8
    - F5
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: A qualified psychologist found no substance‑use disorder, cravings, or functional impairment, supporting the finding
      that the Individual is not an “addict” under the Bond Amendment.
  - id: C3
    facts:
    - F4
    - F3
    equity: duty_to_individual
    favors:
    - O3
    weight: strong
    why: The use of CBD products was medically motivated to manage post‑surgical pain and avoid opioid addiction, making the
      conduct involuntary and unlikely to recur.
  - id: C4
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Bond Amendment bars only “unlawful users” or addicts; the Judge concluded the Individual’s THC ingestion was
      inadvertent and did not constitute unlawful use.
  - id: C5
    facts:
    - F1
    - F2
    - F3
    equity: public_transparency
    favors:
    - O3
    weight: weak
    why: The record shows the Individual was fully forthcoming about his prior marijuana use and the recent CBD incident,
      satisfying the requirement for candor.
  reasoning:
    read: The case hinges on whether the Individual’s brief, inadvertent THC exposure—stemming from over‑the‑counter CBD products
      used for post‑surgical pain—creates an unresolved Guideline H security concern or a Bond Amendment bar.
    weighing: The Judge applied the Adjudicative Guidelines’ mitigation factors (¶26(a)) and found the conduct was isolated,
      medically motivated, and unlikely to recur. The psychologist’s opinion that no disorder exists, combined with seven
      consecutive negative drug tests, satisfied the abstinence requirement. Because the Bond Amendment defines an unlawful
      user as someone who knowingly uses a controlled substance outside prescription, the Judge concluded the Individual’s
      use was unintentional and therefore does not trigger the statutory bar. These weighted considerations collectively support
      restoration.
    tradecraft: The decision is recorded in the Administrative Judge’s formal decision, citing the specific CFR provisions,
      the Bond Amendment, and the Adjudicative Guidelines, and is entered into the DOE personnel security database as a restoration
      order.
    uncertainty: The primary uncertainty lies in the potential for undisclosed THC in other over‑the‑counter products; however,
      the Individual’s subsequent abstinence and commitment statement mitigate that risk.
    handoff: The Judge acts alone under authority granted by 10 C.F.R. § 710.25(d‑g); no further agency involvement is required
      unless an appeal is filed.
    tempting_wrong:
      option: O4
      pull: A strict‑liability view of the Bond Amendment might suggest any positive THC test warrants denial.
      why_wrong: The source explicitly rejected that view, emphasizing intent, lack of addiction, and the inadvertent nature
        of the THC exposure.
    rejected:
      O1: The LSO already provided all relevant evidence; further requests would be redundant.
      O2: The record contains sufficient mitigating evidence; holding the decision would unnecessarily delay a justified restoration.
      O4: The Judge found no statutory or factual basis to deny the clearance.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were found to have continued using THC after January 6, 2026, or to exhibit a substance‑use disorder.
      then: O4
      why: Continued use or a diagnosed disorder would satisfy the Bond Amendment’s unlawful user definition and negate Guideline
        H mitigation.
    would_not_change:
    - id: noflip1
      if: The positive test had occurred earlier in the Individual’s career but remained a single, isolated incident.
      why: Guideline H permits mitigation when the behavior is isolated and unlikely to recur, so restoration would still
        be appropriate.
    watch_for:
    - id: watch1
      what: Any future positive test for THC or other controlled substances.
      favors:
      - O4
      why: A repeat violation would demonstrate a pattern of unlawful use, triggering the Bond Amendment and Guideline H concerns.
  lesson: In personnel security adjudications, inadvertent, medically motivated drug exposure that is isolated, fully disclosed,
    and followed by documented abstinence can be mitigated under Guideline H, and does not automatically invoke the Bond Amendment’s
    unlawful‑user bar.
  limits: This reasoning applies only when the individual’s drug use is demonstrably unintentional, limited in duration, and
    not accompanied by a diagnosed substance‑use disorder or evidence of habitual use. It does not extend to deliberate or
    repeated illegal drug use.
