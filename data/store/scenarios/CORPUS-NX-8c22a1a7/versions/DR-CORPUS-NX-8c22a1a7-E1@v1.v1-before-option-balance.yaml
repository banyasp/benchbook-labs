case:
  id: DR-CORPUS-NX-8c22a1a7-E1@v1
  title: Correcting Mistaken Congressional Testimony
  status: draft
  setting: Congress, during congressional testimony, before the program's exposure by unauthorized leaks.
  decider: The Director
  agent: The Director
  agent_role: decide
  situation: The Director is considering how to address a mistaken answer given during congressional testimony. The Director
    understood a question to concern Intelligence Community actions under FISA, although the question concerned the Patriot
    Act. The answer was mistaken, and the Director had been repeatedly chastised over it. The program at issue had not yet
    been exposed publicly. Correcting the public record must be weighed against the risk of compromising intelligence programs.
  question: What should the Director do about the mistaken congressional testimony while protecting intelligence programs?
  options:
    O1:
      do: The Director discloses a correction to the public record promptly after the congressional testimony.
      move: act
      irreversible: false
    O2:
      do: The Director withholds a correction to the public record until unauthorized leaks expose the program.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Director gave an answer during congressional testimony.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Director understood the question to concern Intelligence Community actions under FISA.
  - id: F3
    kind: situation
    status: confirmed
    fact: The question concerned the Patriot Act.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Director's answer was mistaken.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Director was repeatedly chastised over the answer.
  - id: F6
    kind: situation
    status: confirmed
    fact: Intelligence professionals should correct the public record when they can.
  - id: F7
    kind: situation
    status: confirmed
    fact: Correcting the public record should not come at the expense of compromising intelligence programs.
  considerations:
  - id: C1
    facts:
    - F6
    equity: public_transparency
    favors:
    - O1
    weight: strong
    why: The Director's lesson is that intelligence professionals should correct the public record when they can.
  - id: C2
    facts:
    - F7
    equity: source_protection
    favors:
    - O2
    weight: strong
    why: 'The correction duty has a limit: correcting the record should not come at the expense of compromising intelligence
      programs.'
  - id: C3
    facts:
    - F5
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Repeated chastisement underscores the accountability pressure to address the mistaken answer, though the Director
      still refrained while the program remained unexposed.
  reasoning:
    read: 'This is not simply a choice between correcting an error and leaving it uncorrected: the mistaken testimony creates
      a reason to correct the public record, while doing so before the program is exposed could compromise an intelligence
      program. The trap is treating accountability as an unconditional reason for immediate disclosure.'
    weighing: The Director's stated rule supports correction when it can be made without compromising intelligence programs
      {C1}, but makes protection of those programs a limit on that duty {C2}. In this situation the Director refrained until
      unauthorized leaks exposed the program; the balance therefore favors {O2} while the program remains unexposed, despite
      the pressure reflected in the repeated chastisement {C3}. The balance depends on whether correcting the record would
      compromise the program.
    tradecraft: Record the mistaken answer, the accountability interest in correcting it, and the program-protection concern
      that supports withholding a correction. Reassess whether a correction can be made without compromising the program as
      circumstances change.
    uncertainty: The source gives the governing tradeoff and the Director's choice, but does not explain precisely how a correction
      would compromise the program or whether a narrower correction was available.
    handoff: The Director is the decision-maker; the source identifies no required referral. As a decision-practice safeguard,
      the Director could consult authorized officials able to assess the disclosure risk, while retaining responsibility for
      the decision.
    tempting_wrong:
      option: O1
      pull: Prompt correction appears to be the straightforward response to mistaken congressional testimony and repeated
        chastisement.
      why_wrong: Immediate correction is not required when making it would come at the expense of compromising an intelligence
        program.
    rejected:
      O1: The Director did not correct the public record promptly because the stated lesson gives priority to avoiding compromise
        of intelligence programs when correction would carry that cost.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A correction could be made without compromising an intelligence program.
      then: O1
      why: The stated reason to withhold would no longer apply, and the Director's lesson favors correcting the record when
        that can be done.
    would_not_change:
    - id: noflip1
      if: The Director continued to face repeated chastisement over the mistaken answer.
      why: That pressure would not remove the stated limit against compromising an intelligence program to correct the record.
    watch_for:
    - id: watch1
      what: Whether the program has become publicly exposed, changing the program-protection concern that supported withholding.
      favors:
      - O1
      why: The Director refrained until the program was exposed by unauthorized leaks, marking exposure as a change in the
        circumstances relevant to correction.
  lesson: Correct a mistaken public record when correction is possible without compromising intelligence programs. Accountability
    matters, but it does not require a correction that would impose that compromise.
  limits: This reasoning applies to the stated conflict between correcting the record and protecting an intelligence program.
    It does not establish that every mistaken statement may be withheld from correction, or determine what other legal duties
    might apply in a different setting.
  library:
    domain: intel-oversight
    family: CORPUS-NX-8c22a1a7
    source: https://www.cia.gov/resources/csi/static/4b1dd1496611c5c64c7de9fb09451732/Facts-and-Fears-Manosevitz.pdf
