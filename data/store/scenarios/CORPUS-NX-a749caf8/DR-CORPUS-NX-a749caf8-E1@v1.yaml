case:
  id: DR-CORPUS-NX-a749caf8-E1@v1
  title: The Anzio Advance Decision
  status: draft
  setting: Anzio, Italy; January 22, 1944; Allied command.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: The Allies have achieved complete surprise at Anzio. By midmorning, they have established a beachhead and advanced
    three miles inland against light resistance. Most German forces are concentrated farther south around Cassino, and German
    reinforcement of the Anzio area is not expected until January 23 or 24. The road toward Rome appears virtually undefended,
    and capturing Rome could isolate the German defenders in the south and establish Allied control over Italy. The Commander
    is concerned about becoming overextended and wants to build logistics ashore.
  question: What should the Commander do on January 22, 1944?
  options:
    O1:
      do: The Commander delays the inland advance and builds logistics ashore on January 22.
      move: act
      irreversible: false
    O2:
      do: The Commander presses the inland advance toward Rome on January 22.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Allies achieved complete surprise by landing at Anzio on January 22, 1944.
  - id: F2
    kind: capability
    status: confirmed
    fact: By midmorning, Allied forces had established a beachhead and advanced three miles inland against light German resistance.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The majority of German forces were concentrated farther south around Cassino.
  - id: F4
    kind: intelligence
    status: assessed
    fact: German forces could not reinforce the Anzio beachhead until January 23 or 24.
  - id: F5
    kind: intelligence
    status: assessed
    fact: If the Allies pressed their advantage, the road to Rome lay virtually undefended.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Capturing Rome would isolate the German defenders in the south and firmly establish Allied control over Italy.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Commander was concerned about becoming overextended.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Commander wanted to build up logistics ashore.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    - F5
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The Allies had achieved surprise and made quick progress, while German reinforcement was not expected until January
      23 or 24 and the road toward Rome appeared virtually undefended. The opportunity to press the advantage was time-sensitive.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Advancing toward Rome offered the prospect of isolating the German defenders in the south and establishing Allied
      control over Italy.
  - id: C3
    facts:
    - F7
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The commander was concerned about becoming overextended and wanted to build logistics ashore, which supported delaying
      the advance to strengthen the beachhead.
  - id: C4
    facts:
    - F4
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The delay allowed German forces to arrive and seize the high ground; by the time the commander felt strong enough
      to attack, the opportunity had passed and the Allied offensive was stalled.
  reasoning:
    read: 'The situation offered a fleeting chance to exploit surprise: the Allies had advanced against light resistance,
      German forces were concentrated elsewhere, and the way toward Rome appeared nearly undefended. The trap was treating
      concern about overextension and the desire to build logistics ashore as reasons to wait without accounting for how quickly
      the enemy could reinforce.'
    weighing: The commander’s concerns about overextension and logistics favored {O1}, but the time-sensitive opportunity
      and its potential operational result favored {O2}. Delay gave the Germans time to reinforce and take the high ground;
      the commander thereby lost a tremendous opportunity to exploit the initial success. The balance depended on the assessed
      window before German reinforcement and on the prospect of advancing toward Rome.
    tradecraft: At the decision point, make the choice against the time-sensitive opportunity and the stated force-sustainment
      concern, and record the assumptions supporting each. Do not treat the desire for stronger logistics as automatically
      outweighing the cost of delay.
    uncertainty: The road toward Rome appeared virtually undefended and capturing Rome could have produced major operational
      effects, but those effects were potential outcomes, not certainties.
    handoff: The decision is presented as the commander’s judgment. No other approval authority or required handoff is identified.
    tempting_wrong:
      option: O1
      pull: Waiting appears prudent because the commander feared overextension and wanted to build logistics ashore.
      why_wrong: Waiting let German forces reinforce and seize the opportunity’s key advantage, so the eventual offensive
        came too late.
    rejected:
      O1: The commander’s concern about overextension and logistics did not outweigh the opportunity to exploit surprise and
        advance toward Rome.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: German forces could reinforce the beachhead immediately rather than only after the stated window.
      then: O1
      why: The time advantage supporting an immediate advance would be substantially reduced, making the concern about strengthening
        the beachhead more consequential.
    - id: flip2
      if: The commander had reliable evidence that advancing would leave the force unable to sustain itself ashore.
      then: O1
      why: A demonstrated inability to sustain the force could outweigh the opportunity to press toward Rome.
    would_not_change:
    - id: noflip1
      if: The commander remained concerned about overextension and wanted to build logistics ashore, but the stated surprise
        and reinforcement window remained unchanged.
      why: Those concerns were already present; delay still let the opportunity pass.
    watch_for:
    - id: watch1
      what: Any change in the expected timing of German reinforcement.
      favors:
      - O1
      why: Earlier reinforcement would weaken the time-sensitive case for pressing the advantage.
    - id: watch2
      what: Whether the force can sustain itself ashore without a delay to build logistics.
      favors:
      - O1
      why: A serious sustainment constraint would make the commander’s stated concern about overextension more weighty.
  lesson: When surprise creates a short-lived opportunity, weigh the cost of delay against the risks that waiting is meant
    to manage. A concern about readiness or overextension should be assessed against the likely consequences of allowing the
    adversary time to recover.
  limits: 'This judgment applies to the Anzio circumstances as framed: surprise, a temporary delay in German reinforcement,
    and an apparently open route toward Rome. It does not establish that advancing is always preferable to building logistics
    or managing overextension.'
