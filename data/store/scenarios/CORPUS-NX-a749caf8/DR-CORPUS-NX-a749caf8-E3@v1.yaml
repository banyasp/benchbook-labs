case:
  id: DR-CORPUS-NX-a749caf8-E3@v1
  title: Redesignating the Main Effort
  status: draft
  setting: A battle as events unfold, under battalion command.
  decider: The battalion commander
  agent: The battalion commander
  agent_role: decide
  situation: During a battle, the battalion commander has designated Company A as the main effort. Company A is encountering
    heavy resistance. Adjacent Company B is making a breakthrough that exploits a critical vulnerability. Events and enemy
    actions are unpredictable, and battles seldom unfold exactly as planned. The commander must decide whether to adjust the
    main-effort designation and the allocation of supporting combat power.
  question: What should the battalion commander do about the main-effort designation and supporting combat power?
  options:
    O1:
      do: The battalion commander holds the current main-effort designation and supporting combat-power arrangement as the
        battle develops.
      move: hold
      irreversible: false
    O2:
      do: The battalion commander redesignates Company B as the main effort and shifts supporting combat power to Company
        B.
      move: act
      irreversible: false
    O3:
      do: The battalion commander retains Company A as the main effort and keeps supporting combat power with Company A.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The battalion commander designates the main effort.
  - id: F2
    kind: authority
    status: confirmed
    fact: The main-effort designation may shift as events unfold.
  - id: F3
    kind: situation
    status: confirmed
    fact: Events and the enemy are unpredictable.
  - id: F4
    kind: situation
    status: confirmed
    fact: Few battles flow exactly as the commander planned.
  - id: F5
    kind: situation
    status: confirmed
    fact: The commander must make adjustments as events unfold.
  - id: F6
    kind: situation
    status: assessed
    fact: Company A is encountering heavy enemy resistance.
  - id: F7
    kind: situation
    status: assessed
    fact: Adjacent Company B is making a breakthrough that exploits a critical vulnerability.
  - id: F8
    kind: authority
    status: confirmed
    fact: The battalion commander may designate Company B as the main effort.
  - id: F9
    kind: situation
    status: confirmed
    fact: A new designation of Company B as the main effort must not be merely nominal.
  - id: F10
    kind: situation
    status: confirmed
    fact: Combat power supporting Company A shifts to support Company B when Company B becomes the main effort.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Because events and enemy actions are unpredictable and few battles unfold exactly as planned, the commander must
      adjust as the battle develops; shifting the main effort is one way to do so.
  - id: C2
    facts:
    - F6
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: 'The stated example matches these conditions: A meets heavy resistance while B exploits a critical vulnerability,
      so the commander may redesignate B as the main effort.'
  - id: C3
    facts:
    - F9
    - F10
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: 'Redesignating B must be substantive: combat power that supported A shifts to support B.'
  reasoning:
    read: 'The commander faces the very contrast in the doctrine''s example: A is meeting heavy resistance while adjacent
      B is exploiting a critical vulnerability. The trap is treating a change in designation as enough; the designation cannot
      be merely nominal.'
    weighing: The unpredictable course of battle and the need to adjust support shifting the main effort to B, and the stated
      example applies that response to these circumstances. The recommendation depends on the stated contrast between A's
      resistance and B's breakthrough; the designation must be accompanied by a real shift of supporting combat power.
    tradecraft: Make the redesignation explicit and align supporting combat power with it. Record the decision's stated basis—the
      resistance facing A and B's breakthrough exploiting a critical vulnerability—and whether the support shift was made.
    uncertainty: The situation describes the conditions in the doctrine's example. It gives no further information about how
      long those conditions will persist or how the battle may develop afterward.
    handoff: 'The battalion commander makes the decision: the source assigns the designation to that role and identifies no
      required referral or additional decision-maker.'
    tempting_wrong:
      option: O1
      pull: Keeping the existing arrangement may seem prudent while the battle is unfolding unpredictably.
      why_wrong: The source says the commander must adjust as events unfold and gives this A-resistance/B-breakthrough contrast
        as a reason to redesignate B.
    rejected:
      O1: Holding the existing designation and support arrangement would not make the adjustment called for by the stated
        contrast between A's resistance and B's breakthrough.
      O3: Retaining A as the main effort and keeping support with A would disregard the doctrine's example of redesignating
        B and shifting support to it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Company B is no longer making a breakthrough that exploits a critical vulnerability.
      then: O1
      why: The stated reason for switching the main effort to B would no longer be present; the source does not prescribe
        a different designation for that changed situation.
    would_not_change:
    - id: noflip1
      if: The commander remains aware that events and enemy actions are unpredictable, while A still faces heavy resistance
        and B still exploits a critical vulnerability.
      why: Unpredictability is a reason to adjust as events unfold, not a reason to ignore the specific A/B circumstances
        addressed by the example.
    watch_for:
    - id: watch1
      what: Whether supporting combat power has actually shifted from support of A to support of B after the redesignation.
      favors:
      - O2
      why: The new designation must not be merely nominal; supporting combat power that had supported A shifts to B.
  lesson: A main-effort designation may change as events unfold; it need not remain fixed to the original plan. When the commander
    redesignates the main effort, the supporting combat power must shift with it, or the change is merely nominal.
  limits: This recommendation applies to the stated contrast of A meeting heavy resistance and B exploiting a critical vulnerability.
    The source does not set out a general rule for other battlefield conditions or specify how to conduct either company's
    operations.
