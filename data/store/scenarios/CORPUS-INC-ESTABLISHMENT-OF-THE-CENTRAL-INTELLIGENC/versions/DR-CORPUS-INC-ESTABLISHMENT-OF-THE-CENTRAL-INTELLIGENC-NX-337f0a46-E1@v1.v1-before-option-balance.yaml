case:
  id: DR-CORPUS-INC-ESTABLISHMENT-OF-THE-CENTRAL-INTELLIGENC-NX-337f0a46-E1@v1
  title: Allocating Authority in the Postwar Intelligence System
  status: draft
  setting: Washington, January 22, 1946, in the President’s consideration of a directive for postwar intelligence organization.
  decider: The President
  agent: The President
  agent_role: decide
  situation: Participants in the postwar discussions agreed that the country needed an intelligence capability, but disagreed
    about how centralized it should be. Proposals ranged from a powerful central agency that would dominate departmental intelligence
    services to arrangements preserving substantial departmental responsibility. The Navy argued that operating departments
    needed intelligence tailored to their own functions. The Joint Chiefs favored coordination but opposed tight centralization.
    The Bureau of the Budget developed a compromise directive for the President’s consideration.
  question: What should the President do about allocating authority between a central intelligence group and departmental
    intelligence services?
  options:
    O1:
      do: The President authorizes a centralized agency to direct the intelligence services of several departments.
      move: act
      irreversible: false
    O2:
      do: The President authorizes a Central Intelligence Group to coordinate departmental intelligence and perform functions
        assigned centrally.
      move: act
      irreversible: false
    O3:
      do: The President declines to establish a Central Intelligence Group and leaves intelligence functions with the departments.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: Participants in the early discussions strongly believed that a postwar intelligence capability was necessary.
  - id: F2
    kind: situation
    status: confirmed
    fact: The original proposal called for a centralized agency that would dominate the intelligence services of several departments.
  - id: F3
    kind: authority
    status: confirmed
    fact: The original proposal recommended direct Presidential supervision of the proposed agency.
  - id: F4
    kind: situation
    status: assessed
    fact: The Navy maintained that a complete merger was not feasible because each operating department needed intelligence
      peculiar to its own work.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Joint Chiefs favored coordination but opposed tight centralization.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Joint Chiefs favored leaving intelligence responsibilities with existing departments rather than assigning them
      generally to a central agency.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Bureau of the Budget developed the final directive as a compromise in response to the competing proposals.
  - id: F8
    kind: authority
    status: confirmed
    fact: The contemplated arrangement assigned the National Intelligence Authority a role in determining which intelligence
      functions should be performed centrally.
  considerations:
  - id: C1
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: strong
    why: The Navy argued that a complete merger was not feasible because each operating department needed intelligence peculiar
      to its own work. That weighs against a central agency dominating departmental services.
  - id: C2
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The Joint Chiefs favored coordination while opposing tight centralization, and preferred leaving intelligence responsibilities
      with existing departments. A coordinating central group preserves that departmental role without abandoning coordination.
  - id: C3
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The compromise assigned the central group responsibility to coordinate departmental intelligence and perform functions
      judged appropriate for central performance, with the National Intelligence Authority determining which functions those
      were.
  - id: C4
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O1
    - O2
    weight: weak
    why: The participants agreed a postwar intelligence capability was necessary, but that shared need did not by itself establish
      that a centralized agency should dominate departmental services.
  reasoning:
    read: The question is how to organize an intelligence capability that participants considered necessary, not whether to
      have one. The trap is treating agreement on the need for intelligence, or the value of coordination, as proof that all
      departmental authority should be centralized.
    weighing: The Navy's concern about intelligence tailored to operating departments and the Joint Chiefs' preference for
      coordination without tight centralization weigh against {O1}. The compromise addresses the shared need for coordination
      while retaining departmental services and assigning only selected functions centrally. On the stated reasons, {O2} best
      balances those considerations; the balance depends on preserving both meaningful coordination and departmental responsibility.
    tradecraft: State the central group's coordinating role and the process for assigning functions centrally, while making
      clear which responsibilities remain with departments. Record the rationale for each central assignment so the boundary
      between central and departmental responsibility is understandable.
    uncertainty: The stated reasons establish the compromise's general allocation of authority, but do not specify which individual
      intelligence functions the National Intelligence Authority should assign centrally. Do not infer a detailed allocation
      from this decision alone.
    handoff: The President should decide the directive and use the National Intelligence Authority's designated role to determine
      which functions belong centrally. Consulting the departments is appropriate to account for their distinct intelligence
      needs; this is an implementation recommendation, not a stated additional condition of the decision.
    tempting_wrong:
      option: O1
      pull: A powerful central agency could appear to offer the clearest route to coordination and a unified intelligence
        capability.
      why_wrong: That approach goes beyond coordination and conflicts with the stated concern that operating departments need
        intelligence peculiar to their work, as well as the Joint Chiefs' opposition to tight centralization.
    rejected:
      O1: The President did not adopt a dominating central agency because the compromise preserved departmental services and
        limited central performance to functions assigned for central handling.
      O3: The President did not leave all functions with departments because the compromise established a central group to
        coordinate departmental intelligence and perform centrally assigned functions.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The President had a sound basis to conclude that departmental intelligence needs could be met through a single agency
        without preserving substantial departmental responsibility.
      then: O1
      why: That would weaken the central concern that operating departments need intelligence peculiar to their own work and
        could make tighter centralization a reasonable allocation.
    - id: flip2
      if: The President had a sound basis to conclude that central coordination and centrally performed functions were unnecessary
        or could not add value.
      then: O3
      why: That would remove the stated rationale for establishing a central group alongside departmental services.
    would_not_change:
    - id: noflip1
      if: The proposals continued to disagree about how centralized the system should be while participants continued to agree
        that a postwar intelligence capability was necessary.
      why: Disagreement over degree of centralization, on its own, would not defeat the compromise that combines coordination
        with continued departmental responsibility.
    watch_for:
    - id: watch1
      what: Whether proposed central assignments preserve the departments' ability to obtain intelligence tailored to their
        functions.
      favors:
      - O2
      - O3
      why: The Navy's stated objection to a complete merger rests on departments' distinct intelligence needs.
  lesson: When participants agree that a capability is necessary but disagree about centralization, do not assume that coordination
    requires central control of every function. A bounded central role can coordinate shared work while preserving departmental
    responsibility for distinct needs.
  limits: This reasoning addresses the allocation of authority in the January 22, 1946 directive, not the merits of particular
    intelligence functions or later organizational arrangements. It does not decide the separate question of covert operations.
