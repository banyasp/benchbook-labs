case:
  id: DR-CORPUS-NX-0d5250ab-E2@v1
  title: Deterrence and Options for Lesser Aggression
  status: draft
  setting: United States, Kennedy era, national military policy in the U.S.-Soviet strategic context.
  decider: The President of the United States
  agent: The President of the United States
  agent_role: decide
  situation: U.S. national policy relied on nuclear weapons as a singular military instrument and strategic deterrent against
    Soviet aggression. Soviet intercontinental delivery systems made massive retaliation impractical as a response to aggression
    short of a nuclear attack on the homeland. Nuclear weapons remained an essential deterrent to a nuclear attack. The President
    faced a policy choice about retaining that deterrent while addressing lesser aggression without necessarily escalating
    to all-out war or nuclear destruction.
  question: What should the President do about retaining the nuclear deterrent and developing options for lesser aggression?
  options:
    O1:
      do: The President retains the nuclear deterrent while developing conventional and unconventional options for lesser
        aggression.
      move: act
      irreversible: false
    O2:
      do: The President relinquishes the nuclear deterrent while developing conventional and unconventional options for lesser
        aggression.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: U.S. policy relied on nuclear weapons as a singular military policy instrument and strategic deterrent against Soviet
      aggression.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Soviets developed intercontinental delivery systems.
  - id: F3
    kind: situation
    status: assessed
    fact: Massive retaliation became impractical after the Soviets developed intercontinental delivery systems.
  - id: F4
    kind: situation
    status: assessed
    fact: The consequences of massive retaliation made it an illogical policy option or deterrent for anything but a nuclear
      attack on the homeland.
  - id: F5
    kind: capability
    status: assessed
    fact: Nuclear weapons remained an essential deterrent to a nuclear attack.
  - id: F6
    kind: situation
    status: assessed
    fact: Lesser aggression required other viable military policy options.
  - id: F7
    kind: capability
    status: confirmed
    fact: Flexible response tailored the strategic nuclear response for flexibility while assuring a nuclear response.
  - id: F8
    kind: capability
    status: confirmed
    fact: Flexible response created conventional and unconventional capabilities usable across a range of circumstances without
      necessarily escalating to all-out war or nuclear destruction.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Once Soviet intercontinental delivery systems made massive retaliation impractical, its consequences made it an illogical
      response to aggression short of a nuclear attack on the homeland. Reliance on nuclear weapons as the singular policy
      instrument therefore needed to give way to a broader set of options.
  - id: C2
    facts:
    - F5
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Nuclear weapons remained an essential deterrent to a nuclear attack, supporting retention of that deterrent rather
      than relinquishment.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Lesser aggression required viable military policy options beyond massive retaliation; developing additional options
      addresses that need while preserving the nuclear deterrent.
  - id: C4
    facts:
    - F7
    - F8
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Flexible response preserved an assured nuclear response while creating conventional and unconventional capabilities
      usable across a range of circumstances without necessarily escalating to all-out war or nuclear destruction.
  reasoning:
    read: 'The problem is not whether nuclear weapons still have a deterrent role: they remain essential against a nuclear
      attack. The trap is treating massive retaliation as a suitable answer to every form of Soviet aggression even after
      intercontinental delivery systems made that policy impractical and its consequences made it illogical for lesser aggression.'
    weighing: 'The source favors retaining the nuclear deterrent while adding conventional and unconventional options. The
      need for those options follows from the impracticality and consequences of massive retaliation against lesser aggression;
      retaining the deterrent follows from its continuing role against nuclear attack. The balance depends on both judgments
      holding: nuclear deterrence remains essential, while lesser aggression calls for responses that need not escalate to
      all-out war or nuclear destruction.'
    tradecraft: 'Keep the decision at the policy level: record the distinct purposes of the nuclear deterrent and the additional
      options, the assessed limits of massive retaliation, and the reasons for choosing a range of responses. Revisit the
      rationale if the underlying threat assessments change.'
    uncertainty: The source gives the strategic rationale but does not specify how the President should assess particular
      future threats, what criteria should govern individual responses, or what evidence would show that the deterrent had
      ceased to be essential.
    handoff: The President makes the policy choice. Consultation with relevant military and policy advisers would help assess
      whether the stated strategic premises remain valid; this consultation is a decision-practice recommendation, not a procedure
      specified by the source.
    tempting_wrong:
      option: O2
      pull: Because massive retaliation became impractical and its consequences made it illogical for lesser aggression, abandoning
        the nuclear deterrent might seem to follow.
      why_wrong: That conclusion confuses the limits of massive retaliation as a response to lesser aggression with the separate
        continuing role of nuclear weapons as a deterrent to nuclear attack.
    rejected:
      O2: The source does not endorse relinquishing the nuclear deterrent, which remained essential against nuclear attack;
        it instead endorses adding options for lesser aggression.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The President assessed that the nuclear deterrent was no longer essential to deterring nuclear attack and that relinquishing
        it would not leave that threat inadequately deterred.
      then: O2
      why: The stated reason for retaining the deterrent is its continuing essential role against nuclear attack; removing
        that premise could change the balance.
    would_not_change:
    - id: noflip1
      if: Soviet intercontinental delivery systems make massive retaliation impractical for lesser aggression, while nuclear
        weapons remain essential against nuclear attack.
      why: Those conditions support adding options for lesser aggression but do not, by themselves, negate the reason for
        retaining the nuclear deterrent.
    watch_for:
    - id: watch1
      what: Changes in whether nuclear weapons remain an essential deterrent and whether lesser aggression requires additional
        viable policy options.
      favors:
      - O1
      - O2
      why: Those are the strategic premises on which the distinction between retaining the deterrent and developing additional
        options rests.
  lesson: When a policy instrument remains essential for one grave threat but becomes impractical or disproportionate as a
    response to lesser threats, do not assume that its limits require abandoning it altogether. Retain its distinct deterrent
    role while developing options suited to the wider range of circumstances.
  limits: This rationale applies to the stated Kennedy-era U.S.-Soviet strategic context and the assessment of nuclear deterrence
    and massive retaliation. It does not determine which response is appropriate in any particular later crisis or establish
    operational rules for employing capabilities.
