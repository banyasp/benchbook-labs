case:
  id: DR-CORPUS-NX-4b443526-E4@v1
  title: Decision on Attacking the Fort
  status: draft
  setting: A fort facing British forces; colonial militia.
  decider: The colonial militia major
  agent: The colonial militia major
  agent_role: decide
  situation: A colonial militia major had intelligence indicating that British forces intended to seize a fort. The intelligence
    was available to the major before the decision. A force of four hundred men was associated with the major’s command. The
    decision was whether to permit an attack on the fort or prohibit one.
  question: What should the colonial militia major do about an attack on the fort?
  options:
    O1:
      do: The colonial militia major prohibits an attack on the fort.
      move: act
      irreversible: false
    O2:
      do: The colonial militia major permits an attack on the fort.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: British forces intended to seize the fort.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: The colonial militia major had intelligence concerning the British forces’ intention to seize the fort.
  - id: F3
    kind: situation
    status: confirmed
    fact: The decision concerned an attack on a fort.
  - id: F4
    kind: situation
    status: confirmed
    fact: The decider was a major in the colonial militia.
  - id: F5
    kind: capability
    status: confirmed
    fact: The force associated with the decision numbered four hundred men.
  - id: F6
    kind: authority
    status: confirmed
    fact: The colonial militia major led the force.
  considerations:
  - id: C1
    facts:
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The major had intelligence before deciding, and that intelligence is directly linked to the attack. It is the stated
      informational basis for acting.
  - id: C2
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The intelligence concerned British forces intending to seize the fort. The attack is presented as a response to that
      stated threat.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: A force of four hundred men was led by the major, establishing that an attack was the course he led. Force size itself
      is not offered as a justification.
  reasoning:
    read: This is a decision about whether to attack a fort in response to intelligence of an intended British seizure. The
      central trap is treating the stated threat as if it also established that an attack was lawful, necessary, or free of
      other risks; those questions are not addressed.
    weighing: The stated reason for attacking is the intelligence about British intentions {C1} {C2}; the major's leadership
      of the force supplies context for the decision, not an independent justification {C3}. On this account, that balance
      supports permitting the attack rather than leaving the stated seizure threat unanswered. The balance depends on the
      intelligence being sufficiently credible and relevant, matters not discussed here.
    tradecraft: At the decision level, assess the intelligence and the authority for action, consider whether less harmful
      alternatives address the threat, and record the rationale and material uncertainties. This is decision practice, not
      a claim that the source prescribed those steps.
    uncertainty: The intelligence's reliability, the timing of the intended seizure, civilian or own-force risks, available
      alternatives, and any applicable legal standard are not described. No conclusion on those matters can be drawn from
      the available account.
    handoff: The major is identified as leading the force, but no approval process or other authority is identified. If the
      decision framework required additional authorization or review, that authority should be involved; whether it did is
      unknown.
    tempting_wrong:
      option: O1
      pull: Prohibiting the attack avoids initiating an engagement.
      why_wrong: That concern is not the reason given for the outcome; on the stated account, prohibiting the attack would
        leave the intelligence about the intended seizure unanswered.
    rejected:
      O1: The stated rationale links the attack to intelligence that British forces intended to seize the fort, so prohibition
        was not chosen.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The intelligence were found not to support the assessment that British forces intended to seize the fort.
      then: O1
      why: The stated reason for the attack would no longer be established.
    would_not_change:
    - id: noflip1
      if: The force were larger or smaller, with the intelligence and other decision-relevant circumstances unchanged.
      why: The force's size is given as context, not as the reason for attacking.
    watch_for:
    - id: watch1
      what: Further evidence about the credibility and relevance of the intelligence concerning the intended seizure.
      favors:
      - O2
      - O1
      why: The intelligence is the stated basis for the attack, but its reliability is not assessed.
  lesson: When a decision is expressly tied to intelligence about an intended hostile action, that intelligence can be the
    decisive reason for acting. Do not infer from that reason alone that the action was lawful, necessary, or risk-free; those
    questions require facts and standards that may not be available.
  limits: This conclusion is limited to the stated rationale for the decision. It does not establish the intelligence's reliability,
    the applicable legal authority or standards, the risks of the attack, or whether another course was available.
