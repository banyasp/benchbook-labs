case:
  id: DR-CORPUS-NX-4b443526-E2@v1
  title: Limits on a Capture Authorization
  status: draft
  setting: American command, September 1780
  decider: The Commander in chief
  agent: The Commander in chief
  agent_role: decide
  situation: In September 1780, a major presented a secret plan to the Commander in chief. The plan sought to return a defector
    to American control and bring him to public punishment. The decision concerned whether to authorize the plan and what
    limits should govern permissible harm. Avoiding injury could mean allowing the defector to escape.
  question: What should the Commander in chief do about authorizing the plan and setting limits on harm?
  options:
    O1:
      do: The Commander in chief approves the plan with a ban on killing or injuring the defector, even if escape follows.
      move: act
      irreversible: true
    O2:
      do: The Commander in chief rejects the plan and withholds authorization for the defector's return for public punishment.
      move: act
      irreversible: true
    O3:
      do: The Commander in chief asks the presenting major to revise the plan with explicit limits on harm.
      move: ask
      irreversible: false
      to: the presenting major
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In September 1780, a major presented a secret plan to the Commander in chief.
  - id: F2
    kind: situation
    status: confirmed
    fact: The plan sought to return the defector to American control.
  - id: F3
    kind: situation
    status: confirmed
    fact: The plan contemplated bringing the defector to the gallows.
  - id: F4
    kind: situation
    status: confirmed
    fact: The defector had turned traitor and gone over to the British.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Commander in chief identified public punishment as the sole object of the plan.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Commander in chief set a limit against killing or injuring the defector, even at the risk of allowing him to
      escape.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The stated object was to return the defector for public punishment; the Commander in chief approved the plan for
      that purpose.
  - id: C2
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The Commander in chief made the prohibition on killing or injuring the defector an express limit on authorization.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The limit was to hold even if it frustrated the mission by allowing the defector to escape; the public-punishment
      objective did not override it.
  reasoning:
    read: This is a decision to authorize a return for public punishment, not permission to kill or injure the defector. The
      trap is treating the contemplated punishment or the defector's treason as permission to inflict harm during the plan;
      the Commander in chief expressly separated the objective from that limit.
    weighing: The Commander in chief approved the plan because its sole object was public punishment, while making non-injury
      a strict condition even at the risk of escape. The balance therefore favors conditional approval, not pursuit of the
      objective at any cost.
    tradecraft: State the harm limit as a clear condition of authorization and ensure the decision record distinguishes the
      public-punishment objective from any permission to harm the defector. This is decision-level guidance, not operational
      direction.
    uncertainty: The source gives the Commander in chief's objective and limit, but does not establish the legal process or
      merits of the contemplated punishment; no broader legal conclusion follows.
    handoff: The Commander in chief made the authorization decision after the major presented the plan. The source identifies
      no required referral to another authority.
    tempting_wrong:
      option: O2
      pull: Rejecting the plan avoids any risk that the defector will be harmed.
      why_wrong: It abandons the stated public-punishment objective even though the Commander in chief approved pursuing that
        objective under an express no-harm limit.
    rejected:
      O2: The Commander in chief approved the plan for public punishment rather than withholding authorization.
      O3: The Commander in chief set the harm limit while approving the plan rather than deferring approval for a revision.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The plan could proceed only by killing or injuring the defector, with no revision capable of avoiding that harm.
      then: O3
      why: The source's absolute harm limit would preclude approving that plan as presented; seeking revision would preserve
        the objective without authorizing the prohibited harm.
    would_not_change:
    - id: noflip1
      if: Avoiding injury could allow the defector to escape.
      why: The Commander in chief expressly maintained the no-harm limit even at that risk.
    watch_for: []
  lesson: A public objective does not itself authorize harm beyond the limits the decision-maker sets. If the source makes
    a protection condition controlling even at the cost of mission failure, authorization must preserve that condition rather
    than silently trade it away.
  limits: This reasoning concerns the stated authorization and harm limit only. It does not determine the legality or fairness
    of the contemplated punishment, or address the plan's execution.
  library:
    domain: operational-command
    family: CORPUS-NX-4b443526
    source: https://www.cia.gov/static/a2a09a5a716a38527d06b79539605e03/Intelligence-in-the-War-of-Independence.pdf
    episode_focus: The commander in chief approved a specific capture plan but set a strict limit on harm, explaining that
      public punishment—not killing or injuring the defector—was the objective. Treat this as a command and ethical decision
      about the permissible outcome; exclude the plan’s execution, methods, and capture tactics.
    cues:
      option_words:
        O2: 17
        O3: 17
        O1: 20
      real_option: O1
      real_to_mean_other_length: 1.18
      real_is_longest: true
      moves:
        O2: act
        O3: ask
        O1: act
      real_move: act
      irreversible_flags:
        O2: true
        O3: false
        O1: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The Commander in chief approved the plan, insisting that the defector not be killed or injured even at the risk of
  escape, because public punishment was the sole object in view.
