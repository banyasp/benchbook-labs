case:
  id: DR-CORPUS-NS-70f74a71-E1@v1
  title: Litigation After FOIA Delays
  status: draft
  setting: Federal FOIA dispute involving the Defense Department and a federal military command, June 2018.
  decider: The attorneys representing the journalist
  agent: The attorneys representing the journalist
  agent_role: decide
  situation: A journalist has submitted FOIA requests for federal records. Federal officials have refused to expedite processing.
    The attorneys have pursued administrative appeals seeking faster processing. By June 2018, the agencies have continued
    to delay. The attorneys must decide whether to bring the dispute before a judge or keep waiting for agency processing.
  question: What should the attorneys do after administrative appeals and continued agency delays?
  options:
    O1:
      do: The attorneys proceed with a lawsuit against the agencies on the journalist's behalf.
      move: act
      irreversible: false
    O2:
      do: The attorneys decline to proceed with a lawsuit against the agencies on the journalist's behalf.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A journalist submitted FOIA requests to the federal government for records.
  - id: F2
    kind: situation
    status: confirmed
    fact: Federal officials refused to expedite processing of the journalist's requests.
  - id: F3
    kind: situation
    status: confirmed
    fact: The attorneys filed administrative appeals seeking expedited processing.
  - id: F4
    kind: situation
    status: confirmed
    fact: By June 2018, the agencies had continued delaying the requests.
  - id: F5
    kind: authority
    status: assessed
    fact: The attorneys' potential FOIA claim included that the agencies had failed to grant expedited processing.
  - id: F6
    kind: authority
    status: assessed
    fact: The attorneys' potential FOIA claim included that the agencies had failed to comply with statutory deadlines.
  - id: F7
    kind: situation
    status: assessed
    fact: The attorneys' potential FOIA claim included that the agencies had improperly withheld agency records.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The potential FOIA claims concerned failure to grant expedited processing, missed statutory deadlines, and improper
      withholding. Those were allegations supporting judicial review, not findings that the agencies had violated FOIA.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The agencies refused expedited processing and continued delaying despite administrative appeals. The requests concerned
      timely, newsworthy matters, so continued waiting risked defeating their practical value.
  - id: C3
    facts:
    - F3
    - F4
    equity: public_transparency
    favors:
    - O1
    weight: strong
    why: Filing suit brought the case before a judge and prompted the agencies to begin processing and releasing records;
      without suit, the journalist might have remained in the queue without receiving records.
  - id: C4
    facts:
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O2
    - O1
    weight: weak
    why: Lawsuits should be a last resort, and the system should not require litigation to make an agency take its FOIA obligations
      seriously. That weighs against routine resort to court, but appeals had been pursued and delays continued, making suit
      the remaining means identified to prompt action.
  reasoning:
    read: This is a dispute over delayed access to records after the ordinary administrative route failed to produce expedited
      processing. The trap in continuing to wait is treating agency processing as a sufficient answer even though the delays
      may leave the journalist without useful records.
    weighing: The potential claims gave the attorneys a basis to ask a judge to address the agencies' handling of the requests,
      while the refusal to expedite and continued delay after appeals made further waiting costly. Although litigation should
      be a last resort, filing suit put the case before a judge and prompted processing; without suit the journalist might
      still be in the queue and might receive no records. On that balance, proceed with suit. The choice depends on the continued
      delay and the need to obtain timely records, not on treating the alleged violations as already proven.
    tradecraft: Document the appeal history, the delays, the requested expedited processing, and the specific FOIA grounds
      asserted. Keep the requested relief and subsequent agency processing or production under review.
    uncertainty: The stated FOIA grounds were claims in the complaint, not judicial findings. The account does not establish
      how a court would resolve them or guarantee that litigation would produce all requested records.
    handoff: The attorneys should make the litigation decision on the journalist's behalf in coordination with her as their
      client. No separate approval authority is identified.
    tempting_wrong:
      option: O2
      pull: Avoiding litigation fits the principle that lawsuits should be a last resort.
      why_wrong: That principle does not justify indefinite waiting after administrative appeals and continued agency delays,
        especially where the journalist might otherwise remain in the queue without records.
    rejected:
      O2: The attorneys did not keep waiting because appeals had not ended the delays and they viewed judicial intervention
        as necessary to press the agencies to process the requests.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Before filing, the agencies resume prompt processing and provide the records needed to resolve the request.
      then: O2
      why: If the delay and practical risk that prompted suit were resolved, the reasons for bringing the dispute before a
        judge would be substantially reduced.
    would_not_change:
    - id: noflip1
      if: The attorneys remain concerned that, without suit, the journalist could remain in the queue and receive no records.
      why: That stated risk supports proceeding with litigation rather than continuing to wait.
    watch_for:
    - id: watch1
      what: Whether the agencies continue processing and turning over responsive records after litigation begins.
      favors:
      - O2
      why: Sustained processing may reduce the need for further litigation, though it does not undo the decision to file suit
        after the earlier delays.
  lesson: When administrative appeals have failed and agency delay threatens the practical value of a records request, litigation
    can be a justified last resort to seek judicial intervention. Treat asserted legal violations as claims to be tested,
    not as established findings.
  limits: This reasoning applies to the described FOIA dispute after appeals and continued delays. It does not establish that
    every delayed request warrants suit or resolve the merits of the journalist's claims.
