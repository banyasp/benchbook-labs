case:
  id: DR-CORPUS-NX-0b1aae37-E3@v1
  title: Congo Policy Direction, 1960
  status: draft
  setting: United States, August 1960; presidential decision on Congo policy.
  decider: The President
  agent: The President
  agent_role: decide
  situation: The United States viewed the Congo's political alignment through a Cold War lens and was concerned it might gravitate
    toward the Eastern Bloc. Washington sought to prevent that outcome through diplomatic pressure, including influence at
    the United Nations. The prime minister was an eloquent advocate of an independent Congo, but he was also impulsive and
    tended to alienate people whose support his government needed. The Congolese government was chaotic, undisciplined, and
    divided by ethnic and political conflict. Belgium's policy had withheld training, education, and positions of responsibility
    from Congolese people, leaving the country poorly prepared for independence. The United Nations, the United States, and
    Belgium each pursued interests that contributed to divisions.
  question: What should the President do about adopting a U.S. policy of removing the prime minister while addressing U.S.
    concerns about the Congo's alignment?
  options:
    O1:
      do: The President requests policy review from the administration and defers a removal decision.
      move: ask
      irreversible: false
      to: the administration
    O2:
      do: The President prohibits a U.S. policy of removing the prime minister and continues diplomacy.
      move: act
      irreversible: false
    O3:
      do: The President authorizes a U.S. policy of removing the prime minister and continues diplomacy.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The United States was concerned that the Congo might gravitate toward the Eastern Bloc.
  - id: F2
    kind: situation
    status: confirmed
    fact: The United States exercised diplomatic pressure, including through its influence at the United Nations.
  - id: F3
    kind: situation
    status: assessed
    fact: The prime minister was an eloquent speaker with a vision of an independent Congo.
  - id: F4
    kind: situation
    status: assessed
    fact: The prime minister was impulsive and tended to alienate people whose cooperation his government needed.
  - id: F5
    kind: situation
    status: assessed
    fact: The Congolese government was chaotic, undisciplined, and riven by ethnic and political infighting.
  - id: F6
    kind: situation
    status: confirmed
    fact: Belgium had withheld training, education, and positions of responsibility from Congolese people before independence.
  - id: F7
    kind: situation
    status: assessed
    fact: The United Nations, the United States, and Belgium contributed to divisions while pursuing outcomes that protected
      their interests.
  considerations:
  - id: C1
    facts:
    - F1
    equity: security_risk
    favors:
    - O3
    weight: strong
    why: Preventing the Congo from gravitating toward the Eastern Bloc was the stated U.S. concern, and the President wanted
      the prime minister removed from the way of that objective.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: The prime minister's eloquence and vision did not overcome his tendency to alienate needed supporters or the government's
      chaos and divisions; these circumstances help explain why U.S. officials lost confidence in him.
  - id: C3
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    - O2
    weight: weak
    why: Diplomatic pressure, including through the United Nations, was an available non-removal approach. The account identifies
      it as part of Washington's effort but says the CIA played the decisive U.S. role.
  - id: C4
    facts:
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O1
    - O2
    weight: weak
    why: Belgium's withholding of preparation for independence and the external parties' contribution to divisions complicate
      attributing the crisis solely to the prime minister and counsel against treating removal as a complete solution.
  reasoning:
    read: 'This was a Cold War policy decision: Washington feared the Congo might gravitate toward the Eastern Bloc and pursued
      both diplomatic pressure and removal of the prime minister. The trap is to mistake Lumumba''s real political failings
      for the whole explanation; the government was poorly prepared for independence, and outside parties also contributed
      to divisions.'
    weighing: The account's stated U.S. concern about alignment, together with its assessment of Lumumba and his government's
      dysfunction, explains the President's direction to remove him {C1} {C2}. Diplomacy was already being used, while the
      account describes the CIA as decisive {C3}. But the record also places responsibility in Belgium's colonial policy and
      in the interests pursued by the United Nations, the United States, and Belgium {C4}. The balance depends chiefly on
      the perceived alignment risk; the account reports the President's decision and intent, but does not provide a full ethical
      comparison of removal with continued diplomacy alone.
    tradecraft: For a comparable decision, state the national-security objective and the evidentiary basis for the perceived
      alignment risk, compare removal with diplomatic and review alternatives, and record how the costs and uncertainty were
      weighed. Keep the policy authorization distinct from any later implementation decisions.
    uncertainty: The account describes the President's intent as clear despite ambiguous language, but gives limited detail
      about the information or deliberation behind the direction. It also notes that the broader events and interests shaping
      U.S. policy are not fully developed.
    handoff: The President holds the decision in this scenario; seeking administration review and diplomatic assessments would
      help expose uncertainty and the consequences of U.S. and other external actors' policies.
    tempting_wrong:
      option: O2
      pull: Prohibiting removal preserves a non-removal policy while allowing diplomatic pressure to continue.
      why_wrong: It does not match the outcome the source attributes to the President, whose stated concern was preventing
        Eastern Bloc alignment and whose intent was to have Lumumba removed.
    rejected:
      O1: The account records a presidential direction to remove the prime minister rather than deferral for policy review.
      O2: The account attributes to the President a decision to remove the prime minister in response to the U.S. concern
        about the Congo's alignment.
  verdict:
    choice: O3
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A policy review established a credible diplomatic path to address the alignment concern without removing the prime
        minister.
      then: O1
      why: That would make deferral for review and continued diplomacy a plausible alternative to authorizing removal.
    - id: flip2
      if: The alignment concern were substantially reduced by reliable evidence that the Congo would not gravitate toward
        the Eastern Bloc.
      then: O2
      why: The central stated U.S. concern supporting removal would then be materially weaker.
    would_not_change:
    - id: noflip1
      if: The prime minister's eloquence and vision for an independent Congo remained as described.
      why: Those qualities were part of the account's picture of Lumumba but did not overcome the government's dysfunction
        or the stated U.S. alignment concern.
    watch_for:
    - id: watch1
      what: Whether U.S. policy and the actions of other external parties are worsening the divisions they seek to manage.
      favors:
      - O1
      - O2
      why: The account says the United States, the United Nations, and Belgium contributed to divisions while pursuing their
        own interests.
  lesson: A perceived national-security risk can explain a forceful policy choice, but it should not obscure the limits of
    what removal can solve. Assess the target of the policy alongside the institutional weaknesses and outside actions contributing
    to the crisis.
  limits: This scenario concerns the President's 1960 policy direction, not the legality or ethics of any later operational
    method. The account does not supply a complete record of presidential deliberations or establish that removal was the
    only effective response.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-0b1aae37
    source: https://www.cia.gov/resources/csi/static/6886bb9567894480ed0201639f9a6588/UNCLASSIFIED-EXTRACTS-Studies-68-1-March-2024-web.pdf
    episode_focus: The decision point is the president’s direction to remove the prime minister, against the stated US concern
      that the Congo might gravitate toward the Eastern Bloc. Compare that course with diplomatic pressure and other non-removal
      approaches; exclude the methods and operational decisions used to carry out the direction.
    cues:
      option_words:
        O1: 13
