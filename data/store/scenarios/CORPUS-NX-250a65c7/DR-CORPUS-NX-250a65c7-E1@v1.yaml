case:
  id: DR-CORPUS-NX-250a65c7-E1@v1
  title: Survivors and Submarine Safety
  status: draft
  setting: At sea during the Second World War, aboard a German submarine.
  decider: The Commander
  agent: The Commander
  agent_role: decide
  situation: After a ship was sunk, survivors remained in the water and on rafts near the wreckage. The Commander assessed
    that the rafts could disclose the submarine’s location and could carry signaling equipment. He believed rescue could expose
    the submarine to attack, relying on an account of another submarine that had been attacked after taking survivors aboard.
    Standing instructions barred attempts to rescue shipwrecked people, subject to a limited exception for statements important
    to the submarine; the Commander believed he could not take survivors aboard and that saving them was no longer possible.
    He believed no people were visible on the rafts and that the survivors had left them. The governing law of war prohibited
    killing unarmed enemies and treated killing helpless survivors as a grave breach.
  question: What should the Commander do about the survivors and wreckage?
  options:
    O1:
      do: The Commander prohibits force against the survivors and wreckage.
      move: act
      irreversible: false
    O2:
      do: The Commander permits force against the survivors and wreckage.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: After the ship was sunk, survivors were in the water and on rafts near the wreckage.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Commander assessed that the rafts could reveal the submarine’s location and might have signaling communications.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Commander relied on an account that another submarine had been attacked after taking survivors aboard and had
      to unload them before diving.
  - id: F4
    kind: authority
    status: confirmed
    fact: Standing submarine-command instructions barred attempts to rescue shipwrecked people, with a limited exception for
      cases where their statements would be important to the submarine.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The Commander believed his orders barred him from taking survivors aboard and that saving their lives was no longer
      possible.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Commander believed no people were visible on the rafts and that the survivors had left them.
  - id: F7
    kind: authority
    status: confirmed
    fact: The applicable law of war prohibited killing unarmed enemies and treated killing helpless survivors as a grave breach.
  considerations:
  - id: C1
    facts:
    - F7
    equity: hors_de_combat
    favors:
    - O1
    weight: bar
    why: The Judge Advocate treated killing unarmed enemies as forbidden by the law of war and killing helpless survivors
      as a grave breach; this rules out permitting force against them.
    rules_out:
    - O2
  - id: C2
    facts:
    - F2
    - F3
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: The perceived risk that rafts could reveal the submarine and the account of another submarine being attacked after
      taking survivors aboard supported the Commander's concern for his crew, but did not itself establish a lawful basis
      to kill survivors.
  - id: C3
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The Commander believed standing instructions barred rescue, but an instruction against rescue did not authorize conduct
      prohibited by the law of war.
  - id: C4
    facts:
    - F1
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The belief that no one was visible on the rafts did not change that survivors remained in the water; the Judge Advocate
      assessed the decision on the evidence and rejected the claimed operational necessity.
  reasoning:
    read: The situation involved survivors who were helpless and protected by the law of war, not merely rafts that might
      compromise the submarine. The trap is to treat a no-rescue order and a perceived security risk as authority to use force
      against people.
    weighing: The Commander’s concerns about disclosure, possible signaling, and danger to his crew were real considerations
      {C2}, and his understanding of the standing instructions constrained rescue {C3}. But the Judge Advocate held that killing
      unarmed enemies was forbidden and that killing helpless survivors was a grave breach {C1}. The Judge Advocate also rejected
      operational necessity on the evidence, including the claimed purpose of eliminating traces {C4}. The balance therefore
      favors prohibiting force; it could differ only if exceptional circumstances actually justified killing an unarmed person
      to save one's own life.
    tradecraft: 'Keep the decision at the level of whether force is lawful: do not treat the security concern or standing
      instructions as permission to harm survivors. Record the assessed risks, the applicable legal prohibition, and the basis
      for prohibiting force.'
    uncertainty: The Commander believed no people were visible on the rafts and believed rescue was barred, but survivors
      were still in the water. The Judge Advocate acknowledged that circumstances might arise in which killing an unarmed
      person to save one's own life could be justified, while finding the case on the evidence presented did not establish
      that justification.
    handoff: The Commander should seek legal review or higher-authority guidance if the law's application is genuinely uncertain;
      neither the commander's belief about orders nor the operational concern displaces the governing legal standard.
    tempting_wrong:
      option: O2
      pull: Permitting force may seem to protect the submarine and comply with the standing no-rescue instructions.
      why_wrong: Those considerations do not authorize force against helpless survivors where the law of war forbids killing
        unarmed enemies.
    rejected:
      O2: The Judge Advocate rejected the operational-necessity justification on the evidence and held that killing helpless
        survivors was a grave breach of the law of war.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Exceptional circumstances actually arose in which killing an unarmed person was justified to save one's own life.
      then: O2
      why: The Judge Advocate acknowledged that circumstances might arise in which such a killing could be justified, while
        rejecting that basis on the evidence in this case.
    would_not_change:
    - id: noflip1
      if: The standing instructions continued to bar rescue.
      why: A restriction on rescue would not by itself override the law-of-war prohibition on killing helpless survivors.
    watch_for:
    - id: watch1
      what: Evidence that survivors remain in distress, even if no one is visible on the rafts.
      favors:
      - O1
      why: The legal protection applies to helpless survivors; absence from the rafts does not establish that no survivors
        remain.
  lesson: Operational security concerns and orders restricting rescue do not, without more, authorize force against helpless
    survivors. Apply the law-of-war protection directly, and treat any claimed necessity as an exceptional justification that
    must be established on the circumstances.
  limits: The source acknowledged that exceptional circumstances might justify killing an unarmed person to save one's own
    life, but did not find that justification established here. This reasoning does not determine what rescue duties or other
    rules apply in different circumstances.
