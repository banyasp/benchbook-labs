case:
  id: DR-CORPUS-NX-250a65c7-E2@v1
  title: Medical Duty and a Commander's Order
  status: draft
  setting: German navy during wartime; date and location are not specified in the excerpt.
  decider: The medical officer
  agent: The medical officer
  agent_role: decide
  situation: The medical officer had received an order from the Commander. Navy regulations forbade medical officers from
    using weapons for offensive purposes. He knew of the Geneva Convention and understood that a doctor's protection rested
    in part on being a non-combatant. He was unsure whether his regulations allowed him to refuse an order that conflicted
    with the Geneva Convention. Survivors were present, and he did not regard his own use of a weapon as an offensive action.
  question: What should the medical officer do about the Commander's order?
  options:
    O1:
      do: The medical officer complies with the Commander's order as given.
      move: act
      irreversible: true
    O2:
      do: The medical officer asks the Commander to clarify the order first.
      move: ask
      irreversible: false
      to: the Commander
    O3:
      do: The medical officer refuses to comply with the Commander's order.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The medical officer had received an order from the Commander.
  - id: F2
    kind: authority
    status: confirmed
    fact: Navy regulations forbade medical officers from using weapons for offensive purposes.
  - id: F3
    kind: situation
    status: assessed
    fact: The medical officer was unsure whether his regulations allowed him to refuse an order that conflicted with the Geneva
      Convention.
  - id: F4
    kind: situation
    status: assessed
    fact: The medical officer knew what the Geneva Convention was.
  - id: F5
    kind: situation
    status: assessed
    fact: The medical officer understood that a doctor's protection rested in part on being a non-combatant.
  - id: F6
    kind: situation
    status: assessed
    fact: The medical officer recognized that survivors were present.
  - id: F7
    kind: situation
    status: assessed
    fact: The medical officer did not regard his own use of a weapon as an offensive action.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: chain_of_command
    favors:
    - O1
    weight: weak
    why: The medical officer said he disregarded the navy regulation because he had received an order from the Commandant,
      although he was unsure whether he could refuse an order conflicting with the Geneva Convention.
  - id: C2
    facts:
    - F2
    equity: policy_compliance
    favors:
    - O2
    - O3
    weight: strong
    why: Navy regulations forbade medical officers from using weapons for offensive purposes, creating a professional restriction
      that the order did not itself resolve.
  - id: C3
    facts:
    - F4
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O3
    - O2
    weight: strong
    why: The officer knew of the Geneva Convention, understood that medical protection rested partly on non-combatant status,
      and recognized survivors were present. The Judge Advocate stated that killing unarmed enemies was forbidden as a fundamental
      usage of war.
  - id: C4
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: The officer did not regard his own use of a weapon as offensive, which explains his characterization of the order
      but does not settle whether the regulation or the law applied.
  reasoning:
    read: This was a conflict between a Commandant's order, a professional restriction on medical officers, and the legal
      significance of the officer's non-combatant status. The trap is treating the officer's belief that his own conduct was
      not offensive as resolving the conflict, when the Judge Advocate stated a broader prohibition on killing unarmed enemies.
    weighing: The officer's stated reason for choosing {O1} was that he had received the Commandant's order, and he did not
      classify his own use as offensive. Against that rationale stand the navy's restriction, his awareness of the Geneva
      Convention and the basis of medical protection, and the Judge Advocate's statement about unarmed enemies. The recorded
      course was {O1}, but the source's legal rationale makes that outcome contested rather than a settled legal authorization;
      the balance depends on whether the order required conduct within the prohibition.
    tradecraft: At decision level, identify the order and the applicable professional restriction, distinguish the officer's
      characterization from the governing rule, and record the basis for the decision. These steps are process guidance, not
      reasons stated for the officer's choice.
    uncertainty: The officer was unsure whether his regulations permitted refusal of an order that conflicted with the Geneva
      Convention. The excerpt does not establish the precise terms of the order or whether the officer's conduct fell within
      the regulation's meaning of offensive use.
    handoff: The excerpt records the Commandant's order and the Judge Advocate's legal framing, but no consultation or referral
      before the officer acted. As a decision practice, unresolved conflict between an order and a professional or legal restriction
      calls for clarification from the commander and, where available, competent legal authority.
    tempting_wrong:
      option: O1
      pull: The officer had received a command order and did not regard his own use as offensive.
      why_wrong: Those points explain his choice, but neither removes the navy's restriction nor resolves the Judge Advocate's
        stated prohibition concerning unarmed enemies.
    rejected:
      O2: The officer did not seek clarification; his stated rationale was that he disregarded the restriction because he
        had received the Commandant's order.
      O3: The officer did not refuse, explaining that he followed the Commandant's order and did not regard his own use as
        offensive.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The order were clarified to require conduct that amounted to killing unarmed enemies or otherwise fell within the
        prohibition stated by the Judge Advocate.
      then: O3
      why: The stated prohibition would outweigh the command-order rationale and the officer's personal characterization of
        his conduct.
    - id: flip2
      if: The order were clarified to require offensive use of a weapon by the medical officer under the navy regulation.
      then: O3
      why: That clarification would bring the order directly into conflict with the regulation described in the excerpt.
    would_not_change:
    - id: noflip1
      if: The only additional fact were that the order came from the Commandant.
      why: A Commandant's order does not by itself resolve the conflict with the professional restriction or the stated law-of-war
        rule.
    watch_for:
    - id: watch1
      what: Whether the regulations permitted refusal of an order that conflicted with the Geneva Convention.
      favors:
      - O2
      - O3
      why: The officer expressly lacked certainty about that authority, so the unresolved issue could bear on whether to clarify
        or refuse.
  lesson: A command order does not, by itself, settle a conflict with professional restrictions or a legal prohibition. A
    decision-maker's belief that conduct is not offensive should be tested against the governing rule, especially where protected
    status and unarmed persons are implicated.
  limits: The excerpt does not give the full order, establish whether the officer's conduct legally constituted an offensive
    use, or provide a complete account of the governing regulations. This scenario therefore does not establish a general
    rule that medical officers must obey or refuse every conflicting order.
