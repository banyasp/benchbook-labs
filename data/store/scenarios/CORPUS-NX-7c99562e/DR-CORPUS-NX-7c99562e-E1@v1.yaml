    episode_focus: The decision point is the selection of a new framework after RAND found that none of the alternatives fully
      met Army requirements; CIRCuIT was also considered too broad and complex for wider release. Rebuild the choice among
      assessment frameworks and its stated rationale, not the operational conduct of exercises.
