case:
  id: DR-CORPUS-NX-7c99562e-E1@v1
  title: Choosing an Army Interoperability Measurement Framework
  status: draft
  setting: Army interoperability measurement work, during the analysis of alternatives requested by DAMO-SSC and planning
    for WFX 19-4.
  decider: RAND Arroyo Center
  agent: RAND Arroyo Center
  agent_role: advise
  situation: DAMO-SSC requested an analysis of alternatives for measuring interoperability within the Army. The approaches
    considered included Army evaluation outlines, CIRCuIT, several collection approaches, a U.K. assessment tool, and an expert
    panel approach. CIRCuIT drew on Center of Excellence input, but its criteria and matrices contained many information elements
    that were difficult for an observer to digest. It was also considered too complex for wider Army release and would require
    significant training and reorganization of CAATs. The analysis found that none of the approaches fully met Army requirements.
    A new framework could draw on work already done by the Centers of Excellence for CIRCuIT.
  question: What should RAND Arroyo Center recommend for the Army's interoperability measurement framework?
  options:
    O1:
      do: RAND Arroyo Center recommends retaining CIRCuIT as the Army's interoperability measurement framework.
      move: act
      irreversible: false
    O2:
      do: RAND Arroyo Center recommends rejecting AIMS as the Army's interoperability measurement framework.
      move: act
      irreversible: false
    O3:
      do: RAND Arroyo Center recommends selecting AIMS as the Army's interoperability measurement framework.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: DAMO-SSC requested that RAND Arroyo Center analyze interoperability measurement options within the Army.
  - id: F2
    kind: situation
    status: confirmed
    fact: The alternatives included Army Training and Evaluation Outlines, CIRCuIT, multiple collection approaches, the ABCANZ
      Critical Questions List, the U.K.'s MIAT, and a generic expert panel approach.
  - id: F3
    kind: capability
    status: assessed
    fact: CIRCuIT used Level 2 Army tactical tasks to measure interoperability.
  - id: F4
    kind: capability
    status: assessed
    fact: CIRCuIT's criteria were broad and its matrices contained too many information elements for an observer to easily
      digest.
  - id: F5
    kind: capability
    status: assessed
    fact: CIRCuIT was considered too complex for wider Army release and would require significant training and reorganization
      of CAATs.
  - id: F6
    kind: capability
    status: assessed
    fact: None of the approaches considered fully met the Army's requirements.
  - id: F7
    kind: capability
    status: confirmed
    fact: A new framework could use much of the work the Centers of Excellence had done for CIRCuIT.
  - id: F8
    kind: situation
    status: confirmed
    fact: The new framework was named the Army Interoperability Measurement System, or AIMS.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: Because none of the considered approaches fully met Army requirements, the analysis supported recommending a new
      framework rather than treating an existing alternative as adequate.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: CIRCuIT's broad criteria and information-heavy matrices were difficult for observers to digest, weighing against
      retaining it unchanged as the framework.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: CIRCuIT was considered too complex for wider Army release and would require significant training and CAAT reorganization,
      weighing against recommending it for broader use.
  - id: C4
    facts:
    - F7
    - F8
    equity: resource_stewardship
    favors:
    - O3
    weight: weak
    why: The recommended new framework could build on much of the Centers of Excellence work already completed for CIRCuIT,
      rather than discard that work.
  reasoning:
    read: This is a choice among measurement frameworks after the analysis found that none of the alternatives fully met Army
      requirements. The trap is treating CIRCuIT's existing work as a reason to retain CIRCuIT unchanged, despite the stated
      concerns about its breadth and complexity.
    weighing: The decisive balance is the overall shortfall in the alternatives, combined with CIRCuIT's difficulty for observers
      and barriers to wider release. RAND's recommendation of a new framework also preserved much of the Centers of Excellence
      work. The available reasons support selecting AIMS, but do not establish that it independently satisfied every Army
      requirement or that it resolved each CIRCuIT limitation.
    tradecraft: Record the recommendation as RAND's advice, distinguish the identified shortcomings of existing approaches
      from the rationale for building on prior work, and avoid claiming that AIMS was validated beyond what is established
      here.
    uncertainty: The stated rationale does not detail AIMS's design, testing, or performance against each Army requirement.
      It therefore supports the recommendation, not a claim that all measurement needs were conclusively resolved.
    handoff: RAND's role was advisory. The analysis was requested by DAMO-SSC, but the final Army adoption authority is not
      identified here; the recommendation should be handed to the Army decision authority for disposition.
    tempting_wrong:
      option: O1
      pull: CIRCuIT had already drawn on extensive Center of Excellence work.
      why_wrong: Prior work could be reused without retaining CIRCuIT as the framework; its breadth and complexity were stated
        reasons against wider use.
    rejected:
      O1: CIRCuIT was considered difficult to digest and too complex for wider Army release, so RAND did not recommend retaining
        it as the framework.
      O2: RAND recommended a new framework named AIMS, rather than rejecting AIMS.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent assessment established that AIMS did not meet Army requirements.
      then: O2
      why: The stated reason for recommending a new framework was that none of the alternatives fully met Army requirements;
        evidence that AIMS also failed them would undermine selecting it.
    - id: flip2
      if: CIRCuIT's breadth and complexity were resolved and it was shown to meet Army requirements for wider use.
      then: O1
      why: That evidence would remove the stated usability and release concerns that weigh against retaining CIRCuIT.
    would_not_change:
    - id: noflip1
      if: The Centers of Excellence work for CIRCuIT remained available for reuse.
      why: The availability of that work alone does not answer the stated concerns about CIRCuIT's breadth and complexity;
        the recommendation already allowed the work to be used in a new framework.
    watch_for:
    - id: watch1
      what: Evidence about whether AIMS meets Army requirements and whether it addresses the usability and wider-release concerns
        identified for CIRCuIT.
      favors:
      - O3
      - O2
      - O1
      why: The source supports selecting AIMS but does not provide its detailed validation or establish how it performs on
        those concerns.
  lesson: When no existing approach fully meets requirements, compare its shortcomings against the case for a new framework
    rather than assuming the closest existing option must be retained. Reuse valuable prior work where possible, but do not
    confuse reuse with endorsing the original approach unchanged.
  limits: This reasoning applies to the framework choice described here and does not establish AIMS's later performance or
    adoption. It does not supply a complete assessment of AIMS against Army requirements.
