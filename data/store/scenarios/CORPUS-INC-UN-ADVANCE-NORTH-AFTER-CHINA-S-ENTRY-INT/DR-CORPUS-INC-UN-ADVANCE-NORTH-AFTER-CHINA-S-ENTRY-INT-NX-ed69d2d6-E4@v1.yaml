case:
  id: DR-CORPUS-INC-UN-ADVANCE-NORTH-AFTER-CHINA-S-ENTRY-INT-NX-ed69d2d6-E4@v1
  title: Resuming the Northward Advance
  status: draft
  setting: Korea, late November 1950, United Nations Command under Far East Command
  decider: The Commander in Chief of Far East Command
  agent: The Commander in Chief of Far East Command
  agent_role: decide
  situation: By late November 1950, UN forces had crossed the 38th Parallel and were preparing a northward advance toward
    the Yalu River. The Secretary of Defense, speaking for the Joint Chiefs of Staff, had told the Commander he was unhampered
    to proceed north of the parallel. Officials in Washington and Tokyo hoped a final push would end the war, amid a broader
    debate between reunifying Korea and stopping at the parallel. Chinese forces had launched a First Phase Offensive from
    25 October through 6 November, and several South Korean regiments and one American regiment suffered heavily. The Chinese
    offensive ended, and UN forces paused to regroup. The decision is whether to resume the northward advance or halt it.
  question: What should the Commander in Chief of Far East Command do after Chinese forces have attacked UN units and the
    advance has paused for regrouping?
  options:
    O1:
      do: The Commander halts the UN advance northward toward the Yalu River.
      move: act
      irreversible: false
    O2:
      do: The Commander continues the UN advance northward toward the Yalu River.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: UN forces were gathering strength for a final northward advance toward the Yalu River.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Secretary of Defense, acting for the Joint Chiefs of Staff, told the Commander he was unhampered tactically
      and strategically to proceed north of the 38th Parallel.
  - id: F3
    kind: situation
    status: assessed
    fact: Officials in Washington and Tokyo hoped a final northward push would end the war.
  - id: F4
    kind: situation
    status: confirmed
    fact: A debate had considered whether UN forces should press on to reunify Korea or halt at the 38th Parallel.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: Chinese forces launched their First Phase Offensive from 25 October through 6 November 1950.
  - id: F6
    kind: situation
    status: confirmed
    fact: Several South Korean regiments and one American regiment suffered heavily in the Chinese offensive.
  - id: F7
    kind: situation
    status: confirmed
    fact: The Chinese offensive ended, and a pause to regroup preceded the decision point.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The advance was framed as a final push that officials hoped would end the war, against the background of a debate
      over reunifying Korea or stopping at the 38th Parallel. This supports continuing toward the stated objective, but the
      Commander's specific reasoning is not given.
  - id: C2
    facts:
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The Secretary of Defense, speaking for the Joint Chiefs of Staff, left the Commander unhampered to proceed north.
      That authorized continuation but did not require it.
  - id: C3
    facts:
    - F5
    - F6
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The Chinese offensive had inflicted heavy losses on South Korean and American units, a reason to give weight to the
      risks of continuing. Those losses are not identified as requiring a halt.
  - id: C4
    facts:
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The Chinese offensive ended, and the UN forces paused to regroup before the advance resumed. The sequence is consistent
      with continuing after regrouping, but does not establish that the threat had passed.
  reasoning:
    read: The decision was whether to resume the northward advance after Chinese forces had attacked and the UN forces had
      paused to regroup. The Commander resumed the advance in a setting where officials hoped to end the war and where authority
      to proceed north had been granted. The trap is to treat either the ended offensive as proof that further danger was
      gone or the earlier losses as proof that continuation was ruled out; neither conclusion is established.
    weighing: The stated objective and the authority to proceed support O2, while the Chinese attack and resulting losses
      weigh toward O1. The offensive's end and the regrouping pause formed part of the sequence before the advance resumed,
      not an express finding that renewed movement was safe. The balance supports the recorded choice to continue, but there
      is limited evidence about the Commander's own reasons.
    tradecraft: Keep the decision record clear about the objective, the authority granted, the losses from the Chinese offensive,
      and the fact that forces regrouped before the advance resumed. Do not record the offensive's end as proof that the risk
      had disappeared.
    uncertainty: The decision and its surrounding context are available, but there is no detailed statement of the Commander's
      assessment of the Chinese threat or of the losses.
    handoff: The Commander made the decision. The Secretary of Defense, acting for the Joint Chiefs of Staff, had granted
      authority to proceed north; no referral or further approval before the advance resumed is recorded.
    tempting_wrong:
      option: O1
      pull: Heavy losses in the Chinese offensive could make halting seem the prudent response.
      why_wrong: The offensive ended, UN forces regrouped, and the Commander then ordered the advance; the losses did not
        settle the choice in favor of stopping.
    rejected:
      O1: The Commander did not halt after the Chinese offensive; after a pause to regroup, the advance resumed.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The authority to proceed north had been withdrawn or limited so as not to permit the advance.
      then: O1
      why: Without authority to continue, the Commander could not rely on the stated authorization supporting O2.
    - id: flip2
      if: The Chinese offensive were still underway and UN units were continuing to suffer heavy losses at the decision point.
      then: O1
      why: That would materially strengthen the force-protection concern already raised by the earlier attack and losses.
    would_not_change:
    - id: noflip1
      if: The debate over reunifying Korea or stopping at the 38th Parallel remained unresolved.
      why: That debate remained unresolved when the Commander chose to resume the advance, so its unresolved status alone
        would not change the recorded choice.
    watch_for:
    - id: watch1
      what: Whether Chinese attacks resume or losses continue after the regrouping pause.
      favors:
      - O1
      why: That would increase the force-protection concern and weaken the case for continuing on the basis of an ended offensive.
  lesson: A prior authorization to proceed permits a decision but does not settle whether to proceed. When an attack has ended
    and forces have regrouped, weigh the stated mission objective and authority against the losses already suffered, without
    treating either the pause or the end of the attack as proof that danger has passed.
  limits: The available account records the advance and its context, not a full statement of the Commander's threat assessment
    or a later judgment that the decision was right or wrong. This reasoning does not establish that continuing is appropriate
    when authority, the threat, or the operational circumstances differ.
