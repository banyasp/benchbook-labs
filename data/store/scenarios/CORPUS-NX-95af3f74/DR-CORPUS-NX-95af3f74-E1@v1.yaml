case:
  id: DR-CORPUS-NX-95af3f74-E1@v1
  title: Presidential Authorization of an Embassy Security Project
  status: draft
  setting: Washington and the U.S. embassy in Moscow, February 1984; NSA and the White House
  decider: The President
  agent: The President
  agent_role: decide
  situation: NSA briefed the Secretary of Defense about a possible Soviet implant in U.S. embassy equipment. NSA management
    had proposed a project concerning equipment at the U.S. embassy in Moscow. NSA leadership was reluctant to involve the
    State Department because relations between the agencies were poor. An NSA senior official believed the CIA would mishandle
    the plan. The Secretary of Defense said the matter should be brought to the President immediately. The proposal was presented
    through the National Security Council for presidential authorization.
  question: What should the President do about the NSA's proposed project concerning the U.S. embassy in Moscow?
  options:
    O1:
      do: The President defers the NSA plan pending State Department consultation.
      move: hold
      irreversible: false
    O2:
      do: The President approves the NSA plan for the Moscow embassy.
      move: act
      irreversible: false
    O3:
      do: The President rejects the NSA plan for the Moscow embassy.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: NSA briefed the Secretary of Defense about a possible Soviet bug in U.S. embassy equipment.
  - id: F2
    kind: situation
    status: confirmed
    fact: NSA management proposed a project concerning equipment at the U.S. embassy in Moscow.
  - id: F3
    kind: situation
    status: confirmed
    fact: NSA leadership was reluctant to involve the State Department because relations between the agencies were poor.
  - id: F4
    kind: intelligence
    status: assessed
    fact: An NSA senior official believed the CIA would mishandle the plan.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Secretary of Defense said the matter should be brought to the President immediately.
  - id: F6
    kind: authority
    status: confirmed
    fact: The proposal was presented to the President through the National Security Council for authorization.
  considerations:
  - id: C1
    facts:
    - F1
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The warning of a possible Soviet implant led NSA to treat U.S. embassy equipment as a serious security concern; the
      prospect of such an effort against a Western ally made the United States a high-priority target.
  - id: C2
    facts:
    - F1
    - F2
    equity: source_protection
    favors:
    - O2
    weight: strong
    why: NSA wanted to prevent the Soviet Union from learning about the project and interfering with U.S. objectives, supporting
      approval through tightly limited channels.
  - id: C3
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: NSA leadership's poor relations with State and its distrust of the CIA's handling of the plan weighed against delaying
      the proposal for broader interagency consultation.
  - id: C4
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The Secretary of Defense called for immediate presidential attention, and the proposal reached the President through
      the NSC for authorization; this supports proceeding through the identified senior decision channel.
  reasoning:
    read: 'This was a response to a warning of a possible Soviet implant and the risk that the Soviet Union could frustrate
      U.S. objectives if it learned of the project. The trap is treating ordinary interagency consultation as automatically
      preferable: NSA''s stated concerns about State and the CIA, together with the need to keep the project secret, made
      broader circulation a potential risk to the proposed effort.'
    weighing: 'The source''s balance favors approval: the warning prompted serious concern about U.S. vulnerability, NSA wanted
      to prevent Soviet interference, and its doubts about State and the CIA''s handling weighed against deferral for broad
      consultation. The Secretary of Defense''s escalation and the NSC route brought the decision to the President for authorization.
      The balance depends on the warning being credible enough to warrant action and on limiting disclosure sufficiently to
      protect the project.'
    tradecraft: Record the presidential authorization and its security rationale, keep decision-level information on a need-to-know
      basis, and limit further briefings to officials whose involvement is necessary for authorization or cooperation. Do
      not let interagency friction substitute for a recorded assessment of the threat and the authority for action.
    uncertainty: The fixed facts describe a possible implant, not a confirmed one. The warning and NSA's assessment provided
      grounds for action, but no probability estimate or independent confirmation is given in this decision account.
    handoff: The President decided through the NSC after the Secretary of Defense called for immediate escalation. Briefings
      were restricted to senior officials, with a limited extension to the State Department's political leadership to help
      secure cooperation; broad circulation was avoided.
    tempting_wrong:
      option: O1
      pull: Deferring for State Department consultation may appear to ensure that the department responsible for the embassy
        is involved.
      why_wrong: The stated concerns were that relations with State were poor and that broader exposure could let the Soviet
        Union learn of or interfere with the project. Those concerns weighed against making State consultation a prerequisite
        to presidential approval.
    rejected:
      O1: Concerns about secrecy and interagency handling weighed against deferring approval pending State Department consultation.
      O3: The warning was treated as serious enough to prompt a plan and presidential authorization, and no finding is given
        that would support rejecting it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The warning were shown to be unreliable and no credible security concern remained.
      then: O3
      why: Without a credible threat to justify the project, the principal reason for approval would be absent.
    - id: flip2
      if: State's cooperation became essential before action and could not be obtained through a limited, secure channel.
      then: O1
      why: A necessary cooperation requirement could outweigh concerns about broader consultation and justify a limited deferral.
    would_not_change:
    - id: noflip1
      if: Relations between NSA and State remained poor, but the warning and the need to prevent Soviet interference otherwise
        remained unchanged.
      why: Poor relations were a reason to limit reliance on State, not by themselves a reason to reject the project.
    watch_for:
    - id: watch1
      what: Whether the project can remain sufficiently protected from Soviet awareness while obtaining any necessary cooperation.
      favors:
      - O1
      - O3
      why: Evidence that secrecy cannot be maintained could undermine the reason for proceeding as proposed.
  lesson: A serious security warning can justify prompt senior authorization even when the underlying threat is not yet confirmed.
    Limit consultation when disclosure itself could frustrate the objective, but preserve a secure route for necessary cooperation
    and accountable authorization.
  limits: This reasoning addresses the account of a possible Soviet threat and a project requiring secrecy; it does not establish
    a general rule for excluding State or the CIA from decisions. No legal standard is set out, and presidential authorization
    alone does not resolve every legal or policy question.
