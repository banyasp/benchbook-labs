case:
  id: DR-CORPUS-NX-ae832dd2-E1@v1
  title: ICRC Access to Verify Repatriation Wishes
  status: draft
  setting: Places of detention, after 3 April 1988; the two governments and the ICRC.
  decider: The two governments
  agent: The two governments
  agent_role: decide
  situation: For years, the ICRC had urged the two governments to repatriate all prisoners of war, prioritizing the seriously
    wounded and sick under Articles 109, 110 and 118 of the Third Convention. On 14 March 1988, the ICRC renewed its request
    to both governments, and an agreement between them was signed on 3 April. The ICRC then renewed its offer of services
    to organize repatriation. The governments must decide whether to allow the ICRC to visit detention sites and interview
    detainees individually about whether they wish to return. The ICRC had not been allowed to see 238 Somali prisoners of
    war again after visits between 28 October and 4 November 1987, while it continued providing food and material assistance.
  question: What should the two governments do about the ICRC's request to visit places of detention and interview detainees
    individually to check whether they wish to be repatriated?
  options:
    O1:
      do: The two governments prohibit the ICRC from visiting places of detention and interviewing each detainee individually
        about whether to return.
      move: act
      irreversible: false
    O2:
      do: The two governments permit the ICRC to visit places of detention and interview each detainee individually about
        whether to return.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The ICRC had for years urged the two governments to repatriate all prisoners of war, prioritizing the seriously
      wounded and sick under Articles 109, 110 and 118 of the Third Convention.
  - id: F2
    kind: situation
    status: confirmed
    fact: On 14 March 1988, the ICRC sent both governments a note verbale requesting repatriation.
  - id: F3
    kind: situation
    status: confirmed
    fact: An agreement between the two governments was signed on 3 April 1988.
  - id: F4
    kind: capability
    status: confirmed
    fact: After the agreement was signed, the ICRC renewed its offer of services to organize the repatriation operation.
  - id: F5
    kind: situation
    status: confirmed
    fact: The ICRC had not been allowed to see 238 Somali prisoners of war again after its visits between 28 October and 4
      November 1987, under its customary criteria as defined in Article 126 of the Third Convention.
  - id: F6
    kind: situation
    status: confirmed
    fact: The ICRC continued providing the Somali prisoners of war with food and material assistance, including 66 tonnes
      of relief supplies delivered during visits to three places of detention between January and August 1988.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: humanitarian_access
    favors:
    - O2
    weight: weak
    why: The ICRC had repeatedly sought repatriation under the Third Convention, including by renewing its request to both
      governments. These provisions provide context for the repatriation effort, but do not establish that they themselves
      required authorizing these particular visits.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: After the governments signed their agreement, the ICRC renewed its offer to organize repatriation, and both governments
      accepted it. Permitting the visits was the course the governments took in connection with that accepted offer.
  - id: C3
    facts:
    - F4
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The authorized individual interviews were intended to check whether each detainee wanted to be repatriated, rather
      than relying only on the governments' agreement.
  - id: C4
    facts:
    - F5
    - F6
    equity: humanitarian_access
    favors:
    - O2
    weight: weak
    why: The ICRC had not been allowed to see the Somali prisoners again after its 1987 visits, even though it continued providing
      relief. Assistance and access are separate matters; continued aid did not itself provide the stated individual check.
  reasoning:
    read: The decision is whether to permit detention-site visits and individual checks of detainees' wishes after the governments
      agreed to repatriation and accepted the ICRC's offer. An agreement to repatriate is distinct from checking whether each
      detainee wishes to return; continued material assistance is not that check.
    weighing: Both governments accepted the ICRC's offer and authorized the visits and interviews after their agreement. That
      action fits the repatriation effort and the stated purpose of checking each detainee's wishes {C2} {C3}. The prior restriction
      on visits, despite continued relief, adds context in favor of access {C4}. The stated facts do not establish that the
      cited Convention articles compelled these particular visits, so the legal point should not be overstated {C1}.
    tradecraft: Limit the authorization to detention-site access and individual interviews about willingness to return. Record
      that the interviews are intended to check each detainee's wishes, and do not treat the intergovernmental agreement as
      proof of any detainee's individual preference.
    uncertainty: The governments accepted the offer and authorized the visits, but their deliberations, the terms of access,
      and the detainees' interview responses are not given. The choice to permit the visits is clear, but the governments'
      unstated motives and the interviews' results cannot be inferred.
    handoff: The two governments hold the decision; the ICRC is the accepted provider of the offered services. No transfer
      of the decision to another authority is indicated.
    tempting_wrong:
      option: O1
      pull: The governments might regard the agreement and ongoing relief deliveries as sufficient, without renewed detention-site
        access.
      why_wrong: That would conflate assistance and an intergovernmental agreement with the stated purpose of checking individually
        whether detainees wished to return; the governments authorized those checks.
    rejected:
      O1: The governments did not prohibit the visits; both accepted the ICRC's offer and authorized visits and individual
        interviews.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible information showed that the proposed visits and interviews could not allow detainees to express their wishes
        freely, and that this could not be remedied.
      then: O1
      why: The stated purpose of the interviews is to check detainees' wishes; if the proposed access could not serve that
        purpose, the reason for permitting it would be undermined.
    would_not_change:
    - id: noflip1
      if: The ICRC continued providing food and material assistance.
      why: Continued assistance alongside restricted visits does not by itself answer whether detainees' individual wishes
        are checked.
    watch_for:
    - id: watch1
      what: Whether the ICRC can see detainees under its customary criteria, given that it had not been allowed to see the
        238 Somali prisoners again after its 1987 visits.
      favors:
      - O2
      why: The prior lack of access is distinct from the continued provision of relief.
  lesson: Where repatriation has been agreed, do not treat the agreement as a substitute for checking each detainee's wishes
    when that is the stated purpose of humanitarian access. Assistance delivered to detainees does not, by itself, resolve
    the separate question of access for individual checks.
  limits: This reasoning concerns the decision to permit ICRC visits and interviews after the governments' agreement. It does
    not establish that the cited Convention articles independently require these particular visits, nor does it address transport
    arrangements or what should happen in an individual case where a detainee does not wish to return.
