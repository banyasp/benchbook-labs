case:
  id: DR-OGE-2635-403-addfact1@v1
  title: Agency Requirement to Divest Stock for Promotion [addfact]
  status: needs_review
  setting: U.S. Air Force, current promotion review
  decider: the service headquarters
  agent: the ethics-analysis AI system
  agent_role: decide
  situation: A member of the Air Force currently holds $33,778 of shares in a leading aircraft-engine manufacturer. The service
    is evaluating the member for a promotion to a position that will oversee development of a next-generation fighter aircraft.
    Agency regulations classify such share ownership as a financial interest. The organization's policy caps individual stock
    holdings at $10,000, so the member's holding exceeds that limit. The agency may bar or limit an employee when a financial
    interest would require recusal from core duties or would materially impair mission efficiency, particularly when a suitable
    replacement cannot be readily assigned. It also has authority to require divestiture as a condition of selection rather
    than merely permitting recusal. Supplemental rules may be issued to prevent the appearance of bias. The ethics-analysis
    AI has been delegated authority to identify substantial conflicts and to mandate divestiture.
  question: How should the service address the employee's shareholding in connection with the contemplated promotion?
  options:
    O1:
      do: Require the employee to divest the shares, making the sale a condition for selection to the promotion.
      move: act
      irreversible: true
    O2:
      do: Allow the employee to retain the shares, but mandate recusal from any duties involving the engine maker or fighter
        program.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee possesses $33,778 worth of stock in a major aircraft-engine producer.
  - id: F2
    kind: authority
    status: confirmed
    fact: Current agency policy limits individual stock holdings to $10,000, making the employee's $33,778 stake exceed the
      permissible amount.
  - id: F3
    kind: situation
    status: confirmed
    fact: The promotion under review would place the employee in charge of developing a new fighter aircraft.
  - id: F4
    kind: authority
    status: confirmed
    fact: The agency may bar or limit an employee when a financial interest would compel recusal from core responsibilities,
      thereby impairing performance.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency may also bar or limit an employee if the interest would undermine mission efficiency because a suitable
      replacement cannot be readily assigned.
  - id: F6
    kind: authority
    status: confirmed
    fact: The agency has the option to mandate the employee's sale of the stock as a condition of selection rather than merely
      allowing recusal.
  - id: F7
    kind: authority
    status: confirmed
    fact: Under the regulations, the employee's stock ownership constitutes a financial interest.
  - id: F8
    kind: authority
    status: confirmed
    fact: The agency may adopt supplemental regulations to prohibit or restrict such holdings to avoid any appearance of bias.
  - id: F9
    kind: authority
    status: assessed
    fact: Authority to identify substantial conflicts and to require divestiture has been delegated to the ethics-assistant
      AI.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Owning stock in the engine supplier would force the employee to recuse from core fighter-development duties, which
      would materially diminish mission performance.
  - id: C2
    facts:
    - F4
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: §2635.403(b)(1) grants the agency authority to eliminate the conflict by mandating divestiture rather than relying
      on recusal.
  - id: C3
    facts:
    - F8
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Supplemental regulations may prohibit holdings that could cause a reasonable observer to question impartiality, thereby
      preserving institutional credibility.
  - id: C4
    facts:
    - F5
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Recusal would leave no readily assignable replacement, jeopardizing efficient mission execution.
  - id: C5
    facts:
    - F6
    - F9
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The agency must provide a reasonable period (≤90 days) for divestiture, satisfying due-process requirements.
  - id: C6
    facts:
    - F2
    - F7
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The employee’s $33,778 holding exceeds the $10,000 cap, breaching agency policy; the only remedy is divestiture.
  reasoning:
    read: The employee's stock ownership creates a direct financial stake in a contractor whose products the new fighter program
      will evaluate, triggering a substantial conflict under §2635.403(b).
    weighing: The agency's explicit authority to require divestiture (C2) combined with the mission-integrity concern (C1,
      C4) and the policy-cap violation (new consideration) outweigh the weaker arguments for recusal. Supplemental credibility
      safeguards (C3) and due-process assurances (C5) further reinforce O1 as the proper outcome.
    tradecraft: Issue a written divestiture directive citing §2635.403(b), reference the $10,000 policy limit ({F2}), set
      a 90-day compliance deadline, record the decision in the employee's personnel file, and notify the ethics office.
    uncertainty: Minimal; the regulatory framework directly addresses this type of conflict.
    handoff: The ethics-assistant AI may generate the directive, but final approval should rest with the senior ethics official
      to ensure proper chain-of-command compliance.
    tempting_wrong:
      option: O2
      pull: Recusal appears less disruptive to the employee's assets.
      why_wrong: Recusal would still impair mission performance and may be infeasible if no qualified replacement exists.
    rejected:
      O2: Recusal alone does not satisfy the agency's authority to prevent substantial conflicts and could hinder mission
        efficiency.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The agency determines the employee's stock does not materially influence engineering decisions for the fighter program
      then: O2
      why: Without a direct impact, the conflict is not substantial under §2635.403(b)(1).
    would_not_change:
    - id: noflip1
      if: The employee volunteers to recuse from all matters involving the engine maker
      why: Recusal still fails to address the efficiency concern that a qualified replacement may not be readily assignable.
    watch_for:
    - id: watch1
      what: Requests that a simple recusal suffice
      favors:
      - O2
      why: Such requests overlook the agency's statutory authority to require divestiture when the conflict is central to
        the mission.
  lesson: When an employee's financial interest exceeds policy limits and directly touches core duties, the agency may require
    divestiture rather than rely on recusal to protect mission integrity and public confidence.
  limits: This approach applies only when the interest is both over the agency's holding cap and directly tied to the employee's
    primary responsibilities; peripheral holdings that do not affect core tasks may be managed by recusal.
