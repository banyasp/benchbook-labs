case:
  id: DR-OGE-2635-403@v1
  title: Agency Requirement to Divest Stock for Promotion
  status: draft
  setting: Air Force, present, promotion consideration
  decider: the agency
  agent: the ethics-assistant AI
  agent_role: decide
  situation: An Air Force employee holds $33,778 of stock in a major aircraft engine manufacturer. The employee is being considered
    for a promotion to a position that carries responsibility for developing a new fighter airplane. The agency can prohibit
    or restrict financial interests that would require recusal from central duties or impair mission efficiency. The agency
    may require divestiture of a financial interest as a condition of selection rather than allowing recusal. Stock ownership
    is defined as a financial interest under agency regulations. The agency may also issue supplemental regulations to prohibit
    such holdings to preserve impartiality.
  question: What should the agency do regarding the employee's stock ownership in connection with the promotion?
  options:
    O1:
      do: The agency disallows the employee to retain the stock and requires its sale as a condition of selection.
      move: act
      irreversible: true
    O2:
      do: The agency allows the employee to retain the stock and requires recusal from related duties.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee holds $33,778 of stock in a major aircraft engine manufacturer.
  - id: F2
    kind: situation
    status: confirmed
    fact: The promotion under consideration involves responsibility for development of a new fighter airplane.
  - id: F3
    kind: authority
    status: confirmed
    fact: The agency may prohibit or restrict an employee if holding the interest would require recusal from central duties,
      materially impairing performance.
  - id: F4
    kind: authority
    status: confirmed
    fact: The agency may prohibit or restrict an employee if the interest would adversely affect efficient mission accomplishment
      because another employee cannot be readily assigned.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency can require the employee to sell the stock as a condition of selection rather than allowing recusal.
  - id: F6
    kind: authority
    status: confirmed
    fact: Stock ownership by the employee is a financial interest within the meaning of the regulation.
  - id: F7
    kind: authority
    status: confirmed
    fact: The agency may issue supplemental regulations to prohibit or restrict financial interests to avoid appearance of
      bias.
  - id: F8
    kind: authority
    status: assessed
    fact: The agency has delegated authority to the ethics-assistant AI to determine substantial conflicts and require divestiture.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Holding stock in the engine maker would require the employee to recuse from central duties of fighter development,
      materially impairing performance.
  - id: C2
    facts:
    - F3
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: §2635.403(b)(1) authorizes the agency to prohibit the interest and require divestiture rather than rely on recusal.
  - id: C3
    facts:
    - F7
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Supplemental regulations may ban employee holdings that would cause a reasonable person to question impartiality,
      preserving public confidence.
  - id: C4
    facts:
    - F4
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Recusal would leave no readily assignable replacement, harming efficient mission accomplishment.
  - id: C5
    facts:
    - F5
    - F8
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The agency must give a reasonable period (≤90 days) to divest, satisfying procedural fairness.
  reasoning:
    read: The employee’s stock ownership creates a direct financial stake in a contractor whose products the new fighter program
      will evaluate, triggering a substantial conflict under §2635.403(b).
    weighing: The agency leans on the explicit authority to require divestiture (C2) and the policy goal of preserving mission
      integrity (C1, C4). Supplemental regulation support (C3) reinforces the need to eliminate even the appearance of bias.
      Due‑process safeguards (C5) ensure the action is lawful, making O1 the proper outcome.
    tradecraft: Issue a written divestiture directive citing §2635.403(b), set a 90‑day compliance deadline, document the
      decision in the employee’s personnel file, and notify the ethics office.
    uncertainty: Minimal; the regulation’s example directly addresses this scenario.
    handoff: The ethics‑assistant AI may issue the directive, but final approval should rest with the senior ethics official
      to ensure chain‑of‑command compliance.
    tempting_wrong:
      option: O2
      pull: Recusal appears less disruptive to the employee’s assets.
      why_wrong: Recusal would still impair the mission and may not be feasible if no qualified replacement exists.
    rejected:
      O2: Recusal alone does not satisfy the agency’s authority to prevent substantial conflicts and could hinder mission
        efficiency.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The agency determined that the employee’s stock would not directly or predictably affect engineering decisions for
        the fighter program
      then: O2
      why: Without a direct impact, the conflict is not substantial under §2635.403(b)(1).
    would_not_change:
    - id: noflip1
      if: The employee offered to recuse from all related matters
      why: Recusal does not resolve the efficiency concern that another qualified employee may not be readily assignable.
    watch_for:
    - id: watch1
      what: Requests that a simple recusal suffice
      favors:
      - O2
      why: Such requests ignore the agency’s authority to require divestiture when the conflict is central to the mission.
  lesson: When an employee’s financial interest directly affects core duties, the agency may require divestiture rather than
    rely on recusal to preserve mission integrity and public confidence.
  limits: This rule applies only where the interest is directly tied to the employee’s primary responsibilities and where
    the agency has a supplemental regulation or statutory authority to prohibit the interest; peripheral or unrelated holdings
    may be managed by recusal.
