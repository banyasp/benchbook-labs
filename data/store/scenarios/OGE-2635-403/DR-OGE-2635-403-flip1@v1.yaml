case:
  id: DR-OGE-2635-403-flip1@v1
  title: Agency Requirement to Divest Stock for Promotion [flip]
  status: needs_review
  setting: U.S. Air Force, current fiscal year, promotion review
  decider: the service's personnel office
  agent: the ethics-analysis AI module
  agent_role: decide
  situation: An Air Force officer possesses $33,778 of common stock in a leading aircraft-engine corporation. The officer
    is being evaluated for promotion to a role that will oversee the design of a next-generation fighter jet. Agency policy
    permits prohibiting or limiting financial interests when they would compel recusal from core duties or degrade mission
    effectiveness. The agency may impose a divestiture requirement as a condition of selection, rather than merely allowing
    recusal. Under the regulations, stock ownership constitutes a financial interest, and the agency may adopt supplemental
    rules to bar such holdings to safeguard impartiality.
  question: What should the personnel office do regarding the officer's stock ownership in connection with the promotion?
  options:
    O1:
      do: Prohibit the officer from keeping the stock and require its sale as a condition of promotion.
      move: act
      irreversible: true
    O2:
      do: Permit the officer to retain the stock but require recusal from any duties related to the fighter program.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee holds $33,778 of stock in a major aircraft engine manufacturer.
  - id: F2
    kind: situation
    status: confirmed
    fact: The promotion under consideration involves responsibility for development of a new fighter airplane.
  - id: F3
    kind: authority
    status: confirmed
    fact: The agency may bar or limit an employee when the interest would necessitate recusal from central duties, thereby
      materially impairing performance.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The agency’s ethics office has determined that the employee’s stock ownership would not directly or predictably
      affect engineering decisions for the fighter program.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency may restrict an employee if the interest would harm efficient mission accomplishment because no suitable
      replacement can be readily assigned.
  - id: F6
    kind: authority
    status: confirmed
    fact: The agency is authorized to require the employee to sell the stock as a condition of selection instead of merely
      allowing recusal.
  - id: F7
    kind: authority
    status: confirmed
    fact: Holding the stock qualifies as a financial interest under the applicable regulation.
  - id: F8
    kind: authority
    status: confirmed
    fact: The agency may promulgate supplemental regulations to forbid or limit financial interests to avoid the appearance
      of bias.
  - id: F9
    kind: authority
    status: assessed
    fact: The agency has delegated to the ethics-analysis AI the responsibility to identify substantial conflicts and to mandate
      divestiture.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Because the ethics office concluded the stock would not influence engineering judgments, retaining it and recusing
      from related duties would not materially impair the fighter-development mission.
  - id: C2
    facts:
    - F3
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: §2635.403(b)(1) authorizes the agency to prohibit the interest and require divestiture rather than rely on recusal.
  - id: C3
    facts:
    - F8
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Supplemental regulations may ban employee holdings that would cause a reasonable person to question impartiality,
      preserving public confidence.
  - id: C4
    facts:
    - F5
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Recusal would not leave the program without a qualified replacement because the conflict is limited to a financial
      interest.
  - id: C5
    facts:
    - F6
    - F9
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The agency must give a reasonable period (≤90 days) to divest, satisfying procedural fairness.
  reasoning:
    read: The officer's stock does not create a direct financial stake in a contractor whose products the new fighter program
      will evaluate, so the conflict is not substantial under §2635.403(b)(1).
    weighing: The agency relies on the ethics office's finding that the holding will not affect engineering decisions (C1)
      and on the assessment that recusal will not jeopardize mission efficiency (C4). Although authority to require divestiture
      exists (C2, C3), the lack of a direct conflict makes recusal the appropriate remedy, leading to O2.
    tradecraft: Issue a recusal directive citing the ethics office's assessment, document the decision in the officer's personnel
      file, and inform the ethics office of compliance.
    uncertainty: Low, given the ethics office's assessment that the interest will not influence program decisions.
    handoff: The ethics-analysis AI may generate the recusal notice, but final approval should rest with the senior ethics
      official to ensure chain-of-command compliance.
    tempting_wrong:
      option: O1
      pull: Divestiture avoids any appearance of bias.
      why_wrong: Divestiture is unnecessary because the stock does not affect the program and would impose an undue burden
        on the officer.
    rejected:
      O1: Requiring sale adds no conflict-mitigation benefit and would be disproportionate.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the agency concluded that the officer's stock would directly or predictably influence engineering decisions for
        the fighter program
      then: O1
      why: In that case the conflict would be substantial under §2635.403(b)(1), justifying divestiture.
    would_not_change:
    - id: noflip1
      if: If the officer volunteered to recuse from all matters concerning the fighter program
      why: Recusal does not resolve the efficiency concern that another qualified employee may not be readily assignable.
    watch_for:
    - id: watch1
      what: Requests that a simple recusal be sufficient
      favors:
      - O2
      why: Such requests ignore the agency's authority to require divestiture when the conflict is central to the mission.
  lesson: When an employee's financial interest is unlikely to affect core duties, the agency may allow the interest to remain
    provided the employee recuses from related responsibilities, preserving both mission efficiency and fairness.
  limits: This guidance applies only where the interest does not directly influence the employee's primary responsibilities
    and where the agency lacks a supplemental regulation or statutory authority to ban the interest; peripheral or unrelated
    holdings may be managed by recusal.
