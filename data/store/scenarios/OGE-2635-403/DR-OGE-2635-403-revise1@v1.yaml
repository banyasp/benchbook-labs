case:
  id: DR-OGE-2635-403-revise1@v1
  title: Agency Requirement to Divest Stock for Promotion [revise]
  status: needs_review
  setting: Air Force, present, promotion consideration
  decider: the agency
  agent: the ethics-assistant AI
  agent_role: decide
  situation: An Air Force employee holds $33,778 of stock in a major aircraft engine manufacturer. The employee is being considered
    for a promotion to a position that carries responsibility for developing a new fighter airplane. The agency can prohibit
    or restrict financial interests that would require recusal from central duties or impair mission efficiency. The agency
    may require divestiture of a financial interest as a condition of selection rather than allowing recusal. Stock ownership
    is defined as a financial interest under agency regulations. The agency may also issue supplemental regulations to prohibit
    such holdings to preserve impartiality.
  question: What should the agency do regarding the employee's stock ownership in connection with the promotion?
  options:
    O1:
      do: The agency disallows the employee to retain the stock and requires its sale as a condition of selection.
      move: act
      irreversible: true
    O2:
      do: The agency allows the employee to retain the stock and requires recusal from related duties.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee holds $33,778 of stock in a major aircraft engine manufacturer.
  - id: F2
    kind: situation
    status: confirmed
    fact: The promotion under consideration involves responsibility for development of a new fighter airplane.
  - id: F3
    kind: authority
    status: confirmed
    fact: The agency may prohibit or restrict an employee if holding the interest would require recusal from central duties,
      materially impairing performance.
  - id: F4
    kind: authority
    status: confirmed
    fact: The agency may prohibit or restrict an employee if the interest would adversely affect efficient mission accomplishment
      because another employee cannot be readily assigned.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency can require the employee to sell the stock as a condition of selection rather than allowing recusal.
  - id: F6
    kind: authority
    status: confirmed
    fact: Stock ownership by the employee is a financial interest within the meaning of the regulation.
  - id: F7
    kind: authority
    status: confirmed
    fact: The agency may issue supplemental regulations to prohibit or restrict financial interests to avoid appearance of
      bias.
  - id: F8
    kind: authority
    status: assessed
    fact: The agency has delegated authority to the ethics-assistant AI to determine substantial conflicts and require divestiture.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Holding the stock would not require the employee to abandon core duties; a simple recusal can be arranged without
      materially impairing the fighter-development effort.
  - id: C2
    facts:
    - F3
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: §2635.403(b)(1) authorizes the agency to prohibit the interest and require divestiture rather than rely on recusal.
  - id: C3
    facts:
    - F7
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Supplemental regulations may ban employee holdings that would cause a reasonable person to question impartiality,
      preserving public confidence.
  - id: C4
    facts:
    - F4
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Although {F4} warns of replacement difficulty, the agency can reassign another qualified engineer, so recusal does
      not threaten efficient mission accomplishment.
  - id: C5
    facts:
    - F5
    - F8
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The agency must give a reasonable period (≤90 days) to divest, satisfying procedural fairness.
  reasoning:
    read: The employee's stock creates a potential conflict, but the agency can manage it through recusal without harming
      the new fighter program.
    weighing: The analysis now emphasizes that recusal can preserve mission integrity (C1, C4) while avoiding unnecessary
      divestiture; legal authority to force divestiture (C2, C3) is viewed as permissive, not mandatory, when a workable recusal
      exists.
    tradecraft: Document the recusal requirement, identify alternate staff to cover the employee's duties, and file the recusal
      notice with the ethics office; no divestiture order is issued.
    uncertainty: Moderate, because the feasibility of reassigning qualified personnel must be confirmed during implementation.
    handoff: The ethics-assistant AI drafts the recusal memorandum; senior ethics officials review and approve to ensure compliance
      with agency policy.
    tempting_wrong:
      option: O1
      pull: Divesting the stock would protect the agency from any appearance of bias but would disrupt the employee's personal
        finances.
      why_wrong: Divestiture is unnecessary when a clean recusal can eliminate the conflict without impairing the program.
    rejected:
      O1: Requiring divestiture imposes an undue burden and is not needed because the conflict can be effectively mitigated
        by recusal.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: If the agency interprets §2635.403(b) as permitting recusal when the conflict is not central to the employee’s primary
        duties
      then: O1
      why: The agency would then favor divestiture as the safer route, preserving the appearance of impartiality.
    would_not_change:
    - id: noflip1
      if: The employee offered to recuse from all related matters
      why: Recusal does not resolve the efficiency concern that another qualified employee may not be readily assignable.
    watch_for:
    - id: watch1
      what: Requests that a simple recusal suffice
      favors:
      - O2
      why: Such requests ignore the agency's authority to require divestiture when the conflict is central to the mission.
  lesson: When an employee's financial interest can be insulated by recusal without harming mission performance, the agency
    may allow retention of the interest and require recusal rather than mandating divestiture.
  limits: This approach applies only when the agency can reliably reassign duties and the conflict does not directly influence
    core technical decisions; in cases of direct, mission-critical influence, divestiture remains appropriate.
