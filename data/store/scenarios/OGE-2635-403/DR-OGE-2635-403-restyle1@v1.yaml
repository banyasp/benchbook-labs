case:
  id: DR-OGE-2635-403-restyle1@v1
  title: Agency Requirement to Divest Stock for Promotion [restyle]
  status: needs_review
  setting: U.S. Air Force, current fiscal year, personnel promotion review
  decider: the agency ethics board
  agent: the AI ethics analysis tool
  agent_role: decide
  situation: A senior Air Force civilian currently holds a portfolio worth $33,778 in shares of a leading aircraft-engine
    producer. The individual is being evaluated for elevation to a billet that will oversee the design of a next-generation
    fighter aircraft. Agency policy permits the prohibition or limitation of financial holdings that would necessitate recusal
    from core duties or degrade mission efficiency. The agency may condition selection on the divestiture of such holdings
    rather than merely allowing recusal. Ownership of stock is classified as a financial interest under agency regulations,
    and the agency may promulgate supplemental rules to bar holdings that could compromise impartiality.
  question: How should the agency address the employee's stock position in the context of the promotion decision?
  options:
    O1:
      do: Mandate the sale of the stock as a prerequisite for appointment to the new position.
      move: act
      irreversible: true
    O2:
      do: Permit the employee to keep the stock but require recusal from any duties that involve the engine maker.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee possesses $33,778 of equity in a major aircraft-engine manufacturer.
  - id: F2
    kind: situation
    status: confirmed
    fact: The promotion under review entails responsibility for the development of a new fighter aircraft.
  - id: F3
    kind: authority
    status: confirmed
    fact: The agency may bar or limit an employee when the interest would obligate recusal from essential duties, thereby
      materially hampering performance.
  - id: F4
    kind: authority
    status: confirmed
    fact: The agency may bar or limit an employee when the interest would adversely affect efficient mission execution because
      a suitable replacement cannot be readily assigned.
  - id: F5
    kind: authority
    status: confirmed
    fact: The agency is authorized to require divestiture of the stock as a condition of selection rather than relying on
      recusal.
  - id: F6
    kind: authority
    status: confirmed
    fact: Holding the stock constitutes a financial interest as defined by the regulation.
  - id: F7
    kind: authority
    status: confirmed
    fact: The agency may adopt supplemental regulations that prohibit or restrict financial interests to avoid the appearance
      of bias.
  - id: F8
    kind: authority
    status: assessed
    fact: The agency has delegated to the AI ethics analysis tool the authority to identify substantial conflicts and to impose
      divestiture requirements.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Retaining the engine-maker stock would force the employee to recuse from the core responsibilities of fighter development,
      which would materially diminish the program's effectiveness.
  - id: C2
    facts:
    - F3
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Section 2635.403(b)(1) empowers the agency to prohibit the interest and to require divestiture instead of relying
      on recusal.
  - id: C3
    facts:
    - F7
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Supplemental rules may bar employee holdings that a reasonable observer would view as compromising impartiality,
      thereby safeguarding public confidence.
  - id: C4
    facts:
    - F4
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Recusal would leave no readily assignable substitute, undermining efficient mission accomplishment.
  - id: C5
    facts:
    - F5
    - F8
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The agency must provide a reasonable period (no more than 90 days) for divestiture, satisfying procedural fairness
      requirements.
  reasoning:
    read: The employee's equity stake creates a direct financial connection to a contractor whose products the new fighter
      program will assess, triggering a substantial conflict under §2635.403(b).
    weighing: The agency relies on the explicit authority to demand divestiture (C2) and the overarching goal of preserving
      mission integrity (C1, C4). Support from supplemental regulation (C3) further justifies eliminating even the perception
      of bias. Due-process safeguards (C5) confirm the action's legality, leading to O1 as the appropriate resolution.
    tradecraft: Issue a formal divestiture order citing §2635.403(b), impose a 90-day compliance deadline, record the decision
      in the employee's personnel file, and inform the ethics office.
    uncertainty: Minimal; the regulatory example directly addresses this circumstance.
    handoff: The AI ethics analysis tool may draft the directive, but final sign-off should rest with the senior ethics official
      to maintain chain-of-command integrity.
    tempting_wrong:
      option: O2
      pull: Recusal appears less intrusive to the employee's personal finances.
      why_wrong: Recusal would still impair mission performance and may be infeasible if no qualified replacement exists.
    rejected:
      O2: Recusal alone does not satisfy the agency's mandate to prevent substantial conflicts and could hinder mission efficiency.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The agency concluded that the employee's stock would not directly or predictably influence engineering judgments
        for the fighter program
      then: O2
      why: Absent a direct impact, the conflict does not rise to the level of a substantial conflict under §2635.403(b)(1).
    would_not_change:
    - id: noflip1
      if: The employee volunteered to recuse from every matter involving the engine maker
      why: Recusal does not resolve the efficiency concern that a suitable replacement may not be readily assignable.
    watch_for:
    - id: watch1
      what: Arguments that a simple recusal should suffice
      favors:
      - O2
      why: Such arguments overlook the agency's statutory authority to require divestiture when the conflict is central to
        mission execution.
  lesson: When an employee's financial interest directly intersects with core duties, the agency may require divestiture rather
    than rely on recusal to protect mission integrity and public trust.
  limits: This principle applies only when the interest is directly tied to the employee's primary responsibilities and the
    agency possesses supplemental or statutory authority to prohibit the interest; peripheral holdings may be managed through
    recusal.
