    episode_focus: The decision point is whether to prioritize immediate collection or first ensure personnel understand the
      authorities and protections governing intelligence activity in the homeland. The source gives constitutional rights
      and the risk of inadvertent collection of unrelated U.S.-person information as reasons for the chosen sequence; exclude
      the operational details of collection and the general description of oversight procedures.
