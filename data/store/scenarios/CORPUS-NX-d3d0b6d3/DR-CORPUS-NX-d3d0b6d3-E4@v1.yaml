case:
  id: DR-CORPUS-NX-d3d0b6d3-E4@v1
  title: Preparation Before Intelligence Activity
  status: draft
  setting: The Southern Border, during JTF-SB intelligence operations in the homeland.
  decider: JTF-SB's J2 and subordinate intelligence sections
  agent: JTF-SB's J2 and subordinate intelligence sections
  agent_role: decide
  situation: JTF-SB is preparing to exercise its intelligence capabilities in the homeland. The intelligence mission is important,
    and rapid use of those capabilities is a priority. The intelligence activity operates under authorities that balance the
    acquisition of essential information with individual interests and constitutional protections. In this setting, inadvertent
    collection of information about Americans unrelated to the mission is assessed as a significant risk. The decision is
    how to sequence intelligence activity and personnel preparation.
  question: What should JTF-SB's J2 and subordinate intelligence sections do about the sequencing of immediate intelligence
    collection and personnel preparation?
  options:
    O1:
      do: JTF-SB's J2 and subordinate intelligence sections will deprioritize immediate intelligence collection and complete
        personnel preparation before beginning activity.
      move: act
      irreversible: false
    O2:
      do: JTF-SB's J2 and subordinate intelligence sections will prioritize immediate intelligence collection and begin activity
        before personnel complete preparation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: DoD and Intelligence Community oversight is intended to enable intelligence missions while ensuring they do not
      violate Americans' everyday rights and liberties.
  - id: F2
    kind: situation
    status: confirmed
    fact: The need to balance intelligence activity with constitutional protections is especially important when activity
      takes place in the homeland.
  - id: F3
    kind: authority
    status: confirmed
    fact: JTF-SB derives its intelligence authority and responsibility from Executive Order 12333.
  - id: F4
    kind: authority
    status: confirmed
    fact: Executive Order 12333 assigns the military services responsibility for collecting, producing, and disseminating
      military and military-related foreign intelligence and counterintelligence.
  - id: F5
    kind: capability
    status: confirmed
    fact: JTF-SB considered it important to exercise its intelligence collection capabilities rapidly.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The potential for inadvertent collection of Americans' information unrelated to JTF-SB's mission is high in its
      operating environment.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: usp_privacy
    favors:
    - O1
    weight: strong
    why: Oversight must enable the intelligence mission without violating Americans’ rights and liberties; that balance is
      especially important for activity in the homeland.
  - id: C2
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The assessed high risk of inadvertently collecting Americans’ information unrelated to the mission supports ensuring
      personnel are prepared before activity begins.
  - id: C3
    facts:
    - F5
    equity: tempo
    favors:
    - O2
    weight: weak
    why: Rapid use of collection capabilities mattered, but personnel first had to be fully trained and prepared to avoid
      infringing Americans’ constitutional rights.
  reasoning:
    read: This is a sequencing decision, not a choice to abandon the intelligence mission. The pull toward immediate collection
      is real, but homeland activity carries a high assessed risk of inadvertently collecting Americans’ unrelated information;
      the trap is treating speed as more important than understanding the authorities and protections that constrain the mission.
    weighing: The constitutional balance and the assessed risk of unrelated U.S.-person collection weigh strongly toward {O1}
      {C1} {C2}. The value of rapid collection weighs the other way, but less strongly {C3}. The balance depends on the risk
      of infringement and whether personnel are sufficiently prepared to carry out the mission within its authorities; preparation
      comes first despite the importance of speed.
    tradecraft: Before collection begins, confirm that personnel who will undertake the activity have completed the preparation
      needed to understand the governing authorities and protections. Record the basis for the sequence and the readiness
      determination, then proceed only within the applicable authority. This is implementation guidance derived from the stated
      rationale.
    uncertainty: The risk of inadvertent collection is assessed as high, but no numerical threshold for that assessment or
      exception permitting collection before personnel are prepared is specified. The length of time preparation entails is
      also unspecified.
    handoff: J2 and subordinate intelligence sections should own the sequencing decision. They can involve intelligence oversight
      officers for guidance and to address concerns, helping personnel accomplish the mission while adhering to constitutional
      protections; no separate approval requirement is specified.
    tempting_wrong:
      option: O2
      pull: Rapidly exercising intelligence capabilities is important to the mission.
      why_wrong: Mission urgency does not remove the need to understand the authorities and protections before intelligence
        activity in the homeland.
    rejected:
      O2: Immediate collection was not chosen because full preparation to avoid infringing Americans’ constitutional rights
        was considered necessary before exercising the capabilities.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A binding direction expressly required immediate collection before personnel completed preparation and specified
        authority and safeguards that protected constitutional interests.
      then: O2
      why: That would change the governing constraint on sequencing and the balance between urgency and protection, rather
        than merely restating the importance of rapid collection.
    would_not_change:
    - id: noflip1
      if: Rapid collection remains important to the mission.
      why: Rapid collection is important, but personnel preparation remains necessary to protect constitutional rights.
    - id: noflip2
      if: The operating environment continues to present a high risk of inadvertently collecting Americans’ unrelated information.
      why: That risk reinforces the reason to prepare personnel before activity begins.
    watch_for:
    - id: watch1
      what: Whether personnel understand and consistently follow the measures governing intelligence activity.
      favors:
      - O1
      why: That understanding and adherence are necessary to reduce the risk of inadvertent collection unrelated to the mission.
  lesson: When intelligence activity in the homeland risks infringing individual rights, mission urgency does not by itself
    justify beginning before personnel understand their authorities and protections. Sequence preparation first when it is
    necessary to keep the activity within those bounds.
  limits: This reasoning addresses the choice to prepare personnel before JTF-SB intelligence activity in the homeland; it
    does not establish a universal rule for every intelligence mission or resolve an unmentioned emergency exception. It also
    does not determine the scope of any authority beyond the facts given.
  library:
    domain: intel-oversight
    family: CORPUS-NX-d3d0b6d3
