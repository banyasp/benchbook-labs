case:
  id: DR-CORPUS-NX-d3d0b6d3-E6@v1
  title: Border Airspace Authority
  status: draft
  setting: The Southern Border, June 2025, with the President, FAA, DoW, and DHS considering counter-UAS authorities.
  decider: The President
  agent: The President
  agent_role: decide
  situation: The FAA maintains a five-nautical-mile ADIZ between the United States and Mexico, but direct enforcement depends
    on DoW and DHS authorities. Under 10 U.S.C. 130i, the Secretary of War may designate covered facilities or assets and
    authorize actions to mitigate UAS threats to them. JTF-SB’s covered-facility nomination process requires substantial coordination
    and could leave coverage limited to disconnected parcels rather than the whole border. The border also includes private
    property, an Indian reservation, and public waterways. The President could direct broader geographic coverage through
    an Executive Order, while existing parcel-by-parcel authorities and current ADIZ enforcement remain available.
  question: What should the President do about whether to direct broader covered-facility authority and ADIZ enforcement along
    the Southern Border?
  options:
    O1:
      do: The President issues an Executive Order directing FAA to harden the ADIZ and the Secretary of War to designate the
        full border zone as a covered facility under 10 U.S.C. 130i.
      move: act
      irreversible: false
    O2:
      do: The President asks the Secretary of War and the DHS Secretary for an expedited legal and operational assessment
        of full-zone designations before issuing an Executive Order.
      move: ask
      irreversible: false
      to: the Secretary of War and the DHS Secretary
    O3:
      do: The President rejects the blanket Executive Order and retains the current ADIZ enforcement and parcel-by-parcel
        authorities under 10 U.S.C. 130i and 6 U.S.C. 124n.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Under 10 U.S.C. 130i, the Secretary of War may take, and authorize members of the Armed Forces to take, actions
      necessary to mitigate UAS threats to the safety or security of a covered facility or asset.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Secretary of War identifies covered facilities or assets, which must be places or things in the United States
      related to specified DoW missions.
  - id: F3
    kind: situation
    status: confirmed
    fact: The FAA maintains a five-nautical-mile ADIZ between the United States and Mexico and publishes its restrictions
      in Notices to Airmen.
  - id: F4
    kind: capability
    status: assessed
    fact: Direct enforcement of the ADIZ depends on DoW acting under 10 U.S.C. 130i and DHS acting under 6 U.S.C. 124n; piecemeal
      authorities would leave enforcement minimal.
  - id: F5
    kind: situation
    status: assessed
    fact: Processing even National Defense Area nominations requires substantial coordination and time, and the appropriate
      commander to sign a request is unclear.
  - id: F6
    kind: situation
    status: assessed
    fact: Covered-facility designations limited to National Defense Areas would leave disconnected parcels and gaps along
      a border that also includes private property, an Indian reservation, and public waterways.
  - id: F7
    kind: authority
    status: confirmed
    fact: Under 6 U.S.C. 124n, the DHS Secretary may act or authorize personnel to act against UAS threats to covered facilities
      or assets.
  - id: F8
    kind: authority
    status: assessed
    fact: The proposed broader framework would treat UAS incursions as per se threats without requiring an imminent physical
      threat, while requiring compliance with LOAC principles such as proportionality.
  - id: F9
    kind: situation
    status: confirmed
    fact: In June 2025, the President recognized intensified UAS threats to the homeland and the need to restore American
      sovereignty over its skies.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Even the easiest nominations require substantial coordination and time, and designating only National Defense Areas
      would leave disconnected parcels and significant gaps. The source favors a broader approach that can address the whole
      border more quickly and completely.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The ADIZ exists, but direct enforcement depends on DoW and DHS authorities; if those authorities cover only parcels,
      enforcement remains minimal. Broader designations would give the ADIZ practical enforcement support.
  - id: C3
    facts:
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The President has recognized intensified UAS threats and the need to restore sovereignty over American skies. The
      source presents an Executive Order as a way to make counter-UAS action a whole-of-government priority aligned with that
      objective.
  - id: C4
    facts:
    - F1
    - F2
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The source argues that 10 U.S.C. 130i can support a geographic designation because it does not require a covered
      facility to be DoW-controlled land, or land at all. The proposed framework would treat incursions as per se threats
      rather than require an imminent physical threat, while still requiring compliance with LOAC principles such as proportionality.
  reasoning:
    read: 'The ADIZ is already in place, but its restrictions do not by themselves provide direct enforcement. The trap is
      treating parcel-by-parcel nominations as an adequate answer: the process is slow, unclear in its signatory arrangements,
      and would leave gaps across a border that includes non-DoW land and waterways. The source sees broader designation,
      rather than the existing patchwork, as the route to more complete operational control.'
    weighing: The source gives decisive weight to the gaps and delay in the current process, the limited enforcement available
      under piecemeal authorities, and the President's stated concern about UAS threats. It recommends directing FAA to harden
      the ADIZ and directing the Secretary of War to designate the full border zone under 130i, with parallel DHS action also
      contemplated. The balance depends on the source's interpretation that 130i permits a geographic designation beyond DoW-controlled
      land and on continued compliance with LOAC principles, including proportionality.
    tradecraft: Issue the Executive Order with clear direction to FAA and the Secretary of War, and coordinate with DHS on
      the parallel authority the source identifies. Record the statutory basis, the intended geographic scope, the agencies'
      respective responsibilities, and how continuing legal constraints will be observed. Keep the decision and its review
      at the level of authority and policy, not particular counter-UAS tools.
    uncertainty: The source argues that 130i does not require the covered facility to be DoW-controlled land, but the passage
      does not resolve every question about the scope or application of that interpretation. It also does not establish how
      quickly the agencies can implement the broader framework or address every legal issue that could arise in application.
    handoff: The President should decide the policy and direct its implementation through FAA and the Secretary of War, while
      involving DHS because its parallel authority is part of the proposed whole-of-government approach. The agencies should
      clarify their roles and legal basis without allowing the existing parcel-by-parcel process to substitute for the broader
      decision.
    tempting_wrong:
      option: O2
      pull: Requesting an expedited assessment before acting appears cautious given the breadth of the proposed designation
        and the unclear signatory process for current nominations.
      why_wrong: The source emphasizes that processing is already onerous and time-consuming, that parcel-based authority
        leaves substantial gaps, and that the threat calls for a quick, coordinated response.
    rejected:
      O2: The source favors immediate Presidential direction because another assessment-first step risks prolonging a slow
        process that would still leave enforcement gaps.
      O3: Retaining current enforcement and parcel-by-parcel authorities would preserve the very piecemeal coverage and minimal
        direct enforcement that the source identifies as inadequate.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: A legal assessment establishes that 10 U.S.C. 130i cannot support the proposed full-zone designation.
      then: O2
      why: The source's recommendation depends on its interpretation that 130i permits designation beyond DoW-controlled land;
        if that premise fails, further legal assessment should precede the Executive Order.
    - id: flip2
      if: The proposed treatment of incursions as per se threats cannot be implemented consistently with applicable legal
        constraints, including LOAC proportionality.
      then: O2
      why: The source presents the broader authority as subject to LOAC principles; a material unresolved conflict would warrant
        reassessment before implementation.
    would_not_change:
    - id: noflip1
      if: The proposed zone includes private property, an Indian reservation, or public waterways.
      why: 'Those features are part of the source''s case for full-zone coverage: they show why designations confined to federal
        parcels would leave gaps, and the source argues that 130i does not require covered land to be controlled by DoW.'
    watch_for:
    - id: watch1
      what: Whether FAA, DoW, and DHS can establish a workable, legally supported division of responsibility for the broader
        zone.
      favors:
      - O2
      why: The proposed approach relies on coordinated agency action, and the source identifies coordination burdens in the
        existing process.
  lesson: When existing authorities are slow, fragmented, and leave material gaps, assess whether a broader legal designation
    can address the whole problem rather than relying on a patchwork. Pair an expanded authority decision with a clear statutory
    basis, interagency responsibilities, and continuing legal constraints.
  limits: This recommendation rests on the source's interpretation that 10 U.S.C. 130i permits the proposed geographic designation
    and on the stated Southern Border conditions. It does not determine how any particular counter-UAS action should be carried
    out, nor does it resolve legal questions beyond the source's discussion.
