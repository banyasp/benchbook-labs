case:
  id: DR-CORPUS-NX-f74b0cbb-E3@v1
  title: Choosing an Early Resistance Campaign Posture
  status: draft
  setting: Iraq and Syria, during early UW campaign planning by the UW team
  decider: the UW team
  agent: the UW team
  agent_role: decide
  situation: The UW team is considering the early posture of a resistance movement in areas where ISIL has control or is expanding.
    No particular Iraqi or Syrian subgroup has been selected to represent the movement, and potential partners present different
    advantages and risks. The movement is expected to require careful development over time, and a well-built movement could
    remain useful for years. ISIL is assessed as likely to threaten U.S. interests into the future and has substantial control
    and demonstrated brutality. Premature direct action could expose the movement to a swift death.
  question: What should the UW team do about the resistance movement’s early campaign posture?
  options:
    O1:
      do: The UW team should approve direct action as its early posture.
      move: act
      irreversible: false
    O2:
      do: The UW team should reject direct action and adopt an indirect posture.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: ISIL is likely to threaten U.S. interests well into the future.
  - id: F2
    kind: capability
    status: confirmed
    fact: ISIL has a high level of control and has demonstrated brutality.
  - id: F3
    kind: situation
    status: confirmed
    fact: Potential resistance partners include multiple subgroups of Iraqi and Syrian society.
  - id: F4
    kind: situation
    status: confirmed
    fact: Different potential partner groups offer different advantages and risks to the UW team and the government.
  - id: F5
    kind: situation
    status: confirmed
    fact: The resistance movement should be built carefully over time.
  - id: F6
    kind: situation
    status: assessed
    fact: A correctly built resistance movement could be an asset for years.
  - id: F7
    kind: capability
    status: assessed
    fact: Premature direct attacks against ISIL could bring a swift death to the movement.
  considerations:
  - id: C1
    facts:
    - F1
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Because ISIL is likely to threaten U.S. interests into the future, a carefully built movement could remain useful
      for years; developing it over time avoids risking its early loss.
  - id: C2
    facts:
    - F2
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: 'ISIL''s substantial control and demonstrated brutality make premature direct attacks especially dangerous: they
      could bring the movement a swift death.'
  - id: C3
    facts:
    - F3
    - F4
    - F5
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: Potential partners differ in advantages and risks, and the movement should be built carefully regardless of partner;
      this supports a cautious early posture while those risks are managed.
  reasoning:
    read: The decision is about preserving a resistance movement's prospects in an area where ISIL has substantial control
      and has shown brutality. The trap is to treat the long-term threat as a reason for immediate direct action, even though
      premature direct attacks could destroy the movement before it becomes a durable asset.
    weighing: 'The recommendation favors {O2}: a long-term threat makes a correctly built movement valuable {C1}, while ISIL''s
      control and brutality make premature direct action a grave risk to that movement {C2}. The varied advantages and risks
      of potential partners reinforce careful development, not a rush to direct action {C3}. The balance depends particularly
      on the assessed threat to the movement from ISIL''s present capability.'
    tradecraft: Keep the decision at the level of early posture. Record the reasons for choosing indirect action and the assumptions
      about ISIL's control, brutality, and the movement's development; do not turn this decision into instructions for carrying
      out attacks.
    uncertainty: No partner subgroup is selected, and no subgroup-specific risk assessments are provided. The point at which
      the movement would be ready for a different posture is also unspecified.
    handoff: The UW team is the stated decider. No separate approving authority is identified; as a decision practice, the
      team should involve appropriate policy or command reviewers if its governing process requires them, particularly before
      changing the posture.
    tempting_wrong:
      option: O1
      pull: The expectation that ISIL will threaten U.S. interests well into the future can create pressure to act directly
        at once.
      why_wrong: 'That urgency does not resolve the central risk: premature direct attacks against an organization with ISIL''s
        control and brutality could bring a swift death to the movement.'
    rejected:
      O1: Direct action is not recommended as the early posture because premature direct attacks could destroy the movement.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessment changed so that ISIL's control and brutality no longer made premature direct action likely to bring
        a swift death to the movement.
      then: O1
      why: The principal reason for preferring an indirect early posture would be materially reduced, making direct action
        a possible alternative for the UW team to reassess.
    would_not_change:
    - id: noflip1
      if: A different Iraqi or Syrian subgroup were selected as the movement's partner.
      why: Partner groups have different advantages and risks, but careful development remains necessary regardless of the
        partner; changing partners alone would not remove that need.
    watch_for:
    - id: watch1
      what: Whether updated assessments continue to support the view that ISIL has substantial control and poses a threat
        of swift destruction to a movement acting directly.
      favors:
      - O2
      why: Those assessments bear directly on the reason for recommending an indirect early posture.
  lesson: When a resistance movement is expected to have long-term value, do not confuse the urgency of the threat with a
    reason to expose the movement to premature direct action. Where the adversary's control and brutality could rapidly destroy
    a fledgling movement, favor an indirect early posture and develop the movement carefully.
  limits: This reasoning addresses only the early choice between direct and indirect action in the stated setting. It does
    not establish a permanent posture, select a partner subgroup, or supply criteria for any later change.
