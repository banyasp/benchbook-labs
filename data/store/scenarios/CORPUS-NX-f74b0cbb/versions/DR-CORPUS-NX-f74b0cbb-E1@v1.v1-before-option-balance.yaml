case:
  id: DR-CORPUS-NX-f74b0cbb-E1@v1
  title: Choosing the Anti-ISIL Analysis Focus
  status: draft
  setting: Summer 2015; northeastern Syria and northwestern Iraq; the authors’ analysis of the anti-ISIL effort.
  decider: The authors
  agent: The authors
  agent_role: decide
  situation: By summer 2015, ISIL controlled approximately 35,000 square miles in northeastern Syria and northwestern Iraq.
    Politicians and military leaders continued to search for immediate military actions to stem ISIL’s push toward Baghdad.
    The authors regarded such actions as necessary, but they were choosing not to make them the analysis’s focus. They were
    deciding how to frame an analysis of the anti-ISIL effort, including its economic aspects and time horizon. The economic
    effects under consideration could emerge in the short term or, for some areas, months and years later. The authors linked
    longer-run regional stability to a solid political and economic foundation.
  question: What should the authors do about the analysis’s central focus?
  options:
    O1:
      do: The authors include immediate military action in the analysis's central focus and treat economic effects as secondary.
      move: act
      irreversible: false
    O2:
      do: The authors exclude immediate military action from the analysis's central focus and center economic effects and
        longer-run stability.
      move: act
      irreversible: false
    O3:
      do: The authors balance immediate military action and longer-run economic effects as coequal parts of the analysis.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: By summer 2015, ISIL controlled approximately 35,000 square miles in northeastern Syria and northwestern Iraq.
  - id: F2
    kind: situation
    status: confirmed
    fact: Politicians and military leaders continued to search for immediate military actions to stem ISIL’s push toward Baghdad.
  - id: F3
    kind: situation
    status: assessed
    fact: The authors regarded immediate military actions as necessary.
  - id: F4
    kind: situation
    status: confirmed
    fact: The authors chose not to make immediate military actions the focus of the analysis.
  - id: F5
    kind: situation
    status: confirmed
    fact: The analysis centers on the economic aspects of the anti-ISIL effort and uses a longer time horizon.
  - id: F6
    kind: situation
    status: assessed
    fact: Some operations addressing economic critical requirements may produce both short- and long-run outcomes.
  - id: F7
    kind: situation
    status: assessed
    fact: Outcomes related to business opportunities, agricultural production, and essential services primarily appear months
      and years in the future.
  - id: F8
    kind: situation
    status: assessed
    fact: The authors assessed that neglect of critical economic requirements over time partially precipitated ISIL’s rise
      in Syria and allowed its rapid expansion into Northern Iraq.
  - id: F9
    kind: situation
    status: assessed
    fact: The authors assessed that long-run regional stability depends on a solid political and economic foundation.
  considerations:
  - id: C1
    facts:
    - F5
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The authors chose an economic focus and longer horizon because outcomes in areas such as business opportunities,
      agriculture, and essential services primarily emerge months or years later.
  - id: C2
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The authors assessed that neglect of critical economic requirements over time partly precipitated ISIL’s rise in
      Syria and enabled its rapid expansion into Northern Iraq, supporting sustained attention to economic factors.
  - id: C3
    facts:
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The authors linked long-run regional stability to a solid political and economic foundation, which supports centering
      the analysis on longer-run economic effects.
  - id: C4
    facts:
    - F2
    - F3
    - F6
    equity: tempo
    favors:
    - O3
    weight: weak
    why: Immediate military actions were regarded as necessary, and some economic operations may have short-run as well as
      long-run outcomes; these points counsel against treating the economic focus as a claim that immediate needs do not matter.
  reasoning:
    read: 'The choice is how to focus the analysis, not whether immediate military action is necessary: the authors accepted
      that necessity while choosing a longer economic time horizon. The trap is to let the urgency of immediate action determine
      the analysis’s focus, even though some relevant economic outcomes take months or years to appear.'
    weighing: 'The authors’ stated reasons favor {O2}: they assessed that long-term neglect of economic requirements partly
      contributed to ISIL’s rise and expansion {C2}, and that regional stability depends on a sound political and economic
      foundation {C3}. The delayed effects of business opportunities, agriculture, and essential services make the longer
      view pertinent {C1}. The need for immediate military action remains acknowledged, and some economic effects may also
      be short-term {C4}; neither point requires making military action the analysis’s central focus.'
    tradecraft: State clearly that the analysis concerns economic aspects and longer-run effects, while preserving the authors’
      distinction that immediate military action is necessary but outside this analysis’s focus. Keep short-run and longer-run
      effects distinct and make the stated assumptions visible.
    uncertainty: The paragraph gives broad assessments about economic neglect, ISIL’s expansion, and the foundation for stability,
      but does not quantify those relationships or resolve how particular economic effects would unfold.
    handoff: This is presented as the authors’ choice of analytic scope. No referral or separate approval authority is identified;
      the rationale and limits of the chosen scope should be made clear to readers.
    tempting_wrong:
      option: O1
      pull: Immediate military actions were necessary to stem ISIL’s push toward Baghdad.
      why_wrong: That urgency concerns the broader response, but the authors explicitly chose to focus this analysis on economic
        aspects and longer-run stability rather than immediate military action.
    rejected:
      O1: The authors acknowledged that immediate military action was necessary but chose not to make it the analysis’s central
        focus.
      O3: The authors selected an economic focus and longer time horizon rather than treating military action and economic
        effects as coequal analytic subjects.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The central question instead became how to assess immediate military actions to stem ISIL’s push toward Baghdad.
      then: O1
      why: A decision question centered on immediate military action would make that subject, rather than longer-run economic
        effects, the analysis’s central focus.
    - id: flip2
      if: The analysis were tasked to give equal weight to immediate military action and long-run economic effects.
      then: O3
      why: An explicit coequal mandate would support balancing the two subjects rather than choosing the economic focus described
        here.
    would_not_change:
    - id: noflip1
      if: Immediate military actions remained necessary, as the authors assessed.
      why: Necessity of those actions does not by itself change the authors’ separate choice about the central focus of this
        analysis.
    watch_for:
    - id: watch1
      what: Whether the economic effects under consideration are short-term, long-term, or both.
      favors:
      - O2
      why: The authors distinguish effects that may appear in both time horizons from those primarily manifested months or
        years later, which bears on the value of a longer analytic view.
  lesson: A matter can be urgent and necessary without being the proper center of every analysis. Choose the analytic focus
    that addresses the question’s relevant time horizon and underlying causes, while stating clearly what the chosen scope
    does not displace.
  limits: This reasoning concerns the authors’ analytic focus in the summer 2015 anti-ISIL context; it does not decide the
    merits or conduct of any military action. It also does not establish that economic factors alone determine regional stability.
