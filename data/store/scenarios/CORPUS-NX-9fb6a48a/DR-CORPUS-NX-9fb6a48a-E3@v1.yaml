case:
  id: DR-CORPUS-NX-9fb6a48a-E3@v1
  title: Jordan’s September 1970 Crisis
  status: draft
  setting: Jordan, September 1970; the royal government.
  decider: the king
  agent: the king
  agent_role: decide
  situation: On September 15, the fedayeen took control of Irbid. Three hijacked airliners were blown up after their passengers
    were evacuated, and 54 people were held hostage while the PFLP demanded the release of Palestinians imprisoned in several
    countries. The royal palace compound came under heavy fire. The king believed that Iraqis were working with the PFLP to
    overthrow him. The king had appealed to Washington to restrain Israel from aggravating the situation.
  question: What should the king do in response to the fedayeen’s seizure of Irbid and the wider threat to his rule?
  options:
    O1:
      do: The king authorizes military action to restore government control.
      move: act
      irreversible: true
    O2:
      do: The king declines military action and retains the existing government posture.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The fedayeen took control of Irbid on September 15.
  - id: F2
    kind: situation
    status: confirmed
    fact: Three hijacked airliners were blown up after their passengers were evacuated.
  - id: F3
    kind: situation
    status: confirmed
    fact: Fifty-four people were held hostage.
  - id: F4
    kind: situation
    status: confirmed
    fact: The PFLP demanded the release of Palestinians imprisoned in Israel, Switzerland, Britain, and Germany.
  - id: F5
    kind: situation
    status: confirmed
    fact: The royal palace compound came under heavy fire from the fedayeen.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The king believed that Iraqis were working with the PFLP to overthrow him.
  - id: F7
    kind: situation
    status: confirmed
    fact: The king appealed to Washington to restrain Israel from aggravating the situation.
  - id: F8
    kind: situation
    status: confirmed
    fact: A fourth hijacked airliner was taken to Cairo and blown up, while an attempted hijacking of a fifth flight was thwarted.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The seizure of Irbid was a direct challenge to government control, consistent with the king’s stated aim of recapturing
      the country.
  - id: C2
    facts:
    - F5
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: The palace was under heavy fire, and the king believed the Iraqis were working with the PFLP to overthrow him; together
      these formed a wider threat to his rule.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: The destroyed aircraft and people held hostage made civilian safety a serious countervailing concern, though the
      source does not identify this as the king’s stated reason for his decision.
  - id: C4
    facts:
    - F7
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The king sought to have Washington restrain Israel from aggravating the situation, showing a concern about further
      escalation; the source does not say this displaced his decision to restore control.
  reasoning:
    read: 'This was more than a local disturbance: the fedayeen had taken Irbid, the palace was under fire, and the king believed
      there was a broader effort to overthrow him. The trap is to treat the suspected Iraqi-PFLP connection as established
      fact, or to make the hostage crisis the sole issue; the source presents the connection as the king’s belief and describes
      a wider threat to his rule.'
    weighing: The source’s stated aim was recapturing the country, and the loss of control in Irbid, the attack on the palace,
      and the king’s belief about an overthrow effort support O1. The hostage crisis and his appeal to restrain Israel are
      countervailing concerns, but the source does not present them as reasons that changed his decision. The balance depends
      on whether the challenge to government control and the perceived threat to the king’s rule remain acute.
    tradecraft: As a decision practice, record the objective as restoring government control, distinguish confirmed events
      from assessed intelligence, and document the authority relied on and the basis for reassessment. Do not infer from this
      excerpt that any particular legal authorization or review process was used.
    uncertainty: The excerpt records the king’s belief that Iraqis were working with the PFLP, but does not establish that
      belief independently. It also does not set out the applicable legal authority, the expected consequences of action,
      or how the decision affected the hostages.
    handoff: The choice was the king’s. As a decision practice, he could consult responsible government and military advisers
      on the threat and authority for action, while keeping the diplomatic channel to Washington open given his appeal concerning
      Israel.
    tempting_wrong:
      option: O2
      pull: Declining action could appear to avoid further escalation amid hostage-taking and the king’s concern about Israel
        aggravating the crisis.
      why_wrong: On the source’s account, that restraint would leave the seizure of Irbid and the threat to the king’s rule
        unanswered, despite his stated aim of recapturing the country.
    rejected:
      O2: The king did not retain the existing posture; he ordered action to recapture the country in response to the loss
        of control and the wider threat to his rule.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Government control of Irbid had been restored and the immediate threat to the palace and the king’s rule had subsided.
      then: O2
      why: Without the acute control challenge and threat that drove the source’s account of the decision, the stated basis
        for authorizing action would be substantially weakened.
    would_not_change:
    - id: noflip1
      if: The king continued to ask Washington to restrain Israel from aggravating the situation.
      why: That diplomatic appeal alone would not show that the domestic challenge to government control or the king’s perceived
        threat had ended.
    watch_for:
    - id: watch1
      what: Whether the king’s assessment of Iraqi involvement with the PFLP is corroborated or materially weakened.
      favors:
      - O1
      why: The assessment contributes to the source’s account of a wider threat to the king’s rule; materially weakening it
        would reduce that part of the basis for action.
  lesson: When a government faces a direct loss of control and a perceived threat to its survival, assess the decision against
    that central purpose while separating confirmed events from intelligence judgments. Serious humanitarian and escalation
    concerns remain relevant, but should be weighed against the actual threat rather than treated as automatically decisive.
  limits: This reasoning is limited to the source’s account of the king’s choice to restore control amid an acute threat to
    his rule. The excerpt does not provide enough information to determine the legal authority for action, its likely effects,
    or whether the decision was otherwise lawful or proportionate.
