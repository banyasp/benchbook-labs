case:
  id: DR-CORPUS-NX-a0cd478c-E1@v1
  title: Medical Staff During the Headquarters Evacuation
  status: draft
  setting: CIA Headquarters and the Office of Medical Services, during the 9/11 evacuation.
  decider: The Deputy Director of OMS
  agent: The Deputy Director of OMS
  agent_role: decide
  situation: During the 9/11 evacuation, CIA Headquarters was being evacuated in anticipation of a possible attack. The Deputy
    Director of OMS had to decide whether to evacuate the medical staff or keep a limited team in the buildings. A skeleton
    medical team could assist with the evacuation and support essential personnel who remained. If the buildings were hit
    and the doctors survived, the team could serve as first responders to wounded people. The decision concerned whether any
    medical personnel should remain while the evacuation proceeded.
  question: What should the Deputy Director of OMS do with the medical staff during the evacuation?
  options:
    O1:
      do: The Deputy Director of OMS sends all medical staff out of the buildings during the evacuation.
      move: act
      irreversible: false
    O2:
      do: The Deputy Director of OMS keeps a skeleton medical team inside and sends the remaining staff out.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: An evacuation of CIA Headquarters buildings was underway on 9/11.
  - id: F2
    kind: intelligence
    status: assessed
    fact: A possible attack on CIA Headquarters was anticipated.
  - id: F3
    kind: authority
    status: assessed
    fact: The Deputy Director of OMS had subordinates in the buildings whom he could direct.
  - id: F4
    kind: situation
    status: assessed
    fact: Senior doctors were in their offices.
  - id: F5
    kind: capability
    status: assessed
    fact: A skeleton medical team could assist with the evacuation.
  - id: F6
    kind: situation
    status: assessed
    fact: Essential personnel were expected to remain in the buildings and need support.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The buildings might be hit.
  - id: F8
    kind: capability
    status: assessed
    fact: If the buildings were hit and the doctors survived, the medical team could serve as first responders to wounded
      people.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: A limited medical team could assist with the evacuation, and the Deputy Director retained one to provide leadership
      to that team.
  - id: C2
    facts:
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Essential personnel were expected to remain and need support; keeping a skeleton team would provide that support.
  - id: C3
    facts:
    - F7
    - F8
    equity: civilian_life
    favors:
    - O2
    weight: weak
    why: If the buildings were hit and the doctors survived, the retained team could respond to wounded people.
  - id: C4
    facts:
    - F2
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Keeping any staff in buildings facing a possible attack exposed them to danger; the Deputy Director limited that
      exposure by sending most subordinates out.
  reasoning:
    read: 'This was not simply a choice between keeping the entire medical staff and evacuating everyone: the Deputy Director
      could send most staff out while retaining a limited team for evacuation support, essential personnel, and a possible
      response to wounded people. The trap is to treat the possible attack as either a reason to abandon all support or as
      a reason to overlook the danger to those who remain.'
    weighing: The Deputy Director retained a skeleton team to provide leadership, assist the evacuation, and support essential
      personnel who stayed. There was also a conditional benefit if the buildings were hit and the doctors survived. Those
      purposes favor {O2}; the possible attack weighs against exposing more staff, and the Deputy Director limited that exposure
      by sending most subordinates out. The balance depends on the continuing need for support and whether a limited team
      can contribute without an unacceptable risk.
    tradecraft: Keep the retained team limited to the support role described, send the remaining medical staff out, and record
      the purpose for retaining the team and the conditions that would end that need.
    uncertainty: The likelihood or timing of an attack, the degree of danger to the retained team, and how long support would
      be needed are not specified. The potential response to wounded people is conditional on both a hit and the doctors'
      survival.
    handoff: The Deputy Director should make the staffing decision within the authority to direct subordinates. Coordinate
      the limited team's support with those managing the evacuation and the essential personnel remaining in the buildings.
    tempting_wrong:
      option: O1
      pull: Sending everyone out avoids retaining medical staff in buildings facing a possible attack.
      why_wrong: It would also forgo the stated support to the evacuation and essential personnel, while a limited team preserved
        a possible response to wounded people and most staff were sent out.
    rejected:
      O1: The Deputy Director did not send all medical staff out because the retained skeleton team could provide leadership
        and support during the evacuation.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Essential personnel no longer needed support and the skeleton team had no meaningful role in assisting the evacuation
        or responding to wounded people.
      then: O1
      why: Without the stated benefits of retaining a team, the reason to expose any medical staff to the possible attack
        would be substantially reduced.
    - id: flip2
      if: The danger to the retained staff became so immediate that they could not safely provide the described support.
      then: O1
      why: The possible benefit of keeping a team would no longer justify retaining staff in the buildings.
    would_not_change:
    - id: noflip1
      if: No attack ultimately occurred.
      why: That later outcome would not by itself change the ex ante reasons to retain a limited team for evacuation and essential-personnel
        support.
    watch_for:
    - id: watch1
      what: Whether essential personnel remain in the buildings and continue to need medical support.
      favors:
      - O2
      - O1
      why: A continuing support need favors retaining a limited team; its end reduces the reason to keep anyone inside.
  lesson: When evacuation and continuing support needs coexist, consider whether a limited team can preserve essential capability
    while sending most personnel out of danger. Reassess the balance as the support need and the threat change.
  limits: This reasoning is specific to an evacuation in which a skeleton team could assist and support personnel who remained.
    It does not establish a general rule to retain medical staff during an attack, or resolve what to do when their presence
    cannot provide meaningful support or creates unacceptable danger.
