case:
  id: DR-MOSUL-ALJADIDA-2017-1@v1
  title: Approval of strike on building housing ISIS snipers
  status: draft
  setting: Iraqi Counter Terrorism Service operation, al Jadidah district, Mosul, 17 March 2017
  decider: Target Engagement Authority
  agent: Target Engagement Authority
  agent_role: decide
  situation: On 17 March 2017, Iraqi Counter Terrorism Service forces were conducting an offensive to seize a sector of the
    al Jadidah district in Mosul. CTS visual observers saw two ISIS snipers firing from a defensive fighting position on the
    second floor of a building, but reported no civilians in the sector before the attack. The Target Engagement Authority
    positively identified the snipers and, based on the information available, determined that the engagement met the Rules
    of Engagement. The TEA selected a weapon expected to neutralize the snipers while limiting damage to the structure, and
    approved the strike.
  question: What should the Target Engagement Authority do regarding a strike on the building where two ISIS snipers are firing
    at partner forces, given no civilians were observed?
  options:
    O1:
      do: The Target Engagement Authority rejects the strike on the building.
      move: act
      irreversible: true
    O2:
      do: The Target Engagement Authority approves the strike on the building.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: CTS forces were engaged in an offensive maneuver to seize the sector from ISIS fighters on 17 March 2017.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: CTS visual observers did not identify any civilians within the sector prior to the strike.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Two ISIS snipers were observed engaging CTS soldiers from a defensive fighting position on the second story of a
      building.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Target Engagement Authority positively identified the ISIS snipers and determined the engagement was authorized
      under the Rules of Engagement.
  - id: F5
    kind: capability
    status: assessed
    fact: The TEA selected a weapon expected to neutralize the snipers while limiting damage to surrounding structures.
  - id: F6
    kind: capability
    status: assessed
    fact: The TEA expected the weapon effects to be localized to the second floor, causing no more than 16‑20% damage to the
      structure.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The TEA was unaware of civilians in the building and could not have predicted the presence of secondary explosives
      emplaced by ISIS.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: hors_de_combat
    favors:
    - O2
    weight: strong
    why: The two ISIS snipers were positively identified as combatants, making the building a valid military target under
      the principle of distinction.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The TEA selected a precision munition expected to limit damage to 16‑20% of the structure and had no intelligence
      indicating civilians were present, satisfying proportionality based on the information reasonably available.
  - id: C3
    facts:
    - F1
    - F3
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Neutralizing the snipers was deemed a military necessity to prevent unacceptable CTS casualties and to enable the
      sector seizure.
  - id: C4
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The engagement was positively identified and authorized under the applicable Rules of Engagement and the Law of Armed
      Conflict.
  reasoning:
    read: The TEA faced a situation where two ISIS snipers were firing from a second‑floor defensive position while CTS observers
      reported no civilians in the building. The trap was the unknown presence of civilians and enemy‑emplaced secondary explosives
      that later caused massive casualties.
    weighing: Applying the source’s own reasoning, the TEA weighed distinction (C1), proportionality given the expected limited
      blast (C2), military necessity to protect CTS forces (C3), and lawful authority (C4). Because each consideration strongly
      favored approval, the balance tipped toward {O2}. The unknown civilian presence was deemed an acceptable risk under
      the information available at the time.
    tradecraft: The decision was recorded in the strike cell’s after‑action report and forwarded to higher‑level oversight
      as required by ROE documentation procedures.
    uncertainty: The TEA could not verify civilian presence or the existence of secondary explosives; these unknowns created
      residual uncertainty about actual collateral damage.
    handoff: The TEA acted alone but coordinated with CTS commanders and the Iraqi Forward Air Controller, reflecting the
      joint‑force decision‑making process.
    tempting_wrong:
      option: O1
      pull: A desire to avoid any civilian risk might tempt the TEA to reject the strike.
      why_wrong: Rejecting would have left the snipers active, exposing CTS troops to continued lethal fire and likely resulting
        in greater own‑force casualties.
    rejected:
      O1: The strike was approved because the target met distinction, proportionality, necessity, and lawful authority criteria
        despite unknown civilian factors.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The TEA had positively identified civilians inside the building before the strike
      then: O1
      why: Known civilian presence would have rendered the proportionality assessment unacceptable.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Intelligence indicating enemy‑emplaced secondary explosives in future targets
      favors:
      - O2
      why: Such intelligence would require heightened precaution but does not by itself invalidate the proportionality judgment
        when civilians are not known to be present.
  lesson: When a valid military target is positively identified and no civilians are observed, the TEA may lawfully approve
    a strike that balances military necessity with proportionality, even though unknown civilian presence may exist.
  limits: This reasoning applies only when civilian presence cannot be reasonably ascertained and the target presents an imminent
    threat; it does not justify strikes where civilians are known to be present or where expected collateral damage exceeds
    proportionality thresholds.
