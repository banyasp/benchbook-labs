case:
  id: DR-MOSUL-ALJADIDA-2017-flip1@v1
  title: Approval of strike on building housing ISIS snipers [flip]
  status: needs_review
  setting: Joint Iraqi Counter-Terrorism Service operation, al-Jadidah sector, Mosul, 17 March 2017
  decider: Target Engagement Authority
  agent: Target Engagement Authority
  agent_role: decide
  situation: On 17 March 2017, Iraqi Counter-Terrorism Service units were advancing to secure a portion of the al-Jadidah
    district. Visual observers identified two ISIS snipers firing from a defensive position on the building's second floor.
    Simultaneously, thermal imagery showed heat signatures of several non-combatants on the ground floor, and the targeting
    team later confirmed that unarmed locals were present inside the structure at the time the strike was being planned.
  question: Given the confirmed presence of unarmed civilians on the ground floor, what should the Target Engagement Authority
    decide about the proposed strike on the building where ISIS snipers are engaged?
  options:
    O1:
      do: The Target Engagement Authority rejects the strike on the building.
      move: act
      irreversible: true
    O2:
      do: The Target Engagement Authority approves the strike on the building.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Iraqi Counter-Terrorism Service forces were conducting an assault to capture the al-Jadidah sector on 17 March 2017.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: CTS visual observers recorded heat signatures consistent with several non‑combatant persons on the ground floor
      of the structure during the pre‑engagement surveillance.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Two ISIS snipers were observed engaging CTS soldiers from a defensive fighting position on the second story of a
      building.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Target Engagement Authority positively identified the ISIS snipers and determined the engagement was authorized
      under the Rules of Engagement.
  - id: F5
    kind: capability
    status: assessed
    fact: The authority selected a munition intended to eliminate the snipers while minimizing damage to the structure.
  - id: F6
    kind: capability
    status: assessed
    fact: The weapon's effects were projected to be confined to the second floor, limiting structural damage to roughly 16-20
      % of the building.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The TEA’s targeting team confirmed, based on the same surveillance feed, that unarmed locals were present in the
      premises at the time of the planned attack.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: hors_de_combat
    favors:
    - O2
    weight: strong
    why: The two ISIS snipers were positively identified as combatants, making the building a legitimate military target under
      the principle of distinction.
  - id: C2
    facts:
    - F5
    - F6
    - F2
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Confirmed presence of unarmed civilians on the ground floor means that even a precision munition expected to damage
      only 16-20 % of the structure would likely cause unacceptable civilian harm, violating proportionality.
  - id: C3
    facts:
    - F1
    - F3
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Neutralizing the snipers is militarily necessary to prevent further CTS casualties and to enable the sector's capture.
  - id: C4
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The engagement was positively identified and authorized under the applicable Rules of Engagement and the Law of Armed
      Conflict.
  reasoning:
    read: The TEA faced a scenario where two ISIS snipers were firing from a second-floor position while surveillance confirmed
      unarmed civilians were present on the ground floor of the same building.
    weighing: Applying the source's own framework, the TEA evaluated distinction ({C1}), proportionality with known civilian
      presence ({C2}), military necessity ({C3}), and lawful authority ({C4}). Although the target satisfied distinction and
      necessity, the confirmed civilian presence rendered the proportionality assessment untenable, leading to a decision
      in favor of {O1}.
    tradecraft: The decision was documented in the strike cell's after-action report and forwarded to higher-level oversight
      in accordance with ROE documentation requirements.
    uncertainty: While the exact number of civilians could not be precisely counted, their confirmed presence introduced a
      level of collateral risk that exceeded acceptable thresholds.
    handoff: The TEA coordinated with CTS commanders and the Iraqi Forward Air Controller but retained final authority over
      the strike decision.
    tempting_wrong:
      option: O2
      pull: The urgency of protecting CTS troops from sniper fire might tempt the TEA to approve the strike despite civilian
        presence.
      why_wrong: Approving would likely cause civilian casualties, breaching the proportionality principle and potentially
        constituting a violation of the Law of Armed Conflict.
    rejected:
      O2: The strike is rejected because the known presence of unarmed civilians makes any expected collateral damage unacceptable,
        outweighing the benefits of neutralizing the snipers.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The TEA had no evidence of civilians inside the building before the strike
      then: O2
      why: Absence of civilian presence would have allowed the proportionality assessment to be acceptable.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Intelligence indicating enemy-emplaced secondary explosives in future targets
      favors:
      - O2
      why: Such intelligence would require heightened precaution but does not by itself invalidate the proportionality judgment
        when civilians are not known to be present.
  lesson: When reliable intelligence confirms the presence of unarmed civilians within a target, the Target Engagement Authority
    must reject the strike, even if the target is a legitimate military objective, because proportionality cannot be satisfied.
  limits: This guidance applies only when civilian presence is positively identified; it does not excuse attacks where civilians
    are absent or where expected collateral damage remains within proportionality limits.
