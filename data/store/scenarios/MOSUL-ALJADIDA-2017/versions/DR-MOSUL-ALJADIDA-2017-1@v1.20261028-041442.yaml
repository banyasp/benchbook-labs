    domain: military-operational
    family: MOSUL-ALJADIDA-2017
    source: https://www.centcom.mil/MEDIA/NEWS-ARTICLES/News-Article-View/Article/1193707/executive-summary-of-the-investigation-of-the-alleged-civilian-casualty-inciden/
    episode_focus: Whether the target engagement authority should approve a strike on two snipers firing on partner forces
      from a building, with no civilians observed in it, accepting some collateral risk to the structure.
