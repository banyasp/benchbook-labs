case:
  id: DR-MOSUL-ALJADIDA-2017-1@v1
  title: Approval of strike on building housing snipers with unknown civilian presence
  status: draft
  setting: Al Jadidah district, Mosul, Iraq, 17 March 2017, Coalition and Iraqi Counter Terrorism Service operation
  decider: Target Engagement Authority
  agent: Target Engagement Authority
  agent_role: decide
  situation: Iraqi Counter Terrorism Service forces were advancing to seize a sector of Mosul when visual observers identified
    two ISIS snipers firing from a defensive fighting position on the second floor of a building. The observers reported no
    civilians in the building before the strike. The Target Engagement Authority positively identified the snipers and judged
    the engagement permissible under the Rules of Engagement. The authority expected the strike to affect only the second
    floor of the structure. Unbeknownst to the authority, ISIS had placed a large quantity of secondary explosives in the
    building, exceeding four times the weight of the munition the authority planned to use. Seizing the sector was deemed
    a military necessity for the overall liberation effort.
  question: What should the Target Engagement Authority do regarding the proposed strike on the building?
  options:
    O1:
      do: The Target Engagement Authority rejects the strike on the building.
      move: act
      irreversible: true
    O2:
      do: The Target Engagement Authority approves the strike on the building.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two ISIS snipers were engaging Iraqi CTS soldiers from a defensive fighting position on the second floor of a building.
  - id: F2
    kind: situation
    status: confirmed
    fact: CTS visual observers did not identify any civilians in the building prior to the strike.
  - id: F3
    kind: authority
    status: confirmed
    fact: The Target Engagement Authority positively identified the snipers and determined the engagement was authorized under
      the Rules of Engagement.
  - id: F4
    kind: capability
    status: assessed
    fact: The Target Engagement Authority expected the strike effects to be localized to the second floor of the building.
  - id: F5
    kind: intelligence
    status: assessed
    fact: ISIS had emplaced a large amount of secondary explosive material in the building, more than four times the weight
      of the selected munition.
  - id: F6
    kind: situation
    status: confirmed
    fact: CTS needed to neutralize the snipers to seize the sector as part of the operation to liberate Mosul.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Target Engagement Authority operates under the applicable Rules of Engagement and Law of Armed Conflict, which
      require distinction and proportionality.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: hors_de_combat
    favors:
    - O2
    weight: strong
    why: The target was a valid military target – two ISIS snipers actively engaging CTS forces – positively identified and
      authorized under the Rules of Engagement.
  - id: C2
    facts:
    - F4
    - F2
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The TEA selected a precision munition and fuse expected to limit effects to the second floor, satisfying proportionality
      based on the information available at the time.
  - id: C3
    facts:
    - F6
    - F1
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Neutralizing the snipers was deemed a military necessity to enable CTS to seize the sector and continue the liberation
      of Mosul.
  - id: C4
    facts:
    - F5
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The TEA could not have known about the large quantity of ISIS‑emplaced secondary explosives; the lack of that intelligence
      does not invalidate the proportionality assessment made with the data at hand.
  reasoning:
    read: The situation involved two confirmed ISIS snipers firing from a second‑floor defensive position in a building where
      observers reported no civilians. The TEA positively identified the snipers and, under the ROE and LOAC, judged the strike
      lawful, expecting damage confined to the second floor. Unknown to the TEA, ISIS had stored a large secondary explosive
      charge that later caused massive collapse and civilian deaths.
    weighing: The considerations of distinction (C1), proportionality (C2), and military necessity (C3) are decisive factors
      supporting approval. The uncertainty about hidden explosives (C4) is acknowledged but deemed insufficient to overturn
      the decision because the TEA could not have reasonably foreseen the secondary blast. Thus the balance tips toward {O2}.
    tradecraft: The TEA records the positive identification, the weapons analysis, and the proportionality assessment in the
      strike request dossier, and documents the approval decision in the coalition strike cell log as required by ROE compliance
      procedures.
    uncertainty: It was unknown whether secondary explosives were present in the building at the time of the strike.
    handoff: The decision rests solely with the Target Engagement Authority; no further consultation was required because
      the authority had the delegated legal and operational authority to approve the strike.
    tempting_wrong:
      option: O1
      pull: Avoiding any civilian casualties by rejecting the strike.
      why_wrong: Rejecting would have left CTS forces exposed to sniper fire, violating the military necessity and potentially
        causing greater friendly casualties, while the proportionality assessment was satisfied based on the information the
        TEA possessed.
    rejected:
      O1: Rejecting the strike would have failed to neutralize an immediate threat to CTS forces, undermining the mission
        and breaching the proportionality analysis that found acceptable risk given the data.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The TEA had known that civilians were present in the building before the strike
      then: O1
      why: Knowledge of civilian presence would have altered the proportionality assessment, making the expected collateral
        damage unacceptable.
    would_not_change:
    - id: noflip1
      if: The TEA remained unaware of ISIS‑emplaced secondary explosives
      why: The decision was based on the intelligence available at the time; lack of foresight about hidden explosives does
        not retroactively invalidate the lawful approval.
    watch_for:
    - id: watch1
      what: Intelligence indicating the presence of secondary explosive caches in structures used by enemy combatants
      favors:
      - O1
      why: Such intelligence would raise the proportionality risk and could require rejection or alternative targeting methods.
  lesson: When a target is positively identified as a valid military objective and proportionality is assessed using the best
    available intelligence, approval is justified even if unknown secondary explosives later cause higher civilian harm, provided
    the decision‑maker could not reasonably have anticipated those explosives.
  limits: This rule applies only when civilian presence is not observable and intelligence does not indicate concealed secondary
    explosives; it does not apply where civilians are known to be present or where weapon effects are expected to exceed acceptable
    collateral thresholds.
