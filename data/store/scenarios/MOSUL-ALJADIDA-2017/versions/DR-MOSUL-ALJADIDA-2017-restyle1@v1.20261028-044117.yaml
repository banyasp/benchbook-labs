case:
  id: DR-MOSUL-ALJADIDA-2017-restyle1@v1
  title: Approval of strike on building housing ISIS snipers [restyle]
  status: needs_review
  setting: Joint Counter-Insurgency effort, New Dawn sector, Erbil, 17 March 2017
  decider: Strike Authorization Board
  agent: Strike Authorization Board
  agent_role: decide
  situation: On 17 March 2017, coalition forces were advancing to secure the New Dawn sector of Erbil. Forward observers reported
    two hostile militants firing from a fortified position on the second floor of a concrete building, and noted no civilians
    in the immediate vicinity. The Strike Authorization Board positively identified the combatants and, based on the available
    intelligence, concluded that the engagement complied with the applicable Rules of Engagement. The Board selected a munition
    designed to eliminate the shooters while minimizing damage to the building, and gave approval for the attack.
  question: Should the Strike Authorization Board sanction a strike on the structure housing the two hostile shooters, given
    that no civilians were observed?
  options:
    O1:
      do: The Strike Authorization Board declines the attack on the structure.
      move: act
      irreversible: true
    O2:
      do: The Strike Authorization Board authorizes the attack on the structure.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Coalition troops were conducting an offensive to capture the New Dawn sector on 17 March 2017.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: Forward observers did not detect any civilians inside the sector before the planned strike.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Two hostile shooters were seen engaging coalition soldiers from a fortified fighting position on the building's
      second story.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Strike Authorization Board positively identified the shooters and judged the engagement permissible under the
      Rules of Engagement.
  - id: F5
    kind: capability
    status: assessed
    fact: The Board chose a precision munition intended to neutralize the shooters while limiting damage to surrounding elements.
  - id: F6
    kind: capability
    status: assessed
    fact: The Board anticipated that the munition's effects would be confined to the second floor, causing no more than sixteen
      to twenty percent degradation of the structure.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The Board had no knowledge of civilians inside the building and could not have foreseen secondary explosives that
      might be concealed by the hostile forces.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: hors_de_combat
    favors:
    - O2
    weight: strong
    why: The two hostile shooters were positively confirmed as combatants, rendering the building a legitimate military objective
      under the distinction principle.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: The selected precision weapon is expected to restrict damage to sixteen-twenty percent of the structure, and no intelligence
      indicated civilian presence, thereby satisfying proportionality based on the information reasonably available.
  - id: C3
    facts:
    - F1
    - F3
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Eliminating the shooters was judged a military necessity to avert unacceptable coalition casualties and to enable
      the sector's capture.
  - id: C4
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The engagement was positively identified and authorized under the governing Rules of Engagement and the Law of Armed
      Conflict.
  reasoning:
    read: The Board faced a scenario where two hostile shooters were firing from a second-floor fortified position while observers
      reported no civilians in the building. The hidden risk was the possible presence of civilians and enemy-concealed secondary
      explosives that later caused severe casualties.
    weighing: The Board evaluated distinction, proportionality, military necessity, and lawful authority, and because each
      factor strongly supported approval, the balance tipped toward {O2}. The unknown civilian presence was deemed an acceptable
      risk based on the information then available.
    tradecraft: The decision was entered into the strike cell's after-action log and transmitted to senior oversight as mandated
      by ROE documentation procedures.
    uncertainty: The Board could not confirm civilian presence nor the existence of secondary explosives; these gaps introduced
      residual uncertainty regarding actual collateral effects.
    handoff: The Board acted independently but consulted with coalition commanders and the Forward Air Controller, reflecting
      the joint-force decision-making protocol.
    tempting_wrong:
      option: O1
      pull: A desire to eliminate any civilian risk might lure the Board into rejecting the strike.
      why_wrong: Rejecting would have left the shooters active, exposing coalition troops to continued lethal fire and likely
        resulting in greater own-force casualties.
    rejected:
      O1: The strike was authorized because the target satisfied distinction, proportionality, necessity, and lawful authority
        criteria despite unknown civilian factors.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Board had positively identified civilians inside the building before the strike
      then: O1
      why: Confirmed civilian presence would have rendered the proportionality assessment untenable.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Intelligence indicating enemy-concealed secondary explosives in future targets
      favors:
      - O2
      why: Such intelligence would call for heightened precaution but does not alone invalidate the proportionality judgment
        when civilians are not known to be present.
  lesson: When a legitimate military target is positively identified and no civilians are observed, the Strike Authorization
    Board may lawfully approve an attack that balances military necessity with proportionality, even though unknown civilian
    presence may exist.
  limits: This reasoning applies only when civilian presence cannot be reasonably ascertained and the target poses an imminent
    threat; it does not justify attacks where civilians are known to be present or where expected collateral damage exceeds
    proportionality limits.
