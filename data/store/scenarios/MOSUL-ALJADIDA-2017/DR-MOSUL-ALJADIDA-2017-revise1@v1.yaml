case:
  id: DR-MOSUL-ALJADIDA-2017-revise1@v1
  title: Approval of strike on building housing ISIS snipers [revise]
  status: needs_review
  setting: Iraqi Counter Terrorism Service operation, al Jadidah district, Mosul, 17 March 2017
  decider: Target Engagement Authority
  agent: Target Engagement Authority
  agent_role: decide
  situation: On 17 March 2017, Iraqi Counter Terrorism Service forces were conducting an offensive to seize a sector of the
    al Jadidah district in Mosul. CTS visual observers saw two ISIS snipers firing from a defensive fighting position on the
    second floor of a building, but reported no civilians in the sector before the attack. The Target Engagement Authority
    positively identified the snipers and, based on the information available, determined that the engagement met the Rules
    of Engagement. The TEA selected a weapon expected to neutralize the snipers while limiting damage to the structure, and
    approved the strike.
  question: What should the Target Engagement Authority do regarding a strike on the building where two ISIS snipers are firing
    at partner forces, given no civilians were observed?
  options:
    O1:
      do: The Target Engagement Authority rejects the strike on the building.
      move: act
      irreversible: true
    O2:
      do: The Target Engagement Authority approves the strike on the building.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: CTS forces were engaged in an offensive maneuver to seize the sector from ISIS fighters on 17 March 2017.
  - id: F2
    kind: intelligence
    status: confirmed
    fact: CTS visual observers did not identify any civilians within the sector prior to the strike.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Two ISIS snipers were observed engaging CTS soldiers from a defensive fighting position on the second story of a
      building.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Target Engagement Authority positively identified the ISIS snipers and determined the engagement was authorized
      under the Rules of Engagement.
  - id: F5
    kind: capability
    status: assessed
    fact: The TEA selected a weapon expected to neutralize the snipers while limiting damage to surrounding structures.
  - id: F6
    kind: capability
    status: assessed
    fact: The TEA expected the weapon effects to be localized to the second floor, causing no more than 16‑20% damage to the
      structure.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: The TEA was unaware of civilians in the building and could not have predicted the presence of secondary explosives
      emplaced by ISIS.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: hors_de_combat
    favors:
    - O2
    weight: weak
    why: The snipers are confirmed combatants, but the weight is reduced to reflect heightened concern for possible civilians
      and secondary explosives in the building.
  - id: C2
    facts:
    - F5
    - F6
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Uncertainty about civilian presence and the risk of enemy-placed secondary explosives invoke the precautionary principle,
      making civilian life the overriding equity.
  - id: C3
    facts:
    - F1
    - F3
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Neutralizing the snipers was deemed a military necessity to prevent unacceptable CTS casualties and to enable the
      sector seizure.
  - id: C4
    facts:
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The engagement was positively identified and authorized under the applicable Rules of Engagement and the Law of Armed
      Conflict.
  reasoning:
    read: CTS observed two ISIS snipers firing from a second-floor position in a building; no civilians were reported, and
      the TEA identified the snipers and selected a precision munition expected to limit structural damage.
    weighing: With C2 now a strong consideration that favors rejection on civilian-life grounds, it outweighs the weakened
      combat-necessity arguments (C1, C3, C4) that only weakly support approval. The balance therefore tips toward {O1}.
    tradecraft: The decision was logged in the strike cell's after-action report and transmitted to higher-level oversight
      as required by ROE documentation procedures.
    uncertainty: The TEA could not verify civilian presence or the existence of secondary explosives, creating significant
      residual risk to non-combatants.
    handoff: The TEA acted in coordination with CTS commanders and the Iraqi Forward Air Controller, reflecting joint-force
      decision-making.
    tempting_wrong:
      option: O2
      pull: Eliminating the snipers would immediately reduce the threat to CTS forces and aid the sector seizure.
      why_wrong: Approving the strike would expose unknown civilians and potential secondary explosives to lethal effects,
        violating proportionality and the precautionary principle.
    rejected:
      O2: The strike is rejected because the unknown civilian presence and possible secondary explosives create an unacceptable
        risk to civilian life, outweighing the military advantage of neutralizing the snipers.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: New intelligence shows the building houses a critical enemy command node
      then: O2
      why: Even with civilian uncertainty, destroying the command node is deemed essential to the overall operation.
    would_not_change: []
    watch_for:
    - id: watch1
      what: Intelligence indicating enemy-emplaced secondary explosives in future targets
      favors:
      - O2
      why: Such intelligence would require heightened precaution but does not by itself invalidate the proportionality judgment
        when civilians are not known to be present.
  lesson: When civilian presence cannot be reasonably excluded and there is a plausible risk of secondary explosives, the
    precautionary principle can outweigh combat-necessity arguments, leading to strike rejection.
  limits: This guidance applies only when civilian presence is uncertain and the expected collateral damage exceeds acceptable
    proportionality thresholds; it does not preclude attacks on clearly identified combatants without civilian risk.
