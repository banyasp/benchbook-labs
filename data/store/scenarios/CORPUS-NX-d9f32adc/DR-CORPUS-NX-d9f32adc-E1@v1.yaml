case:
  id: DR-CORPUS-NX-d9f32adc-E1@v1
  title: Civilian Access to a Military Expedition
  status: draft
  setting: Early Vicksburg campaign, December 1862; Union field command
  decider: The field commander
  agent: The field commander
  agent_role: decide
  situation: During the early Vicksburg campaign in December 1862, a military expedition was being fitted out. Union field
    commanders bore the principal burden of preventing disclosures. In areas under their control, commanders typically restricted
    special correspondents' access and required reports to be approved before they were sent to editors. The expedition was
    characterized as military in nature. Published reports might reach the enemy and provide information, aid, and comfort.
    The commander had to decide whether civilian reporters could accompany the expedition and, if so, on what conditions.
  question: What should the field commander do about civilian reporters accompanying the expedition?
  options:
    O1:
      do: The field commander prohibits civilian reporters from accompanying the military expedition.
      move: act
      irreversible: false
    O2:
      do: The field commander permits civilian reporters to accompany the expedition with report review.
      move: partial
      irreversible: false
    O3:
      do: The field commander permits civilian reporters to accompany the military expedition.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: On December 18, 1862, during the early Vicksburg campaign, a military expedition was being fitted out.
  - id: F2
    kind: situation
    status: confirmed
    fact: Union field commanders bore the heaviest burden for preventing disclosures.
  - id: F3
    kind: situation
    status: confirmed
    fact: Field commanders typically restricted special correspondents' access in areas under their control.
  - id: F4
    kind: situation
    status: confirmed
    fact: Field commanders typically required correspondents' reports to be approved before they were sent to editors.
  - id: F5
    kind: situation
    status: assessed
    fact: The expedition was characterized as purely military in nature.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A report for publication might reach the enemy and provide information, aid, and comfort.
  considerations:
  - id: C1
    facts:
    - F6
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: A report for publication might reach the enemy and give it information, aid, and comfort; the order treated preventing
      that disclosure as a reason to exclude reporters.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The expedition was characterized as purely military, supporting limits on civilian accompaniment. Mission effect
      is the closest available equity for this stated characterization.
  - id: C3
    facts:
    - F2
    - F3
    - F4
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Field commanders bore the principal burden of preventing disclosures and commonly restricted correspondents' access
      and reviewed their reports; the commander used exclusion for this expedition.
  reasoning:
    read: This was a military expedition being fitted out, not simply an opportunity for civilian reporting. The decision
      turns on the risk that published information could aid the enemy, alongside the commander's responsibility to prevent
      disclosures.
    weighing: The expedition's military character and the possibility of enemy use of published reports support exclusion
      {C1} {C2}. The commander's disclosure-prevention responsibility reinforces that choice {C3}. Although report review
      was a measure commanders commonly used, the order chose to bar reporters from accompanying this expedition rather than
      rely on review.
    tradecraft: State the military purpose and disclosure risk as the basis for the restriction, communicate the order's scope
      clearly, and record the decision and its rationale. The order also identified role-based exceptions for people employed
      as crew or servants; do not treat those exceptions as permission for civilian reporters.
    uncertainty: Reports might reach and aid the enemy, but that outcome was not certain. The likelihood of disclosure and
      whether report review would sufficiently reduce the risk are not established.
    handoff: The field commander made the decision. No referral or consultation with another authority is stated; involving
      one is not necessary to explain the recorded outcome.
    tempting_wrong:
      option: O2
      pull: Report review could seem to preserve reporting while limiting disclosure, and commanders commonly required approval
        before reports were sent.
      why_wrong: The commander instead barred reporters from accompanying this expedition, citing its purely military character
        and the danger that published reports could aid the enemy.
    rejected:
      O2: Report review was a known control, but the commander chose exclusion for this expedition because reports could still
        provide information and aid to the enemy.
      O3: Permitting reporters without restrictions would not address the stated risk that published reports might reach and
        aid the enemy.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The expedition were not characterized as purely military.
      then: O2
      why: Without that stated basis for exclusion, permitting reporters subject to report review would be a plausible alternative,
        though the disclosure risk would still need consideration.
    - id: flip2
      if: Reports for publication could not reach the enemy or provide it information, aid, or comfort.
      then: O2
      why: Removing the order's stated disclosure concern would weaken the reason for exclusion and make accompaniment with
        review a plausible course.
    would_not_change:
    - id: noflip1
      if: Report review were available but the expedition remained military and published reports might still aid the enemy.
      why: Those circumstances leave the commander's stated reasons for excluding reporters in place.
    watch_for:
    - id: watch1
      what: Whether reports for publication might reach the enemy and provide it information, aid, and comfort.
      favors:
      - O1
      why: That risk is an express reason given for the exclusion.
  lesson: When a military expedition is characterized as purely military and publication could provide information or aid
    to the enemy, a commander responsible for preventing disclosures may exclude civilian reporters. The availability of report
    review does not by itself displace the commander's decision to restrict access.
  limits: This reasoning concerns the stated circumstances of this expedition and the specific risk posed by published reports.
    It does not establish that reporters should be excluded from every military operation or resolve what restrictions would
    be appropriate where the military character or disclosure risk differs.
  library:
    domain: operational-command
    family: CORPUS-NX-d9f32adc
    source: https://www.cia.gov/resources/csi/static/07da8de69a4aed5dc204462cd3226eba/Unresolved-Tension-Between-Warriors.pdf
    episode_focus: In December 1862, the commander chose to exclude civilians, including reporters, from a military expedition,
      rather than permit them to accompany the troops. The order justified the restriction by the military character of the
      expedition and the risk that published reports could provide information and aid to the enemy; exclude discussion of
      how reporters evaded restrictions.
    cues:
      option_words:
