        O3: 11
        O1: 11
      real_option: O1
      real_to_mean_other_length: 0.92
      real_is_longest: false
      moves:
        O2: partial
        O3: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: false
        O3: false
        O1: false
    equities: pilot2
