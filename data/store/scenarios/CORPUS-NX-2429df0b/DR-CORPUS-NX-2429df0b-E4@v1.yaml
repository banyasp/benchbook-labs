case:
  id: DR-CORPUS-NX-2429df0b-E4@v1
  title: The 60-Day Soviet Intent Estimate
  status: draft
  setting: Washington, 15 March 1948, Intelligence Advisory Committee
  decider: The Intelligence Advisory Committee
  agent: The Intelligence Advisory Committee
  agent_role: decide
  situation: During a crisis over Berlin, reports and a cable from the U.S. military governor in Germany prompted concern
    in Washington. European intelligence officers assessed that further Soviet measures short of war were likely, but that
    war was unlikely. Army and Air Force intelligence presented more dire assessments, while the Army's estimate acknowledged
    a lack of conclusive evidence of an immediate Soviet intention to initiate hostilities. The ad hoc committee's members
    had disagreed over whether to state directly that war was unlikely, and its estimate that war was improbable for at least
    60 days was not accepted by the Intelligence Advisory Committee. The President requested definitive yes-or-no answers
    that morning about Soviet intent to provoke war within 30 days, 60 days, and during 1948.
  question: What should the Intelligence Advisory Committee do in response to the President's request for an estimate of Soviet
    intent to provoke war?
  options:
    O1:
      do: The Intelligence Advisory Committee approves and issues an estimate stating that no reliable evidence indicates
        Soviet intent to use military action within 60 days and that such action is not expected.
      move: act
      irreversible: false
    O2:
      do: The Intelligence Advisory Committee rejects that estimate and issues an estimate stating that evidence indicates
        Soviet intent to use military action within 60 days and that such action is expected.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: European intelligence officers assessed that further Soviet measures short of war were likely, but war was unlikely.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Army and Air Force intelligence reached dire conclusions; the Army's estimate described Soviet forces as overshadowing
      Europe and most of Asia and U.S. forces as unable to prevent a Soviet advance across most of Eurasia.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The Army's estimate acknowledged that it lacked conclusive evidence of an immediate Soviet intention to initiate
      hostilities.
  - id: F4
    kind: intelligence
    status: assessed
    fact: No intelligence organization argued that war was likely or imminent, but Army G-2 and Air Force Intelligence would
      not agree to state directly that war was unlikely.
  - id: F5
    kind: situation
    status: confirmed
    fact: The Army leadership treated the crisis cable as support for increased budget funding, and Army G-2 sought to include
      universal military training in the estimate.
  - id: F6
    kind: situation
    status: confirmed
    fact: The service chiefs had decided to request a supplemental budget and rejected the ad hoc committee's draft; the Director
      of Naval Intelligence supported the estimate.
  - id: F7
    kind: authority
    status: confirmed
    fact: The President requested definitive yes-or-no answers that morning about whether the Soviets would deliberately provoke
      war within 30 days, within 60 days, and during 1948.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Intelligence Advisory Committee did not agree to the ad hoc committee's estimate, and after debate it consolidated
      the first two questions while deferring the question about 1948.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: No intelligence organization assessed war as likely or imminent, and the Army acknowledged it lacked conclusive evidence
      of an immediate Soviet intention to initiate hostilities. The estimate should not turn alarming assessments into a claim
      of intent unsupported by reliable evidence.
  - id: C2
    facts:
    - F1
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: European intelligence officers assessed that further Soviet measures short of war were likely but that war was unlikely,
      supporting a short-term estimate that does not predict military action.
  - id: C3
    facts:
    - F2
    equity: security_risk
    favors:
    - O2
    weight: weak
    why: The Army's grave assessment of Soviet military superiority gives reason to take the crisis seriously, but capability
      and force imbalance do not by themselves establish an intention to initiate war within 60 days.
  - id: C4
    facts:
    - F5
    - F6
    equity: impartiality
    favors:
    - O1
    weight: weak
    why: The Army leadership treated the crisis cable as support for increased budget funding, and Army G-2 sought to include
      universal military training in the estimate. Van Slyck distinguished intelligence estimation from appropriations advocacy,
      supporting a judgment based on evidence of Soviet intent rather than budget arguments.
  - id: C5
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The committee answered the near-term questions together and deferred the question about 1948, keeping its conclusion
      within the period it addressed rather than extending it to a longer horizon.
  reasoning:
    read: The issue was whether the available intelligence supported an estimate of deliberate Soviet military action within
      the requested short-term period, not whether Soviet capabilities or the wider crisis were alarming. The trap was to
      treat force superiority and pressure for military funding as proof of imminent intent.
    weighing: The European assessment and the absence of reliable evidence of Soviet intent supported saying action was not
      expected within 60 days {C1} {C2}. The Army's assessment of Soviet strength made the danger serious, but did not overcome
      the stated evidentiary gap {C3}. The committee's final answer accordingly said both that no reliable evidence showed
      intent to act within 60 days and that it did not believe the USSR would do so; it deferred the broader 1948 question
      {C5}.
    tradecraft: State the time horizon and the distinction between evidence of intent and evidence of capability. Record the
      evidentiary qualification alongside the bottom-line assessment, and keep intelligence judgments separate from budget
      or force-expansion advocacy.
    uncertainty: This was a short-term judgment, not a determination about Soviet intentions for all of 1948. The committee
      had no reliable evidence of action within 60 days, but the formulation does not make the possibility of war impossible.
    handoff: The Intelligence Advisory Committee made the estimate in response to the President's request; the committee's
      answer was the appropriate institutional response to that request.
    tempting_wrong:
      option: O2
      pull: The Army described a severe military imbalance and the crisis had prompted urgent concern in Washington.
      why_wrong: Those concerns establish the gravity of the situation, not evidence that the Soviets intended to initiate
        military action within 60 days; the Army itself acknowledged the lack of conclusive evidence of immediate intent.
    rejected:
      O2: The committee did not endorse an imminent-war warning because the available evidence did not establish Soviet intent
        to use military action within 60 days.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the Soviets intended to initiate military action within 60 days and made such
        action expected.
      then: O2
      why: The decisive basis for O1 was the absence of reliable evidence of short-term intent and the committee's assessment
        that action was not expected.
    would_not_change:
    - id: noflip1
      if: The assessment of Soviet military superiority remained grave but there was still no reliable evidence of intent
        to initiate action within 60 days.
      why: Soviet military preponderance was compatible with the conclusion that deliberate war was unlikely, rather than
        sufficient evidence of intent.
    watch_for: []
  lesson: Keep assessments of capability distinct from assessments of intent, and state what the evidence does and does not
    support within the relevant time horizon. An estimate should not become an instrument for resolving separate budget or
    force-planning disputes.
  limits: This reasoning addresses an intelligence estimate of deliberate Soviet action within a short-term period. It does
    not settle the broader question about 1948, rule out accidental escalation, or determine what military preparations should
    be made.
