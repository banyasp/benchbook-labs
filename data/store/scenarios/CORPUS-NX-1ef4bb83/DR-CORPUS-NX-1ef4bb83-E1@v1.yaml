case:
  id: DR-CORPUS-NX-1ef4bb83-E1@v1
  title: Delegated Directive Authority and Intelligence Definition
  status: draft
  setting: National Intelligence Authority, United States government, 1946
  decider: The National Intelligence Authority
  agent: The National Intelligence Authority
  agent_role: decide
  situation: The Director of Central Intelligence’s authority to act for the National Intelligence Authority in coordinating
    foreign intelligence activities was uncertain. Agencies interpreted coordination as requiring mutual agreement, and some
    matters took six to eight months. The Director requested authority to act as an agent for the department secretaries;
    the alternative under consideration was for CIG to forward directives to NIA members for issuance from their own offices.
    CIG also sought NIA approval of its definition of strategic and national policy intelligence, amid uncertainty among agencies
    about that concept. A departmental appeal to the NIA through the relevant secretary was proposed as a safeguard, and the
    Director acknowledged that right. A State Department representative assumed directives would normally be discussed by
    the IAB beforehand, and the Director assented.
  question: What should the National Intelligence Authority do about the Director’s directive authority and CIG’s proposed
    definition of strategic and national policy intelligence?
  options:
    O1:
      do: The National Intelligence Authority should decline delegated directive authority, require CIG to forward directives
        to NIA members for issuance, preserve departmental appeals through the secretaries to the Authority, and approve CIG’s
        proposed definition.
      move: act
      irreversible: false
    O2:
      do: The National Intelligence Authority should authorize the Director to issue directives as an agent of the department
        secretaries, preserve departmental appeals through the secretaries to the Authority, and approve CIG’s proposed definition.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Earlier directives said the Director of Central Intelligence was to act for the NIA in coordinating foreign intelligence
      activities, but the Director’s directive authority remained uncertain.
  - id: F2
    kind: situation
    status: confirmed
    fact: Agencies interpreted coordination as requiring mutual agreement, and in some instances this took six to eight months.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Director requested authority to act as an agent for the department secretaries; the stated alternative was for
      CIG to forward directives to NIA members for issuance from their own offices.
  - id: F4
    kind: situation
    status: confirmed
    fact: CIG was the government’s central intelligence organization, and uncertainty among agencies about the meaning of
      strategic and national policy intelligence hindered its work in that area.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: CIG sought approval for its definition of strategic and national policy intelligence as verified, appraised, and
      synthesized estimates for government policymakers.
  - id: F6
    kind: authority
    status: confirmed
    fact: A proposed safeguard allowed an aggrieved agency to appeal to the NIA through the secretary of its department, and
      the Director acknowledged that right.
  - id: F7
    kind: situation
    status: assessed
    fact: A State Department representative assumed directives would normally receive prior discussion by the IAB, and the
      Director assented.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The uncertain authority had left agencies relying on mutual agreement, sometimes for six to eight months. The Authority
      regarded routing CIG directives through members' own offices as cumbersome and time-consuming, supporting delegated
      authority to avoid further delay.
  - id: C2
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Delegation would give the Director's decisions, orders, and directives the force of those issued by the secretaries,
      while an aggrieved agency could appeal through its secretary to the NIA. The appeal safeguard made the grant of authority
      acceptable to the Authority.
  - id: C3
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Uncertainty about strategic and national policy intelligence hindered CIG's work. The Authority approved a definition
      of objective, interdepartmental intelligence that serves senior policymakers and transcends any one department's exclusive
      competence.
  reasoning:
    read: The issue was not simply whether departments should coordinate, but whether coordination requiring mutual agreement
      could work promptly when it had sometimes taken six to eight months. Routing directives through each NIA member's office
      was an available alternative, but the Authority viewed it as cumbersome and time-consuming. The separate definition
      question concerned the scope of CIG's strategic and national policy intelligence, not how intelligence was collected.
    weighing: The Authority favored delegated authority because the existing uncertainty and delays impeded coordination,
      while issuing directives through the members' offices would cause further delay {C1}. The appeal route preserved departmental
      recourse to the NIA and made delegation acceptable {C2}. The Authority also approved CIG's definition to resolve uncertainty
      hindering its work and to specify the interdepartmental, objective character of the intelligence required by policymakers
      {C3}. The delegation depended on maintaining the appeal safeguard; the Director also assented to the expectation of
      prior IAB discussion in the normal case.
    tradecraft: Record the scope of the Director's delegated authority, the route for departmental appeals through the relevant
      secretary, and the approved definition. Note the expected prior IAB discussion as a normal practice, without treating
      it as a condition the source made binding.
    uncertainty: The source records the approval and safeguards but gives no subsequent evidence about how the delegation
      worked in practice or whether agencies' uncertainty was fully resolved.
    handoff: The NIA decides the delegation and definition. Department secretaries provide the stated channel for aggrieved
      agencies to bring appeals to the Authority, and the IAB is relevant to the expected prior discussion of directives.
    tempting_wrong:
      option: O1
      pull: Keeping issuance with NIA members' own offices may seem to preserve direct departmental control.
      why_wrong: The Authority judged that route cumbersome and time-consuming, against a background of coordination delays
        that could already reach six to eight months.
    rejected:
      O1: The Authority did not require CIG to route directives through NIA members for issuance because it approved delegated
        authority as the more workable response to delay, with departmental appeals preserved.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Authority could not provide an aggrieved agency a route to appeal through its department secretary to the NIA.
      then: O1
      why: The Authority's approval of the request was expressly conditioned on preserving that appeal route; without it,
        the stated basis for accepting delegation would be absent.
    - id: flip2
      if: Mutual-agreement coordination no longer caused substantial delay and routing directives through NIA members' offices
        was no longer cumbersome or time-consuming.
      then: O1
      why: Without the delay and administrative burden that motivated the request, the source's stated reason for preferring
        delegated issuance would be materially weakened.
    would_not_change:
    - id: noflip1
      if: Directives normally receive prior IAB discussion, as the State Department representative expected and the Director
        accepted.
      why: That expectation was compatible with the Authority granting delegated authority; it did not replace the appeal
        safeguard or the delegation itself.
    watch_for:
    - id: watch1
      what: Whether the approved definition resolves agencies' uncertainty about the interdepartmental scope of strategic
        and national policy intelligence.
      favors:
      - O2
      why: The Authority approved the definition because uncertainty about the concept hindered CIG's work; continuing uncertainty
        would indicate that this part of the decision had not achieved its stated purpose.
  lesson: When mutual agreement produces prolonged delays, delegated authority can improve coordination if its scope is clear
    and affected departments retain a meaningful appeal route. Define interdepartmental responsibilities explicitly, while
    keeping consultation practices distinct from formal limits on authority.
  limits: This reasoning applies to the stated NIA delegation and definition decision, where the Authority identified delays
    and accepted an appeal safeguard. It does not establish that delegation is appropriate without those conditions or determine
    how intelligence should be collected.
