basis: The National Intelligence Authority approved the Director operating within his jurisdiction as an agent of the Secretaries
  of State, War, and the Navy, delegated authority for his decisions, orders, and directives, preserved departmental appeals,
  and authorized the definition of strategic and national policy intelligence.
