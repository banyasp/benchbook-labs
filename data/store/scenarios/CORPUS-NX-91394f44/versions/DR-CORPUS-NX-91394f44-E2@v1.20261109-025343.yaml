case:
  id: DR-CORPUS-NX-91394f44-E2@v1
  title: Allocating Foreign-Intelligence Responsibilities
  status: draft
  setting: United States, 8 July 1946, National Intelligence Authority and Central Intelligence Group
  decider: The National Intelligence Authority
  agent: The National Intelligence Authority
  agent_role: decide
  situation: The National Intelligence Authority oversaw the Central Intelligence Group. It was considering how to assign
    the Group foreign-intelligence responsibilities under the presidential charter. Some national-security analysis fields
    were not being performed or were not being performed adequately. The Authority considered central coordination for foreign-intelligence
    work, while Cabinet departments retained limited analytical capabilities. The Army also maintained that the directive's
    wording preserved its Intelligence Division's independent collection operations.
  question: What should the National Intelligence Authority do in allocating foreign-intelligence responsibilities between
    the Group and the Cabinet departments?
  options:
    O1:
      do: The National Intelligence Authority centralizes specified analytical gaps and foreign-intelligence responsibilities
        in the Group, leaving departmental analysis and other activities outside its control.
      move: act
      irreversible: false
    O2:
      do: The National Intelligence Authority decentralizes analytical gaps and foreign-intelligence responsibilities to the
        departments, retaining those functions under departmental control.
      move: act
      irreversible: false
    O3:
      do: The National Intelligence Authority consolidates departmental analysis and foreign-intelligence responsibilities
        under the Group, transferring departmental functions to centralized control.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The National Intelligence Authority oversaw the Central Intelligence Group and comprised the Secretaries of State,
      War, and Navy, with the President's chief military adviser.
  - id: F2
    kind: authority
    status: confirmed
    fact: National Intelligence Authority Directive 5, issued on 8 July 1946, provided the Director of Central Intelligence
      with an implementation plan for the powers in the presidential charter for the Group.
  - id: F3
    kind: capability
    status: confirmed
    fact: The Group was authorized to centralize research and analysis in national-security intelligence fields not then being
      performed or not being adequately performed.
  - id: F4
    kind: authority
    status: confirmed
    fact: The directive required the Director of Central Intelligence to coordinate all United States foreign-intelligence
      activities to implement the Authority's policies and objectives.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Authority directed the Director of Central Intelligence to conduct organized federal espionage and counter-espionage
      operations outside the United States and its possessions for national-security intelligence.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Authority assessed that many foreign-intelligence missions could be accomplished more efficiently centrally.
  - id: F7
    kind: capability
    status: confirmed
    fact: The directive in effect made the Group the primary foreign-intelligence arm of the United States government.
  - id: F8
    kind: situation
    status: assessed
    fact: The Authority's authorization was carefully phrased to allay departmental fears that the Director of Central Intelligence
      would take control of departmental intelligence offices, whose limited analytical capabilities the departments were
      unwilling to subordinate.
  - id: F9
    kind: authority
    status: confirmed
    fact: The directive did not give the Group a controlling role in intelligence analysis.
  - id: F10
    kind: intelligence
    status: assessed
    fact: The directive did not compel consolidation of clandestine activities under the Group, and the Army argued that the
      word “organized” left its Intelligence Division's collection operations independent.
  considerations:
  - id: C1
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: strong
    why: The Group could address national-security analysis fields that were missing or inadequate, and the Authority judged
      that many foreign-intelligence missions could be accomplished more efficiently centrally.
  - id: C2
    facts:
    - F4
    - F5
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The directive assigned the Director coordination of foreign-intelligence activities and organized federal espionage
      and counter-espionage abroad, making the Group the primary foreign-intelligence arm without assigning it control of
      every departmental function.
  - id: C3
    facts:
    - F8
    - F9
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: 'The authorization was carefully phrased to allay departmental fears: the departments were unwilling to subordinate
      their limited analytical capabilities, and the directive therefore stopped short of giving the Group controlling authority
      over departmental analysis.'
  - id: C4
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The directive did not compel consolidation of clandestine activities, and the Army maintained that the word “organized”
      left its Intelligence Division's collection operations independent; wholesale consolidation would go beyond that bounded
      arrangement.
  reasoning:
    read: The decision was how to give the Group a useful central foreign-intelligence role without treating the presidential
      charter as a transfer of all departmental authority. The trap is to infer from the case for central efficiency that
      the Authority should also control departmental analysis and compel consolidation of clandestine activity.
    weighing: The unfilled analytical fields and the Authority's assessment of greater central efficiency supported assigning
      specified responsibilities to the Group {C1}. The directive also gave the Director coordination and organized-operation
      responsibilities {C2}. But departmental reluctance to subordinate existing analytical capabilities was a stated reason
      to phrase the authorization carefully, and the directive did not confer analytical control or require consolidation
      {C3} {C4}. Those considerations support the bounded centralization in {O1}, rather than decentralization or wholesale
      consolidation.
    tradecraft: State the Group's assigned responsibilities and the limits on departmental control distinctly in the directive
      and its implementation record. Keep any later clarification within the Authority's stated allocation; this is decision-level
      documentation, not operational guidance.
    uncertainty: The source gives the Authority's assessment that many missions could be accomplished more efficiently centrally,
      but does not quantify that assessment. The boundary of “organized” operations was also disputed by the Army, so the
      source does not establish that every departmental collection activity fell within the Group's authority.
    handoff: The National Intelligence Authority was the deciding body. The departments' concerns and the Army's interpretation
      are relevant to explaining the allocation, but the source does not assign them the Authority's decision.
    tempting_wrong:
      option: O3
      pull: Central efficiency and the Group's new role as the primary foreign-intelligence arm may make full consolidation
        seem like the clearest way to centralize responsibility.
      why_wrong: The Authority deliberately stopped short of controlling departmental analysis and compelling consolidation;
        full transfer would disregard the stated limits designed to allay departmental fears.
    rejected:
      O2: The Authority did not leave the identified analytical gaps and foreign-intelligence responsibilities wholly under
        departmental control; it assigned central responsibilities to the Group.
      O3: The Authority did not give the Group control over departmental analysis or require consolidation of clandestine
        activities.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The identified analytical fields were already being performed adequately and the Authority had no basis to assess
        central accomplishment as more efficient.
      then: O2
      why: Without the stated capability gaps or efficiency rationale, the source's reasons for assigning these responsibilities
        centrally would be substantially weakened.
    - id: flip2
      if: The departments were willing to subordinate their analytical capabilities and the Authority expressly chose to transfer
        departmental analysis and collection responsibilities.
      then: O3
      why: Removing the stated departmental concern and expressly choosing a broader transfer could support consolidation,
        rather than the limits adopted in NIAD-5.
    would_not_change:
    - id: noflip1
      if: The Army continued to maintain independent collection operations.
      why: That position was compatible with the directive's bounded arrangement and did not negate the Group's assigned central
        responsibilities.
    watch_for:
    - id: watch1
      what: Whether the boundary of “organized” foreign-intelligence operations is clarified in applying the directive.
      favors:
      - O1
      why: The Army's interpretation bears on the limit between the Group's assigned responsibilities and departmental collection
        activities, but does not itself establish a need for wholesale consolidation.
  lesson: Centralize functions where identified gaps and the expected efficiency of central performance support it. Do not
    infer that a central mandate requires taking control of every related departmental capability when the allocation was
    deliberately limited to preserve those capabilities and address departmental concerns.
  limits: This reasoning concerns the Authority's 1946 allocation under the charter and NIAD-5. It does not determine the
    proper division of responsibilities under later statutes, directives, or circumstances with different capabilities and
    departmental positions.
  library:
    domain: intel-oversight
    family: CORPUS-NX-91394f44
    source: https://www.cia.gov/static/aa0f09a55dfcd5fa337e85f361347148/The-Creation-of-the-Intelligence-Community.pdf
    episode_focus: The Authority chose to centralize certain foreign-intelligence responsibilities in the Group while stopping
      short of controlling departmental analysis or compelling consolidation of clandestine activities. The passage explains
      that the limits were meant to allay departmental fears and preserve their capabilities; exclude operational methods
      for carrying out intelligence activities.
