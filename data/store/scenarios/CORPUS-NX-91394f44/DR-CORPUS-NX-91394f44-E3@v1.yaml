case:
  id: DR-CORPUS-NX-91394f44-E3@v1
  title: Setting Intelligence Priorities Amid Resource Constraints
  status: draft
  setting: United States, 1995, the federal executive and Intelligence Community
  decider: The President
  agent: The President
  agent_role: decide
  situation: In 1995, the United States faced reduced military and intelligence resources after the Cold War while committing
    forces to overseas deployments. Those deployments created increasing demand for tactical intelligence support. Field commanders
    needed prompt, thorough intelligence to inform operational decisions and support troop security. The President had to
    set the Intelligence Community’s priorities between military operational needs and other intelligence missions.
  question: What should the President do about the Intelligence Community’s priority between military operational needs and
    other intelligence missions?
  options:
    O1:
      do: The President should deprioritize tactical intelligence support for military operations across the Intelligence
        Community.
      move: act
      irreversible: false
    O2:
      do: The President should prioritize tactical intelligence support for military operations across the Intelligence Community.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: After the Cold War, national priorities were reordered and the US military faced substantial budget cuts.
  - id: F2
    kind: situation
    status: confirmed
    fact: Military and intelligence resources were reduced, including Intelligence Community budgets and personnel ceilings.
  - id: F3
    kind: situation
    status: confirmed
    fact: The United States committed forces to major overseas deployments in Africa, the Balkans, the Middle East, and the
      Caribbean.
  - id: F4
    kind: situation
    status: confirmed
    fact: During the 1990s, the military was engaged in recurring peacekeeping operations, sometimes with more than one underway
      at a time.
  - id: F5
    kind: situation
    status: assessed
    fact: The growing military deployments demanded increasing tactical intelligence support.
  - id: F6
    kind: situation
    status: assessed
    fact: The President said field commanders needed prompt, thorough intelligence to inform their decisions and maximize
      troop security.
  - id: F7
    kind: authority
    status: confirmed
    fact: In 1995, the President issued PDD-35 instructing the Intelligence Community to provide tactical intelligence support.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Major overseas deployments, including recurring and sometimes concurrent peacekeeping operations, created growing
      demand for tactical intelligence support.
  - id: C2
    facts:
    - F6
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: The President's stated reason was that commanders needed prompt, thorough intelligence to inform their decisions
      and maximize troop security.
  - id: C3
    facts:
    - F1
    - F2
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Military and intelligence budgets and personnel were reduced, so assigning more intelligence resources to tactical
      support meant a tradeoff with other missions.
  - id: C4
    facts:
    - F7
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The President issued PDD-35 directing the Intelligence Community to provide tactical support, establishing the priority
      he chose.
  reasoning:
    read: 'This was a priority-setting decision under resource constraints: deployments were increasing tactical demand while
      budgets and personnel were falling. The trap is to treat the resource tradeoff as if it erased the operational need,
      or to overlook that prioritizing tactical support diverted shrinking resources from strategic intelligence.'
    weighing: The President gave first priority to military operational needs because commanders required prompt, thorough
      intelligence to inform decisions and maximize troop security. That rationale, together with growing demand from overseas
      and recurring deployments, supports {O2}; the counterweight is that limited resources meant a diversion from strategic
      missions. The stated balance depends on the continuing deployment-related demand and the time-sensitive needs of field
      commanders.
    tradecraft: Translate the priority into clear decision-level guidance, keep the resource tradeoff visible, and record
      the operational need and the effect on other intelligence missions. Reassess the allocation if deployment demands or
      available resources materially change.
    uncertainty: The President's rationale is clear, but the size of the diversion from strategic intelligence and the effect
      on competing missions are not specified.
    handoff: The President decides the priority; the Intelligence Community implements it and should make resource tradeoffs
      visible to executive leadership.
    tempting_wrong:
      option: O1
      pull: Reduced budgets and personnel make preserving resources for other intelligence missions an important concern.
      why_wrong: That concern was real, but the President judged that growing deployments and commanders' need for prompt,
        thorough intelligence warranted making operational support the first priority.
    rejected:
      O1: The President did not deprioritize tactical support; he directed the Intelligence Community to make military operational
        needs its first priority.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Overseas deployments and recurring operations no longer created substantial demand for tactical intelligence support.
      then: O1
      why: Without the deployment-driven operational demand that supported the President's priority, the case for diverting
        scarce intelligence resources to tactical support would weaken.
    - id: flip2
      if: Resources became so constrained that prioritizing tactical support could not provide meaningful support to commanders
        and would substantially impair other essential intelligence missions.
      then: O1
      why: The stated rationale depends on tactical support being able to meet commanders' needs despite the acknowledged
        resource tradeoff.
    would_not_change:
    - id: noflip1
      if: Budgets and personnel remained constrained while deployments continued to demand increasing tactical support.
      why: Those constraints were already present when the President chose to make operational support the first priority.
    watch_for:
    - id: watch1
      what: Whether military deployments and concurrent peacekeeping operations continue to increase the demand for tactical
        intelligence.
      favors:
      - O2
      why: Growing deployments increase the demand for tactical intelligence.
  lesson: When operational demands grow despite shrinking resources, identify the specific time-sensitive need and the people
    whose safety depends on it. Make the priority choice explicit, while accounting for the intelligence missions that will
    receive fewer resources.
  limits: This reasoning applies to priority-setting under deployment-related demand and constrained intelligence resources.
    It does not establish how tactical intelligence should be collected or used, or resolve how any particular strategic mission
    should be resourced.
  library:
    domain: natsec-other
    family: CORPUS-NX-91394f44
    source: https://www.cia.gov/static/aa0f09a55dfcd5fa337e85f361347148/The-Creation-of-the-Intelligence-Community.pdf
    episode_focus: With intelligence budgets and personnel constrained while overseas deployments increased, the President
      directed the Intelligence Community to meet military operational needs as its first priority, diverting resources toward
      tactical support. The stated rationale was to give field commanders prompt, thorough intelligence and improve troop
      security; exclude any discussion of how intelligence is collected or used tactically.
    cues:
      option_words:
        O1: 14
        O2: 14
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The President said the Intelligence Community's first priority was to support “the intelligence needs of our military
  during an operation,” so field commanders would have prompt, thorough intelligence to inform decisions and maximize troop
  security.
