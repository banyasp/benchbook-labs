case:
  id: DR-OHA-26-0044@v1
  title: Restoration of Access Authorization after Alcohol-Related Security Concerns
  status: draft
  setting: Department of Energy Office of Hearings and Appeals, June 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires an access authorization. The Local
    Security Office raised security concerns under Guideline G (excessive alcohol consumption) and Guideline J (criminal conduct)
    based on a history of arrests, a protective order, and a recent aggravated DWI incident. A DOE‑consultant psychologist
    diagnosed the Individual with an unspecified alcohol‑related disorder and described binge drinking behavior. The Individual
    subsequently completed an intensive outpatient alcohol‑treatment program, six months of aftercare, and provided ten consecutive
    negative PEth test results. Supervisors and the psychologist testified that the Individual has complied with treatment,
    is reliable, and has a good prognosis. The Administrative Judge must determine whether these facts resolve the security
    concerns and whether the Individual’s access authorization should be restored.
  question: What should the Administrative Judge do regarding the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge asks the Local Security Office for evaluation.
      move: ask
      irreversible: false
      to: Local Security Office
    O2:
      do: The Administrative Judge denies the Individual’s access authorization.
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the Individual’s access authorization pending evidence.
      move: hold
      irreversible: false
    O4:
      do: The Administrative Judge restores the Individual’s access authorization.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: Between 2011 and 2021 the Individual was cited or arrested related to at least four criminal charges.
  - id: F3
    kind: situation
    status: confirmed
    fact: In 2024 the Individual’s ex‑girlfriend filed a protective order alleging threat due to his alcohol consumption.
  - id: F4
    kind: situation
    status: confirmed
    fact: On June 20 2025 the Individual was arrested and charged with aggravated DWI, assault on an officer, reckless driving,
      and resisting/evading/obstructing an officer.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A DOE‑consultant psychologist evaluated the Individual in September 2025, diagnosing Unspecified Alcohol‑Related
      Disorder and describing him as a binge consumer of alcohol to the point of impaired judgment.
  - id: F6
    kind: capability
    status: confirmed
    fact: The Individual completed a ninety‑hour intensive outpatient program from August 8 2025 to October 30 2025 and six
      months of aftercare, providing ten consecutive negative PEth test results from August 2025 through May 2026.
  - id: F7
    kind: authority
    status: assessed
    fact: The Individual’s supervisor testified that he is a reliable employee and aware of the Individual’s participation
      in treatment and testing.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The DOE psychologist testified that the Individual demonstrated strong compliance with rehabilitation recommendations
      and has a good prognosis.
  - id: F9
    kind: situation
    status: confirmed
    fact: The Local Security Office issued a Notification Letter stating substantial doubt regarding the Individual’s eligibility
      for access authorization, citing Guideline G and Guideline J.
  - id: F10
    kind: authority
    status: confirmed
    fact: DOE regulations require that granting or restoring access authorization must not endanger the common defense and
      must be clearly consistent with the national interest.
  considerations:
  - id: C1
    facts:
    - F6
    - F8
    - F7
    equity: duty_to_individual
    favors:
    - O4
    weight: strong
    why: The Individual completed the DOE‑prescribed intensive outpatient program, six months of aftercare, and provided ten
      consecutive negative PEth tests, demonstrating sustained abstinence and compliance with treatment recommendations, which
      satisfies mitigating factor (d) for Guideline G.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F6
    equity: due_process
    favors:
    - O4
    weight: strong
    why: The Individual’s older non‑alcohol‑related offenses are minor and occurred long ago, meeting mitigating factor (a)
      for Guideline J, while the recent alcohol‑related offenses have been addressed through rehabilitation, satisfying mitigating
      factor (d) for Guideline J.
  - id: C3
    facts:
    - F10
    equity: lawful_authority
    favors:
    - O4
    weight: weak
    why: Although 10 C.F.R. § 710.7(a) creates a presumption against granting a clearance, the regulation also requires the
      individual to demonstrate that restoration will not endanger the common defense, which the record shows he has satisfied.
  - id: C4
    facts:
    - F7
    - F8
    equity: institutional_credibility
    favors:
    - O4
    weight: strong
    why: Supervisor testimony and the DOE psychologist’s assessment of a good prognosis provide credible evidence of the Individual’s
      reliability, trustworthiness, and low likelihood of future security‑relevant misconduct.
  reasoning:
    read: The LSO raised security concerns under Guideline G (excessive alcohol use) and Guideline J (criminal conduct). The
      Individual has since completed DOE‑mandated treatment, remained abstinent, complied with probation, and received supportive
      testimony, raising the question whether these actions resolve the concerns.
    weighing: The Administrative Judge applied the mitigating factors set out in the Adjudicative Guidelines. Under Guideline
      G, factor (d) was met by the completed treatment and sustained abstinence ({C1}). Under Guideline J, factors (a) and
      (d) were satisfied by the age and minor nature of older offenses and by the Individual’s rehabilitation for the recent
      alcohol‑related offenses ({C2}). While the regulatory presumption against clearance exists ({C3}), the totality of evidence
      demonstrates that restoration will not endanger the common defense, allowing the judge to favor restoration ({C4}).
      The balance therefore tips decisively toward O4.
    tradecraft: Record the decision in the official OHA docket, attach the supporting exhibits (treatment completion letters,
      PEth test results, supervisor statements), and issue a formal restoration order to the LSO with instructions to update
      the Individual’s security file.
    uncertainty: The primary uncertainty concerns future alcohol use; the judge noted the need for continued monitoring but
      found the current evidence sufficient.
    handoff: The Administrative Judge decides alone, as the authority to grant or restore access rests with the OHA judge
      under 10 C.F.R. § 710.7(a). No further agency review is required unless an appeal is filed.
    tempting_wrong:
      option: O2
      pull: Denial would align with the default presumption against clearance and the seriousness of the DWI arrest.
      why_wrong: Denial would ignore the substantial mitigating evidence of rehabilitation and the lack of any recurrence,
        contrary to the Guidelines’ mitigation provisions.
    rejected:
      O1: The LSO’s further evaluation is unnecessary because the record already contains sufficient mitigating evidence.
      O2: Denial is rejected because the Individual has met all mitigating criteria for both Guideline G and Guideline J.
      O3: Holding the clearance pending further evidence is unwarranted; the required evidence has already been provided and
        evaluated.
  verdict:
    choice: O4
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual records a positive PEth test or otherwise relapses into alcohol consumption after the decision date.
      then: O2
      why: A relapse would indicate that the mitigating factor (d) for Guideline G is no longer satisfied, re‑establishing
        a security concern.
    would_not_change:
    - id: noflip1
      if: The Individual’s prior minor offenses (e.g., 2011 speeding citation) remain unaddressed.
      why: These offenses are already deemed mitigated under Guideline J factor (a) and do not affect the restoration decision.
    watch_for:
    - id: watch1
      what: Any new criminal conduct unrelated to alcohol, such as a felony conviction,
      favors:
      - O2
      why: New, unrelated criminal activity would create a fresh security concern under Guideline J.
  lesson: When an individual demonstrates documented rehabilitation, sustained abstinence, and compliance with all treatment
    and probation requirements, the security concerns raised under Guideline G and Guideline J can be mitigated, allowing
    restoration of access authorization despite a prior record of alcohol‑related misconduct.
  limits: This reasoning applies only where the security concerns stem primarily from alcohol misuse and related offenses
    that have been fully addressed through DOE‑approved treatment. It does not extend to unrelated security concerns such
    as espionage, foreign influence, or serious violent felonies that lack comparable mitigation.
