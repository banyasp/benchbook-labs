case:
  id: DR-CORPUS-NX-a9a76046-E3@v1
  title: Centralizing OIR Selection
  status: draft
  setting: CIA OIR program, after its first decade and by the mid-1990s; CIA and university host institutions.
  decider: The CIA, through CSI
  agent: The CIA, through CSI
  agent_role: decide
  situation: OIRs served at universities while their home components paid their salaries and related expenses. In the program’s
    early years, selection was essentially left to the home components, and arrangements could be informal. The academic involvement
    of OIRs varied widely. After the program’s first decade, an Inspector General audit found that program administration
    needed standardization. The audit called for CSI to take a more active role in defining OIRs’ mission and selecting host
    institutions, including to discourage assignments shaped by employees’ personal preferences.
  question: What should the CIA, through CSI, do about who controls selection of OIR candidates while home components fund
    positions?
  options:
    O1:
      do: CSI should centralize selection of OIR candidates, with home components retaining control over the number of positions
        they fund.
      move: act
      irreversible: false
    O2:
      do: CSI should decentralize selection of OIR candidates, with home components retaining control over the number of positions
        they fund.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: OIRs’ home components paid their salaries and related expenses, including books, travel, and household moves.
  - id: F2
    kind: situation
    status: confirmed
    fact: In the program’s early years, selection was essentially left to the OIRs’ home components.
  - id: F3
    kind: situation
    status: assessed
    fact: Early selection sometimes involved informal arrangements among officers, home offices or directorates, and interested
      host institutions.
  - id: F4
    kind: situation
    status: confirmed
    fact: OIRs’ academic involvement varied widely in the program’s early years.
  - id: F5
    kind: situation
    status: assessed
    fact: After the program’s first decade, the CIA Inspector General concluded that program operations and individual assignments
      needed a standardizing regulation.
  - id: F6
    kind: situation
    status: assessed
    fact: The Inspector General called for CSI to play a more active role in defining OIRs’ mission and selecting host institutions,
      partly to discourage assignments accommodating employees’ personal preferences.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The Inspector General found that program operations and assignments needed standardization; the wide variation in
      academic involvement underscores the governance problem central selection was meant to address.
  - id: C2
    facts:
    - F2
    - F3
    - F6
    equity: impartiality
    favors:
    - O1
    weight: strong
    why: Selection left to home components sometimes involved informal arrangements, and the Inspector General specifically
      wanted CSI’s greater role to discourage assignments shaped by employees’ personal preferences.
  - id: C3
    facts:
    - F1
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: CSI’s active role in defining the OIR mission and selecting host institutions can connect assignments to program
      purposes, while home components continue to fund positions.
  reasoning:
    read: The central question is who selects candidates, not who pays for their assignments. The trap is treating the home
      components’ funding role as a reason they must also control selection, despite the audit’s concerns about informal arrangements,
      inconsistent assignments, and personal preferences.
    weighing: 'Standardization and discouraging personal-preference assignments weigh strongly for CSI control of selection
      {C1} {C2}. Mission alignment also supports CSI’s active role {C3}. The source’s chosen approach does not require centralized
      funding: home components continue to fund positions while selection is handled more centrally.'
    tradecraft: Place candidate selection and host matching under CSI’s central review, with the program’s mission and host-institution
      choices made explicit. Preserve home components’ funding role and document how selection decisions fit the program’s
      standardized purpose.
    uncertainty: The record gives the audit’s governance concerns and the subsequent shift to more central handling, but does
      not specify the regulation’s detailed standards or measure how often informal arrangements occurred.
    handoff: CSI should lead selection and coordinate with home components because they continue to fund positions; this keeps
      selection governance with CSI without obscuring the components’ funding role.
    tempting_wrong:
      option: O2
      pull: Home components paid salaries and related expenses, and early selection was left to them.
      why_wrong: That arrangement was the setting for the audit’s concerns about inconsistent administration and assignments
        accommodating personal preferences; funding responsibility alone does not answer who should select.
    rejected:
      O2: CSI did not leave candidate selection decentralized because the Inspector General called for CSI to take a more
        active role in standardizing assignments and discouraging personal-preference placements.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A subsequent review established that decentralized selection could reliably standardize assignments and prevent
        personal-preference placements.
      then: O2
      why: If the governance problems motivating central selection were resolved through decentralized controls, the source’s
        stated reasons for CSI control would be substantially reduced.
    would_not_change:
    - id: noflip1
      if: Home components continue to pay OIR salaries and related expenses.
      why: Funding remained decentralized even as selection became more centrally handled, so decentralized funding alone
        does not alter the selection judgment.
    watch_for: []
  lesson: Separate funding authority from selection authority when they serve different governance purposes. Where decentralized
    selection has produced inconsistent assignments or risks accommodating individual preferences, centralize selection while
    preserving the funders’ role in setting the number of positions they can support.
  limits: This reasoning concerns the OIR program’s selection governance after an audit identified standardization concerns.
    It does not establish that selection should always be centralized or that funding and selection must be separated in other
    programs.
  library:
    domain: intel-oversight
    family: CORPUS-NX-a9a76046
