case:
  id: DR-CORPUS-NX-61a73cea-E1@v1
  title: 'Korean War: Truce or Escalation'
  status: draft
  setting: Seoul, December 1952, during the U.S. presidential transition
  decider: The president-elect
  agent: The president-elect
  agent_role: decide
  situation: In December 1952, the president-elect was considering how to end the Korean War. He had pledged to find an honorable
    way to end U.S. casualties and had gone to Korea to examine the war. He had heard proposals for a renewed offensive that
    could involve atomic weapons and unification of the peninsula by force. He judged a positive and definite victory unlikely
    without a grave risk of enlarging the war. He viewed the conflict as a costly distraction from broader national-security
    planning, but had no specific plan for ending it.
  question: What should the president-elect do about ending the Korean War?
  options:
    O1:
      do: The president-elect pursues a negotiated truce to end the Korean War.
      move: act
      irreversible: false
    O2:
      do: The president-elect rejects a negotiated truce and pursues military victory through escalation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The president-elect pledged to find an intelligent and honorable way to end the U.S. casualties in Korea.
  - id: F2
    kind: situation
    status: confirmed
    fact: The president-elect went to Korea in December 1952 to seek a way to end the war.
  - id: F3
    kind: situation
    status: confirmed
    fact: In Korea, the president-elect met with military commanders and visited U.S. and U.N. military units.
  - id: F4
    kind: situation
    status: confirmed
    fact: The president-elect listened to proposals for a renewed offensive that could involve atomic weapons and unification
      of the peninsula by force.
  - id: F5
    kind: situation
    status: assessed
    fact: The president-elect assessed that a positive and definite victory was unlikely without a grave risk of enlarging
      the war.
  - id: F6
    kind: situation
    status: assessed
    fact: The president-elect viewed the Korean War as a costly distraction from formulating a broader national-security policy.
  - id: F7
    kind: situation
    status: confirmed
    fact: In December 1952, the president-elect did not have a specific plan for ending the war.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: The president-elect had pledged to find an honorable way to end U.S. casualties and went to Korea seeking a way to
      end the war.
  - id: C2
    facts:
    - F4
    - F5
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: A positive and definite victory appeared unlikely without a grave risk of enlarging the war, making escalation a
      dangerous route to the stated objective.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The war was a costly distraction from formulating a broader national-security policy, supporting a focus on bringing
      the conflict to a truce rather than expanding it.
  reasoning:
    read: The president-elect was choosing between pursuing a truce and seeking a military victory through escalation. The
      trap was to treat total victory as the only successful outcome, despite the assessment that achieving it could carry
      a grave risk of enlarging the war.
    weighing: The pledge to end U.S. casualties and the purpose of the Korea visit support pursuing an end to the war {C1}.
      The assessment that decisive victory was unlikely without a grave risk of widening the conflict weighs strongly against
      escalation {C2}; the war's cost to broader national-security planning reinforces that preference {C3}. The balance depends
      especially on the assessment of the prospects for decisive victory and the risk of enlarging the war.
    tradecraft: 'Keep the choice at the policy level: state why a truce is preferred and record the uncertainty about the
      prospects and risks of escalation. Do not treat the absence of a detailed end-of-war plan as a reason to default to
      escalation.'
    uncertainty: The president-elect had no specific plan for ending the war, and the assessment of victory and the risk of
      enlarging the conflict was not certain. The source gives no detailed account of how a truce would be secured.
    handoff: The president-elect should make the policy choice, informed by the military commanders and other relevant advisers;
      he met with military commanders during the visit {F3}.
    tempting_wrong:
      option: O2
      pull: A renewed offensive offered the prospect of military victory and unification of the peninsula by force.
      why_wrong: That prospect did not overcome the assessment that a positive and definite victory was unlikely without a
        grave risk of enlarging the war.
    rejected:
      O2: The president-elect did not favor pursuing military victory through escalation because decisive victory was assessed
        as unlikely without a grave risk of enlarging the war.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The assessment changed so that a positive and definite victory was judged likely without a grave risk of enlarging
        the war.
      then: O2
      why: Removing the central stated risk and obstacle to decisive victory could make escalation a viable alternative to
        pursuing a truce.
    would_not_change:
    - id: noflip1
      if: The president-elect still lacked a specific plan for ending the war.
      why: The absence of a detailed plan does not by itself answer the policy choice or negate the reasons favoring a truce
        over escalation.
    watch_for:
    - id: watch1
      what: Any reassessment of the likelihood of decisive victory and the risk that escalation would enlarge the war.
      favors:
      - O1
      - O2
      why: Those assessments are central to the stated reason for preferring a truce; a material change could alter the balance.
  lesson: When decisive victory is unlikely without a grave risk of enlarging a war, do not assume that escalation is the
    only honorable or successful course. Weigh the human cost and broader strategic burden against the prospect of a truce,
    and make the policy choice in light of those assessments.
  limits: This reasoning addresses the president-elect's policy choice in December 1952, on the assessments described here.
    It does not establish that a truce was certain to succeed, prescribe negotiating terms, or resolve other circumstances
    in which the prospects and risks of escalation differ.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-61a73cea
    source: https://www.cia.gov/resources/csi/static/d0ffa5577ded795c20bb1cc385e9340b/Eisenhower-and-Intel-Reporting.pdf
    episode_focus: The decision point is the president-elect’s choice between pursuing a negotiated truce and seeking military
      victory through escalation, including plans that could involve atomic weapons. Focus on the policy rationale stated
      in the passage—the grave risk of enlarging the war and the absence of a likely positive victory—and exclude operational
      details of the proposed offensive.
