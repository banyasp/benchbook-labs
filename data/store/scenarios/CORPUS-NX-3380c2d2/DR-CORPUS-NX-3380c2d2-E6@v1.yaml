case:
  id: DR-CORPUS-NX-3380c2d2-E6@v1
  title: Expansion of Delta Programs
  status: draft
  setting: During the Vietnam War, in the Delta provinces just below Saigon, at the CIA station and in Washington.
  decider: The CIA station and Washington decision-makers
  agent: The CIA station and Washington decision-makers
  agent_role: decide
  situation: The CIA station and Washington faced a choice about extending their programs into additional provinces. Preliminary
    results from Kien Hoa and a similar program in Quang Ngai were available. The proposed expansion covered a swath of provinces
    crossing the Mekong Delta just below Saigon. Experience suggested that programs led by ARVN officers convinced of their
    potential could improve the balance of forces in Saigon’s favor. The perceived absence of alternatives was also part of
    the decision context.
  question: What should the CIA station and Washington decision-makers do about extending the programs into additional provinces
    across the Mekong Delta below Saigon?
  options:
    O1:
      do: The station and Washington hold expansion pending a further review of the preliminary results.
      move: hold
      irreversible: false
    O2:
      do: The station and Washington expand the programs into additional provinces across the Mekong Delta below Saigon.
      move: act
      irreversible: false
    O3:
      do: The station and Washington confine the programs to Kien Hoa and Quang Ngai.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Preliminary results from the program in Kien Hoa were available.
  - id: F2
    kind: situation
    status: confirmed
    fact: A similar program in Quang Ngai had preliminary results.
  - id: F3
    kind: situation
    status: assessed
    fact: The absence of alternatives was treated as part of the case for expanding the programs.
  - id: F4
    kind: capability
    status: assessed
    fact: Programs led by ARVN officers convinced of their potential materially improved the balance of forces in Saigon’s
      favor.
  - id: F5
    kind: situation
    status: confirmed
    fact: The proposed expansion covered a swath of provinces crossing the Mekong Delta just below Saigon.
  - id: F6
    kind: authority
    status: confirmed
    fact: The CIA station and Washington were the institutional decision-makers on expanding the programs.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The station and Washington treated preliminary results in Kien Hoa and the similar program in Quang Ngai as sufficient
      support for extending the effort.
  - id: C2
    facts:
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The perceived absence of alternatives reinforced the case for expansion rather than limiting the programs or waiting.
  - id: C3
    facts:
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    - O3
    weight: weak
    why: The account links material gains to ARVN officers convinced of the programs’ potential, so success across the proposed
      additional provinces should not be assumed to be uniform.
  reasoning:
    read: This was an institutional choice to extend programs across additional provinces, based on preliminary results and
      the perceived lack of alternatives. The trap is treating conditional success under convinced ARVN leadership as proof
      that results would be uniform across the proposed expansion.
    weighing: The station and Washington judged the preliminary results from Kien Hoa and Quang Ngai, together with the absence
      of alternatives, to justify expansion. The account also associates gains with capable, committed ARVN leadership, which
      qualifies how broadly those results should be expected to apply. On the reasons given, the balance nevertheless favored
      {O2}; it depended on the preliminary results being meaningful and on leadership being able to support the programs.
    tradecraft: Record the decision as an expansion based on the preliminary results and the perceived absence of alternatives,
      and state that effectiveness may depend on ARVN leadership. Track subsequent results by province and revisit the scope
      if the basis for expansion does not hold. This is decision-level advice, not a source-stated procedure.
    uncertainty: The results were preliminary, and the account describes effectiveness as dependent on leadership. It does
      not establish that the proposed expansion would produce the same gains in every province.
    handoff: The station and Washington were the identified institutional decision-makers. No additional approval authority
      is identified; both should be aligned on the rationale and the conditions that would prompt reconsideration.
    tempting_wrong:
      option: O1
      pull: Waiting for a fuller review could seem prudent because the results were preliminary.
      why_wrong: The source’s decision-makers treated those preliminary results, combined with the perceived absence of alternatives,
        as enough to justify expansion rather than delay.
    rejected:
      O1: A further review before expanding was not chosen because the preliminary results and perceived absence of alternatives
        were judged to justify proceeding.
      O3: Confining the programs to Kien Hoa and Quang Ngai was not chosen because the station and Washington concluded that
        the case justified extending the effort into additional provinces.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Further review showed that the preliminary results did not indicate useful gains.
      then: O1
      why: The stated basis for expansion would be substantially weakened, making a hold for review more appropriate.
    - id: flip2
      if: The proposed additional provinces lacked ARVN leadership able to support the programs effectively.
      then: O3
      why: The account links material gains to ARVN officers convinced of the programs’ potential, so lacking that condition
        would weaken the case for broad expansion.
    would_not_change:
    - id: noflip1
      if: Additional provinces had leadership comparable to the convinced ARVN officers associated with gains.
      why: That condition would reinforce, rather than reverse, the source’s rationale for expansion.
    watch_for:
    - id: watch1
      what: Whether the preliminary results hold up and whether capable, committed ARVN leadership is available across the
        proposed expansion.
      favors:
      - O1
      - O3
      why: Weakening results or a lack of the leadership condition associated with gains would reduce the case for broad expansion.
  lesson: Preliminary success and the lack of alternatives can support expansion when decision-makers judge the mission needs
    it. But where success depends on local leadership, do not assume results will transfer uniformly; make that dependency
    part of the decision and its review.
  limits: This reasoning applies to the source’s expansion decision and its stated rationale, not to the legality or effectiveness
    of every program in every province. The account does not establish a legal rule, detailed implementation conditions, or
    results from the proposed expansion.
  library:
    domain: operational-command
    family: CORPUS-NX-3380c2d2
    source: https://www.cia.gov/resources/csi/static/785ee9ff79dcbe318bf589aee5d02703/Part-2-AhernMemoir-14Dec2023.pdf
