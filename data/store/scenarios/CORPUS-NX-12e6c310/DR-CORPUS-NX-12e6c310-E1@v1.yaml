case:
  id: DR-CORPUS-NX-12e6c310-E1@v1
  title: Martial Law in Isfahan
  status: draft
  setting: Isfahan, 11 August; Iranian Government
  decider: The Iranian Government
  agent: The Iranian Government
  agent_role: decide
  situation: On 11 August in Isfahan, a religious demonstration was underway. Police attempts to disperse it were followed
    by rioting. Military forces had been called in to restore order. Isfahan was an industrial and tourist center. Casualties
    in Isfahan and other cities had increased the number killed and injured, but reliable figures were unavailable. Reports
    that martial law might already have been imposed in three nearby small cities were unconfirmed.
  question: What should the Iranian Government do in response to the rioting in Isfahan?
  options:
    O1:
      do: The Iranian Government should approve a one-month martial-law declaration for Isfahan with a curfew and a ban on
        gatherings of three or more persons.
      move: act
      irreversible: false
    O2:
      do: The Iranian Government should reject a one-month martial-law declaration for Isfahan with a curfew and a ban on
        gatherings of three or more persons.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Isfahan was an industrial and tourist center.
  - id: F2
    kind: situation
    status: confirmed
    fact: A religious demonstration took place in Isfahan.
  - id: F3
    kind: situation
    status: confirmed
    fact: Police attempts to break up the demonstration led to rioting.
  - id: F4
    kind: situation
    status: confirmed
    fact: Military forces were called in to restore order.
  - id: F5
    kind: situation
    status: confirmed
    fact: Casualties in Isfahan and other cities increased the total killed and injured.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: Reliable figures for the killed and injured were not yet available.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Unconfirmed press reports indicated martial law might already have been imposed in three small cities near Isfahan.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The situation was assessed as serious, and the government intended to confront extremists with force it considered
      necessary to restore order.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The demonstrations escalated into rioting, military forces had been called to restore order, and the situation was
      assessed as serious; the appraisal supports the government's chosen response as a means of restoring order.
  - id: C2
    facts:
    - F1
    - F8
    equity: critical_services
    favors:
    - O1
    weight: weak
    why: The appraisal treats Isfahan's importance as an industrial and tourist center as an indication of the seriousness
      of the situation, supporting a forceful response.
  - id: C3
    facts:
    - F5
    - F6
    equity: civilian_life
    favors:
    - O1
    weight: weak
    why: The increasing number of people killed and injured adds to the stakes, although the unavailable reliable figures
      limit what can be concluded about the scale of casualties.
  reasoning:
    read: 'This is a serious public-order crisis: an attempt to disperse a religious demonstration was followed by rioting,
      and military forces were called in to restore order. The trap is to treat the casualty total as precise or the nearby-city
      reports as confirmed; neither is established, even though the appraisal assesses the situation as serious.'
    weighing: 'The appraisal''s stated rationale favors {O1}: the situation is serious, and the government intends to use
      the force it considers necessary to restore order. Isfahan''s industrial and tourist importance reinforces that assessment.
      The balance depends chiefly on the seriousness of the unrest and the need to restore order, not on an exact casualty
      count or unconfirmed reports from nearby cities.'
    tradecraft: State the decision, its one-month duration, and its curfew and gathering restrictions clearly. Keep the rationale
      tied to the assessed seriousness and restoration of order; reassess the decision as reliable casualty information and
      conditions on the ground become available.
    uncertainty: The number killed and injured was not reliably known. Reports of martial law in three nearby cities were
      unconfirmed, so they should not be treated as established facts.
    handoff: The Iranian Government is the identified decision-maker. The decision record should make its public-order rationale
      and the uncertainty in the casualty and nearby-city information clear; the source identifies no separate approval authority.
    tempting_wrong:
      option: O2
      pull: Rejecting the declaration may seem preferable because the incident began with a religious demonstration and the
        casualty figures are uncertain.
      why_wrong: That concern does not displace the appraisal's stated assessment that the situation was serious and that
        force was considered necessary to restore order.
    rejected:
      O2: The appraisal did not choose rejection because it assessed the situation as serious and presented martial law as
        the government's response to restore order.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable information before the decision showed that the rioting had ended and order had been restored.
      then: O2
      why: The stated rationale for the declaration is the seriousness of the situation and the need to restore order; if
        order were already restored, that rationale would be substantially weakened.
    would_not_change:
    - id: noflip1
      if: Reliable casualty figures remained unavailable.
      why: Unavailability of reliable figures limits certainty about casualties but would not, by itself, remove the appraisal's
        separate assessment that the situation was serious.
    watch_for:
    - id: watch1
      what: Whether credible information confirms martial law has also been imposed in nearby cities.
      favors:
      - O1
      why: Confirmation would support a broader assessment of the seriousness of the unrest, although the appraisal already
        bases its judgment on conditions in Isfahan.
  lesson: When unrest escalates and the decision-maker assesses the situation as serious, weigh the stated public-order objective
    against the reliability of the available information. Do not turn unconfirmed reports or unknown casualty figures into
    established facts.
  limits: This reasoning addresses the appraisal's judgment about restoring order in Isfahan, not whether martial law or particular
    restrictions satisfy any independent legal standard. It does not establish that the response would be appropriate if the
    situation were no longer serious or order had already been restored.
