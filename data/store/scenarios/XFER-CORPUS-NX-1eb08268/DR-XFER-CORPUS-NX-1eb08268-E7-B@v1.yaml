case:
  id: DR-XFER-CORPUS-NX-1eb08268-E7-B@v1
  title: Two Intrusion Sets in a Pipeline Operator
  status: draft
  setting: National Cyber Center incident room, Washington, D.C., 18 June 2025
  decider: The National Cyber Center incident lead
  agent: The National Cyber Center incident lead
  agent_role: decide
  situation: The National Cyber Center is coordinating with a pipeline operator after an adversary group was assessed to be
    inside the operator's business network. National cyber director guidance characterized the response as very important
    and said it must succeed. The group was assessed as seeking to connect with a second group, which might move to pool access
    with it. A highest-precedence directive from the agency director authorizes coordinated action with the operator. The
    incident lead faces a time-sensitive decision while the possible pooling of access remains an assessed concern.
  question: What should the incident lead do about the time-sensitive coordinated cyber-defense decision while two intrusion
    sets may pool access?
  options:
    O1:
      do: The incident lead declines immediate coordinated defensive action under the directive.
      move: act
      irreversible: false
    O2:
      do: The incident lead authorizes immediate coordinated defensive action under the directive.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: National cyber director guidance characterized the response as very important.
  - id: F2
    kind: situation
    status: confirmed
    fact: The guidance said the response must succeed.
  - id: F3
    kind: intelligence
    status: assessed
    fact: An adversary group was assessed to be inside the pipeline operator's business network.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The group was assessed as seeking to connect with a second group.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The second group might move to pool access with the first group.
  - id: F6
    kind: authority
    status: confirmed
    fact: A coordinated-action directive was issued at 0215 on 18 June 2025.
  - id: F7
    kind: authority
    status: confirmed
    fact: The directive carried the highest stated precedence.
  - id: F8
    kind: authority
    status: confirmed
    fact: The directive was issued by the agency director.
  - id: F9
    kind: authority
    status: confirmed
    fact: The directive authorized coordinated action with the pipeline operator.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The response was characterized as very important, and the guidance said it must succeed; the incident lead treated
      achieving that purpose as requiring action on the time-sensitive decision.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The assessed possibility that the two groups would pool access made timing material. The incident lead's stated reason
      was to act before that connection.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The directive came from the agency director, carried the highest stated precedence, and authorized coordinated action
      with the operator, providing the incident lead applicable authority.
  reasoning:
    read: The incident lead faced an assessed, time-sensitive risk that the two intrusion sets could pool access, not a certainty
      that they would. The trap in declining action is to let that uncertainty obscure the shrinking opportunity to act before
      the connection.
    weighing: The guidance gives weight to the response's importance and the requirement that it succeed, but the stated urgency
      turns on the assessed possibility of the groups pooling access. The incident lead chose to act before that could occur;
      the balance depends on the connection remaining a live concern. The highest-precedence directive from the agency director,
      authorizing coordinated action with the operator, supports that choice.
    tradecraft: Carry out the authorized decision promptly, keep the decision record focused on the assessed timing concern
      and the directive's authority, and update the decision if the underlying assessment changes.
    uncertainty: Whether the groups would pool access was an assessment, not a confirmed event. The source nevertheless treats
      the possibility and timing as sufficient to warrant immediate action.
    handoff: The incident lead made the decision under a directive from the agency director; the source does not indicate
      that the choice was referred elsewhere.
    tempting_wrong:
      option: O1
      pull: Declining immediate action could seem prudent because pooling access was only assessed as possible.
      why_wrong: The incident lead's stated judgment was that delay could forfeit the opportunity to act before the groups
        pooled access.
    rejected:
      O1: The incident lead did not decline immediate action because it judged that the assessed risk of the groups pooling
        access made timing important.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable reassessment removed the possibility that the two intrusion sets could pool access in the relevant period.
      then: O1
      why: The stated urgency for immediate action depended on acting before the assessed pooling of access; without that
        timing concern, the source's decisive reason would no longer apply.
    would_not_change:
    - id: noflip1
      if: The possibility that the intrusion sets will pool access remains assessed rather than confirmed.
      why: 'That uncertainty alone would not reverse the choice: the incident lead acted on an assessed possibility because
        the timing mattered.'
    watch_for:
    - id: watch1
      what: Whether the assessed possibility and timing of the intrusion sets pooling access remain current.
      favors:
      - O2
      why: The source's urgency rests on acting before a possible pooling of access.
  lesson: When a cyber-defense decision turns on a time-sensitive assessed risk, uncertainty does not by itself require delay.
    Weigh the importance of the response and the opportunity to act against whether the risk and its timing remain credible.
  limits: This reasoning applies to the source's assessed access-pooling concern and its stated directive, not to other responses
    or legal standards. It does not establish that urgency alone warrants action when authority or the underlying assessment
    is absent.
