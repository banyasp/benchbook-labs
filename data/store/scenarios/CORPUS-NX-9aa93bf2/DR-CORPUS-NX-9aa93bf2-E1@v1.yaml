case:
  id: DR-CORPUS-NX-9aa93bf2-E1@v1
  title: Compensation for Deprivation of Life
  status: draft
  setting: Place and date not stated; the Supreme Court, in an Article 32 proceeding.
  decider: The Supreme Court
  agent: The Supreme Court
  agent_role: decide
  situation: Two persons and others were seized from a hut, taken a long distance in a truck, and shot. The Court is considering
    public-law compensation for the families of the deceased under Article 32. The issue includes whether the State may rely
    on sovereign functions to resist a remedy for a deprivation of life and liberty. Article 21 protects the right to life,
    and public-law compensation is available in proceedings under Article 32 or Article 226 for contravention of fundamental
    rights on a strict-liability basis. Sovereign immunity may be available in private-law tort actions, while the assessment
    of compensation is distinct from criminal punishment, which belongs to criminal courts.
  question: What should the Supreme Court do about compensation under Article 32 for the families of the deceased?
  options:
    O1:
      do: The Court should deny each deceased person's family compensation under Article 32.
      move: act
      irreversible: false
    O2:
      do: The Court should grant each deceased person's family Rs. 100,000 in compensation under Article 32.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Two persons and others were seized from a hut, taken a long distance in a truck, and shot.
  - id: F2
    kind: authority
    status: confirmed
    fact: The issue included whether the State could invoke sovereign functions to resist a remedy for deprivation of life
      and liberty.
  - id: F3
    kind: authority
    status: confirmed
    fact: Article 21 guarantees the fundamental right to life.
  - id: F4
    kind: authority
    status: confirmed
    fact: Public-law compensation for contravention of fundamental rights is available in proceedings under Article 32 before
      the Supreme Court or Article 226 before a High Court, based on strict liability.
  - id: F5
    kind: authority
    status: confirmed
    fact: Sovereign immunity may be available as a defense in a private-law tort action.
  - id: F6
    kind: authority
    status: confirmed
    fact: Compensation is assessed for its compensatory rather than punitive effect; punishment is left to criminal courts,
      and the State has a duty to prosecute the offender.
  - id: F7
    kind: authority
    status: confirmed
    fact: Article 9(5) of the International Covenant on Civil and Political Rights provides an enforceable right to compensation
      for a victim of unlawful arrest or detention.
  - id: F8
    kind: situation
    status: confirmed
    fact: The compensation under consideration is for the family of each deceased person.
  considerations:
  - id: C1
    facts:
    - F1
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Seizing people and shooting them instead of dealing with them according to law is conduct the Court said could not
      be countenanced, even in a disturbed area; administrative liquidation was not a lawful course.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Article 21 recognizes no exception to the right to life based on sovereign functions. Public-law compensation is
      available for a fundamental-rights violation on a strict-liability basis, and sovereign immunity does not bar that remedy.
  - id: C3
    facts:
    - F4
    - F7
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Compensation is a mode of enforcing fundamental rights; the Court also relied on the ICCPR's enforceable compensation
      right for unlawful arrest or detention. The families of the deceased are the recipients of the remedy here.
  - id: C4
    facts:
    - F6
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The award is meant to compensate the families and remedy the harm, not punish the offenders. Criminal punishment
      is a separate matter for criminal courts, and the State is legally bound to prosecute.
  reasoning:
    read: This is a public-law claim for a remedy following a deprivation of life, not a private-law tort action. The trap
      is to treat the invocation of sovereign functions, or the fact that the area was disturbed, as permission for an extra-legal
      killing or as a bar to Article 21 relief.
    weighing: 'The Court''s reasoning favors compensation: Article 21 admits no sovereign-functions exception, and strict-liability
      public-law compensation is available for a fundamental-rights violation {C1} {C2}. The private-law availability of sovereign
      immunity does not defeat this Article 32 remedy {C2}. Compensation addresses the families'' harm; punishment remains
      for criminal courts {C4}. The Court considered Rs. 100,000 for each family appropriate and just {F8}.'
    tradecraft: Give each deceased person's family the stated Rs. 100,000 award and keep the compensatory basis of the award
      distinct from any criminal punishment.
    uncertainty: The Court states the outcome and amount, but the supplied reasons do not give a method for calculating the
      amount or facts about any separate criminal proceedings.
    handoff: The Supreme Court can decide the Article 32 compensation claim; criminal courts handle punishment, while the
      State has a duty to prosecute.
    tempting_wrong:
      option: O1
      pull: The State might invoke sovereign functions, particularly in a disturbed area, or argue that criminal proceedings
        are the only proper response.
      why_wrong: The Court held that Article 21 recognizes no such exception and sovereign immunity does not bar public-law
        compensation; compensation remedies the harm and does not replace criminal punishment.
    rejected:
      O1: The Court rejected denial because sovereign immunity does not bar public-law compensation for a fundamental-rights
        violation, and it found Rs. 100,000 for each family appropriate and just.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The facts did not establish a contravention of a fundamental right or other basis for public-law compensation.
      then: O1
      why: The strict-liability public-law remedy described by the Court is for contravention of fundamental rights; without
        such a contravention, that stated basis for an award would be absent.
    would_not_change:
    - id: noflip1
      if: The State asserted that the deprivation occurred while its officers exercised sovereign functions.
      why: The Court held that sovereign immunity does not apply to this public-law compensation claim, even though it may
        be available in a private-law tort action.
    - id: noflip2
      if: Criminal courts separately considered punishment for the offenders.
      why: The Court treated punishment as separate from the compensatory award and stated that criminal courts handle punishment.
    watch_for: []
  lesson: A State actor cannot defeat a public-law remedy for a fundamental-rights violation merely by invoking sovereign
    functions. Compensation under that remedy is for the harm suffered; criminal punishment remains a separate responsibility
    of the criminal courts.
  limits: This reasoning concerns public-law compensation for a fundamental-rights violation under Article 32 or Article 226.
    It does not determine the availability of sovereign immunity in a private-law tort action or decide criminal liability.
