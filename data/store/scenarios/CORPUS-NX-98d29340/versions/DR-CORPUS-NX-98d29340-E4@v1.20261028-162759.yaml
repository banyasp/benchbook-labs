case:
  id: DR-CORPUS-NX-98d29340-E4@v1
  title: Review Before Public Release
  status: draft
  setting: Before public release, within a CCMD and under its policies and procedures.
  decider: The CCDR
  agent: The CCDR
  agent_role: decide
  situation: A report is prepared for public release. Before release, the CCDR must consider a comprehensive operations security
    review under the command's policies and procedures. The review considers risks associated with aggregating data. Public
    release may inadvertently reveal classified or sensitive information. Aggregated information may also enable adversaries
    to recognize sensitive operational patterns or develop countermeasures. The CCDR can publish the report as planned, delay
    or withhold release, or limit the report's scope.
  question: What should the CCDR do with the report before public release?
  options:
    O1:
      do: The CCDR withholds the report from public release.
      move: act
      irreversible: true
    O2:
      do: The CCDR limits the report's scope for public release.
      move: partial
      irreversible: true
    O3:
      do: The CCDR delays public release of the report.
      move: hold
      irreversible: false
    O4:
      do: The CCDR publishes the report as planned.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision concerns reports before public release.
  - id: F2
    kind: authority
    status: confirmed
    fact: Before public release, CCMDs should conduct comprehensive operations security reviews under their respective policies
      and procedures.
  - id: F3
    kind: situation
    status: confirmed
    fact: The review should consider risks associated with data aggregation.
  - id: F4
    kind: situation
    status: confirmed
    fact: The review helps minimize the risk of inadvertently revealing classified or sensitive information.
  - id: F5
    kind: situation
    status: assessed
    fact: Adversaries may recognize operational patterns associated with sensitive practices.
  - id: F6
    kind: situation
    status: assessed
    fact: Adversaries may develop measures to counter U.S. operations or capabilities.
  - id: F7
    kind: authority
    status: confirmed
    fact: CCDRs may withhold reports from publication as necessary to protect classified or sensitive information.
  - id: F8
    kind: authority
    status: confirmed
    fact: CCDRs may delay publication as necessary to protect classified or sensitive information.
  - id: F9
    kind: authority
    status: confirmed
    fact: CCDRs may limit the scope of publication as necessary to protect classified or sensitive information.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: policy_compliance
    favors:
    - O2
    weight: weak
    why: The prescribed pre-release review must follow command policies and consider aggregation risks; its findings should
      inform the report's releasable scope.
  - id: C2
    facts:
    - F4
    equity: classification_integrity
    favors:
    - O1
    - O2
    - O3
    weight: strong
    why: The review is intended to minimize the risk that public release inadvertently reveals classified or sensitive information,
      and the CCDR may limit publication as necessary to protect it.
  - id: C3
    facts:
    - F5
    - F6
    equity: security_risk
    favors:
    - O1
    - O2
    - O3
    weight: strong
    why: Aggregated information may help adversaries recognize sensitive operational patterns or develop countermeasures,
      supporting a protective publication choice when the review identifies that risk.
  reasoning:
    read: This is a pre-release security decision, not a general judgment about whether the report should be public. The trap
      is assuming that information safe in isolation is safe when aggregated, or treating planned publication as automatic
      before the required review.
    weighing: 'The review should consider aggregation and the risks of revealing classified or sensitive information or exposing
      operational patterns. The source authorizes withholding, delay, or limits as necessary to protect that information;
      on this fixed scenario, limiting scope is the selected protective course. The source does not establish that limiting
      is always preferable: the balance depends on what the review finds and what protection is necessary.'
    tradecraft: Complete the comprehensive review under the command's policies before release, assess aggregation risks, and
      identify what scope can be released without the risks described. Record the review's findings and the basis for the
      chosen publication scope without including sensitive operational details in the public report.
    uncertainty: The facts describe risks that may arise but do not establish what the review found about this report or whether
      limiting scope will sufficiently address them. The source makes the protective measures conditional on what is necessary.
    handoff: The CCDR decides, using the CCMD's policies and procedures and the required operations security review; the source
      does not specify another decision-maker.
    tempting_wrong:
      option: O1
      pull: Withholding avoids public exposure altogether.
      why_wrong: The source permits withholding when necessary, but does not make it the default; on the stated outcome, limiting
        scope is selected instead.
    rejected:
      O1: Withholding is authorized when necessary, but the selected course is to limit the scope rather than withhold the
        entire report.
      O3: Delay is authorized when necessary, but the stated outcome is to limit the report's scope for release.
      O4: Publishing as planned without using the review to address identified risks would not protect against the source's
        stated disclosure and aggregation concerns.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The review finds that limiting the report's scope would not sufficiently protect classified or sensitive information
        and that withholding is necessary.
      then: O1
      why: The source expressly permits withholding when necessary to protect classified or sensitive information.
    - id: flip2
      if: The review finds that a temporary delay, rather than a scope limit, is necessary to protect classified or sensitive
        information.
      then: O3
      why: The source expressly permits delay when necessary for that protection.
    would_not_change:
    - id: noflip1
      if: Individual items appear harmless when considered separately, but aggregation may reveal sensitive information or
        operational patterns.
      why: The review is specifically to consider the risks of data aggregation.
    watch_for:
    - id: watch1
      what: Whether publication could reveal classified or sensitive information, expose sensitive operational patterns, or
        help adversaries develop countermeasures.
      favors:
      - O1
      - O2
      - O3
      why: These are the risks the review is meant to minimize and the stated basis for protective publication measures.
  lesson: Before public release, review the report under the applicable command policies and consider what aggregation may
    reveal, not only what each item reveals alone. Use withholding, delay, or a scope limit when necessary to protect classified
    or sensitive information; the appropriate measure depends on the review's findings.
  limits: The source does not establish that this report actually contains classified or sensitive information, identify the
    review's findings, or prescribe a universal preference among withholding, delay, and limiting scope. The selected scope
    limit is specific to the fixed scenario's stated outcome.
  library:
    domain: natsec-other
    family: CORPUS-NX-98d29340
    source: https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodi/300017p.PDF?ver=EaU00OCh3Y07Kiu5BYOTYw%3d%3d
