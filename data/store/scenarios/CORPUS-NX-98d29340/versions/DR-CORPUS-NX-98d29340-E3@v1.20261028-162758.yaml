case:
  id: DR-CORPUS-NX-98d29340-E3@v1
  title: Civilian-Harm Public Reporting
  status: draft
  setting: CCDR public-report process; time and place unspecified.
  decider: The CCDR
  agent: The CCDR
  agent_role: decide
  situation: The CCDR is preparing the required public report and must decide what to publish about a civilian-harm incident
    or a related review, assessment, or investigation. In exceptional cases, public disclosure may involve information provided
    in confidence or may significantly impede an ongoing review. Disclosure may also create risks associated with adversarial
    or malicious disinformation. Pending criminal matters or other pending investigations, proceedings, or deliberations may
    affect what information is publicly releasable. The CCDR must determine whether to disclose, omit, withhold, delay, or
    limit publication.
  question: What should the CCDR publish, omit, withhold, or limit in the public report about the civilian-harm incident or
    review?
  options:
    O1:
      do: The CCDR discloses the incident and review information in the required public report.
      move: act
      irreversible: true
    O2:
      do: The CCDR limits incident and review information in the required public report to releasable material.
      move: partial
      irreversible: false
    O3:
      do: The CCDR withholds the incident and review information from the required public report.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: A public report is required under Paragraph 5.3.a.
  - id: F2
    kind: authority
    status: confirmed
    fact: The CCDR determines whether exceptional cases make public reporting inappropriate.
  - id: F3
    kind: situation
    status: confirmed
    fact: Public disclosure may reveal information provided with an understanding that it would be held in confidence.
  - id: F4
    kind: situation
    status: confirmed
    fact: Public disclosure of an incident may significantly impede a review, assessment, or investigation.
  - id: F5
    kind: situation
    status: confirmed
    fact: Public disclosure may create risks associated with adversarial or otherwise malicious use of disinformation.
  - id: F6
    kind: authority
    status: confirmed
    fact: The CCDR may omit an incident or the fact of a civilian-harm review, assessment, or investigation from the required
      public report in exceptional cases.
  - id: F7
    kind: authority
    status: confirmed
    fact: The CCDR may appropriately limit information published pursuant to Paragraph 5.3.b.
  - id: F8
    kind: authority
    status: confirmed
    fact: For pending criminal matters or other pending investigations, proceedings, or deliberations, the CCDR should take
      care to publish only publicly releasable information.
  - id: F9
    kind: authority
    status: confirmed
    fact: The CCDR may withhold, delay, or limit publication as necessary to protect ongoing investigations, legal processes,
      or individual privacy.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F6
    - F7
    equity: public_transparency
    favors:
    - O2
    - O3
    weight: strong
    why: The public report is required, but the CCDR may determine that disclosure is inappropriate when it would reveal information
      supplied in confidence; the policy allows omission or appropriately limited publication in exceptional cases.
  - id: C2
    facts:
    - F4
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    - O3
    weight: strong
    why: Disclosure that may significantly impede an ongoing review, assessment, or investigation supports limiting what is
      published and, in an exceptional case, omitting the incident or the fact of the review.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: security_risk
    favors:
    - O2
    - O3
    weight: weak
    why: The policy recognizes that adversarial or malicious disinformation risks can make public reporting inappropriate
      or call for limits on published information.
  - id: C4
    facts:
    - F8
    - F9
    equity: duty_to_individual
    favors:
    - O2
    - O3
    weight: strong
    why: For pending matters, the CCDR should publish only publicly releasable information and may withhold, delay, or limit
      publication as necessary to protect legal processes, ongoing investigations, or individual privacy.
  reasoning:
    read: 'The CCDR must produce the required public report, but that does not make every detail or even the fact of a review
      automatically publishable. The trap is treating the choice as unrestricted disclosure or blanket secrecy: the policy
      permits tailored limits and, in exceptional cases, omission.'
    weighing: 'The confidentiality, ongoing-review, and disinformation concerns support restricting disclosure; pending proceedings
      and privacy further constrain what is publicly releasable. The balance favors {O2}: publish releasable material and
      limit the rest, reserving omission or withholding for circumstances where the CCDR determines it is appropriate or necessary.
      The degree of restriction depends on the specific disclosure risk and the status and needs of any ongoing process.'
    tradecraft: Identify which material is publicly releasable, limit the report to that material where needed, and withhold
      or delay only to the extent necessary to protect the identified interest. Record the basis for the restriction and revisit
      it if the relevant investigation, proceeding, or risk changes.
    uncertainty: The policy gives examples and discretion rather than establishing that every listed concern requires omission.
      The excerpt does not establish which information is actually confidential, how substantial any impediment or disinformation
      risk is, or what limits would suffice in a particular report.
    handoff: The CCDR makes the exceptional-case determination. The policy excerpt does not specify an approval or referral
      process; obtaining appropriate legal or privacy review is a prudent implementation step, not a stated requirement.
    tempting_wrong:
      option: O1
      pull: The report is required, and public disclosure can promote transparency.
      why_wrong: The reporting requirement does not override the express discretion to omit or limit information or the direction
        to publish only publicly releasable information in pending matters.
    rejected:
      O1: Unrestricted disclosure was not chosen because the policy permits limits to protect confidentiality, ongoing reviews
        and proceedings, and individual privacy.
      O3: Complete withholding was not chosen because the policy also requires a public report and supports limiting publication
        to protect the relevant interests rather than automatically suppressing all incident and review information.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The CCDR determines that public disclosure of the incident would significantly impede an ongoing review, assessment,
        or investigation.
      then: O3
      why: In an exceptional case, the policy permits omitting the incident or the fact of the review from the required public
        report.
    - id: flip2
      if: All relevant information is publicly releasable and the CCDR determines that no exceptional disclosure concern or
        pending-process or privacy protection calls for restriction.
      then: O1
      why: With no identified basis for restricting publication, fuller disclosure would be consistent with the required public-report
        process.
    would_not_change:
    - id: noflip1
      if: The public-report requirement remains in force.
      why: That requirement alone does not displace the policy's express authority to omit or limit publication in exceptional
        cases or to protect pending processes and privacy.
    watch_for:
    - id: watch1
      what: Whether a criminal matter, investigation, proceeding, or deliberation remains pending, and what information is
        publicly releasable.
      favors:
      - O2
      - O3
      why: The policy calls for care in pending matters and permits withholding, delay, or limits as necessary to protect
        ongoing investigations, legal processes, or privacy.
  lesson: A required public report does not require unrestricted disclosure. Publish what is publicly releasable, tailor restrictions
    to the confidentiality, process-integrity, disinformation, and privacy concerns at issue, and reserve omission or withholding
    for cases where the applicable exception or protection warrants it.
  limits: This reasoning concerns the CCDR's public-report decision under the cited policy. It does not determine what information
    is publicly releasable in a particular case or establish that any listed concern automatically requires omission or withholding.
  library:
    domain: natsec-other
    family: CORPUS-NX-98d29340
