    episode_focus: The doctrine permits omission or limits on publication in exceptional cases, including confidentiality,
      risk to an ongoing review, or disinformation concerns; it also allows withholding, delay, or narrowing publication to
      protect pending proceedings or privacy. Focus on the disclosure decision and those competing interests; exclude operational
      details that could be revealed in any particular report.
