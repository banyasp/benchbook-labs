case:
  id: DR-CORPUS-NX-862cb7df-E1@v1
  title: The Six-Day Delay
  status: draft
  setting: A residency, recently; Headquarters and an agent located in a country facing impending danger.
  decider: The resident
  agent: The resident
  agent_role: decide
  situation: Headquarters has decided that an agent should leave the country immediately because of impending danger. A case
    officer has been asked to make a quick contact to convey that instruction. The case officer has not conveyed it immediately,
    has told the agent not to travel without approval, and has set a follow-up meeting for six days later. The resident must
    decide whether to intervene now or leave that plan in place.
  question: What should the resident do about the case officer's six-day delay in conveying Headquarters' instruction?
  options:
    O1:
      do: The resident directs the case officer to have the agent remain in the country until the six-day follow-up.
      move: act
      irreversible: false
    O2:
      do: The resident directs the case officer to have the agent depart the country immediately.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Headquarters decided that the agent should leave the country immediately.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The stated reason for Headquarters' decision was impending danger.
  - id: F3
    kind: situation
    status: confirmed
    fact: The case officer was asked to make a quick contact to convey Headquarters' decision.
  - id: F4
    kind: situation
    status: confirmed
    fact: The case officer did not convey the instruction immediately.
  - id: F5
    kind: situation
    status: confirmed
    fact: The case officer told the agent not to travel anywhere without approval.
  - id: F6
    kind: situation
    status: confirmed
    fact: The case officer set another meeting for six days later.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Headquarters decided that the agent should leave immediately because of impending danger, so delaying the instruction
      leaves the agent exposed to the danger the decision addresses.
  - id: C2
    facts:
    - F1
    - F3
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The contact's purpose was to convey Headquarters' decision quickly; failing to convey it promptly defeats the purpose
      for which the meeting was arranged.
  - id: C3
    facts:
    - F3
    - F4
    equity: tempo
    favors:
    - O2
    weight: strong
    why: The case officer lost the initiative by allowing matters unrelated to the urgent purpose to displace immediate action.
  - id: C4
    facts:
    - F1
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The case officer's instruction to wait for approval and the six-day follow-up cannot stand in place of Headquarters'
      immediate departure decision.
  reasoning:
    read: This is an urgent instruction to leave because of impending danger, not a routine meeting whose other business can
      come first. The trap is letting a delayed follow-up and the case officer's added restriction displace the purpose of
      the quick contact.
    weighing: The danger and Headquarters' immediate decision weigh strongly against waiting. The quick contact was specifically
      meant to convey that decision, while the case officer's delay and loss of initiative undermine its purpose; no reason
      for a six-day delay is given. The balance would depend on whether Headquarters' instruction and the danger remained
      current.
    tradecraft: The resident should intervene at once, ensure the instruction is conveyed and acted on as directed, and record
      the correction and its rationale through ordinary accountability channels.
    uncertainty: The account gives no further detail about the danger or any change to Headquarters' decision; it provides
      no basis for treating the six-day delay as necessary.
    handoff: The resident should correct the delay. Headquarters has already made the underlying decision, and the account
      gives no reason to refer the matter elsewhere before acting.
    tempting_wrong:
      option: O1
      pull: The case officer has set a plan and told the agent not to travel without approval.
      why_wrong: That plan postpones the instruction for six days despite Headquarters' decision to have the agent leave immediately
        because of impending danger.
    rejected:
      O1: The resident should not leave the six-day wait in place because it conflicts with the urgent purpose of conveying
        Headquarters' decision.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Headquarters withdraws or replaces its immediate-departure decision and directs the agent to remain through the
        follow-up.
      then: O1
      why: Without an active instruction to leave immediately, the stated basis for overriding the wait would no longer apply.
    would_not_change:
    - id: noflip1
      if: The case officer prefers to continue the delayed plan while Headquarters' immediate instruction remains active.
      why: That preference does not address the impending danger or the urgent purpose of the contact.
    watch_for:
    - id: watch1
      what: Whether Headquarters' instruction remains active and the impending danger still informs the decision.
      favors:
      - O2
      why: The urgency rests on Headquarters' immediate decision and its stated reason of impending danger.
  lesson: When a contact is arranged to convey an urgent decision, keep the action focused on that purpose. Do not let secondary
    matters or an avoidable follow-up delay defeat an instruction addressing impending danger.
  limits: This reasoning applies while the immediate-departure instruction remains active and its stated danger has not been
    displaced by new direction. It does not resolve what to do if Headquarters changes the instruction or the basis for it.
  library:
    domain: operational-command
    family: CORPUS-NX-862cb7df
    source: https://www.cia.gov/resources/csi/static/c10fb118b5497b6c7243c221c5d8d218/Operational-Contacts.pdf
