      stand. The source says the resident corrected the situation immediately; focus on the urgent danger and instruction,
      and exclude the unrelated meeting details and any covert-contact procedures.
    cues:
      option_words:
        O1: 18
        O2: 14
      real_option: O2
      real_to_mean_other_length: 0.78
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: true
    equities: pilot2
