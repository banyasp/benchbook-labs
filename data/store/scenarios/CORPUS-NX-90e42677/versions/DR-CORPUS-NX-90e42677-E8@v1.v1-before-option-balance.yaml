case:
  id: DR-CORPUS-NX-90e42677-E8@v1
  title: 'Mali: Advisory Assistance or Restraint'
  status: draft
  setting: Mali, after the March 2012 coup; State Department foreign-policy deliberations.
  decider: The State Department
  agent: The State Department
  agent_role: decide
  situation: After the March 2012 coup in Mali, the State Department focused on political negotiations as a response to extremist
    problems. The Defense Department advocated greater U.S. special-operations participation in counterinsurgency and counterterrorism
    operations. The State Department was concerned that U.S. military action could exacerbate extremism and undermine efforts
    to reach a political solution. The policy at issue was whether special-operations forces would provide robust advisory
    assistance to the Malian military.
  question: What should the State Department do about robust U.S. special-operations advisory assistance to the Malian military
    while addressing Mali’s extremist problems after the March 2012 coup?
  options:
    O1:
      do: The State Department would permit robust U.S. special-operations advisory assistance to the Malian military while
        pursuing political negotiations.
      move: act
      irreversible: false
    O2:
      do: The State Department would prohibit robust U.S. special-operations advisory assistance to the Malian military while
        pursuing political negotiations.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A coup took place in Mali in March 2012.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Defense Department advocated greater U.S. special-operations participation in counterinsurgency and counterterrorism
      operations.
  - id: F3
    kind: situation
    status: assessed
    fact: The State Department was concerned that U.S. military action could exacerbate extremism.
  - id: F4
    kind: situation
    status: assessed
    fact: The State Department was concerned that U.S. military action could undercut efforts to achieve a political solution.
  - id: F5
    kind: situation
    status: confirmed
    fact: Following the coup, the State Department focused on political negotiations as a solution to Mali’s extremist problems.
  - id: F6
    kind: authority
    status: confirmed
    fact: The State Department is the nation’s principal agency for conducting foreign policy and has the prerogative to choose
      policies different from those advocated by the Defense Department.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: The State Department's stated concern was that U.S. military action could intensify extremism and undermine the political
      solution it was pursuing.
  - id: C2
    facts:
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The State Department treated political negotiations as its chosen response to Mali's extremist problems, supporting
      restraint while that approach was being pursued.
  - id: C3
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Defense Department advocated greater U.S. special-operations participation, presenting an alternative policy
      judgment that the State Department had to weigh.
  - id: C4
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The State Department, as the principal foreign-policy agency, had the prerogative to choose a policy different from
      the one advocated by Defense.
  reasoning:
    read: 'This is a policy choice between restraint in favor of negotiations and permitting robust advisory assistance, not
      a judgment about how military operations should be conducted. The trap is treating either the risk of military action
      or the existence of a diplomatic approach as conclusive: the negotiation-focused approach failed to remedy the situation
      and was followed by a major extremist offensive.'
    weighing: The State Department's stated concerns about worsening extremism and undermining a political solution support
      {O2}, and its foreign-policy prerogative allowed it to reject Defense's preferred approach. However, negotiations failed
      to resolve the problem, and the episode warrants more serious consideration of Defense in future disputes. That hindsight
      qualifies the case for restraint; it does not establish that robust assistance would have succeeded or that the State
      Department should have chosen {O1} in this decision.
    tradecraft: State the policy rationale in terms of the assessed risks to the political process and extremism, record the
      competing Defense view, and revisit the judgment if the negotiation strategy fails to address the problem.
    uncertainty: The feared effects of military action and the failure of negotiations are identified, but it remains unknown
      what would have happened had robust assistance been permitted.
    handoff: The State Department remains the decision-maker under its foreign-policy prerogative. The State Department and
      White House should give Defense's concerns more serious consideration in future disputes.
    tempting_wrong:
      option: O1
      pull: Defense advocated greater participation, and the negotiation-focused policy failed to remedy the extremist problem.
      why_wrong: Those points warrant taking Defense's position seriously, but they do not show that robust assistance would
        have avoided the later failure or overcome the State Department's stated concerns.
    rejected:
      O1: The State Department did not permit robust assistance because it prioritized its concerns that U.S. military action
        could worsen extremism and undermine a political solution.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable new evidence showed that robust assistance would not exacerbate extremism or undercut efforts to reach
        a political solution.
      then: O1
      why: That evidence would weaken the State Department's stated reasons for restraint and make permitting assistance more
        supportable.
    would_not_change:
    - id: noflip1
      if: The Defense Department continued to advocate greater participation, without additional evidence that addressed the
        State Department's concerns.
      why: The existence of a competing departmental view alone does not resolve the policy risks; the State Department had
        the prerogative to choose a different policy.
    watch_for:
    - id: watch1
      what: Whether political negotiations remedy the extremist problem or instead fail to do so.
      favors:
      - O1
      why: The negotiation-focused approach failed, the extremist offensive followed, and the State Department and White House
        were urged to give Defense's position more serious consideration in future disputes.
  lesson: A foreign-policy decision-maker should weigh the risks that military action could worsen a conflict or damage a
    political process against the limits of restraint. When the chosen nonmilitary approach fails, that failure should prompt
    renewed consideration of the competing policy view, without assuming that the alternative would necessarily have succeeded.
  limits: This reasoning concerns the State Department's policy choice in the circumstances described and does not establish
    a general rule against military assistance. It does not establish that permitting robust assistance would have prevented
    the later offensive or produced a political solution.
