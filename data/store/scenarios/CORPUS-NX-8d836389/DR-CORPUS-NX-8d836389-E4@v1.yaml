case:
  id: DR-CORPUS-NX-8d836389-E4@v1
  title: Revising the Pacific Campaign Route
  status: draft
  setting: Navy campaign planning in the Pacific after OP. IV (1933).
  decider: Navy campaign planners
  agent: Navy campaign planners
  agent_role: decide
  situation: Navy campaign planners were considering whether to continue a direct massed-fleet advance toward the Philippines
    or use a staged advance. Earlier games recorded 15 BLUE capital units active in 1923 and 10 BLUE battleships afloat in
    the Southern Philippines at the end of the 1928 game. In OP. IV, the 1933 game, only seven BLUE battlewagons survived
    the Pacific run unscathed. Players questioned continuing the short-war sortie setup. They judged a rush to the Philippines
    by the massed American Fleet infeasible.
  question: What should Navy campaign planners do about the choice between a direct massed-fleet advance and a staged advance?
  options:
    O1:
      do: The Navy campaign planners reject the direct sortie and adopt a staged advance through the Mandates toward the Philippines.
      move: act
      irreversible: false
    O2:
      do: The Navy campaign planners approve a direct massed-fleet sortie across the Pacific to the Philippines.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In Tac. 96 (1923), 15 BLUE capital units were active at Dumanduilas in Mindanao.
  - id: F2
    kind: situation
    status: confirmed
    fact: At the end of OP. IV (1928), 10 BLUE battleships were afloat in the Southern Philippines.
  - id: F3
    kind: situation
    status: confirmed
    fact: By OP. IV (1933), seven BLUE battlewagons survived the Pacific run unscathed.
  - id: F4
    kind: situation
    status: assessed
    fact: OP. IV (1933) was regarded as the critical game and a turning point.
  - id: F5
    kind: situation
    status: assessed
    fact: In post-game reviews, many players balked at continuing the short-war sortie setup.
  - id: F6
    kind: situation
    status: assessed
    fact: A rush to the Philippines by the massed American Fleet was judged infeasible.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: resource_stewardship
    favors:
    - O1
    weight: strong
    why: Across the games, fewer BLUE capital ships remained available, and by OP. IV only seven battlewagons survived the
      Pacific run unscathed. The direct advance therefore risked consuming too much of the fleet before the campaign could
      achieve its purpose.
  - id: C2
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Players judged that a rush to the Philippines by the massed fleet was infeasible, so continuing the direct sortie
      would rely on a plan they did not believe could be carried out.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: 'The post-game objections to continuing the short-war sortie setup reflected a changed assessment: the assumed direct
      route no longer appeared realistic. The source presents that assessment as the reason to abandon the short-war illusion.'
  reasoning:
    read: The issue is whether to keep planning around a direct massed-fleet rush or revise the campaign route after OP. IV.
      The trap is preserving the short-war assumption despite repeated game outcomes and players' judgment that the rush was
      infeasible.
    weighing: The fleet-survival record {C1} and the assessment that the direct rush could not be done {C2} outweigh the appeal
      of a direct advance. Players' rejection of the short-war sortie setup reinforces that conclusion {C3}. The source's
      subsequent staged advance through the Mandates reflects the choice to revise the route; the balance would depend on
      whether the direct rush could be shown to be feasible after all.
    tradecraft: Record the decision as a route choice, the game evidence and feasibility assessment supporting it, and any
      assumptions that could change that assessment. Keep the rationale focused on strategic feasibility and preservation
      of the fleet.
    uncertainty: The source gives game outcomes and players' judgments, but no quantified comparison of the staged route's
      feasibility, timing, or costs.
    handoff: The campaign planners are the decision-makers identified here. They should document the choice and its evidentiary
      basis; the source identifies no separate approval authority.
    tempting_wrong:
      option: O2
      pull: A direct massed-fleet advance appears to offer the most straightforward path toward the Philippines.
      why_wrong: That appeal does not overcome the source's account of severe attrition and the players' judgment that the
        rush was infeasible.
    rejected:
      O2: The direct sortie was rejected because OP. IV's attrition and the players' feasibility judgment undermined the short-war
        plan.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable reassessment showed that a direct massed-fleet advance was feasible without the severe attrition that
        drove the OP. IV judgment.
      then: O2
      why: That would remove the source's central grounds for rejecting the direct sortie.
    would_not_change:
    - id: noflip1
      if: Planners merely preferred the speed or simplicity of a direct advance, without new evidence that it was feasible.
      why: Preference alone would not answer the source's attrition evidence or the players' judgment that the rush could
        not be done.
    watch_for: []
  lesson: Revise a campaign plan when repeated exercises expose unacceptable attrition and undermine the feasibility of its
    central assumption. Do not preserve a direct route merely because it was the original plan; require evidence that it can
    work.
  limits: This reasoning addresses the strategic choice between a direct and staged advance in the circumstances described.
    It does not establish that a staged route is always preferable or provide a legal rule for other campaign decisions.
  library:
    domain: operational-command
    family: CORPUS-NX-8d836389
    source: https://digital-commons.usnwc.edu/cgi/viewcontent.cgi?article=1003&context=usnwc-historical-monographs
    episode_focus: The decision point is the revision of the campaign’s strategic route after the 1933 game showed that a
      massed fleet advance would suffer severe attrition and players judged the direct sortie infeasible. Keep the focus on
      the choice between the direct advance and a staged advance; exclude the games’ operational details and later amphibious
      methods.
    cues:
      option_words:
