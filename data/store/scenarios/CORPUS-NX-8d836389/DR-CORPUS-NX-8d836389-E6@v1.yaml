case:
  id: DR-CORPUS-NX-8d836389-E6@v1
  title: Northward Course in a War Game
  status: draft
  setting: Center for War Gaming, quarterly Tactical Command Readiness War Games, with the scenario set in Atlantic waters
    north of Iceland.
  decider: The senior naval officer directing the war-game scenario
  agent: The senior naval officer directing the war-game scenario
  agent_role: decide
  situation: At the Center for War Gaming, naval officers take part in quarterly Tactical Command Readiness War Games. The
    exercise is a hypothetical preparation for war, with carrier battle groups represented in Atlantic waters north of Iceland.
    The officers have been told they may have to go into the Norwegian Sea. The senior officer warns that staggering losses
    may be expected. The stated purpose is to prepare to fight where the battle is, while the course of a future war remains
    uncertain.
  question: What should the senior naval officer directing the war-game scenario do about the simulated battle groups' northward
    course?
  options:
    O1:
      do: The senior naval officer directing the game rejects the northward course for the simulated battle groups.
      move: act
      irreversible: false
    O2:
      do: The senior naval officer directing the game accepts the northward course for the simulated battle groups.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Center for War Gaming holds quarterly Tactical Command Readiness War Games.
  - id: F2
    kind: situation
    status: confirmed
    fact: The quarterly game series began in 1976.
  - id: F3
    kind: situation
    status: confirmed
    fact: The war game represents American carrier battle groups operating in waters north of Iceland.
  - id: F4
    kind: situation
    status: assessed
    fact: The senior naval officer tells the officers that they may have to enter the Norwegian Sea.
  - id: F5
    kind: situation
    status: assessed
    fact: The senior naval officer anticipates that the forces could suffer staggering losses.
  - id: F6
    kind: situation
    status: assessed
    fact: The stated rationale for the exercise is to prepare for war and to go where the battle is.
  - id: F7
    kind: situation
    status: assessed
    fact: The senior naval officer says the course of events when war begins is uncertain.
  considerations:
  - id: C1
    facts:
    - F3
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The exercise is meant to prepare forces to go where the battle is, and the simulated battle groups are represented
      north of Iceland. The senior officer insists on the northward course as part of that preparation.
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The course of a future war is uncertain; the officer presents preparation for that uncertainty as the reason for
      the game.
  - id: C3
    facts:
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The officers may have to enter the Norwegian Sea, so practicing a northward course reflects the possibility of having
      to fight there.
  - id: C4
    facts:
    - F5
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: The officer expects staggering losses, a serious risk to personnel. But he acknowledges that risk while still insisting
      on preparation to go where the battle is.
  reasoning:
    read: This is a hypothetical readiness game, not a decision to deploy forces in an actual war. The trap is treating the
      warning of staggering losses as an automatic reason to avoid the course, even though the stated purpose is to prepare
      for a future conflict whose course is unknown.
    weighing: 'The officer''s stated reasons favor accepting the northward course: forces may have to enter the Norwegian
      Sea, and preparation means being ready to go where the battle is {C1} {C2} {C3}. The anticipated losses are a real cost,
      but the officer acknowledges them without treating them as a veto {C4}. The balance rests on this being a readiness
      exercise serving that stated purpose.'
    tradecraft: 'Keep the decision at the scenario level: record the readiness purpose, the acknowledged risk of losses, and
      the uncertainty about what a future war would require. Do not turn the decision into operational guidance.'
    uncertainty: The officer says he does not know what will happen when war begins. That uncertainty is part of the stated
      reason for preparing, not evidence that the exercise can predict a future conflict.
    handoff: The senior officer is directing the game, and no need for referral or additional approval is identified for this
      scenario. If the decision concerned actual operations rather than a hypothetical exercise, the relevant authority and
      review would need to be established separately.
    tempting_wrong:
      option: O1
      pull: Rejecting the northward course appears to avoid exposing forces to the losses the officer anticipates.
      why_wrong: It would set aside the stated readiness purpose of preparing to go where the battle is, despite the possibility
        that forces may have to enter the Norwegian Sea.
    rejected:
      O1: The officer does not choose to reject the course because avoiding it would not prepare the forces to go where the
        battle may be.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The exercise no longer served the stated purpose of preparing to fight where the battle might be.
      then: O1
      why: Without that readiness purpose, the source's stated reason for accepting the northward course would no longer support
        it.
    would_not_change:
    - id: noflip1
      if: The future course of war remained uncertain.
      why: Uncertainty is already part of the officer's rationale for preparing through the game.
    watch_for: []
  lesson: In a readiness exercise, do not mistake acknowledged risk for an automatic reason to avoid the scenario. When the
    stated purpose is to prepare for uncertain demands, weigh that purpose against the risk without treating the exercise
    as a prediction or an actual deployment decision.
  limits: This reasoning concerns a hypothetical war game and its preparation purpose. It does not determine whether an actual
    operation should proceed, or what legal authority, operational risks, or other constraints would govern one.
