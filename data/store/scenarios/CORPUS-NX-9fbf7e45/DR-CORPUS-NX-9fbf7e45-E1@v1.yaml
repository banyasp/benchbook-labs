case:
  id: DR-CORPUS-NX-9fbf7e45-E1@v1
  title: Customary Law and Chemical-Weapons Reprisals
  status: draft
  setting: Switzerland, 15 December 1988, Directorate for Public International Law of the Federal Department of Foreign Affairs.
  decider: The Directorate for Public International Law of the Federal Department of Foreign Affairs
  agent: The Directorate for Public International Law of the Federal Department of Foreign Affairs
  agent_role: decide
  situation: The Directorate is assessing whether the prohibition on using chemical weapons has become customary international
    law. The 1925 Protocol prohibits the use of chemical weapons and extends its terms to bacteriological and biological weapons.
    Its wording has been read as confirming an existing rule, while earlier treaties and instruments also address poison or
    gas weapons. States have made different reservations to the Protocol, including reservations concerning reprisals after
    a party or its allies violate the prohibitions. Legal writers disagree about the effect of those reservations on the customary
    rule. The legal materials also raise questions about reprisals in kind, the rule’s application among belligerents, and
    the conditions governing reprisals.
  question: What should the Directorate determine about customary law governing the first use of chemical weapons and their
    second use as reprisals?
  options:
    O1:
      do: The Directorate should permit second use of chemical weapons only as reprisals in kind, subject to subsidiarity,
        proportionality, and humanity.
      move: act
      irreversible: false
    O2:
      do: The Directorate should prohibit second use of chemical weapons even as reprisals in kind, under customary and treaty
        law.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The 1925 Protocol prohibits the use in war of asphyxiating, poisonous or other gases and analogous substances or
      devices, and extends the prohibition to bacteriological and biological weapons.
  - id: F2
    kind: situation
    status: assessed
    fact: The Protocol’s wording has been understood by some legal writers as confirming, rather than creating, the prohibition
      on chemical weapons.
  - id: F3
    kind: authority
    status: confirmed
    fact: Earlier instruments address the prohibition of gases or poison, including the Treaty of Versailles, the Hague Regulations,
      the St Petersburg Declaration, the Oxford Manual, and the 1922 Washington treaty.
  - id: F4
    kind: situation
    status: confirmed
    fact: States’ reservations to the Protocol include both reservations limiting obligations to other parties and reservations
      concerning a response to violations by another state or its allies.
  - id: F5
    kind: situation
    status: assessed
    fact: Most legal writers regard the second type of reservation as expressing customary law, while Sandoz regards those
      reservations as irrelevant.
  - id: F6
    kind: authority
    status: confirmed
    fact: The legal materials state that reprisals must be of the same kind as the violation.
  - id: F7
    kind: authority
    status: assessed
    fact: The legal analysis considers the rule applicable when non-party states join a conflict and distinguishes the reprisal
      rights of parties that made reservations from those that did not.
  - id: F8
    kind: authority
    status: confirmed
    fact: Customary and treaty law impose subsidiarity, proportionality, and humanity conditions on reprisals.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Protocol's wording and earlier instruments support the conclusion that it confirms a pre-existing customary prohibition,
      rather than creating a new rule. That establishes the prohibition on first use while leaving the question of a narrowly
      lawful reprisal.
  - id: C2
    facts:
    - F6
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: Second use is lawful only as a reprisal in kind, and reprisals are subject to legal conditions. An absolute prohibition
      on second use would exclude this limited reprisal.
    rules_out:
    - O2
  - id: C3
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: 'The rule applies under custom even when non-party states take part in a conflict. Treaty and customary law impose
      the same conditions on reprisals: subsidiarity, proportionality, and humanity.'
  - id: C4
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Reservations concerning reprisals may go beyond the reprisal right while still preserving the fundamental prohibition.
      Although most writers regard such reservations as expressing customary law, Sandoz considers them irrelevant, so they
      do not settle the issue by themselves.
  reasoning:
    read: The issue is whether customary law bars first use and whether it leaves a narrow exception for reprisals, not whether
      the Protocol alone governs every belligerent. The trap is to treat reservations either as making the prohibition wholly
      reciprocal or as irrelevant in every respect; the Directorate instead treats the customary prohibition as fundamental
      and the reprisal exception as limited.
    weighing: The Protocol's confirmatory wording, read with earlier instruments, supports a customary prohibition on first
      use {C1}. Second use is permitted only for reprisals in kind {C2}, under the same demanding conditions in treaty and
      customary law {C3}. Reservations and the disagreement among writers counsel against treating reservations as independently
      decisive, but do not displace the qualified conclusion about their effect {C4}.
    tradecraft: For a particular legal assessment, identify whether the proposed second use is genuinely a reprisal in kind,
      determine which belligerents are bound by treaty or custom, and assess subsidiarity, proportionality, and humanity.
      Record the basis for each conclusion and do not treat a reservation as a general license.
    uncertainty: 'The opinion records disagreement over the legal effect of reservations: most writers regard the second type
      as expressing customary law, while Sandoz regards them as irrelevant. The Directorate adopts a qualified view and notes
      that the practical distinction between states with and without reservations is fragile.'
    handoff: The Directorate is the decision-maker for this legal-policy determination. Applying the opinion to a particular
      conflict would require a case-specific legal assessment of the belligerents, the asserted reprisal, and the applicable
      conditions.
    tempting_wrong:
      option: O2
      pull: A categorical ban on all second use may appear to protect the fundamental prohibition from erosion.
      why_wrong: The conclusion recognizes second use as lawful in the limited case of reprisals in kind, subject to the governing
        conditions; O2 would eliminate that recognized exception.
    rejected:
      O2: The Directorate did not endorse an absolute ban on second use because it concluded that customary law permits second
        use as a reprisal in kind, subject to legal conditions.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The proposed second use is not a reprisal in kind for a prior prohibited use.
      then: O2
      why: Second use is permitted only in the case of reprisals in kind; without that basis, the customary prohibition remains
        controlling.
    would_not_change:
    - id: noflip1
      if: A non-party state joins the conflict.
      why: The customary obligation applies to parties even in conflicts involving non-parties, so non-party participation
        alone does not remove the customary rule.
    watch_for:
    - id: watch1
      what: Whether a hostile state or its allies have used prohibited methods of warfare, and whether the relevant state
        made a reservation.
      favors:
      - O1
      why: Those circumstances bear on the reach of reprisals, while any response must remain in kind and satisfy the applicable
        conditions.
  lesson: A customary prohibition on first use can coexist with a narrow reprisal exception; do not confuse that exception
    with a general right to retaliate. Any reprisal must be in kind and satisfy subsidiarity, proportionality, and humanity.
  limits: This determination concerns the legal-policy status of the prohibition and the limited reprisal exception described
    in the 1988 opinion. It does not decide whether a particular proposed reprisal meets the required conditions or address
    later legal developments.
