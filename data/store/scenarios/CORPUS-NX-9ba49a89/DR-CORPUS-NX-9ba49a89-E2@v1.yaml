case:
  id: DR-CORPUS-NX-9ba49a89-E2@v1
  title: Choosing the Assessment Scale
  status: draft
  setting: Joint Operational Area, as Title 10 forces entered; IAAC and JTF.
  decider: The IAAC
  agent: The IAAC
  agent_role: decide
  situation: The IAAC has developed an Excel assessment matrix for a daily product distributed to civilian and National Guard
    leadership. Title 10 forces are entering the JOA, and JTF command needs assessments relevant to decisions about force
    packages, logistics, and redeployment. State emergency management evaluates FEMA lifelines for the combined affected area.
    The IAAC must choose whether to present the assessment at county level or across the combined affected area. The matrix
    uses Army-doctrine red/amber/green/black ratings represented through percentages based on discrete data rather than subjective
    lifeline judgments.
  question: What should the IAAC do about presenting the assessment at county level or for the combined affected area?
  options:
    O1:
      do: The IAAC aggregates data-based ratings across the affected area.
      move: act
      irreversible: false
    O2:
      do: The IAAC disaggregates data-based ratings by county.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: capability
    status: confirmed
    fact: The IAAC developed an assessment matrix in Excel.
  - id: F2
    kind: capability
    status: confirmed
    fact: The matrix's red, amber, green, and black ratings were based on Army doctrine.
  - id: F3
    kind: capability
    status: confirmed
    fact: Each color rating represented percentages based on discrete data rather than subjective evaluation of FEMA lifelines.
  - id: F4
    kind: situation
    status: confirmed
    fact: State emergency management evaluated FEMA lifelines for the combined affected area.
  - id: F5
    kind: situation
    status: confirmed
    fact: The IAAC began sharing its product daily with civilian and National Guard leadership.
  - id: F6
    kind: situation
    status: confirmed
    fact: Title 10 forces entered the Joint Operational Area.
  - id: F7
    kind: situation
    status: confirmed
    fact: JTF command faced decisions about types and levels of force packages, logistics, and redeployment of Title 10 forces.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: County-level ratings gave JTF command assessments relevant to decisions about force packages, logistics, and redeployment
      as Title 10 forces entered the JOA.
  - id: C2
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: State emergency management already evaluated the combined affected area, while county ratings supplied a different
      level of assessment that the JTF could use for its decisions.
  - id: C3
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The doctrine-based color ratings represented percentages from discrete data rather than subjective lifeline judgments,
      providing a stated basis for the county assessments; this supports the approach but does not by itself establish that
      county-level presentation is superior.
  reasoning:
    read: The choice is between an area-wide picture and the more localized assessment the JTF needed for decisions about
      force packages, logistics, and redeployment. The trap is treating the combined-area assessment as a substitute for county-level
      information even though the state was already evaluating the combined area.
    weighing: The decisive reason is the stated usefulness of county ratings to JTF command decisions {C1}. The state’s combined-area
      evaluation makes county-level presentation complementary rather than redundant {C2}; the data-based rating framework
      supports that approach but is not, on its own, a reason to choose one geographic level over the other {C3}. The balance
      depends on whether the JTF needs geographically differentiated assessments for its decisions.
    tradecraft: Present the county-level assessment as the IAAC product and make clear that it is distinct from the state’s
      combined-area evaluation. Preserve the rating basis and explain how the assessment informs the relevant command decisions;
      do not imply that it replaces the state assessment.
    uncertainty: The stated rationale establishes decision relevance, not that county ratings produced better outcomes or
      that county conditions differed in every instance. The source does not specify how to reconcile inconsistent assessments
      or what to do if county-level information is unavailable.
    handoff: The IAAC makes the presentation decision, with the JTF command’s decision needs informing the choice; the state’s
      combined-area assessment remains relevant context.
    tempting_wrong:
      option: O1
      pull: An aggregate presentation matches the level at which state emergency management evaluated FEMA lifelines.
      why_wrong: The stated purpose of the IAAC’s county ratings was to give JTF command assessments useful for force-package,
        logistics, and redeployment decisions, while the combined-area assessment was already available.
    rejected:
      O1: The IAAC did not aggregate the ratings because county-level assessments were useful to JTF command decisions that
        the combined-area view did not serve as directly.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The JTF no longer needed geographically differentiated assessments for force-package, logistics, or redeployment
        decisions.
      then: O1
      why: The stated advantage of county-level presentation is its usefulness to those decisions; without that need, the
        rationale for disaggregation would weaken.
    would_not_change:
    - id: noflip1
      if: The ratings continue to use Army-doctrine colors and percentages based on discrete data.
      why: That supports the assessment framework but does not independently determine whether the presentation should be
        county-level or combined-area.
    watch_for:
    - id: watch1
      what: Whether county-level distinctions remain relevant to JTF command’s force-package, logistics, and redeployment
        decisions.
      favors:
      - O2
      why: The stated reason for county-level presentation is its usefulness to those decisions.
  lesson: Choose the assessment level that serves the decisions the responsible command must make. When a broader assessment
    is already available but decisions require more localized information, a county-level view can complement rather than
    replace the broader one.
  limits: This reasoning concerns the presentation level of assessments in this JOA and does not establish that county-level
    reporting is always preferable. It does not resolve how to act when the underlying ratings are incomplete, inconsistent,
    or not useful at county level.
