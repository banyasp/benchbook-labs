case:
  id: DR-CORPUS-NX-58046dd8-E1@v1
  title: Selecting a Foreign-Terrorist Arrest Target
  status: draft
  setting: Washington, February 1987, CIA Counterterrorist Center planning for Operation Goldenrod.
  decider: The CIA leadership overseeing Operation Goldenrod
  agent: The CIA leadership overseeing Operation Goldenrod
  agent_role: decide
  situation: The Counterterrorist Center’s mission was to prevent, disrupt, and defeat terrorism, and its work involved law-enforcement,
    intelligence, and military entities. The contemplated arrest effort focused on identifying foreign-terrorist suspects
    who met its criteria and might be accessible, with prosecution in a United States federal court as the intended legal
    process. The prospective target was associated with hijackings involving United States citizens and was suspected of involvement
    in the kidnapping and detention of United States citizens in Lebanon. A DEA source had known the prospective target since
    the early 1980s and indicated that he might be interested in entering the drug business, which was assessed as making
    him accessible for arrest. The decision was whether to select him from among possible arrest targets, decline that course,
    or defer selection for further assessment.
  question: What should the CIA leadership overseeing Operation Goldenrod do about selecting the prospective target for arrest
    and possible federal prosecution?
  options:
    O1:
      do: The CIA leadership overseeing Operation Goldenrod authorizes arrest of the prospective target and transfer to the
        United States for federal prosecution.
      move: act
      irreversible: true
    O2:
      do: The CIA leadership overseeing Operation Goldenrod defers target selection while seeking further assessment of the
        prospective target.
      move: hold
      irreversible: false
    O3:
      do: The CIA leadership overseeing Operation Goldenrod declines arrest of the prospective target and continues evaluating
        other foreign-terrorist targets.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Director of Central Intelligence described the Counterterrorist Center’s mission as preventing, disrupting,
      and defeating terrorism.
  - id: F2
    kind: situation
    status: confirmed
    fact: Law-enforcement, intelligence, and military entities worked jointly on counterterrorism under White House and National
      Security Council auspices.
  - id: F3
    kind: authority
    status: confirmed
    fact: Senior Counterterrorist Center and FBI officers treated terrorist attacks or threats as criminal acts for which
      suspects should be prosecuted, and recognized that suspects must first be identified and arrested.
  - id: F4
    kind: situation
    status: confirmed
    fact: The contemplated arrest effort aimed to arrest foreign terrorists involved in attacks against United States citizens
      or interests overseas and bring them to face federal charges in the United States.
  - id: F5
    kind: situation
    status: confirmed
    fact: Meetings were held to identify foreign-terrorist suspects who met the criteria and might be accessible for arrest.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A DEA source had known the prospective target since the early 1980s.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The prospective target was associated with the hijacking of a flight that initially involved 153 passengers and
      crew, including many United States citizens.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The prospective target was suspected of involvement in the kidnapping and detention of United States citizens in
      Lebanon and was described as a hijacker of a flight carrying three United States citizens.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The prospective target might have been interested in entering the drug business, and that possible interest was
      assessed as making him accessible for arrest.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    equity: due_process
    favors:
    - O1
    weight: strong
    why: The contemplated response treated terrorist attacks as criminal acts and identified arrest followed by federal prosecution
      as the appropriate legal process.
  - id: C2
    facts:
    - F7
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The assessed links to hijackings involving United States citizens and suspected kidnapping and detention of United
      States citizens made the target relevant to the stated counterterrorism and arrest objectives.
  - id: C3
    facts:
    - F5
    - F6
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The target-selection effort considered both whether suspects met the criteria and whether they might be accessible.
      A DEA source who had known the target for years indicated a possible interest that was assessed as making him accessible;
      the account describes this as pivotal to his selection.
  reasoning:
    read: 'This was a choice among potential arrest targets, not a finding of guilt: the links to the attacks and kidnappings
      were assessed or suspected, while the possible interest in the drug business was treated as an access opportunity. The
      trap is to mistake that opportunity for proof of the allegations, or to treat the allegations as already adjudicated.'
    weighing: 'The stated mission and criminal-process rationale support selecting a suspect linked to attacks involving United
      States citizens for arrest and possible prosecution {C1} {C2}. The source''s account also makes accessibility a central
      selection factor: the DEA source''s longstanding acquaintance with the target and the assessed business interest supplied
      a practical reason to select him rather than another candidate {C3}. The balance depends on those assessed links and
      the access judgment remaining credible; if either materially failed, deferral would become more appropriate {flip1}.'
    tradecraft: Record separately the assessed allegations, the source's reported access information, and the reasons for
      selecting this target over other candidates. Before execution, confirm the governing authority and the evidentiary and
      legal basis for arrest and prosecution, and avoid treating intelligence assessments as courtroom proof.
    uncertainty: The account describes suspected involvement and assessed intelligence, not a judicial finding or a demonstrated
      final evidentiary record. It gives no detail about the reliability of the source's information beyond the source's prior
      acquaintance with the target.
    handoff: The CIA leadership should make the selection within its assigned authority while coordinating with the relevant
      law-enforcement and intelligence participants, including the FBI and DEA, and legal advisers. The contemplated federal
      prosecution and the joint counterterrorism structure make that coordination important.
    tempting_wrong:
      option: O2
      pull: Deferring could seem prudent because the target's involvement was described as suspected and the access assessment
        rested in part on a possible business interest.
      why_wrong: The account presents a specific candidate who met the arrest effort's criteria and was assessed as accessible,
        and describes that access as pivotal to selecting him; on those stated reasons, further deferral was not the endorsed
        course.
    rejected:
      O2: Deferral was not chosen because the existing assessed links and the identified access opportunity supplied the stated
        basis for selecting this target.
      O3: Declining this target in favor of evaluating others was not chosen because the assessed allegations and accessibility
        made him a qualifying and actionable candidate.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: Further assessment materially discredits the suspected links to attacks involving United States citizens or shows
        that the target does not meet the arrest effort's criteria.
      then: O2
      why: The stated basis for selecting him depends on those assessed links; if they materially fail, further assessment
        should precede selection.
    - id: flip2
      if: The DEA source's information no longer supports a credible prospect of access, and no other reasonable basis for
        treating the target as accessible is established.
      then: O2
      why: Accessibility was a central, described-as-pivotal reason for selecting this target from among possible targets.
    would_not_change:
    - id: noflip1
      if: No additional allegations emerge beyond the assessed links already described.
      why: The selection rationale rests on the existing assessed links to attacks and suspected involvement in kidnapping
        and detention, together with the access assessment; it does not depend on new allegations.
    watch_for:
    - id: watch1
      what: Whether follow-up assessment supports both the suspected links to the attacks and the judgment that the target
        is accessible.
      favors:
      - O2
      why: A material weakening of either premise would undermine the stated reasons for selecting this target.
  lesson: When choosing among arrest targets, weigh the assessed connection to the relevant criminal conduct alongside whether
    the suspect is accessible for lawful arrest and prosecution. Keep intelligence assessments distinct from proof, and revisit
    the selection if either the allegations or the access judgment materially weakens.
  limits: This reasoning addresses target selection for an arrest intended to lead to federal prosecution. It does not establish
    that the assessed allegations were proven, supply a legal standard for arrest, or resolve the legality of any later operational
    methods.
