        O2: act
      real_move: act
      irreversible_flags:
        O1: true
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: CJCSI 3160.01 states that No-Strike entities losing protected status should be removed from the No-Strike List and
  that a facility used for a purpose inconsistent with that status loses immunity from attack under the law of war, subject
  to the notice condition.
