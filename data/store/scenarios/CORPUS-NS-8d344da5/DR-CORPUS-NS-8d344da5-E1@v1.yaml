case:
  id: DR-CORPUS-NS-8d344da5-E1@v1
  title: Protected Status After Military Use
  status: draft
  setting: Combatant command, 13 February 2009, under CJCSI 3160.01.
  decider: The combatant commander or designated representative
  agent: The combatant commander or designated representative
  agent_role: decide
  situation: A facility listed as a No-Strike entity is being used for a military purpose. Notice has been given and gone
    unheeded. The decision is whether the facility retains protected status or is treated as a lawful military target. The
    combatant command is responsible for determining the facility’s predominant functionality. Unless higher authority designates
    otherwise, only the combatant commander or a designated representative may change the entity’s No-Strike status.
  question: What should the combatant commander or designated representative do about the facility’s protected status after
    determining its predominant functionality and considering the unheeded notice?
  options:
    O1:
      do: The combatant commander revokes the facility’s protected No-Strike status.
      move: act
      irreversible: true
    O2:
      do: The combatant commander retains the facility’s protected No-Strike status.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The facility is a No-Strike entity.
  - id: F2
    kind: situation
    status: confirmed
    fact: The facility is being used for a military purpose.
  - id: F3
    kind: authority
    status: confirmed
    fact: A No-Strike entity loses protected status if used for a military purpose inconsistent with that status.
  - id: F4
    kind: situation
    status: confirmed
    fact: The adversary has been put on notice, and the notice has gone unheeded.
  - id: F5
    kind: authority
    status: confirmed
    fact: A facility that loses its protected status loses immunity from attack under the law of war and is subject to attack
      when the notice condition is met.
  - id: F6
    kind: authority
    status: confirmed
    fact: The combatant command is responsible for determining a facility’s predominant functionality.
  - id: F7
    kind: authority
    status: confirmed
    fact: Unless higher authority designates otherwise, the combatant commander or a designated representative is the only
      level of command authorized to change an entity’s No-Strike status.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: bar
    why: When the command determines that military use is inconsistent with the facility’s protected status, the entity loses
      that status and should be removed from the No-Strike List; retaining protected status would conflict with that rule.
    rules_out:
    - O2
  - id: C2
    facts:
    - F4
    - F5
    equity: protected_sites
    favors:
    - O1
    weight: strong
    why: The unheeded notice condition is met, so the facility that has lost protected status is subject to attack under the
      law of war. Notice is a condition for that consequence, not a reason to preserve status after it has been lost.
  - id: C3
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The combatant command determines the facility’s predominant functionality, and—unless higher authority designates
      otherwise—the commander or designated representative alone may change its No-Strike status.
  - id: C4
    facts:
    - F7
    equity: record_integrity
    favors:
    - O1
    weight: weak
    why: The status change should be documented by date-time group and reason so the No-Strike record reflects the changed
      characterization.
  reasoning:
    read: This is a status decision about a facility already listed as No-Strike, not a decision about how to conduct an attack.
      The key condition is whether the command’s predominant-functionality determination establishes military use inconsistent
      with the facility’s protected status; the given facts identify military use, and the command is responsible for determining
      functionality.
    weighing: The rule directs removal from the No-Strike List when protected status is lost, and the unheeded notice condition
      for the facility to be subject to attack is met. The balance therefore favors {O1}; it depends on the command’s determination
      that the military use is inconsistent with protected status, not merely on the facility’s No-Strike listing.
    tradecraft: Make the status change at the authorized command level, update the facility’s characterization, and document
      the change by date-time group and reason. Coordinate promptly with JS/J-2T and the appropriate RACs to reduce confusion.
    uncertainty: The decisive factual judgment is the facility’s predominant functionality and whether its military use is
      inconsistent with its protected status. The decision frame supplies military use and unheeded notice, but the command
      must make the functionality determination.
    handoff: The combatant commander or designated representative decides the status change unless higher authority designates
      otherwise. Close, timely coordination with JS/J-2T and the appropriate RACs supports consistent status records.
    tempting_wrong:
      option: O2
      pull: The facility is already listed as a No-Strike entity, which may suggest that its protected status should simply
        be preserved.
      why_wrong: The listing does not preserve protection after the facility is determined to be used for a military purpose
        inconsistent with that status; the rule directs removal once protected status is lost.
    rejected:
      O2: Retaining protected No-Strike status is inconsistent with the rule when the command determines that military use
        has caused the facility to lose that status.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The command determines that the facility’s use does not constitute a military purpose inconsistent with its protected
        status.
      then: O2
      why: The stated basis for loss of protected status would not be established.
    would_not_change:
    - id: noflip1
      if: Notice had not been given or had not gone unheeded.
      why: That would affect whether the facility is subject to attack under the stated notice condition, but loss of protected
        status turns on inconsistent military use.
    watch_for:
    - id: watch1
      what: The command’s determination of the facility’s predominant functionality.
      favors:
      - O1
      why: That determination establishes whether the facility is being used for a purpose inconsistent with its protected
        status.
  lesson: A No-Strike listing does not preserve protected status when a facility is used for a military purpose inconsistent
    with that status. The authorized command decision-maker must determine the facility’s predominant functionality, apply
    the stated notice condition, and document any status change.
  limits: This conclusion concerns the stated military-use and unheeded-notice circumstances. It does not decide whether a
    particular use is inconsistent with protected status where the command’s functionality determination is different, or
    address separate restrictions imposed by higher authority.
