case:
  id: DR-CORPUS-NS-8d344da5-E2@v1
  title: Protected Object Within a Valid Military Target
  status: draft
  setting: Installation, facility boundary, or bounded target area; time unspecified; military decision context.
  decider: The decision-maker responsible for determining whether the object retains protected status or may be attacked.
  agent: The decision-maker responsible for determining whether the object retains protected status or may be attacked.
  agent_role: decide
  situation: A protected or collateral object lies within the boundaries of a valid military target. Its status is under review
    for a decision on whether attack is authorized under the stated exception. The exception turns on clear evidence that
    the adversary is using the object to support the war effort and on a warning to stop that was not heeded. The decision-maker
    must assess the object against those conditions.
  question: What should the decision-maker do to determine whether the object retains protected status or may be attacked
    under the stated exception?
  options:
    O1:
      do: The decision-maker requests further evidence from the responsible military staff before deciding.
      move: ask
      irreversible: false
      to: responsible military staff
    O2:
      do: The decision-maker prohibits attack on the object and retains protected status.
      move: act
      irreversible: false
    O3:
      do: The decision-maker permits attack on the object under the stated exception.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Protected or collateral objects may be located within the boundaries of a valid military target.
  - id: F2
    kind: authority
    status: confirmed
    fact: Protected or collateral objects within those boundaries are not authorized for attack as a general rule.
  - id: F3
    kind: authority
    status: confirmed
    fact: The stated exception requires clear evidence that the adversary is using the object to support the war effort.
  - id: F4
    kind: authority
    status: confirmed
    fact: The stated exception also requires that the adversary has been warned to stop using the object.
  - id: F5
    kind: authority
    status: confirmed
    fact: The warning condition is met only if the adversary has not heeded the warning.
  - id: F6
    kind: authority
    status: confirmed
    fact: If clear evidence of LOW violations is unavailable, collateral objects retain their protected status.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: protected_sites
    favors:
    - O2
    weight: strong
    why: Being inside a valid military target does not by itself remove the object’s protected status; the stated general
      rule is that it is not authorized for attack.
  - id: C2
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The exception requires clear evidence that the adversary is using the object to support the war effort; without that
      showing, the exception is not established.
  - id: C3
    facts:
    - F4
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The exception also requires that the adversary was warned to stop and did not heed the warning; evidence of use alone
      does not satisfy this separate condition.
  - id: C4
    facts:
    - F6
    equity: protected_sites
    favors:
    - O2
    weight: strong
    why: The guidance expressly preserves protected status when clear evidence of violations of the law of war is unavailable.
  reasoning:
    read: The object’s presence within a valid military target is not enough to authorize attack. The trap is treating that
      location, or evidence of adversary use alone, as sufficient without also applying the clear-evidence and unheeded-warning
      requirements.
    weighing: The general rule and the stated fallback favor retaining protected status {C1} {C4}. The exception is available
      only if both clear evidence of war-supporting use and an unheeded warning are established {C2} {C3}. The fixed facts
      do not establish those predicates, so the source’s stated outcome is {O2}; the balance would change only if both conditions
      were established.
    tradecraft: Keep the decision focused on whether clear evidence supports the claimed war-related use and whether a warning
      to stop was given and not heeded. Record the basis for each finding separately, and do not treat uncertainty or the
      object’s location as a substitute for either condition.
    uncertainty: The fixed facts do not describe the evidence of use or the history or effect of any warning. This supports
      retaining protected status on the stated record; it does not establish that the exception’s conditions could never be
      met.
    handoff: The source does not prescribe a referral. If either predicate cannot be assessed from the information available,
      the decision-maker may seek clarification from responsible military staff, but uncertainty does not itself authorize
      attack.
    tempting_wrong:
      option: O3
      pull: The object lies within the boundaries of a valid military target, which may make attack seem permissible.
      why_wrong: Location within that boundary does not displace protected status; the exception requires both clear evidence
        of war-supporting use and an unheeded warning.
    rejected:
      O1: Further information could clarify whether the exception applies, but the stated rule provides a protected-status
        disposition on the present record rather than making a request for information a prerequisite to that disposition.
      O3: Attack is not authorized unless both stated exception conditions are established, and the fixed facts do not establish
        them.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Clear evidence establishes that the adversary is using the object to support the war effort, and the adversary was
        warned to stop but did not heed the warning.
      then: O3
      why: Both conditions stated for the exception would then be satisfied.
    would_not_change:
    - id: noflip1
      if: The object is located within the boundaries of a valid military target, without more.
      why: The guidance says such objects are not authorized for attack as a general rule; location alone does not satisfy
        the exception.
    - id: noflip2
      if: Clear evidence of war-supporting use exists, but the adversary was not warned to stop or heeded the warning.
      why: The warning and failure to heed it are additional required conditions, so clear evidence alone does not establish
        the exception.
    watch_for: []
  lesson: A protected or collateral object does not lose its status merely because it is inside a valid military target. Attack
    under the stated exception requires clear evidence of war-supporting use and a warning to stop that the adversary has
    not heeded; if clear evidence is unavailable, protected status remains.
  limits: This reasoning addresses only the stated protected-status exception and its evidence and warning conditions. It
    does not address other rules or considerations governing an attack.
  library:
    domain: military-operational
    family: CORPUS-NS-8d344da5
    source: https://assets.aclu.org/live/uploads/document/foia/drone_dod_3160_01.pdf
    episode_focus: The decision is whether the object retains protected status or may be attacked under the stated exception.
      Keep the focus on the legal threshold of evidence and warning; exclude methods of attack and collateral-damage calculations.
    cues:
      option_words:
        O1: 12
        O2: 11
        O3: 11
      real_option: O2
      real_to_mean_other_length: 0.96
      real_is_longest: false
      moves:
        O1: ask
        O2: act
        O3: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
        O3: true
    equities: pilot2
verdict_tier: source-endorsed
basis: The issuing guidance states that protected or collateral objects within a valid military target are not authorized
  for attack unless clear evidence shows war-supporting use and the adversary has been warned to stop but has not heeded the
  warning; if clear evidence is unavailable, the objects retain protected status.
