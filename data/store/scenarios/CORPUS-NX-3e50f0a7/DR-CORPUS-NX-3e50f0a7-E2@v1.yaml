case:
  id: DR-CORPUS-NX-3e50f0a7-E2@v1
  title: Reconciling Disparate Wartime Datasets
  status: draft
  setting: Iraq, 2007–2008, a research study using data from the Iraqi Transition Assistance Office, the Multinational Force-Iraq/Multinational
    Corps-Iraq Fusion Cell, the Global Terrorism Database, and NOAA.
  decider: The researchers
  agent: The researchers
  agent_role: decide
  situation: The researchers had records of public-utility demand, violent conflict, and daily temperatures for analysis in
    Iraq. The records came from separate datasets with differing measurements and incomplete or inconsistent entries. Some
    records were ambiguous, and the HOP data covered only limited periods in 2007 and 2008. The datasets needed to be aligned
    and reconciled before they could be combined. The researchers faced a choice between manual reconciliation and a machine-learning
    approach.
  question: What should the researchers do to align and reconcile the incomplete, inconsistent records across the datasets?
  options:
    O1:
      do: The researchers reject a machine-learning approach and manually align and reconcile the datasets.
      move: act
      irreversible: false
    O2:
      do: The researchers adopt a machine-learning approach to align and reconcile the datasets.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The HOP public-utility demand data covered May–August 2007 and May–August 2008.
  - id: F2
    kind: situation
    status: confirmed
    fact: The data sources included the Global Terrorism Database for attacks and NOAA data for daily temperatures.
  - id: F3
    kind: situation
    status: confirmed
    fact: The dataset contained information only for 2007 and 2008.
  - id: F4
    kind: situation
    status: confirmed
    fact: The datasets had missing values, inconsistencies, ambiguous record keeping, different domain types, and nonuniform
      measurements.
  - id: F5
    kind: situation
    status: assessed
    fact: Aligning the HOP data with the conflict and temperature databases by hand was estimated to take hundreds of man
      hours.
  - id: F6
    kind: capability
    status: confirmed
    fact: A machine-learning algorithm could perform the alignment and reconciliation task in a fraction of the time and cost
      of manual work.
  - id: F7
    kind: capability
    status: confirmed
    fact: The available data were widely disparate, making cleaning and reconciliation a prerequisite for analysis.
  considerations:
  - id: C1
    facts:
    - F4
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The datasets were widely disparate, so cleaning and reconciliation were prerequisites for analysis; adopting the
      approach that could perform that work enabled the researchers to combine the records.
  - id: C2
    facts:
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: Manual alignment was estimated to require hundreds of man hours, while the machine-learning approach performed the
      same task in a fraction of the time and cost.
  - id: C3
    facts:
    - F4
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Despite missing values, inconsistencies, ambiguous records, and nonuniform measurements, data fusion enabled more
      robust analysis than any single data source.
  reasoning:
    read: 'This was a data-cleaning and reconciliation decision, not a choice between clean data and flawed data: the available
      records were disparate and irregular, and reconciliation was a prerequisite to analysis. The trap is to treat those
      limitations as proof that machine-assisted alignment is unsuitable, or to assume that using it by itself resolves every
      data-quality issue.'
    weighing: 'The researchers'' stated balance favors {O2}: hand alignment would take hundreds of man hours, while the machine-learning
      approach could do the same task in a fraction of the time and cost. The more robust analysis enabled by combining the
      datasets also supports the choice to fuse the records. That does not establish that every missing or ambiguous entry
      was resolved. The balance depends on the approach supporting the needed reconciliation and normalization.'
    tradecraft: Use the machine-learning approach for alignment and reconciliation, then document the resulting harmonization
      and any unresolved gaps or ambiguities so the analysis does not imply more certainty than the records support.
    uncertainty: The records included missing values, inconsistencies, and ambiguous record keeping, and the HOP data covered
      only limited periods in 2007 and 2008. The data were normalized and harmonized, but not every anomaly is established
      as resolved, and findings cannot be assumed to generalize beyond the available data.
    handoff: The researchers make this data-preparation choice; no separate approving authority or required handoff is identified.
    tempting_wrong:
      option: O1
      pull: Manual work may seem more careful when entries are ambiguous or inconsistent.
      why_wrong: Manual alignment would require hundreds of man hours, whereas the machine-learning approach performed the
        same task in a fraction of the time and cost; data fusion also enabled more robust analysis.
    rejected:
      O1: The researchers did not choose manual reconciliation because it was estimated to take hundreds of man hours, while
        the machine-learning approach could do the same task in a fraction of the time and cost.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A representative check showed that the machine-learning approach could not align the records reliably, while manual
        reconciliation could do so more reliably.
      then: O1
      why: In that circumstance, the time and cost advantage would not justify compromising the faithful treatment of the
        source records.
    would_not_change:
    - id: noflip1
      if: The HOP data remained limited to the stated periods in 2007 and 2008.
      why: That limits the scope of analysis, but does not by itself remove the stated need to reconcile the datasets or the
        time-and-cost advantage of the machine-learning approach.
    watch_for:
    - id: watch1
      what: Ambiguous or inconsistent records that remain unresolved after machine-assisted reconciliation.
      favors:
      - O1
      why: If unresolved entries materially undermine faithful analysis, manual review may be preferable for those records.
  lesson: When disparate records must be reconciled before analysis, compare the available approaches on whether they can
    perform that prerequisite task and on their time and cost. Efficiency can support machine-assisted reconciliation, but
    it does not establish that missing, inconsistent, or ambiguous records have been resolved.
  limits: This reasoning addresses the researchers' choice of method for aligning these datasets; it does not establish the
    accuracy of every resulting record or the validity of any later finding. The available HOP data and overall dataset were
    limited to the stated periods in 2007 and 2008.
