case:
  id: DR-CORPUS-NX-fc5e20bb-E1@v1
  title: Lethal-Operation Proposal Under Counterterrorism Policy
  status: draft
  setting: Military counterterrorism policy review; place and date unspecified.
  decider: An informed, high-level federal official
  agent: An informed, high-level federal official
  agent_role: decide
  situation: A proposed military counterterrorism operation is under policy review. An informed, high-level federal official
    must determine whether the proposed target poses a continuing, imminent threat to U.S. persons. The assessment of imminence
    includes the relevant opportunity to act, potential civilian harm if that opportunity is missed, and the likelihood of
    preventing future disastrous attacks against the United States. The policy places capture feasibility first among operational
    considerations. A lethal operation may be proposed only after the required threat and alternatives determinations.
  question: What should the informed, high-level federal official do about the proposed lethal operation under the policy?
  options:
    O1:
      do: The high-level official declines the proposed lethal operation.
      move: act
      irreversible: false
    O2:
      do: The high-level official authorizes the proposed lethal operation.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: An informed, high-level federal official must determine whether a proposed target poses a continuing, imminent threat
      to U.S. persons.
  - id: F2
    kind: situation
    status: confirmed
    fact: The imminence assessment considers the relevant window of opportunity to act, possible civilian harm from missing
      it, and the likelihood of heading off future disastrous attacks against the United States.
  - id: F3
    kind: authority
    status: confirmed
    fact: A lethal operation may be proposed only after a clear determination that no other reasonable alternatives to lethal
      action by military forces can effectively address the threat to U.S. persons.
  - id: F4
    kind: situation
    status: confirmed
    fact: The alternatives assessment considers whether the relevant governmental authorities in the country where action
      is contemplated consent or are unable or unwilling to address the threat effectively.
  - id: F5
    kind: authority
    status: confirmed
    fact: Capture operations are the first operational consideration; if capture is feasible, the proposal considers how capture
      would be conducted, and direct-action lethal operations are considered only if capture is not feasible.
  - id: F6
    kind: situation
    status: confirmed
    fact: Capture operations offer the best opportunity for meaningful intelligence gain and for mitigating and disrupting
      terrorist threats.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: A high-level official must determine that the target poses a continuing, imminent threat. The relevant opportunity
      to act, possible civilian harm from missing it, and likelihood of preventing future disastrous attacks inform that determination;
      urgency alone does not replace it.
  - id: C2
    facts:
    - F3
    - F4
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: Lethal action may be proposed only after a clear determination that no other reasonable alternative can effectively
      address the threat, including consideration of whether the relevant local authorities consent or are unable or unwilling
      to do so.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Capture is the first operational consideration because it offers the best opportunity for meaningful intelligence
      and for mitigating and disrupting terrorist threats. Direct-action lethal operations are considered only if capture
      is infeasible.
  reasoning:
    read: 'This is a policy-level decision on whether to advance a proposed lethal operation, not an authorization to conduct
      a specific strike. The trap is treating a time-sensitive threat or the potential value of preventing future attacks
      as sufficient by itself: the policy also requires the threat and alternatives determinations and puts capture first.'
    weighing: 'The official should choose {O1} on the presented record: the policy makes a continuing, imminent threat determination
      and a clear finding of no effective reasonable alternative prerequisites, and it considers lethal action only if capture
      is infeasible. The time window, possible civilian harm if it is missed, and likelihood of preventing future disastrous
      attacks inform the threat assessment, while capture''s intelligence and disruption value weighs in its favor. The balance
      could support proposing lethal action only if the required threat and alternatives findings are made and capture is
      infeasible.'
    tradecraft: Keep the decision at policy level. Record the threat determination and its relevant factors, the alternatives
      assessment—including the local authorities' position or capacity—and whether capture is feasible; do not treat this
      decision as a specific strike authorization.
    uncertainty: The fixed facts describe the required tests but do not establish their results or whether capture is infeasible.
      Declining this proposed lethal operation does not establish that the threat is absent or that lethal action could never
      be proposed; the policy conditions would need to be assessed.
    handoff: The source calls for concurrence from relevant Principals on proposed capture or lethal operations and says disagreements
      are elevated, with the President resolving final disagreements. The official should use that policy process rather than
      treat the decision as an isolated operational authorization.
    tempting_wrong:
      option: O2
      pull: A narrow opportunity to act and the prospect of heading off disastrous attacks can make immediate lethal action
        seem necessary.
      why_wrong: Those matters inform imminence; they do not dispense with the clear alternatives determination or the policy's
        priority for capture when feasible.
    rejected:
      O2: It was not chosen because the policy permits proposing lethal action only after the required threat and no-effective-alternative
        findings, and only if capture is infeasible.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The official determines that the target poses a continuing, imminent threat after considering the relevant opportunity,
        possible civilian harm from missing it, and the likelihood of preventing future disastrous attacks; clearly determines
        no other reasonable alternative can effectively address the threat; and finds capture infeasible.
      then: O2
      why: Those are the policy's stated conditions for proposing lethal action, with capture infeasibility required before
        direct-action lethal operations are considered.
    would_not_change:
    - id: noflip1
      if: The opportunity to act is short or the potential consequences of missing it appear serious, without the required
        threat and alternatives findings.
      why: Those factors inform imminence but do not, on their own, satisfy the policy's separate prerequisites for proposing
        lethal action.
    watch_for:
    - id: watch1
      what: The relevant window of opportunity, possible civilian harm if it is missed, and likelihood of heading off future
        disastrous attacks.
      favors:
      - O2
      why: These are expressly relevant to assessing whether the threat is imminent, though they do not alone resolve the
        alternatives or capture requirements.
    - id: watch2
      what: Whether capture is feasible.
      favors:
      - O1
      why: Capture is the first operational consideration, and direct-action lethal operations are considered only if capture
        is infeasible.
  lesson: A policy preference for lethal action is not established by urgency alone. First determine whether the required
    threat and alternatives conditions are met, and give capture priority; lethal action may be proposed only when capture
    is infeasible and no other reasonable alternative can effectively address the threat.
  limits: This answer addresses only the policy-level choice on the facts supplied. It does not decide whether a particular
    threat is imminent, whether capture or another alternative is feasible, or whether any specific operation is authorized.
  library:
    domain: use-of-force-policy
    family: CORPUS-NX-fc5e20bb
    source: https://assets.aclu.org/live/uploads/document/Report_on_Process_of_Determining_Targets_of_Lethal_or_Capture_Operations.pdf
    episode_focus: The policy favors capture and permits proposing lethal force only when capture is infeasible and no other
      reasonable alternative can effectively address the threat, taking account of the relevant threat and opportunity to
      act. Treat this as a policy-level conditional decision, not a specific strike authorization; exclude operational methods
      and targeting technique.
    cues:
      option_words:
        O2: 8
        O1: 8
      real_option: O1
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O2: act
        O1: act
      real_move: act
      irreversible_flags:
        O2: true
        O1: false
    equities: pilot2
