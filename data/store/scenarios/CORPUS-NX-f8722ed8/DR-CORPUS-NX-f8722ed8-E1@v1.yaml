case:
  id: DR-CORPUS-NX-f8722ed8-E1@v1
  title: Emergency Departure from FBI Guidelines
  status: draft
  setting: FBI, when a departure from the Guidelines is considered in response to an urgent threat.
  decider: The FBI official responsible for the activity
  agent: The FBI official responsible for the activity
  agent_role: decide
  situation: An FBI activity is being considered under the Guidelines. A departure from the Guidelines is under consideration
    in response to a threat to the safety of persons or property or to national security. The threat is assessed as sufficiently
    immediate or grave that prior approval may not be obtained before action is needed. The official responsible for the activity
    must decide whether to proceed under the emergency exception. The Guidelines impose notification and written-reporting
    duties after a departure, and all activity remains subject to the Constitution and laws.
  question: What should the FBI official responsible for the activity do when an immediate or grave threat makes a departure
    necessary before approval can be obtained?
  options:
    O1:
      do: The FBI official permits the proposed departure under the emergency exception and completes the required notifications
        and written notice.
      move: act
      irreversible: true
    O2:
      do: The FBI official prohibits the proposed departure and continues under the Guidelines while maintaining constitutional
        and legal compliance.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: A departure from the Guidelines requires approval by the FBI Director, Deputy Director, or a designated Executive
      Assistant Director.
  - id: F2
    kind: authority
    status: confirmed
    fact: Prior approval may be bypassed when a departure is necessary because of the immediacy or gravity of a threat.
  - id: F3
    kind: situation
    status: assessed
    fact: The threat under consideration concerns the safety of persons or property or national security.
  - id: F4
    kind: authority
    status: confirmed
    fact: If prior approval is bypassed, the FBI Director, Deputy Director, or a designated Executive Assistant Director must
      be notified as soon thereafter as practicable.
  - id: F5
    kind: authority
    status: confirmed
    fact: The FBI must provide timely written notice of departures to the Criminal Division and the National Security Division.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Criminal Division and the National Security Division must notify the Attorney General and the Deputy Attorney
      General.
  - id: F7
    kind: authority
    status: confirmed
    fact: All activities must be carried out consistently with the Constitution and laws of the United States.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The Guidelines ordinarily require approval, but expressly permit a departure without prior approval when it is necessary
      because of the immediacy or gravity of a threat to people, property, or national security.
  - id: C2
    facts:
    - F2
    - F3
    equity: tempo
    favors:
    - O1
    weight: strong
    why: The emergency exception addresses circumstances in which the threat's immediacy or gravity makes prior approval unavailable
      before action is needed.
  - id: C3
    facts:
    - F4
    equity: chain_of_command
    favors:
    - O1
    weight: strong
    why: 'Bypassing prior approval does not remove the command safeguard: the Director, Deputy Director, or designated Executive
      Assistant Director must be notified as soon thereafter as practicable.'
  - id: C4
    facts:
    - F5
    - F6
    equity: oversight_candor
    favors:
    - O1
    weight: strong
    why: The Guidelines require timely written notice to the Criminal Division and National Security Division, which in turn
      notify the Attorney General and Deputy Attorney General.
  - id: C5
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The emergency exception does not displace the requirement that all activity remain consistent with the Constitution
      and laws of the United States.
  reasoning:
    read: This is a departure considered under a narrow emergency exception, not a general waiver of the Guidelines. The threat
      is assessed as sufficiently immediate or grave that approval cannot be obtained in time; the trap is treating either
      ordinary prior approval as an absolute bar or emergency authority as permission to disregard its safeguards.
    weighing: 'The ordinary approval rule and the emergency exception together make O1 the prescribed course on these facts:
      the threat condition permits action without prior approval when the departure is necessary. That authority is bounded
      by continuing constitutional and legal compliance, prompt practicable notice to the designated FBI official, and timely
      written reporting through the two divisions to the Attorney General and Deputy Attorney General.'
    tradecraft: Proceed under the emergency exception only for activity that remains consistent with the Constitution and
      laws. Notify the Director, Deputy Director, or designated Executive Assistant Director as soon thereafter as practicable,
      and provide timely written notice of the departure to the Criminal Division and National Security Division.
    uncertainty: The stated facts place the situation within the emergency condition, but the excerpt does not further define
      how immediacy, gravity, necessity, or practicability should be assessed.
    handoff: The responsible official may act without prior approval under the stated emergency condition, but must notify
      one of the specified senior FBI officials as soon as practicable. The Criminal Division and National Security Division
      receive timely written notice and must notify the Attorney General and Deputy Attorney General.
    tempting_wrong:
      option: O2
      pull: The ordinary rule requires approval by a senior FBI official before a departure.
      why_wrong: 'That rule is not absolute: the Guidelines expressly allow prior approval to be bypassed when a departure
        is necessary because of the immediacy or gravity of the specified threat, with notice and reporting afterward.'
    rejected:
      O2: The Guidelines permit proceeding without prior approval when the emergency condition is met, so prohibiting the
        departure solely because prior approval is unavailable would disregard the stated exception.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The departure is not necessary because of the immediacy or gravity of the threat, so prior approval can be obtained
        before acting.
      then: O2
      why: The ordinary approval requirement would apply; the emergency basis for bypassing prior approval would be absent.
    - id: flip2
      if: The proposed activity would not be consistent with the Constitution or laws of the United States.
      then: O2
      why: The Guidelines require all activity, in all circumstances, to remain constitutionally and legally compliant.
    would_not_change:
    - id: noflip1
      if: The threat is sufficiently urgent to justify bypassing prior approval.
      why: Urgency does not remove the requirement to notify a specified senior FBI official as soon thereafter as practicable.
    - id: noflip2
      if: The departure is undertaken under the emergency exception.
      why: The exception does not suspend the requirement that all activities remain consistent with the Constitution and
        laws.
    watch_for: []
  lesson: An emergency exception can authorize action before ordinary approval when the specified threat makes prior approval
    unavailable and the departure is necessary. It does not erase post-action notification and reporting duties or the obligation
    to comply with the Constitution and laws.
  limits: This conclusion applies only where a departure is necessary because of the immediacy or gravity of a threat of the
    kind specified in the Guidelines. It does not establish that any particular departure is necessary or lawful, and it does
    not excuse required notification or reporting.
  library:
    domain: intel-oversight
    family: CORPUS-NX-f8722ed8
    source: https://www.justice.gov/archive/opa/docs/guidelines.pdf
    episode_focus: The Guidelines ordinarily require approval by the FBI Director, Deputy Director, or designated Executive
      Assistant Director; when a departure is necessary because of the immediacy or gravity of a threat to people, property,
      or national security, prior approval may be bypassed, with prompt notification and written reporting afterward. Focus
      on this emergency authority and its oversight safeguards, not on any investigative methods used during the departure.
    cues:
      option_words:
        O1: 19
        O2: 18
      real_option: O1
