case:
  id: DR-CORPUS-NX-f8722ed8-E3@v1
  title: Disclosure of Information Outside FBI Jurisdiction
  status: draft
  setting: An FBI field office, upon receipt of credible information, under FBI disclosure guidance.
  decider: The FBI field office
  agent: The FBI field office
  agent_role: decide
  situation: An FBI field office has received credible information concerning serious criminal activity outside the FBI's
    investigative jurisdiction. The information is at a disclosure decision point involving a law-enforcement agency or agencies
    with jurisdiction. The governing rule calls for prompt transmission or referral while identifying circumstances that may
    restrict full disclosure. It also addresses limited disclosure when feasible and full disclosure once a restriction no
    longer applies. The field office must determine how to handle the information under these conditions and safeguards.
  question: What should the FBI field office do about transmitting or referring the information to law-enforcement agencies
    with jurisdiction and determining the extent and timing of disclosure?
  options:
    O1:
      do: The FBI field office promptly discloses the information to a law-enforcement agency with jurisdiction.
      move: act
      irreversible: true
    O2:
      do: The FBI field office withholds the information from law-enforcement agencies with jurisdiction.
      move: act
      irreversible: false
    O3:
      do: The FBI field office makes limited disclosure promptly to law-enforcement agencies with jurisdiction.
      move: partial
      irreversible: true
      to: law-enforcement agencies with jurisdiction
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The FBI field office has received credible information concerning serious criminal activity.
  - id: F2
    kind: situation
    status: confirmed
    fact: The serious criminal activity is outside the FBI's investigative jurisdiction.
  - id: F3
    kind: authority
    status: confirmed
    fact: The FBI field office is generally required to promptly transmit the information or refer the complainant to a law-enforcement
      agency having jurisdiction.
  - id: F4
    kind: authority
    status: confirmed
    fact: Full disclosure may be restricted when it would jeopardize an ongoing investigation, endanger an individual's safety,
      disclose a human source's identity, interfere with a human source's cooperation, or reveal legally privileged information.
  - id: F5
    kind: authority
    status: confirmed
    fact: When full disclosure is restricted, the field office must make at least limited disclosure to an agency or agencies
      with jurisdiction whenever feasible.
  - id: F6
    kind: authority
    status: confirmed
    fact: Full disclosure must be made as soon as the need for restricting disclosure is no longer present.
  - id: F7
    kind: authority
    status: confirmed
    fact: If full disclosure has not been made to the appropriate law-enforcement agencies within 180 days, the field office
      must promptly notify FBI Headquarters in writing of the facts and circumstances concerning the criminal activity.
  - id: F8
    kind: authority
    status: confirmed
    fact: The FBI must make periodic reports to the Deputy Attorney General about nondisclosures and incomplete disclosures
      in a form suitable to protect human-source identities.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The information concerns serious criminal activity outside the FBI's investigative jurisdiction, and the general
      rule requires prompt transmission or referral to an agency with jurisdiction.
  - id: C2
    facts:
    - F4
    equity: duty_to_individual
    favors:
    - O2
    - O3
    weight: weak
    why: The rule permits restricting full disclosure when one of the specified risks is present, but the stated facts do
      not establish that any such risk applies.
  - id: C3
    facts:
    - F5
    equity: policy_compliance
    favors:
    - O3
    weight: strong
    why: If full disclosure is restricted, at least limited disclosure to agencies with jurisdiction is required whenever
      feasible.
  - id: C4
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: 'Any restriction on full disclosure is temporary: full disclosure is required as soon as the reason for restricting
      it no longer exists.'
  reasoning:
    read: This is credible information about serious criminal activity outside the FBI's investigative jurisdiction, so the
      starting point is prompt transmission or referral {F1} {F2} {F3}. The key distinction is between the general duty to
      refer and the limited circumstances that may restrict full disclosure; those exceptions are not established by the facts
      provided {F4}.
    weighing: The prompt-transmission rule supports {O1} {C1}. A specified risk could justify restricting full disclosure,
      but if that occurs, limited disclosure is required whenever feasible {C2} {C3}; full disclosure must follow when the
      restriction ends {C4}. On the stated facts, no exception is identified, so the general rule controls. The balance would
      depend on whether a listed risk actually applies and, if so, whether limited disclosure is feasible.
    tradecraft: Determine whether any of the specified grounds for restricting full disclosure applies. If it does, make at
      least limited disclosure whenever feasible and make full disclosure as soon as the restriction is no longer necessary.
      If full disclosure has not been made within 180 days, promptly notify FBI Headquarters in writing of the relevant facts
      and circumstances; the FBI also makes periodic reports to the Deputy Attorney General in a form suitable to protect
      human-source identities.
    uncertainty: The facts do not say whether any listed risk exists or whether limited disclosure would be feasible if full
      disclosure were restricted. The recommendation of prompt full transmission therefore rests on the absence of a stated
      basis for applying an exception, not on a finding that no risk could exist.
    handoff: The field office makes the disclosure decision under the stated rule. If full disclosure remains outstanding
      within 180 days, the field office must notify FBI Headquarters; the FBI's periodic reporting to the Deputy Attorney
      General is an additional safeguard, not a stated prerequisite to the field office's decision.
    tempting_wrong:
      option: O2
      pull: Withholding may seem safer where disclosure could create one of the listed risks.
      why_wrong: 'The exception is conditional, not a general permission to withhold: the facts identify no triggering risk,
        and even when full disclosure is restricted, limited disclosure is required whenever feasible.'
    rejected:
      O2: It was not chosen because the stated facts do not establish a ground for restricting disclosure, and the rule otherwise
        calls for prompt transmission or referral.
      O3: It was not chosen because limited disclosure is the required fallback when full disclosure is restricted, and no
        such restriction is established on these facts.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Full disclosure would create one of the specified risks, but limited disclosure to an agency with jurisdiction is
        feasible.
      then: O3
      why: The rule permits restricting full disclosure in the specified circumstances and calls for at least limited disclosure
        whenever feasible.
    would_not_change:
    - id: noflip1
      if: Full disclosure has not been made within 180 days.
      why: That circumstance adds a prompt written-notice obligation to FBI Headquarters; it does not replace the disclosure
        rule or itself establish a ground for withholding.
    watch_for:
    - id: watch1
      what: Whether the need for restricting full disclosure has ended.
      favors:
      - O1
      why: The rule requires full disclosure as soon as the need for restriction is no longer present.
  lesson: Prompt referral is the default when credible information concerns serious criminal activity outside the field office's
    jurisdiction. A specified risk may restrict full disclosure, but limited disclosure is required whenever feasible, and
    full disclosure follows once the restriction ends.
  limits: This conclusion applies to the disclosure rule and the facts stated here; no particular disclosure risk or feasibility
    determination is supplied. It does not determine what information may be disclosed in a different case with an established
    risk or other applicable legal restrictions.
