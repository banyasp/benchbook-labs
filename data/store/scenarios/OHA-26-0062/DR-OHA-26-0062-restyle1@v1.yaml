case:
  id: DR-OHA-26-0062-restyle1@v1
  title: Restoration of Access Authorization after Alcohol‑Related Incidents [restyle]
  status: needs_review
  setting: Department of Energy Office of Hearings and Appeals, 30 July 2026
  decider: Adjudicating Officer
  agent: Adjudicating Officer
  agent_role: decide
  situation: The Subject works for an energy contractor in a position that requires a DOE access clearance. He was taken into
    custody in April 2024 for damaging a household member's property after drinking, and again in May 2025 for aggravated
    DWI and related traffic offenses after consuming alcohol. A DOE-contracted psychologist diagnosed him with moderate Alcohol
    Use Disorder and initially found no evidence of rehabilitation. The Security Office raised concerns under Guideline G
    (excessive alcohol consumption) and Guideline J (criminal conduct) and sent a notification letter. The Subject subsequently
    completed an intensive outpatient program, its after-care, and produced eleven consecutive negative PEth tests from September
    2025 through July 2026. A DOE psychologist testified that the Subject had shown rehabilitation and possessed a favorable
    prognosis. The Adjudicating Officer must now decide whether to reinstate the Subject's access clearance under Part 710,
    which contains a presumption against granting.
  question: What action should the Adjudicating Officer take regarding the Subject's access clearance?
  options:
    O1:
      do: Approve reinstatement of the Subject's access clearance
      move: act
      irreversible: true
    O2:
      do: Reject reinstatement of the Subject's access clearance
      move: act
      irreversible: true
    O3:
      do: Defer the decision pending additional documentation
      move: hold
      irreversible: false
  facts:
