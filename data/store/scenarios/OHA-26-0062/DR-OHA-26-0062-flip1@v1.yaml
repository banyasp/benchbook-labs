case:
  id: DR-OHA-26-0062-flip1@v1
  title: Restoration of Access Authorization after Alcohol‑Related Incidents [flip]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, 28 August 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: An employee of a DOE contractor holds a position that requires a security access authorization. He was taken
    into custody in April 2024 for damaging a relative's property while intoxicated, and again in May 2025 for aggravated
    DWI and related traffic violations after drinking. A DOE-consultant psychologist diagnosed him with moderate Alcohol Use
    Disorder and, at that time, found no evidence of rehabilitation. The Local Security Office cited Guideline G (excessive
    alcohol use) and Guideline J (criminal conduct) in a formal notification. The employee subsequently completed an intensive
    outpatient program, its aftercare, and recorded eleven consecutive negative PEth screenings from September 2025 through
    July 2026. However, a PEth test in September 2026 showed a concentration above the abstinence limit. The DOE psychologist
    testified that the employee had previously shown rehabilitation and a favorable outlook. The Administrative Judge must
    now decide whether to reinstate the employee's access authorization under Part 710, which ordinarily presumes against
    granting.
  question: What action should the Administrative Judge take regarding the employee's access authorization?
  options:
    O1:
      do: Reinstate the employee's access authorization immediately
      move: act
      irreversible: true
    O2:
      do: Deny the employee's access authorization permanently
      move: act
      irreversible: true
    O3:
      do: Hold the decision pending further evidence
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a DOE contractor in a role that requires a security access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: He was arrested in April 2024 for damaging a household member's property while under the influence of alcohol.
  - id: F3
    kind: situation
    status: confirmed
    fact: He was arrested in May 2025 for aggravated DWI, reckless driving, open-container violation, improper turning, and
      failure to maintain lane after drinking.
  - id: F4
    kind: capability
    status: confirmed
    fact: A DOE-consultant psychologist diagnosed him with moderate Alcohol Use Disorder and found no evidence of rehabilitation
      at the time of evaluation.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual completed an intensive outpatient program, its aftercare, and provided eleven consecutive negative
      PEth tests from September 2025 through July 2026, but a subsequent PEth assay performed in September 2026 revealed a
      measurable concentration exceeding the abstinence threshold.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office raised concerns under Guideline G and Guideline J and issued a notification letter.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Administrative Judge must decide on restoring the employee's access authorization under Part 710, which presumes
      against granting.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The DOE psychologist testified that the employee had demonstrated rehabilitation and possessed a good prognosis.
  considerations:
  - id: C1
    facts:
    - F5
    - F8
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The positive PEth result in September 2026 evidences a relapse, negating the mitigating conditions of Guideline G
      that rely on sustained abstinence.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The statutory presumption against granting cannot be overcome when the record shows a recent breach of abstinence.
  - id: C4
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The psychologist's earlier testimony still indicates that the employee once showed rehabilitation, but this assessment
      is outweighed by the recent relapse.
  - id: C5
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The employee's own statement to remain abstinent is contradicted by the September 2026 PEth result, suggesting a
      high likelihood of future alcohol-related security incidents.
  reasoning:
    read: The core issue is whether the employee's renewed alcohol use, demonstrated by a positive PEth test, re-establishes
      a security risk that outweighs any prior rehabilitation, given the presumption against granting clearances under Part
      710.
    weighing: Guideline G requires continuous abstinence; the September 2026 PEth result breaches that requirement ({C1}).
      Consequently, the presumption against granting remains unchallenged ({C3}). The employee's relapse also undermines the
      low-risk inference drawn from his earlier treatment record ({C5}). Although the psychologist's earlier testimony ({C4})
      noted a favorable prognosis, the recent biomarker evidence supersedes that assessment. The cumulative effect directs
      the decision toward denial.
    tradecraft: The Administrative Judge will enter a denial order into the OHA docket, update the DOE personnel security
      system to reflect the continued denial of access, and notify the Local Security Office to maintain the employee's security
      file accordingly.
    uncertainty: High; the objective PEth result provides clear evidence of recent alcohol consumption, eliminating ambiguity
      about the employee's current risk level.
    handoff: The Administrative Judge decides alone, as authorized by 10 C.F.R. § 710.7(a).
    tempting_wrong:
      option: O1
      pull: The earlier record of successful treatment and the psychologist's positive testimony might tempt a reinstatement
        despite the new relapse.
      why_wrong: Restoring access would ignore the concrete, recent biomarker indicating a breach of abstinence, contrary
        to Guideline G's mitigation requirements.
    rejected:
      O1: The recent positive PEth test nullifies the earlier evidence of rehabilitation, making denial the only defensible
        outcome.
      O3: All relevant evidence is already on file; postponing the decision would serve no purpose.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C1
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee were to continue producing negative PEth results after September 2026, demonstrating uninterrupted
        abstinence.
      then: O1
      why: Sustained abstinence would satisfy Guideline G, allowing the presumption against granting to be overcome.
    would_not_change:
    - id: noflip1
      if: The statutory presumption against granting remains in effect.
      why: The Guidelines permit the presumption to be rebutted only with sufficient mitigation, which the current record
        lacks.
    watch_for:
    - id: watch1
      what: Any future positive PEth test or alcohol-related incident.
      favors:
      - O2
      why: Such evidence would reaffirm the security concern under Guideline G.
  lesson: When a security-cleared individual relapses after a period of documented sobriety—evidenced by a positive PEth test—the
    mitigation that once justified a clearance can be nullified, and the presumption against granting must be upheld.
  limits: This analysis applies strictly to security concerns stemming from alcohol misuse and related criminal conduct under
    Guidelines G and J. It does not extend to other adjudicative categories such as espionage, foreign influence, or unauthorized
    disclosure.
