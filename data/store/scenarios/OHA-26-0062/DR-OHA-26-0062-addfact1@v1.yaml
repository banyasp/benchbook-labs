case:
  id: DR-OHA-26-0062-addfact1@v1
  title: Restoration of Access Authorization after Alcohol‑Related Incidents [addfact]
  status: needs_review
  setting: Department of Energy Review Board, 30 July 2026
  decider: Presiding Administrative Law Judge
  agent: Presiding Administrative Law Judge
  agent_role: decide
  situation: The employee, serving in a DOE-contracted role that mandates a security clearance, was arrested in April 2024
    for alcohol-related property damage to a family member, and again in May 2025 for an aggravated DUI that included reckless
    driving, an open container, improper turning, and lane-maintenance failures. A DOE-contracted psychologist initially diagnosed
    a moderate Alcohol Use Disorder with no signs of rehabilitation. Following that assessment, the employee completed an
    intensive outpatient treatment program, its after-care component, and submitted eleven consecutive negative PEth tests
    from September 2025 through July 2026. The Local Security Office raised concerns under Guideline G (excessive alcohol
    use) and Guideline J (criminal conduct) and sent a notification letter. Subsequent testimony from a DOE psychologist indicated
    the employee had achieved rehabilitation and a positive outlook, while the employee's supervisor provided a written endorsement
    attesting to reliable performance and adherence to security protocols since returning to work. The presiding Administrative
    Law Judge must now apply Part 710 regulations, which normally presume against granting, to decide whether the employee's
    clearance should be reinstated.
  question: How should the presiding judge rule on the employee's security clearance?
  options:
    O1:
      do: Reinstate the employee's clearance without delay
      move: act
      irreversible: true
    O2:
      do: Continue to deny the employee's clearance
      move: act
      irreversible: true
    O3:
      do: Defer the ruling pending additional documentation
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The employee works for a Department of Energy subcontractor in a position that requires a security clearance.
  - id: F2
    kind: situation
    status: confirmed
    fact: In April 2024, the employee was taken into custody for damaging a household member's property while under the influence
      of alcohol.
  - id: F3
    kind: situation
    status: confirmed
    fact: In May 2025, the employee faced arrest for aggravated driving while intoxicated, including reckless driving, an
      open container violation, improper turning, and failure to maintain lane.
  - id: F4
    kind: capability
    status: confirmed
    fact: A DOE-contracted psychologist evaluated the employee and diagnosed a moderate Alcohol Use Disorder, noting no evidence
      of rehabilitation at that time.
  - id: F5
    kind: capability
    status: confirmed
    fact: The employee subsequently completed an intensive outpatient treatment program, its after-care phase, and produced
      eleven successive negative PEth test results spanning September 2025 through July 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office cited security concerns under Guideline G (excessive alcohol consumption) and Guideline
      J (criminal conduct) and issued a formal notification letter.
  - id: F7
    kind: authority
    status: confirmed
    fact: The presiding judge must determine, under the relevant Part 710 regulations that generally presume against granting,
      whether to restore the employee's clearance.
  - id: F8
    kind: intelligence
    status: assessed
    fact: A DOE psychologist testified that the employee had demonstrated rehabilitation and possessed a favorable prognosis.
  - id: F9
    kind: situation
    status: confirmed
    fact: The employee's immediate supervisor submitted a written endorsement affirming that, since returning to duty, the
      employee has consistently shown reliability and compliance with security procedures.
  considerations:
  - id: C1
    facts:
    - F5
    - F8
    - F9
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The employee's eleven consecutive negative PEth tests, the psychologist's affirmation of rehabilitation, and the
      supervisor's written endorsement together satisfy Guideline G mitigating conditions (b) and (d), indicating a negligible
      likelihood of future alcohol-related security incidents.
  - id: C2
    facts:
    - F5
    - F8
    - F6
    - F9
    equity: due_process
    favors:
    - O1
    weight: strong
    why: Successful treatment, absence of further criminal conduct, and the supervisor's attestations meet Guideline J mitigating
      condition (d), showing that the employee has complied with probation and poses no ongoing threat.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although Part 710 presumes against granting a clearance, the regulation expressly permits that presumption to be
      overcome by sufficient mitigating evidence.
  - id: C4
    facts:
    - F8
    - F9
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The DOE psychologist's expert testimony, reinforced by the supervisor's endorsement, confirms a positive prognosis
      and reliable conduct, strengthening the mitigation analysis.
  - id: C5
    facts:
    - F5
    - F9
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Objective PEth evidence combined with the supervisor's observation of consistent, security-compliant performance
      demonstrates a low risk of relapse.
  reasoning:
    read: The core issue is whether the employee's documented rehabilitation and current reliable performance outweigh the
      statutory presumption against granting a clearance and the earlier alcohol-related misconduct.
    weighing: Guideline G is satisfied because the employee acknowledged the problem, completed an intensive outpatient program,
      and produced a full year of negative PEth tests ({C1}). Guideline J is satisfied through successful rehabilitation,
      compliance with probation, and the passage of time without further offenses ({C2}). The presumption against granting
      ({C3}) is rebutted by this cumulative mitigation. The psychologist's prognosis ({C4}) and the supervisor's endorsement
      ({C5}) further reinforce the low-risk assessment.
    tradecraft: The Administrative Law Judge will enter a decision reinstating the clearance in the DOE personnel security
      system, and the Local Security Office will be directed to update the employee's security file accordingly.
    uncertainty: Minimal; the record contains objective biomarker data and corroborating expert and supervisory testimony.
    handoff: The presiding Administrative Law Judge decides alone, as authorized by 10 C.F.R. § 710.7(a).
    tempting_wrong:
      option: O2
      pull: The statutory presumption against granting could tempt a denial despite the mitigation evidence.
      why_wrong: Denial would disregard the comprehensive, documented rehabilitation and the supervisor's attestations, contrary
        to the mitigating provisions of Guidelines G and J.
    rejected:
      O2: The mitigation evidence meets the Guidelines, so a denial is not justified.
      O3: The record is complete; additional documentation would be redundant.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The employee were to produce a positive PEth test or otherwise relapse after July 2026
      then: O2
      why: Guideline G requires continued abstinence; a relapse would reactivate the security concern and justify denial.
    would_not_change:
    - id: noflip1
      if: The statutory presumption against granting remains in effect without sufficient mitigation
      why: The Guidelines expressly allow the presumption to be overcome by the strong mitigation now present in the record.
    watch_for:
    - id: watch1
      what: Any future alcohol-related incident or positive PEth result
      favors:
      - O2
      why: Such evidence would indicate a failure of rehabilitation and revive the security concerns under Guideline G.
  lesson: When an individual presents documented, sustained rehabilitation—including treatment completion, objective negative
    biomarkers, and corroborating endorsements from both a qualified psychologist and a direct supervisor—those mitigating
    factors can outweigh the default presumption against granting a security clearance under Guidelines G and J.
  limits: This analysis applies only to security concerns stemming from alcohol misuse and related criminal conduct under
    Guidelines G and J. It does not extend to other adjudicative categories such as espionage, foreign influence, or unauthorized
    disclosure.
