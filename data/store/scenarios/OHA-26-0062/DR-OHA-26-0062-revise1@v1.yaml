case:
  id: DR-OHA-26-0062-revise1@v1
  title: Restoration of Access Authorization after Alcohol‑Related Incidents [revise]
  status: needs_review
  setting: DOE Office of Hearings and Appeals, July 30, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires an access authorization. He was arrested
    in April 2024 for criminal damage to a household member’s property after consuming alcohol, and again in May 2025 for
    aggravated DWI and related offenses after drinking. A DOE‑consultant psychologist diagnosed him with moderate Alcohol
    Use Disorder and initially found no evidence of rehabilitation. The Local Security Office raised security concerns under
    Guideline G (excessive alcohol consumption) and Guideline J (criminal conduct) and issued a notification letter. The Individual
    subsequently completed an intensive outpatient program, aftercare, and provided eleven consecutive negative PEth tests
    covering September 2025 through July 2026. The DOE psychologist testified that the Individual had shown rehabilitation
    and a good prognosis. The Administrative Judge must now determine whether to restore the Individual’s access authorization
    under the applicable Part 710 regulations, which presume against granting.
  question: What should the Administrative Judge do with the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge denies the Individual’s access authorization
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending further evidence
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested in April 2024 for criminal damage to a household member’s property after consuming alcohol.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual was arrested in May 2025 for aggravated DWI, reckless driving, open container, improper turning,
      and failure to maintain lane after drinking.
  - id: F4
    kind: capability
    status: confirmed
    fact: A DOE‑consultant psychologist diagnosed the Individual with moderate Alcohol Use Disorder without evidence of rehabilitation
      at the time of evaluation.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual completed an intensive outpatient program, its aftercare, and provided eleven consecutive negative
      PEth tests from September 2025 through July 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline G and Guideline J and issued a notification letter.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Administrative Judge must decide whether to restore the Individual’s access authorization under the applicable
      Part 710 regulations, which presume against granting.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The DOE psychologist testified that the Individual had shown rehabilitation and a good prognosis.
  considerations:
  - id: C1
    facts:
    - F5
    - F8
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The Individual completed an intensive outpatient program, aftercare, and provided eleven consecutive negative PEth
      tests, satisfying Guideline G mitigating conditions (b) and (d).
  - id: C2
    facts:
    - F5
    - F8
    - F6
    equity: due_process
    favors:
    - O1
    weight: weak
    why: The rehabilitation evidence is persuasive but the prior diagnosis of no rehabilitation and the seriousness of the
      offenses introduce lingering doubt, reducing the strength of the mitigation argument.
  - id: C3
    facts:
    - F7
    equity: lawful_authority
    favors:
    - O1
    weight: weak
    why: Although Part 710 presumes against granting a clearance, the regulation allows the presumption to be overcome by
      sufficient mitigating evidence.
  - id: C4
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The DOE psychologist testified that the Individual had a good prognosis and had shown rehabilitation, reinforcing
      the mitigation analysis.
  - id: C5
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: The Individual’s own statement that he will stay away from alcohol, combined with the objective PEth evidence, indicates
      a low likelihood of future alcohol‑related incidents.
  - id: C6
    facts:
    - F4
    - F2
    - F3
    equity: evidence_insufficiency
    favors:
    - O3
    weight: strong
    why: The initial psychologist diagnosis found no rehabilitation and the record includes two serious alcohol-related criminal
      offenses, creating uncertainty that warrants holding the decision until additional corroborating evidence is provided.
  reasoning:
    read: The judge must weigh documented rehabilitation against the initial professional finding of no rehabilitation and
      two serious alcohol-related crimes, and decide whether the record is sufficient to restore access now or whether more
      proof is needed.
    weighing: Mitigating evidence (treatment completion, negative PEth tests, supportive psychologist) is offset by the earlier
      diagnosis of no rehabilitation and the gravity of the criminal conduct. The new strong consideration of evidence insufficiency
      ({C6}) tips the balance toward a cautious hold pending further corroboration, outweighing the weakened mitigation ({C2}).
    tradecraft: The Administrative Judge will enter a pending decision, keep the individual's access authorization suspended,
      and issue a notice requiring additional evidence (e.g., longer post-treatment monitoring or a second expert evaluation).
    uncertainty: Moderate uncertainty remains because the rehabilitation record is compelling yet contested by the initial
      assessment and the seriousness of the offenses.
    handoff: The Administrative Judge decides alone under 10 C.F.R. § 710.7(a), but the pending status will be communicated
      to the LSO for continued monitoring.
    tempting_wrong:
      option: O1
      pull: The strong mitigation evidence and positive prognosis make immediate restoration appealing.
      why_wrong: Restoring now would ignore the unresolved doubts highlighted by the initial diagnosis and the seriousness
        of the prior offenses, risking a premature clearance.
    rejected:
      O1: The record still contains unresolved concerns; a hold ensures those are addressed before any restoration.
      O2: A straight denial disregards the substantial rehabilitation progress and would be unnecessarily punitive.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C6
  flip_conditions:
    would_change:
    - id: flip1
      if: The Individual were to produce a positive PEth test or relapse into alcohol consumption after July 2026.
      then: O1
      why: A relapse would demonstrate that the rehabilitation was not durable, justifying immediate restoration only after
        clear evidence of sustained abstinence.
    would_not_change:
    - id: noflip1
      if: The presumption against granting remains in effect.
      why: The Guidelines expressly allow the presumption to be overcome by sufficient mitigation, which the record demonstrates.
    watch_for:
    - id: watch1
      what: Any future alcohol‑related incident or positive PEth result.
      favors:
      - O2
      why: Such evidence would indicate a failure of rehabilitation and revive the security concerns under Guideline G.
  lesson: When rehabilitation evidence coexists with prior adverse professional findings and serious offenses, a hold pending
    further evidence can balance security concerns with fairness.
  limits: Applies to security adjudications involving alcohol misuse under Guidelines G and J; does not extend to other adjudicative
    categories such as espionage or foreign influence.
