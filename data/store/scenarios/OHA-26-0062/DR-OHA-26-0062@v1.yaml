case:
  id: DR-OHA-26-0062@v1
  title: Restoration of Access Authorization after Alcohol‑Related Incidents
  status: draft
  setting: DOE Office of Hearings and Appeals, July 30, 2026
  decider: Administrative Judge
  agent: Administrative Judge
  agent_role: decide
  situation: The Individual is employed by a DOE contractor in a position that requires an access authorization. He was arrested
    in April 2024 for criminal damage to a household member’s property after consuming alcohol, and again in May 2025 for
    aggravated DWI and related offenses after drinking. A DOE‑consultant psychologist diagnosed him with moderate Alcohol
    Use Disorder and initially found no evidence of rehabilitation. The Local Security Office raised security concerns under
    Guideline G (excessive alcohol consumption) and Guideline J (criminal conduct) and issued a notification letter. The Individual
    subsequently completed an intensive outpatient program, aftercare, and provided eleven consecutive negative PEth tests
    covering September 2025 through July 2026. The DOE psychologist testified that the Individual had shown rehabilitation
    and a good prognosis. The Administrative Judge must now determine whether to restore the Individual’s access authorization
    under the applicable Part 710 regulations, which presume against granting.
  question: What should the Administrative Judge do with the Individual’s access authorization?
  options:
    O1:
      do: The Administrative Judge restores the Individual’s access authorization
      move: act
      irreversible: true
    O2:
      do: The Administrative Judge denies the Individual’s access authorization
      move: act
      irreversible: true
    O3:
      do: The Administrative Judge holds the decision pending further evidence
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The Individual is employed by a DOE contractor in a position that requires an access authorization.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Individual was arrested in April 2024 for criminal damage to a household member’s property after consuming alcohol.
  - id: F3
    kind: situation
    status: confirmed
    fact: The Individual was arrested in May 2025 for aggravated DWI, reckless driving, open container, improper turning,
      and failure to maintain lane after drinking.
  - id: F4
    kind: capability
    status: confirmed
    fact: A DOE‑consultant psychologist diagnosed the Individual with moderate Alcohol Use Disorder without evidence of rehabilitation
      at the time of evaluation.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Individual completed an intensive outpatient program, its aftercare, and provided eleven consecutive negative
      PEth tests from September 2025 through July 2026.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Local Security Office raised security concerns under Guideline G and Guideline J and issued a notification letter.
  - id: F7
    kind: authority
    status: confirmed
    fact: The Administrative Judge must decide whether to restore the Individual’s access authorization under the applicable
      Part 710 regulations, which presume against granting.
  - id: F8
