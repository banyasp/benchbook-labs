basis: The October 1963 estimate stated that the SS-8 was comparable to the SS-7 in payload capacity; the Hyland Panel concurred
  in the smaller-system finding, and the Army had also assessed it as small. S&T analysts held final approval of performance
  and characteristics judgments, while the Air Force and DIA recorded their dissent.
