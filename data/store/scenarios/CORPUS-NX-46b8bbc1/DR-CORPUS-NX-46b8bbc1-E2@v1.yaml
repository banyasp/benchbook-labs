case:
  id: DR-CORPUS-NX-46b8bbc1-E2@v1
  title: Estimative Judgment Under Interagency Dissent
  status: draft
  setting: United States Intelligence Community, October 1963, formal strategic-weapons estimate
  decider: The S&T analysts responsible for final approval of performance and characteristics judgments
  agent: The S&T analysts responsible for final approval of performance and characteristics judgments
  agent_role: decide
  situation: In 1963, the Intelligence Community was preparing a strategic-weapons estimate about the size classification
    of a Soviet system. Earlier estimates had left its size unresolved, and agencies remained divided between a smaller-system
    judgment and a substantially larger-system judgment. A civilian scientific panel judged that the system was unlikely to
    be as large as the Air Force proposed and identified evidence consistent with the smaller interpretation. A later advisory
    panel and an Army assessment also favored the smaller interpretation. The Air Force and DIA maintained that the available
    record could not support a confident determination and did not rule out a substantially larger system. S&T analysts held
    final approval of performance and characteristics judgments as the new estimate approached formal consideration.
  question: What should the S&T analysts do as they finalize the performance and characteristics judgment for the October
    1963 strategic-weapons estimate?
  options:
    O1:
      do: The estimating body should reject the smaller-system judgment and enter the larger-system judgment.
      move: act
      irreversible: false
    O2:
      do: The estimating body should accept the smaller-system judgment and enter the larger-system dissent.
      move: act
      irreversible: false
    O3:
      do: The estimating body should request another review before finalizing its estimate.
      move: ask
      irreversible: false
      to: an interagency review panel
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A July 1962 estimate judged the information inadequate to determine whether the system was larger than earlier Soviet
      systems or smaller than a newer one.
  - id: F2
    kind: intelligence
    status: assessed
    fact: By early 1963, the Intelligence Community remained divided between smaller-system and larger-system assessments.
  - id: F3
    kind: situation
    status: confirmed
    fact: An initial three-day interagency review did not resolve the issue.
  - id: F4
    kind: intelligence
    status: assessed
    fact: A panel of civilian scientists judged the system unlikely to be as large as the Air Force proposed and identified
      indications consistent with the smaller assessment.
  - id: F5
    kind: intelligence
    status: assessed
    fact: A later advisory panel concurred with the smaller-system judgment, and the Army had also assessed the system as
      smaller.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The Air Force and DIA dissented, stating that a confident determination could not be made and that the available
      evidence did not exclude a substantially larger system.
  - id: F7
    kind: authority
    status: confirmed
    fact: S&T analysts held final approval of performance and characteristics judgments in estimates.
  - id: F8
    kind: situation
    status: confirmed
    fact: A new strategic-weapons estimate was approaching formal consideration in October 1963.
  considerations:
  - id: C1
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The civilian scientific panel judged the system unlikely to be as large as the Air Force proposed and found indications
      consistent with the smaller assessment.
  - id: C2
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The later advisory panel concurred with the smaller-system judgment, as had the Army, adding support beyond the civilian
      panel's assessment.
  - id: C3
    facts:
    - F2
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The Intelligence Community remained divided, and the Air Force and DIA maintained that the evidence did not support
      a confident determination or exclude a substantially larger system.
  - id: C4
    facts:
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: S&T analysts held final approval of these judgments, and the estimate was approaching formal consideration; their
      assigned role was to finalize the assessment.
  reasoning:
    read: The issue was genuinely contested, not resolved by the initial review. The trap is treating either the Air Force's
      larger-system concern or the existence of disagreement as a sufficient reason to make the larger judgment or defer again,
      despite the later panels and Army favoring the smaller assessment.
    weighing: 'The civilian panel, the later advisory panel, and the Army supported the smaller judgment {C1} {C2}; the Air
      Force and DIA preserved a substantial uncertainty {C3}. The October estimate adopted the smaller assessment while expressly
      recording the dissent. That balance supports {O2}: it reflects the judgments that had gained support without representing
      the disagreement as settled. The conclusion depends on the panels'' and Army''s support for the smaller interpretation,
      while recognizing that the available record did not persuade every agency.'
    tradecraft: State the smaller-system judgment at the confidence the assessment supports, and record the Air Force and
      DIA dissent and its evidentiary basis in the estimate. Do not present the judgment as unanimous or more certain than
      the record warrants.
    uncertainty: 'The estimate remained contested: the Air Force and DIA said a confident determination could not be made
      and did not exclude a substantially larger system. The smaller judgment was the adopted assessment, not a claim of unanimity.'
    handoff: The S&T analysts should finalize the judgment within their approval role and preserve the interagency disagreement
      in the estimate. Another review is not the selected course after the civilian and advisory panels and Army assessment
      had already weighed in.
    tempting_wrong:
      option: O1
      pull: The Air Force and DIA's concern that the evidence did not exclude a substantially larger system can make the larger
        judgment seem like the cautious choice.
      why_wrong: That concern supported recording a dissent, but the civilian and advisory panels and the Army favored the
        smaller assessment; the estimate adopted that assessment rather than the larger one.
    rejected:
      O1: The estimate did not adopt the larger-system judgment; it adopted the smaller judgment and recorded the Air Force
        and DIA's contrary view.
      O3: The estimate proceeded with the smaller judgment after the reviews and assessments favored it, while preserving
        the remaining disagreement rather than requesting another review.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The available evidence instead supported the substantially larger-system interpretation strongly enough to outweigh
        the civilian and advisory panels' smaller-system assessment.
      then: O1
      why: The estimate should follow the best-supported assessment; materially stronger evidence for the larger interpretation
        would change the balance.
    - id: flip2
      if: A further review could resolve a material evidentiary uncertainty before the estimate was finalized.
      then: O3
      why: A review with a realistic prospect of resolving an important uncertainty could justify deferring the judgment.
    would_not_change:
    - id: noflip1
      if: The Air Force and DIA continued to dissent while the estimate retained their stated uncertainty.
      why: Dissent alone would not require abandoning the smaller judgment; the October estimate adopted it while recording
        the Air Force and DIA's disagreement.
    watch_for: []
  lesson: When multiple reviews support an assessment but agencies remain divided, adopt the judgment best supported by the
    reviewed evidence and preserve material dissent. Be candid about uncertainty rather than treating either disagreement
    or a majority view as proof of certainty.
  limits: This reasoning applies to an estimative judgment with an assigned approval role and a record of competing assessments.
    It does not establish a general standard for resolving intelligence disputes or justify a particular confidence level
    where the evidence differs.
