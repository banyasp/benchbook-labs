case:
  id: DR-CORPUS-INC-U-S-TROOP-WITHDRAWAL-FROM-SOUTH-KOREA-19-NX-9cc76177-E10@v1
  title: US Force Presence in South Korea
  status: draft
  setting: South Korea, spring 1949; US policy deliberations informed by an intelligence assessment.
  decider: US policy decision-makers
  agent: US policy decision-makers
  agent_role: decide
  situation: US policy decision-makers are considering the presence of US forces in South Korea in spring 1949. The contemplated
    withdrawal would begin before June 1949, with economic and military aid continuing at currently projected levels and antagonism
    between northern and southern Koreans presenting a continuing danger of hostilities. South Korean security forces are
    assessed as capable of maintaining internal security but not yet trained or experienced for coordinated regimental and
    brigade operations. The assessed timeline for developing appreciable ability to resist an invasion extends beyond spring
    1949. Continued US presence could deter attack and support the Republic, while withdrawal would consolidate US forces
    in Japan and avoid leaving forces in an untenable position; withdrawal also carries assessed strategic and political risks.
  question: What should US policy decision-makers do about the presence of US forces in South Korea in spring 1949?
  options:
    O1:
      do: US policy decision-makers should withdraw US forces from South Korea.
      move: act
      irreversible: false
    O2:
      do: US policy decision-makers should retain a moderate US force in South Korea.
      move: act
      irreversible: false
    O3:
      do: US policy decision-makers should request agency review of the intelligence disagreement.
      move: ask
      irreversible: false
      to: the participating intelligence agencies
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Withdrawal in spring 1949 was assessed as likely to be followed by an invasion coordinated with Communist-led revolts
      in South Korea.
  - id: F2
    kind: capability
    status: assessed
    fact: South Korean security forces were assessed as able to maintain internal security but not yet sufficiently trained
      or experienced for coordinated regimental and brigade operations.
  - id: F3
    kind: capability
    status: confirmed
    fact: The South Korean Army had reached a strength of 65,000, and its training schedule called for completion of basic,
      battalion, and regimental training by June 1, 1949.
  - id: F4
    kind: intelligence
    status: assessed
    fact: An additional six months or more was estimated to be necessary for proficiency in large-scale field operations,
      with further training needed before appreciable ability to resist invasion could be guaranteed.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Withdrawal before South Korean forces developed the necessary capabilities was assessed as likely to result in the
      Republic's collapse and Communist domination.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A moderate US force in Korea was assessed as likely to discourage invasion, sustain South Korean resolve, and help
      maintain US prestige in the Far East.
  - id: F7
    kind: intelligence
    status: assessed
    fact: Withdrawal would allow consolidation of US Far Eastern troop strength in Japan and remove the risk of US forces
      remaining in an untenable position, but would allow Soviet exploitation of South Korea and could be interpreted as US
      weakness.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The American Mission in Korea and the United Nations Commission on Korea were assessed as able to mitigate adverse
      effects on South Korean resolve, but not to prevent the Republic's disintegration if its forces could not resist combined
      attacks.
  - id: F9
    kind: intelligence
    status: confirmed
    fact: The intelligence organizations of the Departments of State, Navy, and the Air Force concurred in the assessment;
      the Intelligence Division of the Department of the Army dissented.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F4
    - F5
    equity: civilian_life
    favors:
    - O2
    weight: strong
    why: Withdrawal before South Korean forces could resist a coordinated invasion and internal revolt was assessed as likely
      to expose the population to attack and bring about the Republic's collapse.
  - id: C2
    facts:
    - F2
    - F4
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: A moderate US presence was assessed as likely to discourage invasion and sustain South Korean resolve until its forces
      could develop the ability to resist.
  - id: C3
    facts:
    - F7
    equity: own_force_life
    favors:
    - O1
    weight: weak
    why: Withdrawal would consolidate US forces in Japan and avoid leaving US forces in a position assessed as untenable in
      the event of hostilities.
  - id: C4
    facts:
    - F5
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The assessed collapse of the Republic could seriously diminish US prestige and be interpreted in the region as US
      weakness; continued presence was assessed as helping maintain US prestige.
  - id: C5
    facts:
    - F9
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: State, Navy, and Air Force intelligence concurred, but Army Intelligence dissented. The dissent's reasoning is not
      given, making agency review a plausible way to clarify the disagreement.
  reasoning:
    read: The central issue is the interval between a possible US withdrawal and South Korean forces developing the capacity
      to resist invasion. The trap is to treat present internal-security capability, projected aid, or the presence of the
      American Mission and the UN Commission as equivalent to readiness for combined external and internal attacks; the assessment
      distinguishes these.
    weighing: The assessment gives greatest weight to the likelihood that early withdrawal would expose the Republic to invasion
      and revolt before South Korean forces were ready, and to the deterrent and morale effects attributed to a moderate US
      force. It recognizes withdrawal's force-consolidation and force-safety advantages, but judges these outweighed by the
      risks to the Republic, US prestige, and US regional security. The assessment's conclusion depends on the threat and
      readiness estimates being substantially correct; the recorded Army Intelligence dissent warrants retaining that uncertainty.
    tradecraft: Record the decision as a policy judgment based on an intelligence estimate dated 24 February 1949, not as
      a guarantee that an invasion will occur or as a legal requirement to retain forces. Preserve the dissent and the assumptions,
      and reassess as force readiness and the regional threat change.
    uncertainty: The invasion, revolt, and political consequences are assessed rather than certain. The intelligence organizations
      of State, Navy, and the Air Force concurred, while Army Intelligence dissented; the dissent's basis is not supplied
      here.
    handoff: The policy decision-makers must decide the force-presence question. They should involve the participating intelligence
      agencies, including Army Intelligence, to clarify the disagreement and update the threat and readiness estimates, without
      treating review as a substitute for the policy decision.
    tempting_wrong:
      option: O1
      pull: Withdrawal would consolidate US forces in Japan and remove the danger of leaving a US force in an untenable position.
      why_wrong: 'That advantage does not resolve the immediate readiness gap: the assessment judged that withdrawal before
        South Korean forces could resist combined attacks would likely lead to the Republic''s collapse and Communist domination.'
    rejected:
      O1: Withdrawal was not chosen because the assessment judged that South Korean forces would not be ready in time to prevent
        the likely consequences of invasion and revolt.
      O3: Requesting review was not the assessment's endorsed outcome; the recorded dissent warrants clarification, but the
        assessment's stated balance favors maintaining a moderate force.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: South Korean security forces have developed the assessed capability to resist a combination of external invasion
        and internal attacks.
      then: O1
      why: The principal reason for retaining US forces is the gap before South Korean forces can resist such attacks; once
        that gap is closed, the assessment's central objection to withdrawal is reduced.
    - id: flip2
      if: The assessed likelihood of an invasion coordinated with Communist-led revolts materially falls.
      then: O1
      why: A substantially lower threat would weaken the assessment's main reason for keeping a force in Korea to deter attack
        and sustain the Republic.
    would_not_change:
    - id: noflip1
      if: The American Mission in Korea and the UN Commission on Korea remain after troop withdrawal.
      why: Their presence could mitigate adverse effects on South Korean resolve, but was not assessed as preventing the Republic's
        disintegration if its forces could not resist combined attacks.
    watch_for:
    - id: watch1
      what: Progress from scheduled basic, battalion, and regimental training to proficiency in large-scale field operations
        and ability to resist invasion.
      favors:
      - O2
      why: The assessment places the readiness gap at the center of the withdrawal risk; updated readiness evidence could
        affect whether that risk remains.
    - id: watch2
      what: Updated assessments of the likelihood and scale of North Korean attack, Communist-led revolt, and possible outside
        assistance.
      favors:
      - O2
      why: These assessed threats underpin the predicted consequences of withdrawal and the deterrent value of continued presence.
  lesson: When a partner's security forces are not yet assessed as capable of meeting a foreseeable threat, do not treat their
    ability to handle routine internal security as proof that they can withstand combined attacks. Weigh the immediate risks
    of withdrawal against force-protection benefits, and revisit the judgment as readiness and threat estimates change.
  limits: This reasoning is tied to the spring 1949 threat and readiness estimates and to the policy choice described here.
    It does not establish a general rule that US forces should remain whenever a partner faces a security risk, or resolve
    legal or operational questions not addressed in the assessment.
