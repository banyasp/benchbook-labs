case:
  id: DR-CORPUS-NX-bb0e76af-E2@v1
  title: Expanding Strike Authority at Lima Site 85
  status: draft
  setting: Lima Site 85, 21 February; the Embassy and Air Force.
  decider: the Ambassador
  agent: the Ambassador
  agent_role: decide
  situation: In late February, the CIA and Air Force FACs regarded the ridgeline as endangered but believed it could still
    be defended at that time. Intelligence indicated that a major assault on the summit was planned and included information
    about the attacking force's strength and the attack's timing. The Embassy and Air Force had ordered additional airstrikes
    near the mountain, believing bombing might deter or dissuade the enemy. Bombing was ineffective against troops in deep
    jungle. The Ambassador must decide whether to expand strike authority around the site or retain the prior limits.
  question: What should the Ambassador do about expanding strike authority around Lima Site 85 in response to intelligence
    of an impending assault?
  options:
    O1:
      do: The Ambassador authorizes the local area defense commander to direct strikes around the site.
      move: act
      irreversible: false
    O2:
      do: The Ambassador declines expanded strike authority and retains the prior limits around the site.
      move: act
      irreversible: false
    O3:
      do: The Ambassador requests an additional assessment from the CIA and Air Force FACs before acting.
      move: ask
      irreversible: false
      to: the CIA and Air Force FACs
  facts:
  - id: F1
    kind: situation
    status: assessed
    fact: In late February, the CIA and Air Force FACs believed the ridgeline was in peril.
  - id: F2
    kind: situation
    status: assessed
    fact: The CIA and Air Force FACs believed the ridgeline could be defended for the present.
  - id: F3
    kind: intelligence
    status: confirmed
    fact: Intelligence indicated that a major assault on the summit was planned.
  - id: F4
    kind: intelligence
    status: confirmed
    fact: The intelligence included the strength of the attacking force.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The intelligence described the timing of the planned attack.
  - id: F6
    kind: situation
    status: confirmed
    fact: The Air Force and the Embassy ordered more airstrikes near the mountain.
  - id: F7
    kind: situation
    status: assessed
    fact: The Air Force and the Embassy believed bombing could deter or dissuade the enemy.
  - id: F8
    kind: capability
    status: assessed
    fact: Bombing was ineffective against troops in deep jungle.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The ridgeline was regarded as endangered but still defensible, and intelligence identified a planned major assault,
      its strength, and its timing. This supported expanding authority in response to a specific threat to the site.
  - id: C2
    facts:
    - F6
    - F7
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: The Embassy and Air Force had already ordered additional strikes because they believed bombing might deter or dissuade
      the enemy; broader authority followed that stated aim.
  - id: C3
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    - O3
    weight: strong
    why: Bombing was ineffective against troops in deep jungle, weighing against assuming that strikes would defeat the attacking
      force. This limits the effectiveness rationale but does not by itself negate the separately stated aim of deterrence.
  reasoning:
    read: The situation combined a specific warning of a major assault with the assessment that the ridgeline could still
      be defended for the present. The trap is to treat bombing's ineffectiveness against troops in deep jungle as proof that
      it could not serve the stated deterrent purpose, or conversely to treat the deterrence belief as proof that bombing
      would defeat those troops.
    weighing: The planned assault and the belief that the site remained defensible supplied the strongest reasons to expand
      authority {C1}. The stated deterrence aim supported that choice {C2}, while the acknowledged limits of bombing against
      troops in deep jungle counted against relying on it as a direct means of defeating the assault {C3}. The balance depends
      on the specific assault warning and on treating deterrence as a purpose distinct from direct effectiveness against jungle
      troops.
    tradecraft: Keep the decision record focused on the threat assessment, the stated deterrence purpose, the known limitation
      on bombing effectiveness, and why the prior limits were changed. Do not present the deterrence belief as established
      effectiveness.
    uncertainty: The intelligence described the planned assault, its force strength, and timing, but the record does not establish
      whether bombing would deter it. It does state that bombing was ineffective against troops in deep jungle.
    handoff: The Ambassador made the decision. The source records authority being assigned to the local area defense commander,
      but does not establish that further referral or consultation was required.
    tempting_wrong:
      option: O2
      pull: The stated ineffectiveness of bombing against troops in deep jungle may make retaining the prior limits seem preferable.
      why_wrong: That limitation addressed bombing's effectiveness against troops, while the Embassy and Air Force also believed
        it might deter or dissuade the enemy; the Ambassador expanded authority in the face of a specific assault warning.
    rejected:
      O2: The Ambassador did not retain the prior limits, instead expanding authority in response to the planned assault and
        the stated deterrence aim.
      O3: The source records an authorization rather than a request for additional assessment, and identifies the assault
        plan, force strength, and timing as known.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The planned assault warning were no longer credible.
      then: O2
      why: Without the specific threat that most strongly supported expanding authority, retaining the prior limits would
        be more consistent with the stated reasons.
    - id: flip2
      if: The key uncertainty about the planned assault, including its timing, could be resolved with additional assessment
        before a decision was needed.
      then: O3
      why: Further assessment could then inform whether expanded authority was warranted without relying on an unresolved
        threat picture.
    would_not_change:
    - id: noflip1
      if: Bombing remains ineffective against troops in deep jungle, while the planned assault warning and the stated deterrence
        aim remain.
      why: That limitation alone would not erase the separate deterrence rationale that accompanied the Ambassador's authorization.
    watch_for:
    - id: watch1
      what: Whether the assessed timing and strength of the planned assault remain credible as the decision is carried out.
      favors:
      - O3
      - O2
      why: A material change in the threat assessment could weaken the case for expanded authority and warrant reassessment.
  lesson: A specific, time-bound threat can support expanding authority when the site is still assessed as defensible. Distinguish
    the stated purpose of deterrence from the acknowledged limits of a measure's direct effectiveness, and do not present
    an expectation of deterrence as proof that it will work.
  limits: This reasoning applies to the stated decision about strike authority in response to the planned assault. The record
    does not establish the legal rules governing strikes, the consequences of the authorization, or whether deterrence occurred.
