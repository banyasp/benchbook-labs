case:
  id: DR-CORPUS-INC-U-2-PROGRAM-ESTABLISHMENT-AND-CIA-MANAGE-NX-46b8bbc1-E1@v1
  title: U-2 Program Management
  status: draft
  setting: During the later U-2 program management dispute, CIA and Air Force.
  decider: The President
  agent: The President
  agent_role: decide
  situation: The U-2 program had been assigned to CIA management, with Air Force assistance. The Air Force continued to seek
    authority to run the program once the planes and pilots were ready. The President had earlier called for unconventional
    handling to avoid entanglement in Defense Department bureaucracy and service rivalries. The CIA's Photo-Intelligence Division
    had expanded its capacity to handle the program's imagery. The President did not want uniformed armed-forces personnel
    flying over the Soviet Union.
  question: What should the President do about management of the U-2 program?
  options:
    O1:
      do: The President approves CIA management with Air Force assistance.
      move: act
      irreversible: false
    O2:
      do: The President rejects CIA management and approves Air Force management.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: assessed
    fact: The President stipulated that development be handled unconventionally to avoid Defense Department bureaucracy and
      service rivalries.
  - id: F2
    kind: authority
    status: assessed
    fact: The project committee believed the DCI should assert first rights to pioneering scientific intelligence capabilities
      and select partners as needed.
  - id: F3
    kind: authority
    status: confirmed
    fact: The President concurred with a proposal for CIA management of the program, with the Air Force providing assistance.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Air Force continued to seek agreement that it would run the program once the planes and pilots were ready.
  - id: F5
    kind: capability
    status: confirmed
    fact: The Air Force was to provide the assistance needed to get the program operational.
  - id: F6
    kind: capability
    status: confirmed
    fact: The CIA's Photo-Intelligence Division developed expanded capability to handle the program's imagery product.
  - id: F7
    kind: situation
    status: assessed
    fact: The President did not want uniformed armed-forces personnel flying over the Soviet Union.
  considerations:
  - id: C1
    facts:
    - F1
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The President wanted unconventional handling to avoid Defense Department bureaucracy and rivalry among the services,
      supporting continued CIA management.
  - id: C2
    facts:
    - F2
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The project committee believed the DCI should take the lead in pioneering scientific intelligence capabilities and
      choose partners as needed. This supports CIA leadership, though it is the committee's position rather than a separate
      presidential finding.
  - id: C3
    facts:
    - F3
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The President had concurred in CIA management with Air Force assistance, establishing the management arrangement
      he later had to resolve.
  - id: C4
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The Air Force could provide needed assistance, while CIA had expanded its imagery-analysis capability. These capacities
      supported the existing division of responsibilities, though the source does not say they independently determined the
      management decision.
  - id: C5
    facts:
    - F7
    equity: control_integrity
    favors:
    - O1
    weight: strong
    why: The President did not want uniformed armed-forces personnel flying over the Soviet Union, and he settled the dispute
      by keeping program management with CIA.
  reasoning:
    read: The decision was whether to preserve CIA management with Air Force assistance or transfer management to the Air
      Force. The trap is to treat the Air Force's necessary assistance, or its request to run the program, as a reason by
      itself to transfer management, despite the President's stated concerns and prior arrangement.
    weighing: The President's wish to avoid Defense Department bureaucracy and service rivalries, his concurrence in CIA management,
      and his objection to uniformed military personnel flying over the Soviet Union weigh toward O1. The committee's view
      that CIA should lead pioneering intelligence capabilities also supports that choice. Air Force assistance remained available,
      and CIA had expanded imagery-analysis capacity; the source does not present either as a reason to shift management.
      The balance depends chiefly on the President's stated preference about unconventional handling and uniformed personnel.
    tradecraft: Record the management decision, the President's rationale, the Air Force's assistance role, and the distinction
      between assistance and authority to manage. Do not infer additional legal rules or operational conditions that are not
      stated.
    uncertainty: The source gives no comparative assessment of the agencies' overall management performance or a separate
      legal rule requiring either arrangement. The stated presidential rationale and resolution of the dispute are clear.
    handoff: The President resolves the management dispute; the source records that he stepped in and settled it. No further
      referral is identified.
    tempting_wrong:
      option: O2
      pull: The Air Force was expected to provide assistance and sought to run the program once the planes and pilots were
        ready.
      why_wrong: Assistance did not itself establish a basis for transferring management; the President had favored unconventional
        handling and did not want uniformed armed-forces personnel flying over the Soviet Union.
    rejected:
      O2: The President did not transfer management to the Air Force, given his concerns about military personnel and his
        preference to avoid Defense Department bureaucracy and service rivalries.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C1
    - C3
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The President no longer objected to uniformed armed-forces personnel flying over the Soviet Union, and CIA management
        no longer served the purpose of avoiding Defense Department bureaucracy and service rivalries.
      then: O2
      why: Removing both stated presidential reasons for CIA management could make Air Force management a plausible alternative,
        though the source does not say the President would then choose it.
    would_not_change:
    - id: noflip1
      if: The Air Force continued to provide the assistance needed to get the program operational while seeking management
        authority.
      why: Assistance and a request to take over management do not, on their own, remove the President's stated reasons for
        keeping management with CIA.
    watch_for:
    - id: watch1
      what: Whether the President's concerns about Defense Department bureaucracy, service rivalries, and uniformed personnel
        remain in force.
      favors:
      - O1
      why: Those concerns are the stated reasons for retaining CIA management.
  lesson: Separate the provision of assistance from authority to manage a program. When the decision-maker has chosen an unconventional
    arrangement to avoid institutional entanglement and has a specific concern about who will carry out the program, preserve
    that arrangement unless the stated reasons change.
  limits: This reasoning concerns the U-2 management dispute and the President's stated reasons in this record. It does not
    establish a general rule that intelligence programs must be managed by CIA or that military assistance implies or precludes
    management authority.
