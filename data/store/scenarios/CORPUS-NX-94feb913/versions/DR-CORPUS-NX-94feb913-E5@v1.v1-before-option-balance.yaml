case:
  id: DR-CORPUS-NX-94feb913-E5@v1
  title: Support for Armed Resistance
  status: draft
  setting: Iraq, 2004, the Shi'a community and the political opposition in western Iraq
  decider: The political leader of the Sadrist Movement
  agent: The political leader of the Sadrist Movement
  agent_role: decide
  situation: In Iraq in 2004, the political leader's stature as a resistance figure was growing. The Sadrist Movement had
    become a political force that its opponents within the Shi'a community could not ignore. Coalition forces were pressuring
    Sunni areas, especially Fallujah, while predominantly Sunni armed opposition operated in western Iraq. Supporting that
    opposition could create a pan-sectarian appeal for resistance. The political leader saw such support as a way to increase
    his power and authority inside Iraq, while facing opposition from other Shi'a organizations.
  question: What should the political leader do regarding support for the predominantly Sunni armed opposition in western
    Iraq?
  options:
    O1:
      do: The political leader opposes the predominantly Sunni armed opposition in western Iraq.
      move: act
      irreversible: true
    O2:
      do: The political leader supports the predominantly Sunni armed opposition in western Iraq.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: In 2004, the political leader's stature as a resistance figure grew.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Sadrist Movement had become a political reality that its opponents within the Shi'a community could not ignore.
  - id: F3
    kind: situation
    status: confirmed
    fact: Coalition forces were putting Sunni areas under siege, especially Fallujah.
  - id: F4
    kind: situation
    status: confirmed
    fact: The armed opposition based in western Iraq was predominantly Sunni.
  - id: F5
    kind: situation
    status: assessed
    fact: The political leader viewed support for the predominantly Sunni armed opposition as a way to make a pan-sectarian
      appeal for resistance against the coalition.
  - id: F6
    kind: situation
    status: assessed
    fact: The political leader viewed such support as a way to increase his power and authority inside Iraq.
  - id: F7
    kind: situation
    status: confirmed
    fact: The armed opposition relieved pressure on Sunni areas under siege from coalition forces.
  - id: F8
    kind: situation
    status: confirmed
    fact: The movement faced opposition from other Shi'a organizations in Iraq.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Support was viewed as a way to make resistance against the coalition a pan-sectarian cause and to increase the leader's
      power and authority inside Iraq.
  - id: C2
    facts:
    - F3
    - F4
    - F7
    equity: humanitarian_access
    favors:
    - O2
    weight: strong
    why: The predominantly Sunni opposition relieved pressure on Sunni areas under coalition siege, especially Fallujah; this
      reinforced the appeal of supporting it.
  - id: C3
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The leader's stature as a resistance figure was growing, and the movement had become a political force its Shi'a
      opponents could not ignore, making a broader resistance appeal a consequential opportunity.
  - id: C4
    facts:
    - F8
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Opposition from other Shi'a organizations was a political constraint, but it did not prevent the movement from later
      attaining preeminence.
  reasoning:
    read: This is a political choice to support predominantly Sunni armed resistance, not simply a choice between sectarian
      alignment and solidarity. The opportunity was to broaden resistance across sectarian lines and build the leader's authority,
      while the trap is to mistake that political calculation for a claim that the support was solely altruistic or free of
      intra-Shi'a opposition.
    weighing: The strongest reasons favoring {O2} are the pan-sectarian appeal and increased authority the leader expected,
      reinforced by the fact that the opposition relieved pressure on Sunni areas under siege {C1} {C2}. The leader's growing
      stature made that opening significant {C3}; opposition from other Shi'a organizations weighs against support, but did
      not prevent the movement's later preeminence {C4}. The balance depends on the assessment that support could serve both
      the resistance appeal and the leader's political standing.
    tradecraft: State the decision at the level of whether to support the opposition. Record the political rationale and the
      intra-Shi'a opposition as relevant considerations; do not add operational details or claim legal findings not provided
      here.
    uncertainty: The account gives the leader's political assessment and the movement's later standing, but no legal analysis,
      assessment of civilian effects, or detailed account of the consequences of support. Those matters cannot be resolved
      from the available facts.
    handoff: The decision is presented as the political leader's, with no required referral or separate approving authority
      identified. Attribute the decision to that role without inferring legal authority beyond the available facts.
    tempting_wrong:
      option: O1
      pull: Opposition from other Shi'a organizations could make opposing the Sunni armed opposition seem safer for the movement's
        standing within its own community.
      why_wrong: That concern does not outweigh the stated calculation that support could broaden resistance and increase
        the leader's authority; the movement later attained preeminence despite Shi'a opposition.
    rejected:
      O1: The political leader did not oppose the opposition because support could build a pan-sectarian resistance appeal
        and increase authority.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Support would neither relieve pressure on Sunni areas nor enable a pan-sectarian appeal for resistance.
      then: O1
      why: The principal reasons for support would no longer apply.
    would_not_change:
    - id: noflip1
      if: Other Shi'a organizations continue to oppose the movement.
      why: That opposition alone would not reverse the choice, since the movement attained preeminence despite it.
    watch_for: []
  lesson: A political decision to support resistance may be driven by both the broader appeal it creates and the authority
    it brings to the decision-maker. Weigh those purposes against intra-community opposition without treating that opposition
    as decisive when it does not prevent the movement's success.
  limits: This reasoning applies to the political calculation described in Iraq in 2004. The account does not establish whether
    support was lawful, assess civilian consequences, or provide a general rule for supporting armed groups.
