case:
  id: DR-CORPUS-NX-fa23d07c-E1@v1
  title: Warnings Amid a Policy of Avoiding Provocation
  status: draft
  setting: Moscow, on the morning of 22 June 1941, Soviet leadership
  decider: the Soviet leader
  agent: the Soviet leader
  agent_role: decide
  situation: Extensive intelligence from across Europe and Japan warned of a German military buildup and an attack. The Soviet
    leader believed Germany would not act until its conflict with Britain was resolved, and German deception reinforced that
    expectation. The governing policy was to avoid actions that could be seen as provocation. Some troop movements and other
    indicators had plausible non-attack interpretations, and some warnings were unclear. The Soviet leader had little reason
    to trust alerts from British and U.S. leaders.
  question: What should the Soviet leader do about the extensive warnings of a German attack while maintaining a policy of
    avoiding provocation?
  options:
    O1:
      do: The Soviet leader rejects the warnings as disinformation and maintains the policy of avoiding provocation.
      move: act
      irreversible: false
    O2:
      do: The Soviet leader requests a renewed assessment from the intelligence departments before changing the policy.
      move: ask
      irreversible: false
      to: the intelligence departments
    O3:
      do: The Soviet leader accepts the warnings and changes the policy of avoiding provocation.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Intelligence from across Europe and Japan warned of a German military buildup for invasion.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The Soviet leader believed Germany would not act until its conflict with Britain was resolved.
  - id: F3
    kind: intelligence
    status: assessed
    fact: German deception reinforced the Soviet leader's belief about when Germany would act.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Soviet policy was to avoid actions that might be seen as provocation.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Some German troop movements were not necessarily related to an attack.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Some warnings were ambiguous or bizarre, and the Soviet leader had no particular reason to trust alerts from British
      and U.S. leaders.
  considerations:
  - id: C1
    facts:
    - F1
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The warnings were extensive, and the reviewer concludes that the intelligence departments had served the leader well;
      responsibility for disregarding their reporting rested with him.
  - id: C2
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: Some indicators had plausible alternative explanations, some warnings were unclear, and British and U.S. alerts were
      not necessarily trustworthy. These points support caution in interpreting individual reports, but not dismissal of the
      overall warning picture.
  - id: C3
    facts:
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: The expectation that Germany would wait until its conflict with Britain was resolved was reinforced by German deception.
      The reviewer describes how that expectation allowed the leader to dismiss warnings as disinformation or provocation.
  - id: C4
    facts:
    - F4
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: Avoiding actions that could be seen as provocation was the governing policy and is a reason to resist an unnecessary
      escalation. It does not, however, establish that the warnings should be rejected.
  reasoning:
    read: The situation is not simply a choice between trusting every report and avoiding provocation. Some indicators were
      ambiguous, but the warnings were extensive and the leader's expectation about Germany's timing was reinforced by deception.
      The trap was allowing that expectation to turn warnings into presumed disinformation.
    weighing: The ambiguity of particular reports and the reasons for distrusting outside alerts support caution and could
      justify renewed assessment {C2}. But the reviewer accepts the substance of the extensive warning picture and concludes
      the intelligence departments served the leader well {C1}. The leader's fixed expectation, reinforced by German deception,
      helps explain the dismissal but does not justify it {C3}. On balance, accept the warnings and change the policy rather
      than reject them to preserve non-provocation {C4}.
    tradecraft: Treat the warnings as a body of evidence, distinguish uncertain indicators from the overall assessment, and
      record the reasons for changing policy. This recommendation does not prescribe operational measures.
    uncertainty: Individual troop movements and some warnings did not conclusively indicate an attack, and the leader had
      reason not to trust British and U.S. alerts {F5} {F6}. The review nonetheless finds that the intelligence was sufficient
      in the aggregate to make ignoring it unjustified.
    handoff: The decision remains the leader's responsibility. Intelligence departments are relevant to the assessment, but
      further assessment should not be used to displace the leader's responsibility for acting on the warning picture.
    tempting_wrong:
      option: O1
      pull: It preserves the established policy of avoiding provocation and fits the belief that Germany would wait until
        its conflict with Britain was resolved.
      why_wrong: That belief was reinforced by German deception, and rejecting the warnings repeats the failure the reviewer
        assigns to the leader.
    rejected:
      O1: It preserves non-provocation by rejecting the warnings, but the reviewer concludes that the intelligence was substantial
        and that dismissing it was the leader's responsibility.
      O2: A renewed assessment responds to genuine ambiguity, but the reviewer finds the intelligence departments had already
        served the leader well; deferring a change does not resolve the failure to heed the overall warning picture.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A renewed assessment materially undermined the overall warning picture rather than merely identifying ambiguity
        in individual indicators.
      then: O2
      why: A materially different aggregate assessment could make deferring a policy change more defensible than accepting
        the warnings as they stand.
    would_not_change:
    - id: noflip1
      if: Some individual troop movements or warnings remain ambiguous while the extensive overall warning picture remains
        intact.
      why: The review acknowledges ambiguity but still concludes that the intelligence was substantial and that ignoring it
        was the leader's responsibility.
    watch_for:
    - id: watch1
      what: Whether the apparent indicators are genuinely ambiguous in the aggregate, rather than only when considered one
        at a time.
      favors:
      - O2
      why: The review recognizes that some movements and warnings had plausible alternative interpretations, while finding
        the totality of the intelligence persuasive.
  lesson: Do not let a settled expectation or an adversary's deception convert extensive warnings into presumed disinformation.
    Weigh ambiguity honestly, but judge the overall evidence and retain responsibility for the decision.
  limits: This conclusion concerns the review's judgment about the warnings and the decision to ignore them. It does not establish
    what particular operational measures were warranted or how to carry them out.
  library:
    domain: intel-analysis
    family: CORPUS-NX-fa23d07c
    source: https://www.cia.gov/resources/csi/static/467292f7793d09d5125d5001262d22ef/Review-What-Stalin-Knew.pdf
    episode_focus: 'The decision point is how to respond to extensive warnings amid the German military buildup: act on the
      warnings or treat them as disinformation and preserve the policy of avoiding provocation. The review says the Soviet
      leader believed Germany would not act before resolving its conflict with Britain and was influenced by German deception;
      exclude the separate operational details of German reconnaissance and border violations.'
