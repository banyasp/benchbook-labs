case:
  id: DR-CORPUS-NX-9c6b6c7f-E1@v1
  title: The Suspected Valet
  status: draft
  setting: At the envoy's post abroad, during the period of the letter; the envoy's household.
  decider: The envoy
  agent: The envoy
  agent_role: decide
  situation: An envoy has a valet de place whose loyalty is suspected. The envoy regards it as impossible to identify every
    pretended friend and difficult to prevent interested people from placing spies. He considers the valet probably a spy,
    though he does not claim certainty. The decision concerns whether to retain the valet or dismiss him, with retention conditional
    on the envoy being satisfied with him in other respects. The envoy believes just and honorable conduct can withstand public
    scrutiny and that greater public knowledge can strengthen reputation. He also regards conjectures about his business as
    harmless.
  question: 'What should the envoy do about the suspected valet de place: retain him if otherwise satisfactory or dismiss
    him?'
  options:
    O1:
      do: The envoy dismisses the valet de place from his service.
      move: act
      irreversible: false
    O2:
      do: The envoy retains the valet de place in his service.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The envoy has a valet de place in his service.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The envoy considers it impossible to discover in every case whether apparent friends are genuine.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The envoy considers it difficult to prevent being watched by spies when interested people choose to place them.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The envoy assesses that the valet is probably a spy.
  - id: F5
    kind: situation
    status: assessed
    fact: The envoy's consideration of retaining the valet is conditional on being satisfied with him in other respects.
  - id: F6
    kind: situation
    status: assessed
    fact: The envoy believes just and honorable actions can withstand public scrutiny and that wider knowledge of them can
      strengthen reputation.
  - id: F7
    kind: situation
    status: assessed
    fact: The envoy regards conjectures about his business as harmless.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The envoy believes apparent friends cannot always be identified and surveillance cannot reliably be prevented; the
      valet's likely spying therefore does not, by itself, justify dismissal.
  - id: C2
    facts:
    - F6
    equity: public_transparency
    favors:
    - O2
    weight: strong
    why: The envoy's rule is to do nothing he would blush to have made public and to act in ways that scrutiny can welcome;
      just and honorable conduct becomes better known and strengthens reputation.
  - id: C3
    facts:
    - F5
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: Retention is expressly conditional on the envoy being satisfied with the valet in other respects, rather than being
      unconditional.
  - id: C4
    facts:
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: The envoy considers conjectures about his business harmless and sees no need to spend effort correcting them; they
      do not supply a reason to dismiss the valet.
  reasoning:
    read: The envoy faces a probable, not certain, suspicion of spying in a setting where he considers surveillance difficult
      to prevent. The trap is treating dismissal as a necessary response to suspicion when his stated rule is to live so that
      observation cannot expose dishonorable conduct.
    weighing: The envoy favors retaining the valet if he is satisfactory in other respects. The difficulty of preventing surveillance
      and the reputational value of honorable conduct weigh against dismissal based on suspicion alone {C1} {C2}; the condition
      about the valet's other qualities remains material {C3}. Harmless conjectures do not warrant a separate effort to correct
      them {C4}.
    tradecraft: Keep the decision confined to whether the valet is satisfactory in other respects; do not turn it into an
      operational inquiry about detecting or countering spies. Record the conditional basis for retention. This decision-recording
      advice is an authored synthesis.
    uncertainty: The envoy assesses that the valet is probably a spy, not that this is certain. The envoy also says certainty
      would not change his decision if he otherwise liked the valet.
    handoff: The envoy decides. The source supplies no reason to refer the employment choice to another authority; this is
      an authored assessment.
    tempting_wrong:
      option: O1
      pull: Dismissal may seem prudent because the valet is probably a spy.
      why_wrong: The envoy regards surveillance as difficult to prevent and says he would not dismiss even a valet he knew
        to be a spy, provided he liked him in other respects.
    rejected:
      O1: The envoy does not favor dismissal merely because the valet is probably a spy, given the difficulty of preventing
        surveillance and the condition that the valet be satisfactory in other respects.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The envoy is not satisfied with the valet in other respects.
      then: O1
      why: The stated case for retention is conditional on the envoy liking the valet in other respects; if that condition
        fails, dismissal becomes the alternative, though the source does not expressly direct it.
    would_not_change:
    - id: noflip1
      if: The envoy becomes certain that the valet is a spy, while remaining satisfied with him in other respects.
      why: The envoy expressly says certainty about the spying would not make him discharge the valet if he otherwise liked
        him.
    watch_for:
    - id: watch1
      what: Whether the valet remains satisfactory to the envoy in other respects.
      favors:
      - O2
      why: The envoy makes that satisfaction a condition of retention.
  lesson: Do not treat suspicion alone as requiring dismissal when surveillance cannot reliably be prevented and the decision-maker's
    conduct can withstand public scrutiny. Retention remains conditional on the person's being satisfactory in other respects.
  limits: This reasoning addresses the envoy's stated choice about a valet and does not establish a general rule for access
    decisions or cases involving evidence of concrete harm, legal requirements, or duties not present here.
  library:
    domain: natsec-other
    family: CORPUS-NX-9c6b6c7f
    source: https://www.cia.gov/resources/csi/static/cfae9a834202e3b262d652e8f8652e03/Nothing-to-Hide.pdf
    episode_focus: The decision is whether to dismiss the suspected spy or retain him if otherwise satisfactory; the envoy
      favors retention because he believes surveillance cannot always be prevented and says honorable conduct can withstand
      public scrutiny. Exclude any operational question about detecting or countering spies.
    cues:
      option_words:
        O1: 10
        O2: 10
      real_option: O2
      real_to_mean_other_length: 1.0
      real_is_longest: true
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
verdict_tier: source-endorsed
basis: The envoy says that even if sure the valet were a spy, he would not discharge him if he liked him in other respects.
