case:
  id: DR-CORPUS-NX-6ec59655-E9@v1
  title: Nonlethal Airpower Under ROE
  status: draft
  setting: Ground forces, the current situation, under theater ROE and SPINS.
  decider: The ground commander
  agent: The ground commander
  agent_role: decide
  situation: The ground commander is considering an escalation-of-force option rather than lethal fires. A show of force using
    CAS aircraft is among the available options. The doctrine identifies unsuitable or unavailable munitions as one circumstance
    for requesting a show of force, and friendly forces too close to enemy forces for weapons employment under ROE as another.
    A show of force is a nonlethal form of airpower intended to demonstrate resolve and defuse a specific situation. It must
    have an intended target and desired effect and comply with theater ROE and SPINS.
  question: What should the ground commander do about using a show of force in the current situation under theater ROE and
    SPINS?
  options:
    O1:
      do: The ground commander authorizes a show of force under theater ROE and SPINS.
      move: act
      irreversible: false
    O2:
      do: The ground commander declines a show of force under theater ROE and SPINS.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The ground commander may determine that escalation of force rather than lethal fires is the best course of action
      for the current situation.
  - id: F2
    kind: situation
    status: confirmed
    fact: A show of force using CAS aircraft is one available escalation-of-force option.
  - id: F3
    kind: situation
    status: confirmed
    fact: A show of force is designed to demonstrate resolve and defuse a specific situation.
  - id: F4
    kind: capability
    status: confirmed
    fact: A show of force is a nonlethal form of airpower employment.
  - id: F5
    kind: authority
    status: confirmed
    fact: A show of force must have an intended target and a desired effect and comply with theater ROE and SPINS.
  - id: F6
    kind: capability
    status: confirmed
    fact: The aircraft may be out of munitions or have an unsuitable type of munitions to be effective.
  - id: F7
    kind: situation
    status: confirmed
    fact: Friendly forces may be too close to enemy forces for safe weapons use.
  - id: F8
    kind: authority
    status: confirmed
    fact: The current situation may fail to meet ROE conditions for weapons employment.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The ground commander may judge escalation of force, rather than lethal fires, to be the best course for the current
      situation; a CAS show of force is an available option.
  - id: C2
    facts:
    - F3
    - F4
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: A show of force is nonlethal airpower intended to demonstrate resolve and defuse a specific situation, supporting
      its use as an escalation option.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: When aircraft lack munitions or have unsuitable munitions to be effective, the doctrine identifies a show of force
      as a reasoned alternative.
  - id: C4
    facts:
    - F7
    - F8
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: If friendly forces are too close for safe weapons use, or the situation does not satisfy ROE for weapons employment,
      the doctrine identifies a show of force as a reason to request a nonlethal option.
  - id: C5
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Authorization is appropriate only for a show of force with an intended target and desired effect that complies with
      theater ROE and SPINS.
  reasoning:
    read: 'The decision is whether to use a nonlethal escalation option instead of lethal fires. The trap is treating nonlethal
      employment as automatically appropriate or unconstrained: the doctrine still requires an intended target, a desired
      effect, and compliance with theater ROE and SPINS.'
    weighing: The doctrine favors considering a show of force when munitions are unavailable or unsuitable, or when friendly
      forces are too close for safe weapons use or ROE does not permit weapons employment. Those reasons support O1, while
      the intended-effect and compliance requirements limit it. The balance depends on whether the stated circumstances apply
      and whether the show of force can meet those requirements.
    tradecraft: Before authorizing, identify the intended target and desired effect, confirm compliance with theater ROE and
      SPINS, and record the reason for choosing this escalation option. Do not treat its nonlethal character as a substitute
      for those checks.
    uncertainty: The doctrine gives general reasons for requesting a show of force, but does not establish that any one of
      those circumstances is present in every case or supply the particular ROE and SPINS conditions applicable here.
    handoff: The ground commander makes the decision. The guidance identifies no additional approval authority; the commander
      must ensure the decision complies with theater ROE and SPINS.
    tempting_wrong:
      option: O2
      pull: Declining may seem safer where weapons use is unsuitable, unsafe, or unavailable.
      why_wrong: That would overlook the doctrine's identification of a nonlethal show of force as an escalation option for
        those circumstances, provided its stated purpose and compliance requirements are met.
    rejected:
      O2: The doctrine identifies circumstances in which a show of force is a reasoned nonlethal escalation option, so declining
        it is not the endorsed choice when the required purpose and ROE/SPINS compliance are satisfied.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The show of force would lack an intended target or desired effect, or could not be conducted in accordance with
        theater ROE and SPINS.
      then: O2
      why: The doctrine makes these conditions requirements for a show of force, so authorization would not be justified without
        them.
    - id: flip2
      if: The ground commander no longer judges escalation of force to be the best course for the current situation.
      then: O2
      why: The recommendation to use this option depends on the commander's judgment that escalation of force is preferable
        for the current situation.
    would_not_change:
    - id: noflip1
      if: The show of force is nonlethal.
      why: Its nonlethal character does not remove the requirements for an intended target, a desired effect, and compliance
        with theater ROE and SPINS.
    watch_for:
    - id: watch1
      what: Whether aircraft lack munitions or have unsuitable munitions, or whether friendly forces are too close for safe
        weapons use or ROE does not permit weapons employment.
      favors:
      - O1
      why: The doctrine identifies these as reasons to request a show of force.
  lesson: A nonlethal show of force can be an appropriate escalation option when weapons are unavailable, unsuitable, unsafe
    to use, or not permitted by ROE. It still requires a defined intended target and desired effect, and must comply with
    theater ROE and SPINS.
  limits: This reasoning applies to the doctrine's decision about using a show of force as an escalation option. It does not
    determine whether a particular show of force satisfies specific theater ROE or SPINS, nor does it establish that escalation
    is best in every situation.
