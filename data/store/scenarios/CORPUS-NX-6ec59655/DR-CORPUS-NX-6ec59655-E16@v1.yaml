case:
  id: DR-CORPUS-NX-6ec59655-E16@v1
  title: Delegating Support Control During Patrol Contact
  status: draft
  setting: Area of operations; time unspecified; air-ground command.
  decider: The Air Officer
  agent: The Air Officer
  agent_role: decide
  situation: A patrol without a JTAC is in contact and has requested close air support. A rotary-wing section with FAC(A)
    capability is available. The FAC(A) is familiar with the area of operations and the supported unit. The Air Officer is
    collocated with the fire support coordinator and holds fires approval authority. The Air Officer must decide whether to
    delegate control of support to the FAC(A) or retain that control directly.
  question: What should the Air Officer do about control of support to the patrol while retaining fires approval authority?
  options:
    O1:
      do: The Air Officer declines delegation to the FAC(A)-capable rotary-wing section, retains direct control of support
        for the patrol, and retains fires approval.
      move: act
      irreversible: false
    O2:
      do: The Air Officer authorizes the FAC(A)-capable rotary-wing section to control support for the patrol and retains
        fires approval.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A patrol without a JTAC was in contact.
  - id: F2
    kind: situation
    status: confirmed
    fact: The patrol requested close air support.
  - id: F3
    kind: capability
    status: confirmed
    fact: A rotary-wing section with FAC(A) capability was available.
  - id: F4
    kind: capability
    status: confirmed
    fact: The FAC(A) was familiar with the area of operations and the supported unit.
  - id: F5
    kind: authority
    status: confirmed
    fact: The Air Officer held fires approval authority and was collocated with the fire support coordinator.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Four to six enemy fighters had been observed and were suspected of preparing another attack.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The patrol needs close air support, and a FAC(A)-capable rotary-wing section is available to control that support.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: 'The FAC(A)''s familiarity with the area and supported unit is the stated reason for delegating control: it enables
      more precise control of fires.'
  - id: C3
    facts:
    - F5
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The Air Officer remains collocated with the fire support coordinator and retains approval authority for all fires,
      separating delegated control from retained approval.
  reasoning:
    read: The decision is about who controls support to a patrol without a JTAC, not whether the Air Officer gives up fires
      approval. The important distinction is that control can be delegated while approval authority remains with the Air Officer.
    weighing: 'The stated basis favors delegating control: the available FAC(A) is familiar with the area and supported unit,
      which enables more precise control of fires {C1} {C2}. The Air Officer can still approve fires while collocated with
      the fire support coordinator {C3}. The balance depends on that capable, familiar FAC(A) being available and the Air
      Officer retaining approval authority.'
    tradecraft: 'Make the division of responsibility explicit: delegate control to the FAC(A), state that fires approval remains
      with the Air Officer, and keep the approval relationship clear in the command record.'
    uncertainty: The stated rationale is limited to the FAC(A)'s capability and familiarity and the Air Officer's retained
      approval authority. It does not provide a broader comparison of risks or specify additional conditions for delegation.
    handoff: The Air Officer decides and delegates control to the FAC(A), while remaining collocated with the fire support
      coordinator and retaining approval of all fires.
    tempting_wrong:
      option: O1
      pull: The patrol has no JTAC, and the Air Officer already holds fires approval authority.
      why_wrong: Those facts do not require the Air Officer to retain direct control; doing so would forgo the stated advantage
        of the FAC(A)'s familiarity while conflating control with approval.
    rejected:
      O1: The Air Officer did not retain direct control because the familiar FAC(A) could provide more precise control while
        the Air Officer retained fires approval.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The rotary-wing section were not FAC(A)-capable and no suitable FAC(A) were available to control support.
      then: O1
      why: The stated reason for delegation depends on an available FAC(A) who can take control; without that capability,
        the basis for O2 would be absent.
    - id: flip2
      if: The available FAC(A) were not familiar with the area or supported unit.
      then: O1
      why: The source gives that familiarity as the reason the FAC(A) can provide more precise control, so its absence could
        favor retaining control directly.
    would_not_change:
    - id: noflip1
      if: The reported assessment of four to six enemy fighters suspected of preparing another attack remained unchanged,
        with the control and approval arrangements otherwise unchanged.
      why: That assessment provides context, but the stated rationale for the control allocation is the FAC(A)'s familiarity
        and the Air Officer's retained fires approval.
    watch_for: []
  lesson: 'Control and approval are distinct responsibilities: a decision-maker may delegate control to a capable, familiar
    controller while retaining fires approval. Make that allocation explicit so delegation improves control without obscuring
    who holds approval authority.'
  limits: This reasoning addresses only the stated allocation of control and fires approval. It does not establish rules for
    other command arrangements or resolve questions about targeting, engagement procedures, or legal conditions not provided
    here.
  library:
    domain: operational-command
    family: CORPUS-NX-6ec59655
    source: https://irp.fas.org/doddir/dod/jp3_09_3.pdf
