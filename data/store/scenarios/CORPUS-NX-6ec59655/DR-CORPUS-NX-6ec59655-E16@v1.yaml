      familiar with the area and supported unit, while retaining approval of fires. Focus on the command and authority allocation
      and its rationale; exclude the subsequent targeting and attack procedures.
    cues:
      option_words:
        O1: 22
        O2: 18
      real_option: O2
      real_to_mean_other_length: 0.82
      real_is_longest: false
      moves:
        O1: act
        O2: act
      real_move: act
      irreversible_flags:
        O1: false
        O2: false
    equities: pilot2
