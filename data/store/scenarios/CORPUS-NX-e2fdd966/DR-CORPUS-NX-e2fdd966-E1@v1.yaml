case:
  id: DR-CORPUS-NX-e2fdd966-E1@v1
  title: Estimating Nuclear Warhead Assignments
  status: draft
  setting: PRC; present-inventory estimate; estimating institution not specified.
  decider: The estimators
  agent: The estimators
  agent_role: decide
  situation: The estimators are judging whether deployed missile systems carry nuclear warheads. They estimate that the deployed
    systems carry them. They estimate the PRC stockpile at 150 to 160 warheads. There is no direct evidence of the actual
    stockpile size. The assessment relies on indirect evidence, including the nuclear-test record and information about delivery
    systems. The estimators’ assignment draws on comparisons among those evidence sources.
  question: What should the estimators conclude about nuclear-warhead assignments to the deployed missile systems?
  options:
    O1:
      do: The estimators withhold nuclear-warhead assignments from the deployed missile systems.
      move: act
      irreversible: false
    O2:
      do: The estimators assign nuclear warheads to the deployed missile systems.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The estimators assess that all currently deployed missile systems carry nuclear warheads.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The PRC nuclear stockpile is estimated to contain between 150 and 160 warheads.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The estimated stockpile limit depends on perceived needs rather than restrictions on nuclear-material production.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The inventory estimate is based on projections of delivery systems.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: There is no direct evidence of the actual size of the present nuclear stockpile.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Indirect evidence from nuclear tests and delivery-system information provides a basis for estimating stockpile characteristics
      and approximate numbers.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The assignment of warheads to delivery systems is based on comparing the nuclear-test record with delivery-system
      characteristics and deployment.
  considerations:
  - id: C1
    facts:
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The assignment is based on comparing the nuclear-test record with delivery-system characteristics and deployment.
  - id: C2
    facts:
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Although the actual stockpile size is not directly observed, indirect evidence from tests and delivery systems provides
      a basis for estimating its characteristics and approximate numbers.
  - id: C3
    facts:
    - F2
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The inventory estimate is based on delivery-system projections, with the resulting stockpile assessed at 150 to 160
      warheads; this provides contextual support for the overall assessment.
  reasoning:
    read: The estimators must judge warhead assignments without direct evidence of the stockpile itself. The trap is treating
      that absence as if there were no evidentiary basis, when the assessment instead rests on comparisons among indirect
      sources.
    weighing: The estimators favor assignment because they compare the nuclear-test record with delivery-system characteristics
      and deployment, and regard indirect evidence as sufficient to estimate stockpile characteristics and approximate numbers.
      The inventory projection gives weaker contextual support. The judgment depends on those sources providing a sound basis
      for the comparison, not on direct observation of the stockpile.
    tradecraft: Keep the conclusion tied to the evidence actually considered, distinguish the assessed assignment from directly
      observed fact, and record the uncertainty arising from the lack of direct stockpile evidence.
    uncertainty: The actual stockpile size is not directly known. The assessment is an estimate derived from indirect evidence
      and delivery-system projections.
    handoff: The estimators make the analytic judgment; the source does not identify a separate approving authority. Any review
      should assess whether the comparison faithfully reflects the stated evidence and uncertainty.
    tempting_wrong:
      option: O1
      pull: Withholding assignments may seem prudent because the actual stockpile has not been directly observed.
      why_wrong: 'That would disregard the estimators’ stated basis: indirect evidence and comparisons between the test record
        and delivery-system information.'
    rejected:
      O1: The estimators did not withhold assignments because they judged that the indirect evidence and cross-source comparison
        provided a basis for the assessment.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Reliable evidence established that the deployed systems did not carry nuclear warheads.
      then: O1
      why: That evidence would directly contradict the assignment the estimators are making.
    would_not_change:
    - id: noflip1
      if: There remained no direct evidence of the actual stockpile size.
      why: The estimators reached their assessment despite that evidentiary gap, relying instead on indirect evidence.
    watch_for:
    - id: watch1
      what: Whether the comparison between the nuclear-test record and delivery-system characteristics and deployment remains
        supported.
      favors:
      - O2
      - O1
      why: The assignment rests on that comparison; evidence that undermines or strengthens it could affect the judgment.
  lesson: An absence of direct evidence does not by itself require withholding an estimate when multiple indirect sources
    provide a stated basis for judgment. Make the inference explicit, preserve the distinction between assessment and observation,
    and keep uncertainty visible.
  limits: This reasoning addresses an intelligence estimate of warhead assignments, not a decision about weapons development
    or use. It does not establish that indirect evidence is sufficient in other cases or prescribe a confidence level.
  library:
    domain: intel-analysis
    family: CORPUS-NX-e2fdd966
    source: https://nsarchive2.gwu.edu/NSAEBB/NSAEBB534-DIA-Declassified-Sourcebook/documents/DIA-17.pdf
