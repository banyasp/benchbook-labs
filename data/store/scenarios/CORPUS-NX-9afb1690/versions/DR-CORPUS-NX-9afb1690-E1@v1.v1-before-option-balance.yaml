case:
  id: DR-CORPUS-NX-9afb1690-E1@v1
  title: The MA Launch Decision
  status: draft
  setting: GRDCS facility, 17 July 2013, unmanned-aircraft operation
  decider: The MC
  agent: The MC
  agent_role: decide
  situation: On 17 July 2013, the MC was preparing for the MA's launch as the second unmanned aircraft in the sequence. The
    first aircraft had launched normally at approximately 13:22Z. Both unmanned aircraft had passed preflight checklists,
    and all aircrew had received NOTAMs. Before the MA launch, the MC reviewed ATO information displayed on the GRDCS control
    panel, which showed no malfunctions. The available courses were to proceed with the launch or delay or abort it.
  question: 'What should the MC do about the MA launch: approve it or reject it?'
  options:
    O1:
      do: The MC should reject the MA's launch.
      move: act
      irreversible: false
    O2:
      do: The MC should approve the MA's launch.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The operation took place on 17 July 2013.
  - id: F2
    kind: situation
    status: confirmed
    fact: The first unmanned aircraft launched normally at approximately 13:22Z.
  - id: F3
    kind: situation
    status: confirmed
    fact: The MA was second in the launch sequence.
  - id: F4
    kind: situation
    status: confirmed
    fact: Both unmanned aircraft passed their preflight checklists.
  - id: F5
    kind: situation
    status: confirmed
    fact: All aircrew received the NOTAMs.
  - id: F6
    kind: situation
    status: confirmed
    fact: Before the MA launch, the MC reviewed ATO information displayed on the GRDCS control panel.
  - id: F7
    kind: situation
    status: confirmed
    fact: The displayed ATO information showed no malfunctions.
  considerations:
  - id: C1
    facts:
    - F4
    equity: policy_compliance
    favors:
    - O2
    weight: weak
    why: Both aircraft passed their preflight checklists, a readiness indicator consistent with proceeding; the passage does
      not say that passing the checks ruled out every possible fault.
  - id: C2
    facts:
    - F6
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The MC reviewed the displayed ATO information and it showed no malfunctions. This supports the recorded decision
      to proceed, but is not evidence that the display could reveal every possible problem.
  - id: C3
    facts:
    - F5
    equity: policy_compliance
    favors:
    - O2
    weight: weak
    why: All aircrew received the NOTAMs, an indication that the notices were distributed; their contents are not provided,
      so receipt alone does not establish whether they affected the launch decision.
  - id: C4
    facts:
    - F2
    - F3
    equity: mission_effect
    favors: []
    weight: weak
    why: The first aircraft launched normally and the MA was second. These are sequence facts, not evidence that the MA itself
      was free of faults or a stated reason to approve its launch.
  reasoning:
    read: 'At the decision point, the MC had favorable readiness indicators: the checklists were passed and the reviewed display
      showed no malfunctions. The trap is to treat those indicators—or the first aircraft''s normal launch—as proof that the
      MA could not have a problem; the passage does not establish that.'
    weighing: The available facts support the MC's recorded choice to proceed, particularly the passed checks and the display
      showing no malfunctions {C1} {C2}. NOTAM receipt adds context but their contents are unavailable {C3}; the first aircraft's
      normal launch does not validate the MA {C4}. On this limited record, approve the launch, while recognizing that a known
      relevant hazard or contrary indication would change the balance.
    tradecraft: Before acting, confirm that the available readiness information and notices have been considered, and record
      the basis for proceeding. If a relevant fault or hazard is identified, pause and reassess rather than treating earlier
      favorable indicators as conclusive.
    uncertainty: The passage records readiness facts and the MC's action, but does not state an explicit risk assessment,
      the contents of the NOTAMs, or a separate finding that proceeding was the correct choice. The recommendation therefore
      rests on the limited information in the decision frame, not on a claim that the launch was risk-free.
    handoff: The MC is the decider in this scenario. If a relevant hazard or conflicting information appears, involve the
      appropriate responsible authority before proceeding; the passage does not identify a required additional decision-maker.
    tempting_wrong:
      option: O1
      pull: Delay or abort because favorable checks and a clear display cannot guarantee that no fault exists.
      why_wrong: The supplied decision-point facts identify no malfunction or specific launch hazard; rejecting the launch
        solely because certainty is impossible would go beyond the reasons recorded.
    rejected:
      O1: Rejecting the launch was not chosen because the available checks and reviewed display showed no identified malfunction
        or specific reason to delay.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The MC's review or a checklist identified a relevant malfunction before launch.
      then: O1
      why: A known fault would undermine the favorable readiness basis for proceeding.
    - id: flip2
      if: A NOTAM contained a hazard relevant to the MA's launch.
      then: O1
      why: A relevant known hazard would outweigh the fact that the notices had merely been received.
    would_not_change:
    - id: noflip1
      if: The first aircraft had launched normally, without any additional information about the MA.
      why: That fact alone does not establish that the MA was free of faults.
    watch_for:
    - id: watch1
      what: Any newly identified fault or notice that presents a hazard relevant to the launch.
      favors:
      - O1
      why: Such information would weaken or displace the favorable readiness indicators.
  lesson: Use passed checks and a clear displayed status as evidence for a decision, not as proof that no risk exists. Reassess
    if specific contrary information or a relevant hazard is known; do not treat another aircraft's normal launch as validation
    of this one.
  limits: The source excerpt records the MC's action and the information available but gives no explicit evaluative finding
    that approval was the correct choice. This reasoning applies only to the stated prelaunch decision and does not assess
    later events or emergency actions.
