case:
  id: DR-CORPUS-NS-7a479dd0-E8@v1
  title: Whether and When to Engage
  status: draft
  setting: Fort King Road, Florida, night of 27 December 1835; Seminole leadership
  decider: The senior Seminole chief
  agent: The senior Seminole chief
  agent_role: decide
  situation: On the night of 27 December 1835, Seminole leadership faced a decision about whether and when to engage soldiers
    moving toward Fort King. The leaders had wanted to act earlier but waited for the senior chief to be present. The senior
    chief was now present, yet urged caution and delay. Other leaders challenged his hesitation and pressed for action. They
    believed that waiting could allow the opportunity to pass.
  question: What should the senior Seminole chief do about whether and when the Seminole leadership engages the approaching
    soldiers?
  options:
    O1:
      do: The Seminole leadership disengages from the planned engagement on 27 December 1835.
      move: act
      irreversible: true
    O2:
      do: The Seminole leadership delays engagement with the soldiers on 27 December 1835.
      move: hold
      irreversible: false
    O3:
      do: The Seminole leadership engages the soldiers on 27 December 1835.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision arose on the night of 27 December 1835 as soldiers approached Fort King.
  - id: F2
    kind: situation
    status: assessed
    fact: Seminole leaders had wanted to engage the soldiers earlier but waited for a senior chief to be present.
  - id: F3
    kind: situation
    status: confirmed
    fact: The senior chief was present by the time the decision arose.
  - id: F4
    kind: situation
    status: assessed
    fact: The senior chief hesitated and urged caution and inaction.
  - id: F5
    kind: situation
    status: assessed
    fact: Other leaders challenged the senior chief's hesitation and urged action.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The leaders believed that waiting longer could allow the opportunity to pass.
  considerations:
  - id: C1
    facts:
    - F2
    - F6
    equity: tempo
    favors:
    - O3
    weight: strong
    why: The leaders had already waited for senior leadership, and believed further delay could let the opportunity pass.
  - id: C2
    facts:
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: The senior chief urged caution and inaction. No specific reason for that caution is given, so its bearing on personnel
      safety is unclear.
  - id: C3
    facts:
    - F3
    - F5
    equity: chain_of_command
    favors:
    - O2
    weight: weak
    why: The senior chief was present but was challenged and pressed by other leaders. His yielding to that pressure is a
      poor substitute for a reasoned decision.
  reasoning:
    read: This was a time-sensitive decision made after the leadership had waited for senior leadership to be present. The
      trap is treating the perceived risk of a lost opportunity—or pressure from other leaders—as proof that acting now is
      sound.
    weighing: The leaders believed the favorable moment would pass if they waited longer, after having already delayed until
      the senior chief was present {C1}. Against this, the senior chief urged caution, and he ultimately agreed to act after
      other leaders challenged and pressed him {C2} {C3}. The balance favors engaging given the leaders' stated timing concern,
      but depends on that assessment being credible rather than merely asserted under pressure.
    tradecraft: The senior chief should state the timing assessment and the reasons for caution distinctly, hear the other
      leaders' views, and record the decision and any unresolved disagreement. This is decision practice, not a judgment about
      the engagement's tactics.
    uncertainty: The account does not explain the senior chief's reasons for caution or establish how likely it was that the
      opportunity would pass. It records the leaders' belief about timing, not independent confirmation of it.
    handoff: The senior chief should make the decision after consulting the other leaders, because this is a leadership decision
      with recorded disagreement. Consultation should inform the judgment, not turn pressure from others into its substitute.
    tempting_wrong:
      option: O2
      pull: The senior chief urged caution, and delaying would preserve the possibility of reconsidering.
      why_wrong: The leaders believed further delay risked losing the opportunity, and they had already waited for senior
        leadership to be present.
    rejected:
      O1: Disengaging was not chosen because the leaders believed the opportunity to engage could pass; no reason to abandon
        the planned engagement altogether is given.
      O2: Further delay was not chosen because the leaders believed the favorable moment would pass, though the senior chief
        urged caution.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The timing assessment were no longer credible and there were no reason to believe further delay would lose the opportunity.
      then: O2
      why: The main stated reason for acting is the belief that the favorable moment would pass; without that urgency, the
        senior chief's caution would weigh more heavily.
    - id: flip2
      if: The senior chief were not present to make the decision.
      then: O2
      why: The leaders had previously waited for senior leadership to be present, so its absence would undermine the stated
        basis for proceeding at that decision point.
    would_not_change:
    - id: noflip1
      if: The junior leaders continued to press for action without providing a stronger basis for the timing assessment.
      why: Pressure alone would not resolve the uncertainty about whether the opportunity was actually passing; the decision
        should still turn on the timing assessment and the senior chief's judgment.
    watch_for:
    - id: watch1
      what: Whether the belief that delay would cause the opportunity to pass is supported by information beyond the leaders'
        expressed concern.
      favors:
      - O3
      - O2
      why: The decision turns substantially on the credibility of that time-sensitive assessment.
  lesson: When leaders believe an opportunity is time-limited, distinguish that assessment from urgency created by internal
    pressure. Proceed only when the timing judgment, rather than pressure alone, supports acting now.
  limits: The account gives little explanation for the senior chief's caution and does not establish a legal standard or assess
    the engagement's broader consequences. This reasoning addresses only whether and when to engage, not how an engagement
    should be conducted.
