case:
  id: DR-CORPUS-NS-7a479dd0-E9@v1
  title: Holding After Severe Losses
  status: draft
  setting: Fort King Road, during the Seminole engagement, United States Army.
  decider: The captain
  agent: The captain
  agent_role: decide
  situation: After the major was killed, command returned to the captain, who held the final decision. Half of the United
    States Army force was out of the fight, and the Seminole force outnumbered the survivors. The soldiers were surrounded
    at their position. Many soldiers were wounded, few able-bodied survivors remained, and Fort Brooke and Fort King were
    far away. Reaching friendly forces required passing through enemy positions into exposed ground, while a withdrawal into
    the other available terrain was regarded by the soldiers as vulnerable to ambush. The artillery could not be used effectively
    while moving.
  question: 'What should the captain do after severe losses: stay at the position, leave with the force and wounded, or leave
    the wounded and withdraw able-bodied survivors?'
  options:
    O1:
      do: The captain leaves the position and withdraws the force with the wounded.
      move: act
      irreversible: true
    O2:
      do: The captain stays at the position and continues fighting with the force.
      move: act
      irreversible: true
    O3:
      do: The captain leaves the wounded and withdraws the able-bodied survivors.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: Command returned to the captain after the major was killed in the opening salvo, and the captain made the final
      decisions.
  - id: F2
    kind: situation
    status: confirmed
    fact: Half of the United States Army force was out of the fight in the first volley.
  - id: F3
    kind: situation
    status: confirmed
    fact: The United States force was outnumbered.
  - id: F4
    kind: situation
    status: confirmed
    fact: The Seminoles surrounded the soldiers at their position.
  - id: F5
    kind: situation
    status: assessed
    fact: The captain considered that the wounded could not be left in the Seminoles' hands.
  - id: F6
    kind: situation
    status: confirmed
    fact: Fort Brooke and Fort King were far away, and transporting many wounded would fall to few able-bodied survivors.
  - id: F7
    kind: situation
    status: assessed
    fact: Reaching friendly forces required passing through enemy positions into more open ground watched by a mounted enemy
      force.
  - id: F8
    kind: situation
    status: assessed
    fact: The soldiers regarded withdrawal into swamp terrain as vulnerable to ambush, and the Seminoles knew that terrain
      better.
  - id: F9
    kind: capability
    status: confirmed
    fact: The artillery could not be used effectively while maneuvering.
  considerations:
  - id: C1
    facts:
    - F5
    - F6
    equity: duty_to_individual
    favors:
    - O2
    weight: strong
    why: The captain considered that the wounded could not be left to the Seminoles, while the distant forts and few able-bodied
      survivors made transporting many wounded impracticable. He decided to remain rather than abandon them.
  - id: C2
    facts:
    - F7
    - F8
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Reaching friendly forces meant passing through enemy positions into exposed ground; withdrawal into the other available
      terrain was regarded as especially vulnerable to ambush, and the enemy knew that terrain better.
  - id: C3
    facts:
    - F9
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: The captain could not use the artillery effectively while maneuvering, and it had helped keep the soldiers alive.
      This made remaining with it part of the captain's stated rationale.
  - id: C4
    facts:
    - F2
    - F3
    - F4
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: Half the force was out of the fight, the survivors were outnumbered, and they were surrounded. The captain nevertheless
      chose to hold and fight rather than attempt a withdrawal under the described constraints.
  reasoning:
    read: This was a severely depleted, outnumbered force surrounded at its position, with wounded soldiers, few able-bodied
      survivors, and no evidently safe or practical withdrawal. The trap in treating withdrawal as the obviously safer choice
      is that either route carried serious danger, while leaving the wounded was unacceptable to the captain.
    weighing: 'The captain''s stated balance favored staying: the wounded could not be left to the enemy, moving them to distant
      forts was impracticable for the few able-bodied survivors, routes to friendly forces were dangerous, and the artillery
      could not be used effectively while maneuvering. The decision depended on those assessments of the wounded''s vulnerability
      and the risks and limits of movement; holding was not safe or guaranteed to succeed.'
    tradecraft: For a comparable decision, record who holds command, the available courses, the condition of the wounded,
      the feasibility of moving them, and the uncertainties behind any assessment of withdrawal risk. Keep the decision record
      focused on those grounds rather than on execution details.
    uncertainty: The concerns about the wounded and the risks of the available withdrawal routes are assessments, not quantified
      probabilities. There is no basis here for comparing precise casualty likelihoods or claiming that staying would ensure
      survival.
    handoff: The captain held command and made the final decision; no required referral or approval by another authority is
      identified. If time and circumstances allowed, consulting those responsible for the wounded or with relevant knowledge
      of the withdrawal options could inform the decision, but that is a procedural synthesis rather than a stated step.
    tempting_wrong:
      option: O3
      pull: Leaving the wounded and withdrawing the able-bodied survivors might appear to preserve some of the force.
      why_wrong: The captain specifically considered that the wounded could not be left to the Seminoles, and no safe alternative
        protection for them is identified.
    rejected:
      O1: The captain did not choose to withdraw with the wounded because the forts were far away, few able-bodied survivors
        remained to transport them, and reaching friendly forces required a dangerous passage through enemy positions.
      O3: The captain did not choose to abandon the wounded because he considered that they could not be left in the Seminoles'
        hands.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The wounded could be transported and a route to friendly forces were no longer assessed as dangerously exposed.
      then: O1
      why: Removing the captain's stated obstacles to evacuation could make leaving with the force and wounded preferable
        to remaining.
    - id: flip2
      if: The wounded were no longer at risk of being left to the enemy, and withdrawal of the able-bodied survivors were
        feasible.
      then: O3
      why: That would remove the captain's stated objection to leaving the wounded while making withdrawal more practicable.
    would_not_change:
    - id: noflip1
      if: The artillery could be used effectively while moving, but the risks to the wounded and the dangers of the withdrawal
        routes remained as described.
      why: Improved artillery mobility alone would not resolve the captain's central concerns about abandoning the wounded
        or the hazards of withdrawal.
    watch_for:
    - id: watch1
      what: Reliable new information that the wounded could be moved and that a route to friendly forces was not exposed to
        the described enemy threat.
      favors:
      - O1
      why: Those are the principal constraints the captain cited against withdrawing with the wounded.
  lesson: When a force is severely depleted, do not assume withdrawal is safer merely because holding is dangerous; weigh
    the actual risks and feasibility of each course. The welfare of wounded personnel and the danger of abandoning them can
    be decisive, but the balance may change if evacuation becomes practicable and safer.
  limits: This reasoning applies to the circumstances described, especially the captain's assessments of the wounded's vulnerability,
    distance, and withdrawal risks. It does not establish a general rule to hold a position, and it offers no guarantee of
    the outcome.
