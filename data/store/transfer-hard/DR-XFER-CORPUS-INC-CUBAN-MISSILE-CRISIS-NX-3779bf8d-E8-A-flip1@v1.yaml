case:
  id: DR-XFER-CORPUS-INC-CUBAN-MISSILE-CRISIS-NX-3779bf8d-E8-A-flip1@v1
  title: Adversary Access in a Neighbor's Grid
  status: draft
  setting: A neighboring partner country, 2028 grid-security crisis, presidential policy meeting
  decider: The President
  agent: The President
  agent_role: decide
  situation: A rival has placed disruptive access in a neighboring partner's power grid, and its military operators are based
    at staffed facilities inside the partner country. The administration sees no prospect of the rival withdrawing the access.
    Advisers assess that offensive action could prompt the rival to use the access and retaliate elsewhere, while the President
    regards doing nothing as a serious mistake. A proposed gateway blockade would initially be limited to traffic tied to
    the operation, but its legal basis without the partner regulator's consent is questioned. Credible new information establishes
    that the immediate threat from the access could not be contained by the gateway blockade and that delay would make later
    action materially more dangerous to U.S. personnel. A senator argues that delay would let the rival harden its position,
    and the affected grid is not electrically interconnected with the United States grid.
  question: What should the President do about the rival's disruptive access in the neighboring partner's power grid?
  options:
    O1:
      do: The President imposes a gateway blockade limited to traffic tied to the operation and declines a broad offensive
        campaign and targeted action against the operators' facilities.
      move: act
      irreversible: false
    O2:
      do: The President authorizes targeted action against the operators' facilities and declines a broad offensive campaign
        and a gateway blockade.
      move: act
      irreversible: true
    O3:
      do: The President orders a broad offensive campaign against the rival's access and declines a gateway blockade and targeted
        action against the operators' facilities.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Rival military operators have placed disruptive access in the neighboring partner's power grid.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The rival's operators are based at staffed facilities inside the partner country.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The administration assesses that the rival is not expected to withdraw the access.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Advisers assess that offensive action could lead the rival to use the access and retaliate elsewhere.
  - id: F5
    kind: situation
    status: assessed
    fact: The President regards doing nothing as a serious mistake.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposed gateway blockade would initially be limited to traffic tied to the operation.
  - id: F7
    kind: situation
    status: assessed
    fact: A senator argues that delay would let the rival harden its position.
  - id: F8
    kind: authority
    status: assessed
    fact: The President assesses that the gateway blockade probably lacks a legal basis without the partner regulator's consent.
  - id: F9
    kind: situation
    status: confirmed
    fact: The affected partner grid is not electrically interconnected with the United States grid.
  - id: F10
    kind: intelligence
    status: assessed
    fact: Credible new information establishes that the immediate threat from the access could not be contained by the gateway
      blockade and that delay would make later action materially more dangerous to U.S. personnel.
  considerations:
  - id: C1
    facts:
    - F4
    - F2
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Advisers assess that offensive action could lead the rival to use the access and retaliate elsewhere. Action against
      facilities staffed by the rival's operators is considered more provocative than a gateway blockade, supporting the blockade
      over a broad campaign or targeted action.
  - id: C2
    facts:
    - F3
    - F5
    - F10
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The rival is not expected to withdraw the access, and the President regards doing nothing as a serious mistake. Credible
      new information establishes that the gateway blockade cannot contain the immediate threat and that delay would make
      later action materially more dangerous to U.S. personnel, weighing against the blockade and in favor of prompt targeted
      action rather than inaction or a broad campaign.
  - id: C3
    facts:
    - F6
    - F8
    equity: lawful_authority
    favors: []
    weight: weak
    why: The gateway blockade would initially be limited to traffic tied to the operation, but the President assesses that
      it probably lacks a legal basis without the partner regulator's consent. This weighs against treating the blockade as
      legally settled, though the record does not establish that either offensive alternative would be legally preferable.
  - id: C4
    facts:
    - F7
    - F10
    equity: tempo
    favors:
    - O2
    weight: strong
    why: A senator argues that delay would let the rival harden its position. Credible new information independently establishes
      that delay would make later action materially more dangerous to U.S. personnel, making prompt targeted action more compelling
      while not supporting a broad campaign.
  reasoning:
    read: 'The choice is not between a risk-free gateway blockade and risky force: the President sees risk in every course,
      including doing nothing. The gateway blockade carries a serious legal concern, and credible new information establishes
      that it cannot contain the immediate threat and that delay would make later action materially more dangerous to U.S.
      personnel. The trap is to let escalation risk alone settle the choice when delay also carries a substantial, immediate
      cost.'
    weighing: The balance favors targeted action. Withdrawal is not expected and inaction is judged a serious mistake; more
      importantly, credible new information establishes that the gateway blockade cannot contain the immediate threat and
      that delay would make later action materially more dangerous to U.S. personnel. The risk that offensive action could
      prompt the rival to use the access and retaliate elsewhere remains serious, and action against facilities staffed by
      rival operators could be more provocative than a gateway confrontation. Those risks weigh against force, but the new
      information makes the blockade inadequate and delay materially more dangerous, supporting targeted action rather than
      a broad campaign. The blockade's legality without the partner regulator's consent remains unresolved.
    tradecraft: State the choice, the acknowledged legal uncertainty, and the comparative risks of retaliation, escalation,
      and delay clearly. Keep the decision under presidential authority, seek the relevant legal and partner-regulator views,
      and revisit the balance if the assessed threat or escalation risks materially change; do not treat the decision as a
      finding that the blockade is lawful without the regulator's consent.
    uncertainty: The administration does not know how the rival will react, and the assessment of its intentions includes
      uncertainty. The likely use of the access and retaliation elsewhere are risks, not certainties. Credible new information
      establishes that the gateway blockade cannot contain the immediate threat and that delay would make later action materially
      more dangerous to U.S. personnel. The legality of proceeding without the partner regulator's consent is also expressly
      questioned.
    handoff: The President makes the choice, informed by administration advisers and relevant legal advice; the partner regulator's
      consent bears on the legal concern.
    tempting_wrong:
      option: O3
      pull: The senator's argument that delay lets the rival harden its position, reinforced by the new information about
        the danger of delay, makes a broad offensive campaign seem like the fastest way to respond.
      why_wrong: The President's assessment is that offensive action could prompt the rival to use the access and retaliate
        elsewhere, and that acting against facilities staffed by rival operators would be more provocative than a gateway
        confrontation. The new information supports prompt action, but does not establish that a broad campaign is necessary;
        targeted action responds to the danger of delay without choosing the broader course.
    rejected:
      O1: The President does not choose the gateway blockade because credible new information establishes that it cannot contain
        the immediate threat and that delay would make later action materially more dangerous to U.S. personnel. Its questioned
        legal basis is an additional concern.
      O3: The President does not choose a broad offensive campaign because it could prompt the rival to use the access and
        retaliate elsewhere, with action against staffed facilities adding escalation risk. The new information supports prompt
        targeted action, not a broad campaign.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The credible information did not establish that the immediate threat could not be contained by the gateway blockade
        or that delay would make later action materially more dangerous to U.S. personnel.
      then: O1
      why: 'Without those findings, the original balance would again favor the gateway blockade: withdrawal is not expected
        and inaction is judged a serious mistake, while the escalation risks of action against staffed facilities remain.'
    would_not_change:
    - id: noflip1
      if: The partner regulator did not consent to the gateway blockade.
      why: The President assesses that the blockade probably lacks a legal basis without that consent, but the legal concern
        alone does not settle the comparison among the available courses.
    - id: noflip2
      if: The choice continued to involve substantial risks in every available course.
      why: The President recognizes that every course involves risk but still judges that doing nothing would be a serious
        mistake.
    watch_for:
    - id: watch1
      what: Evidence that the rival is intensifying the situation or that retaliation elsewhere is becoming more likely.
      favors:
      - O1
      - O3
      why: Such developments could change the comparative risks and require the President to reassess whether targeted action
        remains preferable; they do not by themselves establish that either the gateway blockade or a broad campaign is preferable.
  lesson: When every available course carries risk, compare the likely escalation and retaliation consequences of each option
    with the consequences of delay. A less escalatory course may be inadequate when credible information shows that it cannot
    contain the immediate threat and that delay would materially increase danger to U.S. personnel. A legal objection to an
    alternative should also be stated and weighed rather than assumed away.
  limits: This reasoning reflects the President's assessments at this decision point, including uncertainty about the rival's
    intentions, the newly established limits of the gateway blockade, and the questioned legal basis for a blockade without
    partner-regulator consent. It does not establish a general legal rule for blockades or determine what later developments
    would warrant offensive action.
