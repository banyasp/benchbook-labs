case:
  id: DR-XFER-CORPUS-INC-CUBAN-MISSILE-CRISIS-NX-3779bf8d-E8-A@v1
  title: Adversary Access in a Neighbor's Grid
  status: draft
  setting: A neighboring partner country, 2028 grid-security crisis, presidential policy meeting
  decider: The President
  agent: The President
  agent_role: decide
  situation: A rival has placed disruptive access in a neighboring partner's power grid, and its military operators are based
    at staffed facilities inside the partner country. The administration sees no prospect of the rival withdrawing the access.
    Advisers assess that offensive action could prompt the rival to use the access and retaliate elsewhere, while the President
    regards doing nothing as a serious mistake. A proposed gateway blockade would initially be limited to traffic tied to
    the operation, but its legal basis without the partner regulator's consent is questioned. A senator argues that delay
    would let the rival harden its position, and the affected grid is not electrically interconnected with the United States
    grid.
  question: What should the President do about the rival's disruptive access in the neighboring partner's power grid?
  options:
    O1:
      do: The President imposes a gateway blockade limited to traffic tied to the operation and declines a broad offensive
        campaign and targeted action against the operators' facilities.
      move: act
      irreversible: false
    O2:
      do: The President authorizes targeted action against the operators' facilities and declines a broad offensive campaign
        and a gateway blockade.
      move: act
      irreversible: true
    O3:
      do: The President orders a broad offensive campaign against the rival's access and declines a gateway blockade and targeted
        action against the operators' facilities.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Rival military operators have placed disruptive access in the neighboring partner's power grid.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The rival's operators are based at staffed facilities inside the partner country.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The administration assesses that the rival is not expected to withdraw the access.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Advisers assess that offensive action could lead the rival to use the access and retaliate elsewhere.
  - id: F5
    kind: situation
    status: assessed
    fact: The President regards doing nothing as a serious mistake.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposed gateway blockade would initially be limited to traffic tied to the operation.
  - id: F7
    kind: situation
    status: assessed
    fact: A senator argues that delay would let the rival harden its position.
  - id: F8
    kind: authority
    status: assessed
    fact: The President assesses that the gateway blockade probably lacks a legal basis without the partner regulator's consent.
  - id: F9
    kind: situation
    status: confirmed
    fact: The affected partner grid is not electrically interconnected with the United States grid.
  considerations:
  - id: C1
    facts:
    - F4
    - F2
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: Advisers assess that offensive action could lead the rival to use the access and retaliate elsewhere. Action against
      facilities staffed by the rival's operators is considered more provocative than a gateway blockade, supporting the blockade
      over a broad campaign or targeted action.
  - id: C2
    facts:
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The rival is not expected to withdraw the access, and the President considers doing nothing a serious mistake. The
      gateway blockade is an affirmative response that leaves room to pause rather than immediately choosing direct offensive
      action.
  - id: C3
    facts:
    - F6
    - F8
    equity: lawful_authority
    favors: []
    weight: weak
    why: The gateway blockade would initially be limited to traffic tied to the operation, but the President assesses that
      it probably lacks a legal basis without the partner regulator's consent. This weighs against treating the blockade as
      legally settled, though the record does not establish that either offensive alternative would be legally preferable.
  - id: C4
    facts:
    - F7
    equity: tempo
    favors:
    - O3
    - O2
    weight: weak
    why: A senator argues that delay would let the rival harden its position, pressing for stronger action. This is a genuine
      counterargument for a broad campaign or targeted action, not the President's adopted judgment.
  reasoning:
    read: 'The choice is not between a risk-free gateway blockade and risky force: the President sees risk in every course,
      including doing nothing. The trap is to let urgency alone settle the choice; offensive action could prompt the rival
      to use the access and retaliate elsewhere, while the gateway blockade itself carries a serious legal concern.'
    weighing: The balance favors the gateway blockade because withdrawal is not expected and inaction is judged a serious
      mistake, while action against facilities staffed by rival operators could be more provocative than a gateway confrontation.
      The senator's case that delay lets the rival harden its position remains a real competing view. The balance depends
      on the assessment of the rival's intentions and the relative escalation risk, and it does not resolve the blockade's
      legality without the partner regulator's consent.
    tradecraft: State the choice, the acknowledged legal uncertainty, and the comparative risks of retaliation and escalation
      clearly. Keep the decision under presidential authority, seek the relevant legal and partner-regulator views, and revisit
      the balance if the assessed threat or escalation risks materially change; do not treat the decision as a finding that
      the blockade is lawful without the regulator's consent.
    uncertainty: The administration does not know how the rival will react, and the assessment of its intentions includes
      uncertainty. The likely use of the access and retaliation elsewhere are risks, not certainties; the legality of proceeding
      without the partner regulator's consent is also expressly questioned.
    handoff: The President makes the choice, informed by administration advisers and relevant legal advice; the partner regulator's
      consent bears on the legal concern.
    tempting_wrong:
      option: O3
      pull: The senator's argument that delay lets the rival harden its position makes a broad offensive campaign seem like
        a way to avoid losing time.
      why_wrong: The President's assessment is that offensive action could prompt the rival to use the access and retaliate
        elsewhere, and that acting against facilities staffed by rival operators would be more provocative than a gateway
        confrontation, increasing the risk of escalation.
    rejected:
      O3: The President does not choose a broad offensive campaign because it could prompt the rival to use the access and
        retaliate elsewhere, with action against staffed facilities adding escalation risk.
      O2: The President does not choose targeted action because facilities staffed by the rival's operators are judged more
        provocative to act against than a gateway confrontation.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible new information established that the immediate threat from the access could not be contained by the gateway
        blockade and that delay would make later action materially more dangerous to U.S. personnel.
      then: O2
      why: That would strengthen the senator's stated case for prompt action, though the President's concerns about retaliation
        and escalation would still need to be weighed.
    - id: flip2
      if: Reliable evidence established that the rival's operators were not at the facilities and that targeted action there
        would not carry the escalation risk the President identified.
      then: O2
      why: The President treats the presence of rival operators as a reason action against the facilities would be especially
        provocative; removing that concern could alter the comparison, without resolving other risks.
    would_not_change:
    - id: noflip1
      if: The partner regulator did not consent to the gateway blockade.
      why: The President assesses that the blockade probably lacks a legal basis without that consent, but the legal concern
        alone does not settle the comparison among the available courses.
    - id: noflip2
      if: The choice continued to involve substantial risks in every available course.
      why: The President recognizes that every course involves risk but still judges that doing nothing would be a serious
        mistake.
    watch_for:
    - id: watch1
      what: Evidence that the rival is intensifying the situation or that retaliation elsewhere is becoming more likely.
      favors:
      - O1
      - O3
      why: Such developments could change the comparative risks and require the President to reassess whether the gateway
        blockade remains adequate; they do not by themselves establish that offensive action is preferable.
  lesson: When every available course carries risk, compare the likely escalation and retaliation consequences of each option
    rather than treating urgency as sufficient reason for immediate offensive action. A less escalatory course may still carry
    a serious legal objection, which must be stated and weighed rather than assumed away.
  limits: This reasoning reflects the President's assessments at this decision point, including uncertainty about the rival's
    intentions and the questioned legal basis for a gateway blockade without partner-regulator consent. It does not establish
    a general legal rule for such blockades or determine what later developments would warrant offensive action.
