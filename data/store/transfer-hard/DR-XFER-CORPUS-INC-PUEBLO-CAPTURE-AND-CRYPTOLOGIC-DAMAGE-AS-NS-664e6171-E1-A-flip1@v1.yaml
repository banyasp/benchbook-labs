case:
  id: DR-XFER-CORPUS-INC-PUEBLO-CAPTURE-AND-CRYPTOLOGIC-DAMAGE-AS-NS-664e6171-E1-A-flip1@v1
  title: An Embassy's Classified Holdings
  status: draft
  setting: Lydora, September 2024; Embassy of Norvale and Norvale Ministry of Foreign Affairs.
  decider: Regional Security Officer
  agent: Regional Security Officer
  agent_role: decide
  situation: Security conditions in Lydora's capital are deteriorating, and the embassy is continuing its work at post. The
    country team regards the post's current work as sensitive. Headquarters has asked posts to minimize holdings that could
    be compromised if a compound were overrun. The embassy holds classified material and secure terminals for its work. The
    Regional Security Officer no longer considers any of the embassy's holdings essential for secure communications with headquarters.
    The officer must decide how much classified material and how many secure terminals will remain at the embassy.
  question: What should the Regional Security Officer do with the embassy's classified holdings and secure terminals while
    the post remains open?
  options:
    O1:
      do: The Regional Security Officer directs removing all classified holdings and secure terminals from the post.
      move: act
      irreversible: false
    O2:
      do: The Regional Security Officer directs removing selected classified holdings and secure terminals from the post while
        retaining a limited set.
      move: act
      irreversible: false
    O3:
      do: The Regional Security Officer directs retaining all classified holdings and secure terminals at the post.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Security conditions in Lydora's capital are deteriorating, and the embassy is continuing its work at post.
  - id: F2
    kind: situation
    status: confirmed
    fact: The embassy's holdings include classified material and secure terminals.
  - id: F3
    kind: situation
    status: confirmed
    fact: The holdings also include classified reference publications supporting the post's work.
  - id: F4
    kind: situation
    status: assessed
    fact: The country team regards the post's current work as sensitive.
  - id: F5
    kind: situation
    status: assessed
    fact: The Regional Security Officer no longer considers any of the embassy's holdings essential for secure communications
      with headquarters.
  - id: F6
    kind: authority
    status: confirmed
    fact: Headquarters has asked posts to minimize holdings that could be compromised if a compound were overrun.
  considerations:
  - id: C1
    facts:
    - F4
    equity: security_risk
    favors:
    - O2
    - O1
    weight: strong
    why: The assessed sensitivity of the post's work supports reducing the classified holdings kept there.
  - id: C2
    facts:
    - F6
    equity: source_protection
    favors:
    - O2
    - O1
    weight: strong
    why: Headquarters has asked the post to minimize holdings that could be compromised in an overrun.
  - id: C3
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: No holdings are considered essential for secure communications, so this consideration provides no stated reason to
      retain even a limited set.
  reasoning:
    read: 'This is a holdings decision balancing secure communications against the risk of classified material being compromised
      if the compound is overrun. The trap is treating either concern as absolute: retaining everything or a limited set could
      disregard the request to minimize what could be compromised, while removing everything would be harder to justify if
      some holdings were essential. Here, however, no holdings are considered essential for secure communications.'
    weighing: The sensitivity of the post's work and the request to limit holdings that could be compromised weigh against
      keeping the full set {C1} {C2}. The Regional Security Officer no longer considers any holdings essential for secure
      communications, removing the stated basis for retaining a limited set {C3}. The balance therefore favors removing all
      classified holdings and secure terminals from the post.
    tradecraft: 'Record the disposition and its rationale: remove the holdings from the post in light of the sensitivity of
      the post''s work, the request to minimize holdings that could be compromised, and the absence of any holdings considered
      essential for secure communications.'
    uncertainty: The stated reasons establish the considerations supporting removal but do not explain how each individual
      holding was assessed or specify a rule for resolving future changes in need or risk.
    handoff: The Regional Security Officer is the decision-maker. No further referral or consultation is identified as part
      of the stated rationale.
    tempting_wrong:
      option: O2
      pull: Keeping a limited set could appear to preserve some communications capacity while reducing exposure.
      why_wrong: No holdings are considered essential for secure communications, so retaining a limited set has no stated
        necessity and falls short of minimizing holdings that could be compromised.
    rejected:
      O2: Retaining a limited set was not chosen because no holdings are considered essential for secure communications, while
        the post's sensitive work and headquarters' request support minimizing holdings that could be compromised.
      O3: Keeping all holdings was not chosen because headquarters has asked posts to minimize what could be compromised in
        an overrun, and no holdings are considered essential for secure communications.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The Regional Security Officer did consider some of the embassy's holdings essential for secure communications with
        headquarters.
      then: O2
      why: A stated need to retain some holdings would restore a reason to keep a limited set while reducing exposure.
    would_not_change: []
    watch_for:
    - id: watch1
      what: A changed assessment of which holdings are essential for secure communications with headquarters.
      favors:
      - O1
      - O3
      why: A broader essential need could support retaining more, while a narrower need could support removing more.
  lesson: When classified holdings are vulnerable to compromise and none are considered essential for secure communications,
    weigh the risk and the request to minimize holdings against any operational necessity. If no such necessity remains, removing
    all holdings can best limit exposure.
  limits: This reasoning applies to the stated decision about the embassy's holdings while the post remains open and to its
    stated concerns. It does not establish a general holdings rule or resolve decisions involving different communications
    needs, risks, or authority.
