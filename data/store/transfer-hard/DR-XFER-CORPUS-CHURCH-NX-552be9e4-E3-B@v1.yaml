case:
  id: DR-XFER-CORPUS-CHURCH-NX-552be9e4-E3-B@v1
  title: Acting on Foreign-Hosted Infrastructure Without Host Consent
  status: draft
  setting: Deployed task force, third-country hosting environment, present day; the U.S. national-security cyber mission and
    approval structure.
  decider: The cyber mission-team lead on the deployed task force.
  agent: The cyber mission-team lead on the deployed task force.
  agent_role: decide
  situation: A mission team is considering action against adversary-controlled servers hosted in a third country to protect
    U.S. shipping-logistics networks. The servers are at a provider that has long accepted customers from across the market.
    Senior U.S. officials share concern about the threat, and a congressional committee has discussed it in closed session.
    The team lead's delegated authorities do not clearly establish whether the team may act against infrastructure in that
    country without host consent. The host nation's national cyber authority has objected to the team's presence.
  question: What should the mission-team lead do about acting against the foreign-hosted servers, and under what authority?
  options:
    O1:
      do: The mission-team lead authorizes action against the servers.
      move: act
      irreversible: true
    O2:
      do: The mission-team lead declines action against the servers.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The lead serves on a deployed cyber mission team within a U.S. task force.
  - id: F2
    kind: situation
    status: confirmed
    fact: The adversary-controlled servers are hosted in a third country by a provider that has long accepted customers from
      across the market.
  - id: F3
    kind: situation
    status: assessed
    fact: Protecting U.S. shipping-logistics networks is a stated rationale for considering action against the servers.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Senior U.S. officials share concern about the threat posed by the servers.
  - id: F5
    kind: situation
    status: confirmed
    fact: The host nation's national cyber authority has objected to the team's presence.
  - id: F6
    kind: authority
    status: assessed
    fact: The lead's delegated authorities do not clearly settle whether the team may act against infrastructure in the third
      country without host consent.
  - id: F7
    kind: authority
    status: confirmed
    fact: A congressional committee discussed the threat in closed session.
  considerations:
  - id: C1
    facts:
    - F1
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The lead is a task-force representative, but the delegated authorities do not clearly establish permission to act
      against infrastructure in the third country without host consent. The lead's role and the broader mission do not by
      themselves settle the scope of that delegation.
  - id: C2
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Senior officials share the concern, and a congressional committee considered the threat in closed session. Those
      facts support considering the mission, but do not establish that this lead has authority to act.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The servers' location at a provider open to customers and the stated aim of protecting U.S. shipping-logistics networks
      provide a rationale for action, but that rationale does not itself settle whether the lead may act in the third country.
  - id: C4
    facts:
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The host nation's cyber authority has objected to the team's presence. Acting despite that objection heightens the
      risk of an unjustified intervention.
  reasoning:
    read: The decision is not simply whether protecting U.S. shipping-logistics networks is worthwhile or whether the servers
      pose a concern shared by senior officials. The trap is treating a national-level security concern and the lead's stated
      rationale as if either settled the lead's authority to act against infrastructure in a third country. The lead is acting
      within a task force and the mission has senior-level attention. Nevertheless, the present record does not clearly establish
      the lead's authority for this action.
    weighing: The shipping-logistics rationale and senior concern weigh in favor of considering action, and the closed committee
      discussion shows that the threat has received national-level attention. But those concerns are distinct from the lead's
      unclear delegation. The host authority's objection adds a separate concern about proceeding unilaterally. On this record,
      the balance favors declining action unless competent authority clearly authorizes it. The balance depends on distinguishing
      national consideration of the threat from a settled delegation to this lead.
    tradecraft: Do not authorize action on an ambiguous mandate. Refer the proposed action to the responsible U.S. decision-makers,
      seek an explicit determination of authority and purpose, and preserve a candid record of the delegation and the basis
      for the decision.
    uncertainty: The record leaves open how the lead's delegated authority might be interpreted and how far senior officials'
      concern reflects a settled policy decision. That uncertainty does not establish that the lead is authorized to act against
      infrastructure in the third country.
    handoff: The lead should not decide this alone. The matter should be referred to the responsible U.S. officials in the
      approval structure, because the delegation is unclear and the threat has received consideration at the national level.
    tempting_wrong:
      option: O1
      pull: Protecting U.S. shipping-logistics networks and addressing a threat that concerns senior officials make action
        seem protective and consistent with national interests.
      why_wrong: Those concerns do not themselves settle the lead's authority. A shared policy concern and a stated mission
        rationale are not a clear delegation to act in the third country.
    rejected:
      O1: The action is rejected under the lead's unclear delegated authority, with the host authority's objection adding
        a concern about unilateral intervention.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Competent U.S. authority issued clear, explicit authorization for action in the third country, grounded in an established
        U.S. decision about the threat and the purpose of the action.
      then: O1
      why: 'That would address the central defect in this case: the lead''s unclear authority to convert national-level concerns
        into action against infrastructure in the third country.'
    would_not_change:
    - id: noflip1
      if: The lead repeated the shipping-logistics protection rationale while the scope of delegated authorities remained
        unclear.
      why: A stated purpose alone would not resolve the authority problem or the concern about acting despite the host authority's
        objection.
    watch_for:
    - id: watch1
      what: Reliable evidence that the servers were being used to prepare a disruption of U.S. shipping-logistics networks,
        presented to the responsible U.S. decision-makers.
      favors:
      - O2
      why: A concrete threat could strengthen the case for U.S. action, though it would not by itself establish this lead's
        authority.
  lesson: A compelling national-security purpose does not itself confer authority on a mission lead to act against infrastructure
    in another country. When the delegation is unclear, separate national-level policy deliberation from the lead's delegated
    power and obtain a clear decision from the responsible authority.
  limits: This judgment concerns the proposed action under the delegation and circumstances described; it does not decide
    whether the United States could authorize action through proper channels. It is not a general rule that action to protect
    shipping-logistics networks or address a foreign cyber threat is always unjustified.
