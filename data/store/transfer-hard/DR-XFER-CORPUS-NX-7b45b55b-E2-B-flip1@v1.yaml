case:
  id: DR-XFER-CORPUS-NX-7b45b55b-E2-B-flip1@v1
  title: Where to Place the Conjunction-Warning Center
  status: draft
  setting: A current-period Department of Defense space-operations policy review, amid proposals for a collision-warning center
    at Space Command or a civil space-traffic office at the Department of Commerce.
  decider: The Deputy Secretary of Defense
  agent: The Deputy Secretary of Defense
  agent_role: decide
  situation: The Deputy Secretary of Defense is considering a proposal for a center that would issue collision warnings to
    satellite operators, organized at Space Command’s analysis squadron. An alternative would place a civil space-traffic
    office at the Department of Commerce, reflecting that congestion affects military, civil, and commercial operators. Other
    military services agree that a center is needed but expect little immediate help from a Space Command location and are
    concerned about its influence on their participation. The proposal’s sponsor favors the squadron because of its relevant
    expertise. Space Command leadership favors hosting the center on its base but assesses that it cannot be kept outside
    its chain of command or given a separate budget, leaving perceived command influence over its warnings unaddressed. Leadership
    also cautions that military-grade warning thresholds could impose costly maneuvers on commercial operators.
  question: What should the Deputy Secretary of Defense do about the proposed center’s location and organization and the assignment
    of collision-warning responsibility?
  options:
    O1:
      do: The Deputy Secretary of Defense should reject the Space Command center and pursue a civil space-traffic office at
        the Department of Commerce.
      move: act
      irreversible: false
    O2:
      do: The Deputy Secretary of Defense should approve the collision-warning center at Space Command and assign it responsibility
        for issuing warnings to satellite operators.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The initial proposal is for a collision-warning center organized as a program office at Space Command’s analysis
      squadron and reporting to the Department of Defense.
  - id: F2
    kind: situation
    status: assessed
    fact: Other military services consider a collision-warning center necessary but expect a Space Command location to offer
      little immediate help and raise concerns about interference with their participation.
  - id: F3
    kind: situation
    status: assessed
    fact: An alternate proposal places a civil space-traffic office at the Department of Commerce because orbital congestion
      affects military, civil, and commercial operators.
  - id: F4
    kind: capability
    status: assessed
    fact: The proposal’s sponsor prefers locating the center with Space Command because of the squadron’s expertise in assessing
      conjunction risks.
  - id: F5
    kind: situation
    status: assessed
    fact: Space Command leadership assesses that military-grade warning thresholds could prompt costly maneuvers by commercial
      satellite operators.
  - id: F6
    kind: situation
    status: assessed
    fact: Space Command leadership assesses that the center cannot be kept outside its chain of command or given a separate
      budget, leaving perceived command influence over its warnings unaddressed.
  - id: F7
    kind: situation
    status: assessed
    fact: Space Command leadership does not regard an informal interservice liaison model as suitable for the center, citing
      weak sensor-owner participation and the need for full commitment from contributors.
  - id: F8
    kind: situation
    status: confirmed
    fact: Military leaders have raised concerns about working relationships within the proposed center while agreeing that
      a center is needed.
  considerations:
  - id: C1
    facts:
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Military leaders raised concerns about working relationships but did not dispute the need for a collision-warning
      center.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The sponsor prefers locating the center with Space Command because of the squadron’s relevant expertise.
  - id: C3
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The center cannot be kept outside Space Command’s chain of command or given a separate budget, leaving perceived
      command influence over its warnings unaddressed.
  - id: C4
    facts:
    - F3
    - F5
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: Orbital congestion affects operators beyond the military, and military-grade warning thresholds could impose unnecessary
      maneuver costs on commercial operators.
  - id: C5
    facts:
    - F2
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: Other services expect little immediate help from a Space Command location and are concerned about interference, while
      Space Command leadership says the center needs full contributor commitment rather than an informal liaison model.
  reasoning:
    read: 'The decision is not whether collision warnings are needed: military leaders agree that they are. The difficult
      issue is whether Space Command can host and receive responsibility for the center without undermining confidence among
      participating services or imposing warning standards that are too costly for commercial operators. The proposed safeguards
      against perceived command influence cannot be achieved under the assessed arrangement.'
    weighing: The broad scope of orbital congestion and concerns about a Space Command location support the civil-office alternative
      {C4} {C5}. The sponsor favors Space Command for its expertise, and military leaders’ concerns about working relationships
      do not amount to disagreement about the need {C1} {C2}. But the center cannot be kept outside Space Command’s chain
      of command or given a separate budget, leaving perceived command influence over its warnings unaddressed {C3}. That
      strong institutional-credibility concern outweighs the reasons favoring the Space Command proposal. The Deputy Secretary
      should pursue the Commerce alternative.
    tradecraft: Record the reasons for pursuing the Commerce alternative, including the inability to provide the proposed
      safeguards against perceived command influence. Involve representatives of the organizations addressed by the decision
      in developing the civil-office arrangement, and address the need for full participant commitment and the commercial-cost
      concern.
    uncertainty: The location and responsibility assignment are clear, but the stated concerns about working relationships,
      participant commitment, and warning thresholds are not shown as resolved by the decision itself.
    handoff: The Deputy Secretary makes the organizational choice, while representatives of the organizations addressed by
      the decision should participate in developing the civil-office arrangement because the stated concerns involve their
      working relationships and commitment.
    tempting_wrong:
      option: O2
      pull: Space Command’s squadron has relevant expertise, and the military services agree that a collision-warning center
        is needed.
      why_wrong: Those reasons do not overcome the inability to keep the center outside Space Command’s chain of command or
        give it a separate budget. Without those safeguards, perceived command influence over warnings remains unaddressed.
    rejected:
      O2: The Deputy Secretary does not approve a Space Command center or assign it collision-warning responsibility, instead
        pursuing the Commerce alternative.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The center could be kept outside Space Command’s chain of command with a separate budget, addressing perceived command
        influence over its warnings.
      then: O2
      why: If the safeguards against perceived command influence could be provided, the original reasons favoring the Space
        Command arrangement—including the squadron’s relevant expertise—would again support that choice.
    would_not_change:
    - id: noflip1
      if: Military leaders continued to have concerns about working relationships while agreeing that a collision-warning
        center was needed.
      why: Those concerns are present alongside agreement about the need for a center and do not, by themselves, displace
        the reasons favoring the Space Command proposal.
    watch_for:
    - id: watch1
      what: Whether the organizations involved commit fully to the center and its charter.
      favors:
      - O2
      why: Space Command leadership says the proposed center needs full commitment from its participants.
    - id: watch2
      what: Whether the center’s warning thresholds impose unnecessary maneuver costs on commercial operators.
      favors:
      - O2
      why: Space Command leadership identifies those costs as a risk of applying military-grade thresholds to operators beyond
        the military.
  lesson: When participants agree that a capability is necessary but dispute its institutional home, weigh the host’s relevant
    expertise against risks to interservice confidence and broader applicability. If the proposed host cannot provide safeguards
    against perceived influence over its warnings, the civil alternative may be preferable.
  limits: This reasoning concerns the organizational location and assignment of a collision-warning center, not its technical
    warning methods. It does not establish that a civil arrangement is preferable where the expertise, independence safeguards,
    or participant commitment differ.
