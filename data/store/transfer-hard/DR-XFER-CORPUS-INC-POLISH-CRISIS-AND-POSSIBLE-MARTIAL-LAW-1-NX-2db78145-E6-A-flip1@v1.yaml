case:
  id: DR-XFER-CORPUS-INC-POLISH-CRISIS-AND-POSSIBLE-MARTIAL-LAW-1-NX-2db78145-E6-A-flip1@v1
  title: An Employee Nearing a Disclosure
  status: draft
  setting: A federal engineering agency, early 2025; insider-threat hub
  decider: Insider-threat hub leadership
  agent: Insider-threat hub analysts
  agent_role: decide
  situation: The insider-threat hub is reviewing a cleared engineer whose recent activity has drawn attention from security
    and management staff. Reports from the past two months describe steps toward an unauthorized disclosure, but credible
    subsequent evidence establishes that the engineer abandoned those preparations and has pursued resolution solely through
    authorized grievance or whistleblower channels. Other events have also been cited as relevant. The hub has substantial
    information about the employee’s intentions and preparations, but managers believe he knows a disclosure would be detected
    and may therefore hold back. They regard him as a loyal but dissatisfied employee who uses grievance channels, while much
    of their attention has been on the possibility of foreign recruitment. The employee’s recent grievance hearing has been
    interpreted both as a sign of mounting pressure and as a possible reason he will remain within established channels.
  question: What should the insider-threat hub analysts do in framing their assessment of whether the cleared engineer is
    likely to make an unauthorized disclosure?
  options:
    O1:
      do: The insider-threat hub analysts defer the assessment pending a review of the available evidence.
      move: hold
      irreversible: false
    O2:
      do: The insider-threat hub analysts assess an unauthorized disclosure as likely and discount continued reliance on grievance
        channels.
      move: act
      irreversible: false
    O3:
      do: The insider-threat hub analysts oppose an assessment of likely unauthorized disclosure and favor continued use of
        grievance channels.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Reports from the previous two months describe preparation by the cleared engineer to disclose controlled engineering
      material outside authorized channels.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Other recorded events during the same period have also been interpreted as pointing toward an unauthorized disclosure.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The hub’s case file contains substantial information about the engineer’s stated intentions and reported preparations.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Managers believe the engineer knows that an unauthorized disclosure would be detected and may refrain from acting
      for that reason.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The engineer’s recent grievance hearing has been read both as a source of increased pressure and as a reason he
      might continue using formal channels.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Managers tend to regard the engineer as a loyal employee who expresses dissatisfaction through grievance procedures
      and prefers authorized resolution.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The hub’s recent analytic attention has focused on the possibility of foreign recruitment rather than on an employee
      acting without foreign direction.
  - id: F8
    kind: authority
    status: confirmed
    fact: Agency personnel-security policy distinguishes protected grievance activity and authorized whistleblowing from unauthorized
      disclosure, and requires a separate basis for adverse personnel action.
  - id: F9
    kind: intelligence
    status: assessed
    fact: Credible subsequent evidence establishes that the engineer abandoned preparations for unauthorized disclosure and
      has pursued resolution solely through authorized grievance or whistleblower channels.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F9
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: Earlier reports and interpretations pointed toward disclosure, but credible subsequent evidence establishes that
      the engineer abandoned those preparations and has pursued resolution solely through authorized channels. That direct
      evidence undermines the inference that earlier preparations indicate likely action.
  - id: C2
    facts:
    - F4
    - F9
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The managers’ belief that detection risk might deter the engineer remains a reason not to infer unwillingness from
      that belief alone. However, it is less probative than the credible evidence that preparations were abandoned and authorized
      channels are being used.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: 'The grievance hearing supports different readings: one suggests increasing pressure, while another suggests the
      employee may continue using formal channels. That disagreement warrants acknowledging uncertainty, but does not outweigh
      the more direct evidence about the engineer’s subsequent conduct.'
  - id: C4
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: weak
    why: The view of the employee as a loyal grievance-raiser and the focus on possible foreign recruitment could still obscure
      the possibility of action without foreign direction. But the assessment need not rely on those frames to conclude that
      disclosure is unlikely, given the credible evidence of abandoned preparations and continued use of authorized channels.
  reasoning:
    read: The central issue is how to weigh earlier indications of preparation against credible subsequent evidence that the
      engineer abandoned those preparations and is pursuing resolution solely through authorized channels. The assessment
      should not treat either a loyal-employee narrative or doubts about detection risk as a substitute for weighing that
      evidence.
    weighing: Earlier reports and events pointed toward unauthorized disclosure, and the hub has substantial information about
      the engineer’s intentions and preparations {C1}. But credible subsequent evidence establishes that the preparations
      were abandoned and the engineer is using authorized grievance or whistleblower channels; this directly undermines an
      assessment that disclosure is likely {C1}. Concerns about detection and competing readings of the grievance hearing
      warrant qualification, but do not outweigh that subsequent evidence {C2} {C3}. The employee’s reputation and the focus
      on foreign recruitment remain possible sources of analytic bias, but are not the basis for the conclusion {C4}. The
      balance therefore favors {O3}, while recognizing uncertainty about the interpretation of earlier events.
    tradecraft: State the likelihood judgment against the full body of available evidence, distinguish earlier reported preparations
      from the credible subsequent evidence that they were abandoned, and address the competing readings of the grievance
      hearing explicitly. Do not treat detection concerns or possible foreign recruitment as proof of either intent or restraint.
      Keep the assessment separate from any determination of misconduct or personnel action, and apply the agency’s protections
      for grievance activity and authorized whistleblowing.
    uncertainty: The meaning of particular earlier events is disputed, and the record does not establish that any single earlier
      report or event resolves all uncertainty. The estimate should acknowledge that uncertainty while giving appropriate
      weight to the credible subsequent evidence of abandonment and authorized-channel use.
    handoff: The hub analysts should make and explain the assessment, consulting relevant personnel-security and policy officials
      to test assumptions because managers are skeptical. That consultation should not substitute for the analysts’ responsibility
      to assess the evidence; any subsequent personnel process should separately observe applicable protections and procedures.
    tempting_wrong:
      option: O2
      pull: Earlier reports described preparations, other events were interpreted as pointing toward disclosure, and managers
        worry that the engineer may act despite detection risk.
      why_wrong: Those earlier indications do not outweigh credible subsequent evidence that the engineer abandoned preparations
        and is pursuing resolution solely through authorized channels. Treating the earlier record as sufficient to call disclosure
        likely would discount the most relevant evidence of the engineer’s current course.
    rejected:
      O1: 'Deferring is not warranted on this record: the available evidence supports an assessment, including credible subsequent
        evidence bearing directly on whether the engineer is likely to disclose.'
      O2: Assessing disclosure as likely would give earlier reports and interpretations greater weight than credible subsequent
        evidence that preparations were abandoned and authorized channels are being used.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence did not establish that the engineer had abandoned preparations for unauthorized disclosure and
        was pursuing resolution solely through authorized grievance or whistleblower channels.
      then: O2
      why: Without credible evidence of abandonment and authorized-channel use, the earlier reports and events pointing toward
        disclosure could again support the original assessment of likely action.
    would_not_change:
    - id: noflip1
      if: The grievance hearing were read as evidence that the engineer would remain within formal channels.
      why: That is one recorded interpretation, alongside the view that the hearing increased pressure; neither interpretation
        alone resolves the assessment.
    - id: noflip2
      if: Concern about possible foreign recruitment remained prominent.
      why: That focus could contribute to analysts overlooking action by the engineer without foreign direction, rather than
        justifying dismissal of the evidence about his preparations or subsequent conduct.
    watch_for:
    - id: watch1
      what: Evidence that the engineer’s own preparations for unauthorized disclosure were advancing or, conversely, had been
        halted.
      favors:
      - O1
      - O2
      why: The assessment turns on whether the engineer is moving toward action himself or has abandoned preparations and
        is using authorized channels, a possibility the focus on foreign recruitment could obscure.
  lesson: When earlier reports point toward an outcome, weigh credible subsequent evidence that bears directly on whether
    the person has continued or abandoned that course. Do not let assumptions about loyalty, doubts about detection risk,
    or attention to foreign recruitment substitute for assessing the evidence. Competing interpretations should be recorded
    and weighed, but they should not erase the cumulative evidentiary picture. A threat assessment is not, by itself, a finding
    of misconduct and must not displace protections for grievance activity or authorized whistleblowing.
  limits: This reasoning addresses an insider-threat assessment of whether a cleared engineer is likely to make an unauthorized
    disclosure. It does not determine whether any particular grievance or disclosure is protected, establish misconduct, authorize
    adverse personnel action, or resolve any collection, source-handling, or operational question.
