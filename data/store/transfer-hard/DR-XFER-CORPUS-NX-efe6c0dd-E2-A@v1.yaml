case:
  id: DR-XFER-CORPUS-NX-efe6c0dd-E2-A@v1
  title: Reviewing Unexplained Drone Incursions
  status: draft
  setting: Autumn 2024, a fictional interagency homeland-security board in the United States
  decider: Interagency Homeland Security Board
  agent: Interagency Homeland Security Board
  agent_role: decide
  situation: For several months, unexplained drones have been reported over power substations and military installations in
    several regions. Board members disagree about whether the activity reflects a foreign state's reconnaissance, criminal
    activity, or hobbyist flights, and the available information is sparse. A military service has compiled an extensive list
    of suspected launch locations, but the assessment cell has not received the supporting data. About a dozen analysts are
    assigned to the issue, while other homeland-security demands also compete for their time. The board is considering whether
    to require a coordinated review or leave members to assess the activity separately.
  question: What should the Interagency Homeland Security Board do about evidence sharing and review of the unexplained drone
    incursions?
  options:
    O1:
      do: The board directs members to withhold their evidence and continue separate assessments of the issue.
      move: act
      irreversible: false
    O2:
      do: The board directs members to disclose their evidence through temporary working groups conducting a coordinated highest-priority
        review.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Board members differ on whether the drone activity is foreign-state reconnaissance, criminal activity, or hobbyist
      flying.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Information available to the board about the operators, purposes, and extent of the incursions is sparse.
  - id: F3
    kind: capability
    status: assessed
    fact: Approximately twelve analysts are assigned directly or indirectly to assessing the incursions.
  - id: F4
    kind: capability
    status: assessed
    fact: Staff assess that doubling the number of analysts would make little difference to progress within the next year.
  - id: F5
    kind: capability
    status: assessed
    fact: Competing homeland-security demands and the variety of reported incidents limit systematic review of all available
      material.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: A military service holds an extensive list of suspected launch locations, and its supporting data has not been provided
      to the board's assessment cell.
  - id: F7
    kind: authority
    status: confirmed
    fact: The board's charter permits interagency assessment review, while law-enforcement-origin records remain subject to
      applicable access controls.
  - id: F8
    kind: situation
    status: confirmed
    fact: Some incident reports concern possible U.S. persons, and applicable privacy rules govern the handling of identifying
      information.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Members disagree about the nature of the activity while information about its operators and purpose is sparse. A
      coordinated review could compare their assessments against the evidence rather than leave the differences unresolved.
  - id: C2
    facts:
    - F6
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The military service's supporting data has not been made available to the assessment cell. A review that requires
      members to share their evidence gives the board a basis to examine the competing assessments.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Staffing is limited, systematic review of available material is difficult, and simply doubling analysts is not expected
      to materially improve near-term progress. A temporary, high-priority review uses existing analytic capacity rather than
      relying on staffing increases.
  - id: C4
    facts:
    - F1
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The board needs to address member differences about the incursions despite the problem's complexity. Reexamining
      the evidence and resolving those differences makes the issue a highest-priority task.
  reasoning:
    read: 'This is not just a staffing problem: board members differ in their assessments, and evidence supporting the military
      service''s suspected launch locations is not available to the assessment cell. The trap is to treat limited capacity
      as a reason to keep separate assessments or simply add analysts, even though additional staffing is not expected to
      materially improve near-term progress.'
    weighing: The sparse information and disagreement favor a common evidence review {C1}, and the gap in evidence sharing
      makes that review especially important {C2}. Resource limits make a focused, temporary effort more practical than relying
      on a major increase in staff {C3}. Together, these considerations support the board's choice to direct cooperation and
      make the review a highest-priority task {C4}. The choice depends on members providing their evidence through authorized
      channels, with applicable access controls and privacy rules observed.
    tradecraft: Direct members to disclose their evidence through the temporary working groups, give the assessment cell a
      clear review mandate, and record the evidentiary basis and unresolved differences in the resulting assessment. Handle
      law-enforcement-origin records and information concerning U.S. persons under applicable access and privacy requirements.
    uncertainty: Information about the operators and purposes of the incursions is sparse, and limited resources, competing
      homeland-security demands, and the problem's complexity make it difficult to review all available material systematically
      and comprehensively. The review could address differences in assessment, but the available information does not guarantee
      a definitive conclusion.
    handoff: The board should set the priority and require cooperation; the assessment cell and its temporary working groups
      should conduct the review, with relevant members providing evidence through authorized channels.
    tempting_wrong:
      option: O1
      pull: Separate assessments avoid the demands of coordinating members and may seem more manageable given limited analytic
        staffing.
      why_wrong: Withholding evidence would leave the assessment cell unable to examine the material behind a major member's
        position and would not serve the board's aim of reexamining the evidence and resolving differences.
    rejected:
      O1: The board did not choose continued separate assessments because it directed cooperation and a highest-priority coordinated
        review of the evidence.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Applicable law or binding access rules prohibited sharing the evidence across members, and no authorized means of
        review were available.
      then: O1
      why: A coordinated disclosure would not be an available lawful option; the closest stated alternative would be to continue
        separate assessments.
    would_not_change:
    - id: noflip1
      if: Analytic staffing remained limited and doubling it still was not expected to materially improve progress.
      why: Those constraints do not remove the value of coordinating the evidence review through temporary working groups.
    watch_for:
    - id: watch1
      what: Whether the working groups can examine the evidence together and resolve the differences among member assessments.
      favors:
      - O1
      why: That is the purpose the board assigns to the coordinated reexamination.
  lesson: When members disagree and important supporting evidence has not been shared, require a coordinated review before
    accepting separate assessments as the endpoint. Where added staffing is not expected to improve progress, prioritize cooperation
    and focused use of existing analytic capacity, while observing applicable access and privacy requirements.
  limits: This reasoning concerns interagency assessment coordination under uncertainty; it does not determine who is responsible
    for the drone incursions or their purpose. Legal or security restrictions on disclosure, including applicable protections
    for information concerning U.S. persons, could change what evidence-sharing course is available.
