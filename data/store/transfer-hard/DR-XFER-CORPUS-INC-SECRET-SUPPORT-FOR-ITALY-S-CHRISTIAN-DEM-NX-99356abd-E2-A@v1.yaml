case:
  id: DR-XFER-CORPUS-INC-SECRET-SUPPORT-FOR-ITALY-S-CHRISTIAN-DEM-NX-99356abd-E2-A@v1
  title: Backing Trusted Vendors Abroad
  status: draft
  setting: A partner country, present period; the national-security deputies and the government’s development-finance authority.
  decider: The national-security deputies
  agent: The national-security deputies
  agent_role: decide
  situation: The government is concerned about a rival’s growing influence over a partner’s critical infrastructure. Officials
    assess that state-backed firms are using substantial subsidies to compete for the partner’s core telecommunications network,
    two ports, and university laboratories. The government’s primary national-security mission is to keep a crisis with the
    rival from becoming a conflict. Its experience financing vendors’ bids abroad is limited, and its economic-statecraft
    tools are still developing. The deputies are considering whether to authorize a confidential development-finance package
    backing trusted vendors in the telecommunications tender.
  question: What should the national-security deputies do about whether to authorize a confidential development-finance package
    backing trusted vendors in the telecommunications tender?
  options:
    O1:
      do: The national-security deputies decline the confidential development-finance package backing trusted vendors in the
        telecommunications tender.
      move: act
      irreversible: false
    O2:
      do: The national-security deputies authorize the confidential development-finance package backing trusted vendors in
        the telecommunications tender.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The government has few precedents for financing vendors’ bids abroad.
  - id: F2
    kind: situation
    status: confirmed
    fact: The government’s primary national-security mission is to prevent a crisis with the rival from becoming a conflict.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Officials assess that the rival is gaining influence over critical infrastructure in the partner country.
  - id: F4
    kind: intelligence
    status: assessed
    fact: State-backed firms are believed to be using substantial subsidies to compete for infrastructure and research assets
      in the partner country.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The assets of concern include the partner’s core telecommunications network, two ports, and university laboratories.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposed instrument is a confidential development-finance package backing trusted vendors in the telecommunications
      tender.
  - id: F7
    kind: situation
    status: confirmed
    fact: The government’s tools for responding to foreign influence through economic statecraft are still developing.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: Officials assess that the rival’s state-backed firms are using substantial subsidies to gain positions in important
      infrastructure and research assets. The deputies must weigh the proposed financing as a response to that perceived influence.
  - id: C2
    facts:
    - F2
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: Preventing a crisis with the rival from becoming a conflict is the government’s primary mission. In that strategic
      context, countering economic influence is a reason to act, though the tender itself has not been identified as posing
      an imminent risk of conflict.
  - id: C3
    facts:
    - F1
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Few precedents exist for financing foreign bids, and the government’s economic-statecraft tools are still developing,
      making the policy choice less established.
  reasoning:
    read: The decision is whether to respond to an assessed foreign economic-influence threat by confidentially financing
      trusted vendors in a partner’s tender. The trap is to treat the lack of precedent as making action impossible, or to
      treat a favorable tender result as proof that confidential support is justified in every case.
    weighing: The deputies give greatest weight to the perceived rival influence and the use of substantial subsidies to gain
      positions in important assets {C1}, against the uncertainty created by limited precedent and developing policy tools
      {C3}. The broader national-security mission supplies context for acting {C2}. The decision’s rationale depends chiefly
      on the threat assessment, not on assuming that a favorable tender result alone would justify the choice.
    tradecraft: State the policy objective, the assessed threat and its reliability, and the basis for authorization. Preserve
      a record that distinguishes the rationale available at the time from any later tender result.
    uncertainty: The assessment concerns rival influence and subsidized bids, but the underlying evidence and its reliability
      are not specified. Applicable legal and trade constraints, as well as alternatives to confidential financing, are also
      not addressed, and the government’s economic-statecraft tools are still developing.
    handoff: The national-security deputies hold the decision. Because few precedents exist and the government’s economic-statecraft
      tools are still developing, involve appropriate legal and policy advisers before authorization.
    tempting_wrong:
      option: O1
      pull: Declining could seem prudent because financing foreign bids has few precedents and the government’s tools are
        still developing.
      why_wrong: That caution does not outweigh the deputies’ stated assessment that rival state-backed firms are using substantial
        subsidies to gain influence over important assets.
    rejected:
      O1: The deputies do not decline because they judge the perceived rival influence over the partner’s infrastructure and
        research assets serious enough to warrant counteraction.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The deputies lacked a credible basis for the assessment that rival state-backed firms were using substantial subsidies
        to gain influence over key infrastructure and research assets.
      then: O1
      why: The stated rationale for intervention rests on that perceived threat; without it, there is no comparable reason
        here to authorize the financing.
    would_not_change:
    - id: noflip1
      if: Trusted vendors won the tender, but the threat assessment and decision rationale at the time were otherwise unchanged.
      why: A favorable result would not, by itself, change what was justified on the information and rationale available when
        the deputies decided.
    watch_for:
    - id: watch1
      what: Whether the assessment that rival state-backed firms are using substantial subsidies to influence important assets
        remains credible.
      favors:
      - O2
      why: That assessment is the principal stated reason for countering the perceived threat.
  lesson: A perceived foreign economic-influence threat can support a policy response when decision-makers connect it to a
    serious national-security objective. Limited precedent calls for care, but a favorable outcome alone does not establish
    that confidential vendor financing was justified or that the same choice fits other circumstances.
  limits: The available account gives a brief rationale, not a legal or trade analysis, a full account of the evidence, or
    a comparison of alternative responses. This reasoning should not be treated as a general authorization for confidential
    state-backed financing of foreign vendors.
