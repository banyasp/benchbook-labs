case:
  id: DR-XFER-CORPUS-NX-2f40ddf1-E3-A-flip1@v1
  title: A Field Station's Covert-Action Role
  status: draft
  setting: Asteria, 2024, National Intelligence Service (a fictional agency), Operations Directorate.
  decider: The operations director
  agent: The operations director
  agent_role: decide
  situation: The Operations Directorate is deciding how much authority to give a field station over one part of an approved
    covert-action program. Host-government consent for the relevant program activities has remained uncertain for months,
    and the station was left out of program planning during that period. Program guidance sets three broad objectives and
    leaves the method to the station chief within headquarters' intent. The station lacks staff assigned to planning its part
    of the program and does not have resources to carry out its assigned part without headquarters assistance. Headquarters
    would retain authority to approve plans and direct the station by exception. Applicable oversight rules include notification
    duties, and oversight bodies expect close headquarters control.
  question: What should the operations director do about the field station's planning and execution authority?
  options:
    O1:
      do: The Operations Directorate centralizes planning and execution for the station's part of the program under the program
        objectives, retaining authority over plans and direction by exception.
      move: act
      irreversible: false
    O2:
      do: The Operations Directorate limits the station chief's delegated planning and execution authority, retaining central
        review of plans and direction by exception.
      move: partial
      irreversible: false
      to: the station chief
    O3:
      do: The Operations Directorate delegates planning and execution for the station's part of the program to the station
        chief under broad objectives, retaining authority over plans and direction by exception.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: Host-government consent for the relevant program activities has remained uncertain for several months.
  - id: F2
    kind: situation
    status: confirmed
    fact: The field station was left out of program planning while host-government consent was uncertain.
  - id: F3
    kind: situation
    status: confirmed
    fact: The approved program guidance assigns the station's part of the program three broad objectives.
  - id: F4
    kind: authority
    status: confirmed
    fact: The guidance leaves the method for pursuing those objectives to the station chief, within headquarters' stated intent.
  - id: F5
    kind: capability
    status: confirmed
    fact: The field station lacks staff assigned to planning its part of the program.
  - id: F6
    kind: capability
    status: confirmed
    fact: The field station lacks the resources to carry out its assigned part of the program without headquarters assistance.
  - id: F7
    kind: authority
    status: confirmed
    fact: Headquarters retains authority to approve the station's plans and to direct the station by exception.
  - id: F8
    kind: authority
    status: confirmed
    fact: Applicable covert-action oversight rules require notification to designated legislative overseers.
  - id: F9
    kind: situation
    status: confirmed
    fact: The designated oversight bodies expect close headquarters control of the program.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Host-government consent was uncertain and the station had not been integrated into program planning. The program
      nevertheless assigns it a broad task, a context in which delegated authority could let the station act within its assigned
      purpose.
  - id: C2
    facts:
    - F3
    - F4
    equity: mission_effect
    favors:
    - O3
    weight: strong
    why: The guidance specifies broad objectives but leaves the method to the station chief acting within headquarters' intent.
      That allocation supports delegation rather than central direction of execution.
  - id: C3
    facts:
    - F5
    - F6
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The station lacks assigned planning staff and the resources to carry out its work without headquarters assistance.
      This limits its ability to exercise broad delegated responsibility and supports limiting its authority while providing
      central review.
  - id: C4
    facts:
    - F4
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: Delegation would not remove headquarters' authority to approve plans or direct the station by exception, and the
      station's discretion remains bounded by headquarters' intent. Notification duties and expectations of close headquarters
      control make it important that these retained controls remain meaningful.
  reasoning:
    read: The station's role was initially uncertain because host-government consent was not assured, and it was consequently
      left out of program planning. The guidance assigns broad objectives and leaves the method to the station chief, while
      preserving headquarters' plan approval and exception direction. However, the station lacks planning staff and cannot
      carry out its assigned work without headquarters assistance.
    weighing: The balance favors O2. The broad objectives and the station chief's discretion within headquarters' intent support
      delegation, and headquarters' retained plan approval and exception direction preserve oversight. But the station lacks
      planning staff and resources to perform independently, so broad delegated planning and execution are not workable on
      the stated facts. Limiting the chief's delegated authority while retaining central review better matches the station's
      capabilities. Notification duties and oversight expectations also require close attention to headquarters' retained
      controls.
    tradecraft: Define the limited scope of the station chief's authority in terms of the assigned objectives and headquarters'
      intent, and retain central review of plans along with headquarters' authority to direct by exception. Provide the headquarters
      assistance needed for the station's assigned work, record the allocation of authority and any later exercise of retained
      authority, and ensure applicable notification and oversight obligations are addressed.
    uncertainty: The stated circumstances establish the program arrangement, the station's capability limits, and the relevant
      oversight considerations. The reasons for O2 rest on those limits and the value of central review, while recognizing
      that the guidance and retained headquarters authority otherwise support delegation.
    handoff: The operations director decides the allocation of authority. The station chief carries out only the work within
      the delegated scope, with central review and headquarters assistance as needed; applicable oversight obligations remain
      in force.
    tempting_wrong:
      option: O3
      pull: The broad objectives and guidance leaving the method to the station chief may seem to call for broad delegation,
        especially since headquarters retains plan approval and exception direction.
      why_wrong: Those features support delegation in principle, but the station lacks planning staff and cannot carry out
        its assigned work without headquarters assistance. Broad authority would not match its stated capabilities; limited
        delegation with central review is more appropriate.
    rejected:
      O1: Full centralization is not necessary because the guidance assigns broad objectives and leaves the method to the
        station chief, while headquarters retains authority to approve plans and direct by exception.
      O3: Broad delegation was not chosen because the station lacks planning staff and resources to carry out its assigned
        work without headquarters assistance.
      O2: Limiting the station chief's delegated authority while retaining central review best matches the station's capability
        limits and the need for headquarters assistance.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The station had the planning staff and resources to carry out its assigned work without headquarters assistance.
      then: O3
      why: If the station could plan and perform its assigned work independently, the capability-based reason for limiting
        delegation would no longer apply; the broad objectives and station-chief discretion would then support the original
        choice of O3.
    would_not_change:
    - id: noflip1
      if: Host-government consent remained uncertain while the station still had its own staff and resources and headquarters
        retained its authority.
      why: Consent uncertainty and limited program-planning integration were part of the circumstances in which broad objectives
        were assigned and the station chief's discretion was specified.
    watch_for:
    - id: watch1
      what: Whether host-government consent for the relevant program activities is secured and remains in place.
      favors:
      - O3
      why: The relevant activities depend on that consent; if it is not secured, the scope for delegated activity should be
        limited pending authorization.
  lesson: Limit delegated authority when a subordinate station lacks the planning staff or resources to perform its assigned
    work without headquarters assistance. Broad objectives and headquarters' retained approval and exception authority may
    support delegation, but the scope of authority should also match the station's capabilities. Delegation and central review
    must remain consistent with applicable notification duties and oversight expectations.
  limits: This reasoning applies to the stated arrangement of broad objectives, a station that lacks planning staff and resources
    to act without headquarters assistance, retained headquarters authority, and applicable oversight duties. It does not
    establish that limited delegation is appropriate when required host-government consent is unavailable or when oversight
    obligations cannot be met.
