case:
  id: DR-XFER-CORPUS-NX-efe6c0dd-E2-A-flip1@v1
  title: Reviewing Unexplained Drone Incursions
  status: draft
  setting: Autumn 2024, a fictional interagency homeland-security board in the United States
  decider: Interagency Homeland Security Board
  agent: Interagency Homeland Security Board
  agent_role: decide
  situation: For several months, unexplained drones have been reported over power substations and military installations in
    several regions. Board members disagree about whether the activity reflects a foreign state's reconnaissance, criminal
    activity, or hobbyist flights, and the available information is sparse. A military service has compiled an extensive list
    of suspected launch locations, but the assessment cell has not received the supporting data. Applicable law or binding
    access rules prohibit sharing the relevant evidence across members, and no authorized means of review is available. About
    a dozen analysts are assigned to the issue, while other homeland-security demands also compete for their time. The board
    is considering whether to require a coordinated review or leave members to assess the activity separately.
  question: What should the Interagency Homeland Security Board do about evidence sharing and review of the unexplained drone
    incursions?
  options:
    O1:
      do: The board directs members to withhold their evidence and continue separate assessments of the issue.
      move: act
      irreversible: false
    O2:
      do: The board directs members to disclose their evidence through temporary working groups conducting a coordinated highest-priority
        review.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: Board members differ on whether the drone activity is foreign-state reconnaissance, criminal activity, or hobbyist
      flying.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Information available to the board about the operators, purposes, and extent of the incursions is sparse.
  - id: F3
    kind: capability
    status: assessed
    fact: Approximately twelve analysts are assigned directly or indirectly to assessing the incursions.
  - id: F4
    kind: capability
    status: assessed
    fact: Staff assess that doubling the number of analysts would make little difference to progress within the next year.
  - id: F5
    kind: capability
    status: assessed
    fact: Competing homeland-security demands and the variety of reported incidents limit systematic review of all available
      material.
  - id: F6
    kind: intelligence
    status: confirmed
    fact: A military service holds an extensive list of suspected launch locations, and its supporting data has not been provided
      to the board's assessment cell.
  - id: F7
    kind: authority
    status: confirmed
    fact: The board's charter permits interagency assessment review, but applicable law or binding access rules prohibit sharing
      the relevant evidence across members, and no authorized means of review is available; law-enforcement-origin records
      remain subject to applicable access controls.
  - id: F8
    kind: situation
    status: confirmed
    fact: Some incident reports concern possible U.S. persons, and applicable privacy rules govern the handling of identifying
      information.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: Members disagree while information about the operators and purpose is sparse, so comparing assessments would ordinarily
      be valuable. But F7 establishes that the evidence cannot lawfully be shared across members and no authorized review
      means are available; a coordinated evidence review is not a permissible option.
  - id: C2
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The military service's supporting data has not been made available to the assessment cell, and F7 establishes that
      no lawful authorized means exists to share and review that evidence across members. The board should not direct a disclosure
      that binding rules prohibit.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F7
    equity: resource_stewardship
    favors:
    - O1
    weight: weak
    why: Staffing is limited, systematic review is difficult, and doubling analysts is not expected to materially improve
      near-term progress. Given F7, assigning existing capacity to the unavailable coordinated review would not resolve the
      legal barrier; separate assessments remain the available course.
  - id: C4
    facts:
    - F1
    - F5
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The board needs to address member differences despite the problem's complexity, but F7 means the proposed coordinated
      evidence review cannot be conducted through any authorized means. Separate assessments are the available lawful course.
  reasoning:
    read: 'This is not just a staffing problem: board members differ in their assessments, and evidence supporting the military
      service''s suspected launch locations is not available to the assessment cell. However, applicable law or binding access
      rules prohibit sharing the relevant evidence across members, and no authorized means of review is available. The trap
      is to treat the value of coordination as permission to disclose evidence despite that restriction.'
    weighing: The sparse information and disagreement would ordinarily favor a common evidence review {C1}, and the gap in
      evidence sharing would ordinarily make that review especially important {C2}. But the binding restriction and absence
      of an authorized review route mean the board cannot lawfully require the proposed disclosure. Limited resources also
      do not overcome that barrier {C3}. The board should therefore leave members to conduct separate assessments {C4}, while
      respecting applicable access controls and privacy rules.
    tradecraft: Do not direct cross-member disclosure where applicable law or binding access rules prohibit it and no authorized
      review means are available. Continue separate assessments within the applicable restrictions, and handle law-enforcement-origin
      records and information concerning U.S. persons under applicable access and privacy requirements.
    uncertainty: Information about the operators and purposes of the incursions is sparse, and limited resources, competing
      homeland-security demands, and the problem's complexity make it difficult to review all available material systematically
      and comprehensively. Separate assessments may leave differences unresolved, and the available information does not guarantee
      a definitive conclusion.
    handoff: The board should respect the applicable sharing restrictions and leave members to conduct separate assessments.
      Members should handle evidence through only those channels permitted by applicable law and access rules.
    tempting_wrong:
      option: O2
      pull: Members disagree and important supporting evidence has not reached the assessment cell, making a coordinated review
        seem attractive.
      why_wrong: Applicable law or binding access rules prohibit sharing the evidence across members, and no authorized means
        of review is available. Directing disclosure would therefore exceed the available lawful course.
    rejected:
      O2: The board did not choose a coordinated disclosure and review because applicable law or binding access rules prohibit
        sharing the evidence across members and no authorized means of review is available.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Applicable law or binding access rules did not prohibit sharing the evidence across members, or an authorized means
        of review were available.
      then: O2
      why: If the sharing prohibition did not apply or an authorized review route existed, a coordinated evidence review would
        again be available and would address the sparse information and member disagreements.
    would_not_change:
    - id: noflip1
      if: Analytic staffing remained limited and doubling it still was not expected to materially improve progress.
      why: Those constraints do not determine whether evidence sharing is lawful or create an authorized review route; the
        access restriction remains decisive.
    watch_for:
    - id: watch1
      what: Whether applicable law or binding access rules change, or an authorized means becomes available, permitting the
        working groups to examine evidence together.
      favors:
      - O2
      why: A lawful authorized route would make the coordinated reexamination available and could address the differences
        among member assessments.
  lesson: When members disagree and important supporting evidence has not been shared, a coordinated review may be valuable,
    but it must remain within applicable law and binding access rules. If sharing is prohibited and no authorized review means
    exists, continue separate assessments rather than direct an unavailable disclosure.
  limits: This reasoning concerns interagency assessment coordination under uncertainty; it does not determine who is responsible
    for the drone incursions or their purpose. It assumes the stated sharing prohibition and absence of an authorized review
    means are accurate; a change in those conditions could make coordinated review available. Applicable protections for information
    concerning U.S. persons continue to govern its handling.
