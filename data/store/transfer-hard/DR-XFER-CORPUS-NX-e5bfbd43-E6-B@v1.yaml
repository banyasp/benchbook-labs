case:
  id: DR-XFER-CORPUS-NX-e5bfbd43-E6-B@v1
  title: A Hostile Service After Expulsions
  status: draft
  setting: North Atlantic partner capitals, the year following joint allied expulsions; an adversary-behavior assessment of
    a rival intelligence service.
  decider: The rival intelligence service’s leaders
  agent: The rival intelligence service’s leaders
  agent_role: decide
  situation: The rival service’s leaders seek to preserve and expand their recruitment efforts while retaining the initiative
    in intelligence competition. After a joint allied expulsion of the service’s officers, the leaders face decisions about
    their posture over the next year. Their near-term objectives include heading off a wider second round of expulsions, blocking
    common visa limits, and splitting the United States from its partners. The service varies its methods and supports diaspora
    front groups. Its leaders have previously retaliated harshly when they judged retaliation likely to pay, and the assessment
    considers several possible post-expulsion postures.
  question: What should the rival intelligence service’s leaders do about the service’s posture over the next year?
  options:
    O1:
      do: The rival intelligence service’s leaders should adopt a low-profile, conciliatory posture.
      move: act
      irreversible: false
    O2:
      do: The rival intelligence service’s leaders should adopt an aggressive retaliatory posture.
      move: act
      irreversible: false
    O3:
      do: The rival intelligence service’s leaders should maintain quiet conduct while carrying out selective retaliatory
        expulsions.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The rival service is assessed to seek opportunities to expand its recruitment efforts.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The service’s leaders are assessed to seek the initiative in intelligence competition and to capitalize on successes.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Near-term objectives include preventing a wider second round of allied expulsions, blocking common visa limits,
      and separating the United States from its partners.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The service is assessed to vary its methods and time its actions to exploit situations its leaders judge favorable.
  - id: F5
    kind: intelligence
    status: assessed
    fact: For the coming year, the principal assessment judges that the service’s leaders regard a generally low-profile,
      conciliatory posture as useful to their objectives.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The assessed purposes of a low-profile posture include reducing allied concern, weakening support for common restrictions,
      and undermining U.S. efforts to coordinate policy with partners.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The service is assessed to continue supporting diaspora front groups.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The service’s leaders have previously used harsh retaliation when they judged that retaliation would bring worthwhile
      returns.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The low-profile posture is not assessed to indicate a change in the service’s recruitment aims or to involve substantial
      concessions.
  - id: F10
    kind: intelligence
    status: assessed
    fact: A partner counterintelligence service’s assessment differs from the principal assessment on whether the rival service’s
      leaders would accept the risk of a broader reciprocal expulsion cycle when they expect retaliation to protect the service’s
      position.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: For the coming year, a low-profile, conciliatory posture is judged to serve the service’s stated objectives by reducing
      allied concern, weakening support for common restrictions, and undermining U.S. coordination with partners.
  - id: C2
    facts:
    - F1
    - F2
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Conciliation is tactical rather than a renunciation of recruitment aims or the effort to retain initiative; the posture
      does not indicate changed basic objectives or substantial concessions.
  - id: C3
    facts:
    - F5
    - F8
    equity: escalation_control
    favors:
    - O1
    weight: strong
    why: The near-term preference is for a generally low-profile, conciliatory posture, with harsh retaliation conditional
      on the leaders judging that it will bring worthwhile returns.
  - id: C4
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Varied methods and continued support for diaspora front groups make a combined approach plausible. Those activities
      do not displace the near-term preference for an overall low-profile posture.
  reasoning:
    read: A low-profile posture is an instrument for advancing the service’s objectives, not evidence that those objectives
      have changed. The trap is to mistake conciliation for a strategic concession, or to treat conditional willingness to
      retaliate harshly as the preferred posture for the coming year.
    weighing: 'The near-term balance favors O2: a generally low-profile, conciliatory posture is judged to best serve the
      service’s objectives by reducing allied concern and weakening support for common restrictions {C1}. The underlying recruitment
      aims remain, and the posture involves no substantial concessions {C2}. Varied methods and continued support for diaspora
      front groups make O1 plausible as part of the broader approach, but not as the preferred overall posture {C4}. Harsh
      retaliation is conditional on expected returns {C3}. A partner counterintelligence service’s assessment differs from
      the principal assessment about whether the rival service’s leaders would accept the risk of a broader reciprocal expulsion
      cycle when they expect retaliation to protect the service’s position. That disagreement qualifies the assessment of
      escalation risk without changing the stated near-term preference.'
    tradecraft: Keep the one-year time horizon and the distinction between overall posture and other ongoing service policies
      explicit. Record the assumptions behind the choice, including the expected benefits of a low-profile posture and the
      conditions that could change the assessment; reassess those assumptions as circumstances and judgments about returns
      change.
    uncertainty: The likely allied response over the coming year is uncertain. A partner counterintelligence service differs
      from the principal assessment on whether the rival service’s leaders might accept the risk of a broader reciprocal expulsion
      cycle when they expect retaliation to protect the service’s position.
    handoff: The decision rests with the rival service’s leaders; no referral or concurrence process is specified. As a decision
      practice, make the differing judgments about the risk of a broader expulsion cycle visible rather than presenting them
      as a single consensus.
    tempting_wrong:
      option: O2
      pull: Recruitment aims and the desire to retain the initiative may make an aggressive retaliatory posture seem like
        the most direct way to pursue them.
      why_wrong: 'Enduring objectives are distinct from the posture judged to serve them best for the coming year: a generally
        low-profile, conciliatory posture, with harsh retaliation conditional on expected returns.'
    rejected:
      O3: Varied methods and continued support for diaspora front groups remain part of the approach, but the near-term judgment
        favors a generally low-profile overall posture rather than defining it as a combination with selective retaliatory
        expulsions.
      O2: An aggressive retaliatory posture is not the near-term preference; harsh retaliation is conditional on the leaders
        judging that it will bring worthwhile returns.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The service’s leaders judge that aggressive retaliation will bring increased returns.
      then: O2
      why: That judgment is the stated condition for reverting to aggressive retaliation.
    would_not_change:
    - id: noflip1
      if: The service’s leaders believe a retaliation cycle would cause severe damage to the service’s position or trigger
        a broad, coordinated round of allied measures.
      why: They would probably seek to avoid courses of action precipitating those consequences; this condition supports restraint
        rather than a more aggressive posture.
    watch_for:
    - id: watch1
      what: Whether the service’s leaders come to judge that aggressive retaliation will bring increased returns.
      favors:
      - O3
      why: That judgment is the stated condition for reverting to aggressive retaliation.
  lesson: Distinguish an instrumentally low-profile posture from a change in underlying objectives. Prefer the posture judged
    to serve current aims, while treating aggressive retaliation as conditional on the decision-maker’s reassessment of its
    likely returns.
  limits: This is a restatement of a predictive intelligence judgment, not a legal authorization or an independent moral endorsement
    of the rival service’s objectives. Its one-year conclusion should not be extended beyond the identified time horizon or
    uncertainties.
