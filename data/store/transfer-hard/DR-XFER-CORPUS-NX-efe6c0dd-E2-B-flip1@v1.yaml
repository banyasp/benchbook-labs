case:
  id: DR-XFER-CORPUS-NX-efe6c0dd-E2-B-flip1@v1
  title: Adversary Stakes in Chip Suppliers
  status: draft
  setting: A department supply-chain risk council reviewing second-tier microelectronics suppliers in the United States, current
    period
  decider: The supply-chain risk council chair
  agent: The supply-chain risk council chair
  agent_role: decide
  situation: The services disagree about whether an adversary's stakes in second-tier microelectronics suppliers are aimed
    at leverage, technology, or market share. Information about supplier ownership is sparse. One service holds an extensive
    list of suspect suppliers, but the supporting data has not been made available to the council's review committee. Fewer
    than a dozen analysts work the issue, and adding more is not expected to improve progress within a year. A binding nondisclosure
    term prohibits sharing the relevant supplier evidence across services, and no authorized means of review is available.
    The council chair must decide how the agencies should review the evidence.
  question: What should the council chair do about interservice evidence sharing and review of adversary stakes in second-tier
    microelectronics suppliers?
  options:
    O1:
      do: The council chair directs the services to withhold their evidence and continue separate assessments of the issue.
      move: act
      irreversible: false
    O2:
      do: The council chair directs the services to disclose their evidence through temporary working groups conducting a
        coordinated highest-priority review.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The services disagree about whether an adversary's stakes in second-tier microelectronics suppliers are aimed at
      leverage, technology, or market share.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Information about adversary interests and supplier ownership is sparse.
  - id: F3
    kind: capability
    status: assessed
    fact: Fewer than a dozen analysts across the participating services work on the supplier-risk issue.
  - id: F4
    kind: capability
    status: assessed
    fact: The current analytic effort has been staffed at roughly its present level during the preceding year.
  - id: F5
    kind: capability
    status: assessed
    fact: Competing supply-chain priorities and the complexity of tracing supplier ownership make systematic review of all
      available records difficult.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Adding analysts is not expected to materially improve progress on the issue within a year.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: One service holds an extensive list of suspect second-tier microelectronics suppliers, and the supporting data has
      not been made available to the council's review committee.
  - id: F8
    kind: authority
    status: confirmed
    fact: A binding nondisclosure term prohibits sharing the relevant supplier evidence across services, and no authorized
      means of review is available.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The services disagree about the adversary's aims while information about interests and ownership is sparse. A coordinated
      review could compare their assessments against the evidence rather than leave the differences unresolved.
  - id: C2
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The service's supporting data has not been made available to the committee, but a binding nondisclosure term prohibits
      sharing the relevant evidence across services and no authorized review means is available. Directing disclosure through
      a coordinated review is therefore not an available lawful course; the evidence must remain unshared.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Analytic staffing is limited, systematic review of available records is difficult, and adding analysts is not expected
      to materially improve near-term progress. A temporary, high-priority review uses existing analytic capacity rather than
      relying on staffing increases.
  - id: C4
    facts:
    - F1
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The council needs to address service differences about supplier risks despite the problem's complexity. Reexamining
      the evidence and resolving those differences becomes a highest-priority task.
  reasoning:
    read: 'This was not just a staffing problem: the services differed in their assessments, and evidence supporting one service''s
      supplier list was not available to the council''s committee. In this case, a binding nondisclosure term prohibits sharing
      the relevant supplier evidence across services, and no authorized means of review is available. The trap is to treat
      the analytic value of coordination as sufficient reason to direct disclosure despite that constraint.'
    weighing: The sparse information and disagreement favor a common evidence review {C1}, and the gap in evidence sharing
      makes that review especially important {C2}; however, the binding nondisclosure term prohibits sharing the relevant
      evidence and no authorized means of review is available. The resource and mission considerations support a focused,
      coordinated review in principle {C3} {C4}, but they cannot make prohibited disclosure an available option. Of the stated
      choices, directing the services to withhold the evidence and continue separate assessments is the closest lawful course
      {C2}.
    tradecraft: Direct the services to keep the relevant evidence unshared and continue separate assessments. Do not direct
      disclosure through temporary working groups when the binding term prohibits sharing and no authorized review means is
      available.
    uncertainty: Information about adversary interests and supplier ownership is sparse, and competing priorities and the
      problem's complexity make comprehensive review of all available records difficult. The binding nondisclosure term prohibits
      sharing the relevant evidence across services, and no authorized means of review is available. Separate assessments
      may therefore leave important differences unresolved.
    handoff: The council chair should direct the services to continue separate assessments without sharing the prohibited
      evidence. The relevant services should maintain their assessments within the applicable restrictions.
    tempting_wrong:
      option: O2
      pull: A coordinated review could address the sparse information, service disagreements, and limited analytic capacity.
      why_wrong: The binding nondisclosure term prohibits sharing the relevant supplier evidence across services, and no authorized
        means of review is available. The analytic benefits of coordination do not make the specified disclosure an available
        lawful course.
    rejected:
      O2: The chair did not choose a coordinated disclosure because the relevant evidence cannot be shared across services
        under the binding term, and no authorized means of review is available.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The relevant supplier evidence could be shared through an authorized means, with no applicable authority or binding
        nondisclosure term prohibiting that sharing.
      then: O2
      why: Removing the prohibition and making an authorized review available would allow a coordinated evidence review to
        address the services' disagreement and the committee's evidence gap.
    would_not_change:
    - id: noflip1
      if: Analytic staffing remained limited and adding analysts still was not expected to materially improve progress within
        a year.
      why: Those constraints do not remove the value of coordinating the evidence review when sharing is authorized.
    watch_for:
    - id: watch1
      what: Whether the working groups can examine the evidence together and resolve the differences among service assessments.
      favors:
      - O1
      why: That is the purpose a coordinated reexamination would serve if an authorized means of sharing became available.
  lesson: When services disagree and important supporting evidence has not been shared, a coordinated review may be valuable,
    but it cannot be pursued through disclosure prohibited by a binding term when no authorized review means is available.
    In that circumstance, continue separate assessments while respecting the restriction; limited staffing does not change
    the sharing constraint.
  limits: This reasoning concerns interservice analytic coordination under uncertainty; it does not determine the adversary's
    actual stakes in the suppliers. The stated binding nondisclosure term prohibits sharing the relevant evidence across services,
    and no authorized means of review is available. If that authority or restriction changes, the available course may change.
  library:
    domain: supply-chain security
    family: XFER-CORPUS-NX-efe6c0dd
    source: transfer of DR-CORPUS-NX-efe6c0dd-E2@v1
    episode_focus: The decision was whether to continue with divergent agency assessments or coordinate a rapid review of
      the evidence; USIB chose cooperation and temporary groups as a highest-priority task. Keep the focus on analytic coordination
      and sharing evidence, not on evaluating specific launch locations.
    equities: pilot2
