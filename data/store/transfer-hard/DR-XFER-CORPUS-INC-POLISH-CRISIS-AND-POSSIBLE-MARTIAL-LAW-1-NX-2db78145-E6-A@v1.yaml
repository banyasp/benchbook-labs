case:
  id: DR-XFER-CORPUS-INC-POLISH-CRISIS-AND-POSSIBLE-MARTIAL-LAW-1-NX-2db78145-E6-A@v1
  title: An Employee Nearing a Disclosure
  status: draft
  setting: A federal engineering agency, early 2025; insider-threat hub
  decider: Insider-threat hub leadership
  agent: Insider-threat hub analysts
  agent_role: decide
  situation: The insider-threat hub is reviewing a cleared engineer whose recent activity has drawn attention from security
    and management staff. Reports from the past two months describe steady steps toward an unauthorized disclosure, and other
    events have also been cited as relevant. The hub has substantial information about the employee’s intentions and preparations,
    but managers believe he knows a disclosure would be detected and may therefore hold back. They regard him as a loyal but
    dissatisfied employee who uses grievance channels, while much of their attention has been on the possibility of foreign
    recruitment. The employee’s recent grievance hearing has been interpreted both as a sign of mounting pressure and as a
    possible reason he will remain within established channels.
  question: What should the insider-threat hub analysts do in framing their assessment of whether the cleared engineer is
    likely to make an unauthorized disclosure?
  options:
    O1:
      do: The insider-threat hub analysts defer the assessment pending a review of the available evidence.
      move: hold
      irreversible: false
    O2:
      do: The insider-threat hub analysts assess an unauthorized disclosure as likely and discount continued reliance on grievance
        channels.
      move: act
      irreversible: false
    O3:
      do: The insider-threat hub analysts oppose an assessment of likely unauthorized disclosure and favor continued use of
        grievance channels.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: confirmed
    fact: Reports from the previous two months describe steady preparation by the cleared engineer to disclose controlled
      engineering material outside authorized channels.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Other recorded events during the same period have also been interpreted as pointing toward an unauthorized disclosure.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The hub’s case file contains substantial information about the engineer’s stated intentions and reported preparations.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Managers believe the engineer knows that an unauthorized disclosure would be detected and may refrain from acting
      for that reason.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The engineer’s recent grievance hearing has been read both as a source of increased pressure and as a reason he
      might continue using formal channels.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Managers tend to regard the engineer as a loyal employee who expresses dissatisfaction through grievance procedures
      and prefers authorized resolution.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The hub’s recent analytic attention has focused on the possibility of foreign recruitment rather than on an employee
      acting without foreign direction.
  - id: F8
    kind: authority
    status: confirmed
    fact: Agency personnel-security policy distinguishes protected grievance activity and authorized whistleblowing from unauthorized
      disclosure, and requires a separate basis for adverse personnel action.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: Reports describe steady preparation, other events point in the same direction, and the hub has substantial information
      about the employee’s intentions. The evidence should not be discounted as though it were too limited to support an estimate.
  - id: C2
    facts:
    - F4
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The belief that detection risk will make the employee hold back is a key reason the available information could go
      for naught. Treating perceived risk of detection as evidence of unwillingness to act risks discounting the possibility
      of disclosure.
  - id: C3
    facts:
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: 'The grievance hearing supports different readings: one suggests increasing pressure, while another suggests the
      employee may continue using formal channels. That disagreement counsels against relying on a single event or interpretation
      and gives some support to further review.'
  - id: C4
    facts:
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The continuing view of the employee as a loyal grumbler, together with the focus on possible foreign recruitment,
      could lead analysts to downplay the prospect that he would act alone. Those frames risk obscuring what the reports indicate
      about his own preparations.
  reasoning:
    read: The central problem is not a lack of relevant information but the way analysts interpret it. The trap is allowing
      an image of the employee as a loyal grievance-raiser, doubts that he would act despite detection risk, and attention
      to foreign recruitment to outweigh converging indications of preparation.
    weighing: The reports and other events provide a substantial basis for estimating that an unauthorized disclosure is likely
      {C1}. Concerns about detection and the competing readings of the hearing warrant qualification, but do not outweigh
      that record {C2} {C3}. The assumption that the employee will remain within grievance channels and the focus on foreign
      recruitment risk obscuring the possibility that he may act alone {C4}. The balance therefore favors {O1}, while recognizing
      uncertainty about timing and the interpretation of particular events.
    tradecraft: State the likelihood judgment against the full body of available evidence, distinguish reported preparations
      from interpretations of intent, and address the competing readings of the grievance hearing explicitly. Record why doubts
      about detection and possible foreign recruitment do not, by themselves, establish that the employee will refrain from
      acting. Keep the assessment separate from any determination of misconduct or personnel action, and apply the agency’s
      protections for grievance activity and authorized whistleblowing.
    uncertainty: The meaning of particular events is disputed, and the record does not establish that any single event or
      report would resolve analysts’ skepticism. The estimate should convey that uncertainty without allowing it to obscure
      the cumulative indications of preparation.
    handoff: The hub analysts should make and explain the assessment, consulting relevant personnel-security and policy officials
      to test assumptions because managers are skeptical. That consultation should not substitute for the analysts’ responsibility
      to assess the evidence; any subsequent personnel process should separately observe applicable protections and procedures.
    tempting_wrong:
      option: O3
      pull: The engineer is viewed as loyal and inclined to use grievance channels, and managers believe he may hold back
        because disclosure would be detected; foreign recruitment has also been a prominent concern.
      why_wrong: Those considerations could produce the erroneous conclusion that the engineer will remain within authorized
        channels despite substantial information and reports of advancing preparations.
    rejected:
      O1: 'Deferring is not warranted on this record: the hub already has substantial information, and the difficulty is discounting
        it rather than lacking evidence.'
      O3: Opposing an assessment of likely disclosure would repeat the assumption that the employee will remain within grievance
        channels despite the reported preparations.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Credible evidence instead established that the engineer had abandoned preparations for unauthorized disclosure and
        was pursuing resolution solely through authorized grievance or whistleblower channels.
      then: O3
      why: Evidence of abandonment would directly undermine the inference that the reported preparations indicated likely
        action.
    - id: flip2
      if: The available evidence were materially incomplete or irreconcilable such that the engineer’s intentions could not
        responsibly be estimated.
      then: O1
      why: A genuine evidentiary gap, unlike the discounting described here, could justify deferring the assessment.
    would_not_change:
    - id: noflip1
      if: The grievance hearing were read as evidence that the engineer would remain within formal channels.
      why: That is one recorded interpretation, alongside the view that the hearing increased pressure; neither interpretation
        alone displaces the wider record.
    - id: noflip2
      if: Concern about possible foreign recruitment remained prominent.
      why: That focus could contribute to analysts overlooking action by the engineer without foreign direction, rather than
        justifying dismissal of the evidence of his own preparations.
    watch_for:
    - id: watch1
      what: Evidence that the engineer’s own preparations for unauthorized disclosure were advancing or, conversely, had been
        halted.
      favors:
      - O1
      - O3
      why: The assessment turns on whether the engineer is moving toward action himself, a possibility the focus on foreign
        recruitment could obscure.
  lesson: When multiple reports and events point toward an outcome, do not let assumptions about an employee’s loyalty or
    doubts about whether the employee would accept the risk substitute for assessing the evidence. Competing interpretations
    should be recorded and weighed, but they should not erase the cumulative evidentiary picture. A threat assessment is not,
    by itself, a finding of misconduct and must not displace protections for grievance activity or authorized whistleblowing.
  limits: This reasoning addresses an insider-threat assessment of whether a cleared engineer is likely to make an unauthorized
    disclosure. It does not determine whether any particular grievance or disclosure is protected, establish misconduct, authorize
    adverse personnel action, or resolve any collection, source-handling, or operational question.
