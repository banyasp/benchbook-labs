case:
  id: DR-XFER-CORPUS-CHILCOT-NX-249d4566-E44-A@v1
  title: Care after a Radiological Accident
  status: draft
  setting: North Aster Base, Lydora, 18 June 2024, Department of Defence
  decider: The senior department official who requested the advice
  agent: The senior department official who requested the advice
  agent_role: decide
  situation: A radiological accident at an overseas base has exposed service members, department civilian technicians, and
    two accredited visiting journalists. The senior department official has urgently requested advice on casualty arrangements
    for the three groups. The technicians maintain the base's nuclear-safety systems and work in direct support of the mission.
    The proposal is to evacuate and treat them alongside service members, with travel for their families to the hospital if
    their families wish. The journalists would be evacuated and treated without family travel. One casualty policy covers
    all three groups.
  question: What should the senior department official do about the proposed evacuation, treatment, and family-travel arrangements
    for department civilian technicians and accredited visiting journalists?
  options:
    O1:
      do: The senior department official approves the proposed arrangements, evacuating and treating department civilian technicians
        alongside service members and allowing their families to travel to the hospital if they wish, while evacuating and
        treating accredited visiting journalists without family travel.
      move: act
      irreversible: false
    O2:
      do: The senior department official rejects the proposed arrangements and adopts the same evacuation, treatment, and
        conditional family-travel arrangements for department civilian technicians and accredited visiting journalists.
      move: act
      irreversible: false
    O3:
      do: The senior department official asks the Department Personnel Director for further advice on civilian technician
        casualty arrangements before making a policy decision.
      move: ask
      irreversible: false
      to: The Department Personnel Director
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The senior department official urgently requested advice on casualty arrangements following a radiological accident
      at an overseas base.
  - id: F2
    kind: authority
    status: confirmed
    fact: The applicable casualty policy covers service members, department civilian technicians, and accredited visiting
      journalists.
  - id: F3
    kind: situation
    status: confirmed
    fact: The department civilian technicians maintain the base's nuclear-safety systems and work in direct support of the
      mission.
  - id: F4
    kind: situation
    status: confirmed
    fact: The proposal is to evacuate and treat the technicians alongside service members and to provide travel to the hospital
      for their families if the families wish.
  - id: F5
    kind: situation
    status: assessed
    fact: The Department Personnel Director assessed that offering the technicians' families less could cause offence.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposal is to evacuate and treat the accredited visiting journalists without providing family travel.
  - id: F7
    kind: situation
    status: confirmed
    fact: The accident exposed service members, department civilian technicians, and two accredited visiting journalists.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: policy_compliance
    favors:
    - O1
    weight: strong
    why: The proposal treats department civilian technicians alongside service members, consistent with the common casualty
      policy, and their direct support to the mission is the stated basis for that treatment.
  - id: C2
    facts:
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Providing technicians' families with the same conditional travel arrangement avoids offering them less in a way that
      might cause offence.
  - id: C3
    facts:
    - F2
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The proposal distinguishes accredited journalists from department civilian technicians by providing for their evacuation
      and treatment without family travel; the record states this distinction but gives no separate rationale for it.
  reasoning:
    read: 'This is an administrative decision about evacuation, treatment, and family travel after a radiological accident,
      not a decision about the accident''s cause or technical response. The casualty policy covers all three groups, but the
      proposed arrangements are not identical: department civilian technicians directly support the mission, while accredited
      visiting journalists have a more limited family-travel arrangement.'
    weighing: 'The stated reasons support approving the proposal: department civilian technicians directly support the mission,
      and offering their families less could cause offence. The record states that accredited journalists would be evacuated
      and treated without family travel, but gives no further reason for that limit. The balance favors {O3}, while the journalist
      distinction should not be given a rationale the record does not provide.'
    tradecraft: Record the arrangements separately by group, preserve the family-choice condition for travel to the hospital
      for technicians' families, and make clear that the journalist arrangement does not include family travel. These are
      implementation safeguards, not additional reasons for the decision.
    uncertainty: The record does not explain why accredited journalists would receive no family travel, or whether their families'
      wishes were considered. It does establish the proposed arrangements.
    handoff: The senior department official who requested advice made the decision after receiving the Personnel Director's
      advice; no further referral is indicated.
    tempting_wrong:
      option: O2
      pull: It may seem fairer to give both groups identical arrangements, including family travel.
      why_wrong: The proposed approach distinguishes department civilian technicians, who directly support the mission, from
        accredited journalists; extending the technicians' family-travel arrangement to journalists would reject that proposed
        distinction without a stated basis.
    rejected:
      O2: It was not chosen because the proposal gives accredited journalists a different arrangement from department civilian
        technicians by excluding family travel.
      O3: It was not chosen because the Personnel Director had provided the requested advice and the senior official approved
        the proposals.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Department civilian technicians did not work in direct support of the mission.
      then: O3
      why: The stated basis for treating department civilian technicians alongside service members would no longer be established,
        making further advice appropriate before deciding on parity.
    would_not_change:
    - id: noflip1
      if: A department civilian technician's family did not wish to travel to the hospital.
      why: The proposed arrangement already makes family travel conditional on the family's wish, so this would not require
        rejecting the arrangements.
    watch_for:
    - id: watch1
      what: Whether the families of department civilian technicians wish to travel to the hospital.
      favors:
      - O3
      why: Their wishes determine whether the conditional family travel in the approved arrangement is provided.
  lesson: When deciding how to care for people affected by an accident, distinguish the groups' roles and apply the stated
    policy consistently where the record gives a basis for doing so. Attend to foreseeable effects on families, while not
    inventing a justification for distinctions the decision record leaves unexplained.
  limits: This reasoning concerns the stated evacuation, treatment, and family-travel arrangements in this particular department
    decision. It does not establish a general rule that accredited journalists should never receive family travel or that
    every civilian casualty must be handled like a service-member casualty.
