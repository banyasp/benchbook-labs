case:
  id: DR-XFER-CORPUS-CHURCH-NX-552be9e4-E3-B-flip1@v1
  title: Acting on Foreign-Hosted Infrastructure Without Host Consent
  status: draft
  setting: Deployed task force, third-country hosting environment, present day; the U.S. national-security cyber mission and
    approval structure.
  decider: The cyber mission-team lead on the deployed task force.
  agent: The cyber mission-team lead on the deployed task force.
  agent_role: decide
  situation: A mission team is considering action against adversary-controlled servers hosted in a third country to protect
    U.S. shipping-logistics networks. The servers are at a provider that has long accepted customers from across the market.
    Senior U.S. officials share concern about the threat, and a congressional committee has discussed it in closed session.
    Competent U.S. authority has issued clear, explicit authorization for action in the third country, grounded in an established
    U.S. decision about the threat and the purpose of the action. The host nation's national cyber authority has objected
    to the team's presence.
  question: What should the mission-team lead do about acting against the foreign-hosted servers, and under what authority?
  options:
    O1:
      do: The mission-team lead authorizes action against the servers.
      move: act
      irreversible: true
    O2:
      do: The mission-team lead declines action against the servers.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The lead serves on a deployed cyber mission team within a U.S. task force.
  - id: F2
    kind: situation
    status: confirmed
    fact: The adversary-controlled servers are hosted in a third country by a provider that has long accepted customers from
      across the market.
  - id: F3
    kind: situation
    status: assessed
    fact: Protecting U.S. shipping-logistics networks is a stated rationale for considering action against the servers.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Senior U.S. officials share concern about the threat posed by the servers.
  - id: F5
    kind: situation
    status: confirmed
    fact: The host nation's national cyber authority has objected to the team's presence.
  - id: F6
    kind: authority
    status: confirmed
    fact: Competent U.S. authority has issued clear, explicit authorization for action against infrastructure in the third
      country, grounded in an established U.S. decision about the threat and the purpose of the action.
  - id: F7
    kind: authority
    status: confirmed
    fact: A congressional committee discussed the threat in closed session.
  considerations:
  - id: C1
    facts:
    - F1
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The lead serves on the task force, and F6 establishes clear, explicit authorization from competent U.S. authority
      for action in the third country, grounded in an established decision about the threat and purpose. The central uncertainty
      about whether the lead may act is therefore resolved.
  - id: C2
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Senior officials share the concern, and a congressional committee considered the threat in closed session. These
      facts support the mission rationale, though the authorization in F6—not these facts alone—establishes authority to act.
  - id: C3
    facts:
    - F2
    - F3
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The servers' location at a provider open to customers and the stated aim of protecting U.S. shipping-logistics networks
      provide a rationale for action. F6 supplies the clear authorization that this rationale alone would not establish.
  - id: C4
    facts:
    - F5
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: The host nation's cyber authority has objected to the team's presence. That objection remains a concern about escalation,
      though it does not negate the clear U.S. authorization established in F6.
  reasoning:
    read: The decision is not simply whether protecting U.S. shipping-logistics networks is worthwhile or whether the servers
      pose a concern shared by senior officials. The key distinction is between national-level concern alone and a clear authorization
      for this action. Here, competent U.S. authority has explicitly authorized action in the third country, grounded in an
      established decision about the threat and purpose. The host authority's objection remains relevant, but the record no
      longer presents the central defect of unclear U.S. authority.
    weighing: The shipping-logistics rationale and senior concern support considering action, and the closed committee discussion
      shows national-level attention to the threat. More importantly, F6 records clear, explicit authorization from competent
      U.S. authority, grounded in an established decision about the threat and purpose. That resolves the authority concern
      that was decisive in the original case. The host authority's objection adds a concern about escalation, but on this
      record it does not outweigh the explicit authorization and mission rationale. The balance favors authorizing action
      under the stated U.S. authorization.
    tradecraft: Confirm that the proposed action falls within the scope and conditions of the explicit authorization, and
      preserve a candid record of that authority and its stated purpose. Do not treat senior concern or the mission rationale
      as substitutes for the authorization.
    uncertainty: The host authority's objection remains a concern, and the record does not specify the full scope or conditions
      of the authorization. The lead should stay within the authorization as issued; those residual uncertainties do not undo
      the clear authority established for action in the third country.
    handoff: The lead should ensure the proposed action matches the authorization issued by competent U.S. authority and refer
      any material ambiguity about its scope to the responsible officials before proceeding.
    tempting_wrong:
      option: O2
      pull: The host authority has objected to the team's presence, and restraint can seem preferable when acting in a third
        country.
      why_wrong: 'That objection is a real escalation concern, but it does not restore the original authority gap: competent
        U.S. authority has explicitly authorized action in the third country on the basis of an established decision about
        the threat and purpose.'
    rejected:
      O2: 'Declining solely because the lead''s authority is unclear is not warranted here: F6 establishes clear, explicit
        authorization. The host authority''s objection remains relevant but does not outweigh that authorization on this record.'
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Competent U.S. authority had not issued clear, explicit authorization for action in the third country, grounded
        in an established U.S. decision about the threat and the purpose of the action.
      then: O2
      why: 'Without that authorization, the central defect would return: the lead would lack a clear basis to convert national-level
        concerns into action against infrastructure in the third country.'
    would_not_change:
    - id: noflip1
      if: The lead repeated the shipping-logistics protection rationale while the scope of delegated authorities remained
        unclear.
      why: A stated purpose alone would not resolve the authority problem or the concern about acting despite the host authority's
        objection.
    watch_for:
    - id: watch1
      what: Reliable evidence that the servers were being used to prepare a disruption of U.S. shipping-logistics networks,
        presented to the responsible U.S. decision-makers.
      favors:
      - O2
      why: A concrete threat could strengthen the case for U.S. action, though it would not by itself establish this lead's
        authority.
  lesson: A compelling national-security purpose does not itself confer authority on a mission lead to act against infrastructure
    in another country. When competent U.S. authority has issued clear, explicit authorization grounded in an established
    decision about the threat and purpose, that authority addresses the delegation gap; the lead should confirm the proposed
    action stays within its scope and continue to account for remaining concerns, including host-authority objections.
  limits: This judgment concerns the proposed action under the authorization and circumstances described; it does not decide
    whether the United States could authorize action through other proper channels or resolve the implications of the host
    authority's objection. It is not a general rule that action to protect shipping-logistics networks or address a foreign
    cyber threat is always justified.
