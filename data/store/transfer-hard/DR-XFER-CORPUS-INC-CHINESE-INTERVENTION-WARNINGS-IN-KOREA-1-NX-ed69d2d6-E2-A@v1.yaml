case:
  id: DR-XFER-CORPUS-INC-CHINESE-INTERVENTION-WARNINGS-IN-KOREA-1-NX-ed69d2d6-E2-A@v1
  title: Protective Service After an Attack on a Federal Facility
  status: draft
  setting: Days following an attack on a federal courthouse in the United States, Department of Homeland Security and Federal
    Protective Service leadership
  decider: The Secretary of Homeland Security
  agent: The Secretary of Homeland Security
  agent_role: decide
  situation: An attack on a federal courthouse killed several employees. The incident was widely regarded as a protective
    failure, and blame fell on the Federal Protective Service as the agency responsible for the building. The service's director
    says a bulletin warning of a heightened threat to federal facilities had been sent to all regional offices two weeks earlier.
    The bulletin named no facility, time, or specific warning. The Secretary is considering what to do about the director.
  question: What should the Secretary of Homeland Security do about the Federal Protective Service director after the courthouse
    attack?
  options:
    O1:
      do: The Secretary replaces the incumbent as director.
      move: act
      irreversible: true
    O2:
      do: The Secretary retains the incumbent as director.
      move: act
      irreversible: false
    O3:
      do: The Secretary defers the director decision until the after-action review.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An attack on a federal courthouse killed several employees.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The courthouse attack was widely regarded as a protective failure.
  - id: F3
    kind: situation
    status: assessed
    fact: The Federal Protective Service bore blame because it was responsible for the courthouse.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The director said a bulletin warning of a heightened threat to federal facilities had been sent to all regional
      offices two weeks before the attack.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The bulletin named no facility or time and gave no specific warning.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Secretary of Homeland Security has authority to determine whether the Federal Protective Service director remains
      in office.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The attack was widely regarded as a protective failure, and the service bore blame in its role as the agency responsible
      for the courthouse; the Secretary treated leadership change as a necessary first step toward reform.
  - id: C2
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: 'The director''s claim that a bulletin had been sent did not resolve the central deficiency: it lacked a specific
      warning about a facility or time.'
  - id: C3
    facts:
    - F2
    - F3
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: Replacing the director was treated as an initial reform measure in response to the perceived failure and the bulletin's
      lack of specificity, rather than leaving leadership unchanged.
  reasoning:
    read: This is a leadership and reform decision following a perceived protective failure. The trap is to treat the director's
      claim that a bulletin was sent as equivalent to a specific warning that could identify a facility or time; the record
      distinguishes between the two.
    weighing: The perceived failure and the service's responsibility for the courthouse weigh toward a leadership change {C1}.
      The director's claim that a bulletin was sent is relevant, but its lack of a specific warning remained the stated reason
      for changing leadership {C2}. The Secretary judged a change in leadership to be a necessary first step toward reform
      {C3}, favoring {O3}.
    tradecraft: Record the decision as a leadership response to the bulletin's lack of specificity, and distinguish the director's
      assertion that a bulletin was sent from the assessment that it did not provide a specific warning. Do not attribute
      later reforms by a successor as reasons for this decision.
    uncertainty: The record gives the stated rationale but does not establish what further information was considered about
      the bulletin or describe a formal comparison of the alternatives.
    handoff: The Secretary makes the leadership decision. The record identifies no required referral or separate approval
      authority.
    tempting_wrong:
      option: O2
      pull: Retaining the director could seem justified by the claim that regional offices had been warned.
      why_wrong: The bulletin named no facility or time and gave no specific warning, and the record identifies that deficiency
        as the reason leadership change was needed.
    rejected:
      O3: Deferring would postpone the leadership change the Secretary judged necessary as a first step toward reform.
      O2: Retaining the director would leave leadership unchanged despite the absence of a specific warning.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The available bulletin had identified a facility and time and provided a specific warning.
      then: O2
      why: That would remove the stated deficiency that prompted the Secretary to change leadership, making retention a plausible
        alternative.
    would_not_change:
    - id: noflip1
      if: The director repeated the claim that a bulletin had been sent, while the bulletin still lacked a specific warning
        about a facility or time.
      why: The claim alone would not address the deficiency the Secretary cited as the reason for changing leadership.
    watch_for: []
  lesson: A claim that a warning was issued does not settle whether it was sufficiently specific to guide protective action.
    When the stated concern is a failure of institutional performance, leadership change may be chosen as an initial reform
    measure.
  limits: This reasoning concerns the Secretary's response to a perceived protective failure and the stated lack of specificity
    in a bulletin. It does not establish that leadership change is generally required after protective failures or address
    a successor's later reforms.
  library:
    domain: homeland security
    family: XFER-CORPUS-INC-CHINESE-INTERVENTION-WARNINGS-IN-KOREA-1
    source: transfer of DR-CORPUS-INC-CHINESE-INTERVENTION-WARNINGS-IN-KOREA-1-NX-ed69d2d6-E2@v1
    episode_focus: The President chose a change in agency leadership rather than leaving the incumbent in place, as a first
      step toward reform. The stated rationale was the absence of a definitive prediction and clear warning, despite the incumbent’s
      claim that warnings had been given; exclude the successor’s later operational reforms.
    equities: pilot2
