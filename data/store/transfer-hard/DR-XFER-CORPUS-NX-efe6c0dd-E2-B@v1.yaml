case:
  id: DR-XFER-CORPUS-NX-efe6c0dd-E2-B@v1
  title: Adversary Stakes in Chip Suppliers
  status: draft
  setting: A department supply-chain risk council reviewing second-tier microelectronics suppliers in the United States, current
    period
  decider: The supply-chain risk council chair
  agent: The supply-chain risk council chair
  agent_role: decide
  situation: The services disagree about whether an adversary's stakes in second-tier microelectronics suppliers are aimed
    at leverage, technology, or market share. Information about supplier ownership is sparse. One service holds an extensive
    list of suspect suppliers, but the supporting data has not been made available to the council's review committee. Fewer
    than a dozen analysts work the issue, and adding more is not expected to improve progress within a year. Some supplier
    records are subject to nondisclosure terms, and the council chair must decide how the agencies should review the evidence.
  question: What should the council chair do about interservice evidence sharing and review of adversary stakes in second-tier
    microelectronics suppliers?
  options:
    O1:
      do: The council chair directs the services to withhold their evidence and continue separate assessments of the issue.
      move: act
      irreversible: false
    O2:
      do: The council chair directs the services to disclose their evidence through temporary working groups conducting a
        coordinated highest-priority review.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The services disagree about whether an adversary's stakes in second-tier microelectronics suppliers are aimed at
      leverage, technology, or market share.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Information about adversary interests and supplier ownership is sparse.
  - id: F3
    kind: capability
    status: assessed
    fact: Fewer than a dozen analysts across the participating services work on the supplier-risk issue.
  - id: F4
    kind: capability
    status: assessed
    fact: The current analytic effort has been staffed at roughly its present level during the preceding year.
  - id: F5
    kind: capability
    status: assessed
    fact: Competing supply-chain priorities and the complexity of tracing supplier ownership make systematic review of all
      available records difficult.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Adding analysts is not expected to materially improve progress on the issue within a year.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: One service holds an extensive list of suspect second-tier microelectronics suppliers, and the supporting data has
      not been made available to the council's review committee.
  - id: F8
    kind: authority
    status: confirmed
    fact: Some supplier records are covered by nondisclosure terms in vendor agreements.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The services disagree about the adversary's aims while information about interests and ownership is sparse. A coordinated
      review could compare their assessments against the evidence rather than leave the differences unresolved.
  - id: C2
    facts:
    - F7
    - F8
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The service's supporting data has not been made available to the committee, while some records are subject to nondisclosure
      terms. A review that provides for evidence sharing, with attention to applicable terms and authority, gives the committee
      a basis to examine the competing assessments.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    - F6
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Analytic staffing is limited, systematic review of available records is difficult, and adding analysts is not expected
      to materially improve near-term progress. A temporary, high-priority review uses existing analytic capacity rather than
      relying on staffing increases.
  - id: C4
    facts:
    - F1
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The council needs to address service differences about supplier risks despite the problem's complexity. Reexamining
      the evidence and resolving those differences becomes a highest-priority task.
  reasoning:
    read: 'This was not just a staffing problem: the services differed in their assessments, and evidence supporting one service''s
      supplier list was not available to the council''s committee. Nondisclosure terms also require attention in determining
      how records may be shared. The trap is to treat limited capacity or the presence of such terms as a reason to keep separate
      assessments, even though additional staffing was not expected to materially improve near-term progress.'
    weighing: The sparse information and disagreement favor a common evidence review {C1}, and the gap in evidence sharing
      makes that review especially important {C2}; applicable nondisclosure terms must be respected. Resource limits make
      a focused, temporary effort more practical than relying on a major increase in staff {C3}. Together, these considerations
      support the chair's choice to direct cooperation and make the review a highest-priority task {C4}. The choice depends
      on the services providing evidence through an authorized process so the committee can examine the differences.
    tradecraft: Direct the services to disclose their evidence through temporary working groups, give the council's committee
      a clear review mandate, and record the evidentiary basis and unresolved differences in the resulting assessment, subject
      to applicable authority and nondisclosure terms.
    uncertainty: Information about adversary interests and supplier ownership is sparse, and competing priorities and the
      problem's complexity make comprehensive review of all available records difficult. Nondisclosure terms may constrain
      how some records can be shared. The review could address differences in assessment, but the available information did
      not guarantee a definitive conclusion.
    handoff: The council chair should set the priority and require cooperation through an authorized review process; the committee
      and its temporary working groups should conduct the review, with the relevant services providing their evidence.
    tempting_wrong:
      option: O1
      pull: Separate assessments avoid the demands of coordinating services and may seem more manageable given limited analytic
        staffing and vendor nondisclosure terms.
      why_wrong: Withholding evidence would leave the committee unable to examine the material behind a major service's position
        and would not serve the council's aim of reexamining the evidence and resolving differences. Nondisclosure terms call
        for attention to applicable authority and handling, not an unexamined assumption that the evidence cannot be reviewed.
    rejected:
      O1: The chair did not choose continued separate assessments because the decision is to direct cooperation and a highest-priority
        coordinated review of the evidence.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: An applicable authority or binding nondisclosure term prohibited sharing the relevant supplier evidence across services
        and no authorized means of review were available.
      then: O1
      why: A coordinated disclosure would not be an available lawful option; the closest stated alternative would be to continue
        separate assessments.
    would_not_change:
    - id: noflip1
      if: Analytic staffing remained limited and adding analysts still was not expected to materially improve progress within
        a year.
      why: Those constraints do not remove the value of coordinating the evidence review through temporary working groups.
    watch_for:
    - id: watch1
      what: Whether the working groups can examine the evidence together and resolve the differences among service assessments.
      favors:
      - O1
      why: That is the purpose the council assigned to the coordinated reexamination.
  lesson: When services disagree and important supporting evidence has not been shared, require a coordinated review before
    accepting separate assessments as the endpoint. Where added staffing is not expected to improve progress, prioritize cooperation
    and focused use of existing analytic capacity, while checking that evidence sharing respects applicable authority and
    nondisclosure terms.
  limits: This reasoning concerns interservice analytic coordination under uncertainty; it does not determine the adversary's
    actual stakes in the suppliers. A legal or contractual restriction on disclosure could change what evidence-sharing course
    is available.
