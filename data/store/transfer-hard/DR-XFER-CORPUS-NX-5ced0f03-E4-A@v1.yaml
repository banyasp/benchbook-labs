case:
  id: DR-XFER-CORPUS-NX-5ced0f03-E4-A@v1
  title: Translation Support for a New Counterterrorism Center
  status: draft
  setting: Interagency transition planning for a new national counterterrorism center on the national security staff, with
    a proposed translation-support transfer date of 1 October.
  decider: The interagency transition authority
  agent: The interagency transition authority
  agent_role: decide
  situation: A new national counterterrorism center is absorbing a 24-hour threat-warning watch. Translators for the watch
    currently come from two other agencies under existing agreements. A working group's draft transition plan, which is awaiting
    signature, addresses continuity of the watch and the transfer of translation support. The draft says the operational baseline
    should not be disturbed and that the agreements should remain until the center can supply translators itself. One parent
    department does not concur and wants the center to take over translation support on 1 October, without giving a reason.
    The interagency transition authority must decide how to handle the agreements and the proposed transfer date.
  question: What should the interagency transition authority do about continuity of translation support and the transfer of
    that responsibility to the new counterterrorism center?
  options:
    O1:
      do: The interagency transition authority will replace the existing translation-support agreements with center responsibility
        on 1 October.
      move: act
      irreversible: false
    O2:
      do: The interagency transition authority will ask the center to confirm translation-support readiness before setting
        the transfer date.
      move: ask
      irreversible: false
      to: The new national counterterrorism center
    O3:
      do: The interagency transition authority will retain the existing translation-support agreements until the center can
        provide translators.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The new national counterterrorism center is absorbing a 24-hour threat-warning watch.
  - id: F2
    kind: situation
    status: confirmed
    fact: Translators for the watch currently come from two other agencies under existing agreements.
  - id: F3
    kind: situation
    status: confirmed
    fact: The working group's draft transition plan is awaiting signature.
  - id: F4
    kind: situation
    status: assessed
    fact: The draft transition plan says the watch's operational baseline should not be disturbed during the transition.
  - id: F5
    kind: situation
    status: assessed
    fact: The draft transition plan says the existing agreements should remain until the center can supply translators itself.
  - id: F6
    kind: situation
    status: assessed
    fact: One parent department wants the center to take over translation support on 1 October and gives no reason for that
      date.
  - id: F7
    kind: capability
    status: assessed
    fact: The materials before the transition authority do not establish whether the center can supply translators by 1 October.
  considerations:
  - id: C1
    facts:
    - F4
    equity: critical_services
    favors:
    - O3
    weight: strong
    why: The draft transition plan calls for preserving the watch's operational baseline during the transition.
  - id: C2
    facts:
    - F2
    - F5
    equity: critical_services
    favors:
    - O3
    weight: strong
    why: The draft's stated position is to keep the existing agency agreements until the center can supply the translators.
  - id: C3
    facts:
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: A parent department favors a specific transfer date of 1 October, but gives no further rationale for that date.
  reasoning:
    read: The decision is about continuity of translation support and when responsibility should transfer, not whether the
      center is absorbing the watch. The trap is treating the transition plan or general progress in establishing the center
      as proof that it can already supply the required translators.
    weighing: The draft's stated position favors preserving the baseline and retaining the existing agreements until the center
      can supply translators {C1} {C2}. The parent's proposed 1 October transfer is a recorded disagreement, but the materials
      do not establish that the center will be ready by then {C3}. The balance therefore depends on the center's ability to
      provide the translators, not the proposed date alone.
    tradecraft: Keep the existing agreements in place while the draft's stated condition remains unmet. Record the basis for
      any transfer date and the evidence that the center can supply the translators; do not treat general transition progress
      as proof of translation-support readiness.
    uncertainty: The materials do not specify how the center's ability to supply translators is to be assessed or give a date
      when that ability will be established.
    handoff: The interagency transition authority should decide the continuity and transfer policy. In applying the draft's
      stated condition, it would need to establish with the center whether and when the center can supply the translators.
    tempting_wrong:
      option: O1
      pull: A parent department explicitly proposes 1 October as the translation-support transfer date.
      why_wrong: That is the parent's dissenting position; the draft's stated position is to retain the existing agreements
        until the center can supply translators, and the materials do not establish readiness on that date.
    rejected:
      O1: The draft's stated position favors retaining current support until the center can supply translators, rather than
        transferring responsibility on the parent's proposed date.
      O2: The draft's stated course is to retain current support until the center can supply translators, rather than make
        a separate deferral decision about when to set the date.
  verdict:
    choice: O3
    basis: contested
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The center is able to supply the relevant translation-support services by 1 October.
      then: O1
      why: The draft's stated basis for retaining current agreements lasts until the center can supply the translators; readiness
        by the proposed date would remove that basis for retaining them past that point.
    would_not_change:
    - id: noflip1
      if: The transition of the watch proceeds, but the center's ability to supply translators has not been established.
      why: Progress in the transition supports planning but does not, by itself, satisfy the stated condition for ending the
        existing agreements.
    watch_for:
    - id: watch1
      what: Whether the center can supply the translation support currently covered by the existing agreements.
      favors:
      - O1
      why: The draft's stated position makes the center's ability to supply translators the condition for ending the current
        agreements.
  lesson: During a transition, preserve existing support when the stated policy is to avoid disturbing the operational baseline
    and the successor has not yet been established as able to provide the service. A proposed transfer date is not a substitute
    for the stated readiness condition.
  limits: This reasoning addresses continuity of translation support for the watch and the timing of responsibility transfer
    to the new counterterrorism center. It does not establish readiness criteria or decide how the translation services should
    be provided.
