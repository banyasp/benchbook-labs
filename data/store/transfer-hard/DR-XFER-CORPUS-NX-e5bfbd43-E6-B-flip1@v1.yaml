case:
  id: DR-XFER-CORPUS-NX-e5bfbd43-E6-B-flip1@v1
  title: A Hostile Service After Expulsions
  status: draft
  setting: North Atlantic partner capitals, the year following joint allied expulsions; an adversary-behavior assessment of
    a rival intelligence service.
  decider: The rival intelligence service’s leaders
  agent: The rival intelligence service’s leaders
  agent_role: decide
  situation: The rival service’s leaders seek to preserve and expand their recruitment efforts while retaining the initiative
    in intelligence competition. After a joint allied expulsion of the service’s officers, the leaders face decisions about
    their posture over the next year. Their near-term objectives include heading off a wider second round of expulsions, blocking
    common visa limits, and splitting the United States from its partners. The service varies its methods and supports diaspora
    front groups. Its leaders have previously retaliated harshly when they judged retaliation likely to pay. For the coming
    year, they judge that aggressive retaliation will bring increased returns, and the assessment considers several possible
    post-expulsion postures.
  question: What should the rival intelligence service’s leaders do about the service’s posture over the next year?
  options:
    O1:
      do: The rival intelligence service’s leaders should adopt a low-profile, conciliatory posture.
      move: act
      irreversible: false
    O2:
      do: The rival intelligence service’s leaders should adopt an aggressive retaliatory posture.
      move: act
      irreversible: false
    O3:
      do: The rival intelligence service’s leaders should maintain quiet conduct while carrying out selective retaliatory
        expulsions.
      move: partial
      irreversible: false
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: The rival service is assessed to seek opportunities to expand its recruitment efforts.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The service’s leaders are assessed to seek the initiative in intelligence competition and to capitalize on successes.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Near-term objectives include preventing a wider second round of allied expulsions, blocking common visa limits,
      and separating the United States from its partners.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The service is assessed to vary its methods and time its actions to exploit situations its leaders judge favorable.
  - id: F5
    kind: intelligence
    status: assessed
    fact: For the coming year, the principal assessment judges that the service’s leaders regard a generally low-profile,
      conciliatory posture as useful to their objectives.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The assessed purposes of a low-profile posture include reducing allied concern, weakening support for common restrictions,
      and undermining U.S. efforts to coordinate policy with partners.
  - id: F7
    kind: intelligence
    status: assessed
    fact: The service is assessed to continue supporting diaspora front groups.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The service’s leaders have previously used harsh retaliation when they judged that retaliation would bring worthwhile
      returns.
  - id: F9
    kind: intelligence
    status: assessed
    fact: The low-profile posture is not assessed to indicate a change in the service’s recruitment aims or to involve substantial
      concessions.
  - id: F10
    kind: intelligence
    status: assessed
    fact: A partner counterintelligence service’s assessment differs from the principal assessment on whether the rival service’s
      leaders would accept the risk of a broader reciprocal expulsion cycle when they expect retaliation to protect the service’s
      position.
  - id: F11
    kind: intelligence
    status: assessed
    fact: For the coming year, the service’s leaders judge that aggressive retaliation will bring increased returns.
  considerations:
  - id: C1
    facts:
    - F3
    - F5
    - F6
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: A low-profile, conciliatory posture is assessed to serve the service’s stated objectives by reducing allied concern,
      weakening support for common restrictions, and undermining U.S. coordination with partners.
  - id: C2
    facts:
    - F1
    - F2
    - F9
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Conciliation would be tactical rather than a renunciation of recruitment aims or the effort to retain initiative;
      the posture does not indicate changed basic objectives or substantial concessions.
  - id: C3
    facts:
    - F5
    - F8
    - F11
    equity: escalation_control
    favors:
    - O2
    weight: strong
    why: Although the principal assessment regards a low-profile posture as useful, the leaders currently judge that aggressive
      retaliation will bring increased returns, consistent with their past willingness to retaliate harshly when they expect
      worthwhile returns.
  - id: C4
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O3
    weight: weak
    why: Varied methods and continued support for diaspora front groups make a combined approach plausible, but do not establish
      that selective retaliation is preferable to the aggressive posture the leaders currently judge will bring increased
      returns.
  reasoning:
    read: The service’s underlying objectives remain distinct from its posture, but the leaders’ current judgment about the
      returns from aggressive retaliation changes which posture they are assessed to favor. The trap is to treat the principal
      assessment’s preference for low-profile conduct as controlling despite the stated change in the leaders’ expected returns.
    weighing: A low-profile, conciliatory posture is assessed to advance the service’s near-term objectives by reducing allied
      concern and weakening support for common restrictions {C1}; recruitment aims remain, and conciliation would involve
      no substantial concessions {C2}. Those considerations still make O1 plausible. However, the leaders now judge that aggressive
      retaliation will bring increased returns, and their history of harsh retaliation when they expect worthwhile returns
      supports treating that judgment as consequential for the coming year {C3}. Varied methods and continued support for
      diaspora front groups make O3 plausible, but do not displace the current judgment favoring aggressive retaliation {C4}.
      A partner counterintelligence service’s assessment differs from the principal assessment about whether the leaders would
      accept the risk of a broader reciprocal expulsion cycle when they expect retaliation to protect the service’s position.
      That disagreement qualifies the escalation-risk assessment, without negating the leaders’ stated judgment about returns.
    tradecraft: Keep the one-year time horizon and the distinction between overall posture and other ongoing service policies
      explicit. Record the leaders’ current judgment about returns, the principal assessment’s view of low-profile benefits,
      and the assumptions about escalation risk; reassess these judgments as circumstances change.
    uncertainty: The likely allied response over the coming year is uncertain. A partner counterintelligence service differs
      from the principal assessment on whether the rival service’s leaders might accept the risk of a broader reciprocal expulsion
      cycle when they expect retaliation to protect the service’s position.
    handoff: The decision rests with the rival service’s leaders; no referral or concurrence process is specified. As a decision
      practice, make the differing judgments about the risk of a broader expulsion cycle visible rather than presenting them
      as a single consensus.
    tempting_wrong:
      option: O1
      pull: The principal assessment judges a low-profile, conciliatory posture useful for reducing allied concern and weakening
        support for common restrictions.
      why_wrong: Those benefits remain relevant, but the leaders now judge that aggressive retaliation will bring increased
        returns. That current judgment, together with their past conditional willingness to retaliate harshly, supports O2
        for the coming year.
    rejected:
      O1: A low-profile posture remains useful for some stated objectives, but the leaders’ current judgment that aggressive
        retaliation will bring increased returns favors O2.
      O3: Varied methods and continued support for diaspora front groups make a combined approach plausible, but the assessment
        does not establish selective retaliation as preferable to the aggressive posture the leaders now judge will bring
        increased returns.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The service’s leaders do not judge that aggressive retaliation will bring increased returns.
      then: O1
      why: Without that judgment, the original assessment that a generally low-profile, conciliatory posture serves the leaders’
        objectives would again support the original choice.
    would_not_change:
    - id: noflip1
      if: The service’s leaders believe a retaliation cycle would cause severe damage to the service’s position or trigger
        a broad, coordinated round of allied measures.
      why: They would probably seek to avoid courses of action precipitating those consequences; this condition supports restraint
        rather than a more aggressive posture.
    watch_for:
    - id: watch1
      what: Whether the service’s leaders continue to judge that aggressive retaliation will bring increased returns.
      favors:
      - O2
      why: That judgment is the stated condition supporting aggressive retaliation; a change in it could restore the case
        for a low-profile posture.
  lesson: Distinguish enduring objectives from the posture leaders currently judge most likely to serve them. When leaders
    judge that aggressive retaliation will bring increased returns, that judgment can change the preferred posture, while
    remaining attentive to the risks and assumptions that could reverse it.
  limits: This is a restatement of a predictive intelligence judgment, not a legal authorization or an independent moral endorsement
    of the rival service’s objectives. Its one-year conclusion should not be extended beyond the identified time horizon or
    uncertainties.
