case:
  id: DR-XFER-CORPUS-NX-1eb08268-E7-B-flip1@v1
  title: Two Intrusion Sets in a Pipeline Operator
  status: draft
  setting: National Cyber Center incident room, Washington, D.C., 18 June 2025
  decider: The National Cyber Center incident lead
  agent: The National Cyber Center incident lead
  agent_role: decide
  situation: The National Cyber Center is coordinating with a pipeline operator after an adversary group was assessed to be
    inside the operator's business network. National cyber director guidance characterized the response as very important
    and said it must succeed. The group was assessed as seeking to connect with a second group, but a reliable reassessment
    removed the possibility that the two intrusion sets could pool access in the relevant period. A highest-precedence directive
    from the agency director authorizes coordinated action with the operator. The incident lead faces a time-sensitive decision,
    although the assessed access-pooling concern no longer applies in the relevant period.
  question: What should the incident lead do about the time-sensitive coordinated cyber-defense decision now that a reliable
    reassessment removed the possibility that the intrusion sets could pool access in the relevant period?
  options:
    O1:
      do: The incident lead declines immediate coordinated defensive action under the directive.
      move: act
      irreversible: false
    O2:
      do: The incident lead authorizes immediate coordinated defensive action under the directive.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: National cyber director guidance characterized the response as very important.
  - id: F2
    kind: situation
    status: confirmed
    fact: The guidance said the response must succeed.
  - id: F3
    kind: intelligence
    status: assessed
    fact: An adversary group was assessed to be inside the pipeline operator's business network.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The group was assessed as seeking to connect with a second group.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: A reliable reassessment removed the possibility that the two intrusion sets could pool access in the relevant period.
  - id: F6
    kind: authority
    status: confirmed
    fact: A coordinated-action directive was issued at 0215 on 18 June 2025.
  - id: F7
    kind: authority
    status: confirmed
    fact: The directive carried the highest stated precedence.
  - id: F8
    kind: authority
    status: confirmed
    fact: The directive was issued by the agency director.
  - id: F9
    kind: authority
    status: confirmed
    fact: The directive authorized coordinated action with the pipeline operator.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The response was characterized as very important, and the guidance said it must succeed. Those facts support the
      mission generally, but do not by themselves establish a need for immediate action.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: tempo
    favors:
    - O1
    weight: strong
    why: Although the group was assessed as seeking a connection, the reliable reassessment removed the possibility of pooling
      access in the relevant period. The timing concern that had supported immediate action is therefore absent.
  - id: C3
    facts:
    - F6
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The directive came from the agency director, carried the highest stated precedence, and authorized coordinated action
      with the operator. It provides applicable authority, but does not require immediate action.
  reasoning:
    read: The incident lead faces a time-sensitive decision, but a reliable reassessment has removed the possibility that
      the two intrusion sets could pool access in the relevant period. The group remains assessed to be inside the operator's
      network and seeking a connection; those facts do not restore the removed timing concern.
    weighing: The guidance gives weight to the response's importance and the requirement that it succeed, and the directive
      authorizes coordinated action. But neither establishes that immediate action is necessary. The original urgency depended
      on acting before the groups could pool access, and the reliable reassessment removes that possibility in the relevant
      period. The incident lead should therefore decline immediate coordinated defensive action under the directive.
    tradecraft: Keep the decision record focused on the reassessment, the absence of the previously assessed timing concern,
      and the directive's scope. Update the decision if the underlying assessment changes.
    uncertainty: The group's presence and its effort to connect with the second group remain assessed. The reliable reassessment
      concerns the possibility of pooling access in the relevant period and removes the timing rationale for immediate action.
    handoff: The incident lead makes the decision under a directive from the agency director; the source does not indicate
      that the choice was referred elsewhere.
    tempting_wrong:
      option: O2
      pull: Immediate action could seem warranted because the response was characterized as very important and the directive
        authorizes coordination.
      why_wrong: Those considerations support the mission and provide authority, but do not establish a need for immediate
        action. The timing concern that previously made delay consequential has been removed.
    rejected:
      O2: The incident lead declines immediate action because the reliable reassessment removed the possibility of pooling
        access in the relevant period, eliminating the stated urgency for acting before that event.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable reassessment did not remove the possibility that the two intrusion sets could pool access in the relevant
        period.
      then: O2
      why: If the pooling possibility remained, the original timing concern would again support immediate action before the
        groups could pool access.
    would_not_change:
    - id: noflip1
      if: The possibility that the intrusion sets will pool access remains assessed rather than confirmed.
      why: That uncertainty alone would not determine the choice; the relevant issue is whether the possibility remains current
        in the period at stake.
    watch_for:
    - id: watch1
      what: Whether the reliable reassessment remains current and whether the possibility and timing of the intrusion sets
        pooling access change.
      favors:
      - O2
      why: A renewed possibility of pooling access in the relevant period would restore the source's urgency for immediate
        action.
  lesson: When a cyber-defense decision turns on a time-sensitive assessed risk, reassess whether that risk remains current.
    The importance of a response and authority to act do not, on their own, establish that immediate action is necessary.
  limits: This reasoning applies to the source's access-pooling assessment and its stated directive, not to other responses
    or legal standards. It does not establish that delay is appropriate when the timing concern remains credible, or that
    urgency alone warrants action when authority or the underlying assessment is absent.
