case:
  id: DR-XFER-CORPUS-INC-CHINESE-INTERVENTION-WARNINGS-IN-KOREA-1-NX-ed69d2d6-E2-A-flip1@v1
  title: Protective Service After an Attack on a Federal Facility
  status: draft
  setting: Days following an attack on a federal courthouse in the United States, Department of Homeland Security and Federal
    Protective Service leadership
  decider: The Secretary of Homeland Security
  agent: The Secretary of Homeland Security
  agent_role: decide
  situation: An attack on a federal courthouse killed several employees. The incident was widely regarded as a protective
    failure, and blame fell on the Federal Protective Service as the agency responsible for the building. The service's director
    says a bulletin warning of a heightened threat to federal facilities had been sent to all regional offices two weeks earlier.
    The bulletin identified a facility and time and provided a specific warning. The Secretary is considering what to do about
    the director.
  question: What should the Secretary of Homeland Security do about the Federal Protective Service director after the courthouse
    attack?
  options:
    O1:
      do: The Secretary replaces the incumbent as director.
      move: act
      irreversible: true
    O2:
      do: The Secretary retains the incumbent as director.
      move: act
      irreversible: false
    O3:
      do: The Secretary defers the director decision until the after-action review.
      move: hold
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An attack on a federal courthouse killed several employees.
  - id: F2
    kind: intelligence
    status: assessed
    fact: The courthouse attack was widely regarded as a protective failure.
  - id: F3
    kind: situation
    status: assessed
    fact: The Federal Protective Service bore blame because it was responsible for the courthouse.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The director said a bulletin warning of a heightened threat to federal facilities had been sent to all regional
      offices two weeks before the attack.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The bulletin identified a facility and time and provided a specific warning.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Secretary of Homeland Security has authority to determine whether the Federal Protective Service director remains
      in office.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: The attack was widely regarded as a protective failure, and the service bore blame as the agency responsible for
      the courthouse. This supports accountability, though it does not by itself establish that replacing the director is
      necessary.
  - id: C2
    facts:
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O2
    weight: strong
    why: The director's account is that regional offices received a bulletin, and the available bulletin identified a facility
      and time and provided a specific warning. The stated deficiency that prompted leadership change is absent, making retention
      a plausible response.
  - id: C3
    facts:
    - F2
    - F3
    - F5
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The perceived failure and the service's responsibility still warrant scrutiny, but the bulletin's specificity weakens
      the case for replacing the director as an initial reform measure on the stated rationale.
  reasoning:
    read: This is a leadership and reform decision following a perceived protective failure. The key distinction is whether
      the bulletin merely announced a general heightened threat or provided a specific warning. Here, it identified a facility
      and time, removing the deficiency that was the stated reason for changing leadership.
    weighing: The perceived failure and the service's responsibility for the courthouse weigh toward a leadership change {C1}.
      But the available bulletin identified a facility and time and provided a specific warning, so the stated deficiency
      that prompted the Secretary to change leadership is absent {C2}. The failure still warrants scrutiny, but it does not
      on this record establish that replacing the director is necessary as an initial reform measure {C3}. Retaining the director
      is therefore the better-supported choice {O2}.
    tradecraft: Record the decision as a leadership response to the available facts about the bulletin. Distinguish the director's
      assertion that a bulletin was sent from the confirmed fact that the bulletin identified a facility and time and provided
      a specific warning. Do not attribute later reforms by a successor as reasons for this decision.
    uncertainty: The record gives the stated rationale but does not establish what further information was considered about
      the bulletin or describe a formal comparison of the alternatives.
    handoff: The Secretary makes the leadership decision. The record identifies no required referral or separate approval
      authority.
    tempting_wrong:
      option: O1
      pull: Replacing the director could seem justified by the attack, the service's responsibility, and the need to signal
        accountability.
      why_wrong: 'Those facts support scrutiny, but the stated deficiency prompting leadership change is not present: the
        available bulletin identified a facility and time and provided a specific warning.'
    rejected:
      O1: Replacing the director would treat leadership change as necessary despite the absence of the stated deficiency that
        prompted it; the perceived failure alone does not establish that this is the better choice.
      O3: Deferring would postpone the decision even though the stated basis for changing leadership has been removed and
        retention is supported by the available facts.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The available bulletin had not identified a facility and time or provided a specific warning.
      then: O1
      why: That would restore the stated deficiency that prompted the Secretary to change leadership, making the original
        choice to replace the incumbent better supported.
    would_not_change: []
    watch_for: []
  lesson: A claim that a warning was issued does not settle whether it was sufficiently specific to guide protective action.
    When the available bulletin was specific, that removes the stated deficiency prompting leadership change, although the
    broader perceived failure may still warrant scrutiny.
  limits: This reasoning concerns the Secretary's response to a perceived protective failure and the specificity of the available
    bulletin. It does not establish that retention is generally required after protective failures or address a successor's
    later reforms.
  library:
    domain: homeland security
    family: XFER-CORPUS-INC-CHINESE-INTERVENTION-WARNINGS-IN-KOREA-1
