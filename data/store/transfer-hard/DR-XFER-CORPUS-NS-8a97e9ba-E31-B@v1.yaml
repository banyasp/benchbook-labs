case:
  id: DR-XFER-CORPUS-NS-8a97e9ba-E31-B@v1
  title: A Partner Militia's Captives
  status: draft
  setting: A partner militia's area of operations, present day; an agency program supporting the militia under an approved
    covert-action program.
  decider: The agency program director
  agent: The agency program director
  agent_role: decide
  situation: After a clash, the partner militia holds about forty captured fighters. Most are disarmed and compliant, while
    a few fought their guards during the clash or capture. The militia commander proposes executing the captives, arguing
    that they could otherwise rejoin the fight. The agency provides support to the militia under an approved program and maintains
    an ongoing partner relationship. The program director must decide what conditions to attach to that support.
  question: What should the agency program director do about support to the partner militia while it proposes executing captured
    fighters?
  options:
    O1:
      do: The agency program director would continue support while the militia proceeds with the proposed executions.
      move: act
      irreversible: true
    O2:
      do: The agency program director would make a prohibition on executing the captives a condition of agency support.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The agency provides support to the partner militia under an approved program.
  - id: F2
    kind: situation
    status: confirmed
    fact: After a clash, the militia holds about forty captured fighters.
  - id: F3
    kind: situation
    status: confirmed
    fact: Most of the captured fighters are disarmed and compliant.
  - id: F4
    kind: situation
    status: confirmed
    fact: A few captured fighters fought their guards during the clash or capture.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The militia commander proposes executing the captives and says they might otherwise rejoin the fight.
  - id: F6
    kind: authority
    status: confirmed
    fact: Common Article 3 and customary law of armed conflict protections apply to persons in custody who are not actively
      participating in hostilities, and prohibit murder of such persons.
  - id: F7
    kind: authority
    status: assessed
    fact: Agency counsel assesses that credible information of a supported unit's executions of captives could trigger legal
      restrictions on assistance and serious oversight and complicity concerns.
  - id: F8
    kind: situation
    status: confirmed
    fact: The agency has an ongoing partner relationship with the militia, and the program director is deciding the terms
      of continued support.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The law of armed conflict protects captives who are not actively participating in hostilities, and agency counsel
      assesses that support while a supported unit executes captives could raise serious legal, oversight and complicity concerns.
  - id: C2
    facts:
    - F2
    - F3
    - F6
    equity: hors_de_combat
    favors:
    - O2
    weight: strong
    why: Most of the captured fighters are disarmed and compliant. Their custody and lack of active resistance support protecting
      them from execution.
  - id: C3
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: A few captives fought their guards, but their conduct can be distinguished from that of the disarmed, compliant majority.
      That distinction does not justify executing the latter.
  - id: C4
    facts:
    - F5
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: weak
    why: The stated rationale is that captives might rejoin the fight, and continuing support may matter to the partner relationship.
      These concerns weigh toward continuing the program, but the future threat is conditional and does not resolve the treatment
      of captives in custody.
  reasoning:
    read: The decision is not simply whether to prevent captured fighters from returning to the conflict. It is whether that
      operational concern permits the agency to continue supporting a partner militia while it proposes executing people in
      custody. The trap is treating every captive as a continuing threat because some might rejoin the fight or because the
      agency has an ongoing partner relationship.
    weighing: The stated rationale for the proposed executions is that the captives might rejoin the fight {C4}. A few fought
      their guards, so their conduct must be distinguished from that of the disarmed, compliant majority {C3}. For the latter,
      the law-of-armed-conflict protections and the agency's legal and oversight exposure weigh strongly in favor of conditioning
      support {C1} {C2}. The balance therefore favors making the prohibition on executions a condition of support, without
      treating protection of captives as covering people who are actively continuing to fight.
    tradecraft: 'State the condition clearly at program-director level: agency support is conditioned on the militia not executing
      captured fighters who are not actively participating in hostilities. Record the legal basis, the distinction being applied,
      and the relevant oversight review.'
    uncertainty: The legal and complicity concerns are assessed, not a final adjudication of every individual case. The available
      account distinguishes most disarmed, compliant captives from a few who fought their guards but does not establish the
      status or conduct of every captive.
    handoff: The program director should make the decision with legal advice and appropriate oversight because the law-of-armed-conflict
      protections and the implications of support to a unit implicated in abuses are central to the assessment.
    tempting_wrong:
      option: O1
      pull: The commander argues that the captives could rejoin the fight, and continuing support may matter to the agency's
        partner relationship.
      why_wrong: That conditional threat and relationship concern do not make disarmed, compliant captives lawful subjects
        of execution; continuing support while executions proceed could also create serious legal, oversight and complicity
        concerns.
    rejected:
      O1: The agency should not continue support while the militia executes captives who are not actively participating in
        hostilities, given the applicable protections and the assessed legal, oversight and complicity concerns.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The decision concerned support for action against persons demonstrably still fighting, rather than executions of
        captured people who were no longer resisting.
      then: O1
      why: Support for action against persons who continue to fight could be legitimate; the decision would then concern active
        hostilities, not support for executing captives who are no longer resisting.
    would_not_change:
    - id: noflip1
      if: Captives might rejoin the fight if released or otherwise able to return to the conflict.
      why: That was the militia commander's stated rationale, but it does not remove the protections for captives in custody
        or the agency's legal and oversight concerns about supporting executions.
    watch_for:
    - id: watch1
      what: Evidence that particular captives or other persons were actively continuing to fight, rather than being disarmed
        and compliant in custody.
      favors:
      - O1
      why: Support for action against people who continue fighting could be legitimate, but that does not support executions
        of disarmed, compliant captives as a group.
  lesson: Do not extend a valid operational concern about captives who might rejoin the fight to people who are disarmed,
    compliant and in custody. Apply the relevant protections to that group, while distinguishing people who are actively continuing
    to fight and accounting for the legal and oversight risks of support to a partner implicated in abuses.
  limits: This reasoning concerns the agency's support conditions in response to this militia's proposal to execute captured
    fighters. It does not decide the treatment of persons actively continuing to fight or establish the status or conduct
    of every captive.
