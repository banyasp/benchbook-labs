case:
  id: DR-XFER-CORPUS-NX-09fb3b9c-E2-B-flip1@v1
  title: Penetrated Linguist Contractor
  status: draft
  setting: An overseas command theater, during an active deployment; date unspecified.
  decider: The overseas command
  agent: The overseas command
  agent_role: decide
  situation: A newspaper reports that a foreign service penetrated a firm supplying linguists to an overseas command. The
    newspaper also reports that the command's own counterintelligence review confirmed undisclosed foreign contacts by two
    linguists working under the command's contract with the firm. A reliable subsequent assessment established that this reported
    confirmation was mistaken. The firm denies the allegations. Some security analysts doubt the account, and a partner-agency
    counterintelligence office describes the reporting as unsubstantiated. The command must decide whether to keep the firm
    under contract.
  question: What should the overseas command do about its linguist-supply contract with the firm?
  options:
    O1:
      do: The command should continue its contract with the firm.
      move: act
      irreversible: false
    O2:
      do: The command should end its contract with the firm.
      move: act
      irreversible: true
    O3:
      do: The command should ask an outside counterintelligence element for an assessment.
      move: ask
      irreversible: false
      to: an outside counterintelligence element
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A newspaper reported that a foreign service had penetrated the firm supplying linguists to the command.
  - id: F2
    kind: situation
    status: confirmed
    fact: The overseas command had a contract with the firm for linguist services.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The newspaper reported that the command's counterintelligence review confirmed undisclosed foreign contacts by two
      linguists working under the command's contract.
  - id: F4
    kind: situation
    status: confirmed
    fact: The firm denied the allegations.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Some security analysts expressed doubt about the newspaper's account.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A partner-agency counterintelligence office described the reporting as unsubstantiated.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: A reliable subsequent assessment established that the command's reported confirmation of undisclosed foreign contacts
      was mistaken.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: security_risk
    favors:
    - O1
    weight: weak
    why: The reported confirmation concerning linguists on the contract was established to be mistaken. The newspaper's broader
      report remains, but it no longer supplies the stated confirmed basis for ending this contract.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: strong
    why: The firm denied the allegations, analysts and a partner-agency counterintelligence office expressed skepticism, and
      a reliable subsequent assessment established that the command's reported confirmation was mistaken. Together, these
      facts weigh against ending the contract on the reported confirmation.
  - id: C3
    facts:
    - F3
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The reliable subsequent assessment resolves the specific discrepancy about the command's reported confirmation by
      establishing that it was mistaken. The account does not provide a comparable confirmed basis for ending the contract.
  reasoning:
    read: This is a contract decision amid a reported counterintelligence concern, but a reliable subsequent assessment established
      that the command's reported confirmation of foreign contacts was mistaken. The newspaper's broader report, the firm's
      denial, and the skeptical views remain part of the record.
    weighing: 'The reliable assessment materially weakens the central stated reason for ending the contract: the reported
      confirmation concerning linguists on the command''s contract was mistaken {C1} {C2}. The firm''s denial and the skeptical
      views are consistent with not treating the newspaper''s broader allegations as established, though they do not independently
      disprove them {C2}. Since the specific reported confirmation has been resolved and mistaken, continuing the contract
      is better supported than ending it or seeking another assessment on that already-resolved point {C3}.'
    tradecraft: 'Keep the decision and its record at the contract level: distinguish the newspaper''s account from the reliable
      subsequent assessment, and record the firm''s denial and skeptical views rather than presenting the broader allegations
      as settled fact. Revisit the contract decision if credible new evidence materially changes the assessment.'
    uncertainty: The reliable subsequent assessment establishes that the command's reported confirmation was mistaken, but
      the account does not resolve the newspaper's broader report or establish the nature or significance of any other concerns.
    handoff: The overseas command is the contract decision-maker. An outside counterintelligence assessment could be reasonable
      if new evidence reopens a material uncertainty, but the reliable subsequent assessment already resolves the reported
      confirmation addressed here.
    tempting_wrong:
      option: O2
      pull: End the contract because the newspaper reported both penetration of the firm and foreign contacts by linguists
        on the contract.
      why_wrong: The reliable subsequent assessment established that the command's reported confirmation of those contacts
        was mistaken. The broader newspaper report remains contested and, on the facts given, does not restore that confirmation
        as a basis for ending the contract.
    rejected:
      O2: Ending the contract would rely on the reported confirmation despite a reliable subsequent assessment establishing
        that it was mistaken.
      O3: Seeking another assessment could be reasonable if new evidence created a material unresolved question, but the reliable
        subsequent assessment already resolves the specific reported confirmation at issue.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable subsequent assessment did not establish that the command's reported confirmation was mistaken, and the
        reported confirmation remained reliable.
      then: O2
      why: If the reported confirmation remained reliable rather than being established as mistaken, the central stated reason
        supporting ending the contract would again carry substantial weight.
    would_not_change:
    - id: noflip1
      if: The firm continued to deny the allegations and the same skeptical views remained on record, while the reliable subsequent
        assessment continued to establish that the reported confirmation was mistaken.
      why: Those positions do not undo the reliable assessment establishing that the reported confirmation was mistaken.
    watch_for:
    - id: watch1
      what: Credible new evidence that materially changes the assessment of the reported foreign contacts or the newspaper's
        broader account.
      favors:
      - O1
      - O2
      - O3
      why: The current decision depends on the reliable assessment that the command's reported confirmation was mistaken,
        while the broader account remains unresolved.
  lesson: When a contractor is linked to a serious reported counterintelligence concern, distinguish the decision-maker's
    reported confirmation from the underlying account and assess reliable subsequent evidence. If that evidence establishes
    that the central confirmation was mistaken, continuing the contract can be justified despite the broader contested reporting;
    credible new evidence may change the decision.
  limits: The account gives no detailed explanation of the reported foreign contacts, the evidence underlying the newspaper's
    broader account, or the command's reasons for its contract decision. This reasoning should not be extended to a case where
    the reported confirmation remains reliable or where the contract decision is governed by additional constraints not stated
    here.
