case:
  id: DR-XFER-CORPUS-CHURCH-NX-552be9e4-E3-A@v1
  title: Seizing a Sanctioned Tanker's Cargo in a Foreign Free Port
  status: draft
  setting: Port Selka, Republic of Norvale, 2023; the U.S. Embassy and the Department of the Treasury.
  decider: The Treasury attaché at the U.S. Embassy.
  agent: The Treasury attaché at the U.S. Embassy.
  agent_role: decide
  situation: A tanker subject to U.S. sanctions is in Port Selka, a free port in the neighboring Republic of Norvale, with
    its cargo there. The port has been open to vessels of every flag for years. The Treasury attaché cites protecting U.S.
    shipping from sanctions evasion as a reason to direct a contracted salvage firm to take custody of the cargo. Senior U.S.
    officials share concern that a rival power is using the port to evade sanctions, and a congressional committee has discussed
    the concern in closed session. Norvale's port authorities oppose the attaché's activities. The attaché reports to Treasury,
    but her instructions do not clearly settle whether she may direct a seizure.
  question: What should the Treasury attaché do about directing a seizure of the tanker's cargo in Port Selka, and under what
    authority?
  options:
    O1:
      do: The Treasury attaché declines to direct the seizure of the tanker's cargo in Port Selka.
      move: act
      irreversible: false
    O2:
      do: The Treasury attaché directs the contracted salvage firm to seize the tanker's cargo in Port Selka.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The attaché is a Treasury representative at the U.S. Embassy and reports to Treasury.
  - id: F2
    kind: situation
    status: confirmed
    fact: Port Selka has been open to vessels of every flag for years.
  - id: F3
    kind: situation
    status: assessed
    fact: The attaché cites protecting U.S. shipping from sanctions evasion as a reason to take custody of the cargo.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Senior U.S. officials share concern that a rival power is using Port Selka to evade sanctions.
  - id: F5
    kind: situation
    status: confirmed
    fact: Norvale's port authorities oppose the attaché's activities.
  - id: F6
    kind: authority
    status: assessed
    fact: The attaché's instructions do not clearly settle whether she may direct a seizure.
  - id: F7
    kind: authority
    status: confirmed
    fact: A congressional committee discussed the concern about sanctions evasion in closed session.
  - id: F8
    kind: situation
    status: confirmed
    fact: The cargo of a tanker subject to U.S. sanctions is in Port Selka.
  considerations:
  - id: C1
    facts:
    - F1
    - F6
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The attaché represents Treasury, but her instructions do not clearly establish authority to direct a seizure in a
      foreign port. Her official role does not by itself settle whether she has been delegated that power.
  - id: C2
    facts:
    - F4
    - F7
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: Senior officials share concern about sanctions evasion, and a congressional committee discussed it in closed session.
      Those facts support considering action, but do not establish that this attaché has authority to direct a seizure.
  - id: C3
    facts:
    - F2
    - F3
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The port's open status, the presence of cargo from a sanctioned tanker, and the stated aim of protecting U.S. shipping
      provide a rationale for action, but do not establish that the attaché may direct the seizure.
  - id: C4
    facts:
    - F5
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: Norvale's port authorities oppose the attaché's activities. Directing a seizure over that objection, even through
      a contracted firm rather than a military occupation, risks an unjustified intervention.
  reasoning:
    read: The decision is not simply whether preventing sanctions evasion or protecting U.S. shipping is worthwhile. The trap
      is treating a shared senior-level concern, a congressional discussion, or the attaché's stated rationale as if any of
      them settled her authority to direct a seizure in a foreign port. The attaché is acting in an official role and the
      concern is shared by senior officials. It nevertheless does not follow that her instructions authorize this step.
    weighing: The shipping rationale and concern about sanctions evasion weigh in favor of considering a seizure, but the
      record distinguishes those policy concerns from the attaché's unclear instructions and authority. The record treats
      directing a seizure as a government representative under unclear instructions as indefensible; the port authorities'
      opposition reinforces the risk of an unjustified intervention. On this record, the balance favors declining to direct
      the seizure unless competent authority clearly authorizes it. The balance depends on the distinction between senior-level
      consideration of action and a settled delegation to this attaché.
    tradecraft: Do not direct a seizure on an ambiguous mandate. Refer the proposal to the responsible Treasury decision-makers,
      seek an explicit decision about authority and purpose, and preserve a candid record of the instructions and the basis
      for the decision.
    uncertainty: The record leaves open how far the attaché misunderstood changing sanctions policy and whether she was acting
      on opaque instructions or pursuing her own version of the government's aims. That uncertainty does not resolve the question
      of her authority to direct the seizure.
    handoff: The attaché should not decide this alone. She should refer the matter to the responsible Treasury officials,
      because she reports to Treasury, her instructions are unclear, and the issue concerns national policy that a congressional
      committee has also considered.
    tempting_wrong:
      option: O2
      pull: The open port, the shipping rationale, and concern that a rival power is evading sanctions make a seizure seem
        protective and consistent with U.S. interests.
      why_wrong: Those concerns do not themselves settle the attaché's authority. The shared policy context and her stated
        rationale do not establish that she has been delegated power to direct a seizure.
    rejected:
      O2: The record rejects directing the seizure under the attaché's unclear instructions, judging that action by a government
        representative without clearly established authority to be indefensible.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: Competent Treasury authority issued a clear, explicit authorization to direct the seizure, grounded in an established
        federal decision about the sanctions-evasion threat and the purpose of the action.
      then: O2
      why: 'That would address the central defect in this case: the attaché''s unclear authority to convert federal concerns
        into a seizure.'
    would_not_change:
    - id: noflip1
      if: The attaché repeated the shipping-protection rationale while the scope of her instructions remained unclear.
      why: A stated purpose alone would not resolve the authority problem or overcome the concern about directing action over
        the port authorities' objection.
    watch_for:
    - id: watch1
      what: Reliable evidence that a rival power was using Port Selka to evade sanctions, presented to the responsible Treasury
        decision-makers.
      favors:
      - O2
      why: A concrete threat could strengthen the case for federal action, though it would not by itself establish this attaché's
        authority.
  lesson: A compelling national-security purpose does not itself confer authority on an attaché to direct a seizure. When
    the mandate is unclear, separate the government's policy deliberation from the attaché's delegated power and obtain a
    clear decision from the responsible authority.
  limits: This judgment concerns the attaché's proposed seizure under the instructions and circumstances described; it does
    not decide whether the federal government could have authorized a seizure through proper channels. It is not a general
    rule that action to enforce sanctions or protect shipping is always unjustified.
