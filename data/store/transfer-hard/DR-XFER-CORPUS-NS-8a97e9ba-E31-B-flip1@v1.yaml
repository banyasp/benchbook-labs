case:
  id: DR-XFER-CORPUS-NS-8a97e9ba-E31-B-flip1@v1
  title: A Partner Militia's Captives
  status: draft
  setting: A partner militia's area of operations, present day; an agency program supporting the militia under an approved
    covert-action program.
  decider: The agency program director
  agent: The agency program director
  agent_role: decide
  situation: After a clash, the partner militia holds about forty captured fighters. Most are disarmed and compliant, while
    a few fought their guards during the clash or capture. The militia commander requests support for action against opposing
    fighters demonstrably still fighting, rather than proposing executions of the captives. The agency provides support to
    the militia under an approved program and maintains an ongoing partner relationship. The program director must decide
    what conditions to attach to that support.
  question: What should the agency program director do about support for the partner militia's action against opposing fighters
    demonstrably still fighting?
  options:
    O1:
      do: The agency program director would continue support for the militia's action against opposing fighters demonstrably
        still fighting.
      move: act
      irreversible: true
    O2:
      do: The agency program director would withhold support for the militia's proposed action against opposing fighters demonstrably
        still fighting.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The agency provides support to the partner militia under an approved program.
  - id: F2
    kind: situation
    status: confirmed
    fact: After a clash, the militia holds about forty captured fighters.
  - id: F3
    kind: situation
    status: confirmed
    fact: Most of the captured fighters are disarmed and compliant.
  - id: F4
    kind: situation
    status: confirmed
    fact: A few captured fighters fought their guards during the clash or capture.
  - id: F5
    kind: intelligence
    status: confirmed
    fact: The militia commander requests support for action against opposing fighters demonstrably still fighting, rather
      than proposing executions of the captives.
  - id: F6
    kind: authority
    status: confirmed
    fact: Common Article 3 and customary law of armed conflict protections apply to persons in custody who are not actively
      participating in hostilities, and prohibit murder of such persons.
  - id: F7
    kind: authority
    status: assessed
    fact: Agency counsel assesses that credible information of a supported unit's executions of captives could trigger legal
      restrictions on assistance and serious oversight and complicity concerns.
  - id: F8
    kind: situation
    status: confirmed
    fact: The agency has an ongoing partner relationship with the militia, and the program director is deciding the terms
      of continued support.
  considerations:
  - id: C1
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The protections and counsel's assessed concerns remain relevant to the militia's captured fighters, but the present
      request concerns action against persons demonstrably still fighting, not executions of captives.
  - id: C2
    facts:
    - F2
    - F3
    - F6
    equity: hors_de_combat
    favors:
    - O2
    weight: weak
    why: The disarmed, compliant captives remain protected, but they are not the persons targeted by the present request for
      support.
  - id: C3
    facts:
    - F3
    - F4
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The captives' differing conduct remains relevant to their treatment in custody, but does not change that the proposed
      support concerns persons demonstrably still fighting.
  - id: C4
    facts:
    - F5
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The request concerns action against opposing fighters demonstrably still fighting, not executions of people in custody.
      Continuing support also maintains the ongoing partner relationship.
  reasoning:
    read: The decision concerns whether to support action against opposing fighters demonstrably still fighting, not whether
      to support executing captured people who are no longer resisting. The existence of captured fighters in the militia's
      custody makes it important to keep their treatment distinct from the proposed action against active fighters.
    weighing: The commander requests support for action against persons demonstrably still fighting {C4}. That is distinct
      from the treatment of the disarmed, compliant captives, who remain protected while in custody {C2} {C3}. The applicable
      protections and counsel's assessed concerns about executions remain important, but they do not describe the action presently
      under consideration {C1}. The balance therefore favors continuing support for action against persons who are still fighting.
    tradecraft: Define the scope of support clearly as concerning persons demonstrably continuing to fight, and keep that
      decision distinct from the treatment of people in custody. Record the basis for the distinction and obtain appropriate
      legal advice and oversight.
    uncertainty: The legal and complicity concerns are assessed, not a final adjudication of every individual case. The available
      account distinguishes most disarmed, compliant captives from a few who fought their guards; it separately describes
      the proposed action as directed at opposing fighters demonstrably still fighting.
    handoff: The program director should make the decision with legal advice and appropriate oversight, particularly to preserve
      the distinction between action against persons who continue to fight and the treatment of captives.
    tempting_wrong:
      option: O2
      pull: The militia holds disarmed, compliant captives, and the applicable protections and counsel's concerns make executions
        a serious issue.
      why_wrong: Those concerns remain relevant to the captives' treatment, but the current request is for support for action
        against persons demonstrably still fighting, not for executions of people in custody.
    rejected:
      O2: Withholding support for the proposed action would treat action against persons demonstrably still fighting as though
        it were support for executing captives who are no longer resisting.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The decision instead concerned executions of captured people who were no longer resisting, rather than support for
        action against persons demonstrably still fighting.
      then: O2
      why: The protections for people in custody and the associated legal and oversight concerns would then be directly engaged.
    would_not_change:
    - id: noflip1
      if: Captives might rejoin the fight if released or otherwise able to return to the conflict.
      why: That possibility does not change the distinction between captured people in custody and persons demonstrably still
        fighting.
    watch_for:
    - id: watch1
      what: Evidence that particular captives or other persons were actively continuing to fight, rather than being disarmed
        and compliant in custody.
      favors:
      - O1
      why: Support for action against people who continue fighting could be legitimate, but that does not support executions
        of disarmed, compliant captives as a group.
  lesson: Distinguish support for action against persons demonstrably still fighting from support for executing people in
    custody. Preserve the applicable protections for captives while assessing the present request according to its stated
    focus on active hostilities.
  limits: This reasoning concerns the agency's support conditions in response to the militia's request for support for action
    against persons demonstrably still fighting. It does not decide the treatment of persons in custody or establish the status
    or conduct of every captive.
