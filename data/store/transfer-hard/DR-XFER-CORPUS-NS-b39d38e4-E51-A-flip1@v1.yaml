case:
  id: DR-XFER-CORPUS-NS-b39d38e4-E51-A-flip1@v1
  title: Partner Planning Material at a Conference
  status: draft
  setting: 'At the public close of a bilateral exercise-planning conference in an allied capital in 2025; organization: a
    U.S. exercise-planning office and the general staff of a long-standing partner.'
  decider: The U.S. exercise planner
  agent: The U.S. exercise planner
  agent_role: decide
  situation: At the public close of a conference, a partner general staff officer tenders a bound set of the partner's classified
    exercise-planning material to a U.S. exercise planner. The handover is made openly by identified partner officers. The
    officers say that declining the material would not be regarded as a slight, and the embassy describes its relations with
    this staff as delicate. Department rules address receipt of foreign-government information when refusal would harm relations,
    and require any receipt under that rule to be on behalf of the U.S. government. The material must then be reported to
    the foreign-disclosure office and registered. The planner must decide at the conference whether to accept, seek guidance
    first, or decline.
  question: What should the planner do about the partner's classified planning material at the conference?
  options:
    O1:
      do: The planner declines the material.
      move: act
      irreversible: false
    O2:
      do: The planner accepts the material on behalf of the U.S. government, then reports it to the foreign-disclosure office
        and registers it.
      move: act
      irreversible: false
    O3:
      do: The planner asks a foreign-disclosure officer for guidance before responding to the partner.
      move: ask
      irreversible: false
      to: a foreign-disclosure officer
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: At the conference, a partner general staff officer tenders a bound set of the partner's classified exercise-planning
      material to a U.S. exercise planner.
  - id: F2
    kind: situation
    status: confirmed
    fact: The offer is made openly at the public close of the conference by identified partner officers.
  - id: F3
    kind: situation
    status: confirmed
    fact: Partner officers state that declining the material would not be regarded as a slight.
  - id: F4
    kind: intelligence
    status: assessed
    fact: The embassy assesses its relationship with the partner general staff as delicate.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The embassy assesses that refusal would not harm relations with the partner staff.
  - id: F6
    kind: authority
    status: confirmed
    fact: Department rules permit receipt of foreign-government information when refusal would harm relations.
  - id: F7
    kind: authority
    status: confirmed
    fact: Receipt under this rule must be on behalf of the U.S. government.
  - id: F8
    kind: authority
    status: confirmed
    fact: Material received under this rule must be reported to the foreign-disclosure office and registered.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: partner_relationship
    favors:
    - O3
    weight: strong
    why: The officers say refusal would not be taken as a slight, and the embassy assesses it would not harm relations. The
      delicate relationship alone does not supply the stated relationship-risk basis for accepting under the rule, so seek
      guidance before responding.
  - id: C2
    facts:
    - F6
    - F7
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The stated rule permits receipt when refusal would harm relations, a condition the current assessment says is absent.
      Guidance is appropriate on the ordinary foreign-disclosure rules rather than assuming this exception applies.
  - id: C3
    facts:
    - F8
    equity: policy_compliance
    favors:
    - O3
    weight: weak
    why: The reporting and registration duties apply to material received under this rule; guidance can clarify the applicable
      requirements before the planner responds.
  reasoning:
    read: This is a decision about how to respond when the partner tenders classified foreign-government material, not a choice
      to accept it for personal use. The officers say refusal would not be regarded as a slight, and the embassy assesses
      that it would not harm relations. The relationship-based exception therefore should not be assumed to control.
    weighing: The relationship-risk assessment does not support the stated exception for receipt {C1}. The rule permits receipt
      when refusal would harm relations and requires that receipt be on behalf of the U.S. government {C2}; the current facts
      do not establish that its condition applies. Reporting and registration duties attach to receipt under that rule, but
      do not establish the ordinary requirements {C3}. Ask a foreign-disclosure officer for guidance before responding.
    tradecraft: Seek foreign-disclosure guidance before responding. If guidance establishes that receipt is appropriate, make
      clear that any receipt is on behalf of the U.S. government and follow the applicable reporting and registration procedures.
    uncertainty: The stated rule turns on whether refusal would harm relations. The current assessment says it would not,
      but the ordinary foreign-disclosure rules are not provided here.
    handoff: Ask a foreign-disclosure officer about the ordinary foreign-disclosure rules before responding to the partner.
      If receipt is later appropriate, follow the applicable reporting and registration process.
    tempting_wrong:
      option: O2
      pull: Accepting may seem like a courteous response to a partner's offer.
      why_wrong: The stated relationship-based rule permits receipt when refusal would harm relations, while the facts say
        refusal would not be a slight and would not harm relations. The planner should not assume that exception applies.
    rejected:
      O1: The facts do not establish that declining would cause a slight or harm relations, but the ordinary foreign-disclosure
        rules are not given; seeking guidance before responding is better supported than an immediate decline.
      O2: The relationship-based exception is not supported by the current risk assessment, and the applicable ordinary rules
        remain unresolved.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The relationship-risk assessment changes so that declining is expected to cause a slight or harm relations with
        the partner.
      then: O2
      why: The stated relationship basis for receipt would then apply; the planner should accept on behalf of the U.S. government
        and complete the required reporting and registration.
    would_not_change:
    - id: noflip1
      if: The applicable foreign-disclosure procedures specify a particular process for reporting and registering received
        material.
      why: That process governs any eventual receipt; it does not establish that the relationship-based exception applies
        or resolve the ordinary rules before responding.
    watch_for: []
  lesson: When the partner and embassy assess that declining foreign-government information would neither cause a slight nor
    harm relations, do not assume a relationship-based exception to the ordinary foreign-disclosure rules applies. Seek guidance
    before responding. If receipt is appropriate, follow the applicable requirements, including reporting and registration
    where required.
  limits: This reasoning applies to the stated foreign-government information scenario where the assessed relationship risks
    are absent and the ordinary foreign-disclosure rules are not provided. It does not resolve what those ordinary rules require.
  library:
    domain: foreign disclosure and information security
    family: XFER-CORPUS-NS-b39d38e4
    source: transfer of DR-CORPUS-NS-b39d38e4-E51@v1
    episode_focus: The doctrine recommends accepting the gift on behalf of the United States and then reporting and depositing
      it under the applicable procedures, rather than refusing it. Focus on the diplomatic interests and the rule for acceptance;
      exclude gift-valuation mechanics and subsequent disposition details.
    equities: pilot2
