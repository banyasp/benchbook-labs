case:
  id: DR-XFER-CORPUS-CHILCOT-NX-b15898a1-E34-B-flip1@v1
  title: Joining an Allied Air Bridge into a Besieged Enclave
  status: draft
  setting: United Kingdom and the enclave of Merat, March 2014, UK ministerial consideration of participation in a partner-led
    air bridge into territory controlled by the Republic of Veyra.
  decider: The UK ministers responsible for foreign and defence policy
  agent: The UK ministers responsible for foreign and defence policy
  agent_role: decide
  situation: UK ministers are considering whether the national air force should join a partner's proposed airlift of food
    and medicine into the besieged enclave of Merat. The Republic of Veyra has refused consent for the air bridge, and the
    proposal would therefore involve non-consensual access to its airspace. Officials have considered the legal basis, proportionality
    and risk of civilian casualties. The Attorney General initially made approval conditional on a categorical assurance of
    extreme humanitarian distress if the air bridge did not proceed; officials said they could not honestly provide that assurance.
    Officials initially assessed a high risk of extreme humanitarian distress without the air bridge, while acknowledging
    uncertainty and that the assessment could change if alternatives emerged. After an updated review, officials no longer
    maintain that high-risk assessment and cannot sustain the categorical humanitarian assurance on which the Attorney General's
    approval depended. The Attorney General regarded the legal argument for participation as possible on balance but very
    finely judged, and required efforts to avoid civilian casualties. Ministers also face warnings that declining could strain
    relations with the partner and leave the national transport detachment operating with less protection outside the partner's
    arrangements.
  question: What should the UK ministers responsible for foreign and defence policy do about UK participation in the proposed
    air bridge?
  options:
    O1:
      do: The ministers decline UK participation in the proposed allied air bridge.
      move: act
      irreversible: true
    O2:
      do: The ministers authorize UK participation in the proposed allied air bridge.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: A Foreign Office official has invited the Foreign Secretary to agree to UK participation in a partner-led airlift
      of food and medicine into Merat.
  - id: F2
    kind: intelligence
    status: assessed
    fact: Officials assess that the national transport detachment would have less protection if it operated outside the partner's
      arrangements.
  - id: F3
    kind: situation
    status: confirmed
    fact: The proposed air bridge has been reviewed for its legal basis, proportionality and risk of civilian casualties.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Attorney General initially advised that non-consensual participation could be justified only on a categorical
      assurance that failure to provide the air bridge would cause extreme humanitarian distress.
  - id: F5
    kind: situation
    status: confirmed
    fact: Officials said they could not honestly provide the categorical assurance, and the Attorney General regarded the
      initial humanitarian assessment as insufficient.
  - id: F6
    kind: intelligence
    status: assessed
    fact: At the initial review, officials assessed an unacceptably high risk of extreme humanitarian distress if the air
      bridge did not proceed, while acknowledging that the consequences could not be predicted with absolute certainty and
      that the assessment could change if alternatives emerged.
  - id: F7
    kind: authority
    status: confirmed
    fact: The legal test advised for non-consensual humanitarian access requires convincing evidence of extreme humanitarian
      distress, no practicable alternative, and action that is necessary and proportionate and strictly limited in time and
      scope.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Attorney General's written advice describes the legal basis for participation as arguable on balance but a very
      fine judgment.
  - id: F9
    kind: authority
    status: confirmed
    fact: The Attorney General requires every effort to avoid civilian casualties and stresses that the legal basis is precarious,
      not clearly established in international law, and cannot justify action for ulterior motives.
  - id: F10
    kind: situation
    status: assessed
    fact: An official warns that declining participation risks a major disagreement with the partner and increased danger
      to the national transport detachment if it operates outside the partner's arrangements.
  - id: F11
    kind: intelligence
    status: assessed
    fact: Following an updated review, officials no longer maintain the initial high-risk assessment of extreme humanitarian
      distress without the air bridge and cannot sustain the categorical humanitarian assurance on which the Attorney General's
      approval depended.
  considerations:
  - id: C1
    facts:
    - F4
    - F6
    - F8
    - F11
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: The initial assessment identified a high risk of extreme humanitarian distress, but officials no longer maintain
      it after an updated review and cannot sustain the categorical assurance required by the Attorney General. That removes
      the humanitarian assurance on which the case for participation depended.
  - id: C2
    facts:
    - F3
    - F7
    - F8
    - F9
    - F11
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: Because the host government has refused consent, the legal argument depends on convincing evidence of extreme distress,
      no practicable alternative, and necessary, proportionate action strictly limited to humanitarian relief. The updated
      assessment no longer sustains the required humanitarian assurance, leaving a very finely judged and precarious legal
      basis inadequate to support participation. The Attorney General's requirements to avoid civilian casualties and to rule
      out ulterior motives still apply.
  - id: C3
    facts:
    - F2
    - F10
    equity: own_force_life
    favors:
    - O2
    weight: strong
    why: Officials assess that the national transport detachment would have less protection outside the partner's arrangements,
      and warn that declining would increase danger to its personnel. This supports participation to address that danger,
      but does not itself establish the humanitarian legal basis.
  - id: C4
    facts:
    - F10
    equity: partner_relationship
    favors:
    - O2
    weight: weak
    why: Officials warn that declining could cause a major disagreement with the partner. That consequence matters to ministers,
      but alliance management cannot replace the required humanitarian and legal justification.
  reasoning:
    read: This is a decision about participating in non-consensual humanitarian air access, with a legal basis the Attorney
      General regards as precarious rather than clearly established. The air bridge would not use force against the host state,
      but the refusal of consent makes the legal basis for access a central issue. The central trap is to treat protection
      of the national detachment or the prospect of disagreement with the partner as sufficient justification; the case for
      participation must rest on humanitarian necessity and meet the legal conditions.
    weighing: The initial assessment of a high risk of extreme humanitarian distress supported participation, but officials
      no longer maintain that assessment and cannot sustain the categorical assurance on which the Attorney General's approval
      depended {C1}. The legal standard requires convincing evidence of extreme distress, no practicable alternative, and
      necessary, proportionate action limited to humanitarian relief; on the updated assessment, the very finely judged legal
      argument does not support participation {C2}. The risk to the national detachment still reinforces the case for participation
      {C3}, and pressure to preserve cooperation with the partner remains relevant but secondary {C4}. Those considerations
      cannot replace the missing humanitarian assurance, so ministers should decline participation.
    tradecraft: Keep the humanitarian justification distinct from alliance and force-protection considerations. Record the
      evidence, its uncertainty, the proportionality and civilian-harm assessment, and why no practicable alternative is considered
      available; keep the legal basis under review and seek updated information on humanitarian conditions, alternatives,
      and civilian casualties.
    uncertainty: Officials initially assessed a high risk of extreme humanitarian distress without the air bridge, but their
      updated review no longer sustains that assessment. The Attorney General regards the legal judgment as very fine and
      requires continued review.
    handoff: Ministers should decide with current advice from the Attorney General and legal advisers, informed by Foreign
      Office and defence assessments and a humanitarian assessment endorsed at a sufficiently senior level. The record requires
      ministerial judgment and the Attorney General's assessment of whether the legal argument can be maintained.
    tempting_wrong:
      option: O2
      pull: Authorize participation principally to avoid a serious disagreement with the partner and reduce danger to the
        national transport detachment.
      why_wrong: 'Those concerns do not establish the legal basis for non-consensual access: the Attorney General says the
        humanitarian justification cannot support ulterior objectives and depends on necessity and proportionality. The updated
        assessment also no longer sustains the required humanitarian assurance.'
    rejected:
      O2: Participation was not chosen because officials can no longer sustain the categorical humanitarian assurance on which
        the Attorney General's approval depended, leaving the precarious legal argument without its necessary humanitarian
        support.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Officials continued to maintain the categorical humanitarian assurance on which the Attorney General's approval
        depended.
      then: O2
      why: If that assurance remained firm, the original humanitarian assessment and the Attorney General's view that participation
        was arguable on balance would again support participation, subject to the legal limits and precautions described.
    would_not_change:
    - id: noflip1
      if: Officials could not predict the consequences of not providing the air bridge with absolute certainty.
      why: Uncertainty alone does not determine the decision; what matters here is that officials no longer maintain the high-risk
        assessment or the required assurance.
    - id: noflip2
      if: The principal argument for participation were avoiding political disagreement with the partner or protecting the
        national transport detachment.
      why: Those considerations cannot cure a deficient humanitarian legal basis or justify non-consensual action for ulterior
        purposes.
    watch_for:
    - id: watch1
      what: Updated assessments of humanitarian conditions, alternatives to the air bridge, and civilian casualties associated
        with participation.
      favors:
      - O1
      why: The Attorney General requested these updates; evidence of workable alternatives or civilian harm could weaken the
        necessity, proportionality, or humanitarian basis for continued participation.
  lesson: 'When non-consensual access is defended on humanitarian necessity, the humanitarian case must carry the legal justification:
    evidence of extreme distress, no practicable alternative, and necessary, proportionate, narrowly limited action. Alliance
    cohesion and protection of participating personnel may matter to the decision, but cannot substitute for that basis; continuing
    review and civilian-harm precautions are essential where the legal judgment is fine.'
  limits: This reasoning concerns the specific decision about the proposed air bridge and the Attorney General's assessment
    on the assurances then provided. It does not establish a general or settled international-law right to provide non-consensual
    humanitarian access, nor does it decide the legality of later operations or different circumstances.
