case:
  id: DR-XFER-CORPUS-NX-bae93487-E2-B@v1
  title: Alliance Common Funding for a Radar
  status: draft
  setting: Brussels, 2024, Investment Committee of the North Atlantic Alliance Common Funding Board.
  decider: The Investment Committee of the North Atlantic Alliance Common Funding Board
  agent: The Investment Committee of the North Atlantic Alliance Common Funding Board
  agent_role: decide
  situation: The committee is reviewing common funding for an air-surveillance radar project proposed by one member state.
    The member state's defense budget contains a line item for the radar. The alliance's common-funded package also contains
    a line item associated with the project. The committee believes the radar may have been funded twice. The issue before
    it is how to handle the alliance's common funding for the project.
  question: What should the committee do about the alliance's common funding for the radar?
  options:
    O1:
      do: The committee should ask the member state and the alliance agency to clarify the project's budget entries.
      move: ask
      irreversible: false
      to: the member state and the alliance agency
    O2:
      do: The committee should curtail common funding for the radar project.
      move: act
      irreversible: false
    O3:
      do: The committee should continue common funding for the radar project.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An alliance air-surveillance radar project is under review for common funding in 2024.
  - id: F2
    kind: situation
    status: confirmed
    fact: The funding question concerns the alliance's common-funded package entry associated with the radar project.
  - id: F3
    kind: situation
    status: confirmed
    fact: The member state's 2024 defense budget contains a line item for the radar project.
  - id: F4
    kind: situation
    status: confirmed
    fact: The alliance's 2024 common-funded package contains a separate line item associated with the radar project.
  - id: F5
    kind: situation
    status: assessed
    fact: The committee believes the radar project may have been funded twice.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Investment Committee of the North Atlantic Alliance Common Funding Board is the body considering the common-funding
      question.
  considerations:
  - id: C1
    facts:
    - F5
    - F2
    equity: resource_stewardship
    favors:
    - O2
    weight: strong
    why: The committee is concerned that the project may have been funded twice, making curtailment of its common funding
      the closest listed response to avoiding potentially duplicative expenditure.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The concern rests on separate member-state and alliance budget entries. Those entries alone do not establish that
      the project received duplicate funding, so clarification bears on the accuracy of the committee's assessment.
  - id: C3
    facts:
    - F2
    - F6
    equity: oversight_candor
    favors:
    - O1
    - O2
    weight: weak
    why: The matter concerns the committee's oversight of alliance common funding. Clarification could address the concern,
      while curtailment is also an available oversight response; no further standard or rationale for choosing between them
      is specified.
  reasoning:
    read: The decision concerns the committee's oversight of common funding for the radar, not whether two budget entries
      necessarily mean two separate payments. The committee believes the project may have been funded twice based on the separate
      member-state and alliance entries.
    weighing: The committee's stated concern about double funding supports curtailing common funding for the radar {C1}. But
      the basis for that concern is only the separate member-state and alliance entries, which do not by themselves establish
      duplication {C2}. The decision is to curtail funding, but no fuller rationale for choosing that response rather than
      clarification is given {C3}.
    tradecraft: As a decision practice, record the concern and the separate entries distinctly, and avoid recording suspected
      duplication as established fact. If the decision is reconsidered, document whether the entries represent duplicate funding
      before extending or lifting a restriction.
    uncertainty: The available facts do not establish whether the entries represent duplicate funding, nor do they state a
      legal standard, a process for clarification, or the committee's fuller rationale.
    handoff: The committee made the recorded decision. No referral or consultation is identified; seeking clarification from
      the member state and the alliance agency would be a practical step if the decision were reopened, not a stated part
      of the decision's reasoning.
    tempting_wrong:
      option: O3
      pull: Continuing the funding avoids acting on a belief that may not be established by the available entries.
      why_wrong: The committee curtailed common funding in response to its concern, rather than continuing it.
    rejected:
      O1: The committee curtailed funding rather than requesting clarification from the member state and the alliance agency;
        no reason for not seeking clarification is given.
      O3: The committee curtailed common funding rather than continuing it.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Clarification established that the separate entries did not represent duplicate funding and that the alliance's
        common funding was otherwise proper.
      then: O3
      why: That would remove the stated concern prompting curtailment and support continuing the funding.
    - id: flip2
      if: Clarification established that the radar project had in fact received duplicate funding.
      then: O2
      why: Confirmed duplication would strengthen the stated reason for curtailing common funding.
    would_not_change:
    - id: noflip1
      if: The only information remained that the member-state and alliance budgets had separate entries associated with the
        radar project.
      why: Separate entries alone do not establish that the project was funded twice.
    watch_for:
    - id: watch1
      what: Whether the member state and the alliance agency can explain what the separate budget entries funded.
      favors:
      - O1
      why: That information could resolve whether the committee's double-funding concern has a factual basis.
  lesson: Do not infer duplicate funding merely from separate budget entries; distinguish the evidence from the oversight
    body's concern. If a funding restriction rests on that concern, verify what the entries represent while accurately recording
    the decision and its basis.
  limits: This is a brief alliance-funding decision, not a general legal rule governing alliance common-funding restrictions.
    The facts do not establish whether funding was actually duplicated or provide the committee's fuller rationale.
