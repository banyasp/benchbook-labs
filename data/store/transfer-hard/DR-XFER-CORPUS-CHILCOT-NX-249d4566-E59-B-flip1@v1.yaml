    kind: capability
    status: assessed
    fact: There are concerns that some contractor technical representatives may not cope with the physical demands of routine
      shipboard life.
  - id: F5
    kind: capability
    status: assessed
    fact: There are concerns that some contractor technical representatives may not cope with the physical demands of emergencies
      at sea.
  - id: F6
    kind: situation
    status: confirmed
    fact: The procedures under review concern contractor technical representatives embarking for long deployments.
  - id: F7
    kind: authority
    status: confirmed
    fact: The review file does not contain the governing contract clauses or a written determination of whether pre-appointment
      medical confirmation may be required.
  - id: F8
    kind: situation
    status: confirmed
    fact: The Fleet Medical Examiner advised that pre-appointment confirmation could not be carried out reliably or safely
      under the available procedure.
  considerations:
  - id: C1
    facts:
    - F4
    - F5
    - F8
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: The capability concerns make fitness relevant to safe shipboard service, but the Examiner's advice means the available
      pre-appointment procedure cannot reliably or safely resolve that concern. Seeking advice on timing before setting the
      procedure better addresses the safety issue.
  - id: C2
    facts:
    - F1
    - F2
    - F4
    - F5
    - F8
    equity: own_force_life
    favors:
    - O3
    weight: strong
    why: The fitness concerns make screening timing material, while the Examiner's advice indicates that pre-appointment confirmation
      is not workable under the available procedure. Advice should be obtained before setting the timing requirement.
  - id: C3
    facts:
    - F3
    - F4
    - F5
    equity: own_force_life
    favors:
    - O2
    weight: weak
    why: Shipboard-survival instructors’ comments add a training-related input to the fitness procedure alongside medical
      screening.
  reasoning:
    read: This is a procedural decision about when fitness should be assessed and what input should inform that assessment—not
      a finding that any particular representative is unfit. The concern is that some representatives may not meet the physical
      demands of shipboard life or emergencies. The Fleet Medical Examiner has advised that pre-appointment confirmation cannot
      be carried out reliably or safely under the available procedure, so the timing and method should be clarified before
      the office sets the appointment procedure.
    weighing: The reported capability concerns support resolving medical fitness in a way that can be carried out reliably
      and safely. But the Examiner's advice means the current pre-appointment procedure does not provide a sound basis for
      requiring confirmation before appointment. Seeking the Examiner’s advice on clearance timing before setting the procedure
      addresses that problem. The contract file also does not establish whether pre-appointment confirmation may be required,
      so that authority question remains unresolved rather than evidence that any particular representative is unfit.
    tradecraft: Ask the Fleet Medical Examiner for advice on clearance timing before setting the appointment procedure. Do
      not adopt the currently available pre-appointment confirmation process as a requirement when the Examiner has advised
      it cannot be carried out reliably or safely. Once timing and procedure are settled, consider appropriate shipboard-survival
      instructor comments while keeping that role distinct from medical confirmation. Establish the applicable contractual
      authority for any pre-appointment requirement before applying it to an individual.
    uncertainty: The material gives no individual medical findings, fitness criteria, or account of how instructors should
      form their comments. The Examiner's advice concerns the available procedure; it does not establish what alternative
      procedure or timing would be reliable and safe. The review file also lacks the contract terms or written authority determination
      needed to establish whether medical confirmation may be required before appointment.
    handoff: The Fleet Personnel Office officials decide the procedure and should first seek the Fleet Medical Examiner’s
      advice on clearance timing. Shipboard-survival instructors may provide comments once their role in the procedure is
      established. The contract authority for imposing a pre-appointment requirement is not established in the review file.
    tempting_wrong:
      option: O2
      pull: It addresses the capability concerns by requiring medical confirmation before appointment and adding instructor
        comments.
      why_wrong: The Examiner has advised that pre-appointment confirmation cannot be carried out reliably or safely under
        the available procedure. The office should seek advice on timing before adopting an appointment procedure.
    rejected:
      O1: Waiving pre-appointment confirmation and leaving confirmation until after appointment would set the timing without
        resolving the Examiner's concern about the available procedure.
      O2: Although the capability concerns support assessing fitness, requiring confirmation before appointment under a procedure
        the Examiner says is unreliable or unsafe is not justified. Seek the Examiner’s advice before setting the procedure.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The Fleet Medical Examiner did not advise that pre-appointment confirmation could not be carried out reliably or
        safely under the available procedure.
      then: O2
      why: Without that feasibility concern, the reported capability concerns would again support requiring pre-appointment
        medical confirmation and instructor comments.
    would_not_change:
    - id: noflip1
      if: The concern about representatives’ fitness is based on subjective judgment rather than an individual medical finding.
      why: That qualification alone would not resolve the Examiner’s advice that pre-appointment confirmation cannot be carried
        out reliably or safely under the available procedure; advice on timing should still be sought before setting the procedure.
    watch_for:
    - id: watch1
      what: Whether the Fleet Medical Examiner identifies a reliable and safe way to determine clearance timing.
      favors:
      - O3
      why: That advice is needed before the Fleet Personnel Office sets the appointment procedure.
  lesson: When credible safety concerns make fitness assessment important but the available pre-appointment process cannot
    be carried out reliably or safely, seek medical advice on timing before setting the appointment procedure. Keep any survival-training
    input distinct from medical confirmation, and establish the contractual authority for any pre-appointment requirement.
  limits: The scenario addresses the timing and inputs for fitness assessment of contractor technical representatives embarking
    for long deployments. It does not specify fitness standards, individual outcomes, a reliable alternative assessment procedure,
    the applicable contract terms, or the separate health-surveillance and post-deployment arrangements.
