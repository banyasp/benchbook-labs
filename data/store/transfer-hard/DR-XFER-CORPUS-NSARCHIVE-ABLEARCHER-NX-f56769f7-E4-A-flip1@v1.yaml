case:
  id: DR-XFER-CORPUS-NSARCHIVE-ABLEARCHER-NX-f56769f7-E4-A-flip1@v1
  title: Choosing the Department Insider-Threat Hub
  status: draft
  setting: Present day, Department of Defense, department-wide insider-threat analysis
  decider: The defense intelligence agency director
  agent: The defense intelligence agency director
  agent_role: decide
  situation: For four years, an insider-threat analysis function has been housed in a defense intelligence agency’s Office
    of Security. That office established a small referral cell to support other department components, but the cell has produced
    little. A request for 40 analyst billets was refused, partly because other components objected to one agency reviewing
    their personnel. The Under Secretary’s staff no longer favors making the agency the department-wide lead for insider-threat
    analysis, and the department-wide organizational objective is unsettled. The organizational question is where the agency’s
    proposed department-wide function should sit.
  question: What should the defense intelligence agency director do about the organizational home for the agency’s proposed
    department-wide insider-threat role?
  options:
    O1:
      do: The defense intelligence agency director asks the Under Secretary to clarify the department-wide lead role.
      move: ask
      irreversible: false
      to: Under Secretary
    O2:
      do: The defense intelligence agency director places the department-wide insider-threat function within the Office of
        Security.
      move: act
      irreversible: false
    O3:
      do: The defense intelligence agency director establishes a separate department-wide insider-threat center.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The agency’s insider-threat analysis function has been housed in the Office of Security for four years.
  - id: F2
    kind: authority
    status: confirmed
    fact: The Office of Security established a small referral cell to support other department components.
  - id: F3
    kind: situation
    status: confirmed
    fact: The referral cell has produced little over its four years of operation.
  - id: F4
    kind: situation
    status: confirmed
    fact: A request for 40 analyst billets was refused, partly because other components objected to one agency reviewing their
      personnel.
  - id: F5
    kind: situation
    status: assessed
    fact: The Under Secretary’s staff no longer favors making the agency the department-wide lead for insider-threat analysis,
      and the department-wide organizational objective is unsettled.
  - id: F6
    kind: situation
    status: assessed
    fact: The Under Secretary’s program lead personally opposes placing the function within the Office of Security; no reason
      for the objection is recorded.
  considerations:
  - id: C1
    facts:
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The Under Secretary’s staff no longer favors making the agency the department-wide lead, and the organizational objective
      is unsettled. Clarifying the department-wide lead role before selecting an organizational home addresses that uncertainty.
  - id: C2
    facts:
    - F6
    equity: institutional_credibility
    favors:
    - O3
    weight: strong
    why: The Under Secretary’s program lead opposes placing the function within the Office of Security, and the agency director’s
      organizational choice should account for that objection. The account gives no more specific rationale for the concern.
  - id: C3
    facts:
    - F1
    - F2
    - F3
    - F4
    equity: institutional_credibility
    favors:
    - O3
    weight: weak
    why: The existing referral effort has produced little, and a request for additional staff was refused partly because the
      agency’s role was contested. This context is consistent with establishing a separate center, though it is not expressly
      identified as the director’s reason.
  reasoning:
    read: 'The decision is not simply whether the agency should take on a department-wide insider-threat role: the Under Secretary’s
      staff no longer favors that role, and the organizational objective is unsettled. The trap is to treat the Office of
      Security’s existing responsibility for the function—or the program lead’s objection to that office—as settling where
      a proposed broader role belongs.'
    weighing: The Under Secretary’s staff no longer favors making the agency the department-wide lead, and the organizational
      objective is unsettled {C1}. Although the program lead opposes locating the function in the Office of Security {C2},
      and the referral cell’s thin output and contested staffing request provide some context {C3}, those points do not resolve
      whether the agency should take on the department-wide lead role or where that role should sit. Clarifying the department-wide
      function before choosing an organizational home is therefore preferable.
    tradecraft: Ask the Under Secretary to clarify the department-wide lead role and organizational objective before selecting
      a home for the function. Record the program lead’s objection to the Office of Security as an issue to consider once
      the department-wide role is clear.
    uncertainty: The account does not establish the department-wide organizational objective or explain in detail why the
      program lead considers the Office of Security an inappropriate home.
    handoff: The agency director should ask the Under Secretary to clarify the department-wide lead role and assign a responsible
      official to follow up on the organizational question. The handoff should preserve the distinction between clarifying
      the lead function and selecting its organizational home.
    tempting_wrong:
      option: O3
      pull: The program lead opposes placing the function within the Office of Security, and the existing referral effort
        has produced little.
      why_wrong: Those facts may make a separate center seem attractive, but they do not settle the department-wide objective.
        With the Under Secretary’s staff no longer favoring the agency as lead, the director should clarify the role before
        choosing an organizational home.
    rejected:
      O2: The program lead objects to placing the function within the Office of Security, and the department-wide organizational
        objective is unsettled; choosing that home now would be premature.
      O3: A separate center may address the program lead’s objection, but the Under Secretary’s staff no longer favors making
        the agency the department-wide lead. Clarify the role before choosing an organizational home.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: The Under Secretary’s staff again favored the agency taking the department-wide lead role and the organizational
        objective were settled.
      then: O3
      why: That would restore the impetus for expanding the agency’s role and remove the present reason to clarify the department-wide
        function before choosing an organizational home.
    would_not_change:
    - id: noflip1
      if: The earlier request for 40 analyst billets remained refused.
      why: That fact alone would not settle the department-wide organizational objective or remove the need to clarify the
        lead role before choosing a home.
    watch_for:
    - id: watch1
      what: A later leadership judgment that insider-threat analysis should be part of the Office of Security.
      favors:
      - O2
      why: A later organizational decision could place the function within the office already responsible for security matters,
        illustrating that the organizational choice could shift.
  lesson: A department-wide lead role and its organizational home are distinct decisions. When the department-wide objective
    is unsettled, clarify the lead role before selecting a home; neither an existing office’s responsibility nor an objection
    to that office settles the question.
  limits: The account gives only a brief explanation of the program lead’s position and does not establish a general rule
    that insider-threat analysis should be separate from an Office of Security. This conclusion applies to the stated organizational
    choice and should not be treated as a judgment on later arrangements.
