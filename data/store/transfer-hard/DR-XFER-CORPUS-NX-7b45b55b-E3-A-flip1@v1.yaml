case:
  id: DR-XFER-CORPUS-NX-7b45b55b-E3-A-flip1@v1
  title: Protecting Infrastructure Against Drones
  status: draft
  setting: United States, present day, Congress considering responsibility for protecting civilian infrastructure against
    hostile drones.
  decider: Congress
  agent: Congress
  agent_role: decide
  situation: An executive directive assigned the military's northern command a lead role in protecting civilian infrastructure,
    including power plants and stadiums, against hostile drones. It also directed the command to review other departments'
    counter-drone programs and budgets. The sponsoring member of Congress distrusts the military's role in domestic security
    and describes its influence as politically unhealthy and potentially dangerous. The Department of Homeland Security and
    the command both already work on the problem. A capability assessment available to Congress finds that the Department
    of Homeland Security cannot responsibly lead this work and that the northern command is the only workable lead. Congress
    is considering whether to retain the command's lead or place the Department of Homeland Security in the lead while it
    works with the command.
  question: What should Congress do about whether the northern command should retain the lead or the Department of Homeland
    Security should lead civilian infrastructure protection against hostile drones?
  options:
    O1:
      do: Congress retains the lead for civilian infrastructure protection against hostile drones in the military's northern
        command.
      move: act
      irreversible: false
    O2:
      do: Congress transfers the lead for civilian infrastructure protection against hostile drones to the Department of Homeland
        Security, working with the northern command.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The executive directive assigned the military's northern command the lead responsibility for protecting civilian
      infrastructure against hostile drones.
  - id: F2
    kind: authority
    status: confirmed
    fact: The directive tasked the northern command with reviewing other departments' counter-drone programs and budgets.
  - id: F3
    kind: situation
    status: assessed
    fact: The sponsoring member of Congress distrusts the command's role in domestic counter-drone policy.
  - id: F4
    kind: situation
    status: assessed
    fact: The sponsoring member characterizes military influence over domestic security as politically unhealthy and potentially
      dangerous.
  - id: F5
    kind: authority
    status: confirmed
    fact: Congress is considering which federal body should lead protection of civilian infrastructure against hostile drones.
  - id: F6
    kind: capability
    status: confirmed
    fact: The Department of Homeland Security and the northern command both already work on protecting civilian infrastructure
      against hostile drones.
  - id: F7
    kind: capability
    status: assessed
    fact: A capability assessment available to Congress finds that the Department of Homeland Security cannot responsibly
      lead protection of civilian infrastructure against hostile drones and that the northern command is the only workable
      lead.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: weak
    why: The command's broad authority and the sponsoring member's distrust weigh against its leadership, but the assessment
      finds it is the only workable lead, making retention necessary on the stated facts.
  - id: C2
    facts:
    - F4
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The sponsoring member judges military influence over domestic security politically unhealthy and potentially dangerous,
      which supports civilian-department leadership; this concern remains, but does not resolve the capability constraint.
  - id: C3
    facts:
    - F5
    - F6
    - F7
    equity: institutional_credibility
    favors:
    - O1
    weight: strong
    why: Although both bodies already work on the problem, the assessment finds DHS cannot responsibly lead and the command
      is the only workable lead, supporting retention of the command's lead.
  reasoning:
    read: This is a choice about who leads protection of civilian infrastructure against hostile drones, not whether the Department
      of Homeland Security has any role. The key changed fact is that the available assessment finds DHS cannot responsibly
      lead and the command is the only workable lead. The trap is treating the concern about military influence as decisive
      despite the stated capability constraint.
    weighing: The directive gives the command broad responsibility, including review of other departments' programs and budgets,
      and the sponsoring member views military influence in domestic security as politically unhealthy and potentially dangerous.
      Those concerns favor civilian leadership. However, the available capability assessment finds that DHS cannot responsibly
      lead and that the command is the only workable lead. On these facts, the need for a workable lead outweighs the concern
      about the breadth of military responsibility. Congress should retain the command's lead; the source supplies no basis
      for a broader judgment about the bodies beyond this assessment.
    tradecraft: 'Keep the decision at the level of institutional responsibility: retain the command as lead in light of the
      assessment, while considering appropriate collaboration with DHS. Do not turn this allocation decision into a judgment
      about technical standards or security procedures.'
    uncertainty: The source gives the political concern and the existing involvement of both bodies, and the available assessment
      identifies the command as the only workable lead. It does not provide further detail about comparative capabilities
      or the security effects of either arrangement.
    handoff: Congress makes the allocation decision; the northern command and the Department of Homeland Security have roles
      in carrying out the chosen arrangement.
    tempting_wrong:
      option: O2
      pull: Civilian-department leadership would address the sponsoring member's concern about military influence in domestic
        security.
      why_wrong: The assessment finds that DHS cannot responsibly lead and that the command is the only workable lead. Transferring
        leadership would therefore disregard the stated capability constraint.
    rejected:
      O2: 'Congress does not transfer the lead to DHS: although doing so would address the concern about military influence,
        the available assessment finds that DHS cannot responsibly lead and the command is the only workable lead.'
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C3
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Congress instead had evidence that the Department of Homeland Security could responsibly lead protection of civilian
        infrastructure against hostile drones and that the command was not the only workable lead.
      then: O2
      why: That evidence would remove the capability-based reason for retaining the command's lead, allowing the concern about
        broad military responsibility to support civilian-department leadership.
    would_not_change:
    - id: noflip1
      if: The command remains involved through collaboration with the Department of Homeland Security.
      why: Command participation in collaboration is compatible with either allocation of leadership; it does not by itself
        overcome the assessment that the command is the only workable lead.
    watch_for:
    - id: watch1
      what: Whether the Department of Homeland Security works with the command in a supporting role.
      favors:
      - O1
      why: The arrangement retains the command as lead while allowing DHS to remain involved in the work.
  lesson: When a policy concern is about an agency's breadth of authority, distinguish that concern from evidence about which
    body can responsibly lead. A capability finding that another body is the only workable lead can make retaining the existing
    lead preferable, even when its broad mandate raises institutional concerns.
  limits: This reasoning applies to the choice over civilian infrastructure protection against hostile drones and depends
    on the stated assessment that DHS cannot responsibly lead and the command is the only workable lead. It does not establish
    that military leadership is preferable where the governing framework or decision facts differ, or address the merits of
    particular standards or security procedures.
  library:
    domain: homeland security
    family: XFER-CORPUS-NX-7b45b55b
