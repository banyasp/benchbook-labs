case:
  id: DR-XFER-CORPUS-CHURCH-NX-552be9e4-E3-A-flip1@v1
  title: Seizing a Sanctioned Tanker's Cargo in a Foreign Free Port
  status: draft
  setting: Port Selka, Republic of Norvale, 2023; the U.S. Embassy and the Department of the Treasury.
  decider: The Treasury attaché at the U.S. Embassy.
  agent: The Treasury attaché at the U.S. Embassy.
  agent_role: decide
  situation: A tanker subject to U.S. sanctions is in Port Selka, a free port in the neighboring Republic of Norvale, with
    its cargo there. The port has been open to vessels of every flag for years. The Treasury attaché cites protecting U.S.
    shipping from sanctions evasion as a reason to direct a contracted salvage firm to take custody of the cargo. Senior U.S.
    officials share concern that a rival power is using the port to evade sanctions, and a congressional committee has discussed
    the concern in closed session. Norvale's port authorities oppose the attaché's activities. Treasury has made an established
    federal decision about the sanctions-evasion threat and the purpose of the action, and has issued the attaché clear, explicit
    authorization to direct the seizure.
  question: What should the Treasury attaché do about directing a seizure of the tanker's cargo in Port Selka, and under what
    authority?
  options:
    O1:
      do: The Treasury attaché declines to direct the seizure of the tanker's cargo in Port Selka.
      move: act
      irreversible: false
    O2:
      do: The Treasury attaché directs the contracted salvage firm to seize the tanker's cargo in Port Selka.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The attaché is a Treasury representative at the U.S. Embassy and reports to Treasury.
  - id: F2
    kind: situation
    status: confirmed
    fact: Port Selka has been open to vessels of every flag for years.
  - id: F3
    kind: situation
    status: assessed
    fact: The attaché cites protecting U.S. shipping from sanctions evasion as a reason to take custody of the cargo.
  - id: F4
    kind: intelligence
    status: assessed
    fact: Senior U.S. officials share concern that a rival power is using Port Selka to evade sanctions.
  - id: F5
    kind: situation
    status: confirmed
    fact: Norvale's port authorities oppose the attaché's activities.
  - id: F6
    kind: authority
    status: confirmed
    fact: Competent Treasury authority issued the attaché clear, explicit authorization to direct the seizure.
  - id: F7
    kind: authority
    status: confirmed
    fact: A congressional committee discussed the concern about sanctions evasion in closed session.
  - id: F8
    kind: situation
    status: confirmed
    fact: The cargo of a tanker subject to U.S. sanctions is in Port Selka.
  - id: F9
    kind: authority
    status: confirmed
    fact: Treasury made an established federal decision about the sanctions-evasion threat and the purpose of the action.
  considerations:
  - id: C1
    facts:
    - F1
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: The attaché reports to Treasury, and competent Treasury authority has clearly and explicitly authorized her to direct
      the seizure. The central uncertainty about whether she has been delegated that power is resolved.
  - id: C2
    facts:
    - F4
    - F7
    - F9
    equity: mission_effect
    favors:
    - O2
    weight: strong
    why: The concern about sanctions evasion has been addressed through an established federal decision about the threat and
      the purpose of the action. The congressional discussion is context, not the source of the attaché's authority.
  - id: C3
    facts:
    - F2
    - F3
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The port's open status, the presence of cargo from a sanctioned tanker, and the stated aim of protecting U.S. shipping
      provide a rationale for action, but are not themselves the source of the attaché's authority.
  - id: C4
    facts:
    - F5
    equity: escalation_control
    favors:
    - O1
    weight: weak
    why: Norvale's port authorities oppose the attaché's activities. Directing a seizure over that objection risks an unjustified
      intervention, though the objection does not undo the clear federal authorization.
  reasoning:
    read: The decision is not simply whether preventing sanctions evasion or protecting U.S. shipping is worthwhile. The relevant
      distinction is between a shared concern or congressional discussion, which alone would not establish the attaché's authority,
      and an explicit authorization grounded in an established federal decision. Here, Treasury has made that decision and
      competent Treasury authority has clearly authorized the attaché to direct the seizure.
    weighing: 'The explicit authorization resolves the central defect in the original situation: the attaché is no longer
      acting under unclear instructions. The established federal decision supplies the policy basis for the action, while
      the cargo and shipping rationale support its mission purpose. Norvale''s port authorities'' opposition remains a real
      concern, but on these facts it does not outweigh the clear authorization and federal decision. The balance favors directing
      the seizure under that authorization.'
    tradecraft: Act within the limits of the explicit Treasury authorization and preserve a clear record of its scope, purpose,
      and basis. Do not treat the congressional discussion or the attaché's stated rationale as a substitute for the competent
      authority's authorization.
    uncertainty: The record still does not establish the underlying details of the sanctions-evasion threat or how Norvale's
      opposition may affect the situation. Those uncertainties do not erase the stated federal decision or the attaché's explicit
      authorization.
    handoff: The attaché should act within the clear authorization issued by competent Treasury authority, keeping the responsible
      Treasury officials informed of relevant developments and any material limits in the authorization.
    tempting_wrong:
      option: O1
      pull: Norvale's port authorities oppose the attaché's activities, and a seizure in a foreign free port presents a risk
        of unjustified intervention.
      why_wrong: That concern deserves weight, but the record now includes both an established federal decision about the
        threat and purpose and clear, explicit authorization from competent Treasury authority. The original authority defect
        is resolved.
    rejected:
      O1: Declining to direct the seizure would fail to act on the established federal decision and explicit Treasury authorization,
        despite the remaining concern about Norvale's opposition.
  verdict:
    choice: O2
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Competent Treasury authority had not issued clear, explicit authorization to direct the seizure grounded in an established
        federal decision about the sanctions-evasion threat and the purpose of the action.
      then: O1
      why: Without that authorization and federal decision, the attaché's authority to convert federal concerns into a seizure
        would again be unclear.
    would_not_change:
    - id: noflip1
      if: The attaché repeated the shipping-protection rationale while the scope of her instructions remained unclear.
      why: A stated purpose alone would not resolve the authority problem or overcome the concern about directing action over
        the port authorities' objection.
    watch_for:
    - id: watch1
      what: Reliable evidence that a rival power was using Port Selka to evade sanctions, presented to the responsible Treasury
        decision-makers.
      favors:
      - O2
      why: A concrete threat could strengthen the case for federal action, though it would not by itself establish this attaché's
        authority.
  lesson: A compelling national-security purpose does not itself confer authority on an attaché to direct a seizure. When
    competent authority has made an established federal decision and issued clear, explicit authorization, distinguish that
    authorization from the policy concerns and discussions that may have informed it, and act within its limits.
  limits: This judgment concerns the attaché's proposed seizure under the explicit authorization and circumstances described;
    it does not decide whether the seizure is justified under every applicable legal or diplomatic standard. It is not a general
    rule that action to enforce sanctions or protect shipping is always justified.
