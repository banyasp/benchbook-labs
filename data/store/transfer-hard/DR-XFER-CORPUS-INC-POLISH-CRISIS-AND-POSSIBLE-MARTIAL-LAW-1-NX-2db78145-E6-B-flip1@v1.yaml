    episode_focus: By late 1981, analysts favored the judgment that the regime would continue seeking political solutions
      rather than act, despite reporting that preparations were advancing. The passage identifies skepticism about the plans’
      likelihood of success and continued focus on possible Soviet intervention as reasons for discounting the Polish authorities’
      willingness to proceed. Treat this as an estimative judgment and exclude any covert-source collection or handling decisions.
    equities: pilot2
