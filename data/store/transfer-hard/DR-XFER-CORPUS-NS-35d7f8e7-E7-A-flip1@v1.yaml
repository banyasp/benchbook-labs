case:
  id: DR-XFER-CORPUS-NS-35d7f8e7-E7-A-flip1@v1
  title: Detained Crew Attempting to Retake an Interdicted Vessel
  status: draft
  setting: A maritime interdiction involving a vessel seized for carrying embargoed cargo; the boarding team is holding the
    detained crew while an attempt to escape or retake the vessel is underway.
  decider: The boarding officer responsible for setting the team's standing instruction
  agent: The boarding officer responsible for setting the team's standing instruction
  agent_role: decide
  situation: A naval boarding team has detained the crew of a vessel seized for carrying embargoed cargo. The crew are attempting
    to escape or retake the vessel, and another means can immediately stop the attempt. The boarding officer must set the
    team's standing instruction on whether to permit the most extreme measure to stop such an attempt. The governing team
    rules permit force in this setting, but condition the extreme measure on there being no other means to stop the attempt
    immediately and require warnings appropriate to the circumstances beforehand. The rules characterize use of the extreme
    measure against detained persons as an extreme step.
  question: What should the boarding officer do about authorizing the extreme measure to stop the detained crew's attempt
    to escape or retake the vessel?
  options:
    O1:
      do: The boarding officer prohibits the extreme measure and directs the team to use other means to stop the attempt.
      move: act
      irreversible: false
    O2:
      do: The boarding officer authorizes the extreme measure only if no other means can stop the attempt immediately, after
        warnings appropriate to the circumstances.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The decision concerns detained crew attempting to escape or retake a vessel seized for carrying embargoed cargo.
  - id: F2
    kind: authority
    status: confirmed
    fact: The team's governing rules permit force against detained crew to stop an escape attempt or an attempt to retake
      the vessel.
  - id: F3
    kind: authority
    status: confirmed
    fact: The team's rules permit the extreme measure only when no other means can immediately stop the attempt.
  - id: F4
    kind: authority
    status: confirmed
    fact: The immediate purpose of the extreme-measure threshold is to stop the escape or retaking attempt.
  - id: F5
    kind: authority
    status: confirmed
    fact: The team's rules characterize use of the extreme measure against detained crew as an extreme step.
  - id: F6
    kind: authority
    status: confirmed
    fact: The team's rules require warnings appropriate to the circumstances before use of the extreme measure.
  - id: F7
    kind: situation
    status: confirmed
    fact: The detained persons are merchant crew, not persons held under prisoner-of-war status.
  - id: F8
    kind: situation
    status: confirmed
    fact: Another means can immediately stop the attempt.
  considerations:
  - id: C1
    facts:
    - F2
    equity: lawful_authority
    favors:
    - O2
    weight: weak
    why: The team's rules permit force against detained crew in this setting, but that general permission does not by itself
      authorize the extreme measure.
  - id: C2
    facts:
    - F3
    - F4
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The rules permit the extreme measure only when no other means can immediately stop the attempt. Since another means
      can do so (F8), that necessity condition is not met.
  - id: C3
    facts:
    - F5
    equity: hors_de_combat
    favors:
    - O1
    - O2
    weight: strong
    why: Use of the extreme measure against detained crew is characterized as an extreme step. That requires restraint, while
      leaving room for the rules' narrowly conditioned authorization.
  - id: C4
    facts:
    - F6
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Warnings appropriate to the circumstances must precede any use of the extreme measure; this requirement would apply
      if the necessity condition were met.
  reasoning:
    read: This is a decision about stopping an ongoing attempt by detained crew to escape or retake a vessel, not a general
      authorization to use the extreme measure. The trap is treating the general authority to use force against detainees
      as permission to use the extreme measure without the separate necessity threshold and warnings.
    weighing: The rules permit the extreme measure only if no other means can immediately stop the attempt. Another means
      can immediately stop it, so that threshold is not met and the extreme measure should be prohibited. The requirement
      for appropriate prior warnings does not override the unmet necessity condition. The rules' characterization of the measure
      as extreme reinforces restraint.
    tradecraft: Record that another means can immediately stop the attempt and keep the standing instruction within the stated
      necessity threshold. No authorization for the extreme measure is warranted on these facts; this does not address methods
      of employing force.
    uncertainty: The stated facts establish that another means can immediately stop the attempt, so the necessity threshold
      is not met. Warnings appropriate to the circumstances would need assessment only if the facts changed such that the
      extreme measure could be considered.
    handoff: The boarding officer responsible for setting the team's standing instruction is the identified decision-maker.
      The stated rules provide no mandatory referral or consultation procedure, so any further handoff depends on authority
      or procedures outside this source.
    tempting_wrong:
      option: O2
      pull: The rules permit the extreme measure in narrowly defined circumstances, and warnings are required before its use,
        so conditional authorization may seem appropriate.
      why_wrong: Another means can immediately stop the attempt, so the stated necessity condition is not met. The warning
        requirement does not make the extreme measure available when that condition fails.
    rejected:
      O2: The necessity condition for the extreme measure is not met because another means can immediately stop the attempt.
  verdict:
    choice: O1
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: No other means can immediately stop the attempt.
      then: O2
      why: The stated necessity condition for the extreme measure could then be met, subject to warnings appropriate to the
        circumstances.
    would_not_change:
    - id: noflip1
      if: The event is an escape attempt rather than an attempt to retake the vessel, or an attempt to retake the vessel rather
        than an escape attempt.
      why: The team's rules apply the same force rule to both settings.
    watch_for:
    - id: watch1
      what: Whether another means can immediately stop the attempt and what warnings are appropriate in the circumstances.
      favors:
      - O2
      why: If no other means can immediately stop the attempt, the necessity threshold may be met; any use would still require
        appropriate prior warnings.
  lesson: 'Permission to use force does not amount to unrestricted permission to use the extreme measure. Apply the necessity
    threshold: when another means can immediately stop the attempt, the threshold is not met. If it is met, ensure warnings
    appropriate to the circumstances precede use.'
  limits: This reasoning addresses only the stated team rule for an escape attempt or an attempt to retake an interdicted
    vessel. The detained crew are not POWs; this reasoning does not determine whether separate law-enforcement standards or
    other applicable law impose a different or stricter threshold, or what other procedures apply.
