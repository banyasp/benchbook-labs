case:
  id: DR-XFER-CORPUS-NX-c5ef1aef-E10-A@v1
  title: Honest Errors on Clearance Questionnaires
  status: draft
  setting: United States federal personnel-security system, during a congressionally chartered commission's review in 2024;
    the Security Clearance Review Commission and the security executive agent.
  decider: The Commission
  agent: The Commission
  agent_role: decide
  situation: The Commission is reviewing how the federal security-clearance system handles discrepancies on lengthy background
    questionnaires and ordinary foreign contacts. Adjudicators currently refer questionnaire omissions for possible false-statement
    prosecution. The forms ask many questions covering different look-back periods, and discrepancy records include wrong
    dates and forgotten trips. The Commission's review includes the existing criminal laws and the executive agent's administrative
    adjudication procedures. It must recommend how technical errors and innocent contacts should be treated.
  question: What should the Commission recommend for the security executive agent's treatment of technical or inadvertent
    questionnaire errors and innocent foreign contacts?
  options:
    O1:
      do: The Commission should ask the security executive agent to draft an enforcement standard for technical questionnaire
        errors and innocent foreign contacts.
      move: ask
      irreversible: false
      to: The security executive agent
    O2:
      do: The Commission should recommend that the security executive agent treat technical or inadvertent questionnaire errors
        and innocent foreign contacts as presumptive false statements for criminal referral.
      move: act
      irreversible: false
    O3:
      do: The Commission should recommend that the security executive agent treat technical or inadvertent questionnaire errors
        and innocent foreign contacts as administrative matters for correction and adjudication.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: authority
    status: confirmed
    fact: The Commission endorses retaining criminal law for deliberate concealment in the clearance process and espionage.
  - id: F2
    kind: situation
    status: confirmed
    fact: The background questionnaire contains more than 100 questions, with look-back periods that vary by topic and extend
      as long as ten years.
  - id: F3
    kind: situation
    status: confirmed
    fact: A review of 1,140 discrepancy referrals logged examples including incorrect dates and omitted foreign trips.
  - id: F4
    kind: situation
    status: confirmed
    fact: Routine social and professional foreign contacts accounted for 390 requests for clarification in the reviewed records.
  - id: F5
    kind: authority
    status: confirmed
    fact: The security executive agent's procedures permit applicants to correct questionnaire entries and adjudicators to
      resolve eligibility administratively.
  - id: F6
    kind: situation
    status: confirmed
    fact: The median time to close a simple administrative correction was 45 days, compared with 14 months for a case referred
      for possible prosecution.
  - id: F7
    kind: authority
    status: confirmed
    fact: Adjudication guidance requires decision-makers to document an applicant's explanation and evidence bearing on candor
      when resolving a questionnaire discrepancy.
  - id: F8
    kind: situation
    status: confirmed
    fact: An annual review of 300 completed discrepancy cases recorded 112 eligibility grants following clarification and
      28 cases with documented intentional concealment.
  considerations:
  - id: C1
    facts:
    - F1
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The Commission supports retaining criminal law for deliberate concealment and espionage; treating technical errors
      and innocent contacts administratively does not require abandoning those laws.
  - id: C2
    facts:
    - F2
    - F3
    - F4
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The questionnaire's length and varied look-back periods can produce technical discrepancies, while its records also
      include ordinary foreign contacts; those circumstances bear on whether discrepancies or contacts should be treated as
      presumptive crimes.
  - id: C3
    facts:
    - F5
    - F6
    equity: lawful_authority
    favors:
    - O3
    weight: strong
    why: The executive agent has an administrative correction and adjudication route, and simple corrections can be resolved
      more quickly through it than through criminal referral.
  - id: C4
    facts:
    - F7
    - F8
    equity: due_process
    favors:
    - O3
    weight: strong
    why: The system records both applicants who receive eligibility after clarification and cases with documented intentional
      concealment; its process should allow honest applicants to be cleared while identifying deception.
  reasoning:
    read: The issue is how to enforce personnel-security requirements without treating mistakes on lengthy questionnaires
      or ordinary foreign contacts as presumptive crimes. The trap is to mistake administrative treatment of those cases for
      weakening the retained criminal laws against deliberate concealment and espionage.
    weighing: 'The Commission favors {O2}: preserve criminal law for deliberate concealment and espionage {C1}, but handle
      technical or inadvertent errors and innocent contacts as administrative matters {C2} {C3}. Timely decisions should clear
      honest applicants while identifying deceivers {C4}. The balance depends on distinguishing innocent or inadvertent conduct
      from deliberate concealment, not on treating every discrepancy or foreign contact as a presumptive false statement.'
    tradecraft: Recommend administrative correction and adjudication for the specified conduct, timely decisions, and an approach
      that clears honest applicants as well as identifies deceivers. Keep criminal law for deliberate concealment and espionage
      intact.
    uncertainty: The record does not specify detailed criteria for distinguishing inadvertent discrepancies from deliberate
      concealment or prescribe particular administrative measures.
    handoff: The Commission should make the recommendation and enable the security executive agent to correct questionnaire
      entries, adjudicate eligibility, and resolve questions expeditiously.
    tempting_wrong:
      option: O2
      pull: Presumptive criminal referral may seem to signal strong enforcement of clearance requirements.
      why_wrong: It sweeps in technical or inadvertent errors and innocent contacts that should not be treated as presumptive
        crimes, and conflicts with the administrative route for handling them.
    rejected:
      O2: It would presumptively refer for prosecution conduct that should not receive that treatment.
      O1: The Commission's stated position is to recommend administrative treatment, not merely ask the security executive
        agent to draft a standard.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C2
    - C3
    - C4
  flip_conditions:
    would_change:
    - id: flip1
      if: The Commission's immediate task were only to obtain an enforcement standard from the security executive agent before
        selecting a treatment for these cases.
      then: O1
      why: A request for a standard could then be the appropriate next step rather than a direct recommendation about treatment.
    would_not_change:
    - id: noflip1
      if: The questionnaire remains complex and technical or inadvertent discrepancies remain possible.
      why: Those circumstances support, rather than reverse, the Commission's position that such errors should not be treated
        as presumptive crimes.
    watch_for: []
  lesson: Preserve criminal law for deliberate concealment and espionage while distinguishing those acts from technical mistakes
    and innocent contacts. Use administrative correction and adjudication for the latter, decide promptly, and make clearing
    honest applicants part of the system's mission.
  limits: This recommendation concerns technical or inadvertent questionnaire errors and innocent foreign contacts; it does
    not remove criminal law for deliberate concealment or espionage. The record does not provide detailed criteria or administrative
    measures.
  library:
    domain: personnel security
    family: XFER-CORPUS-NX-c5ef1aef
    source: transfer of DR-CORPUS-NX-c5ef1aef-E10@v1
    episode_focus: The report supports retaining laws against bribery and corrupt practices while shifting technical or inadvertent
      disclosure errors and innocent private-sector contacts away from presumptive criminal treatment. Focus on the enforcement
      standard and the stated aim of clearing innocent officials while pursuing wrongdoers; exclude the separate choices about
      divestiture and post-employment restrictions.
    equities: pilot2
