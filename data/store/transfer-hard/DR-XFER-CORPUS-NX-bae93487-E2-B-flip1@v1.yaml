case:
  id: DR-XFER-CORPUS-NX-bae93487-E2-B-flip1@v1
  title: Alliance Common Funding for a Radar
  status: draft
  setting: Brussels, 2024, Investment Committee of the North Atlantic Alliance Common Funding Board.
  decider: The Investment Committee of the North Atlantic Alliance Common Funding Board
  agent: The Investment Committee of the North Atlantic Alliance Common Funding Board
  agent_role: decide
  situation: The committee is reviewing common funding for an air-surveillance radar project proposed by one member state.
    The member state's defense budget contains a line item for the radar. The alliance's common-funded package also contains
    a line item associated with the project. Clarification established that the separate entries did not represent duplicate
    funding and that the alliance's common funding was otherwise proper. The issue before it is how to handle the alliance's
    common funding for the project.
  question: What should the committee do about the alliance's common funding for the radar?
  options:
    O1:
      do: The committee should ask the member state and the alliance agency to clarify the project's budget entries.
      move: ask
      irreversible: false
      to: the member state and the alliance agency
    O2:
      do: The committee should curtail common funding for the radar project.
      move: act
      irreversible: false
    O3:
      do: The committee should continue common funding for the radar project.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: An alliance air-surveillance radar project is under review for common funding in 2024.
  - id: F2
    kind: situation
    status: confirmed
    fact: The funding question concerns the alliance's common-funded package entry associated with the radar project.
  - id: F3
    kind: situation
    status: confirmed
    fact: The member state's 2024 defense budget contains a line item for the radar project.
  - id: F4
    kind: situation
    status: confirmed
    fact: The alliance's 2024 common-funded package contains a separate line item associated with the radar project.
  - id: F5
    kind: situation
    status: confirmed
    fact: Clarification established that the separate entries did not represent duplicate funding and that the alliance's
      common funding was otherwise proper.
  - id: F6
    kind: authority
    status: confirmed
    fact: The Investment Committee of the North Atlantic Alliance Common Funding Board is the body considering the common-funding
      question.
  considerations:
  - id: C1
    facts:
    - F5
    - F2
    equity: resource_stewardship
    favors:
    - O3
    weight: strong
    why: Clarification established that there was no duplicate funding and that the alliance's common funding was otherwise
      proper, so continuing it avoids curtailment unsupported by the stated concern.
  - id: C2
    facts:
    - F3
    - F4
    - F5
    equity: analytic_integrity
    favors:
    - O3
    weight: strong
    why: 'Clarification established what the separate member-state and alliance entries represented: they did not amount to
      duplicate funding, and the common funding was otherwise proper. Continuing the funding reflects that established information.'
  - id: C3
    facts:
    - F2
    - F6
    - F5
    equity: oversight_candor
    favors:
    - O3
    weight: weak
    why: The matter concerns the committee's oversight of alliance common funding. With clarification establishing that the
      entries did not represent duplicate funding and that the common funding was otherwise proper, continuing it is consistent
      with the information available to the committee.
  reasoning:
    read: The decision concerns the committee's oversight of common funding for the radar, not whether two budget entries
      necessarily mean two separate payments. Clarification established that the entries did not represent duplicate funding
      and that the alliance's common funding was otherwise proper.
    weighing: Clarification removes the stated concern that the project may have been funded twice and establishes that the
      common funding was otherwise proper {C1, C2}. Continuing the funding therefore best reflects the clarified facts. The
      committee's oversight role does not provide a reason to curtail funding in the absence of the duplication concern {C3}.
    tradecraft: As a decision practice, record the separate entries distinctly and document the clarification that they do
      not represent duplicate funding. Do not treat the existence of separate entries alone as evidence of duplication.
    uncertainty: The available facts establish that the entries did not represent duplicate funding and that the alliance's
      common funding was otherwise proper. They do not state a legal standard or the committee's fuller rationale beyond these
      facts.
    handoff: Clarification from the member state and the alliance agency established that the entries did not represent duplicate
      funding and that the alliance's common funding was otherwise proper. No further referral or consultation is identified.
    tempting_wrong:
      option: O2
      pull: Curtailing the funding may seem prudent in response to the earlier concern about possible duplication.
      why_wrong: Clarification established that the entries did not represent duplicate funding and that the common funding
        was otherwise proper, removing the stated basis for curtailment.
    rejected:
      O1: The entries have already been clarified; asking the member state and the alliance agency to clarify them is not
        the appropriate response to the established facts.
      O2: Clarification established that there was no duplicate funding and that the common funding was otherwise proper,
        so the stated concern does not support curtailment.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: Clarification did not establish that the separate entries were non-duplicative and that the alliance's common funding
        was otherwise proper, leaving the original concern about possible duplicate funding unresolved.
      then: O2
      why: Without the clarification that removes the concern and establishes proper common funding, the original stated basis
        for curtailing common funding would remain.
    would_not_change:
    - id: noflip1
      if: The only information remained that the member-state and alliance budgets had separate entries associated with the
        radar project.
      why: Separate entries alone do not establish that the project was funded twice.
    watch_for: []
  lesson: Do not infer duplicate funding merely from separate budget entries; distinguish the evidence from the oversight
    body's concern. When clarification establishes that the entries do not represent duplicate funding and that common funding
    is otherwise proper, continuing the funding reflects the clarified facts.
  limits: This is a brief alliance-funding decision, not a general legal rule governing alliance common-funding restrictions.
    The facts establish that funding was not duplicated and that the alliance's common funding was otherwise proper, but do
    not provide the committee's fuller rationale.
