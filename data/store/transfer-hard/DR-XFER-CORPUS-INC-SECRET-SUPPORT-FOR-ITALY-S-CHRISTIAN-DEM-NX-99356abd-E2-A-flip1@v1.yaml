case:
  id: DR-XFER-CORPUS-INC-SECRET-SUPPORT-FOR-ITALY-S-CHRISTIAN-DEM-NX-99356abd-E2-A-flip1@v1
  title: Backing Trusted Vendors Abroad
  status: draft
  setting: A partner country, present period; the national-security deputies and the government’s development-finance authority.
  decider: The national-security deputies
  agent: The national-security deputies
  agent_role: decide
  situation: The government is concerned about a rival’s growing influence over a partner’s critical infrastructure. Officials
    assess that state-backed firms are competing for the partner’s core telecommunications network, two ports, and university
    laboratories; however, the deputies lack a credible basis for the assessment that those firms are using substantial subsidies
    to gain influence over those assets. The government’s primary national-security mission is to keep a crisis with the rival
    from becoming a conflict. Its experience financing vendors’ bids abroad is limited, and its economic-statecraft tools
    are still developing. The deputies are considering whether to authorize a confidential development-finance package backing
    trusted vendors in the telecommunications tender.
  question: What should the national-security deputies do about whether to authorize a confidential development-finance package
    backing trusted vendors in the telecommunications tender?
  options:
    O1:
      do: The national-security deputies decline the confidential development-finance package backing trusted vendors in the
        telecommunications tender.
      move: act
      irreversible: false
    O2:
      do: The national-security deputies authorize the confidential development-finance package backing trusted vendors in
        the telecommunications tender.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The government has few precedents for financing vendors’ bids abroad.
  - id: F2
    kind: situation
    status: confirmed
    fact: The government’s primary national-security mission is to prevent a crisis with the rival from becoming a conflict.
  - id: F3
    kind: intelligence
    status: assessed
    fact: Officials assess that the rival is gaining influence over critical infrastructure in the partner country.
  - id: F4
    kind: situation
    status: confirmed
    fact: The deputies lack a credible basis for the assessment that rival state-backed firms are using substantial subsidies
      to gain influence over key infrastructure and research assets.
  - id: F5
    kind: intelligence
    status: assessed
    fact: The assets of concern include the partner’s core telecommunications network, two ports, and university laboratories.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposed instrument is a confidential development-finance package backing trusted vendors in the telecommunications
      tender.
  - id: F7
    kind: situation
    status: confirmed
    fact: The government’s tools for responding to foreign influence through economic statecraft are still developing.
  considerations:
  - id: C1
    facts:
    - F3
    - F4
    - F5
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Although officials assess that the rival is gaining influence over important assets {F3, F5}, the deputies lack a
      credible basis for the specific claim that state-backed firms are using substantial subsidies to gain that influence
      {F4}. The principal stated rationale for the proposed financing is therefore unsupported.
  - id: C2
    facts:
    - F2
    equity: escalation_control
    favors:
    - O2
    weight: weak
    why: Preventing a crisis with the rival from becoming a conflict is the government’s primary mission. In that strategic
      context, countering economic influence could be a reason to act, though the tender itself has not been identified as
      posing an imminent risk of conflict.
  - id: C3
    facts:
    - F1
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: Few precedents exist for financing foreign bids, and the government’s economic-statecraft tools are still developing,
      making the policy choice less established.
  reasoning:
    read: The decision is whether to respond to perceived foreign economic influence by confidentially financing trusted vendors
      in a partner’s tender. The deputies lack a credible basis for the specific assessment that rival state-backed firms
      are using substantial subsidies to gain influence over key assets. The trap is to treat the broader concern about rival
      influence as sufficient support for this particular intervention.
    weighing: The deputies give greatest weight to the lack of a credible basis for the specific subsidized-influence claim
      that supplies the proposed financing’s principal rationale {C1}. The broader mission of preventing conflict provides
      some context for acting against rival influence {C2}, but the tender has not been identified as posing an imminent risk
      of conflict, and that general context does not replace a credible basis for the central claim. Limited precedent and
      developing policy tools add caution {C3}. They therefore decline the package.
    tradecraft: State the policy objective, the assessed threat and its reliability, and the basis for any authorization.
      Preserve a record that distinguishes the rationale available at the time from any later tender result.
    uncertainty: Officials assess that the rival is gaining influence, but the deputies lack a credible basis for the specific
      claim about substantial subsidies being used to gain influence over key assets. The underlying evidence, applicable
      legal and trade constraints, and alternatives to confidential financing are not addressed; the government’s economic-statecraft
      tools are also still developing.
    handoff: The national-security deputies hold the decision. Because few precedents exist and the government’s economic-statecraft
      tools are still developing, involve appropriate legal and policy advisers before any authorization.
    tempting_wrong:
      option: O2
      pull: Authorizing could seem prudent because the government’s primary mission is preventing conflict and officials assess
        that the rival is gaining influence over important assets.
      why_wrong: That broader concern does not supply a credible basis for the specific subsidized-influence claim that is
        the stated rationale for this financing.
    rejected:
      O2: The deputies do not authorize the package because they lack a credible basis for the specific assessment of substantial
        subsidies being used to gain influence over key infrastructure and research assets.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: The deputies had a credible basis for the assessment that rival state-backed firms were using substantial subsidies
        to gain influence over key infrastructure and research assets.
      then: O2
      why: That would restore the principal stated rationale for intervening; given the assessed rival influence and the government’s
        mission, the balance would favor authorizing the financing.
    would_not_change:
    - id: noflip1
      if: Trusted vendors won the tender, but the threat assessment and decision rationale at the time were otherwise unchanged.
      why: A favorable result would not, by itself, change what was justified on the information and rationale available when
        the deputies decided.
    watch_for:
    - id: watch1
      what: Whether a credible basis emerges for the assessment that rival state-backed firms are using substantial subsidies
        to influence important assets.
      favors:
      - O2
      why: A credible basis for that assessment would restore the principal stated reason for countering the perceived threat
        through the proposed financing.
  lesson: A perceived foreign economic-influence threat may warrant a policy response when decision-makers can credibly connect
    it to a serious national-security objective. When the specific assessment supporting an intervention lacks a credible
    basis, broader concerns and limited precedent do not by themselves justify confidential vendor financing. A favorable
    outcome alone does not establish that such financing was justified or that the same choice fits other circumstances.
  limits: The available account gives a brief rationale, not a legal or trade analysis, a full account of the evidence, or
    a comparison of alternative responses. This reasoning should not be treated as a general authorization for confidential
    state-backed financing of foreign vendors.
