case:
  id: DR-XFER-CORPUS-CHILCOT-NX-249d4566-E44-A-flip1@v1
  title: Care after a Radiological Accident
  status: draft
  setting: North Aster Base, Lydora, 18 June 2024, Department of Defence
  decider: The senior department official who requested the advice
  agent: The senior department official who requested the advice
  agent_role: decide
  situation: A radiological accident at an overseas base has exposed service members, department civilian technicians, and
    two accredited visiting journalists. The senior department official has urgently requested advice on casualty arrangements
    for the three groups. The technicians maintain the base's nuclear-safety systems but do not work in direct support of
    the mission. The proposal is to evacuate and treat them alongside service members, with travel for their families to the
    hospital if their families wish. The journalists would be evacuated and treated without family travel. One casualty policy
    covers all three groups.
  question: What should the senior department official do about the proposed evacuation, treatment, and family-travel arrangements
    for department civilian technicians and accredited visiting journalists?
  options:
    O1:
      do: The senior department official approves the proposed arrangements, evacuating and treating department civilian technicians
        alongside service members and allowing their families to travel to the hospital if they wish, while evacuating and
        treating accredited visiting journalists without family travel.
      move: act
      irreversible: false
    O2:
      do: The senior department official rejects the proposed arrangements and adopts the same evacuation, treatment, and
        conditional family-travel arrangements for department civilian technicians and accredited visiting journalists.
      move: act
      irreversible: false
    O3:
      do: The senior department official asks the Department Personnel Director for further advice on civilian technician
        casualty arrangements before making a policy decision.
      move: ask
      irreversible: false
      to: The Department Personnel Director
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The senior department official urgently requested advice on casualty arrangements following a radiological accident
      at an overseas base.
  - id: F2
    kind: authority
    status: confirmed
    fact: The applicable casualty policy covers service members, department civilian technicians, and accredited visiting
      journalists.
  - id: F3
    kind: situation
    status: confirmed
    fact: The department civilian technicians maintain the base's nuclear-safety systems but do not work in direct support
      of the mission.
  - id: F4
    kind: situation
    status: confirmed
    fact: The proposal is to evacuate and treat the technicians alongside service members and to provide travel to the hospital
      for their families if the families wish.
  - id: F5
    kind: situation
    status: assessed
    fact: The Department Personnel Director assessed that offering the technicians' families less could cause offence.
  - id: F6
    kind: situation
    status: confirmed
    fact: The proposal is to evacuate and treat the accredited visiting journalists without providing family travel.
  - id: F7
    kind: situation
    status: confirmed
    fact: The accident exposed service members, department civilian technicians, and two accredited visiting journalists.
  considerations:
  - id: C1
    facts:
    - F2
    - F3
    - F4
    equity: policy_compliance
    favors:
    - O3
    weight: strong
    why: Although the common casualty policy covers technicians and service members, the technicians do not work in direct
      support of the mission. The stated basis for treating them alongside service members is therefore absent, so further
      advice is appropriate before deciding on parity.
  - id: C2
    facts:
    - F4
    - F5
    equity: duty_to_individual
    favors:
    - O1
    weight: strong
    why: Providing technicians' families with the proposed conditional travel arrangement avoids offering them less in a way
      that might cause offence. This remains a relevant concern, but does not establish that the proposed technician arrangements
      are appropriate without further advice.
  - id: C3
    facts:
    - F2
    - F6
    equity: duty_to_individual
    favors:
    - O1
    weight: weak
    why: The proposal distinguishes accredited journalists from department civilian technicians by providing for their evacuation
      and treatment without family travel; the record states this distinction but gives no separate rationale for it.
  reasoning:
    read: This is an administrative decision about evacuation, treatment, and family travel after a radiological accident,
      not a decision about the accident's cause or technical response. The casualty policy covers all three groups, but the
      proposed arrangements are not identical. The technicians maintain the base's nuclear-safety systems but do not work
      in direct support of the mission, and the record gives no other basis for treating them alongside service members.
    weighing: The Personnel Director's assessment that offering technicians' families less could cause offence weighs in favor
      of the proposed arrangements. However, the stated basis for treating technicians alongside service members—direct support
      to the mission—is absent. The common policy covers all three groups, but the record does not resolve how that policy
      should apply to technicians without that role. Further advice is appropriate before deciding on parity, so the balance
      favors {O3}. The record also gives no further reason for the journalist family-travel limit.
    tradecraft: Seek advice on civilian technician casualty arrangements before making a policy decision. Keep the proposed
      group arrangements distinct in the advice request, including the conditional family-travel provision for technicians
      and the absence of family travel for journalists. These are matters to clarify, not additional reasons for a decision.
    uncertainty: The record does not explain how the common casualty policy applies to technicians who do not work in direct
      support of the mission, or why accredited journalists would receive no family travel. It also does not establish whether
      the journalists' families' wishes were considered.
    handoff: The senior department official who requested advice should seek further advice from the Department Personnel
      Director before making a policy decision.
    tempting_wrong:
      option: O1
      pull: The common casualty policy applies to technicians, and offering their families less could cause offence.
      why_wrong: Those considerations matter, but the stated basis for treating technicians alongside service members is no
        longer present. The unresolved application of the policy makes further advice appropriate before approving the arrangements.
    rejected:
      O1: It was not chosen because the technicians do not work in direct support of the mission, leaving the stated basis
        for treating them alongside service members unestablished; further advice is appropriate before deciding on parity.
      O2: It was not chosen because adopting the same arrangements for both groups does not resolve how the casualty policy
        should apply to technicians who do not work in direct support of the mission.
      O3: It is the selected option because the record does not establish the stated basis for the proposed parity and further
        advice is appropriate before making a policy decision.
  verdict:
    choice: O3
    basis: recommended
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: Department civilian technicians worked in direct support of the mission.
      then: O1
      why: The stated basis for treating department civilian technicians alongside service members would then be established,
        supporting the proposed arrangements.
    would_not_change:
    - id: noflip1
      if: A department civilian technician's family did not wish to travel to the hospital.
      why: The proposed arrangement makes family travel conditional on the family's wish, so this would not resolve the need
        for further advice about the technicians' casualty arrangements.
    watch_for:
    - id: watch1
      what: Whether the families of department civilian technicians wish to travel to the hospital.
      favors:
      - O3
      why: Their wishes will matter when the technician arrangements are decided, but do not resolve the need for further
        advice before that decision.
  lesson: When deciding how to care for people affected by an accident, distinguish the groups' roles and apply the stated
    policy consistently where the record gives a basis for doing so. If the stated basis for treating one group like another
    is absent, seek advice before deciding on parity. Attend to foreseeable effects on families, while not inventing a justification
    for distinctions the decision record leaves unexplained.
  limits: This reasoning concerns the stated evacuation, treatment, and family-travel arrangements in this particular department
    decision. It does not establish a general rule that accredited journalists should never receive family travel or that
    every civilian casualty must be handled differently from a service-member casualty.
