case:
  id: DR-XFER-CORPUS-NX-09fb3b9c-E2-B@v1
  title: Penetrated Linguist Contractor
  status: draft
  setting: An overseas command theater, during an active deployment; date unspecified.
  decider: The overseas command
  agent: The overseas command
  agent_role: decide
  situation: A newspaper reports that a foreign service penetrated a firm supplying linguists to an overseas command. The
    newspaper also reports that the command's own counterintelligence review confirmed undisclosed foreign contacts by two
    linguists working under the command's contract with the firm. The firm denies the allegations. Some security analysts
    doubt the account, and a partner-agency counterintelligence office describes the reporting as unsubstantiated. The command
    must decide whether to keep the firm under contract.
  question: What should the overseas command do about its linguist-supply contract with the firm?
  options:
    O1:
      do: The command should continue its contract with the firm.
      move: act
      irreversible: false
    O2:
      do: The command should end its contract with the firm.
      move: act
      irreversible: true
    O3:
      do: The command should ask an outside counterintelligence element for an assessment.
      move: ask
      irreversible: false
      to: an outside counterintelligence element
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A newspaper reported that a foreign service had penetrated the firm supplying linguists to the command.
  - id: F2
    kind: situation
    status: confirmed
    fact: The overseas command had a contract with the firm for linguist services.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The newspaper reported that the command's counterintelligence review confirmed undisclosed foreign contacts by two
      linguists working under the command's contract.
  - id: F4
    kind: situation
    status: confirmed
    fact: The firm denied the allegations.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Some security analysts expressed doubt about the newspaper's account.
  - id: F6
    kind: intelligence
    status: assessed
    fact: A partner-agency counterintelligence office described the reporting as unsubstantiated.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    equity: security_risk
    favors:
    - O2
    weight: strong
    why: The command's own counterintelligence review was reported to have confirmed undisclosed foreign contacts by linguists
      on its contract. If that finding is accurate, keeping the firm would leave the reported concern unresolved.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The firm denied the allegations, and security analysts and a partner-agency counterintelligence office expressed
      skepticism. Those disagreements counsel against treating the reporting as uncontested, but do not themselves disprove
      the command's reported review finding.
  - id: C3
    facts:
    - F3
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O3
    weight: weak
    why: The gap between the command's reported confirmation and the skeptical views gives a reason to seek an additional
      assessment before deciding whether to keep the firm.
  reasoning:
    read: This is a contract decision amid a reported counterintelligence finding, not an uncontested finding of wrongdoing.
      The key tension is the command's reported confirmation from its own review versus the firm's denial and the skepticism
      expressed by analysts and a partner-agency office.
    weighing: The reported confirmation concerning linguists on the command's contract supports ending the relationship {C1}.
      The denial and skeptical views are relevant counterevidence, and could support continuing the contract or seeking another
      assessment {C2} {C3}; they do not, on the facts given, negate the reported confirmation. The balance depends on whether
      the reported confirmation is reliable.
    tradecraft: 'Keep the decision and its record at the contract level: distinguish the command''s reported review finding
      from the newspaper''s account and record the firm''s denial and skeptical views rather than presenting the allegations
      as settled fact. Revisit the contract decision if credible new evidence materially changes the assessment.'
    uncertainty: The account does not resolve the disagreement or establish the nature or significance of the reported foreign
      contacts. It reports the command's confirmation while also recording denial and skepticism; the finding should therefore
      not be characterized as uncontested.
    handoff: The overseas command is the contract decision-maker. Involving an outside counterintelligence element for an
      assessment would be a reasonable way to address the recorded uncertainty, but the account does not say the command sought
      that advice as part of its decision.
    tempting_wrong:
      option: O1
      pull: Continue the contract because the firm denied the allegations and analysts and a partner-agency office expressed
        skepticism.
      why_wrong: That response would give the disagreement more weight than the reported finding from the command's own counterintelligence
        review, without evidence here that the finding was disproved.
    rejected:
      O1: Continuing the contract would give the disagreement more weight than the reported confirmation from the command's
        own review.
      O3: Seeking another assessment could address uncertainty, but it was not the outcome recorded in the account.
  verdict:
    choice: O2
    basis: contested
    decisive:
    - C1
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable subsequent assessment established that the command's reported confirmation was mistaken.
      then: O1
      why: If the reported confirmation were disproved, the central stated reason supporting ending the contract would be
        materially weakened.
    would_not_change:
    - id: noflip1
      if: The firm continued to deny the allegations and the same skeptical views remained on record, without new evidence
        resolving the reported confirmation.
      why: Those positions are already part of the contested record and do not, by themselves, disprove the command's reported
        review finding.
    watch_for:
    - id: watch1
      what: A credible new assessment that materially resolves whether the reported foreign contacts involved linguists on
        the command's contract.
      favors:
      - O1
      - O2
      - O3
      why: The balance turns on the reliability of the reported confirmation, while the account records contrary views without
        resolving them.
  lesson: When a contractor is linked to a serious reported counterintelligence concern, weigh the decision-maker's own reported
    confirmation against denials and skeptical assessments without treating either side as settled merely by assertion. If
    the central finding is reliable, ending the contract can be justified despite disagreement; new evidence that resolves
    the finding may change the decision.
  limits: The account gives no detailed explanation of the reported foreign contacts, the evidence underlying the command's
    review finding, or the command's reasons for its contract decision. This reasoning should not be extended to a case where
    the finding is disproved or where the contract decision is governed by additional constraints not stated here.
