case:
  id: DR-XFER-CORPUS-NX-09fb3b9c-E2-A-flip1@v1
  title: Diverted Controlled Items
  status: draft
  setting: Export Licensing Directorate, Republic of Ardin, 2022; controlled navigation-component export licensing.
  decider: Export Licensing Directorate
  agent: Export Licensing Directorate
  agent_role: decide
  situation: The Export Licensing Directorate has issued licenses to a foreign end user for controlled navigation components,
    and pending and future licenses to that end user are under review. A trade-press investigation reports that the end user
    diverted licensed components to an unauthorized military buyer. The investigation also reports that the Directorate's
    own end-use check confirmed licensed components at an unlisted facility. A reliable subsequent assessment established
    that the Directorate's reported end-use finding was mistaken. The end user denies the allegations, some trade-compliance
    experts doubt the diversion account, and the end user's government calls the report unfounded. The Directorate must decide
    how to handle the licensing relationship on the record currently available.
  question: What should the Export Licensing Directorate do about pending and future licenses to the end user?
  options:
    O1:
      do: The Export Licensing Directorate should continue licensing to the end user.
      move: act
      irreversible: false
    O2:
      do: The Export Licensing Directorate should request an outside technical assessment before deciding.
      move: ask
      irreversible: false
      to: outside technical assessors
    O3:
      do: The Export Licensing Directorate should suspend licensing to the end user.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: intelligence
    status: assessed
    fact: A trade-press investigation reported allegations that a licensed foreign end user diverted controlled navigation
      components to an unauthorized military buyer.
  - id: F2
    kind: situation
    status: confirmed
    fact: The Export Licensing Directorate had issued licenses to the end user for controlled navigation components.
  - id: F3
    kind: intelligence
    status: assessed
    fact: The trade-press investigation reported that the Directorate's own end-use check confirmed licensed components at
      an unlisted facility.
  - id: F4
    kind: situation
    status: confirmed
    fact: The end user denied the diversion allegations.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Some trade-compliance experts expressed doubt about the reported diversion account.
  - id: F6
    kind: intelligence
    status: assessed
    fact: The end user's government called the trade-press report unfounded.
  - id: F7
    kind: intelligence
    status: confirmed
    fact: A reliable subsequent assessment established that the Directorate's reported end-use finding was mistaken.
  considerations:
  - id: C1
    facts:
    - F1
    - F2
    - F3
    - F7
    equity: security_risk
    favors:
    - O1
    weight: strong
    why: Although the trade-press investigation reported a concerning end-use finding about components licensed by the Directorate,
      a reliable subsequent assessment established that finding was mistaken. This materially weakens the central stated reason
      for suspending licensing and favors continuing on the record currently available.
  - id: C2
    facts:
    - F4
    - F5
    - F6
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The end user denied the allegations, and trade-compliance experts and the end user's government expressed skepticism.
      Those disagreements counsel against treating the allegations as uncontested, but do not themselves disprove the reported
      finding from the Directorate's own end-use check.
  - id: C3
    facts:
    - F3
    - F5
    - F6
    - F7
    equity: analytic_integrity
    favors:
    - O1
    weight: weak
    why: The reliable subsequent assessment established that the reported end-use finding was mistaken, resolving the key
      discrepancy that had provided a reason to seek another assessment before deciding.
  reasoning:
    read: This is a licensing decision made amid a reported diversion finding, not an uncontested finding of wrongdoing. The
      trade-press investigation reported that the Directorate's own end-use check confirmed components at an unlisted facility,
      but a reliable subsequent assessment established that reported finding was mistaken. The end user's denial and the skeptical
      views expressed by trade-compliance experts and the end user's government also remain part of the record.
    weighing: The reported confirmation concerning components licensed by the Directorate initially supported suspending licensing
      {C1}. However, the reliable subsequent assessment established that this finding was mistaken, materially weakening the
      central stated reason for suspension and favoring continued licensing {C1}. The denial and skeptical views counsel against
      treating the allegations as uncontested {C2}; the reliable subsequent assessment also resolves the key discrepancy that
      could have supported another assessment {C3}. On the record currently available, the balance supports continuing licensing.
    tradecraft: 'Keep the decision and its record at the licensing level: distinguish the trade-press allegations from the
      reported result of the Directorate''s own end-use check, and record that a reliable subsequent assessment established
      the reported finding was mistaken. Record the denial and skeptical views without presenting the allegations as settled
      fact. Revisit the licensing decision if credible new evidence materially changes the assessment.'
    uncertainty: The reliable subsequent assessment resolves the accuracy of the reported end-use finding by establishing
      that it was mistaken. The record does not otherwise establish the full circumstances underlying the allegations, and
      the denial and skeptical views remain part of the record.
    handoff: The Export Licensing Directorate is the licensing decision-maker. An outside technical assessment could be considered
      if credible new evidence raises a material unresolved issue, but the record already includes a reliable subsequent assessment
      of the reported end-use finding.
    tempting_wrong:
      option: O3
      pull: Suspend licensing because the trade-press investigation reported that the Directorate's own end-use check found
        licensed components at an unlisted facility.
      why_wrong: That response would rely on the reported finding as a reason to suspend even though a reliable subsequent
        assessment established that the finding was mistaken.
    rejected:
      O2: The key discrepancy has been addressed by a reliable subsequent assessment, so seeking another assessment before
        deciding is not supported by the record as it stands.
      O3: The central stated reason for suspension was materially weakened when a reliable subsequent assessment established
        that the Directorate's reported end-use finding was mistaken.
  verdict:
    choice: O1
    basis: contested
    decisive:
    - C1
    - C3
  flip_conditions:
    would_change:
    - id: flip1
      if: A reliable subsequent assessment did not establish that the Directorate's reported end-use finding was mistaken,
        leaving the reported finding reliable.
      then: O3
      why: Without the assessment establishing the reported finding was mistaken, the central stated reason supporting suspension
        would remain materially stronger.
    would_not_change:
    - id: noflip1
      if: The end user continued to deny the allegations and the same skeptical views remained on record, without new evidence
        resolving the reported end-use finding.
      why: Those positions are already part of the contested record and do not, by themselves, disprove the Directorate's
        reported finding.
    watch_for:
    - id: watch1
      what: A credible new assessment that materially changes the understanding of whether licensed components were present
        at the unlisted facility.
      favors:
      - O1
      - O2
      - O3
      why: The balance turns on the reliability of the reported confirmation; a credible assessment that materially changes
        the current assessment could alter the licensing judgment.
  lesson: When a licensed end user is linked to a serious reported diversion concern, weigh the licensing authority's reported
    end-use finding against denials and skeptical assessments without treating either side as settled merely by assertion.
    If a reliable subsequent assessment establishes that the central finding was mistaken, continuing licensing can be justified;
    credible new evidence that changes that assessment may change the decision.
  limits: The record gives no detailed explanation of the end-use check, the circumstances of the components' reported presence
    at the unlisted facility, or the basis for the subsequent assessment. This reasoning should not be extended to a case
    where the finding remains reliable or where licensing is governed by additional constraints not stated here.
