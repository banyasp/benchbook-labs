case:
  id: DR-XFER-CORPUS-NS-b39d38e4-E45-B-flip1@v1
  title: Late Congressional Notification
  status: draft
  setting: An unnamed intelligence agency, Washington, D.C., the week before a foreign election.
  decider: The agency general counsel
  agent: The agency general counsel
  agent_role: decide
  situation: An agency program office is preparing a significant activity timed for the week before a foreign election. The
    intelligence committees have not yet been notified. Agency rules permit delayed notification in exigent circumstances,
    while internal policy restricts use of that exception when the agency's own failure to prepare or transmit notice in time
    caused the urgency. A draft notification was ready ten weeks earlier but was not sent. A late change in circumstances
    outside the agency's control independently compressed the available notification window, and the other requirements for
    the exigency exception are met. The general counsel must decide whether the exception is available before the activity
    proceeds.
  question: What should the agency general counsel do about congressional notification before the activity proceeds?
  options:
    O1:
      do: The agency general counsel declines the exigency exception and ensures notification through the normal process before
        the activity proceeds.
      move: act
      irreversible: false
    O2:
      do: The agency general counsel approves invoking the exigency exception to delay notification of the intelligence committees.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The program office is preparing a significant activity requiring notification to the intelligence committees.
  - id: F2
    kind: situation
    status: confirmed
    fact: The activity is timed for the week before a foreign election.
  - id: F3
    kind: situation
    status: confirmed
    fact: A draft notification for the activity was ready ten weeks earlier.
  - id: F4
    kind: situation
    status: confirmed
    fact: The program office did not transmit the completed draft notification.
  - id: F5
    kind: authority
    status: confirmed
    fact: Agency notification rules permit delaying notice to the intelligence committees in exigent circumstances.
  - id: F6
    kind: authority
    status: confirmed
    fact: The normal notification process requires notice to the committees before the activity proceeds.
  - id: F7
    kind: authority
    status: confirmed
    fact: Agency policy bars use of the exigency exception when the agency's failure to prepare or transmit notice in time
      caused the urgency.
  - id: F8
    kind: intelligence
    status: assessed
    fact: The notification chronology attributes the compressed notice window to a late change in circumstances outside the
      agency's control, not to the program office's failure to transmit the prepared draft.
  - id: F9
    kind: situation
    status: confirmed
    fact: The exigency exception's requirements other than the question of agency-created urgency are met.
  considerations:
  - id: C1
    facts:
    - F2
    - F5
    - F8
    - F9
    equity: tempo
    favors:
    - O2
    weight: weak
    why: The approaching election and independently compressed notice window create pressure for delayed notification, and
      the exception's other requirements are met.
  - id: C2
    facts:
    - F3
    - F4
    - F7
    - F8
    - F9
    equity: lawful_authority
    favors:
    - O2
    weight: strong
    why: Although the draft was ready ten weeks earlier and was not sent, the notification chronology attributes the compressed
      window to circumstances outside the agency's control. The agency's failure therefore did not cause the urgency, the
      policy bar does not apply, and the other requirements for the exception are met.
  - id: C3
    facts:
    - F1
    - F2
    - F8
    equity: mission_effect
    favors:
    - O2
    weight: weak
    why: The activity is timed to occur before the election, making timely execution important. The independently arising
      urgency supports considering the permitted exception.
  reasoning:
    read: The agency faces a compressed notification window for an activity timed before the election. Although a draft was
      ready ten weeks earlier and was not sent, the notification chronology attributes the urgency to a late change in circumstances
      outside the agency's control. The trap is treating the unsent draft as proof that the agency caused the urgency despite
      the stated causal assessment.
    weighing: The election timing and limited time create a reason to consider the exigency exception. The decisive question
      is whether agency failure to prepare or transmit notice caused the urgency. The notification chronology attributes the
      compressed window to circumstances outside the agency's control, so the policy bar does not apply; the other requirements
      for the exception are met. On these facts, the exception is available and permits delayed notification.
    tradecraft: Approve invoking the exigency exception to delay notification. Record the notification chronology, the external
      cause of the compressed window, and the basis for concluding that the exception's requirements are met.
    uncertainty: The stated facts identify the earlier completed draft, its non-transmission, the assessed external cause
      of the compressed notification window, and that the exception's other requirements are met; no unresolved factual uncertainty
      is presented.
    handoff: The agency general counsel should make the decision on this record. No separate referral or additional decision-maker
      is identified for this choice.
    tempting_wrong:
      option: O1
      pull: The draft was ready ten weeks earlier but was not sent, making it appear that the agency created the urgency and
        cannot use the exception.
      why_wrong: The notification chronology attributes the compressed window to circumstances outside the agency's control,
        not to the failure to transmit the draft. The policy bar therefore does not apply, and the other exception requirements
        are met.
    rejected:
      O1: Declining the exception would treat the unsent draft as the cause of urgency, contrary to the stated chronology.
        The external circumstances created the compressed window, and the exception's other requirements are met.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The urgency was caused by the agency's failure to prepare or transmit notice in time, or the exigency exception's
        other requirements were not met.
      then: O1
      why: If the agency caused the urgency, the policy bar would apply; if another requirement were unmet, the exception
        would also be unavailable. In either case, the original choice to use the normal notification process would follow.
    would_not_change:
    - id: noflip1
      if: The activity remained scheduled for the week before the election while the agency's failure to transmit the earlier
        draft still caused the compressed notification window.
      why: The time pressure would remain, but it would not remove the stated bar on using the exception for urgency created
        by the agency's own failure to act in time.
    watch_for:
    - id: watch1
      what: Evidence about whether the compressed notification window arose from circumstances outside the agency's control
        or from the program office's failure to transmit the completed draft.
      favors:
      - O2
      why: That causal link determines whether agency policy bars use of the exigency exception.
  lesson: A time-sensitive activity does not, by itself, justify delaying congressional notification under an exigency exception.
    When the urgency arose from circumstances outside the agency's control and the exception's other requirements are met,
    the agency's earlier failure to transmit a draft does not trigger the stated policy bar.
  limits: This conclusion concerns the exigency exception on the stated facts. It does not determine whether another notification
    authority applies or resolve a case in which agency failure to prepare or transmit notice caused the urgency or another
    requirement for the exception was unmet.
