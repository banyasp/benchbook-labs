case:
  id: DR-XFER-CORPUS-NX-7b45b55b-E2-A-flip1@v1
  title: Where to Place the Clearance-Adjudication Facility
  status: draft
  setting: A fictional federal department, at the decision point on a consolidated clearance-adjudication facility; the proposals
    are a defense counterintelligence agency facility or a government-wide center at the civilian personnel agency.
  decider: The Deputy Secretary of Defense
  agent: The Deputy Secretary of Defense
  agent_role: decide
  situation: The Deputy Secretary of Defense must decide where to place a proposed consolidated facility for adjudicating
    security clearances. The sponsor favors locating it at the defense counterintelligence agency, whose investigative expertise
    is relevant to the work. An alternative proposal would place a government-wide center at the civilian personnel agency,
    reflecting the government-wide nature of clearance reciprocity. Defense components agree that a facility is needed but
    expect interference and have raised concerns about working relationships. The counterintelligence agency’s director favors
    a campus location, but the facility cannot be kept outside the agency’s chain of command or given a separate budget. The
    agency’s investigative units produce records that may be reviewed in clearance adjudications, and participants have raised
    questions about impartiality if the investigative and adjudicative roles are not clearly separated.
  question: What should the Deputy Secretary of Defense do about the proposed facility’s location and organization and the
    assignment of clearance-adjudication responsibility?
  options:
    O1:
      do: The Deputy Secretary of Defense should approve the clearance-adjudication facility at the defense counterintelligence
        agency and assign the consolidated adjudication responsibility to it.
      move: act
      irreversible: false
    O2:
      do: The Deputy Secretary of Defense should reject the facility at the defense counterintelligence agency and pursue
        a government-wide center at the civilian personnel agency.
      move: act
      irreversible: false
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The initial proposal is for a consolidated clearance-adjudication facility located at the defense counterintelligence
      agency.
  - id: F2
    kind: situation
    status: assessed
    fact: Other defense components consider a consolidated facility necessary but expect interference from locating it at
      the counterintelligence agency.
  - id: F3
    kind: situation
    status: assessed
    fact: An alternative proposal places a government-wide clearance-adjudication center at the civilian personnel agency
      because reciprocity is a government-wide problem.
  - id: F4
    kind: capability
    status: assessed
    fact: The proposal’s sponsor prefers locating the facility at the counterintelligence agency because of its investigative
      expertise.
  - id: F5
    kind: situation
    status: assessed
    fact: The counterintelligence agency’s director assesses that standards designed around defense clearance requirements
      could impose unnecessary cost on civilian agencies.
  - id: F6
    kind: situation
    status: assessed
    fact: The director favors a campus location, but the facility cannot be kept outside the agency’s chain of command or
      given its own budget, leaving concerns about agency influence over adjudication unaddressed.
  - id: F7
    kind: situation
    status: assessed
    fact: The director says the facility requires full commitment from its participating components.
  - id: F8
    kind: situation
    status: confirmed
    fact: Defense leaders have expressed concern about working relationships within the proposed facility while agreeing that
      a consolidated facility is needed.
  - id: F9
    kind: situation
    status: assessed
    fact: The agency’s investigative units produce records that may be reviewed in clearance adjudications, and participants
      have raised questions about impartiality if investigative and adjudicative roles are not clearly separated.
  considerations:
  - id: C1
    facts:
    - F8
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: Defense leaders have concerns about working relationships but do not dispute the need for a consolidated facility;
      those concerns do not by themselves preclude assigning the work to the proposed facility.
  - id: C2
    facts:
    - F4
    equity: mission_effect
    favors:
    - O1
    weight: strong
    why: The sponsor prefers locating the facility at the counterintelligence agency because of its investigative expertise.
  - id: C3
    facts:
    - F6
    - F9
    equity: institutional_credibility
    favors:
    - O2
    weight: strong
    why: The facility cannot be kept outside the agency’s chain of command or given a separate budget, leaving the agency’s
      influence over adjudications unaddressed. This is especially concerning because agency investigative records may be
      reviewed in those adjudications and participants have raised impartiality concerns.
  - id: C4
    facts:
    - F3
    - F5
    equity: resource_stewardship
    favors:
    - O2
    weight: weak
    why: Clearance reciprocity is government-wide, and defense-oriented standards could impose unnecessary cost on civilian
      agencies.
  - id: C5
    facts:
    - F2
    - F7
    equity: institutional_credibility
    favors:
    - O2
    weight: weak
    why: Other components expect interference from the agency location, while the director cautions that the facility depends
      on full commitment from its participants.
  reasoning:
    read: 'The decision is not whether consolidated clearance adjudication is needed: defense leaders agree that it is. The
      question is whether the counterintelligence agency can host and receive responsibility for the facility without undermining
      participants’ confidence, including confidence in impartiality where investigative records are considered, or imposing
      defense-oriented requirements on civilian agencies.'
    weighing: The government-wide scope of reciprocity, the potential cost of defense-oriented standards, and concerns about
      interference support the civilian personnel agency alternative {C4} {C5}. The sponsor’s preference for the counterintelligence
      agency reflects its investigative expertise, and defense leaders’ concerns about working relationships do not amount
      to disagreement about the need for a facility {C1} {C2}. But the proposed facility cannot be kept outside the agency’s
      chain of command or given a separate budget, leaving concerns about agency influence and impartiality unaddressed where
      agency investigative records may be reviewed {C3}. Without that safeguard, the institutional credibility concern outweighs
      the advantages of the agency location. The balance favors pursuing the government-wide center at the civilian personnel
      agency.
    tradecraft: Record the reasons for pursuing the civilian personnel agency alternative, including the unresolved independence
      and impartiality concerns and the government-wide scope of reciprocity. Involve representatives of the participating
      organizations in developing the center’s charter and address the stated standards, working-relationship, and commitment
      concerns.
    uncertainty: The concerns about working relationships, perceived agency influence, impartiality, and civilian costs are
      not shown as resolved by selecting the civilian personnel agency alternative.
    handoff: The Deputy Secretary makes the assignment, while representatives of the organizations whose clearances and records
      the center will address should participate in developing its charter because the stated concerns involve their working
      relationships, confidence, and commitment.
    tempting_wrong:
      option: O1
      pull: The counterintelligence agency has relevant investigative expertise, and the sponsor prefers locating the facility
        there.
      why_wrong: The proposed facility cannot be kept outside the agency’s chain of command or given a separate budget. Because
        the agency’s investigative records may be considered in adjudications, the lack of that separation leaves concerns
        about agency influence and impartiality unaddressed. The government-wide alternative is therefore more compelling.
    rejected:
      O1: The Deputy Secretary does not approve the facility at the counterintelligence agency or assign it the consolidated
        adjudication responsibility, instead pursuing a government-wide center at the civilian personnel agency.
  verdict:
    choice: O2
    basis: settled
    decisive:
    - C3
    - C4
    - C5
  flip_conditions:
    would_change:
    - id: flip1
      if: The facility could be kept outside the counterintelligence agency’s chain of command with its own budget, addressing
        concerns about agency influence and impartiality.
      then: O1
      why: The original rationale for locating the facility at the agency includes separating it from the agency’s chain and
        limiting perceived influence over adjudications; with that safeguard in place, the expertise and other reasons supporting
        the agency location would favor the original choice.
    would_not_change:
    - id: noflip1
      if: Defense leaders continued to have concerns about working relationships while agreeing that a consolidated facility
        was needed.
      why: Those concerns do not by themselves resolve the location question.
    watch_for:
    - id: watch1
      what: Whether the organizations involved commit fully to the facility and its charter.
      favors:
      - O2
      why: The director said the proposed facility needs full commitment from its participants.
    - id: watch2
      what: Whether defense-oriented adjudication standards impose unnecessary cost on civilian agencies.
      favors:
      - O2
      why: The director identified those costs as a risk when standards designed around defense requirements are applied more
        broadly.
  lesson: When participants agree that a capability is necessary but dispute its institutional home, weigh the host’s relevant
    expertise against risks to interagency confidence and broader applicability. If the proposed host cannot provide meaningful
    independence and impartiality safeguards, those risks may outweigh the host’s expertise.
  limits: This reasoning concerns the organizational location and assignment of a consolidated clearance-adjudication facility,
    not its adjudication procedures or the merits of individual clearance decisions. It does not establish that a civilian
    personnel agency arrangement is preferable where the expertise, independence safeguards, or participant commitment differ.
