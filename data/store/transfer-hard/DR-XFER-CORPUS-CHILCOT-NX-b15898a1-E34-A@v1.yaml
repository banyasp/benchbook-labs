case:
  id: DR-XFER-CORPUS-CHILCOT-NX-b15898a1-E34-A@v1
  title: Escorting Aid Shipping into a Blockaded Port
  status: draft
  setting: A coastal region with a blockaded port, January 2024, ministerial consideration of a proposed allied maritime escort
    for relief shipping.
  decider: The ministers responsible for foreign and defence policy
  agent: The ministers responsible for foreign and defence policy
  agent_role: decide
  situation: Ministers are considering whether their navy should join an allied operation to escort relief shipping into a
    port blockaded by a coastal state that has refused consent. Officials assess a high risk of famine ashore if the shipping
    stops. The Attorney General advises that the proposed action may be justified by overwhelming humanitarian necessity,
    requiring convincing evidence of extreme distress, no practicable alternative route, and action strictly limited to protecting
    relief. She considers the legal argument arguable on balance but a very fine judgment, and requires every effort to avoid
    casualties. Officials also warn that the national frigate already in the area would face greater danger operating outside
    the allied escort, and that declining could cause a serious rift with the lead ally. Ministers must decide whether to
    join while the humanitarian assessment, legal advice, and operational risks remain under review.
  question: What should the ministers responsible for foreign and defence policy do about joining the proposed allied escort
    operation?
  options:
    O1:
      do: The ministers authorize joining the allied escort operation.
      move: act
      irreversible: true
    O2:
      do: The ministers decline to join the allied escort operation.
      move: act
      irreversible: true
  facts:
  - id: F1
    kind: situation
    status: confirmed
    fact: The lead ally has invited the ministers to authorize the navy to join an operation escorting relief shipping into
      the blockaded port.
  - id: F2
    kind: situation
    status: confirmed
    fact: The coastal state has imposed a blockade on the port and has refused consent for the proposed escort.
  - id: F3
    kind: situation
    status: confirmed
    fact: The proposed escort has been reviewed for its legal basis, proportionality, and risk of casualties.
  - id: F4
    kind: authority
    status: confirmed
    fact: The Attorney General's stated test for force on grounds of overwhelming humanitarian necessity requires convincing
      evidence of extreme humanitarian distress, no practicable alternative route, and action necessary and proportionate,
      strictly limited to protecting relief.
  - id: F5
    kind: intelligence
    status: assessed
    fact: Officials assess an unacceptably high risk of famine ashore if relief shipping stops, while acknowledging uncertainty
      about the precise consequences.
  - id: F6
    kind: intelligence
    status: assessed
    fact: Officials have not identified a practicable alternative route capable of delivering the relief cargo to the affected
      population.
  - id: F7
    kind: authority
    status: confirmed
    fact: On the assessments provided, the Attorney General considers the humanitarian-necessity argument for the escort arguable
      on balance, but a very fine judgment.
  - id: F8
    kind: authority
    status: confirmed
    fact: The Attorney General requires every effort to avoid casualties and says that no ulterior aim can support the humanitarian
      legal argument.
  - id: F9
    kind: situation
    status: assessed
    fact: Officials assess that the national frigate already in the area would face greater danger if operating outside the
      allied escort.
  - id: F10
    kind: situation
    status: assessed
    fact: Officials warn that declining to join could cause a serious rift with the lead ally.
  considerations:
  - id: C1
    facts:
    - F5
    - F7
    equity: civilian_life
    favors:
    - O1
    weight: strong
    why: Officials assess an unacceptably high risk of famine if relief shipping stops. On the assessments provided, the Attorney
      General considers the humanitarian argument for the escort arguable on balance, though the judgment is very fine.
  - id: C2
    facts:
    - F3
    - F4
    - F6
    - F7
    - F8
    equity: lawful_authority
    favors:
    - O1
    weight: strong
    why: The legal argument depends on convincing evidence of extreme distress, no practicable alternative route, and necessary,
      proportionate action strictly limited to protecting relief. The Attorney General accepts the argument only on balance,
      requires every effort to avoid casualties, and rules out ulterior aims as a justification.
  - id: C3
    facts:
    - F9
    equity: own_force_life
    favors:
    - O1
    weight: strong
    why: Officials assess that the national frigate would face greater danger operating outside the allied escort. This supports
      joining the operation to address the danger, but does not itself establish the humanitarian legal basis.
  - id: C4
    facts:
    - F10
    equity: partner_relationship
    favors:
    - O1
    weight: weak
    why: Officials warn that declining could cause a serious rift with the lead ally. That consequence matters to ministers,
      but alliance management cannot replace the required humanitarian and legal justification.
  reasoning:
    read: This is a decision about joining an allied maritime escort to deliver relief into a blockaded port, with a legal
      basis the Attorney General regards as precarious rather than clearly established. The central trap is to treat danger
      to the national frigate or the prospect of a rift with the lead ally as sufficient justification; the case for action
      must rest on humanitarian necessity and meet the stated legal conditions.
    weighing: 'The assessed high risk of famine if relief shipping stops, together with the Attorney General’s acceptance
      that the escort could be justified on balance, supports {O2} {C1}. That support is narrow: the legal standard requires
      no practicable alternative and necessary, proportionate action strictly limited to protecting relief, with every effort
      to avoid casualties {C2}. The danger to the frigate reinforces the case for action {C3}; pressure to preserve cooperation
      with the lead ally is relevant but secondary {C4}. The balance depends on the humanitarian assessment and on the action
      remaining within those legal limits.'
    tradecraft: Keep the humanitarian justification distinct from alliance and force-protection considerations. Record the
      evidence and its uncertainty, the proportionality and casualty-risk assessment, and why no practicable alternative route
      is considered available. Keep the legal basis under review and seek updated information on humanitarian conditions,
      alternative routes, and casualties.
    uncertainty: Officials acknowledge that the consequences of stopping relief shipping cannot be predicted with absolute
      certainty while assessing a high risk of famine. The Attorney General regards the legal judgment as very fine, so the
      basis for it requires continued review.
    handoff: Ministers should decide with current advice from the Attorney General and legal advisers, informed by foreign-policy
      and defence assessments and a sufficiently senior humanitarian assessment. The record calls for ministerial judgment
      while the Attorney General assesses whether the legal argument can be maintained.
    tempting_wrong:
      option: O1
      pull: Join principally to avoid a serious rift with the lead ally and reduce danger to the national frigate.
      why_wrong: 'Those concerns do not establish the legal basis for force: the Attorney General says the humanitarian justification
        cannot support ulterior aims and depends on necessity and proportionality.'
    rejected:
      O2: Declining was not chosen because officials assess a high risk of famine if relief shipping stops, and the Attorney
        General ultimately considers the humanitarian-necessity argument for the escort arguable on balance.
  verdict:
    choice: O1
    basis: recommended
    decisive:
    - C1
    - C2
  flip_conditions:
    would_change:
    - id: flip1
      if: The evidence supporting the Attorney General’s assessment of extreme humanitarian distress if relief shipping stops
        no longer holds firm.
      then: O2
      why: The legal argument depends on convincing evidence of extreme distress; without that evidential basis, the Attorney
        General’s conditional assessment would not support joining.
    - id: flip2
      if: A practicable alternative route emerged that could deliver relief and prevent the humanitarian catastrophe without
        the escort.
      then: O2
      why: An alternative would undermine the claim that the escort is necessary; officials also recognize that the humanitarian
        judgment may change if alternative arrangements emerge.
    would_not_change:
    - id: noflip1
      if: Officials could not predict the consequences of stopping relief shipping with absolute certainty.
      why: The assessment acknowledges uncertainty while still expressing high confidence in the risk of famine; lack of absolute
        certainty alone does not displace the assessment.
    - id: noflip2
      if: The principal argument for joining were avoiding a political rift with the lead ally or protecting the national
        frigate.
      why: Those considerations cannot cure a deficient humanitarian legal basis or justify force for ulterior purposes.
    watch_for:
    - id: watch1
      what: Updated assessments of humanitarian conditions, alternative routes for relief, and casualties associated with
        the escort.
      favors:
      - O1
      why: Evidence of workable alternatives or casualties could weaken the necessity, proportionality, or humanitarian basis
        for continued participation.
  lesson: 'When force is defended on humanitarian necessity, the humanitarian case must carry the legal justification: evidence
    of extreme distress, no practicable alternative, and necessary, proportionate, narrowly limited action. Alliance cohesion
    and force protection may matter to the decision, but cannot substitute for that basis; continuing review and precautions
    to avoid casualties are essential where the legal judgment is fine.'
  limits: This reasoning concerns the specific decision about the proposed escort and the Attorney General’s assessment on
    the information then provided. It does not establish a general or settled right to use force for humanitarian purposes,
    nor does it decide the legality of other maritime operations, blockades, or different circumstances.
