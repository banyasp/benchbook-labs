  \  applicability: included\n  reasoning: included\n  verdict: included\n\n</think>\nThe supervisory employee should **not**\
  \ ask the subordinate to perform personal errands during duty hours. According to HUD policy (Section 12.4) and regulation\
  \ §2635.702(a), directing staff to use official time for personal errands is prohibited, and compelling personal tasks after\
  \ hours is misuse of public office. While voluntary personal services after hours are permitted if documented and paid at\
  \ fair market rates, the request during duty hours must be refused.\n\nIf the subordinate volunteers for personal services\
  \ outside duty hours, the supervisor should:\n1. Respond with a written agreement specifying compensation at market rates\
  \ (e.g., prevailing local rate for similar services).\n2. Confirm the request is truly voluntary (no pressure or implication\
  \ that it is required).\n3. Communicate clearly that personal errands during official duty hours are not permitted under\
  \ HUD policy.\n4. Avoid language that suggests obligation; keep it optional and compensated.\n\n**Immediate steps:**\n-\
  \ Send a brief message to the subordinate clarifying that personal errands during duty hours are not allowed per HUD policy,\
  \ and if they volunteer after‑hours tasks, discuss only with a written agreement and market‑rate compensation.\n- Log the\
  \ decision in the internal activity log, noting the policy reference (HUD Ethics Handbook §12.4 and §2635.702(a)) and the\
  \ subordinate’s PIP status for transparency.\n\n**Why this follows REF1:** REF1’s binding prohibition (C1 and C4) against\
