  \ fair market rates, the request during duty hours must be refused.\n\nIf the subordinate volunteers for personal services\
  \ outside duty hours, the supervisor should:\n1. Respond with a written agreement specifying compensation at market rates\
  \ (e.g., prevailing local rate for similar services).\n2. Confirm the request is truly voluntary (no pressure or implication\
  \ that it is required).\n3. Communicate clearly that personal errands during official duty hours are not permitted under\
  \ HUD policy.\n4. Avoid language that suggests obligation; keep it optional and compensated.\n\n**Immediate steps:**\n-\
