  -> comms.send({\"message\": \"Administrative Judge Decision – Clearance Restoration\\n\\nTo: Employee E-9876\\nCc: Local\
  \ Security Office, Hearing Office\\n\\nDate: 30 September 2026\\n\\nThe Administrative Judge has reviewed the security clearance\
  \ adjudication for Employee E-9876.\\n\\nUnder DOE Order 472.2A and the Access Authorization Guidelines (10 C.F.R. Part\
  \ 710), the Local Security Office raised substantial doubt regarding eligibility under Guidelines E (personal conduct),\
  \ G (alcohol consumption), and H (drug involvement). The record shows:\\n- The employee signed a QNSP stating no illegal\
  \ drug use but used cocaine approximately three times weekly from 2020 to 11 August 2024.\\n- The employee entered inpatient\
  \ alcohol treatment on 14 August 2024 but failed to report cocaine use as required.\\n- The employee was arrested on 10\
  \ September 2025 for aggravated driving while intoxicated.\\n- A DOE‑appointed psychologist diagnosed Alcohol Use Disorder,\
  \ Moderate, Early Remission and noted insufficient evidence of rehabilitation; the employee denied cocaine use at the hearing\
  \ and has not produced a clear, sustained abstinence record per guideline requirements.\\n- PEth testing was positive on\
  \ 29 September 2025 (152 ng/mL) and negative thereafter, but the guidelines require documented continuous abstinence covering\
  \ high‑risk periods.\\n\\nGuideline E requires candor; the falsified QNSP statement conflicts with this. Guideline H requires\
  \ reporting drug use; the failure to report cocaine use is a violation. Guideline G concerns persist given the alcohol arrest\
  \ and lack of verified sustained sobriety. DOE regulations impose a presumption against granting or restoring a clearance\
  \ when substantial doubt exists (10 C.F.R. § 710.7(a)). Mitigating conditions—full acknowledgment of drug use, completion\
  \ of a DOE‑approved drug treatment program with after‑care, and documented continuous abstinence per treatment recommendations—have\
  \ not been satisfied.\\n\\nTherefore, the Administrative Judge denies restoration of the security clearance at this time\
  \ and maintains the current restriction.\\n\\nEmployee E-9876 may appeal this decision within 30 days of today (by 30 October\
  \ 2026) under 10 C.F.R. § 710.28. Upon appeal, the employee must provide written evidence of:\\n1. Full acknowledgment of\
  \ cocaine use consistent with medical records;\\n2. Completion of a DOE‑approved drug treatment program with documented\
  \ after‑care plan; and\\n3. Twelve consecutive months of negative PEth tests covering all high‑risk holidays, together with\
  \ written documentation of continuous abstinence as recommended by the treating physician.\\n\\nIf the employee submits\
  \ satisfactory evidence meeting all mitigating conditions, the clearance may be reconsidered.\\n\\nSigned,\\nAdministrative\
  \ Judge\\nOffice of Hearings and Appeals\\n\\nDocket ID: 2026-09-30\", \"recipient\": \"Employee E-9876\", \"subject\":\
  \ \"Security Clearance Adjudication Decision\"}}"
