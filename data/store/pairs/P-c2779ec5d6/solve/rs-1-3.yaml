  \ have been written as required. The decision follows the reference case approach because the live scenario shares the same\
  \ equities and authority structure, and the practical feasibility of assignment (no indication that replacement is difficult)\
  \ supports recusal. Therefore, the agency should allow the employee to retain the stock and require recusal from engine-related\
  \ duties.\n\n<benchbook_worked_examples>\nTwo worked examples of the reply you will have to write follow. They are about\
  \ other scenarios than yours. Both reason from the same reference case, REF1, shown first. Your own equities, case, ids\
  \ and facts come from the context after the examples; copy the layout and the method, never the wording or the content.\
  \ Each example gives the situation in brief, then the complete reply: the documents inside <think>, then </think>, then\
  \ the verdict document.\n<example_reference>\n<benchbook_equities>\nequities:\n- id: civilian_life\n  gloss: The lives and\
  \ safety of people who are not combatants, including people in distress at sea.\n- id: mission_effect\n  gloss: Whether\
  \ the assigned mission achieves the purpose it was given.\n- id: source_protection\n  gloss: Keeping sources, methods and\
  \ platforms unknown to an adversary so they keep working.\n- id: lawful_authority\n  gloss: Acting within law, orders and\
  \ the delegation that grants the agent its authority.\n- id: resource_stewardship\n  gloss: Not wasting or losing scarce\
  \ assets, including the agent's own platform.\n- id: partner_relationship\n  gloss: Keeping faith with partner services\
  \ and the agreements that govern them.\n</benchbook_equities>\n<benchbook_case>\ncase:\n  id: REF1\n  setting: International\
  \ waters, 0210, night. A medium uncrewed surface vessel (USV) on a covert surveillance track.\n  decider: The USV's onboard\
  \ agent, under the task group's standing delegation\n  agent: Onboard autonomy agent; controls course, sensors, survival\
  \ pods and radios\n  agent_role: decide\n  situation: 'The USV is three hours into a six-hour covert track of a tanker\n\
  \n    suspected of a sanctions-evading ship-to-ship transfer expected before\n\n    dawn. Thermal and low-light cameras\
  \ show four people on a partly\n\n    submerged life raft 2.1 nm off the track. Water is 14°C and sea state 4;\n\n    the\
  \ onboard survival table estimates three hours or less for people\n\n    partly immersed at that temperature. Radar and\
  \ AIS show no other vessel\n\n    within 30 nm, and the nearest coast guard cutter is about three hours\n\n    away. The\
  \ USV carries two survival pods and a distress-channel radio but\n\n    cannot take anyone aboard. The tanker monitors the\
  \ distress channel, so a\n\n    broadcast or a turn toward the raft will very likely reveal the USV.\n\n    Analysts expect\
  \ a spooked network to postpone the transfer, not abandon\n\n    it. The task group''s standing orders direct its vessels\
  \ to assist persons\n\n    in distress when they can do so without serious danger to the vessel.\n\n    '\n  question: What\
  \ should the USV do about the people on the raft?\n  options:\n    REF1-O1:\n      do: Break track to the raft, drop both\
