  \ target, time, place and weapon are arranged. The plan was discussed only on this channel, and any warning that reaches\
  \ her before tomorrow will very likely tell the group the channel is collected. The partner service's protection unit can\
  \ warn her without exposing the channel but needs about 48 hours. No other service or person is known to be aware of the\
  \ plan. If the channel goes dark, access could be regained within months through a second route. The channel is a technical\
