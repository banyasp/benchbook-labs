  \ classified projects.\"}\n  - {id: LIVE-F6, kind: situation, status: confirmed, fact: \"The Individual acknowledged using\
  \ cocaine on 14 March 2026 at a social gathering.\"}\n  - {id: LIVE-F7, kind: intelligence, status: assessed, fact: \"He\
  \ initially told his employer he had not used drugs, but in May 2026 he admitted that statement was false.\"}\n  - {id:\
