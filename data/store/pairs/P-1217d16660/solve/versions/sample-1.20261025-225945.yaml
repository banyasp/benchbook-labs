  \ drug use.\"}\n  - {id: LIVE-F9, kind: situation, status: confirmed, fact: \"He later provided a hair test on 28 July 2026\
  \ and a urine test on 12 August 2026, both of which were negative for cocaine.\"}\n  - {id: LIVE-F10, kind: intelligence,\
  \ status: confirmed, fact: \"No expert testimony was offered concerning the detection windows of those drug tests.\"}\n\
