  \ |\n  REF1 asks first who else can help, and how soon, against how long the people have. When the asset is the only help\
  \ in time and the mission loss is recoverable, lives come first, and it acts even though acting reveals it. It names both\
  \ conditions as what makes that priority hold.\nweighing: |\n  Both conditions hold here. The attack is planned for tomorrow\
  \ morning, the partner's protection unit needs about two days, and no one else knows (LIVE-C1): mine is the only warning\
  \ in time. The access can be regained within months (LIVE-C3), so the mission loss is a delay, as in REF1. The warning tells\
  \ the group its channel is collected (LIVE-C4), as REF1's broadcast revealed the USV, and REF1 accepted that cost on the\
  \ same terms. Neither of REF1's would_change items has a counterpart that holds. No other responder can warn her in time\
  \ (REF1-flip1). REF1-flip2 turns on helping that puts the asset in serious danger; the analog here would be a warning that\
  \ endangers a person, and the channel is a technical intercept with no one behind it (LIVE-F11). The same fact keeps the\
  \ procedure's exception from applying (LIVE-C5): exposing a recoverable technical access is not undue endangerment.\n  The\
  \ consultation the liaison agreement asks for (LIVE-C6) has no counterpart in REF1. It weighs toward the partner's route\
  \ but cannot decide against the only warning in time. It can be honored in spirit by having the chief tell the partner today.\n\
  \  REF1 says the count does not turn its weighing (REF1-noflip1); one person here rather than four does not change who can\
  \ reach her in time.\ntradecraft: |\n  Issue the warning anonymously, and word it to reveal as little as possible about\
  \ how we know: the threat, the time, and the advice to leave, nothing more about the channel. Notify the station chief at\
  \ once, so the channel loss and the partner relationship are managed today. Log the intercept, the partner's timeline and\
  \ the reason I did not wait for it.\nuncertainty: |\n  The plan is assessed as credible, not confirmed. The partner's 48\
  \ hours is an estimate, and if it could act tonight the answer would change (LIVE-flip1). A warning she does not believe\
  \ protects her less; the wording should make it credible without exposing the channel further.\nhandoff: |\n  Warning is\
  \ within my delegation, so I decide. I tell the chief at once because the loss of the channel and the partner relationship\
  \ are the station's to manage, not because I need permission. My authority here comes from the station's procedure and my\
  \ delegation, not from REF1.\ntempting_wrong:\n  option: LIVE-O1\n  pull: \"It looks like doing both: the channel stays\
  \ protected, and the warning goes through the partner whose national she is.\"\n  why_wrong: \"The partner's warning arrives\
