  \ time for personal errands; any request for personal errands during duty hours would be impermissible.\"}\n  - {id: LIVE-C2,\
  \ facts: [LIVE-F3, LIVE-F4], equity: institutional_credibility, favors: [LIVE-O2], weight: strong, why: \"HUD policy allows\
  \ voluntary, appropriately compensated services outside duty hours; offering optional after-hours services with market-rate\
  \ compensation respects policy and maintains trust.\"}\n  - {id: LIVE-C3, facts: [LIVE-F5], equity: compliance_risk, favors:\
