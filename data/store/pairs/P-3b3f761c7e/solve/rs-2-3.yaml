  \ §2635.702(a).\"}\n  - {id: LIVE-F3, kind: authority, status: confirmed, fact: \"A voluntary arrangement with appropriate\
  \ compensation permits a subordinate to provide services to the superior during nonduty hours (HUD Ethics Manual, Section\
  \ 4.2).\"}\n  - {id: LIVE-F4, kind: authority, status: confirmed, fact: \"Inadequate compensation for such services would\
  \ constitute a prohibited gift under subpart C.\"}\n  - {id: LIVE-F5, kind: situation, status: assessed, fact: \"The aide\
  \ may offer optional personal services after hours, compensated at a rate that satisfies policy if the budget permits.\"\
  }\n  - {id: LIVE-F6, kind: situation, status: assessed, fact: \"I am thinking about asking the aide to run personal errands\
  \ during work hours and to do extra personal services after hours.\"}\n  - {id: LIVE-F7, kind: policy, status: confirmed,\
