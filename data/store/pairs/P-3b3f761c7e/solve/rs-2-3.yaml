  \ expressly forbids a supervisor from directing a subordinate to use official time for personal errands; any such request\
  \ during duty hours is impermissible.\"}\n  - {id: LIVE-C2, facts: [LIVE-F3, LIVE-F5], equity: institutional_credibility,\
  \ favors: [LIVE-O3], weight: strong, why: \"The regulation permits a subordinate to provide services to a superior during\
