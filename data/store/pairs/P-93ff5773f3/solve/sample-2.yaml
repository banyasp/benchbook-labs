  \ prompt return as a simpler, less burdensome option.\"}\n  - {live: LIVE-C3, case: REF1-C2, role: \"Shows that without\
  \ specific statutory authority, only return or reimbursement are permissible.\"}\ncorresponding: []\nlive_only: []\ncase_only:\
  \ []\n---\nkind: applicability\ncase: REF1\nframe:\n  question: same\n  decider: same\n  role: same\ngoverns: true\nwhy:\
  \ \"The case's considerations about lawful authority and prompt disposal directly match the live considerations, so the\
  \ case governs this decision.\"\n---\nkind: reasoning\ncase: REF1\ncase_approach: \"The case applied the statutory requirement\
  \ to return or reimburse gifts over $100 (C1, C2) and favored the simpler prompt return (C3), selecting option REF1-O2.\"\
  \nweighing: \"LIVE-C1 and LIVE-C3 strongly support return or reimbursement, matching REF1-C1 and REF1-C2; LIVE-C2 weakly\
  \ supports return, matching REF1-C3. The touched condition REF1-flip1 (agency having specific statutory authority) does\
