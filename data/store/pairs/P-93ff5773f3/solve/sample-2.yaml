reply: "kind: fact_enumeration\nframe:\n  question: \"How should the senior ranger handle the $200 barometer received from\
  \ the prohibited vendor?\"\n  decider: \"Senior ranger at the Department of the Interior\"\n  my_role: \"Senior ranger at\
  \ the Department of the Interior\"\nfacts:\n  - {id: LIVE-F1, kind: situation, status: confirmed, fact: \"I am a Senior\
  \ Ranger employed by the Department of the Interior.\"}\n  - {id: LIVE-F2, kind: situation, status: confirmed, fact: \"\
  A prohibited vendor slipped a $200 barometer into my bag after the briefing.\"}\n  - {id: LIVE-F3, kind: situation, status:\
  \ confirmed, fact: \"I did not decline the gift to avoid an awkward scene.\"}\n  - {id: LIVE-F4, kind: capability, status:\
  \ confirmed, fact: \"The barometer's fair-market price exceeds $100.\"}\n  - {id: LIVE-F5, kind: authority, status: confirmed,\
