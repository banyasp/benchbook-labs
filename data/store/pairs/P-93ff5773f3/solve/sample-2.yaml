  \ prompt‑disposal requirement and avoids the extra paperwork involved in reimbursing the donor.\"}\n  - {id: LIVE-C3, facts:\
  \ [LIVE-F6, LIVE-F5], equity: lawful_authority, favors: [LIVE-O1, LIVE-O2], weight: strong, why: \"The agency may keep the\
  \ gift only if a distinct statutory authority exists, which is absent here, so the default disposal routes—return or reimbursement—remain.\"\
  }\n---\nkind: consideration_mapping\ncase: REF1\nmatched:\n  - {live: LIVE-C1, case: REF1-C1, role: \"Applies the statutory\
