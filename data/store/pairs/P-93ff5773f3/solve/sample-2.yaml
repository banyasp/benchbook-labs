  \ REF1-F7}\ncorresponding: []\nlive_only: []\ncase_only: []\n---\nkind: consideration_enumeration\nconsiderations:\n  -\
  \ {id: LIVE-C1, facts: [LIVE-F2, LIVE-F4, LIVE-F5], equity: lawful_authority, favors: [LIVE-O1, LIVE-O2], weight: strong,\
  \ why: \"Section 2635.206(a)(1) explicitly requires that any tangible gift whose market value exceeds $100 be either returned\
  \ to the donor or the donor reimbursed; destruction is barred.\"}\n  - {id: LIVE-C2, facts: [LIVE-F3, LIVE-F7], equity:\
