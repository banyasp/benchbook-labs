  \    fact: \"All DWI probation conditions were met, including use of an ignition‑interlock, alcohol‑education classes, community\
  \ service, and continued supervision.\"\n  - id: LIVE-F6\n    kind: capability\n    status: confirmed\n    fact: \"The Individual\
