  \ finished DWI education course, satisfied community-service hours. Certificate signed today at 10:45 AM.\"}\n  - {id: LIVE-F5,\
  \ kind: capability, status: confirmed, fact: \"Six consecutive PEth test samples from October 2025 to March 2026 were negative,\
