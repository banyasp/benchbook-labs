  \ may not take up a collection for a gift to an official superior on the occasion of the superior’s swearing‑in or promotion.\"\
  }\n  - {id: LIVE-F4, kind: authority, status: confirmed, fact: \"The same example permits a collection for refreshments\
  \ that will be shared by all members of the immediate office.\"}\n  - {id: LIVE-F5, kind: situation, status: assessed, fact:\
