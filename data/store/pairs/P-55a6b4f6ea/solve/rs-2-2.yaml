  Advise that subordinates seek clarification from the Agency Ethics Officer before initiating any collection.\"\n  LIVE-O3:\
  \ \"Advise that subordinates may not collect contributions for a gift to the superior, but they may collect for shared refreshments.\"\
  \n---\nkind: fact_mapping\ncase: REF1\nframe:\n  question: same_kind\n  decider: same_kind\n  role: same\nnote: \"Both situations\
  \ involve subordinates wanting to collect for a gift to their official superior on a swearing‑in or promotion. REF1’s facts\
  \ include Example 3 explicitly barring gift collections on such occasions; LIVE also sees Example 3 barring gift collections.\
  \ However, REF1 does not have a prior similar promotion reference (LIVE‑F5). The case options are REF1-O1 (allow gift),\
  \ REF1-O2 (seek clarification), REF1-O3 (prohibit gift). LIVE options are O1, O2, O3 (where O3 prohibits gift but allows\
  \ refreshments).\"\noptions: {LIVE-O1: REF1-O1, LIVE-O2: REF1-O2, LIVE-O3: REF1-O3}\nmatched:\n  - {live: LIVE-F2, case:\
