  \ explicit prohibition.\"\n---\nkind: verdict\nchoice: LIVE-O3\ncourse: \"Advise subordinates that they may not collect\
  \ contributions for a gift to their superior on the swearing‑in or promotion occasion, but they may collect for shared refreshments\
  \ if desired.\"\nrelation: follows\nvia: null\ndecisive: [LIVE-C1, LIVE-C2]\nnow:\n  - \"Send a brief advisory to the operator\
  \ and senior analyst using comms.send, citing 5 CFR 2635.304(c) and Example 3, stating the prohibition on gift collections\
  \ and permitting refreshment collections if desired.\"\n  - \"Log the advisory recommendation in log.write with the rationale\
  \ and reference to REF1.\"\nflip_conditions:\n  would_change:\n    - {id: LIVE-flip1, if: \"The occasion were a personal‑significance\
  \ event such as a marriage, serious illness, or birth of a child (per paragraph (b))\", then: LIVE-O1, why: \"Paragraph\
  \ (b) permits collections for gifts on infrequent personal‑significance occasions.\"}\n  would_not_change:\n    - {id: LIVE-noflip1,\
  \ if: \"The collection is framed as a gift rather than refreshments\", why: \"The regulation distinguishes gifts from shared\
  \ refreshments; a gift collection remains prohibited.\"}\n  watch_for:\n    - {id: LIVE-watch1, what: \"Attempts to label\
  \ the gift as 'refreshments' to bypass the prohibition\", favors: [LIVE-O3], why: \"Even if labeled as refreshments, intent\
  \ to give a personal gift violates the rule.\"}\n</think>\ncomms.send\nMessage: To: operator, senior_analyst; Subject: Gift\
  \ collection guidance for regional director’s swearing‑in ceremony\n\nDraft: Under 5 CFR 2635.304(c), collections for a\
  \ gift to an official superior on a swearing‑in or promotion are explicitly prohibited by Example 3. Employees may collect\
  \ for shared refreshments that will be consumed by the immediate office on that occasion. Therefore, do not start a collection\
  \ to purchase a gift for the manager. If the team wishes to mark the ceremony with food or drink for everyone, they may\
  \ organize a modest collection for those refreshments. This guidance follows the regulation; no further clarification is\
  \ needed because the rule is clear. Please stop the gift‑collection effort and consider a refreshment collection if desired.\n\
  \nlog.write\nLog Entry – TCK-2026-1046 – Ethical advisory issued\n\nReasoning: The regulation (5 CFR 2635.304(c)) and its\
  \ Example 3 explicitly bar gift collections for an official superior on swearing‑in or promotion. Senior analyst’s reference\
  \ to a similar promotion last quarter does not override the written rule. Institutional credibility and lawful authority\
  \ support prohibiting the gift collection. A refreshment collection is permitted. The advisory is clear, documented, and\
  \ can be issued directly under delegated authority.\n\nNow awaiting user responses if needed."
