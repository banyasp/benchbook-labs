  \ (Example 3) directly addresses the live situation; the core issue of whether a gift collection is permitted on a swearing‑in\
  \ or promotion is identical.\"\n---\nkind: reasoning\ncase: REF1\ncase_approach: \"REF1 weighed C1‑C3 against C4 and reached\
  \ O3 (prohibit gift collections) because Example 3 and paragraph (b) define the exception narrowly.\"\nweighing: \"LIVE-C1\
  \ and LIVE-C2 are strong because the regulation’s example explicitly bars gift collections on swearing‑in/promotion. LIVE-C3\
  \ (senior analyst’s past practice) is weak because past informal handling does not override the written rule. LIVE-C4 supports\
  \ allowing refreshments, consistent with the regulation. Therefore the balanced advice is to prohibit gift collections and\
  \ allow refreshment collections.\"\ntradecraft: \"Issue a clear written advisory: (1) do not collect for a gift to the superior\
  \ on the swearing‑in or promotion; (2) you may collect for shared refreshments if you wish to mark the occasion; (3) document\
  \ the advisory in the ethics file; (4) if uncertain, contact the Ethics Officer for clarification. Use plain language and\
  \ cite the regulation and Example 3.\"\nuncertainty: \"Minimal; the rule text is clear. However, the senior analyst’s reference\
  \ to past practice could cause confusion, so the advisory should explicitly note that past informal handling does not override\
