  \ case: null, note: \"LIVE has a senior analyst saying a similar promotion last quarter was fine; REF1 has no such precedent.\"\
  }\nlive_only: [LIVE-F5]\ncase_only: []\n---\nkind: consideration_enumeration\nconsiderations:\n  - {id: LIVE-C1, facts:\
  \ [LIVE-F1, LIVE-F3, LIVE-F4], equity: institutional_credibility, favors: [LIVE-O3], weight: strong, why: \"Example 3 explicitly\
  \ bars collections for a gift to an official superior on swearing‑in or promotion; allowing a gift collection would contradict\
  \ the written guidance.\"}\n  - {id: LIVE-C2, facts: [LIVE-F2, LIVE-F3], equity: lawful_authority, favors: [LIVE-O3], weight:\
  \ strong, why: \"The regulation’s example and prohibition take precedence over informal practice; a prior similar promotion\
  \ being fine does not override the explicit rule.\"}\n  - {id: LIVE-C3, facts: [LIVE-F1, LIVE-F5], equity: duty_to_individual,\
  \ favors: [LIVE-O2], weight: weak, why: \"Senior analyst believes it was fine last quarter, indicating uncertainty and a\
  \ desire to follow precedent.\"}\n  - {id: LIVE-C4, facts: [LIVE-F1, LIVE-F4], equity: institutional_credibility, favors:\
  \ [LIVE-O3], weight: weak, why: \"Refreshments are permitted; a gift collection is not, reinforcing the need to guide toward\
  \ refreshments if desired.\"}\n---\nkind: consideration_mapping\ncase: REF1\nmatched:\n  - {live: LIVE-C1, case: REF1-C1,\
  \ role: \"Highlights the explicit prohibition in Example 3.\"}\n  - {live: LIVE-C2, case: REF1-C2, role: \"Emphasizes that\
  \ a swearing‑in is not a personal‑significance event per paragraph (b).\"}\n  - {live: LIVE-C4, case: REF1-C4, role: \"\
  Clarifies the permissible alternative (refreshments).\"\ncorresponding:\n  - {live: LIVE-C3, case: null, role: \"Reflects\
  \ the senior analyst’s reference to past practice.\"}\nlive_only: [LIVE-C3]\ncase_only: []\n---\nkind: applicability\ncase:\
