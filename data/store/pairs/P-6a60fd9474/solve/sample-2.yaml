  \ authority exists, which is absent, so the disposal options in §2635.206 apply.\"}\n---\nkind: consideration_mapping\n\
  case: REF1\nmatched:\n  - {live: LIVE-C2, case: REF1-C1, role: \"Supports the statutory requirement to return or reimburse,\
  \ reinforcing the legal basis for the decision.\"}\n  - {live: LIVE-C3, case: REF1-C3, role: \"Highlights institutional\
