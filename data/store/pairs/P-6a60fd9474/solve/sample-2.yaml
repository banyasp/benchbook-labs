  }\n  - {id: LIVE-C2, facts: [LIVE-F3, LIVE-F5, LIVE-F6], equity: lawful_authority, favors: [LIVE-O1, LIVE-O2], weight: strong,\
  \ why: \"Section 2635.206(a)(1) obliges me to either return the barometer or reimburse its $200 market value; because the\
  \ item exceeds $100, destruction is prohibited.\"}\n  - {id: LIVE-C3, facts: [LIVE-F4, LIVE-F8], equity: institutional_credibility,\
  \ favors: [LIVE-O2], weight: weak, why: \"Prompt return fulfills the regulation's emphasis on swift disposal and avoids\
  \ the administrative effort of reimbursing the donor.\"}\n  - {id: LIVE-C4, facts: [LIVE-F7, LIVE-F6], equity: lawful_authority,\
