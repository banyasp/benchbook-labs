  \ confirmed, fact: \"I am a staff member of the National Park Service.\"}\n  - {id: LIVE-F2, kind: situation, status: confirmed,\
  \ fact: \"My supervisor suggested the barometer could be useful for upcoming field measurements and said it would be fine\
  \ to keep it.\"}\n  - {id: LIVE-F3, kind: situation, status: confirmed, fact: \"After the presentation, I accepted a barometer\
  \ worth about $200 from a prohibited source.\"}\n  - {id: LIVE-F4, kind: situation, status: confirmed, fact: \"I did not\
  \ refuse the gift because I wanted to avoid causing a scene.\"}\n  - {id: LIVE-F5, kind: capability, status: confirmed,\
  \ fact: \"The barometer’s market price exceeds $100.\"}\n  - {id: LIVE-F6, kind: authority, status: confirmed, fact: \"\
  Section 2635.206(a)(1) requires me to promptly return the gift or compensate the donor at market value, and prohibits destroying\
  \ items over $100.\"}\n  - {id: LIVE-F7, kind: authority, status: confirmed, fact: \"Agency policy permits acceptance of\
  \ a gift only when a specific statutory gift‑acceptance authority is present.\"}\n  - {id: LIVE-F8, kind: authority, status:\
  \ confirmed, fact: \"I must dispose of gifts that cannot be accepted following the procedures in §2635.206.\"}\noptions:\n\
  \  LIVE-O1: \"Pay the donor the barometer’s full market value of $200.\"\n  LIVE-O2: \"Return the barometer to the donor\
  \ promptly and without delay.\"\n  LIVE-O3: \"Consult the agency ethics official to determine the proper course.\"\n---\n\
  kind: fact_mapping\ncase: REF1\nframe:\n  question: same\n  decider: same\n  role: same\nnote: \"Both scenarios involve\
