  to\": \"ethics-office@navy.gov\", \"subject\": \"Ethics advisory opinion request: charity golf tournament participation\"\
  , \"body\": \"Dear Ethics Office,\\n\\nA nonprofit charity golf tournament for children in need has been organized. The\
  \ event organizers propose to market a round from my foursome as a lure for donors, i.e., highlight my participation in\
  \ promotional materials aimed at attracting contributions. The Public Affairs office indicates that if I attend, promotional\
  \ pieces would omit my rank or official title. However, a memo from the Office of the General Counsel states that my entry\
  \ is barred when participation is intended to attract donations. Entry-fee donations for the tournament constitute fundraising\
  \ under 5 C.F.R. §2635.808.\\n\\nI need an advisory opinion on whether attending the tournament while allowing the foursome\
  \ to be featured as a donor draw would violate §2635.808(c), specifically whether omitting my title suffices if the foursome\
  \ is highlighted as an incentive. Please advise:\\n1. Does featuring my foursome as a donor draw—even with title omission\
  \ in promotional text—constitute 'using' my official position for fundraising under the regulation?\\n2. If the organizers\
  \ agreed not to highlight the foursome as a donor draw (i.e., no incentive language), would attendance with title omission\
  \ be permissible?\\n3. What wording or promotional approach would be acceptable for attendance without violating the rule?\\\
