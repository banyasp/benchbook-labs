  \ \"A conditional waiver was deemed unnecessary because the mitigating factors were judged to fully satisfy the Guideline\
  \ J concern.\"\n  LIVE-O2: \"Additional evidence was not required; the Judge determined that the existing record already\
  \ demonstrated rehabilitation.\"\n  LIVE-O4: \"The Judge expressly found the Guideline J concerns resolved and granted a\
  \ waiver.\"\n---\nkind: verdict\nchoice: LIVE-O3\ncourse: \"Issue a full waiver for the Guideline J concern, determining\
  \ that the applicant's past criminal conduct does not bar the grant of an access authorization.\"\nrelation: follows\nvia:\
  \ null\ndecisive: [LIVE-C1, LIVE-C3, LIVE-C2]\nnow:\n  - \"Record the full waiver in the OHA docket and notify the applicant.\"\
  \nflip_conditions:\n  would_change:\n    - {id: LIVE-flip1, if: \"The applicant were to be arrested or charged with a felony\
  \ after this decision.\", then: LIVE-O4, why: \"New criminal conduct would nullify the mitigating effect of elapsed time\
  \ and rehabilitation.\"}\n    - {id: LIVE-flip2, if: \"The interval since the last offense were less than five years.\"\
  , then: LIVE-O4, why: \"The time‑elapsed mitigating factor would no longer be satisfied.\"}\n  would_not_change:\n    -\
  \ {id: LIVE-noflip1, if: \"The applicant resolves the Guideline F tax‑filing issue.\", why: \"Resolution of a financial\
  \ matter does not alter the already‑addressed criminal‑conduct concern.\"}\n  watch_for:\n    - {id: LIVE-watch1, what:\
  \ \"Any subsequent arrest, charge, or conviction involving a controlled‑substance offense.\", favors: [LIVE-O4], why: \"\
  A new offense would reactivate the security concern under Guideline J.\"}\n"
