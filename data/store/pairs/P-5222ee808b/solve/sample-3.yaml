  \ permitting a conditional waiver.\"}\n    - {id: LIVE-flip2, if: \"All delinquent filings are shown to have occurred more\
  \ than ten years ago and the applicant demonstrates an uninterrupted period of compliance since then.\", then: LIVE-O4,\
  \ why: \"Mitigating factor (a) would be satisfied, allowing a waiver.\"}\n  would_not_change:\n    - {id: LIVE-noflip1,\
  \ if: \"The applicant continues to refuse any tax-history documentation.\", why: \"The Guideline F issue remains unmitigated,\
  \ so denial persists.\"}\n  watch_for:\n    - {id: LIVE-watch1, what: \"Any future submission of an IRS‑approved tax‑compliance\
  \ plan before the record is formally reopened.\", favors: [LIVE-O4], why: \"Such evidence would satisfy mitigating factor\
  \ (g).\"}\n"
