  \ fails.\"}\n  - {live: LIVE-C3, case: REF1-C2, role: \"Demonstrates lack of an arrangement with the tax authority, leaving\
  \ the Guideline F concern unmitigated.\"}\n  - {live: LIVE-C4, case: REF1-C4, role: \"Points to the broader policy that\
  \ any filing failure raises a security concern, albeit with weaker weight.\"}\ncorresponding: []\nlive_only: []\ncase_only:\
