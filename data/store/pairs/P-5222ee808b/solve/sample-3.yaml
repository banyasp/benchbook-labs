  \ be considered, leaving me without proof of recent compliance.\"}\n  - {id: LIVE-C2, facts: [LIVE-F4], equity: institutional_credibility,\
  \ favors: [LIVE-O1], weight: strong, why: \"I concluded that mitigating factor (a) is unsatisfied because the applicant's\
  \ tax‑filing failures persisted over several years, making the conduct neither remote nor unlikely to recur.\"}\n  - {id:\
  \ LIVE-C3, facts: [LIVE-F5], equity: lawful_authority, favors: [LIVE-O1], weight: strong, why: \"Mitigating factor (g) requires\
  \ a formal arrangement with the tax agency; the record shows none, so the Guideline F issue stays unmitigated.\"}\n  - {id:\
  \ LIVE-C4, facts: [LIVE-F6], equity: due_process, favors: [LIVE-O1], weight: weak, why: \"Guideline F treats any failure\
  \ to file federal or state returns as a security concern; the applicant's admission of multiple years of non‑filing suggests\
