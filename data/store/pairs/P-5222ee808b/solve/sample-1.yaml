  \ continues to refuse any tax-history documentation.\", why: \"The Guideline F issue remains unmitigated, so denial persists.\"\
  }\n  watch_for:\n    - {id: LIVE-watch1, what: \"Any future submission of an IRS-approved tax-compliance plan before the\
