  \ a disallowed provider of gifts.\"}\n  - {id: LIVE-F5, kind: situation, status: confirmed, fact: \"The accountant's invitation\
  \ to the FDIC staff member appears to stem from personal friendship rather than any official capacity.\"}\n  - {id: LIVE-F6,\
