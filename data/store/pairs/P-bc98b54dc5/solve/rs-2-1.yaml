  \ Judge,\n\n  The Merit Systems Protection Board employee has requested to use the agency photocopier to reproduce fundraising\
  \ literature for their child's private school nonprofit event.\n\n  Under 5 C.F.R. §2635.704, government property may not\
  \ be used for personal purposes. Fundraising literature reproduction for a private‑school nonprofit qualifies as personal\
  \ fundraising that involves use of agency property. Additionally, §2635.808(c) prohibits employees from using official title,\
