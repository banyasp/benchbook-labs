  \ federal regulation. Regulatory Example 2 in §2635.808(c) explicitly calls out using an agency photocopier for fundraising\
  \ literature as prohibited.\n\n  The employee is a career analyst with five years of service; the request remains pending\
  \ review. No facts indicate the employee is soliciting subordinates or leveraging official authority beyond routine request\
  \ use.\n\n  Accordingly, the Board must prohibit the use of the agency photocopier for producing the fundraising brochures.\
  \ The employee may use personal or commercial printing services, or seek a formal agency waiver if the Board wishes to authorize\
  \ copier use for future fundraising events under written policy.\n\n  Draft recommendation: Deny the request.\n\n  Sincerely,\n\
