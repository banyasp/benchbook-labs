  \ Draft – Case 2026‑MSPB‑018\n\n  Facts:\n  - An employee of the Merit Systems Protection Board requests to use the agency\
  \ photocopier to reproduce fundraising literature for their child's private school, a nonprofit organization.\n  - The request\
  \ is still pending review; no justification document has been provided yet.\n  - 5 C.F.R. §2635.704 prohibits the use of\
  \ government property for personal purposes.\n  - 5 C.F.R. §2635.808(c) bars employees from using official title, position,\
  \ or authority for personal fundraising, and Example 2 to paragraph (c) explicitly states that using an agency photocopier\
  \ for fundraising literature is prohibited.\n  - Internal equipment usage guidance allows personal charitable printing up\
  \ to a $20 monthly aggregate expense limit, with excess requiring prior approval.\n\n  Analysis:\n  The regulation language\
  \ is clear and directly addresses the employee’s conduct. Example 2 to §2635.808(c) describes exactly the scenario of copying\
  \ fundraising literature on agency equipment, indicating a prohibition. The resource stewardship equity (government property\
  \ not wasted/wasted appropriately) and institutional credibility equity (maintaining trust) both strongly favor prohibiting\
  \ the use of the agency copier for this personal fundraising purpose. While internal guidance permits limited personal printing,\
  \ that guidance does not override the explicit prohibition in the federal regulation. The employee’s request does not involve\
  \ solicitation of subordinates or use of official authority, but the use of agency property itself remains barred. Therefore,\
  \ the default compliant action is to prohibit the use of the agency photocopier for this fundraising literature.\n\n  Decision:\n\
  \  The Administrative Judge should prohibit the employee from using the Board’s photocopier for reproducing the fundraising\
  \ literature. The prohibition is based on 5 C.F.R. §2635.704 (use of government property for personal purposes) and §2635.808(c)\
  \ Example 2 (explicit prohibition of using agency photocopier for fundraising literature). The employee may use personal\
  \ printing equipment or seek a formal policy waiver for future nonprofit fundraising use through the proper approval process.\
  \ The Board should document this decision and offer to assist the employee in locating alternative printing options (e.g.,\
  \ personal device, public library copier, or designated community copier if available).\n\n  Rationale for draft: consistent\
  \ with REF1’s reasoning; no need to request additional justification when regulation is clear; provides clear alternative\
  \ path for compliant fundraising.\n\ncase_id: 2026-MSPB-018\nagent: Adjudicative Support System\noutput_format: draft\n\
