  \ months of the conditional period. After the third month, if compliance criteria are met (see clause 3), the Individual\
  \ may request a review of access level; the security office shall evaluate the request within ten business days.\n3. The\
  \ security office shall conduct a monthly security check‑in with the Individual (in person or via secure video) to verify\
  \ ongoing adherence to treatment and medication, and to assess any concerns related to behavior or stress. The check‑in\
  \ shall be recorded in the security file with the date, nature of discussion, and outcome; no detailed clinical information\
  \ shall be disclosed beyond what is necessary to confirm compliance.\n4. A six‑month review shall be conducted by the Administrative\
  \ Judge at or before the sixth month. The review will consider: (a) documented compliance with clauses 1–2; (b) any reported\
  \ or observed incidents consistent with violent behavior; (c) feedback from the treating clinician and security officer.\
  \ If all compliance criteria are satisfied and no new concerns arise, the Individual’s access shall be restored to full\
  \ authorized levels without further conditions. If compliance is incomplete or concerns persist, the Judge may: (i) extend\
  \ the conditional period for up to an additional three months with continued conditions, or (ii) deny full restoration and\
  \ maintain the restricted access level.\n5. The Individual shall receive a written notice explaining the reason for conditional\
  \ restoration (reference to DOE Guideline I concerns regarding borderline personality disorder and prior violent incidents),\
  \ the specific conditions listed above, the review schedule, their rights to ask questions, and how to report any concerns\
  \ about treatment or security. The notice shall be provided in plain language and retained in the personnel file.\nRationale:\
  \ The DOE Psychologist’s May 2025 report diagnosed borderline personality disorder that impairs judgment, stability, reliability,\
  \ and trustworthiness, and the Individual has a history of violent incidents. Intermittent treatment compliance indicates\
  \ the security concern is not yet mitigated. However, conditional restoration with structured monitoring respects due process,\
