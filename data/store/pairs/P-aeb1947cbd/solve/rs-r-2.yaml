  \ to the donor or reimbursement of market value.\"}\n  - {id: LIVE-F3, kind: authority, status: confirmed, fact: \"The agency\
  \ may accept the gift only when a specific statutory gift-acceptance authority exists; otherwise, the default is return\
  \ or reimbursement.\"}\n  - {id: LIVE-F4, kind: situation, status: assessed, fact: \"The staff member's earlier actions\
  \ (returning the barometer and logging) have already been partially taken; however, the decision point is still pending\
  \ formal handling.\"}\n  - {id: LIVE-F5, kind: authority, status: confirmed, fact: \"The standing orders require the employee\
  \ to either return a prohibited tangible item, reimburse its market value, or seek proper authority before acceptance.\"\
  }\noptions:\n  LIVE-O1: \"Reimburse the donor the $200 market value of the barometer.\"\n  LIVE-O2: \"Return the barometer\
  \ to the donor without delay.\"\n  LIVE-O3: \"Retain the barometer for use by the agency.\"\n  LIVE-O4: \"Seek direction\
  \ from the agency's ethics official before acting.\"\n---\nkind: fact_mapping\ncase: REF1\nframe:\n  question: same_kind\n\
