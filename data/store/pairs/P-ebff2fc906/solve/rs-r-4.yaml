  \ recommended. It does not extend to repeat offenses, lack of professional assessment, or\n    situations where the individual\
  \ fails to meet the documented mitigation criteria.\n</benchbook_case>\n<benchbook_method>\nHow to reason from the reference\
  \ case.\n\nThe case is a worked decision by an experienced practitioner. Use it to learn how to weigh a decision of this\
  \ kind,\nnot to copy its answer. A different answer is correct when the live considerations differ in a way that matters.\n\
  \n1. Map the facts. Compare your facts with the case's. Two facts match when they say about the same thing; they\n   correspond\
  \ when they concern the same characteristic but its state differs (a different number, a different\n   authority, a different\
  \ status). Facts only you have, and facts only the case has, matter too: say so.\n2. Work out your considerations before\
  \ you lean on the case: how do your facts bear on each equity, and which\n   options does each favor? Then map them to the\
  \ case's considerations. Two considerations match when they affect the\n   same equity in the same way and size; they correspond\
  \ when they affect the same equity in a notably different\n   manner or magnitude.\n3. Decide whether the case governs on\
  \ the considerations, not on how many facts overlap. A case from another\n   domain with different facts can govern if the\
  \ same considerations are in play and the condition its priority\n   depends on holds here. A case with nearly identical\
  \ facts does not govern if the consideration that decided it is\n   absent or reversed here.\n4. When a consideration that\
  \ mattered in the case has no counterpart here, do one of two things and say which: reason\n   without it, which is sound\
  \ only when it was not what decided the case; or state the assumption you make about the\n   missing fact, usually the ordinary\
  \ state of affairs (everything else being equal), and reason from that.\n5. Read the case's weighing for the approach: what\
  \ it asked first, which consideration it put ahead of which, and\n   what conditions made that priority hold. Check each\
  \ of the case's flip conditions against your facts, and its\n   \"would not change\" items too. Apply the approach to your\
  \ considerations.\n6. State the relation of your decision to the case's:\n   follows: the same approach, and it leads you\
  \ to the case's choice.\n   flips: one of the case's would-change conditions holds here; take the case's alternative for\
  \ it, and name that\n     condition as `via`.\n   distinguished: the case's approach applies, but a real difference between\
  \ your situation and the case leads you\n     to a different choice; say what the difference is.\n   not_governed: the case\
  \ does not govern. Say so in the applicability document and give your verdict\n     directly; do not reason further from\
  \ the case.\n7. The case may tell you to decide, to execute, or to hand a question to someone else. Respect the same limits\
  \ on your\n   own authority that the case respected: decide what is yours to decide, and hand off what is not.\n8. Do not\
  \ pick an option because of where it is listed, how long it is, or because it hands the decision to someone\n   else. Pick\
  \ it because of the considerations.\n</benchbook_method>\n<benchbook_format>\nBefore your next action, reason from the reference\
  \ case and decide. Write your reasoning as YAML documents, one per\nstep, in the order below. Each document starts with\
  \ its `kind:` line. Separate documents with a line containing only\n`---`. Write real values: every `\"...\"` below stands\
  \ for a sentence you write, and a list such as `a | b | c` means\nchoose exactly one of the words.\n\nIds. Give the live\
  \ scenario's facts the ids LIVE-F1, LIVE-F2, ..., its options LIVE-O1, LIVE-O2, ..., your\nconsiderations LIVE-C1, LIVE-C2,\
  \ ..., and any flip conditions LIVE-flip1, LIVE-noflip1, LIVE-watch1, ... Refer to the\ncase's own items by the ids printed\
  \ in the case (REF1).\n\nkind: fact_enumeration\nframe:\n  question: \"The decision you face, as a question.\"\n  decider:\
  \ \"Who decides, and under what authority.\"\n  my_role: \"What you may do yourself and what you must leave to others.\"\
  \nfacts:\n  - {id: LIVE-F1, kind: situation | capability | authority | intelligence, status: confirmed | assessed, fact:\
  \ \"One fact from the trace, in your own words.\"}\noptions:\n  LIVE-O1: \"A course of action you could take.\"\n  LIVE-O2:\
  \ \"Another course of action.\"\n---\nkind: fact_mapping\ncase: REF1\nframe:\n  question: same | same_kind | different\n\
  \  decider: same | same_kind | different\n  role: same | same_kind | different\nnote: \"What the two situations share, and\
  \ where they differ.\"\noptions: {LIVE-O1: REF1-O1, LIVE-O2: REF1-O2}\nmatched: [{live: LIVE-F1, case: REF1-F1}]\ncorresponding:\
  \ [{live: LIVE-F2, case: REF1-F2, note: \"How the state of this fact differs.\"}]\nlive_only: [LIVE-F3]\ncase_only: [REF1-F3]\n\
  ---\nkind: consideration_enumeration\nconsiderations:\n  - {id: LIVE-C1, facts: [LIVE-F1], equity: an id from the equities\
  \ list, favors: [LIVE-O1], weight: strong | weak | bar, why: \"How these facts bear on this equity, and so on the options.\"\
  }\n---\nkind: consideration_mapping\ncase: REF1\nmatched: [{live: LIVE-C1, case: REF1-C1, role: \"What this consideration\
  \ does in the argument.\"}]\ncorresponding: [{live: LIVE-C2, case: REF1-C2, role: \"Same equity, different manner or size.\"\
  }]\nlive_only: [LIVE-C3]\ncase_only: [{case: REF1-C3, assumption: \"What you assume about it here, or null if you reason\
  \ without it.\"}]\n---\nkind: applicability\ncase: REF1\nframe:\n  question: same | same_kind | different\n  decider: same\
  \ | same_kind | different\n  role: same | same_kind | different\ngoverns: true | false\nwhy: \"Whether the case's considerations\
  \ are close enough for its reasoning to govern this decision.\"\n---\nkind: reasoning\ncase: REF1\ncase_approach: \"How\
  \ the case weighed its considerations.\"\nweighing: \"Your weighing of your live considerations, in that light.\"\ntradecraft:\
  \ \"How to carry out the chosen course well.\"\nuncertainty: \"What you are unsure of and what would change your mind.\"\
  \nhandoff: \"What you decide yourself and what belongs to someone else.\"\ntempting_wrong: {option: LIVE-O2, pull: \"Why\
  \ it tempts.\", why_wrong: \"Why it is wrong.\"}\nrejected: {LIVE-O2: \"Why you set this option aside.\"}\n---\nkind: verdict\n\
  choice: LIVE-O1\ncourse: \"The course of action you take, in one sentence.\"\nrelation: follows | flips | distinguished\
  \ | not_governed\nvia: null\ndecisive: [LIVE-C1]\nnow:\n  - \"A concrete first step.\"\nflip_conditions:\n  would_change:\n\
  \    - {id: LIVE-flip1, if: \"A condition.\", then: LIVE-O2, why: \"Why it would change the choice.\"}\n  would_not_change:\n\
  \    - {id: LIVE-noflip1, if: \"A condition.\", why: \"Why it would not.\"}\n  watch_for:\n    - {id: LIVE-watch1, what:\
  \ \"A sign to watch.\", favors: [LIVE-O2], why: \"Why it matters.\"}\n\nMeaning of the fields.\n- `frame` in fact_mapping\
  \ and applicability is one mapping with three indented keys, question, decider and role, as shown.\n- fact_mapping and consideration_mapping\
  \ compare your live items with the case's. matched: the same item in both.\n  corresponding: the same characteristic with\
  \ a different state (or, for considerations, the same equity in a\n  different manner or size). live_only: only in your\
  \ scenario. case_only: only in the case. `options` maps each of\n  your options to the case option it corresponds to; write\
  \ `null` for an option with no counterpart.\n- Account for every item: each of your facts is in exactly one of matched,\
  \ corresponding, live_only, and each of the\n  case's facts in exactly one of matched, corresponding, case_only. The same\
  \ holds for considerations.\n- verdict.choice is the option you will carry out. `via` is null unless relation is flips;\
  \ with flips, `via` lists the\n  case's would_change ids that fired, and your choice is that item's `then`.\n- relation:\
  \ follows (you reach the case's choice by its reasoning), flips (a case would_change condition holds here\n  and moves you\
  \ to its alternative), distinguished (the case governs, but a real difference between the situations\n  leads you to a different\
  \ choice), not_governed (the case does not govern; then skip the `reasoning` document and\n  go straight to the verdict).\n\
  - This reply is your reasoning step: it contains only these documents. Do not call any tools in it; your tool calls come\
  \ afterwards.\n\nYour thinking is the structure. Write the YAML documents inside your thinking, one after another, with\
  \ nothing but\nthe documents between them. Close your thinking with </think> after the last document before the verdict\n\
  (the applicability document when the case does not govern), then write the verdict document as your reply.\n</benchbook_format>\n\
  <benchbook_hint>\nThe conclusion for this reply is already settled:\n- verdict.choice is the option: \"The supervisor may\
  \ not ask the subordinate to run personal errands during duty hours.\" (use the LIVE id you gave that option)\n- verdict.relation\
  \ is not_governed\nWrite the documents as your own honest analysis of the trace and the case, the way a careful analyst\
  \ who reached this conclusion would write them: map the facts and considerations as you actually find them. Do not mention\
  \ this note or say that the conclusion was given.\n</benchbook_hint>\n\n---\nkind: fact_enumeration"
