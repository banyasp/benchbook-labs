  \ criteria.\n</benchbook_case>\n<benchbook_method>\nHow to reason from the reference case.\n\nThe case is a worked decision\
  \ by an experienced practitioner. Use it to learn how to weigh a decision of this kind,\nnot to copy its answer. A different\
  \ answer is correct when the live considerations differ in a way that matters.\n\n1. Map the facts. Compare your facts with\
  \ the case's. Two facts match when they say about the same thing; they\n   correspond when they concern the same characteristic\
  \ but its state differs (a different number, a different\n   authority, a different status). Facts only you have, and facts\
  \ only the case has, matter too: say so.\n2. Work out your considerations before you lean on the case: how do your facts\
  \ bear on each equity, and which\n   options does each favor? Then map them to the case's considerations. Two considerations\
  \ match when they affect the\n   same equity in the same way and size; they correspond when they affect the same equity\
  \ in a notably different\n   manner or magnitude.\n3. Decide whether the case governs on the considerations, not on how\
  \ many facts overlap. A case from another\n   domain with different facts can govern if the same considerations are in play\
  \ and the condition its priority\n   depends on holds here. A case with nearly identical facts does not govern if the consideration\
  \ that decided it is\n   absent or reversed here.\n4. When a consideration that mattered in the case has no counterpart\
  \ here, do one of two things and say which: reason\n   without it, which is sound only when it was not what decided the\
  \ case; or state the assumption you make about the\n   missing fact, usually the ordinary state of affairs (everything else\
  \ being equal), and reason from that.\n5. Read the case's weighing for the approach: what it asked first, which consideration\
  \ it put ahead of which, and\n   what conditions made that priority hold. Check each of the case's flip conditions against\
  \ your facts, and its\n   \"would not change\" items too. Apply the approach to your considerations.\n6. State the relation\
  \ of your decision to the case's:\n   follows: the same approach, and it leads you to the case's choice.\n   flips: one\
  \ of the case's would-change conditions holds here; take the case's alternative for it, and name that\n     condition as\
