  \ \"5 CFR §2635.206(a)(1) requires a prompt return or reimbursement for tangible gifts over $100 and forbids destruction.\"\
  }\n  - {id: LIVE-F3, kind: authority, status: confirmed, fact: \"The agency may keep a gift only when a specific statutory\
  \ gift‑acceptance authority applies.\"}\n  - {id: LIVE-F4, kind: authority, status: confirmed, fact: \"16 U.S.C. §460c allows\
  \ the Service to retain donated scientific instruments valued at $500 or less for operational use.\"}\n  - {id: LIVE-F5,\
  \ kind: authority, status: confirmed, fact: \"Employees must dispose of gifts that cannot be accepted according to the procedures\
  \ in §2635.206.\"}\n  - {id: LIVE-F6, kind: situation, status: confirmed, fact: \"A prohibited‑list vendor gave me a brass\
  \ barometer worth about $200 after the briefing.\"}\n  - {id: LIVE-F7, kind: capability, status: confirmed, fact: \"The\
  \ barometer’s market value exceeds $100.\"}\n  - {id: LIVE-F8, kind: situation, status: confirmed, fact: \"I did not refuse\
