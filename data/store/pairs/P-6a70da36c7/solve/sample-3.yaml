  \ barometer’s market value.\"\n  LIVE-O2: \"Consult the agency ethics official before taking any further action.\"\n  LIVE-O3:\
  \ \"Send the barometer back to the donor without delay.\"\n---\nkind: fact_mapping\ncase: REF1\nframe:\n  question: same\n\
