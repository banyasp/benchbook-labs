  \ rule. Declining the offer upholds institutional credibility and due process.\"\ntradecraft: \"I will log a compliance\
  \ note, send a secure message to the Office of General Counsel confirming the policy application and my decision to decline,\
  \ and confirm receipt to the author. No further action needed.\"\nuncertainty: \"Uncertainty only arises if the manuscript's\
