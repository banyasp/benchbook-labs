  \ strong, why: \"Accepting compensation for writing that relates to official duties would violate the SEC Ethics Manual\
  \ and undermine public trust in the agency's integrity.\"}\n  - {id: LIVE-C2, facts: [LIVE-F4, LIVE-F5], equity: due_process,\
  \ favors: [LIVE-O2], weight: strong, why: \"The policy clearly prohibits compensation for writing that relates to official\
  \ duties; following the rule fairly and consistently respects due process for all employees.\"}\n  - {id: LIVE-C3, facts:\
