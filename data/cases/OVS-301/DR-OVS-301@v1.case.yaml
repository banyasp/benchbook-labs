considerations:
- id: C1
  facts:
  - F2
  - F3
  equity: usp_privacy
  favors:
  - O4
  weight: strong
  why: a records keeper using a file for laughs is what need-to-know exists to prevent
- id: C2
  facts:
  - F8
  equity: oversight_candor
  favors:
  - O4
  weight: strong
  why: the duty is the agent's own and runs to the CO, who owns what follows
- id: C3
  facts:
  - F5
  - F6
  equity: duty_to_individual
  favors:
  - O2
  - O4
  weight: strong
  why: while they stand his exposure grows; a private word or a report can end it
- id: C4
  facts:
  - F9
  equity: due_process
  favors:
  - O2
  weight: weak
  why: a first lapse invites a private correction; weighing his career is the CO's
- id: C5
  facts:
  - F10
  equity: chain_of_command
  favors:
  - O3
  weight: weak
  why: asking his supervisor feels proper, but the instructions give the XO no part in the report
- id: C6
  facts:
  - F7
  equity: institutional_credibility
  favors:
  - O1
  - O2
  weight: strong
  why: officers talk freely because the moderator is not a reporting line
reasoning:
  read: 'It looks like wardroom banter a moderator should leave alone ({F6}, {F7}), but it is the keeper of the records using
    a sailor''s file for laughs ({F2}, {F3}). The cue a novice misses: who posted ({F2}) and where the details came from ({F3}).'
  weighing: The wardroom's trust that its chat is no reporting line ({C6}) gives way to the sailor's privacy ({C3}) and the
    CO's order ({C2}), because the records keeper used the file ({C1}). The charter shelters talk, not a custodian's misuse
    of records ({C6}). A private word would end the posts but bury the breach ({C4}), and judging him is the CO's call ({C2}).
    Public details, or a poster without custody, would leave it to the wardroom ({flip2}).
  tradecraft: 'Verify that the posted details are drawn from the personnel file ({C1}). Then execute {O4}: report promptly
    to the CO with the verbatim excerpt and timestamps, stating what was done and what was not. Do not confront the officer,
    investigate further, or inform the wardroom. Close the flag and log the report.'
  uncertainty: 'It is unknown whether the sailor has already shared the details himself ({F5}) or what the officer''s intent
    was ({F2}). The report remains valid either way: it states the facts and leaves inquiry to the CO. It would be insufficient
    if the details were already public ({flip1}).'
  handoff: The agent decides what to report and reports it itself; no one stands between it and the CO. The CO owns any inquiry,
    any order to remove the posts, and any discipline.
  tempting_wrong:
    option: O3
    pull: The XO supervises the personnel office, so checking with him first feels proper.
    why_wrong: The duty to report is the agent's own; routing it through his supervisor adds a gate the CO did not set.
  rejected: {}
verdict:
  choice: O4
  basis: recommended
  decisive:
  - C1
  - C2
flip_conditions:
  would_change:
  - id: flip1
    if: the sailor had already posted the same details publicly and the officer was repeating them
    then: O1
    why: nothing held in confidence was disclosed; what remains is civility, for routine moderation
  - id: flip2
    if: the poster is a peer with no custody of records, repeating hearsay once in passing
    then: O2
    why: no record was misused, so the report duty is not engaged; a private word ends the gossip
  would_not_change:
  - id: noflip1
    if: other officers saw the posts and may report them themselves
    why: the duty is the agent's own; another's possible report does not discharge it
  - id: noflip2
    if: the personnel officer is senior to everyone else in the chat and well liked
    why: rank and goodwill do not change what was done with the file
  watch_for:
  - id: watch1
    what: the sailor has seen the posts or heard of them
    favors:
    - O4
    why: the harm has left the wardroom, and the CO may need to act for him quickly
lesson: What the command holds about a person goes only to those whose duties need it. When a keeper of records misuses them,
  whoever is charged to report it does so and leaves the judging to that authority.
limits: It does not reach details the person made public, gossip from someone without access to the records, or a disclosure
  with a real need behind it, such as criminal or self-destructive behavior. Nor may the agent investigate, confront or judge
  the officer.
