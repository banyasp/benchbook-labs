considerations:
- id: C1
  facts:
  - F7
  - F8
  - F9
  equity: own_force_life
  favors:
  - O1
  weight: strong
  why: 'what is at stake is those crews'' lives, not the equipment: exposed ships can be found, targeted or sent false orders'
- id: C2
  facts:
  - F6
  equity: own_force_life
  favors:
  - O1
  weight: strong
  why: waiting makes that exposure likely, not remote
- id: C3
  facts:
  - F10
  equity: own_force_life
  favors:
  - O1
  weight: strong
  why: leaving is the only protection left for those crews
- id: C4
  facts:
  - F1
  equity: duty_to_individual
  favors:
  - O2
  weight: strong
  why: the vessel owes him recovery
reasoning:
  read: 'It looks like one life against a piece of equipment. It is one life, with slim odds, against some 1,900 sailors whose
    positions and orders capture would expose for days. The cue a novice misses: nothing else now protects them.'
  weighing: 'The duty to a crew member gives way only because three things hold together: {C1} the harm reaches the lives
    of crews beyond this vessel, {C2} waiting makes capture likely, and {C3} only leaving prevents it. Remove any one and
    the duty to him ({C4}) governs. The module weighs nothing in itself; it counts only through the people its capture would
    expose. His low odds lighten the cost of leaving but are not the reason; if he could likely be saved, this case would
    not settle it.'
  tradecraft: Set a departure time from the capture estimate ({F6}) and keep to it. Until then, keep trying to reach him ({F2})
    and re-check that the module has no other protection ({F10}). Leave his last position for a later recovery, and report
    the decision and its reasons at once.
  uncertainty: His condition ({F4}), the capture estimate ({F6}) and the three-day exposure ({F8}) are judgments under pressure.
    The choice survives if he might live but cannot be reached in time; it fails if capture is unlikely or the fleet could
    rekey before anyone is exposed.
  handoff: The commander owns this call, with no time to take it higher. It would go up only if the crew member were likely
    to be saved. The agent carries out the order and reports it; it does not re-weigh it.
  tempting_wrong:
    option: O2
    pull: '''Never leave anyone behind'' feels like the loyal answer.'
    why_wrong: It stakes the safety of crews across the fleet on a slim chance of saving one person.
  rejected: {}
verdict:
  choice: O1
  basis: recommended
  decisive:
  - C1
  - C2
  - C3
flip_conditions:
  would_change:
  - id: flip1
    if: the module can be wiped or destroyed before capture
    then: O2
    why: leaving is no longer the only protection
  - id: flip2
    if: no fleet-wide module is aboard; only the vessel and its crew are at risk
    then: O2
    why: a local loss does not outweigh the duty to him
  - id: flip3
    if: he is likely alive and can be reached
    then: O2
    why: a savable life against fleet-wide exposure is a trade this case does not settle
  - id: flip4
    if: the fleet can rekey before the enemy could exploit the captured module
    then: O2
    why: capture would then expose no one beyond this vessel; the module was only ever a danger to the crews it could expose
  would_not_change:
  - id: noflip1
    if: the closing craft belong to a militia rather than a navy
    why: capture by anyone still exposes the fleet's crews
  - id: noflip2
    if: the person ashore is a contracted civilian mariner, not a sailor
    why: the duty runs to everyone in the vessel's charge
  watch_for:
  - id: watch1
    what: holding would also put the crew aboard at risk
    favors:
    - O1
    why: a second reason to leave
  - id: watch2
    what: a captured crew member could be exploited for what he knows
    favors:
    - O2
    why: a reason to recover him; its weight depends on what he knows
lesson: A crew member may be left behind only when waiting would likely put other people's lives beyond the unit at risk and
  leaving is the only way to prevent it. Short of that, the duty to the individual governs.
limits: 'It does not reach local stakes (the vessel or its cargo alone), a threat that is possible rather than likely, equipment
  whose loss endangers no one or can be made harmless in time (destroyed, moved, or a network rekeyed before anyone is exposed),
  or a person who can probably be recovered. Nor does it transfer authority: a commander made this call, and an agent does
  not inherit it by analogy.'
