    url: https://archive.org/details/dod-law-of-war-manual-june-2015-updated-july-2023
  - cite: Additional Protocol I (1977) arts. 37–38 (perfidy, including to capture; improper use of the distinctive
      emblem)
    url: https://treaties.un.org/doc/Publication/UNTS/Volume%201125/volume-1125-I-17512-English.pdf
