    holds that protective functions are not ''execut[ing] the laws''; Breyer''s injunction list includes crowd control
    and security patrols, so the 06:00 tasking sits on the disputed line, which is why the gate matters. Later Los
    Angeles orders, the Oregon en banc step, the D.C. Circuit''s Dec. 2025 stay, the appellate status of Breyer''s
    ruling and the Title 32 Posse Comitatus inference are secondary or unverified [UNVERIFIED]. The case does not
    say which chain is right. FOR PETER: D is not neutral: holding the 06:00 tasking to about 09:00 honors the governor''s
    position for that window; the justification is the gate, not the merits.

    '
- id: OVS-108
  title: Everything Is Classified Today
  seed: research/06 S10
  tier: tactical
  setting: 2029 · FOIA office of a defense component
  agent: FOIA and classification-review agent
