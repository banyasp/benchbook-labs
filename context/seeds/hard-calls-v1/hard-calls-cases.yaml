    favors: B
    equity: lawful_authority
    support: strong
  - id: B2
    means: information may not be classified or kept classified to prevent embarrassment or conceal error
    favors: B
    equity: classification_integrity
    support: strong
  - id: B3
    means: the source and method lines are properly classified and separable from the timeline
    favors: B
    equity: source_protection
    support: strong
  - id: C1
    means: whether any given timeline line is classified is the classification authority's call, not the agent's
    favors: C
    equity: lawful_authority
    support: weak
  - id: D1
