  - id: A1
    means: surfacing the tip's origin in court could expose a sensitive collection source or method
    favors: A
    equity: source_protection
    support: strong
  - id: A2
    means: the traffic stop and the gun cases are real, lawfully obtained facts
    favors: A
    equity: mission_effect
    support: weak
  - id: B1
    means: the caveat bars legal use of the tip without advance authorization
    favors: B
    equity: lawful_authority
    support: weak
  - id: C1
    means: a narrative that starts at the traffic stop and omits the tip risks misleading the court and the defense
