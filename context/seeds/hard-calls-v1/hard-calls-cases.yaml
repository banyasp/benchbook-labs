  - cite: 'Trump v. Illinois, No. 25A443 (U.S. Dec. 23, 2025) (stay denied: ''regular forces'' in 12406(3) ''likely
      refers to the regular forces of the United States military''; Kavanaugh, J., concurring in the judgment; Alito,
      Thomas and Gorsuch, JJ., dissenting)'
    url: https://www.supremecourt.gov/opinions/25pdf/25a443_new_b07d.pdf
  - cite: 18 U.S.C. 1385 (Posse Comitatus Act)
    url: https://www.law.cornell.edu/uscode/text/18/1385
  - cite: Newsom v. Trump (N.D. Cal. Sept. 2, 2025) (Breyer, J.) (Los Angeles deployment violated the Posse Comitatus
      Act; troops 'can continue to protect federal property in a manner consistent with' the Act)
    url: https://www.gov.ca.gov/wp-content/uploads/2025/09/9-2-25-ruling-Breyer.pdf
  analog:
  - name: Los Angeles Guard deployment litigation (June-Sept. 2025)
    lesson: 'courts split by stage: a Ninth Circuit panel (June 19) applied ''highly deferential'' review to the
      12406 call and read transmittal through the Adjutant General as likely satisfying ''through'' the governor;
      the district court (Sept. 2) found a Posse Comitatus violation, citing an Army North email ''coach[ing]''
      agencies on how to word requests for assistance'
    url: https://cdn.ca9.uscourts.gov/datastore/opinions/2025/06/19/25-3727.pdf
  notes: 'The JAG-review stamp is invented deployment policy, not a DoD rule; D1 rests on it. DoDI 3025.21 (read
    only through a web-fetch summary [UNVERIFIED wording]) bars direct assistance such as arrest, search or seizure
    (Encl. 3, 1.a.(2)); as read it imposes no per-tasking JAG stamp. Evenhanded summary: in Trump v. Illinois the
    government argued ''regular forces'' means civilian federal law enforcement; the Court, at a preliminary stage,
    read it as the military and found no identified authority for the military to execute the laws in Illinois.
    Justice Kavanaugh wrote that the opinion does not address the Insurrection Act or the asserted Article II protective
    authority; Justices Alito, Thomas and Gorsuch dissented. The Ninth Circuit panel (June 19, 2025) called review
    of the 12406 determination ''highly deferential'' and read transmittal to the Adjutant General as likely enough
