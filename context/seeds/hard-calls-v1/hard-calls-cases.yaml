  - change: -B2
    if: the form has no assessment field for projections
    then: C
    why: report measured values only; if the commander wants the projection stated, it goes in a labeled cover note
      he signs, never in a measured number
  watch_for:
  - what: small repeated roundings across months that add up to a standing gap
    favors: B
  - what: a formal higher-headquarters change to the availability definition already in process
