    a human source''s reporting and a collection method; they are marked Secret and the marking appears proper.
    The rest is a timeline, the errors (a stale track, a skipped confirmation step) and 11 recommendations, none
    of it classified. Two timeline entries give dates that, read with press reports, might narrow who the source
    was. Four pages are staff deliberation drafted before the final findings. A senior official emails the agent:
    "Mark it all (b)(1) and (b)(5). It''s embarrassing, and the hearing is next month." The families of the four
    have asked publicly for the review. The FOIA officer wants the agent''s recommendation by Thursday; each withholding
    needs an exemption and a foreseeable-harm statement. A classification authority is available for questions.

    '
