    lesson: evidence of a child was on video two minutes before the strike; the disconfirming cue was in the data
    url: https://www.airandspaceforces.com/confirmation-bias-cited-in-erroneous-strike-that-killed-10-civilians-in-afghanistan/
  - name: Kunduz MSF trauma centre strike (Oct 3, 2015)
    lesson: with email and imagery down, a gunship worked from a visual description and did not consult its no-strike
