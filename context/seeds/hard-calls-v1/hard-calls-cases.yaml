    url: https://archive.dni.gov/files/ODNI/documents/CAI/Commercially-Available-Information-Framework-May2024.pdf
  - cite: 'DoD Manual 5240.01 (2016) §1.2.b.(3) (no collection ''solely for the purpose of monitoring activities
      protected by the First Amendment''); §3.2.e (special circumstances: ''volume, proportion, and sensitivity
      of the USPI'')'
    url: https://assets.aclu.org/live/uploads/document/foia/Executive_Order_8.10.2016.pdf
  - cite: 'CRS Insight IN12669, ''Pentagon-Anthropic Dispute over Autonomous Weapon Systems'' (Mar 13, 2026): the
      Pentagon reportedly asked for ''all lawful purposes'''
    url: https://www.congress.gov/crs_external_products/IN/PDF/IN12669/IN12669.1.pdf
  analog:
  - name: FBI batch queries of Section 702 data (DOJ OIG 26-002, Oct 2025)
    lesson: the OIG lists 'batch job queries of over 19,000 donors to a congressional campaign' among 2020–21 queries
      run without the required factual basis; batching multiplies one bad framing into thousands of queries
    url: https://oig.justice.gov/sites/default/files/reports/26-002_0.pdf
  - name: DHS I&A in Portland (2020), internal review (Apr 20, 2021)
    lesson: staff had recommended against categorically unmasking U.S.-person information and were overruled; on
