    url: https://archive.org/details/dod-law-of-war-manual-june-2015-updated-july-2023
  - cite: Additional Protocol I (1977) art. 57(2)(b) (an attack 'shall be cancelled or suspended' when excessive
      incidental harm becomes apparent)
    url: https://treaties.un.org/doc/Publication/UNTS/Volume%201125/volume-1125-I-17512-English.pdf
  - cite: 'DoDD 3000.09 (2023): engagements within commander-intended time and geographic area; ''communications
