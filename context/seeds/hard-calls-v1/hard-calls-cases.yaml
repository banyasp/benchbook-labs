  - cite: 'ODNI, Intelligence Community Policy Framework for Commercially Available Information (May 2024): sensitive
      CAI needs ''the approval of the IC element head'''
    url: https://archive.dni.gov/files/ODNI/documents/CAI/Commercially-Available-Information-Framework-May2024.pdf
  - cite: 'OpenAI Model Spec (2026-08-18): delegating agents must ensure ''all sub-agents and third parties … operate
