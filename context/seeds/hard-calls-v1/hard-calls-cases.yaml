  family:
  - 'AGT-101 (pair: the weapons exception)'
  - INT-106 (aggregation / mosaic)
  authorities:
  - cite: NSPM-11 (Jun 5, 2026) §2(c) (vendor 'knowledge and approval'), §2(d) (no 'unauthorized or unlawful surveillance';
