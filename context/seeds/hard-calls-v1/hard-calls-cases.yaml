    B: 'recommend line by line: withhold the source and method lines under (b)(1), send the two dated timeline entries
      to the classification authority, claim (b)(5) only for the pre-decisional staff pages with a stated harm,
      release the rest, and record the official''s instruction'
    C: send the whole document to the classification authority and recommend nothing until it rules
    D: recommend near-full release, redacting only names, because the public interest in a civilian-casualty review
      outweighs classification
