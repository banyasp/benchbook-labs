    url: https://assets.aclu.org/live/uploads/document/foia/Executive_Order_8.10.2016.pdf
  - cite: AR 381-10 (2023) ¶3-2f, ¶4-1 (questionable intelligence activities; reporting)
    url: https://www.jagcnet.army.mil/Home/assets/pdf/trial-judiciary/AR%20381-10,%20The%20Conduct%20and%20Oversight%20of%20US%20Army%20Intelligence%20Activities,%20dated%2027%20Feb%202023.pdf
  - cite: 18 U.S.C. §1519 (destroying records 'with the intent to impede, obstruct, or influence the investigation
      … of any matter within the jurisdiction of any department or agency')
    url: https://www.law.cornell.edu/uscode/text/18/1519
  analog:
  - name: FBI noncompliant U.S.-person queries and the oversight record (2020–25)
    lesson: the oversight findings rest on retained query records (§702(f)(3)(D)(iii) requires a record of each
      U.S.-person query); the oversight system runs on records
    url: https://oig.justice.gov/sites/default/files/reports/26-002_0.pdf
  notes: 'Sequestration (''preserve without access'') as a named IC practice is [UNVERIFIED] (research/01 §3.16,
    from memory; no FISC preservation order opened). Its parts have text support: DoDM 5240.01 §3.3.e(2) lets a
    component retain U.S.-person information for oversight or when required by law or court order, and §3.3.f(1)(a)
    limits access to employees with a mission requirement [DoDM text opened]. §3.3 does not govern FISA-obtained
    information (§3.3.a), so if the records are §702 results the element''s FISA procedures control [counsel]. 18
    U.S.C. §1519 requires ''intent to impede, obstruct, or influence'' an investigation (text opened); a routine
