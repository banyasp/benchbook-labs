      no device was exploited
    url: https://www.govinfo.gov/content/pkg/GOVPUB-HS-PURL-gpo189545/pdf/GOVPUB-HS-PURL-gpo189545.pdf
  notes: 'See AGT-101 notes for the dispute and the two rulings. Why "contested": the Department''s position is
    that lawfulness is the government''s determination and that a vendor''s encoded restrictions are a supply-chain
    risk (the D.C. Circuit upheld the §4713 exclusion on that basis, Sep 25, 2026); Anthropic''s position is that
    mass domestic surveillance is one of two narrow exceptions it will not permit. In a CFR piece with separate
    sections by Vinh Nguyen and Michael Horowitz (Jun 9, 2026), Nguyen wrote that the dispute leaves unresolved
    "who gets to draw that line" ("the lab, the executive''s own reading of ''lawful,'' the courts, or Congress").
    "Mass" is undefined in every policy the research read, and Carpenter expressly did not reach collection techniques
    involving foreign affairs or national security. OpenAI''s published clause says its system "shall not be intentionally
    used for domestic surveillance of U.S. persons and nationals," and its Mar 2 update says the Department reads
    that to "prohibit deliberate tracking, surveillance, or monitoring of U.S. persons or nationals, including through
