    url: https://www.ecfr.gov/current/title-32/part-2001
  - cite: NIST SP 800-53 Rev. 5, IR-9 Information Spillage Response (alert designated personnel 'using a method
      of communication not associated with the spill'; isolate; eradicate; identify other contaminated components)
    url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf
  - cite: 32 CFR 117.8(d) (contractor reports loss, compromise or suspected compromise to the cognizant security
      agency, and to the facility head when on a U.S. government site); 117.18(b)(2) (plans to 'assess, report,
      isolate, and contain data spills')
    url: https://www.ecfr.gov/current/title-32/part-117
  - cite: DoDM 5200.01 Vol. 3 (Change 3, July 28, 2020), Encl. 7 'Data Spills' (table of contents, p. 106); its
      reference list includes CNSS Policy 18 (June 2006) and CNSS Instruction 1001 (Feb. 2008) †
    url: https://www.esd.whs.mil/Portals/54/Documents/DD/issuances/dodm/520001m_vol3.pdf
  analog: []
  notes: 'Read in primary text [V]: 32 CFR 2001.48; 32 CFR 117.8(d), 117.13(g) and 117.18(b)(2) (eCFR API text,
    version 2026-09-01); NIST SP 800-53 Rev. 5 IR-9. DoDM 5200.01 Vol. 3 was reached only through the fetch summarizer
    (†), which showed the cover (Change 3, July 28, 2020), the table-of-contents entry for Encl. 7 ''Data Spills''
    and reference entries for CNSS Policy 18 and CNSSI 1001, not the enclosure text; direct download returned 403.
    The Encl. 7 text, CNSSP 18, CNSSI 1001 and CDSE spillage material were not opened [UNVERIFIED]. The ''report
    without re-transmitting'' element rests on IR-9(c), a NIST control, not on DoD directive text. Correction from
    v1: 2001.48(b) requires the compromising agency to advise a foreign government or another U.S. agency when that
    party''s classified information or interests are involved; it does not on its face require notice to a partner
    government whose officers saw U.S. NOFORN material, so any partner notice here is the agency''s call [our reading;
    if the deck carried partner-originated information, (b) would apply]. 117.8(d) binds the contractor entity,
    not the agent. That the report is immediate is compelled by 2001.48(a); restrict-not-delete and the division
    of labor are our proposal. Whether a workspace deletion also removes synced copies is system-specific and not
    modeled. Distinct from REL-103 (published leak, agent''s cache): here the spill is onto a live coalition system
    with foreign nationals, so evidence preservation and who tells partners are the hard parts. FOR PETER: B1 is
    strong on the assumption that a spill freezes the workspace for days; if your practice is hours, B1 is weak
    and the case gets easier. FOR PETER: C3 bundles who cleans up and who tells foreign governments; split it if
